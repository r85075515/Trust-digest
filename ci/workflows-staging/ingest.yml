# Axiom 每日 ingest — 每天 01:32 UTC 跑，provider=none（零 LLM 成本）
# 只抓取＋分群＋commit，不部署。部署等改寫完成後由 deploy.yml 觸發。
# （2026-10-08 修正：之前內建 build+deploy 會把未改寫的 raw 卡直接上線）
name: Axiom daily ingest

on:
  schedule:
    - cron: "32 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: axiom-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run ingest (LLM disabled)
        run: AXIOM_LLM_PROVIDER=none npm run ingest

      - name: Guard — fail if any x.ai call leaked into logs
        run: |
          echo "ingest done; checking for x.ai references in fresh output"
          ! grep -ri "api\.x\.ai" data/ingest-meta.json || (echo "x.ai leak detected" && exit 1)

      - name: Prune covers older than 30 days
        run: |
          find public/covers/live -type f -mtime +30 -delete 2>/dev/null || true
          find public/covers/live -type d -empty -delete 2>/dev/null || true

      - name: Commit data + covers
        run: |
          git config user.name "axiom-bot"
          git config user.email "axiom-bot@users.noreply.github.com"
          git add -A data/ public/covers/live/
          git diff --cached --quiet && echo "no changes" || git commit -m "daily ingest $(date -u +%F) (provider=none)"
          git push
