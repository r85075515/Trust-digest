atters\nTwo one-star kitchens from opposite ends of Taiwan cooking one menu is a rare pairing, and a three-day run means seats are scarce by design. For diners, the value is in a combination that neither restaurant serves on a normal night.\n\nSources agree–disagree\nOnly one source, Vogue Taiwan, is listed for this card, so the dates and the event details have no second outlet to check them against. No conflicting account appears in the feed.\n\nStill uncertain\nThe feed summary does not give the menu, the price, or how to book, and it does not say whether the three days share one menu or change nightly. The full Vogue Taiwan article is the place to check those details.\n\nTrust label: Single source — one outlet, uncorroborated; details are as reported in that outlet's feed summary."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-beauty-01-kiku-nibbon-3\",\"category\":\"beauty\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"publishedAt\":\"2026-11-11T05:53:58.000Z\",\"title\":{\"en\":\"Michelin-Starred Kiku and Nibbon Reunite for Three-Day 'Two Stars, One Table' Dinner November 19–21\",\"zh-TW\":\"米其林一星掬（Kiku）與 Nibbon 再度聯手，11 月 19 至 21 日推出「雙星再會」四手餐會\"},\"summary\":{\"en\":\"［未證實·單一來源］ Taipei's Kiku and Kaohsiung's Nibbon, both awarded one Michelin star in the 2026 Taiwan Michelin Guide, will reunite for the 'Two Stars, One Table' four-hands dinner from November 19 to 21, Vogue Taiwan reports. The event pairs Japanese and French cuisine over three days. Book early, as the run is limited to three days.\",\"zh-TW\":\"［未證實·單一來源］《Vogue Taiwan》報導，2026 年同獲《臺灣米其林指南》一星的台北掬（Kiku）與高雄 Nibbon，將於 11 月 19 至 21 日再度攜手，推出「雙星再會（Two Stars, One Table）」限定四手餐會。日料與法餐合體共演僅 3 日，有興趣宜及早預訂。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"2026 年雙雙獲得《臺灣米其林指南》一星肯定的台北掬（Kiku）與高雄 Nibbon，將於 11 月 19 至 21 日再度攜手，推出「雙星再會（Two Stars, One Table）」限定四手餐會。《Vogue Taiwan》報導，這場 3 日限定的餐會以食材、風味、技法探索日料與法餐合體共演的美味邊界。\\n\\n發生了什麼事\\n《Vogue Taiwan》報導，台北掬與高雄 Nibbon 兩家 2026 年《臺灣米其林指南》一星餐廳，將於 11 月 19 至 21 日再次攜手，推出「雙星再會」限定四手餐會，以日料與法餐的合體共演為主軸，從食材、風味、技法切入。\\n\\n為什麼重要\\n南北兩家一星餐廳同台出一套菜單，本就少見，又只做 3 日，座位注定搶手。對食客來說，價值在於平常在任一家都吃不到的組合。\\n\\n來源異同\\n本卡只有《Vogue Taiwan》一個來源，日期與活動內容無從交叉驗證，快訊中也沒有相衝突的說法。\\n\\n仍不確定\\n快訊摘要沒給菜單、價格與預訂方式，也沒說 3 日是同一套菜單還是每天更換，須看《Vogue Taiwan》完整報導。\"},\"sources\":[{\"name\":\"Vogue Taiwan\",\"url\":\"https://www.vogue.com.tw/article/kiku-nibbon-2026-四手餐會\"}],\"disagreements\":null,\"trustScore\":47,\"trustBreakdown\":{\"crossCorroboration\":6,\"outletReputation\":10,\"recencyClarity\":25,\"sourceDiversity\":6},\"tags\":[\"beauty\",\"live-ingest\",\"vogue-taiwan\"],\"glossary\":[{\"term\":{\"en\":\"Kiku\",\"zh-TW\":\"掬\"},\"blurb\":{\"en\":\"Taipei Japanese restaurant holding one Michelin star.\",\"zh-TW\":\"台北日本料理餐廳，獲米其林一星。\"}},{\"term\":{\"en\":\"Nibbon\",\"zh-TW\":\"Nibbon\"},\"blurb\":{\"en\":\"Kaohsiung restaurant holding one Michelin star.\",\"zh-TW\":\"高雄餐廳，獲米其林一星。\"}},{\"term\":{\"en\":\"Michelin Guide\",\"zh-TW\":\"米其林指南\"},\"blurb\":{\"en\":\"International restaurant guide awarding stars for dining quality.\",\"zh-TW\":\"國際餐飲指南，以星級評定餐廳水準。\"}},{\"term\":{\"en\":\"Four-hands dinner\",\"zh-TW\":\"四手餐會\"},\"blurb\":{\"en\":\"A meal cooked jointly by two chefs or two restaurant teams.\",\"zh-TW\":\"由兩位主廚或兩個餐廳團隊聯手出菜的餐會。\"}},{\"term\":{\"en\":\"Vogue Taiwan\",\"zh-TW\":\"Vogue Taiwan\"},\"blurb\":{\"en\":\"Taiwan edition of the fashion and lifestyle magazine Vogue.\",\"zh-TW\":\"時尚生活雜誌 Vogue 的台灣版。\"}}],\"imageUrl\":\"/covers/live/live-beauty-01-kiku-nibbon-3.jpg\",\"imageAlt\":{\"en\":\"Taipei restaurant Kiku and Kaohsiung restaurant Nibbon reuniting for a three-day four-hands dinner\",\"zh-TW\":\"台北掬（Kiku）與高雄 Nibbon 再度聯手推出 3 日限定四手餐會\"}}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"chil
