 December 1 auction of its platform and stored private chat histories tied to more than 21 million U.S. accounts, including over 2.1 million registered to minors. Following its October Chapter 11 filing, Character.AI selected newly formed Delaware entity Smirks and Pangs Acquisition LLC as lead bidder on November 14 at 10 million U.S. dollars in cash plus assumed liabilities, with a sale hearing set for December 3 and 4.\n\nThe coalition—led by California Attorney General Rob Bonta, Connecticut Attorney General William Tong, and Colorado Attorney General Phil Weiser—argues that bankruptcy does not suspend federal children's privacy statutes or state consumer-protection laws. According to the filing, the proposed agreement imposes no obligation on the buyer to honor Character.AI's prior privacy policy or user deletion requests and permits unrestricted resale of sensitive IP addresses and conversation logs.\n\nOfficial press releases from the California and Colorado attorneys general, alongside reporting from Quartz and TechCrunch, align on the 42-state coalition, the 21 million account total, the 2.1 million minor accounts, the December 1 auction date, and the 10 million dollar lead bid.\n\nDelaware Bankruptcy Judge Brendan Shannon has not yet ruled on the coalition's objection ahead of next week's scheduled auction and sale hearing.\n\nTrust label: Multi-source agreement — Verified via official state attorney general filings and corroborated by Quartz and TechCrunch."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-ai-187-42-ags-block-character-ai-chat-auction\",\"category\":\"ai\",\"title\":{\"en\":\"42 State Attorneys General Move to Block Character.AI Bankruptcy Auction of 21 Million User Chats\",\"zh-TW\":\"美國 42 州檢察長聯手聲請阻止破產 AI 平台 Character.AI 拍賣 2,100 萬用戶私密對話\"},\"summary\":{\"en\":\"A bipartisan coalition of 42 state attorneys general and D.C. petitioned a Delaware bankruptcy court to block Character.AI's December 1 auction of platform assets and private chat histories from over 21 million U.S. accounts, including 2.1 million minors. The coalition argues the $10 million lead bid violates federal and state privacy laws.\",\"zh-TW\":\"美國 42 州檢察長與華府檢察長組成跨黨派聯盟，向德拉瓦州破產法院聲請駁回已聲請第 11 章破產的 Character.AI 於 12 月 1 日拍賣平台及逾 2,100 萬名美國用戶（含逾 210 萬名未成年人）私密對話紀錄與 IP 位址。檢方指領投方出價 1,000 萬美元卻未承諾遵守隱私政策，涉嫌違反聯邦與各州隱私法規。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」由加州檢察長羅布・邦塔（Rob Bonta）、康乃狄克州檢察長威廉・唐（William Tong）與科羅拉多州檢察長菲爾・魏瑟（Phil Weiser）領銜的 42 州及華盛頓特區檢察長跨黨派聯盟，向德拉瓦州破產法院提出異議，要求阻止已於 10 月聲請第 11 章破產保護的 AI 聊天平台 Character.AI 拍賣用戶資料。Character.AI 擬於 12 月 1 日舉行拍賣並於 12 月 3 日至 4 日召開出售聽證會，選定 11 月 13 日才成立的 Smirks and Pangs Acquisition LLC 為領投方，出價 1,000 萬美元現金並承擔債務，標的涵蓋逾 2,100 萬個美國帳號的私密對話紀錄與 IP 位址。\\n\\n「為什麼重要」檢方指出，涉案帳號中有超過 210 萬個屬於未成年人，而該交易草案並未要求買方遵守 Character.AI 原先承諾「不為金錢對價出售個資」的隱私政策，也未強制履行用戶刪除或退出資料蒐集的請求，甚至允許買方未經法院與用戶通知即轉售數據。各州檢察長強調，企業破產程序不得凌駕聯邦《兒童線上隱私保護法》與各州消費者隱私法規，要求法院否決領投資格及 35 萬美元分手費條款。\\n\\n「來源異同」加州與科羅拉多州檢察長辦公室官方新聞稿，以及 Quartz、TechCrunch 的報導，在 42 州參與規模、2,100 萬總帳號數、210 萬未成年帳號數、領投方名稱與 1,000 萬美元出價等關鍵事實上完全一致。\\n\\n「仍不確定」德拉瓦州破產法院法官布倫丹・夏農（Brendan Shannon）尚未就各州檢察長的異議作出裁定，下週拍賣是否如期舉行或被迫修改隱私保護條款仍有待法院決定。\\n\\nTrust label: Multi-source agreement — 依據加州與科羅拉多州檢察長辦公室官方新聞稿，並獲 Quartz 與 TechCrunch 報導交叉核實。\"},\"glossary\":[{\"term\":{\"en\":\"Chapter 11 Bankruptcy\",\"zh-TW\":\"美國破產法第 11 章\"},\"blurb\":{\"en\":\"A U.S. bankruptcy process allowing a debtor company to reorganize or auction assets under court supervision.\",\"zh-TW\":\"美國聯邦破產法中允許債務人企業在法院監督下進行債務重整或資產拍賣出售的程序。\"}},{\"term\":{\"en\":\"Stalking Horse Bidder\",\"zh-TW\":\"領投競標人（假馬競標人）\"},\"blurb\":{\"en\":\"An initial bidder chosen by a bankrupt firm to set a floor price and baseline terms for a court-supervised asset auction.\",\"zh-TW\":\"破產企業在公開拍賣前先行選定的首家競標者，用以設定最低拍賣底價與交易基準條件。\"}},{\"term\":{\"en\":\"Break-Up Fee\",\"zh-TW\":\"分手費條款\"},\"blurb\":{\"en\":\"Compensation promised to an initial bidder if the seller ultimately accepts a higher competing offer at auction.\",\"zh-TW\":\"在破產拍賣中，若最終由其他出價更高的競標者得標，賣方須支付給原領投方的補償金。\"}}],\"sources\":[{\"name\":\"California Attorney General Official Release\",\"url\":\"https://oag.ca.gov/news/press-releases/attorney-general-bonta-opposes-asset-sale-characterai-amid-child-safety-concerns\"},{\"name\":\"Colorado Attorney General Official Release\",\"url\":\"https://coag.gov/press-releases/weiser-challenges-auction-of-millions-of-private-character-ai-conversations/\"},{\"name\":\"Quartz\",\"url\":\"https://qz.com/character-ai-state-attorneys-general-chat-auction-112726\"},{\"name\":\"TechCrunch\",\"url\":\"https://techcrunch.com/2026/11/25/state-ags-fight-character-ais-plan-to-auction-off-users-private-chats/\"}],\"imageUrl\":\"/covers/live/live-ai-187-42-ags-block-character-ai-chat-auction.jpg\",\"imageAlt\":{\"en\":\"State attorneys general legal filing opposing Character.AI user chat auction\",\"zh-TW\":\"美國 42 州檢察長聯手阻止 Character.AI 拍賣用戶對話紀錄示意\"},\"isHeadline\":true,\"isPopular\":true,\"trustScore\":94,\"trustBreakdown\":{\"crossCorroboration\":24,\"outletReputation\":24,\"recencyClarity\":23,\"sourceDiversity\":23},\"publishedAt\":\"2026-11-27T18:40:35.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":24,\"D2\":24,\"D3\":23,\"D4\":23,\"D5\":23,\"total\":23},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-ai-187-42-ags-block-character-ai-chat-auction/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Mu
