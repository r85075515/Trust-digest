southeast on Friday were Russian Kh-101 cruise missiles — and that debris examination shows they were manufactured in the fourth quarter of 2026 at facilities in Dubna, in Russia's Moscow region. The finding corrects the initial official assessment of two missiles and a jet-powered drone, and it lands two days before NATO's North Atlantic Council meets in Brussels on Monday to discuss the violation of Polish airspace.\n\nWhat happened: The three objects came down early Friday during one of Russia's largest aerial attacks on Ukraine of the war — more than 400 drones and over 110 missiles, by Kyiv's count — the same barrage that struck Kyiv's Dnipro bridges. One Kh-101 crashed in an open area near Nowy Lipowiec, about 50 km from the Ukrainian border, and caught fire; the other two came down near Rudnik nad Sanem and Mołodycz. Nobody was hurt and no structural damage was reported. Polish and allied jets scrambled but did not fire. The impact sites lie near Nowa Dęba, where troops from 11 Coalition of the Willing countries have been exercising since Nov. 9. Prime Minister Donald Tusk said Friday it was \"no coincidence\" the objects landed near the exercise site and called the incursion an intentional provocation; Defence Minister Władysław Kosiniak-Kamysz said Poland would seek additional forces and equipment for NATO's Eastern Sentry air-defence mission. NATO Secretary General Mark Rutte said Saturday the alliance will defend every inch of Polish territory. Russia has made no comment.\n\nWhy it matters: Precision cruise missiles — newly manufactured ones, not stray debris or off-course drones — crossing into NATO territory and landing near an allied exercise is the sharpest airspace violation of the war so far, and Warsaw is framing it as a deliberate test of NATO's response rather than an accident of geography. Monday's North Atlantic Council meeting is the alliance's first formal step; what it decides on eastern air defence will signal how far NATO is willing to go.\n\nSources agree/disagree: Reuters, AFP and Polish officials agree on the prosecutors' identification, the three crash sites, the absence of casualties, and the Monday council meeting. The one factual shift is internal to Poland's own reporting: Friday's initial assessment (two missiles plus a jet-powered drone) was superseded Sunday by the Lublin prosecutors' preliminary debris findings (three Kh-101s). The prosecutors' findings are described as preliminary.\n\nStill uncertain: The debris examination is preliminary and could be refined; Russia has not responded; whether the missiles were aimed at Poland or veered off course remains unproven — Warsaw asserts intent, Moscow has said nothing; and the North Atlantic Council has not yet met, so NATO's concrete response is unknown.\n\nTrust label: Multi-source agreement — wire services and Polish officials concur on the identification and the NATO meeting; the intent behind the incursion is asserted by Warsaw and not independently established, and is labeled as such."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"adult\":false,\"body\":{\"en\":\"$10\",\"zh-TW\":\"發生了什麼事：波蘭檢方週日（22 日）表示，週五（20 日）飛入波蘭領空、墜落在東南部的 3 個飛行物，全是俄羅斯 Kh-101 巡弋飛彈；殘骸初步檢驗顯示，它們是 2026 年第 4 季在俄羅斯莫斯科州杜布納（Dubna）的工廠新造的。這項鑑定推翻了官方最初「2 枚飛彈＋1 架無人機」的說法；北約北大西洋理事會週一（23 日）將在布魯塞爾開緊急會議討論領空遭侵犯一事。週五凌晨，俄羅斯發動開戰以來最大規模空襲之一（基輔口徑：400 多架無人機、110 多枚飛彈；同波攻擊也打中基輔的第聶伯河橋梁），3 枚飛彈在此期間落入波蘭：一枚 Kh-101 墜在距烏克蘭邊境約 50 公里的新利波維茨（Nowy Lipowiec）空地並起火，另兩枚落在桑河畔魯德尼克（Rudnik nad Sanem）與莫沃迪奇（Mołodycz）附近；無人傷亡、無建築損毀，波蘭與盟軍戰機緊急升空但未開火。墜落點鄰近新登巴（Nowa Dęba）——11 國「志願聯盟」部隊自 11 月 9 日起在此演習。總理圖斯克（Donald Tusk）週五直言飛行物落在演習場附近「不是巧合」，定調為蓄意挑釁；國防部長科西尼亞克－卡梅什（Władysław Kosiniak-Kamysz）表示將向北約爭取更多「東部哨兵」防空資源。北約秘書長呂特（Mark Rutte）週六稱北約將保衛波蘭每一寸領土。俄羅斯至今未回應。\\n\\n為什麼重要：精確巡弋飛彈——而且是新造的，不是殘骸或迷航無人機——飛進北約領空、落在盟軍演習場附近，是這場戰爭至今最尖銳的領空侵犯；華沙把它定調為蓄意測試北約反應，而非地理意外。週一的北大西洋理事會是北約第一步正式回應，它對東翼防空的決定將顯示北約願意走多遠。\\n\\n來源異同：路透、法新社與波蘭官方對檢方鑑定、三處墜落點、無人傷亡與週一會議等事實一致。唯一的位移在波蘭自家口徑內部：週五初判（2 飛彈＋1 無人機）已被盧布林檢方週日的殘骸初步鑑定（三枚全是 Kh-101）取代；檢方亦明言鑑定屬初步結果。\\n\\n仍不確定：殘骸鑑定仍是初步、可能修正；俄羅斯未回應；飛彈究竟瞄準波蘭還是偏航，尚無證據定案——華沙主張蓄意，莫斯科沉默；北大西洋理事會尚未開會，北約的具體回應未知。\"},\"category\":\"international\",\"disagreements\":null,\"glossary\":[{\"blurb\":{\"en\":\"Russian air-launched cruise missile with precision guidance; Poland says all three objects that crashed on its soil were newly built Kh-101s.\",\"zh-TW\":\"俄羅斯空射精確巡弋飛彈；波蘭檢方指墜境的 3 個飛行物全是新造的 Kh-101。\"},\"term\":{\"en\":\"Kh-101\",\"zh-TW\":\"Kh-101 巡弋飛彈（Kh-101）\"}},{\"blurb\":{\"en\":\"NATO's principal political decision-making body, meeting in Brussels on Monday to discuss the violation of Polish airspace.\",\"zh-TW\":\"北約最高政治決策機構，週一在布魯塞爾開會討論波蘭領空遭侵犯一事。\"},\"term\":{\"en\":\"North Atlantic Council\",\"zh-TW\":\"北大西洋理事會（North Atlantic Council）\"}},{\"blurb\":{\"en\":\"Poland's prime minister, who called the missile incursion an intentional provocation timed near allied exercises.\",\"zh-TW\":\"波蘭總理，將飛彈入境定調為蓄意挑釁，並指落點鄰近盟軍演習場並非巧合。\"},\"term\":{\"en\":\"Donald Tusk\",\"zh-TW\":\"圖斯克（Donald Tusk）\"}},{\"blurb\":{\"en\":\"NATO's air-defence mission on the alliance's eastern flank; Poland is seeking additional forces and equipment for it.\",\"zh-TW\":\"北約東翼防空任務；波蘭正爭取為其增派部隊與裝備。\"},\"term\":{\"en\":\"Eastern Sentry\",\"zh-TW\":\"東部哨兵（Eastern Sentry）\"}}],\"id\":\"live-international-21-russian-kh101-missiles-poland-nato\",\"imageAlt\":{\"en\":\"A Kh-101 cruise missile fragment recovered in Ukraine (file image)\",\"zh-TW\":\"在烏克蘭尋獲的 Kh-101 巡弋飛彈殘骸（資料畫面）\"},\"imageUrl\":\"\",\"isHeadline\":true,\"isPopular\":true,\"publishedAt\":\"2026-11-23T05:08:24.000Z\",\"sources\":[{\"name\":\"Reuters\",\"url\":\"https://www.reuters.com/world/three-russian-missiles-flew-into-poland-friday-prosecutors-say-2026-11-22/\"},{\"name\":\"EuropeSays (AFP)\",\"url\":\"https://www.europesays.com/poland/39259/\"},{\"name\":\"EU Insider\",\"url\":\"https://www.euinsider.eu/news/russian-kh-101-missiles-poland-bilgoraj-eastern-sentry-2026\"}],\"summary\":{\"en\":\"Polish prosecutors confirmed Sunday that all three objects that crashed in southeastern Poland on Friday were Russian Kh-101 cruise missiles manufactured in late 2026 — correcting the initial report of two missiles and a drone. The missiles landed near a Coalition of the Willing exercise during Russia's massive strike on Ukraine; nobody was hurt. Tusk calls it an intentional provocation, Rutte vows to defend every inch of Poland, and NATO's North Atlantic Council meets Monday.\",\"zh-TW\":\"波蘭檢方週日證實，週五墜落在波蘭東南部的 3 個飛行物全是 2026 年第 4 季新造的俄羅斯 Kh-101 巡弋飛彈——推翻最初「2 飛彈＋1 無人機」的說法。飛彈落在俄軍大空襲烏克蘭期間、鄰近 11 國志願聯盟演習場，無人傷亡。圖斯克定調蓄意挑釁，呂特稱北約保衛波蘭每一寸領土，北大西洋理事會週一緊急開會——接下來看北約端出什麼具體回應。\"},\"tags\":[],\"title\":{\"en\":\"Polish Prosecutors Confirm All Three Objects Were New Russian Kh-101 Missiles; NATO Council Meets Monday\",\"zh-TW\":\"波蘭檢方證實：墜境三飛行物全是俄新造 Kh-101 飛彈　北約週一緊急開會\"},\"trustBreakdown\":{\"crossCorroboration\":26,\"outletReputation\":25,\"recencyClarity\":23,\"sourceDiversity\":14},\"trustScore\":88}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-international-21-russian-kh101-missiles-poland-nato/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-international-21-russian
