uthor Elizabeth Kellogg—with co-first authors Shirin Fatma, Shubham Dubey, and Vinh Truong—determined the full assembled cryo-electron microscopy structure of the Vibrio cholerae type I-F3 CRISPR-associated transposase system (VchCAST) at roughly 4.5 angstroms. Using zero-shot computational protein design to redesign the TnsA subunit, the team increased targeted DNA insertion activity nearly 100-fold while preserving target specificity.\n\nWhy it matters\nConventional CRISPR tools rely on double-strand DNA breaks to insert large gene sequences, creating risks of unintended genomic rearrangements. The St. Jude structure shows that VchCAST remains catalytically inactive until the Cascade–TniQ complex, TnsC ring, and TnsA–TnsB transposase are all fully assembled—a licensing safeguard that explains its high targeting precision and provides a blueprint for programmable, cut-free gene insertion.\n\nSource differences\nSt. Jude Children's Research Hospital (\"Structural redesign of CAST system reveals mechanisms for targeted DNA integration\") serves as the Nov. 25 institutional news release explaining the licensing mechanism and zero-shot TnsA protein engineering. Nature (\"Licensing mechanisms during RNA-guided DNA integration by type I-F3 CAST\") is the peer-reviewed primary research article (DOI: 10.1038/s41586-026-11287-9) presenting the ~4.5-angstrom cryo-EM structural data and biochemical assays. Phys.org (\"Protein redesign boosts DNA insertion activity and reveals how molecular machinery selects targets\") republishes the Nov. 26 syndicated science report derived from St. Jude's release and the Nature paper.\n\nStill uncertain\nAll experiments were conducted exclusively in bacterial and in vitro systems; the redesigned VchCAST machinery has not yet been tested in human cells, leaving therapeutic or clinical applications distant.\n\nTrust label: Single source — Supported by the peer-reviewed Nature paper (DOI: 10.1038/s41586-026-11287-9) alongside St. Jude's Nov. 25 news release and Phys.org's syndication of the same research."])</script><script>self.__next_f.push([1,"11:T865,"])</script><script>self.__next_f.push([1,"「發生了什麼事」\n美國聖裘德兒童研究醫院（St. Jude Children's Research Hospital）通訊作者伊莉莎白・凱洛格（Elizabeth Kellogg）與共同第一作者 Shirin Fatma、Shubham Dubey、Vinh Truong 團隊，於 2026 年 11 月 25 日在《Nature》發表論文（DOI: 10.1038/s41586-026-11287-9）。團隊利用冷凍電鏡以約 4.5 埃解析度解析源自霍亂弧菌的 I-F3 型 CRISPR 相關轉座酶系統（VchCAST）完整組裝結構，並以零樣本計算蛋白質設計重塑 TnsA 蛋白，使 DNA 插入活性提升近 100 倍且維持原有專一性。\n\n「為什麼重要」\n傳統 CRISPR 基因編輯仰賴雙股 DNA 斷裂來嵌入大片段基因，容易伴隨非預期重排風險；本研究揭示 VchCAST 必須等待 Cascade–TniQ 複合體、TnsC 環與 TnsA–TnsB 轉座酶全數就位才具備催化活性，這套「全組裝才啟動」的授權機制解釋了系統為何具有高度標靶專一性，也為無需切割雙股 DNA 的精準大片段基因寫入工具奠定結構設計基礎。\n\n「來源異同」\n聖裘德兒童研究醫院官方新聞稿（\"Structural redesign of CAST system reveals mechanisms for targeted DNA integration\"）於 11 月 25 日發布研究背景、全組裝授權機制與零樣本蛋白質工程成果；《Nature》論文頁（\"Licensing mechanisms during RNA-guided DNA integration by type I-F3 CAST\"）為同日刊登的同儕審查原始論文（DOI: 10.1038/s41586-026-11287-9），完整記載約 4.5 埃冷凍電鏡結構與生化實驗數據；Phys.org（\"Protein redesign boosts DNA insertion activity and reveals how molecular machinery selects targets\"）則為 11 月 26 日根據聖裘德新聞稿與該篇論文轉載的科學新聞報導。\n\n「仍不確定」\n本項研究的所有實驗均僅在細菌與試管系統中完成，尚未在人類細胞內進行任何功能或安全性驗證，距離實際臨床基因治療應用仍相當遙遠。\n\nTrust label: Single source — 三個來源均源自聖裘德團隊 2026 年 11 月 25 日發表於《Nature》之同一項研究（DOI: 10.1038/s41586-026-11287-9）及其官方新聞稿。"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-biotech-400-stjude-cast-protein-redesign\",\"category\":\"biotech\",\"title\":{\"en\":\"St. Jude Researchers Redesign Type I-F3 CAST System, Boosting DNA Insertion Nearly 100-Fold\",\"zh-TW\":\"聖裘德團隊解構重塑 VchCAST 基因插入系統 使 DNA 插入活性提升近百倍\"},\"summary\":{\"en\":\"Researchers at St. Jude Children's Research Hospital published a study in Nature on Nov. 25, 2026, resolving the full cryo-EM structure of the Vibrio cholerae type I-F3 CAST system (VchCAST) at about 4.5 angstroms. By computationally redesigning the TnsA protein, the team boosted targeted DNA insertion activity nearly 100-fold without losing specificity, though tests remain limited to bacteria and in vitro systems.\",\"zh-TW\":\"美國聖裘德兒童研究醫院團隊於 2026 年 11 月 25 日在《Nature》發表研究，以冷凍電鏡解出源自霍亂弧菌的 I-F3 型 CAST 系統（VchCAST）完整組裝結構，揭示其「全組裝才啟動」的高專一性機制。團隊並以計算蛋白質設計重塑 TnsA 蛋白，使 DNA 插入活性提升近 100 倍且不損專一性，惟目前僅在細菌與試管完成驗證。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"$11\"},\"glossary\":[{\"term\":{\"en\":\"CRISPR-Associated Transposase (CAST)\",\"zh-TW\":\"CRISPR 相關轉座酶（CAST）\"},\"blurb\":{\"en\":\"A molecular system combining RNA-guided CRISPR targeting with transposase enzymes to insert large DNA segments without making double-strand breaks.\",\"zh-TW\":\"結合 CRISPR 的 RNA 導引定位能力與轉座酶功能的分子系統，能在不切斷 DNA 雙股的情況下將大片段基因精準插入指定位置。\"}},{\"term\":{\"en\":\"Cryo-Electron Microscopy (Cryo-EM)\",\"zh-TW\":\"冷凍電子顯微鏡（Cryo-EM）\"},\"blurb\":{\"en\":\"A structural biology imaging technique that flash-freezes biological molecules to determine their three-dimensional atomic or near-atomic structures.\",\"zh-TW\":\"將生物大分子急速冷凍後以電子束成像的結構生物學技術，可用於解析蛋白質複合體的三維立體構型。\"}},{\"term\":{\"en\":\"Zero-Shot Computational Protein Design\",\"zh-TW\":\"零樣本計算蛋白質設計\"},\"blurb\":{\"en\":\"An AI-assisted protein engineering approach that predicts functional amino acid mutations directly from structural models without iterative experimental screening.\",\"zh-TW\":\"直接依據蛋白質結構與演化模型預測具功能增益的胺基酸突變組合，無需先經過多輪反覆實驗篩選的計算設計方法。\"}},{\"term\":{\"en\":\"Angstrom\",\"zh-TW\":\"埃（Angstrom）\"},\"blurb\":{\"en\":\"A unit of length equal to 0.1 nanometers, commonly used to measure atomic distances and structural biology resolution.\",\"zh-TW\":\"長度單位，1 埃等於 0.1 奈米，常用於衡量原子間距以及冷凍電鏡或 X 光晶體學的結構解析度。\"}}],\"sources\":[{\"name\":\"St. Jude Children's Research Hospital\",\"url\":\"https://www.stjude.org/media-resources/news-releases/2026-medicine-science-news/structural-redesign-of-cast-system-reveals-mechanisms-for-targeted-dna-integration.html\"},{\"name\":\"Nature\",\"url\":\"https://www.nature.com/articles/s41586-026-11287-9\"},{\"name\":\"Phys.org\",\"url\":\"https://phys.org
