 expatriates, increased bank hiring and more arrivals from mainland China are tightening housing supply, forcing renters to bid against each other. Separately, the BBC reports that Hong Kong has marked a year since a blaze tore through seven apartment blocks and killed 168 people. A year after one of the city's deadliest fires, families of the victims are still waiting for justice, the BBC reports.\n\nWhy it matters\nRents at record highs mean newcomers and returning residents must pay more for the same flats, and the squeeze falls hardest on people with the least room to bid. The fire anniversary is a reminder that the housing story in Hong Kong is not only about prices: 168 families are still waiting for answers a year after the blaze.\n\nSources agree / disagree\nBloomberg and the BBC are covering two different stories bundled into one cluster, not the same event: Bloomberg on rents, the BBC on the fire anniversary. The BBC's two items agree that the fire killed 168 people. No figures conflict between the outlets.\n\nStill uncertain\nThe feed gives no rent figures, no neighbourhood breakdown, and no detail on how much of the increase comes from each driver Allan named. The fire items give no update on investigations or accountability. Trust label: Bundled stories — two unrelated stories, rents and a fire anniversary, grouped in one cluster."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-02-what-s-driving-hong-kong\",\"category\":\"finance\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-finance-02-what-s-driving-hong-kong.jpg\",\"imageAlt\":{\"en\":\"Cover related to: What’s Driving Hong Kong Home Rents to New Highs\",\"zh-TW\":\"相關封面圖：是什麼推動香港房屋租金創新高\"},\"publishedAt\":\"2026-11-27T03:41:24.000Z\",\"title\":{\"en\":\"Hong Kong Home Rents Hit New Highs as Bidding Wars Tighten Supply\",\"zh-TW\":\"香港住宅租金創新高，競價搶租推升行情\"},\"summary\":{\"en\":\"Competing offers are pushing Hong Kong home rents to new highs, Habitat Property founder and CEO Victoria Allan told Bloomberg TV, as returning expatriates, more bank hiring and new arrivals from mainland China tighten supply. A separate BBC report marks one year since a tower fire killed 168.\",\"zh-TW\":\"Habitat Property 創辦人兼執行長維多利亞·艾倫（Victoria Allan）向彭博電視（Bloomberg TV）表示，回流外籍人士、銀行擴大招聘與中國大陸移入人口增加收緊供應，競價搶租正把香港住宅租金推向新高。英國廣播公司（BBC）另報導，奪走 168 條人命的大樓火災屆滿一週年。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"Habitat Property 創辦人兼執行長維多利亞·艾倫（Victoria Allan）向彭博電視（Bloomberg TV）表示，競價搶租正把香港住宅租金推向新高。\\n\\n發生了什麼事\\n艾倫表示，回流外籍人士、銀行擴大招聘與中國大陸移入人口增加收緊住房供應，租客須競價搶租，香港住宅租金因此創新高。英國廣播公司（BBC）另報導，香港一場大火燒毀七棟住宅大樓、奪走 168 條人命屆滿一週年；這場城市最致命火災之一發生一年後，罹難者家屬仍在等待正義。\\n\\n為什麼重要\\n租金創新高意味新移入與回流居民須為同樣的房子付出更高代價，議價空間最小的人承受的壓力最大。火災週年也提醒讀者，香港的住房問題不只是價格：168 個家庭在火災一年後仍在等待答案。\\n\\n來源異同\\n彭博（Bloomberg）與英國廣播公司（BBC）報導的是兩個不同的故事，並非同一事件——彭博談租金，BBC 談火災週年；BBC 兩則報導對 168 人死亡的數字一致，來源之間沒有數字衝突。\\n\\n仍不確定\\n摘要未提供租金數字、各地區行情，也未說明艾倫提到的各項因素分別推升租金多少；火災報導未交代調查或究責進度。信任標籤：打包報導——租金與火災週年兩個不相關的故事併入同一張卡。\"},\"sources\":[{\"name\":\"Bloomberg\",\"url\":\"https://www.bloomberg.com/news/videos/2026-11-27/what-s-driving-hong-kong-home-rents-to-new-highs-video\"},{\"name\":\"BBC News-Asia\",\"url\":\"https://www.bbc.co.uk/news/videos/c6evr2y40v0jo?at_medium=RSS\u0026at_campaign=rss\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":18,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"finance\",\"live-ingest\",\"bloomberg\",\"bbc-news-asia\",\"bbc-news-asia\"],\"glossary\":[{\"blurb\":{\"en\":\"Founder and CEO of Habitat Property.\",\"zh-TW\":\"Habitat Property 創辦人兼執行長。\"},\"term\":{\"en\":\"Victoria Allan\",\"zh-TW\":\"維多利亞·艾倫\"}},{\"blurb\":{\"en\":\"Hong Kong real estate agency.\",\"zh-TW\":\"香港地產代理公司。\"},\"term\":{\"en\":\"Habitat Property\",\"zh-TW\":\"Habitat Property\"}},{\"blurb\":{\"en\":\"Bloomberg's television channel, where Allan gave the interview.\",\"zh-TW\":\"艾倫受訪的彭博電視頻道。\"},\"term\":{\"en\":\"Bloo
