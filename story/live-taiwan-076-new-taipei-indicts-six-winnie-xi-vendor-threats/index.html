rganized crime, illegal debt collection, and attempted extortion. Prosecutors said a member of the Bamboo Union's Hongren faction recruited accomplices last year to collect debts and carry out political intimidation.\n\nAccording to the indictment, an unidentified Chinese national contacted the group after finding an online vendor in Taiwan selling figurines depicting Chinese President Xi Jinping (習近平) as Winnie the Pooh. The suspects threatened the vendor and attempted to buy out the entire inventory for NT$25,000 to force the items offline, prompting the seller to refuse and publicize the threats on social media.\n\nFocus Taiwan and ICRT both confirm the charges, the NT$25,000 buyout demand, and prosecutors' request for a 5.5-year prison sentence for lead defendant Chen, while noting that another suspect surnamed Ikubo remains at large.\n\nThe identity of the Chinese national who allegedly solicited the gang members and the final court verdicts remain pending.\n\nTrust label: Multi-source agreement — Indictment details, gang affiliation, and sentencing recommendations are corroborated across Focus Taiwan and ICRT."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-076-new-taipei-indicts-six-winnie-xi-vendor-threats\",\"category\":\"taiwan\",\"title\":{\"en\":\"New Taipei Prosecutors Indict Six Over Gang Threats to 'Winnie Xi' Vendor\",\"zh-TW\":\"新北檢起訴6名涉案嫌犯 涉受託恐嚇販售「維尼習」商品網拍賣家\"},\"summary\":{\"en\":\"New Taipei prosecutors indicted six suspects linked to a Bamboo Union faction for illegal debt collection and the attempted extortion of an online vendor selling Xi Jinping-themed Winnie the Pooh merchandise. The case underscores ongoing legal scrutiny of cross-border political intimidation in Taiwan.\",\"zh-TW\":\"新北地檢署起訴6名具竹聯幫弘仁會背景的嫌犯，指控其涉嫌非法討債並受中國籍人士請託，恐嚇一名販售習近平（Xi Jinping）造型小熊維尼商品的網拍賣家。此案凸顯台灣司法機關對跨境政治恫嚇與黑幫介入言論及商業自由的嚴密追查。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n新北地檢署偵結起訴6名嫌犯，指控其涉犯組織犯罪、非法討債及恐嚇取財未遂等罪。檢方指出，一名竹聯幫弘仁會成員自去年起招募同夥，從事非法蒐集個資、潑穢物討債及受託執行特定政治目的行動。\\n\\n「為什麼重要」\\n起訴書揭露，一名中國籍人士發現台灣有網拍賣家販售將中國國家主席習近平（Xi Jinping）描繪為小熊維尼的公仔後，透過關係委託該幫派分子向賣家施壓下架。嫌犯曾威脅並企圖以新台幣2萬5千元買斷全部庫存，遭賣家拒絕並在社群媒體公開揭露，顯示境外勢力藉由黑幫在台進行政治恫嚇的滲透風險。\\n\\n「來源異同」\\n中央社英文網（Focus Taiwan）與台北國際社區廣播電台（ICRT）對起訴人數、2萬5千元買斷要求以及檢方對主嫌陳姓男子求處5年6個月徒刑等細節報導完全一致。\\n\\n「仍不確定」\\n最初委託幫派分子施壓的中國籍人士真實身分尚未在起訴書中查明，另一名涉案嫌犯目前仍在逃，後續法院審理量刑結果亦待確定。\"},\"glossary\":[{\"term\":{\"en\":\"Bamboo Union\",\"zh-TW\":\"竹聯幫\"},\"blurb\":{\"en\":\"One of Taiwan's largest organized crime syndicates, divided into multiple sub-groups or factions operating across the island.\",\"zh-TW\":\"台灣規模最大的黑幫組織之一，旗下設有多個堂口與分會。\"}},{\"term\":{\"en\":\"Attempted Extortion\",\"zh-TW\":\"恐嚇取財未遂\"},\"blurb\":{\"en\":\"A criminal offense involving the use of threats or intimidation to coerce someone into surrendering property or money without succeeding.\",\"zh-TW\":\"以威脅或恫嚇手段意圖迫使他人交付財物或放棄權益，但因被害人拒絕或外力介入而未得逞的刑事罪名。\"}},{\"term\":{\"en\":\"Indictment\",\"zh-TW\":\"起訴書\"},\"blurb\":{\"en\":\"A formal written accusation issued by a prosecutor charging one or more individuals with specific criminal offenses.\",\"zh-TW\":\"檢察官於偵查終結後，認定被告犯罪嫌疑重大而向法院提起公訴的正式法律文書。\"}}],\"sources\":[{\"name\":\"Focus Taiwan (CNA)\",\"url\":\"https://focustaiwan.tw/society/202611260017\"},{\"name\":\"ICRT\",\"url\":\"https://www.icrt.com.tw/info_details.php?mlevel1=6\u0026mlevel2=12\u0026news_id=312583\"}],\"imageUrl\":\"/covers/live/live-taiwan-076-new-taipei-indicts-six-winnie-xi-vendor-threats.jpg\",\"imageAlt\":{\"en\":\"Exterior of the New Taipei District Prosecutors Office\",\"zh-TW\":\"台灣新北地方檢察署外觀\"},\"isHeadline\":false,\"isPopular\":true,\"trustScore\":83,\"trustBreakdown\":{\"crossCorroboration\":21,\"outletReputation\":22,\"recencyClarity\":20,\"sourceDiversity\":20},\"publishedAt\":\"2026-11-27T15:07:28.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":4,\"D2\":4,\"D3\":4,\"D4\":4,\"D5\":3,\"total\":19},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\"
