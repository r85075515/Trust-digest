avy corvette at a naval base in Benghazi, eastern Libya, on Sunday, Libyan officials told the Associated Press — the first time the Russia-Ukraine war has visibly struck a Russian warship in the Mediterranean, more than 1,000 miles from the front line.\n\nWhat happened: Two Libyan military officials said several Ukrainian sea drones were launched at the Merkury, a Russian Navy corvette docked at the Benghazi Naval Base, from a base run by Ukrainian forces in western Libya, according to an initial investigation. At least four drones were intercepted and destroyed and two hit the warship, severely damaging it and igniting a fire at the facility. The eastern Libya-based government confirmed an explosion and fire at the base, later extinguished, and said the vessel had docked for refueling and supplies under a cooperation agreement with Russia; a joint investigation with Russia has been launched. The officials, affiliated with the Libyan National Army, which controls eastern and southern Libya, said Ukrainian forces — most of them drone experts — operate mainly at an air base in Misrata, and also at facilities in Tripoli and Zawiya. In March, Ukrainian forces in western Libya had already struck a Russian tanker near Maltese waters in a suspected sea drone attack. Ukraine has not claimed responsibility; Axios reported a military source attributing the long-range strike to Ukraine's SBU security service, which Kyiv has not confirmed. No casualty information has been released.\n\nWhy it matters: The strike extends Ukraine's sea-drone campaign — which has repeatedly hit Russia's Black Sea Fleet — into the central Mediterranean and onto NATO's southern flank, and it exposes how deeply both belligerents are now embedded in Libya's rival camps: Russia supplies and backs the east, while Ukrainian drone units operate from the west. It also puts Libyan ports in the line of fire, as the western-based government warned against dragging Libyan facilities into external conflicts.\n\nSources agree/disagree: AP, CBS News and the BBC agree the strike happened, that the Merkury was hit and burned, and that Libyan officials attribute it to Ukrainian sea drones. They differ on the damage: AP reports the corvette was severely damaged, while satellite imagery cited by the BBC and Naval News suggests the ship was left partially submerged and, in Naval News' assessment, almost certainly destroyed — the stronger claim is not yet independently confirmed. Attribution to the SBU rests on a single military source cited by Axios.\n\nStill uncertain: The full extent of the damage and any casualties are unknown; Ukraine has neither confirmed nor denied the operation; Russia has not publicly responded; and the joint Libyan-Russian investigation has not reported. Whether Kyiv's presence in western Libya will draw further Russian retaliation there is also open.\n\nTrust label: Accounts differ — major outlets agree a suspected Ukrainian sea drone strike hit and severely damaged the Russian corvette; they differ on whether the ship was destroyed and on who ordered the attack, and those points are presented in parallel rather than settled."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"adult\":false,\"body\":{\"en\":\"$10\",\"zh-TW\":\"發生了什麼事：利比亞官員向美聯社表示，一起疑似烏克蘭海上無人機攻擊，週日在利比亞東部班加西海軍基地重創一艘俄羅斯海軍護衛艦——這是烏俄戰爭首度明顯打到地中海的俄國軍艦，距離前線逾 1,000 英里。兩名利比亞軍方官員說，初步調查顯示，多架烏克蘭海上無人機自烏軍在利比亞西部的基地發射，攻擊靠泊中的俄艦墨丘利號（Merkury）；至少 4 架被攔截摧毀、2 架命中，軍艦嚴重受損、基地爆炸起火。利比亞東部政府證實基地發生爆炸與火災、火勢其後撲滅，並稱該艦依與俄羅斯的合作協議靠泊補給，已與俄方展開聯合調查。官員隸屬控制利比亞東部與南部的利比亞國民軍（Libyan National Army），並指烏軍（多為無人機專家）主要駐在米蘇拉塔（Misrata）空軍基地，的黎波里與扎維耶（Zawiya）亦有據點；今年 3 月，烏軍已曾在馬爾他外海以疑似海上無人機攻擊一艘俄國油輪。烏克蘭未宣稱負責；Axios 引述軍方消息指長程打擊由烏克蘭國家安全局（SBU）執行，基輔未證實。目前沒有傷亡資訊公布。\\n\\n為什麼重要：這次攻擊把烏克蘭的海上無人機戰線——過去屢次重創俄國黑海艦隊——推進到地中海中部、北約南翼門口，也暴露交戰雙方已深深嵌入利比亞兩大陣營：俄羅斯支援東部，烏克蘭無人機部隊則在西部活動。利比亞西部政府已警告勿把利比亞港口與民用設施拖入外部衝突。\\n\\n來源異同：美聯社、CBS 新聞與 BBC 對攻擊發生、墨丘利號被擊中起火、利比亞官員歸因於烏克蘭海上無人機等事實一致；分歧在損害程度——美聯社報導為「嚴重受損」，BBC 與 Naval News 引述的衛星影像則顯示艦體事後部分沉沒，Naval News 評估「幾乎確定被摧毀」，此較強說法尚未獲獨立證實。SBU 主導一說僅來自 Axios 引述的單一軍方消息。\\n\\n仍不確定：損害全貌與傷亡人數未知；烏克蘭未承認也未否認；俄羅斯尚未公開回應；利比亞與俄羅斯的聯合調查也未公布結果。烏軍在利比亞西部的存在會否引來俄方進一步報復，同樣待觀察。\"},\"category\":\"international\",\"disagreements\":\"Outlets agree the strike severely damaged the Merkury, but differ on the extent: AP says severely damaged; BBC/Naval News satellite assessments suggest partial sinking and likely destruction. SBU attribution rests on a single military source cited by Axios and is unconfirmed by Kyiv.\",\"glossary\":[{\"blurb\":{\"en\":\"A Russian Navy Project 20380 Steregushchiy-class corvette, nominally of the Black Sea Fleet, hit while docked in Benghazi.\",\"zh-TW\":\"俄羅斯海軍 20380 型守護級護衛艦，名義上屬黑海艦隊，靠泊班加西時遭擊重創。\"},\"term\":{\"en\":\"Merkury\",\"zh-TW\":\"墨丘利號（Merkury）\"}},{\"blurb\":{\"en\":\"Naval base in eastern Libya controlled by the Libyan National Army, where the Russian corvette had docked for refueling and supplies.\",\"zh-TW\":\"利比亞東部班加西的海軍基地，由利比亞國民軍控制，俄艦在此靠泊補給。\"},\"term\":{\"en\":\"Benghazi Naval Base\",\"zh-TW\":\"班加西海軍基地（Benghazi Naval Base）\"}},{\"blurb\":{\"en\":\"The armed force controlling eastern and southern Libya, aligned with Russia under a military cooperation agreement.\",\"zh-TW\":\"控制利比亞東部與南部的武裝勢力，與俄羅斯簽有軍事合作協議。\"},\"term\":{\"en\":\"Libyan National Army\",\"zh-TW\":\"利比亞國民軍（Libyan National Army）\"}},{\"blurb\":{\"en\":\"Uncrewed surface vessels used by Ukraine to attack Russian warships; at least two reportedly hit the Merkury.\",\"zh-TW\":\"無人水面載具，烏克蘭多次用以攻擊俄國軍艦；本次據報至少兩架命中墨丘利號。\"},\"term\":{\"en\":\"Sea drones\",\"zh-TW\":\"海上無人機（Sea drones）\"}},{\"blurb\":{\"en\":\"Ukraine's security service; a military source cited by Axios said it carried out the strike, which Kyiv has not confirmed.\",\"zh-TW\":\"烏克蘭情報安全機構；Axios 引述軍方消息指其執行此次打擊，基輔未證實。\"},\"term\":{\"en\":\"SBU (Security Service of Ukraine)\",\"zh-TW\":\"烏克蘭國家安全局（SBU）\"}}],\"id\":\"live-international-20-ukraine-sea-drones-hit-russian-warship-libya\",\"imageAlt\":{\"en\":\"The Russian corvette Merkury at Benghazi naval base (file image)\",\"zh-TW\":\"俄羅斯護衛艦墨丘利號於班加西海軍基地（資料畫面）\"},\"imageUrl\":\"\",\"isHeadline\":true,\"isPopular\":true,\"publishedAt\":\"2026-11-22T20:17:56.000Z\",\"sources\":[{\"name\":\"Associated Press\",\"url\":\"https://www.military.com/suspected-ukrainian-sea-drones-hit-russian-warship-at-benghazi-naval-base\"},{\"name\":\"New York Post\",\"url\":\"https://nypost.com/2026/11/22/world-news/putins-warship-hit-in-suspected-ukrainian-drone-strike-that-set-off-huge-explosion/\"},{\"name\":\"EU Today\",\"url\":\"https://eutoday.net/ukraine-takes-the-war-to-russias-maritime-empire/\"}],\"summary\":{\"en\":\"Libyan officials say suspected Ukrainian sea drones launched from western Libya hit the Russian Navy corvette Merkury at Benghazi naval base on Sunday, severely damaging the ship and setting the facility ablaze; at least four other drones were intercepted. Ukraine has not claimed the attack, and outlets differ on whether the ship was destroyed. The strike drags the Russia-Ukraine war into the Mediterranean for the first time.\",\"zh-TW\":\"利比亞官員表示，疑似烏克蘭海上無人機週日自利比亞西部基地發射，擊中班加西海軍基地的俄羅斯護衛艦墨丘利號（Merkury），軍艦嚴重受損、基地爆炸起火，另至少 4 架無人機被攔截。烏克蘭未宣稱負責，衛星影像顯示艦體部分沉沒，但「被摧毀」的說法尚未獨立證實。這是烏俄戰火首度燒進地中海，接下來看俄方如何回應、以及烏軍在利比亞的存在會否引來報復。\"},\"tags\":[],\"title\":{\"en\":\"Suspected Ukrainian Sea Drones Hit Russian Corvette Merkury at Benghazi Naval Base, Dragging the War Into the Mediterranean\",\"zh-TW\":\"烏克蘭海上無人機突襲利比亞　俄軍護衛艦墨丘利號在班加西爆炸重創\"},\"trustBreakdown\":{\"crossCorroboration\":26,\"outletReputation\":25,\"recencyClarity\":22,\"sourceDiversity\":13},\"trustScore\":86}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW /
