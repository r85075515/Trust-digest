. The laboratory where she worked called her an 'inspiring, talented and passionate scientist,' in tributes carried by both outlets.\nWhy it matters\nThe identification puts a named researcher — mid-career, traveling for professional recognition — among the victims, as the wider casualty count and cause of the collision continue to be established.\nSources agree / disagree\nBBC and The Guardian agree on her identity, role, age as reported, the award trip and the at-least-69 death toll, with no conflicting facts. Trust label: Two-source agreement — two outlets agree on the core claims.\nStill uncertain\nThe snippets do not give the crash's cause, the exact location details beyond Spain, or a final toll; those remain under investigation and official confirmation."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-03-university-of-cambridge-\",\"category\":\"international\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-international-03-university-of-cambridge-.jpg\",\"imageAlt\":{\"en\":\"Cover related to: University of Cambridge scientist among those who died in Spanish train crash\",\"zh-TW\":\"相關封面圖：劍橋大學科學家在西班牙火車事故中喪生\"},\"publishedAt\":\"2026-11-01T19:36:46.000Z\",\"title\":{\"en\":\"Cambridge Scientist Marta Shahbazi Among at Least 69 Killed in Spanish Train Crash\",\"zh-TW\":\"劍橋大學（University of Cambridge）科學家 Shahbazi 在西班牙火車事故喪生，至少 69 死\"},\"summary\":{\"en\":\"Dr. Marta Shahbazi, 41, an affiliate associate professor at the Cambridge Stem Cell Institute and a group leader at the Medical Research Council laboratory, died in Wednesday's Spanish train collision that killed at least 69 people while she was traveling to a conference to receive an award for scientific excellence in developmental biology.\",\"zh-TW\":\"劍橋大學幹細胞研究所（Cambridge Stem Cell Institute）兼任副教授、醫學研究委員會（Medical Research Council）實驗室研究組長 Shahbazi 博士（Dr. Marta Shahbazi），41 歲，在前往會議領取發育生物學卓越獎途中，於週三西班牙火車相撞事故喪生，該事故至少 69 死。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"一名劍橋發育生物學家被確認在西班牙火車相撞事故中罹難。\\n發生了什麼事\\n英國廣播公司（BBC）報導，劍橋大學（University of Cambridge）科學家 Shahbazi 博士（Dr. Marta Shahbazi）在西班牙火車事故中喪生。《衛報》（The Guardian）報導，她當時正前往一場會議，領取發育生物學科學卓越獎，並在週三的相撞事故中罹難，該事故至少造成 69 人死亡。Shahbazi，41 歲，是劍橋大學幹細胞研究所（Cambridge Stem Cell Institute）兼任副教授，也是該市醫學研究委員會（Medical Research Council）實驗室的研究組長。她工作的實驗室稱她是「啟發人心、才華洋溢且熱情的科學家」，兩家媒體皆刊出悼念。\\n為什麼重要\\n這項確認讓一位正值壯年、為領獎出差的研究者列入罹難者名單，而整體傷亡與相撞原因仍在確認中。\\n來源異同\\n英國廣播公司（BBC）與《衛報》（The Guardian）對她的身分、職務、年齡、出差領獎與至少 69 死一致，沒有事實衝突。信任標籤：雙源一致——兩家媒體對核心主張一致。\\n仍不確定\\n摘要未提供事故原因、西班牙境內的確切地點與最終死亡人數；這些仍待調查與官方確認。\"},\"sources\":[{\"name\":\"BBC World\",\"url\":\"https://www.bbc.co.uk/news/articles/cq5ynzvkn1d8o?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"The Guardian UK News\",\"url\":\"https://www.theguardian.com/world/2026/nov/01/tributes-marta-shahbazi-university-of-cambridge-scientist-spanish-train-crash\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":19,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"international\",\"live-ingest\",\"bbc-world\",\"the-guardian-uk-news\"],\"glossary\":[{\"term\":{\"en\":\"Marta Shahbazi\",\"zh-TW\":\"Shahbazi\"},\"blurb\":{\"en\":\"Cambridge scientist who died in the Spanish train collision.\",\"zh-TW\":\"劍橋科學家，在西班牙火車相撞事故喪生。\"}},{\"term\":{\"en\":\"Cambridge Stem Cell Institute\",\"zh-TW\":\"劍橋大學幹細胞研究所\"},\"blurb\":{\"en\":\"Cambridge institute where Shahbazi was an affiliate associate professor.\",\"zh-TW\":\"劍橋機構，Shahbazi 任兼任副教授之處。\"}},{\"term\":{\"en\":\"Medical Research Council\",\"zh-TW\":\"醫學研究委員會\"},\"blurb\":{\"en\":\"UK research council whose Cambridge laboratory Shahbazi led a group at.\",\"zh-TW\":\"英國研究委員會，Shahbazi 在其劍橋實驗室領導研究組。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script
