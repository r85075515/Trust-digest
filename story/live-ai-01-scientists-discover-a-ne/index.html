d is associated with night-owl tendencies, excessive sleep, persistent exhaustion and more severe symptoms — and traditional antidepressants often work less effectively for these patients.\nWhat happened\nScientists identified the subtype by tying depression symptoms to circadian rhythms: patients in this group tend toward late nights, sleep too much, feel persistently exhausted and show more severe symptoms than other depression patients. The finding comes from ScienceDaily's health and medicine coverage, which reports the discovery alongside a separate study on AI and the brain. Traditional antidepressants, the coverage notes, often work less well for this group.\nWhy it matters\nThe judgment is practical, not theoretical: if a quarter of severe depression cases run on a broken body clock, prescribing the same pills and waiting is the wrong default. Clock-based approaches — light therapy, sleep timing, drugs that target circadian pathways — become the obvious next test, and patients who never responded to standard treatment finally have a possible explanation.\nSources agree / disagree\nThe two ScienceDaily items describe the same discovery with consistent details; the AI-and-brain item in the same cluster is a separate study, not a contradiction. Trust label: Single source — one outlet family, unconfirmed by others.\nStill uncertain\nThe snippets do not name the study, the journal, the sample size or the diagnostic criteria for circadian depression. Those details require the full reporting on the linked publisher pages."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-ai-01-scientists-discover-a-ne\",\"category\":\"ai\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-ai-01-scientists-discover-a-ne.webp\",\"imageAlt\":{\"en\":\"Cover related to: Scientists discover a new type of depression that common antidepressants struggle to treat\",\"zh-TW\":\"相關封面圖：科學家發現了一種普通抗憂鬱藥物難以治療的新型憂鬱症\"},\"publishedAt\":\"2026-11-24T10:47:51.000Z\",\"title\":{\"en\":\"Scientists Identify 'Circadian Depression' That Resists Common Antidepressants\",\"zh-TW\":\"科學家發現「晝夜節律型憂鬱症」：常見抗憂鬱藥難治\"},\"summary\":{\"en\":\"[Unconfirmed · single source] Researchers have discovered a new subtype of depression, dubbed circadian depression, that may affect nearly one in four people with severe, recurrent or persistent depression. It is linked to the body's internal clock and tied to night-owl tendencies, excessive sleep and persistent exhaustion, and traditional antidepressants often work less well for it.\",\"zh-TW\":\"［未證實·單一來源］研究人員發現一種新的憂鬱症亞型，稱為「晝夜節律型憂鬱症」，可能影響近四分之一的重度、復發性或持續性憂鬱症患者。它與人體生理時鐘有關，伴隨夜貓子傾向、過度睡眠、持續疲憊與更嚴重症狀，傳統抗憂鬱藥對這類患者效果往往較差。這項發現指向以生理時鐘為目標的療法；後續看是否有重複驗證研究。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"研究人員發現一種新的憂鬱症亞型，可能影響近四分之一的重度、復發性或持續性憂鬱症患者。這種稱為「晝夜節律型憂鬱症」的類型與人體生理時鐘有關，伴隨夜貓子傾向、過度睡眠、持續疲憊與更嚴重症狀，傳統抗憂鬱藥對這類患者效果往往較差。\\n發生了什麼事\\n科學家將憂鬱症狀與晝夜節律連結，辨識出這個亞型：這群患者傾向熬夜、睡眠過多、持續疲憊，症狀比其他憂鬱症患者更嚴重。消息來自《每日科學》的健康醫學報導，同批另有一則關於 AI 與大腦的研究，是不同研究、並非同一發現。報導指出，傳統抗憂鬱藥對這群患者效果往往較差。\\n為什麼重要\\n結論很實際，不是理論：若四分之一的重度憂鬱症病例是生理時鐘出問題，開同樣的藥、慢慢等就是錯誤預設。以生理時鐘為目標的做法——光照療法、睡眠時間調整、針對晝夜節律路徑的藥物——成為理所當然的下一步檢驗；而對標準治療從未有反應的患者，終於有了一個可能的解釋。\\n來源異同\\n兩則《每日科學》報導對同一發現的描述一致；同批的 AI 與大腦研究是另一項研究，不是矛盾。信任標籤：僅1源——單一媒體、未經他家證實。\\n仍不確定\\n片段未說明研究名稱、期刊、樣本數或晝夜節律型憂鬱症的診斷標準，須看完整報導才能確認。\"},\"sources\":[{\"name\":\"ScienceDaily AI\",\"url\":\"https://www.sciencedaily.com/releases/2026/11/261120075701.htm\"}],\"disagreements\":null,\"trustScore\":54,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":17,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"ai\",\"live-ingest\",\"sciencedaily-ai\",\"sciencedaily-健康醫學\"],\"glossary\":[{\"term\":{\"en\":\"Circadian depression\",\"zh-TW\":\"晝夜節律型憂鬱症\"},\"blurb\":{\"en\":\"Newly identified depression subtype tied to the body clock.\",\"zh-TW\":\"新發現、與生理時鐘有關的憂鬱症亞型。\"}},{\"term\":{\"en\":\"Circadian rhythm\",\"zh-TW\":\"晝夜節律\"},\"blurb\":{\"en\":\"The body's internal 24-hour clock.\",\"zh-TW\":\"人體內在的 24 小時生理時鐘。\"}},{\"term\":{\"en\":\"Antidepressants\",\"zh-TW\":\"抗憂鬱藥\"},\"blurb\":{\"en\":\"Standard drugs for depression that often work less well for this subtype.\",\"zh-TW\":\"對此亞型效果往往較差的標準憂鬱症藥物。\"}},{\"term\":{\"en\":\"ScienceDaily\",\"zh-TW\":\"《每日科學》\"},\"blurb\":{\"en\":\"Outlet that reported the discovery.\",\"zh-TW\":\"報導這項發現的媒體。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-ai-01-scientists-discover-a-ne/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-ai-01-scientists-discover-a-ne/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"d:\"$8:metadata\"\n"])</script></body></html>
