ia Publica reported the network. Rodrigo Martins de Mello and his family are under investigation by Brazil's Federal Police for helping Alexandre Ramagem, former director of the country's intelligence agency.\nWhat happened\nAgencia Publica said Mello built the Florida network, described as in the Sunshine State. Mello and his family are under investigation for helping Ramagem, Bolsonaro's former spy chief. The truncated summary did not state how Mello allegedly helped Ramagem, whether Ramagem reached Florida, what companies or properties are involved, or the investigation stage. No statement from Mello, Ramagem, or Bolsonaro was included.\nWhy it matters\nThe case links an alleged escape by a former intelligence chief to assets and businesses in the United States. If the allegations are established, the Florida network would show how cross-border movement and property holdings intersect with a Brazilian inquiry. A wanted mining boss with US businesses raises direct questions about enforcement and asset tracing.\nSources agree / disagree\nOnly ICIJ was listed, with Agencia Publica as media partner, so no second outlet corroborates the investigation or network. Trust label: Single source — one outlet reported the item through its partner and no corroboration was provided.\nStill uncertain\nThe specific help allegedly given, the companies' names, locations and values, any warrant or extradition request, and any responses from Mello, Ramagem, or Bolsonaro were not stated."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-accountability-01-amazon-mining-boss-wante\",\"category\":\"accountability\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-accountability-01-amazon-mining-boss-wante.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Amazon mining boss wanted by Brazil for sheltering Jair Bolsonaro’s spy chief has businesses, properties in Florida\",\"zh-TW\":\"相關封面圖：（譯文待補）Amazon mining boss wanted by Brazil for sheltering Jair Bolsonaro’s spy chief has businesses, properties in Florida\"},\"publishedAt\":\"2026-10-29T21:43:47.000Z\",\"title\":{\"en\":\"Rodrigo Martins de Mello Built Florida Network While Wanted by Brazil\",\"zh-TW\":\"羅德里戈·馬丁斯·德梅洛（Rodrigo Martins de Mello）在遭巴西通緝期間於佛州建立企業網絡\"},\"summary\":{\"en\":\"[Unverified, single source] Brazilian gold miner Rodrigo Martins de Mello, wanted for allegedly helping former President Jair Bolsonaro's spy chief flee to Florida, built a network of companies and properties there, Agencia Publica reported. He and his family face a Federal Police investigation. Watch for the alleged help, assets, and any responses.\",\"zh-TW\":\"[未證實·單一來源]巴西金礦礦工羅德里戈·馬丁斯·德梅洛（Rodrigo Martins de Mello）涉嫌協助前總統雅伊爾·波索納洛（Jair Bolsonaro）的情報首長逃往佛羅里達州而遭到通緝，並在當地建立公司與房產網絡，Agência Pública 報導稱他與家人正接受聯邦警察調查。後續要看涉嫌協助的內容、資產細節與各方回應。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"一名巴西金礦礦工涉嫌協助前總統雅伊爾·波索納洛（Jair Bolsonaro）的情報首長逃往佛羅里達州而遭到通緝，並在佛羅里達州建立了由公司與房產組成的網絡。根據摘要，ICIJ 的媒體合作夥伴 Agência Pública 報導了這個網絡。羅德里戈·馬丁斯·德梅洛（Rodrigo Martins de Mello）及其家人，正因協助該國前情報機構首長亞歷山大·拉馬根（Alexandre Ramagem）而接受巴西聯邦警察調查。\\n發生了什麼事\\n作為 ICIJ 媒體合作夥伴的 Agência Pública 表示，羅德里戈·馬丁斯·德梅洛（Rodrigo Martins de Mello）在佛羅里達州建立了公司與房產網絡，來源稱該州為陽光之州。摘要指出，德梅洛及其家人因協助亞歷山大·拉馬根（Alexandre Ramagem）而接受巴西聯邦警察調查，拉馬根是巴西前情報機構首長，也是前總統雅伊爾·波索納洛（Jair Bolsonaro）的情報首長。摘要遭到截斷，沒有說明德梅洛如何涉嫌協助拉馬根、拉馬根是否抵達佛羅里達州、涉及哪些公司或房產，也沒有說明調查進展到哪個階段。提供的資料沒有收錄德梅洛、其家人、拉馬根或波索納洛的聲明。\\n為什麼重要\\n這起案件重要，是因為它把一名前情報首長涉嫌逃亡，與在美國持有的資產與企業連結起來。如果調查中的指控獲得證實，佛羅里達州的網絡將顯示跨境移動與房產持有如何與巴西的刑事調查交織。這起案件的問責意義很直接：一名遭到通緝、在美國擁有企業的礦業老闆，引發了執法、資產追蹤，以及巴西與美國當局合作的問題，遭到截斷的摘要都沒有解答這些問題。\\n來源異同\\n列出的來源只有 ICIJ 一家，Agência Pública 被註明為其媒體合作夥伴，因此沒有第二家媒體佐證這項調查或佛羅里達州的網絡。信任標籤：單一來源——只有一家媒體透過其媒體合作夥伴報導此事，沒有提供佐證。\\n仍不確定\\n缺失的關鍵資訊很明確：涉嫌向拉馬根提供的具體協助沒有說明。佛羅里達州公司與房產的名稱、地點與價值沒有說明。任何逮捕令、引渡請求或指控的狀態，以及德梅洛、拉馬根或波索納洛的回應，都沒有說明。調查的階段與任何美國當局的參與，在遭到截斷的資料中也沒有說明。\"},\"sources\":[{\"name\":\"ICIJ\",\"url\":\"https://www.icij.org/news/2026/10/amazon-mining-boss-wanted-by-brazil-for-sheltering-jair-bolsonaros-spy-chief-has-businesses-properties-in-florida/\"}],\"disagreements\":null,\"trustScore\":47,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":10,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"accountability\",\"live-ingest\",\"icij\"],\"glossary\":[{\"blurb\":{\"en\":\"Brazilian gold miner under investigation for helping Alexandre Ramagem.\",\"zh-TW\":\"因協助亞歷山大·拉馬根而接受調查的巴西金礦礦工。\"},\"term\":{\"en\":\"Rodrigo Martins de Mello\",\"zh-TW\":\"羅德里戈·馬丁斯·德梅洛（Rodrigo Martins de Mello）\"}},{\"blurb\":{\"en\":\"Former director of Brazil's intelligence agency.\",\"zh-TW\":\"巴西前情報機構首長。\"},\"term\":{\"en\":\"Alexandre Ramagem\",\"zh-TW\":\"亞歷山大·拉馬根（Alexandre Ramagem）\"}},{\"blurb\":{\"en\":\"Former President of Brazil, whose spy chief was Ramagem.\",\"zh-TW\":\"前巴西總統，其情報首長為拉馬根。\"},\"term\":{\"en\":\"Jair Bolsonaro\",\"zh-TW\":\"雅伊爾·波索納洛（Jair Bolsonaro）\"}},{\"blurb\":{\"en\":\"ICIJ media partner that reported the Florida network.\",\"zh-TW\":\"報導佛羅里達州網絡的 ICIJ 媒體合作夥伴。\"},\"term\":{\"en\":\"Agencia Publica\",\"zh-TW\":\"Agência Pública\"}},{\"blurb\":{\"en\":\"Investigative journalism network that published the report through its partner.\",\"zh-TW\":\"透過合作夥伴發布報導的調查新聞網絡。\"},\"term\":{\"en\":\"ICIJ\",\"zh-TW\":\"ICIJ\"}},{\"blurb\":{\"en\":\"Brazilian authority investigating Mello and his family.\",\"zh-TW\":\"調查德梅洛及其家人的巴西當局。\"},\"term\":{\"en\":\"Brazil Federal Police\",\"zh-TW\":\"巴西聯邦警察（Brazil Federal Police）\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"
