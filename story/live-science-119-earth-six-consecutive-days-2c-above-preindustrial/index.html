 days with global surface temperatures at least 2°C above preindustrial baseline levels, according to ERA5 data from the European Union's Copernicus Climate Change Service (C3S) reported on November 25, 2026. Daily global surface temperature peaked at a record 2.24°C above preindustrial levels on Monday, November 23, and forecasters projected the elevated anomaly to persist for several more days. C3S strategic lead Samantha Burgess noted that atmospheric carbon dioxide is rising at roughly 3.5 parts per million year-on-year—nearly twice the pace compatible with limiting warming to 1.5°C.\n\nAlthough a multi-day breach does not mean the long-term Paris Agreement 2°C threshold—measured over decades—has been permanently crossed, crossing 2°C for nearly a full week signals accelerating climate instability. Researchers warn that the combination of long-term greenhouse gas accumulation and a powerful El Niño approaching its peak heightens risks to global food production and freshwater supplies.\n\nThe Guardian and SpotMedia both cite the exact same Copernicus C3S/ERA5 measurements, including the six-day streak above 2°C and the 2.24°C peak on November 23, 2026.\n\nHow long the current streak above 2°C will continue into December 2026 and whether the ongoing El Niño peak will push full-year 2026 or 2027 averages past the 1.5°C multi-year mark remain subject to ongoing meteorological observation.\n\nTrust label: Official statement — Copernicus Climate Change Service (C3S/ERA5) dataset reported consistently by The Guardian and SpotMedia."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-science-119-earth-six-consecutive-days-2c-above-preindustrial\",\"category\":\"science\",\"title\":{\"en\":\"Earth Records Six Consecutive Days Above 2°C Preindustrial Threshold for First Time\",\"zh-TW\":\"全球氣溫首度連續六天突破工業化前 2°C 門檻 單日異常值創 2.24°C 新高\"},\"summary\":{\"en\":\"Data from Europe's Copernicus Climate Change Service shows Earth experienced six consecutive days at least 2°C warmer than preindustrial levels for the first time, peaking at 2.24°C on November 23, 2026. Takeaway: Scientists attribute the spike to persistent fossil fuel emissions combined with a strengthening El Niño event.\",\"zh-TW\":\"歐盟哥白尼氣候變化服務中心（Copernicus Climate Change Service）數據顯示，全球平均地表氣溫首度連續六天比工業化前基準高出至少 2°C，並於 2026 年 11 月 23 日創下高出 2.24°C 的歷史單日新高。一句重點結論：氣候科學家指出，化石燃料持續排放疊加正在增強的聖嬰現象，推動全球氣溫突破重要心理與氣候警戒線。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n根據歐盟哥白尼氣候變化服務中心（Copernicus Climate Change Service，C3S）ERA5 觀測數據，全球地表平均氣溫首度出現連續六天較工業化前（1850–1900 年）基準高出至少 2°C 的紀錄，其中 2026 年 11 月 23 日單日氣溫異常值更攀升至高出基準 2.24°C 的歷史新高，且高溫異常預料仍將持續數日。\\n\\n「為什麼重要」\\n《巴黎協定》設定的 1.5°C 與 2°C 溫控目標是以數十年長期平均值計算，單週突破並不代表長期目標已永久失守，但連續六天越過 2°C 警戒線仍寫下現代氣象觀測首例。C3S 戰略負責人薩曼莎・伯吉斯（Samantha Burgess）警告，大氣二氧化碳年增率達約 3.5 ppm，幾乎是守住 1.5°C 目標所需上限的兩倍，疊加趨近峰值的強聖嬰現象（El Niño），恐進一步威脅全球糧食與淡水供應。\\n\\n「來源異同」\\n《衛報》（The Guardian）與羅馬尼亞新聞媒體《SpotMedia》均援引哥白尼氣候變化服務中心 ERA5 同一組觀測數據，對連續六天突破 2°C 及 11 月 23 日創下 2.24°C 單日高點的數字記載完全吻合。\\n\\n「仍不確定」\\n本波全球均溫高於工業化前 2°C 的連續天數還會維持多久，以及本輪聖嬰現象峰值對 2026 全年與 2027 年均溫的最終推升幅度，仍有待後續氣象觀測數據確認。\"},\"glossary\":[{\"term\":{\"en\":\"Preindustrial Baseline\",\"zh-TW\":\"工業化前基準氣溫\"},\"blurb\":{\"en\":\"The average global surface temperature between 1850 and 1900 used as the reference point for measuring human-driven global warming.\",\"zh-TW\":\"氣候科學界通常採用的 1850 至 1900 年全球平均地表溫度，作為衡量人類活動造成全球暖化升溫幅度的基準線。\"}},{\"term\":{\"en\":\"Copernicus Climate Change Service (C3S)\",\"zh-TW\":\"哥白尼氣候變化服務中心\"},\"blurb\":{\"en\":\"The European Union's Earth observation climate agency providing authoritative global temperature and ERA5 reanalysis datasets.\",\"zh-TW\":\"歐盟地球觀測計畫旗下的官方氣候機構，負責發布權威全球氣溫監測與 ERA5 氣候再分析數據。\"}},{\"term\":{\"en\":\"El Niño\",\"zh-TW\":\"聖嬰現象\"},\"blurb\":{\"en\":\"A natural climate pattern involving abnormal warming of surface waters in the central and eastern tropical Pacific Ocean that boosts global temperatures.\",\"zh-TW\":\"熱帶中東太平洋海表溫度異常偏暖的自然氣候現象，往往會暫時推高全球平均氣溫並引發極端天氣。\"}}],\"sources\":[{\"name\":\"The Guardian\",\"url\":\"https://www.theguardian.com/environment/2026/nov/25/world-six-consecutive-days-2c-above-preindustrial-levels-first-time\"},{\"name\":\"SpotMedia\",\"url\":\"https://spotmedia.ro/en/news/environment/the-world-has-recorded-for-the-first-time-6-consecutive-days-with-2c-above-pre-industrial-levels-the-last-el-nino-this-strong-was-in-the-1870s\"}],\"imageUrl\":\"/covers/live/live-science-119-earth-six-consecutive-days-2c-above-preindustrial.jpg\",\"imageAlt\":{\"en\":\"Global temperature anomaly chart showing surface temperatures 2C above preindustrial levels\",\"zh-TW\":\"顯示全球地表氣溫高出工業化前 2°C 的氣溫異常趨勢圖\"},\"isHeadline\":true,\"isPopular\":true,\"trustScore\":87,\"trustBreakdown\":{\"crossCorroboration\":21,\"outletReputation\":24,\"recencyClarity\":22,\"sourceDiversity\":20},\"publishedAt\":\"2026-11-27T16:08:57.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":5,\"D2\":5,\"D3\":4,\"D4\":4,\"D5\":5,\"total\":23},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-science-119-earth-six-consecutive-days-2c-above-preindustrial/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https:
