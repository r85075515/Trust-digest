 threshold applies before paying.\nWhat happened\nThe listing offers an extra 50% off the Gap Factory clearance sale, applied at checkout, and lists women’s and men’s categories. Its community score is shown as Thumb Score +21. Shipping is described in the listing text as free on orders of $35 or more for Encore members, with Encore membership described as free to join. The headline, by contrast, states free shipping and handling on orders of $50 or more. The material supplied does not resolve which threshold governs a given order, and it gives no end date, exclusions, or stock information.\nWhy it matters\nA stacked clearance discount only helps if the final checkout price is clear, and the shipping threshold decides whether a small order stays cheap. The gap between $35 for Encore members and $50 in the headline is the difference between free shipping and an added cost, so the honest reading is that the headline promise cannot be taken at face value until the checkout terms are confirmed.\nSources agree / disagree\nOnly Slickdeals Frontpage is represented in the material supplied, so no second source corroborates the discount or the shipping terms. Within that single listing, the headline says free shipping and handling on $50 or more, while the listing text says free shipping on $35 or more for Encore members; both figures are reported here because the material does not reconcile them. Trust label: Single source — one listing reported the sale, with no corroboration and an unresolved shipping-threshold difference in the material supplied.\nStill uncertain\nThe end date, eligible items, exclusions, whether the $35 Encore threshold overrides the $50 headline figure, and availability are unknown. Confirm terms at checkout before ordering."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-shopping-01-gap-factory-clearance-sa\",\"category\":\"shopping\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-shopping-01-gap-factory-clearance-sa.png\",\"imageAlt\":{\"en\":\"Cover related to: Gap Factory Clearance Sale 50% Off + Free S\u0026H on $50+\",\"zh-TW\":\"相關封面圖：（譯文待補）Gap Factory Clearance Sale 50% Off + Free S\u0026H on $50+\"},\"publishedAt\":\"2026-10-31T01:12:03.000Z\",\"title\":{\"en\":\"Gap Factory Offers Extra 50% Off Clearance Sale With Free Shipping Threshold\",\"zh-TW\":\"Gap Factory 清倉特賣額外五折，免運門檻說法不一\"},\"summary\":{\"en\":\"[Unconfirmed · Single source] Gap Factory’s clearance sale takes an extra 50% off at checkout, Slickdeals reported. Free-shipping terms differ in the listing: $50 or more in the headline, but $35 or more for Encore members in the text, so shoppers must check at checkout.\",\"zh-TW\":\"［未證實·單一來源］Gap Factory 清倉特賣結帳時額外五折，Slickdeals 報導。免運門檻說法不一：標題說滿50美元，內文說 Encore 會員滿35美元。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"Gap Factory 正在舉行清倉特賣，結帳時額外五折，Slickdeals 首頁刊登的資訊如此報導。同一則資訊的免運門檻有兩種說法，結帳前應先確認適用哪一種。\\n發生了什麼事\\n這則資訊提供 Gap Factory 清倉特賣額外五折，結帳時套用，並列出女裝與男裝分類，社群評分為 Thumb Score +21。內文說，Encore 會員訂單滿35美元免運費，加入 Encore 會員免費；標題則說訂單滿50美元免運費。素材沒有說明哪一個門檻適用於某一筆訂單，也沒有給出截止日期、排除條款或庫存資訊。\\n為什麼重要\\n結論很實際：疊加的清倉折扣只有在最終結帳價格清楚時才划算，免運門檻決定小額訂單會不會多一筆運費。Encore 會員35美元與標題50美元之間的差距，就是免運與加收運費的差別；在結帳條件確認之前，標題的承諾不能直接當真。\\n來源異同\\n素材只有 Slickdeals 首頁一家來源，沒有第二個來源佐證折扣或運費條件。在同一則資訊內部，標題說滿50美元免運費，內文說 Encore 會員滿35美元免運費，素材沒有調和兩者，本卡如實並列兩個數字。信任標籤：僅1源——只有一則刊登資訊報導這次特賣，沒有其他來源佐證，免運門檻的差異也未解決。\\n仍不確定\\n特賣截止日期、適用商品、排除條款、Encore 會員35美元門檻是否優先於標題50美元的說法，以及商品供應情形，素材都沒有交代；下單前請在結帳頁面與 Slickdeals 完整資訊中確認折扣與運費條件。\"},\"sources\":[{\"name\":\"Slickdeals Frontpage\",\"url\":\"https://slickdeals.net/f/20228967-extra-50-off-gap-factory-clearance-sale?utm_source=rss\u0026utm_content=fp\u0026utm_medium=RSS2\"}],\"disagreements\":null,\"trustScore\":47,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":10,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"shopping\",\"live-ingest\",\"slickdeals-frontpage\"],\"glossary\":[{\"blurb\":{\"en\":\"Retail brand running the clearance sa
