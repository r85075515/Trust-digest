l-issued student devices after parents, educators, and activists voiced concerns at a November 13 school board AI committee meeting. According to Associated Press syndications published by WBOC and WSB-TV, Google also announced earlier in November that it will turn off Gemini and AI search tools by default for K-12 schools in the coming months, requiring administrators to opt in.\n\n「Why it matters」\nAs the second-largest U.S. school district, LAUSD's move signals growing institutional resistance among K-12 educators against Big Tech embedding generative AI directly into core student research tools without explicit district consent, potentially prompting other districts to follow suit.\n\n「Source differences」\nWBOC (\"As Google threatens to cut schools' search access, Los Angeles\") and WSB-TV (\"Los Angeles schools block Google's artificial intelligence features\") carry the same Associated Press report detailing the November 13 committee meeting, parallel plug-in efforts by Fairfax County Public Schools in Virginia, Google's K-12 default opt-out policy shift, and district officials warning they could switch default search engines overnight.\n\n「Still uncertain」\nDistrict officials have not disclosed the exact technical mechanism used to disable AI Overviews on student accounts or how long the block will remain in place.\n\nTrust label: Single source — Both outlets publish the same Associated Press wire report covering LAUSD's decision and Google's K-12 policy update."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-education-274-lausd-blocks-google-ai-overviews\",\"category\":\"education\",\"title\":{\"en\":\"Los Angeles School District Blocks Google AI Search Summaries on Student Devices\",\"zh-TW\":\"洛杉磯學區封鎖學生設備 Google AI 搜尋摘要，抗衡預設 AI 推播\"},\"summary\":{\"en\":\"Los Angeles Unified School District officials disabled Google's AI Overviews on student-issued devices following pushback from educators and parents over classroom AI overreach. While Google subsequently announced plans to turn off Gemini and search AI tools by default for K-12 schools, district leaders emphasized they can switch default search engines overnight if needed.\",\"zh-TW\":\"在教師與家長抗議人工智慧過度滲透校園後，洛杉磯聯合學區（LAUSD）已在學生配發設備上停用 Google 搜尋的 AI 摘要（AI Overviews）功能。儘管 Google 隨後宣布未來數月將改為預設關閉 K-12 學校的 Gemini 與搜尋 AI 工具，學區官員仍強調必要時可隨時更換預設搜尋引擎。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n在家長、教育工作者與倡議人士於 11 月 13 日學區委員會 AI 小組會議提出抗議後，洛杉磯聯合學區（LAUSD）官員已在學校配發的學生設備上停用 Google 搜尋的 AI 摘要（AI Overviews）功能。據 WBOC 與 WSB-TV 刊載的美聯社（Associated Press）報導，Google 亦於 11 月初發布部落格文章表示，未來數月將把 K-12 學校的 Gemini 與所有搜尋 AI 工具改為預設關閉，須由學區管理員手動開啟。\\n\\n「為什麼重要」\\n身為全美第二大學區，洛杉磯聯合學區此舉反映出基礎教育界對科技巨頭未經同意便將生成式 AI 強行嵌入學生核心查詢工具的強烈反彈，並可能帶動全美更多公立學區跟進限制校園 AI 功能。\\n\\n「來源異同」\\nWBOC（標題原文「As Google threatens to cut schools' search access, Los Angeles」）與 WSB-TV（標題原文「Los Angeles schools block Google's artificial intelligence features」）均刊登同一篇美聯社通訊稿，完整記錄 11 月 13 日委員會會議、維吉尼亞州費爾法克斯郡公立學區（Fairfax County Public Schools）開發外掛程式移除 AI 摘要的做法，以及學區資訊主管直言可在一夜之間更換預設搜尋引擎的立場。\\n\\n「仍不確定」\\n洛杉磯聯合學區尚未對外說明停用學生帳號 AI 摘要的具體技術執行方式，也未明確公布該項封鎖措施預計維持多長時間。\\n\\nTrust label: Single source — 兩家媒體刊登同一篇美聯社（AP）通訊稿，屬單一通訊社新聞來源。\"},\"glossary\":[{\"term\":{\"en\":\"AI Overviews\",\"zh-TW\":\"Google AI 摘要（AI Overviews）\"},\"blurb\":{\"en\":\"An automated generative artificial intelligence feature in Google Search that compiles synthesized answers at the top of search results pages.\",\"zh-TW\":\"Google 搜尋內建的生成式人工智慧功能，會在搜尋結果頁面頂端自動彙整並顯示文字摘要。\"}},{\"term\":{\"en\":\"LAUSD (Los Angeles Unified School District)\",\"zh-TW\":\"洛杉磯聯合學區（LAUSD）\"},\"blurb\":{\"en\":\"The public school district serving Los Angeles and surrounding communities, ranking as the second-largest school system in the United States.\",\"zh-TW\":\"服務美國加州洛杉磯及周邊社區的公立學區，為全美學生人數第二多的基礎教育體系。\"}},{\"term\":{\"en\":\"K-12\",\"zh-TW\":\"K-12 基礎教育\"},\"blurb\":{\"en\":\"The publicly supported primary and secondary education span from kindergarten through twelfth grade in the United States.\",\"zh-TW\":\"美國從幼稚園（Kindergarten）至高中三年級（12 年級）的初等與中等基礎教育階段統稱。\"}}],\"sources\":[{\"name\":\"WBOC (Associated Press)\",\"url\":\"https://www.wboc.com/news/national/as-google-threatens-to-cut-schools-search-access-los-angeles-blocks-ai-features/article_ef1dbce4-75d6-5f6c-87db-730eebe29072.html\"},{\"name\":\"WSB-TV (Associated Press)\",\"url\":\"https://www.wsbtv.com/news/business/google-threatens-cut/EM7AKYFXAQ7TVGBXJFBO6AGUW4/\"}],\"imageUrl\":\"/covers/live/live-education-274-lausd-blocks-google-ai-overviews.jpg\",\"imageAlt\":{\"en\":\"Los Angeles School District Blocks Google AI Search Summaries on Student Devices\",\"zh-TW\":\"洛杉磯學區封鎖學生設備 Google AI 搜尋摘要，抗衡預設 AI 推播\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":72,\"trustBreakdown\":{\"crossCorroboration\":16,\"outletReputation\":21,\"recencyClarity\":23,\"sourceDiversity\":12},\"publishedAt\":\"2026-11-27T23:55:21.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":23,\"D2\":23,\"D3\":22,\"D4\":23,\"D5\":21,\"total\":22},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-education-274-lausd-blocks-google-ai-overviews/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",
