her than announcing a new halt.\nWhat happened\nTrump signed the law on Friday, according to the Times report, formally ending the penny's production. The coin had already stopped being struck a year earlier, so the law confirms an existing reality instead of starting a phase-out. The feed summary gives no further detail on the law's provisions.\nWhy it matters\nA law, rather than an administrative pause, settles the penny's status for businesses and banks handling cash. The practical questions now shift to rounding, change, and how long existing pennies stay in circulation — none of which the summary answers.\nSources agree-disagree\nOnly one outlet, The New York Times, appears in this cluster, so there is no cross-outlet comparison to make. The report is straightforward on the two facts it gives — a Friday signing and a halt a year earlier — and no conflicting account appears. Trust label: Single source. One reputable outlet, but uncorroborated within this cluster.\nStill uncertain\nThe summary does not name the law, describe its provisions, or say how cash transactions should be rounded. It also does not say whether existing pennies remain legal tender or how the Mint will handle its remaining stock."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-us-02-the-penny-is-dead-now-it\",\"category\":\"us\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-us-02-the-penny-is-dead-now-it.jpg\",\"imageAlt\":{\"en\":\"Cover related to: The Penny Is Dead. Now It’s Official.\",\"zh-TW\":\"相關封面圖：便士死了。現在它是官方的。\"},\"publishedAt\":\"2026-11-21T23:12:23.000Z\",\"title\":{\"en\":\"Trump Signs Law Formally Ending the Penny, a Year After Minting Stopped\",\"zh-TW\":\"川普簽署法案正式終結一美分硬幣　停鑄一年後走入歷史\"},\"summary\":{\"en\":\"President Donald Trump signed a law on Friday formally ending production of the penny, a year after the US Mint stopped striking the one-cent coin. The signing makes official a change already in effect for a year. Watch for guidance on cash rounding and the Mint's next steps.\",\"zh-TW\":\"［未證實·單一來源］唐納·川普（Donald Trump）總統星期五簽署法案，正式終結一美分硬幣的鑄造；美國鑄幣局（United States Mint）已於一年前停鑄。簽署只是讓已實施一年的改變正式生效，後續看現金找零指引與鑄幣局的下一步。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"唐納·川普（Donald Trump）總統星期五簽署法案，正式終結一美分硬幣的鑄造；這種硬幣已於一年前停鑄。據紐約時報（The New York Times）報導，這次簽署是讓硬幣走入歷史正式生效，而非宣布新的停鑄。\\n發生了什麼事\\n川普於星期五簽署法案，正式終結一美分硬幣的生產。硬幣早在一年前就已停鑄，法案只是確認既成事實，而非啟動逐步淘汰。摘要未進一步說明法案條文。\\n為什麼重要\\n以法律、而非行政暫停來定案，讓處理現金的商家與銀行有了明確依據。實際問題轉向找零方式、零錢處理，以及現有硬幣還能流通多久，摘要都沒有回答。\\n來源異同\\n本批只有紐約時報一家來源，無法跨來源比對。報導對兩個事實交代明確：星期五簽署、一年前停鑄，也沒有相互矛盾的說法。信任標籤：單一來源。\\n仍不確定\\n摘要未寫明法案名稱與條文，也沒說現金交易如何進位找零。現有硬幣是否仍為法定貨幣、鑄幣局如何處理剩餘庫存，同樣不明。\"},\"sources\":[{\"name\":\"NYT Economy\",\"url\":\"https://www.nytimes.com/2026/11/21/us/politics/penny-mint-trump-common-cent-act.html\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":23,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"us\",\"live-ingest\",\"nyt-economy\"],\"glossary\":[{\"term\":{\"en\":\"Donald Trump\",\"zh-TW\":\"唐納·川普\"},\"blurb\":{\"en\":\"US president who signed the law ending the penny.\",\"zh-TW\":\"簽署終結一美分硬幣法案的美國總統。\"}},{\"term\":{\"en\":\"The New York Times\",\"zh-TW\":\"紐約時報\"},\"blurb\":{\"en\":\"US newspaper that reported the signing.\",\"zh-TW\":\"報導這次簽署的美國報紙。\"}},{\"term\":{\"en\":\"US Mint\",\"zh-TW\":\"美國鑄幣局\"},\"blurb\":{\"en\":\"Federal agency that strikes US coins, including the penny.\",\"zh-TW\":\"負責鑄造美國硬幣（包括一美分）的聯邦機構。\"}},{\"term\":{\"en\":\"Penny\",\"zh-TW\":\"一美分硬幣\"},\"blurb\":{\"en\":\"One-cent US coin whose production the law formally ends.\",\"zh-TW\":\"法案正式終結生產的一美分美國硬幣。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Mul
