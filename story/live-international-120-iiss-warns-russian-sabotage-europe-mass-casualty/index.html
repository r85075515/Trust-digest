are intensifying and risk triggering a \"mass-casualty event\"—either deliberately or through miscalculation—the International Institute for Strategic Studies (IISS) warned in an assessment reported on November 27, 2026. According to the London-based defense think tank, Western governments and intelligence agencies have attributed a Europe-wide campaign of drone incursions, cyberattacks, arson, and explosive plots to Moscow's efforts to disrupt European Union support for Ukraine. The IISS urged European capitals to publicly signal what level of harm will trigger specific retaliatory responses rather than allowing escalation to be driven by instinct. Moscow has rejected all accusations of orchestrating sabotage in Europe.\n\nThe warning highlights growing vulnerability across European civilian infrastructure, transport networks, and defense supply lines as hybrid warfare tactics test NATO and EU deterrence thresholds below the level of conventional armed conflict.\n\nThe Guardian and TVP World both report the IISS findings on escalating Russian hybrid and sabotage operations in Europe and the risk of mass casualties, noting Moscow's blanket denial and Poland's earlier warnings over suspected sabotage targeting military supply routes.\n\nWhich specific European governments will adopt formal public deterrence thresholds in response to the IISS recommendations, and details of ongoing classified counter-intelligence investigations into individual incidents, remain undetermined.\n\nTrust label: Multi-source agreement — IISS defense assessment reported consistently by The Guardian and TVP World, with Russian denials noted."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-120-iiss-warns-russian-sabotage-europe-mass-casualty\",\"category\":\"international\",\"title\":{\"en\":\"Think Tank Warns Rising Russian Sabotage in Europe Risks 'Mass-Casualty Event'\",\"zh-TW\":\"國際戰略研究所示警：俄國在歐破壞行動升溫 恐釀「大規模傷亡事件」\"},\"summary\":{\"en\":\"The International Institute for Strategic Studies (IISS) warned that escalating Russia-linked sabotage attacks across Europe—including arson, drones, cyberattacks, and explosives—could cause a mass-casualty incident, either deliberately or through miscalculation. Takeaway: The think tank urged European governments to publicly clarify red lines and retaliation thresholds to deter Moscow.\",\"zh-TW\":\"英國智庫「國際戰略研究所（IISS）」發表評估報告警告，歐洲境內涉嫌由俄羅斯主導的縱火、無人機、網路攻擊與爆裂物破壞行動持續升溫，無論蓄意或誤判，均可能引發「大規模傷亡事件」。一句重點結論：報告呼籲歐洲各國公開劃設嚇阻紅線與反制門檻，避免局勢失控升級。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n總部位於倫敦的國防智庫「國際戰略研究所（IISS）」於 2026 年 11 月 27 日發布最新評估指出，歐洲各地涉嫌與俄羅斯有關的破壞行動正不斷升級，涵蓋無人機侵擾、網路攻擊、縱火與爆裂物陰謀，不論出於蓄意或執行誤判，都可能演變為「大規模傷亡事件」。報告建議歐洲各國政府應公開明確宣示何種程度的損害將觸發相應反制行動，以建立有效嚇阻。\\n\\n「為什麼重要」\\n西方政府與情報機構普遍認為，莫斯科正透過低於傳統武裝衝突門檻的「混合戰」手段，試圖削弱歐盟對烏克蘭的軍事與後勤援助。IISS 的警告凸顯歐洲民用基礎設施、交通樞紐與軍援供應鏈面臨的實質風險，以及北約與歐盟在灰色地帶衝突中的嚇阻難題。\\n\\n「來源異同」\\n《衛報》（The Guardian）與波蘭電視台國際頻道（TVP World）均引述 IISS 報告內容，對歐洲境內破壞行動升溫與大規模傷亡風險的描述一致；兩者亦同時載明莫斯科全面否認西方政府與情報單位對其主導破壞行動的所有指控。\\n\\n「仍不確定」\\n歐洲各國政府是否會採納 IISS 建議、公開制定具體反制門檻，以及各國情報部門對近期個別破壞案的機密反情報調查進展，目前尚未對外公開。\"},\"glossary\":[{\"term\":{\"en\":\"International Institute for Strategic Studies (IISS)\",\"zh-TW\":\"國際戰略研究所\"},\"blurb\":{\"en\":\"A London-based global defense and security research institute known for its annual Military Balance assessment and conflict analysis.\",\"zh-TW\":\"總部位於英國倫敦的國際知名國防與安全智庫，以發布年度《軍事平衡》報告及地緣衝突評估著稱。\"}},{\"term\":{\"en\":\"Hybrid Warfare\",\"zh-TW\":\"混合戰\"},\"blurb\":{\"en\":\"A strategy blending covert sabotage, cyberattacks, disinformation, and proxy actions below the threshold of open conventional war.\",\"zh-TW\":\"結合秘密破壞、網路攻擊、假訊息與代理人行動，將衝突強度控制在傳統公開戰爭門檻以下的戰略手段。\"}},{\"term\":{\"en\":\"Deterrence Threshold\",\"zh-TW\":\"嚇阻門檻\"},\"blurb\":{\"en\":\"A clearly communicated boundary specifying what hostile actions will provoke proportional or escalating retaliation from a state or alliance.\",\"zh-TW\":\"國家或軍事同盟明確劃設的紅線標準，界定何種敵對行為將觸發對等或升級報復行動。\"}}],\"sources\":[
