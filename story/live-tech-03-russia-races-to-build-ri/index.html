, the most any individual has spent, and his millions failed to deliver Republican wins in fiercely contested races.\nWhy it matters\nThe judgment runs in two directions. A Russian Starlink rival would cut Ukraine's connectivity edge and sharpen Russia's drone war — satellite networks are now front-line infrastructure. And Musk's midterm result shows the limits of money in politics: a record $500 million bought attention, not victories.\nSources agree / disagree\nThe two outlets do not corroborate each other because they cover different events; there is no overlap to check and no conflict between them. Treat them as two stories, not one. Trust label: Bundled stories — two distinct reports share one card and should not be read as a single event.\nStill uncertain\nThe snippets give no technical details, timeline or cost for Russia's satellite project, and no breakdown of where Musk's $500 million went. Verify specifics in the full Financial Times and BBC reporting."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-tech-03-russia-races-to-build-ri\",\"category\":\"tech\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-tech-03-russia-races-to-build-ri.jpg\",\"imageAlt\":{\"en\":\"Cover: Russia's race to build a rival to Elon Musk's Starlink satellite network.\",\"zh-TW\":\"封面：俄羅斯競相打造馬斯克星鏈的對手。\"},\"publishedAt\":\"2026-11-08T05:00:11.000Z\",\"title\":{\"en\":\"Russia Races to Build a Starlink Rival as Musk's $500 Million Midterm Bet Falls Short\",\"zh-TW\":\"俄羅斯競逐星鏈對手：莫斯科旗艦太空計畫與馬斯克 5 億美元期中選舉豪賭\"},\"summary\":{\"en\":\"The Financial Times reports Russia is racing to build a rival to Elon Musk's Starlink, a flagship space project that would enable deadlier drone strikes deep inside Ukraine. The BBC separately reports Musk spent nearly $500 million in the 2026 US midterm elections — an individual record — without delivering Republican wins. Two stories, one card: the link is Musk.\",\"zh-TW\":\"《金融時報》報導，俄羅斯正競相打造馬斯克（Elon Musk）星鏈（Starlink）的對手；莫斯科旗艦太空計畫將讓無人機深入烏克蘭發動更致命的攻擊。同一張卡另收 BBC 報導：馬斯克在 2026 年美國期中選舉花了近 5 億美元、創個人紀錄，卻沒能替共和黨拿下勝選。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"這張卡把兩則不同新聞綁在一起，交集只有一個人：馬斯克（Elon Musk）。《金融時報》報導俄羅斯正競相打造馬斯克星鏈（Starlink）的對手；BBC 報導馬斯克在 2026 年美國期中選舉花了近 5 億美元、創個人支出紀錄，卻沒能替共和黨拿下勝選。\\n發生了什麼事\\n《金融時報》指出，莫斯科旗艦太空計畫將讓無人機深入烏克蘭發動更致命的攻擊，星鏈對手不只是商業產品，更是軍事資產。BBC 另篇報導談期中選舉：馬斯克在 2026 年美國期中選舉投入近 5 億美元，是個人選舉支出最高紀錄，但在競爭激烈的選戰中，他的鉅款沒能為共和黨帶來勝利。\\n為什麼重要\\n判斷分兩個方向。俄羅斯的星鏈對手會削弱烏克蘭的通訊優勢、強化俄軍無人機作戰——衛星網路已經是前線基礎設施。馬斯克的期中選舉結果則顯示金錢在政治裡的極限：破紀錄的 5 億美元買到了關注，沒買到勝利。\\n來源異同\\n兩家媒體報導的是不同事件，彼此無法相互佐證，也沒有衝突。請當成兩則新聞來讀，不要讀成一件事。信任標籤：混裝報導——兩則不同報導共用一張卡，不應視為單一事件。\\n仍不確定\\n來源摘要沒有俄羅斯衛星計畫的技術細節、時程或成本，也沒有馬斯克 5 億美元花在哪些地方的細目。引用細節前請查閱《金融時報》與 BBC 完整報導。\"},\"sources\":[{\"name\":\"BBC Technology\",\"url\":\"https://www.bbc.co.uk/news/articles/cv8ez3p3ge5ko?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"Financial Times\",\"url\":\"https://www.ft.com/content/423ca208-8e22-4fb3-a76d-b9c722fd8cc0?syn-25a6b1a6=1\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":19,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"tech\",\"live-ingest\",\"bbc-technology\",\"financial-times\"],\"glossary\":[{\"blurb\":{\"en\":\"Elon Musk's satellite internet network, which Russia is racing to rival.\",\"zh-TW\":\"馬斯克的衛星網路，俄羅斯正競相打造其對手。\"},\"term\":{\"en\":\"Starlink\",\"zh-TW\":\"星鏈\"}},{\"blurb\":{\"en\":\"Billionaire behind Starlink who spent nearly $500 million in the 2026 US midterms.\",\"zh-TW\":\"星鏈背後的富豪，在 2026 年美國期中選舉花了近 5 億美元。\"},\"term\":{\"en\":\"Elon Musk\",\"zh-TW\":\"馬斯克\"}},{\"blurb\":{\"en\":\"British business newspaper reporting Russia's race to build a Starlink rival.\",\"zh-TW\":\"報導俄羅斯競逐星鏈對手的英國財經報紙。\"},\"term\":{\"en\":\"Financial Times\",\"zh-TW\":\"金融時報\"}},{\"blurb\":{\"en\":\"British public broadcaster reporting Musk's midterm spending.\",\"zh-TW\":\"報導馬斯克期中選舉支出的英國公共廣播機構。\"},\"term\":{\"en\":\"BBC\",\"zh-TW\":\"BBC\"}},{\"blurb\":
