te and youth teams alongside eight industry partners—including Tokyo Electron, Hermes-Epitek, and Faraday Technology—with total prize money of TWD 4 million. Since launching in 2016, the initiative has supported more than 100 environmental projects.\n\nThe winning proposals address tangible coastal and industrial sustainability bottlenecks, including recycling marine polystyrene foam into reusable composite wood boards, converting discarded oyster shells into cement-free coral restoration bases, and deploying variable-frequency drives to cut aquaculture aeration electricity consumption.\n\nReports from Economic Daily News, Taisounds, and Allnews consistently list the 11 winning teams across the Innovation Solution and Youth Action categories, naming National Tsing Hua University's GreeNIS team as the Youth Action first-prize winner for NFC paperless campus recruitment. Taisounds and Allnews additionally detail the three corporate winners—Reborn Manufacturing, Womu, and Lanxin Smart—and specify the TWD 4 million prize pool.\n\nCommercial scaling timelines for the newly funded coastal restoration and aquaculture hardware pilots across Taiwan's counties remain subject to upcoming field deployment phases.\n\nTrust label: Multi-source agreement — Verified across Economic Daily News, Taisounds, and Allnews coverage of the November 27 ceremony."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-176-umc-green-award-11th-ceremony-winners\",\"category\":\"taiwan\",\"title\":{\"en\":\"UMC Honors 11 Teams at 11th Green Award for Marine Waste Bricks and Oyster-Shell Coral Reefs\",\"zh-TW\":\"聯電第十一屆綠獎揭曉11組獲獎團隊 海廢變建材、蚵殼育珊瑚落地應用\"},\"summary\":{\"en\":\"United Microelectronics Corporation held its 11th Green Award ceremony on November 27, honoring 11 corporate and student teams for projects turning marine polystyrene waste into building boards, upcycling oyster shells into coral restoration bases, and cutting aquaculture energy use with total prize money of TWD 4 million. Takeaway: Corporate-backed environmental grants are moving circular-economy prototypes from university labs into coastal and aquaculture deployment.\",\"zh-TW\":\"聯華電子於11月27日舉行第十一屆「綠獎」頒獎典禮，攜手8家科技夥伴提供總獎金新台幣400萬元，表揚11組企業與青年團隊，獲獎方案涵蓋海廢保麗龍再生塑木板材、廢棄蚵殼珊瑚復育基座及養殖水車變頻節電。一句結論：半導體供應鏈集結資金與商業輔導資源，加速循環經濟創意從校園走入海洋與漁業實務。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」聯華電子（UMC）於 2026 年 11 月 27 日舉行第十一屆「綠獎」頒獎典禮，攜手東京威力科創、漢民科技、智原科技等 8 家科技企業提供總獎金新台幣 400 萬元，共選出 11 組企業與青年獲獎團隊；該獎項自 2016 年創辦以來已累計支持逾百件環境創新提案。\\n\\n「為什麼重要」聯電資深副總經理吳宗賢（Wu Tsung-hsien）指出，結合跨界企業資源能協助環保創意克服商業化門檻。本屆獲獎方案直擊臺灣沿海與產業痛點，包含將海洋廢棄保麗龍轉化為可再回收的單一材質塑木板材、以廢棄蚵殼研發無水泥珊瑚復育基座並推向馬紹爾群島合作，以及為養殖水車導入變頻節電系統。\\n\\n「來源異同」《經濟日報》、《太報》（Taisounds）與《Allnews》均一致報導本屆 11 組團隊獲獎，並點名清華大學學生團隊「GreeNIS」以 NFC 無紙化校園徵才計畫奪得「青年行動獎」首獎；《太報》與《Allnews》進一步詳列「創新解方獎」三家獲獎企業（重生製造、沃畝、蘭芯智能）及 8 家協辦企業名單。\\n\\n「仍不確定」本屆獲獎的海岸建材溯源、珊瑚復育基座及養殖水車變頻分潤模式，後續在全臺各縣市擴大商轉與實際減碳效益的量化數據，仍待後續追蹤評估。\\n\\nTrust label: Multi-source agreement — 《經濟日報》、《太報》與《Allnews》對 11 月 27 日頒獎典禮報導事實一致。\"},\"glossary\":[{\"term\":{\"en\":\"UMC Green Award\",\"zh-TW\":\"聯電綠獎\"},\"blurb\":{\"en\":\"An annual environmental innovation grant launched by United Microelectronics Corporation in 2016 to fund ecological and circular-economy solutions.\",\"zh-TW\":\"聯華電子自 2016 年創辦的年度環境永續獎項，串聯科技供應鏈資金支持生態保育與循環經濟提案落地。\"}},{\"term\":{\"en\":\"Cement-Free Coral Restoration Base\",\"zh-TW\":\"無水泥珊瑚復育基座\"},\"blurb\":{\"en\":\"An artificial reef substrate molded from upcycled oyster shells at room temperature to promote coral larvae settlement without cement emissions.\",\"zh-TW\":\"以廢棄蚵殼為原料在常溫下成型的人工礁體基座，免除傳統水泥碳排並利於珊瑚幼生附著生長。\"}},{\"term\":{\"en\":\"Variable-Frequency Aquaculture Aerator\",\"zh-TW\":\"養殖水車變頻系統\"},\"blurb\":{\"en\":\"Smart motor speed control installed on fish-farm paddlewheel aerators to cut unnecessary full-speed power draw.\",\"zh-TW\":\"加裝於魚塭增氧水車的變頻控制設備，依溶氧需求調節轉速以降低全速空轉耗電。\"}}],\"sources\":[{\"name\":\"經濟日報 UDN\",\"url\":\"https://money.udn.com/money/story/5612/9906000?from=edn_newest_index\"},{\"name\":\"太報 TaiSounds\",\"url\":\"https://www.taisounds.com/news/content/77/312256\"},{\"name\":\"Allnews\",\"url\":\"https://www.allnews.tw/news/97561\"}],\"imageUrl\":\"/covers/live/live-taiwan-176-umc-green-award-11th-ceremony-winners.jpg\",\"imageAlt\":{\"en\":\"Winners of the 11th UMC Green Award ceremony in Taipei showcasing circular economy projects\",\"zh-TW\":\"第十一屆聯電綠獎頒獎典禮表揚11組環境永續創新團隊\"},\"isHeadline\":false,\"isPopular\":true,\"trustScore\":88,\"trustBreakdown\":{\"crossCorroboration\":22,\"outletReputation\":22,\"recencyClarity\":22,\"sourceDiversity\":22},\"publishedAt\":\"2026-11-27T18:24:11.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":22,\"D2\":22,\"D3\":22,\"D4\":22,\"D5\":22,\"total\":22},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-taiwan-176-umc-green-award-11th-ceremony-winners/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-taiwan-176-umc-green-award-11th-ceremony-winners/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi
