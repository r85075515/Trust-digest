 the ticker ANT, in what the feed describes as the largest IPO on record. The debut came a day before Nvidia's stock closed out its longest weekly losing streak since 2008. The feed also puts Anthropic's revenue at $11.6 billion in the second quarter of 2026, against $6.7 billion reported for OpenAI, without saying whether the two figures cover the same period.\nWhy it matters\nThe listing is a stress test for the AI trade. A record debut in a week when the market is punishing AI stocks suggests investors still want exposure to the leading model makers — but at prices set by a falling market, not a rising one. If Anthropic holds up, it sets a benchmark every later AI listing will be measured against.\nSources agree-disagree\nCNBC reports the IPO, the Nvidia losing streak, and the revenue comparison; EE Times covers the listing through the lens of Anthropic's business-to-developer strategy. The two reports agree on the core event and show no numeric or name conflicts. Trust label: Two-source agreement.\nStill uncertain\nThe feed summaries give no offer price, opening price, or first-day close, and no valuation. They also do not say which quarter OpenAI's $6.7 billion figure covers, so the revenue comparison should be read with that gap in mind."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-01-anthropic-s-record-ipo-c\",\"category\":\"finance\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"https://www.eetimes.com/wp-content/uploads/Anthropic-IPO_Source-Nasdaq.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Anthropic’s record IPO collides with tech’s worst week on Wall Street since 2020\",\"zh-TW\":\"相關封面圖：Anthropic 創紀錄的 IPO 與華爾街科技股自 2020 年以來最糟糕的一周相撞\"},\"publishedAt\":\"2026-11-21T16:40:05.000Z\",\"title\":{\"en\":\"Anthropic Lists on Nasdaq in Record IPO as Nvidia Slides\",\"zh-TW\":\"Anthropic 登陸納斯達克創 IPO 紀錄，輝達同週股價連跌\"},\"summary\":{\"en\":\"Anthropic began trading on Nasdaq under the ticker ANT in the largest IPO on record, a day before Nvidia closed out its longest weekly losing streak since 2008. Anthropic reported $11.6 billion in second-quarter 2026 revenue, against $6.7 billion reported for OpenAI. Watch whether the listing steadies a tech market in its worst week since 2020.\",\"zh-TW\":\"Anthropic 以代號 ANT 在納斯達克（Nasdaq）掛牌，創下有史以來最大規模 IPO；掛牌前一天，輝達（Nvidia）剛結束 2008 年以來最長的週線連跌。Anthropic 2026 年第二季營收 116 億美元，對照 OpenAI 公布的 67 億美元。接下來看這次掛牌能否穩住科技股自 2020 年以來最糟的一週。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"Anthropic 在納斯達克（Nasdaq）掛牌，創下有史以來最大規模 IPO，時值華爾街科技股自 2020 年以來最糟的一週。\\n發生了什麼事\\nAnthropic 以代號 ANT 開始交易，摘要稱這是有史以來最大規模 IPO。掛牌前一天，輝達（Nvidia）股價剛結束 2008 年以來最長的週線連跌。摘要也提到 Anthropic 2026 年第二季營收 116 億美元，對照 OpenAI 公布的 67 億美元，但沒說兩筆數字是否涵蓋同一期間。\\n為什麼重要\\n這次掛牌是 AI 概念股的壓力測試。市場正在懲罰 AI 股之際還能創 IPO 紀錄，說明投資人仍想持有領先模型業者——只是定價由下跌的市場決定，而非上漲的市場。Anthropic 若撐得住，將成為往後每一家 AI 掛牌的衡量基準。\\n來源異同\\nCNBC 報導 IPO、輝達連跌與營收對比；EE Times 從 Anthropic 的開發者對企業（B2D）策略切入報導掛牌。兩家對核心事件的說法一致，沒有數字或人名衝突。信任標籤：雙源一致（Two-source agreement）。\\n仍不確定\\n摘要未給發行價、開盤價、首日收盤價，也沒寫估值；也沒說明 OpenAI 的 67 億美元是哪一季，營收對比應保留這個缺口。\"},\"sources\":[{\"name\":\"CNBC\",\"url\":\"https://www.cnbc.com/2026/11/21/anthropic-ipo-tech-selloff.html\"},{\"name\":\"EE Times\",\"url\":\"https://www.eetimes.com/anthropic-ipo-and-the-b2d-strategy/\"}],\"disagreements\":null,\"trustScore\":62,\"trustBreakdown\":{\"sourceDiversity\":13,\"outletReputation\":10,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"finance\",\"live-ingest\",\"cnbc\",\"ee-times\"],\"glossary\":[{\"blurb\":{\"en\":\"US AI company that listed on Nasdaq under the ticker ANT.\",\"zh-TW\":\"美國 AI 公司，以代號 ANT 在納斯達克掛牌。\"},\"term\":{\"en\":\"Anthropic\",\"zh-TW\":\"Anthropic\"}},{\"blurb\":{\"en\":\"US stock exchange where Anthropic began trading.\",\"zh-TW\":\"Anthropic 開始交易的美國證券交易所。\"},\"term\":{\"en\":\"Nasdaq\",\"zh-TW\":\"納斯達克\"}},{\"blurb\":{\"en\":\"US chipmaker whose stock closed out its longest weekly losing streak since 2008.\",\"zh-TW\":\"美國晶片大廠，股價剛結束 2008 年以來最長的週線連跌。
