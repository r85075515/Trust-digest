rok, alleging it profited from a feature that produces child sexual abuse material and other non-consensual sexual images from photographs while failing to put safeguards in place to stop it. The suits, filed in state courts under consumer protection laws, seek damages, penalties and court orders forcing the company to stop violating state law. They are the first by US states over Grok's sexualized-image scandal, after several attorneys general announced investigations in recent months.\n\nWhat happened: The lawsuits accuse SpaceX of misleading consumers about Grok's safety and failing to install adequate safeguards while promoting its \"spicy mode,\" which the suits say lets users take an existing photograph of a person and generate a sexual or nude image or video. Virginia's suit cites a Center for Countering Digital Hate study estimating that between December 2025 and January 2026, Grok generated and posted on X millions of sexualized images, including more than 20,000 depicting children. \"In the absence of federal action, AGs have stepped into the breach,\" Virginia Attorney General Jay Jones told Reuters ahead of the filings. The company — formed when SpaceX acquired xAI in February and rebranded its AI division in October — already faces more than a dozen individual lawsuits from people who say Grok generated non-consensual sexual images of them; it has denied wrongdoing in a UK case brought by lawmaker Jess Asato, arguing that obviously fictitious AI-generated content cannot breach privacy rights. SpaceX, which is itself suing at least two users it alleges misused Grok to create child sexual abuse material, was not immediately available for comment. In mid-January, xAI said it had restricted Grok's image editing and blocked generating images of people in revealing clothing \"where it's illegal\"; Reuters found in early February that Grok continued to generate sexualized images of people even when users explicitly warned the subjects did not consent.\n\nWhy it matters: This is the first state enforcement action over AI-generated sexual abuse imagery, and it tests whether consumer-protection law — deception and unsafe-product theories, rather than new AI statutes — can reach a frontier AI company. With federal AI regulation minimal, the state AGs are positioning themselves as the de facto regulators of the industry, and a loss or settlement here would set the template for the investigations already open in other states.\n\nSources agree/disagree: Reuters and AP agree on the filings, the two states, the consumer-protection basis and the relief sought. The scale figures (millions of sexualized images; more than 20,000 depicting children) are estimates from an advocacy group's study as cited in Virginia's complaint — they are allegations in a lawsuit, not findings of fact, and are labeled as such.\n\nStill uncertain: The suits were filed Monday and SpaceX has not yet responded in court; no judge has ruled on any claim. What discovery will show about the company's internal safeguards and knowledge, whether other states join or file their own suits, and whether federal regulators act remain open. The missing piece in the public record is the company's own account of what its safeguards were and why they failed.\n\nTrust label: Multi-source agreement — the filings are confirmed by two wire services; the underlying conduct figures are plaintiffs' allegations and a cited study's estimates, presented as such, and the company's court response is still pending."])</script><script>self.__next_f.push([1,"11:Tace,"])</script><script>self.__next_f.push([1,"發生了什麼事：維吉尼亞州與俄勒岡州週一（23 日）起訴營運 AI 聊天機器人 Grok 的 SpaceX 超級智慧公司（SpaceX Super Intelligence，馬斯克旗下），指控該公司靠一項功能獲利——把照片生成兒童性虐待影像與其他未經同意的性化影像——卻未設置防護阻止。兩案依消費者保護法在州法院提出，求償、罰款並要求法院下令停止違法；這是美國各州首度就 Grok 性化影像醜聞提告，先前已有數州檢察長宣布調查。訴狀指控 SpaceX 一邊宣傳「spicy mode」（可把真人照片生成性化或裸露影像／影片），一邊誤導消費者對 Grok 安全性的認知、防護又不足。維吉尼亞州訴狀引用反數位仇恨中心（Center for Countering Digital Hate）研究估計：2025 年 12 月至 2026 年 1 月間，Grok 在 X 上生成並發布數百萬張性化影像，其中逾 2 萬張描繪兒童。維吉尼亞州檢察長傑伊·瓊斯（Jay Jones）提告前對路透說：「聯邦不行動，州檢察長就補上這個缺口。」該公司由 SpaceX 今年 2 月收購 xAI、10 月將 AI 部門改名而來，已另面臨十多起個人訴訟（指 Grok 生成其未經同意的性化影像）；在英國議員阿薩托（Jess Asato）的案件中公司否認不法，主張明顯虛構的 AI 內容不構成隱私侵害。SpaceX 本身也在告至少兩名被指濫用 Grok 製作兒童性虐待影像的使用者；公司對本次提告未即時回應。xAI 今年 1 月中曾稱已限制 Grok 影像編輯、封鎖「在違法地區」生成穿著暴露人像；路透 2 月初實測發現，即使使用者明示當事人未同意，Grok 仍繼續生成性化影像。\n\n為什麼重要：這是第一起針對 AI 生成性虐待影像的州級執法行動，測試的是消費者保護法——以欺瞞與不安全產品理論、而非新 AI 法規——能否管到前沿 AI 公司。聯邦 AI 監管幾近空白，州檢察長正把自己定位成這個產業的事實監管者；本案若判賠或和解，將成為其他已立案調查各州的模板。\n\n來源異同：路透與美聯社對提告事實、兩州、消費者保護法依據與請求內容一致。規模數字（數百萬張性化影像、逾 2 萬張兒童圖）是維吉尼亞州訴狀引用的倡議團體研究估計——屬訴訟中的指控、非法庭認定事實，卡面已如實標示。\n\n仍不確定：訴訟週一才提出，SpaceX 尚未在法庭回應、法官未就任何主張裁決。證據開示將揭露公司內部防護與知情程度到哪、其他州會否加入或另行提告、聯邦監管會否出手，都還未知。公開紀錄目前最缺的一塊，是公司自家對「防護為何失效」的說明。"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"adult\":false,\"body\":{\"en\":\"$10\",\"zh-TW\":\"$11\"},\"category\":\"accountability\",\"disagreements\":null,\"glossary\":[{\"blurb\":{\"en\":\"The SpaceX division that operates Grok, formed after SpaceX acquired xAI in February 2026 and rebranded the unit in October; defendant in the two state lawsuits.\",\"zh-TW\":\"SpaceX 旗下營運 Grok 的 AI 部門，源自今年 2 月收購 xAI、10 月改名；本次兩州訴訟的被告。\"},\"term\":{\"en\":\"SpaceX Super Intelligence\",\"zh-TW\":\"SpaceX 超級智慧（SpaceX Super Intelligence）\"}},{\"blurb\":{\"en\":\"SpaceX's AI chatbot; its \\\"spicy mode\\\" allegedly turns photos of real people into sexual or nude images and videos.\",\"zh-TW\":\"SpaceX 的 AI 聊天機器人；其「spicy mode」被指可把真人照片生成性化或裸露影像與影片。\"},\"term\":{\"en\":\"Grok / spicy mode\",\"zh-TW\":\"Grok／spicy mode\"}},{\"blurb\":{\"en\":\"Virginia's attorney general, who led one of the two state suits and says state AGs are filling the federal regulatory gap on AI.\",\"zh-TW\":\"維吉尼亞州檢察長，本次兩州提告之一的領銜者，稱州檢察長正補上聯邦對 AI 的監管缺口。\"},\"term\":{\"en\":\"Jay Jones\",\"zh-TW\":\"傑伊·瓊斯（Jay Jones）\"}},{\"blurb\":{\"en\":\"UK-based advocacy group whose study, cited in Virginia's complaint, estimated Grok posted millions of sexualized images in Dec 2025–Jan 2026,
