s are widely expected to extend existing crude oil output targets into at least the first quarter of 2027. However, negotiations over an independent capacity assessment conducted by US consultancy DeGolyer and MacNaughton—intended to set 2027 production baselines—have stalled, with Iraq challenging its preliminary 4.9 million-barrel-per-day capacity figure and Kazakhstan also disputing its evaluation.\n\nWhy it matters\nRecognized maximum sustainable production capacity determines each member's future quota share within OPEC+, especially after the United Arab Emirates exited the group earlier in 2026. Iraqi Oil Minister Basim Mohammed Khudair (巴西姆・穆罕默德・胡代爾) has insisted Iraq can reach 5.2 million barrels per day against its 4.431 million-barrel quota, while ongoing Middle East conflict disruptions complicate physical export verification.\n\nSource comparison\nProfile News, Quartz, and Energy News all reported on the November 29 OPEC+ meeting outlook and Iraq's capacity dispute. Profile News and Energy News emphasized expectations that ministers will freeze output targets into early 2027 while Iraq and Kazakhstan contest preliminary assessments; Quartz specifically detailed Oil Minister Basim Mohammed Khudair's letter claiming 5.2 million barrels per day of capacity and Baghdad's earlier exit threat.\n\nWhat remains uncertain\nNo final decision has been announced ahead of Sunday's online meeting, and it remains unclear how OPEC+ will resolve the gap between independent capacity audits and member claims before existing production arrangements expire at the end of 2026.\n\nTrust label: Multi-source agreement — Corroborated by Profile News, Quartz, and Energy News reporting on the November 29 OPEC+ meeting and quota dispute."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-energy-129-opec-plus-nov-29-meeting-quota-dispute\",\"category\":\"energy\",\"title\":{\"en\":\"OPEC+ Set to Hold Output Steady Ahead of Nov. 29 Meeting as Iraq, Kazakhstan Dispute Quotas\",\"zh-TW\":\"OPEC+ 11 月 29 日會議前夕料維持產量不變 伊拉克與哈薩克對 2027 年配額基準提出異議\"},\"summary\":{\"en\":\"OPEC+ ministers are expected to hold crude oil production targets steady into early 2027 at their November 29 meeting, while Iraq and Kazakhstan challenge preliminary capacity assessments meant to guide 2027 baselines amid Middle East export disruptions. One-sentence takeaway: Internal disputes over capacity audits and Middle East supply risks are keeping OPEC+ cautious on changing output quotas.\",\"zh-TW\":\"石油輸出國組織與盟國（OPEC+）預計於 2026 年 11 月 29 日部長級會議維持現有原油產量目標至 2027 年初，但伊拉克與哈薩克已對攸關 2027 年生產配額基準的初步產能評估數據提出異議，同時中東衝突干擾原油出口也讓聯盟在調整產量政策上更趨審慎。一句重點結論：成員國產能評估分歧與中東出口中斷風險，使 OPEC+ 傾向按兵不動並延後配額重劃。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n在 2026 年 11 月 29 日舉行的第 42 屆石油輸出國組織與非 OPEC 產油國（OPEC+）部長級線上會議前夕，市場普遍預期各產油國將把現行原油產量目標至少延長至 2027 年第一季。不過，委由美國顧問公司 DeGolyer and MacNaughton 執行、原本用於制定 2027 年生產基準的產能評估審查陷入僵局，伊拉克對每日 490 萬桶的初步產能估值提出異議，哈薩克亦要求調高自身產能評估。\\n\\n「為什麼重要」\\n獲認可的最大永續產能直接決定各成員國未來在 OPEC+ 內部的配額比重，尤其在阿拉伯聯合大公國於 2026 年稍早退出該組織後更顯敏感。伊拉克石油部長巴西姆・穆罕默德・胡代爾（Basim Mohammed Khudair）致函 OPEC 堅稱該國產能可達每日 520 萬桶，遠高於其現行每日 443.1 萬桶配額；同時中東衝突導致的出口中斷也使實際產能核實更形複雜。\\n\\n「來源異同」\\n財經媒體 Profile News、Quartz 與 Energy News 均報導 29 日 OPEC+ 會議前夕的凍產預期與伊拉克產能爭議；Profile News 與 Energy News 著重聯盟預計將現行產量目標延續至 2027 年初、以及伊拉克與哈薩克雙雙挑戰初步產能評估，Quartz 則具體點出石油部長巴西姆・穆罕默德・胡代爾（Basim Mohammed Khudair）主張每日 520 萬桶產能及巴格達先前揚言退群的背景。\\n\\n「仍不確定」\\n在週日正式會議召開前尚無最終決議，現行減產與配額框架將於 2026 年底到期，OPEC+ 能否在年底前彌合獨立產能審計與成員國自報數字的落差仍有待觀察。\"},\"glossary\":[{\"term\":{\"en\":\"OPEC+ Production Baseline\",\"zh-TW\":\"OPEC+ 產量基準線\"},\"blurb\":{\"en\":\"The reference crude oil output level assigned to each member country from which agreed production cuts or increases are calculated.\",\"zh-TW\":\"分配給各產油成員國的參考日產量基準，作為計算減產幅度或增產配額的基準線。\"}},{\"term\":{\"en\":\"Maximum Sustainable Capacity\",\"zh-TW\":\"最大永續產能\"},\"blurb\":{\"en\":\"The highest daily volume of crude oil a country can produce continuously over an extended period without damaging its oil reservoirs.\",\"zh-TW\":\"產油國在不損害油田儲層壓力的前提下，能夠長期穩定維持的最高每日原油開採量。\"}},{\"term\":{\"en\":\"Secondary Sources\",\"zh-TW\":\"次級數據來源\"},\"blurb\":{\"en\":\"Independent energy consultancies, pricing agencies, and international bodies used by OPEC+ to objectively monitor member countries' actual oil output.\",\"zh-TW\":\"OPEC+ 用於客觀監測各成員國實際原油產量的獨立能源顧問機構、報價機構與國際能源組織數據。\"}}],\"sources\":[{\"name\":\"Profile News\",\"url\":\"https://www.profilenews.com/en/opec-meeting-november-29-2026-oil-quotas/\"},{\"name\":\"Quartz\",\"url\":\"https://qz.com/iraq-opec-oil-production-ceiling-talks-112726\"},{\"name\":\"Energy News\",\"url\":\"https://energynews.pro/en/opec-reportedly-set-to-freeze-output-targets-as-iraq-disputes-capacity-assessment\"}],\"imageUrl\":\"/covers/live/live-energy-129-opec-plus-nov-29-meeting-quota-dispute.jpg\",\"imageAlt\":{\"en\":\"Crude oil storage tanks and pipeline infrastructure representing OPEC+ supply negotiations\",\"zh-TW\":\"原油儲槽與輸油管線設施象徵 OPEC+ 產量配額協商\"},\"isHeadline\":true,\"isPopular\":true,\"trustScore\":87,\"trustBreakdown\":{\"crossCorroboration\":23,\"outletReputation\":22,\"recencyClarity\":22,\"sourceDiversity\":20},\"publishedAt\":\"2026-11-27T16:26:49.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":5,\"D2\":4,\"D3\":5,\"D4\":4,\"D5\":4,\"total\":22},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-energy-129-opec-plus-nov-29-meeting-quota-dispute/\"}],[\"$\",\"me
