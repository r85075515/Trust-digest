ian vessels into a temporary 800-meter (2,600-foot) floating bridge in Dacheng Bay, Fujian Province. According to Reuters analysis reported by Taiwan News and The Times of India, the vessels repeatedly maneuvered around the bay to assemble and dismantle the floating causeway designed to move troops and heavy equipment ashore.\n\nTaiwan's Ministry of National Defense stated that it was aware of China's military activities in Dacheng Bay. Defense analysts view the repeated assembly and dismantling of civilian-linked causeways near Taiwan as an effort to expand amphibious landing options beyond traditional port facilities.\n\nTaiwan News, The Times of India, and Internazionale all cite the same Planet Labs PBC satellite imagery from November 1 to 16 and Reuters reporting, with no substantive discrepancies in the length of the bridge or the location of the drill.\n\nThe exact number of troops and types of heavy vehicles moved across the temporary structure during the November exercises have not been publicly disclosed by Beijing or Taipei.\n\nTrust label: Multi-source agreement — Taiwan News, The Times of India, and Internazionale report identical Planet Labs satellite measurements and dates from Reuters."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-061-china-floating-bridge-amphibious-drill\",\"category\":\"taiwan\",\"title\":{\"en\":\"Satellite Imagery Shows China Testing 800-Meter Civilian Floating Bridge in Fujian Drills\",\"zh-TW\":\"衛星影像揭露共軍於福建演訓測試 800 公尺民船浮橋登陸戰術\"},\"summary\":{\"en\":\"Satellite imagery from November 1 to 16 analyzed by Reuters reveals Chinese forces linking civilian vessels into an 800-meter floating causeway during amphibious exercises in Fujian's Dacheng Bay. Taiwan's Ministry of National Defense confirmed it is monitoring the activities, which signal evolving cross-strait landing logistics.\",\"zh-TW\":\"路透社分析 11 月 1 日至 16 日的衛星影像發現，共軍在福建大埕灣兩棲登陸演訓期間，利用民用船隻拼接成約 800 公尺長的臨時浮橋以運送兵力與重型裝備。國防部表示已掌握相關動態，顯示共軍正持續驗證軍民融合跨海投送戰術。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n根據《Taiwan News》、《印度時報》（The Times of India）與義大利《國際報》（Internazionale）引述路透社對 Planet Labs PBC 衛星影像的分析，2026 年 11 月 1 日至 16 日期間，共軍在福建省大埕灣舉行兩棲登陸演訓時，調動多艘民用船隻在海面上反覆集結並拼接成一座約 800 公尺（2,600 英尺）長的臨時浮橋，隨後再進行拆解，藉此演練將部隊與重型裝備直接投送上岸。\\n「為什麼重要」\\n大埕灣位於福建南部沿海，鄰近台灣海峽南端。共軍繼去年 8 月在廣東沿海進行類似測試後，再度於福建演練以民船組裝長距離浮橋，顯示其正試圖突破傳統正規港口與灘頭地形限制，擴大兩棲登陸的投送能量；我國防部亦證實對大埕灣周邊共軍動態有所掌握。\\n「來源異同」\\n各家媒體均援引路透社針對 11 月 1 日至 16 日 Planet Labs 衛星照片的判讀結果，對於演訓地點（福建大埕灣）、浮橋長度（約 800 公尺）及民船改裝用途的描述完全一致，無事實衝突。\\n「仍不確定」\\n目前北京與台北官方均未公開此次演訓實際動員的民船確切數量，以及浮橋在實測中承載重型裝甲車輛的具體噸位與通行效率。\"},\"glossary\":[{\"term\":{\"en\":\"Floating causeway\",\"zh-TW\":\"臨時浮橋（棧橋）\"},\"blurb\":{\"en\":\"A temporary bridge structure formed by linking vessels or pontoons to transfer troops and heavy vehicles from ship to shore.\",\"zh-TW\":\"由船隻或浮箱首尾相接構成的海上臨時通道，用於將部隊與重型裝備從海上直接運送上岸。\"}},{\"term\":{\"en\":\"Dacheng Bay\",\"zh-TW\":\"大埕灣\"},\"blurb\":{\"en\":\"A coastal bay in southern Fujian Province facing the Taiwan Strait, frequently used for Chinese amphibious training.\",\"zh-TW\":\"位於中國福建省南部沿海的海灣，面向台灣海峽南端，為共軍常態進行兩棲登陸訓練的海域。\"}},{\"term\":{\"en\":\"Amphibious landing drill\",\"zh-TW\":\"兩棲登陸演訓\"},\"blurb\":{\"en\":\"Military exercises focused on projecting ground forces and equipment from naval or civilian vessels onto hostile or unimproved coastlines.\",\"zh-TW\":\"演練從海上艦艇或民船將地面部隊與裝備投送至岸灘的聯合作戰軍事演習。\"}}],\"sources\":[{\"name\":\"Taiwan News\",\"url\":\"https://www.taiwannews.com.tw/en/news/6481732\"},{\"name\":\"The Times of India\",\"url\":\"https://timesofindia.indiatimes.com/defence/international/swift-seizure-of-small-islands-chinas-amphibious-drill-using-civilian-ships-threatens-taiwan/articleshow/136214056.cms\"},{\"name\":\"Internazionale\",\"url\":\"https://www.internazionale.it/ultime-notizie-reuters/2026/11/27/chinese-military-tests-new-taiwan-landing-tactics-in-coastal-drills\"}],\"imageUrl\":\"/covers/live/live-taiwan-061-china-floating-bridge-amphibious-drill.jpg\",\"imageAlt\":{\"en\":\"Satellite imagery showing civilian vessels linked into an 800-meter floating bridge in Dacheng Bay, Fujian\",\"zh-TW\":\"福建大埕灣民船拼接成 800 公尺浮橋的衛星影像\"},\"isHeadline\":true,\"isPopular\":true,\"trustScore\":88,\"trustBreakdown\":{\"crossCorroboration\":23,\"outletReputation\":22,\"recencyClarity\":22,\"sourceDiversity\":21},\"publishedAt\":\"2026-11-27T14:47:18.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":5,\"D2\":4,\"D3\":5,\"D4\":4,\"D5\":4,\"total\":22},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-taiwan-061-china-floating-bridge-amphibious-drill/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-taiwan-061-china-floating-bridge-amphibious-drill/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><s
