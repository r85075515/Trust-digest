huang (王嘉煌) and Global Business Vice President Chen Shao-kun (陳紹焜) revealed that the company has qualified as an approved vendor and received requests for quotation from a second major U.S. x86 processor maker after achieving progress in October. WinWay reported cumulative revenue surpassing NT$10 billion in the first three quarters of 2026—a 25-year company record—with AI and high-performance computing (HPC) accounting for over 70 percent of revenue in the first ten months.\n\n「Why it matters」\n Next-generation AI accelerators and server processors are scaling beyond 20,000 pins and package sizes exceeding 150 mm by 150 mm, lengthening test times and tightening global test-socket capacity. Covering both major U.S. x86 CPU vendors alongside all four global hyperscale cloud providers strengthens WinWay's position in advanced packaging test interfaces.\n\n「Source differences」\n Economic Daily News (經濟日報) published \"穎崴法說會／攻下美系x86 大客戶明年貢獻營收、毛利率瞄準50%\", highlighting the breakthrough with the second U.S. x86 integrated device manufacturer (IDM), parity between CPU and GPU revenue next year, and a 50 percent gross margin target. Anue (鉅亨網) published \"〈穎崴法說〉董座：客戶需求非常積極 明年營運成長估雙位數以上\", detailing package sizes exceeding 150 mm by 150 mm, pin counts over 20,000, and WinWay's focus on back-end final test insertions 3 and 4.\n\n「Still uncertain」\n Front-end wafer-level CPU testing involves complex equipment specifications and process variables that will require additional engineering qualification time before reaching volume contribution.\n\nTrust label: Multi-source agreement — Economic Daily News and Anue independently report from WinWay's November 26 investor conference with matching executive figures and customer milestones."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-279-winway-ai-testing-x86-breakthrough\",\"category\":\"semiconductor\",\"title\":{\"en\":\"Taiwan Chip-Testing Maker WinWay Wins Second US x86 Client, Targets 50% Gross Margin\",\"zh-TW\":\"穎崴打入第二家美系x86處理器大廠供應鏈 明年營收拚雙位數成長\"},\"summary\":{\"en\":\"Taiwanese semiconductor test-interface supplier WinWay Technology announced at its November 26, 2026 investor conference that it entered the qualified vendor list of a second major U.S. x86 processor maker and plans capacity expansion to meet surging AI and high-pin-count chip testing demand.\",\"zh-TW\":\"台灣半導體測試介面大廠穎崴（6515）於2026年11月26日法說會宣布，已成功進入第二家美系x86處理器大廠合格供應商名單並取得報價請求，預計明年開始貢獻營收，同時受惠AI與超大封裝晶片測試需求暴增，明年營運目標維持雙位數以上成長。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n半導體測試介面廠穎崴（6515）於2026年11月26日舉行法人說明會，董事長王嘉煌（Wang Chia-huang）與全球業務副總經理陳紹焜（Chen Shao-kun）宣布，公司在今年10月取得關鍵進展，已正式進入第二家美系x86處理器整合元件製造商（IDM）的合格供應商名單並取得報價請求（RFQ），預計明年開始貢獻營收。穎崴今年前三季累計營收提前突破新台幣100億元創成立25年新高，前10月AI與高效能運算（HPC）營收占比已逾七成。\\n\\n「為什麼重要」\\n隨著新一代AI晶片朝高功耗、超大尺寸封裝（超過150毫米乘150毫米）與超過2萬個接腳數（Pin Count）演進，單顆晶片測試時間大幅拉長。穎崴同時囊括美國兩大x86處理器業者與全球四大雲端服務供應商客戶，鞏固其在高階封裝後段測試介面的關鍵地位。\\n\\n「來源異同」\\n經濟日報報導標題為「穎崴法說會／攻下美系x86 大客戶明年貢獻營收、毛利率瞄準50%」，聚焦打入第二家美系x86處理器大廠、明年CPU與GPU營收規模可望相當，以及毛利率瞄準50%目標；鉅亨網標題為「〈穎崴法說〉董座：客戶需求非常積極 明年營運成長估雙位數以上」，詳述封裝尺寸大於150mm x 150mm、腳數破2萬Pin的技術規格，以及公司現階段聚焦封裝後段測試Insertion 3與4的布局。\\n\\n「仍不確定」\\n前端製程CPU測試涉及複雜設備規格與製程變數，仍需一段工程導入時間，短期內營收貢獻仍以封裝後段測試為主。\\n\\nTrust label: Multi-source agreement — 經濟日報與鉅亨網均引述11月26日穎崴法說會公開資訊，對美系x86新客戶進展、AI營收占比與明年雙位數成長展望完全一致。\"},\"glossary\":[{\"term\":{\"en\":\"Test Socket / Test Interface\",\"zh-TW\":\"半導體測試座／測試介面\"},\"blurb\":{\"en\":\"Precision electromechanical connectors linking packaged integrated circuits to automated test equipment without soldering.\",\"zh-TW\":\"在無需焊接的情況下，將封裝後晶片精密連接至自動化測試機台進行電性與功能驗證的關鍵耗材組件。\"}},{\"term\":{\"en\":\"Pin Count\",\"zh-TW\":\"接腳數（Pin Count）\"},\"blurb\":{\"en\":\"The total number of electrical input/output contacts on a semiconductor package, which rises sharply in high-bandwidth AI processors.\",\"zh-TW\":\"單顆晶片封裝上的電性訊號與電源接點總數，高頻寬AI與伺服器處理器的接腳數正快速突破2萬Pin。\"}},{\"term\":{\"en\":\"Integrated Device Manufacturer (IDM)\",\"zh-TW\":\"整合元件製造商\"},\"blurb\
