Morning Futures\" that the board needs to \"go outside the company\" to find its next chief executive. \"This makes me think that as the board conducts a search for a new leader that they need to go outside the company, that just (with) what was going on inside the company, they need a dramatic shakeup,\" Bessent said. He went further on compliance: Nvidia's board and its outside counsel need to answer, within the next 10 days, questions about the company's culture of compliance with export restrictions. \"And I think we need answers in the next 10 days from the board and from the outside counsel,\" he said.\n\nWhat happened: Jensen Huang (黃仁勳) stepped down as president, CEO and director on Thursday (Nov 12) after revelations of extramarital affairs, including one involving Alice Huang (黃樂), a businesswoman US officials suspect of working for Chinese intelligence - a scandal this site has tracked through 17 cards. CFO Colette Kress (克雷斯) is interim CEO and Harvey C. Jones (瓊斯) chairs the board's search, which the company said would consider internal and external candidates. Reuters also reported, citing the Financial Times, that the board has approached Arm Holdings CEO Rene Haas (哈斯) about the job.\n\nWhy it matters: A sitting Treasury secretary publicly steering the succession of the world's most important AI chipmaker - and attaching a 10-day deadline on export-compliance answers - moves the Huang scandal from a corporate governance crisis into direct government pressure. The compliance question is the sharp end: the outside counsel Bessent named is the same Wachtell team the board hired to investigate Huang, and its answers will land while Congress prepares December testimony from Huang, general counsel Tim Teter (泰特) and Commerce Secretary Howard Lutnick (盧特尼克). Nvidia's Q3 earnings are due Tuesday, Nov 17, with Kress hosting her first call.\n\nSources agree / disagree: Reuters, the Wall Street Journal, Barron's and the New York Post all carried Bessent's outside-CEO and dramatic-shakeup remarks and the 10-day compliance demand in materially identical terms; no outlet reported a Nvidia response, and none reported that the board has agreed to restrict its search to outsiders.\n\nStill uncertain: Whether the board will follow Bessent's steer or treat it as political pressure; what exactly the government wants answered about export-compliance culture and what happens if the 10 days pass; whether Haas or another outsider is a serious candidate; and Nvidia's position, which had not been stated in the coverage reviewed.\n\nTrust label: Multi-source agreement - a named cabinet secretary's on-the-record remarks on a named program, carried consistently by Reuters and multiple independent outlets the same day."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"adult\":false,\"body\":{\"en\":\"$10\",\"zh-TW\":\"發生了什麼事：美國財政部長貝森特（Scott Bessent）週日（11/15）在 Fox News「Sunday Morning Futures」節目公開介入輝達接班危機，直言董事會找新任執行長「必須從公司外部找人」（go outside the company）：「想到公司內部先前發生的那些事，他們需要一場戲劇性的改組（dramatic shakeup）。」他並對合規下通牒：輝達董事會與其外部律師須在未來 10 天內，就公司遵守出口限制的合規文化回答政府提問——「我認為我們需要在未來 10 天內，從董事會與外部律師那裡得到答案。」黃仁勳（Jensen Huang）已於週四（11/12）因婚外情醜聞（其中一段對象黃樂（Alice Huang）被美方懷疑替中國情報工作）辭去總裁、執行長與董事；財務長克雷斯（Colette Kress）臨時接任，董事長瓊斯（Harvey C. Jones）主持遴選，公司原宣示內外部人選都會考慮。路透另引《金融時報》指董事會已接觸 Arm 執行長哈斯（Rene Haas）。\\n\\n為什麼重要：現任財政部長公開指揮全球最重要 AI 晶片公司的接班方向、還附上 10 天的合規答覆期限，醜聞已從公司治理危機升級為政府直接施壓。被點名的「外部律師」正是董事會聘來調查黃仁勳的 Wachtell 團隊；其答覆將落在國會 12 月連串作證（黃仁勳、法務長泰特、商務部長盧特尼克）之前。輝達 Q3 財報週二（11/17）登場，是克雷斯主持的第一場法說。\\n\\n來源異同：路透、《華爾街日報》、Barron's、《紐約郵報》對貝森特的「外部執行長」「戲劇性改組」與 10 天期限說法一致；各家皆未見輝達回應，也未報導董事會已同意只找外部人選。\\n\\n仍不確定：董事會會照貝森特的方向走、還是視為政治壓力；政府究竟要問哪些合規文化問題、10 天屆滿未答有何後果；哈斯等外部人選是否認真進入名單；輝達官方立場（查證時尚未表態）。\"},\"category\":\"semiconductor\",\"disagreements\":null,\"glossary\":[{\"blurb\":{\"en\":\"US Treasury Secretary who publicly demanded Nvidia hire an outside CEO and answer export-compliance questions within 10 days.\",\"zh-TW\":\"美國財政部長，公開要求輝達從外部聘任新執行長、並在 10 天內回答出口合規問題。\"},\"term\":{\"en\":\"Scott Bessent\",\"zh-TW\":\"貝森特（Scott Bessent）\"}},{\"blurb\":{\"en\":\"The world's leading AI chipmaker, searching for a permanent CEO after its founder's scandal-driven resignation.\",\"zh-TW\":\"全球 AI 晶片龍頭，創辦人因醜聞辭職後正遴選正式執行長。\"},\"term\":{\"en\":\"Nvidia\",\"zh-TW\":\"輝達（Nvidia）\"}},{\"blurb\":{\"en\":\"Nvidia's CFO, serving as interim CEO while the board runs its search.\",\"zh-TW\":\"輝達財務長，董事會遴選期間臨時接任執行長。\"},\"term\":{\"en\":\"Colette Kress\",\"zh-TW\":\"克雷斯（Colette Kress）\"}},{\"blurb\":{\"en\":\"Arm Holdings' chief executive, reported by the Financial Times to have been approached by Nvidia's board about the CEO job.\",\"zh-TW\":\"Arm 執行長，《金融時報》指輝達董事會已就執行長職位與他接觸。\"},\"term\":{\"en\":\"Rene Haas\",\"zh-TW\":\"哈斯（Rene Haas）\"}},{\"blurb\":{\"en\":\"The internal culture and controls by which a company obeys export restrictions - the subject of Bessent's 10-day demand for answers.\",\"zh-TW\":\"公司遵守出口限制的內部文化與控管，正是貝森特要求 10 天內答覆的對象。\"},\"term\":{\"en\":\"Export-compliance culture\",\"zh-TW\":\"出口合規文化（Export-compliance culture）\"}}],\"id\":\"live-semiconductor-18-bessent-nvidia-outside-ceo\",\"imageAlt\":{\"en\":\"\",\"zh-TW\":\"\"},\"imageUrl\":\"\",\"isHeadline\":true,\"isPopular\":false,\"publishedAt\":\"2026-11-15T21:47:45.000Z\",\"sources\":[{\"name\":\"Reuters\",\"url\":\"https://www.reuters.com/world/bessent-says-nvidia-must-go-outside-company-find-new-ceo-2026-11-15/\"},{\"name\":\"Reuters via KWSN\",\"url\":\"https://kwsn.com/2026/11/15/bessent-says-nvidia-must-go-outside-the-company-to-find-new-ceo/\"}],\"summary\":{\"en\":\"Treasury Secretary Scott Bessent told Fox News on Sunday that Nvidia's board must \\\"go outside the company\\\" for its next CEO - \\\"they need a dramatic shakeup\\\" - and gave the board and its outside counsel 10 days to answer questions about the company's culture of compliance with export restrictions, escalating the Huang scandal into direct government pressure on the succession.\",\"zh-TW\":\"美國財政部長貝森特（Scott Bessent
