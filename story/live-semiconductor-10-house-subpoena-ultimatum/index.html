if Huang does not respond. The deadline has now passed with no public response from Huang or Nvidia, and no subpoena has yet been issued.\nWhat happened\nThe escalation has been building for a week. On Nov 4, Mast (Foreign Affairs), Moolenaar (Select Committee on China) and Rick Crawford (Intelligence) asked Huang to appear for a joint closed-door briefing on Nov 18 about the Alice Huang relationship and Nvidia's security protocols against foreign espionage. Huang did not publicly respond. On Tuesday, Mast told ABC News he was 'absolutely' prepared to subpoena Huang if there was no response by Wednesday. On Wednesday, Moolenaar set the 5 p.m. ET deadline on television, and Bloomberg reported via TechCrunch that Congress is gearing up to subpoena him. Reuters adds, citing a person familiar with the discussions, that the lawmakers are unlikely to allow Nvidia's general counsel to answer on Huang's behalf. Nvidia did not immediately respond to requests for comment.\nWhy it matters\nA subpoena would convert a voluntary briefing into a legal compulsion hanging over Huang in the same week his board is reportedly deciding whether to remove him, and it would land one day after Nvidia's Nov 17 earnings if the Nov 18 date holds. It also hardens the political frame: the chairs are no longer asking what Nvidia's safeguards are, but whether its CEO will personally account for a relationship US intelligence flagged - and their patience has visibly run out before the board's own investigation reports. One timing wrinkle cuts the other way: House Republicans lose control of these committees in January, so a subpoena issued now would likely expire and need reissuing by the incoming Democratic majority. The takeaway: Huang now faces three clocks at once - his board, his earnings date, and a congressional deadline he has already let pass in silence.\nSources agree / disagree\nReuters, Bloomberg (via TechCrunch) and ABC News all report the same escalation with the lawmakers speaking on the record or through spokespeople; there is no competing account. All outlets are careful - and so is this card - that a subpoena has been threatened and is being prepared, not issued, and that Huang has not publicly responded. Trust label: Multi-source agreement - on-record statements by the committee chairs, reported by Reuters and Bloomberg.\nStill uncertain\nWhether a subpoena is actually issued and by which committee (rules vary), whether Huang replies privately or agrees to another date, and whether the Nov 18 briefing happens at all remain open. Any response from Huang or Nvidia would materially update this card."])</script><script>self.__next_f.push([1,"11:Tb3c,"])</script><script>self.__next_f.push([1,"美國眾議院三個委員會的共和黨主席，對輝達執行長黃仁勳親自說明與疑似中國情報人員黃樂的關係，下了最後通牒。中國問題特別委員會主席穆勒納爾（John Moolenaar）週三（11 月 11 日）在 Fox Business 表示，黃仁勳必須在當天美東時間下午 5 點前答覆是否出席 11 月 18 日的閉門簡報、或提出其他日期——「如果他不同意、也不提出替代日期，我相信很可能會對他發出傳票。」外交委員會主席馬斯特（Brian Mast）則表示，他的委員會正備妥傳票，只待黃仁勳不回覆就送出。期限現已屆滿，黃仁勳與輝達都沒有公開回應，傳票也尚未正式發出。\n發生了什麼事\n這波升級已醞釀一週。11 月 4 日，馬斯特（外交委員會）、穆勒納爾（中國問題特別委員會）與克勞福德（Rick Crawford，情報委員會）聯名要求黃仁勳於 11 月 18 日出席三委員會聯合閉門簡報，說明黃樂案與輝達防範外國間諜的安全規程。黃仁勳未公開回應。週二，馬斯特對 ABC News 表示，若週三前沒回覆，他「絕對」準備發傳票。週三，穆勒納爾在電視上定下美東 5 點的期限；彭博經 TechCrunch 報導，國會正著手準備傳喚。路透社另引述熟悉內情的人士指出，議員們不太可能接受由輝達法務長代為答覆。輝達對媒體的置評請求未立即回應。\n為什麼重要\n傳票一旦發出，自願性質的簡報就變成法律強制，時間點又正好壓在董事會據報決定去留的同一週；若 18 日的日期不變，簡報就在 11 月 17 日財報的隔天。這也讓政治定性變硬：主席們問的不再只是輝達的防護規程，而是執行長本人要不要為一段被美國情報標記的關係親自交代——而且他們的耐心，顯然在董事會調查交卷之前就先耗盡了。另一面有個時間變數：共和黨明年 1 月將失去這些委員會的主導權，現在發出的傳票很可能到期失效、須由接手的民主黨多數重新發出。結論是：黃仁勳現在同時面對三個時鐘——董事會、財報日、以及一個他已經沉默錯過的國會期限。\n來源異同\n路透社、彭博（經 TechCrunch）與 ABC News 報導同一波升級，議員本人或發言人都是具名發言，沒有互相矛盾的版本。各家也都謹慎區分——本卡同樣如此——傳票是「揚言發出、正在準備」，尚未正式發出；黃仁勳尚未公開回應。信任標籤：多源一致——委員會主席的公開發言，路由透社與彭博報導。\n仍不確定\n傳票是否真的發出、由哪個委員會發（各委員會規則不同）、黃仁勳是否私下回覆或改期、18 日簡報是否照辦，全都未明。黃仁勳或輝達的任何回應都會實質更新本卡。"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"adult\":false,\"body\":{\"en\":\"$10\",\"zh-TW\":\"$11\"},\"category\":\"semiconductor\",\"disagreements\":null,\"glossary\":[{\ sed with no public response; no subpoena has been issued yet.\",\"zh-TW\":\"美國眾議院三位共和黨委員會主席給輝達執行長黃仁勳下最後通牒：須在週三美東下午 5 點前答覆是否出席 11 月 18 日閉門簡報說明黃樂案，或提出其他日期；中國問題特別委員會主席穆勒納爾表示，否則很可能發出傳票，外交委員會主席馬斯特稱傳票已在準備。議員也不接受由輝達法務長代答。期限已過、黃仁勳未公開回覆，傳票尚未發出。\"},\"tags\":[\"semiconductor\",\"live-ingest\",\"breaking\",\"nvidia\",\"congress\",\"subpoena\"],\"title\":{\"en\":\"House Ultimatum to Huang: Answer the Briefing Request or Face a Subpoena\",\"zh-TW\":\"眾院下最後通牒：黃仁勳不答覆閉門簡報，就發傳喚\"},\"trustBreakdown\":{\"crossCorroboration\":20,\"outletReputation\":20,\"recencyClarity\":20,\"sourceDiversity\":20},\"trustScore\":80}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-semiconductor-10-house-subpoena-ultimatum/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-semiconductor-10-house-subpoena-ultimatum/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable
