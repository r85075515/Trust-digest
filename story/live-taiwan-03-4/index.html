ine Bureau of Immigration agents arrested four Taiwanese men on October 29 in Mandaue City, a major city in the central Philippines, on suspicion of online fraud. The operation was carried out at the request of Taiwan's representative office in the Philippines and the Criminal Investigation Bureau. The suspects are awaiting deportation.\nWhy it matters\nOnline scam networks operate across borders, so enforcement has to as well. The case is a small, concrete example of the routine cooperation that has built up between Taipei and Manila: a request, an arrest, and a deportation queue, rather than a diplomatic incident.\nSources agree / disagree\nThis is a single CNA item with no corroborating outlet in the cluster. Trust label: Single source — one CNA item, with no second outlet in the cluster.\nStill uncertain\nThe snippet does not name the suspects, detail the alleged scam, or say when deportation will happen or whether the case connects to a larger network. Those details need fuller reporting."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-03-4\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-taiwan-03-4.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 台菲聯手打擊網路詐騙　菲律賓移民局再逮4台男\",\"zh-TW\":\"相關封面圖：台菲聯手打擊網路詐騙　菲律賓移民局再逮4台男\"},\"publishedAt\":\"2026-11-15T07:24:57.000Z\",\"title\":{\"en\":\"Taiwan and the Philippines Team Up on Scams: 4 Taiwanese Men Arrested in Mandaue\",\"zh-TW\":\"台菲聯手打詐：菲律賓移民局在曼達威再逮 4 台男\"},\"summary\":{\"en\":\"Philippine immigration officers arrested four Taiwanese men suspected of online fraud in Mandaue City on October 29, acting on a request from Taiwan's representative office and its Criminal Investigation Bureau, CNA reports. The suspects await deportation. Takeaway: cross-border scam enforcement is now routine cooperation.\",\"zh-TW\":\"中央社報導，菲律賓移民局探員 10 月 29 日在中部大城曼達威市逮捕 4 名涉嫌網路詐騙的台灣籍男子，行動依據駐菲代表處與台灣刑事局的請求，犯嫌等候遣返。結論：跨境打詐已是例行合作。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"台菲再度聯手打擊網路詐騙。菲律賓移民局探員在中部大城曼達威市逮捕 4 名涉嫌從事網路詐騙的台灣籍男子，行動依據駐菲代表處與台灣刑事局的請求。\\n發生了什麼事\\n中央社報導，菲律賓移民局探員依據駐菲代表處與台灣刑事局的請求，10 月 29 日在中部大城曼達威市逮捕 4 名涉嫌從事網路詐騙的台灣籍男子，犯嫌等候遣返。\\n為什麼重要\\n網路詐騙集團跨國運作，執法也必須跨國合作。這起案件是台北與馬尼拉之間例行合作的具體小例子：提出請求、執行逮捕、排隊遣返，而不是外交事件。\\n來源異同\\n本批只有中央社一則報導，未見其他媒體佐證。信任標籤：僅1源——僅中央社一則報導，未見第二家媒體佐證。\\n仍不確定\\n摘要未具名犯嫌、未說明詐騙手法細節，也沒提到遣返時間或是否涉及更大集團，須以更完整的報導為準。\"},\"sources\":[{\"name\":\"中央社-國際\",\"url\":\"https://www.cna.com.tw/news/aopl/202611150106.aspx\"}],\"disagreements\":null,\"trustScore\":59,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"中央社-國際\"],\"glossary\":[{\"term\":{\"en\":\"Mandaue City\",\"zh-TW\":\"曼達威市\"},\"blurb\":{\"en\":\"Major city in the central Philippines where the arrests took place.\",\"zh-TW\":\"菲律賓中部大城，逮捕行動發生地。\"}},{\"term\":{\"en\":\"Criminal Investigation Bureau\",\"zh-TW\":\"刑事局\"},\"blurb\":{\"en\":\"Taiwan's Criminal Investigation Bureau, which requested the operation.\",\"zh-TW\":\"台灣刑事警察局，提出這次行動請求的單位。\"}},{\"term\":{\"en\":\"Philippines\",\"zh-TW\":\"菲律賓\"},\"blurb\":{\"en\":\"Country whose immigration officers made the arrests.\",\"zh-TW\":\"執行逮捕的移民局所屬國家。\"}},{\"term\":{\"en\":\"Online fraud\",\"zh-TW\":\"網路詐騙\"},\"blurb\":{\"en\":\"The suspected crime behind the arrests.\",\"zh-TW\":\"逮捕行動所涉的嫌疑罪名。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-
