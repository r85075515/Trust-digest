e Garden in New York City, according to the coverage. TMZ frames the outing as proof that the pair's past rumoured feud is behind them, while Billboard reports the same scene: the two Squad members spotted together, smiling, in a box at Arrowhead Stadium.\nWhy it matters\nThe Swift-Kloss friendship has been tabloid fodder for the better part of a decade, and a joint public appearance is the only kind of evidence that settles that kind of rumour. The football is incidental; the story is the reunion, staged in full view of the cameras at one of the most photographed sporting events in America.\nSources agree / disagree\nBillboard and TMZ agree on the attendance, the venue, and the feud-buried framing, with no conflicting details. Trust label: Two-source agreement — two outlets agree on the appearance.\nStill uncertain\nThe snippets give no game result, no quotes from either woman, and no indication of whether the joint appearance was planned. The friendship's history beyond the feud rumours is not detailed in the feed."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-entertainment-01-taylor-swift-karlie-klos\",\"category\":\"entertainment\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-entertainment-01-taylor-swift-karlie-klos.jpg\",\"imageAlt\":{\"en\":\"Taylor Swift and Karlie Kloss together at a Kansas City Chiefs game\",\"zh-TW\":\"泰勒絲與卡莉克勞斯同框觀看堪薩斯城酋長隊比賽\"},\"publishedAt\":\"2026-11-08T20:58:07.000Z\",\"title\":{\"en\":\"Taylor Swift and Karlie Kloss Reunite at Travis Kelce's Chiefs Game\",\"zh-TW\":\"泰勒絲與卡莉克勞斯同框看球：酋長隊主場力挺凱爾斯\"},\"summary\":{\"en\":\"Taylor Swift, the 36-year-old pop superstar, cheered on husband Travis Kelce and the Kansas City Chiefs against the New York Jets at Arrowhead Stadium on Sunday, joined by longtime friend Karlie Kloss. The pair's box-seat smiles put rumours of a past feud firmly behind them, Billboard and TMZ report.\",\"zh-TW\":\"流行天后泰勒絲（Taylor Swift）週日到箭頭體育場為丈夫凱爾斯（Travis Kelce）與堪薩斯城酋長隊加油，老友超模卡莉克勞斯（Karlie Kloss）同框作陪。兩人在包廂有說有笑，昔日不和傳聞不攻自破。看點是友情回溫，而非球賽本身。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"流行天后泰勒絲週日現身堪薩斯城酋長隊主場，為丈夫凱爾斯加油，身旁坐著多年老友、超模卡莉克勞斯。兩人在包廂有說有笑，等於公開宣告多年來的不和傳聞已經過去。\\n發生了什麼事\\n11月8日週日，泰勒絲到箭頭體育場觀看酋長隊對紐約噴氣機隊的比賽，34歲的卡莉克勞斯同行。報導稱，卡莉克勞斯也是泰勒絲與凱爾斯7月3日在紐約麥迪遜廣場花園婚禮的賓客之一。TMZ 以「昔日不和傳聞已成過去」來定調這次同框；Billboard 報導的畫面相同：兩位 Squad 成員在包廂裡滿面笑容。\\n為什麼重要\\n泰勒絲與卡莉克勞斯的友情近十年來一直是八卦版面的話題，公開同框是唯一能終結這類傳聞的證據。球賽本身只是背景，真正的故事是友情回溫，而且就發生在全美最受矚目的運動賽場鏡頭前。\\n來源異同\\nBillboard 與 TMZ 對出席、地點與「不和已成過去」的定調一致，沒有衝突細節。信任標籤：雙源一致——兩家媒體對同框出席的報導一致。\\n仍不確定\\n來源摘要未提比賽結果，也沒有兩位當事人的發言，無法得知這次同框是否經過安排。友情的來龍去脈，摘要亦未詳述。\"},\"sources\":[{\"name\":\"Billboard\",\"url\":\"https://www.billboard.com/music/music-news/taylor-swift-karlie-kloss-travis-kelce-chiefs-game-1236377058/\"},{\"name\":\"TMZ\",\"url\":\"https://www.tmz.com/2026/11/08/taylor-swift-karlie-kloss-attend-travis-kelce-chiefs-game/\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":15,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"entertainment\",\"live-ingest\",\"billboard\",\"tmz\"],\"glossary\":[{\"term\":{\"en\":\"Taylor Swift\",\"zh-TW\":\"泰勒絲\"},\"blurb\":{\"en\":\"36-year-old pop superstar who attended the Chiefs game.\",\"zh-TW\":\"出席酋長隊比賽的 36 歲流行天后。\"}},{\"term\":{\"en\":\"Travis Kelce\",\"zh-TW\":\"凱爾斯\"},\"blurb\":{\"en\":\"Kansas City Chiefs tight end and Swift's husband.\",\"zh-TW\":\"堪薩斯城酋長隊球員、泰勒絲的丈夫。\"}},{\"term\":{\"en\":\"Karlie Kloss\",\"zh-TW\":\"卡莉克勞斯\"},\"blurb\":{\"en\":\"Supermodel and longtime friend of Swift.\",\"zh-TW\":\"超模、泰勒絲多年老友。\"}},{\"term\":{\"en\":\"Kansas City Chiefs\",\"zh-TW\":\"堪薩斯城酋長隊\"},\"blurb\":{\"en\":\"NFL team Kelce plays for, based in Kansas City.\",\"zh-TW\":\"凱爾斯效力的 NFL 球隊，主場在堪薩斯城。\"}},{\"term\":{\"en\":\"Billboard\",\"zh-TW\":\"Billboard\"},\"blurb\":{\"en\":\"Music outlet that reported the joint appearance.\",\"zh-TW\":\"報導兩人同框的音樂媒體。\"}},{\"term\":{\"en\":\"TMZ\",\"zh-TW\":\"TMZ\"},\"blurb\":{
