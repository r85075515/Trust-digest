w energy-efficient semiconductor chips tailored for running generative AI models directly on local devices, according to reports published by Focus Taiwan (CNA) and ICRT. The design targets high power efficiency so edge hardware can process generative workloads without continuous cloud connectivity.\n\nRunning generative AI locally addresses two major bottlenecks in current AI deployment: massive electricity consumption at hyperscale cloud data centers and latency or privacy risks caused by transmitting user data over networks. Advancing low-power edge AI architectures also reinforces Taiwan's academic-to-industry semiconductor research ecosystem beyond advanced foundry manufacturing.\n\nBoth Focus Taiwan and ICRT carry the same Central News Agency (CNA) dispatch announcing the NTU electrical engineering team's chip breakthrough for on-device generative AI, with no conflicting facts between the English broadcasts.\n\nDetailed benchmark metrics—such as power consumption in milliwatts, supported model parameter sizes, fabrication process node, and timelines for commercial technology transfer—were not disclosed in the available summary reports.\n\nTrust label: Single source — Both English reports stem from the same Central News Agency (CNA) wire story."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-ai-195-ntu-energy-efficient-on-device-generative-ai-chip\",\"category\":\"ai\",\"title\":{\"en\":\"NTU Electrical Engineering Team Develops Energy-Efficient Chips for On-Device Generative AI\",\"zh-TW\":\"台大電機團隊研發高能效邊緣 AI 晶片，推動生成式 AI 離線裝置端運算\"},\"summary\":{\"en\":\"A team of electrical engineering researchers at National Taiwan University (NTU) has developed energy-efficient chips engineered to run generative AI workloads directly on edge devices, reducing reliance on power-hungry cloud data centers.\",\"zh-TW\":\"國立台灣大學電機工程研究團隊成功開發專為裝置端生成式 AI 設計的高能效晶片，藉由大幅降低運算功耗，讓智慧終端設備無須高度依賴雲端資料中心即可本地執行生成式 AI 任務。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」據中央社英文網（Focus Taiwan）與台北國際社區廣播電台（ICRT）報導，國立台灣大學電機工程研究團隊成功開發一款高能效 AI 晶片，專門用於在終端裝置本地直接執行生成式人工智慧運算，減少對雲端伺服器的依賴。\\n\\n「為什麼重要」目前生成式 AI 高度集中於雲端資料中心，不僅帶來龐大電力負荷，也伴隨網路延遲與資料外洩隱憂。台大團隊透過提升晶片能源效率，為手機、穿戴設備與物聯網終端實現低功耗離線生成式 AI 奠定硬體基礎，展現台灣在晶片設計架構的研發能量。\\n\\n「來源異同」Focus Taiwan 與 ICRT 均刊載自中央社同篇英文電訊稿，對台大電機團隊開發裝置端生成式 AI 高能效晶片的敘述一致，無事實出入。\\n\\n「仍不確定」目前公開報導摘要尚未揭露該晶片的具體製程節點、能效比（TOPS/W）實測數據、可支援的模型參數量級，以及後續技轉或商業化量產時程。\\n\\nTrust label: Single source — 兩則報導均源自中央社同一則新聞電訊。\"},\"glossary\":[{\"term\":{\"en\":\"On-device generative AI\",\"zh-TW\":\"裝置端生成式 AI\"},\"blurb\":{\"en\":\"Running generative artificial intelligence models locally on end-user hardware rather than sending requests to remote cloud servers.\",\"zh-TW\":\"直接在手機或邊緣終端硬體本地執行生成式人工智慧推論運算，無須將資料傳回遠端雲端伺服器處理。\"}},{\"term\":{\"en\":\"Energy efficiency (AI chips)\",\"zh-TW\":\"AI 晶片能源效率\"},\"blurb\":{\"en\":\"The amount of AI computation achieved per unit of electrical power consumed, critical for battery-powered edge devices.\",\"zh-TW\":\"單位電力消耗所能完成的 AI 運算量，是決定電池供電終端設備能否長期順暢運行模型的核心指標。\"}},{\"term\":{\"en\":\"National Taiwan University (NTU)\",\"zh-TW\":\"國立台灣大學（NTU）\"},\"blurb\":{\"en\":\"Taiwan's flagship public research university in Taipei, whose electrical engineering department is a major hub for IC design research.\",\"zh-TW\":\"位於台北的台灣頂尖公立研究型大學，其電機工程學系為台灣積體電路設計與半導體研發重鎮。\"}}],\"sources\":[{\"name\":\"Focus Taiwan (CNA)\",\"url\":\"https://focustaiwan.tw/sci-tech/202611250014\"},{\"name\":\"ICRT News\",\"url\":\"https://www.icrt.com.tw/info_details.php?mlevel1=6\u0026mlevel2=12\u0026news_id=312489\"}],\"imageUrl\":\"/covers/live/live-ai-195-ntu-energy-efficient-on-device-generative-ai-chip.jpg\",\"imageAlt\":{\"en\":\"National Taiwan University energy-efficient chip for on-device generative AI\",\"zh-TW\":\"國立台灣大學研發之裝置端生成式 AI 高能效晶片\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":66,\"trustBreakdown\":{\"crossCorroboration\":12,\"outletReputation\":21,\"recencyClarity\":21,\"sourceDiversity\":12},\"publish
