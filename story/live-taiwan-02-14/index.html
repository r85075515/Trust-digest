e domain at once. The daily total, not any single crossing, is the clearest gauge of intensity. The next daily count will show whether this level persisted, rose or fell.\nSources agree / disagree\nOnly one CNA feed item supports this card. No second outlet confirms the figures. Trust label: Single source — one CNA report provides all numbers, uncorroborated in the material provided.\nStill uncertain\nAircraft and vessel types, precise positions, the purpose of the activity, and activity after 6 a.m. were not stated. No further official statement was reported. Check the full CNA reporting before quoting the figures further."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-02-14\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-taiwan-02-14.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 中共14機艦船台海周邊活動　國軍嚴密掌握應處\",\"zh-TW\":\"相關封面圖：中共14機艦船台海周邊活動　國軍嚴密掌握應處\"},\"publishedAt\":\"2026-10-30T01:17:15.000Z\",\"title\":{\"en\":\"Taiwan Defense Ministry Tracks 14 Chinese Aircraft and Vessels Around Taiwan Strait\",\"zh-TW\":\"國防部：14 架次機艦船在台海周邊活動，國軍嚴密掌握應處\"},\"summary\":{\"en\":\"[Unverified, single source] Taiwan's Defense Ministry said 14 Chinese military aircraft and vessels operated around the Taiwan Strait in the 24 hours to 6 a.m. on October 30, including six aircraft sorties, three crossing the median line. Taiwan's military closely monitored the activity and responded.\",\"zh-TW\":\"[未證實·單一來源]國防部表示，昨天上午 6 時至今天上午 6 時，共機 6 架次、共艦 7 艘及公務船 1 艘，共 14 機艦船在台海周邊活動，其中 3 架次逾越中線，國軍嚴密監控應處，後續動態仍待官方公布。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"國防部表示，自昨天上午 6 時至今天上午 6 時，偵獲共機 6 架次、共艦 7 艘及公務船 1 艘，總計 14 機艦船在台海周邊活動，國軍嚴密監控與應處。中央社記者吳書緯 30 日在台北報導了這項說法。\\n發生了什麼事\\n6 架次共機中有 3 架次逾越中線，進入北部、東部及西南空域。國防部同時偵獲 7 艘共艦及 1 艘公務船，合計 14 機艦船持續在台海周邊活動。報導指出國軍嚴密監控與應處，報導沒有說明具體應處行動、機艦種類，也沒有說明各機艦的確切航跡。\\n為什麼重要\\n24 小時內合計 14 機艦船，是衡量國軍單日監控與應處負荷最直接的數字。3 架次逾越中線並分布於北部、東部及西南 3 個方向，代表壓力同時出現在空中與海上、也不只集中在單一空域。讀者可以用這組數字作為強度基準，對照下一日的官方統計，判斷活動是持續、升高還是下降。\\n來源異同\\n本卡內容只來自中央社 1 則報導，來源材料中沒有第二家媒體證實或反駁這組數字。信任標籤：單一來源——全部數字都來自中央社 1 則報導，提供的材料中沒有其他來源佐證。\\n仍不確定\\n來源摘要沒有說明機艦種類、確切位置或航跡、活動目的，也沒有說明 30 日上午 6 時之後活動是否持續。來源摘要也沒有說明國防部是否另有後續說明。這些關鍵資訊在提供的材料中沒有披露，引用數字前應查閱中央社完整報導。\"},\"sources\":[{\"name\":\"中央社-政治\",\"url\":\"https://www.cna.com.tw/news/aipl/202610300030.aspx\"}],\"disagreements\":null,\"trustScore\":59,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"中央社-政治\"],\"glossary\":[{\"blurb\":{\"en\":\"Taiwan government ministry that reported the aircraft and vessel activity.\",\"zh-TW\":\"公布這次機艦活動數字的政府部門。\"},\"term\":{\"en\":\"Ministry of National Defense\",\"zh-TW\":\"國防部\"}},{\"blurb\":{\"en\":\"Taiwan news agency that reported the Defense Ministry statement.\",\"zh-TW\":\"報導國防部說法的台灣通訊社。\"},\"term\":{\"en\":\"CNA\",\"zh-TW\":\"中央社\"}},{\"blurb\":{\"en\":\"CNA reporter credited with the Taipei report on October 30.\",\"zh-TW\":\"10 月 30 日台北報導的中央社記者。\"},\"term\":{\"en\":\"Wu Shu-wei\",\"zh-TW\":\"吳書緯\"}},{\"blurb\":{\"en\":\"Line in the Taiwan Strait referenced in the report on aircraft crossings.\",\"zh-TW\":\"報導中提及共機逾越的台海中線。\"},\"term\":{\"en\":\"Median line\",\"zh-TW\":\"中線\"}},{\"blurb\":{\"en\":\"Government vessel counted separately from the seven military vessels in the report.\",\"zh-TW\":\"報導中與 7 艘共艦分開計算的公務船隻。\"},\"term\":{\"en\":\"Official vessel\",\"zh-TW\":\"公務船\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"
