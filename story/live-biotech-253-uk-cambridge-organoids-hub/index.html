led by researchers at the MRC Laboratory of Molecular Biology and the Wellcome Sanger Institute, the hub draws on roughly 60 principal investigators across academia, industry, and the National Health Service (NHS) to grow miniature human organs—known as organoids—and human-relevant in vitro models for preclinical drug testing, marking one year since the government's Replacing Animals in Science Strategy.\n\n「Why it matters」\nPromising drug candidates frequently fail in late-stage human clinical trials because animal models do not always accurately replicate human biology. By standardizing validated human tissue and organoid models backed by the UK National Centre for the Replacement, Refinement and Reduction of Animals in Research (NC3Rs) and the Association of the British Pharmaceutical Industry (ABPI), the facility aims to cut drug development attrition rates while positioning Britain as a hub for non-animal biomedical R\u0026D.\n\n「Source differences」\nThe official UK government press release on GOV.UK, titled \"Mini lab-grown human organs to boost search for new treatments as £20m Cambridge lab opens\", details the institutional structure, noting co-leadership by the MRC Laboratory of Molecular Biology and Wellcome Sanger Institute, the roughly 60 principal investigators across academia, industry, and the NHS, and broader 30 million pound government backing for alternative methods. Mirage News, under the headline \"£20m Cambridge Lab to Grow Mini Organs for Drug Research\", closely mirrors the GOV.UK announcement while framing the launch around accelerating safer drug discovery and reducing animal testing in biomedical research.\n\n「Still uncertain」\nRegulatory timelines for when international medicines agencies will accept data generated by the hub's newly validated organoid models as full replacements for mandatory preclinical animal toxicity studies remain under ongoing international review.\n\nTrust label: Official confirmation — Verified directly through the UK government's official announcement on GOV.UK alongside corroborating science media coverage."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-biotech-253-uk-cambridge-organoids-hub\",\"category\":\"biotech\",\"title\":{\"en\":\"UK Opens 20 Million Pound Cambridge Lab to Test Drugs on Lab-Grown Mini Human Organs\",\"zh-TW\":\"英國啟用2,000萬英鎊劍橋實驗室，以體外培育迷你人體器官加速新藥測試\"},\"summary\":{\"en\":\"The UK government opened the 20 million pound UK Preclinical Translational Models Hub on the Cambridge Biomedical Campus on November 27, 2026, bringing together 60 principal investigators to develop lab-grown human organoids and in vitro models that predict drug safety and reduce reliance on animal testing.\",\"zh-TW\":\"英國政府於2026年11月27日在劍橋生醫園區正式啟用斥資2,000萬英鎊的「英國臨床前轉譯模型中心」，集結約60位首席研究員開發體外培育的人體類器官與組織模型，以更精準預測新藥安全性與療效，並減少生醫研發對動物實驗的依賴。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n英國政府於2026年11月27日宣布，斥資2,000萬英鎊的「英國臨床前轉譯模型中心」（UK Preclinical Translational Models Hub）在劍橋生醫園區正式啟用。該中心由英國醫學研究委員會分子生物學實驗室（MRC Laboratory of Molecular Biology）與威康桑格研究所（Wellcome Sanger Institute）共同領導，結合學術界、製藥業及英國國民保健署（NHS）約60位首席研究員，在實驗室培育迷你人體器官（類器官）與體外模型以測試新藥，藉此紀念英國發布《科學領域替代動物實驗戰略》滿一週年。\\n\\n「為什麼重要」\\n許多具潛力的新藥在臨床前動物實驗表現良好，卻因物種生理差異而在人體臨床試驗後期失敗。透過英國動物實驗替代減量優化中心（NC3Rs）與英國製藥工業協會（ABPI）支持的人體類器官驗證標準，該中心有助於在早期更準確預測藥物安全性與療效、降低研發失敗成本，並減少對動物實驗的依賴。\\n\\n「來源異同」\\n英國政府官網 GOV.UK 發布的官方新聞稿以「Mini lab-grown human organs to boost search for new treatments as £20m Cambridge lab opens」為題，完整揭露共同領導機構、結合學界、產業界與 NHS 約60位首席研究員的規模，以及整體3,000萬英鎊政府配套資金。科技媒體 Mirage News 以「£20m Cambridge Lab to Grow Mini Organs for Drug Research」為題跟進報導，內容與官方新聞稿高度一致，重點聚焦於透過實驗室培育迷你器官加快新藥研發並減少生醫研究中的動物實驗。\\n\\n「仍不確定」\\n各國藥品監管機構何時能全面採認該中心所驗證的類器官測試數據、以正式取代現行法規要求的臨床前動物毒理試驗，仍有待後續國際法規協調與驗證進度。\\n\\nTrust label: Official confirmation — 經英國政府 GOV.UK 官方新聞稿直接證實，並獲多家生醫科技媒體同步報導。\"},\"glossary\":[{\"term\":{\"en\":\"Organoids (類器官)\",\"zh-TW\":\"類器官\"},\"blurb\":{\"en\":\"Miniature, three-dimensional tissue cultures derived from stem cells that mimic the structure and key functions of real human organs.\",\"zh-TW\":\"由幹細胞在體外培育出的三維微型組織結構，能模擬真實人體器官的細胞組成與生理功能。\"}},{\"term\":{\"en\":\"Preclinical Translational Models\",\"zh-TW\":\"臨床前轉譯模型\"},\"blurb\":{\"en\":\"Laboratory testing systems used before human clinical trials to predict how an experimental medicine behaves and performs in the human body.\",\"zh-TW\":\"在藥物進入人體臨床試驗前，用來模擬並預測藥物在人體內代謝、安全性與療效的實驗室測試系統。\"}},{\"term\":{\"en\":\"NC3Rs\",\"zh-TW\":\"英國動物實驗替代減量優化中心\"},\"blurb\":{\"en\":\"The UK National Centre for the Replacement, Refinement and Reduction of Animals in Research, supporting scientific alternatives to animal testing.\",\"zh-TW\":\"全名為英國研究動物替代、優化與減量國家中心，專責推動減少並替代科學研究中使用動物的技術標準。\"}}],\"sources\":[{\"name\":\"GOV.UK\",\"url\":\"https://www.gov.uk/government/news/mini-lab-grown-human-organs-to-boost-search-for-new-treatments-as-20m-cambridge-lab-opens\"},{\"name\":\"Mirage News\",\"url\":\"https://www.miragenews.com/20m-cambridge-lab-to-grow-mini-organs-for-drug-1785025/\"}],\"imageUrl\":\"/covers/live/live-biotech-253-uk-cambridge-organoids-hub.png\",\"imageAlt\":{\"en\":\"UK Opens 20 Million Pound Cambridge Lab to Test Drugs on Lab-Grown Mini Human Organs\",\"zh-TW\":\"英國啟用2,000萬英鎊劍橋實驗室，以體外培育迷你人體器官加速新藥測試\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":91,\"trustBreakdown\":{\"crossCorroboration\":23,\"outletReputation\":24,\"recencyClarity\":23,\"sourceDiversity\":21},\"publishedAt\":\"2026-11-27T22:39:49.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":23,\"D2\":23,\"D3\":23,\"D4\":22,\"D5\":23,\"total\":23},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content
