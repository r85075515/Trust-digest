issue.\nWhat happened\nThe Register reported that the spacecraft arrived with a software problem complicating the final phase of its arrival. Nature News described the arrival as the end of an eight-year odyssey. The mission is a joint effort by the European Space Agency (ESA) and Japan Aerospace Exploration Agency (JAXA). Reaching Mercury is difficult because the planet's gravity is weak, its orbit is fast, and its closeness to the Sun complicates navigation. The European and Japanese probes will trace different paths around the planet to study its surface and its surroundings, according to Nature News, whose report was published online on 21 November 2026.\nWhy it matters\nOnly two missions have reached Mercury before BepiColombo, so fresh data from its two probes could reshape understanding of the planet's surface and its environment close to the Sun. A software fault at arrival threatens that payoff just as the science phase should begin, putting the mission's early operations under pressure.\nSources agree-disagree\nThe Register and Nature News agree on the core event: BepiColombo has arrived at Mercury after eight years in transit. The Register emphasises the software issue and the uncertain state of the spacecraft, while Nature News emphasises the completed journey and the two probes' separate paths around the planet. No numeric or factual conflict appeared between the two reports.\nTrust label: Two-source agreement — Two outlets report the same arrival, with complementary emphasis on the software problem and the eight-year journey.\nStill uncertain\nThe feed summaries do not say what the software issue is, which systems it affects, or whether it has been resolved. The spacecraft's condition and the timetable for its science operations remain unclear until the agencies publish a fuller update."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-01-software-issues-have-eve\",\"category\":\"semiconductor\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-semiconductor-01-software-issues-have-eve.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Software issues have even reached Mercury as BepiColombo probe arrives in uncertain state\",\"zh-TW\":\"相關封面圖：由於 BepiColombo 偵測器抵達時處於不確定狀態，軟體問題甚至已蔓延至水星\"},\"publishedAt\":\"2026-11-23T07:24:00.000Z\",\"title\":{\"en\":\"BepiColombo reaches Mercury after eight-year journey despite software issue\",\"zh-TW\":\"貝皮可倫坡號歷經八年抵達水星，軟體問題籠罩任務狀態\"},\"summary\":{\"en\":\"Humanity's third mission to Mercury has arrived after an eight-year journey, but a last-minute software issue has left the BepiColombo spacecraft in an uncertain state. The joint European and Japanese mission will now send its two probes along different paths to study the planet's surface and surroundings.\",\"zh-TW\":\"人類第三次水星任務歷經八年航程終於抵達，但最後一刻的軟體問題讓探測器狀態未明。歐洲與日本的雙探測器接下來將走不同路徑，探測水星表面與周圍環境；任務能否順利展開，端看軟體問題的後續處置。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"貝皮可倫坡號（BepiColombo）歷經八年航程抵達水星，成為人類第三次水星任務，但最後一刻的軟體問題讓探測器狀態未明。\\n發生了什麼事\\n《The Register》報導，探測器抵達時出現軟體問題，使抵達的最後階段橫生變數；《Nature News》則以「八年漫長旅程」形容這次抵達。這項任務由歐洲太空總署（ESA）與日本宇宙航空研究開發機構（JAXA）合作執行。水星引力微弱、軌道速度快，加上鄰近太陽，抵達難度極高。根據《Nature News》2026 年 11 月 21 日刊出的報導，歐洲與日本的探測器將沿不同路徑環繞水星，探測行星表面與周圍環境。\\n為什麼重要\\n水星至今只有兩次任務抵達，貝皮可倫坡號的雙探測器可望帶來罕見的新資料，改寫人類對水星表面與近日環境的認識。軟體故障偏偏在任務該展開科學觀測時出現，使任務初期的運作承受壓力。\\n來源異同\\n《The Register》與《Nature News》對核心事件一致：貝皮可倫坡號歷經八年航程抵達水星。前者強調軟體問題與探測器狀態未明，後者強調旅程完成與雙探測器的不同路徑。兩篇報導之間未見數字或事實衝突。\\n信任標籤：雙來源一致，兩家媒體報導同一抵達事件，分別著重軟體問題與八年旅程。\\n仍不確定\\n來源摘要未說明軟體問題的內容、影響哪些系統、是否已經解決。探測器的狀況與科學觀測的時間表仍不清楚，需等待相關機構發布更完整的說明。\"},\"sources\":[{\"name\":\"The Register\",\"url\":\"https://www.theregister.com/science/2026/11/23/software-issues-have-even-reached-mercury-as-bepicolombo-probe-arrives-in-uncertain-state/5311554\"},{\"name\":\"Nature News\",\"url\":\"https://www.nature.com/articles/d41586-026-03803-8\"}],\"disagreements\":null,\"trustScore\":62,\"trustBreakdown\":{\"sourceDiversity\":13,\"outletReputation\":1
