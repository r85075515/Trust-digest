lready through first-round testing and slated for TSMC manufacturing.\nWhat happened\nCNA (Taipei, Oct. 15) and TechNews report the same fundraising details from unnamed sources: ~$100M raise, ~$700M valuation, Zeus architecture aimed at scientific computing. Both outlets agree the chip will be built on TSMC process technology.\nWhy it matters\nThe judgment: $700M for a pre-revenue GPU startup is the market pricing in a simple bet — that AI-adjacent compute demand leaves room for a third player. TSMC as the foundry choice is the credibility anchor; without it, the valuation math doesn't work.\nSources agree / disagree\nCNA and TechNews report identical figures ($100M / $700M) and the same TSMC detail. Trust label: Multi-source agreement on the numbers — two outlets, same sourced story, no conflicts.\nStill uncertain\nThe raise is not confirmed closed, Zeus's actual performance is unverified, and \"sources say\" fundraising stories sometimes describe aspirations rather than signed term sheets. Even funded, the road from first-round architecture tests to a shipping chip that competes with Nvidia typically takes years and burns far more than $100M. Watch for a confirmed close and named lead investors."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-02-zeus-gpu\",\"category\":\"semiconductor\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-semiconductor-02-zeus-gpu.png\",\"imageAlt\":{\"en\":\"Cover related to: 矽谷晶片新創布局科學運算　Zeus GPU將採台積電製程\",\"zh-TW\":\"相關封面圖：矽谷晶片新創布局科學運算　Zeus GPU將採台積電製程\"},\"publishedAt\":\"2026-10-16T06:00:03.000Z\",\"title\":{\"en\":\"Bolt Graphics Seeks $100M at $700M Valuation for Zeus GPU on TSMC Process\",\"zh-TW\":\"Bolt Graphics 募資 1 億美元、估值 7 億美元，Zeus GPU 將採台積電（TSMC）製程\"},\"summary\":{\"en\":\"Silicon Valley startup Bolt Graphics is seeking about $100M at a roughly $700M valuation to build graphics chips rivaling Nvidia and AMD, CNA and TechNews report. Its Zeus GPU architecture has completed first-round testing and will use TSMC manufacturing, targeting scientific computing.\",\"zh-TW\":\"矽谷晶片新創 Bolt Graphics 正尋求募資約 1 億美元、公司估值約 7 億美元，目標打造能與輝達（Nvidia）及超微（AMD）競爭的圖形處理晶片，中央社與科技新報報導。其 Zeus GPU 架構已完成首輪測試，將採台積電（TSMC）製程，主攻科學運算。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"又一家挑戰者排隊挑戰輝達：矽谷晶片新創 Bolt Graphics 正尋求募資約 1 億美元，公司估值約 7 億美元，目標開發能與輝達（Nvidia）及超微（AMD）競爭的圖形處理晶片；Zeus GPU 架構已完成首輪測試，將採台積電（TSMC）製程生產。\\n發生了什麼事\\n中央社（台北，10 月 15 日）與科技新報引述知情人士，報導相同的募資細節：募資約 1 億美元、估值約 7 億美元，Zeus 架構主攻科學運算。兩家都確認晶片將採台積電製程。\\n為什麼重要\\n判斷很簡單：還沒營收的 GPU 新創值 7 億美元，是市場在為一個簡單的押注定價——AI 相關算力需求容得下第三家玩家。選台積電代工是可信度的錨；沒有這一點，估值就撐不起來。\\n來源異同\\n中央社與科技新報數字完全一致（1 億美元／7 億美元），台積電細節也相同。信任標籤：N源一致——兩家媒體、同一消息來源故事，無衝突。\\n仍不確定\\n募資尚未確認完成，Zeus 實際效能未經證實；「知情人士」式的募資報導，有時描述的是期望而非已簽的投資條件書。\"},\"sources\":[{\"name\":\"TechNews 科技新報\",\"url\":\"https://technews.tw/2026/10/16/silicon-valley-chip-startup-focuses-scientific-computing-zeus-gpu-utilize-tsmc-process/\"},{\"name\":\"中央社-國際\",\"url\":\"https://www.cna.com.tw/news/aopl/202610160087.aspx\"}],\"disagreements\":null,\"trustScore\":64,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":19,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"semiconductor\",\"live-ingest\",\"technews-科技新報\",\"中央社-國際\"],\"glossary\":[{\"term\":{\"en\":\"Bolt Graphics\",\"zh-TW\":\"Bolt Graphics\"},\"blurb\":{\"en\":\"Silicon Valley chip startup developing the Zeus GPU.\",\"zh-TW\":\"開發 Zeus GPU 的矽谷晶片新創。\"}},{\"term\":{\"en\":\"Zeus GPU\",\"zh-TW\":\"Zeus GPU\"},\"blurb\":{\"en\":\"Bolt Graphics' graphics processor architecture for scientific computing.\",\"zh-TW\":\"Bolt Graphics 主攻科學運算的圖形處理器架構。\"}},{\"term\":{\"en\":\"TSMC\",\"zh-TW\":\"台積電\"},\"blurb\":{\"en\":\"Taiwanese foundry slated to manufacture the Zeus chip.\",\"zh-TW\":\"將代工生產 Zeus 晶片的台灣晶圓廠。\"}},{\"term\":{\"en\":\"Nvidia\",\"zh-TW\":\"輝達\"},\"blurb\":{\"en\":\"US chipmaker whose graphics chips Zeus aims to rival.\",\"zh-TW\":\"Zeus 目標競爭的美國晶片商。\"}},{\"term\":{\"en\":
