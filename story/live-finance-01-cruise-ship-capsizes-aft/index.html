 a Microsoft outage affecting users for a second day and the White House tightening rules on staff contact with lobbyists.\n\nWhy it matters\nA collision that sinks a passenger vessel on a major river could easily have ended in deaths. That everyone aboard was accounted for, and that no one was critically hurt, is the central fact of the story. The incident also raises questions about safety on the busy stretch of the Mississippi River through New Orleans.\n\nSources agree and disagree\nTwo outlets covered the story: Bloomberg, which carried the mayor's account of the casualties, and PBS NewsHour, which included the collision in its news wrap. Both agree on the core facts, that a tanker hit a river cruise boat in New Orleans and the vessel capsized. No numeric or name conflicts appeared in the short feed descriptions.\n\nStill uncertain\nThe feed descriptions do not name either vessel, say how many people were aboard in total, or explain what caused the tanker to strike the cruise boat. The condition of the hospitalized passengers beyond \"not critically injured\" is also not detailed. Full reporting from the publishers should be checked for those facts.\n\nTrust label: Two-source agreement — Bloomberg and PBS NewsHour agree on the collision, the capsizing and the casualty figures."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-01-cruise-ship-capsizes-aft\",\"category\":\"finance\",\"adult\":false,\"isHeadline\":true,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-finance-01-cruise-ship-capsizes-aft.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Cruise Ship Capsizes After Tanker Collision in New Orleans\",\"zh-TW\":\"相關封面圖：新奧爾良油輪相撞後遊輪傾覆\"},\"publishedAt\":\"2026-11-14T00:29:03.000Z\",\"title\":{\"en\":\"New Orleans River Cruise Boat Capsizes After Tanker Collision; 32 Hospitalized\",\"zh-TW\":\"新奧爾良（New Orleans）遊船遭油輪撞擊傾覆，32 人送醫\"},\"summary\":{\"en\":\"All passengers and crew aboard a river cruise boat that capsized after a tanker collision in New Orleans on Friday were accounted for, Mayor Helena Moreno said. Thirty-two people were taken to hospital, but none was critically injured, according to Bloomberg.\",\"zh-TW\":\"新奧爾良（New Orleans）一艘內河遊船週五遭油輪撞擊後傾覆，船上所有乘客與船員均已確認安全。市長海倫娜·莫雷諾（Helena Moreno）表示，32 人送醫治療，無人重傷。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"發生了什麼事\\n週五，一艘油輪在新奧爾良（New Orleans）撞上內河遊船，遊船傾覆並沉入密西西比河（Mississippi River）。市長海倫娜·莫雷諾（Helena Moreno）表示，船上所有乘客與船員均已確認安全，32 人送醫治療，無人重傷。公共電視新聞一小時（PBS NewsHour）也在週五新聞綜述中報導這起相撞事故，該綜述同時提到微軟（Microsoft）服務連續第二天中斷，以及白宮收緊職員與遊說人士往來的規定。\\n\\n為什麼重要\\n載客船隻在主要河道上相撞沉沒，原本極可能造成死亡。全部人員確認安全、無人重傷，是這則新聞最重要的事實；事件也引發外界對新奧爾良繁忙河段航行安全的關注。\\n\\n來源異同\\n彭博（Bloomberg）與公共電視新聞一小時（PBS NewsHour）兩家媒體報導此事，核心事實一致：油輪撞上遊船，遊船傾覆。簡短摘要中未見數字或人名衝突。\\n\\n仍不確定\\n摘要未提及兩艘船的船名、船上總人數，也未說明油輪撞上遊船的原因；送醫者的傷勢除「無人重傷」外也沒有進一步細節，須以完整報導為準。\"},\"sources\":[{\"name\":\"Bloomberg\",\"url\":\"https://www.bloomberg.com/news/videos/2026-11-14/cruise-ship-capsizes-after-tanker-crash-in-new-orleans-video\"},{\"name\":\"PBS NewsHour\",\"url\":\"https://www.pbs.org/newshour/show/news-wrap-tanker-crashes-into-river-cruise-boat-in-new-orleans\"}],\"disagreements\":null,\"trustScore\":72,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":19,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"finance\",\"live-ingest\",\"bloomberg\",\"pbs-newshour\"],\"glossary\":[{\"blurb\":{\"en\":\"The mayor of New Orleans who confirmed the casualty figures.\",\"zh-TW\":\"證實傷亡數字的紐奧良市長。\"},\"term\":{\"en\":\"Helena Moreno\",\"zh-TW\":\"新奧爾良市長海倫娜·莫雷諾（Helena Moreno）\"}},{\"blurb\":{\"en\":\"The major river through New Orleans where the cruise boat sank.\",\"zh-TW\":\"遊船沉沒地點、流經新奧爾良的主要河流。\"},\"term\":{\"en\":\"Mississippi River\",\"zh-TW\":\"密西西比河（Mississippi River）\"}},{\"blurb\":{\"en\":\"A port city in Louisiana where the collision took place.\",\"zh-TW\":\"這起相撞事故發生的路易斯安那州港口城市。\"},\"term\":{\"en\":\"New Orleans\",\"zh-TW\":\"新奧爾良（New Orleans）\"}},{\"blurb\":{\"en\":\"A financial news outlet that firs
