r her debut feature, which draws on her childhood experience of family trauma. She was overcome with emotion as she accepted the award and later joked that she could have cried even harder, but a countdown on stage broke her concentration. She thanked Hou for his guidance and support. The film turns a difficult childhood into a story of survival, and she now describes the process as self-healing, encouraging young people going through hard times to hold on, saying that once they get through it, everything can turn out well.\nWhy it matters\nThe win marks a rare move from acclaimed actress to award-winning director in a single step, and it puts a film about childhood trauma and recovery at the centre of Chinese-language cinema's biggest awards night. Her public account of turning painful memories into a film gives the award a resonance beyond the ceremony.\nSources agree-disagree\nETtoday, Yahoo Taiwan and CNA all report the same win, the same film and the same account of its roots in Shu's childhood.\nTrust label: Multi-source agreement — three outlets report the same award, film and background with no clear conflicts.\nStill uncertain\nThe reports do not say what Shu plans to direct next, how 'Girl' performed at the box office, or whether it will screen more widely outside Taiwan. Details of the ceremony beyond her acceptance remain thin in the available reports."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-eastAsiaGossip-02-cna\",\"category\":\"eastAsiaGossip\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-eastAsiaGossip-02-cna.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 地獄童年變電影「女孩」 舒淇更害怕無法登台感謝侯孝賢| 娛樂 - 中央社 CNA\",\"zh-TW\":\"相關封面圖：地獄童年變電影「女孩」 舒淇更害怕無法登台感謝侯孝賢| 娛樂 - 中央社 CNA\"},\"publishedAt\":\"2026-11-23T08:17:00.000Z\",\"title\":{\"en\":\"Shu Qi Wins Best New Director at Golden Horse Awards for 'Girl'\",\"zh-TW\":\"舒淇首部自編自導《女孩》奪第 63 屆金馬獎最佳新導演\"},\"summary\":{\"en\":\"International actress Shu Qi won Best New Director at the 63rd Golden Horse Awards for her debut feature 'Girl', which she wrote and directed. The film draws on her childhood experience of family trauma, a journey she calls self-healing. She wept as she accepted the award and thanked her mentor, director Hou Hsiao-hsien.\",\"zh-TW\":\"國際影后舒淇以首部自編自導長片《女孩》奪下第 63 屆金馬獎最佳新導演。電影取材自她童年原生家庭創傷，她視為自我療癒，並鼓勵低潮中的年輕人熬過去。領獎時她激動落淚，謝恩師侯孝賢，後續看她下一部導演作品何時問世。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"國際影后舒淇以首部自編自導長片《女孩》奪下第 63 屆金馬獎最佳新導演，領獎時在台上落淚，感謝恩師導演侯孝賢。\\n發生了什麼事\\n舒淇週日晚間以首部自編自導長片獲獎，電影取材自她童年面臨原生家庭創傷的真實經歷。領獎時她激動落淚、難以自持，事後笑說原本能哭得更慘，只是台上的倒數秒數讓她出戲。她感謝侯孝賢的提攜。電影把艱難的童年化為一段熬過來的故事，她將這段歷程視為自我療癒，並鼓勵正處低潮的年輕人撐下去：只要熬過了，一切都會變得美好。\\n為什麼重要\\n這次得獎標誌著一位備受肯定的演員一步跨入獲獎導演之列，也讓一部關於童年創傷與療癒的電影站上華語電影最大頒獎典禮的中心。她公開談論如何把痛苦記憶拍成電影，讓這座獎項的意義超越典禮本身。\\n來源異同\\nETtoday、雅虎台灣與中央社報導的得獎結果、電影與童年背景說法一致。\\n信任標籤：多來源一致，三家媒體報導的獎項、電影與背景相同，未見明顯衝突。\\n仍不確定\\n現有報導未提及舒淇下一部導演作品的計畫、《女孩》的票房表現，或是否會在台灣以外更廣泛上映。典禮上除領獎之外的細節，在現有報導中也相當有限。\"},\"sources\":[{\"name\":\"ETtoday 影劇\",\"url\":\"https://star.ettoday.net/news/3277024\"},{\"name\":\"Yahoo TW 娛樂\",\"url\":\"https://tw.news.yahoo.com/%E5%9C%B0%E7%8D%84%E7%AB%A5%E5%B9%B4%E8%AE%8A%E9%9B%BB%E5%BD%B1-%E5%A5%B3%E5%AD%A9-%E8%88%92%E6%B7%87%E6%9B%B4%E5%AE%B3%E6%80%95%E7%84%A1%E6%B3%95%E7%99%BB%E5%8F%B0%E6%84%9F%E8%AC%9D%E4%BE%AF%E5%AD%9D%E8%B3%A2-081740507.html\"},{\"name\":\"Google News\",\"url\":\"https://news.google.com/rss/articles/CBMiX0FVX3lxTE9YeG5ac0dYZjVnNEdaZ05tbGdmR3l1bWlwV0NjalJwdHcwNDlrZ1ByaUp4VTVtWUI3aDQwTGNsZ3RxMHhKQVFQSXlzQXFTNEdMd1JsQm16bEttbGJMOXhB?oc=5\"}],\"disagreements\":null,\"trustScore\":84,\"trustBreakdown\":{\"sourceDiversity\":21,\"outletReputation\":16,\"crossCorroboration\":22,\"recencyClarity\":25},\"tags\":[\"eastAsiaGossip\",\"live-ingest\",\"region:tw\",\"ettoday-影劇\",\"yahoo-tw-娛樂\",\"google-news-tw-娛樂\"],\"region\":\"tw\",\"glossary\":[{\"blurb\":{\"en\":\"Internationally acclaimed actress and first-time director.\",\"zh-TW\":\"國際影后，本片的導演與編劇。\"},\"term\":{\"en\":\"Shu Qi\",\"zh-TW\":\"舒淇（Shu Qi）\"}},{\"blurb\":{\"en\":\"Chinese-language cinema's leading film awards, held in Taiwan.\",\"zh-TW\":\"華語電影重要獎項，在台灣舉行。\"},\"term\":{\"en\":\"Golden Horse Awards\",\"zh-TW\":\"金馬獎（Golden Horse Awards）\"}},{\"blurb\":{\"en\":\"Shu Qi's debut feature as writer and director.\",\"zh-TW\":\"舒淇首部自編自導長片。\"},\"term\":{\"en\":\"Girl\",\"zh-TW\":\"《女孩》（Girl）\"}},{\"blurb\":{\"en\":\"Veteran Taiwanese director and Shu Qi's mentor.\",\"zh-TW\":\"台灣資深導演，舒淇的恩師。\"},\"term\":{\"en\":\"Hou Hsiao-hsien\",\"zh-TW\":\"侯孝賢（Hou Hsiao-hsien）\"}},{\"blurb\":{\"en\":\"Taiwanese online news outlet.\",\"zh-TW\":\"台灣網路新聞媒體。\"},\"term\":{\"en\":\"ETtoday\",\"zh-TW\":\"ETtoday 新聞雲\"}},{\"blurb\":{\"en\":\"Taiwan's national news agency.\",\"zh-TW\":\"台灣的國家通訊社。\"},\"term\":{\"en\":\"CNA\",\"zh-TW\":\"中央社（CNA）\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-eastAsiaGossip-02-cna/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-eastAsiaGossip-02-cna/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-so
