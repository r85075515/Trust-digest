 as Healey prepares the budget. Influential Labour figures have been pushing to equalise capital gains tax with income tax, but critics warn that could drive wealthy people out of Britain; BBC Business separately reports, citing sources, that the chancellor has rejected calls to raise capital gains tax in the budget. Bloomberg's headline frames the payrolls data as arriving 'ahead of Chancellor Healey's budget.'\nWhy it matters\nA stronger labor market gives Healey fiscal breathing room and political cover heading into a budget where tax rises are on the table — payrolls growth eases pressure on the public finances and strengthens his hand against both markets and his own backbenchers. At the same time, the CGT split exposes an open Labour fault line on how to tax wealth, with the equalisation camp unlikely to drop the issue.\nSources agree / disagree\nBBC Business and Bloomberg News are consistent on the payrolls rebound and its budget timing; no numeric or name conflicts. Both treat the September data as a genuine upside surprise rather than noise.\nStill uncertain\nThe September figures are first estimates and subject to revision; the budget's actual tax decisions land next week. Verify the official statistics before quoting."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-02-uk-payrolls-bounce-back-\",\"category\":\"finance\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-finance-02-uk-payrolls-bounce-back-.jpg\",\"imageAlt\":{\"en\":\"Cover related to: UK Payrolls Bounce Back Ahead of Chancellor Healey’s Budget\",\"zh-TW\":\"相關封面圖：（譯文待補）UK Payrolls Bounce Back Ahead of Chancellor Healey’s Budget\"},\"publishedAt\":\"2026-10-20T06:13:16.000Z\",\"title\":{\"en\":\"UK Payrolls Bounce Back in September Ahead of Healey's Budget\",\"zh-TW\":\"英國 9 月就業人數反彈，為希利（John Healey）預算案送暖\"},\"summary\":{\"en\":\"British employers added jobs in September, official figures showed, giving Chancellor John Healey an unexpected boost ahead of next week's crucial budget. BBC sources say Healey rejected calls to raise capital gains tax, though Labour figures keep pushing to equalise it with income tax.\",\"zh-TW\":\"官方數據顯示英國雇主 9 月增加聘僱，為財政大臣約翰·希利（John Healey）下週關鍵預算案意外加分。BBC 引述消息指希利拒絕在預算中調高資本利得稅，但工黨內部仍有人主張與所得稅拉平。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"官方數據顯示，英國雇主 9 月增加聘僱——為財政大臣約翰·希利（John Healey）下週的關鍵預算案送上意外利多。\\n發生了什麼事\\n就業數據反彈，正逢希利備戰預算案之際。有影響力的工黨人物一直在推動把資本利得稅與所得稅拉平，但批評者警告這可能把富人趕出英國；BBC 商業新聞另引述消息指，財政大臣已拒絕在預算中調高資本利得稅。彭博社的標題則把就業數據定調為「希利預算案前的反彈」。\\n為什麼重要\\n轉強的就業市場給了希利財政喘息空間與政治掩護——預算案中加稅選項已在檯面上；而資本利得稅的分歧，暴露了工黨內部對「如何課富人稅」的公開裂痕。\\n來源異同\\nBBC 商業新聞與彭博社對就業反彈及其預算時機的報導一致；無數字或人名衝突。\\n仍不確定\\n9 月數據是初估值、可能修正；預算案真正的稅務決定下週才揭曉；引用前請查閱官方統計。\"},\"sources\":[{\"name\":\"BBC Business\",\"url\":\"https://www.bbc.co.uk/news/articles/c50me4w4x1vyo?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"Bloomberg News\",\"url\":\"https://www.bloomberg.com/news/articles/2026-10-20/uk-payrolls-bounce-back-ahead-of-chancellor-healey-s-budget\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":19,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"finance\",\"live-ingest\",\"bbc-business\",\"bloomberg-news\"],\"glossary\":[{\"term\":{\"en\":\"John Healey\",\"zh-TW\":\"約翰·希利\"},\"blurb\":{\"en\":\"UK Chancellor of the Exchequer preparing next week's budget.\",\"zh-TW\":\"正準備下週預算案的英國財政大臣。\"}},{\"term\":{\"en\":\"BBC Business\",\"zh-TW\":\"BBC 商業新聞\"},\"blurb\":{\"en\":\"BBC desk reporting the chancellor's CGT stance.\",\"zh-TW\":\"報導財政大臣資本利得稅立場的 BBC 商業新聞。\"}},{\"term\":{\"en\":\"Bloomberg News\",\"zh-TW\":\"彭博新聞\"},\"blurb\":{\"en\":\"Financial outlet framing the payrolls rebound.\",\"zh-TW\":\"定調就業反彈的財經新聞媒體。\"}},{\"term\":{\"en\":\"Labour Party\",\"zh-TW\":\"工黨\"},\"blurb\":{\"en\":\"UK governing party split over capital gains tax.\",\"zh-TW\":\"在資本利得稅議題上分裂的英國執政黨。\"}},{\"term\":{\"en\":\"capital gains tax\",\"zh-TW\":\"資本利得稅\"},\
