ve office in Lithuania, responding to renewed warnings from Lithuanian political leaders over the diplomatic fallout with Beijing.\n\nEstablished in November 2021, the Taiwanese Representative Office in Lithuania was the first diplomatic mission in Europe to use \"Taiwan\" rather than \"Taipei\" in its title—a move that triggered severe trade and diplomatic retaliation from China. Earlier this year, former Lithuanian Prime Minister Inga Ruginienė remarked that Lithuania had \"jumped in front of a train and lost,\" arguing the naming decision lacked coordination with the European Union and the United States.\n\nMOFA reiterated in Taipei that the office's name was mutually agreed upon by both governments when the mission was founded and called for continued bilateral cooperation grounded in mutual respect.\n\nTrust label: Multi-source agreement — Focus Taiwan and ICRT report identical MOFA refusal to rename the Vilnius office."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-044-taiwan-rules-out-lithuania-office-rename\",\"category\":\"taiwan\",\"title\":{\"en\":\"Taiwan Rules Out Renaming Representative Office in Lithuania Amid Warning\",\"zh-TW\":\"立陶宛政界示警名稱爭議 台灣外交部重申無意更改駐立陶宛代表處名稱\"},\"summary\":{\"en\":\"Taiwan's Ministry of Foreign Affairs ruled out any plan to rename the Taiwanese Representative Office in Lithuania, emphasizing that the name was mutually agreed upon when the mission opened in 2021.\",\"zh-TW\":\"針對立陶宛政界再度就代表處名稱發出警訊，台灣外交部（MOFA）週五明確表示，目前沒有更改「駐立陶宛台灣代表處」名稱的計畫，強調該名稱是台立雙方設處時達成的共識，呼籲在相互尊重基礎上深化合作。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n針對立陶宛政治領袖近期再度對駐處名稱爭議發出警告，中華民國外交部（MOFA）週五公開回應，明確排除更改「駐立陶宛台灣代表處」（The Taiwanese Representative Office in Lithuania）名稱的可能性。外交部強調，該名稱是 2021 年設處時由台立雙方政府共同協商達成的共識，目前並無任何更名計畫。\\n\\n「為什麼重要」\\n駐立陶宛台灣代表處是台灣在歐洲首個以「台灣」而非「台北」為名的代表機構，當年被視為台灣拓展歐洲外交空間的重要突破，但也引發北京對立陶宛採取嚴厲的貿易與外交報復。隨著立陶宛國內政治局勢變化，部分政界人士（包含曾批評該決策未與歐美協調的魯吉涅內（Inga Ruginienė））頻頻釋出檢討訊號，台灣的堅定表態為雙邊關係劃下明確紅線。\\n\\n「來源異同」\\n中央社英文網（Focus Taiwan）與 ICRT 均一致報導外交部「無計畫更名」與「名稱係雙方設處時共同商定」的核心立場。Focus Taiwan 進一步回顧了立陶宛政壇今年以來對該決策的檢討言論背景，而 ICRT 則引述彭博（Bloomberg）相關報導補充外交圈的關注焦點。\\n\\n「仍不確定」\\n立陶宛現任政府是否會在北京持續施壓或歐盟內部討論下，單方面提出調整雙邊互動架構的新方案，以及此議題對台立半導體與經貿合作專案的後續影響，仍有待觀察。\"},\"glossary\":[{\"term\":{\"en\":\"Taiwanese Representative Office in Lithuania\",\"zh-TW\":\"駐立陶宛台灣代表處\"},\"blurb\":{\"en\":\"Taiwan's de facto embassy in Vilnius, opened in November 2021 as the first mission in Europe to use 'Taiwan' in its official title.\",\"zh-TW\":\"台灣於 2021 年 11 月在立陶宛維爾紐斯設立的實質外交代表機構，也是歐洲首個以「台灣」命名的駐處。\"}},{\"term\":{\"en\":\"Ministry of Foreign Affairs (MOFA)\",\"zh-TW\":\"外交部\"},\"blurb\":{\"en\":\"The cabinet-level ministry of the Republic of China (Taiwan) responsible for foreign policy and diplomatic relations.\",\"zh-TW\":\"中華民國負責制定外交政策與掌理對外關係的中央行政機關。\"}},{\"term\":{\"en\":\"Economic coercion\",\"zh-TW\":\"經濟脅迫\"},\"blurb\":{\"en\":\"The use of trade blocks, customs restrictions, or investment bans by a state to pressure another country into changing its foreign policy.\",\"zh-TW\":\"一國透過貿易封鎖、海關限制或投資禁令等經濟手段，迫使他國改變外交政策的行為。\"}}],\"sources\":[{\"name\":\"Focus Taiwan (CNA)\",\"url\":\"https://focustaiwan.tw/politics/202611270015\"},{\"name\":\"Taipei Times\",\"url\":\"https://www.taipeitimes.com/News/taiwan/archives/2026/11/27/2003868491\"}],\"imageUrl\":\"/covers/live/live-taiwan-044-taiwan-rules-out-lithuania-office-rename.jpg\",\"imageAlt\":{\"en\":\"Exterior sign of the Taiwanese Representative Office in Vilnius, Lithuania\",\"zh-TW\":\"位於立陶宛維爾紐斯的駐立陶宛台灣代表處名牌\"},\"isHeadline\":false,\"isPopular\":true,\"trustScore\":78,\"trustBreakdown\":{\"crossCorroboration\":20,\"outletReputation\":21,\"recencyClarity\":21,\"sourceDiversity\":16},\"publishedAt\":\"2026-11-27T14:15:54.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":4,\"D2\":4,\"D3\":4,\"D4\":3,\"D5\":4,\"total\":19},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"n
