eather Administration forecast 4-meter waves and force-10 gusts, exceeding the vessel's safety limits of 3-meter waves and force-9 winds. The Central Election Commission (CEC) confirmed that the Kinmen County Election Commission had already deployed poll workers to Xiaoqiu Village by noon on November 27, and both Daqiu and Xiaoqiu polling stations have all ballots, voter rolls, and personnel ready.\n\nAlthough nonresident Wuqiu voters cannot return by sea to cast ballots, the CEC stated that under Article 66 of the Public Officials Election and Recall Act, elections may only be postponed when force majeure prevents individual polling stations from operating. Because both island stations can function normally, voting will proceed on November 28, mirroring a similar weather-related military transport cancellation in 2006.\n\nBoth Central News Agency (CNA) and Newtalk reported the MND safety threshold figures, the CEC's statutory explanation, and the readiness of the two island polling stations without discrepancy.\n\nWhether any nonresident voters managed to reach Wuqiu prior to the cancellation, or how severely turnout will drop compared with previous local elections, remains to be seen after polls close.\n\nTrust label: Multi-source agreement — Corroborated by Central News Agency and Newtalk citing official CEC and MND notices."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-181-wuqiu-election-ferry-canceled\",\"category\":\"taiwan\",\"title\":{\"en\":\"Rough Seas Cancel Wuqiu Election Ferry; CEC Confirms Voting Will Proceed on Schedule\",\"zh-TW\":\"海象惡劣烏坵投票專船停開 中選會：完成應變確保如期投開票\"},\"summary\":{\"en\":\"Taiwan's Ministry of National Defense canceled the November 27 special election ferry to Wuqiu Township due to 4-meter waves and force-10 gusts exceeding safety limits. The Central Election Commission confirmed that Daqiu and Xiaoqiu polling stations are staffed and stocked, so voting proceeds as scheduled on November 28 without legal grounds for postponement.\",\"zh-TW\":\"中央氣象署預報烏坵海域浪高將達 4 公尺、陣風 10 級，逾越專船安全耐受上限，國防部決定停開 11 月 27 日投票專船。中選會表示大坵與小坵投開票所人員、選票均已就位，依《選罷法》不符改期要件，明日投開票如期舉行，旅外鄉民返鄉投票受阻但島上選務不受影響。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」金門縣烏坵鄉原訂 11 月 27 日由國防部加開投票專船接送選舉人返鄉投票，但中央氣象署預報明日海象浪高將達 4 公尺、陣風 10 級，超過專船浪高 3 公尺與陣風 9 級的安全耐受上限，國防部為維護乘客與官兵安全決定停開。中央選舉委員會隨後說明，金門縣選委會已於 27 日中午完成小坵村投開票所工作人員派駐，大坵與小坵兩處投開票所的場地、選票與名冊均已備妥。\\n\\n「為什麼重要」專船停開雖使旅外烏坵鄉民無法搭船返鄉投票，但依《公職人員選舉罷免法》第 66 條第 1 項規定，須因天災或不可抗力致個別投開票所不能投票或開票始得改期。中選會確認兩處投開票所均可正常運作、不符法定改期要件，明日投票將如期舉行；此次烏坵鄉長有 3 人登記參選、鄉民代表應選 3 席有 5 人登記，依規定亦不適用最低得票門檻限制。\\n\\n「來源異同」中央社與 Newtalk 新聞均引述中選會與國防部說明，在海象預報數據、專船耐受標準、兩處投開票所整備進度及不符改期要件等核心事實上完全一致，中央社另補充 2006 年（民國 95 年）烏坵亦曾因天候停航導致近 300 名旅外鄉民無法返鄉的前例。\\n\\n「仍不確定」在專船宣布停開前究竟有多少旅外選舉人已提前登島，以及明日實際投票率受天候影響的具體幅度，仍有待投開票作業結束後才能確認。\\n\\nTrust label: Multi-source agreement — 中央社與 Newtalk 均引述中選會及國防部正式說明，核心數據與法規依據一致。\"},\"glossary\":[{\"term\":{\"en\":\"Wuqiu Township\",\"zh-TW\":\"烏坵鄉\"},\"blurb\":{\"en\":\"An isolated island township administered by Kinmen County in the Taiwan Strait, comprising Daqiu and Xiaoqiu islands.\",\"zh-TW\":\"位於台灣海峽的離島行政區，由大坵與小坵兩島組成，行政上由金門縣代管。\"}},{\"term\":{\"en\":\"Public Officials Election and Recall Act\",\"zh-TW\":\"公職人員選舉罷免法\"},\"blurb\":{\"en\":\"Taiwan's primary statute governing local and national elections, including conditions for postponing polls due to natural disasters.\",\"zh-TW\":\"規範台灣各級公職人員選舉與罷免程序的根本法律，明定天災或不可抗力改定投票日期的法定要件。\"}},{\"term\":{\"en\":\"Central Election Commission (CEC)\",\"zh-TW\":\"中央選舉委員會\"},\"blurb\":{\"en\":\"Taiwan's independent government agency responsible for administering elections and referendums.\",\"zh-TW\":\"台灣負責統籌辦理各級公職人員選舉與全國性公民投票的獨立行政機關。\"}}],\"sources\":[{\"name\":\"中央社 CNA\",\"url\":\"https://www.cna.com.tw/news/aipl/202611270236.aspx\"},{\"name\":\"Newtalk新聞\",\"url\":\"https://newtalk.tw/news/view/2026-11-27/1074143\"}],\"imageUrl\":\"/covers/live/live-taiwan-181-wuqiu-election-ferry-canceled.jpg\",\"imageAlt\":{\"en\":\"Official election notice regarding Wuqiu ferry cancellation and polling schedule\",\"zh-TW\":\"烏坵投票專船停開與投開票如期舉行公告示意\"},\"isHeadline\":false,\"isPopular\":true,\"trustScore\":91,\"trustBreakdown\":{\"crossCorroboration\":23,\"outletReputation\":23,\"recencyClarity\":24,\"sourceDiversity\":21},\"publishedAt\":\"2026-11-27T18:40:35.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":23,\"D2\":23,\"D3\":23,\"D4\":22,\"D5\":22,\"total\":23},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-taiwan-181-wuqiu-election-ferry-canceled/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-taiwan-181-wuqiu-election-ferry-canceled/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"d:\"$8:metadata\"\n"])</script></body></html>
