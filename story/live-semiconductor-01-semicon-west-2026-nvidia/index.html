rt of happy times for chipmaking — and NVIDIA used the stage to expand its CUDA-X software portfolio for AI-driven semiconductor design and manufacturing.\nWhat happened\nEE Times reports that SEMICON West 2026 opened with SEMI CEO Ajit Manocha's keynote declaring semiconductors a trillion-dollar industry. EE Times Asia adds the product news: NVIDIA has expanded its CUDA-X software portfolio to support AI-driven semiconductor design and manufacturing, with chipmakers and equipment suppliers adopting GPU-accelerated libraries for simulation, inspection and process optimization. The portfolio includes the new cuPotential library, which accelerates simulations of atomic and molecular interactions. NVIDIA says the tools will help engineers push chip design and fab processes further with AI.\nWhy it matters\nThe symbolism is hard to miss: AI's biggest hardware winner is now selling AI back to the industry that makes AI hardware. GPU-accelerated simulation and inspection attack the most expensive bottlenecks in chipmaking — design verification and process tuning — so even modest speedups compound across a trillion-dollar industry. EE Times' parallel emphasis on workforce development is the other half of the story: the tools are arriving faster than the engineers trained to use them.\nSources agree / disagree\nEE Times and EE Times Asia cover different angles of the same event — the show's jubilant opening and keynote versus NVIDIA's CUDA-X expansion — with no conflicting facts. Both frame SEMICON West 2026 as an AI-era chipmaking showcase.\nStill uncertain\nThe snippets give no adoption figures, customer names, or performance numbers for cuPotential. Whether the libraries move from announcement to fab-floor standard will only show in foundry and equipment-vendor disclosures; verify before quoting specifics."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-01-semicon-west-2026-nvidia\",\"category\":\"semiconductor\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"https://www.eetimes.com/wp-content/uploads/Hero-image-10.jpg\",\"imageAlt\":{\"en\":\"Cover related to: SEMICON West 2026: NVIDIA Expands GPU Libraries for AI-driven Semiconductor Manufacturing\",\"zh-TW\":\"相關封面圖：SEMICON West 2026：NVIDIA 為 AI 驅動的半導體製造擴展 GPU 庫\"},\"publishedAt\":\"2026-10-16T20:59:50.000Z\",\"title\":{\"en\":\"SEMICON West 2026: NVIDIA Expands GPU Libraries for AI-Driven Chipmaking\",\"zh-TW\":\"SEMICON West 2026：輝達（NVIDIA）擴大 GPU 函式庫，推進 AI 驅動的晶片製造\"},\"summary\":{\"en\":\"SEMICON West 2026 opened at San Francisco's Moscone Center with SEMI CEO Ajit Manocha declaring semiconductors a trillion-dollar industry. NVIDIA expanded its CUDA-X software portfolio for AI-driven semiconductor design and manufacturing, including the new cuPotential library that accelerates atomic and molecular simulations.\",\"zh-TW\":\"SEMICON West 2026 在舊金山莫斯科尼中心（Moscone Center）開幕，SEMI 執行長馬諾查（Ajit Manocha）宣布半導體已是兆美元產業。輝達（NVIDIA）擴大了 CUDA-X 軟體組合，支援 AI 驅動的半導體設計與製造，包含加速原子與分子模擬的全新 cuPotential 函式庫。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"SEMICON West 2026 在舊金山莫斯科尼中心（Moscone Center）歡騰開幕：半導體如今已是兆美元產業。SEMI 執行長馬諾查（Ajit Manocha）在開幕演說中宣告晶片製造的好日子開始——輝達（NVIDIA）則藉這個舞台擴大 CUDA-X 軟體組合，支援 AI 驅動的半導體設計與製造。\\n發生了什麼事\\nEE Times 報導，SEMICON West 2026 開幕，SEMI 執行長馬諾查在演說中宣布半導體已是兆美元產業。EE Times Asia 補上產品消息：輝達擴大了 CUDA-X 軟體組合，支援 AI 驅動的半導體設計與製造，晶片製造商與設備供應商正採用 GPU 加速函式庫做模擬、檢測與製程優化。組合中包含全新的 cuPotential 函式庫，可加速原子與分子交互作用的模擬。輝達表示，這些工具將幫助工程師用 AI 把晶片設計與晶圓廠製程推得更遠。\\n為什麼重要\\n象徵意義很難忽視：AI 時代最大的硬體贏家，現在把 AI 賣回給製造 AI 硬體的產業。GPU 加速的模擬與檢測，打的是晶片製造中最燒錢的瓶頸——設計驗證與製程調校；在兆美元產業裡，一點點加速都會複利放大。EE Times 同時強調的人才培育是故事的另一半：工具到位的速度，比訓練出會用的人更快。\\n來源異同\\nEE Times 與 EE Times Asia 報導同一場活動的不同角度——大會的歡騰開幕與演說，對輝達 CUDA-X 擴張——沒有事實衝突。兩家都把 SEMICON West 2026 定調為 AI 時代晶片製造的展示場。\\n仍不確定\\n來源摘要沒有 cuPotential 的採用數字、客戶名單或效能數據。這些函式庫會不會從發表走進晶圓廠產線，要等晶圓代工與設備商的揭露才知道；引用細節前請查證。\"},\"sources\":[{\"name\":\"EE Times\",\"url\":\"https://www.eetimes.com/semicon-west-2026-displays-ai-era-chipmaking-workforce-development/\"},{\"name\":\"EE Times Asia\",\"url\":\"https://www.eetasia.com/nvidia-expands-gpu-libraries-for-ai-driven-semiconductor-manufacturing/\"}],\"disagreements\":null,\"trustScore\":62,\"trustBreakdown\":{\"sourceDiversity\":13,\"outletReputation\":10,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"semiconductor\",\"live-ingest\",\"ee-times\",\"ee-times-asia\"],\"glossary\":[{\"term\":{\"en\":\"SEMICON West 2026\",\"zh-TW\":\"SEMICON West 2026\"},\"blurb\":{\"en\":\"Major semiconductor trade show that opened at San Francisco's Moscone Center.\",\"zh-TW\":\"在舊金山莫斯科尼中心開幕的半導體大型展會。\"}},{\"term\":{\"en\":\"SEMI\",\"zh-TW\":\"SEMI\"},\"blurb\":{\"en\":\"Global semiconductor industry association; its CEO gave the opening keynote.\",\"zh-TW\":\"全球半導體產業協會；其執行長發表開幕演說。\"}},{\"term\":{\"en\":\"Ajit Manocha\",\"zh-TW\":\"馬諾查\"},\"blurb\":{\"en\":\"CEO of SEMI, who declared semiconductors a trillion-dollar industry in his keynote.\",\"zh-TW\":\"SEMI 執行長，在演說中宣布半導體已是兆美元產業。\"}},{\"term\":{\"en\":\"NVIDIA\",\"zh-TW\":\"輝達\"},\"blurb\":{\"en\":\"Chipmaker expanding its CUDA-X software portfolio for AI-driven chip design and manufacturing.\",\"zh-TW\":\"晶片製造商，正擴大 CUDA-X 軟體組合，支援 AI 驅動的晶片設計與製造。\"}},{\"term\":{\"en\":\"cuPotential\",\"zh-TW\":\"cuPotential\"},\"blurb\":{\"en\":\"New NVIDIA library that accelerates simulations of atomic and molecular interactions.\",\"zh-TW\":\"輝達全新函式庫，加速原子與分子交互作用的模擬。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":
