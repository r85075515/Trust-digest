Lee Kang-sheng, on acting until he cannot act anymore.\nWhy it matters\nThe special is editorial content rather than awards results; its interest is how the magazine positioned itself inside the ceremony's opening film and around four performers' own accounts of their craft.\nSources agree / disagree\nAll items come from a single outlet, Vogue Taiwan, as parts of one special. Trust label: Single source — one magazine's special issue coverage.\nStill uncertain\nInterview quotations and the opening film's contents are not in the snippets; the features themselves must be read for any actor's actual statements."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-beauty-01-63\",\"category\":\"beauty\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-beauty-01-63.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 金馬63特輯｜林嘉欣，持續探索表演的自由\",\"zh-TW\":\"相關封面圖：金馬63特輯｜林嘉欣，持續探索表演的自由\"},\"publishedAt\":\"2026-11-02T05:30:00.000Z\",\"title\":{\"en\":\"Vogue Taiwan Golden Horse 63 Special: Karena Lam on Continuing to Explore Freedom in Acting\",\"zh-TW\":\"Vogue Taiwan 金馬 63 特輯：林嘉欣（Karena Lam）持續探索表演的自由\"},\"summary\":{\"en\":\"For the 63rd Golden Horse Awards, Vogue Taiwan collaborated from styling, photography and writing to the opening film 'Jianghu Qing Shi' and made the film special its core; the Karena Lam feature, on continuing to explore freedom in acting, leads a cluster with Ke Wei-lin, Wang Jing and Lee Kang-sheng.\",\"zh-TW\":\"第 63 屆金馬獎，Vogue Taiwan 從造型、攝影到文字創作深入參與金馬開場影片《江湖情事》協作，並成為電影特輯主核心；以「持續探索表演的自由」為題的林嘉欣（Karena Lam）篇為本組主軸，同組另有柯煒林（Ke Wei-lin）、王淨（Wang Jing）與李康生（Lee Kang-sheng）篇。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"一家時尚雜誌的電影獎特輯是本組主軸，封面專題為林嘉欣。\\n發生了什麼事\\nVogue Taiwan 報導，第 63 屆金馬獎它展開特別合作，從造型、攝影到文字創作，首度深入參與金馬開場影片《江湖情事》協作，並成為本次電影特輯的主核心，用其說法是讓時尚與電影碰撞，為這場華語電影盛事揭開不同以往的序幕。主軸專題以「持續探索表演的自由」為題寫林嘉欣（Karena Lam）。同一組另有三篇：柯煒林（Ke Wei-lin），從金馬入圍者到舞台上的掌舵人；王淨（Wang Jing），讓表演成為一趟旅程；李康生（Lee Kang-sheng），演到不能演為止。\\n為什麼重要\\n此特輯是編輯內容而非頒獎結果；其看點是雜誌如何把自己置入典禮開場影片之內，以及四位演員對自身表演的說法。\\n來源異同\\n各則皆來自同一媒體 Vogue Taiwan，是同一特輯的組成部分。信任標籤：單一來源——單一雜誌的特輯報導。\\n仍不確定\\n訪談引言與開場影片內容不在摘要中；任何演員的實際發言，須閱讀專題本身。\"},\"sources\":[{\"name\":\"Vogue Taiwan\",\"url\":\"https://www.vogue.com.tw/article/2026-november-cover-gha63-karena-lam\"}],\"disagreements\":null,\"trustScore\":47,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":10,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"beauty\",\"live-ingest\",\"vogue-taiwan\",\"vogue-taiwan\",\"vogue-taiwan\"],\"glossary\":[{\"term\":{\"en\":\"Karena Lam\",\"zh-TW\":\"林嘉欣\"},\"blurb\":{\"en\":\"Actress profiled in the special's lead feature.\",\"zh-TW\":\"演員，特輯主軸專題的主角。\"}},{\"term\":{\"en\":\"Golden Horse Awards\",\"zh-TW\":\"金馬獎\"},\"blurb\":{\"en\":\"Chinese-language film awards, in their 63rd edition here.\",\"zh-TW\":\"華語電影獎，此為第 63 屆。\"}},{\"term\":{\"en\":\"Vogue Taiwan\",\"zh-TW\":\"Vogue Taiwan\"},\"blurb\":{\"en\":\"Fashion magazine that produced the special and joined the opening film.\",\"zh-TW\":\"時尚雜誌，製作此特輯並參與開場影片。\"}},{\"term\":{\"en\":\"Lee Kang-sheng\",\"zh-TW\":\"李康生\"},\"blurb\":{\"en\":\"Actor featured in a companion piece in the same special.\",\"zh-TW\":\"演員，同特輯另一篇的主角。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-beauty-01-63/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:
