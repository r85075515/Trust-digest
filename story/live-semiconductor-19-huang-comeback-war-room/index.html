possibility of returning with confidants, the Financial Times reported on Sunday, citing people familiar with the matter; Reuters relayed the report the same day. The New York Post, citing the same reporting, said Huang's allies are forming a \"war room\" to press his case. None of the coverage indicated that the board has entertained a return, and Nvidia has not commented.\n\nWhat happened: Huang stepped down as president, CEO and director on Thursday (Nov 12) after revelations of extramarital affairs - including one with businesswoman Alice Huang (黃樂), whom US officials suspect of working for Chinese intelligence, and at least two with Nvidia employees - while the board's Wachtell-led investigation continues. CFO Colette Kress (克雷斯) serves as interim CEO and chairman Harvey C. Jones (瓊斯) runs the permanent search. The reported comeback discussions surfaced hours after Treasury Secretary Scott Bessent (貝森特) publicly insisted on Sunday that the board \"go outside the company\" for the next CEO and stage a \"dramatic shakeup\" - a direct collision between the founder's camp and the Treasury's stated preference. A \"Stand With Jensen\" petition backing Huang has passed 160,000 signatures, with Elon Musk (馬斯克) and Epic Games CEO Tim Sweeney (斯威尼) publicly supportive.\n\nWhy it matters: A founder lobbying to retake a company he left under investigation - while the board's own inquiry is unfinished, a cabinet secretary demands an outsider, and Congress has scheduled his testimony for December - turns Nvidia's succession into an open power struggle. If the board were to bring Huang back, it would have to explain how the governance failures that forced him out have been resolved; if it refuses, it faces a public campaign backed by a large shareholder-adjacent constituency days before Tuesday's earnings call.\n\nSources agree / disagree: Reuters attributed the comeback discussions to the Financial Times' sourcing; Digital Trends, the New York Post and market outlets carried the same account without independent confirmation of the war-room detail. No outlet reported a board response, a Huang statement, or any formal reinstatement step.\n\nStill uncertain: Whether Huang himself has decided to seek reinstatement or is testing support; who is in the alleged war room and whether the White House is actually being lobbied; the board's reaction; and whether the Wachtell investigation's findings - expected to take four to six weeks - land before any succession decision.\n\nTrust label: Single source - the comeback account rests on the Financial Times' anonymous sourcing, relayed by Reuters with attribution; treat as unconfirmed until the board, Huang or Nvidia speaks."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"adult\":false,\"body\":{\"en\":\"$10\",\"zh-TW\":\"發生了什麼事：［未證實·單一原始來源］《金融時報》週日引述知情人士報導，辭職僅四天的黃仁勳（Jensen Huang）正考慮回鍋擔任輝達執行長，已與親信商討回歸的可能性；路透同日轉述。《紐約郵報》依同一報導指其盟友正組建「戰情室」（war room）為他遊說。各家報導皆未顯示董事會已考慮讓他回任，輝達亦未回應。黃仁勳於週四（11/12）因多段婚外情曝光下台——對象包括被美方懷疑替中國情報工作的黃樂（Alice Huang）與至少兩名輝達員工——董事會委任 Wachtell 的調查仍在進行；財務長克雷斯（Colette Kress）臨時接任執行長，董事長瓊斯（Harvey C. Jones）主持正式遴選。回鍋消息曝光的同一天稍早，財政部長貝森特（Scott Bessent）才公開主張董事會「必須從公司外部找人」、公司需要「戲劇性改組」——創辦人陣營與財政部的立場正面對撞。聲援黃仁勳的「Stand With Jensen」連署已逾 16 萬人，馬斯克（Elon Musk）與 Epic 執行長斯威尼（Tim Sweeney）公開表態支持。\\n\\n為什麼重要：創辦人在自家調查未結、部長公開要求外找人、國會已排定 12 月作證的情況下遊說回鍋，接班已演成公開權力鬥爭。董事會若讓他回來，必須交代當初逼他下台的治理問題如何解決；若拒絕，週二財報法說前還得面對有大批聲援者撐腰的公開施壓。\\n\\n來源異同：路透明確標示回鍋商討出自《金融時報》的匿名消息來源；Digital Trends、《紐約郵報》與財經媒體同日跟進，戰情室細節未獲獨立證實。各家皆未報導董事會回應、黃本人表態或任何正式復職程序。\\n\\n仍不確定：黃仁勳是已決心尋求復職、還是在測試支持度；所謂戰情室成員為何、是否真的在遊說白宮；董事會的反應；以及預估需時四到六週的 Wachtell 調查結論，會不會趕在接班決定之前出爐。\"},\"category\":\"semiconductor\",\"disagreements\":null,\"glossary\":[{\"blurb\":{\"en\":\"Nvidia's co-founder, who resigned as CEO on Nov 12 amid affair and espionage-adjacent revelations and is now reported to be weighing a return.\",\"zh-TW\":\"輝達共同創辦人，11/12 因醜聞辭去執行長，現傳正考慮回鍋。\"},\"term\":{\"en\":\"Jensen Huang\",\"zh-TW\":\"黃仁勳（Jensen Huang）\"}},{\"blurb\":{\"en\":\"The informal team of Huang allies reportedly lobbying for his reinstatement as CEO.\",\"zh-TW\":\"據報由黃仁勳盟友組建、為其復職遊說的非正式團隊。\"},\"term\":{\"en\":\"\\\"War room\\\"\",\"zh-TW\":\"戰情室（War Room）\"}},{\"blurb\":{\"en\":\"The law firm the board's independent directors hired, led by former acting US Attorney Joon H. Kim, to investigate Huang.\",\"zh-TW\":\"董事會獨立董事聘任、由前代理聯邦檢察官金俊領軍調查黃仁勳的律師事務所。\"},\"term\":{\"en\":\"Wachtell investigation\",\"zh-TW\":\"Wachtell 調查（Wachtell investigation）\"}},{\"blurb\":{\"en\":\"The Financial Times, the single original source of the comeback account, relayed by Reuters with attribution.\",\"zh-TW\":\"回鍋報導的單一原始來源，路透以引述方式轉載。\"},\"term\":{\"en\":\"Financial Times\",\"zh-TW\":\"金融時報（Financial Times）\"}}],\"id\":\"live-semiconductor-19-huang-comeback-war-room\",\"imageAlt\":{\"en\":\"\",\"zh-TW\":\"\"},\"imageUrl\":\"\",\"isHeadline\":true,\"isPopular\":false,\"publishedAt\":\"2026-11-16T01:18:11.000Z\",\"sources\":[{\"name\":\"Reuters\",\"url\":\"https://www.reuters.com/world/china/jensen-huang-discusses-comeback-nvidia-ceo-with-allies-ft-reports-2026-11-15/\"}],\"summary\":{\"en\":\"[Unverified - single original source] The Financial Times reports, via Reuters, that Jensen Huang has discussed returning as Nvidia CEO with confidants four days after his scandal-driven resignation, with allies reportedly forming a \\\"war room\\\" - hours after Treasury Secretary Bessent publicly demanded an outside CEO and a dramatic shakeup. The board has not responded and no reinstatement step has been taken.\",\"zh-TW\":\"［未證實·單一原始來源］《金融時報》經路透報導：黃仁勳辭職四天後已與親信商討回鍋擔任輝達執行長，盟友據報組建「戰情室」遊說——就在財政部長貝森特公開要求外找執行長、「戲劇性改組」的同一天。董事會尚未回應，亦無任何正式復職程序。\"},\"tags\":[],\"title\":{\"en\":\"Four days after quitting, Huang weighs a comeback as allies form a \\\"war room\\\" - colliding with Bessent's outside-CEO demand\",\"zh-TW\":\"辭職四天謀回鍋：黃仁勳與親信商討復任、盟友組戰情室，槓上貝森特外找執行長主張\"},\"trustBreakdown\":{\"crossCorroboration\":16,\"outletReputation\":22,\"recencyClarity\":16,\"sourceDiversi
