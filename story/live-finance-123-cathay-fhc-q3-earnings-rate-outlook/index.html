ted net profit after tax of NT$105.4 billion (EPS NT$6.94) for the first three quarters, with annualized ROE reaching 15.4%. Under IFRS 17 dividend rules combining net profit and realized FVOCI equity gains, cumulative adjusted earnings for the first 10 months reached NT$245.7 billion, or an adjusted EPS of NT$16.5. Cathay Life's net worth surpassed NT$1 trillion at the end of October.\n\nWhy it matters\nGeneral Manager Chang-Keng Lee (李長庚) stated that Taiwan remains one of the primary beneficiaries of global AI development, supporting supply chains and capital markets into 2027 despite a high comparison base. Meanwhile, Cathay United Bank Senior Vice President Po-Sheng Fu (傅伯昇) noted that solid domestic growth, global inflation, and Middle East conflict pressures leave room for Taiwan's central bank to raise rates by half a码 (12.5 basis points) before year-end alongside potential US rate pressure.\n\nSource comparison\nCNA, Economic Daily News (UDN), and TVBS News all covered the November 27 investor conference. TVBS detailed the IFRS 17 dividend calculation basis and historical payout ratio benchmarks (34%, 46%, and 53%), whereas CNA focused more closely on management's macroeconomic outlook regarding AI supply chains, bank liquidity coverage ratios (110%–120%), and year-end interest rate forecasts.\n\nWhat remains uncertain\nCathay FHC has not yet finalized a specific cash dividend payout ratio for 2027, and actual year-end interest rate decisions remain at the discretion of Taiwan's central bank and the US Federal Reserve.\n\nTrust label: Multi-source agreement — Corroborated by CNA, Economic Daily News, and TVBS News from Cathay FHC's Q3 investor briefing."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-123-cathay-fhc-q3-earnings-rate-outlook\",\"category\":\"finance\",\"title\":{\"en\":\"Cathay FHC Posts Record Nine-Month Net Profit, Sees Rate Hike Room in Taiwan and US\",\"zh-TW\":\"國泰金前 10 月調整後 EPS 達 16.5 元 預期台美年底前有升息機會\"},\"summary\":{\"en\":\"Cathay Financial Holding reported record nine-month net income of NT$105.4 billion and said 2027 dividends will reflect this year's record earnings, while forecasting potential year-end rate hikes in both Taiwan and the US. One-sentence takeaway: Strong AI-driven economic momentum has lifted Cathay FHC's earnings to record highs while keeping central bank tightening risks on the table.\",\"zh-TW\":\"國泰金控 27 日舉行第 3 季法說會，公布今年前三季稅後淨利達 1,054 億元、創歷史同期新高，加計 FVOCI 股票處分利得後前 10 月調整後 EPS 高達 16.5 元，並釋出明年股利有望反映獲利創高；金控同時評估台灣與美國今年底前均有升息空間。一句重點結論：受惠 AI 帶動經濟與資本市場表現，國泰金獲利創同期新高並預期台美年底前仍有升息可能。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n國泰金控（2882）於 2026 年 11 月 27 日舉行第 3 季法人說明會，公布前三季稅後淨利達 1,054 億元、每股純益（EPS）6.94 元，金控與各子公司獲利及淨值雙創歷史同期新高，前三季年化股東權益報酬率（ROE）達 15.4%。在接軌 IFRS 17 後，若將稅後淨利加計 FVOCI 股票處分利得，前 10 月合計獲利衝上 2,457 億元、調整後 EPS 高達 16.5 元；國泰人壽 10 月底淨值亦突破 1 兆元創高。\\n\\n「為什麼重要」\\n國泰金總經理李長庚（Chang-Keng Lee）表示，台灣仍是全球 AI 發展最大受惠國之一，明年雖面臨高基期，整體經濟與資本市場仍可樂觀看待；財務團隊並強調明年股利發放將充分反映今年獲利創高。國泰世華銀行副總經理傅伯昇（Po-Sheng Fu）則評估，考量台灣經濟穩健、全球通膨與中東戰事影響，台灣與美國今年底前均有升息空間，台灣央行存在升息半碼（0.125 個百分點）的條件。\\n\\n「來源異同」\\n中央社、經濟日報與 TVBS 新聞網均報導 27 日國泰金法說會內容，各家媒體引述的獲利數字與管理層展望一致；其中 TVBS 詳列 IFRS 17 股利分派基礎與歷年配發率基準（34%、46%、53%），中央社則著重銀行流動性覆蓋比率（110% 至 120%）及台美升息評估細節。\\n\\n「仍不確定」\\n明年實際股利配發率仍待董事會最終決議，而台美央行年底前是否正式啟動升息，亦須視後續通膨與貨幣政策會議結果而定。\"},\"glossary\":[{\"term\":{\"en\":\"IFRS 17\",\"zh-TW\":\"國際財務報導準則第 17 號（IFRS 17）\"},\"blurb\":{\"en\":\"An international accounting standard for insurance contracts that alters how insurers measure liabilities, profits, and distributable earnings.\",\"zh-TW\":\"規範保險合約會計處理的國際準則，影響壽險業負債評價、損益認列與可分配盈餘計算方式。\"}},{\"term\":{\"en\":\"FVOCI\",\"zh-TW\":\"透過其他綜合損益按公允價值衡量（FVOCI）\"},\"blurb\":{\"en\":\"An accounting classification for financial assets where fair value changes go to other comprehensive income, with realized equity gains impacting dividend capacity.\",\"zh-TW\":\"金融資產會計分類之一，其公允價值波動計入其他綜合損益，股票處分實現利得可納入股利分派基礎。\"}},{\"term\":{\"en\":\"Liquidity Coverage Ratio (LCR)\",\"zh-TW\":\"流動性覆蓋比率（LCR）\"},\"blurb\":{\"en\":\"The proportion of high-quality liquid assets held by banks to ensure they can meet short-term obligations over a 30-day stress scenario.\",\"zh-TW\":\"衡量銀行持有高品質流動性資產是否足以支應未來 30 天資金淨流出的重要金融監理指標。\"}}],\"sources\":[{\"name\":\"中央社 CNA\",\"url\":\"https://www.cna.com.tw/news/afe/202611270220.aspx\"},{\"name\":\"TVBS 新聞網\",\"url\":\"https://news.tvbs.com.tw/money/4057024\"},{\"name\":\"經濟日報 UDN\",\"url\":\"https://money.udn.com/money/story/5613/9906255\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"Cathay Financial Holding third-quarter investor conference in Taipei\",\"zh-TW\":\"國泰金控舉行2026年第3季法人說明會\"},\"isHeadline\":true,\"isPopular\":true,\"trustScore\":89,\"trustBreakdown\":{\"crossCorroboration\":23,\"outletReputation\":23,\"recencyClarity\":23,\"sourceDiversity\":20},\"publishedAt\":\"2026-11-27T16:26:49.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":5,\"D2\":5,\"D3\":5,\"D4\":4,\"D5\":4,\"total\":23},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-finance-123-cathay-fhc-q3-earnings-rate-outlook/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundl
