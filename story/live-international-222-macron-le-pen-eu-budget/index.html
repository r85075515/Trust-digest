選馬克宏、雷朋掀政治攻防 · 文章摘要整理： · Q1：馬克宏為何批評雷朋對歐盟預算談判的表態？ · Q2：歐盟這次預算談判為何特別受到法國大選影響？ · Q3 | 世界新聞網」。\\n「仍不確定」各國領袖能否在12月峰會縮小預算歧見，以及法國選情對後續談判的影響仍未定。\\nTrust label: Single source 兩篇內容同屬中央社稿件與轉載整理，故標示為單一來源。\"},\"glossary\":[{\"term\":{\"en\":\"EU budget negotiations\",\"zh-TW\":\"歐盟預算談判\"},\"blurb\":{\"en\":\"Multilateral discussions among European Union leaders over spending priorities, funding caps, and revenue sources.\",\"zh-TW\":\"歐盟各國領袖針對支出項目、預算規模與財源分攤所進行的協商。\"}},{\"term\":{\"en\":\"Digital corporate tax\",\"zh-TW\":\"對數位企業徵稅\"},\"blurb\":{\"en\":\"Proposed levies on large digital companies to raise public or bloc-level revenue.\",\"zh-TW\":\"擬向大型數位企業課徵稅費以籌措財政財源的政策構想。\"}},{\"term\":{\"en\":\"European Council\",\"zh-TW\":\"歐洲理事會\"},\"blurb\":{\"en\":\"The institution comprising EU heads of state or government that defines the bloc's political direction and priorities.\",\"zh-TW\":\"由歐盟各會員國元首或政府首長組成的機構，負責引導歐盟整體政治方向與政策優先順序。\"}}],\"sources\":[{\"name\":\"中央社 CNA\",\"url\":\"https://www.cna.com.tw/news/aopl/202611270025.aspx\"},{\"name\":\"世界新聞網\",\"url\":\"https://www.worldjournal.com/wj/story/121488/9905420\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"Macron and Marine Le Pen Clash Over EU Budget Talks Amid French Election Looming\",\"zh-TW\":\"歐盟預算談判牽動法國大選 馬克宏與雷朋掀政治攻防\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":69,\"trustBreakdown\":{\"crossCorroboration\":20,\"outletReputation\":21,\"recencyClarity\":20,\"sourceDiversity\":8},\"publishedAt\":\"2026-11-27T21:04:17.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":21,\"D2\":20,\"D3\":19,\"D4\":20,\"D5\":18,\"total\":20},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\
