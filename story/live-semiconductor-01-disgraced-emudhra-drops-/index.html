ates for any website or mail server — one with a private encryption key of just 4. V. Srinivasan, chairman of India-based eMudhra Limited, cited the rising costs and complexity of compliance requirements, paired with thin returns from the business, while acknowledging the intense scrutiny as a factor.\n\nWhat happened\nArs Technica and The Register both reported the exit on October 22. Their accounts match: eight weak intermediate certificates, one with a single-digit private key, and the company's stated rationale of compliance costs plus public scrutiny. eMudhra announced Thursday it was walking away from that arm of its business entirely.\n\nWhy it matters\nA certificate authority has exactly one asset: the secrecy of its keys. When that fails, the trust model the entire web relies on breaks with it. eMudhra's withdrawal reads less like punishment and more like recognition that the business was no longer viable once the keys were exposed.\n\nSources agree / disagree\nBoth outlets report the same eight intermediates, the single-digit key, and the cost-and-compliance explanation. No numeric or factual conflicts were detected in the feed snippets.\n\nStill uncertain\nThe announcements do not spell out what happens to certificates eMudhra already issued, or whether browser trust stores will act — the key accountability details are missing. Verify on the publishers' pages before citing remediation steps."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-01-disgraced-emudhra-drops-\",\"category\":\"semiconductor\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-semiconductor-01-disgraced-emudhra-drops-.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Disgraced eMudhra drops out of TLS business after using cert private key of 4\",\"zh-TW\":\"相關封面圖：名譽掃地的 eMudhra 在使用 4 的憑證私鑰後退出 TLS 業務\"},\"publishedAt\":\"2026-10-22T20:17:52.000Z\",\"title\":{\"en\":\"eMudhra Quits the TLS Business After Certs Were Found With a Private Key of 4\",\"zh-TW\":\"eMudhra：私鑰竟是個位數「4」——這家印度憑證機構退出 TLS 業務\"},\"summary\":{\"en\":\"Indian certificate authority eMudhra is quitting the global TLS business after reports showed it issued eight intermediate certificates so weak anyone could forge them — one with a private key of just 4. Chairman V. Srinivasan cited compliance costs; Ars Technica and The Register report matching details.\",\"zh-TW\":\"印度憑證機構 eMudhra 退出 TLS 業務：它發出的八張中繼憑證弱到可被任意偽造，其中一張私鑰只是「4」。董事長歸因於合規成本。takeaway：憑證機構連私鑰都守不住，退場是剛好而已——但已發憑證怎麼處置，官方還沒交代。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"印度憑證機構 eMudhra 宣布退出全球 SSL/TLS 憑證業務。此前調查揭露，它發出的八張中繼憑證弱到任何人都能偽造任意網站或郵件伺服器的憑證——其中一張的私鑰竟然只是個位數「4」。\\n發生了什麼事\\n印度 eMudhra Limited 董事長 V. Srinivasan 表示，合規成本與複雜度不斷攀升，加上這門生意利潤微薄，是退出的主因；他也承認近期的嚴格審查是因素之一。Ars Technica 與 The Register 10 月 22 日都報導了退出消息，對弱私鑰與退出理由的說法一致。\\n為什麼重要\\n憑證機構的唯一本錢就是「私鑰夠保密」——連這都做不到，整個網路信任鏈就破了功。與其說是被罰退場，不如說私鑰曝光之後，這門生意對它已經做不下去。\\n來源異同\\n兩家媒體核心事實一致：八張中繼憑證、個位數私鑰、成本與合規的退出理由。信任標籤：N源一致。\\n仍不確定\\n公告沒說已發出的憑證怎麼處置、瀏覽器信任庫會不會撤除——這些問責關鍵資訊缺了，引用處置細節前請查完整報導。\"},\"sources\":[{\"name\":\"Ars Technica\",\"url\":\"https://arstechnica.com/security/2026/10/disgraced-emudhra-drops-out-of-tls-business-following-certificate-debacle/\"},{\"name\":\"The Register\",\"url\":\"https://www.theregister.com/security/2026/10/22/disgraced-indian-cert-issuer-leaves-the-cert-issuing-business/5304848\"}],\"disagreements\":null,\"trustScore\":70,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":17,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"semiconductor\",\"live-ingest\",\"ars-technica\",\"the-register\"],\"glossary\":[{\"term\":{\"en\":\"eMudhra\",\"zh-TW\":\"eMudhra\"},\"blurb\":{\"en\":\"Indian certificate authority exiting the global TLS business.\",\"zh-TW\":\"印度憑證機構，宣布退出全球 TLS 憑證業務。\"}},{\"term\":{\"en\":\"V. Srinivasan\",\"zh-TW\":\"V. Srinivasan\"},\"blurb\":{\"en\":\"Chairman of eMudhra Limited who announced the exit.\",\"zh-TW\":\"eMudhra Limited 董事長，宣布退出業務。\"}},{\
