 with minor injuries — and 339 homes had collapsed. Chinese leader Xi Jinping ordered all-out rescue efforts and proper resettlement of those affected. Taiwan's Mainland Affairs Council expressed condolences on Thursday morning and reminded Taiwanese citizens in the area to stay safe.\n\nWhat happened\nThe quake hit late at night in a remote, high-altitude county. Xinhua's 2:25 a.m. accounting — 16 dead, 32 injured, 339 homes collapsed — is the latest official figure; an earlier Central News Agency item had put injuries at 54. Rescue work continues on the ground.\n\nWhy it matters\nA shallow magnitude 7 quake in a remote plateau county: casualty figures are still moving, and the next 24 hours of rescue will set the final toll. For readers, the only safe number right now is the latest official update.\n\nSources agree / disagree\nThis cluster draws on Central News Agency reporting, which cites Xinhua for the latest figures. Warning — conflicting accounts: an earlier CNA item reported 54 injured, while Xinhua's 2:25 a.m. update says 32 (11 serious, 21 minor). Figures are being revised as rescue continues; cite only the newest official release. Trust label: accounts differ (figures updating).\n\nStill uncertain\nFinal casualty and damage counts are pending official updates; verify the newest bulletin before citing numbers."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-01-7-10-16-32-300\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-taiwan-01-7-10-16-32-300.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 西藏那曲地震規模7深度僅10公里　已知16死32傷、逾300屋倒\",\"zh-TW\":\"相關封面圖：西藏那曲地震規模7深度僅10公里　已知16死32傷、逾300屋倒\"},\"publishedAt\":\"2026-10-23T02:24:59.000Z\",\"title\":{\"en\":\"Magnitude 7 Quake Strikes Nagqu, Tibet: 16 Dead, Injury Count Revised to 32\",\"zh-TW\":\"西藏那曲巴青縣規模 7 強震：16 死、傷者下修為 32 人，習近平指示全力搜救\"},\"summary\":{\"en\":\"A shallow magnitude 7 quake hit Baqing County, Nagqu, Tibet late last night: 16 dead, 32 injured (11 seriously) and 339 homes collapsed per Xinhua's 2:25 a.m. update; Xi Jinping ordered all-out rescue. Conflicting reports: an earlier CNA item said 54 injured. Takeaway: figures are still moving — cite only the latest official update.\",\"zh-TW\":\"西藏那曲巴青縣昨晚規模 7 強震（深度僅 10 公里）：新華社今晨 2:25 更新為 16 死 32 傷、339 屋倒塌；習近平指示全力搜救。⚠ 說法衝突：中央社稍早寫 54 傷。takeaway：數字還在跑，引用只認最新官方通報。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"中國西藏那曲市巴青縣昨晚發生規模 7 地震，震源深度僅 10 公里，已知 16 人死亡。\\n發生了什麼事\\n根據中國官媒新華社，截至今晨 2 時 25 分，這起地震已造成 16 人遇難、32 人受傷（重傷 11 人、輕傷 21 人），房屋倒塌 339 戶。中國領導人習近平要求全力展開人員搜救、妥善安置受災群眾。陸委會今天上午代表政府向對岸表達慰問，並提醒在當地的台灣民眾留意自身安全。現場搜救持續進行中。\\n為什麼重要\\n淺層強震加高原偏鄉，傷亡數字還在跑——未來 24 小時的搜救將決定最終數字。對讀者來說，現在唯一能信的數字就是最新官方通報。\\n來源異同\\n本批為中央社系列報導，最新數字引自新華社。⚠ 說法衝突，尚未證實：中央社稍早一則寫 54 傷，新華社今晨 2:25 更新為 32 傷（重傷 11、輕傷 21）——數字隨搜救更新，引用請以最新官方通報為準。信任標籤：敘述有分歧（數字更新中）。\\n仍不確定\\n最終傷亡與房屋倒塌數待官方更新；引用數字前請查最新通報。\"},\"sources\":[{\"name\":\"中央社-兩岸\",\"url\":\"https://www.cna.com.tw/news/acn/202610230044.aspx\"}],\"disagreements\":{\"en\":\"Injury figures differ: an earlier CNA item reported 54 injured; Xinhua's 2:25 a.m. update says 32 (11 serious, 21 minor).\",\"zh-TW\":\"傷亡數字不一：中央社稍早一則報 54 傷；新華社今晨 2:25 更新為 32 傷（重傷 11、輕傷 21）。\"},\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"中央社-兩岸\",\"中央社-兩岸\",\"中央社-兩岸\"],\"glossary\":[{\"term\":{\"en\":\"Baqing County\",\"zh-TW\":\"巴青縣\"},\"blurb\":{\"en\":\"County in Nagqu, Tibet, where the quake struck.\",\"zh-TW\":\"地震發生的西藏那曲縣份。\"}},{\"term\":{\"en\":\"Nagqu\",\"zh-TW\":\"那曲\"},\"blurb\":{\"en\":\"City in northern Tibet.\",\"zh-TW\":\"西藏北部的城市。\"}},{\"term\":{\"en\":\"Xinhua\",\"zh-TW\":\"新華社\"},\"blurb\":{\"en\":\"Chinese state news agency providing the latest figures.\",\"zh-TW\":\"提供最新傷亡數字的中國官媒。\"}},{\"term\":{\"en\":\"Xi Jinping\",\"zh-TW\":\"習近平\"},\"blurb\":{\"en\":\"Chinese leader who ordered all-out rescue efforts.\",
