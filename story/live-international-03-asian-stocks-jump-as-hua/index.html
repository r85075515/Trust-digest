al-intelligence trade. Nvidia's value climbed by almost $1 trillion, and President Trump said he had pressed the company's board to reinstate Huang.\nWhat happened\nAccording to the BBC, CNBC, MarketWatch, and 19 other outlets, Huang is back as Nvidia's chief executive. Trump said his administration assured Nvidia's board that Huang would not be a national security threat if reinstated, and he also said he had convinced the board to bring Huang back. Huang's return powered a sharp rebound in U.S. stocks on Monday and lifted Asian markets, with Nvidia's value rising by almost $1 trillion. Several outlets noted that Huang's role at the centre of Nvidia's rise to the linchpin of artificial intelligence made his return pivotal to market confidence.\nWhy it matters\nNvidia sits at the heart of the artificial-intelligence boom, so Huang's fate directly shapes confidence in technology stocks and the AI trade worldwide. His return not only restored nearly $1 trillion in market value but also flipped market sentiment in a single session, showing how much influence one leader can carry. Trump's public role in pressing for the reinstatement also drew backlash, raising questions about the line between politics and corporate governance.\nSources agree / disagree\nTwenty-two outlets agree on the core facts: Huang is back as chief executive, Trump intervened, Nvidia's value rose by almost $1 trillion, and Asian and U.S. stocks rallied together. Angles differ: some outlets focus on the backlash against Trump's intervention, others on the scale of the market rebound. Trust label: Multi-source agreement — twenty-two outlets agree on the core facts, with differences limited to individual details and angles.\nStill uncertain\nThe material does not explain why Huang left, the terms of his reinstatement, or how the board reached its decision. The specifics of the administration's assurance on national security are also unstated, and the basis for the near-$1 trillion valuation gain is not spelled out."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-03-asian-stocks-jump-as-hua\",\"category\":\"international\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-international-03-asian-stocks-jump-as-hua.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Asian Stocks Jump as Huang’s Return Lifts AI Trade: Markets Wrap\",\"zh-TW\":\"相關封面圖：隨著黃仁勳的回歸提振人工智慧貿易，亞洲股市上漲：市場總結\"},\"publishedAt\":\"2026-11-24T05:00:29.000Z\",\"title\":{\"en\":\"Jensen Huang's Return as Nvidia CEO Lifts Asian Stocks and Revives the AI Trade\",\"zh-TW\":\"黃仁勳（Jensen Huang）回任輝達（NVIDIA）執行長，亞洲股市勁揚、AI 題材回溫\"},\"summary\":{\"en\":\"Asian stocks jumped and U.S. shares posted their best day in more than a year after Jensen Huang returned as Nvidia's chief executive, restoring faith in the artificial-intelligence trade. President Trump said he pressed Nvidia's board to reinstate Huang, and Nvidia's value climbed by almost $1 trillion.\",\"zh-TW\":\"黃仁勳（Jensen Huang）回任輝達（NVIDIA）執行長後，亞洲股市勁揚，美股也創下一年多來最佳單日表現，人工智慧題材信心回溫。川普（Donald Trump）總統表示曾敦促輝達（NVIDIA）董事會讓黃仁勳復職，輝達（NVIDIA）市值大增近 1 兆美元。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"黃仁勳（Jensen Huang）回任輝達（NVIDIA）執行長，帶動亞洲股市勁揚，美股也在週一創下一年多來最佳單日表現，人工智慧題材信心迅速回溫。輝達（NVIDIA）市值大增近 1 兆美元，川普（Donald Trump）總統則表示，是他敦促輝達（NVIDIA）董事會讓黃仁勳復職。\\n發生了什麼事\\n根據英國廣播公司（BBC）、美國消費者新聞與商業頻道（CNBC）、《市場觀察》（MarketWatch）等 22 家媒體的報導，黃仁勳已回任輝達（NVIDIA）執行長。川普（Trump）總統表示，他的政府向輝達（Nvidia）董事會保證，黃仁勳（Huang）復職不會構成國家安全威脅；他也表示曾說服輝達（Nvidia）讓黃仁勳（Huang）復職。黃仁勳回歸後，美國股市週一大幅反彈，亞洲股市同步勁揚，輝達（NVIDIA）市值增加近 1 兆美元。多家媒體指出，黃仁勳身為公司邁向人工智慧核心的關鍵人物，他的回歸恢復了市場對人工智慧題材的信心。\\n為什麼重要\\n輝達（NVIDIA）是人工智慧浪潮的核心企業，黃仁勳的去留直接牽動全球科技股與人工智慧題材的信心。他的回歸不僅帶動輝達（NVIDIA）市值回升，也讓整體市場情緒在單日內迅速翻轉，顯示個別領袖人物對市場的影響力。同時，川普公開表示曾說服輝達（NVIDIA）董事會一事，也引來反彈聲浪。\\n來源異同\\n22 家媒體對核心事實一致：黃仁勳回任執行長、川普曾介入、輝達（NVIDIA）市值大增近 1 兆美元、亞洲與美股同步勁揚。分歧僅在角度：有的聚焦川普介入引發的反彈，有的強調市場反彈的幅度。信任標籤：多源一致——22 家媒體對核心事實的報導一致，歧異僅在個別細節與角度。\\n仍不確定\\n黃仁勳離職的原因、復職的具體條件與董事會決策過程，以及川普政府所謂「國家安全保證」的具體內容，素材皆未說明。市值增加近 1 兆美元的計算基準與時間範圍也未見統一說法。\"},\"sources\":[{\"name\":\"BBC World\",\"url\":\"https://www.bbc.co.uk/news/articles/cq5y1k8ez407o?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"CNBC\",\"url\":\"https://www.cnbc.com/2026/11/23/trump-nvidia-jensen-huang.html\"},{\"name\":\"MarketWatch\",\"url\":\"https://www.marketwatch.com/story/u-s-stocks-see-best-day-in-more-than-a-year-as-return-of-jensen-huang-revives-ai-enthusiasm-c3b9d274?mod=mw_rss_topstories\"},{\"name\":\"The Guardian Business\",\"url\":\"https://www.theguardian.com/technology/2026/nov/23/jensen-huang-reinstated-as-nvidia-chief-executive\"},{\"name\":\"Financial Times Markets\",\"url\":\"https://www.ft.com/content/ecdc724e-5923-4e57-9d72-c6551c9634f9?syn-25a6b1a6=1\"},{\"name\":\"TechCrunch\",\"url\":\"https://techcrunch.com/2026/11/23/elon-musk-and-others-rejoice-as-jensen-huang-is-reinstated-at-nvidia-amid-scandal/\"},{\"name\":\"The Verge\",\"url\":\"https://www.theverge.com/ai-artificial-intelligence/1040652/jensen-huang-nvidia-trump-reinstated\"},{\"name\":\"Wired AI\",\"url\":\"https://www.wired.com/story/jensens-back-stocks-up-what-the-hell-sure/\"},{\"name\":\"The Decoder\",\"url\":\"https://the-decoder.com/nvidia-tried-life-without-jensen-huang-and-it-lasted-about-two-weeks/\"},{\"name\":\"EE Times\",\"url\":\"https://www.eetimes.com/nvidia-board-reinstates-jensen-huang-as-ceo/\"},{\"name\":\"The Next Platform\",\"url\":\"https://www.nextplatform.com/ai/2026/11/23/jensen-huang-back-in-charge-of-nvidia/5311691\"},{\"name\":\"Tom's Hardware\",\"url\":\"https://www.tomshardware.com/tech-industry/big-tech/jensen-huang-returns-to-applause-from-employees-at-nvidia-hq-some-employees-reportedly-disgruntled-by-return-saying-this-is-the-worst-outcome\"},{\"name\":\"DigiTimes\",\"url\":\"https://www.digitimes.com/news/a20261124VL210/nvidia-jensen-huang-ceo-security-government.html\"},{\"name\":\"Bloomberg Markets\",\"url\":\"https://www.bloomberg.com/news/articles/2026-11-23/stock-market-today-dow-s-p-live-updates\"},{\"n
