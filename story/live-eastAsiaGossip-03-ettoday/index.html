nd Bill Gates, while ETtoday's headline says his wife could receive about NT$2 trillion in a divorce. Liberty Times reports Taiwan stock index futures fell more than 700 points in night trading, and says the drop is suspected — not proven — to be linked to the affair news. Yahoo Taiwan carries a fortune-teller's claim that Huang fell genuinely in love while the woman treated it as a mission, an unverified piece of gossip. ETtoday's headline also raises the legal question of whether the wife could sue the other woman.\nWhy it matters\nThe story has jumped the gossip pages because of who Huang is: the chief executive of the company at the centre of the AI boom, whose private life is now being priced by markets and scrutinised for a counterintelligence angle. The money figures are the hook, but the reason the story keeps growing is that the affair is alleged to involve a suspected intelligence collector — a thread covered in its own card.\nSources agree / disagree\nOutlets agree that Huang admitted the affair in the November 8 letter. The reported figures differ — NT$2.65 trillion from TechNews against about NT$2 trillion from ETtoday — and are presented here in parallel; note also that TechNews's own article URL carries the figure 2.58 trillion, against 2.65 trillion in its headline. The market link is speculative, flagged as suspected by Liberty Times. The same cluster also bundles unrelated infidelity items involving an influencer and a restaurant owner and a YouTuber couple, which are separate stories. Trust label: Multi-source agreement — outlets agree Huang admitted the affair; reported figures differ and the market link is unproven.\nStill uncertain\nThe letter's full text is not in the feed, and the woman was not named in the snippets. Whether any divorce proceedings exist, what the settlement figures are based on, and whether the futures drop had anything to do with the news are all unconfirmed."])</script><script>self.__next_f.push([1,"11:T402,"])</script><sc \",\"zh-TW\":\"輝達（NVIDIA）執行長黃仁勳（Jensen Huang）8日發信給全體員工，承認婚外情並向家人道歉。焦點隨即轉向金錢：科技新報稱天價「分手費」達2.65兆，ETtoday 標題則稱離婚妻子可分約兩兆；自由時報稱台指期夜盤一度重挫逾700點，疑似受消息影響。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"輝達（NVIDIA）執行長黃仁勳8日發信給全體員工，承認婚外情並向家人道歉。不到一天，報導焦點已從認罪本身轉向金錢：台媒競相計算可能的離婚分產數字，還有媒體稱消息震動了台指期夜盤。\\n發生了什麼事\\n據科技新報等媒體報導，黃仁勳8日發信給全體員工，承認婚外情並向家人道歉。科技新報稱天價「分手費」達2.65兆，超越貝佐斯（Jeff Bezos）與蓋茲（Bill Gates）的離婚代價；ETtoday 標題則稱，離婚妻子可分約兩兆。自由時報報導，台指期夜盤一度重挫逾700點，並稱跌勢「疑似」受到婚外情消息影響——是揣測，未經證實。Yahoo 轉述命理師說法，稱黃仁勳「動了真情」、女方「只當任務」，屬於未經證實的八卦。ETtoday 標題另提到妻子想告小三「沒門」的法律問題。\\n為什麼重要\\n這則新聞跳出八卦版面，關鍵在於黃仁勳的身分：AI 熱潮核心企業的執行長，私生活如今被市場計價、也被放在反情報的放大鏡下檢視。金錢數字是鉤子，故事不斷擴大的原因是，這段婚外情據稱牽涉疑似情報蒐集者——相關線索另有專卡處理。\\n來源異同\\n各家對黃仁勳8日發信認罪一致；金額數字不同——科技新報稱2.65兆、ETtoday 稱約兩兆——已並列呈現；另請注意，科技新報文章網址中的數字是2.58兆，與其標題的2.65兆不一。市場連動只是揣測，自由時報已標註「疑似」。同集群另併入網紅出軌餐廳老闆、YouTuber 夫妻出軌等無關報導，皆為不同事件。信任標籤：多源一致——各家對認罪一事的報導一致，金額數字有出入、市場連動未獲證實。\\n仍不確定\\n信件全文不在來源摘要中，女方姓名亦未在摘要中揭露。是否真有離婚程序、分產數字有何依據、期貨夜盤下跌是否與消息有關，目前皆未獲證實。\"},\"sources\":[{\"name\":\"TechNews 科技新報\",\"url\":\"https://technews.tw/2026/11/09/jensen-huang-affair-admission-2-58-trillion-separation-fee-shocks-more-than-bezos-gates/\"},{\"name\":\"自由時報\",\"url\":\"https://ec.ltn.com.tw/article/breakingnews/5634629\"},{\"name\":\"Yahoo TW 娛樂\",\"url\":\"https://tw.news.yahoo.com/%E9%BB%83%E4%BB%81%E5%8B%B3%E5%87%BA%E8%BB%8C%E5%85%B1%E7%A2%9F%E5%B0%8F%E4%B8%89-%E5%91%BD%E7%90%86%E5%B8%AB%E7%88%86%E4%BB%96-%E5%8B%95%E4%BA%86%E7%9C%9F%E6%83%85-%E5%A5%B3%E6%96%B9%E5%8F%AA%E7%95%B6%E4%BB%BB%E5%8B%99-071600725.html\"},{\"name\":\"ettoday.net\",\"url\":\"https://news.google.com/rss/articles/CBMiUkFVX3lxTE1HTkJKNF9tU2o4SkxWVDJ3Q2RfVjVnX1pqZWxuNnp0YURqVFFkTnNTLXRnNmpoSUVaYmZudWl4VHlVazN5bmFhRUs4TUk0bVlYc1HSAVBBVV95cUxQdF8yNmJ1TWVoSDNKU2dzYm1mbEl6UU1BQ0VlVnY2amhLZ1dZNmhTZmI5VkpjVDdBckl4X2tuay1OZ1ZxUmE4NVNkQVh0cHJNRA?oc=5\"},{\"name\":\"singtaodaily星島日報加拿大\",\"url\":\"$11\"},{\"name\":\"網路溫度計dailyview\",\"url\":\"https://news.google.com/rss/articles/CBMiU0FVX3lxTE1Ua0twdEV2NFNCWVpINzVwa1liRWkyWFlyU2xzVEhMOWpUdEhIZGVlY2RRMER6S
