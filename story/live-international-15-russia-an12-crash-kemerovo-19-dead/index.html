is a Soviet-designed four-engine turboprop transport that has been in service since the late 1950s and remains in use with Russia's military. Early reports from the newspaper Izvestia put the death toll at 17; the Defence Ministry's figure of 19 — all on board — is the confirmed count. Russian officials have not said what flight the aircraft was performing or what it was carrying.\n\nWhy it matters: It is one of the deadliest Russian military aviation accidents in recent years, and it lands on an aging transport fleet that has been worked hard through the war in Ukraine. Moscow's attribution to a technical malfunction came quickly and before any investigation could report; with the fleet's age, maintenance and sanctions-driven parts shortages are the context investigators and outside analysts will weigh — though nothing public yet links this crash to any specific cause beyond the ministry's preliminary statement.\n\nSources agree / disagree: Reuters relayed the ministry's account via RIA; the only numerical discrepancy is the early Izvestia toll of 17 versus the ministry's confirmed 19.\n\nStill uncertain: The aircraft's mission and cargo, the identities of the 19 killed, and any findings beyond the preliminary \"technical malfunction\" line.\n\nTrust label: Developing — based on the Russian Defence Ministry's statement carried by state media and Reuters; independent verification from the scene is not available."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"adult\":false,\"body\":{\"en\":\"$10\",\"zh-TW\":\"發生了什麼事\\n俄羅斯國防部經國營通訊社 RIA 表示，一架軍用 An-12 運輸機週二在西伯利亞西南部的克麥羅沃州（Kemerovo）墜毀，機上 19 人全數罹難。國防部稱初步原因為技術故障，飛機墜落在無人居住地區、亞古諾沃村（Yagunovo）附近。州長謝列久克（Ilya Seredyuk）在現場透過 Telegram 表示，緊急人員已撲滅現場火勢。\\n\\n為什麼重要\\nAn-12 是蘇聯時期設計的四引擎渦輪螺旋槳運輸機，1950 年代末服役至今，仍為俄軍現役機型。《消息報》（Izvestia）早期報導的死亡人數為 17 人；國防部的 19 人（機上全員）為確認數字。俄方未說明這架飛機當時執行什麼任務、載運什麼。這是俄羅斯軍用航空近年最致命的事故之一，發生在烏克蘭戰爭期間被高強度使用的老舊運輸機隊上。莫斯科在任何調查報告出爐前就很快歸因於技術故障；以這支機隊的機齡、維修狀況與制裁下的零件短缺為背景，這些因素會是調查與外部分析的衡量重點——但目前公
