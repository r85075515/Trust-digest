pany, based in Raleigh, North Carolina, will assume substantially all deposits and purchase substantially all assets of United Fidelity Bank, fsb, headquartered in Evansville, Indiana. First-Citizens Bank issued a companion announcement confirming the whole-bank purchase arrangement.\n\nWhy it matters\nFDIC deposit assumption and asset purchase agreements resolve bank closures in an orderly manner that protects insured depositors and preserves banking continuity in affected communities. Coverage by an established regional lender helps stabilize local lending and payment operations without prolonged service disruptions.\n\nSource differences\nThe FDIC press release titled \"First-Citizens Bank \u0026 Trust Company, Raleigh, North Carolina Assumes Substantially All Deposits and Purchases Substantially All Assets of United Fidelity Bank, fsb, Evansville, Indiana\" sets out the official regulatory transaction terms. First Citizens Bank's release titled \"First Citizens Bank Enters into Whole Bank Purchase of United\" confirms the whole-bank purchase structure, while Dealroom's coverage titled \"First Citizens buys failed United Fidelity, assumes $4.5B in deposits\" references 4.5 billion USD in assumed deposits.\n\nStill uncertain\nFinal accounting adjustments on acquired assets, exact branch transition details beyond initial customer notices, and any remaining uninsured deposit or loss-share settlement figures have not been fully detailed.\n\nTrust label: Official confirmation — Confirmed via the official FDIC press release and First Citizens Bank announcement, alongside financial news coverage from Dealroom."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-324-first-citizens-united-fidelity-fdic\",\"category\":\"finance\",\"title\":{\"en\":\"First-Citizens Bank Assumes Deposits and Assets of United Fidelity Bank in FDIC Deal\",\"zh-TW\":\"第一公民銀行透過 FDIC 交易承接聯合富達銀行存戶與資產\"},\"summary\":{\"en\":\"First-Citizens Bank \u0026 Trust Company has agreed to assume substantially all deposits and purchase substantially all assets of Evansville, Indiana-based United Fidelity Bank, fsb in an FDIC-handled transaction.\",\"zh-TW\":\"北卡羅來納州羅里市的第一公民銀行（First-Citizens Bank \u0026 Trust Company）與聯邦存款保險公司（FDIC）達成協議，承接印第安納州埃文斯維爾聯合富達銀行（United Fidelity Bank, fsb）絕大部分存款與資產，此舉讓存戶得以維持日常金融服務運作並降低區域銀行風險外溢。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」聯邦存款保險公司（FDIC）於 2026 年 11 月 27 日發布公告，由總部位於北卡羅來納州羅里的第一公民銀行（First-Citizens Bank \u0026 Trust Company）承接總部位於印第安納州埃文斯維爾的聯合富達銀行（United Fidelity Bank, fsb）絕大部分存款並收購其絕大部分資產。第一公民銀行亦同步發布聲明確認該整行收購安排。\\n\\n「為什麼重要」透過 FDIC 安排由穩健銀行承接存款與資產，有助於在銀行關閉後維持存戶資金存取與金融服務連續性，避免地方信貸與支付體系出現劇烈震盪。\\n\\n「來源異同」FDIC 官方新聞稿《First-Citizens Bank \u0026 Trust Company, Raleigh, North Carolina Assumes Substantially All Deposits and Purchases Substantially All Assets of United Fidelity Bank, fsb, Evansville, Indiana》載明監管處置與承接架構；第一公民銀行官方新聞稿《First Citizens Bank Enters into Whole Bank Purchase of United》確認整行收購模式，而財經媒體 Dealroom 報導《First Citizens buys failed United Fidelity, assumes $4.5B in deposits》則提及承接 45 億美元存款規模。\\n\\n「仍不確定」承接資產的最終帳面評價調整、分行營運移轉的完整執行細節，以及後續清算結算明細仍待官方進一步公布。\\n\\nTrust label: Official confirmation — 依據 FDIC 官方新聞稿與第一公民銀行公告確認，並參考 Dealroom 財經報導交叉核對。\"},\"glossary\":[{\"term\":{\"en\":\"FDIC\",\"zh-TW\":\"聯邦存款保險公司\"},\"blurb\":{\"en\":\"An independent U.S. government agency that insures bank deposits and manages receiverships of failed insured banks.\",\"zh-TW\":\"負責為美國銀行存款提供保險，並在投保銀行倒閉時接管與處置資產負債的聯邦機構。\"}},{\"term\":{\"en\":\"Deposit Assumption\",\"zh-TW\":\"存款承接\"},\"blurb\":{\"en\":\"A resolution mechanism in which an acquiring bank takes over deposit liabilities from a closed institution.\",\"zh-TW\":\"由收購銀行接手停業金融機構存款負債的處置機制，以確保存戶帳戶延續運作。\"}},{\"term\":{\"en\":\"Whole Bank Purchase\",\"zh-TW\":\"整行收購\"},\"blurb\":{\"en\":\"An acquisition structure in which the buyer purchases substantially all assets and assumes substantially all deposits of the target bank.\",\"zh-TW\":\"買方整體收購目標銀行絕大部分資產並
