issued a unanimous 7-0 opinion authored by Justice Wesley G. Russell, Jr. (Wesley G. Russell, Jr.) in Ginevan v. Commonwealth (Record No. 250051), reversing the Court of Appeals of Virginia and vacating defendant Derek Wade Ginevan's (Derek Wade Ginevan) conviction under Virginia Code § 18.2-308.2 for possessing a firearm after a prior felony conviction. The court concluded that felons are not categorically excluded from \"the people\" protected by the Second Amendment and held that the Commonwealth failed to demonstrate that permanently disarming Ginevan aligned with the nation's historical tradition of firearm regulation.\n\nWhy it matters\nAlthough the ruling is narrow and applies specifically to Ginevan's record, it opens the door for other individuals in Virginia whose prior felony convictions lacked actual violence or present dangerousness to mount as-applied Second Amendment challenges against lifetime state firearm bans. At the same time, federal law continues to prohibit convicted felons from purchasing firearms.\n\nSource differences\nThe official Supreme Court of Virginia opinion—titled \"Opinion of the Supreme Court of Virginia\"—sets forth the full constitutional analysis under Code § 18.2-308.2 and reverses the lower appellate ruling. Courthouse News Service reported the decision under \"Virginia Supreme Court rules state unconstitutionally disarmed nonviolent felon\", adding legal commentary on habeas petitions and noting that federal firearm purchase prohibitions remain intact. The Free Lance News covered the ruling under \"FELONS HAVE RIGHT TO GUNS IF THEY'RE NO LONGER DANGEROUS, US COURTS BEGIN FINDING\", detailing the 2023 domestic disturbance shotgun arrest and comparing the decision with federal Third Circuit rulings.\n\nStill uncertain\nHow Virginia trial courts will apply the \"historical tradition\" and dangerousness standard to future as-applied challenges by defendants with varied felony records, and whether federal prosecutors will pursue parallel federal charges in similar cases, remains uncertain.\n\nTrust label: Official confirmation — Verified directly against the Supreme Court of Virginia's November 25, 2026 opinion in Record No. 250051 alongside independent legal reporting from Courthouse News Service and The Free Lance News."])</script><script>self.__next_f.push([1,"11:T869,"])</script><script>self.__next_f.push([1,"「發生了什麼事」\n維吉尼亞州最高法院於2026年11月25日就「吉內萬訴維吉尼亞邦案」（Ginevan v. Commonwealth，案號 Record No. 250051）公布由大法官小衛斯理・G・羅素（Wesley G. Russell, Jr.）撰寫的7比0一致判決書，推翻維吉尼亞州上訴法院原判，並撤銷被告德里克・韋德・吉內萬（Derek Wade Ginevan）依《維吉尼亞法典》第18.2-308.2條（Code § 18.2-308.2）所受的重罪後非法持槍定罪。法院認定重罪犯並未被排除在美國憲法第二修正案所保障的「人民」（the people）之外，且州政府未能證明永久剝奪吉內萬的擁槍權符合美國歷史上的槍械管制傳統。\n\n「為什麼重要」\n儘管此項判決屬限縮性適用（as-applied）裁定、僅直接適用於吉內萬個案，但為維吉尼亞州其他前科未涉及實質暴力或當前危險性的重罪犯開啟依據憲法第二修正案挑戰州法終身禁槍令的先例；不過聯邦法律仍禁止重罪犯購買槍械。\n\n「來源異同」\n維吉尼亞州最高法院官方判決書以「Opinion of the Supreme Court of Virginia」發布完整法理論證並推翻上訴法院判決；法律新聞媒體 Courthouse News Service 以「Virginia Supreme Court rules state unconstitutionally disarmed nonviolent felon」報導此案，補充法律界對人身保護令申訴的評估並點出聯邦購槍禁令依然有效；The Free Lance News 則以「FELONS HAVE RIGHT TO GUNS IF THEY'RE NO LONGER DANGEROUS, US COURTS BEGIN FINDING」報導2023年警方接獲家庭糾紛報案查獲霰彈槍的案情背景，並對照聯邦第三巡迴上訴法院近期相關判例。\n\n「仍不確定」\n維吉尼亞州各級初審法院未來將如何針對不同前科類型的被告界定「歷史傳統」與「危險性」審查門檻，以及聯邦檢方是否會在類似案件中改依聯邦法起訴，仍有待後續司法實務釐清。\n\nTrust label: Official confirmation — 已直接核對維吉尼亞州最高法院2026年11月25日第250051號判決書原文，並獲 Courthouse News Service 與 The Free Lance News 獨立報導佐證。"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-us-303-virginia-supreme-court-ginevan-second-amendment-ruling\",\"category\":\"us\",\"title\":{\"en\":\"Virginia Supreme Court Rules State Unconstitutionally Disarmed Nonviolent Felon\",\"zh-TW\":\"維吉尼亞州最高法院裁定州法永久剝奪非暴力重罪犯擁槍權違憲\"},\"summary\":{\"en\":\"The Supreme Court of Virginia unanimously ruled on November 25 in Ginevan v. Commonwealth (Record No. 250051) that Virginia's statutory ban on firearm possession by felons (Code § 18.2-308.2) violated the
