rict, Rajasthan, with a commercial operation date of November 28, 2026, following a November 27, 2026 exchange filing. Solar capacity at the site now totals 250.05 MW toward a 300 MW solar share within a 400 MW hybrid project that includes 100 MW of wind, backed by a power purchase agreement with NTPC at INR 3.36 per unit, while the same filing also noted battery energy storage system commissioning.\n\nWhy it matters: Bringing another 50.01 MW online advances the solar portion of the Bikaner hybrid installation under a contracted tariff of INR 3.36 per unit with NTPC. It reflects incremental execution of hybrid renewable infrastructure in Rajasthan based on corporate disclosure.\n\nSource differences: All three listed sources trace back to the same exchange filing by ACME Solar. Saur Energy uses the headline \"ACME Solar Commissions an Additional 50.01 MW At Bikaner Hybrid Project\", pv magazine India uses the headline \"ACME Solar commissions 96.24 MW/389.83 MWh of BESS capacity, 50 MW of solar in Rajasthan\", and the NSE exchange filing is an ACME Solar corporate disclosure document (ACMECS_27112026000021_Intimation261126.pdf).\n\nStill uncertain: Details on the exact commissioning schedule for the remaining solar and wind capacity up to the full 400 MW hybrid project scale are not specified in the provided facts.\n\nTrust label: Single source — all three listed items derive from the same corporate exchange filing by ACME Solar."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-energy-458-acme-solar-bikaner-hybrid-50mw\",\"category\":\"energy\",\"title\":{\"en\":\"ACME Solar Commissions Additional 50.01 MW Solar Capacity at Bikaner Hybrid Project\",\"zh-TW\":\"ACME Solar 比卡內爾混合能源電廠再併網 50.01 MW 太陽能\"},\"summary\":{\"en\":\"ACME Renewtech commissioned 50.01 MW of solar capacity at its Bikaner hybrid project in Rajasthan with a November 28, 2026 COD, bringing solar output to 250.05 MW under an NTPC PPA at INR 3.36 per unit. The key takeaway is steady capacity ramp-up toward the 300 MW solar and 400 MW hybrid project target.\",\"zh-TW\":\"ACME Renewtech 於拉賈斯坦邦比卡內爾混合能源電廠再併網 50.01 MW 太陽能，商業運轉日為 2026 年 11 月 28 日，太陽能累計達 250.05 MW 且與 NTPC 簽有每度 3.36 盧比購電協議。關鍵結論是電廠正按既定規模向 300 MW 太陽能與 400 MW 混合案推進。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」ACME Solar Holdings 透過子公司 ACME Renewtech，於拉賈斯坦邦比卡內爾地區 Kelan 村的混合能源電廠再併網 50.01 MW 太陽能裝置容量，商業運轉日為 2026 年 11 月 28 日，公司於 2026 年 11 月 27 日向交易所申報。該廠太陽能累計已併網 250.05 MW（全案太陽能 300 MW，混合電廠總規模 400 MW、含 100 MW 風電），購電協議對象為 NTPC，電價每度 3.36 盧比；同一申報亦提及儲能容量併網。\\n\\n「為什麼重要」新增 50.01 MW 併網使該混合能源電廠的太陽能規模持續推進，並搭配 NTPC 每度 3.36 盧比的購電協議。依公司申報內容顯示，此舉體現拉賈斯坦邦混合型再生能源案場的階段性落實。\\n\\n「來源異同」三條來源皆源於 ACME Solar 同一份交易所申報。Saur Energy 網頁實際標題為「ACME Solar Commissions an Additional 50.01 MW At Bikaner Hybrid Project」；pv magazine India 網頁實際標題為「ACME Solar commissions 96.24 MW/389.83 MWh of BESS capacity, 50 MW of solar in Rajasthan」；NSE 交易所申報為 ACME Solar 公司申報書（ACMECS_27112026000021_Intimation261126.pdf）。\\n\\n「仍不確定」剩餘太陽能與風電容量達至 400 MW 混合電廠全數規模的具體時程，在現有指定事實中尚未載明。\\n\\nTrust label: Single source — 三條來源皆同源於 ACME Solar 同一份交易所申報。\"},\"glossary\":[{\"term\":{\"en\":\"Commercial Operation Date (COD)\",\"zh-TW\":\"商業運轉日（COD）\"},\"blurb\":{\"en\":\"The date a power generation asset begins formal commercial operation.\",\"zh-TW\":\"發電資產正式進入商業運轉的日期。\"}},{\"term\":{\"en\":\"Power Purchase Agreement (PPA)\",\"zh-TW\":\"購電協議（PPA）\"},\"blurb\":{\"en\":\"A long-term contract setting electricity sale terms and tariffs between generator and buyer.\",\"zh-TW\":\"發電方與購電方約定售電條件與電價的長期合約。\"}},{\"term\":{\"en\":\"Hybrid Power Project\",\"zh-TW\":\"混合能源電廠\"},\"blurb\":{\"en\":\"A power facility combining multiple generation or storage technologies at one project.\",\"zh-TW\":\"在同一案場結合多種發電或儲能技術的能源設施。\"}},{\"term\":{\"en\":\"Battery Energy Storage System (BESS)\",\"zh-TW\":\"儲能系統（BESS）\"},\"blurb\":{\"en\":\"Battery infrastructure that stores electrical energy for later dispatch.\",\"zh-TW\":\"儲存電能以供後續調度釋放的電池設施。\"}}],\"sources\":[{\"name\":\"Saur Energy\",\"url\":\"https://www.saurenergy.com/solar-energy-news/acme-solar-commissions-an-additional-5001-mw-at-bikaner-hybrid-project-12844945\"},{\"name\":\"pv magazine India\",\"url\":\"https://www.pv-magazine-india.com/2026/11/27/acme-solar-commissions-96-24-mw-389-83-mwh-of-bess-capacity-50-mw-of-solar-in-rajasthan/\"},{\"name\":\"NSE 交易所申報（ACME Solar 公司申報書）\",\"url\":\"https://nsearchives.nseindia.in/corporate/ACMECS_27112026000021_Intimation261126.pdf\"}],\"imageUrl\":\"/covers/live/live-energy-458-acme-solar-bikaner-hybrid-50mw.jpg\",\"imageAlt\":{\"en\":\"ACME Solar Commissions Additional 50.01 MW Solar Capacity at Bikaner Hybrid Project\",\"zh-TW\":\"ACME Solar 比卡內爾混合能源電廠再併網 50.01 MW 太陽能\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":58,\"trustBreakdown\":{\"crossCorroboration\":12,\"outletReputation\":22,\"recencyClarity\":18,\"sourceDiversity\":6},\"publishedAt\":\"2026-11-28T11:17:19.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":20,\"D2\":20,\"D3\":20,\"D4\":20,\"D5\":20,\"total\":20},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-energy-458-acme-solar-bikaner-hybrid-50mw/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\
