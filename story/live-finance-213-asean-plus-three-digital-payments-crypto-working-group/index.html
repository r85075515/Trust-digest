nance-213-asean-plus-three-digital-payments-crypto-working-group\",\"category\":\"finance\",\"title\":{\"en\":\"China, Japan, South Korea and ASEAN Form Digital Payments and Crypto Working Group\",\"zh-TW\":\"中日韓與東協擬組建數位支付及加密貨幣監管工作組\"},\"summary\":{\"en\":\"China, Japan, South Korea, and ASEAN agreed to form a working group on digital payments and crypto regulation following earlier regional talks. The key takeaway is coordinated cross-border oversight of digital payments and crypto assets across major Asian economies.\",\"zh-TW\":\"中國、日本、南韓與東協同意組建數位支付與加密貨幣監管工作組，延續先前區域會談方向。關鍵結論在於亞洲主要經濟體正推進跨境數位支付與加密資產的協調監管。\"},\"body\":{\"en\":\"「What happened」 China, Japan, South Korea, and ASEAN are set to form a working group focused on digital payments and cryptocurrency regulation, building on earlier regional discussions.\\n「Why it matters」 Bringing together major East and Southeast Asian economies on digital payment rails and crypto rules signals closer regional regulatory coordination.\\n「Source differences」 Coverage highlights the formation of the working group following earlier talks in May, while detailed governance terms and timelines are not fully laid out in available summaries.\\n「Still uncertain」 Specific policy rules, implementation timelines, and member-level operational mandates for the working group remain to be announced.\\nTrust label: Single source — Reported by The Block on November 26, 2026.\",\"zh-TW\":\"「發生了什麼事」：中國、日本、南韓與東協同意組建聚焦數位支付與加密貨幣監管的工作組，延續先前區域會談脈絡。\\n「為什麼重要」：東亞與東南亞主要經濟體就數位支付與加密監管建立協作機制，顯示區域金融與數位資產規則協調受到重視。\\n「來源異同」：報導指出工作組源於先前 5 月會談後的推進方向，公開摘要中尚未完整列出具體運作架構與時程。\\n「仍不確定」：工作組的具體監管規範、落地時程與各成員分工細節仍有待後續公布。\\nTrust label: Single source — 目前以 The Block 於 2026 年 11 月 26 日之報導為主。\"},\"glossary\":[{\"term\":{\"en\":\"ASEAN+3\",\"zh-TW\":\"東協加三\"},\"blurb\":{\"en\":\"A regional cooperation framework bringing together ASEAN member states with China, Japan, and South Korea.\",\"zh-TW\":\"由東協成員國加上中國、日本與南韓組成的區域合作架構。\"}},{\"term\":{\"en\":\"Working group\",\"zh-TW\":
