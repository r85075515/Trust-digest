 user, giving non-members a limited window to judge whether it is worth paying for later. The cutoff in late January 2027 is decisive: after it, access depends on membership rather than simply using LINE.\nSources agree / disagree\nOnly one outlet, CNA, was listed, with no second source corroborating the announcement in the material provided. Trust label: Single source — one outlet reported the announcement without independent corroboration in the material provided.\nStill uncertain\nThe missing key information is how call recording works, which calls it covers, where recordings are stored, and any consent or privacy rules. Verify the operating rules and exact end date in the full CNA reporting before relying on the trial terms."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-01-line-1\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-taiwan-01-line-1.jpg\",\"imageAlt\":{\"en\":\"Cover related to: LINE布局訂閱服務　通話錄製功能開放免費試用至明年1月\",\"zh-TW\":\"相關封面圖：LINE布局訂閱服務　通話錄製功能開放免費試用至明年1月\"},\"publishedAt\":\"2026-10-30T06:59:06.000Z\",\"title\":{\"en\":\"LINE Opens Call Recording Free Trial to All Users Until Late January 2027\",\"zh-TW\":\"LINE 通話錄製開放所有用戶免費試用至 2027 年 1 月下旬\"},\"summary\":{\"en\":\"[Unverified, single source] LINE announced that call recording, a new LINE Premium feature, is available free to all users through LINE Labs until late January 2027. After the trial ends it becomes a LINE Premium member-only feature, so non-members should test it before the cutoff.\",\"zh-TW\":\"[未證實·單一來源]LINE 今天宣布，訂閱服務 LINE Premium 新功能「通話錄製」在 LINE Labs 開放所有用戶免費試用至 2027 年 1 月下旬，試用結束後轉為會員專屬功能；非會員要在截止前試用。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"LINE 今天宣布，訂閱服務 LINE Premium 新功能「通話錄製」在 LINE Labs 開放所有用戶免費試用，試用期間預計到 2027 年 1 月下旬。\\n發生了什麼事\\n中央社記者吳家豪台北 30 日報導，LINE 今天宣布上述安排。新功能名為「通話錄製」，屬於 LINE Premium 訂閱服務。試用期間，所有 LINE 用戶都可以在 LINE Labs 免費使用這項功能。試用期間預計到 2027 年 1 月下旬，結束後將轉為 LINE Premium 會員專屬功能。摘要沒有說明錄製如何啟動、錄音檔存放在哪裡、保存多久，也沒有說明同意或通知規則。\\n為什麼重要\\n這項安排的直接意義是 LINE 把原本屬於付費訂閱的功能，限時免費開放給所有用戶，讓非會員有機會在付費前判斷功能是否值得。2027 年 1 月下旬是關鍵截止日，之後能否使用取決於會員身分，而不是單純使用 LINE。想使用錄製功能的用戶要在試用期內體驗並決定，因為摘要沒有承諾延長試用。\\n來源異同\\n這張卡片只有中央社一家來源，提供的資料中沒有第二家來源佐證這項宣布。信任標籤：單一來源——僅一家媒體報導這項宣布，提供的資料中沒有獨立佐證。摘要只說明功能名稱、試用管道、結束日期與之後的會員專屬狀態，沒有可比較的衝突事實。\\n仍不確定\\n仍缺少的關鍵資訊包括通話錄製的運作方式、適用通話範圍、錄音檔存放位置、保存期限，以及同意或隱私規則。摘要沒有說明這些細節；引用試用條件之前，請查閱中央社完整報導或 LINE 公告，核對運作規則、適用對象與確切截止日期。\"},\"sources\":[{\"name\":\"中央社-科技\",\"url\":\"https://www.cna.com.tw/news/ait/202610300163.aspx\"}],\"disagreements\":null,\"trustScore\":59,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"中央社-科技\"],\"glossary\":[{\"term\":{\"en\":\"LINE\",\"zh-TW\":\"LINE\"},\"blurb\":{\"en\":\"Messaging app whose Premium subscription service is adding call recording.\",\"zh-TW\":\"推出通訊服務的公司，其訂閱服務新增通話錄製功能。\"}},{\"term\":{\"en\":\"LINE Premium\",\"zh-TW\":\"LINE Premium\"},\"blurb\":{\"en\":\"LINE subscription service that will keep call recording as a member-only feature after the trial.\",\"zh-TW\":\"LINE 的訂閱服務，試用結束後通話錄製將轉為會員專屬功能。\"}},{\"term\":{\"en\":\"LINE Labs\",\"zh-TW\":\"LINE Labs\"},\"blurb\":{\"en\":\"The channel through which the call recording trial is open to all LINE users.\",\"zh-TW\":\"通話錄製試用開放給所有 LINE 用戶的管道。\"}},{\"term\":{\"en\":\"CNA\",\"zh-TW\":\"中央社\"},\"blurb\":{\"en\":\"Taiwan news agency that reported the LINE announcement from Taipei.\",\"zh-TW\":\"從台北報導 LINE 宣布消息的台灣通訊社。\"}},{\"term\":{\"en\":\"Wu Chia-hao\",\"zh-TW\":\"吳家豪\"},\"blurb\":{\"en\":\"CNA reporter credited with the Taipei report on the LINE announcement.\",\"zh-TW\":\"撰寫 LINE 宣布消息台北報導的中央社記者。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\
