— from a 4.4-fen gap at the open to more than 1.6 jiao within the morning session — shows selling pressure building rather than fading. Currency moves of this size shape import costs and exporters' margins, so the open sets the tone for the day's trading.\nSources agree / disagree\nThis card rests on a single CNA report, so there is no second outlet to check the figures against. Trust label: Single source — one outlet reported the market open.\nStill uncertain\nThe snippet gives no reason for the slide, no closing rate and no comment from the central bank or market participants. It is also unclear whether the currency steadied after the early low or kept falling. Check the full reporting for the close and for any explanation of the move."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-03-4-4-1-6-33\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-taiwan-03-4-4-1-6-33.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 新台幣開盤貶4.4分　早盤重貶逾1.6角見33元\",\"zh-TW\":\"相關封面圖：新台幣開盤貶4.4分　早盤重貶逾1.6角見33元\"},\"publishedAt\":\"2026-11-06T01:12:35.000Z\",\"title\":{\"en\":\"New Taiwan Dollar Slides Past NT$33 in Early Trading\",\"zh-TW\":\"新台幣開盤貶 4.4 分，早盤重貶逾 1.6 角見 33 元\"},\"summary\":{\"en\":\"The New Taiwan dollar opened at NT$32.92 against the US dollar on 6 November, down 4.4 fen, and slid further in early trading to NT$33.04, a fall of more than 1.6 jiao. The early slide sets the tone for the day's trading — watch whether the currency steadies or extends its fall.\",\"zh-TW\":\"新台幣兌美元 6 日以 32.92 元開盤，貶 4.4 分，早盤貶勢擴大至逾 1.6 角，最低見 33.04 元。開盤走勢為全天交易定調，接下來看匯價能否止穩。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"新台幣兌美元 6 日早盤貶破 33 元，以 32.92 元開盤，最低見 33.04 元。\\n發生了什麼事\\n中央社台北 6 日報導，台北外匯市場新台幣兌美元今天以 32.92 元開盤，貶 4.4 分，隨後貶勢擴大至逾 1.6 角，最低至 33.04 元。新台幣以分為最小單位，1 角等於 10 分，逾 1.6 角的跌幅相當於較前一收盤價貶值逾 16 分。這則報導是開盤後的簡短市況快訊，來源摘要沒有更多細節。\\n為什麼重要\\n33 元是市場留意的整數關卡，開盤只貶 4.4 分，早盤卻擴大到逾 1.6 角，顯示賣壓在早盤加劇而非消退。匯價走勢牽動進口成本
