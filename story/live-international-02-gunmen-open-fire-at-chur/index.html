hunt is now under way. Officials said the shooting was a terrorist act motivated by extremist ideology.\nWhat happened\nA funeral gathering became the target: mourners at an Orthodox church in southern Karak came under gunfire, leaving at least seven dead and 34 injured. The casualty figures are the confirmed core of the story; the search for the attackers was already in progress as the reports were filed.\nWhy it matters\nAn attack on a funeral in a house of worship strikes at two protected spaces at once, mourning and worship, and officials' decision to label it terrorism immediately frames the investigation. The next facts, who the gunmen are and how they were organized, will determine whether this reads as a lone attack or part of a wider campaign.\nSources agree-disagree\nBBC World and NYT World report the same event with the same casualty framing: the BBC headline says seven shot dead at a church funeral, the NYT headline says at least seven killed, and both are consistent with the at-least-seven figure used here. No numeric or name conflicts appear. Trust label: 2-source agreement.\nStill uncertain\nThe feed summaries name no suspects, give no motive beyond officials' extremist-ideology characterization, and report no arrests. The manhunt's outcome and any claim of responsibility remain unknown."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-02-gunmen-open-fire-at-chur\",\"category\":\"international\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-international-02-gunmen-open-fire-at-chur.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Gunmen Open Fire at Church in Jordan, Killing at Least Seven\",\"zh-TW\":\"相關封面圖：槍手在約旦教堂開槍，造成至少七人死亡\"},\"publishedAt\":\"2026-10-23T23:07:34.000Z\",\"title\":{\"en\":\"Jordan Church Funeral Shooting Kills at Least Seven\",\"zh-TW\":\"約旦教堂葬禮槍擊：槍手奪走至少 7 命，34 人受傷\"},\"summary\":{\"en\":\"Gunmen opened fire during a funeral at an Orthodox church in Jordan's southern Karak governorate, killing at least seven people and injuring 34, with a manhunt now under way. Officials called the shooting a terrorist act motivated by extremist ideology. Watch for the manhunt's outcome, and for what officials say about the attackers' identities and motives.\",\"zh-TW\":\"槍手在約旦南部卡拉克省一座東正教教堂的葬禮上開槍，至少 7 人死亡、34 人受傷，搜捕行動正在進行。官員稱這起槍擊是受極端主義意識形態驅動的恐怖攻擊。接下來看搜捕結果，以及官方對槍手身分與動機的說法。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"槍手在約旦一座教堂開槍，至少 7 人死亡、另有 34 人受傷。攻擊發生在南部卡拉克省一座東正教教堂舉行的葬禮上，搜捕行動正在進行。官員稱這起槍擊是受極端主義意識形態驅動的恐怖攻擊。\\n發生了什麼事\\n一場葬禮聚會成了目標：在南部卡拉克省東正教教堂送葬的民眾遭到槍擊，至少 7 死、34 傷。傷亡數字是這則新聞已確認的核心；報導發出時，追捕槍手的行動已經展開。\\n為什麼重要\\n攻擊葬禮上的禮拜場所，等於同時衝擊哀悼與信仰兩個受保護的空間；官員第一時間定調為恐怖攻擊，也立刻框定了調查方向。接下來的關鍵事實是槍手是誰、如何組織，這將決定此事被理解為孤立攻擊，還是更廣泛行動的一環。\\n來源異同\\nBBC 世界版與《紐約時報》世界版報導的是同一事件、同一傷亡框架：BBC 標題寫教堂葬禮上 7 人遭槍殺，《紐約時報》標題寫至少 7 人死亡，兩者都與本卡採用的「至少 7 人」一致，沒有數字或人名衝突。信任標籤：2源一致。\\n仍不確定\\n摘要未點名任何嫌疑人，動機除了官員「極端主義意識形態」的定性外沒有更多細節，也未報導逮捕消息。搜捕結果與有無團體出面認責，目前都未知。\"},\"sources\":[{\"name\":\"BBC World\",\"url\":\"https://www.bbc.co.uk/news/articles/ck87zlpzny15o?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"NYT World\",\"url\":\"https://www.nytimes.com/2026/10/23/world/middleeast/jordan-church-shooting.html\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":20,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"international\",\"live-ingest\",\"bbc-world\",\"nyt-world\"],\"glossary\":[{\"term\":{\"en\":\"Karak\",\"zh-TW\":\"卡拉克\"},\"blurb\":{\"en\":\"Southern Jordanian governorate where the church shooting took place.\",\"zh-TW\":\"教堂槍擊發生的約旦南部省份。\"}},{\"term\":{\"en\":\"BBC\",\"zh-TW\":\"BBC\"},\"blurb\":{\"en\":\"British news outlet that covered the Jordan church shooting.\",\"zh-TW\":\"報導約旦教堂槍擊的英國新聞媒體。\"}},{\"term\":{\"en\":\"The New York Times\",\"zh-TW\":\"紐約時報\"},\"blurb\":{\"en\":\"US news outlet that covered the Jordan church shooting.\",\"zh-TW\":\"報導約旦教堂槍擊的美國新聞媒體。\"}},{\"term\":{\"en\":\"Orthodox Church\",\
