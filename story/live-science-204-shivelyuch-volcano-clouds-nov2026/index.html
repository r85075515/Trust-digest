sia's Kamchatka Peninsula, noting ongoing lava and explosive activity tracked by volcanic monitors.\n\n「Why it matters」 Kamchatka volcanoes sit beneath busy trans-Pacific flight corridors where ash plumes can pose aviation hazards. Satellite remote sensing helps scientists monitor surface changes and volcanic activity even when cloud cover hides the summit from standard views.\n\n「Source differences」 NASA Earth Observatory focuses on orbital imaging and ongoing activity context with cloud cover, while science reporting highlights the visual contrast of the summit and lava dome above clouds and notes past ash plume risks.\n\n「Still uncertain」 Exact eruption intensity shifts, future ash column heights, and near-term aviation advisories depend on ongoing volcanic monitoring updates.\n\nTrust label: Multi-source agreement across NASA science imagery and science news reporting on Shivelyuch volcano observations."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-science-204-shivelyuch-volcano-clouds-nov2026\",\"category\":\"science\",\"title\":{\"en\":\"Satellite Imagery Captures Active Shivelyuch Volcano Above Cloud Deck\",\"zh-TW\":\"衛星影像捕捉堪察加希韋盧奇火山雲層之上活動 持續噴發受監測\"},\"summary\":{\"en\":\"Satellite imagery highlighted in late November 2026 shows Russia's active Shivelyuch volcano amid ongoing lava and explosive activity on the Kamchatka Peninsula. The takeaway is that thermal and orbital observation remains vital for monitoring remote volcanoes obscured by clouds.\",\"zh-TW\":\"2026 年 11 月下旬發布的衛星影像呈現俄羅斯堪察加半島希韋盧奇火山（Shivelyuch）在持續熔岩與爆發活動下的觀測紀錄。關鍵結論是軌道與熱感測觀測對於追蹤易受雲層遮蔽的偏遠火山至關重要。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」2026 年 11 月下旬，美國航太總署（NASA）地球觀測站與科學媒體公布大地衛星 9 號（Landsat 9）拍攝的俄羅斯堪察加半島希韋盧奇火山（Shivelyuch）影像，說明火山監測單位持續追蹤其熔岩與爆發活動。\\n\\n「為什麼重要」堪察加火山群鄰近跨太平洋航路，火山灰雲可能對飛航安全構成風險。當雲層遮蔽火山口時，衛星遙測有助於研究人員掌握地表變化與活動動態。\\n\\n「來源異同」NASA 地球觀測站側重衛星觀測紀錄與雲層下的持續活動背景；科學媒體報導則著重呈現火山頂部與熔岩穹丘穿出雲層的畫面細節，並提及過往火山灰羽流對空域的影響。\\n\\n「仍不確定」後續噴發強度變化、火山灰柱高度以及近期飛航警戒動態，仍須視火山監測單位最新觀測而定。\\n\\nTrust label: Multi-source agreement across NASA science releases and science journalism on Shivelyuch observations.\"},\"glossary\":[{\"term\":{\"en\":\"Landsat 9\",\"zh-TW\":\"大地衛星 9 號\"},\"blurb\":{\"en\":\"An Earth-observing satellite jointly operated by NASA and the U.S. Geological Survey to monitor land surface and environmental changes.\",\"zh-TW\":\"由美國航太總署與美國地質調查局合作的地球觀測衛星，用於監測地表與環境變化。\"}},{\"term\":{\"en\":\"Lava dome\",\"zh-TW\":\"熔岩穹丘\"},\"blurb\":{\"en\":\"A steep mound-shaped mass formed when viscous lava slowly piles up near a volcanic vent.\",\"zh-TW\":\"黏稠度較高的岩漿在火山口附近緩慢推積形成的圓丘狀隆起地形。\"}},{\"term\":{\"en\":\"Remote sensing\",\"zh-TW\":\"遙測\"},\"blurb\":{\"en\":\"Gathering information about an object or area from a distance, typically using satellites or aircraft sensors.\",\"zh-TW\":\"透過衛星或航空器感測器在遠距離蒐集地表或目標物資訊的觀測技術。\"}}],\"sources\":[{\"name\":\"NASA Science\",\"url\":\"https://science.nasa.gov/earth/earth-observatory/shivelyuch-socked-in/\"},{\"name\":\"Earth.com\",\"url\":\"https://www.earth.com/earth-science/one-of-russias-most-active-volcanoes-rises-above-a-sea-of-clouds/\"}],\"imageUrl\":\"/covers/live/live-science-204-shivelyuch-volcano-clouds-nov2026.jpg\",\"imageAlt\":{\"en\":\"Satellite Imagery Captures Active Shivelyuch Volcano Above Cloud Deck\",\"zh-TW\":\"衛星影像捕捉堪察加希韋盧奇火山雲層之上活動 持續噴發受監測\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":82,\"trustBreakdown\":{\"crossCorroboration\":21,\"outletReputation\":23,\"recencyClarity\":21,\"sourceDiversity\":17},\"publishedAt\":\"2026-11-27T19:20:45.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":23,\"D2\":22,\"D3\":21,\"D4\":22,\"D5\":20,\"total\":22},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\
