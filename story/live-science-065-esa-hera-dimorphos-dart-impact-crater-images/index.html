ecraft's Asteroid Framing Camera onNovember 25, 2026, revealing the physical aftermath of NASA's 2022 Double Asteroid Redirection Test (DART) on the roughly 160-meter-wide asteroid Dimorphos. The images show that the half-tonne spacecraft collision flattened one side of Dimorphos with a stadium-sized impact crater and left the asteroid tumbling chaotically while surrounded by hundreds of previously unknown boulders.\n\nHera mission manager Ian Carnelli noted that while NASA's DART proved humanity can alter an asteroid's trajectory, Hera's high-resolution survey reveals how the asteroid's internal structure and surface responded to kinetic impact. Combining orbital deflection data with structural aftermath measurements provides essential benchmarks for designing reliable planetary defense missions against potentially hazardous near-Earth objects.\n\nESA's official mission release, The Guardian, and ZME Science report matching details on the stadium-sized crater, Dimorphos's chaotic rotation, and the newly observed boulder field around Dimorphos and its companion asteroid Didymos.\n\nDetailed measurements of Dimorphos's exact post-impact mass, internal porosity, and crater depth remain under ongoing analysis as Hera continues mapping the binary asteroid system.\n\nTrust label: Multi-source agreement — ESA, The Guardian, and ZME Science report identical Hera spacecraft findings on Dimorphos's crater and chaotic tumbling."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-science-065-esa-hera-dimorphos-dart-impact-crater-images\",\"category\":\"science\",\"title\":{\"en\":\"ESA's Hera Spacecraft Reveals Stadium-Sized Crater on Dimorphos Four Years After NASA DART Impact\",\"zh-TW\":\"歐空局「赫拉號」傳回小行星迪莫弗斯近照，揭露 NASA 撞擊留下的體育場大小隕石坑\"},\"summary\":{\"en\":\"The European Space Agency released the first close-up images from its Hera spacecraft showing a stadium-sized impact crater flattening one face of asteroid Dimorphos four years after NASA's 2022 DART planetary defense test. The observations also revealed chaotic tumbling and hundreds of previously unseen orbiting boulders, advancing future asteroid deflection modeling.\",\"zh-TW\":\"歐洲太空總署（ESA）公布「赫拉號」（Hera）探測器拍攝的首批近距離影像，顯示 2022 年 NASA 雙小行星改道測試（DART）撞擊小行星迪莫弗斯（Dimorphos）後，在其表面留下約體育場大小的撞擊坑並使一側地貌扁平化。影像同時揭露該小行星正呈混沌翻滾狀態且周圍環繞數百顆未知巨石，為未來行星防禦任務提供關鍵物理數據。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n歐洲太空總署（ESA）公布「赫拉號」（Hera）探測器小行星框架相機拍攝的首批近距離影像，首度清晰呈現 2022 年 9 月美國太空總署（NASA）「雙小行星改道測試」（DART）撞擊直徑約 160 公尺小行星迪莫弗斯（Dimorphos）後的地貌變化。影像顯示，重約半噸的探測器撞擊使迪莫弗斯一側表面明顯扁平化、形成一座體育場大小的撞擊坑，並導致該小行星陷入混沌翻滾，周圍還環繞著數百顆先前未曾觀測到的巨石。\\n「為什麼重要」\\n赫拉號任務經理伊恩・卡內利（Ian Carnelli）指出，NASA 的 DART 任務驗證了動能撞擊足以改變小行星軌道，而赫拉號則進一步揭示撞擊對小行星本體結構與碎屑分布造成的真實影響；將兩項任務數據結合，能大幅提升未來設計行星防禦任務以偏轉潛在威脅近地小行星的精準度。\\n「來源異同」\\n歐洲太空總署官方新聞稿、英國《衛報》（The Guardian）與科技媒體《ZME Science》對於體育場大小撞擊坑、迪莫弗斯混沌翻滾狀態以及環繞迪莫弗斯與母星迪迪莫斯（Didymos）的巨石群描述完全一致，無事實分歧。\\n「仍不確定」\\n迪莫弗斯在撞擊後的精確質量變化、內部孔隙結構與撞擊坑具體深度，仍待赫拉號在雙小行星系統持續進行近距離測繪後才能完成量化分析。\"},\"glossary\":[{\"term\":{\"en\":\"Hera mission\",\"zh-TW\":\"赫拉號任務（Hera）\"},\"blurb\":{\"en\":\"A European Space Agency planetary defense spacecraft surveying the binary asteroid system Didymos and Dimorphos after NASA's 2022 kinetic impact test.\",\"zh-TW\":\"歐洲太空總署主導的行星防禦探測任務，負責重返雙小行星系統迪迪莫斯與迪莫弗斯，實地勘察 NASA 動能撞擊後的結構變化。\"}},{\"term\":{\"en\":\"DART (Double Asteroid Redirection Test)\",\"zh-TW\":\"雙小行星改道測試（DART）\"},\"blurb\":{\"en\":\"NASA's 2022 planetary defense mission that intentionally crashed a spacecraft into asteroid Dimorphos to test kinetic orbit deflection.\",\"zh-TW\":\"NASA 於 2022 年執行的首次行星防禦實測任務，透過讓探測器高速撞擊小行星迪莫弗斯以驗證改變其公轉軌道的可行性。\"}},{\"term\":{\"en\":\"Dimorphos\",\"zh-TW\":\"迪莫弗斯（Dimorphos）\"},\"blurb\":{\"en\":\"A roughly 160-meter moonlet orbiting the larger near-Earth asteroid Didymos, serving as the target of the DART and Hera missions.\",\"zh-TW\":\"繞行較大近地小行星迪迪莫斯（Didymos）公轉的衛星小行星，直徑約 160 公尺，為 DART 撞擊與赫拉號勘察的目標天體。\"}}],\"sources\":[{\"name\":\"European Space Agency (ESA)\",\"url\":\"https://www.esa.int/articles/about-us/directorates/operations/space-safety/hera/hera-reveals-stadium-sized-asteroid-crater-left-after-spacecraft-impact\"},{\"name\":\"The Guardian\",\"url\":\"https://www.theguardian.com/science/2026/nov/25/dimorphos-asteroid-spacecraft-crash-closeup-images\"},{\"name\":\"ZME Science\",\"url\":\"https://www.zmescience.com/space/astronomy-space/dart-dimorphos-damage-crater/\"}],\"imageUrl\":\"/covers/live/live-science-065-esa-hera-dimorphos-dart-impact-crater-images.jpg\",\"imageAlt\":{\"en\":\"Close-up image from ESA's Hera spacecraft showing the stadium-sized crater on asteroid Dimorphos\",\"zh-TW\":\"歐空局赫拉號探測器拍攝的小行星迪莫弗斯表面體育場大小撞擊坑近照\"},\"isHeadline\":true,\"isPopular\":true,\"trustScore\":89,\"trustBreakdown\":{\"crossCorroboration\":23,\"outletReputation\":23,\"recencyClarity\":22,\"sourceDiversity\":21},\"publishedAt\":\"2026-11-27T14:47:18.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":5,\"D2\":5,\"D3\":4,\"D4\":4,\"D5\":4,\"total\":22},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-science-065-esa-hera-dimorphos-dart-impact-crater-images/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https:/
