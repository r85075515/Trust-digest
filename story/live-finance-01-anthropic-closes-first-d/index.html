.\nWhat happened\nAnthropic, the AI startup behind the Claude chatbot, began trading on the US stock market on Thursday and became one of the world's most valuable publicly traded businesses. The Guardian reports the closing price at just over $97 and a total market capitalisation of nearly $1.3 trillion. The Register reports that shares rocketed to $111.50 by the end of the initial auction, putting the company's valuation at around $2 trillion with a 34% pop in initial trading. The two figures reflect different moments: $2 trillion at the open, $1.3 trillion at the close.\nWhy it matters\nA frontier AI lab listing at a trillion-dollar valuation means public markets are now pricing AI model companies directly, and investors are paying up front for a business model that is still maturing. The first-day surge also raises the bar: Anthropic will face heavy pressure to justify the valuation in future earnings.\nSources agree / disagree\nThe Guardian and The Register agree that Anthropic listed on Thursday and that its shares surged on the first day. Their valuation figures differ because they capture different trading moments: The Guardian's nearly $1.3 trillion is the closing market value, while The Register's roughly $2 trillion reflects the initial auction, so the two are not directly contradictory.\nStill uncertain\nThe reports also mention a $1.75 trillion figure without fully explaining what it measures, and whether the stock can hold its first-day gains remains to be seen. Complete trading data will come from exchange records.\nTrust label: Two-source agreement — Both outlets agree on the IPO debut and the sharp first-day rise, while their valuation figures reflect different trading moments."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-01-anthropic-closes-first-d\",\"category\":\"finance\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-finance-01-anthropic-closes-first-d.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Anthropic closes first day of public trading at $1.3tn valuation after largest-ever IPO\",\"zh-TW\":\"相關封面圖：Anthropic 在有史以來最大規模的 IPO 後以 1.3 兆美元的估值完成公開交易首日收盤\"},\"publishedAt\":\"2026-11-19T22:09:18.000Z\",\"title\":{\"en\":\"Anthropic Closes First Trading Day at $1.3tn After Record IPO\",\"zh-TW\":\"安特羅普克（Anthropic）上市首日收盤估值 1.3 兆美元，創史上最大 IPO 紀錄\"},\"summary\":{\"en\":\"Anthropic closed its first day of public trading at just over $97 a share, about 17% above its $83 IPO price, with a market value of nearly $1.3 trillion, according to The Guardian. The Register reported shares hit $111.50 and a roughly $2 trillion valuation in initial trading, reflecting an earlier moment. Watch whether the stock holds its first-day gains.\",\"zh-TW\":\"AI 新創安特羅普克（Anthropic）上市首日收盤價略高於 97 美元，較 83 美元發行價漲約 17%，市值近 1.3 兆美元；但《The Register》稱開盤時股價衝上 111.50 美元、估值約 2 兆美元，兩方數字反映不同交易時點。接下來看股價能否守住首日漲幅。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"AI 新創安特羅普克（Anthropic）上市首日收盤價略高於 97 美元，較 83 美元發行價漲約 17%，市值近 1.3 兆美元，創下史上最大 IPO 紀錄。\\n發生了什麼事\\n安特羅普克（Anthropic）是 Claude 聊天機器人的開發商，週四在美國股市掛牌，首日收盤價略高於 97 美元，總市值接近 1.3 兆美元。《衛報》稱其成為全球最有價值的上市企業之一。《The Register》則報導，開盤交易時股價一度衝上 111.50 美元，估值約 2 兆美元，漲幅 34%。兩方數字反映不同交易時點：2 兆美元是開盤初期的估值，1.3 兆美元是收盤市值。\\n為什麼重要\\n一家 AI 前沿實驗室以兆美元級估值上市，代表公開市場正式為 AI 模型公司定價，投資人對 AI 產業的熱度直接寫進股價。首日大漲也意味市場願意為還沒完全兌現的 AI 商業模式預付高價，後續財報壓力只會更大。\\n來源異同\\n《衛報》與《The Register》都確認安特羅普克（Anthropic）週四上市、股價首日大漲，核心事實一致。數字差異來自時點不同：《衛報》報收盤價略高於 97 美元、市值近 1.3 兆美元；《The Register》報開盤衝上 111.50 美元、估值約 2 兆美元，兩者並非直接矛盾。\\n仍不確定\\n報導提到的 1.75 兆美元數字未完整交代是何種口徑；股價能否守住首日漲幅、後續交易走勢如何，仍待觀察。完整交易數據要看交易所紀錄。\"},\"sources\":[{\"name\":\"The Guardian Business\",\"url\":\"https://www.theguardian.com/technology/2026/nov/19/anthropic-public-trading-ipo\"},{\"name\":\"The Register\",\"url\":\"https://www.theregister.com/ai-and-ml/2026/11/19/anthropic-throws-open-doors-at-2t-valuation-as-shares-pop-34-in-initial-trading/5311143\"}],\"disagreements\":{\"en\":\"The Guardian reports a closing market value of nearly $1.3tn, while The Register reports a roughly $2tn valuation in initial trading; the figures reflect different trading moments, not a direct contradiction.\",\"zh-TW\":\"《衛報》報導收盤市值近 1.3 兆美元，《The Register》報導開盤交易時估值約 2 兆美元；兩者反映不同交易時點，並非直接矛盾。\"},\"trustScore\":64,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":19,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"finance\",\"live-ingest\",\"the-guardian-business\",\"the-register\"],\"glossary\":[{\"term\":{\"en\":\"Anthropic\",\"zh-TW\":\"安特羅普克\"},\"blurb\":{\"en\":\"AI startup behind the Claude chatbot.\",\"zh-TW\":\"AI 新創公司，Claude 聊天機器人開發商。\"}},{\"term\":{\"en\":\"Claude\",\"zh-TW\":\"Claude\"},\"blurb\":{\"en\":\"Chatbot developed by Anthropic.\",\"zh-TW\":\"安特羅普克開發的聊天機器人。\"}},{\"term\":{\"en\":\"IPO\",\"zh-TW\":\"首次公開募股\"},\"blurb\":{\"en\":\"Initial public offering, a company's first sale of shares to the public.\",\"zh-TW\":\"公司首次向公眾出售股票。\"}},{\"term\":{\"en\":\"The Guardian\",\"zh-TW\":\"衛報\"},\"blurb\":{\"en\":\"British newspaper that reported the closing price.\",\"zh-TW\":\"報導收盤價的英國報紙。\"}},{\"term\":{\"en\":\"The Register\",\"zh-TW\":\"The Register\"},\"blurb\":{\"en\":\"British technology news site that reported the opening surge.\",\"zh-TW\":\"報導開盤大漲的英國科技新聞網站。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-finance-01-anthropic-closes-first-d/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Mu
