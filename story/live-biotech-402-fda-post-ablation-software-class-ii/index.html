 (Docket No. FDA-2026-N-12256, Document No. 2026-24214, scheduled for formal publication on November 30, 2026) classifying post-ablation tissue response prediction software into Class II (special controls) by adding 21 CFR 892.2052. Following a De Novo classification request, the agency established binding special controls covering clinical ablation-zone volumetric validation, scanner modality qualification across ultrasound, CT, and MRI platforms, and detailed labeling of target pathologies and validation demographics.\n\nWhy it matters\nUnder federal medical device law, novel software types automatically default to Class III, requiring costly and lengthy Premarket Approval (PMA) trials. By codifying 21 CFR 892.2052 in Class II, the FDA establishes a clear predicate pathway allowing future interventional oncology and radiology software developers to seek 510(k) clearance if they satisfy the codified special controls.\n\nSource differences\nThe Federal Register Public Inspection filing (\"Federal Register :: Public Inspection: Medical Devices: Radiology Devices; Classification of the Post-Ablation Tissue Response Prediction Software\") provides the primary regulatory text, docket identifier FDA-2026-N-12256, document number 2026-24214, and November 27 filing timestamp. CASRAI (\"FDA Classifies Post-Ablation Software as Class II - CASRAI\") summarizes the codified special controls under 21 CFR 892.2052(b)(3) and explains the clinical implications for interventional radiology departments.\n\nStill uncertain\nHow rapidly competing interventional oncology software vendors will submit 510(k) applications under the newly codified 21 CFR 892.2052 predicate, and whether insurers will expand reimbursement codes for predictive ablation modeling, remains to be seen.\n\nTrust label: Official confirmation — Verified directly against the FDA final rule filed on Federal Register Public Inspection (Document No. 2026-24214) alongside industry regulatory analysis by CASRAI."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-biotech-402-fda-post-ablation-software-class-ii\",\"category\":\"biotech\",\"title\":{\"en\":\"FDA Codifies Post-Ablation Tissue Response Prediction Software as Class II Medical Device\",\"zh-TW\":\"美國 FDA 正式將消融術後組織反應預測軟體歸類為第二級醫療器材\"},\"summary\":{\"en\":\"The U.S. Food and Drug Administration filed a final order on November 27 (Document No. 2026-24214) classifying post-ablation tissue response prediction radiology software into Class II under 21 CFR 892.2052. The ruling subjects computational tumor-ablation imaging tools to mandatory special controls rather than default Class III premarket approval.\",\"zh-TW\":\"美國食品藥物管理局（FDA）於11月27日在《聯邦公報》提交最終命令（文件編號 2026-24214），正式新增 21 CFR 892.2052 條文，將「消融術後組織反應預測放射學軟體」納入第二級（Class II）醫療器材管理並訂定特別管制規範。此舉免除同類腫瘤熱消融影像預測軟體走最嚴格的第三級上市前核准程序。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n美國食品藥物管理局（FDA）於2026年11月27日在《聯邦公報》（Federal Register）公開檢閱系統提交最終命令（案號 FDA-2026-N-12256，文件編號 2026-24214，預定11月30日正式刊登），正式增訂 21 CFR 892.2052 條文，將「消融術後組織反應預測軟體」歸類為第二級（Class II）醫療器材。該項歸類源於 De Novo 分類申請，FDA 同步制定具法律拘束力的特別管制要求，涵蓋消融區域體積準確度臨床測試、超音波與電腦斷層及磁振造影跨平台驗證，以及標示適用腫瘤病理與驗證族群數據。\\n\\n「為什麼重要」\\n依美國聯邦醫療器材法規，缺乏既有比對品的新型臨床軟體預設歸入風險最高的第三級（Class III），須耗時進行上市前核准（PMA）。FDA 正式建立 21 CFR 892.2052 第二級分類與標準後，後續開發介入性腫瘤學與放射影像預測軟體的廠商，只要符合特別管制條件即可循 510(k) 途徑加速取得上市許可。\\n\\n「來源異同」\\n《聯邦公報》公開檢閱文件（「Federal Register :: Public Inspection: Medical Devices: Radiology Devices; Classification of the Post-Ablation Tissue Response Prediction Software」）載明法規原文、案號 FDA-2026-N-12256、文件編號 2026-24214 及11月27日提交紀錄；科研資訊機構《CASRAI》（「FDA Classifies Post-Ablation Software as Class II - CASRAI」）則拆解 21 CFR 892.2052(b)(3) 特別管制細項及其對醫院介入性放射科的臨床影響。\\n\\n「仍不確定」\\n其他醫療影像軟體廠商將以多快速度依據 21 CFR 892.2052 新標準遞交 510(k) 申請，以及美國醫療保險給付代碼是否隨之擴大納入術後消融預測軟體，仍有待觀察。\\n\\nTrust label: Official confirmation — 依據美國《聯邦公報》公開檢閱系統發布之 FDA 最終命令（文件編號 2026-24214）及 CASRAI 專業法規解析核實。\"},\"glossary\":[{\"term\":{\"en\":\"Class II medical device\",\"zh-TW\":\"第二級醫療器材\"},\"blurb\":{\"en\":\"An FDA device category representing moderate to high risk that requires both general controls and device-specific special controls to ensure safety and effectiveness.\",\"zh-TW\":\"美國 FDA 定義具中度至高度風險的醫療器材分級，除一般管制外還須符合針對該類產品訂定的特別管制標準。\"}},{\"term\":{\"en\":\"De Novo classification\",\"zh-TW\":\"De Novo 新創醫療器材分類途徑\"},\"blurb\":{\"en\":\"An FDA regulatory pathway for novel low-to-moderate-risk medical devices lacking a legally marketed predicate, establishing a new classification regulation.\",\"zh-TW\":\"針對市場上尚無合法比對產品、但風險屬中低程度的創新醫療器材所設的 FDA 審查機制，通過後可建立新的分類法規。\"}},{\"term\":{\"en\":\"Thermal tumor ablation\",\"zh-TW\":\"腫瘤熱消融術\"},\"blurb\":{\"en\":\"A minimally invasive image-guided procedure that destroys cancerous tissue using extreme heat or cold, such as radiofrequency or microwave energy.\",\"zh-TW\":\"在影像導引下利用射頻、微波或冷凍等極端溫度能量局部破壞腫瘤組織的微創治療技術。\"}}],\"sources\":[{\"name\":\"Federal Register\",\"url\":\"https://www.federalregister.gov/public-inspection/2026-24214/medical-devices-radiology-devices-classification-of-the-post-ablation-tissue-response-prediction\"},{\"name\":\"CASRAI\",\"url\":\"https://casrai.org/news/fda-classifies-post-ablation-tissue-response-prediction-software-class-ii-2026\"}],\"imageUrl\":\"/covers/live/live-biotech-402-fda-post-ablation-software-class-ii.jpg\",\"imageAlt\":{\"en\":\"FDA Codifies Post-Ablation Tissue Response Prediction Software as Class II Medical Device\",\"zh-TW\":\"美國 FDA 正式將消融術後組織反應預測軟體歸類為第二級醫療器材\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":88,\"trustBreakdown\":{\"crossCorroboration\":22,\"outletReputation\":24,\"recencyClarity\":23,\"sourceDiversity\":19},\"publishedAt\":\"2026-11-28T09:02:06.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":23,\"D2\":22,\"D3\":23,\"D4\":21,\"D5\":21,\"total\":22},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-w
