ill not be telling his side of the story on the upcoming spinoff, because he did not film a single scene with Jen before she ended the marriage.\nWhy it matters\nThe verdict is about the collision of reality television and real life: a marriage that was already content on screen is now ending in court, mid-pregnancy, with a parenting plan as the substantive next step. The spinoff detail matters too — with Zac absent from filming, the show cannot stage his version of the split, so viewers will get one side of the story. For the family, the filing, not the show, is now where custody and the future get decided.\nSources agree / disagree\nTMZ, Hollywood Life, and Just Jared all report the same filing with the same facts: the November 3 Utah filing, seven years of marriage, and the fourth pregnancy. No conflicts appear across the outlets. Trust label: Multi-source agreement — three outlets agree on the divorce filing and its timing.\nStill uncertain\nThe grounds for the divorce, the custody terms, and the details of the proposed parenting plan are private and not in the feed snippets. How the split will affect the show's upcoming spinoff, and what happens next in court, are open questions; the filing itself is public, but its contents are not."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-entertainment-01-secret-lives-of-mormon-w\",\"category\":\"entertainment\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-entertainment-01-secret-lives-of-mormon-w.jpg\",\"imageAlt\":{\"en\":\"Cover related to: ‘Secret Lives of Mormon Wives’ Star Jen Affleck Files for Divorce From Zac Affleck After 7 Years Amid 4th Pregnancy\",\"zh-TW\":\"相關封面圖：（譯文待補）‘Secret Lives of Mormon Wives’ Star Jen Affleck Files for Divorce From Zac Affleck After 7 Years Amid 4th Pregnancy\"},\"publishedAt\":\"2026-11-05T01:00:11.000Z\",\"title\":{\"en\":\"Jen Affleck Files for Divorce From Zac Affleck After Seven Years, Amid Fourth Pregnancy\",\"zh-TW\":\"珍·阿弗萊克（Jen Affleck）訴請離婚：結婚 7 年、懷第 4 胎\"},\"summary\":{\"en\":\"The Secret Lives of Mormon Wives star Jen Affleck, 27, has filed for divorce from Zac Affleck after seven years of marriage, while pregnant with their fourth child. She filed in Utah on November 3 and submitted a proposed parenting plan. Zac did not film the upcoming spinoff, so his side of the split will not play out on screen.\",\"zh-TW\":\"實境節目《摩門妻子的秘密生活》（The Secret Lives of Mormon Wives）明星珍·阿弗萊克（Jen Affleck）訴請離婚：27 歲的她在懷第 4 胎之際，結束與扎克·阿弗萊克（Zac Affleck） 7 年的婚姻。11 月 3 日她在猶他州遞狀，並提出親權計劃；扎克未參與即將推出的衍生節目，離婚內情不會在螢幕上演。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"實境節目《摩門妻子的秘密生活》（The Secret Lives of Mormon Wives）的明星珍·阿弗萊克（Jen Affleck）在懷第 4 胎之際，結束與丈夫扎克·阿弗萊克（Zac Affleck） 7 年的婚姻，提出離婚訴訟。\\n發生了什麼事\\n根據取得法院文件的 TMZ 報導，珍·阿弗萊克於 11 月 3 日星期二在猶他州提出離婚訴訟。她也已提交一份對分手安排的提議親權計劃，但訴訟中的其他細節目前尚未公開，包括計劃的條款在內。兩人的婚姻問題早已在《摩門妻子的秘密生活》中曝光；TMZ 報導，扎克不會在即將推出的衍生節目中講出自己的說法，因為在珍結束婚姻之前，他一場與珍同框的劇情都沒有拍。\\n為什麼重要\\n結論在於實境電視與真實生活的撞擊：一段早已成為節目內容的婚姻，現在在懷孕期間走進法院，而親權計劃就是下一步的實質重點。衍生節目的細節也很重要：扎克沒有參與拍攝，節目就無法呈現他對分手的說法，觀眾只會看到事情的一面。對這個家庭來說，據養權與未來的決定，現在要在訴訟中解決，而不是在節目裡。\\n來源異同\\nTMZ、Hollywood Life 與 Just Jared 三家報導的是同一份訴訟，事實一致：11 月 3 日在猶他州遞狀、7 年婚姻、懷第 4 胎。各家的說法中沒有出現衝突。信任標籤：多源一致——三家媒體對離婚訴訟與遞狀時間的說法一致。\\n仍不確定\\n離婚的理由、據養權條款，以及提議親權計劃的細節，都屬於未公開的資訊，採訪線摘要中沒有提到。這次分手會對即將推出的衍生節目產生什麼影響，以及法院的下一步會怎麼走，都還是未知數；訴訟本身是公開的，但內容不是。\"},\"sources\":[{\"name\":\"TMZ\",\"url\":\"https://www.tmz.com/2026/11/04/jen-affleck-files-for-divorce/\"},{\"name\":\"Hollywood Life\",\"url\":\"https://hollywoodlife.com/feature/why-jen-affleck-divorce-husband-zac-affleck-5581361/\"},{\"name\":\"Just Jared\",\"url\":\"https://www.justjared.com/2026/11/04/secret-lives-of-mormon-wives-star-jen-affleck-files-for-divorce-from-zac-affleck-after-7-years-amid-4th-pregnancy/\"}],\"disagreements\":null,\"trustScore\":45,\"trustBreakdown\":{\"sourceDiversity\":19,\"outletReputation\":12,\"crossCorroboration\":22,\"recencyClarity\":25},\"tags\":[\"entertainment\",\"live-ingest\",\"tmz\",\"tmz\",\"hollywood-life\"],\"glossary\":[{\"term\":{\"en\":\"Jen Affleck\",\"zh-TW\":\"珍·阿弗萊克\"},\"blurb\":{\"en\":\"Star of The Secret Lives of Mormon Wives who filed for divorce.\",\"zh-TW\":\"《摩門妻子的秘密生活》的明星，提出離婚訴訟的當事人。\"}},{\"term\":{\"en\":\"Zac Affleck\",\"zh-TW\":\"扎克·阿弗萊克\"},\"blurb\":{\"en\":\"Jen Affleck's husband of seven years, who did not film the spinoff.\",\"zh-TW\":\"珍·阿弗萊克結婚 7 年的丈夫，未參與衍生節目拍攝。\"}},{\"term\":{\"en\":\"The Secret Lives of Mormon Wives\",\"zh-TW\":\"《摩門妻子的秘密生活》\"},\"blurb\":{\"en\":\"Reality series starring Jen Affleck, where the couple's issues played out.\",\"zh-TW\":\"珍·阿弗萊克主演的實境節目，兩人的婚姻問題曾在其中曝光。\"}},{\"term\":{\"en\":\"TMZ\",\"zh-TW\":\"TMZ\"},\"blurb\":{\"en\":\"Entertainment news outlet that obtained the court documents.\",\"zh-TW\":\"取得法院文件的娛樂新聞媒體。\"}},{\"term\":{\"en\":\"Utah\",\"zh-TW\":\"猶他州\"},\"blurb\":{\"en\":\"US state where Jen Affleck filed for divorce.\",\"zh-TW\":\"珍·阿弗萊克提出離婚訴訟的美國州。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-entertainment-01-secret-lives-of-mormon-w/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-entertainment-01-secret-lives-of-
