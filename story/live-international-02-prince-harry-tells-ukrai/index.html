sia. Addressing a conference on treating people injured in war, the Duke of Sussex praised Ukrainian resilience and said the country could one day host the Invictus Games.\nWhat happened\nThe Guardian reported that Harry told Ukrainian soldiers they are going to win the war with Russia during the surprise trip, meeting wounded veterans and medics in Lviv as he addressed the conference on war-injury care. The BBC's headline frames the same visit as Harry praising war veterans on his surprise trip to Ukraine. Both outlets place the visit in Lviv, in the west of the country, and center it on support for injured veterans.\nWhy it matters\nA visit from a globally known royal puts a spotlight on Ukraine's wounded veterans at a moment when the war grinds on largely out of the daily headlines. Harry's 'going to win' line is a morale message aimed at Ukrainians, not a military assessment, and the Invictus Games remark gives Kyiv a concrete, forward-looking invitation: a country at war imagining itself as a future host. For readers, the signal is political as much as personal — high-profile backing for Ukraine's veterans and its resilience narrative.\nSources agree / disagree\nBBC and The Guardian agree on the core facts: a surprise visit to Lviv, meetings with wounded veterans and medics, and Harry's message that Ukraine will win the war. Neither snippet contradicts the other on names, dates or quotes, and both tie the trip to support for injured veterans. The Guardian adds the Invictus Games remark; the BBC's headline stresses the praise for veterans. No numeric or name conflicts appear in the feed snippets.\nTrust label: Two-source agreement — BBC and The Guardian agree on the visit, the venue and the 'going to win' message.\nStill uncertain\nThe feed snippets restate only headlines and short descriptions, not full articles. The exact wording of Harry's remarks beyond the quoted line, the full list of people he met, and any official Ukrainian response are not in the material at hand; verify them on the publishers' pages before quoting. The exact date of the visit beyond the November 15 publication is also not spelled out in the snippets."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-02-prince-harry-tells-ukrai\",\"category\":\"international\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-international-02-prince-harry-tells-ukrai.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Prince Harry tells Ukrainians they are ‘going to win war’ on surprise trip to Lviv\",\"zh-TW\":\"相關封面圖：哈利王子在利沃夫的意外之旅中告訴烏克蘭人他們將“贏得戰爭”\"},\"publishedAt\":\"2026-11-15T22:00:24.000Z\",\"title\":{\"en\":\"Prince Harry Tells Ukrainians They Will 'Win the War' on Surprise Visit to Lviv\",\"zh-TW\":\"哈利王子（Prince Harry）突訪利維夫（Lviv）：告訴烏克蘭人將贏得戰爭\"},\"summary\":{\"en\":\"Prince Harry made a surprise visit to Lviv, where he met wounded veterans and medics and told Ukrainians they are 'going to win the war' against Russia. Speaking at a conference on treating the war-wounded, he praised Ukrainian resilience and said the country could one day host the Invictus Games. The visit pairs a morale boost with a concrete invitation.\",\"zh-TW\":\"哈利王子（Prince Harry）突訪烏克蘭西部城市利維夫（Lviv），會見受傷退伍軍人與醫護人員，並在治療戰傷人員的會議上說，烏克蘭人將贏得對俄羅斯的戰爭；他也讚揚烏克蘭的韌性，並說該國有朝一日可以主辦不敗運動會（Invictus Games）。重點：這是一次高調的士氣提振，還附上具體邀請。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"哈利王子（Prince Harry）突訪烏克蘭西部城市利維夫（Lviv），會見受傷退伍軍人與醫護人員，並說烏克蘭人將贏得對俄羅斯的戰爭。他在治療戰傷人員的會議上發言，讚揚烏克蘭的韌性，並說該國有朝一日可以主辦不敗運動會（Invictus Games）。\\n發生了什麼事\\n《衛報》報導，哈利王子在突訪期間告訴烏克蘭士兵，他們將贏得對俄羅斯的戰爭；他在利維夫會見受傷退伍軍人與醫護人員，並在治療戰傷人員的會議上發表談話。英國廣播公司（BBC）的標題則把同一趟行程定調為哈利王子讚揚退伍軍人。兩家媒體都把地點放在烏克蘭西部的利維夫，核心都是對受傷退伍軍人的支持。\\n為什麼重要\\n一位全球知名的王室成員到訪，把聚光燈打在烏克蘭受傷退伍軍人身上——戰事拖長之際，這類新聞很容易滑出每日頭條。哈利王子「將贏得戰爭」這句話是講給烏克蘭人聽的士氣喊話，不是軍事評估；不敗運動會的說法則給了基輔一個具體的未來邀請：一個處於戰爭中的國家，想像自己成為未來的主辦國。對讀者來說，這既是個人表態，也是政治訊號。\\n來源異同\\nBBC 與《衛報》核心事實一致：突訪利維夫、會見受傷退伍軍人與醫護人員、哈利王子說烏克蘭將贏得戰爭。兩家在人名、日期、引言上沒有互相牴觸，都把重點放在對受傷退伍軍人的支持。《衛報》補上不敗運動會的說法，BBC 標題強調對退伍軍人的讚揚。來源摘要中沒有數字或人名衝突。\\n仍不確定\\n來源摘要只重述標題與簡短描述，並非完整文章。哈利王子發言的完整措辭、他會見的全部人員、烏克蘭官方的回應，現有材料都沒有；引述前請到各媒體頁面查證。除了 11 月 15 日的刊出時間，訪問的確切日期在摘要中也沒有明寫。\"},\"sources\":[{\"name\":\"BBC UK\",\"url\":\"https://www.bbc.co.uk/news/articles/c60evn992jq8o?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"The Guardian UK News\",\"url\":\"https://www.theguardian.com/uk-news/2026/nov/15/prince-harry-ukraine-war-surprise-trip-invictus-games\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":19,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"international\",\"live-ingest\",\"bbc-uk\",\"the-guardian-uk-news\"],\"glossary\":[{\"blurb\":{\"en\":\"Duke of Sussex who visited Lviv and addressed a conference on treating the war-wounded.\",\"zh-TW\":\"薩塞克斯公爵，突訪利維夫並在治療戰傷人員的會議上發言。\"},\"term\":{\"en\":\"Prince Harry\",\"zh-TW\":\"哈利王子\"}},{\"blurb\":{\"en\":\"International sporting event for wounded service personnel, which Harry said Ukraine could one day host.\",\"zh-TW\":\"為受傷軍職人員舉辦的國際運動賽事，哈利王子說烏克蘭有朝一日可以主辦。\"},\"term\":{\"en\":\"Invictus Games\",\"zh-TW\":\"不敗運動會\"}},{\"blurb\":{\"en\":\"City in western Ukraine where Harry met wounded veterans and medics.\",\"zh-TW\":\"烏克蘭西部城市，哈利王子在此會見受傷退伍軍人與醫護人員。\"},\"term\":{\"en\":\"Lviv\",\"zh-TW\":\"利維夫\"}},{\"blurb\":{\"en\":\"British public broadcaster that reported Harry praising war veterans on the surprise visit.\",\"zh-TW\":\"英國公共廣播機構，報導哈利王子突訪烏克蘭讚揚退伍軍人。\"},\"term\":{\"en\":\"BBC\",\"zh-TW\":\"英國廣播公司\"}},{\"blurb\":{\"en\":\"British newspaper that reported Harry telling Ukrainians they will win the war.\",\"zh-TW\":\"英國報紙，報導哈利王子告訴烏克蘭人將贏得戰爭。\"},\"term\":{\"en\":\"The Guardian\",\"zh-TW\":\"《衛報》\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"
