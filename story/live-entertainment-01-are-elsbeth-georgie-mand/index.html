nTMZ reported the couple was photographed enjoying a quiet hike together on Thursday, spending the holiday by each other's side. It is their first holiday season since Presley's death. The same feed bundle also carried a Just Jared report that CBS changed its Thursday night lineup for Thanksgiving on November 26: no new episodes of Elsbeth, the crime drama led by Carrie Preston, or Georgie \u0026 Mandy's First Marriage, the Young Sheldon spinoff starring Montana Jordan and Emily Osment. Hollywood Life contributed a separate piece on when the first Thanksgiving was celebrated.\n\nWhy it matters\nThe weight of this story is the timing, not the schedule. The first family holiday after losing a son, spent on a quiet hike together, says more about where the couple stands than any statement could. The CBS programming change is a footnote to the same day's news.\n\nSources agree / disagree\nThe three outlets cover three different stories rather than corroborating one event: TMZ on the Crawfords, Just Jared on the CBS schedule, Hollywood Life on Thanksgiving history. There is no factual conflict among them, and no cross-corroboration either.\n\nStill uncertain\nThe feed snippets give no hike location, no word on whether the couple spoke publicly about their son, and no date for when CBS will resume new episodes.\n\nTrust label: Bundled stories — three outlets, three unrelated items, no shared event to corroborate."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-entertainment-01-are-elsbeth-georgie-mand\",\"category\":\"entertainment\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-entertainment-01-are-elsbeth-georgie-mand.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Are ‘Elsbeth’ \u0026 ‘Georgie \u0026 Mandy’s First Marriage’ New Tonight? CBS Thanksgiving Schedule Changes Explained\",\"zh-TW\":\"相關封面圖：今晚“埃爾斯貝斯”和“喬吉和曼迪的第一次婚姻”是新節目嗎？ CBS 感恩節時間表變更解釋\"},\"publishedAt\":\"2026-11-27T01:06:20.000Z\",\"title\":{\"en\":\"Cindy Crawford and Rande Gerber Spend First Thanksgiving Without Son Presley\",\"zh-TW\":\"辛蒂·克勞馥（Cindy Crawford）與蘭德·格伯（Rande Gerber）首度在沒有兒子陪伴下度過感恩節\"},\"summary\":{\"en\":\"Supermodel Cindy Crawford and her husband Rande Gerber spent their first Thanksgiving without their son Presley Gerber, who died in September; TMZ photographed the couple on a quiet hike Thursday. CBS also paused new episodes of Elsbeth and Georgie \u0026 Mandy's First Marriage for the holiday. For the couple, the day was defined by who was missing.\",\"zh-TW\":\"超模辛蒂·克勞馥（Cindy Crawford）與丈夫蘭德·格伯（Rande Gerber）在兒子普雷斯利（Presley Gerber）9 月過世後，首度在沒有他陪伴下度過感恩節——據 TMZ 報導，兩人週四被拍到一起安靜健行。同批消息還包括：哥倫比亞廣播公司（CBS）因感恩節調整週四晚間節目，《艾爾斯貝斯》（Elsbeth）與《喬吉和曼蒂的第一次婚姻》（Georgie \u0026 Mandy's First Marriage）11 月 26 日當晚沒有新集數。對這對夫妻而言，這個感恩節的意義不在節目表，而在缺席的人。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"超模辛蒂·克勞馥（Cindy Crawford）與丈夫蘭德·格伯（Rande Gerber）正在度過第一個沒有兒子普雷斯利（Presley Gerber）陪伴的感恩節。\\n\\n發生了什麼事\\nTMZ 報導，兩人週四被拍到一起安靜健行，彼此陪伴度過感恩節。普雷斯利今年 9 月過世，這是兩人失去兒子後的第一個假期。同一批消息還包括 Just Jared 的報導：哥倫比亞廣播公司（CBS）為感恩節調整 11 月 26 日週四晚間節目，《艾爾斯貝斯》（Elsbeth）與《喬吉和曼蒂的第一次婚姻》（Georgie \u0026 Mandy's First Marriage）當晚沒有新集數。前者是凱莉·普雷斯頓（Carrie Preston）主演的犯罪劇，後者是《少年謝爾頓》（Young Sheldon）的衍生劇，由蒙大拿·喬丹（Montana Jordan）與艾蜜莉·奧斯蒙（Emily Osment）主演。好萊塢生活（Hollywood Life）則另有一篇介紹第一個感恩節歷史的文章。\\n\\n為什麼重要\\n這則消息的重量不在行程，而在時間點——失去兒子後的頭一個家庭節日，夫妻選擇以安靜健行度過，畫面本身就說明了他們的狀態。CBS 的節目異動只是同日新聞的配角。\\n\\n來源異同\\n三家媒體報導的是三件不同的事，並非同一事件的多方印證：TMZ 報導克勞馥夫婦的感恩節，Just Jared 報導 CBS 節目表，好萊塢生活（Hollywood Life）介紹感恩節由來。三者之間沒有事實衝突，也沒有互相印證。\\n\\n仍不確定\\n來源只提供簡短摘要，未說明健行的地點、兩人是否公開談及兒子，也未說明 CBS 停播一週後何時恢復新集數。\\n\\n信任標籤：混裝多源——三家媒體、三件無關主題，並非同一事件的互相印證。\"},\"sources\":[{\"name\":\"TMZ\",\"url\":\"https://www.tmz.com/2026/11/26/cindy-crawford-rande-gerber-hike-thanksgiving/\"},{\"name\":\"Hollywood Life\",\"url\":\"https://hollywoodlife.com/feature/when-was-first-thanksgiving-celebrated-year-5348679/\"},{\"name\":\"Just Jared\",\"url\":\"https://www.justjared.com/2026/11/26/elsbeth-georgie-mandy-new-tonight-november-26-2026/\"}],\"disagreements\":null,\"trustScore\":45,\"trustBreakdown\":{\"sourceDiversity\":19,\"outletReputation\":12,\"crossCorroboration\":22,\"recencyClarity\":25},\"tags\":[\"entertainment\",\"live-ingest\",\"tmz\",\"hollywood-life\",\"just-jared\"],\"glossary\":[{\"blurb\":{\"en\":\"American supermodel.\",\"zh-TW\":\"美國超模。\"},\"term\":{\"en\":\"Cindy Crawford\",\"zh-TW\":\"辛蒂·克勞馥\"}},{\"blurb\":{\"en\":\"Entrepreneur and Crawford's husband.\",\"zh-TW\":\"企業家，克勞馥的丈夫。\"},\"term\":{\"en\":\"Rande Gerber\",\"zh-TW\":\"蘭德·格伯\"}},{\"blurb\":{\"en\":\"The couple's son, who died in September.\",\"zh-TW\":\"兩人的兒子，今年 9 月過世。\"},\"term\":{\"en\":\"Presley Gerber\",\"zh-TW\":\"普雷斯利·格伯\"}},{\"blurb\":{\"en\":\"American television network.\",\"zh-TW\":\"美國電視網。\"},\"term\":{\"en\":\"CBS\",\"zh-TW\":\"哥倫比亞廣播公司\"}},{\"blurb\":{\"en\":\"CBS crime drama starring Carrie Preston.\",\"zh-TW\":\"哥倫比亞廣播公司（CBS）犯罪劇，由凱莉·普雷斯頓（Carrie Preston）主演。\"},\"term\":{\"en\":\"Elsbeth\",\"zh-TW\":\"艾爾斯貝斯\"}},{\"blurb\":{\"en\":\"Young Sheldon spinoff starring Montana Jordan and Emily Osment.\",\"zh-TW\":\"《少年謝爾頓》衍生劇，由蒙大拿·喬丹（Montana Jordan）與艾蜜莉·奧斯蒙（Emily Osment）主演。\"},\"term\":{\"en\":\"Georgie \u0026 Mandy's First Marriage\",\"zh-TW\":\"喬吉和曼蒂的第一次婚姻\"}},{\"blurb\":{\"en\":\"US entertainment outlet and one of this cluster's sources.\",\"zh-TW\":\"美國娛樂媒體，本批消息的來源之一。\"},\"term\":{\"en\":\"TMZ\",\"zh-TW\":\"TMZ\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.
