ported that Cyrus and Morando tied the knot at Frank Sinatra's former home in Palm Springs, with Wayne Coyne of the Flaming Lips leading the vows beside the pool. TMZ and Just Jared carried the same account, and People shared first photos of the ceremony, including Cyrus's wedding dress. Cyrus's mother Tish, father Billy Ray Cyrus, and sister Noah were among those present, according to the reports. A month earlier, the couple had sung \"Let's Get Married\" together on the Hollywood Bowl stage, where Coyne — who worked with Cyrus on her 2015 album Miley Cyrus \u0026 Her Dead Petz — joined her in October.\nWhy it matters\nCyrus is one of pop's most watched figures, and a wedding that four outlets reported within hours of each other is the rare celebrity story with same-day corroboration. The ceremony also caps a public relationship that played out on stage: the Hollywood Bowl duet a month earlier now reads as a preview.\nSources agree-disagree\nBillboard, TMZ, Hollywood Life, and Just Jared all agree on the core facts: the couple married on Saturday, November 21, in Palm Springs, with Coyne officiating. One automated note in the feed mentioned mismatched figures (200 vs 8220), but neither figure corresponds to any fact in the four reports, so there is no real conflict to present. Trust label: Multi-source agreement.\nStill uncertain\nThe reports do not say whether the Palm Springs ceremony was the legal wedding or a celebration, and Tish Cyrus's hint that the couple may already have been married before Cyrus's Walk of Fame ceremony is unconfirmed. Official confirmation, the marriage record, and more photos would settle both points."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-entertainment-02-is-miley-cyrus-married-t\",\"category\":\"entertainment\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-entertainment-02-is-miley-cyrus-married-t.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Is Miley Cyrus Married to Maxx Morando? Their Marital Status After Palm Springs Ceremony\",\"zh-TW\":\"相關封面圖：麥莉·賽勒斯 (Miley Cyrus) 與馬克·莫蘭多 (Maxx Morando) 結婚了嗎？棕櫚泉儀式後他們的婚姻狀況\"},\"publishedAt\":\"2026-11-22T05:24:42.000Z\",\"title\":{\"en\":\"Miley Cyrus Marries Maxx Morando in Palm Springs Poolside Ceremony\",\"zh-TW\":\"麥莉·賽勒斯（Miley Cyrus）與馬克斯·莫蘭多（Maxx Morando）棕櫚泉池畔完婚\"},\"summary\":{\"en\":\"Pop star Miley Cyrus, 33, married musician Maxx Morando, 28, on Saturday, November 21, in a poolside ceremony at Frank Sinatra's former Palm Springs home, with Wayne Coyne of the Flaming Lips officiating. Four outlets agree on the wedding; what remains unclear is whether the ceremony was the legal marriage or a celebration — watch for confirmation and photos.\",\"zh-TW\":\"美國流行歌手麥莉·賽勒斯（Miley Cyrus，33 歲）與音樂人馬克斯·莫蘭多（Maxx Morando，28 歲）於 11 月 21 日週六，在棕櫚泉法蘭克·辛納屈（Frank Sinatra）故居舉行池畔婚禮，由火唇樂團（Flaming Lips）韋恩·科因（Wayne Coyne）主持。四家媒體說法一致；儀式是否為法定婚禮仍待確認，後續看官方證實與照片。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"美國流行歌手麥莉·賽勒斯（Miley Cyrus，33 歲）與音樂人馬克斯·莫蘭多（Maxx Morando，28 歲）於 11 月 21 日週六，在加州棕櫚泉舉行池畔婚禮。\\n發生了什麼事\\n《告示牌》（Billboard）報導，兩人在棕櫚泉法蘭克·辛納屈（Frank Sinatra）故居完婚，由火唇樂團（Flaming Lips）韋恩·科因（Wayne Coyne）在池畔主持誓言。TMZ 與 Just Jared 報導相同，《人物》（People）分享了儀式首批照片，包括賽勒斯的婚紗。報導指出，母親蒂許（Tish Cyrus）、父親比利·雷·賽勒斯（Billy Ray Cyrus）與妹妹諾亞（Noah Cyrus）都在場。一個月前，兩人在好萊塢露天劇場（Hollywood Bowl）合唱〈讓我們結婚吧〉（Let's Get Married）；科因曾參與賽勒斯 2015 年專輯《麥莉·賽勒斯與她的死寵物》（Miley Cyrus \u0026 Her Dead Petz），10 月也曾同台。\\n為什麼重要\\n賽勒斯是流行樂壇最受關注的人物之一，四家媒體在數小時內一致報導婚訊，同類名人消息少見如此即時的交叉證實。這場婚禮也為一段公開戀情畫下句點：一個月前的好萊塢露天劇場合唱，如今看來像是預告。\\n來源異同\\n《告示牌》、TMZ、好萊塢生活（Hollywood Life）、Just Jared 四家核心事實一致：11 月 21 日週六於棕櫚泉完婚，科因主持。原始摘要曾標註數字出入（200 與 8220），但兩個數字在四家報導中都對應不到任何具體事實，不構成來源衝突。信任標籤：多源一致。\\n仍不確定\\n報導未說明棕櫚泉儀式是法定婚禮還是慶祝儀式；蒂許暗示兩人可能在賽勒斯星光大道儀式前就已結婚，此說未經證實。須等官方證實、婚姻登記紀錄與更多照片才能確認。\"},\"sources\":[{\"name\":\"Billboard\",\"url\":\"https://www.billboard.com/music/pop/miley-cyrus-marries-maxx-morando-palm-springs-wedding-1236387428/\"},{\"name\":\"TMZ\",\"url\":\"https://www.tmz.com/2026/11/21/miley-cyrus-is-married-to-maxx-morando/\"},{\"name\":\"Hollywood Life\",\"url\":\"https://hollywoodlife.com/feature/is-miley-cyrus-married-to-maxx-morando-5491040/\"},{\"name\":\"Just Jared\",\"url\":\"https://www.justjared.com/2026/11/21/miley-cyrus-breathtaking-wedding-dress-revealed-in-first-photos-with-maxx-morando/\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":25,\"outletReputation\":14,\"crossCorroboration\":17,\"recencyClarity\":25},\"tags\":[\"entertainment\",\"live-ingest\",\"billboard\",\"tmz\",\"hollywood-life\"],\"glossary\":[{\"term\":{\"en\":\"Miley Cyrus\",\"zh-TW\":\"麥莉·賽勒斯（Miley Cyrus）\"},\"blurb\":{\"en\":\"American pop star, 33, who married Maxx Morando in Palm Springs.\",\"zh-TW\":\"美國流行歌手，33 歲，在棕櫚泉與馬克斯·莫蘭多完婚。\"}},{\"term\":{\"en\":\"Maxx Morando\",\"zh-TW\":\"馬克斯·莫蘭多（Maxx Morando）\"},\"blurb\":{\"en\":\"American musician, 28, who married Miley Cyrus.\",\"zh-TW\":\"美國音樂人，28 歲，與麥莉·賽勒斯完婚。\"}},{\"term\":{\"en\":\"Wayne Coyne\",\"zh-TW\":\"韋恩·科因（Wayne Coyne）\"},\"blurb\":{\"en\":\"Frontman of the Flaming Lips who officiated the ceremony.\",\"zh-TW\":\"火唇樂團主唱，主持這場婚禮儀式。\"}},{\"term\":{\"en\":\"The Flaming Lips\",\"zh-TW\":\"火唇樂團（Flaming Lips）\"},\"blurb\":{\"en\":\"American rock band fronted by Wayne Coyne.\",\"zh-TW\":\"由韋恩·科因領軍的美國搖滾樂團。\"}},{\"term\":{\"en\":\"Frank Sinatra\",\"zh-TW\":\"法蘭克·辛納屈（Frank Sinatra）\"},\"blurb\":{\"en\":\"Late American singer whose former Palm Springs home hosted the ceremony.\",\"zh-TW\":\"已故美國歌手，其棕櫚泉故居是婚禮舉辦地。\"}},{\"term\":{\"en\":\"Billboard\",\"zh-TW\":\"《告示牌》（Billboard）\"},\"blurb\":{\"en\":\"US music publication that first reported the wedding in this batch.\",\"zh-TW\":\"本批率先報導婚訊的美國音樂媒體。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"
