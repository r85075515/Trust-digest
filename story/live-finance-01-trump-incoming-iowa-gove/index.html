rt cleared the blast, Trump ordered a pause, and the Army says it will proceed on Wednesday anyway.\nWhat happened\nAccording to CNBC, The Hill, and Axios, a U.S. court ruled that the Army may go ahead with detonating degraded explosives — including tons of lead azide — at the Iowa Army Ammunition Plant. State officials said last week that they had only recently learned of the plan, prompting frustration and public concern over contamination and health risks. President Trump ordered the Army to pause, saying the blast could not proceed without approval from an appeals court and from Democratic Governor-elect Rob Sand, and neither Trump nor Sand appears willing to own the politically charged decision. The Army, however, said it would proceed with the controlled removal on Wednesday, in full coordination with state, local, and federal authorities. 'We are proceeding with the controlled removal in full coordination with all state, local and federal authorities, because the safety of Iowa's citizens comes first,' said acting Army Secretary Adam Telle.\nWhy it matters\nDetonating lead-containing munitions raises contamination and health risks for nearby residents, and the fact that state officials say they learned of the plan only recently points to a communication gap between the military and state government. The conflicting signals — a court clearance, a presidential pause, and the Army's insistence on proceeding — leave residents unable to tell whether the blast will happen as scheduled or what precautions to take.\nSources agree / disagree\nCNBC, The Hill, and Axios agree on the core facts: the court cleared the detonation, Trump ordered a pause, and the Army says it will proceed on Wednesday. The apparent contradiction between the pause and the proceeding reflects the sequence of events rather than a factual dispute: the court ruling and the pause came first, followed by the Army's announcement that it would go ahead. Whether the pause remains in force is not stated in the material. Trust label: Multi-source agreement — three outlets agree on the core facts, and the differences reflect the order in which events unfolded rather than the facts themselves.\nStill uncertain\nWhether the detonation will actually take place on Wednesday, whether the pause remains in effect, where the appeals court stands, and the blast's exact scale, timing, and safety precautions are all unstated. How and when state officials were informed, and what contamination monitoring and health assessments are planned, are also missing."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-01-trump-incoming-iowa-gove\",\"category\":\"finance\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-finance-01-trump-incoming-iowa-gove.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Trump, incoming Iowa governor, punt Army lead detonation back and forth\",\"zh-TW\":\"相關封面圖：即將上任的愛荷華州州長川普來回推動陸軍引爆\"},\"publishedAt\":\"2026-11-24T04:06:29.000Z\",\"title\":{\"en\":\"Trump and Iowa Governor-Elect Rob Sand Trade Blame Over Army Lead Detonation\",\"zh-TW\":\"川普（Donald Trump）與愛荷華州候任州長羅布·桑德（Rob Sand）互推陸軍含鉛彈藥引爆責任\"},\"summary\":{\"en\":\"A U.S. court cleared the Army to detonate degraded, lead-containing explosives at the Iowa Army Ammunition Plant, but President Trump ordered a pause, saying the blast needs appeals-court approval and sign-off from Iowa Governor-elect Rob Sand. The Army says it will still proceed on Wednesday, leaving residents caught between conflicting signals.\",\"zh-TW\":\"美國法院已准許陸軍在愛荷華州陸軍彈藥廠引爆劣化含鉛炸藥，但川普（Donald Trump）總統下令暫緩，稱須經上訴法院與愛荷華州候任州長羅布·桑德（Rob Sand）同意。陸軍則表示仍將於週三進行，居民夾在互相矛盾的訊息之間。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"美國陸軍計畫在愛荷華州陸軍彈藥廠引爆劣化含鉛炸藥一事，演變成法院、川普（Donald Trump）總統與愛荷華州候任州長之間的拉鋸。法院已准許引爆，川普（Trump）卻下令暫緩，陸軍則表示仍將於週三進行。\\n發生了什麼事\\n根據美國消費者新聞與商業頻道（CNBC）、國會山報（The Hill）與 Axios 的報導，美國法院已裁定陸軍可繼續執行在愛荷華州陸軍彈藥廠引爆劣化炸藥的計畫，其中包括數噸疊氮化鉛（lead azide）。州官員上週表示，他們最近才得知這項計畫，引發地方反彈與民眾對污染及健康風險的疑慮。川普（Trump）總統下令陸軍暫停計畫，表示未經上訴法院與民主黨籍候任州長羅布·桑德（Rob Sand）同意不得引爆；桑德（Sand）與川普（Trump）都不願為這項政治燙手山芋負責。陸軍方面則表示，將於週三按計畫進行受控清除，並稱已與州及地方政府充分協調；代理陸軍部長亞當·泰勒（Adam Telle）表示，愛荷華州民眾的安全最重要。\\n為什麼重要\\n引爆含鉛炸藥涉及污染與居民健康風險，州政府卻稱事前毫不知情，暴露軍方與地方政府之間的溝通缺口。法院准許、總統暫緩、陸軍照常進行，三方訊息不一致，也讓當地居民無從判斷引爆是否如期發生，以及該採取哪些防護措施。\\n來源異同\\n美國消費者新聞與商業頻道（CNBC）、國會山報（The Hill）與 Axios 三家媒體對核心事實一致：法院准許引爆、川普（Trump）下令暫緩、陸軍稱週三照常進行。表面上「暫緩」與「照常進行」看似矛盾，實為事件先後發展：先有法院裁定與總統暫緩令，後有陸軍宣布繼續執行；至於暫緩令是否仍有效，素材未說明。信任標籤：多源一致——三家媒體對核心事實的報導一致，歧異來自事件發展的先後順序，而非事實本身。\\n仍不確定\\n引爆是否真的在週三進行、暫緩令目前是否仍有效、上訴法院的立場，以及引爆的具體規模、時間與安全防護措施，素材都未說明。州政府何時、以何種管道得知計畫，污染監測與居民健康評估的安排，也欠缺關鍵資訊。\"},\"sources\":[{\"name\":\"CNBC\",\"url\":\"https://www.cnbc.com/2026/11/24/iowa-detonation-bomb-court-.html\"},{\"name\":\"The Hill\",\"url\":\"https://thehill.com/newsletters/energy-environment/6238863-trump-says-iowa-detonation-will-be-up-to-democrat/\"},{\"name\":\"Axios\",\"url\":\"https://www.axios.com/2026/11/23/iowa-lead-detonation-delayed-trump\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":19,\"outletReputation\":10,\"crossCorroboration\":22,\"recencyClarity\":25},\"tags\":[\"finance\",\"live-ingest\",\"cnbc\",\"the-hill\",\"axios\"],\"glossary\":[{\"term\":{\"en\":\"Iowa Army Ammunition Plant\",\"zh-TW\":\"愛荷華州陸軍彈藥廠\"},\"blurb\":{\"en\":\"U.S. Army munitions facility in Iowa.\",\"zh-TW\":\"位於愛荷華州的美國陸軍彈藥設施。\"}},{\"term\":{\"en\":\"Lead azide\",\"zh-TW\":\"疊氮化鉛\"},\"blurb\":{\"en\":\"An explosive compound containing lead, used in munitions detonators.\",\"zh-TW\":\"含鉛的起爆藥，用於彈藥雷管。\"}},{\"term\":{\"en\":\"Rob Sand\",\"zh-TW\":\"羅布·桑德\"},\"blurb\":{\"en\":\"Democratic governor-elect of Iowa.\",\"zh-TW\":\"愛荷華州民主黨籍候任州長。\"}},{\"term\":{\"en\":\"Adam Telle\",\"zh-TW\":\"泰勒\"},\"blurb\":{\"en\":\"Acting Secretary of the U.S. Army.\",\"zh-TW\":\"美國代理陸軍部長。\"}},{\"term\":{\"en\":\"The Hill\",\"zh-TW\":\"國會山報\"},\"blurb\":{\"en\":\"U.S. political news outlet.\",\"zh-TW\":\"美國政治新聞媒體。\"}},{\"term\":{\"en\":\"Axios\",\"zh-TW\":\"Axios\"},\"
