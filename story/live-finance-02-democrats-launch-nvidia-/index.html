ios also reports that Huang's exit has left a trail of collateral damage that threatens to ensnare Nvidia's board and the AI boom itself. The Financial Times reports that investors say the AI boom will lift Nvidia even after Huang's exit, and that shares largely recovered by the close of market on Thursday as shareholders bought the dip and looked to the group's future without a chief executive. The Financial Times describes Huang as a singular leader in the global economy, capable of exciting or calming markets with a single sentence and viewed as a virtually indestructible force behind Nvidia's rise.\n\nWhy it matters\nNvidia sits at the centre of the AI boom, so a congressional investigation into its China sales and its chief executive's dealings with Trump reaches beyond one company into trade policy and the politics around AI. The letter's language shows Democrats treating the arrangement as a scandal to be pursued, not a routine inquiry. The market's recovery by Thursday's close shows investors separating the company's prospects from its departing chief executive, at least for now.\n\nSources agree / disagree\nThree outlets cover the story from different angles: TechCrunch on the Democratic investigation and letter, Axios on Huang's exit and the collateral damage, and the Financial Times on the investor view that the AI boom will lift Nvidia even after Huang's exit. They agree on the core facts — an investigation, Huang's exit and a market that steadied — while each stresses a different part of the story.\nTrust label: Multi-source agreement — Three outlets cover the same Nvidia upheaval, with no clear factual conflict in the material reviewed.\n\nStill uncertain\nThe letter's contents beyond the word 'scheme', the identity of the Democrats who signed it, and the details of the alleged spy affair are not given in the short snippets. The Axios item breaks off mid-sentence when describing the reports that preceded Huang's exit, so that part of the story cannot be verified from the material. What the investigation will demand next, and whether it leads to hearings or penalties, is also unknown."])</script><script>self.__next_f.push([1,"11:Tab0,"])</script><script>self.__next_f.push([1,"民主黨（Democratic Party）對輝達（Nvidia）展開國會調查，並致函嚴厲批評執行長黃仁勳（Jensen Huang）與川普（Donald Trump）的安排是一項「計畫」。據 Axios 報導，這是自涉嫌間諜事件消息傳出以來，國會針對輝達（Nvidia）在中國的銷售及其與川普（Donald Trump）往來展開的第二次調查。\n\n發生了什麼事\n民主黨（Democratic Party）以一封信函展開調查，抨擊黃仁勳（Jensen Huang）與川普（Donald Trump）的安排為「計畫」。Axios 指出，這是自涉嫌間諜事件消息傳出以來，國會第二次調查輝達（Nvidia）在中國的銷售及其與川普（Donald Trump）的往來。Axios 也報導，黃仁勳（Jensen Huang）的離職留下一連串附帶損害，可能波及輝達（Nvidia）董事會與人工智慧熱潮本身。《金融時報》（Financial Times）則報導，投資人認為即使黃仁勳（Jensen Huang）離職，人工智慧熱潮仍將提振輝達（Nvidia）；股價週四收盤時大致回升，股東逢低買入，展望集團在沒有執行長的情況下的未來。《金融時報》（Financial Times）形容黃仁勳（Jensen Huang）是全球經濟中獨一無二的領導者，一句話就能刺激或安撫市場，被視為輝達（Nvidia）崛起背後幾乎堅不可摧的力量。\n\n為什麼重要\n輝達（Nvidia）位居人工智慧熱潮的中心，國會調查其在中國的銷售與執行長和川普（Donald Trump）的往來，影響超出單一公司，牽涉貿易政策與人工智慧周邊的政治角力。信函的措辭顯示民主黨（Democratic Party）將此安排視為需要追查的醜聞，而非例行質詢。股價週四收盤回升，顯示投資人暫時將公司前景與離職的執行長分開看待。\n\n來源異同\n三家媒體從不同角度報導：TechCrunch 聚焦民主黨（Democratic Party）的調查與信函，Axios 聚焦黃仁勳（Jensen Huang）離職與附帶損害，《金融時報》（Financial Times）則報導投資人對輝達（Nvidia）前景的看法。三家對核心事實的描述一致——調查、黃仁勳（Jensen Huang）離職、市場回穩——只是各自強調的重點不同。\n信任標籤：多源一致——三家媒體報導同一宗輝達（Nvidia）風波，現有素材中沒有明顯的事實衝突。\n\n仍不確定\n信函中除「計畫」一詞外的內容、連署的民主黨（Democratic Party）議員身分、涉嫌間諜事件的細節，簡短摘要皆未提供。Axios 的報導在描述黃仁勳（Jensen Huang）離職前的相關消息時中途截斷，該部分內容無從查證。調查下一步將要求什麼、是否會走向聽證或處罰，也仍未知。"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-02-democrats-launch-nvidia-\",\"category\":\"finance\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-finance-02-democrats-launch-nvidia-.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Democrats launch Nvidia investigation, write scathing letter on Huang’s ‘scheme’ with Trump\",\"zh-TW\":\"相關封面圖：民主黨發起英偉達調查，針對黃仁勳與川普的「計畫」寫了一封措辭嚴厲的信\"},\"publishedAt\":\"2026-11-12T23:26:26.000Z\",\"title\":{\"en\":\"Democrats Launch Nvidia Investigation Into Hua
