 reported the news; CNBC confirmed it. The investment arrives alongside fresh equity infusions from existing investors, including board member Laurene Powell Jobs, the widow of Steve Jobs. It comes after Paramount's $111 billion merger with Warner Bros. Discovery. David Ellison's father, billionaire Oracle co-founder Larry Ellison, has a long history with Musk.\n\nWhat happened\nPer the reports, Musk's check into the new Skydance-centered media empire is part of a wider capital raise drawing in existing backers. Neither Musk nor Skydance has publicly confirmed the investment; the reporting rests on unnamed sources.\n\nWhy it matters\nA Musk stake inside a major studio-and-streaming empire would reshape who holds leverage in Hollywood — especially with the Paramount–Warner Bros. Discovery combination already redrawing the map. But until either side confirms, this remains reported, not done.\n\nSources agree / disagree\nCNBC and The Guardian Business cover the investment story with matching figures of about $1 billion. An NPR item in the same cluster is a separate Kara Swisher interview about Musk's business strategy and Ukraine — a different story, not a second source on the deal. Trust label: unconfirmed — deal details rest on unnamed sources.\n\nStill uncertain\nTerms, timing, and whether the investment is finalized are all unconfirmed; verify on the publishers' pages and watch for an official statement."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-02-elon-musk-reportedly-inv\",\"category\":\"international\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-international-02-elon-musk-reportedly-inv.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Elon Musk reportedly invests $1bn in David Ellison’s Skydance\",\"zh-TW\":\"相關封面圖：據報道，埃隆馬斯克向大衛埃里森的 Skydance 投資 10 億美元\"},\"publishedAt\":\"2026-10-22T21:23:39.000Z\",\"title\":{\"en\":\"Elon Musk Reportedly Puts About $1 Billion Into David Ellison's Skydance\",\"zh-TW\":\"馬斯克（Elon Musk）傳砸約 10 億美元投資艾里森（David Ellison）的天舞傳媒（Skydance）\"},\"summary\":{\"en\":\"[Unverified, single source] Elon Musk has reportedly invested about $1 billion in David Ellison's Skydance, per Semafor and CNBC, alongside new equity from investors including Laurene Powell Jobs. The deal, not yet publicly confirmed by either side, would follow Paramount's $111 billion merger with Warner Bros. Discovery.\",\"zh-TW\":\"［未證實·單一來源］馬斯克傳投資艾里森的天舞傳媒約 10 億美元，Semafor 率先報導、CNBC 跟進；同輪還有賈伯斯遺孀勞倫·鮑威爾（Laurene Powell Jobs）等老股東加碼。takeaway：消息只差官方證實——馬斯克若真進場，好萊塢的權力版圖又要重畫。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"馬斯克（Elon Musk）傳已向大衛·艾里森（David Ellison）領導的天舞傳媒（Skydance）投資約 10 億美元，若屬實將是這位億萬富豪在娛樂版圖的又一次重押。Semafor 率先報導，CNBC 跟進證實；同輪還有老股東加碼，包括董事會成員、賈伯斯遺孀勞倫·鮑威爾·賈伯斯（Laurene Powell Jobs）。這筆投資緊接在派拉蒙（Paramount）與華納兄弟探索（Warner Bros. Discovery）1110 億美元合併案之後。艾里森的父親、甲骨文共同創辦人賴瑞·艾里森（Larry Ellison）與馬斯克素有淵源。\\n發生了什麼事\\n據報導，馬斯克這張支票是新一輪增資的一部分，老股東同步加碼。但馬斯克與天舞雙方都還沒公開證實；整則報導建立在匿名消息人士上。\\n為什麼重要\\n馬斯克若入股大型影視串流帝國，好萊塢的話語權版圖又要重畫——尤其派拉蒙與華納兄弟探索的合併已經在重塑格局。但在官方證實之前，這都還只是「傳」。\\n來源異同\\nCNBC 與《衛報》商業版都報導投資案，金額一致（約 10 億美元）。同批 NPR 另有一篇卡拉·史威瑟（Kara Swisher）專訪，談馬斯克的商業策略與烏克蘭戰爭——那是另一則新聞，不是本案的第二來源。信任標籤：審慎——投資細節來自匿名消息人士，雙方皆未公開證實。\\n仍不確定\\n投資條件、時點、是否已交割都未證實；引用前請查閱媒體原文，並留意官方聲明。\"},\"sources\":[{\"name\":\"NPR World\",\"url\":\"https://www.npr.org/2026/10/22/nx-s1-6010616/kara-swisher-elon-musk-tesla-spacex-political-influence\"},{\"name\":\"CNBC\",\"url\":\"https://www.cnbc.com/2026/10/22/elon-musk-skydance-investment.html\"},{\"name\":\"The Guardian Business\",\"url\":\"https://www.theguardian.com/technology/2026/oct/22/elon-musk-david-ellison-skydance-investment\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":20,\"outletReputation\":21,\"crossCorroboration\":22,\"recencyClarity\":25},\"tags\":[\"international\",\"live-ingest\",\"npr-world\",\"cnbc\",\"the-guardian-business\"],\"glossary\":[{\"term\":{\"en\":\"Elon Musk\",\"zh-TW\":\"馬斯克\"},\"blurb\":{\"en\":\"Billionaire reported to be investing about $1 billion in Skydance.\",\"zh-TW\":\"傳投資天舞傳媒約 10 億美元的億萬富豪。\"}},{\"term\":{\"en\":\"David Ellison\",\"zh-TW\":\"大衛·艾里森\"},\"blurb\":{\"en\":\"Media executive leading Skydance.\",\"zh-TW\":\"領導天舞傳媒的媒體業高管。\"}},{\"term\":{\"en\":\"Skydance\",\"zh-TW\":\"天舞傳媒\"},\"blurb\":{\"en\":\"Media company at the center of the reported investment.\",\"zh-TW\":\"本次傳聞投資案主角的傳媒公司。\"}},{\"term\":{\"en\":\"Paramount\",\"zh-TW\":\"派拉蒙\"},\"blurb\":{\"en\":\"Studio merged with Warner Bros. Discovery for $111 billion.\",\"zh-TW\":\"與華納兄弟探索以 1110 億美元合併的片廠。\"}},{\"term\":{\"en\":\"Warner Bros. Discovery\",\"zh-TW\":\"華納兄弟探索\"},\"blurb\":{\"en\":\"Media company merged with Paramount.\",\"zh-TW\":\"與派拉蒙合併的傳媒公司。\"}},{\"term\":{\"en\":\"Laurene Powell Jobs\",\"zh-TW\":\"勞倫·鮑威爾·賈伯斯\"},\"blurb\":{\"en\":\"Board member and existing Skydance investor adding equity.\",\"zh-TW\":\"天舞董事會成員，本輪同步加碼的老股東。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://r85075515.github.io/Trust-digest/\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"Axiom\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"zh_TW\"}],[\"$\",\"meta\",\"7\",{\"property\":
