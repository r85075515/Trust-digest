her units in the lineup starting from $429. The Apex 200 is pitched as a way to keep devices powered anywhere, including during bad weather or outages.\nWhy it matters\nA 2,560Wh station at $1,044 with up to $355 off is aimed squarely at buyers weighing a portable power station before winter outages and holiday travel. The extra 5% code and the gift and draw incentives are designed to pull the purchase forward into the early-access window rather than waiting for Black Friday itself. For shoppers, the real comparison is the final bundle price, not the headline saving.\nSources agree / disagree\n9to5Toys and CNET Deals agree on the core facts: a new Apex 200, a 2,560Wh capacity, an exclusive $1,044 price and up to $355 in savings with the coupon code. The ingest system flagged a 2-versus-5 figure difference, but those numbers describe different things in the snippets and do not conflict. A CNET item on a Mango Power backup bundle was bundled into the same cluster and is a separate deal. Trust label: Two-source agreement — two outlets agree on the Apex 200 price and savings.\nStill uncertain\nThe snippets do not spell out which bundle configurations the $355 saving applies to, what the free gifts are, or the terms of the lucky draw. The exact discount depends on the configuration chosen. Check the linked deal pages for the current price and terms before buying."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-shopping-01-save-up-to-355-on-the-br\",\"category\":\"shopping\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-shopping-01-save-up-to-355-on-the-br.png\",\"imageAlt\":{\"en\":\"Cover related to: Save Up to $355 on the Brand-New Bluetti Apex 200 Portable Power Station With Our Exclusive Coupon Code\",\"zh-TW\":\"相關封面圖：使用我們的獨家優惠券代碼購買全新 Bluetti Apex 200 便攜式發電站可節省高達 355 美元\"},\"publishedAt\":\"2026-11-05T21:23:01.000Z\",\"title\":{\"en\":\"Bluetti Apex 200 Portable Power Station Launches at $1,044 With Up to $355 Off\",\"zh-TW\":\"Bluetti 新款 Apex 200 行動電源站上市，獨家價 1044 美元、最高省 355 美元\"},\"summary\":{\"en\":\"Bluetti has launched its new 2,560Wh Apex 200 portable power station as part of Black Friday early-access deals, with an exclusive price of $1,044 and up to $355 off via a CNET coupon code, plus an extra 5% off. Check the bundle terms before buying — the exact code savings depend on the configuration.\",\"zh-TW\":\"Bluetti 推出新款 2560Wh 的 Apex 200 行動電源站，列入黑色星期五搶先優惠，獨家價 1044 美元，搭配 CNET 優惠碼最高可省 355 美元，另享 5% 折扣。下單前先確認組合內容，因為實際省下的金額依配置而定。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"Bluetti 推出新款 Apex 200 行動電源站，容量 2560Wh，列入黑色星期五搶先優惠，獨家價 1044 美元，搭配 CNET 優惠碼最高可省 355 美元。\\n發生了什麼事\\n這次上市搭上 Bluetti 的黑色星期五搶先優惠，上一款新品是 Elite 30 Mini 行動電源站。優惠包括獨家省錢代碼、購買特定機型送免費禮品，以及消費滿 1000 美元可參加幸運抽獎。CNET 報導其優惠碼可讓 Apex 200 再享 5% 折扣；9to5Toys 則列出獨家價 1044 美元，系列其他機型 429 美元起。Apex 200 主打隨時隨地為裝置供電，包括惡劣天氣或停電期間。\\n為什麼重要\\n2560Wh 的電源站賣 1044 美元、最高省 355 美元，瞄準的是想在冬季停電與假期出遊前入手行動電源的買家。額外 5% 折扣、贈品與抽獎，都是要把購買時間提前到搶先優惠期間，而不是等到黑色星期五當天。對消費者來說，真正要比的是最終組合價，不是標題上的省錢數字。\\n來源異同\\n9to5Toys 與 CNET 優惠版對核心事實的報導一致：新款 Apex 200、2560Wh 容量、獨家價 1044 美元、搭配優惠碼最高省 355 美元。自動比對曾標示 2 與 5 的數字差異，但這兩個數字在摘要中說的是不同的事，並不衝突。同一批來源中還有一則 CNET 的 Mango 電源備援組合優惠，是另一筆交易。信任標籤：雙源一致——兩家媒體對 Apex 200 的價格與優惠報導一致。\\n仍不確定\\n摘要沒有寫明 355 美元優惠適用於哪些組合配置，也沒有說明免費禮品是什麼、抽獎規則如何。實際折扣依配置而定，下單前請查閱連結的優惠頁面，確認當下價格與條件。\"},\"sources\":[{\"name\":\"9to5Toys\",\"url\":\"https://9to5toys.com/2026/11/05/bluetti-early-black-friday-sale-2560wh-apex-200-power-station/\"},{\"name\":\"CNET Deals\",\"url\":\"https://www.cnet.com/deals/bluetti-apex-200-deal/\"}],\"disagreements\":null,\"trustScore\":54,\"trustBreakdown\":{\"sourceDiversity\":13,\"outletReputation\":10,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"shopping\",\"live-ingest\",\"9to5toys\",\"cnet-deals\",\"cnet-deals\"],\"glossary\":[{\"blurb\":{\"en\":\"Portable power station maker behind the new Apex 200.\",\"zh-TW\":\"推出新款 Apex 200 的行動電源站品牌。\"},\"term\":{\"en\":\"Bluetti\",\"zh-TW\":\"Bluetti\"}}
