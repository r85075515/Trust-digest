e, reported by Rolling Stone, is a public farewell to the parent who shaped the singer's music from the start.\n\nWhat happened\nBruno Mars announced the death of his father, Peter Hernandez, a performer known as Dr. Doo-Wop. Mars praised his father often during interviews and credited him for his signature style, the showmanship and sound that made the singer a global star. The headline of the Rolling Stone report carries Mars's own words: his father was the man that taught me everything I know.\n\nWhy it matters\nMars's career was built on what his father taught him, so this is not a routine celebrity bereavement notice: the loss reaches into the source of his music. A star who rarely frames his private life in public is choosing to grieve openly, and that choice turns a family loss into a moment fans will remember as part of his story.\n\nSources agree and disagree\nOnly one outlet, Rolling Stone, carries the story in this feed, so there is no second source to compare against. No numeric or naming conflicts appear in the available snippet.\n\nStill uncertain\nThe snippet gives no date or cause of death, no age, and no funeral or memorial arrangements, so the basic circumstances of the death cannot be stated from this material. Those details should be checked against fuller reporting.\n\nTrust label: Single source — the mourning rests on one Rolling Stone report, with no second outlet corroborating it in this feed."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-entertainment-01-bruno-mars-mourns-his-fa\",\"category\":\"entertainment\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-entertainment-01-bruno-mars-mourns-his-fa.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Bruno Mars Mourns His Father’s Death: ‘The Man That Taught Me Everything I Know’\",\"zh-TW\":\"相關封面圖：布魯諾馬爾斯哀悼父親的去世：“他教會了我所知道的一切”\"},\"publishedAt\":\"2026-11-20T00:44:22.000Z\",\"title\":{\"en\":\"Bruno Mars Mourns
