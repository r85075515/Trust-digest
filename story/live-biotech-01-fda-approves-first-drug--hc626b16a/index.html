n-Pick disease type C live longer. The decision was one of three FDA drug approvals announced the same day, each for a different disease.\n\nWhat happened\nThe FDA approved Lembaz injection for a severe form of Niemann-Pick disease type C, a rare inherited disorder, in patients whose disease begins in infancy. The same day brought two further firsts: Infilbray (venglustat) tablets, the first treatment for the neurological symptoms of Type 3 Gaucher disease in adults and children weighing at least 15 kilograms, and Sunharbo (asundexian) 50 mg tablets, the first factor XIa inhibitor used with antiplatelet therapy to reduce stroke risk in adults after a recent mild-to-moderate non-cardioembolic ischemic stroke or a high-risk transient ischemic attack. BioPharma Dive reports that Infilbray's approval ends a winding development journey for Sanofi and gives the company a new source of income ahead of the patent expiration of Dupixent, its top-selling drug.\n\nWhy it matters\nTwo rare diseases with no prior options now have a first treatment, which matters most to the small patient groups who had none. For Sanofi, Infilbray is a commercial bridge: a new revenue line arriving just as Dupixent, its biggest earner, faces patent expiry. The triple announcement also shows the FDA clearing first-in-class drugs across rare disease and cardiology in a single day.\n\nSources agree and disagree\nTwo outlets cover the cluster: BioPharma Dive and FDA press releases. The flagged figures, 3 versus 50, are not a conflict: 3 refers to Type 3 Gaucher disease, while 50 is the 50 mg dose of Sunharbo, two different drugs. The three approvals are distinct decisions bundled into one feed cluster.\n\nStill uncertain\nThe card's source links cover BioPharma Dive's Infilbray report and one FDA release on Gaucher disease; no direct link to the FDA release on Lembaz is included, so the NPC approval's wording should be checked against the FDA's own announcement. Efficacy figures, pricing, and availability are absent from the snippets.\n\nTrust label: Single source (bundled cluster) — three distinct FDA decisions are bundled in one feed cluster; each headline is sourced, but the cluster mixes separate drugs and diseases."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-biotech-01-fda-approves-first-drug--hc626b16a\",\"category\":\"biotech\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-biotech-01-fda-approves-first-drug--hc626b16a.webp\",\"imageAlt\":{\"en\":\"Cover related to: FDA Approves First Drug Shown to Help Patients with Infantile-Onset Niemann-Pick Disease Type C Live Longer\",\"zh-TW\":\"相關封面圖：FDA 核准首個藥物可幫助患有嬰兒期尼曼匹克症 C 型患者延長壽命\"},\"publishedAt\":\"2026-11-19T17:17:00.000Z\",\"title\":{\"en\":\"FDA Approves Lembaz as First Drug Shown to Extend Life in Infantile-Onset Niemann-Pick Type C\",\"zh-TW\":\"美國食品藥物管理局（FDA）核准 Lembaz：首款證實可延長嬰兒型尼曼匹克症 C 型患者壽命的藥物\"},\"summary\":{\"en\":\"The U.S. Food and Drug Administration approved Lembaz (adrabetadex), the first treatment shown to help patients with severe, infantile-onset Niemann-Pick disease type C live longer. The approval was one of three FDA drug decisions announced the same day, including a first treatment for neurological symptoms of Type 3 Gaucher disease.\",\"zh-TW\":\"［未證實·單一來源］美國食品藥物管理局（FDA）核准 Lembaz（adrabetadex）注射液，首款證實可幫助嬰兒型尼曼匹克症 C 型（NPC）重症患者延長壽命的藥物。同日另有兩項核准：首款治療 3 型戈謝病（GD3）神經症狀的 Infilbray，以及預防中風的 Sunharbo。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"美國食品藥物管理局（FDA）核准 Lembaz（adrabetadex）注射液，首款證實可幫助嬰兒型尼曼匹克症 C 型（NPC）重症患者延長壽命的藥物。這項決定是同日宣布的三項藥物核准之一，三項針對不同疾病。\\n\\n發生了什麼事\\n美國食品藥物管理局（FDA）核准 Lembaz 注射液，用於嬰兒期發病的嚴重 C 型尼曼匹克症，這是一種罕見遺傳疾病。同日還有另外兩項首創核准：Infilbray（venglustat）片劑，首款治療 3 型戈謝病（GD3）神經症狀的藥物，適用於體重至少 15 公斤的成人與兒童；Sunharbo（asundexian）50 毫克片劑，首款第十一因子抑制劑，搭配抗血小板治療，用於降低近期輕至中度非心源性缺血性中風或高風險短暫性腦缺血發作後成人的中風風險。BioPharma Dive 報導，Infilbray 的核准為賽諾菲（Sanofi）曲折的開發歷程畫下句點，並在暢銷藥 Dupixent 專利即將到期之前，為公司帶來新的收入來源。\\n\\n為什麼重要\\n兩種原本沒有治療選項的罕見疾病如今有了首款藥物，對人數稀少的病患群體意義最大。對賽諾菲而言，Infilbray 是一座商業橋梁：在最大金雞母 Dupixent 面臨專利到期之際，帶來一條新的收入線。三項核准同日宣布，也顯示美國食品藥物管理局在罕見疾病與心臟科領域同步放行首創藥物。\\n\\n來源異同\\n本批資料有兩家來源：BioPharma Dive 與美國食品藥物管理局新聞稿。被標示的數字差異「3 比 50」並非衝突：3 指 3 型戈謝病，50 指 Sunharbo 的 50 毫克劑量，是兩種不同藥物。三項核准是被併入同一批資料的三項獨立決定。\\n\\n仍不確定\\n本卡的來源連結只涵蓋 BioPharma Dive 的 Infilbray 報導與一篇關於戈謝病的美國食品藥物管理局新聞稿，未附 Lembaz 核准新聞稿的直接連結，尼曼匹克症核准的文字應以美國食品藥物管理局自己的公告為準。療效數據、價格與供貨情形在摘要中都沒有。\\n\\n信任標籤：單一來源（同批多則）——三項不同的 FDA 決定被併在同一批消息中；各標題皆有來源，但該批混合了不同的藥物與疾病，主線僅憑單一來源。\"},\"sources\":[{\"name\":\"BioPharma Dive\",\"url\":\"https://www.biopharmadive.com/news/sanofi-fda-infilbray-venglustat-approve-gaucher/875167/\"},{\"name\":\"FDA 新聞稿\",\"url\":\"http://www.fda.gov/news-events/press-announcements/fda-approves-first-drug-treat-neurological-symptoms-type-3-gaucher-disease\"}],\"disagreements\":null,\"trustScore\":54,\"trustBreakdown\":{\"sourceDiversity\":13,\"outletReputation\":10,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"biotech\",\"live-ingest\",\"biopharma-dive\",\"fda-新聞稿\",\"fda-新聞稿\"],\"glossary\":[{\"term\":{\"en\":\"U.S. Food and Drug Administration (FDA)\",\"zh-TW\":\"美國食品藥物管理局（U.S. Food and Drug Administration，FDA）\"},\"blurb\":{\"en\":\"The U.S. agency that approves drugs and oversees their safety.\",\"zh-TW\":\"負責核准藥物並監督其安全性的美國機構。\"}},{\"term\":{\"en\":\"Niemann-Pick disease type C (NPC)\",\"zh-TW\":\"尼曼匹克症 C 型（Niemann-Pick disease type C，NPC）\"},\"blurb\":{\"en\":\"A rare inherited disorder in which fats build up in cells, damaging the brain and organs.\",\"zh-TW\":\"脂肪在細胞內堆積、損害腦部與器官的罕見遺傳疾病。\"}},{\"term\":{\"en\":\"Lembaz (adrabetadex)\",\"zh-TW\":\"Lembaz（adrabetadex）\"},\"blurb\":{\"en\":\"An injectable drug newly approved for severe, infantile-onset Niemann-Pick disease type C.\",\"zh-TW\":\"新核准的注射藥物，用於嬰兒期發病的嚴重 C 型尼曼匹克症。\"}},{\"term\":{\"en\":\"Gaucher disease\",\"zh-TW\":\"戈謝病（Gaucher disease）\"},\"blurb\":{\"en\":\"A rare inherited disorder in which a fatty substance builds up in organs and bones.\",\"zh-TW\":\"脂肪物質在器官與骨骼堆積的罕見遺傳疾病。\"}},{\"term\":{\"en\":\"Infilbray (venglustat)\",\"zh-TW\":\"Infilbray（venglustat）\"},\"blurb\":{\"en\":\"A Sanofi tablet newly approved for neurological symptoms of Type 3 Gaucher disease.\",\"zh-TW\":\"賽諾菲新核准的片劑，用於治療 3 型戈謝病的神經症狀。\"}},{\"term\":{\"en\":\"Sanofi\",\"zh-TW\":\"賽諾菲（Sanofi）\"},\"blurb\":{\"en\":\"A French pharmaceutical company that developed Infilbray.\",\"zh-TW\":\"開發 Infilbray 的法國製藥公司。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-biotech-01-fda-approves-first-drug--hc626b16a/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-biotech-01-fda-approves-first-drug--hc626b16a/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"d:\"$8:metadata\"\n"])</script></body></html>
