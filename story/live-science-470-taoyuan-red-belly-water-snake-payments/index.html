nch held an event showcasing ecosystem service payments for the red-belly water snake, an endangered protected species under the Wildlife Conservation Act whose key habitats include Taoyuan ponds, rice paddies, and adjacent ditches. Because paddy drying schedules can clash with the snake's need for stable water, the branch and the Tse-Xin Organic Agriculture Foundation use \"ecological salary\" incentives to support friendly farming, water retention zones, and habitat care, with farmer Yang Qing-geng keeping water-retention areas in paddies, Yang Fu-quan shifting to paddy taro, Chung Hua Precision Test purchasing 1,050 jin of friendly-transition rice via corporate ESG, and the Zhenxing Neighborhood Patrol in Pingzhen conducting water patrols and wildlife records across 466.5 hectares in Longtan, Daxi, Yangmei, and Pingzhen.\n\nWhy it matters: Pairing financial incentives with corporate ESG procurement and community patrols helps align agricultural management with habitat conservation for an endangered species.\n\nSource differences: Both items belong to the same Forestry and Nature Conservation Agency Hsinchu Branch release chain. 兩岸好報 carries the exact title 「翻轉水田遇見生機！生態服務給付攜手農友、企業、社區 打造赤腹游蛇共好生活圈」, while 全域生活 carries the exact title 「新竹分署推生態給付守護桃園赤腹游蛇棲地」.\n\nStill uncertain: Long-term population trends for the red-belly water snake across Taoyuan's agricultural wetlands require ongoing monitoring.\n\nTrust label: Single source — both listed outlets stem from the same agency release chain."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-science-470-taoyuan-red-belly-water-snake-payments\",\"category\":\"science\",\"title\":{\"en\":\"Hsinchu Forestry Branch Holds Event Highlighting Ecosystem Payments for Red-Belly Water Snake in Taoyuan\",\"zh-TW\":\"林保署新竹分署舉辦赤腹游蛇生態服務給付成果發表會，串聯桃園農企與社區護棲地\"},\"summary\":{\"en\":\"The Forestry and Nature Conservation Agency Hsinchu Branch held an achievement showcase on November 26, 2026 in Pingzhen, Taoyuan for ecosystem service payments protecting the endangered red-belly water snake. Key takeaway: incentives, friendly farming, and patrols covered 466.5 hectares across four Taoyuan districts.\",\"zh-TW\":\"林業及自然保育署新竹分署於 2026 年 11 月 26 日在桃園平鎮舉辦赤腹游蛇生態服務給付成果發表會，結合友善耕作、企業 ESG 採購與社區巡守。關鍵結論：計畫涵蓋桃園四區共 466.5 公頃棲地，平衡農作需求與瀕危物種水域棲息。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」林業及自然保育署新竹分署於 2026 年 11 月 26 日在桃園市平鎮區舉辦赤腹游蛇生態服務給付成果發表會。赤腹游蛇為野生動物保育法列屬瀕臨絕種保育類野生動物，桃園埤塘、水田及周邊溝渠為重要棲地；針對水稻田農事曬田需求與赤腹游蛇偏好穩定水域的落差，新竹分署與慈心有機農業發展基金會推動生態服務給付，以「生態薪水」支持農友友善耕作、保留蓄水區與棲地維護，包括農友楊慶庚（Yang Qing-geng）在水田保留蓄水區域、楊福泉（Yang Fu-quan）改種水田芋頭、中華精測科技透過企業 ESG 專案採購友善轉型農友生產的白米 1,050 斤，以及平鎮區鎮興里守望相助隊投入水域巡查與野生動物紀錄；計畫涵蓋桃園龍潭、大溪、楊梅及平鎮，巡守棲地面積達 466.5 公頃。\\n\\n「為什麼重要」結合生態給付誘因、企業 ESG 採購與社區巡守，有助在農業生產與瀕危物種棲地需求間建立可行作法。\\n\\n「來源異同」兩篇報導同屬林保署新竹分署發布鏈。兩岸好報頁面實際標題逐字為「翻轉水田遇見生機！生態服務給付攜手農友、企業、社區 打造赤腹游蛇共好生活圈」，全域生活頁面實際標題逐字為「新竹分署推生態給付守護桃園赤腹游蛇棲地」。\\n\\n「仍不確定」桃園農田與埤塘水域中赤腹游蛇族群數量的長期變化仍需持續監測評估。\\n\\nTrust label: Single source — 所列兩個來源皆屬同一主管機關發布鏈。\"},\"glossary\":[{\"term\":{\"en\":\"Ecosystem service payment\",\"zh-TW\":\"生態服務給付\"},\"blurb\":{\"en\":\"Incentives paid to farmers or communities for practices that protect habitats and biodiversity.\",\"zh-TW\":\"透過獎勵或補助機制，支持農友或社區維持有利棲地與生物多樣性的作法。\"}},{\"term\":{\"en\":\"Red-belly water snake\",\"zh-TW\":\"赤腹游蛇\"},\"blurb\":{\"en\":\"A wetland snake listed as an endangered protected species under Taiwan's Wildlife Conservation Act.\",\"zh-TW\":\"台灣野生動物保育法列屬瀕臨絕種保育類的濕地蛇類。\"}},{\"term\":{\"en\":\"Corporate ESG\",\"zh-TW\":\"企業 ESG\"},\"blurb\":{\"en\":\"Environmental, social, and governance initiatives and sustainability commitments pursued by companies.\",\"zh-TW\":\"企業在環境、社會與公司治理面向推動的永續行動與採購專案。\"}}],\"sources\":[{\"name\":\"兩岸好報\",\"url\":\"https://taiwandiginews.com.tw/?p=210341\"},{\"name\":\"全域生活\",\"url\":\"https://life.111.com.tw/archives/264450\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"Hsinchu Forestry Branch Holds Event Highlighting Ecosystem Payments for Red-Belly Water Snake
