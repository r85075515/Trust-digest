he Johor-Singapore Special Economic Zone (JS-SEZ) blueprint has been deferred from early December to early 2027. The delay allows officials to integrate Singapore's feedback on the shared draft and finalize details of a proposed special pass for cross-border commuting workers.\n\nWhy it matters\nBetween January 2025 and June 2026, the JS-SEZ attracted 88.83 billion Malaysian ringgit (approximately 21.6 billion USD) in approved investments, with 40.3 billion ringgit already in implementation. Clearer customs, immigration, and labor mobility rules in the master plan are central to sustaining cross-border industrial and data center expansion.\n\nSource differences\nThe Straits Times (\"Johor-Singapore SEZ blueprint launch deferred to early 2027\") and The Business Times (\"Malaysia mulls commuter pass as Johor-Singapore Special Economic Zone blueprint takes shape\") both draw from direct interviews with Akmal Nasir at the Singapore summit, detailing the early 2027 timeline and cross-border worker pass. Free Malaysia Today (\"JS-SEZ master plan set for early 2027 launch, says Akmal\") adds local context from Johor Chief Minister Onn Hafiz Ghazi (翁哈菲茲) noting this marks a second postponement.\n\nStill uncertain\nThe exact launch date in early 2027, the venue in either Johor or Kuala Lumpur, and eligibility criteria for the cross-border commuter pass have not yet been determined.\nTrust label: Multi-source agreement — Independent reporting by The Straits Times, The Business Times, and Free Malaysia Today confirms the deferral to early 2027 and ongoing bilateral revisions."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-372-js-sez-blueprint-deferred\",\"category\":\"international\",\"title\":{\"en\":\"Johor-Singapore Special Economic Zone Blueprint Deferred to Early 2027\",\"zh-TW\":\"柔佛—新加坡經濟特區藍圖延至 2027 年初發布以納入星方意見\"},\"summary\":{\"en\":\"Malaysian Economy Minister Akmal Nasir announced on November 27, 2026, that the Johor-Singapore Special Economic Zone blueprint launch is deferred to early 2027 to incorporate Singapore's feedback and finalize a cross-border commuter pass.\",\"zh-TW\":\"馬來西亞經濟部長阿克馬爾・納西爾（Akmal Nasir）於 2026 年 11 月 27 日表示，原定 12 月初公布的柔佛—新加坡經濟特區（JS-SEZ）藍圖將延後至 2027 年初發布，以便納入新加坡對草案的回饋意見，並同步研議跨境通勤特別通行證機制。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n2026 年 11 月 27 日，馬來西亞經濟部長阿克馬爾・納西爾（Akmal Nasir）在新加坡舉行的 2026 年亞洲未來峰會上證實，柔佛—新加坡經濟特區（JS-SEZ）發展藍圖將由原定的 12 月初延後至 2027 年初發布。延後主因是雙方需要時間將新加坡對共享草案的回饋意見納入修訂，並敲定跨境通勤勞工特別通行證的具體規劃。\\n\\n「為什麼重要」\\n2025 年 1 月至 2026 年 6 月期間，柔新經濟特區已吸引 888.3 億馬來西亞令吉（約 216 億美元）的核准投資，其中 403 億令吉進入執行階段。藍圖中關於海關通關、人員流動與勞動力配置的制度設計，直接影響兩地製造業與資料中心聚落的後續投資落地速度。\\n\\n「來源異同」\\nThe Straits Times（原文標題：「Johor-Singapore SEZ blueprint launch deferred to early 2027」）與 The Business Times（原文標題：「Malaysia mulls commuter pass as Johor-Singapore Special Economic Zone blueprint takes shape」）均基於在新加坡峰會現場對阿克馬爾的專訪，詳述藍圖延至 2027 年初、投資數據及跨境通行證構想；Free Malaysia Today（原文標題：「JS-SEZ master plan set for early 2027 launch, says Akmal」）則補充柔佛州務大臣翁哈菲茲（Onn Hafiz Ghazi）提及此為藍圖二度延期的馬來西亞本地脈絡。\\n\\n「仍不確定」\\n2027 年初正式發布藍圖的確切日期、兩國總理共同主持發布的地點（柔佛或吉隆坡），以及跨境通勤特別通行證的申請資格與配額細節尚未定案。\\nTrust label: Multi-source agreement — The Straits Times、The Business Times 與 Free Malaysia Today 多家媒體獨立採訪與報導均確認藍圖延後至 2027 年初發布。\"},\"glossary\":[{\"term\":{\"en\":\"JS-SEZ\",\"zh-TW\":\"柔佛—新加坡經濟特區\"},\"blurb\":{\"en\":\"A bilateral economic zone linking Malaysia's Johor state and Singapore to streamline cross-border investment, goods, and labor.\",\"zh-TW\":\"馬來西亞柔佛州與新加坡共同推動的跨境經濟合作區，旨在促進投資、貨物流通與人員往來。\"}},{\"term\":{\"en\":\"Commuter Pass\",\"zh-TW\":\"跨境通勤特別通行證\"},\"blurb\":{\"en\":\"A proposed bilateral travel permit designed to simplify daily border clearance for workers commuting between Johor and Singapore.\",\"zh-TW\":\"馬新雙方研議中的專屬通關證件，旨在簡化每日往返柔佛與新加坡兩地工作者的邊境查驗程序。\"}},{\"term\":{\"en\":\"Realised Investment\",\"zh-TW\":\"已落實投資\"},\"blurb\":{\"en\":\"Approved capital commitments that have progressed into actual project construction, hiring, or operational deployment.\",\"zh-TW\":\"已獲政府核准並進一步進入實際建廠、設備採購或營運執行階段的投資金額。\"}}],\"sources\":[{\"name\":\"The Straits Times\",\"url\":\"https://www.straitstimes.com/singapore/johor-singapore-sez-blueprint-launch-deferred-to-early-2027-for-feedback-integration?ai-allowed=1\"},{\"name\":\"The Business Times\",\"url\":\"https://www.businesstimes.com.sg/international/asean/malaysia-mulls-commuter-pass-johor-singapore-special-economic-zone-blueprint-takes-shape?utm_source=google-news\u0026utm_medium=cf-syn\"},{\"name\":\"Free Malaysia Today\",\"url\":\"https://www.freemalaysiatoday.com/category/nation/2026/11/27/js-sez-master-plan-set-for-early-2027-launch-says-akmal\"}],\"imageUrl\":\"/covers/live/live-international-372-js-sez-blueprint-deferred.jpg\",\"imageAlt\":{\"en\":\"Johor-Singapore Special Economic Zone Blueprint Deferred to Early 2027\",\"zh-TW\":\"柔佛—新加坡經濟特區藍圖延至 2027 年初發布以納入星方意見\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":86,\"trustBreakdown\":{\"crossCorroboration\":22,\"outletReputation\":22,\"recencyClarity\":22,\"sourceDiversity\":20},\"publishedAt\":\"2026-11-28T05:29:40.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":22,\"D2\":22,\"D3\":21,\"D4\":21,\"D5\":22,\"total\":22},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-international-372-js-sez-blueprint-deferred/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verif
