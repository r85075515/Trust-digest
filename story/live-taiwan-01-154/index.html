nology transfers and services in three years.\nWhat happened\nCNA reports that the ministry has run the Smart Manufacturing Core Key Technology R\u0026D Program since 2023. In three years it has completed over 1,000 technology transfers and company services worth about NT$944 million, and spurred corporate investment of more than NT$15.4 billion. The headline example is a five-axis machine tool developed with Da Jun Hong Technology (大君鴻科技): it has broken into the semiconductor chamber machining market and already won 30 orders from a German buyer, projected to create about NT$450 million in output.\nWhy it matters\nThe figures, if they hold, say Taiwan's industrial policy is doing more than funding research — it is pulling private money behind it. The five-axis machine matters most: breaking into semiconductor chamber machining means Taiwanese toolmakers are moving up from commodity equipment into the precision gear that chip production depends on, a market where foreign suppliers have long dominated.\nSources agree / disagree\nThis is a single-source story: only CNA reported it, so no outlet can corroborate or challenge the ministry's figures. Trust label: Single source — the numbers come from one CNA report of a ministry announcement; treat them as the ministry's account until other outlets confirm them.\nStill uncertain\nThe report gives no breakdown of the NT$15.4 billion by company or year, no timeline for delivering the 30 German orders, and no independent check on the ministry's figures. The NT$450 million output figure is a projection, not a result. Verify the breakdown and the order timeline in fuller reporting before citing them as settled."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-01-154\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-taiwan-01-154.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 智慧製造研發計畫促投資逾154億　經部助攻高階工具機自主化\",\"zh-TW\":\"相關封面圖：智慧製造研發計畫促投資逾154億　經部助攻高階工具機自主化\"},\"publishedAt\":\"2026-11-21T01:54:22.000Z\",\"title\":{\"en\":\"Taiwan's Smart Manufacturing Plan Spurs NT$15.4 Billion in Corporate Investment\",\"zh-TW\":\"台灣智慧製造計畫促投資逾 154 億元：五軸工具機切入半導體加工市場\"},\"summary\":{\"en\":\"[Unconfirmed · Single source] Taiwan's Ministry of Economic Affairs says its smart manufacturing program, running since 2023, completed over 1,000 technology transfers and services worth about NT$944 million and spurred over NT$15.4 billion in corporate investment. A five-axis machine tool built with Da Jun Hong Technology won 30 orders from a German buyer, worth a projected NT$450 million in output.\",\"zh-TW\":\"［未證實·單一來源］經濟部表示，自 2023 年推動的智慧製造研發計畫 3 年內完成逾千案技術移轉及廠商服務、金額約 9.44 億元，促成企業投資逾 154 億元。與大君鴻科技合作的五軸工具機已獲德國業者 30 台訂單。接下來看訂單能否兌現為預估的 4.5 億元產值。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"台灣的智慧製造推動有了具體數字：經濟部表示，研發計畫 3 年內完成逾千案技術移轉及廠商服務，促成企業投資逾 154 億元。\\n發生了什麼事\\n據中央社（CNA）報導，經濟部自 2023 年起推動「智慧化製造核心關鍵技術研發計畫」。3 年內累計完成逾千案技術移轉及廠商服務，金額約 9.44 億元，並促成企業投資逾新台幣 154 億元。指標案例是與大君鴻科技合作開發的五軸工具機：它切入半導體腔體加工市場，已取得德國業者 30 台訂單，預估可創造約 4.5 億元產值。\\n為什麼重要\\n如果數字站得住腳，代表台灣的產業政策不只是在補助研究，而是在拉動民間資金跟進。五軸工具機最關鍵：打進半導體腔體加工，意味著台灣工具機業者正從一般設備往晶片生產仰賴的精密設備上移，那是長期由外商主導的市場。\\n來源異同\\n這是單一來源報導：只有中央社（CNA）報導，經濟部的數字沒有其他媒體佐證或挑戰。信任標籤：單一來源——數字來自中央社對經濟部說明的報導，在其他媒體確認前應視為經濟部的說法。\\n仍不確定\\n報導沒有 154 億元按企業或年度的細分、沒有 30 台德國訂單的交貨時程，也沒有對經濟部數字的獨立查核。4.5 億元產值是預估，不是結果。引用細分數字或訂單時程前請查閱更完整的報導。\"},\"sources\":[{\"name\":\"中央社-產經證券\",\"url\":\"https://www.cna.com.tw/news/afe/202611210042.aspx\"}],\"disagreements\":null,\"trustScore\":59,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"中央社-產經證券\"],\"glossary\":[{\"term\":{\"en\":\"Ministry of Economic Affairs\",\"zh-TW\":\"經濟部\"},\"blurb\":{\"en\":\"Taiwan government ministry behind the smart manufacturing R\u0026D program.\",\"zh-TW\":\"推動智慧製造研發計畫的台灣政府部會。\"}},{\"term\":{\"en\":\"CNA\",\"zh-TW\":\"中央社\"},\"blurb\":{\"en\":\"Taiwan's Central News Agency, the sole source for this story.\",\"zh-TW\":\"台灣中央通訊社，本報導的唯一來源。\"}},{\"term\":{\"en\":\"Smart Manufacturing Core Key Technology R\u0026D Program\",\"zh-TW\":\"智慧化製造核心關鍵技術研發計畫\"},\"blurb\":{\"en\":\"Ministry program running since 2023 to upgrade high-end equipment and smart manufacturing.\",\"zh-TW\":\"經濟部自 2023 年起推動、提升高階設備與智慧製造技術的研發計畫。\"}},{\"term\":{\"en\":\"Five-axis machine tool\",\"zh-TW\":\"五軸工具機\"},\"blurb\":{\"en\":\"Precision machining equipment that moves along five axes, built here with Da Jun Hong Technology.\",\"zh-TW\":\"可沿五個軸向加工的精密設備，本案由經濟部與大君鴻科技合作開發。\"}},{\"term\":{\"en\":\"Semiconductor chamber machining\",\"zh-TW\":\"半導體腔體加工\"},\"blurb\":{\"en\":\"Precision machining for semiconductor equipment chambers, the market the new machine tool entered.\",\"zh-TW\":\"半導體設備腔體的精密加工，本案五軸工具機切入的市場。\"}},{\"term\":{\"en\":\"Da Jun Hong Technology\",\"zh-TW\":\"大君鴻科技\"},\"blurb\":{\"en\":\"Taiwan company that co-developed the five-axis machine tool with the ministry.\",\"zh-TW\":\"與經濟部合作開發五軸工具機的台灣公司。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-taiwan-01-154/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"http
