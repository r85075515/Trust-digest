ns must submit.\n\nWhat happened\nThe Financial Times reported that FinCEN took systems offline after detecting unauthorised access, amid growing fears about the vulnerability of technology systems. The Register reported the same incident, calling the Treasury unit the latest federal breach victim. An alert on FinCEN's Bank Secrecy Act E-Filing website warned those who need to submit reports that they might not be able to while the agency deals with the situation.\n\nWhy it matters\nFinCEN sits at the centre of America's fight against money laundering: it collects the suspicious-activity and currency reports that investigators rely on. An outage that blocks filings does not just inconvenience banks, it blinds enforcement while the reports pile up, and a breach of the unit itself raises questions about the safety of the financial intelligence it holds.\n\nSources agree / disagree\nThe Financial Times and The Register agree on the core facts: unauthorized access was detected, systems went offline, and filings were disrupted. Neither outlet confirms who was behind the access or what was taken, and both describe the incident as suspected rather than confirmed. No numeric or naming conflict appears between the two accounts.\n\nStill uncertain\nThe scope of the unauthorized access, what data if any was touched, and when full service will return are all unreported in the snippets. The identity of the attacker and whether the incident is linked to other federal breaches are also unknown.\n\nTrust label: Two-source agreement — the Financial Times and The Register agree that FinCEN detected unauthorized access and took systems offline."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-01-us-treasury-financial-cr\",\"category\":\"finance\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-finance-01-us-treasury-financial-cr.jpg\",\"imageAlt\":{\"en\":\"Cover related to: US Treasury financial crime watchdog hit by suspected cyber attack\",\"zh-TW\":\"相關封面圖：美國財政部金融犯罪監管機構遭受疑似網路攻擊\"},\"publishedAt\":\"2026-11-25T22:24:37.000Z\",\"title\":{\"en\":\"FinCEN Takes Systems Offline After Suspected Cyber Attack\",\"zh-TW\":\"美國金融犯罪執法局（FinCEN）疑遭網路攻擊，部分系統下線\"},\"summary\":{\"en\":\"The U.S. Treasury's Financial Crimes Enforcement Network has taken some systems offline after detecting unauthorized access, disrupting regulatory filings for financial institutions. An alert on FinCEN's Bank Secrecy Act E-Filing site warned filers they may be unable to submit reports while the agency responds. The suspected cyberattack exposes how exposed federal financial systems remain.\",\"zh-TW\":\"美國財政部金融犯罪執法局（FinCEN）偵測到未經授權的存取後，已讓部分系統下線，金融機構的監管申報受到干擾。該局銀行保密法電子申報網站已張貼警示，提醒申報人可能暫時無法提交報告。這起疑似網攻暴露聯邦金融系統的脆弱。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"發生了什麼事\\n美國財政部金融犯罪執法局（FinCEN）偵測到未經授權的存取後，已讓部分系統下線，金融機構的監管申報受到干擾。英國《金融時報》（Financial Times）報導，該局在偵測到未經授權的存取後採取下線措施；《The Register》也報導同一事件，稱財政部這個單位成了最新一起聯邦機構受害案例。金融犯罪執法局（FinCEN）銀行保密法電子申報網站已張貼警示，提醒需要提交報告的人，在該局處理期間可能無法提交。\\n\\n為什麼重要\\n金融犯罪執法局（FinCEN）是美國反洗錢體系的核心，負責彙整可疑活動與貨幣交易報告，供執法單位追查。申報受阻不只是銀行的不便：報告堆積期間，執法單位等於暫時失明；而該單位本身遭入侵，也讓人質疑它所保管的金融情資是否安全。\\n\\n來源異同\\n英國《金融時報》（Financial Times）與《The Register》對核心事實一致：偵測到未經授權的存取、系統下線、申報受干擾。兩家都沒有確認幕後是誰、拿走了什麼，也都只稱這起事件「疑似」網攻。兩家報導之間沒有數字或名稱衝突。\\n\\n仍不確定\\n未經授權存取的範圍、有無資料外洩、全面恢復的時間，來源摘要都沒有交代。攻擊者身分，以及這起事件是否與其他聯邦機構受害事件有關，也都還不知道。\"},\"sources\":[{\"name\":\"Financial Times Markets\",\"url\":\"https://www.ft.com/content/43aa7321-2a95-463c-8cb9-77fcc7e39291?syn-25a6b1a6=1\"},{\"name\":\"The Register\",\"url\":\"https://www.theregister.com/security/2026/11/25/us-treasury-financial-crimes-unit-becomes-latest-fed-breach-victim/5312165\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":19,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"finance\",\"live-ingest\",\"financial-times-markets\",\"the-register\"],\"glossary\":[{\"term\":{\"en\":\"FinCEN\",\"zh-TW\":\"金融犯罪執法局\"},\"blurb\":{\"en\":\"U.S. Treasury bureau fighting financial crime.\",\"zh-TW\":\"美國財政部轄下打擊金融犯罪的單位。\"}},{\"term\":{\"en\":\"U.S. Department of the Treasury\",\"zh-TW\":\"美國財政部\"},\"blurb\":{\"en\":\"U.S. government department overseeing federal finances.\",\"zh-TW\":\"掌管美國聯邦財政的政府部門。\"}},{\"term\":{\"en\":\"Bank Secrecy Act\",\"zh-TW\":\"銀行保密法\"},\"blurb\":{\"en\":\"U.S. law requiring financial institutions to report suspicious transactions.\",\"zh-TW\":\"要求金融機構申報可疑交易的美國法律。\"}},{\"term\":{\"en\":\"Financial Times\",\"zh-TW\":\"英國《金融時報》\"},\"blurb\":{\"en\":\"British business newspaper.\",\"zh-TW\":\"英國商業報紙。\"}},{\"term\":{\"en\":\"The Register\",\"zh-TW\":\"《The Register》\"},\"blurb\":{\"en\":\"British technology news outlet.\",\"zh-TW\":\"英國科技新聞媒體。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-finance-01-us-treasury-financial-cr/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-finance-01-us-treasury-financial-cr/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verifi
