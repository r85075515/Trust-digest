oup announced on November 17 that Tse and Yung, two of its biggest stars, had formally become directors. Chairman Albert Yeung personally invited both to take up the posts, hoping their years of performing experience and business judgment would help the group expand into international markets and cross-sector businesses. Hong Kong Economic Journal, Fortune Insight, TVBS and Wen Wei Po carried the same announcement, with HKET reporting that Yeung wants the pair to bring fresh thinking to the business.\nWhy it matters\nThis is a star-to-boardroom move, not a ceremonial title: two of Hong Kong's most bankable performers now sit where the group's strategy is set. If their judgment shapes expansion, the appointment matters to Emperor's artists and investors alike.\nSources agree / disagree\nETtoday, TVBS, Hong Kong Economic Journal, Wen Wei Po and Fortune Insight agree on the core facts: both singers became directors on November 17 at Yeung's invitation. No numeric or name conflicts appear in the snippets. Trust label: Multi-source agreement — several outlets report the same announcement with matching details.\nStill uncertain\nThe snippets give no details on the directors' specific duties, terms or voting powers; the full announcements should be checked before quoting specifics."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-eastAsiaGossip-02-ettoday-line-today\",\"category\":\"eastAsiaGossip\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-eastAsiaGossip-02-ettoday-line-today.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 謝霆鋒、容祖兒升官了！公司宣布「雙雙當董事」參與集團決策 | ETtoday星光雲 - LINE TODAY\",\"zh-TW\":\"相關封面圖：謝霆鋒、容祖兒升官了！公司宣布「雙雙當董事」參與集團決策 | ETtoday星光雲 - LINE TODAY\"},\"publishedAt\":\"2026-11-17T08:48:29.000Z\",\"title\":{\"en\":\"Nicholas Tse and Joey Yung Join Emperor Entertainment as Directors\",\"zh-TW\":\"謝霆鋒（Nicholas Tse）、容祖兒（Joey Yung）升任英皇娛樂董事\"},\"summary\":{\"en\":\"Hong Kong singers Nicholas Tse and Joey Yung became directors of Emperor Entertainment Group on November 17, joining its decision-making layer at chairman Albert Yeung's personal invitation. Yeung hopes their performing experience and business judgment will help expand international markets and cross-sector ventures.\",\"zh-TW\":\"香港英皇娛樂集團11月17日宣布，謝霆鋒、容祖兒升任董事，加入集團決策層。主席楊受成親自邀請兩人出任，希望借重他們的演藝經驗與商業眼光，協助拓展國際市場與跨領域事業。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"香港歌手謝霆鋒、容祖兒11月17日升任英皇娛樂集團董事，加入集團決策層。\\n發生了什麼事\\n英皇娛樂集團11月17日宣布，旗下兩大天王天后謝霆鋒、容祖兒正式升格董事。集團主席楊受成親自邀請兩人出任董事，希望借重他們多年累積的演藝經驗與商業眼光，協助集團拓展國際市場及跨領域事業。香港經濟日報報導，楊受成希望兩人引入新思維推動業務發展；TVBS、香港文匯報、Fortune Insight 也刊出同一消息。\\n為什麼重要\\n這不是掛名頭銜，而是明星走進董事會：香港最具票房號召力的兩位藝人，今後坐在決定集團策略的位置上。他們的判斷若左右擴張方向，對英皇的藝人與投資人都會有實質影響。\\n來源異同\\nETtoday、TVBS、香港經濟日報、香港文匯報、Fortune Insight 的核心事實一致：兩人11月17日升任董事，由楊受成親自邀請。摘要中沒有數字或名稱衝突。信任標籤：多源一致——多家媒體報導同一宣布，細節吻合。\\n仍不確定\\n來源摘要沒有董事的具體職責、任期或表決權等細節；引用前請查閱完整報導。\"},\"sources\":[{\"name\":\"ETtoday 影劇\",\"url\":\"https://star.ettoday.net/news/3273782\"},{\"name\":\"Google News TW 娛樂\",\"url\":\"https://news.google.com/rss/articles/CBMiWkFVX3lxTFAwcmF2ZnllQ0tsRmtueTJ6TGtlaUZHQ1BTaTlZcDdDNzUyblFZSndjS0ROSE5qWkdIU2g1cWNJeTlrcUZoTldnbTBVd3NnNlNGdm5KdUVPTElMZw?oc=5\"},{\"name\":\"Google News\",\"url\":\"https://news.google.com/rss/articles/CBMi1ARBVV95cUxOeHN2U1RmMGRrTk41UjZnV2JTMXIwWXZIa1pGRFY2QmJrcEdWSElyV1NYZ1NxcXVoR1JJdlBjU3dHcEloSjAyUVV4V3Ric1FwVGhyXzIteG9ERDdDSktJdTl5dGkzaTFSa1JzYmxwNW5IVDlnZEpoVW5rSVowRnJlMVlvUnVpR2dEY3otZWp1SmdvNTlUbzktN3d0ejdBWEZycUdFT1ZlVURVbGsydzZKTmlVM3AwRDVOUVJ2RXNTbmY4bUFJczQybThnUjZfeEhLSTNsdG5EZlJVNFVNQWEyYURvRS1IMXBwejVyU0F3UlBYOHZVZzlBdU5TYkctQk9uT2RtekdxX2RQdW8ydjQ3UTR0RENLcmNCTkZYakk2NWw3VW9ZR0tmQXRUb0RQRENKTW5FNzA5TFVCUmtldnV5aUY2eGRmcXl4Z0dnekZmR1M3bXN4RmNfeVFBSjl6LXVaRHNMY1FHWDZfVU9TbkJNWk9SSlVUc2NhZXVUNW1ic3lVbzhaMVRkYVFHVTdKdHBsc0NtdHFPeFZBcGNlRHp5VnhXdTQ5NkxRRU5fWHdjU0ZVNUVjVFlPRHVNaWhYcGcwSkR0RG1wd2Nhdk5GTFF0cUJtX0JueExCRlB0SUxHdGZMZ0ZrWlNIS1l4VWNJRVRzQi1Ob2xBSmtHMTgxVEZRRTE4R2lwWHZKUkVTd2tBY3dqQjRuYzY1eVpaNFc
