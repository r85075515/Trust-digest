as voters. The race's $52 million-plus price tag makes it the costliest in US history, yet the reporting centres on a simpler complaint: flood-weary residents feel stuck.\n\nWhy it matters\nMoney has not bought patience. When a record-expensive race meets residents who feel trapped by repeated flooding, the election becomes a verdict on disaster response rather than a routine partisan contest, and that shift is what threatens Republican support in the county.\n\nSources agree and disagree\nThis card rests on a single outlet, The Guardian Environment, so there is no second source in the snippets to confirm or challenge the $52 million figure or the claim about eroding support. The single-source status is itself the limit on confidence here.\n\nStill uncertain\nThe snippets do not name the race's candidates beyond the Dare County commission candidate's location, give no breakdown of the $52 million in spending, and offer no polling or flood-damage figures, so the scale of the support shift cannot be verified from this coverage alone.\n\nTrust label: Single source"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-energy-01-a-lackluster-response-to\",\"category\":\"energy\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-energy-01-a-lackluster-response-to.jpg\",\"imageAlt\":{\"en\":\"Cover related to: A lackluster response to North Carolina flooding disasters is eroding Republican support in one county\",\"zh-TW\":\"相關封面圖：對北卡羅來納州洪水災害的平淡應對正在削弱共和黨在一個縣的支持\"},\"publishedAt\":\"2026-11-02T12:00:41.000Z\",\"title\":{\"en\":\"Dare County, North Carolina: Flood Frustration Erodes Republican Support in Costly Race\",\"zh-TW\":\"北卡羅來納州（North Carolina）戴爾郡（Dare County）：洪水不滿侵蝕共和黨支持，選戰花費逾5200萬美元\"},\"summary\":{\"en\":\"[Unconfirmed · Single source] In North Carolina's Dare County, frustration over a lackluster flood response is eroding Republican support in a race costing more than $52 million, the most expensive in US history. After working early-voting polls in Kill Devil Hills, resident Aida Havel said: 'We are trapped.' Flood recovery may outweigh party loyalty. Next, watch Dare County's election-night results.\",\"zh-TW\":\"［未證實·單一來源］北卡羅來納州（North Carolina）戴爾郡（Dare County）居民對洪水應對不力感到厭倦，正侵蝕共和黨在當地的支持；這場選戰花費逾5200萬美元，創美國史上最貴紀錄。在殺魔山（Kill Devil Hills）做了一整天提前投票工作後，居民艾達·哈維爾（Aida Havel）說：「我們被困住了。」洪水復原可能壓過政黨忠誠。接下來看戴爾郡的開票結果。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"發生了什麼事\\n北卡羅來納州（North Carolina）戴爾郡（Dare County）居民對洪水災害應對不力感到厭倦，正侵蝕共和黨在當地的支持。據《衛報》（The Guardian）報導，這場選戰花費逾5200萬美元，創美國史上最貴紀錄。艾達·哈維爾（Aida Havel）在殺魔山（Kill Devil Hills）做了一整天提前投票工作後，邊喝咖啡邊思索自己的處境，結論是：「我們被困住了。」一名戴爾郡委員會候選人住在南方約50英里（80公里）外、該州外灘（Outer Banks）的哈特拉斯島（Hatteras Island），顯示洪水問題同樣貼近當地候選人的日常生活。\\n\\n為什麼重要\\n金錢買不到耐心。當史上最貴的選戰遇上自覺被反覆洪水困住的居民，選舉就變成對災害應對的評判，而非例行性的政黨對決，這種轉變正是威脅共和黨在當地支持的原因。\\n\\n來源異同\\n本卡僅憑《衛報》環境版（The Guardian Environment）單一來源，摘要中沒有第二家媒體可佐證或挑戰5200萬美元數字與支持流失的說法，單一來源本身就是信心上限。\\n\\n仍不確定\\n摘要除戴爾郡委員會候選人的居住地外未點名選戰候選人，未提供5200萬美元支出的分項，也沒有民調或洪災損失數字，支持轉移的規模無法僅憑這批報導驗證。\"},\"sources\":[{\"name\":\"The Guardian Environment\",\"url\":\"https://www.theguardian.com/us-news/2026/nov/02/north-carolina-congress-republicans\"}],\"disagreements\":null,\"trustScore\":59,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"energy\",\"live-ingest\",\"the-guardian-environment\"],\"glossary\":[{\"term\":{\"en\":\"Dare County\",\"zh-TW\":\"戴爾郡\"},\"blurb\":{\"en\":\"The North Carolina county at the centre of the race.\",\"zh-TW\":\"這場選戰核心的北卡羅來納州郡。\"}},{\"term\":{\"en\":\"Aida Havel\",\"zh-TW\":\"艾達·哈維爾\"},\"blurb\":{\"en\":\"A Kill Devil Hills resident who worked early-voting polls.\",\"zh-TW\":\"在殺魔山做提前投票工作的居民。\"}},{\"term\":{\"en\":\"Kill Devil Hills\",\"zh-TW\":\"殺魔山\"},\"blurb\":{\"en\":\"The Dare County town where Havel worked the polls.\",\"zh-TW\":\"哈維爾做投票工作的戴爾郡城鎮。\"}},{\"term\":{\"en\":\"Outer Banks\",\"zh-TW\":\"外灘\"},\"blurb\":{\"en\":\"The North Carolina barrier-island chain including Hatteras Island.\",\"zh-TW\":\"包含哈特拉斯島的北卡羅來納州屏障島鏈。\"}},{\"term\":{\"en\":\"The Guardian\",\"zh-TW\":\"《衛報》\"},\"blurb\":{\"en\":\"The single outlet reporting this race.\",\"zh-TW\":\"報導這場選戰的單一媒體。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-energy-01-a-lackluster-response-to/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-energy-01-a-lackluster-response-to/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"d:\"$8:metadata\"\n"])</script></body></html>
