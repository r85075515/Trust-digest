ral Committee members could reach a record.\nWhat happened\nAccording to Central News Agency, the session opened on October 26, and its official agenda is strict party governance. Recently fallen officials are expected to have their disciplinary actions confirmed at this session, while observers watch for arrangements related to the power layout. The People’s Daily published a Ren Zhongping commentary on its front page praising the drive for strict party governance and presenting the establishment of Xi Jinping’s core status as the greatest political achievement since the 18th Party Congress. Separately, the Hong Kong media tally puts the number of Central Committee members who could be removed at about 45, combining absences, expulsions and replacements.\nWhy it matters\nThe judgment is that this session is both a disciplinary checkpoint and a power-layout observatory: confirming punishments settles past purges, while any layout arrangements signal the next phase of control. For readers, the headline number matters less than the confirmed list that emerges from the session, because only the official record separates a record tally from a record purge.\nSources agree / disagree\nAll three items in this cluster come from a single outlet, Central News Agency, so there is no cross-outlet corroboration. The ingest note about figures differing (45 versus 5) is not a conflict: 45 is the estimated number of people, and 5 is the session number — the fifth plenary session — so the two numbers describe different things and are presented in parallel. Trust label: Single source — and the single-source, unconfirmed 45-person estimate is why the summary carries the unverified label.\nStill uncertain\nThis is the accountability gap readers should note: the official list of confirmed punishments, the names of absent members, any power-layout arrangements, and the Hong Kong tally’s original source and counting method are all unpublished in the snippets. Until the session announces them, the 45-person figure remains an estimate, not a result."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-02-20-45\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-taiwan-02-20-45.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 港媒：中共20屆五中全會  約45人恐被逐出中央委員會\",\"zh-TW\":\"相關封面圖：港媒：中共20屆五中全會 約45人恐被逐出中央委員會\"},\"publishedAt\":\"2026-10-26T04:57:31.000Z\",\"title\":{\"en\":\"China’s Fifth Plenary Session Opens as Hong Kong Media Count Puts Possible Central Committee Exits at 45\",\"zh-TW\":\"中共20屆五中全會開幕，港媒統計約 45 人恐被逐出中央委員會\"},\"summary\":{\"en\":\"[Unverified-single-source] China’s 20th Central Committee opened its fifth plenary session in Beijing on October 26, with party governance as the agenda. A Hong Kong media count puts departures, expulsions and replacements among Central Committee members at a record, with 45 people possibly removed — a figure not confirmed by officials. The takeaway: watch how many disciplinary decisions the session confirms.\",\"zh-TW\":\"［未證實·單一來源］中共 20 屆五中全會 26 日在北京開幕，官方議程為從嚴治黨；港媒統計缺席、開除及遞補的中央委員人數可能創紀錄，多達約 45 人恐被逐出中央委員會——此數字未經官方證實，正式名單待會議公布。結論是：看點不在開幕本身，而在會議將確認多少落馬官員的處分與權力布局。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"中共第 20 屆中央委員會第 5 次全體會議（五中全會）26 日在北京開幕，官方議程為從嚴治黨；中央社引述港媒統計稱，缺席、開除及遞補的中央委員人數可能創下新紀錄。\\n發生了什麼事\\n據中央社報導，五中全會 26 日起在北京召開，官方公布的主要議程為從嚴治黨，近期多名貪腐落馬官員預料將在這次會議確認紀律處分，外界同時關心會議是否有與重大權力布局相關的安排。黨機關報《人民日報》當天在頭版發表「任仲平」評論文章「在新征程上持之以恆推進全面從嚴治黨」，將習近平的政治成就與毛澤東相提並論，並稱 18 大以來，確立習近平在中共黨中央的核心地位是最大的政治成果。另據港媒統計，缺席、開除及遞補合計，多達約 45 人恐將被逐出中央委員會。\\n為什麼重要\\n判斷是：這次會議既是紀律檢查點，也是權力布局的觀察窗——確認處分是為過去的整肅收尾，布局安排則預示下一階段的掌控。對讀者而言，頭條數字的重要性不如會議結束後公布的正式名單，因為只有官方紀錄能區分「創紀錄的統計」與「創紀錄的清洗」。\\n來源異同\\n同批三則報導全部來自中央社一家媒體，沒有跨媒體印證。原始素材標註的數字差異（45 與 5）不是衝突：45 是預估人數，5 是屆次——第五次全體會議——兩者指涉不同事項，並列呈現。信任標籤：僅1源——且 45 人預估為單一來源、未經證實，這正是摘要加註未證實標籤的原因。\\n仍不確定\\n這是讀者應留意的問責缺口：正式處分名單、缺席者姓名、權力布局安排，以及港媒統計的原始出處與計算方式，在片段中都沒有公布。在會議正式宣布之前，45 人這個數字只是預估，不是結果。\"},\"sources\":[{\"name\":\"中央社-兩岸\",\"url\":\"https://www.cna.com.tw/news/acn/202610260099.aspx\"}],\"disagreements\":{\"en\":\"Figures differ across outlets (e.g. 45 vs 5 in headlines/snippets).\",\"zh-TW\":\"不同媒體的數字有所不同（例如，標題/摘要中的數字為 45 比 5）。\"},\"trustScore\":59,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"中央社-兩岸\",\"中央社-兩岸\",\"中央社-兩岸\"],\"glossary\":[{\"term\":{\"en\":\"Fifth plenary session\",\"zh-TW\":\"五中全會\"},\"blurb\":{\"en\":\"Fifth plenary meeting of the 20th Central Committee.\",\"zh-TW\":\"中共第 20 屆中央委員會第 5 次全體會議。\"}},{\"term\":{\"en\":\"Central Committee\",\"zh-TW\":\"中央委員會\"},\"blurb\":{\"en\":\"Governing body whose membership the tally concerns.\",\"zh-TW\":\"此次統計涉及人事異動的黨內領導機構。\"}},{\"term\":{\"en\":\"Ren Zhongping\",\"zh-TW\":\"任仲平\"},\"blurb\":{\"en\":\"People’s Daily commentary byline.\",\"zh-TW\":\"《人民日報》評論文章的署名。\"}},{\"term\":{\"en\":\"Strict party governance\",\"zh-TW\":\"從嚴治黨\"},\"blurb\":{\"en\":\"Official agenda of the session.\",\"zh-TW\":\"本次會議的官方議程。\"}},{\"term\":{\"en\":\"Central News Agency\",\"zh-TW\":\"中央社\"},\"blurb\":{\"en\":\"Taiwan news agency and this card’s sole outlet.\",\"zh-TW\":\"台灣通訊社，本卡唯一的來源媒體。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}]
