esearch consortia across the Netherlands, complemented by an additional 14 million euros co-invested by companies and societal partners. Among the funded initiatives, Eindhoven University of Technology (TU/e) leads three consortia—including Iron Power, which develops recyclable iron powder as a CO2-free industrial energy carrier, and HERMES, which focuses on electricity grid resilience—while Delft University of Technology (TU Delft) leads e-PACT to scale sustainable aviation fuels.\n\n「Why it matters」\nIndustrial decarbonization and renewable power integration require scalable, transportable energy carriers and adaptive grid controls beyond conventional lithium-ion batteries. By linking Dutch technical universities directly with industrial co-leads such as Metalot, RIFT, and PwC, the Perspectief funding model accelerates laboratory breakthroughs toward commercial deployment.\n\n「Source differences」\nNWO's official announcement, titled \"Perspectief boosts innovation with 30 million in funding - NWO\", outlines the full scope of all eight consortia and the 30 million euro public grant allocation. Eindhoven University of Technology's release, titled \"TU/e researchers to lead three consortia funded by the NWO\", highlights its three TU/e-led projects—Iron Power (led by Yali Tang), HERMES (led by Koen Kok), and OCTAVE-CAD (cardiac digital twins)—while TU Delft's coverage, titled \"Perspective Programme boosts the innovative strength of ... - TU Delft\", emphasizes the 14 million euro partner co-funding and its leadership of the e-PACT sustainable aviation fuel consortium.\n\n「Still uncertain」\nNWO has not yet published individual budget breakdowns for each of the eight consortia or specific commercialization milestones for pilot industrial deployments.\n\nTrust label: Official confirmation — Directly verified through the Dutch Research Council's official grant announcement and participating university press releases."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-energy-255-nwo-perspectief-30m-consortia\",\"category\":\"energy\",\"title\":{\"en\":\"Dutch Research Council Awards 30 Million Euros to Eight Innovation Consortia Including Iron-Powder Energy Project\",\"zh-TW\":\"荷蘭科學研究委員會撥款3,000萬歐元資助8大創新聯盟，涵蓋鐵粉循環儲能與智慧電網\"},\"summary\":{\"en\":\"The Dutch Research Council (NWO) announced 30 million euros in Perspectief funding on November 26, 2026—supplemented by 14 million euros from industry partners—for eight multidisciplinary research consortia tackling clean energy carriers like iron powder, electricity grid resilience, sustainable aviation fuel, and cardiac digital twins.\",\"zh-TW\":\"荷蘭科學研究委員會（NWO）於2026年11月26日宣布透過 Perspectief 計畫撥款3,000萬歐元，並結合產業界額外投入1,400萬歐元，資助8個跨領域產學研聯盟，推動鐵粉無碳儲能載體、高韌性電網、永續航空燃料及心臟數位分身等應用技術商業化。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n荷蘭科學研究委員會（NWO）於2026年11月26日宣布透過「Perspectief」計畫撥出3,000萬歐元科研補助，並結合企業與社會合作夥伴額外投入的1,400萬歐元，支持荷蘭8個跨學科研究聯盟啟動創新計畫。其中恩荷芬理工大學（TU/e）主導3個聯盟，包括將可回收鐵粉作為無二氧化碳工業能源載體的「Iron Power」以及強化電網韌性的「HERMES」；台夫特理工大學（TU Delft）則主導推動低成本永續航空燃料量產的「e-PACT」聯盟。\\n\\n「為什麼重要」\\n重工業脫碳與再生能源跨區調度亟需傳統鋰電池以外的大規模儲能與運輸方案。Perspectief 計畫強制要求學界與產業界共同領導（如 Metalot、RIFT 與 PwC 等企業），有助於縮短清潔能源、電網控制與精準醫療技術從實驗室走向市場商轉的落差。\\n\\n「來源異同」\\n荷蘭科學研究委員會官網新聞稿以「Perspectief boosts innovation with 30 million in funding - NWO」為題，完整公布8個獲補助研究聯盟名單與3,000萬歐元總補助規模。恩荷芬理工大學官網以「TU/e researchers to lead three consortia funded by the NWO」為題，詳述該校學者唐亞莉（Yali Tang）領導的 Iron Power、科恩・科克（Koen Kok）領導的 HERMES 與心臟數位分身計畫 OCTAVE-CAD；台夫特理工大學則在「Perspective Programme boosts the innovative strength of ... - TU Delft」報導中補充產業界額外挹注1,400萬歐元的數據，並聚焦該校主導的 e-PACT 永續航空燃料項目。\\n\\n「仍不確定」\\n荷蘭科學研究委員會尚未公開8個研究聯盟各自的單獨經費分配明細，以及各項目工業示範線落地的具體時程表。\\n\\nTrust label: Official confirmation — 經荷蘭科學研究委員會（NWO）官方公告直接證實，並獲多所參與大學官方新聞稿同步佐證。\"},\"glossary\":[{\"term\":{\"en\":\"Iron Power (鐵粉儲能技術)\",\"zh-TW\":\"鐵粉儲能技術\"},\"blurb\":{\"en\":\"A circular clean-energy process in which iron powder reacts with air or water to release heat or hydrogen, and the resulting iron oxide is regenerated back into iron using green electricity.\",\"zh-TW\":\"一種循環零碳能源技術，透過鐵粉與空氣或水反應釋放熱能或氫氣，再以綠電將產生的氧化鐵還原為鐵粉重複使用。\"}},{\"term\":{\"en\":\"NWO Perspectief\",\"zh-TW\":\"NWO Perspectief 計畫\"},\"blurb\":{\"en\":\"A funding instrument of the Dutch Research Council that supports large-scale consortia of researchers, companies, and societal organizations to bring technological innovations to market.\",\"zh-TW\":\"荷蘭科學研究委員會設立的產學研補助計畫，資助大學與企業組成大型聯盟共同開發可商業化的關鍵技術。\"}},{\"term\":{\"en\":\"Cardiac Digital Twin (心臟數位分身)\",\"zh-TW\":\"心臟數位分身\"},\"blurb\":{\"en\":\"A personalized virtual computer model of an individual patient's heart built from medical imaging and clinical data to simulate treatment outcomes before surgery.\",\"zh-TW\":\"結合病患醫學影像與臨床數據建立的個人化虛擬心臟模型，可供醫師在治療前預先模擬手術或植入物效果。\"}}],\"sources\":[{\"name\":\"Dutch Research Council (NWO)\",\"url\":\"https://www.nwo.nl/en/news/perspectief-boosts-innovation-with-30-million-in-funding\"},{\"name\":\"Eindhoven University of Technology (TU/e)\",\"url\":\"https://www.tue.nl/en/news-and-events/news-overview/26-11-2026-tue-researchers-to-lead-three-consortia-funded-by-the-nwo-perspectief-grants\"},{\"name\":\"Delft University of Technology (TU Delft)\",\"url\":\"https://www.tudelft.nl/en/2026/tu-delft/perspective-programme-boosts-the-innovative-strength-of-delft-research\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"Dutch Research Council Awards 30 Million Euros to Eight Innovation Consortia Including Iron-Powder Energy Project\",\"zh-TW\":\"荷蘭科學研究委員會撥款3,000萬歐元資助8大創新聯盟，涵蓋鐵粉循環儲能與智慧電網\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":92,\"trustBreakdown\":{\"crossCorroboration\":24,\"outletReputation\":24,\"recencyClarity\":23,\"sourceDiversity\":21},\"publishedAt\":\"2026-11-27T22:39:49.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":23,\"D2\":23,\"D3\":23,\"D4\":22,\"D5\":23,\"total\":23},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"ut
