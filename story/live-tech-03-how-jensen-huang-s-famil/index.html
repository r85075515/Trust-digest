nearly tripled over the past nine months, fueled by Huang's aggressive dealmaking and rising valuations of its existing portfolio companies, TechCrunch reports. The Financial Times reports that Huang's family shaped Nvidia's dealings with Megaspeed, and that his daughter and son-in-law have come under scrutiny as the board launches a probe into the company's links to Megaspeed. A petition to reinstate Huang as chief executive has attracted more than 115,000 signatures, including Elon Musk, MIT Technology Review notes.\nWhy it matters\nNvidia's private portfolio is now a $65 billion bet on the AI ecosystem, so a probe into how those deals were made reaches beyond one executive's family. If the board curbs dealmaking or a new chief changes course, startups counting on Nvidia's backing face a colder climate. Takeaway: the Megaspeed probe will decide whether Nvidia's deal machine keeps running or stalls under new leadership.\nSources agree / disagree\nTechCrunch, the Financial Times and MIT Technology Review cover different angles of the same upheaval — portfolio growth, family links to Megaspeed, and the campaign to bring Huang back — and none contradicts the others in the short feed descriptions. The $65 billion figure comes from TechCrunch alone, and the petition count from MIT Technology Review alone.\nStill uncertain\nThe reports do not say what the board probe has found, which deals involved Huang's family, or whether the petition carries weight with directors. The board's findings and the choice of a permanent chief executive are the missing pieces.\nTrust label: Multi-source agreement — Three outlets cover the same Nvidia upheaval from complementary angles without contradicting each other."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-tech-03-how-jensen-huang-s-famil\",\"category\":\"tech\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-tech-03-how-jensen-huang-s-famil.jpg\",\"imageAlt\":{\"en\":\"Cover related to: How Jensen Huang’s family shaped Nvidia’s Megaspeed dealings\",\"zh-TW\":\"相關封面圖：黃仁勳家族如何影響 Nvidia 的 Megaspeed 交易\"},\"publishedAt\":\"2026-11-18T01:44:21.000Z\",\"title\":{\"en\":\"Huang Family Shaped Nvidia's Megaspeed Dealings as Startup Stakes Hit $65 Billion\",\"zh-TW\":\"黃仁勳（Jensen Huang）家族左右輝達（Nvidia）Megaspeed 交易，新創持股衝上 650 億美元\"},\"summary\":{\"en\":\"Nvidia's private investments nearly tripled in nine months to $65 billion, driven by Huang's dealmaking, but his exit now puts future deals in doubt. The board has launched a probe into the company's Megaspeed links, with Huang's daughter and son-in-law under scrutiny. The stakes go beyond one family; watch whether the probe or a new chief reshapes Nvidia's deal pipeline.\",\"zh-TW\":\"輝達（Nvidia）私人投資九個月內幾乎成長兩倍至 650 億美元，由黃仁勳（Jensen Huang）積極交易推動，但他去職後未來交易蒙上陰影。董事會已就公司與 Megaspeed 的關聯展開調查，黃仁勳的女兒與女婿受到審查。事關不只一個家族；接下來看調查或新任執行長是否重塑輝達的交易布局。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"輝達（Nvidia）新創持股九個月內衝上 650 億美元，但黃仁勳（Jensen Huang）去職，已讓推動這波成長的交易機器蒙上陰影。\\n發生了什麼事\\nTechCrunch 報導，輝達私人投資價值過去九個月幾乎成長兩倍，由黃仁勳積極交易與既有投資組合公司估值上升推動。《金融時報》報導，黃仁勳家族左右了輝達與 Megaspeed 的往來，隨著董事會就公司與 Megaspeed 的關聯展開調查，他的女兒與女婿受到審查。MIT Technology Review 指出，要求黃仁勳回任執行長的請願已吸引逾 11.5 萬人連署，包括伊隆·馬斯克（Elon Musk）。\\n為什麼重要\\n輝達私人投資組合如今是對 AI 生態系 650 億美元的押注，調查交易如何達成，影響超出一位高層的家族。若董事會收緊交易或新任執行長改弦更張，仰賴輝達支持的新創將面臨更冷的環境。結論：Megaspeed 調查將決定輝達的交易機器在新領導下繼續運轉或停擺。\\n來源異同\\nTechCrunch、《金融時報》與 MIT Technology Review 從不同角度報導同一場動盪——投資組合成長、家族與 Megaspeed 的關聯、要求黃仁勳回任的行動——簡短摘要之間沒有互相矛盾之處。650 億美元數字僅見於 TechCrunch，連署人數僅見於 MIT Technology Review。\\n仍不確定\\n報導未說明董事會調查有何發現、哪些交易涉及黃仁勳家族，也未說明請願對董事是否具影響力。董事會的調查結果與常任執行長人選是目前缺失的關鍵。\"},\"sources\":[{\"name\":\"TechCrunch\",\"url\":\"https://techcrunch.com/2026/11/17/nvidias-startup-stakes-ballooned-to-65b-but-huangs-exit-puts-future-deals-in-doubt/\"},{\"name\":\"Financial Times\",\"url\":\"https://www.ft.com/content/65ff066f-a81c-4d24-95da-73c2d7b83a27?syn-25a6b1a6=1\"},{\"name\":\"MIT Technology Review\",\"url\":\"https://w
