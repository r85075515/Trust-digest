 TechNews and Central News Agency's CNA picked up the story on October 23 — but both trace to that single CNBC report, and no independent confirmation has surfaced.\n\nWhat happened\nPer CNBC's account, the investment would put Musk inside the media empire taking shape around Skydance. TechNews and CNA relay the same figure — about $1 billion — from the same anonymous person. That is the entire sourcing chain: one outlet, one unnamed voice, two relays.\n\nWhy it matters\nIf true, Musk would hold a stake in the empire formed by Paramount's $111 billion merger with Warner Bros. Discovery. But right now the whole story stands on a single anonymous source — treat it as reported, not as fact, until Musk or Skydance confirms.\n\nSources agree / disagree\nTwo outlets, one origin: both TechNews and CNA cite CNBC's anonymous person, and the reported figure is consistent (about $1 billion). No conflicts — but also no independent corroboration. Trust label: unconfirmed, single source.\n\nStill uncertain\nNeither Musk nor Skydance has publicly confirmed the investment; the figure should be cited as 'reported,' not verified."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-02-10\",\"category\":\"semiconductor\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-semiconductor-02-10.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 傳馬斯克出手挺天舞，投資 10 億美元助攻媒體版圖整合\",\"zh-TW\":\"相關封面圖：傳馬斯克出手挺天舞，投資 10 億美元助攻媒體版圖整合\"},\"publishedAt\":\"2026-10-23T06:00:09.000Z\",\"title\":{\"en\":\"Musk Said to Back Skydance With About $1 Billion, CNBC Cites Unnamed Source\",\"zh-TW\":\"馬斯克（Elon Musk）傳投資天舞（Skydance）約 10 億美元，消息源頭是 CNBC 匿名人士\"},\"summary\":{\"en\":\"[Unverified, single source] CNBC, citing one unnamed person, reports Elon Musk invested about $1 billion (NT$325.7 billion) in David Ellison's Skydance; TechNews and CNA both trace to that same report. Takeaway: two outlets, one source — wait for Musk or Skydance to confirm before treating it as fact.\",\"zh-TW\":\"［未證實·單一來源］CNBC 引述一名匿名知情人士稱，馬斯克投資艾里森的天舞傳媒約 10 億美元（325.7 億台幣）；科技新報與中央社源頭皆為同一則報導。takeaway：兩家媒體、一個源頭——等官方證實再當真。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"美國財經電視網 CNBC 引述一名知情人士報導，億萬富豪馬斯克（Elon Musk）已投資天舞（Skydance）約 10 億美元（新台幣 325.7 億元）。由於這名人士未獲授權公開談論此事，要求匿名。\\n發生了什麼事\\n科技新報與中央社 10 月 23 日都跟進了這則消息，但源頭都是同一則 CNBC 報導、同一名匿名人士；目前沒有第二家獨立證實。整個消息鏈就是：一家媒體、一個匿名聲音、兩次轉述。\\n為什麼重要\\n若屬實，馬斯克將入股派拉蒙（Paramount）與華納兄弟探索（Warner Bros. Discovery）1110 億美元合併案形成的新媒體帝國。但眼下整則新聞只站在一個匿名消息源上——在馬斯克或天舞出面證實之前，先別當定案。\\n來源異同\\n兩家媒體、一個源頭：皆引述 CNBC 的匿名知情人士，金額說法一致（約 10 億美元）。沒有衝突，但也沒有獨立佐證。信任標籤：［未證實·單一來源］。\\n仍不確定\\n馬斯克與天舞雙方皆未公開證實；金額以「報導稱」視之，勿當定案引用。\"},\"sources\":[{\"name\":\"TechNews 科技新報\",\"url\":\"https://finance.technews.tw/2026/10/23/musk-backs-tianwu-1-billion-media-integration/\"},{\"name\":\"中央社-產經證券\",\"url\":\"https://www.cna.com.tw/news/aopl/202610230073.aspx\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":19,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"semiconductor\",\"live-ingest\",\"technews-科技新報\",\"中央社-產經證券\"],\"glossary\":[{\"term\":{\"en\":\"Elon Musk\",\"zh-TW\":\"馬斯克\"},\"blurb\":{\"en\":\"Billionaire reported to be investing about $1 billion in Skydance.\",\"zh-TW\":\"傳投資天舞傳媒約 10 億美元的億萬富豪。\"}},{\"term\":{\"en\":\"Skydance\",\"zh-TW\":\"天舞（Skydance）\"},\"blurb\":{\"en\":\"Media company at the center of the reported investment.\",\"zh-TW\":\"本次傳聞投資案主角的傳媒公司。\"}},{\"term\":{\"en\":\"David Ellison\",\"zh-TW\":\"大衛·艾里森\"},\"blurb\":{\"en\":\"Media executive leading Skydance.\",\"zh-TW\":\"領導天舞傳媒的媒體業高管。\"}},{\"term\":{\"en\":\"CNBC\",\"zh-TW\":\"CNBC\"},\"blurb\":{\"en\":\"US business news network whose report is the single source.\",\"zh-TW\":\"本則消息唯一源頭的美國財經電視網。\"}},{\"term\":{\"en\":\"CNA\",\"zh-TW\":\"中央社\"},\"blurb\":{\"en\":\"Taiwan's Central News Agency, which relayed the CNBC report.\",\"zh-TW\":\"轉述 CNBC 報導的中央通訊社。\"}}]}}]\n"])</script><script>self.__next_f.push
