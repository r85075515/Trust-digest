arate stories: former Democratic state representative Amish Shah is projected, according to Decision Desk HQ, to defeat Republican former NFL kicker Jay Feely for Arizona's 1st District, leading 52.5 percent to 45.5 percent with over 95 percent of votes counted, flipping a seat Shah narrowly lost two years earlier; and Axios reports House Democrats face a power struggle over their large majority as factions lay out competing visions for governing.\nWhy it matters\nThe verdict is blunt: the government detained its own citizens, and the public still has no clear account of how that happened or what checks failed. Citizenship verification is supposed to be the safeguard that prevents exactly this outcome, so the letter goes to the core of whether immigration enforcement can be trusted to tell citizens from noncitizens. Until the administration answers, every further detention carries the same doubt.\nSources agree / disagree\nThree outlets cover three distinct stories bundled into one cluster: ProPublica on the detentions, The Hill on the Arizona House race, and Axios on the Democratic power struggle. The ProPublica item is the title story, and none of the outlets contradict each other on their own story. Trust label: Bundled stories — three outlets report three separate stories grouped in one feed cluster; the detention demand is the lead item.\nStill uncertain\nThe full contents of the October letter, which officials received it, and whether the administration has responded are not in the feed snippets. The missing information is the point of the story: how many citizens were held in total, how citizenship checks are supposed to work, and what, if anything, the government plans to change. Without the administration's answer, the scale of the failure and the fix remain unknown."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-us-01-after-propublica-investi\",\"category\":\"us\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-us-01-after-propublica-investi.jpg\",\"imageAlt\":{\"en\":\"Cover related to: After ProPublica Investigation, House Democrats Demand Answers on U.S. Citizens Detained by Immigration Agents\",\"zh-TW\":\"相關封面圖：ProPublica 調查後，眾議院民主黨人要求對被移民代理拘留的美國公民做出答复\"},\"publishedAt\":\"2026-11-05T01:44:21.000Z\",\"title\":{\"en\":\"House Democrats Demand Answers on US Citizens Detained by Immigration Agents\",\"zh-TW\":\"眾議院民主黨要求交代：數百名美國公民遭移民執法拘留\"},\"summary\":{\"en\":\"House Democrats are again pressing the Trump administration to explain why hundreds of US citizens have been held by immigration agents, citing a ProPublica investigation. In an October letter they asked how the government verifies citizenship during operations. The letter puts the burden back on the administration to show its checks work.\",\"zh-TW\":\"眾議院民主黨援引 ProPublica 調查，再度致函川普政府，要求說明數百名美國公民為何遭移民執法人員拘留，以及執法時如何核實公民身分。這封 10 月的信把舉證責任推回政府身上。同批另有亞利桑那州眾議員選舉與民主黨內部權力角力報導。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"眾議院民主黨再度要求川普政府解釋，為何數百名美國公民會被移民執法人員拘留，依據是 ProPublica 最近對此類拘留的調查。\\n發生了什麼事\\n眾議院民主黨援引 ProPublica 的調查，在 10 月致函川普政府，要求說明數百名美國公民為何被移民執法人員拘留，以及移民執法行動時如何核實公民身分。這是一次重施的要求：民主黨之前就提過這個問題，在調查記錄了這些案例後再度追問。同一批採訪線還包含兩則獨立新聞：前民主黨州議員阿米什·沙阿（Amish Shah）根據決策台總部（DDHQ）預測，將擊敗共和黨前 NFL 踢球手傑伊·菲利（Jay Feely），贏下亞利桑那州第 1 選區，在超過 95% 選票已點完的情泋下以 52.5% 對 45.5% 領先，翻轉了沙阿兩年前以微差失去的席位；Axios 則報導眾議院民主黨在得到大幅多數後面臨派系之間的權力爭奪。\\n為什麼重要\\n結論很直接：政府拘留了自己的公民，公眾到現在還沒有看到清楚的交代，說明這是怎麼發生的、哪個把關失效了。公民身分核實本來就是防止這種結果出現的保障，這封信直接對準了核心問題：移民執法是否分得清公民與非公民。在政府回答之前，每一次新的拘留都帶著同樣的疑問。\\n來源異同\\n三家媒體分別報導三則不同的新聞，被打包在同一個採訪線集組裡：ProPublica 報導拘留事件、The Hill 報導亞利桑那州眾議員選舉、Axios 報導民主黨的權力爭奪。ProPublica 的報導是標題新聞，各家在自己的報導中互相沒有衝突。信任標籤：多事拼盤——三家媒體分別報導三則獨立新聞，被組合在同一批採訪線裡；拘留訴求是主線新聞。\\n仍不確定\\n10 月信件的全文、收件官員是誰，以及政府是否已經回覆，採訪線摘要都沒有提到。缺失的資訊正是這則新聞的重點：到底有多少名公民被拘留、公民身分核實應該怎麼運作，以及政府打算改變什麼。沒有政府的回答，失效的規模與修補方案都仍是未知數。\"},\"sources\":[{\"name\":\"The Hill\",\"url\":\"https://thehill.com/homenews/house/6190311-shah-wins-arizona-house-race/\"},{\"name\":\"Axios\",\"url\":\"https://www.axios.com/2026/11/05/house-democrats-jeffries-centrists-majority-left\"},{\"name\":\"ProPublica\",\"url\":\"https://www.propublica.org/article/american-citizens-ice-detention-congress-impact\"}],\"disagreements\":null,\"trustScore\":68,\"trustBreakdown\":{\"sourceDiversity\":19,\"outletReputation\":10,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"us\",\"live-ingest\",\"the-hill\",\"axios\",\"propublica\"],\"glossary\":[{\"term\":{\"en\":\"ProPublica\",\"zh-TW\":\"ProPublica\"},\"blurb\":{\"en\":\"US nonprofit investigative newsroom behind the detention investigation.\",\"zh-TW\":\"美國非營利調查新聞機構，拘留調查的作者。\"}},{\"term\":{\"en\":\"Amish Shah\",\"zh-TW\":\"阿米什·沙阿\"},\"blurb\":{\"en\":\"Former Democratic state representative projected to win Arizona's 1st District.\",\"zh-TW\":\"預計贏下亞利桑那州第 1 選區的前民主黨州議員。\"}},{\"term\":{\"en\":\"Decision Desk HQ (DDHQ)\",\"zh-TW\":\"決策台總部\"},\"blurb\":{\"en\":\"Election results forecaster that called the Arizona House race for Shah.\",\"zh-TW\":\"預測沙阿贏下亞利桑那州眾議員選舉的選舉結果預測機構。\"}},{\"term\":{\"en\":\"Axios\",\"zh-TW\":\"Axios\"},\"blurb\":{\"en\":\"US news outlet that reported the Democratic power struggle.\",\"zh-TW\":\"報導民主黨權力爭奪的美國新聞媒體。\"}},{\"term\":{\"en\":\"The Hill\",\"zh-TW\":\"The Hill\"},\"blurb\":{\"en\":\"US political news outlet that covered the Arizona House race.\",\"zh-TW\":\"報導亞利桑那州眾議員選舉的美國政治新聞媒體。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-us-01-after-pr
