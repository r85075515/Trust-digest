 within the Hon Hai group, reported signing a five-year contract worth roughly NT$900 million earlier this month with a major U.S. cloud service provider. Chairman Steve Chu (朱復銓) and President Reaforl Hung (洪德富) stated that the contract designates CASwell as the sole provider of hardware design, manufacturing, and global support, positioning the company for double-digit percentage revenue growth next year.\n\n「Why it matters」\n Securing a sole-source, multi-year hardware and global service mandate carrying an estimated 30 percent gross margin—above CASwell's corporate average—demonstrates how Taiwanese industrial IPC vendors are capturing higher-margin cloud security and edge infrastructure spending.\n\n「Source differences」\n Taipei Times published \"CASwell targets revenue growth - Taipei Times\", detailing the NT$900 million five-year U.S. cloud contract, expected revenue doubling from NT$500–600 million to over NT$1 billion next year, a 70 percent stake in Hong Kong cybersecurity firm Network Box contributing NT$200 million annually, and third-quarter net profit of NT$186 million (EPS NT$2.5). United Daily News (聯合新聞網) published \"瑞祺電三引擎推升業績2027年EPS將有不錯表現- 股市 - 聯合新聞網\", highlighting Chairman Steve Chu's remarks at the November 27 investor conference on growth across network security, enterprise SD-WAN/cloud security, and integrated maintenance distribution.\n\n「Still uncertain」\n Long lead times for printed circuit boards (PCBs) remain a supply-chain constraint that CASwell is working to mitigate by certifying secondary component suppliers.\n\nTrust label: Multi-source agreement — Taipei Times and United Daily News both report directly from CASwell's Taipei investor conference with consistent executive commentary and growth outlook."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-tech-278-caswell-us-cloud-contract-growth\",\"category\":\"tech\",\"title\":{\"en\":\"Taiwan's CASwell Targets Double-Digit 2027 Revenue Growth on NT$900M US Cloud Deal\",\"zh-TW\":\"瑞祺電通簽下美國雲端大廠9億元五年合約 明年營收拚雙位數成長\"},\"summary\":{\"en\":\"Taiwanese industrial computer and network security maker CASwell Inc. announced at its investor conference that it signed a five-year, NT$900 million sole-supplier contract with a major U.S. cloud service provider, projecting double-digit revenue growth next year as U.S. customer sales more than double.\",\"zh-TW\":\"台灣工業網安大廠瑞祺電通（6416）於法說會宣布，本月與美國大型雲端服務供應商簽訂價值約新台幣9億元的五年期獨家硬體與全球服務合約，預期明年該美系客戶營收將較今年倍增，帶動整體營收挑戰雙位數百分比成長。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n鴻海集團旗下樺漢科技轉投資的工業網安廠瑞祺電通（6416）於台北舉行法人說明會，董事長朱復銓（Steve Chu）與總經理洪德富（Reaforl Hung）揭露，公司本月已與一家美國大型雲端服務供應商簽署為期五年、總金額約新台幣9億元的新合約，成為其硬體設計製造與全球維運的獨家供應商，明年整體營收目標達成雙位數百分比成長。\\n\\n「為什麼重要」\\n該美系雲端大廠訂單毛利率估計達30%，高於瑞祺電通現行整體平均水準（上季毛利率為24.4%），顯示台灣工業電腦與網安硬體廠正從單純代工轉向「硬體加全球服務」的高毛利商業模式。\\n\\n「來源異同」\\n英文報紙 Taipei Times 報導標題為「CASwell targets revenue growth - Taipei Times」，詳述新台幣9億元五年期美系雲端合約、明年該客戶營收將自今年5億至6億元倍增、持股70%的香港資安商 Network Box 年貢獻約2億元，以及上季稅後純益1.86億元（每股純益2.5元）；聯合新聞網標題為「瑞祺電三引擎推升業績2027年EPS將有不錯表現- 股市 - 聯合新聞網」，聚焦朱復銓在11月27日法說會提出的網路安全、企業廣域網與雲端安全、整合服務與維運配銷三大成長引擎。\\n\\n「仍不確定」\\n印刷電路板（PCB）交期偏長仍是供應鏈潛在變數，瑞祺電通正透過分散供應商與認證第二供應來源降低斷鏈風險。\\n\\nTrust label: Multi-source agreement — Taipei Times 與聯合新聞網均實地採訪瑞祺電通台北法說會，對高層發言與明年成長動能報導相互印證。\"},\"glossary\":[{\"term\":{\"en\":\"CASwell Inc. (瑞祺電通)\",\"zh-TW\":\"瑞祺電通（6416）\"},\"blurb\":{\"en\":\"A Taiwan-listed network security and industrial computer hardware provider affiliated with Ennoconn Corp. and Hon Hai Precision Industry.\",\"zh-TW\":\"台灣上市工業電腦與網路安全硬體設備大廠，為鴻海集團旗下樺漢科技轉投資子公司。\"}},{\"term\":{\"en\":\"Cloud Service Provider (CSP)\",\"zh-TW\":\"雲端服務供應商\"},\"blurb\":{\"en\":\"A company that delivers large-scale cloud computing, data center networking, and enterprise cloud infrastructure services.\",\"zh-TW\":\"提供大規模雲端運算、資料中心網路與企業雲端基礎設施服務的科技業者。\"}},{\"term\":{\"en\":\"Proof of Concept (PoC)\",\"zh-TW\":\"概念驗證\"},\"blurb\":{\"en\":\"A pilot engineering stage used to verify that a hardware or software design meets a customer's technical specifications before mass orders.\",\"zh-TW\":\"在正式簽訂量產大單前，驗證硬體設計或解決方案是否符合客戶技術規格的試作測試階段。\"}}],\"sources\":[{\"name\":\"Taipei Times\",\"url\":\"https://www.taipeitimes.com/News/biz/archives/2026/11/28/2003868512\"},{\"name\":\"聯合新聞網\",\"url\":\"https://udn.com/news/story/7252/9906597\"}],\"imageUrl\":\"/covers/live/live-tech-278-caswell-us-cloud-contract-growth.jpg\",\"imageAlt\":{\"en\":\"Taiwan's CASwell Targets Double-Digit 2027 Revenue Growth on NT$900M US Cloud Deal\",\"zh-TW\":\"瑞祺電通簽下美國雲端大廠9億元五年合約 明年營收拚雙位數成長\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":85,\"trustBreakdown\":{\"crossCorroboration\":22,\"outletReputation\":22,\"recencyClarity\":23,\"sourceDiversity\":18},\"publishedAt\":\"2026-11-27T23:55:21.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":23,\"D2\":22,\"D3\":23,\"D4\":22,\"D5\":22,\"total\":22},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-tech-278-caswell-us-cloud-contract-growth/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-tech-278-caswell-us-cloud-contract-growth/\"}],[\"$\",\"meta\",\"6\",{\"nam
