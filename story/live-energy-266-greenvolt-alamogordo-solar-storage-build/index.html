nvolt Group, commenced construction on the Alamogordo hybrid renewable energy project in Otero County, New Mexico. The facility combines 100 MWac of solar photovoltaic generation with a co-located 200 MWh battery energy storage system designed to store electricity for up to four hours. Backed by an investment exceeding USD 120 million and a long-term power purchase agreement, the project is scheduled for full completion by summer 2028.\n\n「Why it matters」\nOnce completed, Alamogordo will become Greenvolt Group's largest combined solar and battery storage asset in the United States, supporting New Mexico's 2040 renewable energy targets. Co-locating four-hour battery storage allows solar electricity generated during midday peaks to be dispatched during evening demand windows, while construction is projected to create more than 370 local jobs.\n\n「Source differences」\nEnergy Global reported the milestone on November 25, 2026 under the headline \"Greenvolt Power advances construction of hybrid project in New Mexico\", quoting Greenvolt Power USA chief executive officer Weronika Nowak (Weronika Nowak) and noting the expected creation of over 370 construction jobs and self-managed grid interconnection works. EnergyNews.pro covered the announcement under \"Greenvolt Power builds 100 MW of solar and 200 MWh of storage in New Mexico\", detailing the summer 2028 completion target, the investment exceeding USD 120 million, the four-hour storage duration, and the appointment of CJR Renewables and Dashiell Corporation as engineering, procurement, and construction contractors, while noting that the power purchase agreement buyer and pricing were not disclosed. Greenvolt Group also published the official release on its corporate newsroom under \"Greenvolt Power advances construction of 100 MW Solar and 200 MWh Battery Storage Project in New Mexico, United States\".\n\n「Still uncertain」\nThe identity of the long-term power purchase agreement off-taker, contract duration, electricity pricing terms, andwhether grid interconnection milestones remain on schedule through summer 2028 have not been publicly disclosed.\n\nTrust label: Single source — All coverage traces to Greenvolt Group’s single construction-start announcement, with trade outlets reporting consistent details."])</script><script>self.__next_f.push([1,"11:T87d,"])</script><script>self.__next_f.push([1,"「發生了什麼事」\n2026 年 11 月 25 日，葡萄牙再生能源集團 Greenvolt 旗下公用事業規模開發部門 Greenvolt Power 宣布，位於美國新墨西哥州奧特羅郡（Otero County）的阿拉莫戈多（Alamogordo）混合再生能源專案正式展開建設。該案結合 100 MWac 太陽能光電與 200 MWh 併設電池儲能系統，具備最長四小時儲電調度能力，總投資金額超過 1.2 億美元，並已取得長期購電協議（PPA），預計 2028 年夏季全面完工。\n\n「為什麼重要」\n阿拉莫戈多專案完工後，將成為 Greenvolt 集團在美國規模最大的太陽能加儲能複合資產，直接挹注新墨西哥州 2040 年再生能源目標。透過併設四小時儲能系統，電網可將白天尖峰時段產出的太陽能電力轉移至傍晚用電高峰釋放，施工期間預計也將為當地創造超過 370 個工作機會。\n\n「來源異同」\n能源產業媒體 Energy Global 於 2026 年 11 月 25 日以「Greenvolt Power advances construction of hybrid project in New Mexico」為題報導，引述 Greenvolt Power 美國執行長諾瓦克（Weronika Nowak）說法，指出該案由公司自行主導併網設施設計與施工，並預計創造逾 370 個施工職缺。EnergyNews.pro 則以「Greenvolt Power builds 100 MW of solar and 200 MWh of storage in New Mexico」為題報導，補充披露總投資逾 1.2 億美元、2028 年夏季完工時程、四小時儲能設計，以及由 CJR Renewables 負責光電與儲能總包、Dashiell Corporation 負責變電站與開關場工程，同時指出公司未公開購電買方與合約價格。Greenvolt 集團官網亦同步發布原始新聞稿，標題為「Greenvolt Power advances construction of 100 MW Solar and 200 MWh Battery Storage Project in New Mexico, United States」。\n\n「仍不確定」\n長期購電協議的具體買方身分、合約年限與費率條件，以及後續併網與變電站工程能否如期在 2028 年夏季前完成商轉，目前尚未對外公開。\n\nTrust label: Single source — 三個來源同源自 Greenvolt 集團同一份專案動工公告，產業媒體報導細節一致。"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-energy-266-greenvolt-alamogordo-solar-storage-build\",\"category\":\"energy\",\"title\":{\"en\":\"Greenvolt Power Starts Construction on 100 MW Solar and 200 MWh Battery Project in New Mexico\",\"zh-TW\":\"Greenvolt Power 啟動美國新墨西哥州 100 MW 太陽能與 200 MWh 儲能混合專案建設\"},\"summary\":{\"en\":\"Greenvolt Power began construction on November 25, 2026, on its Alamogordo hybrid renewable energy project in Otero
