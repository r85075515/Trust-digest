er Mark Carney in Shenzhen on November 17. China's Commerce Ministry then announced that both sides agreed to extend the exemptions under their preliminary joint arrangement by two years. Canada will further expand exemptions for Chinese steel and aluminum products, while China will adjust its anti-discrimination measures on some Canadian farm and aquatic products, CNA reports from Taipei.\nWhy it matters\nA two-year extension locks in a pause in the trade friction and gives steel, aluminum, farm, and aquatic exporters on both sides a longer planning horizon. The reciprocal shape of the deal — wider Canadian exemptions matched by Chinese adjustments — shows both sides trading concessions rather than escalating.\nSources agree / disagree\nOnly one outlet, CNA, carries this item in the batch, so there is no second source to corroborate the announcement. Trust label: Single source — one CNA report; no corroboration from a second outlet in this batch.\nStill uncertain\nThe summary does not list which products fall under the exemptions, how far Canada's expanded steel and aluminum exemptions reach, or when the extension takes effect. Verify details on the publisher page."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-03-2-h28595262\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-taiwan-03-2-h28595262.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 習近平會卡尼後  中國商務部：中加同意延長豁免措施2年\",\"zh-TW\":\"相關封面圖：習近平會卡尼後 中國商務部：中加同意延長豁免措施2年\"},\"publishedAt\":\"2026-11-18T02:19:05.000Z\",\"title\":{\"en\":\"Xi Meets Carney in Shenzhen; China and Canada Extend Trade Exemptions Two Years\",\"zh-TW\":\"習近平（Xi Jinping）會卡尼（Mark Carney）後　中加同意延長豁免措施 2 年\"},\"summary\":{\"en\":\"[Unconfirmed · Single source] After President Xi Jinping met Canadian Prime Minister Mark Carney in Shenzhen, China's Commerce Ministry said both sides agreed to extend exemptions under their preliminary joint arrangement by two years. Canada will widen exemptions for Chinese steel and aluminum products, while China will adjust anti-discrimination measures on some Canadian farm and aquatic products.\",\"zh-TW\":\"［未證實·單一來源］中國國家主席習近平（Xi Jinping）17 日在深圳會見加拿大總理卡尼（Mark Carney）後，中國商務部宣布，雙方同意將初步聯合安排的相關豁免措施延長 2 年。加方將擴大對中國鋼鋁產品的豁免範圍，中方則調整對加方部分農水產品的反歧視措施。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"中加雙方同意將初步聯合安排的相關豁免措施延長 2 年，背景是習近平 17 日在深圳會見卡尼。\\n發生了什麼事\\n中國國家主席習近平 17 日在深圳會見加拿大總理卡尼（Mark Carney）。中央社台北報導，中國商務部隨後宣布，雙方同意將初步聯合安排的相關豁免措施延長 2 年；加方將進一步擴大對中國鋼鋁產品的豁免範圍，中方則調整對加方部分農水產品採取的反歧視措施。\\n為什麼重要\\n延長 2 年等於把貿易摩擦的暫停期鎖住，讓兩邊的鋼鋁與農水產品出口商有更長的規劃期。加方擴大豁免、中方調整措施，雙方是以交換讓步收場，而非繼續升級。\\n來源異同\\n本批只有中央社一家報導，這項宣布沒有第二家媒體佐證。信任標籤：單一來源——僅中央社一則報導，本批無第二家佐證。\\n仍不確定\\n來源摘要未列出豁免產品清單、加方擴大豁免的範圍，也未說明延長何時生效；細節請查閱原始報導。\"},\"sources\":[{\"name\":\"中央社-兩岸\",\"url\":\"https://www.cna.com.tw/news/acn/202611180048.aspx\"}],\"disagreements\":null,\"trustScore\":59,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"中央社-兩岸\"],\"glossary\":[{\"blurb\":{\"en\":\"President of China, who met Prime Minister Carney in Shenzhen.\",\"zh-TW\":\"中國國家主席，在深圳會見卡尼。\"},\"term\":{\"en\":\"Xi Jinping\",\"zh-TW\":\"習近平\"}},{\"blurb\":{\"en\":\"Prime Minister of Canada, who met President Xi in Shenzhen.\",\"zh-TW\":\"加拿大總理，在深圳會見習近平。\"},\"term\":{\"en\":\"Mark Carney\",\"zh-TW\":\"卡尼\"}},{\"blurb\":{\"en\":\"Chinese ministry that announced the two-year exemption extension.\",\"zh-TW\":\"中國商務部，宣布豁免措施延長 2 年。\"},\"term\":{\"en\":\"Ministry of Commerce (China)\",\"zh-TW\":\"中國商務部\"}},{\"blurb\":{\"en\":\"Chinese city where Xi met Carney.\",\"zh-TW\":\"中國城市，習近平與卡尼會面地。\"},\"term\":{\"en\":\"Shenzhen\",\"zh-TW\":\"深圳\"}},{\"blurb\":{\"en\":\"Taiwan's national news agency and the sole source for this item.\",\"zh-TW\":\"台灣國家通訊社，本則唯一來源。\"},\"term\":{\"en\":\"Central News Agency (CNA)\",\"zh-TW\":\"中央社\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[
