r Dalbavancin Injection 500 mg/5 mL (100 mg/mL) single-dose vials through the 505(b)(2) regulatory pathway for single-dose treatment. The product is a liquid formulation containing the same active ingredient as AbbVie's Dalvance and is indicated for acute bacterial skin and skin structure infections (ABSSSI) in adult and pediatric patients caused by designated susceptible Gram-positive bacteria.\n\nWhy it matters\nA single-dose liquid formulation delivered over a 30-minute intravenous infusion with ready-to-dilute preparation simplifies drug reconstitution and dosing workflow for treating ABSSSI in eligible adult and pediatric patients. It introduces an additional approved dalbavancin liquid option sharing the active ingredient of Dalvance while remaining contraindicated for patients with known hypersensitivity to dalbavancin.\n\nSource differences\nExpress Pharma's article titled \"Lupin receives USFDA approval for Dalbavancin Injection\" (2026-11-27) reports the USFDA approval of Lupin's NDA for Dalbavancin Injection 500 mg/5 mL (100 mg/mL) single-dose vials via the 505(b)(2) pathway for single-dose treatment of ABSSSI in adults and children, noting ready-to-dilute liquid formulation, 30-minute intravenous infusion, shared active ingredient with AbbVie's Dalvance, and contraindication for known dalbavancin allergy. Indian Pharma Post's article titled \"Lupin secures USFDA approval for single-dose Dalbavancin injection\" (2026-11-27) covers the same approval and single-dose ABSSSI indication for adult and pediatric patients against designated susceptible Gram-positive strains.\n\nStill uncertain\nCommercial launch timing, pricing, and regional distribution rollout details beyond the reported FDA approval have not yet been detailed in the provided coverage.\n\nTrust label: Single source — Both articles stem from the same Lupin announcement on the USFDA approval and are treated as a single underlying source."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-biotech-440-lupin-dalbavancin-fda-approval\",\"category\":\"biotech\",\"title\":{\"en\":\"US FDA Approves Lupin's Single-Dose Dalbavancin Injection for ABSSSI\",\"zh-TW\":\"美國FDA核准Lupin單劑療程Dalbavancin注射液 用於急性細菌性皮膚及皮膚結構感染\"},\"summary\":{\"en\":\"On November 27, 2026, industry reports stated that the U.S. FDA approved Lupin's new drug application for Dalbavancin Injection 500 mg/5 mL (100 mg/mL) single-dose vials via the 505(b)(2) pathway for single-dose treatment of acute bacterial skin and skin structure infections (ABSSSI) in adults and pediatric patients. The liquid formulation shares its active ingredient with AbbVie's Dalvance and is administered via 30-minute intravenous infusion.\",\"zh-TW\":\"醫藥媒體於2026年11月27日報導，美國FDA經505(b)(2)路徑核准藥廠Lupin的新藥申請（NDA），推出Dalbavancin注射液500 mg/5 mL（100 mg/mL）單劑小瓶，限單劑療程用於成人與兒童急性細菌性皮膚及皮膚結構感染（ABSSSI）。該液體製劑活性成分同AbbVie旗下Dalvance，採30分鐘靜脈輸注給藥。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」醫藥媒體於2026年11月27日報導，美國食品藥物管理局（FDA）核准Lupin的Dalbavancin注射液500 mg/5 mL（100 mg/mL）單劑小瓶新藥申請（NDA），採505(b)(2)路徑核准，僅限單劑療程。此產品為液體製劑，活性成分同AbbVie的Dalvance，適應症為成人與兒童患者由指定易感革蘭氏陽性菌株引起的急性細菌性皮膚及皮膚結構感染（ABSSSI）。\\n\\n「為什麼重要」即用稀釋（ready-to-dilute）液體製劑搭配30分鐘靜脈輸注可簡化配藥流程，並提供成人與兒童ABSSSI單劑療程選擇。該品項活性成分與AbbVie的Dalvance相同，臨床上對已知對dalbavancin過敏者禁用。\\n\\n「來源異同」Express Pharma報導《Lupin receives USFDA approval for Dalbavancin Injection》（2026年11月27日）載明美國FDA經505(b)(2)路徑核准Lupin的NDA，規格為500 mg/5 mL（100 mg/mL）單劑小瓶、僅限單劑療程，並說明即用稀釋液體製劑簡化配藥、30分鐘靜脈輸注、活性成分同AbbVie的Dalvance，以及已知對dalbavancin過敏者禁用；Indian Pharma Post報導《Lupin secures USFDA approval for single-dose Dalbavancin injection》（2026年11月27日）則同樣報導單劑Dalbavancin注射液獲美國FDA核准，用於成人與兒童ABSSSI及指定易感革蘭氏陽性菌株。\\n\\n「仍不確定」目前揭露內容尚未說明該產品的正式上市時間表、定價策略與實際鋪貨進度。\\n\\nTrust label: Single source — 兩篇報導皆源於Lupin公司公告，證據視為同一來源。\"},\"glossary\":[{\"term\":{\"en\":\"ABSSSI\",\"zh-TW\":\"急性細菌性皮膚及皮膚結構感染\"},\"blurb\":{\"en\":\"Acute bacterial skin and skin structure infections caused by susceptible bacteria, such as designated Gram-positive strains.\",\"zh-TW\":\"由易感細菌（如指定革蘭氏陽性菌株）引起的急性皮膚及皮膚結構感染。\"}},{\"term\":{\"en\":\"505(b)(2) pathway\",\"zh-TW\":\"505(b)(2)審查路徑\"},\"blurb\":{\"en\":\"A U.S. FDA new drug application pathway that can rely in part on existing findings of safety and effectiveness.\",\"zh-TW\":\"美國FDA新藥申請審查路徑之一，可部分援引既有安全性與療效研究依據。\"}},{\"term\":{\"en\":\"Intravenous (IV) infusion\",\"zh-TW\":\"靜脈輸注\"},\"blurb\":{\"en\":\"Delivery of a liquid medication directly into a vein over a specified period, here 30 minutes.\",\"zh-TW\":\"在特定時間內（本案為30分鐘）將液體藥物直接注入靜脈的給藥方式。\"}}],\"sources\":[{\"name\":\"Express Pharma\",\"url\":\"https://www.expresspharma.in/lupin-receives-usfda-approval-for-dalbavancin-injection/\"},{\"name\":\"Indian Pharma Post\",\"url\":\"https://www.indianpharmapost.com/regulatory/lite/lupin-secures-usfda-approval-for-single-dose-dalbavancin-injection-22478\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"US FDA Approves Lupin's Single-Dose Dalbavancin Injection for ABSSSI\",\"zh-TW\":\"美國FDA核准Lupin單劑療程Dalbavancin注射液 用於急性細菌性皮膚及皮膚結構感染\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":76,\"trustBreakdown\":{\"crossCorroboration\":19,\"outletReputation\":21,\"recencyClarity\":22,\"sourceDiversity\":14},\"publishedAt\":\"2026-11-28T10:22:56.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":21,\"D2\":21,\"D3\":21,\"D4\":20,\"D5\":19,\"total\":20},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-biotech-440-lupin-dalbavanci
