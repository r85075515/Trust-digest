as a retractable hard top and new technology paired with a twin-turbo V8 engine, pitched as taking the sensory experience of open-top driving to a new level.\n\nWhy it matters\nA folding hard top gives a convertible the open-air thrill without giving up the rigidity and refinement of a coupe when closed, and the twin-turbo V8 signals how the brand is balancing performance with everyday usability. The launch also sets a marker for where the supercar market heads next on powertrains.\n\nSources agree / disagree\nThis is a single-outlet item from CNA, so the launch date, roof design and engine details all rest on that one dispatch, with no second outlet to cross-check.\n\nStill uncertain\nThe feed material gives no price, performance figures or delivery schedule, and while the headline mentions the chief executive's take on a deglobalising market, the supplied text carries none of those remarks, so the full report is needed.\n\nTrust label: Single source — One CNA dispatch; pricing and performance figures still missing."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-02-ha8930c59\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-taiwan-02-ha8930c59.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 藍寶堅尼發表硬頂敞篷超跑  執行長剖析去全球化市場\",\"zh-TW\":\"相關封面圖：藍寶堅尼發表硬頂敞篷超跑 執行長剖析去全球化市場\"},\"publishedAt\":\"2026-11-19T07:53:05.000Z\",\"title\":{\"en\":\"Lamborghini Unveils Temerario Spyder Convertible With Folding Hard Top and Twin-Turbo V8\",\"zh-TW\":\"藍寶堅尼（Lamborghini）發表敞篷超跑 Temerario Spyder，硬頂可收摺配雙渦輪 V8\"},\"summary\":{\"en\":\"[Unconfirmed · Single source] Italian supercar maker Lamborghini unveiled the Temerario Spyder convertible on November 19, with a folding hard top and a twin-turbo V8 engine promising a heightened open-top driving experience. Watch for pricing and delivery dates, which the feed material does not yet give.\",\"zh-TW\":\"［未證實·單一來源］義大利超跑品牌藍寶堅尼（Lamborghini）19 日發表全新敞篷超跑 Temerario Spyder，配備可收摺硬式車頂，搭載雙渦輪增壓 V8 引擎，強調敞篷駕駛的感官體驗再升級。接下來看新車售價與交車時程何時公布。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"藍寶堅尼（Lamborghini）19 日發表全新敞篷超跑 Temerario Spyder，可收摺硬式車頂搭配雙渦輪增壓 V8 引擎。\\n\\n發生了什麼事\\n中央社記者自義大利聖阿加塔-博洛涅塞發回報導，藍寶堅尼（Lamborghini）19 日發表全新敞篷超跑 Temerario Spyder。新車配備可收摺的硬式車頂，並導入新科技，結合雙渦輪增壓 V8 引擎，訴求把駕駛敞篷車的感官體驗提升到新境界。\\n\\n為什麼重要\\n敞篷超跑的硬頂設計兼顧開篷樂趣與關篷後的車身剛性與隔音，搭配雙渦輪 V8 代表品牌在性能與日常實用之間找平衡，新車動向也牽動超跑市場對下一代動力配置的判斷。\\n\\n來源異同\\n目前只有中央社一家來源，發表時間、車頂形式與動力配置都以這篇專電為準，沒有第二家媒體交叉比對。\\n\\n仍不確定\\n摘要素材未提供售價、性能數據與交車時程；標題提到執行長剖析去全球化市場，但內文素材沒有相關說法，須等完整報導確認。\"},\"sources\":[{\"name\":\"中央社-產經證券\",\"url\":\"https://www.cna.com.tw/news/afe/202611190224.aspx\"}],\"disagreements\":null,\"trustScore\":59,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"中央社-產經證券\"],\"glossary\":[{\"term\":{\"en\":\"Lamborghini\",\"zh-TW\":\"藍寶堅尼（Lamborghini）\"},\"blurb\":{\"en\":\"Italian maker of luxury supercars.\",\"zh-TW\":\"義大利豪華超跑品牌。\"}},{\"term\":{\"en\":\"Temerario Spyder\",\"zh-TW\":\"Temerario Spyder\"},\"blurb\":{\"en\":\"Lamborghini's new convertible supercar.\",\"zh-TW\":\"藍寶堅尼新發表的敞篷超跑。\"}},{\"term\":{\"en\":\"CNA\",\"zh-TW\":\"中央社（CNA）\"},\"blurb\":{\"en\":\"Taiwan's Central News Agency.\",\"zh-TW\":\"中央通訊社。\"}},{\"term\":{\"en\":\"Sant'Agata Bolognese\",\"zh-TW\":\"聖阿加塔-博洛涅塞\"},\"blurb\":{\"en\":\"Italian town where Lamborghini is based.\",\"zh-TW\":\"藍寶堅尼總部所在的義大利小鎮。\"}},{\"term\":{\"en\":\"Twin-turbo V8\",\"zh-TW\":\"雙渦輪增壓 V8 引擎\"},\"blurb\":{\"en\":\"V8 engine fitted with two turbochargers.\",\"zh-TW\":\"配備兩具渦輪增壓器的 V8 引擎。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"m
