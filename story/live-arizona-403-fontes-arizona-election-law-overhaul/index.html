g Democratic trifecta—after Democrats won control of both legislative chambers for the first time since 1996—to rewrite state voting laws when lawmakers convene in January. Fontes is advocating automatic mail-in ballots for all registered voters, expanded automatic voter registration, and repealing both Arizona's 2016 felony ban on third-party ballot collection and restrictions on private election administration funding.\n\nWhy it matters\nAlthough more than 80% of Arizona voters already cast ballots by mail, shifting to universal automatic mail ballots and repealing ballot-collection penalties would fundamentally reshape election administration in a premier presidential battleground state ahead of the 2028 cycle. Republican State Sen. John Kavanagh and Arizona GOP Chairman Sergio Arellano warned that the changes would \"flood the state with ballots\" and weaken anti-fraud safeguards, setting up an immediate legislative clash.\n\nSource differences\nKJZZ (\"With Democrats in charge, Fontes wants to revamp Arizona elections\") featured direct interviews with Secretary of State Adrian Fontes, Republican State Sen. John Kavanagh, and State GOP Chairman Sergio Arellano debating fraud safeguards and voter access. The Arizona Chronicle (\"Fontes wants ballots mailed to all registered voters and the 2016 ballot-collection felony repealed\") highlighted that Democrats won both chambers for the first time since 1996 and noted the January legislative session timeline.\n\nStill uncertain\nWhether Democratic majorities in the Arizona House and Senate hold sufficient votes to pass the entire package without moderate defections, and which specific bills will be prioritized when the legislature convenes in January 2027, remain unresolved.\n\nTrust label: Multi-source agreement — Independent reporting by KJZZ and The Arizona Chronicle aligns on Secretary of State Adrian Fontes's November 26 legislative proposals and Republican objections."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-arizona-403-fontes-arizona-election-law-overhaul\",\"category\":\"arizona\",\"title\":{\"en\":\"Arizona Secretary of State Adrian Fontes Pushes Universal Mail Ballots Under New Democratic Trifecta\",\"zh-TW\":\"民主黨重掌亞利桑那州完全執政，州務卿方提斯力推全面郵寄投票與廢除收票禁令\"},\"summary\":{\"en\":\"Reelected Arizona Secretary of State Adrian Fontes outlined a sweeping election-law overhaul on November 26 ahead of the incoming Democratic legislative majority in January 2027. His proposals include automatically mailing ballots to all registered voters and repealing the 2016 felony ban on third-party ballot collection, drawing sharp opposition from Republican lawmakers.\",\"zh-TW\":\"連任成功的亞利桑那州州務卿阿德里安·方提斯（Adrian Fontes）11月26日提出選罷法重大翻修藍圖，擬趁民主黨於2027年1月重掌州議會參眾兩院完全執政之際，推動向所有登記選民自動寄發選票，並廢除2016年實施的第三方代收選票重罪禁令。共和黨領袖批評此舉將削弱防弊機制並製造黨派優勢。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n剛贏得連任的亞利桑那州州務卿阿德里安·方提斯（Adrian Fontes）於2026年11月26日公布選務修法議程，計畫在民主黨自1996年以來首度同時拿下州參眾兩院多數席次、形成州府與議會完全執政後，於明年1月新會期全面翻修該州選舉法規。方提斯主張向所有登記選民自動寄發郵寄選票、擴充自動選民登記，並廢除2016年通過的第三方代收選票重罪法條及禁止民間資金挹注選務的限制。\\n\\n「為什麼重要」\\n儘管亞利桑那州目前已有逾80%選民採用郵寄投票，但全面自動寄發選票並解除代收選票刑責，將徹底改變這個美國總統大選關鍵搖擺州在2028年大選前的選務運作。共和黨籍州參議員約翰·卡瓦納（John Kavanagh）與亞利桑那州共和黨主席塞爾吉奧·阿雷亞諾（Sergio Arellano）強烈反對，警告此舉將使「選票氾濫全州」並削弱防弊機制，預示明年1月州議會開議後將爆發激烈攻防。\\n\\n「來源異同」\\n亞利桑那公共廣播電台《KJZZ》（「With Democrats in charge, Fontes wants to revamp Arizona elections」）完整呈現州務卿阿德里安·方提斯、共和黨州參議員約翰·卡瓦納與州共和黨主席塞爾吉奧·阿雷亞諾針對選務防弊與投票便利性的正面交鋒；《The Arizona Chronicle》（「Fontes wants ballots mailed to all registered voters and the 2016 ballot-collection felony repealed」）則補充民主黨自1996年以來首次重掌兩院控制權的背景與明年1月開議時程。\\n\\n「仍不確定」\\n民主黨在州參眾兩院的微弱多數是否足以讓全套選務法案在不跑票的情況下過關，以及明年1月開議後的具體優先立法順序，仍有待觀察。\\n\\nTrust label: Multi-source agreement — KJZZ 與 The Arizona Chronicle 均獨立報導州務卿方提斯 11 月 26 日的選務修法主張及共和黨議員的反對立場。\"},\"glossary\":[{\"term\":{\"en\":\"Democratic trifecta\",\"zh-TW\":\"民主黨完全執政\"},\"blurb\":{\"en\":\"A political alignment in which a single party simultaneously holds the governorship and majorities in both chambers of a state legislature.\",\"zh-TW\":\"指單一政黨在州層級同時掌握州長職位以及州參議院、州眾議院兩院多數席次的執政格局。\"}},{\"term\":{\"en\":\"Third-party ballot collection\",\"zh-TW\":\"第三方代收選票\"},\"blurb\":{\"en\":\"The practice of volunteers, community organizers, or non-family individuals collecting and delivering sealed mail-in ballots on behalf of voters, restricted under a 2016 Arizona felony law.\",\"zh-TW\":\"由志工或非同住家屬協助選民收集並遞交密封郵寄選票的做法；亞利桑那州於2016年立法將非特定親屬或照護者代收選票列為重罪。\"}},{\"term\":{\"en\":\"Universal vote-by-mail\",\"zh-TW\":\"全面郵寄投票制\"},\"blurb\":{\"en\":\"An election system in which election officials automatically mail a ballot to every active registered voter rather than requiring voters to request one.\",\"zh-TW\":\"選務機關無須選民逐次申請，即自動向每位有效登記選民寄發實體選票的投票制度。\"}}],\"sources\":[{\"name\":\"KJZZ\",\"url\":\"https://www.kjzz.org/elections/2026-11-26/with-democrats-in-charge-fontes-wants-to-revamp-arizona-elections\"},{\"name\":\"The Arizona Chronicle\",\"url\":\"https://azchronicle.com/politics/2026/11/26/arizona-fontes-election-law-agenda-democratic-legislature\"}],\"imageUrl\":\"/covers/live/live-arizona-403-fontes-arizona-election-law-overhaul.jpg\",\"imageAlt\":{\"en\":\"Arizona Secretary of State Adrian Fontes Pushes Universal Mail Ballots Under New Democratic Trifecta\",\"zh-TW\":\"民主黨重掌亞利桑那州完全執政，州務卿方提斯力推全面郵寄投票與廢除收票禁令\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":84,\"trustBreakdown\":{\"crossCorroboration\":22,\"outletReputation\":21,\"recencyClarity\":22,\"sourceDiversity\":19},\"publishedAt\":\"2026-11-28T09:02:06.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":21,\"D2\":21,\"D3\":22,\"D4\":21,\"D5\":20,\"total\":21},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axi
