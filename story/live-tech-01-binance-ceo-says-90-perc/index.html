ith the incident. Binance's chief executive said 90 percent of the funds have been replaced, and the company plans to cover the remaining 10 percent as well. Binance is covering the stolen funds directly. The remaining 10 percent consists of less liquid tokens, which the company says may take longer to acquire.\nWhy it matters\nThe scale of the theft, $6.3 billion taken from customers of a major cryptocurrency exchange, makes how the losses are covered a central question for those customers. The company's statement that it is covering the stolen funds directly, rather than leaving customers to absorb the loss, is the core of its response. The composition of the remaining 10 percent also matters: because those tokens are less liquid, the company itself says acquiring them may take longer, so completion of the replenishment may not follow the same pace as the first 90 percent.\nSources agree / disagree\nThe Verge and The Hill both report the same headline figure: Binance has replenished or recovered 90 percent of the stolen assets from the hack. The feed snippets, however, surface differing figures, noted as 10 versus 3: the 10 percent is the share Binance says remains to be covered, while around $3 billion is the amount some cryptocurrency firms froze in connection with the incident. Readers should not treat those two numbers as measuring the same thing.\nTrust label: Accounts differ — The outlets agree on the 90 percent replenishment, but the snippets contain differing figures that refer to different parts of the incident.\nStill uncertain\nThe available snippets do not say how the hackers carried out the theft, when the remaining 10 percent will be acquired, or whether deposits and withdrawals have resumed. Feed descriptions can omit context, updates, or corrections, so the linked publisher pages remain the place to verify the latest full reporting."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-tech-01-binance-ceo-says-90-perc\",\"category\":\"tech\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-tech-01-binance-ceo-says-90-perc.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Binance CEO says 90 percent of stolen assets have been ‘replenished’\",\"zh-TW\":\"相關封面圖：幣安首席執行官表示 90% 的被盜資產已被“補充”\"},\"publishedAt\":\"2026-10-31T19:08:38.000Z\",\"title\":{\"en\":\"Binance says 90 percent of stolen assets have been replenished after $6.3 billion hack\",\"zh-TW\":\"幣安（Binance）稱63億美元竊案中九成被盜資產已補回\"},\"summary\":{\"en\":\"Binance said Saturday it has replenished 90 percent of the assets stolen in a record-breaking $6.3 billion hack of its platform. Its chief executive said the exchange is covering the stolen funds directly and plans to cover the remaining 10 percent, which consists of less liquid tokens.\",\"zh-TW\":\"幣安（Binance）週六表示，平台遭破紀錄的63億美元駭客竊案後，已補回九成被盜資產。執行長表示，公司直接承擔補償，並計畫補足其餘一成；該部分屬於流動性較低的代幣，取得可能需要較長時間。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"加密貨幣交易所幣安（Binance）週六表示，平台遭63億美元駭客攻擊、被形容為破紀錄的加密貨幣竊案後，公司已能補回九成被盜資產。\\n發生了什麼事\\n駭客自幣安（Binance）客戶處竊取63億美元。週四，資金開始自幣安錢包流出，公司隨即暫停所有存款與提款。部分加密貨幣公司已凍結約30億美元與本案相關的資產。執行長表示，九成資金已補回，公司也計畫補足其餘一成。幣安直接承擔被盜資金的補償；其餘一成屬於流動性較低的代幣，公司表示取得可能需要較長時間。\\n為什麼重要\\n竊案規模高達63億美元，受害者是大型加密貨幣交易所的客戶，損失如何彌補成為核心問題。公司表明由自身直接承擔補償、而非讓客戶吸收損失，是其回應的關鍵。剩餘一成的組成同樣重要：因代幣流動性較低，公司自承取得需時，補償完成的進度未必與前九成相同。\\n來源異同\\n兩家媒體皆報導同一關鍵數字：幣安已補回或追回九成被盜資產。不過摘要中出現不同數字，即一成與30億美元：一成是幣安稱尚待補足的比例，約30億美元則是部分加密貨幣公司因本案凍結的金額，兩者衡量的並非同一件事，讀者不宜混為一談。\\n仍不確定\\n現有摘要未說明駭客的作案方式、其餘一成何時補齊，以及存款與提款是否已恢復。摘要可能遺漏背景、更新或更正，最新完整報導仍應以原媒體頁面為準。\"},\"sources\":[{\"name\":\"The Verge\",\"url\":\"https://www.theverge.com/tech/1024091/binance-ceo-90-percent-stolen-crypto\"},{\"name\":\"The Hill\",\"url\":\"https://thehill.com/policy/technology/6186304-binance-replenishes-ninety-percent-hack/\"}],\"disagreements\":{\"en\":\"Figures differ across outlets (e.g. 10 vs 3 in headlines/snippets).\",\"zh-TW\":\"不同媒體的數字有所不同（例如，標題/摘要中的數字為 10 比 3）。\"},\"trustScore\":60,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":15,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"tech\",\"live-ingest\",\"the-verge\",\"the-hill\"],\"glossary\":[{\"term\":{\"en\":\"Binance\",\"zh-TW\":\"幣安（Binance）\"},\"blurb\":{\"en\":\"Binance is the cryptocurrency exchange whose platform was hacked in this incident.\",\"zh-TW\":\"幣安（Binance）是本次平台遭駭的加密貨幣交易所。\"}},{\"term\":{\"en\":\"Less liquid tokens\",\"zh-TW\":\"流動性較低的代幣\"},\"blurb\":{\"en\":\"Less liquid tokens are the assets making up the remaining 10 percent that Binance says may take longer to acquire.\",\"zh-TW\":\"流動性較低的代幣構成尚待補足的一成資產，幣安（Binance）稱取得需時較久。\"}},{\"term\":{\"en\":\"The Verge\",\"zh-TW\":\"科技媒體（The Verge）\"},\"blurb\":{\"en\":\"The Verge is one of the two outlets reporting the replenishment claim in this cluster.\",\"zh-TW\":\"科技媒體（The Verge）是本組報導補償說法的兩家媒體之一。\"}},{\"term\":{\"en\":\"The Hill\",\"zh-TW\":\"國會山報（The Hill）\"},\"blurb\":{\"en\":\"The Hill is the other outlet reporting that Binance recovered 90 percent of the stolen assets.\",\"zh-TW\":\"國會山報（The Hill）是另一家報導幣安追回九成資產的媒體。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-tech-01-binance-ceo-says-90-perc/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property
