 unnamed sources, and it sits alongside serious allegations that remain unverified.\n\nWhat happened\nWIRED reported that, amid allegations of multiple affairs — including with a direct report and an alleged Chinese intelligence asset — the board's central concern was Huang's alleged lying, described by sources as a lack of candor. A separate New York Times item in the same cluster covers a different angle: Huang's daughter, described as a close ally, remains in a senior role at Nvidia. The snippets do not give a date for the resignation or quote Huang or Nvidia directly.\n\nWhy it matters\nThe report frames candor, not the affairs themselves, as the board's breaking point. Directors can survive a scandal, but they cannot govern a chief executive they believe is misleading them — and when trust at the top breaks, a resignation usually follows, whatever the official reason given.\n\nSources agree / disagree\nWIRED alone carries the central claim, based on unnamed sources; the New York Times item does not corroborate the lying allegation and covers a separate development. The affairs and the intelligence-asset allegation are reported as allegations, not established facts. Trust label: Single source — the central claim rests on WIRED's unnamed sources and is not corroborated by the second outlet.\n\nStill uncertain\nThe snippets contain no on-the-record response from Huang or Nvidia, no official reason for the resignation, and no independent confirmation of the affairs or the intelligence-asset claim. Treat every allegation here as unverified until named sources or official statements appear."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-ai-03-jensen-huang-s-lying-ala\",\"category\":\"ai\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-ai-03-jensen-huang-s-lying-ala.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Jensen Huang’s ‘Lying’ Alarmed Nvidia Board Ahead of His Resignation\",\"zh-TW\":\"相關封面圖：黃仁勳的「謊言」在辭職前震驚了英偉達董事會\"},\"publishedAt\":\"2026-11-20T19:52:21.000Z\",\"title\":{\"en\":\"Jensen Huang's Reported 'Lying' Alarmed Nvidia Board Ahead of His Resignation\",\"zh-TW\":\"黃仁勳（Jensen Huang）遭指對董事會不坦誠，辭職前已引發警覺\"},\"summary\":{\"en\":\"[Unconfirmed · Single source] Sources tell WIRED that Nvidia's board was alarmed by former CEO Jensen Huang's alleged 'lack of candor' before his resignation, amid allegations of multiple affairs, including with a direct report and an alleged Chinese intelligence asset. The board's central concern was candor, not the affairs themselves — but the claims remain unverified.\",\"zh-TW\":\"［未證實·單一來源］消息人士向《連線》（WIRED）透露，輝達（Nvidia）董事會在前執行長黃仁勳辭職前，已對他遭指控的「缺乏坦誠」感到警覺；背景是多起婚外情指控，包括與直屬下屬及一名據稱是中國情報人員的對象。董事會在意的核心是坦誠本身，但這些說法都未經證實。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"消息人士向《連線》透露，輝達董事會在前執行長黃仁勳辭職前最在意的問題，不是圍繞他的種種指控，而是董事們認為他「缺乏坦誠」。這項說法來自未具名消息人士，背景的嚴重指控也都未經證實。\\n發生了什麼事\\n《連線》報導，在多起婚外情指控的背景下——包括與直屬下屬及一名據稱是中國情報人員的對象——董事會的核心關切是黃仁勳遭指控的說謊，也就是消息人士所說的「缺乏坦誠」。同批《紐約時報》另一則報導角度不同：黃仁勳的女兒被形容為親近盟友，目前仍在輝達擔任高階職務。來源摘要未提供辭職日期，也未引述黃仁勳或輝達的直接說法。\\n為什麼重要\\n結論很直接：董事會的底線是坦誠，不是緋聞本身。董事可以撐過醜聞，卻無法與一個他們認為在誤導他們的執行長共事；高層信任一破，辭職往往隨之而來，無論官方給的理由是什麼。\\n來源異同\\n核心指控只有《連線》一家報導，依據是未具名消息人士；《紐約時報》那則並未佐證說謊指控，談的是另一件事。婚外情與情報人員指控都只是「指控」，不是已確認的事實。信任標籤：僅單一來源——核心說法仰賴《連線》未具名消息人士，第二家來源未佐證。\\n仍不確定\\n來源摘要沒有黃仁勳或輝達的正式回應、沒有官方辭職理由，婚外情與情報人員說法也無獨立證實；在具名消息或官方說法出現前，所有指控都應視為未證實。\"},\"sources\":[{\"name\":\"Wired AI\",\"url\":\"https://www.wired.com/story/jensen-huangs-lying-alarmed-nvidia-board-ahead-of-his-resignation/\"},{\"name\":\"NYT Economy\",\"url\":\"https://www.nytimes.com/live/2026/11/17/technology/nvidia-earnings-stock-price/jensen-huangs-daughter-a-close-ally-remains-in-a-senior-role-at-nvidia\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":22,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"ai\",\"live-ingest\",\"wired-ai\",\"nyt-economy\"],\"glossary\":[{\"term\":{\"en\":\"Jensen Huang\",\"zh-TW\":\"黃仁勳\"}
