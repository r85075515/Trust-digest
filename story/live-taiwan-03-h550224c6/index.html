ng on November 27, citing reports that students at a Sichuan school were photographed by a teacher gathering evidence and then punished for speaking the Sichuan dialect during break. The case drew public attention. Local officials later said they had ordered the school to abolish the improper rule immediately and had publicly criticized the teacher involved.\n\nWhy it matters\nBreak time is not class time, and punishing students for speaking a dialect polices language, not order. The swift official order to scrap the rule, paired with public criticism of the teacher, amounts to an admission that the rule could not stand — and that a school cannot draw the line on dialect use by itself.\n\nSources agree / disagree\nOnly one outlet, CNA, has covered the case so far, and its report cites other reporting rather than first-hand sourcing, so there is nothing to cross-check against. No numeric or name conflicts appear in the feed item.\n\nStill uncertain\nThe feed names neither the school nor the number of students punished, gives no detail on the form of punishment, and says nothing about when the rule was introduced or whether it has actually been abolished. Whether the teacher faces any penalty beyond public criticism is also unclear.\n\nTrust label: Single source — one outlet citing other reporting, no independent corroboration yet."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-03-h550224c6\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-taiwan-03-h550224c6.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 四川學生課間講四川話被罰  官方責令廢除不當校規\",\"zh-TW\":\"相關封面圖：四川學生課間講四川話被罰 官方責令廢除不當校規\"},\"publishedAt\":\"2026-11-27T03:29:49.000Z\",\"title\":{\"en\":\"Sichuan Students Punished for Speaking Sichuan Dialect Between Classes as Officials Order School Rule Scrapped\",\"zh-TW\":\"四川學生課間講四川話被罰：官方責令廢除不當校規\"},\"summary\":{\"en\":\"[Unconfirmed · Single source] Students at a school in Sichuan, China, were photographed by a teacher and punished for speaking the Sichuan dialect during break, drawing public attention. Local officials later ordered the school to scrap the improper rule at once and publicly criticized the teacher involved. The report names neither the school nor the number of students punished.\",\"zh-TW\":\"［未證實·單一來源］中國四川一所學校的學生在課間休息講四川話，遭老師拍照蒐證並處罰，引發外界關注。當地官方其後通報，責令學校立即廢止不當規定，並對涉事教師通報批評。報導未具名學校與受罰學生人數。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"中國四川一所學校的學生在課間休息講四川話，遭老師拍照蒐證並處罰，當地官方其後責令學校廢止這項不當規定。\\n\\n發生了什麼事\\n中央社（CNA）記者張謙（Zhang Qian）11 月 27 日自香港發稿引述報導，四川一所學校有學生在課間休息期間講四川話，遭老師拍照蒐證並處罰，事件引發外界關注。當地官方其後通報，責令學校立即廢止不當規定，並對涉事教師通報批評。\\n\\n為什麼重要\\n課間休息本就不在課堂教學範圍，以方言為由拍照蒐證、處罰學生，管的是語言，不是秩序。官方迅速責令廢規、通報批評教師，等於承認這條校規站不住腳——方言使用權的界線，學校不能自行劃。\\n\\n來源異同\\n目前僅中央社（CNA）一家報導，且為引述報導的二手消息，無其他來源可比對。無數字或人名衝突。\\n\\n仍不確定\\n來源沒有具名學校、沒有說明處罰形式與受罰學生人數，也沒有說明校規何時訂立、是否確實已經廢止。涉事教師除通報批評外是否還有其他處分，同樣不明。\\n\\n信任標籤：僅 1 源——單一媒體引述報導，尚無其他來源印證。\"},\"sources\":[{\"name\":\"中央社-兩岸\",\"url\":\"https://www.cna.com.tw/news/acn/202611270056.aspx\"}],\"disagreements\":null,\"trustScore\":59,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"中央社-兩岸\"],\"glossary\":[{\"blurb\":{\"en\":\"Taiwan's national news agency and the sole source for this story.\",\"zh-TW\":\"台灣的國家通訊社，本篇報導的唯一來源。\"},\"term\":{\"en\":\"CNA\",\"zh-TW\":\"中央社\"}},{\"blurb\":{\"en\":\"CNA correspondent reporting from Hong Kong.\",\"zh-TW\":\"中央社記者，自香港發稿。\"},\"term\":{\"en\":\"Zhang Qian\",\"zh-TW\":\"張謙\"}},{\"blurb\":{\"en\":\"The Chinese dialect spoken across southwest China.\",\"zh-TW\":\"中國西南地區通行的漢語方言。\"},\"term\":{\"en\":\"Sichuan dialect\",\"zh-TW\":\"四川話\"}},{\"blurb\":{\"en\":\"A formal public reprimand issued by officials.\",\"zh-TW\":\"官方公開點名批評的處分形式。\"},\"term\":{\"en\":\"Public criticism\",\"zh-TW\":\"通報批評\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-
