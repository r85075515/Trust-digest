ocess node is now ready for customer chip design following the release of version 0.9 of its Process Design Kit (PDK) and design ecosystem tools, as detailed at its 2026 Europe Open Innovation Platform (OIP) Ecosystem Workshop in Munich. According to TSMC, A14 introduces Boost Cells and Low-Power Cells, delivering either a 14% performance uplift at the same power or a 23% power reduction at the same speed compared with its N2P node. TSMC is targeting late 2027 for A14 risk production ahead of subsequent high-volume manufacturing.\n\n為什麼重要\nReleasing the v0.9 PDK marks a critical engineering milestone that allows leading AI accelerator, smartphone SoC, and high-performance computing customers to begin physical layout and silicon tape-out planning for sub-2nm chips.\n\n來源異同\nTom's Hardware, DIGITIMES, and MLQ.ai all consistently report the availability of the A14 v0.9 PDK for customer design-in, the 14% performance gain or 23% power reduction relative to N2P, and the late-2027 risk production schedule.\n\n仍不確定\nWhich flagship customers will secure the initial A14 wafer capacity in 2027–2028 and whether backside power delivery will be introduced on the baseline A14 variant or reserved for a subsequent A14P derivative remain to be confirmed.\n\nTrust label: Multi-source agreement — PDK availability, performance-power metrics against N2P, and risk production timeline match across Tom's Hardware, DIGITIMES, and MLQ.ai."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-137-tsmc-a14-node-ready-for-chip-design\",\"category\":\"semiconductor\",\"title\":{\"en\":\"TSMC Opens 1.4nm-Class A14 Node to Chip Design With v0.9 PDK, Promising 14% Speed Boost\",\"zh-TW\":\"台積電 1.4 奈米級 A14 製程開放客戶晶片設計 推出 0.9 版設計套件並預告效能提升 14%\"},\"summary\":{\"en\":\"TSMC announced that its next-generation 1.4nm-class A14 process technology is ready for customer chip design following the release of its version 0.9 process design kit (PDK). TSMC said A14 Boost Cells deliver a 14% speed uplift or 23% power reduction over N2P ahead of late-2027 risk production. 一句重點結論：台積電宣布 1.4 奈米級 A14 製程 0.9 版設計套件就緒並正式開放客戶設計導入，效能較 N2P 提升 14%。\",\"zh-TW\":\"台積電（TSMC）宣布次世代 1.4 奈米級 A14 製程技術已可供客戶進行晶片設計，推出 0.9 版製程設計套件（PDK）。A14 相較 N2P 製程可帶來 14% 速度提升或 23% 功耗降低，目標 2027 年底邁入風險試產。一句重點結論：台積電宣布 1.4 奈米級 A14 製程 0.9 版設計套件就緒並開放客戶設計導入，效能較 N2P 提升 14%。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n晶圓代工龍頭台積電（TSMC）於 2026 年歐洲開放創新平台（OIP）生態系論壇上宣布，旗下次世代 1.4 奈米級 A14 製程的 0.9 版製程設計套件（PDK）與設計生態系已完成就緒，正式開放客戶啟動晶片設計導入（design-in）。台積電指出，A14 導入新型 Boost Cells 與低功耗標準單元，相較於 N2P 製程，在相同功耗下可提供 14% 運算速度提升，或在相同速度下降低 23% 功耗，並預計於 2027 年底進入風險試產階段。\\n\\n「為什麼重要」\\n0.9 版 PDK 釋出代表製程電性模型與設計規則已趨於成熟，使全球人工智慧加速器、旗艦手機系統單晶片（SoC）與高效能運算客戶得以展開實體電路布局，確保台積電在 2 奈米世代後的先進製程領先地位。\\n\\n「來源異同」\\n科技媒體 Tom's Hardware、電子時報（DIGITIMES）與財經資訊平台 MLQ.ai 對 A14 釋出 0.9 版 PDK、相較 N2P 提升 14% 速度或降低 23% 功耗，以及 2027 年底風險試產等關鍵數據報導完全一致，無任何分歧。\\n\\n「仍不確定」\\n首批採用 A14 製程投片的指標客戶名單，以及晶背供電網路（BSPDN）究竟會納入首波 A14 標準版或留待後續強化版製程才導入，目前尚待台積電進一步揭露。\"},\"glossary\":[{\"term\":{\"en\":\"Process Design Kit (PDK)\",\"zh-TW\":\"製程設計套件（PDK）\"},\"blurb\":{\"en\":\"A comprehensive set of data files, device models, and design rules provided by a foundry so chip designers can simulate and lay out circuits for a specific manufacturing node.\",\"zh-TW\":\"晶圓代工廠提供給晶片設計公司的核心資料包，內含電晶體模型、設計規則與驗證檔案，供工程師進行電路模擬與實體布局。\"}},{\"term\":{\"en\":\"A14 process node\",\"zh-TW\":\"A14 製程節點\"},\"blurb\":{\"en\":\"TSMC's 1.4-nanometer-class semiconductor manufacturing technology succeeding the 2nm (N2/N2P) family.\",\"zh-TW\":\"台積電繼 2 奈米（N2 與 N2P）家族之後推出的 1.4 奈米級（14 埃米）次世代先進邏輯製程技術。\"}},{\"term\":{\"en\":\"Risk production\",\"zh-TW\":\"風險試產\"},\"blurb\":{\"en\":\"Initial wafer fabrication runs used to verify yield, reliability, and manufacturing stability before committing to full-scale commercial volume production.\",\"zh-TW\":\"晶圓廠在正式邁入大規模商業量產前進行的早期試產階段，用以驗證製程良率、元件可靠度與產線穩定性。\"}}],\"sources\":[{\"name\":\"Tom's Hardware\",\"url\":\"https://www.tomshardware.com/tech-industry/semiconductors/tsmcs-a14-1-4nm-class-node-is-ready-for-chip-design-boost-cells-promise-14-percent-performance-uplift-or-23-percent-power-cut-over-n2p\"},{\"name\":\"DIGITIMES\",\"url\":\"https://www.digitimes.com/news/a20261127VL211/tsmc-ic-design-production-capacity.html\"},{\"name\":\"MLQ.ai\",\"url\":\"https://mlq.ai/news/tsmc-opens-its-14nm-a14-node-to-chip-designs-promising-14-more-speed/\"}],\"imageUrl\":\"/covers/live/live-semiconductor-137-tsmc-a14-node-ready-for-chip-design.jpg\",\"imageAlt\":{\"en\":\"Advanced semiconductor wafer fabrication cleanroom\",\"zh-TW\":\"先進半導體晶圓製造無塵室設備\"},\"isHeadline\":false,\"isPopular\":true,\"trustScore\":92,\"trustBreakdown\":{\"crossCorroboration\":24,\"outletReputation\":24,\"recencyClarity\":23,\"sourceDiversity\":21},\"publishedAt\":\"2026-11-27T16:45:11.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":5,\"D2\":5,\"D3\":4,\"D4\":5,\"D5\":4,\"total\":23},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-semiconductor-137-tsmc-a14-node-ready-for-chip-design/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-semiconductor-
