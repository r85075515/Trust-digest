siness reports the same timeline, with production ending around mid-next year.\nWhy it matters\nThe decision marks a clear change of priorities: Tesla is giving up on pickups to bet on robotics and AI, the areas Musk now calls the company's future. For investors, the test is whether the Cybercab can generate the volume and revenue the Cybertruck never delivered.\nSources agree / disagree\nBBC Business and The Guardian Business agree on the core facts: production winds down around the middle of next year and the Texas factory switches to the Cybercab. MarketWatch's item in the same cluster covers a different Musk story — a possible big SpaceX acquisition — and says nothing about the Cybertruck. Trust label: Two-source agreement — BBC Business and The Guardian Business agree on the Cybertruck wind-down; the MarketWatch item covers a separate story.\nStill uncertain\nThe snippets do not give Cybertruck sales figures, how many workers the Texas factory change affects, or a firm date for the last Cybertruck. They also do not say when Cybercab production reaches volume. Verify the figures in the full reporting before quoting them."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-01-tesla-to-wind-down-cyber\",\"category\":\"finance\",\"adult\":false,\"isHeadline\":true,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-finance-01-tesla-to-wind-down-cyber.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Tesla to Wind Down Cybertruck Production to Make Room for Cybercab\",\"zh-TW\":\"相關封面圖：特斯拉（Tesla）將逐步停產 Cybertruck，德州廠房改產無人計程車 Cybercab\"},\"publishedAt\":\"2026-11-06T21:49:50.000Z\",\"title\":{\"en\":\"Tesla to Wind Down Cybertruck Production to Make Room for Cybercab\",\"zh-TW\":\"特斯拉（Tesla）將逐步停產 Cybertruck，德州廠房改產無人計程車 Cybercab\"},\"summary\":{\"en\":\"Tesla will wind down Cybertruck production around the middle of next year, Elon Musk has announced, freeing its Texas factory for the Cybercab, the company's driverless taxi. The move ends Tesla's failed bid for a share of the lucrative US pickup market as Musk shifts focus to robotics and AI. Watch whether Cybercab production fills the gap.\",\"zh-TW\":\"特斯拉（Tesla）執行長馬斯克（Elon Musk）宣布，Cybertruck 將於明年年中左右停產，德州廠房將改產無人計程車 Cybercab。這等於宣告特斯拉搶攻美國高利潤皮卡市場的嘗試失敗，馬斯克正把重心轉向機器人與人工智慧。接下來看 Cybercab 能否補上產能缺口。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"特斯拉（Tesla）執行長馬斯克（Elon Musk）宣布將逐步停產 Cybertruck，結束搶攻美國高利潤皮卡市場的失敗嘗試。生產將於明年年中左右停止，德州廠房將改產無人駕駛計程車 Cybercab。\\n發生了什麼事\\n馬斯克表示，停產是為了騰出產能生產 Cybercab。Cybertruck 曾被定位為特斯拉打進美國最賺錢車款市場的敲門磚，但始終沒有站穩腳步，BBC 形容這次停產就是該車款的終點。衛報商業版（The Guardian Business）的報導時程一致，生產將於明年年中左右結束。\\n為什麼重要\\n這項決定顯示特斯拉的優先順序已經改變：放棄皮卡，押注機器人與人工智慧，也就是馬斯克現在所說的公司未來。對投資人來說，考驗在於 Cybercab 能否帶來 Cybertruck 從未達成的產量與營收。\\n來源異同\\nBBC 商業版與衛報商業版對核心事實的報導一致：生產於明年年中左右逐步停產，德州廠房改產 Cybercab。同一批來源中的 MarketWatch 報導的是另一則馬斯克消息——SpaceX 可能進行大規模收購，與 Cybertruck 無關。信任標籤：雙源一致——BBC 商業版與衛報商業版對 Cybertruck 停產的報導一致，MarketWatch 那則是另一則消息。\\n仍不確定\\n來源摘要沒有 Cybertruck 的銷售數字，也沒有說明德州廠房轉產影響多少員工，或最後一輛 Cybertruck 的確切下線日期。摘要也沒有說 Cybercab 何時能量產。引用數字前請查閱完整報導。\"},\"sources\":[{\"name\":\"MarketWatch\",\"url\":\"https://www.marketwatch.com/story/elon-musk-opens-the-door-for-a-big-spacex-acquisition-4f62bcad?mod=mw_rss_topstories\"},{\"name\":\"BBC Business\",\"url\":\"https://www.bbc.co.uk/news/articles/cq1j33w7d232o?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"The Guardian Business\",\"url\":\"https://www.theguardian.com/technology/2026/nov/06/tesla-to-wind-down-cybertruck-production-as-elon-musk-focuses-on-robotics-and-ai\"}],\"disagreements\":null,\"trustScore\":85,\"trustBreakdown\":{\"sourceDiversity\":20,\"outletReputation\":18,\"crossCorroboration\":22,\"recencyClarity\":25},\"tags\":[\"finance\",\"live-ingest\",\"marketwatch\",\"bbc-business\",\"the-guardian-business\"],\"glossary\":[{\"term\":{\"en\":\"Elon Musk\",\"zh-TW\":\"馬斯克\"},\"blurb\":{\"en\":\"Chief executive of Tesla and SpaceX, who announced the Cybertruck wind-down.\",\"zh-TW\":\"宣布 Cybertruck 停產的特斯拉與 SpaceX 執行長。\"}},{\"term\":{\"
