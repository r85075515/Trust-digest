ssible press secretary replacement. Only the rally appearance is confirmed on stage; the job talk is, for now, just talk.\nWhat happened\nAccording to The Hill, White House staffers floated Minaj as a press secretary replacement. Separately, BBC World reported that Minaj joined Trump onstage at a Michigan rally, where she told him it was an honor to stand with him and that she would support him if he runs again. In a lengthy Truth Social post on Sunday, Trump also confirmed he is considering moving the White House press corps from its briefing room, while denying he ever intended to build a swimming pool there. TMZ covered the rally with a headline about Trump’s onstage compliment to Minaj, which this digest does not repeat.\nWhy it matters\nThe judgment here is simple: do not mistake campaign theater for a personnel announcement. Minaj is a globally famous rapper lending star power to a tight Michigan Senate race ahead of the November midterms, and the press secretary chatter reads as part of that show. What matters for readers is the signal it sends about how this campaign courts attention, not a vacancy that has been filled.\nSources agree / disagree\nThis cluster stitches together distinct threads — the press secretary float, the Michigan rally, the press corps move and an Axios item about Israeli Prime Minister Benjamin Netanyahu pressing Trump for support ahead of Tuesday’s election — rather than one event covered several ways. The ingest note about figures differing (3 versus 50) cannot be matched to a single metric in the snippets, so this digest does not use those numbers. Trust label: Accounts differ — the cluster mixes several threads, and no single event is fully corroborated.\nStill uncertain\nNothing in the snippets confirms that Minaj was formally offered anything, that the press secretary post is vacant, or that the press corps will actually move. All three remain staff chatter and presidential musing, not decisions."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-entertainment-01-nicki-minaj-floated-as-p\",\"category\":\"entertainment\",\"adult\":false,\"isHeadline\":true,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-entertainment-01-nicki-minaj-floated-as-p.png\",\"imageAlt\":{\"en\":\"Cover related to: Nicki Minaj Floated As Press Secretary Replacement By White House Staffers\",\"zh-TW\":\"相關封面圖：妮琪·米娜 (Nicki Minaj) 被白宮工作人員接替為新聞秘書\"},\"publishedAt\":\"2026-10-26T02:52:18.000Z\",\"title\":{\"en\":\"Nicki Minaj Floated as Press Secretary Pick by White House Staffers\",\"zh-TW\":\"妮琪·米娜（Nicki Minaj）傳被白宮幕僚點名接任發言人\"},\"summary\":{\"en\":\"Rapper Nicki Minaj joined Donald Trump at a Michigan rally on Sunday and told him she would support him if he runs again, after White House staffers floated her as a press secretary replacement. Trump confirmed he is considering moving the White House press corps from the briefing room. The takeaway: what happened was star campaigning, not a staffing decision.\",\"zh-TW\":\"美國饒舌歌手妮琪·米娜（Nicki Minaj）週日（25 日）在密西根州造勢場合登台挺川普，並說若他再選就會支持他；此前白宮幕僚曾點名她接任發言人。結論是：真正發生的是明星站台，不是人事任命；同批另有川普考慮搬遷白宮記者團的消息，不再展開。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"標題很好寫，人事案卻不是這麼回事：饒舌歌手妮琪·米娜（Nicki Minaj）週日（25 日）現身川普（Donald Trump）在密西根州的造勢場合，而白宮幕僚則點名她接任發言人。登台是真的，人事任命目前只是傳聞。\\n發生了什麼事\\n據 The Hill 報導，白宮幕僚點名米娜接任發言人。另據 BBC 報導，米娜在密西根州造勢場合登台，表示能與川普同台是榮幸，若他再選就會支持他。川普週日（25 日）在 Truth Social 長文也證實，他正在考慮把白宮記者團移出簡報室，同時否認曾打算在簡報室蓋游泳池。TMZ 以川普在造勢場合對米娜外貌的評論為題，本卡不引述其用詞。\\n為什麼重要\\n判斷很簡單：不要把競選秀場誤讀成人事宣布。米娜是全球知名的饒舌歌手，為選情緊繃的密西根州參議員選戰站台造勢，發言人傳聞更像是這場秀的一部分。對讀者而言，重點是這場選戰如何博取關注，而不是哪個職位已經補上人。\\n來源異同\\n這批素材拼湊了不同線索——發言人點名、密西根造勢、記者團搬遷，以及 Axios 報導以色列總理納坦雅胡（Benjamin Netanyahu）為週二選舉向川普爭取支持——而不是同一事件的多家報導。原始素材標註的數字差異（3 與 50）在片段中無法對齊同一指標，本卡不採用。信任標籤：敘述有分歧——素材混雜多條線索，單一事件未獲完整印證。\\n仍不確定\\n片段沒有證實米娜獲得正式邀約、發言人職位出缺，或記者團真的會搬遷。三者目前都只是幕僚傳聞與總統的想法，不是決定。\"},\"sources\":[{\"name\":\"The Hill\",\"url\":\"https://thehill.com/homenews/administration/6171484-donald-trump-considering-moving-white-house-press-corps/\"},{\"na
