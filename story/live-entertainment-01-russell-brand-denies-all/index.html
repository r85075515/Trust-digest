e sexual activity with women. He said the claims had a devastating impact on his life.\nWhat happened\nBrand, 51, told the court he had been obsessed with sex as a younger man and had misused his position very selfishly, dedicating his life to reckless philandering and idiocy. He said he was wrong to have used his fame and success to facilitate sexual activity with women, and that consent is more important than sex itself. The entertainer was giving evidence at his trial on charges including rape and assault, which he denies.\nWhy it matters\nThe testimony matters because Brand supplied the trial's most quoted lines himself: an admission about how he used his fame, paired with a flat denial of every charge. That pairing puts his credibility and his account of consent at the center of the case, rather than leaving the court to weigh only other witnesses.\nSources agree / disagree\nPBS NewsHour, BBC Entertainment, CBS News Crime, and The Guardian all covered the same Wednesday testimony, with consistent quotes and no conflicting facts. Their headlines emphasize different lines from the stand: the denial of all charges, consent as fundamental, and the admission about using fame. Trust label: Multi-source agreement — four outlets report the same testimony with consistent quotes and no conflicting facts.\nStill uncertain\nThe short feed snippets do not give the number of charges, the dates or details of the allegations, or what happens next in the trial. Those details must be verified in the full reporting before quoting specifics; the allegations remain denied."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-entertainment-01-russell-brand-denies-all\",\"category\":\"entertainment\",\"adult\":false,\"isHeadline\":true,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-entertainment-01-russell-brand-denies-all.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Russell Brand denies all charges as he testifies at his rape and sex assault trial\",\"zh-TW\":\"相關封面圖：拉塞爾布蘭德在強姦和性侵犯審判中作證時否認所有指控\"},\"publishedAt\":\"2026-10-28T23:35:56.000Z\",\"title\":{\"en\":\"Russell Brand Denies All Charges as He Testifies at Rape and Sexual Assault Trial\",\"zh-TW\":\"拉塞爾·布蘭德（Russell Brand）在強姦與性侵犯審判作證，否認所有指控\"},\"summary\":{\"en\":\"British actor-comedian Russell Brand, 51, told a London court on Wednesday that he had misused his fame and success to facilitate sexual activity with women, but denied all charges of rape and sexual assault. He said consent mattered more than sex itself and that the claims had devastated his life. The trial now turns on his own testimony.\",\"zh-TW\":\"英國演員兼喜劇演員布蘭德（Russell Brand）週三在倫敦法庭作證，承認年輕時沉迷於性，也承認曾自私地利用名氣促成與女性的性行為，但否認所有強姦與性侵犯指控。他說，同意比性本身更重要，而這些指控毀了他的生活。接下來看：法庭如何看待他的證詞。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"英國演員兼喜劇演員布蘭德（Russell Brand）週三在倫敦出庭作證，否認所有強姦與性侵犯指控，同時承認曾利用自己的名氣與成功促成與女性的性行為。他說，這些指控對他的生活造成毀滅性影響。\\n發生了什麼事\\n51 歲的布蘭德在法庭上說，年輕時曾沉迷於性，非常自私地濫用了自己的地位，把一生奉獻給魯莽的花心與愚蠢行徑。他說，利用名氣與成功促成與女性的性行為是錯的，同意比性本身更重要。他是在強姦與攻擊等指控的審判中出庭作證，他否認這些指控。\\n為什麼重要\\n這段證詞之所以關鍵，在於布蘭德自己說出了審判中最受引用的話：一邊承認如何利用名氣，一邊全盤否認每一項指控。這讓他的可信度與他對「同意」的說法，成為案件的核心，而不是只靠其他證人的說法來判斷。\\n來源異同\\n公共電視新聞一小時（PBS NewsHour）、英國廣播公司娛樂版（BBC Entertainment）、哥倫比亞廣播公司新聞犯罪版（CBS News Crime）與《衛報》（The Guardian）四家都報導了同一天的證詞，引言一致，沒有事實衝突。各家標題強調證詞的不同句子：否認所有指控、同意是根本、以及利用名氣的認錯。信任標籤：N源一致——四家媒體報導同一天證詞，引言一致，無事實衝突。\\n仍不確定\\n簡短的摘要沒有交代指控的數量、日期與細節，也沒有說明審判接下來的程序。引用細節前請查閱完整報導；相關指控目前仍遭否認。\"},\"sources\":[{\"name\":\"PBS NewsHour\",\"url\":\"https://www.pbs.org/newshour/world/russell-brand-denies-all-charges-as-he-testifies-at-his-rape-and-sex-assault-trial\"},{\"name\":\"BBC Entertainment\",\"url\":\"https://www.bbc.co.uk/news/articles/cmvgxl5kdgrzo?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"CBS News Crime\",\"url\":\"https://www.cbsnews.com/news/russell-brand-takes-stand-rape-sexual-assault-trial-london/\"},{\"name\":\"The Guardian UK News\",\"url\":\"https://www.theguardian.com/uk-news/2026/oct/28/russell-brand-trial-testimony\"}],\"disagreements\":null,\"tru
