l is listed at $179.99 shipped, down from $200 and $230 in the feed text, and the report presents these as the lowest prices yet, timed for Christmas gifting. The same feed bundle also carries Roborock cleaning-device deals, with savings of up to $1,650.\n\nWhat happened\nThe headline deal is the Alexa Photo Frame, a smart photo frame Amazon launched in late October. 9to5Toys reports $50 markdowns across the range and describes them as the first deals spotted since launch. The Walnut colourway is listed at $179.99 shipped. The feed text also lists Roborock's Black Friday sale on robot and wet/dry vacuums, with deals starting from $190, the biggest saving attached to the brand's 2026 flagship, the Saros 20, and the sale running through Cyber Monday.\n\nWhy it matters\nFor shoppers, the frame's first discount sets the opening price for a product barely a month old, and the timing lands just before Christmas gifting. The Roborock side of the bundle shows the same event offering the year's best prices on premium cleaning hardware, with the flagship carrying the headline saving. Together they illustrate how Black Friday pricing now spans smart-home displays and high-end appliances in a single promotion window.\n\nSources agree-disagree\nOnly one outlet, 9to5Toys, sits behind both items in this cluster, so there is no second source to confirm either price. The two items are separate deals bundled into one feed cluster, not two reports of the same event, and the figures attached to each belong to different products.\n\nStill uncertain\nThe feed text does not reconcile the $150 starting point in the headline with the $179.99 Walnut listing or the $200 and $230 prices cited alongside it, so the exact model and size behind each price is unclear. Stock levels, the precise end of the frame discount, and whether the $50 saving applies to every colour remain unconfirmed. Check the linked listing before buying.\n\nTrust label: Single source (bundled cluster) — two separate deals from a single outlet are grouped in one cluster, and the prices have no independent confirmation."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-shopping-01-amazon-s-new-alexa-photo\",\"category\":\"shopping\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-shopping-01-amazon-s-new-alexa-photo.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Amazon’s new Alexa Photo Frame gets $50 Black Friday savings to new lows from $150\",\"zh-TW\":\"相關封面圖：亞馬遜新款 Alexa 相框黑色星期五優惠從 150 美元降至 50 美元新低\"},\"publishedAt\":\"2026-11-20T00:00:00.000Z\",\"title\":{\"en\":\"Amazon's New Alexa Photo Frame Gets First $50 Black Friday Discount From $150\",\"zh-TW\":\"亞馬遜（Amazon）新款 Alexa 相框黑色星期五首降50美元，基準價150美元\"},\"summary\":{\"en\":\"[Unconfirmed · Single source] Amazon's new Alexa Photo Frame, launched in late October, gets its first discount for Black Friday: $50 off from $150, with a Walnut model listed at $179.99 shipped. The same feed bundle also lists Roborock cleaners with savings up to $1,650. Takeaway: early deals, but check the listing before buying.\",\"zh-TW\":\"［未證實·單一來源］亞馬遜（Amazon）10月底才上市的新款 Alexa 相框迎來首次降價，黑色星期五直降50美元，標題基準價150美元，胡桃木配色款到手價179.99美元。同批另有掃地機器人品牌 Roborock 最高省1,650美元的清倉價。結論：首波折扣已現，下單前先核對商品頁規格與售價。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"亞馬遜（Amazon）10月底才上市的新款 Alexa 相框迎來首次降價：黑色星期五直降50美元，標題基準價150美元；胡桃木配色款到手價179.99美元，摘要稱較200美元與230美元下調，報導稱這是上市以來首見折扣，適合當作聖誕禮物。同批另有掃地機器人品牌 Roborock 的黑色星期五特價，最高省1,650美元。\\n\\n發生了什麼事\\n主角是亞馬遜新款 Alexa 相框，10月底才上市。9to5Toys 報導全系列降價50美元，稱這是上市以來首見折扣。胡桃木配色款到手價179.99美元。同一批摘要另列 Roborock 清潔設備黑色星期五特價：機器人與乾濕兩用吸塵器優惠從190美元起跳，最大折扣落在2026年旗艦機種 Saros 20，活動持續到網路星期一（Cyber Monday）。\\n\\n為什麼重要\\n一台上市不到一個月的產品出現首波折扣，等於替聖誕採購季定下開盤價。Roborock 那一側顯示同一檔期也把高階清潔家電推到年度低點，旗艦機種的折扣幅度最大。兩者合起來說明黑色星期五的折扣戰線已經橫跨智慧家庭顯示器與高階家電。\\n\\n來源異同\\n這批內容只來自一家媒體 9to5Toys，兩則消息是不同商品的各自折扣，被併進同一個摘要，並非兩家媒體對同一事件的報導，彼此價格沒有互相佐證的效果。\\n\\n仍不確定\\n摘要沒有說明標題的150美元基準價，與179.99美元胡桃木款、200美元與230美元之間的對應關係，各價格對應的尺寸與配色不明。庫存、相框折扣的確切截止時間、50美元折扣是否適用全部配色，都未經證實，下單前以商品頁為準。\\n\\n信任標籤：單一來源（同批多則）——兩項優惠出自同一媒體、被歸在同一批消息中，價格沒有獨立佐證。\"},\"sources\":[{\"name\":\"9to5Toys\",\"url\":\"https://9to5toys.com/2026/11/19/roborocks-robot-and-wet-dry-cleaners-are-getting-up-to-1650-savings-for-black-friday-deals-start-from-190/\"}],\"disagreements\":null,\"trustScore\":47,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":10,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"shopping\",\"live-ingest\",\"9to5toys\",\"9to5toys\"],\"glossary\":[{\"blurb\":{\"en\":\"Amazon's smart photo frame, launched in late October 2026.\",\"zh-TW\":\"亞馬遜10月底上市的智慧相框。\"},\"term\":{\"en\":\"Alexa Photo Frame\",\"zh-TW\":\"Alexa 相框\"}},{\"blurb\":{\"en\":\"US e-commerce and technology company behind the Alexa Photo Frame.\",\"zh-TW\":\"Alexa 相框背後的美國電商與科技公司。\"},\"term\":{\"en\":\"Amazon\",\"zh-TW\":\"亞馬遜（Amazon）\"}},{\"blurb\":{\"en\":\"Annual US shopping event following Thanksgiving, known for deep discounts.\",\"zh-TW\":\"美國感恩節後的年度購物檔期，以大幅折扣聞名。\"},\"term\":{\"en\":\"Black Friday\",\"zh-TW\":\"黑色星期五\"}},{\"blurb\":{\"en\":\"Chinese maker of robot vacuums and wet/dry cleaners.\",\"zh-TW\":\"生產掃地機器人與乾濕兩用吸塵器的中國品牌。\"},\"term\":{\"en\":\"Roborock\",\"zh-TW\":\"Roborock\"}},{\"blurb\":{\"en\":\"Roborock's 2026 flagship robot vacuum.\",\"zh-TW\":\"Roborock 2026年旗艦掃地機器人。\"},\"term\":{\"en\":\"Saros 20\",\"zh-TW\":\"Saros 20\"}},{\"blurb\":{\"en\":\"Online shopping day following the Black Friday weekend.\",\"zh-TW\":\"黑色星期五週末後的線上購物日。\"},\"term\":{\"en\":\"Cyber Monday\",\"zh-TW\":\"網路星期一（Cyber Monday）\"}},{\"blurb\":{\"en\":\"US deals and shopping news site.\",\"zh-TW\":\"美國折扣與購物新聞網站。\"},\"term\":{\"en\":\"9to5Toys\",\"zh-TW\":\"9to5Toys\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\
