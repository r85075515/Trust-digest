with about 820 units, combines hotels, short-term rental apartments, tutoring centres and residences. Firefighters brought the blaze under control in about two hours and rescue operations ended at 8:30 p.m. A total of 38 people were taken to hospital; five deaths were confirmed by late Sunday, and Xinhua reported on Monday that the toll had risen to 14, with 25 people still in hospital, nine of them seriously injured.\nWhy it matters\nFourteen deaths in a single residential tower is among China's deadliest building fires in recent years, and the building type is the story: a two-decade-old mixed-use high-rise where hotel guests, cram-school students and residents share the same fire systems. Whether the official investigation stops at the ignition source or extends to alarms, annex conversions and management will decide whether this remains a local tragedy or becomes a national building-safety reckoning.\nSources agree / disagree\nReuters, People and multiple regional outlets agree on the timeline, the hospitalisation count and the rising toll; the casualty figures originate with Xinhua and local authorities. Trust label: Multi-source agreement — reporting aligns, with casualty figures sourced to Xinhua and the Taiyuan authorities.\nStill uncertain\nThe cause of the fire has not been announced, the victims have not been identified, and Taiwanese media carried witness accounts that smoke alarms did not sound — not confirmed by officials. Whether anyone is held responsible, and whether the nine seriously injured survive, remains open."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-02-taiyuan-fire-kills-14\",\"category\":\"international\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"The Howard Johnson (Haosheng) International Apartment tower in Taiyuan, where a fire killed 14 people.\",\"zh-TW\":\"山西太原豪生國際公寓大樓，火災造成 14 人死亡。\"},\"publishedAt\":\"2026-11-09T16:00:53.000Z\",\"title\":{\"en\":\"Taiyuan Tower Fire Kills 14 as Death Toll Rises Overnight\",\"zh-TW\":\"太原高樓大火死亡升至 14 人，38 人送醫\"},\"summary\":{\"en\":\"A fire tore through a 40-storey mixed-use tower in downtown Taiyuan, Shanxi, on Sunday evening, sending 38 people to hospital; the death toll rose to 14 by Monday, with 25 people still hospitalised and nine seriously injured, Xinhua said via Reuters. The cause is under investigation. The open question is whether alarms and building management failed — the mixed-use tower is a fixture of Chinese cities.\",\"zh-TW\":\"中國山西太原一棟 40 層住商混合大樓週日傍晚起火，火勢約兩小時撲滅，38 人送醫，死亡人數週一升至 14 人，另有 25 人留院、9 人重傷，新華社經路透社（Reuters）報導。起火原因仍在調查；接下來要看官方調查是否觸及消防警報與建物管理——這類塞滿旅館、補習班與住戶的住商混合高樓，在中國城市裡到處都是。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"中國山西省會太原一棟高樓公寓週日起火，官方新華社週一表示死亡人數至少 14 人，路透社（Reuters）報導。\\n發生了什麼事\\n火災發生在週日下午 4 點 59 分，地點是太原市迎澤區市中心主要幹道旁的豪生國際公寓（Howard Johnson International Apartment），一棟約 40 層的住商混合大樓。官媒報導，火勢疑似從附屬建物 4 樓起火，延燒到設有旅館的 8、9 樓。這棟大樓 2007 年完工、約 820 戶，裡面有旅館、短租公寓、補習班與一般住戶。消防約兩小時控制火勢，晚間 8 點半結束搜救。共有 38 人送醫，週日晚間先確認 5 人死亡，新華社週一更新為 14 人死亡，另有 25 人留院、其中 9 人重傷。\\n為什麼重要\\n單一住宅大樓 14 人死亡，是中國近年最嚴重的建築火災之一，而真正的問題在建物型態：一棟用了近 20 年的住商混合高樓，旅館客、補習班學生和住戶共用同一套消防系統。官方調查如果只停在起火點，就是地方事故；若查到警報、附屬建物改裝與管理責任，就會變成全國性的建物安全清算。\\n來源異同\\n路透社、People 與多家區域媒體對時間軸、送醫人數與死亡人數上升的過程說法一致；死傷數字源頭為新華社與太原官方。信任標籤：多源一致。\\n仍不確定\\n起火原因尚未公布，罹難者身分未公開；台灣媒體轉述目擊者說法稱火災警報器似乎沒有響，官方尚未證實。9 名重傷者能否存活、是否有人被究責，都還沒有答案。\"},\"sources\":[{\"name\":\"SRN News (Reuters)\",\"url\":\"https://srnnews.com/apartment-building-fire-in-northern-china-kills-14/\"},{\"name\":\"Devdiscourse (Reuters)\",\"url\":\"https://www.devdiscourse.com/article/international/4003816-building-fire-kills-14-in-chinas-northern-city-of-taiyuan\"},{\"name\":\"People\",\"url\":\"https://people.com/at-least-14-dead-after-fire-rips-through-high-rise-apartment-block-12244397\"},{\"name\":\"BusinessToday\",\"url\":\"https://www.businesstoday.com.my/2026/11/09/14-killed-38-hospitalised-in-high-rise-building-fire-in-northern-china/\"}],\"disagreements\":null,\"trustScore\":74,\"trustBreakdown\":{\"sourceDiversity\":17,\"outletReputation\":17,\"crossCorroboration\":18,\"recencyClarity\":22},\"tags\":[\"international\",\"live-ingest\",\"breaking\",\"reuters\",\"china\"],\"glossary\":[{\"term\":{\"en\":\"Taiyuan\",\"zh-TW\":\"太原\"},\"blurb\":{\"en\":\"Capital of China's northern Shanxi province, where the tower fire broke out.\",\"zh-TW\":\"中國山西省省會，本次高樓火災發生地。\"}},{\"term\":{\"en\":\"Haosheng International Apartment\",\"zh-TW\":\"豪生國際公寓\"},\"blurb\":{\"en\":\"The roughly 40-storey mixed-use tower in Yingze District that caught fire; completed in 2007 with about 820 units.\",\"zh-TW\":\"位於迎澤區、約 40 層的住商混合大樓，2007 年完工、約 820 戶，本次起火建物。\"}},{\"term\":{\"en\":\"Xinhua\",\"zh-TW\":\"新華社\"},\"blurb\":{\"en\":\"China's official state news agency, the primary source for the casualty figures.\",\"zh-TW\":\"中國官方通訊社，本次死傷數字的主要來源。\"}},{\"term\":{\"en\":\"Mixed-use building\",\"zh-TW\":\"住商混合大樓\"},\"blurb\":{\"en\":\"A single property combining residences with hotels, rentals and businesses — here including tutoring centres.\",\"zh-TW\":\"同一棟樓混合住宅、旅館、短租與商業用途的建物，本案還包括補習班。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-international-02-taiyuan-fire-kills-14/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, di
