accompanying her. LINE TODAY carried a report on the circulating video and Pan's reaction on hearing about her former partner again.\nWhat happened\nSETN's headline refers to past cheating allegations involving Chang that are circulating again, and says Pan's breakup history has been dug up again. The same report says Pan loosened up about her current situation, saying someone is accompanying her. A separate LINE TODAY item, from Videoland Entertainment News, focuses on the circulating video of the couple's falling-out and Pan's reaction when asked about Chang again. The snippets do not reproduce Pan's full remarks or the video itself.\nWhy it matters\nThe judgment is about timing: a resurfaced video lets an old breakup speak louder than Pan's present, unless she answers it herself. By addressing her current love life, Pan tries to move the story from the past relationship to the present. The takeaway is that, for public figures, old footage can reopen a closed chapter at any moment.\nSources agree / disagree\nSETN and LINE TODAY agree that the old breakup story and video are circulating again and that Pan addressed her current situation, with no conflicting facts in the snippets. Trust label: Two-source agreement — two outlets agree on the core claims. Both items are short headlines and summaries; neither reproduces Pan's remarks or verifies the allegations in the circulating material.\nStill uncertain\nThe snippets do not show what Pan actually said beyond the headline reference to companionship, what the video shows, or whether the cheating allegations were ever substantiated. The reaction described in the LINE TODAY headline is not detailed in the snippet. Verify Pan's remarks and the video's contents in the full reporting."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-eastAsiaGossip-03-line-today\",\"category\":\"eastAsiaGossip\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"publishedAt\":\"2026-10-30T10:04:45.000Z\",\"title\":{\"en\":\"Pan Hui-ju: Old Breakup With Chang Hsiao-chuan Resurfaces as She Addresses Her Love Life\",\"zh-TW\":\"潘慧如（Pan Hui-ju）：與張孝全（Chang Hsiao-chuan）舊情重提，談感情現況\"},\"summary\":{\"en\":\"Taiwanese actress Pan Hui-ju (潘慧如), covered by SETN and LINE TODAY, saw her past breakup with actor Chang Hsiao-chuan (張孝全) resurface as an old video circulated online. She addressed her current love life, saying someone is accompanying her, SETN reported. The renewed attention shows old headlines still shape how she is seen.\",\"zh-TW\":\"台灣女演員潘慧如（Pan Hui-ju，SETN 與 LINE TODAY 報導），與演員張孝全（Chang Hsiao-chuan）的舊分手往事隨影片瘋傳再度被挖出。她鬆口談感情現況，表示有人陪伴，三立新聞網報導。舊聞重提，仍在形塑外界對她的看法。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"潘慧如（Pan Hui-ju）與張孝全（Chang Hsiao-chuan）分手的舊影片瘋傳，過去的感情往事再度被挖出，潘慧如已對此作出回應。三立新聞網報導，潘慧如鬆口談感情現況，表示有人陪伴。LINE TODAY 刊載緯來娛樂新聞的報導，聚焦瘋傳影片與潘慧如再聞舊情郎時的反應。\\n發生了什麼事\\n三立新聞網的標題提及張孝全昔日劈腿舊事遭瘋傳，指潘慧如分手往事被挖出。同一報導表示，潘慧如鬆口談感情現況，說有人陪伴。LINE TODAY 的另一則報導聚焦兩人撕破臉影片瘋傳，以及潘慧如再聞舊情郎時的反應。摘要片段沒有完整引述潘慧如的發言，也沒有影片本身的內容。\\n為什麼重要\\n判斷在於時機：舊影片重現，讓過去的分手比潘慧如的現在更大聲，除非她親自回應。她談及目前感情現況，是把故事從過去的關係拉回現在。教訓是，對公眾人物而言，舊畫面隨時可能重新打開已經翻過的一頁。\\n來源異同\\n三立新聞網與 LINE TODAY 對舊分手往事與影片再度流傳、潘慧如談及現況的說法一致，摘要片段沒有事實衝突。信任標籤：兩源一致——兩家媒體對核心主張的報導一致。兩則都是簡短標題與摘要，沒有完整引述潘慧如的發言，也沒有核實流傳內容中的指控。\\n仍不確定\\n摘要片段沒有呈現潘慧如的實際說法，只在標題提及有人陪伴，也沒有影片內容，劈腿指控是否獲得證實同樣不明。LINE TODAY 標題提到的反應，在摘要中沒有細節。引用潘慧如發言與影片內容前，請查閱完整報導。\"},\"sources\":[{\"name\":\"setn.com\",\"url\":\"https://news.google.com/rss/articles/CBMiSkFVX3lxTE8zUkJXV1V4LThSWVE3UUZoM2lLT2lQR0ljNWpGR2V0YkFQdVZuUUluWi00YXBFYlQ3SHpRMWRBblJjYjhWUFRjZk9n0gFfQVVfeXFMUEEtVlVqQWFLYi1nRTZGT05WX1JxTEc5b2ZUcmFMcGpzWF9vR2RXUnNPeUU2ejRra0UwSVpqNDNSb19ibzZsLXk4UFFNOFg2Y1RfSENxY0owbDRGOENBS3M?oc=5\"},{\"name\":\"today.line.me\",\"url\":\"https://news.google.com/rss/articles/CBMiVkFVX3lxTE5RTUxyaVJuSnBDSDNhOW81RUpvdDJpa1BZdFRqdVR4MjR5RUxKYTJjNkhfbWtmS0lqN2E0NEpnb2lFbHdtcDMyM0hMOTVVWTFtYVRzOG9n?oc=5\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":16,\"crossC
