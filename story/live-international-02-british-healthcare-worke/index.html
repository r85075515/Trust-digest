describe the same person and the same evacuation, with no conflicting facts.\nWhy it matters\nThe verdict is reassuring but narrow: this is a single-patient medical evacuation, not an outbreak reaching the UK. The government's emphasis that the wider risk to the public remains low is the point that matters for readers — the system for moving a high-consequence case safely is being used as designed. The story to watch is the patient's condition on arrival, not a domestic spread.\nSources agree / disagree\nThe Guardian and the BBC agree on the evacuation, the stable condition, the specialist unit and the low public risk. Trust label: Two-source agreement — two established outlets agree on the core claims.\nStill uncertain\nNeither excerpt names the patient, the hospital, or the timing of the flight, and the source of the infection is not stated. Those details are appropriately withheld for a single patient, but they limit what can be verified; follow the Guardian and BBC updates for the patient's condition."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-02-british-healthcare-worke\",\"category\":\"international\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-international-02-british-healthcare-worke.jpg\",\"imageAlt\":{\"en\":\"Cover related to: British healthcare worker with Ebola evacuated from DR Congo to UK\",\"zh-TW\":\"相關封面圖：感染伊波拉病毒的英國醫護人員從剛果民主共和國撤離到英國\"},\"publishedAt\":\"2026-11-04T18:34:19.000Z\",\"title\":{\"en\":\"British Healthcare Worker With Ebola Evacuated From DR Congo to UK\",\"zh-TW\":\"英國醫護染伊波拉（Ebola），自剛果民主共和國撤離回英國\"},\"summary\":{\"en\":\"A British healthcare worker who tested positive for Ebola in the Democratic Republic of the Congo is being evacuated to the UK for treatment. The patient is in stable condition and will go to a specialist high-consequence infectious disease unit. The takeaway: a contained medical evacuation, with the wider risk to the UK public still low.\",\"zh-TW\":\"英國一名醫護人員在剛果民主共和國確診感染伊波拉（Ebola），正撤離回英國接受治療，患者情況穩定，將轉入專門收治高風險傳染病的病房。結論是：這是一次受控的醫療撤離，病毒對英國公眾的整體風險仍然很低。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"一名感染伊波拉（Ebola）的英國醫護人員正自剛果民主共和國撤離回英國接受治療，情況穩定，英國政府已證實此事。\\n發生了什麼事\\n《衛報》與 BBC 都報導了這次撤離。英國政府發言人表示，一名目前在剛果民主共和國的英國公民伊波拉病毒檢測呈陽性，患者將轉入英國專門收治「高風險」傳染病的病房。BBC 的標題稱患者為在剛果民主共和國感染伊波拉、將搭機返英的英國男子；兩家報導描述的是同一人、同一趟撤離，沒有事實衝突。\\n為什麼重要\\n結論令人安心，但範圍有限：這是一名患者的醫療撤離，不是疫情蔓延到英國。政府強調病毒對公眾的整體風險仍然很低，才是對讀者重要的重點——安全轉運高風險病例的機制正按設計運作。接下來要看的是患者抵達後的情況，不是本土擴散。\\n來源異同\\n《衛報》與 BBC 對撤離、情況穩定、專門病房與公眾風險很低的報導一致。信任標籤：兩源一致——兩家主流媒體對核心主張的報導一致。\\n仍不確定\\n兩則摘要都沒有透露患者姓名、收治醫院或班機時間，也沒有說明感染來源。對單一患者而言，這些資訊不公開是合理的，但也限制了可驗證的內容；患者情況請追蹤《衛報》與 BBC 的後續報導。\"},\"sources\":[{\"name\":\"The Guardian World\",\"url\":\"https://www.theguardian.com/world/2026/nov/04/british-healthcare-worker-ebola-evacuated-drc-to-uk-document-shows\"},{\"name\":\"BBC UK\",\"url\":\"https://www.bbc.co.uk/news/articles/crq8nj7xqdv9o?at_medium=RSS\u0026at_campaign=rss\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":19,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"international\",\"live-ingest\",\"the-guardian-world\",\"bbc-uk\"],\"glossary\":[{\"term\":{\"en\":\"Ebola\",\"zh-TW\":\"伊波拉病毒\"},\"blurb\":{\"en\":\"Deadly virus the patient tested positive for in DR Congo.\",\"zh-TW\":\"患者在剛果民主共和國確診感染的致命病毒。\"}},{\"term\":{\"en\":\"DR Congo\",\"zh-TW\":\"剛果民主共和國\"},\"blurb\":{\"en\":\"Democratic Republic of the Congo, where the patient was infected.\",\"zh-TW\":\"剛果民主共和國，患者感染病毒的地點。\"}},{\"term\":{\"en\":\"The Guardian\",\"zh-TW\":\"衛報\"},\"blurb\":{\"en\":\"British newspaper that reported the evacuation.\",\"zh-TW\":\"報導這次撤離的英國報紙。\"}},{\"term\":{\"en\":\"BBC\",\"zh-TW\":\"英國廣播公司\"},\"blurb\":{\"en\":\"British broadcaster that also reported the evacuation.\",\"zh-TW\":\"同樣報導這次撤離的英國廣播公司。\"}},{\"term\":{\"en\":\"UK government\",\"zh-TW\":\"英國政府\"},\"blurb\":{\"en\":\"Government that confirmed the case and said pub
