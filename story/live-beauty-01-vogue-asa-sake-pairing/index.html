 chicken and its new autumn dishes.\n\nWhy it matters\nPairing sake with yakitori is a judgment call about fat, smoke, and acidity, and a champion sommelier's list is the reason to pay attention: the three styles span light and traditional poles, so the menu reads as a guided tasting rather than a single bottle pushed at every course.\n\nSources agree / disagree\nThis card rests on a single Vogue Taiwan feature. No second outlet corroborates the menu in this cluster, and no prices or dates beyond the autumn season appear in the excerpt.\n\nStill uncertain\nThe excerpt names no individual sake labels, no prices, and no end date for the autumn menu. Diners should confirm availability and pricing with the restaurant before visiting.\n\nTrust label: Single source"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-beauty-01-vogue-asa-sake-pairing\",\"category\":\"beauty\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-beauty-01-vogue-asa-sake-pairing.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Vogue吃什麼｜舌尖上的風土交會，台北鳥喜攜手ASa黃鳳誼打造秋季限定Sake Pairing\",\"zh-TW\":\"相關封面圖：Vogue吃什麼｜舌尖上的風土交會，台北鳥喜攜手ASa黃鳳誼打造秋季限定Sake Pairing\"},\"publishedAt\":\"2026-11-03T02:30:00.000Z\",\"title\":{\"en\":\"ASa Huang Pairs Sake with Taipei Yakitori for Autumn\",\"zh-TW\":\"黃鳳誼（ASa）攜手台北鳥喜推秋季清酒餐搭\"},\"summary\":{\"en\":\"[Unconfirmed · Single source] Taipei yakitori restaurant Toriki has teamed up with ASa Huang, the first Taiwanese World Sake Sommelier Competition winner, for a sake pairing built around Zhiyu Jinjing chicken and seasonal dishes. Three sakes, from light junmai daiginjo to traditional yamahai junmai, frame the charcoal aroma and richness of grilled skewers. Book ahead if the menu tempts you.\",\"zh-TW\":\"［未證實·單一來源］台北鳥喜今年秋季攜手首位世界唎酒師大賽總冠軍台灣女性黃鳳誼（ASa），以獨家「脂玉金璟雞」與秋季新菜推出專屬清酒餐搭。三款日本酒從淡麗純米大吟釀到傳統山廢純米酒，襯托燒鳥炭香與油脂。想嚐秋日餐酒搭配，可留意秋季限定檔期。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"發生了什麼事\\n台北鳥喜今年秋季攜手首位世界唎酒師大賽總冠軍台灣女性黃鳳誼（ASa），以獨家「脂玉金璟雞」與秋季新菜推出專屬清酒餐搭。三款精選日本酒從淡麗純米大吟釀到傳統山廢純米酒，精準襯托燒鳥的炭香與油脂，帶來兼具優雅與質感的秋日餐酒體驗。\\n\\n為什麼重要\\n燒鳥餐搭考驗的是油脂、炭香與酸度的拿捏，冠軍唎酒師開出的酒單就是看點：三款酒從淡麗到傳統兩端拉開跨度，整套菜單像一場有導覽的品飲，而不是同一瓶酒從頭倒到尾。\\n\\n來源異同\\n本卡只有《Vogue Taiwan》一篇專題，沒有第二家媒體佐證菜單，摘要也未提及價格與秋季檔期之外的日期。\\n\\n仍不確定\\n摘要未列出三款酒的個別酒標、價格，也沒有秋季菜單的結束日期。用餐前請先向餐廳確認供應與價格。\"},\"sources\":[{\"name\":\"Vogue Taiwan\",\"url\":\"https://www.vogue.com.tw/article/鳥喜-sake-pairing\"}],\"disagreements\":null,\"trustScore\":47,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":10,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"beauty\",\"live-ingest\",\"vogue-taiwan\"],\"glossary\":[{\"blurb\":{\"en\":\"Taiwanese sake sommelier, the first Taiwanese woman to win the World Sake Sommelier Competition.\",\"zh-TW\":\"台灣唎酒師，首位獲得世界唎酒師大賽總冠軍的台灣女性。\"},\"term\":{\"en\":\"ASa Huang\",\"zh-TW\":\"黃鳳誼\"}},{\"blurb\":{\"en\":\"A Taipei yakitori restaurant offering the autumn sake pairing.\",\"zh-TW\":\"台北燒鳥餐廳，推出本次秋季清酒餐搭。\"},\"term\":{\"en\":\"Toriki\",\"zh-TW\":\"鳥喜\"}},{\"blurb\":{\"en\":\"An international competition for sake sommeliers.\",\"zh-TW\":\"唎酒師的國際競賽。\"},\"term\":{\"en\":\"World Sake Sommelier Competition\",\"zh-TW\":\"世界唎酒師大賽\"}},{\"blurb\":{\"en\":\"A premium sake style featured at the light end of the pairing.\",\"zh-TW\":\"高階清酒種類，屬於本次餐搭中較淡麗的一端。\"},\"term\":{\"en\":\"Junmai Daiginjo\",\"zh-TW\":\"純米大吟釀\"}},{\"blurb\":{\"en\":\"A traditional sake style featured at the traditional end of the pairing.\",\"zh-TW\":\"傳統釀造清酒種類，屬於本次餐搭中較傳統的一端。\"},\"term\":{\"en\":\"Yamahai Junmai\",\"zh-TW\":\"山廢純米酒\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news diges
