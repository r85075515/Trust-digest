nitor, days after his arrest over alleged possession of child sexual abuse material. A federal judge ordered him held, and his mugshot was released after the second arrest, according to TMZ.\nWhat happened\nUS authorities arrested Thomas Markle Sr. after saying he kept child sexual abuse material in storage units in California. Days later, he was back in federal custody after allegedly removing the electronic monitoring device from his ankle, and a federal judge ordered him jailed without bond. One feed snippet describes him as placed under house detention in Florida last week after being charged; the fuller reports from the BBC, CBS News, the LA Times and The Guardian describe the jailing without bond following the monitor incident.\nWhy it matters\nThe judgment is blunt: the monitor allegation turned a charged case into a custody case, and the involvement of five major outlets makes the sequence of arrest, monitor removal and jailing the best-attested part of the story. All of the underlying conduct remains alleged, not proven.\nSources agree / disagree\nBBC World, CBS News, the LA Times, The Guardian and TMZ agree on the core facts — the 82-year-old's arrest, the alleged cutting of the ankle monitor, and the order jailing him without bond. Trust label: Multi-source agreement — five outlets, same core account. The snippets do not fully reconcile the Florida house-detention mention with the jailing timeline, so that detail stays open.\nStill uncertain\nNo formal charges beyond the arrest have been spelled out in the snippets, no hearing date is given, and the exact timeline between the Florida detention and the jailing is unclear. The material itself is described only in general terms, and every allegation remains unproven until tested in court."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-entertainment-02-meghan-markle-s-dad-thom\",\"category\":\"entertainment\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-entertainment-02-meghan-markle-s-dad-thom.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Meghan Markle's Dad Thomas' Mugshot Released After Second Arrest\",\"zh-TW\":\"相關封面圖：梅根馬克爾的父親托馬斯第二次被捕後照片被釋放\"},\"publishedAt\":\"2026-11-11T01:35:43.000Z\",\"title\":{\"en\":\"Thomas Markle Jailed Without Bond After Allegedly Cutting Ankle Monitor\",\"zh-TW\":\"湯瑪斯·馬克爾（Thomas Markle）涉剪斷腳踝監測器後遭羈押，不得保釋\"},\"summary\":{\"en\":\"Thomas Markle, the estranged father of Meghan Markle, the Duchess of Sussex, was jailed without bond after allegedly cutting off his court-ordered ankle monitor, days after his arrest over alleged possession of child sexual abuse material. A federal judge ordered him held; watch for formal charges and a hearing.\",\"zh-TW\":\"薩塞克斯公爵夫人梅根·馬克爾（Meghan Markle）的疏遠父親湯瑪斯·馬克爾（Thomas Markle），因涉嫌持有兒童性虐待影像被捕數日後，又涉嫌剪斷法院下令配戴的腳踝監測器，遭聯邦法官下令羈押、不得保釋。接下來看檢方是否正式起訴與開庭進度。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"薩塞克斯公爵夫人梅根·馬克爾（Meghan Markle）82 歲的疏遠父親湯瑪斯·馬克爾（Thomas Markle），因涉嫌持有兒童性虐待影像被捕數日後，又涉嫌剪斷法院下令配戴的腳踝監測器，遭聯邦法官下令羈押、不得保釋。TMZ 報導，他第二次被捕後的大頭照已經公開。\\n發生了什麼事\\n美國當局稱，湯瑪斯·馬克爾（Thomas Markle Sr.）在加州的儲藏室存放兒童性虐待影像，隨後將他逮捕。數日後，他涉嫌拆除腳踝上的電子監測裝置，再度被聯邦拘留，聯邦法官下令將他羈押、不得保釋。一則來源摘要提到，他上週被起訴後在佛羅里達州接受居家監禁；BBC、CBS 新聞、《洛杉磯時報》與《衛報》的較完整報導，則描述他在監測器事件後遭羈押、不得保釋。\\n為什麼重要\\n結論很直接：監測器指控把一樁被起訴的案件變成了羈押案件，而五家主要媒體都報導了逮捕、拆除監測器、羈押這組順序，這是整件事中證據最充分的部分。但所有涉及的行為都只是指控，尚未被證實。\\n來源異同\\nBBC、《CBS 新聞》、《洛杉磯時報》、《衛報》與 TMZ 在核心事實上一致——82 歲的湯瑪斯涉嫌剪斷腳踝監測器，法官下令羈押、不得保釋。信任標籤：多源一致——五家媒體，核心說法相同。佛羅里達居家監禁與羈押的時間先後，來源摘要沒有完整交代，仍待釐清。\\n仍不確定\\n來源摘要沒有列出逮捕之外的正式罪名，也沒給開庭日期，佛羅里達監禁與羈押之間的確切時序也不清楚。涉案影像只被籠統描述，所有指控在法院審理前都未經證實。\"},\"sources\":[{\"name\":\"BBC World\",\"url\":\"https://www.bbc.co.uk/news/articles/c9j3433zy4vro?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"CBS News Crime\",\"url\":\"https://www.cbsnews.com/video/meghan-markles-father-back-in-custody-after-allegedly-cutting-his-ankle-monitor/\"},{\"name\":\"LA Times California\",\"url\":\"https://www.latimes.com/entertainment-arts/story/2026-11-10/thomas-markle-sr-cut-off-ankle-monitor-child-porn-arrest\"},{\"name\":\"The Guardian UK News\",\"url\":\"https://www.theguardian.com/us-news/2026/nov/10/thomas-markle-ankle-monitor\"},{\"name\":\"TMZ\",\"url\":\"https://www.tmz.com/2026/11/10/thomas-markle-mugshot-released/\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":25,\"outletReputation\":19,\"crossCorroboration\":25,\"recencyClarity\":25},\"tags\":[\"entertainment\",\"live-ingest\",\"bbc-world\",\"cbs-news-crime\",\"la-times-california\"],\"glossary\":[{\"term\":{\"en\":\"Thomas Markle\",\"zh-TW\":\"湯瑪斯·馬克爾\"},\"blurb\":{\"en\":\"82-year-old estranged father of Meghan Markle, the Duchess of Sussex.\",\"zh-TW\":\"薩塞克斯公爵夫人梅根·馬克爾 82 歲的疏遠父親。\"}},{\"term\":{\"en\":\"Meghan Markle\",\"zh-TW\":\"梅根·馬克爾\"},\"blurb\":{\"en\":\"Duchess of Sussex, whose estranged father is Thomas Markle.\",\"zh-TW\":\"薩塞克斯公爵夫人，湯瑪斯·馬克爾的女兒。\"}},{\"term\":{\"en\":\"Ankle monitor\",\"zh-TW\":\"腳踝監測器\"},\"blurb\":{\"en\":\"Court-ordered electronic device tracking a defendant's location.\",\"zh-TW\":\"法院下令配戴、用來追蹤被告行蹤的電子裝置。\"}},{\"term\":{\"en\":\"Federal judge\",\"zh-TW\":\"聯邦法官\"},\"blurb\":{\"en\":\"US federal judge who ordered Thomas Markle jailed without bond.\",\"zh-TW\":\"下令將湯瑪斯·馬克爾羈押、不得保釋的美國聯邦法官。\"}},{\"term\":{\"en\":\"TMZ\",\"zh-TW\":\"TMZ\"},\"blurb\":{\"en\":\"US entertainment outlet that reported the mugshot release.\",\"zh-TW\":\"報導大頭照公開的美國娛樂媒體。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https:/
