Jensen Huang's reinstatement as Nvidia chief executive in the same interview.\n\nWhat happened\nTrump gave an interview to U.S. media in which he discussed Huang's return to Nvidia and praised Wei, calling the TSMC chairman an exceptional talent. He went further, saying TSMC will build a factory in Texas. The report, carried by CNA from Washington on November 23 and echoed by TechNews, gives no further detail on the timing, scale or location of the Texas plant.\n\nWhy it matters\nTSMC is the world's largest contract chipmaker and a linchpin of the global AI supply chain, so a presidential endorsement of its chairman carries weight. A Texas plant would deepen TSMC's U.S. footprint beyond its Arizona fabs, and Trump's remarks signal political backing for Taiwan's chip industry at a moment of intense U.S.-China technology competition.\n\nSources agree-disagree\nTechNews and CNA agree on the core facts: Trump praised Wei and said TSMC will build in Texas. Trust label: Two-source agreement — two Taiwanese outlets carry the same account of the interview, with no conflicting details in the feed snippets.\n\nStill uncertain\nThe feed summaries do not name the media outlet that interviewed Trump, quote his exact words, or give any detail on the Texas plant's timing, investment or location. Whether TSMC has committed to a Texas fab, or Trump was speaking aspirationally, remains unconfirmed."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"adult\":false,\"body\":{\"en\":\"$10\",\"zh-TW\":\"美國總統川普（Donald Trump）接受美媒訪問，稱讚台積電董事長魏哲家是傑出人才，並稱台積電將在德州建廠；這是中央社（CNA）11月23日自華盛頓發出的報導。川普在同一場訪問中也談到黃仁勳（Jensen Huang）復任輝達（Nvidia）執行長。\\n\\n發生了什麼事\\n川普接受美媒訪問，談到黃仁勳回任輝達執行長，也稱讚魏哲家是傑出人才，更進一步說台積電將在德州建廠。中央社11月23日自華盛頓發出這則報導，《科技新報》（TechNews）也刊載相同內容，但摘要未說明德州廠的時程、規模或地點。\\n\\n為什麼重要\\n台積電是全球最大晶圓代工廠，也是全球AI供應鏈的關鍵，總統公開肯定其董事長分量不輕。德州設廠將讓台積電在美國的布局超出亞利桑那廠區；川普的說法也顯示，在美中科技競爭激烈之際，美國政治上支持台灣晶片產業。\\n\\n來源異同\\n《科技新報》與中央社對核心事實一致：川普稱讚魏哲家、稱台積電將在德州建廠。信任標籤：雙源一致——兩家台灣媒體刊載同一場訪問的內容，摘要中沒有衝突細節。\\n\\n仍不確定\\n摘要未指明是哪家美媒訪問川普，也未引述原話，更未說明德州廠的時程、投資金額或地點。台積電是否已承諾在德州設廠，或川普只是表達期許，仍未獲證實。\"},\"category\":\"semiconductor\",\"disagreements\":null,\"glossary\":[{\"blurb\":{\"en\":\"U.S. president who praised TSMC chairman C.C. Wei in a media interview.\",\"zh-TW\":\"在受訪時稱讚台積電董事長魏哲家的美國總統。\"},\"term\":{\"en\":\"Donald Trump\",\"zh-TW\":\"川普（Donald Trump）\"}},{\"blurb\":{\"en\":\"Chairman of TSMC, praised by Trump as an exceptional talent.\",\"zh-TW\":\"台積電董事長，獲川普讚為傑出人才。\"},\"term\":{\"en\":\"C.C. Wei\",\"zh-TW\":\"魏哲家（C.C. Wei）\"}},{\"blurb\":{\"en\":\"Taiwan Semiconductor Manufacturing Company, the world's largest contract chipmaker.\",\"zh-TW\":\"全球最大晶圓代工廠。\"},\"term\":{\"en\":\"TSMC\",\"zh-TW\":\"台積電（TSMC）\"}},{\"blurb\":{\"en\":\"Nvidia chief executive, whose reinstatement Trump also discussed.\",\"zh-TW\":\"輝達執行長，川普在訪問中也談到他的復職。\"},\"term\":{\"en\":\"Jensen Huang\",\"zh-TW\":\"黃仁勳（Jensen Huang）\"}},{\"blurb\":{\"en\":\"AI chip giant led by Jensen Huang.\",\"zh-TW\":\"由黃仁勳領導的AI晶片巨頭。\"},\"term\":{\"en\":\"Nvidia\",\"zh-TW\":\"輝達（Nvidia）\"}}],\"id\":\"live-semiconductor-02-h9c441154\",\"imageAlt\":{\"en\":\"Cover related to: 川普受訪讚魏哲家是傑出人才　稱台積電將在德州建廠\",\"zh-TW\":\"相關封面圖：川普受訪讚魏哲家是傑出人才　稱台積電將在德州建廠\"},\"imageUrl\":\"/covers/live/live-semiconductor-02-h9c441154.jpg\",\"isHeadline\":false,\"isPopular\":true,\"publishedAt\":\"2026-11-24T10:20:26.000Z\",\"sources\":[{\"name\":\"TechNews 科技新報\",\"url\":\"https://technews.tw/2026/11/24/trump-praises-cc-wei-exceptional-talent-tsmc-texas-factory-build/\"},{\"name\":\"中央社-國際\",\"url\":\"https://www.cna.com.tw/news/aopl/202611240244.aspx\"}],\"summary\":{\"en\":\"In a U.S. media interview reported November 23, President Donald Trump praised TSMC chairman C.C. Wei as an exceptional talent and said TSMC will build a plant in Texas, while also discussing Jensen Huang's reinstatement at Nvidia. The remarks signal warm U.S. support for Taiwan's chip leaders. Watch whether TSMC confirms the Texas plan.\",\"zh-TW\":\"美國總統川普（Donald Trump）接受美媒訪問，談到輝達（Nvi
