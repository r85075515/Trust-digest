nAccording to GeneOnline, Lance Biotech's sunscreen lotion has completed a product information update in the National Library of Medicine's DailyMed database. Related coverage from the same outlet notes a DailyMed listing for the company's sunscreen spray as well, and frames the update as improving market transparency for the products.\nWhy it matters\nA DailyMed listing is the unglamorous paperwork behind selling a regulated product in the US: it makes the official product information publicly searchable. For a smaller biotech firm, completing the update is a step toward operating transparently in the American market rather than a product launch in itself.\nSources agree / disagree\nThis is a single-outlet story: all three items in the cluster come from GeneOnline, and no second outlet has covered it in this batch. Trust label: Single source — one outlet, with no second source in the cluster.\nStill uncertain\nThe summary is truncated at \"Read More,\" so the product details, the timing of the update and any market plans are not in the material at hand. The full GeneOnline piece is needed before more can be said."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-biotech-01-dailymed\",\"category\":\"biotech\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-biotech-01-dailymed.png\",\"imageAlt\":{\"en\":\"Cover related to: 蘭斯生物科技防曬乳液完成美國DailyMed資料庫產品資訊更新\",\"zh-TW\":\"相關封面圖：蘭斯生物科技防曬乳液完成美國DailyMed資料庫產品資訊更新\"},\"publishedAt\":\"2026-11-14T03:21:50.000Z\",\"title\":{\"en\":\"Lance Biotech Sunscreen Lotion Completes US DailyMed Listing Update\",\"zh-TW\":\"蘭斯生技防曬乳液完成美國 DailyMed 產品資訊更新\"},\"summary\":{\"en\":\"Lance Biotech has updated the product information for its sunscreen lotion in the US National Library of Medicine's DailyMed database, GeneOnline reports. A related listing covers its sunscreen spray. Takeaway: a routine regulatory filing that raises the product's market transparency.\",\"zh-TW\":\"蘭斯生物科技的防曬乳液已完成美國國家醫學圖書館 DailyMed 資料庫的產品資訊更新，基因線上（GeneOnline）報導；同系列防曬噴霧也有相關登錄。結論：這是一筆例行法規登錄，提高了產品的市場透明度。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"蘭斯生物科技的防曬乳液已完成美國國家醫學圖書館（NLM）旗下 DailyMed 資料庫的產品資訊更新，基因線上（GeneOnline）報導。這次更新讓該產品的官方標示資訊正式登錄美國資料庫。\\n發生了什麼事\\n根據基因線上報導，蘭斯生物科技防曬乳液已完成美國國家醫學圖書館 DailyMed 資料庫的產品資訊更新。同一媒體的相關報導還提到，該公司防曬噴霧也有 DailyMed 登錄，並將這次更新定位為提升產品的市場透明度。\\n為什麼重要\\nDailyMed 登錄是受管制產品在美國銷售背後不起眼的文書工作：它讓官方產品資訊可以公開查詢。對規模較小的生技公司而言，完成更新是朝著在美國市場透明營運邁出的一步，本身並非產品上市。\\n來源異同\\n本批三則內容皆出自基因線上，未見第二家媒體報導。信任標籤：僅1源——僅一家媒體報導，未見第二家佐證。\\n仍不確定\\n摘要在「Read More」處截斷，產品細節、更新時間與市場計畫都不在現有材料中；要進一步說明須讀基因線上全文。\"},\"sources\":[{\"name\":\"基因線上 GeneOnline\",\"url\":\"https://geneonline.news/%E8%98%AD%E6%96%AF%E7%94%9F%E7%89%A9%E7%A7%91%E6%8A%80%E9%98%B2%E6%9B%AC%E4%B9%B3%E6%B6%B2%E5%AE%8C%E6%88%90%E7%BE%8E%E5%9C%8Bdailymed%E8%B3%87%E6%96%99%E5%BA%AB%E7%94%A2%E5%93%81%E8%B3%87%E8%A8%8A/\"}],\"disagreements\":null,\"trustScore\":42,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":10,\"crossCorroboration\":6,\"recencyClarity\":20},\"tags\":[\"biotech\",\"live-ingest\",\"基因線上-geneonline\",\"基因線上-geneonline\",\"基因線上-geneonline\"],\"glossary\":[{\"term\":{\"en\":\"Lance Biotech\",\"zh-TW\":\"蘭斯生物科技\"},\"blurb\":{\"en\":\"Biotech company behind the sunscreen lotion and spray.\",\"zh-TW\":\"防曬乳液與噴霧的生技公司。\"}},{\"term\":{\"en\":\"DailyMed\",\"zh-TW\":\"DailyMed\"},\"blurb\":{\"en\":\"US National Library of Medicine database of official drug product information.\",\"zh-TW\":\"美國國家醫學圖書館的官方藥品產品資訊資料庫。\"}},{\"term\":{\"en\":\"National Library of Medicine\",\"zh-TW\":\"美國國家醫學圖書館\"},\"blurb\":{\"en\":\"US institution that runs the DailyMed database.\",\"zh-TW\":\"營運 DailyMed 資料庫的美國機構。\"}},{\"term\":{\"en\":\"GeneOnline\",\"zh-TW\":\"基因線上\"},\"blurb\":{\"en\":\"Biotech news outlet that reported the DailyMed update.\",\"zh-TW\":\"報導 DailyMed 更新的生技新聞媒體。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"vie
