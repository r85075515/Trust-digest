e \"didn't even spare mutual friends.\" The same cluster bundles three unrelated gossip items: Chang Hsiu-ching's \"Spicy Girl 2.0\" concert in Tainan, Hou Yen-hsi's post-Golden-Bell-nomination breakup, and a 41-year-old actress admitting she divorced three years ago.\nWhat happened\nPer the Mirror Media headline, the ex-girlfriend went public with the breakup details, accusing the influencer of serial cheating across 17 women. Separately, ETtoday reports that Golden Melody queen Chang Hsiu-ching staged her Tainan concert with guests Chang Yun-jing, Lee Tzu-sen, and Lo Shih-feng, plus a surprise appearance by Tsai Hsiao-hu, who apologized on stage to his rumored girlfriend Lung Chien-yu for missing her concert. SETN reports that Golden Bell nominee Hou Yen-hsi confirmed he and his girlfriend are no longer in contact.\nWhy it matters\nThe verdict is about the format, not the people: celebrity-cheating exposés trade on unverified ex-partner testimony, and this card mashes four of them together. Read the influencer story as an allegation, not a finding — and read the concert and breakup items as the ordinary churn of Taiwan's entertainment news cycle.\nSources agree / disagree\nEach item comes from a single outlet — the cheating allegation solely from Mirror Media, the concert from ETtoday, the Hou breakup from SETN — so there is no cross-outlet corroboration for any of them. The auto-flagged \"30 vs 90\" figure conflict compares numbers from different stories (30 years of rumors vs. 900K followers), not a real factual dispute. Trust label: Bundled stories + each single-sourced — four unrelated single-source stories bundled; the figure flag is a clustering artifact.\nStill uncertain\nNo names, evidence, or responses from the accused appear in the feed snippets. Verify everything in the full articles before quoting."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-eastAsiaGossip-02-90-17-mirror-media\",\"category\":\"eastAsiaGossip\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-eastAsiaGossip-02-90-17-mirror-media.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 90萬網紅被控劈腿17女「爽吃人妻」　前女友崩潰揭分手內幕：連共同朋友都不放過 - 鏡週刊Mirror Media\",\"zh-TW\":\"相關封面圖：90萬網紅被控劈腿17女「爽吃人妻」　前女友崩潰揭分手內幕：連共同朋友都不放過 - 鏡週刊Mirror Media\"},\"publishedAt\":\"2026-10-10T13:05:00.000Z\",\"title\":{\"en\":\"Mirror Media: 900K-Follower Influencer Accused of Cheating on 17 Women\",\"zh-TW\":\"鏡週刊：90萬網紅被控劈腿17女，前女友揭分手內幕\"},\"summary\":{\"en\":\"Mirror Media reports a 900,000-follower influencer is accused of cheating on 17 women, with his ex-girlfriend detailing the breakup. The cluster also bundles unrelated items: Chang Hsiu-ching's Tainan concert, Hou Yen-hsi's breakup, and a divorce confession. Each item is single-sourced, with no cross-outlet corroboration in the cluster.\",\"zh-TW\":\"鏡週刊報導一名90萬追蹤的網紅被控劈腿17名女性，前女友出面細數分手內幕。同批抓取的另有無關新聞：張秀卿台南演唱會、侯彥西認分手、女藝人坦承離婚3年。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"鏡週刊報導，一名擁有90萬追蹤的網紅被控劈腿17名女性、連人妻都不放過，前女友崩潰揭露分手內幕，直指他「連共同朋友都不放過」。同批抓取的另有三條無關八卦：張秀卿台南「辣妹駕到2.0」演唱會、侯彥西入圍金鐘後認分手、一名41歲女藝人坦承離婚3年。\\n發生了什麼事\\n鏡週刊標題指出，前女友公開細數分手經過，指控該網紅連續劈腿17女。另一條 ETtoday 報導，金曲歌后張秀卿在台南開唱，嘉賓包括張芸京、李子森、羅時豐，歌王蔡小虎驚喜現身，並在台上向緋聞女友龍千玉道歉，坦承上次缺席她的演唱會。三立新聞網則報導，入圍金鐘的侯彥西親口證實與女友「沒聯絡了」。\\n為什麼重要\\n重點不在人物，在格式：明星劈腿爆料賣的是前任的單方面說法，而這張卡把四則湊在一起。網紅劈腿這條請當成「指控」來讀，不是定論；演唱會和分手那幾條，就是台灣娛樂新聞的日常流水。\\n來源異同\\n每條新聞都只有單一來源——劈腿指控只有鏡週刊，演唱會只有 ETtoday，侯彥西分手只有三立，彼此沒有交叉查證。系統標記的「30 對 90」數字差異，比的是不同故事裡的數字（30年緋聞 vs. 90萬追蹤），並非真正的事實衝突。信任標籤：混裝＋各自單一來源——四條無關的單一來源新聞被包在一起，數字標記只是抓取系統的誤判。\\n仍不確定\\n來源摘要沒有被指控者的姓名、證據或回應。引用前請查閱完整報導。\"},\"sources\":[{\"name\":\"ETtoday 影劇\",\"url\":\"https://star.ettoday.net/news/3252459\"},{\"name\":\"setn.com\",\"url\":\"https://news.google.com/rss/articles/CBMiSkFVX3lxTE0xbGV2dFZhV01GeWJnMVU0WGhsbndydmFHaXBUMkpXd1dQdmtPMUNsMC1lbWRuOEdKTTZWeWtMZzB6Q0ZDNk8xa0RR0gFfQVVfeXFMTUJkSmh4Ynhtb1g0LUQ1NHhpRUlzVHlYTzN5RS1HX0NFTF9wLWVmRjBZMDRVc2ktY0JfN1EyczYtUTg5OTBCcWt5RVA3Zllvcmxrdm1GVk5rU25pV1JhdnM?oc=5\"},{\"name\":\"mirror
