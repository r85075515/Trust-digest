ieve Huang is close to Huang Le, also known as Alice Huang, a former Megaspeed executive suspected of gathering intelligence for China. Liberty Times, tracing the couple's movements, reports the two took advantage of Huang's trips to Taiwan to meet. PTS has compiled the sources and timeline of the case, and Liberty Times has published its own timeline of the affair.\nWhy it matters\nThis is the thread that turns a CEO's affair into a national-security story. If the head of the world's leading AI chipmaker was involved with a suspected intelligence collector, the question is not only about judgment but about exposure — what was said, what was seen, and whether the relationship created leverage. That is why the affair is being covered as an intelligence story, not only a gossip story.\nSources agree / disagree\nPTS and Liberty Times agree on the core: the admission, Huang Le's identity, and the Megaspeed link. The intelligence claims rest on US intelligence reporting as cited by outlets — attributed, not established as fact. Trust label: Two-source agreement — two outlets agree on the admission and the timeline; the intelligence claims are attributed.\nStill uncertain\nThere is no on-the-record confirmation from US agencies in the snippets, and the timeline's details need the full PTS and Liberty Times pieces to verify. The board investigation into Huang, covered in a related card, has no stated findings."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-02-h434ff10c\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-taiwan-02-h434ff10c.jpg\",\"imageAlt\":{\"en\":\"Timeline of the Jensen Huang affair and the intelligence reporting around Huang Le\",\"zh-TW\":\"黃仁勳婚外情時間軸與黃樂情資\"},\"publishedAt\":\"2026-11-09T08:17:41.000Z\",\"title\":{\"en\":\"Huang Affair Timeline: What US Intelligence Reporting Says About Huang Le\",\"zh-TW\":\"黃仁勳婚外情時間軸：外媒情資稱女方為前星企主管黃樂\"},\"summary\":{\"en\":\"Nvidia chief Jensen Huang admitted an affair on November 8 and apologised, without naming the woman, public broadcaster PTS reports. US intelligence reporting cited by Taiwanese outlets links Huang to Huang Le (黃樂）, a former executive of Singapore firm Megaspeed suspected of collecting intelligence for China; the pair are said to have met during his Taiwan visits.\",\"zh-TW\":\"輝達執行長黃仁勳8日坦承婚外情並致歉，但未提及女方姓名。據外媒情資，美國情報機構認為他與前新加坡企業 Megaspeed 主管黃樂（Huang Le，又名 Alice Huang）關係密切，黃樂涉嫌為中國蒐集情報；兩人據稱趁黃仁勳來台時見面。公視整理全案時間軸。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"輝達執行長黃仁勳8日坦承婚外情並致歉，但未提及女方姓名——這部分已有報導確認。更關鍵的是女方身分：據外媒引述的美國情資，黃仁勳與前新加坡企業 Megaspeed 主管黃樂關係密切，黃樂涉嫌為中國蒐集情報，兩人據稱趁黃仁勳來台時見面。\\n發生了什麼事\\n據公視報導，黃仁勳8日發信坦承婚外情並致歉，但未提及女方姓名。外媒在此之前已揭露相關消息：美國情報機構認為，黃仁勳與前新加坡企業 Megaspeed 主管黃樂（Huang Le，又名 Alice Huang）關係密切，黃樂涉嫌為中國蒐集情報。自由時報爬梳兩人行蹤後報導，兩人會趁黃仁勳來台的機會見面。公視已整理全案相關消息來源與時間軸，自由時報也刊出事件時間表。\\n為什麼重要\\n這條線把執行長的婚外情變成了國安故事。若全球 AI 晶片龍頭的掌舵者牽涉疑似情報蒐集者，問題不只是個人操守，還有曝險：說了什麼、被看到什麼、這段關係是否構成把柄。正因如此，這起事件同時以情報新聞、而不只是八卦新聞的規格被報導。\\n來源異同\\n公視與自由時報對核心事實一致：認罪、黃樂的身分、Megaspeed 的關聯；情報指控來自外媒引述的美國情資，已標註出處，未當成既定事實。信任標籤：雙源一致——兩家媒體對認罪與時間軸的報導一致，情報指控已標註出處。\\n仍不確定\\n來源摘要中沒有美國官方機構具名證實，時間軸細節須查閱公視與自由時報全文才能核實。另有專卡處理的黃仁勳董事會調查，目前亦無調查結果。\"},\"sources\":[{\"name\":\"公視新聞網\",\"url\":\"https://news.pts.org.tw/article/834901\"},{\"name\":\"自由時報\",\"url\":\"https://news.ltn.com.tw/news/world/breakingnews/5634598\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":21,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"公視新聞網\",\"自由時報\"],\"glossary\":[{\"term\":{\"en\":\"Jensen Huang\",\"zh-TW\":\"黃仁勳\"},\"blurb\":{\"en\":\"CEO of Nvidia who admitted the affair.\",\"zh-TW\":\"坦承婚外情的輝達執行長。\"}},{\"term\":{\"en\":\"Huang Le\",\"zh-TW\":\"黃樂\"},\"blurb\":{\"en\":\"Former Megaspeed executive linked to Huang in intelligence reporting.\",\"zh-TW\":\"情資報導中與黃仁勳有關的前 Megaspeed 主管。\"}},{\"term\":{\"en\":\"Megaspeed\",\"zh-TW\":\"Megaspeed\"},\"blurb\":{\
