en carrying boxes from the residence, part of what Omar's camp describes as a federal criminal investigation into the Somali-born congresswoman.\nWhat happened\nTrump repeatedly brought up Minnesota and Omar (D-Minn.) while stumping for Republicans in Ohio ahead of the midterm elections. Omar responded by accusing the Trump administration of political intimidation. PBS's Geoff Bennett discussed the search with New York Times reporter Devlin Barrett, author of \"The Department of Revenge.\" In a separate development, Axios reports a top Trump political operative has been hired to boost Kansas Sen. Roger Marshall's campaign before the Nov. 3 election — veteran strategist Chris Grant, a sign of GOP anxiety as Marshall runs neck and neck with his Democratic challenger.\nWhy it matters\nA sitting member of Congress facing a home search by federal agents on the same day the president attacks her by name at a rally is an extraordinary collision of law enforcement and campaign politics. The Kansas move shows Republicans are spending top talent to defend a red-state Senate seat they expected to hold easily.\nSources agree / disagree\nPBS, The Hill, and Axios cover three distinct angles of the same Monday news cycle — the search, the Ohio rally, and the Kansas hire — with no conflicting facts in the snippets.\nStill uncertain\nThe snippets do not detail what the criminal investigation concerns or what agents took from the home. Verify specifics on the publisher pages before citing."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-us-01-trump-repeatedly-attacks\",\"category\":\"us\",\"adult\":false,\"isHeadline\":true,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-us-01-trump-repeatedly-attacks.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Trump repeatedly attacks Minnesota, Omar during Ohio campaign stop\",\"zh-TW\":\"相關封面圖：川普在俄亥俄州競選期間多次攻擊明尼蘇達州和奧馬爾\"},\"publishedAt\":\"2026-10-13T01:48:31.000Z\",\"title\":{\"en\":\"Trump Attacks Omar and Minnesota at Ohio Rally as Agents Search Omar's Home\",\"zh-TW\":\"川普（Donald Trump）在俄亥俄州造勢抨擊奧馬爾（Ilhan Omar）與明尼蘇達州，聯邦幹員同日搜查奧馬爾住處\"},\"summary\":{\"en\":\"President Trump repeatedly attacked Minnesota and Rep. Ilhan Omar at an Ohio campaign stop Monday night, the same day federal agents searched Omar's Washington, D.C., home as part of a criminal investigation. Omar called the search political intimidation. Separately, a top Trump operative was hired to rescue Kansas Sen. Roger Marshall's campaign.\",\"zh-TW\":\"川普總統（Donald Trump）週一晚間在俄亥俄州造勢場合多次抨擊明尼蘇達州（Minnesota）與眾議員伊爾汗·奧馬爾（Ilhan Omar）；同一天，聯邦幹員搜查了奧馬爾在華盛頓特區的住處。奧馬爾稱這是政治恐嚇。另有一名川普陣營高層操盤手受聘搶救堪薩斯州參議員羅傑·馬歇爾（Roger Marshall）的選情。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"美國總統川普（Donald Trump）週一晚間在俄亥俄州造勢大會上多次把明尼蘇達州（Minnesota）與眾議員伊爾汗·奧馬爾（Ilhan Omar）當成攻擊目標——就在幾小時前，聯邦幹員才搜查了奧馬爾位於華盛頓特區的住處。國土安全調查局（Homeland Security Investigations）幹員被目擊從屋內搬出箱子；奧馬爾方面表示，這是針對這位索馬利亞出生的眾議員的聯邦刑事調查一環。\\n發生了什麼事\\n川普在期中選舉前為俄亥俄州共和黨人站台時，多次點名明尼蘇達州與奧馬爾（明尼蘇達州民主黨籍）。奧馬爾反控川普政府搞政治恐嚇。PBS 的傑夫·班奈特（Geoff Bennett）與《紐約時報》（The New York Times）記者、《復仇部》（The Department of Revenge）作者德夫林·巴雷特（Devlin Barrett）討論了這場搜查。另一方面，Axios 獨家報導，川普陣營一名高層操盤手受聘搶救堪薩斯州參議員羅傑·馬歇爾（Roger Marshall）在 11 月 3 日選舉前的選情——資深策略師克里斯·葛蘭特（Chris Grant）的加入，反映共和黨對堪薩斯參議院選情的焦慮；馬歇爾正與民主黨挑戰者陷入拉鋸。\\n為什麼重要\\n一名現任國會議員在總統於造勢場合點名攻擊的同一天，遭到聯邦幹員搜查住處，是執法與競選政治的罕見碰撞。堪薩斯的人事調動則顯示，共和黨正把頂尖人才砸向一個原本以為穩拿的紅州參議院席次。\\n來源異同\\nPBS、《國會山莊報》（The Hill）、Axios 分別報導同一天新聞週期的三個角度——搜查、俄亥俄造勢、堪薩斯人事，來源摘要中沒有事實衝突。\\n仍不確定\\n摘要未說明刑事調查的具體事由，也沒說幹員帶走了什麼；引用細節前請查閱完整報導。\"},\"sources\":[{\"name\":\"PBS NewsHour\",\"url\":\"https://www.pbs.org/newshour/show/rep-omar-accuses-trump-of-political-intimidation-after-agents-search-her-home\"},{\"name\":\"The Hill\",\"url\":\"https://thehill.com/homenews/6144416-trump-attacks-omar-ohio/\"},{\"name\":\"Axios\",\"url\":\"https://www.axios.com/2026/10/12/top-trump-operative-kansas-senate-race\"}],\"disagreements\":null,\"trustScore\":76,\"trustBreakdown\":{\"sourceDiversity\":19,\"outletReputation\":10,\"crossCorroboration\":2
