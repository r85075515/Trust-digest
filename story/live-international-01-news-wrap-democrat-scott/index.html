tary Pete Hegseth and his group were admonished by an Army sentinel at the Tomb of the Unknown Soldier, and that peace talks between Ukraine, Russia and the United States ended with an agreement to exchange prisoners but no breakthrough on ending the war.\nWhy it matters\nA Democratic flip in Mississippi, a Republican stronghold in the Deep South, is a landmark breakthrough that redraws the Senate map. Its significance goes beyond a single seat: it shows Democrats can win in states long written off as unwinnable.\nSources agree / disagree\nThe BBC, CNBC, PBS NewsHour, Axios, the Financial Times and NPR agree on the result and its historic significance. The figures are not in conflict: more than 140 years is a time span, while 1870 is a year, so the two numbers measure different things rather than offering rival versions of the same figure. Trust label: Multi-source agreement — several international outlets align on the result and its historic significance.\nStill uncertain\nFeed snippets capture headlines and short descriptions, not the full articles. The final vote margin, Colom's victory remarks and his legislative direction still await full reporting; check the linked outlets for the latest coverage before quoting specifics."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-01-news-wrap-democrat-scott\",\"category\":\"international\",\"adult\":false,\"isHeadline\":true,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-international-01-news-wrap-democrat-scott.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Scott Colom Wins Mississippi Senate Race in Historic Upset\",\"zh-TW\":\"相關封面圖：史考特·科洛姆爆冷勝選：密西西比州140多年來首位非裔聯邦參議員\"},\"publishedAt\":\"2026-11-12T04:00:30.000Z\",\"title\":{\"en\":\"Scott Colom Wins Mississippi Senate Race in Historic Upset\",\"zh-TW\":\"史考特·科洛姆爆冷勝選：密西西比州140多年來首位非裔聯邦參議員\"},\"summary\":{\"en\":\"Democrat Scott Colom has defeated incumbent Republican Senator Cindy Hyde-Smith in Mississippi, becoming the state's first Democratic senator since 1982 and its first Black senator since Reconstruction, according to AP projections. The upset redraws the Senate map in the Deep South; watch whether Democrats can repeat the feat elsewhere.\",\"zh-TW\":\"民主黨史考特·科洛姆爆冷擊敗現任共和黨參議員辛蒂·海德·史密斯，拿下密西西比州聯邦參議院席次，成為該州自1982年以來首位當選的民主黨參議員，也是重建時期以來首位非裔參議員。美聯社已預測其勝選。這場南方深紅州的翻盤改寫了參議院版圖，接下來要看新科參議員的問政方向與兩黨力量的消長。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"民主黨史考特·科洛姆在密西西比州爆冷擊敗現任共和黨參議員辛蒂·海德·史密斯，成為該州140多年來首位當選聯邦參議員的非裔人士，美聯社已預測其勝選。\\n發生了什麼事\\n科洛姆擊敗現任參議員海德·史密斯，拿下密西西比州聯邦參議院席次。他是自1982年以來首位在該州當選的民主黨參議員，也是重建時期以來密西西比州首位非裔參議員。BBC、CNBC、PBS新聞一小時、Axios 與《金融時報》都報導了這場勝選。同批 PBS 新聞綜述還提到，國防部長皮特·赫格塞斯一行人在無名戰士墓前遭陸軍哨兵告誡，以及烏克蘭、俄羅斯與美國和談達成換囚協議，但停戰未有突破。\\n為什麼重要\\n在共和黨鐵票區密西西比州翻盤，對民主黨而言是一次指標性突破，也改寫了參議院的版圖想像。這場勝選的意義不在一席之得失，而在證明民主黨能在南方深紅州取勝。\\n來源異同\\nBBC、CNBC、PBS新聞一小時、Axios、《金融時報》與 NPR 對勝選結果與歷史意義的說法一致。數字並非衝突：140多年是距今的時間間隔，1870年是年份，兩者分屬不同量度，並非同一數字的兩種說法。信任標籤：多源一致——多家國際媒體對勝選結果與歷史意義的報導一致。\\n仍不確定\\n來源摘要只呈現標題與簡短描述，並非全文。最終得票差距、科洛姆的勝選感言與後續問政方向，仍待完整報導確認；引用細節前請查閱各媒體的完整報導。\"},\"sources\":[{\"name\":\"BBC World\",\"url\":\"https://www.bbc.co.uk/news/articles/cw7vppyr80eeo?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"CNBC\",\"url\":\"https://www.cnbc.com/2026/11/11/democrat-scott-colom-projected-to-win-mississippi-senate-election-over-incumbent-hyde-smith.html\"},{\"name\":\"PBS NewsHour\",\"url\":\"https://www.pbs.org/newshour/show/news-wrap-democrat-scott-colom-defeats-mississippi-sen-cindy-hyde-smith\"},{\"name\":\"Axios\",\"url\":\"https://www.axios.com/2026/11/11/mississippi-ms-senate-scott-colom-cindy-hyde-smith\"},{\"name\":\"Financial Times\",\"url\":\"https://www.ft.com/content/ed93bd25-3ae4-4845-ac2e-ccb6e9c741e6?syn-25a6b1a6=1\"},{\"name\":\"NPR News\",\"url\":\"https://www.npr.org/2026/11/11/nx-s1-6037840/democrat-scott-colom-wins-the-closest-senate-race-in-the-country\"}],\"disagreements\":null,\"trustScore\":87,\"trustBreakdown\":{\"sourceDiversity\":25,\"outletReputation\":20,\"crossCorroboration\":17,\"recencyClarity\":25},\"tags\":[\"international\",\"live-ingest\",\"bbc-world\",\"cnbc\",\"pbs-newshour\"],\"glossary\":[{\"blurb\":{\"en\":\"Democratic senator-elect from Mississippi who defeated Cindy Hyde-Smith.\",\"zh-TW\":\"密西西比州民主黨籍聯邦參議員當選人，擊敗海德·史密斯。\"},\"term\":{\"en\":\"Scott Colom\",\"zh-TW\":\"史考特·科洛姆\"}},{\"blurb\":{\"en\":\"Republican incumbent senator from Mississippi defeated by Colom.\",\"zh-TW\":\"密西西比州共和黨籍現任聯邦參議員，敗給科洛姆。\"},\"term\":{\"en\":\"Cindy Hyde-Smith\",\"zh-TW\":\"辛蒂·海德·史密斯\"}},{\"blurb\":{\"en\":\"Southern US state where Colom won the Senate race.\",\"zh-TW\":\"美國南方州，科洛姆勝選之地。\"},\"term\":{\"en\":\"Mississippi\",\"zh-TW\":\"密西西比州\"}},{\"blurb\":{\"en\":\"US news agency whose projection called the race for Colom.\",\"zh-TW\":\"美國通訊社，預測科洛姆勝選。\"},\"term\":{\"en\":\"Associated Press\",\"zh-TW\":\"美聯社\"}},{\"blurb\":{\"en\":\"US Defense Secretary mentioned in the same PBS news wrap.\",\"zh-TW\":\"美國國防部長，同批 PBS 新聞綜述提及的人物。\"},\"term\":{\"en\":\"Pete Hegseth\",\"zh-TW\":\"皮特·赫格塞斯\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-international-01-news-wrap-democrat-scott/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.
