ian and CBS News.\nWhat happened\nColombian police stormed a supermarket in one of the country's most popular tourist cities, ending a daylong siege in a Cartagena shopping centre in which all the hostages were freed and one man police described as a hostage-taker was killed. CBS News similarly reports security forces stormed the scene and ended the Colombia supermarket siege, with the nation's president saying all hostages were rescued and one captor was killed. The Guardian snippet names Abelardo de la Espriella, described as the far-right president, and says he travelled to the scene, though that sentence is truncated in the feed text. The central unresolved detail is identity: it is unclear whether the killed 'hostage-taker' may in fact have been a hostage.\nWhy it matters\nA rescue in which every hostage comes out alive is the outcome authorities aim for in a siege, especially in a shopping centre in a major tourist city. But the uncertainty over the man who was killed changes the meaning of the operation's ending: if he was a captor, the account is a completed rescue; if he was a hostage, the death requires a very different explanation. Until that identity is settled, the headline result and the open question have to be held together.\nSources agree / disagree\nThe Guardian and CBS News agree on the core sequence: forces stormed the supermarket, the daylong siege ended, all hostages were rescued, and one captor was killed. The Guardian adds the explicit uncertainty about whether the killed man may have been a hostage, which CBS's short snippet does not mention; that is an omission in the shorter account, not a direct contradiction.\nStill uncertain\nThe feed material does not give the number of hostages, the number of captors, the identity of the killed man, or how the siege began. It also does not explain the truncated reference to President Abelardo de la Espriella travelling, or provide an official investigation timeline for confirming who was killed and why.\nTrust label: Two-source agreement — two outlets agree on the rescue and the siege ending, while the identity of the man killed remains unconfirmed."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-01-all-hostages-rescued-aft\",\"category\":\"international\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-international-01-all-hostages-rescued-aft.jpg\",\"imageAlt\":{\"en\":\"Cover related to: All hostages rescued after Colombian security forces storm supermarket, police say\",\"zh-TW\":\"相關封面圖：警方稱哥倫比亞安全部隊衝進超市後所有人質均獲救\"},\"publishedAt\":\"2026-11-25T20:20:23.000Z\",\"title\":{\"en\":\"Colombian forces storm Cartagena supermarket and rescue all hostages, police say\",\"zh-TW\":\"哥倫比亞（Colombia）部隊攻入卡塔赫納（Cartagena）超市，警方稱所有人質獲救\"},\"summary\":{\"en\":\"Colombian security forces stormed a supermarket in Cartagena, ending a daylong siege in a shopping centre in one of the country's most popular tourist cities. Police said all hostages were rescued and one man described as a hostage-taker was killed, though it remains unclear whether that man may himself have been a hostage.\",\"zh-TW\":\"哥倫比亞（Colombia）安全部隊攻入卡塔赫納（Cartagena）一家超市，結束了這座熱門旅遊城市一處購物中心長達一天的圍困。警方稱所有人質獲救，一名被稱為劫持者的男子被擊斃，但目前仍不清楚該男子是否本身也是人質。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"根據《衛報》（The Guardian）與 CBS News 報導的警方說法，哥倫比亞（Colombia）安全部隊已攻入卡塔赫納（Cartagena）一家超市，結束長達一天的圍困，所有人質獲救。\\n發生了什麼事\\n哥倫比亞警方攻入該國最受歡迎的旅遊城市之一的一家超市，結束卡塔赫納一處購物中心長達一天的圍困，所有人質獲釋，警方稱一名劫持者被擊斃。CBS News 同樣報導，安全部隊攻入現場、結束哥倫比亞超市圍困，該國總統表示所有人質獲救，一名綁架者被擊斃。《衛報》摘要提到被描述為極右翼總統的德拉埃斯普里埃拉（Abelardo de la Espriella），並稱他前往現場，但該句在摘要中被截斷。核心未解細節是身分：目前仍不清楚被擊斃的「劫持者」是否其實是人質。\\n為什麼重要\\n在圍困事件中讓所有人質活著脫困，是當局追求的結果，尤其事發地點是熱門旅遊城市的購物中心。但被擊斃男子的身分疑點，改變了行動結局的意義：若他是綁架者，這是一場完成的救援；若他是人質，這起死亡就需要完全不同的說明。在身分確認之前，標題結果與這個未解問題必須一起看待。\\n來源異同\\n《衛報》與 CBS News 對核心過程一致：部隊攻入超市、長達一天的圍困結束、所有人質獲救、一名綁架者被擊斃。《衛報》明確提出被擊斃男子是否可能是人質的疑問，CBS 的簡短摘要未提及；這是較短說法的省略，而非直接矛盾。\\n仍不確定\\n摘要未給出人質人數、綁架者人數、被擊斃男子的身分，也未說明圍困如何開始。同樣未解釋總統德拉埃斯普里埃拉前往現場的截斷敘述，也未提供官方調查何時確認死者身分與原因的時間表。\"},\"sources\":[{\"name\":\"The Guardian World\",\"url\":\"https://www.theguardian.com/world/2026/nov/25/hostages-freed-colombia-security-forces-storm-cartagena-supermarket\"},{\"name\":\"CBS News Crime\",\"url\":\"https://www.cbsnews.com/news/colombia-supermarket-siege-ends-security-forces-storm-scene/\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":22,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"international\",\"live-ingest\",\"the-guardian-world\",\"cbs-news-crime\"],\"glossary\":[{\"term\":{\"en\":\"Cartagena\",\"zh-TW\":\"卡塔赫納\"},\"blurb\":{\"en\":\"Colombian city, described as one of the country's most popular tourist cities, where the supermarket siege took place.\",\"zh-TW\":\"哥倫比亞城市，被描述為該國最受歡迎的旅遊城市之一，超市圍困發生於此。\"}},{\"term\":{\"en\":\"Abelardo de la Espriella\",\"zh-TW\":\"德拉埃斯普里埃拉\"},\"blurb\":{\"en\":\"President named in The Guardian snippet as having travelled in connection with the siege.\",\"zh-TW\":\"《衛報》摘要中被提及、與圍困事件有關而前往現場的總統。\"}},{\"term\":{\"en\":\"The Guardian\",\"zh-TW\":\"衛報\"},\"blurb\":{\"en\":\"British news outlet that reported the rescue and the uncertainty over the man killed.\",\"zh-TW\":\"報導救援行動與被擊斃男子身分疑點的英國媒體。\"}},{\"term\":{\"en\":\"CBS News\",\"zh-TW\":\"CBS News\"},\"blurb\":{\"en\":\"U.S. news outlet that reported the siege ending with all hostages rescued.\",\"zh-TW\":\"報導圍困結束、所有人質獲救的美國媒體。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\
