The BBC reports she made the announcement on Instagram, while Just Jared notes she released a statement about her decision to step down. The Guardian's headline puts the same figure at the center: nine seasons, three years, and an exit framed as her own choice to move on. Why it matters The verdict is simple: Britain's biggest reality dating show is losing the host who defined its current era. Jama took over from Whitmore in 2023 and made the job her own across nine seasons; her exit, timed to her Celebrity Traitors success, leaves producers with a high-profile vacancy and fans with the question of who can plausibly replace her. Sources agree / disagree Just Jared, the BBC and The Guardian agree on the essentials: Jama is stepping down, she hosted nine seasons across three franchise shows, she is 32, and she announced the move on Sunday, November 8. No conflicting facts appear in the feed items. Trust label: Multi-source agreement — three outlets agree on the exit, the tenure and the timing. Still uncertain The feed snippets do not name a successor, and they give no detail on the statement beyond the 'something new' line or on what project Jama will take up next. The truncated snippet also mentions a first season of a spin-off she went on to host, without naming it; check the full reporting before citing that detail."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-entertainment-01-maya-jama-exits-love-isl\",\"category\":\"entertainment\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-entertainment-01-maya-jama-exits-love-isl.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Maya Jama steps down as Love Island UK host after nine seasons\",\"zh-TW\":\"相關封面圖：瑪雅·賈瑪辭去《愛情島》英國版主持人，主持九季卸任\"},\"publishedAt\":\"2026-11-09T00:43:39.000Z\",\"title\":{\"en\":\"Maya Jama Steps Down as Love Island UK Host After Nine Seasons\",\"zh-TW\":\"瑪雅·賈瑪（Maya Jama）辭去《愛情島》（Love Island）英國版主持人，主持九季卸任\"},\"summary\":{\"en\":\"Love Island UK host Maya Jama announced on Sunday, November 8, that she is stepping down after nine seasons across three franchise shows. The 32-year-old presenter, who took over from Laura Whitmore in 2023, told fans on Instagram it is 'time to throw myself into something new' — closing a three-year run fronting the hit reality dating show.\",\"zh-TW\":\"《愛情島》（Love Island）英國版主持人瑪雅·賈瑪（Maya Jama）11 月 8 日週日宣布辭去主持人一職，結束橫跨三檔系列節目、共九季的主持生涯。這位 32 歲主持人 2023 年接替蘿拉·惠特莫爾（Laura Whitmore）上任，她在 Instagram 上告訴粉絲，是時候「讓自己投入新事物了」。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"《愛情島》（Love Island）英國版主持人瑪雅·賈瑪（Maya Jama）11 月 8 日週日宣布辭去主持人一職，結束橫跨三檔系列節目、共九季的主持生涯。這位 32 歲主持人在 Instagram 上告訴粉絲，是時候「讓自己投入新事物了」，並稱這段主持時光「令人難忘」——她最近才在《Celebrity Traitors》（名人叛徒）取得成功。\\n發生了什麼事\\n賈瑪 2023 年接替蘿拉·惠特莫爾（Laura Whitmore），從第九季開始主持英國版《愛情島》，一路主持到今年稍早的第十三季。三年間，她主持了三檔不同系列節目的九季。BBC 報導她在 Instagram 上宣布消息，Just Jared 指出她也就辭職決定發表了聲明；《衛報》（The Guardian）的標題同樣聚焦九季、三年，以及她主動求去的決定。\\n為什麼重要\\n結論很簡單：英國最具代表性的真人約會實境秀，失去了定義這個時代的主持人。賈瑪 2023 年接棒，九季下來把主持工作做成了自己的招牌；她選在《名人叛徒》成功之後離開，製作單位面臨一個高曝光度的空缺，觀眾則要問：誰能接得下這個位置。\\n來源異同\\nJust Jared、BBC 與《衛報》對關鍵事實一致：賈瑪辭職、主持九季橫跨三檔系列節目、32 歲、11 月 8 日週日宣布。摘要中沒有事實衝突。信任標籤：N源一致——三家媒體對離職、任期與時間點的報導一致。\\n仍不確定\\n摘要未提到接任人選，也沒有透露聲明中除「投入新事物」之外的細節，或賈瑪下一步將投入什麼計畫。截斷的摘要還提到她接著主持了某個衍生節目的第一季，但未指明是哪一檔；引用前請查閱完整報導。\"},\"sources\":[{\"name\":\"Just Jared\",\"url\":\"https://www.justjared.com/2026/11/08/maya-jama-exits-love-island-uk-as-host-releases-statement-about-her-decision-to-step-down/\"},{\"name\":\"BBC UK\",\"url\":\"https://www.bbc.co.uk/news/articles/cwzrd5jj47ndo?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"The Guardian UK News\",\"url\":\"https://www.theguardian.com/media/2026/nov/09/maya-jama-steps-down-as-love-island-host-after-nine-seasons\"}],\"disagreements\":null,\"trustScore\":87,\"trustBreakdown\":{\"sourceDiversity\":21,\"outletReputation\":19,\"crossCorroboration\":22,\"recencyClarity\":25},\"tags\":[\"entertainment\",\"live-ingest\",\"just-jared\",\"bbc-uk\",\"the-guardian-uk-news\"],\"glossary\":
