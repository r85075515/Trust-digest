 day before Taiwan's nine-in-one local elections. Democratic Progressive Party (DPP) candidate Lai Jui-lung (賴瑞隆) began morning motorcade sweeps through Gangshan and Qiaotou districts before returning to Fengshan—Kaohsiung's most populous district—in the afternoon, culminating in his evening 'Longyang Night' rally next to Fengshan West MRT Station featuring President Lai Ching-te (賴清德) and incumbent Mayor Chen Chi-mai (陳其邁).\n\nKuomintang (KMT) challenger Ko Chih-en (柯志恩) kicked off her morning motorcade in Fengshan, announcing a three-shift legal team on standby against potential voting irregularities, before hosting her evening rally on an open lot beside the Dream Mall Light Rail Station in Qianzhen District alongside former Legislative Speaker Wang Jin-pyng (王金平) and former National Taiwan University President Kuan Chung-ming (管中閔).\n\nAs southern Taiwan's largest municipality and a hub for semiconductor and industrial investment, Kaohsiung serves as a decisive bellwether for both the ruling DPP's effort to extend municipal governance and the KMT's push to reclaim southern cities.\n\nCNA, United Daily News, and the DPP's official press release consistently corroborate the November 27 daytime motorcade routes and evening rally locations in Fengshan and Qianzhen. Reports differed slightly on crowd estimates at Ko's Dream Mall rally, with organizers announcing over 50,000 attendees in CNA's dispatch while United Daily News reported more than 30,000 supporters.\n\nWhether the strong election-eve rally turnout in Kaohsiung translates into higher ballot-box participation on November 28 remains to be seen once polls close.\n\nTrust label: Multi-source agreement — Multiple Taiwanese outlets verify the November 27 motorcade schedules, rally venues, and headline speakers in Kaohsiung."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-147-kaohsiung-mayoral-candidates-final-sprint\",\"category\":\"taiwan\",\"title\":{\"en\":\"Kaohsiung Mayoral Rivals Lai Jui-lung and Ko Chih-en Stage Final Motorcades and Rallies\",\"zh-TW\":\"高雄市長選戰最終衝刺！賴瑞隆、柯志恩白天分區車掃 晚間選前之夜拚場\"},\"summary\":{\"en\":\"On November 27, the eve of Taiwan's local elections, DPP Kaohsiung mayoral candidate Lai Jui-lung and KMT rival Ko Chih-en launched all-day motorcade sweeps across Gangshan, Qiaotou, and Fengshan before holding rival election-eve rallies in Fengshan and Qianzhen, mobilizing voters across southern Taiwan's largest municipality.\",\"zh-TW\":\"2026年11月27日九合一選前最後一天，民進黨高雄市長候選人賴瑞隆與國民黨候選人柯志恩白天分別在岡山、橋頭及鳳山展開大車隊掃街拜票；晚間賴瑞隆於捷運鳳山西站旁舉辦「隆洋之夜」、邀總統賴清德與市長陳其邁站台，柯志恩則在夢時代輕軌站旁造勢，藍綠全力催出南台灣最大票倉選票。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n2026年11月27日九合一選前最後一天，高雄市長兩大陣營候選人全力衝刺。民進黨候選人賴瑞隆（Lai Jui-lung）一早前往岡山市場拜票並在岡山、橋頭區展開大車隊掃街，下午轉往全市人口最多的鳳山區車掃，晚間於捷運鳳山西站旁舉辦「隆洋之夜」選前應援晚會，總統賴清德（Lai Ching-te）與現任高雄市長陳其邁（Chen Chi-mai）均到場站台力挺。國民黨候選人柯志恩（Ko Chih-en）上午則在鳳山區進行車隊掃街並宣布成立三班輪值律師團防範選務奧步，晚間在夢時代輕軌站旁空地舉辦選前之夜，前立法院長王金平（Wang Jin-pyng）與台大前校長管中閔（Kuan Chung-ming）等人登台助講。\\n\\n「為什麼重要」\\n高雄是南台灣人口最多且具指標性的直轄市，賴瑞隆能否順利接棒陳其邁延續綠營執政，或由深耕四年的柯志恩翻轉板塊，對藍綠兩黨在南台灣的政治版圖具有關鍵風向意義。\\n\\n「來源異同」\\n中央社（CNA）兩篇現場電訊、《聯合報》（UDN）及民進黨官方新聞稿均一致報導11月27日賴瑞隆與柯志恩的車隊掃街路線、晚間鳳山與夢時代造勢地點及主要助講嘉賓。僅在柯志恩晚會現場人數估算上略有差異：中央社引述主辦單位宣稱逾5萬人，而《聯合報》報導現場湧入超過3萬名支持者。\\n\\n「仍不確定」\\n選前之夜雙方各自展現的現場動員氣勢，明日能否在投票所轉化為實際過半選票，仍有待11月28日下午4時投票截止開票後才能揭曉。\\n\\nTrust label: Multi-source agreement — 多家台灣媒體一致核實高雄市長候選人選前一日車掃路線、晚會場地與助講陣容。\"},\"glossary\":[{\"term\":{\"en\":\"Campaign motorcade\",\"zh-TW\":\"車隊掃街\"},\"blurb\":{\"en\":\"A traditional Taiwanese campaigning method where candidates stand aboard open-top vehicles touring neighborhoods to greet voters.\",\"zh-TW\":\"台灣選舉常見的拜票方式，候選人站在改裝吉普車或宣傳車上沿街向市民揮手致意、爭取支持。\"}},{\"term\":{\"en\":\"Election-eve rally\",\"zh-TW\":\"選前之夜造勢\"},\"blurb\":{\"en\":\"The final large-scale campaign gathering held on the night before Election Day before statutory midnight campaigning bans take effect.\",\"zh-TW\":\"台灣選舉投票日前一晚舉辦的最後大型造勢活動，依法須於投票日凌晨零時前結束所有競選活動。\"}},{\"term\":{\"en\":\"Election-day legal watch team\",\"zh-TW\":\"選務律師團\"},\"blurb\":{\"en\":\"Teams of attorneys organized by political campaigns to monitor polling stations and respond rapidly to alleged voting irregularities.\",\"zh-TW\":\"競選團隊於投票日前夕籌組的律師支援編組，負責輪班監控投開票所秩序並即時處理突發選務爭議。\"}},{\"term\":{\"en\":\"Bellwether municipality\",\"zh-TW\":\"指標性直轄市\"},\"blurb\":{\"en\":\"A major metropolitan jurisdiction whose electoral outcome serves as a key indicator of broader political trends.\",\"zh-TW\":\"人口規模龐大且具政治代表性的直轄市，其選舉勝負常被視為整體政局走向的重要風向球。\"}}],\"sources\":[{\"name\":\"CNA (中央社)\",\"url\":\"https://www.cna.com.tw/news/aloc/202611270084.aspx\"},{\"name\":\"CNA (中央社)\",\"url\":\"https://www.cna.com.tw/news/aipl/202611270268.aspx\"},{\"name\":\"United Daily News (聯合報)\",\"url\":\"https://udn.com/news/story/124652/9906605\"}],\"imageUrl\":\"/covers/live/live-taiwan-147-kaohsiung-mayoral-candidates-final-sprint.jpg\",\"imageAlt\":{\"en\":\"Supporters waving flags at Kaohsiung election-eve rallies on November 27\",\"zh-TW\":\"2026年11月27日高雄市長候選人選前之夜造勢晚會現場\"},\"isHeadline\":false,\"isPopular\":true,\"trustScore\":86,\"trustBreakdown\":{\"crossCorroboration\":22,\"outletReputation\":22,\"recencyClarity\":22,\"sourceDiversity\":20},\"publishedAt\":\"2026-11-27T17:16:28.000Z\",\"disagreements\":{\"en\":\"Crowd estimates for Ko Chih-en's Dream Mall election-eve rally differed across outlets: CNA cited organizers claiming over 50,000 attendees, whereas United Daily News reported more than 30,000 supporters.\",\"zh-TW\":\"柯志恩夢時代選前之夜人數估算各家略有不同：中央社引述主辦單位宣稱逾5萬人到場，《聯合報》則報導現場湧入超過3萬名支持者。\"},\"selfCheck\":{\"D1\":22,\"D2\":22,\"D3\":21,\"D4\":22,\"D5\":21,\"total\":22},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified n
