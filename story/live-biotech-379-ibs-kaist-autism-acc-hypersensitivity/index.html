5, 2026) that mice with Adnp haploinsufficiency exhibit exaggerated responses to light touch, heat, and electrical stimulation alongside hyperactive excitatory neurons in the anterior cingulate cortex (ACC). Selectively suppressing the ACC neuronal ensemble activated by stimuli normalized tactile and thermal responses without the side effects observed during broad suppression.\n\nWhy it matters\nSensory hypersensitivity is a common and distressing feature of autism spectrum disorder that can interfere with daily life. Targeting stimulus-engaged ACC ensembles offers a more specific circuit mechanism than blunt, non-selective neural inhibition.\n\nSource differences\nMedical Xpress, titled \"Scientists identify brain circuit behind sensory hypersensitivity in autism\", and Money Today 英文版, titled \"Korean researchers find clues to why people with autism are highly sensitive to even minor stimuli\", both report the same underlying release covering Adnp-haploinsufficient mice, ACC excitatory hyperactivity, selective ensemble suppression, and co-leads Kim Eunjoon and Chung Changuk.\n\nStill uncertain\nBecause the findings come from mouse models of Adnp haploinsufficiency, clinical translation and safety in human autism spectrum disorder remain to be established through future studies.\n\nTrust label: Single source — Both Medical Xpress and Money Today 英文版 rely on the same underlying research release."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-biotech-379-ibs-kaist-autism-acc-hypersensitivity\",\"category\":\"biotech\",\"title\":{\"en\":\"IBS and KAIST Study Links Autism Sensory Hypersensitivity to ACC Hyperactivity\",\"zh-TW\":\"IBS 與 KAIST 研究指自閉症感覺過敏與前扣帶皮質過度活躍相關\"},\"summary\":{\"en\":\"A study published online in Molecular Psychiatry on November 25, 2026, led by Kim Eunjoon (金恩俊) and Chung Changuk (鄭昌旭), found that Adnp-haploinsufficient mice show heightened responses to light touch, heat, and electrical stimuli driven by overactive excitatory neurons in the anterior cingulate cortex. Selectively suppressing stimulus-activated ACC neurons normalized tactile and thermal responses without broad suppression side effects.\",\"zh-TW\":\"2026 年 11 月 25 日線上發表於 Molecular Psychiatry、由金恩俊（Kim Eunjoon）與鄭昌旭（Chung Changuk）領銜的研究指出，Adnp 單套缺失小鼠對輕觸、熱與電刺激反應過強，與前扣帶皮質（ACC）興奮性神經元過度活躍有關。選擇性抑制受刺激活化的 ACC 神經元群可使觸覺與熱反應恢復正常且無廣泛抑制副作用。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n由金恩俊（Kim Eunjoon）與鄭昌旭（Chung Changuk）領銜的團隊於 2026 年 11 月 25 日在 Molecular Psychiatry 線上發表研究，發現 Adnp 基因單套缺失小鼠對輕觸、熱與電刺激出現過度反應，且前扣帶皮質（ACC）興奮性神經元處於過度活躍狀態。若選擇性抑制受刺激活化的 ACC 神經元群，可在避免廣泛抑制副作用的情況下，使觸覺與熱反應恢復正常。\\n\\n「為什麼重要」\\n感覺過敏是自閉症常見且困擾日常生活的特徵之一。辨識並精準調控受刺激活化的 ACC 神經元群，有助於理解感覺異常的神經迴路機制，避免全面抑制帶來的副作用。\\n\\n「來源異同」\\nMedical Xpress 標題為「Scientists identify brain circuit behind sensory hypersensitivity in autism」，Money Today 英文版標題為「Korean researchers find clues to why people with autism are highly sensitive to even minor stimuli」；兩者皆源自同一份研究新聞稿，均記載 Adnp 單套缺失小鼠實驗、ACC 興奮性神經元過度活躍、選擇性抑制神經元群效果及領銜人金恩俊與鄭昌旭。\\n\\n「仍不確定」\\n目前實驗結果來自 Adnp 單套缺失小鼠模型，此迴路調控策略在人類自閉症族群的適用性與安全性仍有待後續研究驗證。\\n\\nTrust label: Single source — Medical Xpress 與 Money Today 英文版源自同一則研究發布。\"},\"glossary\":[{\"term\":{\"en\":\"Anterior cingulate cortex (ACC)\",\"zh-TW\":\"前扣帶皮質（ACC）\"},\"blurb\":{\"en\":\"A brain region involved in salience processing, attention, emotion, and sensory-affective integration.\",\"zh-TW\":\"參與顯著性偵測、注意力調控、情緒與感覺整合的大腦皮質區域。\"}},{\"term\":{\"en\":\"Adnp haploinsufficiency\",\"zh-TW\":\"Adnp 基因單套缺失\"},\"blurb\":{\"en\":\"A genetic state in which one copy of the Adnp gene is mutated or lost, leaving insufficient protein from that allele.\",\"zh-TW\":\"Adnp 基因兩個對偶基因中僅剩一個功能正常、導致基因產物不足的遺傳狀態。\"}},{\"term\":{\"en\":\"Excitatory neuron\",\"zh-TW\":\"興奮性神經元\"},\"blurb\":{\"en\":\"A neuron that releases neurotransmitters such as glutamate to increase the likelihood that connected neurons fire.\",\"zh-TW\":\"釋放麩胺酸等興奮性神經傳導物質、提高下游神經元放電機率的神經細胞。\"}}],\"sources\":[{\"name\":\"Medical
