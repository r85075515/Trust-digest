the first nine months of 2026, representing a 117.78 percent increase year over year, while quarterly momentum cooled in Q3 with shipments falling more than 10 percent from Q2. InfoLink's rankings place Deye, Fox ESS, Sigenergy, GoodWe, and Pylontech among the top five global residential ESS suppliers.\n\nWhy it matters\nRapid nine-month volume growth underscores strong household adoption of home battery storage alongside distributed solar and backup power needs. At the same time, the Q3 sequential pullback and regional shifts highlight how subsidy changes in mature markets are reshaping supplier competition toward emerging regions.\n\nSource differences\nInfoLink Consulting (\"1Q26–3Q26 global ESS shipment rankings - InfoLink Consulting\") reports the 57.58 GWh nine-month total, the 117.78 percent year-over-year gain, and the more than 10 percent quarter-over-quarter drop in Q3, while InfoLink's regional ranking page (\"1Q26 – 3Q26 Global residential ESS shipment rankings by region\") lists top five suppliers Deye, Fox ESS, Sigenergy, GoodWe, and Pylontech and notes battery-pack-based shipment measurement. Sustainable Construction Now (\"Global Residential Energy Storage Shipments Reach 57.58 GWh In First Nine Months of 2026\") likewise cites the 57.58 GWh nine-month figure and highlights hurricane-related outages in the Caribbean and high electricity prices in South America supporting emerging demand.\n\nStill uncertain\nDetailed full-year 2026 shipment projections by region and how upcoming policy adjustments in major solar-plus-storage markets will affect Q4 and 2027 ordering remain to be seen.\n\nTrust label: Single source — Both InfoLink pages reflect the same underlying InfoLink market dataset, and Sustainable Construction Now reports the same 57.58 GWh figure derived from InfoLink's research."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-energy-350-global-residential-ess-shipments-57gwh\",\"category\":\"energy\",\"title\":{\"en\":\"Global Residential Energy Storage Shipments Reach 57.58 GWh in First Nine Months of 2026\",\"zh-TW\":\"2026年前九月全球家用儲能出貨達57.58 GWh，年增117.78%\"},\"summary\":{\"en\":\"Global shipments of residential energy storage systems (ESS) reached 57.58 GWh across Q1 to Q3 2026, up 117.78 percent year over year according to InfoLink data, even as third-quarter shipments dipped more than 10 percent quarter over quarter amid shifting subsidies and emerging-market demand.\",\"zh-TW\":\"根據市調機構 InfoLink 統計，2026年第一至第三季全球家用儲能系統（ESS）出貨量達57.58 GWh，較去年同期成長117.78%；不過第三季出貨較前一季下滑逾10%，顯示市場正隨補貼調整與新興市場需求變化而重組。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n市調機構 InfoLink 發布的統計顯示，2026年第一至第三季全球家用儲能系統（ESS）出貨量達57.58 GWh，較去年同期大幅成長117.78%；不過第三季出貨較第二季下滑逾10%。InfoLink 供應商排名顯示，德業（Deye）、艾羅能源（Fox ESS）、首航新能源（Sigenergy）、固德威（GoodWe）與派能科技（Pylontech）名列全球前五大家用儲能廠商。\\n\\n「為什麼重要」\\n前三季出貨倍增反映家庭儲能搭配分散式太陽能與備援用電的需求持續擴張，而第三季較前一季回落逾10%的走勢，則凸顯成熟市場補貼政策調整正促使廠商加速轉向新興市場。\\n\\n「來源異同」\\nInfoLink Consulting（\\\"1Q26–3Q26 global ESS shipment rankings - InfoLink Consulting\\\"）公布前九月57.58 GWh 出貨量、年增117.78%及第三季季減逾10%的數據；InfoLink 區域排名頁面（\\\"1Q26 – 3Q26 Global residential ESS shipment rankings by region\\\"）列出前五大供應商為 Deye、Fox ESS、Sigenergy、GoodWe 與 Pylontech，並說明統計主要以電池包（battery-pack）為基礎涵蓋獨立電池包與完整系統。Sustainable Construction Now（\\\"Global Residential Energy Storage Shipments Reach 57.58 GWh In First Nine Months of 2026\\\"）同樣引用57.58 GWh 數據，並補充加勒比海颶風停電與南美洲高電價帶動新興市場需求的背景。\\n\\n「仍不確定」\\n2026年全年各地區出貨量最終表現，以及主要光儲市場後續政策調整對第四季與2027年拉貨節奏的影響，仍有待後續追蹤。\\n\\nTrust label: Single source — 兩篇 InfoLink 頁面均出自同一份 InfoLink 出貨資料庫，Sustainable Construction Now 亦引用同一研究數據。\"},\"glossary\":[{\"term\":{\"en\":\"Residential Energy Storage System (ESS)\",\"zh-TW\":\"家用儲能系統\"},\"blurb\":{\"en\":\"Battery-based energy storage installed in homes to store electricity—often from rooftop solar or off-peak grids—for later use or backup power.\",\"zh-TW\":\"安裝於住宅端的電池儲能設備，可儲存屋頂光電或離峰電力，供尖峰用電、電費最佳化或停電備援使用。\"}},{\"term\":{\"en\":\"Gigawatt-hour (GWh)\",\"zh-TW\":\"吉瓦時\"},\"blurb\":{\"en\":\"A unit of energy equal to one billion watt-hours, commonly used to measure large-scale battery capacity and shipments.\",\"zh-TW\":\"能量單位，相當於10億瓦時（1,000百萬瓦時），常用於衡量大型或整體產業的電池儲能容量與出貨規模。\"}},{\"term\":{\"en\":\"Quarter-over-Quarter (QoQ)\",\"zh-TW\":\"季增率／季減率\"},\"blurb\":{\"en\":\"A comparison measuring how a metric changes from one calendar quarter to the immediately preceding quarter.\",\"zh-TW\":\"將某一季度的營運或市場指標與緊鄰的前一季進行比較的變化幅度。\"}}],\"sources\":[{\"name\":\"InfoLink Consulting\",\"url\":\"https://www.infolink-group.com/energy-article/energy-storage-topic-q1-q3-global-bess-integrator-shipments-ranking\"},{\"name\":\"InfoLink Group\",\"url\":\"https://www.infolink-group.com/energy-article/energy-storage-topic-q1-q3-residential-energy-storage-shipments-ranking\"},{\"name\":\"Sustainable Construction Now\",\"url\":\"https://www.sustainableconstruction-now.com/article/565313/global-residential-energy-storage-shipments-reach-57-58-gwh-in-first-nine-months-of-2026?utm_source=renewableenergy\u0026utm_medium=newsfeed\u0026utm_campaign=renewableenergy-articleId-565313\"}],\"imageUrl\":\"/covers/live/live-energy-350-global-residential-ess-shipments-57gwh.png\",\"imageAlt\":{\"en\":\"Global Residential Energy Storage Shipments Reach 57.58 GWh in First Nine Months of 2026\",\"zh-TW\":\"2026年前九月全球家用儲能出貨達57.58 GWh，年增117.78%\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":68,\"trustBreakdown\":{\"crossCorroboration\":16,\"outletReputation\":18,\"recencyClarity\":22,\"sourceDiversity\":12},\"publishedAt\":\"2026-11-28T03:44:02.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":21,\"D2\":20,\"D3\":19,\"D4\":19,\"D5\":18,\"total\":19},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"
