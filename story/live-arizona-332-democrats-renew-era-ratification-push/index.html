n Kuby and ERA advocates are preparing a renewed push to ratify the Equal Rights Amendment (ERA) to the U.S. Constitution in the upcoming legislative session. Senate Minority Leader John Kavanagh, a Fountain Hills Republican, dismissed the effort, arguing that Congress's 1982 ratification deadline has expired and that existing laws already prohibit sex discrimination.\n\nWhy it matters\nOnly 35 states ratified the ERA before the 1982 deadline—short of the 38 required for constitutional adoption—before Nevada, Illinois, and Virginia voted to ratify after the deadline. Action by Arizona would make it the 39th state on paper to endorse the amendment, marking a major political shift after decades of GOP control while adding fresh fuel to unresolved federal legal disputes over post-deadline ratifications.\n\nSource differences\nKJZZ published \"Efforts for AZ to sign onto the Equal Rights Amendment renew with Democrats taking charge\", and Arizona Daily Star (Tucson.com) published \"Arizona Democrats renew push to ratify Equal Rights Amendment\", both carrying Howard Fischer's Capitol Media Services statehouse report detailing the exchange between Sen. Lauren Kuby, Senate Minority Leader John Kavanagh, and Center for Arizona Policy President Peter Gentala over the 1982 deadline, abortion, military draft rules, and sex-segregated facilities.\n\nStill uncertain\nWhether the incoming Democratic legislative majority will advance the ERA resolution to a floor vote early in the new session and whether a post-deadline Arizona ratification would carry any federal legal force.\n\nTrust label: Single source — Both KJZZ and Arizona Daily Star (Tucson.com) publish the same Howard Fischer/Capitol Media Services statehouse dispatch."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-arizona-332-democrats-renew-era-ratification-push\",\"category\":\"arizona\",\"title\":{\"en\":\"Arizona Democrats Renew Push to Ratify Equal Rights Amendment\",\"zh-TW\":\"民主黨拿下亞利桑那州議會多數 重啟批准美國憲法平等權利修正案推案\"},\"summary\":{\"en\":\"With Democrats poised to take control of both chambers of the Arizona Legislature, lawmakers and advocates are reviving efforts to ratify the federal Equal Rights Amendment, though Republican leaders argue the 1982 ratification deadline has long expired.\",\"zh-TW\":\"隨著民主黨即將掌握亞利桑那州眾議院與參議院多數席次，州參議員庫比（Lauren Kuby）與倡議團體正重啟批准美國憲法「平等權利修正案」（ERA）的立法推案。然而，州參議院共和黨領袖卡瓦納（John Kavanagh）反對指出，國會設定的 1982 年批准期限早已屆滿，即便通過也僅具象徵性政治表態。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n在民主黨於期中選舉取得亞利桑那州眾議院與參議院控制權後，州參議員庫比（Lauren Kuby）與支持者正籌備於新會期重啟批准美國憲法「平等權利修正案」（ERA）的議案。來自方廷希爾斯（Fountain Hills）的州參議院少數黨領袖卡瓦納（John Kavanagh）反對此舉，指稱國會當初設定的 1982 年批准期限已過，且現行法律已禁止性別歧視，此案不會產生實質改變。\\n\\n「為什麼重要」\\n美國國會當年要求須獲 38 州批准才能將 ERA 納入憲法，截至 1982 年期限僅有 35 州完成批准，內華達、伊利諾與維吉尼亞三州則在期限後陸續補行批准。亞利桑那州長期由共和黨主導州議會，若在民主黨執政後通過批准案，將成為紙面上第 39 個批准州，不僅象徵該州政治版圖轉向，也將為逾期批准是否具憲法效力的聯邦法律爭議再添變數。\\n\\n「來源異同」\\n亞利桑那公共廣播電台（KJZZ）以「Efforts for AZ to sign onto the Equal Rights Amendment renew with Democrats taking charge」刊出報導，土桑《亞利桑那每日星報》（Arizona Daily Star / Tucson.com）亦以「Arizona Democrats renew push to ratify Equal Rights Amendment」刊登同一篇由國會媒體服務社（Capitol Media Services）記者費雪（Howard Fischer）採寫的州議會報導，完整記錄庫比、卡瓦納與亞利桑那政策中心（Center for Arizona Policy）主席簡塔拉（Peter Gentala）針對 1982 年期限、墮胎權、兵役徵召與性別隔離設施的交鋒。\\n\\n「仍不確定」\\n亞利桑那州民主黨團是否會在新會期優先排審該批准案，以及即便該州完成表決，聯邦層級法院或檔案館是否會承認 1982 年期限後的批准效力，仍有待觀察。\\n\\nTrust label: Single source — KJZZ 與 Arizona Daily Star（Tucson.com）均刊載 Howard Fischer／Capitol Media Services 之同一份州議會採訪供稿。\"},\"glossary\":[{\"term\":{\"en\":\"Equal Rights Amendment (ERA)\",\"zh-TW\":\"平等權利修正案（ERA）\"},\"blurb\":{\"en\":\"A proposed amendment to the U.S. Constitution designed to guarantee equal legal rights for all American citizens regardless of sex, first passed by Congress in 1972.\",\"zh-TW\":\"旨在保障所有美國公民不分性別均享有平等法律權利的美國憲法修正案草案，1972 年獲國會通過送交各州批准。\"}},{\"term\":{\"en\":\"Ratification Deadline\",\"zh-TW\":\"批准期限\"},\"blurb\":{\"en\":\"A time limit set by Congress—originally March 1979 and later extended to June 30, 1982—for three-fourths (38) of U.S. states to approve the ERA.\",\"zh-TW\":\"美國國會為 ERA 設定的各州批准時限，原訂 1979 年 3 月並延至 1982 年 6 月 30 日，須達四分之三（38 州）同意方能生效。\"}},{\"term\":{\"en\":\"Capitol Media Services\",\"zh-TW\":\"國會媒體服務社\"},\"blurb\":{\"en\":\"A syndicated Arizona statehouse news service led by veteran journalist Howard Fischer that supplies legislative and political coverage to regional outlets.\",\"zh-TW\":\"由資深記者霍華德・費雪（Howard Fischer）主持的亞利桑那州議會新聞供稿機構，長期向州內媒體提供立法與政治報導。\"}}],\"sources\":[{\"name\":\"KJZZ\",\"url\":\"https://www.kjzz.org/politics/2026-11-27/efforts-for-az-to-sign-onto-the-equal-rights-amendment-renew-with-democrats-taking-charge\"},{\"name\":\"Arizona Daily Star (Tucson.com)\",\"url\":\"https://tucson.com/news/state-regional/article_75f1d1d5-e363-4cd1-a638-30699875d8b6.html\"}],\"imageUrl\":\"/covers/live/live-arizona-332-democrats-renew-era-ratification-push.jpg\",\"imageAlt\":{\"en\":\"Arizona Democrats Renew Push to Ratify Equal Rights Amendment\",\"zh-TW\":\"民主黨拿下亞利桑那州議會多數 重啟批准美國憲法平等權利修正案推案\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":76,\"trustBreakdown\":{\"crossCorroboration\":17,\"outletReputation\":22,\"recencyClarity\":23,\"sourceDiversity\":14},\"publishedAt\":\"2026-11-28T03:17:36.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":21,\"D2\":21,\"D3\":20,\"D4\":19,\"D5\":20,\"total\":20},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com
