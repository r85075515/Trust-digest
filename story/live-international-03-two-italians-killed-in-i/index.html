ies.\n\nWhat happened\nThe New York Times reports that two Italians died in the drone attack on Kuwait, and CNBC carries the same toll. The deaths follow a series of strikes on Gulf Arab states hosting U.S. military facilities in recent weeks, as talks to end the war continue to stall. Iran's foreign minister, Abbas Araghchi, said, 'The incident is suspicious and looks like a precooked recipe for war.' President Donald Trump said the Iran war will be over 'sort of whenever I want it to be,' as the conflict stretches into its ninth month and opposition to it grows. Trump also called soldiers at Mar-a-Lago on Thursday alongside First Lady Melania Trump.\n\nWhy it matters\nThe deaths show the war is spreading beyond Iran's borders to the Gulf states that host American forces, raising the stakes for the United States and its regional partners. Trump's remark that the war ends whenever he wants it to underlines how much of the war's course now rests on one leader's decision, while Araghchi's claim that the incident looks staged signals Tehran is framing the attack as a pretext for escalation.\n\nSources agree / disagree\nThe New York Times and CNBC agree that two Italians were killed in a drone attack on Kuwait, and CNBC and The Hill agree on Trump's 'whenever I want it' remark. No outlet in this set disputes the death toll, and no conflicting figures have appeared.\n\nStill uncertain\nThe feed summaries do not name the two Italians, say where in Kuwait the strike hit, or give the exact date of the attack. It is also unclear who the officials confirming the deaths are. Trust label: Multi-source agreement — three outlets cover the same events, with the death toll confirmed by two of them."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-03-two-italians-killed-in-i\",\"category\":\"international\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-international-03-two-italians-killed-in-i.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Two Italians Killed in Iranian Drone Attack on Kuwait, Officials Say\",\"zh-TW\":\"相關封面圖：官員稱，兩名義大利人在伊朗無人機襲擊科威特時喪生\"},\"publishedAt\":\"2026-11-27T03:30:23.000Z\",\"title\":{\"en\":\"Kuwait Drone Attack Kills Two Italians, Officials Say\",\"zh-TW\":\"科威特遭無人機襲擊，兩名義大利人死亡\"},\"summary\":{\"en\":\"Two Italians were killed in an Iranian drone attack on Kuwait, officials say, after weeks of strikes on Gulf Arab states hosting U.S. military facilities. Iran's foreign minister called the incident suspicious, while President Donald Trump said the Iran war would end 'sort of whenever I want it to be,' CNBC and The Hill report.\",\"zh-TW\":\"官員稱，伊朗無人機襲擊科威特，造成兩名義大利人死亡；此前數週，設有美軍設施的海灣阿拉伯國家接連遭襲。伊朗外交部長阿巴斯·阿拉格奇（Abbas Araghchi）稱事件可疑；美國總統川普（Donald Trump）則說，伊朗戰爭會在他想要的時候結束，據美國消費者新聞與商業頻道（CNBC）與國會山報（The Hill）報導。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"官員稱，伊朗無人機襲擊科威特，造成兩名義大利人死亡；此前數週，設有美軍設施的海灣阿拉伯國家接連遭襲。\\n\\n發生了什麼事\\n《紐約時報》（The New York Times）與美國消費者新聞與商業頻道（CNBC）報導，兩名義大利人在科威特無人機襲擊中死亡。此前數週，設有美軍設施的海灣阿拉伯國家接連遭襲，結束戰爭的談判持續停滯。伊朗外交部長阿巴斯·阿拉格奇（Abbas Araghchi）稱：「事件可疑，看起來像是事先為戰爭準備好的劇本。」美國總統川普（Donald Trump）則說，伊朗戰爭會在他想要的時候結束；衝突已進入第九個月，反對聲浪漸增。川普週四也在海湖莊園（Mar-a-Lago）與第一夫人梅拉尼婭·川普（Melania Trump）一同致電慰問士兵。\\n\\n為什麼重要\\n死亡事件顯示戰火已擴散到收容美軍的海灣國家，美國及其區域夥伴面臨的風險升高。川普一句「我想要的時候就結束」，等於把戰爭進程繫於一人決定；阿拉格奇指事件像是事先安排的劇本，則顯示德黑蘭（Tehran）正把這次襲擊定性為升級的藉口。\\n\\n來源異同\\n《紐約時報》與 CNBC 對兩名義大利人死亡的說法一致，CNBC 與國會山報（The Hill）對川普發言的引述一致；三家來源均未對死亡人數提出異議，也未出現互相衝突的數字。\\n\\n仍不確定\\n摘要未公布兩名死者身分、襲擊在科威特的確切地點與日期，也未說明證實消息的官員是誰。信任標籤：3源一致——三家媒體報導同一事件，死亡人數獲其中兩家證實。\"},\"sources\":[{\"name\":\"NYT World\",\"url\":\"https://www.nytimes.com/2026/11/26/world/middleeast/italians-killed-iran-drone-attack-kuwait.html\"},{\"name\":\"CNBC\",\"url\":\"https://www.cnbc.com/2026/11/27/us-iran-war-trump-hormuz-italian-killed-trump.html\"},{\"name\":\"The Hill\",\"url\":\"https://thehill.com/homenews/administration/6245034-trump-says-iran-war-ends-whenever/\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{
