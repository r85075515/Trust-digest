und in Sanam, located in the western Tillaberi region near the Mali border, on Thursday, November 26. The ministry characterized the assault as a \"terrorist attack\" and provided a provisional toll of at least 13 soldiers killed and 20 wounded. According to the statement, Nigerien troops killed several attackers and destroyed their logistical infrastructure during the clash, and follow-up operations to track down the remaining perpetrators are ongoing. No armed group immediately claimed responsibility for the strike.\n\n為什麼重要\nThe attack comes just two days after Niger's Defense Ministry reported 11 soldiers killed in a separate assault attributed to Boko Haram in the southeastern Diffa region, underscoring escalating multi-front security pressures on Niger's military-led government across the Sahel.\n\n來源異同\nAl Jazeera and the Associated Press (AP) both confirm the Defense Ministry's announcement of at least 13 National Guard soldiers killed in Sanam, Tillaberi region, as well as the absence of an immediate claim of responsibility. Al Jazeera additionally cites the ministry's provisional figure of 20 soldiers wounded.\n\n仍不確定\nThe exact identity of the armed faction responsible for the Sanam attack, the precise number of militants killed, and whether the provisional casualty toll among Nigerien forces will rise remain unconfirmed.\n\nTrust label: Multi-source agreement — Official death toll, location, and lack of claim of responsibility are confirmed by Al Jazeera and AP News."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-133-niger-sanam-military-attack\",\"category\":\"international\",\"title\":{\"en\":\"At Least 13 Nigerien Soldiers Killed, 20 Wounded in Armed Attack in Sanam\",\"zh-TW\":\"尼日西部薩納姆遭武裝分子襲擊 國防部證實至少 13 名軍人喪生、20 人受傷\"},\"summary\":{\"en\":\"Niger's Defense Ministry reported that heavily armed assailants attacked a National Guard compound in Sanam, Tillaberi region, near the Mali border, killing at least 13 soldiers and wounding 20. Security forces killed several attackers and launched ongoing pursuit operations, though no group has claimed responsibility. 一句重點結論：尼日西部邊境薩納姆遭大批武裝分子突襲，造成國民警衛隊至少 13 死 20 傷，軍方已展開追剿但尚無組織宣稱犯案。\",\"zh-TW\":\"尼日國防部透過國家電視台聲明證實，大批重裝武裝分子 26 日襲擊西部蒂拉貝里大區薩納姆一處國民警衛隊營區，造成至少 13 名軍人死亡、20 人受傷。軍方表示已擊斃數名襲擊者並摧毀其後勤設施，目前持續展開追剿行動，惟尚無組織宣稱犯案。一句重點結論：尼日西部邊境薩納姆遭大批武裝分子突襲，造成國民警衛隊至少 13 死 20 傷，軍方已展開追剿但尚無組織宣稱犯案。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n尼日國防部透過國家電視台宣讀聲明證實，位於該國西部鄰近馬利邊境的蒂拉貝里大區（Tillaberi）薩納姆（Sanam），於 11 月 26 日遭到「大批重裝武裝分子」襲擊當地國民警衛隊營區。國防部將此事件定調為「恐怖攻擊」，公布初步傷亡統計為至少 13 名軍人喪生、20 人受傷。聲明指出，尼日部隊在交火中擊斃多名襲擊者並摧毀其後勤設施，目前正持續展開追剿行動，尚無任何武裝組織宣稱犯案。\\n\\n「為什麼重要」\\n這起襲擊發生在尼日東南部迪法大區（Diffa）遭疑為博科聖地（Boko Haram）武裝分子攻擊造成 11 名軍人陣亡的僅兩天後，顯示尼日軍政府在東西兩線邊境均面臨嚴峻的武裝叛亂與維安壓力。\\n\\n「來源異同」\\n半島電視台（Al Jazeera）與美聯社（AP News）均引述尼日國防部聲明，確認薩納姆遇襲與至少 13 名軍人喪生、尚無組織認領等核心事實；半島電視台另詳列受傷人數為 20 人，雙方報導並無衝突。\\n\\n「仍不確定」\\n發動此次薩納姆襲擊的具體武裝組織歸屬、襲擊者實際傷亡人數，以及尼日軍方公布的初步死傷數字後續是否會進一步攀升，目前仍無法確認。\"},\"glossary\":[{\"term\":{\"en\":\"Tillaberi region\",\"zh-TW\":\"蒂拉貝里大區\"},\"blurb\":{\"en\":\"An administrative region in western Niger bordering Mali and Burkina Faso that has experienced frequent cross-border militant attacks.\",\"zh-TW\":\"位於尼日西部、與馬利及布吉納法索接壤的行政區，長期面臨跨境武裝組織頻繁襲擊。\"}},{\"term\":{\"en\":\"National Guard of Niger\",\"zh-TW\":\"尼日國民警衛隊\"},\"blurb\":{\"en\":\"A paramilitary security force operating under Niger's interior and defense authorities responsible for territorial security and border patrol.\",\"zh-TW\":\"隸屬尼日國防與內政體系的準軍事安全部隊，負責地方維安、重要設施防護與邊境巡邏。\"}},{\"term\":{\"en\":\"Sahel\",\"zh-TW\":\"沙赫爾地區\"},\"blurb\":{\"en\":\"The semi-arid transition zone south of the Sahara stretching across West and Central Africa, facing persistent jihadist insurgency and political instability.\",\"zh-TW\":\"橫跨非洲撒哈拉沙漠南緣的半乾旱地帶，涵蓋馬利、尼日與布吉納法索等國，近年面臨嚴峻武裝叛亂與政局動盪。\"}}],\"sources\":[{\"name\":\"Al Jazeera\",\"url\":\"https://www.aljazeera.com/news/2026/11/27/at-least-13-niger-soldiers-killed-in-sanam-armed-attack\"},{\"name\":\"AP News\",\"url\":\"https://apnews.com/article/niger-soldiers-killed-attack-fab7f1520d4fab4ec10b2575ddfdab03\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"Nigerien security checkpoint patrol\",\"zh-TW\":\"尼日安全部隊檢查哨巡邏畫面\"},\"isHeadline\":true,\"isPopular\":false,\"trustScore\":92,\"trustBreakdown\":{\"crossCorroboration\":24,\"outletReputation\":25,\"recencyClarity\":23,\"sourceDiversity\":20},\"publishedAt\":\"2026-11-27T16:45:11.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":5,\"D2\":5,\"D3\":4,\"D4\":5,\"D5\":4,\"total\":23},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-international-133-niger-sanam-military-attack/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-international-133-niger-sanam-military-attack/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}]],\"err
