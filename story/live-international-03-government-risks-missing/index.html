e Committee (CCC).\nWhat happened\nAnalysts say a mooted move to let more petrol and diesel vehicles be sold would wreck the plan to reach net zero by 2050. The CCC's analysis suggests the policy would blow a hole in that plan. The Guardian and the BBC both report the advisers' warning that cutting electric-vehicle targets puts the binding targets at risk.\nWhy it matters\nThe warning turns a technical sales quota into a legal test: if the rules are loosened, the government's own advisers say its climate commitments stop adding up. Ministers weighing the change must now defend it against their own advisory body's finding, not just against campaigners.\nSources agree / disagree\nThe Guardian and the BBC agree on the warning and its source, the CCC. Trust label: Two-source agreement — two national outlets report the same analysis and the same 2050 net-zero horizon, with no numeric conflicts in the snippets.\nStill uncertain\nThe snippets do not say whether the government will actually weaken the rules — the move is described as mooted — nor which specific targets or years are most at risk beyond the 2050 net-zero goal, or how large the gap would be."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-03-government-risks-missing\",\"category\":\"international\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-international-03-government-risks-missing.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Government risks missing climate targets if EV rules weakened, adviser warns\",\"zh-TW\":\"相關封面圖：顧問警告說，如果電動車規則減弱，政府將面臨無法實現氣候目標的風險\"},\"publishedAt\":\"2026-11-18T00:44:48.000Z\",\"title\":{\"en\":\"UK Risks Missing Binding Climate Targets if EV Sales Rules Are Weakened, Advisers Warn\",\"zh-TW\":\"英國若放寬電動車銷售規定恐錯失具法律約束力的氣候目標，顧問警告\"},\"summary\":{\"en\":\"Weakening the UK's electric-car sales rules would probably cause the government to miss its legally binding climate targets, the Climate Change Committee (CCC) has warned. Analysts say letting more petrol and diesel cars be sold would blow a hole in the plan to reach net zero by 2050.\",\"zh-TW\":\"氣候變遷委員會警告，英國若放寬電動車銷售規定，很可能錯失具法律約束力的氣候目標。分析指出，允許多賣汽油與柴油車將讓2050年淨零計畫出現缺口。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"氣候變遷委員會分析指出，英國若放寬電動車銷售規定，很可能錯失具法律約束力的氣候目標。\\n發生了什麼事\\n分析指出，擬議中允許多賣汽油與柴油車的舉措，將破壞2050年實現淨零排放的計畫。氣候變遷委員會的分析認為，這項政策會讓計畫出現缺口。《衛報》與英國廣播公司都報導了顧問的警告：削減電動車目標將危及具約束力的氣候目標。\\n為什麼重要\\n這項警告把技術性的銷售配額變成法律考驗：規則一旦放寬，政府自己的顧問機構等於宣告氣候承諾算不攏。考慮鬆綁的官員面對的不只是倡議團體，還有自家諮詢機構的結論。\\n來源異同\\n《衛報》與英國廣播公司說法一致：警告內容與出處同為氣候變遷委員會，2050年淨零時程也一致，摘要中沒有數字衝突。信任標籤：雙源一致——兩家全國媒體報導同一分析。\\n仍不確定\\n摘要未說明政府是否真的會放寬規定——目前只說是擬議中的舉措；除了2050年淨零目標外，哪些具體目標或年份風險最大、缺口有多大，也都沒有數字。\"},\"sources\":[{\"name\":\"The Guardian Climate Crisis\",\"url\":\"https://www.theguardian.com/environment/2026/nov/18/uk-will-miss-climate-targets-if-weakens-rules-on-ev-sales-zev-ccc\"},{\"name\":\"BBC UK\",\"url\":\"https://www.bbc.co.uk/news/articles/c63rgqg5l9l2o?at_medium=RSS\u0026at_campaign=rss\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":19,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"international\",\"live-ingest\",\"the-guardian-climate-crisis\",\"bbc-uk\"],\"glossary\":[{\"term\":{\"en\":\"Climate Change Committee (CCC)\",\"zh-TW\":\"氣候變遷委員會\"},\"blurb\":{\"en\":\"UK advisory body tracking progress to net zero.\",\"zh-TW\":\"英國諮詢機構，追蹤淨零進度。\"}},{\"term\":{\"en\":\"net zero\",\"zh-TW\":\"淨零排放\"},\"blurb\":{\"en\":\"Balancing greenhouse gas emissions with removals by 2050.\",\"zh-TW\":\"2050年溫室氣體排放與移除相抵的目標。\"}},{\"term\":{\"en\":\"The Guardian\",\"zh-TW\":\"《衛報》\"},\"blurb\":{\"en\":\"UK newspaper reporting the advisers' warning.\",\"zh-TW\":\"英國報紙，報導顧問警告。\"}},{\"term\":{\"en\":\"BBC\",\"zh-TW\":\"英國廣播公司\"},\"blurb\":{\"en\":\"UK public broadcaster reporting the same warning.\",\"zh-TW\":\"英國公共廣播機構，報導同一警告。\"}},{\"term\":{\"en\":\"petrol and diesel vehicles\",\"zh-TW\":\"汽油與柴油車\"},\"blurb\":{\"
