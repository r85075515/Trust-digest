 concrete: Nintendo is cutting $50 off a Switch 2 console bundle and $20 off some of its best games, and Ulta Beauty is offering up to 50% off select moisturizers.\nWhat happened\nThe BBC tested four AI models to see if they could save money on a new TV. Separately, The Verge reports that Nintendo Switch 2 games are cheaper through Black Friday, with $20 off some of the console's best titles, and that one of the two current console bundles is $50 off from November 22 through December 5, temporarily rolling back the $50 price increase that took effect in early September. Allure notes wavy-hair tools from Wavytalk at up to 40% off, and Fashionista has bookmarked the season's sales. The bundle's title item is Ulta Beauty's Black Friday offer: select moisturizers from Tula, Kiehl's, Sunday Riley and more, up to 50% off, with free pickup or free shipping on $35 and up.\nWhy it matters\nThe AI test is the interesting half of this bundle: if models cannot beat a careful human on a TV, the deal-hunting hype outruns the tool. The discounts are the useful half: a $50 console cut that reverses a September price rise is a genuine saving, not a manufactured markdown, and the Switch 2 game discounts land on titles people actually want. The takeaway for shoppers is to check the AI's homework, and take the console deal at face value.\nSources agree-disagree\nEight outlets feed this bundle, BBC Business, The Verge, Allure, Fashionista, 9to5Toys, Slickdeals, CNET Deals and Google News Arizona, covering different corners of Black Friday rather than one shared event. There is no contradiction between them, only different shelves. Trust label: Bundled stories: several Black Friday deals reported across outlets, not one event.\nStill uncertain\nThe summaries give no results from the AI test, no exact TV prices, and no final list of which Switch 2 games are discounted. Whether the AI models found real savings is the open question the BBC piece promises to answer."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-03-ulta-beauty-black-friday\",\"category\":\"finance\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-finance-03-ulta-beauty-black-friday.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Ulta Beauty Black Friday: Select Moisturizers: Tula, Kiehl's, Sunday Riley \u0026 More Up to 50% Off + Free Pickup or Free S\u0026H on $35+\",\"zh-TW\":\"相關封面圖：（譯文待補）Ulta Beauty Black Friday: Select Moisturizers: Tula, Kiehl's, Sunday Riley \u0026 More Up to 50% Off + Free Pickup or Free S\u0026H on $35+\"},\"publishedAt\":\"2026-11-23T01:58:01.000Z\",\"title\":{\"en\":\"Black Friday Tests: Can AI Spot the Real Deals? Switch 2 and Beauty Lead the Discounts\",\"zh-TW\":\"黑色星期五實測：AI 挑得到真便宜嗎？Switch 2、美妝折扣領跑\"},\"summary\":{\"en\":\"Black Friday coverage tests whether AI can actually spot real deals, putting four AI models through their paces on a new TV. Nintendo cuts $50 off a Switch 2 bundle and $20 off top games from November 22 to December 5; Ulta offers up to 50% off select moisturizers. The discounts are real; the AI verdict is still out.\",\"zh-TW\":\"今年黑色星期五報導實測 AI 到底挑不挑得到真便宜：拿 4 款 AI 模型比價一台新電視；任天堂 Switch 2 主機組合降價 50 美元、熱門遊戲降 20 美元（11 月 22 日至 12 月 5 日），Ulta 指定保濕品最高 5 折。重點是：折扣是真的，AI 的成績單還沒揭曉。接下來看實測結果。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"今年黑色星期五的報導問了一個很實際的問題：AI 到底能不能幫忙挑到真便宜？BBC 拿 4 款 AI 模型實測買一台新電視；折扣本身倒是很具體：任天堂 Switch 2 主機組合降價 50 美元、熱門遊戲降 20 美元，Ulta 指定保濕品最高 5 折。\\n發生了什麼事\\nBBC 實測 4 款 AI 模型，看它們能不能在買新電視時省錢。另一方面，The Verge 報導，Switch 2 熱門遊戲在黑色星期五期間降價 20 美元，兩款現行主機組合之一降價 50 美元，優惠自 11 月 22 日至 12 月 5 日，等於暫時收回 9 月初生效的 50 美元漲價。Allure 指出 Wavytalk 捲髮工具最高 4 折，Fashionista 則整理了本季已收藏的特賣清單。本批標題主打的是 Ulta 黑色星期五優惠：Tula、科顏氏（Kiehl's）、Sunday Riley 等指定保濕品最高 5 折，滿 35 美元免費取貨或免運。\\n為什麼重要\\nAI 實測是這批報導中有趣的一半：如果模型在電視比價上贏不了細心的人類，挑便宜的 hype 就跑在工具前面。折扣是實用的一半：主機降價 50 美元、收回 9 月的漲價，是真省錢、不是先漲後降；遊戲折扣也落在大家真的想買的作品上。給消費者的重點是：AI 的功課要驗收，主機的折扣可以直接收下。\\n來源異同\\n本批由 8 家來源組成（BBC 商業版、The Verge、Allure、Fashionista、9to5Toys、Slickdeals、CNET Deals、Google News 亞利桑那），各自報導黑色星期五的不同角落，而不是同一事件。彼此沒有衝突，只是貨架不同。信任標籤：捆綁報導：多家來源各自報導黑色星期五折扣，非單一事件。\\n仍不確定\\n摘要未給 AI 實測的結果、電視的確切售價，也沒列出哪些 Switch 2 遊戲在折扣之列。AI 模型到底有沒有找到真便宜，是 BBC 這篇文章承諾要回答、目前還沒答案的問題。\"},\"sources\":[{\"name\":\"BBC Business\",\"url\":\"https://www.bbc.co.uk/news/articles/cw8dv4jmnle2o?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"The Verge\",\"url\":\"https://www.theverge.com/gadgets/1037313/nintendo-switch-2-game-black-friday-cyber-monday-deal-sale\"},{\"name\":\"Allure\",\"url\":\"https://www.allure.com/story/best-wavytalk-black-friday-deals-11-21-2026\"},{\"name\":\"Fashionista\",\"url\":\"https://fashionista.com/2026/11/black-friday-cyber-monday-fashion-beauty-sales-deals-2026\"},{\"name\":\"9to5Toys\",\"url\":\"https://9to5toys.com/2026/11/22/weeks-tech-new-black-friday/\"},{\"name\":\"Slickdeals Frontpage\",\"url\":\"https://slickdeals.net/f/20366505-ulta-beauty-black-friday-50-off-select-moisturizers-tula-kiehl-s-sunday-riley-more-free-store-pickup-or-free-s-h-on-35?utm_source=rss\u0026utm_content=fp\u0026utm_medium=RSS2\"},{\"name\":\"CNET Deals\",\"url\":\"https://www.cnet.com/deals/apple-tv-black-friday-deal/\"},{\"name\":\"Google News\",\"url\":\"https://news.google.com/rss/articles/CBMiywFBVV95cUxQbTA5bEdiVkh1V1VXMjlXd2thNHY0NnhHdnRmQ0FrODNuQXdzMDZsRjVNNVpJMERyQjBUS2VJVHZuT1BCV0RXTkE1YTZGTXRCblhKZmxPSEVaRjNyMlhJOWZFMWlEak5tN0trcjB5ZHFmZ0FlSnNra3hGYy1SbDBxSlIzdmJ0R0thbWM5Uk52YlNsdDlmM245QWR6ajFxZ256VTZFckpRYTctcm40eU5HaXh4SUdYYlFqU19hWGk2TUZZdlNvMkVJclBXWQ?oc=5\"}],\"disagreements\":{\"en\":\"Figures differ across outlets (e.g. 20 vs 499.99 in headlines/snippets).\",\"zh-TW\":\"不同媒體的數字有所不同（例如，標題/摘要中的數字為 20 比 499.99）。\"},\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":25,\"outletReputation\":14,\"crossCorroboration\":17,\"recencyClarity\":25},\"tags\":[\"finance\",\"live-ingest\",\"bbc-business\",\"the-verge\",\"the-verge\"],\"glossary\":[{\"term\":{\"en\":\"Black Friday\",\"zh-TW\":\"黑色星期五\"},\"blurb\":{\"en\":\"Annual US shopping event with deep discounts, the bundle's theme.\",\"zh-TW\":\"美國年度購物節，折扣深，是本批報導的主題。\"}},{\"term\":{\"en\":\"Nintendo Switch 2\",\"zh-TW\":\"任天堂 Switch 2\"},\"blurb\":{\"en\":\"Nintendo's current console, discounted by $50 for Black Friday.\",\"zh-TW\":\"任天堂現行主機，黑色星期五降價 50 美元。\"}},{\"term\":{\"en\":\"BBC\",\"zh-TW\":\"BBC\"},\"blurb\":{\"en\":\"British broadcaster that tested four AI models on deal-hunting.\",\"zh-TW\":\"實測 4 款 AI 模型比價的英國廣播公司。\"}},{\"term\":{\"en\":\"The Verge\",\"zh-TW\":\"The Verge\"},\"blurb\":{\"en\":\"US tech outlet that reported the Switch 2 discounts.\",\"zh-TW\":\"報導 Switch 2 折扣的美國科技媒體。\"}},{\"term\":{\"en\":\"Ulta Beauty\",\"zh-TW\":\"Ulta Beauty\"},\"blurb\":{\"en\":\"US beauty retailer offering up to 50% off select moisturizers.\",\"zh-TW\":\"指定保濕品最高 5 折的美國美妝零售商。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-finance-03-ulta-beauty-black-friday/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-finance-03-ulta-beauty-black-friday/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitte
