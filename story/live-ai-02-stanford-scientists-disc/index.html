diagnosis is made, potentially enabling earlier detection and more effective, personalized treatments. The work points to biology that shows up ahead of the labels clinicians currently use.\nWhat happened\nAn AI-powered analysis of thousands of children's brain scans has revealed three distinct brain types underlying ADHD and anxiety that do not neatly fit traditional diagnoses. These hidden biological patterns can appear before a diagnosis is made, potentially enabling earlier detection and more effective, personalized treatments. The finding comes from Stanford scientists, as reported by ScienceDaily. The same batch also carried three separate findings: that AI models may not think like the human brain even when they predict brain activity well, that a drug can raise energy expenditure without clearly activating calorie-burning brown fat, and that a new circadian depression subtype may affect nearly one in four people with severe, recurrent or persistent depression.\nWhy it matters\nIf brain patterns can be seen before a diagnosis, help can start earlier and be matched to the child's biology instead of to a broad label. That is the practical promise here: earlier detection and treatment shaped around the individual brain type, rather than waiting for symptoms to fit a category. The finding also matters because it reframes ADHD and anxiety as conditions with distinct biological subtypes, not single disorders that look the same in every child.\nSources agree / disagree\nThe Stanford finding rests on a single source, ScienceDaily, which carried the story across its AI and health channels. Trust label: Single source — the main claim comes from one outlet, and the other three items in the batch are separate ScienceDaily stories. No conflicting facts appear in the snippets, so no disagreement is recorded.\nStill uncertain\nThe snippets do not name the researchers, give the number of children scanned beyond thousands, or say when the brain types could be used in clinics. The three brain types themselves are not described in detail, so readers cannot yet tell them apart from the material here. The side findings are also only summarized in a sentence each, and their underlying studies are not identified."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-ai-02-stanford-scientists-disc\",\"category\":\"ai\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-ai-02-stanford-scientists-disc.webp\",\"imageAlt\":{\"en\":\"Cover related to: Stanford scientists discover 3 hidden brain types behind ADHD and anxiety\",\"zh-TW\":\"相關封面圖：史丹佛大學科學家發現過動症和焦慮背後的 3 種隱藏大腦類型\"},\"publishedAt\":\"2026-11-25T23:37:49.000Z\",\"title\":{\"en\":\"Stanford Scientists Find Three Hidden Brain Types Behind ADHD and Anxiety\",\"zh-TW\":\"史丹佛大學（Stanford）科學家發現過動症與焦慮背後的 3 種隱藏大腦類型\"},\"summary\":{\"en\":\"Stanford scientists using AI analysis of thousands of children's brain scans found three hidden brain types behind ADHD and anxiety, ScienceDaily reports, patterns that can appear before diagnosis and may allow earlier detection and personalized treatment. Takeaway: the biology beneath ADHD and anxiety may be visible before symptoms are labelled, which could change how early help is targeted.\",\"zh-TW\":\"史丹佛大學科學家透過 AI 分析數千名兒童的腦部掃描，發現過動症與焦慮背後有 3 種隱藏的大腦類型，ScienceDaily 報導；這些模式可以在診斷之前出現，可能讓更早發現與個人化治療成為可能。重點：過動症與焦慮背後的生物學特徵，或許在症狀被貼上標籤之前就看得見，這可能改變早期協助的投放方式。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"史丹佛大學科學家透過 AI 分析數千名兒童的腦部掃描，發現過動症與焦慮背後有 3 種隱藏的大腦類型。這些模式與傳統診斷並不完全吻合，而且可以在診斷之前出現，可能讓更早發現與更有效的個人化治療成為可能。這項研究指向一種在臨床醫師目前使用的標籤之前就出現的生物學特徵。\\n發生了什麼事\\n透過 AI 分析數千名兒童的腦部掃描，研究發現導致過動症與焦慮的 3 種不同大腦類型，與傳統診斷並不完全相符。這些隱藏的生物模式可以在診斷之前出現，可能讓更早發現與更有效的個人化治療成為可能。這項發現來自史丹佛大學的科學家，由 ScienceDaily 報導。同批另有三項各自獨立的發現：AI 模型即使能準確預測大腦活動，思考方式也可能與人腦不同；一種藥物可以在不明顯活化燃燒卡路里的棕色脂肪的情況下提高身體能量消耗；一種新的「晝夜節律憂鬱症」亞型可能影響近四分之一的重度、復發性或持續性憂鬱症患者。\\n為什麼重要\\n如果大腦模式可以在診斷之前被看見，協助就能更早開始，而且可以配合兒童的生物學特徵，而不是配合一個籠統的標籤。這就是這裡的實際意義：更早發現、依個人大腦類型量身打造的治療，而不是等症狀符合某個類別。這項發現也重要，因為它把過動症與焦慮重新定位為具有不同生物學亞型的狀況，而不是在每個孩子身上看起來都一樣的單一疾病。\\n來源異同\\n史丹佛大學的發現來自單一來源 ScienceDaily，該媒體透過 AI 與健康頻道刊載了這則報導。信任標籤：僅1源——主要主張來自一家媒體，同批另外三則是各自獨立的 ScienceDaily 報導。片段中沒有出現事實衝突，因此不列入 disagreements。\\n仍不確定\\n片段沒有寫出研究者姓名，除了「數千名」之外沒有給出掃描的兒童人數，也沒有說明這些大腦類型何時能用於臨床。3 種大腦類型本身沒有詳細描述，讀者從目前的材料還無法分辨它們。其他三項發現也各只有一句摘要，背後的研究沒有指明。\"},\"sources\":[{\"name\":\"ScienceDaily AI\",\"url\":\"https://www.sciencedaily.com/releases/2026/11/261120075701.htm\"}],\"disagreements\":null,\"trustScore\":54,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":17,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"ai\",\"live-ingest\",\"sciencedaily-ai\",\"sciencedaily-健康醫學\",\"sciencedaily-健康醫學\"],\"glossary\":[{\"term\":{\"en\":\"Stanford University\",\"zh-TW\":\"史丹佛大學\"},\"blurb\":{\"en\":\"The university whose scientists found the three hidden brain types.\",\"zh-TW\":\"發現 3 種隱藏大腦類型的科學家所屬大學。\"}},{\"term\":{\"en\":\"ADHD\",\"zh-TW\":\"過動症\"},\"blurb\":{\"en\":\"Attention-deficit/hyperactivity disorder, one of the conditions linked to the hidden brain types.\",\"zh-TW\":\"與隱藏大腦類型相關的疾病之一，注意力不足過動症。\"}},{\"term\":{\"en\":\"brain scan\",\"zh-TW\":\"腦部掃描\"},\"blurb\":{\"en\":\"Imaging of children's brains that the AI analysis studied in the thousands.\",\"zh-TW\":\"AI 分析研究的數千名兒童腦部影像。\"}},{\"term\":{\"en\":\"ScienceDaily\",\"zh-TW\":\"ScienceDaily\"},\"blurb\":{\"en\":\"The outlet reporting the Stanford finding and the batch's other stories.\",\"zh-TW\":\"報導史丹佛大學發現與同批其他報導的媒體。\"}},{\"term\":{\"en\":\"circadian depression\",\"zh-TW\":\"晝夜節律憂鬱症\"},\"blurb\":{\"en\":\"A newly described depression subtype linked to the body's internal clock, mentioned as a side finding.\",\"zh-TW\":\"與人體生理時鐘相關的新描述憂鬱症亞型，作為附帶發現提及。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"titl
