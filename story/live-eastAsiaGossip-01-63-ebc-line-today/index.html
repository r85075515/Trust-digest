as chair. The actress lineup is equally stacked, with Shu Qi, Gwei Lun-mei, Lam, and Hsieh Ying-hsuan presenting alongside Lau. International guests add another layer: Oscar-winning director Bong Joon-ho, Japanese actor Sota Fukushi, Oscar-nominated actress Rinko Kikuchi, (G)I-dle member Shuhua, and Thai singer Yeh Chih-yu (葉芷妤) are all confirmed to attend.\nWhy it matters\nThe Golden Horse Awards are the most prestigious film honours in the Chinese-speaking world, and a presenter list like this is a statement of institutional continuity as much as star power. Bringing three former chairs back for the new chair's first ceremony signals a smooth handover, while the mix of veteran actresses and international names shows the awards still command the region's attention.\nSources agree / disagree\nETtoday, LINE TODAY, and Vogue Taiwan all report the same core lineup, with no conflicting names or details. Vogue Taiwan's version adds the fullest international guest list. Trust label: Multi-source agreement — three outlets agree on the core lineup.\nStill uncertain\nThe snippets give no ceremony date, venue, or which awards each presenter will hand out. Whether all the announced names appear on the night, and what the full programme looks like, will only be clear from the official ceremony details."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-eastAsiaGossip-01-63-ebc-line-today\",\"category\":\"eastAsiaGossip\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-eastAsiaGossip-01-63-ebc-line-today.jpg\",\"imageAlt\":{\"en\":\"Golden Horse Awards presenters including Ang Lee, Shu Qi and Carina Lau\",\"zh-TW\":\"金馬獎頒獎嘉賓李安、舒淇、劉嘉玲等人\"},\"publishedAt\":\"2026-11-09T07:04:34.000Z\",\"title\":{\"en\":\"Golden Horse 63 Unveils Star-Studded Presenter Lineup\",\"zh-TW\":\"金馬63頒獎嘉賓陣容華麗曝光：李安、舒淇、劉嘉玲都來了\"},\"summary\":{\"en\":\"The Golden Horse Awards unveiled its presenter lineup for the 63rd ceremony, reuniting past executive committee chairs Sylvia Chang, Ang Lee, and Mark Lee Ping-bing to support new chair Chang Chen. Best Actress winners Shu Qi, Gwei Lun-mei, Karena Lam, and Hsieh Ying-hsuan will present, joined by Hong Kong Film Awards winner Carina Lau.\",\"zh-TW\":\"第63屆金馬獎頒獎嘉賓陣容曝光：歷任金馬執委會主席張艾嘉、李安、李屏賓齊聚，力挺新任主席張震，四任主席同台；金馬影后舒淇、桂綸鎂、林嘉欣、謝盈萱與香港金像獎影后劉嘉玲都將登台，國際嘉賓還有奧斯卡導演奉俊昊。看點是星光與傳承同台，頒獎典禮未演先轟動。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"第63屆金馬獎頒獎嘉賓陣容出爐，星光與傳承一次到位。過去三任金馬執委會主席張艾嘉、李安、李屏賓齊聚，力挺新任主席張震，四任主席同台；金馬影后舒淇、桂綸鎂、林嘉欣、謝盈萱，加上香港金像獎影后劉嘉玲都將登台頒獎。\\n發生了什麼事\\n金馬執委會今日公布第63屆頒獎嘉賓名單。最大亮點是四任主席同台：張艾嘉、李安、李屏賓回來力挺新任主席張震。女神級陣容同樣驚人，舒淇、桂綸鎂、林嘉欣、謝盈萱與劉嘉玲全數登台。國際嘉賓包括奧斯卡最佳導演奉俊昊（Bong Joon-ho）、日本男星福士蒼汰（Sota Fukushi）、提名奧斯卡的女星菊地凜子（Rinko Kikuchi），以及韓國女團 (G)I-dle 成員舒華與泰國小天后葉芷妤。\\n為什麼重要\\n金馬獎是華語影壇最具份量的電影獎項，頒獎嘉賓名單本身就是實力的展示。三位前主席回來為新主席站台，代表交棒順利、傳承不斷；而老中青影后與國際嘉賓齊聚，也顯示金馬獎在華語圈與亞洲影壇仍有號召力。\\n來源異同\\nETtoday、LINE TODAY 與 Vogue Taiwan 三家報導的核心名單一致，沒有人名或細節衝突；Vogue Taiwan 的國際嘉賓名單最完整。信任標籤：多源一致——三家媒體對核心名單的報導一致。\\n仍不確定\\n來源摘要未提典禮日期、地點，也未說明每位嘉賓負責頒發哪個獎項。最終出席名單與完整節目，須等官方典禮資訊公布。\"},\"sources\":[{\"name\":\"ETtoday 影劇\",\"url\":\"https://star.ettoday.net/news/3268938\"},{\"name\":\"today.line.me\",\"url\":\"https://news.google.com/rss/articles/CBMiVkFVX3lxTE9vTE5QWUdQMk9RZlppcmRqQmFJYWVDMy1xQjhqaVFwZFZjeE1YbnFyeWlMNHJRZFZOSW03VVFzUGs4RXNlRVBNSGZibXdXZG1EUG4wbnl3?oc=5\"},{\"name\":\"Vogue Taiwan\",\"url\":\"https://www.vogue.com.tw/article/2026-gha-presenters\"}],\"disagreements\":null,\"trustScore\":81,\"trustBreakdown\":{\"sourceDiversity\":21,\"outletReputation\":13,\"crossCorroboration\":22,\"recencyClarity\":25},\"tags\":[\"eastAsiaGossip\",\"live-ingest\",\"region:tw\",\"ettoday-影劇\",\"gnews-line-today-tw-娛樂\",\"vogue-taiwan\"],\"region\":\"tw\",\"glossary\":[{\"term\":{\"en\":\"Golden Horse Awards\",\"zh-TW\":\"金馬獎\"},\"blurb\":{\"en\":\"Taiwan's most prestigious film awards, now in their 63rd year.\",\"zh-TW\":\"華語影壇最具份量的電影獎項，今年邁入第 63 屆。\"}},{\"term\":{\"en\":\"Ang Lee\",\"zh-TW\":\"李安\"},\"blurb\":{\"en\":\"Oscar-winning director and former Golden Horse executive committee chair.\",\"zh-TW\":\"奧斯卡最佳導演、前金馬執委會主席。\"}},{\"term\":{\"en\":\"Chang Chen\",\"zh-TW\":\"張震\"},\"blurb\":{\"en\":\"Actor and the new chair of the Golden Horse executive committee.\",\"zh-TW\":\"演員、金馬執委會新任主席。\"}},{\"term\":{\"en\":\"Shu Qi\",\"zh-TW\":\"舒淇\"},\"blurb\":{\"en\":\"Golden Horse Best Actress winner presenting at this year's ceremony.\",\"zh-TW\":\"金馬影后，將在本屆典禮擔任頒獎嘉賓。\"}},{\"term\":{\"en\":\"Carina Lau\",\"zh-TW\":\"劉嘉玲\"},\"blurb\":{\"en\":\"Hong Kong Film Awards Best Actress winner presenting at the ceremony.\",\"zh-TW\":\"香港金像獎影后，將在本屆典禮擔任頒獎嘉賓。\"}},{\"term\":{\"en\":\"Bong Joon-ho\",\"zh-TW\":\"奉俊昊\"},\"blurb\":{\"en\":\"Oscar-winning director attending as an international guest.\",\"zh-TW\":\"奧斯卡最佳導演，以國際嘉賓身分出席。\"}},{\"term\":{\"en\":\"ETtoday\",\"zh-TW\":\"ETtoday\"},\"blurb\":{\"en\":\"Taiwanese news outlet that reported the presenter lineup.\",\"zh-TW\":\"報導頒獎嘉賓名單的台灣新聞媒體。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-eastAsiaGossip-01-63-ebc-line-today/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-eastAsiaGossip-01-6
