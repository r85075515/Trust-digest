ate TSMC Buying Despite Record $33.1B November Foreign Outflow\",\"zh-TW\":\"台股尾盤拉抬收漲 156 點站上 39,308 點，外資 11 月累計大賣創紀錄\"},\"summary\":{\"en\":\"Taiwan's benchmark Taiex rose 156.27 points (0.40%) to close at 39,308.08 on Friday on late TSMC buying, even as foreign investors net sold NT$29.6 billion and pulled a record $33.1 billion in November. Domestic buying continues to absorb heavy foreign outflows.\",\"zh-TW\":\"台股加權指數週五受台積電尾盤買盤拉抬，終場上漲 156.27 點或 0.40%，收在 39,308.08 點，成交值 6,660.7 億元；但外資單日仍賣超 296 億元，11 月累計撤出 331 億美元創紀錄。這顯示內資買盤仍是撐住台股高檔的關鍵力量。\"},\"body\":{\"en\":\"The Taiwan Stock Exchange's benchmark Taiex ended up 156.27 points, or 0.40%, at 39,308.08 on Friday, November 27, on turnover of NT$666.07 billion.\\n\\nFocus Taiwan reported that the index finished slightly higher on late buying of Taiwan Semiconductor Manufacturing Co. (TSMC).\\n\\nDespite Friday's gain, foreign institutional investors net sold another NT$29.6 billion on the day, bringing total foreign outflows from Taiwan equities in November to a record US$33.1 billion, according to MLQ.ai.\\n\\nTrust label: Multi-source agreement — Focus Taiwan and MLQ.ai report identical Taiex closing figures of 39,308.08, up 156.27 points.\",\"zh-TW\":\"「發生了什麼事」\\n台北股市週五（11 月 27 日）受尾盤台積電買盤進場拉抬，加權指數終場上漲 156.27 點，漲幅 0.40%，收在 39,308.08 點，單日成交金額達新台幣 6,660.7 億元。不過，外資當日仍淨賣超新台幣 296 億元，使 11 月外資自台股累計撤出金額達到創紀錄的 331 億美元。\\n\\n「為什麼重要」\\n在外資單月大舉調節創下歷史紀錄的壓力下，台股指數仍能憑藉權值股尾盤買盤收紅並守住 39,300 點大關，凸顯內外資對台股後市的籌碼角力加劇。\\n\\n「來源異同」\\nFocus Taiwan 兩篇報導詳述大盤漲點、收盤點位、成交金額與台積電尾盤拉抬動向；MLQ.ai 則進一步補充外資單日賣超 296 億元及 11 月累計流出 331 億美元的籌碼數據，兩方對大盤收盤數字完全一致。\\n\\n「仍不確定」\\n外資 11 月創紀錄的撤出潮是否會在 12 月隨著美股動向與年底作帳行情趨緩，以及內資承接力道能否持續，仍有待後續交易日觀察。\"},\"glossary\":[{\"term\":{\"en\":\"Taiex\",\"zh-TW\":\"台灣加權股價指數（Taiex）\"},\"blurb\":{\"en\":\"The primary benchmark index tracking all listed stocks on the Taiwan Stock Exchange.\",\"zh-TW\":\"衡量台灣證券交易所全體上市公司股價表現的主要基準指數。\"}},{\"term\":{\"en\":\"Turnover\",\"zh-TW\":\"成交金額\"},\"blurb\":{\"en\":\"The total monetary value of shares traded on a stock exchange during a given session.\",\"zh-TW\":\"單一交易日內股票市場所有成交股票的總金額，用以衡量市場交投熱度。\"}},{\"term\":{\"en\":\"Net Selling\",\"zh-TW\":\"淨賣超\"},\"blurb\":{\"en\":\"The amount by which an investor group's total stock sales exceed its total stock purchases.\",\"zh-TW\":\"特定投資族群賣出股票的總金額大於買進金額的差額。\"}}],\"sources\":[{\"name\":\"Focus Taiwan (CNA)\",\"url\":\"https://focustaiwan.tw/business/202611270008\"},{\"name\":\"Focus Taiwan (CNA)\",\"url\":\"https://focustaiwan.tw/business/202611270014\"},{\"name\":\"MLQ.ai\",\"url\":\"https://mlq.ai/news/foreign-investors-pull-a-record-331-billion-from-taiwan-stocks-in-november/\"}],\"imageUrl\":\"/covers/live/live-finance-025-taiex-closes-up-foreign-selling.jpg\",\"imageAlt\":{\"en\":\"Taiwan Stock Exchange index display showing daily gains\",\"zh-TW\":\"台灣證券交易所股價指數上漲看板\"},\"isHeadline\":false,\"isPopular\":true,\"trustScore\":86,\"trustBreakdown\":{\"crossCorroboration\":22,\"outletReputation\":21,\"recencyClarity\":24,\"sourceDiversity\":19},\"publishedAt\":\"2026-11-27T13:51:37.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":5,\"D2\":4,\"D3\":4,\"D4\":5,\"D5\":4,\"total\":22},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-finance-025-taiex-closes-up-foreign-selling/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Biling
