ing she had not had the courage to do so earlier. Cindy responded the same day, November 4, with a Threads post — \"you still have time to buy TSMC at 600\" — that did not name Wu but was widely read as a sarcastic jab at the late apology. Other coverage says Wu also confirmed on the show that she has reunited with Chu, a claim that drew heavy online criticism.\nWhy it matters\nThe verdict is blunt: a two-and-a-half-year-late apology has reopened the scandal instead of closing it. Cindy's refusal to accept it — and the online applause for her sarcasm — shows the public is judging the timing as much as the words. For Wu, the test now is whether the reunion she reportedly confirmed can survive the backlash, or whether the apology becomes another round of the same story.\nSources agree / disagree\nETtoday, Yahoo News, UDN, NOWnews and SETN all agree on the core sequence: the 2024 date, the tearful podcast apology, and Cindy's sarcastic Threads post. Headlines call the gap \"2 years\" while the article text says about two and a half years since June 2024 — the longer figure matches the calendar. Trust label: Multi-source agreement — several Taiwanese entertainment outlets agree on the core events, with one small timing discrepancy in the headlines.\nStill uncertain\nCindy's post names nobody, so the reading that it targets Wu rests on timing and online interpretation, not an explicit statement. The reports do not quote Wu's exact words of apology beyond the summary that she admitted causing Cindy pain, and whether Wu and Chu have actually reunited rests on headlines rather than a direct quote in the excerpts. Read the full podcast interview before quoting specifics."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-eastAsiaGossip-02-2-yahoo\",\"category\":\"eastAsiaGossip\",\"adult\":false,\"isHeadline\":true,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-eastAsiaGossip-02-2-yahoo.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 吳卓源「隔2年」道歉：當時沒勇氣！朱軒洋前女友開酸 - Yahoo新聞\",\"zh-TW\":\"相關封面圖：吳卓源「隔2年」道歉：當時沒勇氣！朱軒洋前女友開酸 - Yahoo新聞\"},\"publishedAt\":\"2026-11-04T23:15:00.000Z\",\"title\":{\"en\":\"Julia Wu Apologises Two and a Half Years After Love-Triangle Scandal, and Cindy Isn't Buying It\",\"zh-TW\":\"吳卓源（Julia Wu）隔兩年半為三角戀道歉，朱軒洋前女友 Cindy 不領情\"},\"summary\":{\"en\":\"Singer Julia Wu (吳卓源) — whose belated apology topped entertainment headlines across ETtoday, Yahoo News and UDN — apologised tearfully on Matilda Tao's podcast Women's Talk (女人心事) for the 2024 love-triangle scandal, saying she caused Cindy pain. Cindy answered on Threads with a sarcastic stock-market quip. The takeaway: a two-and-a-half-year-late apology has reopened the scandal instead of closing it.\",\"zh-TW\":\"歌手吳卓源（Julia Wu）——遲來的道歉登上 ETtoday、Yahoo 新聞、聯合新聞網（UDN）等多家台媒娛樂頭條——在陶晶瑩（Matilda Tao）的 Podcast 節目《女人心事》上含淚為 2024 年三角戀風波道歉，坦言讓朱軒洋（Chu Hsuan-yang）前女友 Cindy 承受許多痛苦。Cindy 當天在 Threads 發文暗諷，道歉沒有換來原諒，反而讓風波重新延燒。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"歌手吳卓源（Julia Wu）——遲來的道歉登上 ETtoday、Yahoo 新聞、聯合新聞網（UDN）等多家台媒娛樂頭條——含淚為 2024 年 6 月的三角戀風波道歉，坦言當時沒有勇氣面對，造成朱軒洋（Chu Hsuan-yang）前女友 Cindy 許多痛苦。\\n發生了什麼事\\n2024 年 6 月，吳卓源被拍到與當時有女友的朱軒洋在河濱公園約會，捲入三角戀，形象與演藝事業受到衝擊。約兩年半後，她首度在陶晶瑩（Matilda Tao）的 Podcast 節目《女人心事》專訪中正面談及當年風波，聲淚俱下向 Cindy 公開道歉，坦言自己造成對方許多痛苦。Cindy 在 11 月 4 日當天於 Threads 發文：「你那邊還來得及買 600 的台積電。」雖未指名道姓，仍被網友解讀為暗諷這場遲來的道歉。另有報導稱，吳卓源在節目中認愛、與朱軒洋復合，引來網友一片批評。\\n為什麼重要\\n結論很直接：遲了兩年半的道歉沒有為風波收尾，反而讓它重新延燒。Cindy 不領情、網友為她的暗諷叫好，顯示輿論評斷的不只是道歉的內容，還有道歉的時機。對吳卓源而言，接下來的考驗是她據稱證實的復合能否挺過反彈，還是道歉本身會變成同一齣戲的下一集。\\n來源異同\\nETtoday、Yahoo 新聞、聯合新聞網、NOWnews 與娛樂星聞對核心經過一致：2024 年約會、含淚道歉、Cindy 在 Threads 暗諷。標題寫「隔 2 年」，內文稱約兩年半；以 2024 年 6 月事發至今推算，約兩年半較準確。信任標籤：N源一致——多家台媒娛樂線對核心事件的報導一致，僅標題的時間寫法略有出入。\\n仍不確定\\nCindy 的貼文沒有指名道姓，認定它針對吳卓源的解讀來自發文時機與網友推測，不是當事人明說。報導也未引述吳卓源道歉的逐字內容，只摘要她坦承造成 Cindy 痛苦；她與朱軒洋是否確實復合，目前只有標題說法，摘要中沒有直接引言。引用細節前請先看完整專訪。\"},\"sources\":[{\"name\":\"ETtoday 影劇\",\"url\":\"https://star.ettoday.net/news/3266521\"},{\"name\":\"Google News TW Entertainment\",\"url\":\"https://news.google.com
