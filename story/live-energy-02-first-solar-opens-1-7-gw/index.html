ile 3.4 GW describes its slated eventual size, so the figures refer to different stages, not a conflict. Executives, community leaders, and politicians attended the event. The company plans to use the facility to onshore final production processes for Series 6 Plus thin-film modules. The 330 million dollar facility onshores those processes. The plant employs approximately 500 people, expected to rise to 700 by mid-2027.\nWhy it matters\nThe judgment is direct: onshoring final production in South Carolina ties a named factory, a 330 million dollar investment, and up to 700 expected jobs to domestic solar manufacturing. The opening shows first-phase production starting, while the 3.4 GW ambition and 700-job expectation remain forward-looking.\nSources agree / disagree\nPV Magazine Global and Solar Power World covered the same Gaffney inauguration with consistent accounts of the opening. The flagged difference between 1.7 and 8217 does not appear as a stated capacity in either snippet, while 1.7 GW and 3.4 GW refer to different stages. Trust label: Two-source agreement — two outlets agree on the core claims about the opening.\nStill uncertain\nThe truncated summaries did not state the production timeline, the source of the 8217 figure, or output. They did not state whether the 3.4 GW target has a confirmed date. Verify the full reporting before quoting capacity beyond the opening and slated figures."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-energy-02-first-solar-opens-1-7-gw\",\"category\":\"energy\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-energy-02-first-solar-opens-1-7-gw.jpg\",\"imageAlt\":{\"en\":\"Cover related to: First Solar opens 1.7 GW module plant in South Carolina\",\"zh-TW\":\"相關封面圖：（譯文待補）First Solar opens 1.7 GW module plant in South Carolina\"},\"publishedAt\":\"2026-10-29T16:30:00.000Z\",\"title\":{\"en\":\"First Solar Opens 1.7 GW Module Plant in Gaffney, South Carolina\",\"zh-TW\":\"First Solar 在南卡羅來納州加夫尼開設 1.7 GW 組件工廠\"},\"summary\":{\"en\":\"First Solar opened its 1.7 GW solar module plant in Gaffney, South Carolina, starting first-phase production toward a slated 3.4 GW facility. The 330 million dollar plant employs about 500 people, expected to reach 700 by mid-2027, onshoring Series 6 Plus finishing work. Both targets remain forward-looking.\",\"zh-TW\":\"First Solar 在南卡羅來納州加夫尼開設 1.7 GW 太陽能組件工廠，啟動第一階段生產，目標最終達 3.4 GW；這座 3.3 億美元工廠現有約 500 名員工，預計 2027 年中期增至 700 人，負責 Series 6 Plus 本土化生產，後續擴產值得觀察。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"First Solar 已在南卡羅來納州加夫尼開設新的太陽能組件工廠，並舉行慶祝活動，啟動第一階段生產；該廠目前為 1.7 GW，預計最終將成為 3.4 GW 工廠。\\n發生了什麼事\\nPV Magazine 標題的 1.7 GW 指的是已開設的工廠規模，3.4 GW 指的是該廠預計的最終規模，兩個數字指向不同階段，並非衝突。活動有公司高層、社區領袖與各級政府政界人士出席。公司計畫利用該工廠在美國本土完成 Series 6 Plus 薄膜組件的最終生產流程。根據 Solar Power World，這座耗資 3.3 億美元的工廠負責 Series 6 Plus 組件的最終生產流程。加夫尼工廠目前約有 500 名員工，First Solar 預計到 2027 年中期增至 700 人，但截斷的文字沒有進一步說明工廠下一階段的細節。\\n為什麼重要\\n判斷很直接：在南卡羅來納州本土化 Series 6 Plus 組件的最終生產，把一座具名工廠、3.3 億美元投資與預計最多 700 個工作機會，和美國本土太陽能製造連結起來。開設的意義在於第一階段生產已經啟動，而 3.4 GW 的目標與 700 人的預期仍屬展望；讀者應觀察工廠能否在 2027 年中期達到預定規模與人力。\\n來源異同\\nPV Magazine Global 與 Solar Power World 報導了同一場加夫尼啟用活動，對地點、Series 6 Plus 工作與開設一事的說法一致。異議欄位標示的 1.7 與 8217 差異，並未在任一媒體的摘要中以產能數字出現，而 1.7 GW 與 3.4 GW 指的是不同階段。信任標籤：雙源一致——兩家媒體對開設的核心主張報導一致。\\n仍不確定\\n截斷的摘要沒有說明完整生產時間表、2027 年中期之後的安排、異議欄位中 8217 數字的來源，也沒有說明公司計畫的完整內容；沒有說明目前產量，也沒有說明 3.4 GW 目標是否有確認日期。引用開設與預定數字以外的產能前，請查閱完整報導。\"},\"sources\":[{\"name\":\"PV Magazine Global\",\"url\":\"https://www.pv-magazine.com/2026/10/29/first-solar-opens-1-7-gw-module-plant-in-south-carolina/\"},{\"name\":\"Solar Power World\",\"url\":\"https://www.solarpowerworldonline.com/2026/10/first-solar-to-inaugurate-south-carolina-solar-panel-finishing-facility/\"}],\"disagreements\":{\"en\":\"Figures differ across outlets (e.g. 1.7 vs 8217 in headlines/snippets).\",\"zh-TW\":\"不同媒體的數字有所不同（例如，標題/摘要中的數字為 1.7 與 8217）。\"},\"trustScore\":54,\"trustBreakdown\":{\"sourceDiversity\":13,\"outletReputation\":10,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"energy\",\"live-ingest\",\"pv-magazine-global\",\"solar-power-world\"],\"glossary\":[{\"blurb\":{\"en\":\"Solar company that opened the Gaffney module facility described.\",\"zh-TW\":\"開設所述加夫尼組件工廠的太陽能公司。\"},\"term\":{\"en\":\"First Solar\",\"zh-TW\":\"First Solar\"}},{\"blurb\":{\"en\":\"Thin-film module line whose final production processes are onshored at Gaffney.\",\"zh-TW\":\"其最終生產流程在加夫尼本土化的薄膜組件產品線。\"},\"term\":{\"en\":\"Series 6 Plus\",\"zh-TW\":\"Series 6 Plus\"}},{\"blurb\":{\"en\":\"South Carolina city where the new First Solar facility is located.\",\"zh-TW\":\"First Solar 新工廠所在的南卡羅來納州城市。\"},\"term\":{\"en\":\"Gaffney\",\"zh-TW\":\"加夫尼\"}},{\"blurb\":{\"en\":\"Outlet that reported First Solar opening the 1.7 GW module plant.\",\"zh-TW\":\"報導 First Solar 開設 1.7 GW 組件工廠的媒體。\"},\"term\":{\"en\":\"PV Magazine Global\",\"zh-TW\":\"PV Magazine Global\"}},{\"blurb\":{\"en\":\"Outlet that reported First Solar inaugurating the South Carolina finishing facility.\",\"zh-TW\":\"報導 First Solar 啟用南卡羅來納州加工工廠的媒體。\"},\"term\":{\"en\":\"Solar Power World\",\"zh-TW\":\"Solar Power World\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"con
