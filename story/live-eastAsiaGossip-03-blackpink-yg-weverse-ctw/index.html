use on new member sign-ups. Fans fear the group exists in name only. Headlines say the company responded urgently to the rumors and addressed the renewal situation, but the feed material carries no details of what YG actually said.\nWhy it matters\nFor a group of BLACKPINK's scale, an administrative omission reads as a signal even before anyone confirms anything: earnings lists and membership pauses are the kind of paperwork fans watch for exactly this reason. The takeaway: two administrative signals, one big rumor — and no confirmation either way. Until YG's response is on the record, the story is the rumor, not a disbandment.\nSources agree / disagree\nETtoday, CTWANT, FTNN, UDN and Hong Kong 01 agree on the facts — the earnings omission, the Weverse pause, and the urgent company response. The raw feed's “16 vs 01” figures note is ingest noise with no mapping to any real number in the material. No outlet in the material confirms a disbandment.\nStill uncertain\nWhat YG actually said in response, the state of the group's contract renewal, and whether the Weverse pause is related to the contract at all were not in the feed material. Verify them in the full reporting before treating the rumor as fact.\nTrust label: Unconfirmed — multiple outlets report the rumor and the signals, but no disbandment is confirmed."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-eastAsiaGossip-03-blackpink-yg-weverse-ctw\",\"category\":\"eastAsiaGossip\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-eastAsiaGossip-03-blackpink-yg-weverse-ctw.jpg\",\"imageAlt\":{\"en\":\"Cover related to: BLACKPINK要解散了？YG財報除名、Weverse停招新會員　官方急回應 | 娛樂 | CTWANT - CTWANT\",\"zh-TW\":\"相關封面圖：BLACKPINK要解散了？YG財報除名、Weverse停招新會員　官方急回應 | 娛樂 | CTWANT - CTWANT\"},\"publishedAt\":\"2026-11-17T02:45:37.000Z\",\"title\":{\"en\":\"BLACKPINK Disbandment Rumors Swirl as YG Earnings Omit the Group and Weverse Pauses Sign-Ups\",\"zh-TW\":\"BLACKPINK 傳解散：YG 財報除名、Weverse 停招新會員，官方急回應\"},\"summary\":{\"en\":\"Global K-pop group BLACKPINK is at the centre of disbandment rumors after YG Entertainment's third-quarter earnings, released on November 16, omitted the group from its exclusive-contract artist list and Weverse paused new memberships. YG has responded urgently, though the response's contents were not in the feed material. Takeaway: two administrative signals, one big rumor — and no confirmation either way.\",\"zh-TW\":\"全球韓流天團 BLACKPINK 陷入解散傳聞：YG 娛樂 11 月 16 日公布第 3 季財報時，專屬合約藝人名單中不見團體名稱，Weverse 也暫停招收新會員。YG 已緊急回應，但回應內容未載於來源摘要。結論：兩個行政訊號、一個大傳聞——而哪一邊都未經證實。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"全球韓流天團 BLACKPINK 陷入解散傳聞：YG 娛樂 11 月 16 日公布第 3 季財報時，專屬合約藝人名單中不見團體名稱，粉絲平台 Weverse 也暫停招收新會員。公司已緊急回應，但回應內容未載於來源摘要。\\n發生了什麼事\\nCTWANT、ETtoday 等媒體報導了相同的經過：BLACKPINK 團體約傳出到期，YG 11 月 16 日公布的第 3 季財報中，專屬合約藝人名單不見團體名稱，Weverse 也宣布暫停新會員加入，引發粉絲憂心團體名存實亡。各家標題稱公司已緊急發聲、回應續約現況，但摘要沒有公司實際說法的細節。\\n為什麼重要\\n對 BLACKPINK 這種規模的團體來說，行政文件上的遺漏在任何人證實之前就已經像是一種訊號：財報名單與會員招募正是粉絲會盯著看的文件。結論是：兩個行政訊號、一個大傳聞——而哪一邊都未經證實。在 YG 的回應有正式紀錄之前，這則新聞是傳聞，不是解散。\\n來源異同\\nETtoday、CTWANT、FTNN、噓！星聞、香港 01 在事實上一致——財報除名、Weverse 停招、公司緊急回應。來源摘要的「16 比 01」數字註記是 ingest 雜訊，對應不上材料中的任何實際數字。材料中沒有任何一家媒體證實解散。\\n仍不確定\\nYG 實際回應了什麼、團體續約的現況、Weverse 停招是否與合約有關，摘要都沒有，在把傳聞當成事實之前，請查完整報導。\"},\"sources\":[{\"name\":\"ETtoday 影劇\",\"url\":\"https://star.ettoday.net/news/3273385\"},{\"name\":\"Google News\",\"url\":\"https://news.google.com/rss/articles/CBMic0FVX3lxTE9SSGxncUR6Rkh1T2x4ZU5KdE5NTjJ2QzYwZkpVTEoyLUFnaGFicS1LUUlTTWE1M3AyUEd5d1QzRlk5eU1jSjBITEpCeTBMeTZzLWhJSXNXMW1IMDZ2VGgzY1Rqa21aZGViZTNzUW1jWWdtOW_SAV9BVV95cUxQdXo2MnhZLU1UbTFYV0I4M1dGak8yWXRPMHBsSE9YSDJGbGRtS2Z5YkMzem5HUVJOQXlHLXBOTXpEREtKRWdZRjJBZTRGcXZsamMzMjU4MkRCOVd3YndVNA?oc=5\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":13,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"eastAsiaGossip\",\"live-ingest\",\"region:tw\",\"ettoday-影劇\",\"google-news-tw-娛樂\",\"goo
