atters\nIf ice loss triggered during a temporary overshoot cannot be undone by later cooling, then climate pathways that plan to exceed 1.5°C and return carry hidden, irreversible costs for sea levels and water supplies.\nSources agree / disagree\nThis is currently a single-outlet item from The Guardian's climate desk summarizing the report, with no second outlet in the feed. Trust label: Single source — only one outlet is summarizing this report so far.\nStill uncertain\nThe snippets do not name the report's authors, publication venue or specific projections by region; consult the report itself for its evidence and timelines."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-energy-02-cryosphere-faces-permane\",\"category\":\"energy\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-energy-02-cryosphere-faces-permane.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Cryosphere faces permanent damage when world overshoots 1.5C, scientists warn\",\"zh-TW\":\"相關封面圖：科學家警告稱，當全球氣溫超過攝氏1.5度時，冰凍圈將面臨永久性損害\"},\"publishedAt\":\"2026-11-02T00:01:25.000Z\",\"title\":{\"en\":\"UN-Backed Report: Even Temporary Overshoot of 1.5°C Could Permanently Damage Glaciers and Polar Ice\",\"zh-TW\":\"聯合國支持報告：即使暫時 overshoot 1.5°C，也可能永久損害冰川與極地冰層\"},\"summary\":{\"en\":\"A UN-backed report finds that even a temporary rise above the Paris Agreement target could cause permanent harm to glaciers and polar ice sheets, and argues global heating should be brought back below 1°C after an inevitable overshoot period, The Guardian reported.\",\"zh-TW\":\"《衛報》（The Guardian）報導，一份聯合國支持的報告發現，即使暫時高於巴黎協定（Paris Agreement）目標，也可能對冰川與極地冰層造成永久傷害，並主張在不可避免的 overshoot 期間後，應把全球暖化壓回 1°C 以下。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"一份聯合國支持的冰凍圈報告背後的科學家警告，overshoot 不是無害的繞路。\\n發生了什麼事\\n《衛報》（The Guardian）報導，地球冰區面臨危險融化，一份聯合國報告發現，在不可避免地 overshoot 全球溫度目標一段期間後，應把全球暖化壓回 1°C 以下。報告發現，即使暫時高於巴黎協定（Paris Agreement）1.5°C 目標，也可能傷害冰川與極地冰層。報告形容雪與冰將出現永久且廣泛的損失，並依文章用字，稱 overshoot 可逆的假設是「持續的迷思」。\\n為什麼重要\\n若暫時 overshoot 期間觸發的冰層損失無法靠後續降溫挽回，那麼計畫先超過 1.5°C 再返回的氣候路徑，就隱含海平面與水資源的不可逆成本。\\n來源異同\\n目前僅《衛報》（The Guardian）氣候版一家彙整此報告，feed 中無第二來源。信任標籤：單一來源——目前只有一家媒體彙整此報告。\\n仍不確定\\n摘要未提報告作者、發表出處與各地區的具體推估；其證據與時程請查閱報告本身。\"},\"sources\":[{\"name\":\"The Guardian Climate Crisis\",\"url\":\"https://www.theguardian.com/science/2026/nov/02/permanent-damage-crysophere-overshoots-15c-scientists-warn\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"energy\",\"live-ingest\",\"the-guardian-climate-crisis\"],\"glossary\":[{\"term\":{\"en\":\"Cryosphere\",\"zh-TW\":\"冰凍圈\"},\"blurb\":{\"en\":\"Earth's icy regions — glaciers, ice sheets and snow — covered by the report.\",\"zh-TW\":\"地球冰區——冰川、冰層與雪——報告涵蓋範圍。\"}},{\"term\":{\"en\":\"Paris Agreement\",\"zh-TW\":\"巴黎協定\"},\"blurb\":{\"en\":\"International climate agreement whose 1.5°C target the report discusses.\",\"zh-TW\":\"國際氣候協定，報告討論其 1.5°C 目標。\"}},{\"term\":{\"en\":\"Overshoot\",\"zh-TW\":\"overshoot\"},\"blurb\":{\"en\":\"Temporarily exceeding a temperature target before returning below it.\",\"zh-TW\":\"先暫時超過溫度目標、之後再回到目標以下。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-energy-02-cryosphere-faces-permane/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"prop
