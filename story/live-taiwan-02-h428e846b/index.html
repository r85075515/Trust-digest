hy it matters\nA suspected espionage case involving repeated entries into Taiwan goes directly to border security and counter-intelligence, and the government's refusal to give detail signals how sensitive the case is. For the public, the key question is whether the system caught the visits in time — and the immigration agency's answer is that it did, working with national security units.\nSources agree / disagree\nOnly CNA has reported the case so far, and the account rests entirely on official statements from the immigration agency and the Executive Yuan. Trust label: Single source — only CNA has reported this case so far.\nStill uncertain\nThe substance of the espionage allegation, the evidence behind it, the progress of the investigation and Huang Le's own response have all not been made public. As an accountability story, it is missing the key information: what she is alleged to have done, and what stage the investigation has reached."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-02-h428e846b\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-taiwan-02-h428e846b.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Huang Le suspected of spying for China; Executive Yuan cites cross-border probe\",\"zh-TW\":\"相關封面圖：黃樂疑為中國間諜，行政院稱涉跨國合作調查\"},\"publishedAt\":\"2026-11-12T07:48:27.000Z\",\"title\":{\"en\":\"Huang Le Suspected of Spying for China; Executive Yuan Cites Cross-Border Probe\",\"zh-TW\":\"黃樂（Huang Le）疑為中國間諜：行政院稱涉跨國合作調查不便多說\"},\"summary\":{\"en\":\"［未證實·單一來源］Huang Le, a Chinese businesswoman suspected of spying for China, has repeatedly entered Taiwan on a Hong Kong passport, and immigration authorities say past visits were tracked with national security agencies. The Executive Yuan says the case is under investigation and involves cross-border cooperation, so details cannot be disclosed. Watch for formal charges and Huang Le's response.\",\"zh-TW\":\"［未證實·單一來源］疑為中國間諜的中國籍女商人黃樂（Huang Le）過去曾多次持香港護照來台，內政部移民署表示過去皆與國安單位掌握其來台情形。行政院表示相關個案偵辦進行中，涉及跨國合作調查，細節不便說明。接下來看調查是否公布具體指控與黃樂的回應。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"疑為中國間諜的中國籍女商人黃樂（Huang Le）曾多次持香港護照來台，行政院 12 日表示個案偵辦進行中，涉及跨國合作調查，細節不便說明。\\n發生了什麼事\\n中央社（CNA）報導，疑為中國間諜的中國籍女商人黃樂過去曾多次持香港護照來台；內政部移民署今天強調，過去皆與國安單位掌握黃樂來台情形。行政院表示，相關個案偵辦正在進行中，細節不便說明，且涉及跨國合作調查，目前無更多資訊提供。\\n為什麼重要\\n疑似間諜案件涉及多次入境台灣，直接關係邊境安全與反情報工作；政府不願透露細節，正顯示案件的敏感程度。對公眾來說，關鍵問題是體系是否及時掌握每一次入境——移民署的回答是肯定的，稱過去皆與國安單位共同掌握。\\n來源異同\\n目前僅中央社一家報導，內容完全引述移民署與行政院的官方說法。信任標籤：單一來源——目前僅中央社一家報導。\\n仍不確定\\n間諜指控的具體內容、相關證據、調查進度與黃樂本人的回應皆未公開；作為問責／調查類新聞，本案欠缺關鍵資訊：她被指控做了什麼、調查進行到哪一步。\"},\"sources\":[{\"name\":\"中央社-政治\",\"url\":\"https://www.cna.com.tw/news/aipl/202611120222.aspx\"}],\"disagreements\":null,\"trustScore\":59,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"中央社-政治\"],\"glossary\":[{\"term\":{\"en\":\"Huang Le\",\"zh-TW\":\"黃樂（Huang Le）\"},\"blurb\":{\"en\":\"A Chinese businesswoman suspected of spying for China.\",\"zh-TW\":\"疑為中國間諜的中國籍女商人。\"}},{\"term\":{\"en\":\"Executive Yuan\",\"zh-TW\":\"行政院（Executive Yuan）\"},\"blurb\":{\"en\":\"Taiwan's executive branch, which declined to discuss the case.\",\"zh-TW\":\"台灣行政機關，表示不便說明本案。\"}},{\"term\":{\"en\":\"National Immigration Agency\",\"zh-TW\":\"內政部移民署（National Immigration Agency）\"},\"blurb\":{\"en\":\"Taiwan's immigration authority, which tracked Huang Le's visits.\",\"zh-TW\":\"台灣移民事務機關，掌握黃樂來台情形。\"}},{\"term\":{\"en\":\"CNA\",\"zh-TW\":\"中央社（CNA）\"},\"blurb\":{\"en\":\"Taiwan's Central News Agency and the sole source of this story.\",\"zh-TW\":\"中央通訊社，本案唯一的報導來源。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Mu
