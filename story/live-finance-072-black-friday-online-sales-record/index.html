rking a 9.2% increase over the prior year, after shoppers already spent $82.5 billion online between Nov. 1 and Nov. 22. Salesforce data indicates November discounts are averaging 8% deeper than last year, pushing average selling prices of physical merchandise 1% lower.\n\nThe spending pattern highlights how U.S. households are navigating living costs by using multiweek holiday promotions to stock up on household cleaning supplies, personal hygiene products, and basic apparel alongside traditional electronics and gifts.\n\nAssociated Press and MLQ.ai both cite Adobe Analytics figures showing $82.5 billion in early November online sales and a $12.9 billion Black Friday projection, while noting that National Retail Federation forecasts expect inflation to account for roughly half of overall November–December retail growth.\n\nFinal tallied Black Friday and Cyber Monday checkout totals, along with post-holiday return rates, will determine net retail profit margins for the fourth quarter.\n\nTrust label: Multi-source agreement — Adobe Analytics sales projections and Salesforce discount metrics are corroborated across Associated Press and MLQ.ai reporting."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-072-black-friday-online-sales-record\",\"category\":\"finance\",\"title\":{\"en\":\"U.S. Black Friday Online Spending Forecast to Hit Record $12.9 Billion Amid Essential Purchases\",\"zh-TW\":\"美國黑色星期五線上消費額預估創129億美元新高 日用品成採購主力\"},\"summary\":{\"en\":\"U.S. consumers are projected to spend a record $12.9 billion online on Black Friday, up 9.2% year-over-year, as shoppers pair holiday gifts with discounted everyday essentials. The surge reflects strong digital conversion driven by deeper seasonal promotions and lower average merchandise prices.\",\"zh-TW\":\"美國消費者在黑色星期五當天的線上消費支出預估將達129億美元歷史新高，較去年同期成長9.2%，不少民眾趁著季節性折扣同步採購日常必需品與節慶禮品。這波買氣顯示較深的促銷折扣與略為回落的平均商品售價，正有效帶動年底數位零售轉換率。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n根據Adobe Digital Insights與美聯社（Associated Press）報導，美國黑色星期五當天的線上消費額預估將衝上129億美元歷史新高，較去年同期成長9.2%；此前11月1日至22日期間，全美線上支出已累計達825億美元。Salesforce數據顯示，今年11月零售商平均折扣力度比去年加深8%，使實體商品平均售價較去年同期微降1%。\\n\\n「為什麼重要」\\n這波消費結構反映美國家庭在生活成本壓力下的精打細算策略：消費者不再只鎖定3C與節慶禮品，而是趁著拉長的促銷週期大量囤購個人清潔用品、居家清潔劑與基本款服飾等日用必需品，支撐第四季零售動能。\\n\\n「來源異同」\\n美聯社與財經媒體MLQ.ai均引述Adobe Analytics數據，確認11月前三週825億美元線上銷售額及黑五129億美元預測；同時提到全美零售聯合會（NRF）預估11至12月整體零售額成長中，約有一半來自物價上漲因素。\\n\\n「仍不確定」\\n黑色星期五與緊接而來的網路星期一（Cyber Monday）最終實際結算金額，以及節後退貨率高低，將決定零售業者第四季的實質淨利表現。\"},\"glossary\":[{\"term\":{\"en\":\"Adobe Digital Insights\",\"zh-TW\":\"Adobe數位洞察（Adobe Digital Insights）\"},\"blurb\":{\"en\":\"A market research program that analyzes trillions of visits to U.S. retail websites to track real-time e-commerce spending and price trends.\",\"zh-TW\":\"透過分析美國零售網站海量造訪與交易數據，即時追蹤電商消費額與商品價格趨勢的市場研究機構。\"}},{\"term\":{\"en\":\"Average Selling Price (ASP)\",\"zh-TW\":\"平均售價\"},\"blurb\":{\"en\":\"The average price at which a particular category of goods is sold across retail channels after promotional discounts are applied.\",\"zh-TW\":\"特定品類商品在計入促銷折扣後，於各零售通路成交的平均單價。\"}},{\"term\":{\"en\":\"National Retail Federation (NRF)\",\"zh-TW\":\"全美零售聯合會\"},\"blurb\":{\"en\":\"The world's largest retail trade association, representing department stores, specialty retailers, and e-commerce companies in the United States.\",\"zh-TW\":\"全球規模最大的零售業貿易協會，代表美國百貨、專賣店與電商企業發布產業銷售預測。\"}}],\"sources\":[{\"name\":\"Associated Press\",\"url\":\"https://apnews.com/article/black-friday-shopping-ai-essentials-5e542ffd1f94f24e4ffb79d412223544\"},{\"name\":\"MLQ.ai\",\"url\":\"https://mlq.ai/news/black-friday-2026-adobe-tracks-825-billion-online-so-far-up-91/\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"Shoppers browsing holiday deals online and in retail stores on Black Friday\",\"zh-TW\":\"消費者在黑色星期五期間瀏覽線上與實體零售折扣商品\"},\"isHeadline\":true,\"isPopular\":true,\"trustScore\":85,\"trustBreakdown\":{\"crossCorroboration\":22,\"outletReputation\":22,\"recencyClarity\":21,\"sourceDiversity\
