oss Nangang, Taipei, and Banqiao stations. Under the protocol, if waiting times reach a red-light alert—estimated at 45 minutes to one hour—station staff regulate platform access in alternating cycles of 10 minutes open and 5 minutes paused, while adding 20 all-non-reserved trains across Friday evening and Saturday morning.\n\nThe measure marks an operational shift for Taiwan's primary north-south rail artery during peak holiday and election travel, aiming to prevent platform overcrowding in underground stations where vertical queuing space is constrained. Passengers can monitor real-time waiting light statuses via the THSR website, T-EX app, and LINE TODAY before arriving at terminals.\n\nBoth TVBS News and Storm Media report the identical 5:00 PM to 8:00 PM control window, the 10-minute-on and 5-minute-off cycling rule, and the deployment of 20 all-non-reserved trains. Storm Media additionally notes THSR's internal estimate of 45-to-60-minute peak queue durations, whereas TVBS highlights the 23% discount on 10 designated red-eye reserved-seat trains.\n\nTHSR has stated it may extend the gate-control hours dynamically depending on live crowd buildup, leaving exact end times and commuter spillover effects on Taipei Metro connecting gates subject to evening passenger volume.\n\nTrust label: Multi-source agreement — TVBS News and Storm Media report identical gate control hours, cycling intervals, and train additions."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-051-thsr-non-reserved-gate-control\",\"category\":\"taiwan\",\"title\":{\"en\":\"Taiwan High Speed Rail Launches First-Ever Gate Controls for Non-Reserved Seats Ahead of Election\",\"zh-TW\":\"因應九合一返鄉潮 台灣高鐵首度實施南港、台北及板橋三站自由座閘門管制\"},\"summary\":{\"en\":\"Ahead of Taiwan's local elections on November 27, 2026, Taiwan High Speed Rail (THSR) is enforcing gate controls for non-reserved passengers at Nangang, Taipei, and Banqiao stations from 5:00 PM to 8:00 PM. When queue times hit red-alert status, gates will open for 10 minutes and pause for 5 minutes to manage congestion.\",\"zh-TW\":\"因應 2026 年九合一選舉返鄉人潮，台灣高鐵於 11 月 27 日下午 5 時至晚間 8 時，首度針對南港、台北及板橋三站實施自由座閘門管制。當等候時間亮紅燈時，採「開放進站 10 分鐘、暫停 5 分鐘」分批放行，並加開 20 班全車自由座列車疏運。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n因應 2026 年九合一地方公職人員選舉返鄉人潮，台灣高鐵於 11 月 27 日下午 5 時至晚間 8 時，首度針對南港、台北及板橋三站實施自由座閘門管制。當自由座等候時間燈號亮紅燈時，現場採「開放進站 10 分鐘、暫停 5 分鐘」分批放行，同時於 27 日晚間及 28 日上午共規劃 20 班全車自由座列車。\\n「為什麼重要」\\n這是台灣高鐵首次在大型疏運期間啟動閘門分批放行機制，旨在避免地下化車站月台與穿堂層過度擁擠並降低安全風險。旅客可透過高鐵官網、T-EX 行動購票 App 與 LINE TODAY 即時查詢三站等候燈號，提前調整出發時間。\\n「來源異同」\\nTVBS 新聞網與風傳媒對管制時段（17 時至 20 時）、紅燈分批放行節奏（進站 10 分鐘、暫停 5 分鐘）及 20 班全車自由座加開班次報導完全一致。風傳媒額外披露高鐵預估紅燈警戒排隊時間約 45 分鐘至 1 小時；TVBS 則補充 27 日指定 10 班紅眼列車提供標準車廂對號座 77 折優惠。\\n「仍不確定」\\n高鐵表示將視現場排隊狀況機動調整，不排除延長閘門管制時間；實際晚間尖峰排隊長度及對台北捷運連通道人流的回堵影響，仍待尖峰時段結束後觀察。\"},\"glossary\":[{\"term\":{\"en\":\"Non-Reserved Seating\",\"zh-TW\":\"自由座\"},\"blurb\":{\"en\":\"Unassigned high-speed rail tickets allowing passengers to board any open seat in designated cars on the day of travel.\",\"zh-TW\":\"高鐵不劃位車票，旅客可於乘車當日搭乘指定自由座車廂的空位。\"}},{\"term\":{\"en\":\"Red-Alert Queue Status\",\"zh-TW\":\"紅燈警戒\"},\"blurb\":{\"en\":\"THSR's highest crowd-density indicator signaling station wait times of roughly 45 to 60 minutes.\",\"zh-TW\":\"台灣高鐵人潮燈號最高等級，代表車站自由座預估排隊時間達 45 分鐘至 1 小時。\"}},{\"term\":{\"en\":\"T-EX App\",\"zh-TW\":\"T-EX 行動購票\"},\"blurb\":{\"en\":\"Taiwan High Speed Rail's official mobile application for ticket booking, QR boarding, and live station crowd alerts.\",\"zh-TW\":\"台灣高鐵官方行動購票應用程式，提供訂票、手機通關及即時車站人潮燈號查詢。\"}}],\"sources\":[{\"name\":\"TVBS 新聞網\",\"url\":\"https://news.tvbs.com.tw/life/4056477\"},{\"name\":\"風傳媒\",\"url\":\"https://www.storm.mg/lifestyle/11184056\"}],\"imageUrl\":\"/covers/live/live-taiwan-051-thsr-non-reserved-gate-control.jpg\",\"imageAlt\":{\"en\":\"Commuters queuing at a Taiwan High Speed Rail station gate ahead of election travel\",\"zh-TW\":\"選舉返鄉尖峰期間旅客於台灣高鐵車站閘門前排隊候車\"},\"isHeadline\":false,\"isPopular\":true,\"trustScore\":86,\"trustBreakdown\":{\"crossCorroboration\":22,\"outletReputation\":21,\"recencyClarity\":23,\"sourceDiversity\":20},\"publishedAt\":\"2026-11-27T14:28:54.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":5,\"D2\":4,\"D3\":4,\"D4\":4,\"D5\":4,\"total\":21},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-taiwan-051-thsr-non-reserved-gate-control/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-taiwan-051-thsr-non-reserved-gate-control/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"d:\"$8:metadata\"\n"])</script></body></html>
