nts are still needed. The summaries did not state which researchers or institutions produced either result, or whether the advances are connected.\nWhy it matters\nThe judgment is direct: operating five silicon qubits together at about 99.9 percent accuracy addresses the scaling obstacle limiting larger processors, while linking chips addresses a separate hardware limit. Bigger computers need both, but readers should not treat the two headlines as one breakthrough.\nSources agree / disagree\nScienceDaily AI and Science covered different headlines in this cluster, so neither outlet corroborates the other's specific advance in the summaries provided. Trust label: Bundled stories — two distinct quantum-computing headlines were grouped in one cluster.\nStill uncertain\nThe summaries did not state the researchers, methods, publication details, or error definition behind the 99.9 percent figure. They did not state how IBM linked the chips or what improvements are still needed. Verify the full reporting before quoting either advance."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-ai-02-scientists-overcome-a-hi\",\"category\":\"ai\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-ai-02-scientists-overcome-a-hi.webp\",\"imageAlt\":{\"en\":\"Cover related to: Scientists overcome a hidden obstacle to more powerful quantum computers\",\"zh-TW\":\"相關封面圖：科學家克服了更強大的量子電腦的隱藏障礙\"},\"publishedAt\":\"2026-10-27T06:10:00.000Z\",\"title\":{\"en\":\"IBM Links Two Quantum Chips as Silicon Qubits Reach 99.9 Percent Accuracy\",\"zh-TW\":\"IBM 連結兩枚量子晶片，矽量子位元準確度達 99.9%\"},\"summary\":{\"en\":\"Scientists operated five silicon qubits at once with about 99.9 percent accuracy, opening the door to larger and more powerful quantum processors. A separate report says IBM linked two quantum chips with superconducting cables, so the two distinct advances should be watched separately, not as one breakthrough.\",\"zh-TW\":\"科學家讓 5 個矽量子位元同時運行並維持約 99.9% 的準確度，為更大量子處理器打開大門；另一報導稱 IBM 連結兩枚量子晶片，兩項不同進展應分開看待，後續驗證值得關注。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"科學家找到以極高精度同時操作多個矽量子位元的方法，5 個量子位元同時運行時仍維持約 99.9% 的準確度；另一則報導則描述 IBM 連結兩枚量子晶片。\\n發生了什麼事\\n根據 ScienceDaily 的摘要，矽量子位元技術克服了擴大量子電腦規模的重大挑戰，為更大、更強大的量子處理器打開大門，5 個量子位元同時運行時仍維持約 99.9% 的準確度。同一集群的第二個標題描述另一項進展：IBM 連結兩枚量子晶片，是邁向更大電腦的關鍵一步。摘要只補充，超導電纜連接不同晶片上的量子位元，但仍需要改進。摘要沒有說明哪位研究人員、哪個機構或哪篇論文得出上述結果，也沒有說明兩項進展是否相關。\\n為什麼重要\\n判斷很直接：5 個矽量子位元同時運行仍維持約 99.9% 的準確度，處理的是限制處理器擴大的障礙；連結晶片則處理另一項硬體限制。更大的量子電腦既需要更多量子位元協同運作，也需要連結不同晶片的方法，兩項進展各有意義，不應被視為同一突破。\\n來源異同\\nScienceDaily AI 與 Science 各自報導了不同的標題，摘要中沒有一方佐證另一方的具體進展。信任標籤：捆綁多則——同一集群收錄了兩則不同的量子運算標題。\\n仍不確定\\n摘要沒有說明 99.9% 數字背後的研究人員、機構、方法、發表資訊或誤差定義；也沒有說明 IBM 如何連結晶片、展示了什麼，或仍需哪些改進。引用其中任何一項進展前，請查閱完整報導。\"},\"sources\":[{\"name\":\"ScienceDaily AI\",\"url\":\"https://www.sciencedaily.com/releases/2026/10/261024222024.htm\"},{\"name\":\"Science 科學新聞\",\"url\":\"https://www.science.org/content/article/ibm-links-two-quantum-chips-key-step-toward-bigger-computers\"}],\"disagreements\":null,\"trustScore\":63,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":15,\"crossCorroboration\":14,\"recencyClarity\":20},\"tags\":[\"ai\",\"live-ingest\",\"sciencedaily-ai\",\"science-科學新聞\"],\"glossary\":[{\"blurb\":{\"en\":\"Basic unit of quantum computing discussed in the silicon-qubit result.\",\"zh-TW\":\"矽量子位元結果中討論的量子運算基本單位。\"},\"term\":{\"en\":\"Silicon qubit\",\"zh-TW\":\"矽量子位元\"}},{\"blurb\":{\"en\":\"Company described as linking two quantum chips toward bigger computers.\",\"zh-TW\":\"被描述為連結兩枚量子晶片、邁向更大電腦的公司。\"},\"term\":{\"en\":\"IBM\",\"zh-TW\":\"IBM\"}},{\"blurb\":{\"en\":\"Outlet that reported scientists overcoming a hidden obstacle to more powerful quantum computers.\",\"zh-TW\":\"報導科學家克服更強大量子電腦隱藏障礙的媒體。\"},\"term\":{\"en\":\"ScienceDaily\",\"zh-TW\":\"ScienceDaily\"}},{\"blurb\":{\"en\":\"Publication whose article described IBM linking two quantum chips.\",\"zh-TW\":\"其文章描述 IBM 連結兩枚量子晶片的刊物。\"},\"term\":{\"en\":\"Science\",\"
