ests read as more than a single demonstration: they signal a shift in social expectations from optimism to pessimism, and if mainstream parties cannot absorb that discontent, the political map could tilt further toward the far right.\n\nSources agree / disagree\nTrust label: Single source — the entire card rests on one CNA dispatch from Berlin, with no other outlet corroborating the protests or Mau's remarks in the feed items, so the scale of the demonstrations and the full context of his comments remain unconfirmed by a second source.\n\nStill uncertain\nThe summary gives no protest turnout figures, cities, locations, specific demands, or organizing groups, and it does not state the occasion of Mau's remarks or their full wording. Those missing facts are the key information needed before judging how large the movement is or how far the far right might gain."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-03-ha000a20e\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-taiwan-03-ha000a20e.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 德國青年示威反映未來焦慮　學者：悲觀助長政治極化\",\"zh-TW\":\"相關封面圖：德國青年示威反映未來焦慮　學者：悲觀助長政治極化\"},\"publishedAt\":\"2026-11-08T00:41:25.000Z\",\"title\":{\"en\":\"German Youth Protests Reflect Anxiety About the Future, Scholar Warns Pessimism Fuels Polarization\",\"zh-TW\":\"德國青年全國示威　學者史蒂芬．毛：悲觀情緒助長政治極化\"},\"summary\":{\"en\":\"[Unverified-single-source] Germany has seen nationwide youth protests in recent days, reflecting young people's anxiety about the future, CNA (中央社) reported from Berlin on Nov. 7. Sociologist Steffen Mau (史蒂芬．毛) said German society is shifting from believing life will keep improving to fearing steady national decline, a pessimism he argues will benefit the far-right Alternative for Germany.\",\"zh-TW\":\"［未證實·單一來源］（中央社記者林尚縈柏林7日專電）德國近日爆發全國性青年示威，年輕世代對未來的不安浮上檯面。社會學家史蒂芬．毛指出，德國社會正從相信生活會愈來愈好，轉向普遍擔憂國家持續衰退，傳統政黨無力回應，極右翼另類選擇黨將從中受益。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"（中央社記者林尚縈柏林7日專電）德國近日爆發全國性青年示威，反映年輕世代對未來的不安。德國知名社會學家史蒂芬．毛指出，德國社會正從相信生活會愈來愈好，轉向普遍擔憂國家持續衰退。\\n\\n發生了什麼事\\n德國近日爆發全國性青年示威，年輕世代對未來的不安浮上檯面。史蒂芬．毛在中央社柏林專電中指出，德國社會心態正由樂觀轉向悲觀。傳統政黨無力回應民眾的不滿，極右翼另類選擇黨將從中受益。\\n\\n為什麼重要\\n對德國政局而言，青年走上街頭不只是單一抗議，而是社會預期由樂觀轉悲觀的訊號，傳統政黨若接不住這股不滿，政治版圖可能向極右翼傾斜。\\n\\n來源異同\\n信任標籤：單一來源——全卡僅中央社一則柏林專電，暫無其他媒體佐證，示威規模、訴求與史蒂芬．毛談話的完整脈絡皆未經交叉核對。\\n\\n仍不確定\\n摘要未給示威人數、城市、地點、具體訴求與發起團體，也未說明史蒂芬．毛發言場合與完整說法。缺失的關鍵資訊正是示威規模與訴求，須待更多報導補齊。\"},\"sources\":[{\"name\":\"中央社-國際\",\"url\":\"https://www.cna.com.tw/news/aopl/202611080014.aspx\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"中央社-國際\"],\"glossary\":[{\"term\":{\"en\":\"Steffen Mau (史蒂芬．毛)\",\"zh-TW\":\"史蒂芬．毛\"},\"blurb\":{\"en\":\"German sociologist commenting on social pessimism and polarization.\",\"zh-TW\":\"評論社會悲觀情緒與政治極化的德國社會學家。\"}},{\"term\":{\"en\":\"Alternative for Germany (AfD)\",\"zh-TW\":\"另類選擇黨\"},\"blurb\":{\"en\":\"Far-right German political party cited as a beneficiary of public discontent.\",\"zh-TW\":\"被指將受惠於民眾不滿的德國極右翼政黨。\"}},{\"term\":{\"en\":\"CNA\",\"zh-TW\":\"中央社\"},\"blurb\":{\"en\":\"Taiwanese news agency that filed the Berlin dispatch.\",\"zh-TW\":\"發出柏林專電的台灣通訊社。\"}},{\"term\":{\"en\":\"Lin Shang-ying (林尚縈)\",\"zh-TW\":\"林尚縈\"},\"blurb\":{\"en\":\"CNA correspondent in Berlin who filed the dispatch.\",\"zh-TW\":\"發出柏林專電的中央社記者。\"}},{\"term\":{\"en\":\"German youth protests\",\"zh-TW\":\"德國青年示威\"},\"blurb\":{\"en\":\"Nationwide demonstrations by young Germans reported in the dispatch.\",\"zh-TW\":\"專電報導的德國全國性青年示威。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axio
