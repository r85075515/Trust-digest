 FTV has since confirmed the deal is off.\nWhat happened\nReports said Shen would cameo next week in the 8pm drama \"Tofu Mama,\" and FTV confirmed talks were underway. Shen then posted on social media that he has no plans to appear; the post drew 27,000 likes. FTV confirmed the cameo is off. A film critics' association supervisor criticized the show over a January on-set accident in which an actor was seriously hurt, and urged Shen to think twice; commentator Feng Xianxian worried the cameo would be mere political showmanship and urged him to say no.\nWhy it matters\nThe judgment is about political stagecraft: a candidate with that kind of social reach doesn't need a drama cameo, and the one-day walk-back shows his team read the room on political-show optics fast. The episode doubles as a reminder that in Taiwan's entertainment-politics crossover market, the announcement and the denial can both be the news.\nSources agree / disagree\nYahoo TW Entertainment， the Liberty Times, Google News, and LINE TODAY/EBC all report the same reversal arc — rumor, Shen's denial, FTV's confirmation that talks collapsed — with no conflicting details. Trust label: Contradicted — the cameo claim was shot down by Shen himself within a day.\nStill uncertain\nWhether FTV's initial confirmation was premature or a trial balloon isn't clear from the snippets, and the January on-set accident details are thin. Verify in full reporting before characterizing either. A separate item in the cluster — debate negotiations between the Chiang Wan-an and Shen camps over the Taipei mayoral TV debate — is a different story."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-eastAsiaGossip-02-ebc-line-today\",\"category\":\"eastAsiaGossip\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-eastAsiaGossip-02-ebc-line-today.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 沈伯洋將登八點檔？傳下週客串《豆腐媽媽》電視台證實曝最新進度 | EBC 東森娛樂 - LINE TODAY\",\"zh-TW\":\"相關封面圖：沈伯洋將登八點檔？傳下週客串《豆腐媽媽》電視台證實曝最新進度 | EBC 東森娛樂 - LINE TODAY\"},\"publishedAt\":\"2026-10-12T15:19:17.000Z\",\"title\":{\"en\":\"Puma Shen Denies 'Tofu Mama' Cameo After TV Station Confirmed Talks\",\"zh-TW\":\"沈伯洋打臉客串傳聞：《豆腐媽媽》先證實接洽中，他親發文「並沒有演出的計劃」\"},\"summary\":{\"en\":\"Taipei mayoral candidate Puma Shen — his denial post drew 27,000 likes — has denied he will cameo in the FTV drama 'Tofu Mama,' after the station confirmed talks were underway. The reversal is the story: a rumored crossover collapsed within a day. Next watch is the mayoral debate negotiations.\",\"zh-TW\":\"台北市長候選人沈伯洋——否認貼文吸2.7萬讚——打臉自己客串民視八點檔《豆腐媽媽》的傳聞，親發文「並沒有演出的計劃」；此前民視才證實接洽中。傳聞一日內反轉破局；接下來看他與蔣萬安的市長辯論協商。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"沈伯洋說，他「並沒有演出的計劃」——親手掐死了民視八點檔《豆腐媽媽》客串傳聞，而電視台稍早才證實接洽中。這位台北市長候選人的否認貼文吸了2.7萬讚；民視隨後證實合作破局。\\n發生了什麼事\\n傳聞指沈伯洋下週將客串八點檔《豆腐媽媽》，民視證實接洽中。沈伯洋隨後在社群發文「並沒有演出的計劃」，貼文吸2.7萬讚；民視證實客串破局。影評人協會監事批評該劇1月曾發生演員重摔險送命的片場意外，呼籲沈伯洋三思；評論人馮賢賢則憂心淪為政治作秀，喊話請說不。\\n為什麼重要\\n這是政治舞台劇的判斷：社群聲量到這個等級的候選人，不需要靠客串八點檔刷存在感；一日內的急轉彎，說明他的團隊對「政治作秀」觀感讀得很準。這集也提醒：在台灣娛樂與政治的跨界市場裡，宣布和否認可以同時是新聞。\\n來源異同\\nYahoo TW 娛樂、自由時報、Google News、LINE TODAY／東森娛樂報導的反轉軸線一致——傳聞、沈伯洋否認、民視證實破局——沒有矛盾細節。信任標籤：打臉——客串說法一日內被沈伯洋本人親手打臉。\\n仍不確定\\n民視最初的證實是操之過急還是試水溫，來源摘要看不出來；1月片場意外的細節也很薄。定調前請查閱完整報導。同批另有一則蔣萬安與沈伯洋陣營協商台北市長電視辯論的新聞，是不同事件。\"},\"sources\":[{\"name\":\"Yahoo TW 娛樂\",\"url\":\"https://tw.news.yahoo.com/%E6%B2%88%E4%BC%AF%E6%B4%8B%E6%80%A5%E8%BD%89%E5%BD%8E%E4%B8%8D%E5%AE%A2%E4%B8%B2-%E8%B1%86%E8%85%90%E5%AA%BD%E5%AA%BD-%E7%A4%BE%E7%BE%A4%E7%99%BC%E6%96%87-%E4%B8%A6%E6%B2%92%E6%9C%89%E6%BC%94%E5%87%BA%E7%9A%84%E8%A8%88%E5%8A%83-%E6%B0%91%E8%A6%96%E5%9B%9E%E6%87%89%E4%BA%86-150600418.html\"},{\"name\":\"自由時報\",\"url\":\"https://news.ltn.com.tw/news/politics/breakingnews/5604048\"},{\"name\":\"Google News\",\"url\":\"https://news.google.com/rss/articles/CBMiUkFVX3lxTFA0bXRyeVFqOGMyS1ZlYUtPOTVjbnpaYUNMRGVESE01VnVOMkZmTS1iZGhmd255MTFsTDRrRTBIZ1hURnpFRmdEMU11WkVtNzBGcVE?oc=5\"},{\"name\":\"today.line.me\",\"url\":\"https://news.google.com/
