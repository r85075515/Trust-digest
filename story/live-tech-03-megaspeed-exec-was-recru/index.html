n. The wording matters: the memo \"reportedly claimed\" the recruitment, so the story is a claim about a document, not proof of spying.\n\nWhy it matters\nIf true, the allegation would mean a foreign intelligence service targeted the head of the company at the center of the global AI chip race — but until the memo itself is verified, the story's weight rests entirely on one document's credibility.\n\nSources agree / disagree\nTrust label: Single source — only TechCrunch has reported this story in the material provided, and the underlying memo has not been independently corroborated. No conflicting figures or names appear in the short feed summary.\n\nStill uncertain\nThe memo itself has not been published or independently verified in the material provided, the executive is unnamed, and no response from Megaspeed, Nvidia, or Chinese authorities appears in the summary. Readers should treat the recruitment claim as unconfirmed and check the TechCrunch story for updates."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-tech-03-megaspeed-exec-was-recru\",\"category\":\"tech\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-tech-03-megaspeed-exec-was-recru.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Megaspeed exec was recruited to spy on Nvidia CEO, according to US intelligence memo\",\"zh-TW\":\"相關封面圖：根據美國情報備忘錄，Megaspeed 高層被招募來監視 Nvidia 執行長\"},\"publishedAt\":\"2026-11-07T21:17:08.000Z\",\"title\":{\"en\":\"Megaspeed Executive Was Recruited to Spy on Nvidia CEO, U.S. Intelligence Memo Reportedly Says\",\"zh-TW\":\"輝達（Nvidia）執行長遭監視疑雲：美情報備忘錄指中國國安部招募 Megaspeed 高層\"},\"summary\":{\"en\":\"[Unverified-single-source] A U.S. intelligence memo circulated earlier this year reportedly claimed China's Ministry of State Security recruited a female technology executive to spy on Nvidia's CEO, TechCrunch reports — the claim comes from the memo, not from confirmed evidence, and the executive is not named in the material provided.\",\"zh-TW\":\"［未證實·單一來源］《TechCrunch》報導，今年稍早流傳的一份美國情報備忘錄據稱指出，中國國家安全部招募一名女性科技高層監視輝達（Nvidia）執行長；指控出自備忘錄，非已證實的證據，且當事人未具名。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"《TechCrunch》報導，今年稍早流傳的一份美國情報備忘錄據稱指出，中國國家安全部招募一名女性科技高層，監視輝達（Nvidia）執行長。\\n\\n發生了什麼事\\n這份今年稍早流傳的備忘錄據稱指出，中國國家安全部招募一名女性科技高層——標題稱其為 Megaspeed 高層——監視輝達（Nvidia）執行長。《TechCrunch》把這項說法報導為備忘錄的內容，而非已確立的事實；摘要未具名這名高層，也未說明備忘錄的作者、日期或密級。用詞值得留意：備忘錄是「據稱指出」招募一事，這是一則關於文件的說法，不是間諜行為的證據。\\n\\n為什麼重要\\n若指控屬實，意味外國情報機關鎖定了全球人工智慧（AI）晶片競賽核心企業的掌舵者；但在備忘錄本身獲得核實之前，這則消息的分量完全取決於一份文件的可信度。\\n\\n來源異同\\n信任標籤：單一來源——本批資料中僅《TechCrunch》一家報導，備忘錄本身亦未獲獨立佐證；摘要內未見數字或人名衝突。\\n\\n仍不確定\\n備忘錄未公開、未獲獨立核實，當事人未具名，摘要中也未見 Megaspeed、輝達（Nvidia）或中方回應。招募指控應視為未證實，後續以《TechCrunch》原文更新為準。\"},\"sources\":[{\"name\":\"TechCrunch\",\"url\":\"https://techcrunch.com/2026/11/07/chinese-exec-was-recruited-to-spy-on-nvidia-ceo-according-to-us-intelligence-memo/\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":18,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"tech\",\"live-ingest\",\"techcrunch\"],\"glossary\":[{\"term\":{\"en\":\"Nvidia\",\"zh-TW\":\"輝達\"},\"blurb\":{\"en\":\"A U.S. chipmaker whose graphics processors power much of the AI industry.\",\"zh-TW\":\"美國晶片大廠，其圖形處理器支撐大量人工智慧（AI）應用。\"}},{\"term\":{\"en\":\"Ministry of State Security\",\"zh-TW\":\"國家安全部\"},\"blurb\":{\"en\":\"China's civilian intelligence and security agency.\",\"zh-TW\":\"中國的情報與安全機關。\"}},{\"term\":{\"en\":\"intelligence memo\",\"zh-TW\":\"情報備忘錄\"},\"blurb\":{\"en\":\"An internal document summarizing intelligence findings or claims.\",\"zh-TW\":\"彙整情報發現或說法的內部文件。\"}},{\"term\":{\"en\":\"Megaspeed\",\"zh-TW\":\"Megaspeed\"},\"blurb\":{\"en\":\"The company named in the headline as the recruited executive's employer.\",\"zh-TW\":\"標題所稱被招募高層任職的公司。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device
