ion USD worth of garment orders out of Bangladesh between November 1 and November 18, 2026, according to industry reports citing Bangladeshi factory owners published on November 27. The diverted volume represents nearly one-tenth of Bangladesh's monthly apparel orders and comes after weeks of escalating wage protests, factory shutdowns, and highway blockades across Dhaka, Gazipur, and Narayanganj, alongside rising production costs and energy shortages. Neighboring India absorbed the largest share of the reallocated orders, while Vietnam, Cambodia, and Indonesia also picked up contracts.\n\n「Why it matters」\nReady-made garments form the backbone of Bangladesh's economy, employing roughly four million workers, generating about 80 percent of export earnings, and contributing around 10 percent of national GDP. A rapid 10 percent monthly order outflow underscores how prolonged labor and energy disruptions can swiftly reshape South and Southeast Asian apparel supply chains, lifting Indian textile equities such as Gokaldas Exports and Trident on November 27.\n\n「Source differences」\nIndia Today (titled \"Zara, H\u0026M move orders worth $250 million out of unrest-hit Bangladesh, India gains big\") and The Indian Express (titled \"Zara, H\u0026M and M\u0026S shift $254 million in garment orders from Bangladesh to India amid unrest\") both cite Reuters reporting based on three Bangladeshi factory owners regarding the 254 million USD shift between November 1 and 18 and resulting gains in Indian textile shares. Mint (titled \"Zara, H\u0026M, M\u0026S shift $254 million in orders from Bangladesh ... - Mint\") similarly highlights India receiving the largest share alongside diversions to Vietnam, Cambodia, and Indonesia.\n\n「Still uncertain」\nWhether the order reallocation remains a temporary holiday-season hedge by global retailers or evolves into a permanent structural shift away from Bangladeshi suppliers depends on how quickly factory operations, wage negotiations, and power reliability stabilize.\n\nTrust label: Multi-source agreement — Corroborated across multiple major Indian business and news outlets reporting on Reuters interviews with Bangladeshi garment factory owners."])</script><script>self.__next_f.push([1,"11:T8b1,"])</script><script>self.__next_f.push([1,"「發生了什麼事」\n根據 2026 年 11 月 27 日引述路透社採訪孟加拉成衣廠業者的報導，包括 Zara、H\u0026M、Marks \u0026 Spencer 與 Celio 在內的國際快時尚與服飾零售商，於 11 月 1 日至 18 日期間將總值約 2.54 億美元（USD）的成衣訂單撤出孟加拉。這筆轉移訂單規模約占孟加拉單月成衣接單量的十分之一。背景原因在於當地自 10 月下旬起爆發要求調高最低工資的勞工抗議並演變為達卡、加濟布爾及納拉揚甘傑等紡織重鎮的罷工與停工潮，疊加生產成本上升與能源供應短缺。轉出訂單主要由鄰國印度承接最大份額，越南、柬埔寨與印尼亦分食部分產能。\n\n「為什麼重要」\n成衣製造業是孟加拉經濟命脈，僱用約 400 萬名勞工，貢獻約八成出口外匯收入與約一成國內生產毛額（GDP）。單月近一成訂單快速外流顯示供應鏈對交期穩定度的高度敏感，不僅使孟加拉出口面臨嚴峻考驗，也直接激勵 Gokaldas Exports、Trident 等印度紡織類股於 11 月 27 日股價顯著上漲。\n\n「來源異同」\n今日印度（頁面標題為「Zara, H\u0026M move orders worth $250 million out of unrest-hit Bangladesh, India gains big」）與印度快報（頁面標題為「Zara, H\u0026M and M\u0026S shift $254 million in garment orders from Bangladesh to India amid unrest」）均引述路透社對三名孟加拉工廠業者的訪談，一致指出 11 月 1 日至 18 日期間共有約 2.54 億美元訂單轉往印度並帶動印度紡織股走強。印度財經媒體 Mint（頁面標題為「Zara, H\u0026M, M\u0026S shift $254 million in orders from Bangladesh ... - Mint」）亦確認印度取得最大轉單比重，並補充越南、柬埔寨與印尼同為替代採購去向。\n\n「仍不確定」\n此波約 2.54 億美元的轉單究竟僅屬國際品牌因應年底交期風險的短期避險調度，抑或將轉化為長期結構性的供應鏈移轉，仍取決於孟加拉勞資協商進展、工廠復工狀況及電力供應能否盡快回穩。\n\nTrust label: Multi-source agreement — 多家主流媒體引述路透社對孟加拉成衣廠業者的實地採訪，核心數據與受惠市場一致。"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-218-bangladesh-garment-orders-shift-india\",\"category\":\"finance\",\"title\":{\"en\":\"Zara, H\u0026M and M\u0026S Shift USD 254 Million in Garment Orders Out of Bangladesh Amid Labor Unrest\",\"zh-TW\":\"孟加拉工潮衝擊成衣供應鏈 Zara、H\u0026M 等品牌轉移 2.54 億美元訂單赴印度\"},\"summary\":{\"en\":\"Global apparel retailers including Zara, H\u0026M, Marks \u0026 Spencer, and Celio diverted roughly USD 254 million in garment orders out of Bangladesh between November 1 and 18, 2026, amid prolonged worker protests, with India capturing the lar
