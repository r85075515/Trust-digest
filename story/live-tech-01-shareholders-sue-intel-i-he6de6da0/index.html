 a single day on October 30. The shareholders accuse the company of misleading them about the impact of the PC sales slump on Intel's revenue and profitability.\nWhat happened\nThe lawsuit was filed on a Friday in federal court in San Jose, California, and seeks class-action certification. The filing lists the City of Southfield Fire and Police Retirement System, and the shareholders claim that Tan and Zinsner failed to properly disclose the full impact of waning PC demand on the company's revenue and profitability. Ars Technica and ESG Dive both report the suit and the same stock drop, and both identify the chief executive and the chief financial officer as defendants alongside Intel.\nWhy it matters\nThe claim goes to disclosure, not only to the size of the stock fall. Investors rely on company statements to judge how a slowdown in PC sales affects revenue and profit, so the question is whether Intel disclosed that impact fully and in time. A class-action suit also matters because it could broaden the dispute beyond the named plaintiff to other shareholders who bought during the period at issue, and because its outcome may affect how the company describes demand risks in future statements.\nSources agree / disagree\nArs Technica and ESG Dive agree that shareholders sued Intel, Tan and Zinsner, that the alleged misleading statements concerned the PC sales slump, and that the stock fell 28.6 percent in one day on October 30. No clear conflict in names or figures appears in the short feed descriptions. Trust label: Two-source agreement — Two outlets report the same defendants, the same allegation and the same stock drop.\nStill uncertain\nThe feed material does not give the exact Friday filing date, the full list of plaintiffs, the period covered by the proposed class, or the specific statements the shareholders say were misleading. It also does not report Intel's response or any court ruling, since the suit is at the filing stage. Those details require the lawsuit itself and the full reporting from the linked outlets."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-tech-01-shareholders-sue-intel-i-he6de6da0\",\"category\":\"tech\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-tech-01-shareholders-sue-intel-i-he6de6da0.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Shareholders sue Intel, its CEO, and CFO after stock drops 28.6 percent in one day\",\"zh-TW\":\"相關封面圖：英特爾股價一天內下跌 28.6%，股東起訴英特爾及其執行長和財務長\"},\"publishedAt\":\"2026-11-19T15:59:00.000Z\",\"title\":{\"en\":\"Intel Shareholders Sue Chipmaker, CEO and CFO After 28.6 Percent Stock Drop\",\"zh-TW\":\"英特爾（Intel）股價單日重挫百分之二十八點六，股東起訴公司、執行長與財務長\"},\"summary\":{\"en\":\"Intel shareholders have sued the chipmaker, chief executive Lip-Bu Tan and chief financial officer David Zinsner, alleging they misled investors about the PC sales slump behind a 28.6 percent one-day stock drop on October 30. The suit, filed in San Jose, seeks class-action certification.\",\"zh-TW\":\"英特爾（Intel）股東起訴這家晶片製造商、執行長陳立武（Lip-Bu Tan）與財務長大衛·津斯納（David Zinsner），指控他們就個人電腦銷售下滑的影響誤導投資人，該下滑導致十月三十日股價單日下跌百分之二十八點六。這起在聖荷西（San Jose）提起的訴訟尋求集體訴訟認證。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"英特爾（Intel）股價在十月三十日單日下跌百分之二十八點六後，股東起訴這家晶片製造商、執行長陳立武（Lip-Bu Tan）與財務長大衛·津斯納（David Zinsner）。股東指控公司就個人電腦銷售下滑對英特爾營收與獲利的影響誤導投資人。\\n發生了什麼事\\n這起訴訟於週五在加州聖荷西（San Jose）的聯邦法院提起，尋求集體訴訟認證。訴狀列出南菲爾德市消防與警察退休制度（City of Southfield Fire and Police Retirement System），股東主張陳立武與津斯納未充分揭露個人電腦需求下滑對公司營收與獲利的完整影響。科技媒體阿斯技術（Ars Technica）與環境社會治理深潛（ESG Dive）均報導這起訴訟與同一波股價下跌，並指出執行長與財務長與英特爾一同被列為被告。\\n為什麼重要\\n本案關鍵在於資訊揭露，而不只是股價跌幅。投資人仰賴公司說法來判斷個人電腦銷售放緩如何影響營收與獲利，因此問題在於英特爾是否完整且及時揭露該影響。集體訴訟也很重要，因為它可能把爭議擴大到在相關期間買進股票的其他股東，也可能影響公司日後如何描述需求風險。\\n來源異同\\n阿斯技術與環境社會治理深潛一致指出，股東起訴英特爾、陳立武與津斯納，所指誤導言論與個人電腦銷售下滑有關，股價在十月三十日單日下跌百分之二十八點六。簡短素材中未見人名或數字上的明顯衝突。信任標籤：2源一致——兩家媒體報導相同的被告、相同的指控與相同的股價跌幅。\\n仍不確定\\n素材未提供提起訴訟的確切週五日期、原告完整名單、擬議集體訴訟涵蓋期間，也未指明股東認為具有誤導性的具體說法。素材亦未報導英特爾的回應或法院裁決，因為訴訟仍在提起階段。這些細節需查閱訴狀本身與相關媒體的完整報導。\"},\"sources\":[{\"name\":\"Ars Technica\",\"url\":\"https://arstechnica.com/tech-policy/2026/11/shareholders-sue-intel-its-ceo-and-cfo-after-stock-drops-28-6-percent-in-one-day/\"},{\"name\":\"ESG Dive\",\"url\":\"https://www.esgdive.com/news/intel-shareholders-sue-ceo-cfo-stock-drop-ai-cpu/875174/\"}],\"disagreements\":null,\"trustScore\":60,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":17,\"crossCorroboration\":14,\"recencyClarity\":15},\"tags\":[\"tech\",\"live-ingest\",\"ars-technica\",\"esg-dive\"],\"glossary\":[{\"term\":{\"en\":\"Intel\",\"zh-TW\":\"英特爾\"},\"blurb\":{\"en\":\"A chipmaker whose shareholders sued the company after a sharp stock drop.\",\"zh-TW\":\"股價大跌後遭股東起訴的晶片製造商。\"}},{\"term\":{\"en\":\"Lip-Bu Tan\",\"zh-TW\":\"陳立武\"},\"blurb\":{\"en\":\"The chief executive of Intel and a defendant in the shareholders' lawsuit.\",\"zh-TW\":\"英特爾執行長，也是股東訴訟的被告之一。\"}},{\"term\":{\"en\":\"David Zinsner\",\"zh-TW\":\"大衛·津斯納\"},\"blurb\":{\"en\":\"The chief financial officer of Intel and a defendant in the shareholders' lawsuit.\",\"zh-TW\":\"英特爾財務長，也是股東訴訟的被告之一。\"}},{\"term\":{\"en\":\"City of Southfield Fire and Police Retirement System\",\"zh-TW\":\"南菲爾德市消防與警察退休制度\"},\"blurb\":{\"en\":\"A retirement system named in the filing for the shareholders' lawsuit.\",\"zh-TW\":\"訴狀中列出的退休制度。\"}},{\"term\":{\"en\":\"Ars Technica\",\"zh-TW\":\"阿斯技術\"},\"blurb\":{\"en\":\"A technology news outlet that reported the lawsuit against Intel.\",\"zh-TW\":\"報導這起英特爾訴訟的科技新聞媒體。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}
