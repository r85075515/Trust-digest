) customs declaration app starting December 3, 2026. Foreign nationals holding chip resident certificates who register via SMS verification will be required to complete physical NHI card insertion verification before using the app, while existing domestic and foreign users registered via SMS verification will receive phased in-app push notifications to complete supplemental verification. Users originally registered via telecom authentication or Citizen Digital Certificate remain unaffected.\n\n「Why it matters」\nCross-border online shoppers in Taiwan rely on EZ WAY for mandatory real-name customs clearance. Following the October 28, 2025 rollout targeting new domestic SMS registrants, expanding card-reader verification closes identity-theft loopholes where non-owner mobile numbers or prepaid SIMs were exploited to import illicit goods under unsuspecting individuals' names.\n\n「Source differences」\nFTV News (民視新聞網), titled \"網購族快看！EZ WAY身分驗證新制上路了 「這類用戶」收貨恐受影響\", details the two-step card-reader process via the National Health Insurance Administration portal and Customs' single-window system (MI52), noting public libraries and the Taipei customs service counter as options for users without card readers. UDN Tech (聯合新聞網), titled \"網購族注意！EZ WAY新制12月3日上路2類用戶須完成健保卡驗證\", and Newtalk (新頭殼), titled \"網購族注意！EZ WAY 12/3起擴大健保卡插卡驗證2類用戶不受影響\", similarly summarize the affected user groups and unaffected authentication methods.\n\n「Still uncertain」\nThe Customs Administration has not published a fixed final deadline for existing SMS-verified users to complete supplemental verification once they receive phased push notifications, nor has it disclosed the exact batch schedule.\n\nTrust label: Multi-source agreement — Multiple Taiwanese news outlets consistently report the exact scope, effective date, and operational procedures from the Customs Administration's announcement."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-251-ezway-nhic-verification\",\"category\":\"taiwan\",\"title\":{\"en\":\"Taiwan Customs to Mandate NHI Card Verification for More EZ WAY Users Starting Dec. 3\",\"zh-TW\":\"關務署12月3日起擴大EZ WAY健保卡插卡驗證，外籍新戶與既有簡訊認證戶須配合\"},\"summary\":{\"en\":\"Taiwan's Customs Administration announced that starting December 3, 2026, foreign nationals registering for the EZ WAY customs app with a chip resident certificate via SMS must complete physical National Health Insurance (NHI) card verification, while existing SMS-verified domestic and foreign users will receive phased push notifications for supplemental verification.\",\"zh-TW\":\"財政部關務署宣布，2026年12月3日起「EZ WAY易利委」APP擴大實施實體健保卡插卡驗證，持晶片居留證採簡訊認證的外籍新註冊者須完成驗證才能使用，既有簡訊認證本國與外籍用戶則將分批收到推播通知辦理補驗證，以防個資遭冒用進口違規貨物。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n財政部關務署宣布，關貿網路公司將自2026年12月3日起擴大「EZ WAY易利委」APP實體健保卡插卡驗證機制。持晶片居留證並採簡訊認證的外籍新註冊者，須完成實體健保卡插卡驗證方可使用APP；同時，既有採用簡訊認證的本國籍與外籍用戶，也將陸續收到APP推播通知辦理補驗證。原本透過電信認證或自然人憑證註冊的用戶則不受影響。\\n\\n「為什麼重要」\\n跨境網購族透過快遞寄送貨物回台均須經EZ WAY辦理實名認證報關。繼2025年10月28日針對國人簡訊認證新戶實施插卡驗證後，本次將外籍新戶與既有簡訊認證舊戶納入，可防堵非本人門號或預付卡遭冒名註冊並進口違規貨物所衍生的法律風險。\\n\\n「來源異同」\\n民視新聞網以「網購族快看！EZ WAY身分驗證新制上路了 「這類用戶」收貨恐受影響」為題，完整列出先至健保署網站取得註冊密碼、再到關港貿單一窗口點選「實名認證平臺健保卡驗證（須插卡）」（MI52）的流程，並提及可至公立圖書館或關務署1樓服務中心借用讀卡機。聯合新聞網以「網購族注意！EZ WAY新制12月3日上路2類用戶須完成健保卡驗證」為題、新頭殼以「網購族注意！EZ WAY 12/3起擴大健保卡插卡驗證2類用戶不受影響」為題，均聚焦受影響的兩類用戶與不受影響的電信及自然人憑證族群。\\n\\n「仍不確定」\\n關務署尚未公布既有簡訊認證用戶收到推播通知後的具體補驗證截止期限，亦未說明分批發送通知的時間表。\\n\\nTrust label: Multi-source agreement — 多家台灣主流媒體對關務署新制上路日期、適用對象與操作步驟的報導細節完全一致。\"},\"glossary\":[{\"term\":{\"en\":\"EZ WAY (易利委)\",\"zh-TW\":\"EZ WAY易利委\"},\"blurb\":{\"en\":\"Taiwan's official mobile application operated by Trade-Van for real-name authentication and customs brokerage appointment on imported express shipments.\",\"zh-TW\":\"由關貿網路公司維運的財政部關務署官方實名認證APP，供民眾線上確認進口快遞貨物報關委任。\"}},{\"term\":{\"en\":\"Telecom Authentication (電信認證)\",\"zh-TW\":\"電信認證\"},\"blurb\":{\"en\":\"Identity verification conducted directly through mobile carrier records when the registered SIM card is under the applicant's own name.\",\"zh-TW\":\"當手機門號登記在申請人本人名下時，直接透過電信業者資料庫比對身分的認證方式。\"}},{\"term\":{\"en\":\"Citizen Digital Certificate (自然人憑證)\",\"zh-TW\":\"自然人憑證\"},\"blurb\":{\"en\":\"An IC smart card issued by Taiwan's Ministry of the Interior serving as an official digital signature and identity credential.\",\"zh-TW\":\"內政部核發的政府機關電子身分證IC卡，可用於網路報稅及海關實名認證等線上服務。\"}}],\"sources\":[{\"name\":\"民視新聞網 FTV News\",\"url\":\"https://www.ftvnews.com.tw/news/detail/2026B26W0510\"},{\"name\":\"聯合新聞網 UDN Tech\",\"url\":\"https://tech.udn.com/tech/story/123154/9902781\"},{\"name\":\"新頭殼 Newtalk\",\"url\":\"https://newtalk.tw/news/view/2026-11-26/1073942\"}],\"imageUrl\":\"/covers/live/live-taiwan-251-ezway-nhic-verification.jpg\",\"imageAlt\":{\"en\":\"Taiwan Customs to Mandate NHI Card Verification for More EZ WAY Users Starting Dec. 3\",\"zh-TW\":\"關務署12月3日起擴大EZ WAY健保卡插卡驗證，外籍新戶與既有簡訊認證戶須配合\"},\"isHeadline\":false,\"isPopular\":true,\"trustScore\":86,\"trustBreakdown\":{\"crossCorroboration\":23,\"outletReputation\":21,\"recencyClarity\":22,\"sourceDiversity\":20},\"publishedAt\":\"2026-11-27T22:39:49.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":22,\"D2\":22,\"D3\":21,\"D4\":21,\"D5\":22,\"total\":22},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-taiwan-251-ezway-nhic-verification/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"pro
