t happened\nCNA, citing foreign wire reports from Brussels, says the EU is considering taxing the world's large digital enterprises to raise revenue for its next long-term budget. The measure is expected to be included in the draft budget published today. The report gives no tax rate, no list of affected companies, and no timetable beyond the draft's publication.\n\nWhy it matters\nBrussels needs new money for its next budget cycle, and a levy on Big Tech would shift part of that burden onto the world's largest digital firms rather than member states alone. If the draft keeps the tax, a fight with the tech industry and with Washington is the next step, not the last word.\n\nSources agree / disagree\nThis is a single-outlet item from CNA, so there is no second source to compare. No numeric or factual conflicts appeared in the feed snippet.\n\nStill uncertain\nThe snippet does not say what rate is proposed, which companies or revenue thresholds would be covered, or whether member states back the idea. All of that depends on the draft budget itself, which had not been published when this item was filed.\nTrust label: Single source — CNA alone carries this report, and the draft it cites is not yet public in the snippet."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-02-h3b806a7c\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-taiwan-02-h3b806a7c.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 歐盟研議向大型科技業課稅　以籌措預算財源\",\"zh-TW\":\"相關封面圖：歐盟研議向大型科技業課稅　以籌措預算財源\"},\"publishedAt\":\"2026-11-21T07:37:20.000Z\",\"title\":{\"en\":\"EU Weighs Tax on Big Tech to Fund Its Next Long-Term Budget\",\"zh-TW\":\"歐盟研議向大型科技業課稅，以籌措下一份長期預算財源\"},\"summary\":{\"en\":\"[Unconfirmed · Single source] The European Union is weighing a tax on large global digital companies to fund its next long-term budget, CNA reports from Brussels, with the measure expected in a draft budget due today. No rate or scope is given. Takeaway: Brussels is hunting for new revenue, and Big Tech is the target.\",\"zh-TW\":\"［未證實·單一來源］歐盟研議對全球大型數位企業課稅，以籌措下一份長期預算財源，中央社（CNA）布魯塞爾報導，措施預計納入今天公布的新預算草案；稅率與課徵範圍未提。takeaway：布魯塞爾在找新財源，盯上的是大型科技業。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"歐盟研議對全球大型數位企業課稅，以籌措下一份長期預算財源，中央社（CNA）布魯塞爾報導，措施預計納入今天公布的新預算草案；提案仍在研議階段，稅率尚未公布。\\n發生了什麼事\\n中央社綜合布魯塞爾外電報導，歐盟研議對全球大型數位企業課稅，為下一份長期預算籌措財源；這項措施預計納入今天公布的新預算草案。報導未給稅率、未列受影響企業，也未提草案公布以外的時程。\\n為什麼重要\\n布魯塞爾要為下一個預算週期找新錢，向大型科技業課稅就是把部分負擔從成員國轉到全球最大數位企業身上。草案若保留這項稅，接下來是與科技業、與華府的角力，不是定案。\\n來源異同\\n本則只有中央社一個來源，無從比對第二家說法。片段中沒有數字或事實衝突。信任標籤：僅1源——中央社獨家報導，引用的草案在片段中尚未公開。\\n仍不確定\\n片段未說稅率多少、哪些企業或營收門檻適用、成員國是否支持；這些都要等預算草案本身公布才知道。\"},\"sources\":[{\"name\":\"中央社-國際\",\"url\":\"https://www.cna.com.tw/news/aopl/202611210122.aspx\"}],\"disagreements\":null,\"trustScore\":59,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"中央社-國際\"],\"glossary\":[{\"term\":{\"en\":\"European Union\",\"zh-TW\":\"歐盟\"},\"blurb\":{\"en\":\"Bloc of European countries considering a tax on large digital companies.\",\"zh-TW\":\"正研議向大型數位企業課稅的歐洲國家聯盟。\"}},{\"term\":{\"en\":\"CNA\",\"zh-TW\":\"中央社\"},\"blurb\":{\"en\":\"Taiwan's Central News Agency, the sole source for this report from Brussels.\",\"zh-TW\":\"中央社，本報導自布魯塞爾發出的唯一來源。\"}},{\"term\":{\"en\":\"Brussels\",\"zh-TW\":\"布魯塞爾\"},\"blurb\":{\"en\":\"Belgian capital where EU institutions are based and this report was filed from.\",\"zh-TW\":\"歐盟機構所在地，本報導的發稿地。\"}},{\"term\":{\"en\":\"Big Tech\",\"zh-TW\":\"大型科技業\"},\"blurb\":{\"en\":\"The world's largest digital companies the proposed EU tax would target.\",\"zh-TW\":\"歐盟擬課稅對象：全球大型數位企業。\"}},{\"term\":{\"en\":\"Long-term budget\",\"zh-TW\":\"長期預算\"},\"blurb\":{\"en\":\"The EU's multi-year spending plan the tax would help fund.\",\"zh-TW\":\"歐盟多年期支出計畫，課稅擬為其籌措財源。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}]
