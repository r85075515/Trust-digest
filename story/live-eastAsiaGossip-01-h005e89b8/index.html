itizen who has the right to speak. She added that even if she has no acting work in the future, she would bravely stand up to protect the Taiwan she loves.\n\nWhy it matters\nThe exchange is presented in the reports as a performer choosing to keep a public political position despite a possible cost to her career. Her own framing, as quoted in the feed summary, separates her job from her citizenship: acting is her occupation, while speaking out is something she describes as a citizen's right. The reports do not describe any change to her acting work itself; the significance they convey is her stated willingness to accept having no roles rather than stay silent.\n\nSources agree / disagree\nETtoday and Yahoo TW Entertainment carry closely matching headlines about Yu backing Shen, being mocked as not famous, and replying that she would stand up even with no acting work. The feed snippets show no clear numeric or name conflicts between the outlets.\nTrust label: Two-source agreement — Two outlets report the same support, the same mockery and the same reply in matching terms.\n\nStill uncertain\nOnly short feed summaries are available here, not Yu's full post or the full articles, so the complete wording of her statement and the wider online reaction are not shown. Whether the exchange affects her future acting opportunities is not reported in these snippets, and later updates or corrections would appear in the publishers' fuller reporting."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-eastAsiaGossip-01-h005e89b8\",\"category\":\"eastAsiaGossip\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-eastAsiaGossip-01-h005e89b8.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 表態挺沈伯洋遭酸「難怪不紅」　八點檔女星回擊：沒戲演也要站出來\",\"zh-TW\":\"相關封面圖：表態挺沈伯洋遭酸「難怪不紅」　八點檔女星回擊：沒戲演也要站出來\"},\"publishedAt\":\"2026-10-31T16:07:00.000Z\",\"title\":{\"en\":\"Yu Shih-ching defends backing Shen Po-yang after online mockery\",\"zh-TW\":\"游詩璟回擊酸言：力挺沈伯洋，就算沒戲演也要站出來\"},\"summary\":{\"en\":\"Soap-opera actress Yu Shih-ching (游詩璟) was mocked online for publicly supporting Taipei mayoral candidate Shen Po-yang (沈伯洋), with one comment saying no wonder she is not famous. On the 31st she replied that acting is her job but she is also a citizen with a voice.\",\"zh-TW\":\"八點檔女星游詩璟日前表態支持台北市長候選人沈伯洋，遭網友嘲諷難怪她不紅。她於三十一日發文回應，表示自己不是為了引戰，並強調演員是職業，但也是有發言權的市民，就算以後沒戲演，為了守護所愛的台灣，也會勇敢站出來。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"八點檔女星游詩璟因公開表態支持台北市長候選人沈伯洋，遭網友嘲諷。她被酸難怪不紅之後，於三十一日發文回應，表示就算以後沒戲演，也會勇敢站出來。\\n\\n發生了什麼事\\n游詩璟日前表態支持沈伯洋，引來網友嘲諷，包括難怪她不紅的說法。她於三十一日發文表示，自己不是為了討拍引戰，並強調演員是職業，但也是有發言權的市民。她直言，就算以後沒戲演，為了守護所愛的台灣，也會勇敢站出來。\\n\\n為什麼重要\\n這次交鋒呈現的是一名演員在可能影響演藝工作的情況下，仍選擇維持公開立場。依摘要所引，她把職業與公民身分分開看待：演員是她的工作，發聲則是她身為市民的權利。報導並未提及她的演藝工作已有實際變化，其重點在於她表明寧可沒戲演也不沉默的態度。\\n\\n來源異同\\n東森娛樂（ETtoday）與雅虎台灣娛樂（Yahoo TW 娛樂）的標題高度一致，都提到游詩璟力挺沈伯洋、遭酸難怪不紅，以及沒戲演也要站出來的回擊。兩家摘要之間未見明顯的數字或名稱衝突。\\n\\n仍不確定\\n目前只有簡短摘要，沒有她的完整貼文與完整報導，因此她聲明的全文與網路反應的全貌都未呈現。這次交鋒是否影響她未來的演出機會，摘要中也沒有報導，後續更新須以原媒體的完整報導為準。\"},\"sources\":[{\"name\":\"ETtoday 影劇\",\"url\":\"https://star.ettoday.net/news/3264150\"},{\"name\":\"Yahoo TW 娛樂\",\"url\":\"https://tw.news.yahoo.com/%E5%8A%9B%E6%8C%BA%E6%B2%88%E4%BC%AF%E6%B4%8B%E9%81%AD%E9%85%B8-%E9%9B%A3%E6%80%AA%E5%A6%B3%E4%B8%8D%E7%B4%85-%E5%85%AB%E9%BB%9E%E6%AA%94%E5%A5%B3%E6%98%9F%E5%9B%9E%E6%93%8A-%E6%B2%92%E6%88%B2%E6%BC%94%E4%B9%9F%E6%9C%83%E5%8B%87%E6%95%A2%E7%AB%99%E5%87%BA%E4%BE%86-000700805.html\"}],\"disagreements\":null,\"trustScore\":70,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":17,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"eastAsiaGossip\",\"live-ingest\",\"region:tw\",\"ettoday-影劇\",\"yahoo-tw-娛樂\",\"yahoo-tw-娛樂\"],\"region\":\"tw\",\"glossary\":[{\"term\":{\"en\":\"Yu Shih-ching\",\"zh-TW\":\"游詩璟\"},\"blurb\":{\"en\":\"Yu Shih-ching is the eight-o'clock soap-opera actress who publicly supported Shen Po-yang and replied to online mockery.\",\"zh-TW\":\"游詩璟是公開表態支持沈伯洋並回擊網友嘲諷的八點檔女星。\"}},{\"term\":{\"en\":\"Shen Po-yang\",\"zh-TW\":\"沈伯洋\"},\"blurb\":{\"en\":\"Shen Po-yang is the Taipei mayoral candidate whose support by Yu prompted the online reaction.\",\"zh-TW\":\"沈伯洋是台北市長候選人，游詩璟表態支持他而引發網友反應。\"}},{\"term\":{\"en\":\"Eight-o'clock soap opera\",\"zh-TW\":\"八點檔\"},\"blurb\":{\"en\":\"An eight-o'clock soap opera is the prime-time drama format in which Yu works as an actress.\",\"zh-TW\":\"八點檔是游詩璟擔任演員的黃金時段連續劇類型。\"}},{\"term\":{\"en\":\"ETtoday\",\"zh-TW\":\"東森娛樂（ETtoday）\"},\"blurb\":{\"en\":\"ETtoday is one of the two outlets whose entertainment feeds carried this story.\",\"zh-TW\":\"東森娛樂是報導此事的兩家娛樂媒體之一。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-eastAsiaGossip-01-h005e89b8/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-eastAsiaGossip-01-h005e89b8/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\
