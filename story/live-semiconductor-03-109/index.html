ficial guidance and checking statements for unfamiliar charges.\nSources agree / disagree\nOnly TechNews covers the announcement in the feed, so there is no second outlet to confirm the figure or the scope. Trust label: Single source — one outlet reports the operator's announcement; the 1.09 million figure comes from that single report.\nStill uncertain\nWhich data fields were exposed, how the access occurred, whether the data was actually exfiltrated or only made accessible, and what remediation Ryohin Keikaku will offer are all missing from the snippet. The key accountability question is what the company knew and when; check the full reporting and the company's own statement for the details that matter to cardholders."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-03-109\",\"category\":\"semiconductor\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-semiconductor-03-109.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 日本無印良品爆個資外洩，109 萬筆信用卡資料恐遭存取\",\"zh-TW\":\"日本無印良品（MUJI）爆個資外洩：109 萬筆信用卡資料恐遭存取\"},\"publishedAt\":\"2026-11-05T02:00:26.000Z\",\"title\":{\"en\":\"MUJI Japan Data Breach Puts 1.09 Million Credit Card Records at Risk\",\"zh-TW\":\"日本無印良品（MUJI）爆個資外洩：109 萬筆信用卡資料恐遭存取\"},\"summary\":{\"en\":\"[Unconfirmed · Single source] Japan's MUJI faces a suspected data breach, with operator Ryohin Keikaku announcing on November 4 that about 1.09 million credit card membership records may have been accessed. The company has not confirmed what was actually taken. Affected cardholders should watch for official guidance and monitor their statements.\",\"zh-TW\":\"［未證實·單一來源］日本無印良品（MUJI）爆發個資外洩疑慮，營運公司良品計劃（Ryohin Keikaku）4 日宣布，約 109 萬筆信用卡會員資料可能遭存取。實際外洩範圍尚未確認，持卡人應留意官方說明並檢查帳單。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"日本無印良品（MUJI）爆發個資外洩疑慮，營運公司良品計劃（Ryohin Keikaku）4 日宣布，約 109 萬筆信用卡會員資料可能遭存取。\\n發生了什麼事\\n根據科技新報（TechNews）的報導，在日本營運無印良品的良品計劃於 11 月 4 日宣布，約 109 萬筆信用卡會員資料可能遭存取。報導描述的是一起個資外洩疑慮，用語相當謹慎：資料是「可能遭存取」，而不是已確認被竊。來源摘要在說明涉及的資料字段或存取方式之前就中斷了。\\n為什麼重要\\n結論在於規模與敏感度：109 萬筆與信用卡相關的記錄是一個巨大的暴露面，而信用卡會員資料正是可能被濫用的那種資訊。不確定性本身就是新聞的一部分：「可能遭存取」讓持卡人在公司進一步說明之前，無法判斷自己的風險。在此之前，實際的步驟是留意官方指引，並檢查帳單上是否有陌生的消費。\\n來源異同\\n採訪線上只有科技新報一家報導這項宣布，沒有第二個來源可以核實數字或範圍。信任標籤：單一來源——僅一家媒體報導營運公司的宣布；109 萬筆這個數字來自這篇單一報導。\\n仍不確定\\n哪些資料字段外洩、存取是如何發生的、資料是否真的被外洩出去或只是可能被存取，以及良品計劃會提供什麼補救措施，摘要都沒有提到。關鍵的問責問題是，公司知道了什麼、何時知道的；對持卡人重要的細節，請查閱完整報導與公司自己的聲明。\"},\"sources\":[{\"name\":\"TechNews 科技新報\",\"url\":\"https://infosecu.technews.tw/2026/11/05/muji-japan-data-breach-1-09-million-credit-card-records-exposed/\"}],\"disagreements\":null,\"trustScore\":47,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":10,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"semiconductor\",\"live-ingest\",\"technews-科技新報\"],\"glossary\":[{\"term\":{\"en\":\"MUJI\",\"zh-TW\":\"無印良品\"},\"blurb\":{\"en\":\"Japanese retail brand whose credit card membership records may have been accessed.\",\"zh-TW\":\"信用卡會員資料可能遭存取的日本零售品牌。\"}},{\"term\":{\"en\":\"Ryohin Keikaku\",\"zh-TW\":\"良品計劃\"},\"blurb\":{\"en\":\"Company that operates MUJI in Japan and announced the suspected breach.\",\"zh-TW\":\"在日本營運無印良品的公司，宣布了這起疑似外洩。\"}},{\"term\":{\"en\":\"TechNews\",\"zh-TW\":\"科技新報\"},\"blurb\":{\"en\":\"Taiwan technology news outlet that covered the announcement.\",\"zh-TW\":\"報導這項宣布的台灣科技新聞媒體。\"}},{\"term\":{\"en\":\"Credit card data\",\"zh-TW\":\"信用卡資料\"},\"blurb\":{\"en\":\"Payment card membership records at the center of the suspected breach.\",\"zh-TW\":\"這起疑似外洩的核心：信用卡會員記錄。\"}},{\"term\":{\"en\":\"Data breach\",\"zh-TW\":\"個資外洩\"},\"blurb\":{\"en\":\"Unauthorized access to personal data, suspected here but not confirmed.\",\"zh-TW\":\"個人資料遭未經授權存取；本案僅為疑似，尚未確認。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"
