opment Safety Update Report (DSUR) with the U.S. Food and Drug Administration (FDA) for its investigational intranasal anti-CD3 monoclonal antibody, foralumab. According to the company's official filing and press release, the report covers a cumulative estimated exposure of 48.1 patient-years across multiple central nervous system studies, including 32.1 patient-years in non-active secondary progressive multiple sclerosis, 10.25 patient-years in a Phase 2a trial, 2.50 patient-years in multiple system atrophy, and 1.8 patient-years in an expanded access Alzheimer's disease case, with zero serious adverse events attributed to the study drug.\n\n「Why it matters」\nAnti-CD3 monoclonal antibodies delivered intravenously have historically been associated with infusion-related systemic reactions, limiting broader clinical use. Demonstrating clean long-term tolerability via non-invasive nasal administration—spanning treatment durations of up to 4.7 years in individual patients—strengthens the safety foundation for ongoing and upcoming Phase 2 neuroinflammatory and neurodegenerative trials, and triggered a double-digit intraday rally in Tiziana shares on November 27.\n\n「Source differences」\nThe SEC Form 6-K Exhibit 99.1 filing (titled \"Tiziana Life Sciences LTD Press Release, dated November 27, 2026\") and Tiziana's corporate newsroom release (titled \"Tiziana Life Sciences Files Updated Foralumab Annual Safety Report with FDA Confirming Favorable Safety and Tolerability Profile\") provide the complete trial-by-trial patient-year breakdown and dosing schedules (50 or 100 micrograms per dosing day). Financial news outlet StreetInsider (titled \"Tiziana files foralumab safety report with FDA, no drug-related SAEs\") summarizes the top-line FDA submission and absence of drug-related serious adverse events without listing individual cohort exposure figures.\n\n「Still uncertain」\nThe DSUR submission summarizes cumulative safety and tolerability observations rather than new randomized efficacy endpoints, and the FDA has not yet issued a public regulatory response or marketing approval decision based on this annual update.\n\nTrust label: Official confirmation — Backed by Tiziana Life Sciences' SEC Form 6-K filing and official corporate release alongside independent financial press coverage."])</script><script>self.__next_f.push([1,"11:T995,"])</script><script>self.__next_f.push([1,"「發生了什麼事」\n總部位於波士頓的生技公司 Tiziana Life Sciences 於 2026 年 11 月 27 日宣布，已向美國食品藥物管理局（FDA）提交其鼻噴式全人源抗 CD3 單株抗體候選藥物 foralumab 的最新年度研發安全更新報告（DSUR）。根據該公司向美國證券交易委員會（SEC）申報的公告文件，這份報告涵蓋多項中樞神經系統臨床研究的累積數據，總計達 48.1 患者年的藥物暴露量，包括非活動性次發進展型多發性硬化症研究累積 32.1 患者年、2a 期臨床試驗累積 10.25 患者年、多發性系統萎縮症研究累積 2.50 患者年，以及單一患者阿茲海默症恩慈療法累積 1.8 患者年，所有研究中均未出現任何歸因於試驗藥物的嚴重不良反應。\n\n「為什麼重要」\n傳統靜脈注射型抗 CD3 單株抗體常伴隨輸注相關的全身性免疫反應，限制了臨床長期給藥的應用空間。此次報告顯示，改採非侵入式鼻腔噴霧給藥後，即便部分受試者連續用藥長達 4.7 年仍維持良好耐受性，為阿茲海默症、多發性硬化症及多發性系統萎縮症等神經發炎與神經退化性疾病的二期臨床推進提供關鍵安全性支撐，也帶動該公司股價於 11 月 27 日盤中顯著走揚。\n\n「來源異同」\n美國證交會申報文件（頁面標題為「Tiziana Life Sciences LTD Press Release, dated November 27, 2026」）與公司官網新聞稿（頁面標題為「Tiziana Life Sciences Files Updated Foralumab Annual Safety Report with FDA Confirming Favorable Safety and Tolerability Profile」）完整揭露各適應症臨床佇列的暴露患者年數與每週期給藥劑量（每次給藥日 50 或 100 微克）。財經媒體 StreetInsider 報導（頁面標題為「Tiziana files foralumab safety report with FDA, no drug-related SAEs」）則聚焦摘要向 FDA 遞交年度安全報告及無藥物相關嚴重不良反應的核心結論，未逐一拆解各子試驗暴露年數。\n\n「仍不確定」\n本次提交的年度研發安全更新報告屬於例行性安全性與耐受性彙整，並未公布新的隨機對照療效終點數據；美國食藥局針對該份最新安全報告的後續審查回饋與臨床推進意見亦尚待公布。\n\nTrust label: Official confirmation — 依據 Tiziana Life Sciences 向美國 SEC 申報之正式公告、官方新聞稿及財經媒體報導交叉核實。"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-biotech-217-tiziana-foralumab-fda-safety-report\",\"category\":\"biotech\",\"title\":{\"en\":\"Tiziana Files Updated Intranasal Foralumab Safety Report With FDA, Reporting No Drug-Related Serious Adverse Events\",\"zh-TW\":\"Tiziana 向美國食藥局提交鼻噴新藥 Foralumab 年度安全報告 累積 48.1 患者年無嚴重不良反應\"},\"summary\":{\"en\":\"Tiziana Life Sciences submitted its update sroom\",\"url\":\"https://www.tizianalifesciences.com/tiziana-life-sciences-files-annual-safety-report-for-intranasal-foralumab-with-fda/\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"Tiziana Files Updated Intranasal Foralumab Safety Report With FDA, Reporting No Drug-Related Serious Adverse Events\",\"zh-TW\":\"Tiziana 向美國食藥局提交鼻噴新藥 Foralumab 年度安全報告 累積 48.1 患者年無嚴重不良反應\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":85,\"trustBreakdown\":{\"crossCorroboration\":21,\"outletReputation\":23,\"recencyClarity\":23,\"sourceDiversity\":18},\"publishedAt\":\"2026-11-27T20:21:08.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":23,\"D2\":22,\"D3\":21,\"D4\":22,\"D5\":21,\"total\":22},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-biotech-217-tiziana-foralumab-fda-safety-report/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-biotech-217-tiziana-foralumab-fda-safety-report/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"
