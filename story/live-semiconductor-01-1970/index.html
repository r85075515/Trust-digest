computer looked nothing like the point-and-click routine now taken for granted.\nWhat happened\nTechNews published a history of the first wooden mouse, dated to 1970, under a headline saying it changed computer operation around the world without making its makers rich. The available feed excerpt is cut off mid-sentence: it opens by noting that moving a mouse and pressing a few keys now opens files, browses the web, and completes complex work, then says operating a computer before the mouse was nothing like today, and stops there. No inventor, laboratory, patent, or price appears in the excerpt.\nWhy it matters\nThe mouse is easy to overlook precisely because it won. Pointing and clicking replaced an older, harder way of working with computers, and that shift shaped every desktop and laptop that followed. A history that asks why its makers did not profit also asks who captures the value of a foundational invention, a question that still applies to new interfaces today.\nSources agree-disagree\nOnly TechNews carries this story in the feed, so there is no second source to confirm the 1970 date or the claim about its makers not profiting. The single source is a history piece, not breaking news, but its claims still rest on one outlet alone. Trust label: Single source.\nStill uncertain\nAlmost everything beyond the headline is uncertain because the excerpt is truncated. The feed does not name the inventor, explain how the wooden mouse worked, say who built or sold it, or show how it spread from a 1970 prototype to the standard pointing device. Until the full TechNews article is read, the date and the not-making-a-fortune claim should be treated as one outlet's account, not settled fact."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-01-1970\",\"category\":\"semiconductor\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-semiconductor-01-1970.jpg\",\"imageAlt\":{\"en\":\"Cov
