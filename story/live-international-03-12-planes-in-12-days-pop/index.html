mes, and Al Jazeera, agree on the route, the length, and the surgery context, and present the tour as already under way.\nWhy it matters\nThe judgment here is double: pastorally, the tour is a return to the continent where the pope's ministry was formed, with Peru as the emotional center; physically, a 12-day, 12-flight schedule weeks after lung surgery is itself the news. If he completes it without changes, the Vatican's message is that he is back to full duty. Any cut or postponement would be read the same way, in reverse. For readers, the takeaway is to watch the schedule, not just the speeches.\nSources agree / disagree\nThree outlets — NPR World, NYT World, and Al Jazeera — agree on the route, duration, and post-surgery context. Trust label: Multi-source agreement — several outlets agree on the itinerary and the surgery background, with no conflicting details.\nStill uncertain\nThe snippets give no day-by-day itinerary, no detail of the surgery or recovery timeline, and no list of meetings or masses. The '12 planes in 12 days' framing is the headline's own shorthand, not a confirmed flight log. Check the Vatican's daily bulletins for the schedule as the tour proceeds."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-03-12-planes-in-12-days-pop\",\"category\":\"international\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-international-03-12-planes-in-12-days-pop.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 12 Planes in 12 Days: Pope Begins Major Latin America Tour, Weeks After Surgery\",\"zh-TW\":\"相關封面圖：（譯文待補）12 Planes in 12 Days: Pope Begins Major Latin America Tour, Weeks After Surgery\"},\"publishedAt\":\"2026-11-07T00:55:51.000Z\",\"title\":{\"en\":\"Pope Leo Begins 12-Day Latin America Tour Weeks After Surgery\",\"zh-TW\":\"教宗良十四世展開 12 天拉美行：術後首次南美之旅\"},\"summary\":{\"en\":\"Pope Leo (教宗良十四世) has begun his first South American tour since lung cancer surgery, a 12-day journey taking him to Uruguay, Argentina and Peru, where he spent two decades. The takeaway: the tour is both a pastoral return to the region he knows best and a health test — watch whether the 12-plane schedule holds without changes.\",\"zh-TW\":\"教宗良十四世展開肺癌手術後首次南美之旅，12 天行程走訪烏拉圭、阿根廷與秘魯——他在秘魯待過二十年。結論是：這趟出訪既是回到他最熟悉地區的牧靈之旅，也是一場健康考驗，接下來看 12 天 12 班飛機的行程能否按計畫走完。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"教宗良十四世展開肺癌手術後首次南美之旅，12 天行程走訪烏拉圭、阿根廷與秘魯——他在秘魯待過二十年。行程號稱 12 天搭 12 班飛機，這個節奏本身就說明了他的康復狀況，和此行造訪的地區一樣，都是新聞重點。\\n發生了什麼事\\n教宗的出訪行程為期 12 天，橫跨三個國家：烏拉圭、阿根廷、秘魯。這是他接受肺癌手術後首次造訪南美洲，其中秘魯分量最重——他在當地待了二十年。NPR、紐約時報與半島電視台的報導對路線、天數與手術背景說法一致，並表示行程已經展開。\\n為什麼重要\\n這件事有雙重意義：在牧靈上，這趟行程是回到形塑他聖職生涯的大陸，秘魯是情感中心；在身體上，肺部手術後幾週就排 12 天 12 班飛機的行程，本身就是消息。如果他全程走完沒有變動，梵蒂岡傳遞的訊息就是他已恢復完整職務；反之，任何縮減或延期也會被同樣解讀。對讀者來說，結論是看行程表，而不只是看演說。\\n來源異同\\n三家媒體——NPR 國際版、紐約時報國際版、半島電視台——對路線、天數與術後背景說法一致。信任標籤：多源一致——多家媒體對行程與手術背景說法一致，沒有互相矛盾的細節。\\n仍不確定\\n摘要沒有逐日行程、手術或康復時間表的細節，也沒有會晤或彌撒清單。「12 天 12 班飛機」是標題自己的簡稱，不是確認過的飛行紀錄。行程進行期間，請查梵蒂岡每日公告確認最新安排。\"},\"sources\":[{\"name\":\"NPR World\",\"url\":\"https://www.npr.org/2026/11/06/nx-s1-6026702/pope-leo-begins-12-day-3-country-tour-after-cancer-surgery\"},{\"name\":\"NYT World\",\"url\":\"https://www.nytimes.com/2026/11/06/world/europe/pope-leo-visit-uruguay-argentina-peru.html\"},{\"name\":\"Al Jazeera\",\"url\":\"https://www.aljazeera.com/video/newsfeed/2026/11/7/pope-leo-xiv-arrives-for-south-american-tour-after-cancer-surgery?traffic_source=rss\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":20,\"outletReputation\":21,\"crossCorroboration\":22,\"recencyClarity\":25},\"tags\":[\"international\",\"live-ingest\",\"npr-world\",\"nyt-world\",\"al-jazeera\"],\"glossary\":[{\"blurb\":{\"en\":\"The pope, beginning his first South American tour since lung cancer surgery.\",\"zh-TW\":\"展開肺癌手術後首次南美之旅的教宗。\"},\"term\":{\"en\":\"Pope Leo\",\"zh-TW\":\"教宗良十四世\"}},{\"blurb\":{\"en\":\"South American country on the tour, where the pope spent two decades.\",\"zh-TW\":\"
