(SMBs), entered into a definitive agreement to be acquired by investment firm TPG in partnership with global corporate payments provider Corpay (NYSE: CPAY). Under the terms disclosed in company filings and press releases, BILL stockholders will receive $63.25 per share in cash, representing a total transaction value of approximately $6 billion.\n\nThe buyout pairs TPG's private equity capital with Corpay's cross-border and commercial spend-management network, giving BILL strategic backing to accelerate product development outside quarterly public-market pressures. It marks one of the largest fintech take-private transactions of late 2026 as institutional investors target recurring B2B software cash flows.\n\nOfficial announcements from TPG, BILL's investor relations filings, and coverage by FinTech Futures align on the $63.25 per-share all-cash offer, the $6 billion valuation, and the joint TPG-Corpay structure. Reporting notes that the offer price reflects a substantial premium over BILL's unaffected share price prior to mid-November media reports of takeover talks.\n\nExact closing dates, regulatory clearance milestones, and post-closing governance split between TPG and Corpay remain subject to customary closing conditions.\n\nTrust label: Official statement — Offer price, all-cash structure, and acquiring consortium details are verified via TPG and BILL corporate filings and corroborated by fintech press."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-108-tpg-corpay-acquire-bill-6-billion-deal\",\"category\":\"finance\",\"title\":{\"en\":\"BILL Agrees to $6 Billion All-Cash Takeover by TPG and Corpay\",\"zh-TW\":\"企業財務軟體商 BILL 同意由私募基金 TPG 與 Corpay 以 60 億美元收購\"},\"summary\":{\"en\":\"Financial automation software provider BILL agreed to be acquired by private equity firm TPG in partnership with corporate payments company Corpay in an all-cash transaction valued at $63.25 per share, or roughly $6 billion. The deal transitions the SMB-focused payments platform from public markets into private ownership backed by strategic payments infrastructure. Subject to shareholder and regulatory approvals, the buyout reshapes mid-market B2B payment automation.\",\"zh-TW\":\"中小企業財務自動化軟體供應商 BILL 同意由私募股權基金 TPG 攜手企業支付公司 Corpay，以每股 63.25 美元、總價值約 60 億美元的全現金交易進行收購。此項併購將把服務近 50 萬家企業的雲端應付帳款平台轉為私有化營運，並結合 Corpay 的全球商業支付網路拓展市場版圖。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」服務近 50 萬家中小企業的財務自動化軟體商 BILL，正式與私募股權投資機構 TPG 及企業支付大廠 Corpay（紐交所代碼：CPAY）簽署最終併購協議。根據官方公告與申報文件，TPG 與 Corpay 將以每股 63.25 美元全現金收購 BILL 所有流通在外股份，交易總估值約達 60 億美元。\\n\\n「為什麼重要」這樁交易成為 2026 年底金融科技領域規模最大的私有化收購案之一，展現私募基金與策略性支付業者聯手整合 B2B 企業支出管理軟體的趨勢。透過轉為私有化並結合 Corpay 的跨境與商業支付基礎設施，BILL 得以在不受公開市場短期財報波動牽制下推進產品升級。\\n\\n「來源異同」TPG 官方新聞稿、BILL 投資人關係公告以及金融科技媒體 FinTech Futures 對每股 63.25 美元現金對價、60 億美元總估值及 TPG 攜手 Corpay 的收購架構報導一致，並指出該報價較 11 月中旬併購傳聞流出前的股價具備明顯溢價。\\n\\n「仍不確定」股東特別大會表決時程、反壟斷監管審查結果，以及交割完成後 TPG 與 Corpay 之間的具體股權分配與治理架構，仍有待後續文件揭露。\"},\"glossary\":[{\"term\":{\"en\":\"Take-Private Transaction\",\"zh-TW\":\"私有化收購交易\"},\"blurb\":{\"en\":\"An acquisition in which a consortium of private equity firms or strategic buyers purchases all publicly traded shares of a listed company and delists it from stock exchanges.\",\"zh-TW\":\"由私募股權基金或策略買家收購上市公司全部公開流通股份並使其下市，轉為私人控股企業的併購交易。\"}},{\"term\":{\"en\":\"B2B Payment Automation\",\"zh-TW\":\"企業對企業支付自動化\"},\"blurb\":{\"en\":\"Cloud software that digitizes invoice processing, accounts payable, approvals, and electronic vendor disbursements for businesses.\",\"zh-TW\":\"協助企業將發票審核、應付帳款管理及供應商電子撥款流程數位化與自動化的雲端財務軟體系統。\"}},{\"term\":{\"en\":\"All-Cash Deal\",\"zh-TW\":\"全現金收購\"},\"blurb\":{\"en\":\"A merger or acquisition where the buyer pays the target company's shareholders entirely in cash rather than issuing acquiring-company stock.\",\"zh-TW\":\"收購方完全以現金支付目標公司股東對價、不涉及換股的併購方式，提供股東確定的變現價值。\"}}],\"sources\":[{\"name\":\"TPG Newsroom\",\"url\":\"https://www.tpg.com/news/bill-agrees-to-be-acquired-by-tpg-in-partnership-with-corpay/\"},{\"name\":\"Sina Finance\",\"url\":\"https://finance.sina.com.cn/stock/usstock/c/2026-11-20/doc-inizkyxc0188110.shtml\"},{\"name\":\"BILL Investor Relations\",\"url\":\"https://investor.bill.com/news/news-details/2026/BILL-Agrees-to-be-Acquired-by-TPG-in-Partnership-with-Corpay/default.aspx\"},{\"name\":\"The Paypers\",\"url\":\"https://thepaypers.com/mergers-aquisitions-and-investments/news/tpg-and-corpay-to-take-bill-holdings-private-in-usd-6-bln-deal\"}],\"imageUrl\":\"/covers/live/live-finance-108-tpg-corpay-acquire-bill-6-billion-deal.webp\",\"imageAlt\":{\"en\":\"Financial software dashboard displaying automated accounts payable workflows\",\"zh-TW\":\"顯示自動化應付帳款與企業支付流程的雲端財務軟體介面\"},\"isHeadline\":false,\"isPopular\":true,\"trustScore\":86,\"trustBreakdown\":{\"crossCorroboration\":22,\"outletReputation\":22,\"recencyClarity\":21,\"sourceDiversity\":21},\"publishedAt\":\"2026-11-27T15:56:21.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":4,\"D2\":4,\"D3\":4,\"D4\":4,\"D5\":4,\"total\":20},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-finance-108-tpg-corpay-acquire-bill-6-billion-deal/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\
