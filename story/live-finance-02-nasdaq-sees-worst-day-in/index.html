 day in 18 months, with nearly $2 trillion shaved off its value.\nWhy it matters\nThe sell-off links politics directly to the AI trade, the market's biggest driver in recent years. If investors believe regulation will slow data-centre building, the companies that supply the build-out feel the hit too. A one-day drop can be noise, but a $2 trillion move on a regulatory fear shows how much of the market's value now rests on AI staying lightly regulated.\nSources agree / disagree\nThis card rests on a single outlet, The Guardian Business, which supplied two feed items on the same story. The Guardian's live coverage also carried items noting that US stocks rose as investors digested the Democrats' victories, hoping Donald Trump's policymaking would be restrained — a broader-market note that sits alongside the Nasdaq slump in the live blog and is not a second verdict on the index itself. Trust label: Single source — one outlet reported the Nasdaq drop.\nStill uncertain\nThe snippets do not give the Nasdaq's closing level, confirm whether the index entered correction territory — the feed text cuts off at that point — or show whether the fall extended beyond Thursday. They also do not break down which stocks drove the loss. Verify the figures in the full reporting before quoting them."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-02-nasdaq-sees-worst-day-in\",\"category\":\"finance\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-finance-02-nasdaq-sees-worst-day-in.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Nasdaq sees worst day in 18 months as investors bet on AI slowdown after Democrats’ election triumph\",\"zh-TW\":\"相關封面圖：民主黨大選獲勝後，投資者押注人工智慧將放緩，納斯達克指數迎來 18 個月來最糟糕的一天\"},\"publishedAt\":\"2026-11-05T21:23:18.000Z\",\"title\":{\"en\":\"Nasdaq Suffers Worst Day in 18 Months, Falling 5.5% as AI Regulation Fears Spread\",\"zh-TW\":\"那斯達克指數重挫 5.5%，創 18 個月來最差單日表現\"},\"summary\":{\"en\":\"The Nasdaq fell 5.5% on Thursday for its worst day in 18 months, wiping nearly $2 trillion in value as investors bet the Democrats' midterm triumph will bring tougher regulation for AI data centres, The Guardian reports. Watch whether the sell-off spreads to other markets or proves a one-day reaction.\",\"zh-TW\":\"那斯達克指數週四重挫 5.5%，創 18 個月來最差單日表現，市值蒸發近 2 兆美元。投資人押注民主黨中期選舉獲勝後，人工智慧（AI）資料中心將面臨更嚴格的監管。接下來看跌勢會不會擴散到其他市場，還是只是一日反應。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"那斯達克指數週四重挫 5.5%，創 18 個月來最差單日表現，市值蒸發近 2 兆美元；投資人押注民主黨中期選舉獲勝後，人工智慧（AI）產業將面臨更嚴格的監管。\\n發生了什麼事\\n華爾街普遍下跌，那斯達克綜合指數週四重挫 5.5%，市場擔心人工智慧資料中心將受到限制，憂慮擴散到各交易所。《衛報》把這波下跌解讀為對人工智慧放緩的押注：投資人預期民主黨勝選意味著產業規則將收緊。報導稱那斯達克正邁向 18 個月來最差的一天，市值蒸發近 2 兆美元。\\n為什麼重要\\n這波拋售把政治與人工智慧行情直接連在一起，而人工智慧正是近年市場最大的推動力。投資人若相信監管會拖慢資料中心建設，供應這波建設的企業也會受到波及。單日下跌可能是雜音，但一場由監管憂慮引發的 2 兆美元市值蒸發，顯示市場如今有多大一部分價值建立在人工智慧維持寬鬆監管的假設上。\\n來源異同\\n本卡只有《衛報》商業版一家來源，提供了同一主題的兩則內容。《衛報》的即時報導中也提到，美股在投資人消化民主黨勝選消息時上漲，期待川普（Donald Trump）的政策制定受到制約——那是即時部落格裡對大盤的另一則觀察，不是對那斯達克指數本身的第二種判斷。信任標籤：單一來源——只有一家媒體報導那斯達克的下跌。\\n仍不確定\\n摘要沒有給出那斯達克的收盤點位，也沒有證實指數是否進入修正區間——來源文字在該處截斷；跌勢是否延續到週四之後也不清楚。摘要也沒有拆解是哪些股票帶動了跌幅。引用數字前請查閱完整報導。\"},\"sources\":[{\"name\":\"The Guardian Business\",\"url\":\"https://www.theguardian.com/business/2026/nov/05/nasdaq-heading-for-worst-day-in-18-months-as-wall-street-sustains-widespread-losses\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"finance\",\"live-ingest\",\"the-guardian-business\",\"the-guardian-business\"],\"glossary\":[{\"blurb\":{\"en\":\"US stock market index that fell 5.5% for its worst day in 18 months.\",\"zh-TW\":\"重挫 5.5%、創 18 個月來最差單日表現的美國股市指數。\"},\"term\":{\"en\":\"Nasdaq\",\"zh-TW\":\"那斯達克\"}},{\"blurb\":{\"en\":\"British newspaper whose business desk reported the Nasdaq drop; the card's only source.\",\"zh-TW\":\"報導那斯達克下跌的英國報紙商業版，本卡的唯一來源。\"},\"term\":{\"en\":\"The Guardian\",\"zh-TW\":\"衛報\"}},{\"blurb\":{\"en\":\"Facilities that run
