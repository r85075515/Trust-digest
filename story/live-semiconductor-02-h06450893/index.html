— not decided — days after Huang resigned.\nWhat happened\nThe Financial Times reported that Huang is weighing a return to the Nvidia chief executive role as Silicon Valley allies lobby the board to bring him back, according to items from CNA and TechNews. CNA's fuller item, a San Francisco dispatch dated November 15, added that the tech executive resigned days earlier after an extramarital affair involving a suspected Chinese spy and a subordinate. The reports give no board response and no timetable for any decision.\nWhy it matters\nA founder-CEO's possible return days after a scandal-driven resignation would be an extraordinary reversal, and the reported board lobbying shows the fight is happening in public. The takeaway: Nvidia's leadership is unresolved at the exact moment its earnings loom — the board's answer matters more than the speculation, and nothing is decided yet.\nSources agree / disagree\nCNA and TechNews carry the same Financial Times report with matching headlines and core facts, so the two outlets agree — but both trace to a single origin, the Financial Times, which means this is agreement on one account rather than independent corroboration. No substantive numeric or name conflict appears in the snippets.\nStill uncertain\nWhether Huang will actually return, how the board responds, who the Silicon Valley allies pressing it are, and the full circumstances of the resignation are all unconfirmed in the material at hand. The affair allegation comes from CNA's relay of the report and has no independent confirmation here; treat the return as a possibility, not a fact, until Nvidia or the board speaks.\nTrust label: Two-source agreement — CNA and TechNews carry the same Financial Times report, so this is agreement on one origin, not independent corroboration."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-02-h06450893\",\"category\":\"semiconductor\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-semiconductor-02-h06450893.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 金融時報：黃仁勳考慮回鍋　矽谷盟友施壓輝達董事會要求讓他復職\",\"zh-TW\":\"相關封面圖：金融時報：黃仁勳考慮回鍋　矽谷盟友施壓輝達董事會要求讓他復職\"},\"publishedAt\":\"2026-11-16T01:30:44.000Z\",\"title\":{\"en\":\"Jensen Huang Considers Return as Nvidia CEO as Allies Press Board\",\"zh-TW\":\"黃仁勳（Jensen Huang）考慮回任輝達（NVIDIA）執行長，矽谷盟友施壓董事會\"},\"summary\":{\"en\":\"Jensen Huang is considering returning as Nvidia CEO while Silicon Valley allies press the board to reinstate him, the Financial Times reported via CNA and TechNews. CNA added that he resigned days earlier. He has not been confirmed back in the role, and the reports give no board response, so nothing is decided yet.\",\"zh-TW\":\"金融時報（Financial Times）報導，黃仁勳（Jensen Huang）正考慮回任輝達（NVIDIA）執行長，矽谷盟友同時向董事會施壓要求讓他復職，據中央社（CNA）與科技新報（TechNews）轉述。中央社補充，他數天前才辭職；目前無董事會回應，復職仍是可能、並非定案。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"黃仁勳（Jensen Huang）正考慮回任輝達（NVIDIA）執行長，矽谷盟友同時向董事會施壓要求讓他復職，據金融時報（Financial Times）報導。中央社（CNA）與科技新報（TechNews）轉述的說法都強調，回任還在考慮中、並非定案，而他數天前才辭職。\\n發生了什麼事\\n金融時報（Financial Times）報導，黃仁勳（Jensen Huang）正在考慮回任輝達（NVIDIA）執行長，矽谷盟友則遊說董事會讓他復職，據中央社（CNA）與科技新報（TechNews）報導。中央社（CNA）15 日自舊金山發出的較完整報導補充，這位科技業高管數天前因與疑似中國間諜及一名下屬有婚外情而辭職。報導未提董事會回應，也沒有任何決定的時間表。\\n為什麼重要\\n創辦人執行長在因醜聞辭職數天後可能回任，是極不尋常的逆轉，而據報導董事會正承受遊說，顯示爭奪已搬上檯面。重點是輝達（NVIDIA）領導層正值未定之際、財報又即將公布，董事會的答案比傳聞重要，目前一切未定。\\n來源異同\\n中央社（CNA）與科技新報（TechNews）轉述的是同一則金融時報（Financial Times）報導，標題與核心事實一致；但兩家都源自同一出處，屬於對同一說法的認同、並非獨立查證。來源摘要中沒有實質的數字或人名衝突。\\n仍不確定\\n黃仁勳（Jensen Huang）是否真的回任、董事會如何回應、施壓的矽谷盟友是哪些人、辭職的完整經過，現有材料都未證實。婚外情的說法來自中央社（CNA）轉述的報導，在此沒有獨立證實；在輝達（NVIDIA）或董事會表態之前，回任只能視為可能、並非事實。\"},\"sources\":[{\"name\":\"TechNews 科技新報\",\"url\":\"https://finance.technews.tw/2026/11/16/financial-times-jensen-huang-reportedly-considers-rejoining-nvidia-silicon-valley-allies-pressure-board-reinstatement/\"},{\"name\":\"中央社-產經證券\",\"url\":\"https://www.cna.com.tw/news/aopl/202611160004.aspx\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourc
