:\"live-eastAsiaGossip-039-blackpink-rose-solo-world-tour-seoul-announcement\",\"category\":\"eastAsiaGossip\",\"title\":{\"en\":\"BLACKPINK's Rosé Announces Solo Arena Tour Dates Starting in Seoul\",\"zh-TW\":\"BLACKPINK 成員 Rosé 宣布啟動個人亞洲巡演 首站將於首爾連唱兩場\"},\"summary\":{\"en\":\"BLACKPINK vocalist Rosé (Park Chae-young) announced her first solo arena concert dates kicking off with a two-night run in Seoul before stops in Tokyo, Taipei, and Singapore. Fan club presales begin next week following strong streaming performance of her solo album.\",\"zh-TW\":\"南韓女團 BLACKPINK 主唱 Rosé（朴彩英）正式宣布舉行首次個人體育館巡迴演唱會，首站將於首爾連開兩場，隨後巡迴東京、台北與新加坡等城市。隨著個人專輯串流成績亮眼，官方粉絲俱樂部優先購票將於下週啟動。\"},\"body\":{\"en\":\"BLACKPINK member Rosé (朴彩英) unveiled dates for her first solo arena concert tour, opening with two shows in Seoul before traveling to major Asian stops including Tokyo, Taipei, and Singapore. Her agency THEBLACKLABEL confirmed that official fan club presale registration opens next week ahead of general ticketing.\\n\\nThe solo tour marks a major milestone for Rosé following the global chart success of her solo studio release and demonstrates sustained commercial demand for K-pop solo stadium and arena acts.\\n\\nYonhap News Agency and NME both report the Seoul opening dates, Asian tour stops, and presale schedule announced by THEBLACKLABEL.\\n\\nAdditional North American and European tour legs, along with VIP soundcheck package pricing for the Taipei stop, have yet to be disclosed.\\n\\nTrust label: Multi-source agreement — Yonhap News Agency and NME report identical tour cities and presale schedules from THEBLACKLABEL.\",\"zh-TW\":\"「發生了什麼事」\\n南韓女團 BLACKPINK 成員 Rosé（朴彩英）公開個人首次體育館巡迴演唱會日程，確定以首爾連唱兩場揭開序幕，接著前往東京、台北與新加坡等亞洲主要城市開唱。所屬廠牌 THEBLACKLABEL 證實，官方會員優先購票登記將於下週率先開放。\\n\\n「為什麼重要」\\n這是 Rosé 推出個人正規專輯並創下全球排行榜佳績後的首度大型個人巡演，不僅驗證其單飛票房號召力，也成為年底亞洲演唱會市場的指標盛事。\\n\\n「來源異同」\\n韓聯社（Yonhap News Agency）與音樂媒體 NME 均引述 THEBLACKLABEL 官方公告，對首爾開場日期、亞洲巡演城市及售票時程的報導完全一致。\\n\\n「仍不確定」\\n歐美巡演場次是否會後續追加，以及台北場次確切場館座位圖與 VIP 彩排套票售價，目前尚未公布。\"},\"glossary\":[{\"term\":{\"en\":\"THEBLACKLABEL\",\"zh-TW\":\"THEBLACKLABEL\"},\"blurb\":{\"en\":\"A South Korean record label and talent agency founded by producer Teddy Park that manages Rosé's solo activities.\",\"zh-TW\":\"由南韓王牌製作人 Teddy 創立的音樂廠牌與經紀公司，負責管理 Rosé 的個人音樂與演藝活動。\"}},{\"term\":{\"en\":\"Fan Club Presale\",\"zh-TW\":\"官方會員優先購票\"},\"blurb\":{\"en\":\"An early ticket-buying window restricted to paid members of an artist's official fan community prior to general public sales.\",\"zh-TW\":\"在公開售票前，專為付費加入藝人官方粉絲俱樂部的會員開放的提前搶票時段。\"}},{\"term\":{\"en\":\"Arena Tour\",\"zh-TW\":\"體育館巡迴演唱會\"},\"blurb\":{\"en\":\"A concert tour staged in indoor arenas typically accommodating 10,000 to 20,000 spectators per show.\",\"zh-TW\":\"在大型室內體育館舉行的巡迴演唱會，單場觀眾容量通常介於 1 萬至 2 萬人之間。\"}}],\"sources\":[{\"name\":\"Yonhap News Agency\",\"url\":\"https://en.yna.co.kr/view/AEN20261127003400315\"},{\"name\":\"NME\",\"url\":\"https://www.nme.com/news/music/blackpink-rose-announces-first-solo-asia-arena-tour-dates-3819420\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"Concert stage lighting prepared for a solo K-pop arena tour\",\"zh-TW\":\"個人流行音樂體育館巡迴演唱會舞台燈光\"},\"isHeadline\":false,\"isPopular\":true,\"trustScore\":84,\"trustBreakdown\":{\"crossCorroboration\":21,\"outletReputation\":21,\"recencyClarity\":22,\"sourceDiversity\":20},\"publishedAt\":\"2026-11-27T14:02:15.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":4,\"D2\":4,\"D3\":4,\"D4\":4,\"D5\":3,\"total\":19},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust sco
