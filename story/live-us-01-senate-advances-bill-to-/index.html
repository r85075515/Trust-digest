ters\nPermitting speed is the bottleneck for almost every big energy project in the U.S., whether fossil or renewable, so a bipartisan bill that loosens it would reshape what gets built and how fast. The opposition from environmental groups also signals the fault line: the same bill that helps clean energy could also accelerate gas pipelines and data centers. The takeaway is that the fight is now about what kind of infrastructure gets fast-tracked, not just how fast.\nSources agree / disagree\nThe Hill and The Guardian Environment agree on the core facts: the Senate advanced the bill on Monday and it aims to speed up permitting. Trust label: Two-source agreement — two outlets, same core facts, no conflicting numbers in the snippets.\nStill uncertain\nThe snippets give no vote count, no timeline for final passage, and no text of the bill's provisions. Click through to the linked outlets for the latest full reporting. Trust scores are heuristics, not fact-check guarantees."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-us-01-senate-advances-bill-to-\",\"category\":\"us\",\"adult\":false,\"isHeadline\":true,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-us-01-senate-advances-bill-to-.jpg\",\"imageAlt\":{\"en\":\"Senate vote on the bipartisan permitting bill\",\"zh-TW\":\"參議院就兩黨許可法案表決\"},\"publishedAt\":\"2026-11-10T02:28:00.000Z\",\"title\":{\"en\":\"Senate Advances Bipartisan Permitting Bill for Energy and Infrastructure\",\"zh-TW\":\"參議院推進兩黨許可法案，加速能源與基建審批\"},\"summary\":{\"en\":\"The Senate voted Monday to advance a bipartisan bill that would speed up permitting for energy and infrastructure projects, from gas pipelines to clean energy and data centers. Environmental groups oppose it, warning it could spur data centers and ICE detention facilities; next watch is the final passage vote.\",\"zh-TW\":\"參議院週一投票推進兩黨許可法案，要為能源與基礎設施項目加速審批，涵蓋天然氣管線、潔淨能源與資料中心。環保團體反對，擔心法案會刺激資料中心與移民拘留設施擴張；接下來看法案能否完成最終表決。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"美國參議院週一投票推進一項兩黨重大法案，旨在加快能源與其他基礎設施項目的建設，掃清了法案成為法律的關鍵障礙。The Hill 與《衛報》環境版皆報導了這次推進，這是上週選舉以來參議院的首次重大行動。\\n發生了什麼事\\n法案將加速從天然氣管線、潔淨能源到資料中心等項目的許可審查。參議院週一的投票讓法案跨過關鍵程序門檻。環保團體已表態反對，擔心法案會刺激資料中心與移民拘留設施擴張。\\n為什麼重要\\n許可審查速度是美國幾乎所有大型能源項目的瓶頸，無論化石能源或再生能源；一項放寬審查的兩黨法案，將改變什麼能蓋、蓋多快。環保團體的反對也點出分歧所在：同一項法案既能幫助潔淨能源，也可能加速天然氣管線與資料中心。結論是，爭論焦點已從「多快」轉向「什麼樣的基建值得加速」。\\n來源異同\\nThe Hill 與《衛報》環境版對核心事實一致：參議院週一推進法案，目標是加速許可審查。信任標籤：兩源一致——兩家媒體、核心事實相同，摘要中無數字衝突。\\n仍不確定\\n摘要未提供投票票數、最終表決時程，也未列出法案條文細節。請點連結至原文媒體查看最新完整報導。信任分數為啟發式估算，非事實查核保證。\"},\"sources\":[{\"name\":\"The Hill\",\"url\":\"https://thehill.com/newsletters/energy-environment/6209573-senate-advances-bill-to-boost-energy-and-infrastructure-teeing-up-passage/\"},{\"name\":\"The Guardian Environment\",\"url\":\"https://www.theguardian.com/us-news/2026/nov/09/senate-energy-infrastructure-bill-vote\"}],\"disagreements\":null,\"trustScore\":72,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":19,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"us\",\"live-ingest\",\"the-hill\",\"the-guardian-environment\"],\"glossary\":[{\"term\":{\"en\":\"U.S. Senate\",\"zh-TW\":\"美國參議院\"},\"blurb\":{\"en\":\"The upper chamber of the U.S. Congress, which votes on bills before they become law.\",\"zh-TW\":\"美國國會的上議院，法案須經其表決才能成為法律。\"}},{\"term\":{\"en\":\"Permitting review\",\"zh-TW\":\"許可審查\"},\"blurb\":{\"en\":\"The government approval process for building energy and infrastructure projects.\",\"zh-TW\":\"能源與基礎設施項目動工前須通過的政府審批程序。\"}},{\"term\":{\"en\":\"Bipartisan bill\",\"zh-TW\":\"兩黨法案\"},\"blurb\":{\"en\":\"Legislation backed by members of both major U.S. parties.\",\"zh-TW\":\"獲得美國兩大黨議員共同支持的法案。\"}},{\"term\":{\"en\":\"Data center\",\"zh-TW\":\"資料中心\"},\"blurb\":{\"en\":\"A facility housing servers that power AI and cloud services.\",\"zh-TW\":\"裝載伺服器的設施，為人工智慧與雲端服務提供算力。\"}},{\"term\":{\"en\":\"ICE detention facility\",\"zh-TW\":\"移民拘留設施\"},\"blurb\":{\"en\":\"A facility run by U.S. Immigration and Customs Enforcement to detain migra
