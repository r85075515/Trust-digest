nThis is a public statement by a senior political figure, and it matters as a signal: the head of the legislature is publicly backing AI adoption in governance, not warning against it. The takeaway is the direction of travel — the foundation is positioning itself to experiment with AI in democratic processes — while the specifics of what it will actually do remain to be seen.\nSources agree / disagree\nOnly CNA carries the remarks in the feed, so there is no independent corroboration. Trust label: Single source — one outlet, a public statement, no cross-check in the snippets. The statement itself is directly quoted, so the wording is attributable to Han.\nStill uncertain\nThe snippets give no concrete projects, timelines, or budget for the foundation's AI plans. Those details should be checked against CNA's full report."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-01-ai\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-taiwan-01-ai.jpg\",\"imageAlt\":{\"en\":\"Han Kuo-yu on bringing AI into democratic governance\",\"zh-TW\":\"韓國瑜談把 AI 導入民主治理\"},\"publishedAt\":\"2026-11-10T07:31:20.000Z\",\"title\":{\"en\":\"Han Kuo-yu: Taiwan Democracy Foundation to Bring AI Into Democratic Governance\",\"zh-TW\":\"韓國瑜：台灣民主基金會要把 AI 導入民主治理\"},\"summary\":{\"en\":\"[Unconfirmed · single source] Legislative Yuan President and Taiwan Foundation for Democracy Chairman Han Kuo-yu said AI development is an unstoppable trend, and the foundation wants to boldly bring AI into democratic governance. 'Whether my job could be replaced by AI in the future — let's wait and see,' he said, speaking in Taipei on November 10.\",\"zh-TW\":\"［未證實·單一來源］立法院長、台灣民主基金會董事長韓國瑜表示，人工智慧發展應用已是大勢所趨，基金會期盼以大膽創新的方式把 AI 導入民主治理，開啟更多想像與可能性。他笑稱：「我的工作未來是不是有可能被 AI 取代，讓我們拭目以待。」（中央社 11 月 10 日台北報導）\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"立法院長、台灣民主基金會董事長韓國瑜表示，人工智慧的發展與應用已經是大勢所趨，基金會期盼透過大膽且創新的方式導入 AI，為民主治理開啟更多想像與可能性。他在 11 月 10 日台北的活動上說：「我的工作未來是不是有可能被 AI 取代，讓我們拭目以待。」\\n發生了什麼事\\n韓國瑜在台北一場基金會活動上表示，AI 的發展與應用已是大勢所趨，台灣民主基金會期盼以大膽創新的方式把 AI 導入民主治理。他打趣說，連自己的工作未來都可能被 AI 取代。\\n為什麼重要\\n這是資深政治人物的公開發言，意義在於風向：立法院長公開支持把 AI 導入治理，而非對其提出警告。結論是方向已定——基金會正把自己定位為在民主程序中試驗 AI 的角色——至於實際會做什麼，仍待觀察。\\n來源異同\\n來源中只有中央社報導這番談話，無法獨立查證。信任標籤：僅1源——單一媒體、公開發言，摘要中無交叉佐證；發言本身為直接引述，用詞可歸於韓國瑜本人。\\n仍不確定\\n摘要未提供基金會 AI 計畫的具體項目、時程或預算。這些細節請對照中央社完整報導。\"},\"sources\":[{\"name\":\"中央社-政治\",\"url\":\"https://www.cna.com.tw/news/aipl/202611100187.aspx\"}],\"disagreements\":null,\"trustScore\":59,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"中央社-政治\"],\"glossary\":[{\"term\":{\"en\":\"Han Kuo-yu\",\"zh-TW\":\"韓國瑜\"},\"blurb\":{\"en\":\"President of the Legislative Yuan and chairman of the Taiwan Foundation for Democracy.\",\"zh-TW\":\"立法院長、台灣民主基金會董事長。\"}},{\"term\":{\"en\":\"Taiwan Foundation for Democracy\",\"zh-TW\":\"台灣民主基金會\"},\"blurb\":{\"en\":\"The foundation chaired by Han that plans to introduce AI into governance.\",\"zh-TW\":\"韓國瑜擔任董事長、計畫導入 AI 的基金會。\"}},{\"term\":{\"en\":\"Democratic governance\",\"zh-TW\":\"民主治理\"},\"blurb\":{\"en\":\"The running of democratic institutions and processes.\",\"zh-TW\":\"民主制度與程序的運作方式。\"}},{\"term\":{\"en\":\"CNA\",\"zh-TW\":\"中央社\"},\"blurb\":{\"en\":\"Taiwan's Central News Agency, the source of the report.\",\"zh-TW\":\"本則報導的來源、台灣中央通訊社。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"hr
