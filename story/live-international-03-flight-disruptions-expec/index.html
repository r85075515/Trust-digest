nto Monday. Congress recently gave the Department of Transportation $12.5 billion to upgrade the aging air traffic control system — and President Trump wants more.\nWhat happened\nThe FAA halted departures across the country for more than four hours, and the knock-on delays were still being felt two days later. NPR reports the disruptions are expected to last into Monday. CNBC's headline strikes a similar note — 'We slept here': delays linger, but the schedule is back on track for Monday — suggesting the backlog is clearing even as passengers still feel it. The disruption lands against a policy backdrop: Congress recently gave the Department of Transportation $12.5 billion to upgrade the aging air traffic control system, and President Trump wants more funding.\nWhy it matters\nA nationwide ground stop of more than four hours does not unwind in a day; aircraft and crews end up in the wrong places, and the ripple lasts into the working week. The $12.5 billion upgrade is the longer story: the outage turned an old argument about the air traffic control system into a live one, with the White House pushing for more. For travelers, the practical read is that Monday is a transition day, not a clean reset.\nSources agree / disagree\nCNBC and NPR agree on the core facts: a nationwide FAA ground stop lasting more than four hours, disruptions lingering two days on, and an expectation they run into Monday. Their framing differs slightly — NPR stresses the disruption lasting into Monday, CNBC stresses the schedule getting back on track for Monday — but the two are compatible, describing the same tail end of the backlog from different angles. Both also carry the $12.5 billion upgrade figure and Trump's push for more. No numeric or name conflicts appear.\nTrust label: Two-source agreement — CNBC and NPR agree on the ground stop, the lingering delays and the funding figure.\nStill uncertain\nThe snippets give no cancellation or delay totals, no list of the hardest-hit airports, and no detail on how much more funding Trump is seeking or for what. Verify current flight status with your airline before traveling."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-03-flight-disruptions-expec\",\"category\":\"international\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-international-03-flight-disruptions-expec.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Flight disruptions expected to last into Monday\",\"zh-TW\":\"相關封面圖：航班中斷預計將持續到週一\"},\"publishedAt\":\"2026-11-16T01:19:28.000Z\",\"title\":{\"en\":\"Flight Disruptions Expected to Last Into Monday After Nationwide FAA Ground Stop\",\"zh-TW\":\"美國聯邦航空管理局（FAA）全國停飛逾四小時後，航班中斷預計延續至週一\"},\"summary\":{\"en\":\"Flight disruptions lingered two days after the FAA grounded departures nationwide for more than four hours, and are expected to last into Monday. Congress recently gave the Department of Transportation $12.5 billion to upgrade the aging air traffic control system, and President Trump wants more. The takeaway: the backlog is easing but not cleared — check your flight.\",\"zh-TW\":\"美國聯邦航空管理局（FAA）全國停飛逾四小時兩天後，航班中斷仍未消除，預計延續至週一。國會最近撥款 125 億美元給交通部升級老舊的空中交通管制系統，川普（Donald Trump）總統還想要更多。重點：積壓正在緩解但尚未清空，出發前先查航班狀態。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"美國聯邦航空管理局（FAA）全國停飛逾四小時兩天後，航班中斷仍未消除，預計延續至週一。國會最近撥款 125 億美元給交通部，用於升級老舊的空中交通管制系統，川普（Donald Trump）總統還想要更多。\\n發生了什麼事\\nFAA 讓全美航班停飛逾四小時，連鎖延誤兩天後仍在發酵。NPR 報導，中斷預計延續至週一；CNBC 的標題語氣相近——「我們睡在這裡」：延誤持續，但週一航班已恢復正常——顯示積壓正在消化，旅客仍感受得到。事件背後有政策背景：國會最近撥款 125 億美元給交通部升級老舊的空中交通管制系統，川普總統還想要更多經費。\\n為什麼重要\\n全國停飛逾四小時，不是一天就能收拾的；飛機與機組員被打亂位置，漣漪會拖進工作週。125 億美元升級案是更長的故事：這次停擺把空中交通管制系統老舊的老爭論，變成了眼前的議題，白宮還在推動加碼。對旅客來說，務實的解讀是週一是過渡日，不是乾淨重啟。\\n來源異同\\nCNBC 與 NPR 核心事實一致：FAA 全國停飛逾四小時、中斷兩天後仍在延續、預計拖進週一。兩家措辭略有不同——NPR 強調中斷延續至週一，CNBC 強調週一航班恢復正常——但兩者可以並存，是從不同角度描述同一波積壓的尾聲。兩家也都提到 125 億美元升級經費與川普要求更多。沒有數字或人名衝突。\\n仍不確定\\n摘要沒有取消或延誤總數、沒有受影響最嚴重的機場名單，也沒有川普要求追加多少經費、用途為何的細節。出發前請先向航空公司確認最新航班狀態。\"},\"sources\":[{\"name\":\"CNBC\
