ands dead or missing. California Governor Gavin Newsom was a big presence in Antalya last week, heading a US delegation that attended unofficially because President Donald Trump withdrew the United States from the international summit. A Guardian live blog covering the same talks says campaigners call the rich world's offer 'crumbs' to help poor countries adapt to climate breakdown.\nWhy it matters\nCOP31 is the moment the editorial says the cycle must break: without debt relief and real adaptation money, the countries hit hardest by climate disasters will keep sending money to creditors instead of building defences. The $50 million pledge against last year's larger promise is the editorial's evidence that the rich world is still offering far too little.\nSources agree / disagree\nBoth items come from The Guardian's climate coverage — an editorial and a live blog — so the $50 million figure and the 'crumbs' framing are one outlet's account, not cross-outlet corroboration. No numeric conflicts appear in the snippets.\nStill uncertain\nThe full text of the editorial is truncated in the feed, so the specific debt-relief measures it proposes are not in the snippets. Last year's pledged total is described only as more than double $50 million, not given as a figure. Verify on the publisher page.\nTrust label: Single source"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-energy-02-the-guardian-view-on-cli\",\"category\":\"energy\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-energy-02-the-guardian-view-on-cli.jpg\",\"imageAlt\":{\"en\":\"Cover related to: The Guardian view on climate and debt: a vicious cycle the world must break at Cop31 | Editorial\",\"zh-TW\":\"相關封面圖：《衛報》對氣候和債務的看法：世界必須在第 31 屆締約方會議上打破惡性循環 |社論\"},\"publishedAt\":\"2026-11-18T15:34:06.000Z\",\"title\":{\"en\":\"Guardian Editorial: Climate Debt Cycle Must Break at COP31 as Rich Nations Offer 'Crumbs'\",\"zh-TW\":\"《衛報》社論：氣候債務惡性循環須在 COP31 打破，富國僅承諾 5000 萬美元\"},\"summary\":{\"en\":\"Wealthy polluters promised $50 million for an adaptation fund this week — less than half of what countries pledged at last year's climate summit, The Guardian reports. Poor countries pay creditors instead of preparing for climate disasters. COP31 must break that cycle. Watch whether pledges turn into cash.\",\"zh-TW\":\"富裕的污染者本週承諾向適應基金投入 5000 萬美元，不到去年氣候峰會各國承諾金額的一半，《衛報》（The Guardian）報導。窮國把錢付給債權人，而不是防範氣候災難。COP31 必須打破這個循環；接下來看承諾能否變成現金。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"《衛報》（The Guardian）社論指出，富裕的污染者本週承諾向適應基金投入 5000 萬美元，不到去年氣候峰會各國承諾金額的一半；社論呼籲第 31 屆聯合國氣候變遷大會（COP31）打破氣候與債務的惡性循環。\\n發生了什麼事\\n社論指出，窮國把錢付給債權人，而不是用來防範氣候災難，國際金融體系一直在加深它們的脆弱性。8 月襲擊尼泊爾喜馬拉雅山區的災難始於冰川崩塌，冰雪崩落引發致命洪水，沖毀村莊、橋梁與道路，造成數千人死亡或失蹤。加州州長加文·紐森（Gavin Newsom）上週在安塔利亞（Antalya）高調亮相，率領美國代表團非正式出席，原因是川普（Trump）總統讓美國退出這場國際峰會。《衛報》同一主題的即時報導引述倡議人士的說法，稱富國的援助只是幫助窮國適應氣候崩潰的「麵包屑」。\\n為什麼重要\\n社論認為 COP31 就是打破循環的時機：沒有債務減免與真正的適應資金，受氣候災難衝擊最重的國家會繼續把錢送給債權人，而不是建立防禦。5000 萬美元的承諾對照去年更大的承諾，正是社論所說富國給得太少的證據。\\n來源異同\\n兩則內容都出自《衛報》氣候報導——一篇社論、一篇即時報導——5000 萬美元數字與「麵包屑」說法屬於同一媒體的敘述，沒有跨媒體佐證。摘要片段中沒有數字衝突。\\n仍不確定\\nFeed 摘要截斷了社論全文，社論主張的具體債務減免措施不在摘要內；去年承諾總額只說是 5000 萬美元的一倍以上，沒有給出數字。引用前請查閱原文。\"},\"sources\":[{\"name\":\"The Guardian Climate Crisis\",\"url\":\"https://www.theguardian.com/environment/live/2026/nov/18/cop31-climate-crisis-talks-turkey-latest-news-updates\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"energy\",\"live-ingest\",\"the-guardian-climate-crisis\",\"the-guardian-climate-crisis\"],\"glossary\":[{\"term\":{\"en\":\"COP31\",\"zh-TW\":\"第 31 屆聯合國氣候變遷大會\"},\"blurb\":{\"en\":\"The 31st UN climate conference, held in Turkey.\",\"zh-TW\":\"在土耳其舉行的第 31 屆聯合國氣候變遷大會。\"}},{\"term\":{\"en\":\"Adaptation fund\",\"zh-TW\":\"適應基金\"},\"blurb\":{\"en\":\"Fund to help poor countries adapt to climate change.\",\"zh-TW\":\"協助窮國適應氣候變遷的基金。\"}},{\"term\":{\"en\":\"Gavin Newsom\",\"zh-TW\":\"加文·紐森\"},\"blurb\":{\"en\":\"Governor of California, heading the unofficial US delegation.\",\"zh-TW\":\"率領美國非正式代表團的加州州長。\"}},{\"term\":{\"en\":\"The Guardian\",\"zh-TW\":\"《衛報》\"},\"blurb\":{\"en\":\"British newspaper whose editorial and live blog cover COP31.\",\"zh-TW\":\"報導 COP31 社論與即時消息的英國報紙。\"}},{\"term\":{\"en\":\"Antalya\",\"zh-TW\":\"安塔利亞\"},\"blurb\":{\"en\":\"Turkish city where Newsom led the US delegation.\",\"zh-TW\":\"紐森率領美國代表團出席的土耳其城市。\"}},{\"term\":{\"en\":\"Nepal Himalayas\",\"zh-TW\":\"尼泊爾喜馬拉雅山區\"},\"blurb\":{\"en\":\"Site of the August glacier-collapse floods.\",\"zh-TW\":\"8 月冰川崩塌洪災發生的地點。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-energy-02-the-guardian-view-on-cli/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-energy-02-the-guardian-view-on-cli/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, a
