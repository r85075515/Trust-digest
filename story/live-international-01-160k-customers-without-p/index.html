after forming with 80mph winds and 975mb pressure. As recovery entered its third day, about 160,000 customers across the southeastern US were still without power.\nWhat happened\nThe Guardian reports Isaias became the 2026 season's first Atlantic hurricane, smashing the satellite-era record for the latest first storm of a season that began in June; NOAA had expected it to reach Category 2 as it neared the northern Gulf coast. Grist calls the timing \"astounding\" for an otherwise typical storm. Peak outages numbered approximately 950,000. Utility Dive reports utilities crediting grid modernization for keeping more customers on and speeding restoration — FPL said its underground lines performed eight times better than overhead ones. At least four deaths were linked to the storm. As Isaias's remnants moved north Sunday with moderate to heavy rain across the central Appalachians and mid-Atlantic, nearly 396,000 customers across the Florida Panhandle and southern Alabama remained without power, with flash-flood warnings stretching into the Appalachians.\nWhy it matters\nA record-late first hurricane that still knocks out nearly a million customers at peak is a stress test for grid hardening. FPL's 8x underground-vs-overhead figure will be quoted in every utility capex debate this winter.\nSources agree / disagree\nThe Guardian, Grist, and Utility Dive agree on the storm's record timing and severity. Outage counts differ by reporting time — Utility Dive's headline cites 120,000 remaining while the body and card headline cite 160,000 — consistent with restoration in progress rather than a factual dispute.\nStill uncertain\nSnippets give no final damage estimate or full casualty accounting. Verify the latest restoration figures on utility and publisher pages."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-01-160k-customers-without-p\",\"category\":\"international\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-international-01-160k-customers-without-p.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 160K customers without power in Southeastern US as Hurricane Isaias recovery enters third day\",\"zh-TW\":\"相關封面圖：伊薩亞斯颶風恢復進入第三天，美國東南部 16 萬用戶斷電\"},\"publishedAt\":\"2026-10-12T12:29:53.000Z\",\"title\":{\"en\":\"Hurricane Isaias Leaves 160K Without Power as Recovery Enters Third Day\",\"zh-TW\":\"颶風伊薩亞斯（Isaias）災後復原進入第三天，美國東南部 16 萬戶仍斷電\"},\"summary\":{\"en\":\"About 160,000 customers remained without power in the southeastern US as recovery from Hurricane Isaias — the first Atlantic hurricane of 2026 — entered its third day. Isaias peaked at Category 3 before landfall along the Florida Panhandle; peak outages hit roughly 950,000 and at least four deaths were linked to the storm.\",\"zh-TW\":\"2026 年首個大西洋颶風伊薩亞斯（Isaias）災後復原進入第三天，美國東南部仍有約 16 萬戶斷電。伊薩亞斯登陸佛羅裡達狹長地帶（Florida Panhandle）前曾增強為三級颶風；停電高峰約 95 萬戶，至少 4 人死亡與風暴相關。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"2026 年第一個大西洋颶風來得離譜地晚——威力卻一點不含糊。颶風伊薩亞斯（Isaias）在預計週五晚間登陸佛羅裡達狹長地帶（Florida Panhandle）前增強為三級颶風，生成時風速 80 英里、氣壓 975 毫巴。災後復原進入第三天，美國東南部仍有約 16 萬戶斷電。\\n發生了什麼事\\n《衛報》（The Guardian）報導，伊薩亞斯成為 2026 年季第一個大西洋颶風，打破衛星時代最晚首颶風紀錄（颶風季 6 月就開始了）；美國國家海洋暨大氣總署（NOAA）原本預期它接近墨西哥灣北部海岸時增強為二級。Grist 以「驚人」形容這場本質典型、時機卻反常的風暴。停電高峰約 95 萬戶。Utility Dive 報導，電力公司把電網現代化歸功於讓更多用戶免於斷電並加速復電——佛州電力（FPL）稱其地下線路表現是架空線路的八倍。至少 4 人死亡與風暴相關。週日伊薩亞斯殘餘環流北移，為阿巴拉契亞山脈中部與大西洋中部帶來中到大雨，佛羅裡達狹長地帶與阿拉巴馬州南部仍有近 39.6 萬戶斷電，山洪警報延伸至阿巴拉契亞山區。\\n為什麼重要\\n一場破紀錄晚到、卻仍在高峰造成近百萬戶斷電的首颶風，是對電網強化的壓力測試。佛州電力「地下線路八倍表現」的數字，這個冬天會被每一場電力公司資本支出辯論引用。\\n來源異同\\n《衛報》、Grist、Utility Dive 對風暴破紀錄的時機與強度看法一致。停電數字因報導時間而異——Utility Dive 標題寫 12 萬戶，內文與本卡標題為 16 萬戶——與復電進行中的時間差相符，而非事實爭議。\\n仍不確定\\n摘要沒有最終災損估計與完整傷亡統計；最新復電數字請查閱電力公司與媒體頁面。\"},\"sources\":[{\"name\":\"The Guardian World\",\"url\":\"https://www.theguardian.com/environment/2026/oct/09/isaias-strengthens-first-atlantic-hurricane-2026\"},{\"name\":\"Grist\",\"url\":\"https://grist.org/extreme-weather/hurricane-isaias-is-a-typical-storm-but-its-also-astounding/\"},{\"name\":\"Utility Dive\",\"url\":\"https://www.utilitydive.com/news/isaias-recovery-enters-third-day-120k-remain-without-power/832698/\"}],\"disagreements\":{\"en\":\"Outage counts differ by reporting time: 120K in Utility Dive's headline vs 160K in the card headline.\",\"zh-TW\":\"停電數字因報導時間而異：Utility Dive 標題為 12 萬戶，本卡標題為 16 萬戶。\"},\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":20,\"outletReputation\":20,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"international\",\"live-ingest\",\"the-guardian-world\",\"grist\",\"utility-dive\"],\"glossary\":[{\"term\":{\"en\":\"Hurricane Isaias\",\"zh-TW\":\"颶風伊薩亞斯\"},\"blurb\":{\"en\":\"First Atlantic hurricane of 2026; peaked at Category 3.\",\"zh-TW\":\"2026 年首個大西洋颶風，最高增強為三級。\"}},{\"term\":{\"en\":\"NOAA\",\"zh-TW\":\"美國國家海洋暨大氣總署\"},\"blurb\":{\"en\":\"US agency that forecast Isaias's strengthening.\",\"zh-TW\":\"預報伊薩亞斯增強的美國機構。\"}},{\"term\":{\"en\":\"Florida Panhandle\",\"zh-TW\":\"佛羅裡達狹長地帶\"},\"blurb\":{\"en\":\"Region where Isaias was predicted to make landfall.\",\"zh-TW\":\"伊薩亞斯預計登陸的區域。\"}},{\"term\":{\"en\":\"FPL\",\"zh-TW\":\"佛州電力\"},\"blurb\":{\"en\":\"Utility whose underground lines outperformed overhead 8x.\",\"zh-TW\":\"地下線路表現為架空線路八倍的電力公司。\"}},{\"term\":{\"en\":\"Appalachians\",\"zh-TW\":\"阿巴拉契亞山脈\"},\"blurb\":{\"en\":\"Mountain region hit by the storm's northward remnants.\",\"zh-TW\":\"遭風暴殘餘環流北移侵襲的山區。\"}},{\"term\":{\"en\":\"Gulf of Mexico\",\"zh-TW\":\"墨西哥灣\"},\"blurb\":{\"en\":\"Where Isaias formed before heading for the coast.\",\"zh-TW\":\"伊薩亞斯生成後撲向海岸的海域。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW
