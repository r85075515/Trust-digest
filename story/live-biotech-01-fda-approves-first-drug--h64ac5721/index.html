ppened\nFDA Approves First Drug Shown to Help Patients with Infantile-Onset Niemann-Pick Disease Type C Live Longer. The latest approval represents a large market opportunity for a drug Roche has touted to become a top-selling, multibillion-dollar product. The U.S. Food and Drug Administration today approved the first medicine for treating limb-girdle muscular dystrophy type 2I/R9 (LGMD2I/R9), a rare inherited muscle disease, for adults and pediatric patients weighing at least 30 kg. The FDA today approved Wilserdly (giredestrant), used alone after surgery in adults with estrogen receptor–positive, HER2-negative breast cancer — the most common subtype of the disease. FDA today approved Infilbray (venglustat) tablets, the first treatment for the neurological symptoms of Type 3 Gaucher disease (GD3) in adults and pediatric patients weighing at least 15 kg (approximately 33 pounds). Why it matters\nThis cluster was assembled from 7 feed item(s) across 2 outlet(s) (BioPharma Dive, FDA 新聞稿) in the biotech category. Axiom links out to each publisher; this digest only restates titles and short feed descriptions — not full articles. Sources agree / disagree\nMultiple outlets are covering closely related headlines: \"FDA clears Roche’s oral SERD as treatment in early-stage breast cancer\" (BioPharma Dive); \"FDA Approves First Treatment for Limb-Girdle Muscular Dystrophy Type 2I/R9\" (FDA 新聞稿); \"FDA Approves First New Hormone Therapy for Early-Stage Breast Cancer in More Than 20 Years\" (FDA 新聞稿); \"FDA Approves First Drug to Treat Neurological Symptoms of Type 3 Gaucher Disease\" (FDA 新聞稿); \"FDA Approves First Drug Shown to Help Patients with Infantile-Onset Niemann-Pick Disease Type C Live Longer\" (FDA 新聞稿).\nFigures differ across outlets (e.g. 30 vs 20 in headlines/snippets). Still uncertain\nFeed descriptions can omit context, updates, or corrections. Click through to the linked outlets for the latest full reporting. Trust scores are heuristics, not fact-check guarantees. Linked sources (outlet names only): BioPharma Dive, FDA 新聞稿"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-biotech-01-fda-approves-first-drug--h64ac5721\",\"category\":\"biotech\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-biotech-01-fda-approves-first-drug--h64ac5721.webp\",\"imageAlt\":{\"en\":\"Cover related to: FDA Approves First Drug Shown to Help Patients with Infantile-Onset Niemann-Pick Disease Type C Live Longer\",\"zh-TW\":\"相關封面圖：FDA 核准首個藥物可幫助患有嬰兒期尼曼匹克症 C 型患者延長壽命\"},\"publishedAt\":\"2026-11-24T15:36:00.000Z\",\"title\":{\"en\":\"FDA Approves First Drug Shown to Help Patients with Infantile-Onset Niemann-Pick Disease Type C Live Longer\",\"zh-TW\":\"FDA 核准首個藥物可幫助患有嬰兒期尼曼匹克症 C 型患者延長壽命\"},\"summary\":{\"en\":\"The latest approval represents a large market opportunity for a drug Roche has touted to become a top-selling, multibillion-dollar product.\",\"zh-TW\":\"最新的批准代表了羅氏這款藥物的巨大市場機會，該藥物已被羅氏吹捧為最暢銷的數十億美元產品。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"最新的批准代表了羅氏這款藥物的巨大市場機會，該藥物已被羅氏吹捧為最暢銷的數十億美元產品。 發生了什麼事\\nFDA 核准第一種藥物，可幫助患有嬰兒期尼曼匹克症 C 型患者延長壽命。最新的批准代表了羅氏這款藥物的巨大市場機會，該藥物已被羅氏吹捧為最暢銷的數十億美元產品。美國食品藥物管理局今天批准了第一種用於治療 2I/R9 型肢帶型肌肉營養不良症 (LGMD2I/R9) 的藥物，這是一種罕見的遺傳性肌肉疾病，適用於體重至少 30 公斤的成人和兒童患者。 FDA 今天批准了 Wilserdly（giredestrant），該藥物在患有雌激素受體陽性、HER2 陰性乳癌（該疾病最常見的亞型）的成人手術後單獨使用。 FDA 今天批准了 Infilbray (venglustat) 片劑，這是第一個用於治療體重至少 15 公斤（約 33 磅）的成人和兒童患者 3 型戈謝病 (GD3) 神經症狀的藥物。 為什麼這很重要\\n此集群由生物技術類別中 2 個管道（BioPharma Dive、FDA 新聞稿）的 7 個飼料項目組成。 Axiom 連結到每個出版商；該摘要僅重述標題和簡短的提要描述，而不是完整的文章。 消息來源同意/不同意\\n多家媒體報告了密切相關的頭條新聞：「FDA 批准羅氏的口服 SERD 作為早期乳癌的治療方法」(BioPharma Dive)；「FDA 批准首個治療 2I/R9 型肢帶型肌營養不良症的藥物」(FDA 新聞稿)；「FDA 批准 20 類型：FDA 治療早期乳癌的新荷爾蒙療法」（FDA 新聞稿）； 「FDA 批准第一種藥物可幫助患有 C 型嬰兒型尼曼匹克病的患者活得更長」（FDA 新聞稿）。\\n不同媒體的數字有所不同（例如，標題/摘要中的數字為 30 比 20）。 仍不確定\\n摘要描述可以省略上下文、更新或更正。點擊連結的管道以獲取最新的完整報告。信任分數是啟發式的，而不是事實檢定的保證。 連結來源（僅限通路名稱）：BioPharma Dive、FDA 新聞\"},\"sources\":[{\"name\":\"BioPharma Dive\",\"url\":\"https://www.biopharmadive.co
