llegations against him.\nWhat happened\nAccording to a November 23 dispatch from San Francisco by the Central News Agency (CNA), citing Reuters, Huang reversed his fortunes in 11 days, moving from unwelcome figure to back in power at Nvidia. His return came even before the company formally began investigating a number of allegations, and Reuters noted that such a swift return to the top is rare in the technology and business worlds. The short report gives no dates for Huang's departure or his return, and no details of the allegations or of the investigations.\nWhy it matters\nThe speed of the comeback is the story: 11 days from exile to the chief executive's office is an unusually short turnaround for a company of Nvidia's size and prominence, and it raises questions about how the board weighed the unresolved allegations against the value of Huang's leadership. In an industry where chief executive successions usually take months of search and vetting, a return before investigations formally begin also tests how much scrutiny a star founder-executive faces — and how much the market and the board are willing to set aside for continuity at the top of the world's most closely watched artificial intelligence company.\nSources agree / disagree\nThis card rests on a single source: the CNA dispatch relaying Reuters. No other outlet in the material corroborates the 11-day timeline or the timing of the investigations, so the account cannot be cross-checked here. The claim is attributed to Reuters, which makes its origin traceable, but a single relayed wire report is a thin basis for the details. Trust label: Single source — the account comes from one CNA dispatch relaying Reuters and has no independent corroboration in the material provided.\nStill uncertain\nThe material names no specific allegation, no accuser, and no investigative body or process. It does not say when Huang left, what triggered his departure, who decided on his return, or whether the investigations have since begun. Without those details, the comeback's causes — and its consequences for Nvidia's governance — remain unclear."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-02-ai-hf7a93f3f\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-taiwan-02-ai-hf7a93f3f.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 路透：黃仁勳以AI速度重返輝達　科技界商界迅速回鍋先例不多\",\"zh-TW\":\"相關封面圖：（譯文待補）路透：黃仁勳以AI速度重返輝達　科技界商界迅速回鍋先例不多\"},\"publishedAt\":\"2026-11-24T05:29:14.000Z\",\"title\":{\"en\":\"Jensen Huang Returns as Nvidia CEO in 11 Days, Reuters Reports\",\"zh-TW\":\"路透：黃仁勳（Jensen Huang）11天重掌輝達（Nvidia）\"},\"summary\":{\"en\":\"[Unverified, single source] Nvidia chief executive Jensen Huang went from outcast to back in charge in just 11 days, returning before the company formally opened investigations into multiple allegations against him, in a comeback Reuters describes as unusually fast for technology and business.\",\"zh-TW\":\"［未證實·單一來源］輝達（Nvidia）執行長黃仁勳（Jensen Huang）從不受歡迎人物到重掌大權只花了11天，甚至早於公司對多項指控正式展開調查；路透指出，科技界與商界如此迅速的回鍋先例不多。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"在人工智慧時代，一切步調飛快，連企業高層的東山再起也不例外。輝達（Nvidia）執行長黃仁勳（Jensen Huang）從不受歡迎人物到重掌大權只花了11天，而且回鍋時機甚至早於公司對多項指控正式展開調查。\\n發生了什麼事\\n中央社11月23日自舊金山發稿、引述路透報導指出，黃仁勳短短11天便反轉局勢，從不受歡迎人物變回輝達掌舵者。他的回鍋時機甚至早於公司對多項指控正式展開調查；路透指出，科技界與商界如此迅速的回鍋先例不多。素材未提供黃仁勳去職與回任的日期，也未說明指控內容與調查細節。\\n為什麼重要\\n關鍵在速度：11天從失勢到重掌一家舉足輕重的公司，是極不尋常的轉折，也讓人質疑董事會如何在尚未解決的指控與黃仁勳的領導價值之間取捨。企業執行長交接通常需要數月的物色與審查，在調查尚未正式展開前就讓明星創辦人回任，也考驗著市場與董事會願意為高層延續性放下多少監督。在人工智慧產業最受矚目的公司，這樣的安排格外引人注目。\\n來源異同\\n本卡僅有中央社一則報導，內容引述路透；素材中沒有其他媒體佐證，也無法交叉核對11天或調查時序等說法。信任標籤：僅1源——本卡僅依據中央社引述路透的一則報導，素材中無其他來源佐證。\\n仍不確定\\n素材未說明指控的具體內容、指控者身分，也未說明調查由誰進行、採取何種程序。黃仁勳何時去職、去職原因、由誰決定讓他回任，以及調查後來是否展開，素材都沒有交代。缺乏這些細節，回鍋的原因與對輝達公司治理的影響仍不清楚。\"},\"sources\":[{\"name\":\"中央社-國際\",\"url\":\"https://www.cna.com.tw/news/aopl/202611240122.aspx\"}],\"disagreements\":null,\"trustScore\":59,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"中央社-國際\"],\"glossary\":[{\"blurb\":{\"en\":\"Co-founder and chief executive of Nvidia.\",\"zh-TW\":\"輝達共同創辦人暨執行長。\"},\"term\":{\"en\":\"Jensen Huang\",\"zh-TW\":\"黃仁勳\"}},{\"blurb\":{\"en\":\"A leading designer of artificial intelligence chips.\",\"zh-TW\":\"人工智慧晶片設計龍頭業者。\"},\"term\":{\"en\":\"Nvidia\",\"zh-TW\":\"輝達\"}},{\"blurb\":{\"en\":\"An international news agency.\",\"zh-TW\":\"國際通訊社。\"},\"term\":{\"en\":\"Reuters\",\"zh-TW\":\"路透\"}},{\"blurb\":{\"en\":\"Taiwan's national news agency.\",\"zh-TW\":\"台灣的國家通訊社。\"},\"term\":{\"en\":\"Central News Agency (CNA)\",\"zh-TW\":\"中央社\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-taiwan-02-ai-hf7a93f3f/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-taiwan-02-ai-hf7a93f3f/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest wi
