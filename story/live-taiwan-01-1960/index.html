 The rebound tracked a regional recovery: US stocks bounced hard on Friday, the Philadelphia Semiconductor Index rose more than 4%, Japan's Nikkei at one point gained more than 2,000 points, and South Korean shares turned positive to as high as 5,172.\nWhy it matters\nThe judgment is about durability, not drama: a one-day surge proves the state can move the market, not that the bottom is in. Analysts cited in the coverage say the test now is whether the index can hold above its five-day moving average and whether foreign investors switch from selling to buying. Until then, the rebound is a relief rally with official backing.\nSources agree / disagree\nCNA and PTS agree on the rebound and on the two policy levers behind it. Their figures differ because they measure different things: CNA reports the closing gain of 1,960.06 points to 41,661.7, while PTS reports the intraday peak of more than 2,400 points. Trust label: Two-source agreement — two outlets agree on the rebound; closing and intraday figures are presented separately.\nStill uncertain\nWhether the market has truly bottomed is unresolved, and the analysts quoted say the answer depends on US stocks, the five-day line, and foreign flows. The snippets give no foreign-investor trading figures for the day."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-01-1960\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-taiwan-01-1960.jpg\",\"imageAlt\":{\"en\":\"Taiwan stocks surge to the second-largest gain on record\",\"zh-TW\":\"台股大漲1960點創史上次高漲點\"},\"publishedAt\":\"2026-11-09T07:29:24.000Z\",\"title\":{\"en\":\"Taiwan Stocks Surge 1,960 Points, Second-Biggest Gain Ever\",\"zh-TW\":\"台股收漲1960點、史上次高：國安基金與限空令雙箭齊發\"},\"summary\":{\"en\":\"Taiwan's benchmark index closed up 1,960.06 points at 41,661.7, the second-largest closing gain on record, after the National Stabilization Fund stepped in for a tenth time and regulators tightened short-selling rules. TSMC jumped more than 7% intraday, with the index at one point up 2,647 points.\",\"zh-TW\":\"台股終場上漲1960.06點、收41661.7點，創史上第二大收盤漲點。國安基金第10度授權進場、金管會限空令雙箭齊發，台積電盤中漲逾7%，指數盤中一度大漲2647點。投顧提醒：是否真正落底，仍須看美股走勢。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"台股週一報復性強彈，加權指數終場上漲1960.06點、收41661.7點，創史上第二大收盤漲點。國安基金第10度授權進場，加上金管會限空令雙箭齊發，市場解讀為官方出面護盤。\\n發生了什麼事\\n台股開高反彈，一路走高。中央社報導，台積電盤中漲逾7%，多檔跌深權值股與千金股漲停，指數盤中一度大漲2647點；公視報導盤中強彈逾2400點、漲幅超過6%，背後同樣是國安基金與限空令兩大利多。這波反彈跟著亞股一起：美股上週五大漲、費半漲逾4%，日經一度漲逾2000點，韓股由黑翻紅、最高回到5172點。\\n為什麼重要\\n關鍵不在漲得多兇，而在能不能撐住：一天的暴漲證明官方有能力拉抬市場，不代表底部已確認。投顧分析指出，後續要看指數能否站回5日線，以及外資是否由賣轉買；在此之前，這波反彈是有官方背書的跌深反彈。\\n來源異同\\n中央社與公視對反彈本身與兩大利多一致；數字不同是因為衡量時點不同：中央社報的是收盤漲1960.06點、收41661.7點，公視報的是盤中高點逾2400點。信任標籤：雙源一致——兩家媒體對反彈的報導一致，收盤與盤中數字分開呈現。\\n仍不確定\\n台股是否真正落底尚未有答案，投顧認為要看美股走勢、5日線與外資動向。來源摘要未提供當日外資買賣超數字。\"},\"sources\":[{\"name\":\"中央社-產經證券\",\"url\":\"https://www.cna.com.tw/news/afe/202611090124.aspx\"},{\"name\":\"公視新聞網\",\"url\":\"https://news.pts.org.tw/article/834898\"}],\"disagreements\":null,\"trustScore\":66,\"trustBreakdown\":{\"sourceDiversity\":13,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"中央社-產經證券\",\"公視新聞網\"],\"glossary\":[{\"term\":{\"en\":\"National Stabilization Fund\",\"zh-TW\":\"國安基金\"},\"blurb\":{\"en\":\"State fund authorised to enter the market for a tenth time.\",\"zh-TW\":\"第10度獲授權進場的國家級護盤基金。\"}},{\"term\":{\"en\":\"TSMC\",\"zh-TW\":\"台積電\"},\"blurb\":{\"en\":\"Chipmaker that jumped more than 7% intraday.\",\"zh-TW\":\"盤中漲逾7%的晶圓代工龍頭。\"}},{\"term\":{\"en\":\"CNA\",\"zh-TW\":\"中央社\"},\"blurb\":{\"en\":\"Taiwanese news agency that reported the closing figures.\",\"zh-TW\":\"報導收盤數字的台灣通訊社。\"}},{\"term\":{\"en\":\"PTS\",\"zh-TW\":\"公視\"},\"blurb\":{\"en\":\"Taiwanese public broadcaster that reported the intraday surge.\",\"zh-TW\":\"報導盤中強彈的台灣公共媒體。\"}},{\"term\":{\"en\":\"TAIEX\",\"zh-TW\":\"加權指數\"},\"blurb\":{\"en\":\"Taiwan's benchmark stock index.\",\"zh-TW\":\"台灣股市的加權股價指數。\"}},{\"term\":{\"en\":\"Short-selling ban\",\"zh-TW\":\"限空令\"},\"blurb\":{\"en\":\"Regulator's tightened rules on short selling.\",\"zh-TW\":\"金管會收緊放空的管制措施。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-taiwan-01-1960/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-taiwan-01-1960/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"d:\"$8:metadata\"\n"])</script></body></html>
