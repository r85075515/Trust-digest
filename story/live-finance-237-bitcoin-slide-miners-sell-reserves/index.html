 roughly USD 86,000 per coin, pushing mining revenue per unit of computing power—known as hash price—to a one-year low. Mining operators including MARA Holdings, Core Scientific, and CleanSpark have sold Bitcoin reserves to cover operating costs, while network hash rate fell 8% year-on-year in its first annual decline since 2021.\n\n「Why it matters」Sustained negative mining margins force public miners to tap treasury holdings rather than accumulate coins, adding potential sell-side supply while accelerating efforts to repurpose power capacity toward artificial intelligence and data-center hosting. Mining equities have also suffered steep year-to-date declines amid heavy U.S. spot Bitcoin ETF outflows.\n\n「Source differences」Wisevoter details specific miners selling reserves such as MARA Holdings, Core Scientific, CleanSpark, and American Bitcoin alongside share-price declines, citing the headline title: 來源標題：「Bitcoin Miners Sell Reserves as Hash Price Hits Low | Wisevoter」. Coinpedia emphasizes the gap between market price and JPMorgan's USD 86,000 production cost estimate alongside USD 5.39 billion in spot ETF outflows, citing the headline title: 來源標題：「Bitcoin Miners Hit Capitulation as BTC Falls below Production Cost」.\n\n「Still uncertain」Whether Bitcoin prices will recover above operator breakeven thresholds or how quickly miners can monetize artificial intelligence power contracts remains uncertain.\n\nTrust label: Multi-source agreement. Both crypto and corporate-finance outlets report miner reserve sales, lower hash rate, and pivots toward AI infrastructure using overlapping industry data."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-237-bitcoin-slide-miners-sell-reserves\",\"category\":\"finance\",\"title\":{\"en\":\"Bitcoin Slide Pressures Miners to Sell Reserves Amid Tighter Margins\",\"zh-TW\":\"比特幣走低壓縮挖礦收益 礦企被迫拋售儲備籌資轉向AI\"},\"summary\":{\"en\":\"Bitcoin trading far below estimated production costs has pushed hash price to a one-year low, prompting miners to sell reserves and pivot toward AI.\",\"zh-TW\":\"比特幣價格遠低於機構估算的挖礦生產成本並使算力收益跌至一年低點，多家大型礦企開始出售比特幣儲備以支應營運成本並加速轉向人工智慧基礎設施。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」比特幣價格大幅低於摩根大通估算約86,000美元的平均單枚生產成本，使礦工每單位算力所得收益（算力價格）跌至一年來低點。包括 MARA Holdings、Core Scientific 與 CleanSpark 在內的多家礦企已出售比特幣儲備以支應營運支出，全網算力也出現自2021年以來首度年減，較去年同期下滑8%。\\n\\n「為什麼重要」挖礦利潤長期倒掛迫使上市礦企動用資產負債表持幣變現，不僅增加市場潛在賣壓，也促使業者加速將電力容量轉向人工智慧與資料中心託管業務；在美國現貨比特幣 ETF 出現資金淨流出之際，礦企股價今年以來普遍承壓重挫。\\n\\n「來源異同」Wisevoter 具體點名 MARA Holdings、Core Scientific、CleanSpark 與 American Bitcoin 的售幣動向與股價跌幅，原文標題為 來源標題：「Bitcoin Miners Sell Reserves as Hash Price Hits Low | Wisevoter」；Coinpedia 則側重現貨價格與摩根大通86,000美元生產成本的落差及53.9億美元 ETF 淨流出壓力，原文標題為 來源標題：「Bitcoin Miners Hit Capitulation as BTC Falls below Production Cost」。\\n\\n「仍不確定」比特幣價格何時能重返礦企損益兩平區間之上，以及礦企轉型人工智慧算力合約的實際營收貢獻進度仍未明朗。\\n\\nTrust label: Multi-source agreement. 兩家加密與財經媒體均引述 Hashrate Index、Glassnode 與摩根大通數據，對礦企售幣與算力下滑的核心事實描述一致。\"},\"glossary\":[{\"term\":{\"en\":\"Hash price\",\"zh-TW\":\"算力價格\"},\"blurb\":{\"en\":\"Estimated mining revenue earned per unit of computing power over a given period, used to gauge miner profitability.\",\"zh-TW\":\"每單位算力在特定期間可獲得的預估挖礦收益，用來衡量礦工獲利能力。\"}},{\"term\":{\"en\":\"Network hash rate\",\"zh-TW\":\"全網算力\"},\"blurb\":{\"en\":\"The total combined computational power used to mine and process transactions on a proof-of-work blockchain.\",\"zh-TW\":\"工作量證明區塊鏈網路中所有礦工投入挖礦與驗證交易的總運算能力。\"}},{\"term\":{\"en\":\"Breakeven price\",\"zh-TW\":\"損益兩平價格\"},\"blurb\":{\"en\":\"The asset price needed for mining revenue to cover electricity, equipment, and operating expenses without loss.\",\"zh-TW\":\"讓挖礦收入足以覆蓋電力、設備與營運成本、不致虧損的加密資產價格水準。\"}}],\"sources\":[{\"name\":\"Wisevoter\",\"url\":\"https://wisevoter.com/world/2026/11/26/bitcoin-miners-sell-reserves-hash-price-low\"},{\"name\":\"Coinpedia\",\"url\":\"https://coinpedia.org/news/bitcoin-miners-just-hit-capitulation-as-btc-falls-26k-below-production-cost/amp/\"}],\
