benchmark base rate steady, pausing further adjustments while monitoring Seoul housing prices, household credit growth, and foreign exchange swings. Governor Rhee Chang-yong (李昌鏞) stated during the post-meeting press briefing that although headline inflation has stabilized near target levels, financial stability risks require close scrutiny.\n\nSouth Korea's rate path carries significant weight for regional bond markets and technology exporters navigating shifting global trade demand. Maintaining a restrictive-to-neutral stance helps contain capital outflow pressures while avoiding renewed speculative borrowing in the real estate sector.\n\nReuters and Yonhap News Agency both reported the unanimous hold decision and Governor Rhee's remarks on currency vigilance, while financial analysts quoted by Reuters highlighted divergent expectations regarding the timing of the next rate move.\n\nThe central bank left forward guidance flexible, noting that upcoming fourth-quarter export data and U.S. Federal Reserve policy signals will shape its first-quarter 2027 rate review.\n\nTrust label: Multi-source agreement — The rate decision and central bank commentary were verified through wire reports from Reuters and Yonhap News Agency."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-085-bank-of-korea-benchmark-rate-decision-november\",\"category\":\"finance\",\"title\":{\"en\":\"Bank of Korea Holds Benchmark Interest Rate Steady Amid Household Debt and Won Volatility\",\"zh-TW\":\"韓國央行宣布維持基準利率不變，審慎評估家庭債務與韓元匯率波動風險\"},\"summary\":{\"en\":\"The Bank of Korea kept its benchmark policy rate unchanged on November 26 as policymakers balanced sluggish domestic consumption against elevated household debt and currency volatility. The decision underscores cautious monetary easing across export-dependent Asian economies.\",\"zh-TW\":\"韓國銀行（央行）於11月26日召開貨幣政策會議後宣布維持基準利率不變，決策官員在提振疲弱內需與控管高企的家庭負債、韓元匯率波動之間採取審慎平衡立場。這項決議顯示仰賴出口的亞洲主要經濟體在調整貨幣政策步調上仍高度謹慎。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」韓國銀行（央行）金融通貨委員會於2026年11月26日召開例行會議後決議維持基準利率不變，在評估首爾房市走勢、家庭信貸成長及外匯市場波動期間暫緩進一步利率調整。韓國央行總裁李昌鏞（Rhee Chang-yong）在會後記者會表示，儘管整體通膨率已回穩至目標區間附近，但金融穩定風險仍須密切防範。\\n\\n「為什麼重要」韓國利率政策動向對亞洲債券市場與正面臨全球貿易需求變化的科技出口商具有指標意義。維持審慎利率水準有助於抑制資金外流壓力，同時避免房地產市場再度出現投機性借貸升溫。\\n\\n「來源異同」路透社與韓聯社均報導委員會一致決定按兵不動及總裁李昌鏞對匯率波動的警覺談話；路透社進一步引述金融機構分析師指出，市場對下次利率調整時點的預期仍存在分歧。\\n\\n「仍不確定」韓國央行並未給出固定降息時間表，強調2027年第一季利率決策將視今年第四季出口表現與美國聯準會（Fed）貨幣政策訊號而定。\"},\"glossary\":[{\"term\":{\"en\":\"Benchmark interest rate\",\"zh-TW\":\"基準利率\"},\"blurb\":{\"en\":\"The primary policy interest rate set by a central bank to influence commercial borrowing costs and money supply.\",\"zh-TW\":\"中央銀行用來引導商業銀行借貸成本與市場貨幣供給量的核心政策利率。\"}},{\"term\":{\"en\":\"Forward guidance\",\"zh-TW\":\"前瞻指引\"},\"blurb\":{\"en\":\"Communication by a central bank about the likely future direction of monetary policy to shape market expectations.\",\"zh-TW\":\"中央銀行對外溝通未來貨幣政策可能走向，以引導金融市場預期的政策工具。\"}},{\"term\":{\"en\":\"Household debt\",\"zh-TW\":\"家庭債務\"},\"blurb\":{\"en\":\"Total combined liabilities of all households in an economy, including mortgages and consumer loans.\",\"zh-TW\":\"一國全體家庭所背負的房貸、信用貸款與消費性債務總額。\"}}],\"sources\":[{\"name\":\"Reuters\",\"url\":\"https://www.reuters.com/markets/asia/bank-korea-holds-rates-steady-amid-currency-household-debt-risks-2026-11-26/\"},{\"name\":\"Yonhap News Agency\",\"url\":\"https://en.yna.co.kr/view/AEN20261126004500320\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"Exterior of the Bank of Korea headquarters building in Seoul\",\"zh-TW\":\"位於首爾的韓國銀行總部大樓外觀\"},\"isHeadline\":true,\"isPopular\":false,\"trustScore\":89,\"trustBreakdown\":{\"crossCorroboration\":23,\"outletReputation\":24,\"recencyClarity\":21,\"sourceDiversity\":21},\"publishedAt\":\"2026-11-27T15:27:43.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":5,\"D2\":5,\"D3\":4,\"D4\":4,\"D5\":4,\"total\":22},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\
