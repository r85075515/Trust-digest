 to Central News Agency and TechNews relaying the FT report.\nWhat happened\nThe Financial Times investigation, reported from Hong Kong on November 21, found Huang Le connected to a supply network for AI chips, with links reaching the Cambodian conglomerate Prince Group. Huang Le had previously been reported to be close to Nvidia's Jensen Huang. The feed summaries are truncated and give no further detail on the network's structure or the specific shipments involved.\nWhy it matters\nIf the FT's links hold, the story connects two sensitive threads: the enforcement of AI chip export controls, and the use of intermediaries and conglomerates to move restricted hardware. The takeaway is not the personal association but the supply route, whether controlled chips are reaching their destinations through networks that regulators have not mapped.\nSources agree-disagree\nTechNews and Central News Agency both relay the same Financial Times investigation with the same core claims, and the two versions agree. The underlying reporting is the FT's alone, however, so the supply-network claims are single-origin even though two outlets carry them. Trust label: Two-source agreement on the FT investigation itself; the supply-network claims rest on the FT alone.\nStill uncertain\nThe summaries are truncated and give no shipment records, no company names inside the network, and no response from Huang Le, Nvidia or Prince Group. One wording issue needs flagging: the feed text calls Jensen Huang Nvidia's former chief executive, but no other source in this batch confirms any resignation, so this card does not repeat that description as fact. The matter is flagged for the main account to verify."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-01-hece422ff\",\"category\":\"semiconductor\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-semiconductor-01-hece422ff.png\",\"imageAlt\":{\"en\":\"Cover related to: 金融時報：黃樂背後晶片供應網牽涉太子集團\",\"zh-TW\":\"相關封面圖：金融時報：黃樂背後晶片供應網牽涉太子集團\"},\"publishedAt\":\"2026-11-23T02:10:51.000Z\",\"title\":{\"en\":\"FT Links Chinese Businesswoman Huang Le to AI Chip Network Tied to Prince Group\",\"zh-TW\":\"金融時報：黃樂背後晶片供應網牽涉柬埔寨太子集團\"},\"summary\":{\"en\":\"A Financial Times investigation found that Huang Le, a Chinese businesswoman previously reported to be close to Nvidia chief Jensen Huang, is connected to an AI chip supply network that reaches Cambodia's Prince Group. The report raises questions about how restricted AI chips move through intermediaries. The underlying supply-chain claims rest on the FT investigation alone.\",\"zh-TW\":\"英國金融時報（Financial Times）一項調查發現，日前被爆與輝達執行長黃仁勳過從甚密的中國女商人黃樂，和一個 AI 晶片供應網有所關連，甚至牽涉到柬埔寨太子集團。報導讓受管制 AI 晶片如何經中間人流通的問題浮上檯面。供應鏈的具體指控目前僅出自金融時報的調查。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"英國金融時報（Financial Times）一項調查發現，日前被爆與輝達執行長黃仁勳過從甚密的中國女商人黃樂，和一個 AI 晶片供應網有所關連，甚至牽涉到柬埔寨太子集團。據中央社與科技新報轉述該調查。\\n發生了什麼事\\n金融時報的調查（中央社香港 21 日綜合外電報導）發現，黃樂與一個 AI 晶片供應網有關連，牽涉到柬埔寨太子集團。黃樂日前才被爆與輝達的黃仁勳過從甚密。摘要遭到截斷，未進一步說明供應網的結構或涉及的具體出貨。\\n為什麼重要\\n如果金融時報的關連屬實，這則報導把兩條敏感線索連在一起：AI 晶片出口管制的執行，以及受管制硬體是否經由中間人與集團流通。重點不在私人交情，而在供應路線——受管制的晶片是否正透過監管機關尚未掌握的網絡流向目的地。\\n來源異同\\n科技新報與中央社轉述的是同一項金融時報調查，核心指控一致。但原始報導只有金融時報一家，因此供應網的指控雖由兩家轉述，源頭仍是單一。信任標籤：2源一致（指調查本身存在）；供應網指控僅出自金融時報。\\n仍不確定\\n摘要遭到截斷，未給出貨紀錄、網絡內的公司名稱，也沒有黃樂、輝達或太子集團的回應。另有一處用詞須特別標註：摘要稱黃仁勳為輝達「前執行長」，但本批沒有其他來源證實任何辭任消息，本卡不將此稱謂當成事實重述，提請主號複核。\"},\"sources\":[{\"name\":\"TechNews 科技新報\",\"url\":\"https://technews.tw/2026/11/23/alice-huangs-links-to-the-chip-underworld/\"},{\"name\":\"中央社-產經證券\",\"url\":\"https://www.cna.com.tw/news/aopl/202611220161.aspx\"}],\"disagreements\":{\"en\":\"Figures differ across outlets (e.g. 8230 vs 21 in headlines/snippets).\",\"zh-TW\":\"不同媒體的數字有所不同（例如，標題/摘要中的數字為 8230 與 21）。\"},\"trustScore\":64,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":19,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"semiconductor\",\"live-ingest\",\"technews-科技新報\",\"中央社-產經證券\"],\"glossary\":[{\"term\":{\"en\":\"Financial Times\",\"zh-TW\":\"金融時報\"},\"blurb\":{\"en\":\"British newspaper behind the investigation into the chip network.\",\"zh-TW\":\"調查晶片供應網的英國報紙。\"}},{\"term\":{\"en\":\"Huang Le\",\"zh-TW\":\"黃樂\"},\"blurb\":{\"en\":\"Chinese businesswoman linked by the FT to an AI chip supply network.\",\"zh-TW\":\"被金融時報指與 AI 晶片供應網有關連的中國女商人。\"}},{\"term\":{\"en\":\"Jensen Huang\",\"zh-TW\":\"黃仁勳\"},\"blurb\":{\"en\":\"Chief executive of Nvidia, previously reported to be close to Huang Le.\",\"zh-TW\":\"輝達執行長，日前被爆與黃樂過從甚密。\"}},{\"term\":{\"en\":\"Nvidia\",\"zh-TW\":\"輝達\"},\"blurb\":{\"en\":\"Chipmaker whose AI chips are at the centre of the supply-network story.\",\"zh-TW\":\"晶片大廠，其 AI 晶片是供應網報導的核心。\"}},{\"term\":{\"en\":\"Prince Group\",\"zh-TW\":\"太子集團\"},\"blurb\":{\"en\":\"Cambodian conglomerate the FT links to the chip supply network.\",\"zh-TW\":\"被金融時報指牽涉晶片供應網的柬埔寨集團。\"}},{\"term\":{\"en\":\"TechNews\",\"zh-TW\":\"科技新報\"},\"blurb\":{\"en\":\"Taiwan tech news outlet that relayed the FT investigation.\",\"zh-TW\":\"轉述金融時報調查的台灣科技媒體。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-semiconductor-01-hece422ff/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{
