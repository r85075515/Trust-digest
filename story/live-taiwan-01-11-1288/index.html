pectations of a bounce, while a rapid narrowing would signal futures traders giving up on a quick recovery. Either way, the close leaves Taiwan equities deep in the red for the day.\nSources agree / disagree\nThis card rests on a single CNA dispatch, so there is no second outlet to check the closing levels against. Trust label: Single source — one outlet reported the closing levels.\nStill uncertain\nThe dispatch gives closing levels only: no cause for the sell-off, no trading volume, and no breakdown of which sectors led the decline. Verify details in the full reporting before quoting specifics."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-01-11-1288\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-taiwan-01-11-1288.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 11月台股期指跌1288點\",\"zh-TW\":\"相關封面圖：11月台股期指跌1288點\"},\"publishedAt\":\"2026-11-05T05:55:09.000Z\",\"title\":{\"en\":\"November Taiex Futures Fall 1,288 Points to 41,915\",\"zh-TW\":\"11 月台指期跌 1288 點，收 41915 點\"},\"summary\":{\"en\":\"[Unconfirmed — single source] November Taiex futures closed at 41,915, down 1,288 points, while the cash index fell 1,374.19 points to 41,574.72, CNA reported. Futures still held a 340.28-point premium over spot, a gap traders will watch for signs of a rebound or further selling.\",\"zh-TW\":\"［未證實·單一來源］11 月台指期收 41915 點，下跌 1288 點；加權指數終場跌 1374.19 點，收 41574.72 點。期指對現貨仍有 340.28 點正價差，後續看多空如何表態。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"11 月台指期收 41915 點，單日下跌 1288 點；加權指數終場跌 1374.19 點，收 41574.72 點。中央社（CNA）11 月 5 日自台北發出這則快訊。\\n發生了什麼事\\n台北股市終場重挫。11 月台指期以 41915 點作收，下跌 1288 點；現貨加權指數下跌 1374.19 點，以 41574.72 點作收。期指收盤高於現貨 340.28 點，呈現正價差，代表期貨交易人對後市的定價仍高於現貨實際收盤價。\\n為什麼重要\\n單日 1288 點的期指跌幅相當劇烈，接下來要看的是正價差的變化：價差維持高檔可能反映避險需求或期待反彈，價差快速收斂則代表期貨交易人放棄短線回升的預期。無論如何，台股今天收盤一片慘綠。\\n來源異同\\n本卡只有中央社一則快訊，沒有第二家媒體可以核對收盤數字。信任標籤：單一來源——只有一家媒體報導收盤數字。\\n仍不確定\\n這則快訊只有收盤數字，沒有說明下跌原因、成交量，也沒有點名領跌的類股；引用細節前請查閱完整報導。\"},\"sources\":[{\"name\":\"中央社-產經證券\",\"url\":\"https://www.cna.com.tw/news/afe/202611050138.aspx\"}],\"disagreements\":null,\"trustScore\":59,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"中央社-產經證券\"],\"glossary\":[{\"term\":{\"en\":\"Taiex\",\"zh-TW\":\"加權指數\"},\"blurb\":{\"en\":\"Taiwan's benchmark stock index, which closed at 41,574.72.\",\"zh-TW\":\"台灣加權股價指數，收在 41574.72 點。\"}},{\"term\":{\"en\":\"Taiex futures\",\"zh-TW\":\"台指期\"},\"blurb\":{\"en\":\"Futures contracts on the Taiex; the November contract closed at 41,915.\",\"zh-TW\":\"以加權指數為標的的期貨；11 月契約收在 41915 點。\"}},{\"term\":{\"en\":\"CNA\",\"zh-TW\":\"中央社\"},\"blurb\":{\"en\":\"Taiwan's national news agency, the sole source for this card.\",\"zh-TW\":\"台灣的國家通訊社，本卡的唯一來源。\"}},{\"term\":{\"en\":\"Premium\",\"zh-TW\":\"正價差\"},\"blurb\":{\"en\":\"The gap when futures trade above the cash index; here 340.28 points.\",\"zh-TW\":\"期貨價格高於現貨指數的差距，本卡為 340.28 點。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-taiwan-01-11-1288/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https:/
