e account under the same headline figures.\nWhy it matters\nThe theft turns an abstract market story into a physical one: AI hardware is now valuable enough, and portable enough, to steal by the truckload. A single shipment worth US$11.4 million shows the stakes for logistics and security across the AI supply chain, from warehouses to highways. It also underlines how the AI boom has created a secondary market where high-end components are worth far more than their weight in ordinary electronics.\nSources agree / disagree\nTechNews and CNA agree on the core facts: a truckload of Nvidia hardware worth more than NT$370 million, about US$11.4 million, vanished in Southern California several months ago. Trust label: Two-source agreement — two outlets report the same figures and the same event.\nStill uncertain\nThe snippets give no exact date or place for the disappearance, no word on who owned or operated the truck, and no indication of whether the hardware or the vehicle was ever recovered. No police statement or suspect is mentioned either. Check the full reporting for the investigation's status."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-03-3-7\",\"category\":\"semiconductor\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-semiconductor-03-3-7.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 輝達成竊賊目標，逾 3.7 億元硬體與貨車在南加州離奇消失\",\"zh-TW\":\"相關封面圖：輝達成竊賊目標，逾 3.7 億元硬體與貨車在南加州離奇消失\"},\"publishedAt\":\"2026-11-06T01:55:05.000Z\",\"title\":{\"en\":\"Nvidia Hardware Worth $11.4 Million Vanishes With Truck in Southern California\",\"zh-TW\":\"輝達逾 3.7 億元硬體連同貨車在南加州離奇消失\"},\"summary\":{\"en\":\"A truck carrying Nvidia computer hardware worth US$11.4 million mysteriously vanished in Southern California several months ago, reports say, as surging demand for AI technology pushes up the value of data-centre equipment. The case shows how prized AI hardware has become for thieves.\",\"zh-TW\":\"據報幾個月前，一輛載有輝達（Nvidia）電腦硬體的貨車在美國南加州神祕失蹤，貨值高達 1140 萬美元。人工智慧需求推高資料中心設備價值，也讓輝達貨物成為竊賊目標，後續看案件有無新進展。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"據報幾個月前，一輛載有輝達（Nvidia）電腦硬體的貨車在美國南加州神祕失蹤，貨值高達 1140 萬美元。人工智慧需求推高資料中心設備價值，連帶讓輝達貨物成為竊賊目標。\\n發生了什麼事\\n中央社紐約 5 日綜合外電報導，隨著人工智慧技術需求推升資料中心設備價值，晶片巨擘輝達的貨物成為竊賊覬覦目標。據報幾個月前一輛貨車在美國南加州神祕失蹤，價值高達 1140 萬美元的輝達電腦硬體不翼而飛，折合逾 3.7 億元新台幣。科技新報（TechNews）以相同標題數字報導同一事件。\\n為什麼重要\\n這起竊案把抽象的市場故事變成實體案件：人工智慧硬體如今價值高、又便於搬運，值得整車偷走。單批貨值 1140 萬美元，顯示人工智慧供應鏈從倉庫到公路的物流與保全都面臨新壓力，也顯示人工智慧熱潮創造了一個二手市場，高階零組件的價值遠高於一般電子產品。\\n來源異同\\n科技新報與中央社對核心事實報導一致：一車輝達硬體、價值逾 3.7 億元新台幣（約 1140 萬美元）、幾個月前在南加州失蹤。信任標籤：兩源一致——兩家媒體對數字與事件的報導一致。\\n仍不確定\\n來源摘要沒有寫明失蹤的確切日期與地點、貨車由誰擁有或營運，也沒有說明硬體或車輛是否尋回，警方說法與嫌疑人同樣未提及；引用調查進度前請查閱完整報導。\"},\"sources\":[{\"name\":\"TechNews 科技新報\",\"url\":\"https://technews.tw/2026/11/06/worlds-most-valuable-company-targeted-by-bandits-for-11-4m-shipment-as-truck-vanishes-in-california/\"},{\"name\":\"中央社-國際\",\"url\":\"https://www.cna.com.tw/news/aopl/202611060015.aspx\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":19,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"semiconductor\",\"live-ingest\",\"technews-科技新報\",\"中央社-國際\"],\"glossary\":[{\"term\":{\"en\":\"Nvidia\",\"zh-TW\":\"輝達\"},\"blurb\":{\"en\":\"US chip giant whose hardware was stolen in this card.\",\"zh-TW\":\"美國晶片巨擘，本卡失竊硬體的製造商。\"}},{\"term\":{\"en\":\"Southern California\",\"zh-TW\":\"南加州\"},\"blurb\":{\"en\":\"The region of California where the truck vanished.\",\"zh-TW\":\"貨車失蹤的地點，位於美國加州南部。\"}},{\"term\":{\"en\":\"CNA\",\"zh-TW\":\"中央社\"},\"blurb\":{\"en\":\"Taiwan's national news agency and one of this card's sources.\",\"zh-TW\":\"台灣官方通訊社，本卡報導來源之一。\"}},{\"term\":{\"en\":\"TechNews\",\"zh-TW\":\"科技新報\"},\"blurb\":{\"en\":\"Taiwanese tech and finance outlet and one of this card's sources.\",\"zh-TW\":\"台灣科技財經媒體，本卡報導來源之一。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"
