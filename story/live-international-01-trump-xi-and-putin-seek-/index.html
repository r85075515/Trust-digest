th Ukraine, Iran and nuclear disarmament on the agenda.\n\nWhat happened\nThe three leaders had previously met one-on-one, but this was their first discussion as a trio. The summit produced a joint statement promising to release more oil and to hold formal talks about nuclear weapons, according to the reports. The meeting in China appeared largely symbolic: after Trump departed, Putin said Russia would not negotiate with Ukraine on a ceasefire. PBS NewsHour's Nick Schifrin reported from Shenzhen, and the BBC described the outcome as a \"peace declaration\" following the historic meeting.\n\nWhy it matters\nA first meeting of the three leaders who command the world's largest nuclear arsenals and some of its largest economies is a signal in itself, even when the substance is thin. The joint statement's promises on oil and nuclear talks give other governments something concrete to test, while Putin's remark on Ukraine sets a hard limit on what the summit could deliver. The gap between the declaration and that remark is the story to watch.\n\nSources agree / disagree\nSix outlets — BBC World, NPR World, NYT World, PBS NewsHour, Axios and the Financial Times — covered the summit across seven feed items, and they agree on the core facts: the first trilateral meeting, the Shenzhen setting, and the joint statement. Axios adds Trump's message to sceptical Europeans that \"Putin wants to end the war,\" which sits uneasily beside Putin's own statement that Russia will not negotiate a ceasefire. No outlet contradicts another on the basic facts.\n\nStill uncertain\nThe feed summaries do not say how much oil will be released, when the nuclear talks will start, or what the joint statement binds anyone to do. Iran's place on the agenda is noted but not explained, and the apparent tension between Trump's assurance and Putin's refusal is unresolved. The full texts and the follow-up reporting will show whether the declaration becomes action.\n\nTrust label: Multi-source agreement — Six outlets agree on the summit's core facts, including the joint statement."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-01-trump-xi-and-putin-seek-\",\"category\":\"international\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-international-01-trump-xi-and-putin-seek-.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Trump, Xi and Putin Seek to Project Power at Their First Summit\",\"zh-TW\":\"相關封面圖：川普、習近平和普丁尋求在首次峰會上投射力量\"},\"publishedAt\":\"2026-11-20T01:30:59.000Z\",\"title\":{\"en\":\"Trump, Xi and Putin Hold First Trilateral Summit in Shenzhen\",\"zh-TW\":\"川普、習近平、普丁深圳首度三邊峰會：聯合聲明承諾釋放石油、啟動核武談判\"},\"summary\":{\"en\":\"Donald Trump, Xi Jinping and Vladimir Putin met in Shenzhen for their first trilateral summit, issuing a joint statement promising more oil releases and formal nuclear talks. The meeting looked largely symbolic, and Putin later said Russia would not negotiate a Ukraine ceasefire. What matters now is whether the promised talks actually begin.\",\"zh-TW\":\"美國總統川普（Donald Trump）、中國國家主席習近平與俄羅斯總統普丁（Vladimir Putin）在深圳舉行首次三邊峰會，發表聯合聲明，承諾釋放更多石油並就核武展開正式談判。會晤象徵意義居多，普丁隨後表示俄羅斯不會就烏克蘭停火談判，接下來看承諾的談判是否真的啟動。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"美國總統川普（Donald Trump）、中國國家主席習近平與俄羅斯總統普丁（Vladimir Putin）在中國深圳舉行首次三邊峰會，議程包括烏克蘭、伊朗與核裁軍。\\n\\n發生了什麼事\\n三位領袖過去曾一對一會面，這是首次三人同桌會談。會後發表聯合聲明，承諾釋放更多石油並就核武舉行正式談判。會晤象徵意義居多：川普離開後，普丁表示俄羅斯不會就烏克蘭停火談判。美國公共電視（PBS NewsHour）的尼克·席弗林（Nick Schifrin）在深圳現場報導，英國廣播公司（BBC）則稱會後成果為「和平宣言」。\\n\\n為什麼重要\\n掌握全球最大核武庫與主要經濟體的三位領袖首次同桌，本身就是訊號，即使實質內容有限。聯合聲明對石油與核武談判的承諾，給了其他國家可以檢驗的具體項目，而普丁對烏克蘭的表態則劃出峰會能達到的上限。宣言與這句表態之間的落差，是接下來要看的重點。\\n\\n來源異同\\n英國廣播公司（BBC）、美國全國公共廣播電台（NPR）、《紐約時報》、美國公共電視、Axios 與《金融時報》六家媒體共七則報導，核心事實一致：首次三邊會談、地點在深圳、發表聯合聲明。Axios 補充川普向抱持懷疑的歐洲人表示「普丁想結束戰爭」，這句話與普丁本人拒絕談判停火的說法並不協調，但各家在基本事實上沒有互相矛盾。\\n\\n仍不確定\\n摘要沒有說明將釋放多少石油、核武談判何時展開、聯合聲明對各方有何約束力。伊朗雖列入議程，內容未見說明；川普的保證與普丁的拒絕之間的矛盾也未解開。聲明全文與後續報導才能看出宣言是否化為行動。\"},\"sources\":[{\"name\":\"BBC World\",\"url\":\"https://www.bbc.co.uk/news/articles/c623j4ln97x7o?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"NPR World\",\"url\":\"https://www.npr.org/2026/11/18/nx-s1-6040432/trump-xi-and-putin-shenzhen-china-russia-usa\"},{\"name\":\"NYT World\",\"url\":\"https://www.nytimes.com/live/2026/11/18/world/trump-xi-putin-apec\"},{\"name\":\"PBS NewsHour\",\"url\":\"https://www.pbs.org/newshour/show/inside-the-historic-summit-between-trump-xi-and-putin\"},{\"name\":\"Axios\",\"url\":\"https://www.axios.com/2026/11/20/trump-pushes-putin-ukraine-war-deal\"},{\"name\":\"Financial Times\",\"url\":\"https://www.ft.com/content/01dde30c-977c-4f21-8838-4c3955dfacb7?syn-25a6b1a6=1\"}],\"disagreements\":null,\"trustScore\":95,\"trustBreakdown\":{\"sourceDiversity\":25,\"outletReputation\":20,\"crossCorroboration\":25,\"recencyClarity\":25},\"tags\":[\"international\",\"live-ingest\",\"bbc-world\",\"npr-world\",\"nyt-world\"],\"glossary\":[{\"term\":{\"en\":\"Donald Trump\",\"zh-TW\":\"川普\"},\"blurb\":{\"en\":\"President of the United States.\",\"zh-TW\":\"美國總統。\"}},{\"term\":{\"en\":\"Xi Jinping\",\"zh-TW\":\"習近平\"},\"blurb\":{\"en\":\"President of China.\",\"zh-TW\":\"中國國家主席。\"}},{\"term\":{\"en\":\"Vladimir Putin\",\"zh-TW\":\"普丁\"},\"blurb\":{\"en\":\"President of Russia.\",\"zh-TW\":\"俄羅斯總統。\"}},{\"term\":{\"en\":\"Shenzhen\",\"zh-TW\":\"深圳\"},\"blurb\":{\"en\":\"A major city in southern China, where the summit was held.\",\"zh-TW\":\"中國南方大城，本次峰會舉行地。\"}},{\"term\":{\"en\":\"BBC\",\"zh-TW\":\"英國廣播公司\"},\"blurb\":{\"en\":\"Britain's public service broadcaster.\",\"zh-TW\":\"英國公共廣播機構。\"}},{\"term\":{\"en\":\"PBS NewsHour\",\"zh-TW\":\"美國公共電視新聞一小時\"},\"blurb\":{\"en\":\"An American television news program.\",\"zh-TW\":\"美國電視新聞節目。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",
