eports do not say what it is. Separately, FTISLAND will perform \"2027 FTISLAND CONCERT 'FTSODE' IN TAIPEI\" at the Taipei International Convention Center (TICC) on January 16, 2027, launching the FTSODE series toward the band's 20th anniversary, ETtoday reports. Yesung, marking 10 years since his solo debut, will perform in Kaohsiung on November 29.\nWhy it matters\nFans now have three dates to watch, but only two of them are actual concerts. Wu's January 22 date is a promise of news, not a show, so its value depends entirely on what she reveals. The cluster also shows how tightly packed Taiwan's concert calendar has become, with Korean acts and local singers announcing dates in the same news cycle.\nSources agree / disagree\nThe outlets are not reporting the same event, so there is little to cross-check: CTWANT and Youth Daily News cover Wu, ETtoday covers FTISLAND, and fan outlet reports cover Yesung. The figures that look different are different quantities, not conflicts: January 22 is Wu's announcement date, while 10 marks the years since Yesung's solo debut. Trust label: Bundled stories — this card bundles unrelated entertainment items around Wu Shen-mei's January 22 announcement; the other concerts are separate events.\nStill uncertain\nWhat Wu will announce on January 22 is not stated in any snippet. FTISLAND ticket prices were reported as published by ETtoday, but no prices appear in the feed text, and no ticket details are given for Yesung's Kaohsiung show. Verify details in the full reporting before quoting specifics."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-eastAsiaGossip-01-1-22-ctwant-line-today\",\"category\":\"eastAsiaGossip\",\"adult\":false,\"isHeadline\":true,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-eastAsiaGossip-01-1-22-ctwant-line-today.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 吳申梅不藏了！ 明年1／22拋重大喜訊 | CTWANT - LINE TODAY\",\"zh-TW\":\"相關封面圖：吳申梅不藏了！ 明年1／22拋重大喜訊 | CTWANT - LINE TODAY\"},\"publishedAt\":\"2026-11-05T21:30:00.000Z\",\"title\":{\"en\":\"Wu Shen-mei Teases Major Announcement for January 22 Amid a Flurry of Taiwan Concert News\",\"zh-TW\":\"吳申梅預告 1 月 22 日拋重大喜訊，FTISLAND、藝聲演唱會消息同日出爐\"},\"summary\":{\"en\":\"Taiwanese singer Wu Shen-mei says she will share major news on January 22, after her new song topped three charts, while FTISLAND and Super Junior's Yesung announced Taiwan concerts of their own. Fans get a date to watch — but the announcement itself is still a teaser, not a reveal.\",\"zh-TW\":\"歌手吳申梅預告明年 1 月 22 日拋出重大喜訊，新歌剛拿下三冠王；同一天，FTISLAND 也宣布明年 1 月來台開唱，SJ 藝聲則將於 11 月 29 日前進高雄。喜訊內容尚未揭曉，歌迷先把 1 月 22 日記下來。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"歌手吳申梅預告明年 1 月 22 日拋出重大喜訊，新歌剛拿下三冠王；同一週，FTISLAND 宣布 2027 年 1 月重返台北開唱，SJ 藝聲也將於 11 月 29 日前進高雄。\\n發生了什麼事\\n自由娛樂報導，吳申梅新歌拿下三冠王，三部曲〈My Hero〉MV 已經上線，明年將在 Legacy 開唱；CTWANT 報導她預告 1 月 22 日拋出重大喜訊，但報導沒有說明喜訊內容。另一邊，ETtoday 報導 FTISLAND 將於 2027 年 1 月 16 日在臺北國際會議中心（TICC）舉行《2027 FTISLAND CONCERT 'FTSODE' IN TAIPEI》，以全新「FTSODE」系列邁向成軍 20 週年。藝聲則為 SOLO 出道 10 週年巡演前進高雄，11 月 29 日開唱。\\n為什麼重要\\n歌迷現在有三個日期可以期待，但其中只有兩個是真正的演唱會。吳申梅的 1 月 22 日是預告，不是演出，價值全看她當天揭曉什麼。這批消息也顯示台灣演唱會檔期有多擁擠，韓團與本地歌手在同一波新聞裡接連宣布開唱。\\n來源異同\\n各家媒體報導的不是同一件事，幾乎無從互相核對：CTWANT 與青年日報報導吳申梅，ETtoday 報導 FTISLAND，藝聲的消息則來自另一路娛樂快訊。看似不同的數字說的是不同的事，不是衝突：1 月 22 日是吳申梅的預告日期，10 是藝聲 SOLO 出道週年數。信任標籤：捆綁集群——本卡由多則無關娛樂新聞拼成，主線是吳申梅 1 月 22 日的預告，其餘演唱會是各自獨立的事件。\\n仍不確定\\n吳申梅 1 月 22 日要宣布什麼，來源摘要都沒有寫。ETtoday 標題稱 FTISLAND 開唱日期、票價已公開，但摘要裡沒有票價數字；藝聲高雄場的票務資訊也未呈現。引用細節前請查閱完整報導。\"},\"sources\":[{\"name\":\"ETtoday 影劇\",\"url\":\"https://star.ettoday.net/news/3267148\"},{\"name\":\"today.line.me\",\"url\":\"https://news.google.com/rss/articles/CBMiVkFVX3lxTE9yTzVDdmpkeVNoT1p0SVJ5WUp0R2thN28zeWZmTzBkelYzV19TSTd4cy14cnEtdnNWV0JGZGR1YmJnM2NOVy1JYjhlRkpRYVNtb0c1S1hn?oc=5\"},{\"name\":\"蕃新聞\",\"url\":\"https://news.google.com/rss/articles/CBMiUkFVX3lxTE1OZlI2U2loaF9XeU91SWRITkUwT3JfSWZmUW1sdE04bXE3MlNhVW9jMC1vcXRiZU9tTmlqYnRHRkJVaVVmY29kS09GbjAxYTVYclE?oc=5\"},{\"name\":\"Google News TW 娛樂\",\"url\":\"http
