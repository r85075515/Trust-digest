owe’s lists the kit, with bag, two batteries, and charger, for $129. The DCD701 offers 32% more power (250 unit watts out) than the DCD710; the DCF801 offers 52% more torque (1,450 inch-pounds) than the DCF815; the DCB122 battery is 2Ah. The same post also lists a separate Milwaukee M18 battery and charger kit for $199, with two 5Ah batteries, one 6Ah battery, a charger, and free delivery from Home Depot. That Milwaukee kit is a different product and must not be mixed with the DeWALT specifications or price.\nWhy it matters\nThe DeWALT price is only meaningful beside its own specifications: buyers comparing 12V compact tools should weigh the stated power and torque gains against the 2Ah batteries, which set run time. The bundled post risks confusion: a Milwaukee price and battery sizes sit beside the DeWALT kit, and swapping the figures would misstate the deal.\nSources agree / disagree\nOnly Slickdeals Frontpage is represented, carrying two distinct listings in one post rather than two outlets confirming one deal. The figures 6.0Ah and $199 belong to the Milwaukee kit, while $129 and 2Ah belong to the DeWALT kit; they are different products, not conflicting reports of the same product. Trust label: Bundled stories — one outlet’s post bundles two different tool deals, so the DeWALT and Milwaukee figures must be kept separate.\nStill uncertain\nAvailability, the offer end date, warranty terms, and whether the listed specifications match the exact kit in stock are unknown from the material supplied. Confirm model numbers, included items, and price on the retailer page; do not use Milwaukee figures for the DeWALT kit."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-shopping-02-dewalt-xtreme-12v-max-xr\",\"category\":\"shopping\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-shopping-02-dewalt-xtreme-12v-max-xr.jpg\",\"imageAlt\":{\"en\":\"Cover related to: DeWALT Xtreme 12V Max XR Brus  129 in headlines/snippets).\",\"zh-TW\":\"（譯文待補）Figures differ across outlets (e.g. 6.0 vs 129 in headlines/snippets).\"},\"trustScore\":47,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":10,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"shopping\",\"live-ingest\",\"slickdeals-frontpage\",\"slickdeals-frontpage\"],\"glossary\":[{\"blurb\":{\"en\":\"Tool brand behind the $129 Xtreme 12V two-tool kit at Lowe’s.\",\"zh-TW\":\"工具品牌，Xtreme 12V雙工具組在勞氏售價129美元。\"},\"term\":{\"en\":\"DeWALT\",\"zh-TW\":\"得偉\"}},{\"blurb\":{\"en\":\"Tool brand behind the separate $199 M18 battery and charger kit in the same post.\",\"zh-TW\":\"工具品牌，同一則貼文另載其199美元M18電池與充電器組。\"},\"term\":{\"en\":\"Milwaukee\",\"zh-TW\":\"美沃奇\"}},{\"blurb\":{\"en\":\"Retailer listed as selling the DeWALT two-tool kit for $129.\",\"zh-TW\":\"零售商，刊登資訊指得偉雙工具組在此售價129美元。\"},\"term\":{\"en\":\"Lowe’s\",\"zh-TW\":\"勞氏\"}},{\"blurb\":{\"en\":\"Retailer named as providing free delivery for the Milwaukee kit.\",\"zh-TW\":\"零售商，刊登資訊指美沃奇商品由此免費送貨。\"},\"term\":{\"en\":\"Home Depot\",\"zh-TW\":\"家得寶\"}},{\"blurb\":{\"en\":\"Deal-sharing site whose Frontpage post bundled the DeWALT and Milwaukee listings.\",\"zh-TW\":\"優惠分享網站，首頁貼文併載得偉與美沃奇兩則資訊。\"},\"term\":{\"en\":\"Slickdeals\",\"zh-TW\":\"Slickdeals\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news diges
