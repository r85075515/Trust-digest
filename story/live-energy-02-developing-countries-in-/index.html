le to plan their own budgets or attract private investors.\n\nWhy it matters\nClimate adaptation and clean energy projects need years of lead time, so a missing finance plan today becomes a missing project pipeline tomorrow. For the countries waiting on the money, the delay is not an abstract negotiation point; it decides whether planned projects can start at all.\n\nSources agree–disagree\nOnly one source, The Guardian, is listed for this card, so the account has no second outlet to check it against. No other outlet's figures are available in the feed to compare with the $300 billion and $1 trillion numbers.\n\nStill uncertain\nThe feed summary cuts off before explaining what the roughly $1 trillion figure covers, so its scope is unclear from the material provided. It also does not name which governments have failed to publish plans, or when they are expected to do so.\n\nTrust label: Single source — one outlet, uncorroborated; figures are as reported in that outlet's feed summary."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-energy-02-developing-countries-in-\",\"category\":\"energy\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"publishedAt\":\"2026-11-11T07:00:32.000Z\",\"title\":{\"en\":\"Developing Countries Left in Limbo as Rich Nations Delay New Climate Finance Plans\",\"zh-TW\":\"富國延後新氣候融資計畫，開發中國家陷入等待\"},\"summary\":{\"en\":\"［未證實·單一來源］ Rich nations have yet to flesh out plans for new climate finance, leaving developing countries unable to plan or attract private investment, The Guardian reports. Poor countries are due $300 billion a year by 2035, alongside about $1 trillion in further finance. Watch whether governments publish targets before the deadline pressure builds.\",\"zh-TW\":\"［未證實·單一來源］《衛報》（The Guardian）報導，富國尚未提出具體的新氣候融資計畫，開發中國家難以規劃、也難吸引私人投資。按計畫，窮國到 2035 年每年應獲 3,000 億美元，另有約 1 兆美元；後續看各國政府何時公布目標。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"《衛報》（The Guardian）報導，世界幾個最大經濟體未能提出具體的新氣候融資計畫，開發中國家因此陷入等待。許多政府尚未設定目標，受援國難以規劃、也難吸引私人投資。\\n\\n發生了什麼事\\n《衛報》報導，按計畫，工業化國家政府到 2035 年每年應向窮國提供 3,000 億美元，另有約 1 兆美元。但許多政府尚未說明如何落實各自的份額，缺乏具體計畫讓受援國無法編預算、也難以吸引私人投資者。\\n\\n為什麼重要\\n氣候調適與潔淨能源專案需要多年籌備，今天缺融資計畫，明天就缺可推動的專案。對等錢的國家來說，延後不是抽象的談判細節，而是決定已規劃的專案能不能啟動。\\n\\n來源異同\\n本卡只有《衛報》一個來源，說法無從交叉驗證。快訊中也沒有其他媒體的數字可與 3,000 億美元和 1 兆美元對照。\\n\\n仍不確定\\n快訊摘要在說明約 1 兆美元涵蓋範圍前就截斷了，從現有資料看不清這筆錢的範圍；也沒點名哪些政府尚未公布計畫、預計何時公布。\"},\"sources\":[{\"name\":\"The Guardian Climate Crisis\",\"url\":\"https://www.theguardian.com/environment/2026/nov/11/developing-countries-climate-finance-delay\"}],\"disagreements\":null,\"trustScore\":59,\"trustBreakdown\":{\"crossCorroboration\":6,\"outletReputation\":22,\"recencyClarity\":25,\"sourceDiversity\":6},\"tags\":[\"energy\",\"live-ingest\",\"the-guardian-climate-crisis\"],\"glossary\":[{\"term\":{\"en\":\"Climate finance\",\"zh-TW\":\"氣候融資\"},\"blurb\":{\"en\":\"Funding from richer nations to help developing countries cut emissions and adapt to climate change.\",\"zh-TW\":\"富國提供給開發中國家、協助減排與調適氣候變遷的資金。\"}},{\"term\":{\"en\":\"The Guardian\",\"zh-TW\":\"衛報\"},\"blurb\":{\"en\":\"British newspaper.\",\"zh-TW\":\"英國報紙。\"}},{\"term\":{\"en\":\"Industrialised nations\",\"zh-TW\":\"工業化國家\"},\"blurb\":{\"en\":\"Wealthy, developed economies expected to fund climate finance.\",\"zh-TW\":\"已開發的富裕經濟體，依計畫應出資氣候融資。\"}},{\"term\":{\"en\":\"Private investment\",\"zh-TW\":\"私人投資\"},\"blurb\":{\"en\":\"Money from businesses and investors, as opposed to government funding.\",\"zh-TW\":\"來自企業與投資人的資金，與政府出資相對。\"}},{\"term\":{\"en\":\"2035 deadline\",\"zh-TW\":\"2035 年目標\"},\"blurb\":{\"en\":\"The year by which poor countries are due $300 billion a year in climate finance.\",\"zh-TW\":\"窮國按計畫每年應獲 3,000 億美元氣候融資的目標年份。\"}}],\"imageUrl\":\"/covers/live/live-energy-02-developing-countries-in-.jpg\",\"imageAlt\":{\"en\":\"Developing countries waiting on delayed climate finance plans from rich nations\",\"zh-TW\":\"開發中國家等待富國延後的氣候融資計畫\"}}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"
