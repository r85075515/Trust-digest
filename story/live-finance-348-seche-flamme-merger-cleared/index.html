 hazardous waste specialist MTF (Flamme Group) subject to binding commitments. To prevent local dedicated hazardous waste incineration markets around Chauny and Vendeuil in northern France from shrinking from three operators to a duopoly of Veolia and Séché, Séché agreed to divest MTF's Chauny incineration facility and uphold fair access conditions for independent waste collectors.\n\nWhy it matters\nThe ruling removes the primary regulatory hurdle for Euronext-listed Séché Environnement—which generated 1,152 million EUR in 2025 revenue—to consolidate industrial hazardous waste treatment in northern France while preserving local price and capacity competition for waste producers.\n\nSource differences\nThe official French regulator press release (\"Secteur des déchets dangereux - Autorité de la concurrence\") and its English summary (\"Hazardous waste: the Autorité de la concurrence clears the acquisition of the MTF group (Flamme group) by Séché Environnement, subject to commitments\") cite Decision 26-DCC-231 and explain the competitive analysis around the Chauny and Vendeuil sites in Aisne (department 02) plus the structural divestiture and behavioral access remedies. Business Wire's company release (\"Séché Environnement: French Competition Authority clears\") confirms the November 27 clearance and notes that transaction terms are being finalized with the commitments incorporated.\n\nStill uncertain\nThe full text of Decision 26-DCC-231 has not yet been posted online by the regulator, and neither the final purchase price nor the identity of the approved buyer for the divested Chauny incineration site has been disclosed.\n\nTrust label: Official confirmation — Directly verified by the Autorité de la concurrence's November 27, 2026 merger clearance announcement (Decision 26-DCC-231) and Séché Environnement's corporate filing."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-348-seche-flamme-merger-cleared\",\"category\":\"finance\",\"title\":{\"en\":\"French Antitrust Regulator Clears Séché Environnement's Acquisition of Flamme Group With Divestiture\",\"zh-TW\":\"法國競爭管理局附帶剝離條件核准 Séché Environnement 收購 Flamme 集團\"},\"summary\":{\"en\":\"On November 27, 2026, France's Autorité de la concurrence approved Séché Environnement's acquisition of hazardous waste operator MTF (Flamme Group) under Decision 26-DCC-231, conditioned on divesting MTF's Chauny incineration site and guaranteeing third-party access.\",\"zh-TW\":\"法國競爭管理局於2026年11月27日作成第26-DCC-231號決定，在附帶結構性與行為性承諾條件下，正式核准環保廢棄物大廠 Séché Environnement 收購 MTF（Flamme 集團），要求其出售位於 Chauny 的危險廢棄物焚化廠並保障獨立業者使用權。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n法國競爭管理局（Autorité de la concurrence）於2026年11月27日發布第26-DCC-231號決定，附條件核准 Séché Environnement 收購危險廢棄物處理商 MTF（又稱 Flamme 集團）。為避免法國北部 Chauny 與 Vendeuil 周邊專用危險廢棄物焚化市場從三家業者縮減為威立雅（Veolia）與 Séché 雙寡頭，Séché 承諾剝離出售 MTF 旗下的 Chauny 焚化廠，並對獨立廢棄物清運商維持公平的焚化產能准入條件。\\n\\n「為什麼重要」\\n此項裁決為泛歐交易所上市公司 Séché Environnement（2025年營收11.52億歐元）掃除了整合法國北部工業危險廢棄物處理版圖的核心反壟斷障礙，同時透過強制剝離資產維持當地市場競爭與議價空間。\\n\\n「來源異同」\\n法國競爭管理局法文官方新聞稿（\\\"Secteur des déchets dangereux - Autorité de la concurrence\\\"）與英文官方摘要（\\\"Hazardous waste: the Autorité de la concurrence clears the acquisition of the MTF group (Flamme group) by Séché Environnement, subject to commitments\\\"）載明決定編號26-DCC-231，詳述針對埃納省（02省）Chauny 與 Vendeuil 廠區周邊市場的競爭評估及兩項結構性與行為性承諾；Business Wire 發布的企業公告（\\\"Séché Environnement: French Competition Authority clears\\\"）則說明雙方正依承諾條件敲定最終交易條款。\\n\\n「仍不確定」\\n第26-DCC-231號決定的完整裁決書全文尚未上線公開，交易最終收購金額以及接手 Chauny 焚化廠的買方名單亦尚未揭露。\\n\\nTrust label: Official confirmation — 依據法國競爭管理局2026年11月27日第26-DCC-231號官方併購核准公告與 Séché Environnement 企業聲明核實。\"},\"glossary\":[{\"term\":{\"en\":\"Structural Remedy (Divestiture)\",\"zh-TW\":\"結構性救濟（資產剝離）\"},\"blurb\":{\"en\":\"An antitrust condition requiring a merging company to sell off specific facilities or business units to preserve market competition.\",\"zh-TW\":\"反壟斷主管機關要求併購方出售特定廠房或業務部門，以防止市場過度集中的核准條件。\"}},{\"term\":{\"en\":\"Dedicated Hazardous Waste Incineration\",\"zh-TW\":\"專用危險廢棄物焚化\"},\"blurb\":{\"en\":\"Specialized thermal treatment facilities built specifically for toxic industrial waste, distinct from cement kiln co-incineration.\",\"zh-TW\":\"專為處理高毒性工業廢棄物設計的高溫焚化設施，在法規與技術門檻上不同於水泥窯協同處置。\"}},{\"term\":{\"en\":\"Behavioral Commitment\",\"zh-TW\":\"行為性承諾\"},\"blurb\":{\"en\":\"Binding operational rules—such as guaranteeing non-discriminatory third-party access—imposed on a merged entity.\",\"zh-TW\":\"主管機關對併購後企業施加的營運行為規範，例如要求其不得對獨立上游清運業者設下歧視性准入條件。\"}}],\"sources\":[{\"name\":\"Autorité de la concurrence (FR)\",\"url\":\"https://www.autoritedelaconcurrence.fr/fr/communiques-de-presse/secteur-des-dechets-dangereux-lautorite-de-la-concurrence-autorise-le-rachat\"},{\"name\":\"Autorité de la concurrence (EN)\",\"url\":\"https://www.autoritedelaconcurrence.fr/en/article/hazardous-waste-autorite-de-la-concurrence-clears-acquisition-mtf-group-flamme-group-seche\"},{\"name\":\"Business Wire\",\"url\":\"https://www.businesswire.com/news/home/20261127015140/en/Sch-Environnement-French-Competition-Authority-clears-proposed-acquisition-of-Flamme-Group\"}],\"imageUrl\":\"/covers/live/live-finance-348-seche-flamme-merger-cleared.jpg\",\"imageAlt\":{\"en\":\"French Antitrust Regulator Clears Séché Environnement's Acquisition of Flamme Group With Divestiture\",\"zh-TW\":\"法國競爭管理局附帶剝離條件核准 Séché Environnement 收購 Flamme 集團\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":84,\"trustBreakdown\":{\"crossCorroboration\":21,\"outletReputation\":24,\"recencyClarity\":23,\"sourceDiversity\":16},\"publishedAt\":\"2026-11-28T03:44:02.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":23,\"D2\":23,\"D3\":21,\"D4\":21,\"D5\":20,\"total\":22},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><scr
