a seven-camera science imaging suite developed by Malin Space Science Systems—onto NASA's nuclear-powered Dragonfly rotorcraft. The installation, completed in early November and detailed by NASA and APL this week, pairs with two dedicated navigation cameras mounted earlier in 2026 to give the car-sized octocopter nine cameras in total, which captured a yellow-tinted test panorama inside the APL cleanroom on November 9.\n\nScheduled to launch aboard a SpaceX Falcon Heavy rocket in July 2028 and arrive at Saturn's largest moon Titan in late 2034, Dragonfly will fly across diverse landing sites to study prebiotic organic chemistry and surface geology. DragonCam includes forward, side, downward, and high-resolution microscopic imagers capable of resolving sand-grain-scale surface materials illuminated by onboard LEDs during Titan's night.\n\nNASA's official mission release, Johns Hopkins APL's announcement, and Daily Galaxy align on the seven-camera DragonCam configuration, nine-camera total count, November 9 cleanroom test images, and July 2028 launch window.\n\nIntegration of Dragonfly's remaining science payloads—including its gamma-ray and neutron spectrometer, meteorology package, and mass spectrometer—is still underway prior to full environmental testing.\n\nTrust label: Multi-source agreement — Confirmed by NASA and Johns Hopkins Applied Physics Laboratory releases and corroborated by Daily Galaxy."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-science-188-nasa-dragonfly-dragoncam-suite-installed\",\"category\":\"science\",\"title\":{\"en\":\"NASA Installs Seven-Camera DragonCam Suite on Titan-Bound Dragonfly Rotorcraft\",\"zh-TW\":\"NASA 為土衛六探測旋翼機 Dragonfly 裝上七鏡頭科學相機「裝上雙眼」\"},\"summary\":{\"en\":\"Technicians at Johns Hopkins Applied Physics Laboratory installed the seven-camera DragonCam science imaging suite onto NASA's Dragonfly rotorcraft ahead of its July 2028 launch to Saturn's moon Titan. Combined with two navigation cameras, Dragonfly now carries nine cameras and captured its first cleanroom test panorama.\",\"zh-TW\":\"美國航太總署（NASA）宣布，約翰霍普金斯大學應用物理實驗室工程團隊已為預定 2028 年 7 月發射前往土衛六的核動力旋翼機 Dragonfly 安裝由 7 台相機組成的 DragonCam 科學成像系統。加上先前安裝的 2 台導航相機，探測器共配備 9 台相機，並已拍下首張無塵室全景測試照。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」美國航太總署（NASA）與約翰霍普金斯大學應用物理實驗室（APL）公布，工程人員已於馬里蘭州勞雷爾的實驗室無塵室內，為前往土星最大衛星土衛六（Titan）的旋翼探測器 Dragonfly 安裝由馬林太空科學系統公司研製的七鏡頭科學成像系統「DragonCam」。連同今年稍早安裝的 2 台專用導航相機，這架體型如汽車般的八旋翼探測器共配備 9 台相機，並於 11 月 9 日在無塵室拍下帶有暖黃色調的首張全景測試影像。\\n\\n「為什麼重要」Dragonfly 預計於 2028 年 7 月搭乘獵鷹重型運載火箭升空，並於 2034 年底抵達土衛六表面展開多點飛行探測，尋找生命前驅有機化學線索。DragonCam 具備前視、側視、下視全景相機以及配備夜視 LED 補光燈的高解析度顯微成像儀，能在飛行與著陸狀態下解析沙粒尺度的地表沉積物構造，突破土衛六濃厚大氣層對軌道觀測的限制。\\n\\n「來源異同」NASA 官方任務公告、約翰霍普金斯大學應用物理實驗室新聞稿與 Daily Galaxy 在七鏡頭科學相機架構、全機共 9 台相機配置、11 月 9 日無塵室首拍及 2028 年 7 月發射時程等細節上完全一致。\\n\\n「仍不確定」包括伽瑪射線與中子光譜儀、氣象地球物理套件及質譜儀在內的其餘科學儀器，仍有待後續陸續運抵實驗室完成整合與整機環境測試。\\n\\nTrust label: Multi-source agreement — 依據 NASA 與約翰霍普金斯大學應用物理實驗室官方發布，並獲 Daily Galaxy 報導印證。\"},\"glossary\":[{\"term\":{\"en\":\"DragonCam\",\"zh-TW\":\"DragonCam 科學成像套件\"},\"blurb\":{\"en\":\"A seven-camera imaging suite built by Malin Space Science Systems for NASA's Dragonfly rotorcraft, spanning panoramic to microscopic views.\",\"zh-TW\":\"由馬林太空科學系統公司為 NASA Dragonfly 研製的 7 鏡頭科學相機組，涵蓋全景廣角至沙粒尺度顯微成像。\"}},{\"term\":{\"en\":\"Titan (Saturn's Moon)\",\"zh-TW\":\"土衛六（泰坦星）\"},\"blurb\":{\"en\":\"Saturn's largest moon and the only moon in the solar system with a dense nitrogen-rich atmosphere and surface liquid hydrocarbon lakes.\",\"zh-TW\":\"土星最大衛星，擁有濃厚富氮大氣層與地表液態碳氫化合物湖泊，是研究生命前驅化學的重要天體。\"}},{\"term\":{\"en\":\"Johns Hopkins Applied Physics Laboratory (APL)\",\"zh-TW\":\"約翰霍普金斯大學應用物理實驗室（APL）\"},\"blurb\":{\"en\":\"The Maryland research center managing the design, construction, and flight operations of NASA's Dragonfly mission.\",\"zh-TW\":\"位於美國馬里蘭州的科研機構，負責主導 NASA Dragonfly 土衛六旋翼探測任務的設計、建造與飛行操控。\"}}],\"sources\":[{\"name\":\"NASA Science\",\"url\":\"https://science.nasa.gov/missions/dragonfly/nasas-titan-bound-dragonfly-rotorcraft-gets-its-eyes/\"},{\"name\":\"Johns Hopkins APL\",\"url\":\"https://www.jhuapl.edu/news/news-releases/261124-dragonfly-cameras\"},{\"name\":\"Daily Galaxy\",\"url\":\"https://dailygalaxy.com/2026/11/nasas-dragonfly-see-saturns-largest-moon/\"}],\"imageUrl\":\"/covers/live/live-science-188-nasa-dragonfly-dragoncam-suite-installed.jpg\",\"imageAlt\":{\"en\":\"Technicians installing DragonCam science cameras onto NASA Dragonfly rotorcraft\",\"zh-TW\":\"工程人員為 NASA 土衛六探測旋翼機 Dragonfly 安裝 DragonCam 科學相機\"},\"isHeadline\":false,\"isPopular\":true,\"trustScore\":94,\"trustBreakdown\":{\"crossCorroboration\":24,\"outletReputation\":24,\"recencyClarity\":23,\"sourceDiversity\":23},\"publishedAt\":\"2026-11-27T18:40:35.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":24,\"D2\":24,\"D3\":23,\"D4\":23,\"D5\":23,\"total\":23},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-science-188-nasa-dragonfly-dragoncam-suite-installed/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-science-188-nasa-dragonfly-dragoncam-suite-installed/\"}],[\"$\",\"meta\",\"6\",{\"n
