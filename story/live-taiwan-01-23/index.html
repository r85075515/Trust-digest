s, and Taiwan stock-index futures and TSMC futures both fell in night trading. The FSC responded by tightening short-selling rules, including a full ban on short selling below the flat price from November 23, as one of five stabilization measures. Futures traders pointed to the Philadelphia Semiconductor Index, down 10.73% and closely linked to Taiwan's AI stocks, and to TSMC's American depositary receipts, down 9.48%, and warned of heavy systemic selling pressure at the November 23 open.\nWhy it matters\nThe measures are a circuit breaker for confidence, not for prices. A below-flat short-selling ban can slow a slide, but it cannot fix the AI demand doubts driving it. The test comes at the open: if the selling is broad and fundamental, five measures will look like a pause rather than a floor.\nSources agree-disagree\nCNA reports the FSC measures, the index moves, and the traders' warning. The Economic Daily News headline asks whether the rescue measures will work and whether the rebound holds or gives back ground. The two agree on the core facts and show no numeric conflicts. Trust label: Two-source agreement.\nStill uncertain\nThe feed does not list the other four measures beyond the below-flat short-selling ban, and gives no detail on how long the restrictions will last or what would trigger their removal. The full CNA report is the place to check the complete list."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-01-23\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-taiwan-01-23.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 美台股狂瀉金管會禁空令升級　法人：台股23日力抗賣壓\",\"zh-TW\":\"相關封面圖：美台股狂瀉金管會禁空令升級　法人：台股23日力抗賣壓\"},\"publishedAt\":\"2026-11-22T05:44:41.000Z\",\"title\":{\"en\":\"Taiwan's FSC Escalates Short-Selling Ban as TSMC ADR Drops 9.48%\",\"zh-TW\":\"美台股狂瀉，金管會禁空令升級，台積電 ADR 重挫 9.48%\"},\"summary\":{\"en\":\"Taiwan's Financial Supervisory Commission will ban short selling below the flat price from November 23, one of five stabilization measures, after AI-outlook worries hammered US and Taiwan stocks. The Philadelphia Semiconductor Index fell 10.73% and TSMC's ADR dropped 9.48%. Futures traders expect heavy selling pressure when Taiwan opens on November 23.\",\"zh-TW\":\"人工智慧（AI）前景疑慮衝擊美台股市，金管會（Financial Supervisory Commission）加碼限空，11 月 23 日起實施平盤下全面禁放空等 5 項穩定股市措施。費城半導體指數重挫 10.73%，台積電美國存託憑證（ADR）大跌 9.48%。期貨法人預期，台股 23 日開盤將面臨沉重的系統性賣壓。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"人工智慧（AI）前景疑慮拖垮美台股市，金管會（Financial Supervisory Commission）加碼限空，11 月 23 日起實施 5 項穩定股市措施。\\n發生了什麼事\\nAI 產業前景疑慮升溫，衝擊美股 4 大指數及 AI 概念股重挫，台指期夜盤與台積電期貨夜盤均下挫。金管會加碼限空，23 日起實施平盤下全面禁放空等 5 項穩定股市措施。期貨法人指出，與台股 AI 族群高度連動的費城半導體指數重挫 10.73%，台積電美國存託憑證（ADR）大跌 9.48%，台股 23 日開盤恐再面臨沉重的系統性賣壓。\\n為什麼重要\\n這套措施是信心的斷路器，不是價格的保證。平盤下禁放空可以拖慢跌勢，修不好引發跌勢的 AI 需求疑慮。考驗在開盤那一刻：如果賣壓是全面且基本面的，5 項措施看起來只會是暫停，而非底部。\\n來源異同\\n中央社（CNA）報導金管會措施、指數跌幅與法人警告；經濟日報（Economic Daily News）標題追問救市措施有沒有用、反彈能否守住。兩家對核心事實的說法一致，沒有數字衝突。信任標籤：雙源一致（Two-source agreement）。\\n仍不確定\\n摘要除了平盤下禁放空，沒列出另外 4 項措施，也沒說限制維持多久、什麼條件下解除。完整清單只能看中央社全文。\"},\"sources\":[{\"name\":\"中央社-產經證券\",\"url\":\"https://www.cna.com.tw/news/afe/202611220085.aspx\"},{\"name\":\"Google News\",\"url\":\"https://news.google.com/rss/articles/CBMiWkFVX3lxTE9FNmFlUDFZWnZBN2lIWjlRakU5d3pRcFdnaWMyOFZ6OVF2bDBKZmNxcHgxbFdSNVhTdFBUZnRrSU5UUWd5MEhWU1hKZ2xWMThLU3RXMWlZMElxQdIBX0FVX3lxTFBuc1p0VDUxM3FnYTFCaElMa2toeXNMbHdoZHhZX3hvVW5VSmRQS1ZwclpPLUlzV19zMjloZ0VlUmJTOUpGLThYWHVkb2ZJY19UbFB3azdCWm5zU3h6SVAw?oc=5\"}],\"disagreements\":null,\"trustScore\":73,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":20,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"中央社-產經證券\",\"經濟日報國際（google-news-代理）\"],\"glossary\":[{\"blurb\":{\"en\":\"Taiwan's financial regulator, which escalated short-selling limits from November 23.\",\"zh-TW\":\"台灣金融監理機關，11 月 23 日起加碼限空。\"},\"term\":{\"en\":\"Financial Supervisory Commission\",\"zh-TW\":\"金管會\"}},{\"blurb\":{\"en\":\"Taiwanese chipmaker whose American depositary receipts fell 9.48%.\",\"zh-TW\":\"台灣晶片大廠，美國存託憑證大跌 9.48%。\"},\"term\":{\"en\":\"TSMC\",\"zh-TW\":\"台積電\"}},{\"blurb\":{\"en\":\"US semiconductor stock index, down 10.73% and closely linked to Taiwan's AI stocks.\",\"zh-TW\":\"美國半導體股指數，重挫 10.73%，與台股 AI 族群高度連動。\"},\"term\":{\"en\":\"Philadelphia Semiconductor Index\",\"zh-TW\":\"費城半導體指數\"}},{\"blurb\":{\"en\":\"Taiwan's Central News Agency, which reported the FSC measures and market moves.\",\"zh-TW\":\"中央通訊社，報導金管會措施與市場走勢。\"},\"term\":{\"en\":\"CNA\",\"zh-TW\":\"中央社\"}},{\"blurb\":{\"en\":\"Taiwanese financial newspaper questioning whether the rescue measures will work.\",\"zh-TW\":\"追問救市措施是否有效的台灣財經報紙。\"},\"term\":{\"en\":\"Economic Daily News\",\"zh-TW\":\"經濟日報\"}},{\"blurb\":{\"en\":\"American depositary receipt, the US-traded form of TSMC shares.\",\"zh-TW\":\"美國存託憑證，台積電股票在美交易的形式。\"},\"term\":{\"en\":\"ADR\",\"zh-TW\":\"美國存託憑證\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-taiwan-01-23/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-taiwan-01-23/\"}],[\"$\",\"meta\",\"6\",{\"name\
