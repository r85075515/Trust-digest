to unicorn valuation in about a quarter.\nWhat happened\nCorma, an AI cybersecurity startup, raised $125 million in a Series A round led by NEA at a $1 billion valuation, three months after introducing its product. The feed material gives no detail on what the product does, who its customers are, what revenue it has, or who else joined the round — only the round size, the valuation, the lead investor, and the three-month timeline. One line in the raw feed spells the company “Corba”; the headline and title use Corma, which is used here.\nWhy it matters\nA $1 billion valuation three months after launch says less about Corma's product than about the market's appetite for AI security: investors are paying unicorn prices for early-stage companies in the sector. The takeaway: the valuation is a bet on the category, not a verdict on the company — at three months old, the product has barely been tested.\nSources agree / disagree\nThis card rests on TechCrunch alone. There is no second outlet in the material to corroborate the round, the valuation, or the timeline, so the figures are reported, not independently confirmed.\nStill uncertain\nThe product's function, customers, revenue, the full investor list, and the terms of the round were not in the feed material. Verify them in the full TechCrunch reporting before quoting figures.\nTrust label: Single source — TechCrunch only, with no corroboration in the material at hand."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-tech-03-cybersecurity-ai-startup\",\"category\":\"tech\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-tech-03-cybersecurity-ai-startup.png\",\"imageAlt\":{\"en\":\"Cover related to: Cybersecurity AI startup Corma reaches $1B valuation in about 3 months\",\"zh-TW\":\"相關封面圖：網路安全人工智慧新創公司 Corma 估值在大約 3 個月內達到 10 億美元\"},\"publishedAt\":\"2026-11-16T23:32:32.000Z\",\"title\":{\"en\":\"AI Cybersecurity Startup Corma Hits $1B Valuat
