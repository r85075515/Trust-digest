ng Wu, Quansheng Ge, and colleagues at the Institute of Geographic Sciences and Natural Resources Research, Chinese Academy of Sciences, found that fine particulate matter (PM2.5) significantly weakens global spring vegetation greening. Combining ground observations from 7,046 air-quality monitoring stations worldwide with 2000–2020 satellite vegetation records, the team showed that higher PM2.5 concentrations correspond with weaker spring greening across roughly 60% of vegetated grid cells. A meta-analysis across 104 plant species supports the finding, identifying mechanisms including particles depositing on leaves to clog or damage stomata and reducing photosynthetically available radiation.\n\nWhy it matters\nSpring greening drives seasonal terrestrial carbon uptake and ecosystem productivity. Demonstrating that PM2.5 physically impairs leaf gas exchange and light availability across global ecosystems links air-quality management directly to vegetation growth and climate-carbon feedbacks.\n\nSource differences\nAll three sources trace back to the same Nature Plants paper. Phys.org's report titled \"Fine particle pollution may weaken spring greening by clogging leaf pores\" highlights the leaf-pore clogging mechanism, Bioengineer.org's article titled \"Fine Particulate Air Pollution Substantially Weakens Global Land Spring Greening Trends\" summarizes the global modeling and meta-analysis, and the Nature Plants article page titled \"PM2.5 air pollution weakens global spring greening\" is the primary peer-reviewed publication.\n\nStill uncertain\nHow future reductions in regional PM2.5 emissions will interact with rising temperatures, droughts, and elevated atmospheric CO2 to alter net carbon sequestration across different biomes remains to be quantified.\nTrust label: Single source — All three sources report on the same Nature Plants study (DOI: 10.1038/s41477-026-02464-9)."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-science-405-pm25-weakens-global-spring-greening\",\"category\":\"science\",\"title\":{\"en\":\"Fine Particulate Air Pollution Weakens Global Spring Greening Trends\",\"zh-TW\":\"《Nature Plants》研究：PM2.5 細懸浮微粒顯著削弱全球春季植物綠化\"},\"summary\":{\"en\":\"A Nature Plants study published November 27, 2026 analyzing 7,046 air-quality stations and 2000–2020 satellite records found that higher PM2.5 levels weaken spring vegetation greening across roughly 60% of vegetated grid cells.\",\"zh-TW\":\"發表於《Nature Plants》（2026 年 11 月 27 日）的研究整合全球 7,046 個空氣品質監測站與 2000 至 2020 年衛星紀錄，發現約 60% 植被網格中 PM2.5 濃度越高、春季綠化趨勢越弱，主因微粒堵塞葉片氣孔並減少光合作用可用輻射，顯示改善空污有助維護陸地碳匯。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」發表於《Nature Plants》（2026 年 11 月 27 日，DOI：10.1038/s41477-026-02464-9）的研究指出，細懸浮微粒（PM2.5）污染會顯著削弱全球春季植被綠化趨勢。由中國科學院地理科學與資源研究所王建（Jian Wang）、吳朝陽（Chaoyang Wu）、葛全勝（Quansheng Ge）等人組成的研究團隊，整合全球 7,046 個空氣品質監測站地面觀測數據與 2000 至 2020 年衛星植被紀錄，發現在約 60% 的植被網格細胞中，PM2.5 濃度越高、春季綠化越弱；針對 104 個物種的統合分析亦支持此結論，機制包括微粒附著葉面堵塞或損傷氣孔，以及減少光合作用可用輻射。\\n\\n「為什麼重要」春季植被返青與綠化是陸地生態系吸收二氧化碳與累積生產力的關鍵時期。該研究從全球尺度證實 PM2.5 會直接干擾植物氣體交換與光照獲取，顯示空氣污染治理不僅關乎人類健康，也直接影響全球植被生長與碳循環。\\n\\n「來源異同」三個來源均屬同一篇《Nature Plants》論文的報導鏈。Phys.org 報導標題為「Fine particle pollution may weaken spring greening by clogging leaf pores」，側重微粒堵塞葉片氣孔的生理機制；Bioengineer.org 報導標題為「Fine Particulate Air Pollution Substantially Weakens Global Land Spring Greening Trends」，摘述全球數據分析與物種統合結果；Nature Plants 論文頁標題為「PM2.5 air pollution weakens global spring greening」，為一手同儕審查期刊原典。\\n\\n「仍不確定」未來各區域 PM2.5 減排政策若與氣候暖化、乾旱及大氣二氧化碳濃度上升交互作用，不同生態系淨固碳量的長期淨變化幅度仍待進一步量化評估。\\nTrust label: Single source — 三個來源皆源自同一篇《Nature Plants》研究論文（DOI：10.1038/s41477-026-02464-9）。\"},\"glossary\":[{\"term\":{\"en\":\"Spring greening\",\"zh-TW\":\"春季綠化\"},\"blurb\":{\"en\":\"The seasonal surge in leaf emergence and vegetation greenness observed via satellite indices during spring.\",\"zh-TW\":\"春季氣溫回升時植物展葉與植被覆蓋度快速增加的季節性現象，常透過衛星植被指數觀測。\"}},{\"term\":{\"en\":\"Stomata\",\"zh-TW\":\"氣孔\"},\"blurb\":{\"en\":\"Microscopic pores on plant leaves that regulate carbon dioxide uptake and water vapor release.\",\"zh-TW\":\"植物葉片表面的微小孔隙，負責調節光合作用所需的二氧化碳吸收與水蒸氣蒸散。\"}},{\"term\":{\"en\":\"Meta-analysis\",\"zh-TW\":\"統合分析\"},\"blurb\":{\"en\":\"A statistical synthesis combining results from multiple independent studies across different species or sites.\",\"zh-TW\":\"將多項獨立實驗或跨物種觀測數據進行系統性統計整合，以檢驗整體趨勢一致性的研究方法。\"}}],\"sources\":[{\"name\":\"Phys.org\",\"url\":\"https://phys.org/news/2026-11-fine-particle-pollution-weaken-greening.html\"},{\"name\":\"Bioengineer.org\",\"url\":\"https://bioengineer.org/fine-particulate-air-pollution-substantially-weakens-global-land-spring-greening-trends/\"},{\"name\":\"Nature Plants\",\"url\":\"https://www.nature.com/articles/s41477-026-02464-9\"}],\"imageUrl\":\"/covers/live/live-science-405-pm25-weakens-global-spring-greening.png\",\"imageAlt\":{\"en\":\"Fine Particulate Air Pollution Weakens Global Spring Greening Trends\",\"zh-TW\":\"《Nature Plants》研究：PM2.5 細懸浮微粒顯著削弱全球春季植物綠化\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":74,\"trustBreakdown\":{\"crossCorroboration\":15,\"outletReputation\":23,\"recencyClarity\":25,\"sourceDiversity\":11},\"publishedAt\":\"2026-11-28T09:02:06.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":21,\"D2\":20,\"D3\":20,\"D4\":18,\"D5\":20,\"total\":20},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-science-405-pm25-weakens-global-spring-greening/\"}],[\"$\",\"meta\",\
