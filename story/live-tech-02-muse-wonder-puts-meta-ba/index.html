.\nWhat happened\nWhere Muse Spark was designed as a lightweight, low-latency model, the Wonder models are larger and said to be more capable, with higher benchmark scores and better results on complex tasks like coding. The models add \"active memory\" and \"active focus\" abilities, and Meta's biggest model is described as rivaling the world's best while including new features to keep agents from going off the rails. The launch follows Muse Spark — the first model from Meta's revamped Superintelligence Labs division — and its buzzy AI agent Muse. TechCrunch calls Wonder Meta's first frontier model; The Decoder says Wonder Full breaks into the AI top tier.\nWhy it matters\nMeta spent the last two years playing catch-up in the model race after falling behind on frontier releases. If Wonder's benchmark claims hold, Meta rejoins the top-tier conversation alongside the labs it has been chasing — and the \"active memory\"/\"active focus\" framing shows the battle has moved from raw capability to agentic reliability.\nSources agree / disagree\nTechCrunch, The Verge, Engadget, Wired, and The Decoder all describe the same launch with consistent details — two models, Code-subscriber availability, and the Spark-to-Wonder step-up. No conflicting facts in the snippets.\nStill uncertain\nBenchmark scores and the exact mechanics of \"active memory\" and \"active focus\" are asserted, not shown, in the snippets. Independent evaluations and pricing beyond Code subscribers are not detailed — verify in full reporting."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-tech-02-muse-wonder-puts-meta-ba\",\"category\":\"tech\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-tech-02-muse-wonder-puts-meta-ba.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Muse Wonder Puts Meta Back at the AI Frontier\",\"zh-TW\":\"相關封面圖：Muse Wonder 讓 Meta 重新回到人工智慧前沿\"},\"publishedAt\":\"2026-10-12T18:51:52.000Z\",\"title\":{\"en\":\"Meta Launches Muse Wonder and Wonder Full Frontier Models\",\"zh-TW\":\"Meta 推出 Muse Wonder 與 Wonder Full 前沿模型\"},\"summary\":{\"en\":\"Meta launched two new models, Muse Wonder and Muse Wonder Full, which it claims can go toe-to-toe with the industry's best. Larger and more capable than the lightweight Muse Spark, they add 'active memory' and 'active focus' abilities and are available to Muse Code subscribers starting today.\",\"zh-TW\":\"Meta 推出兩款新模型 Muse Wonder 與 Muse Wonder Full，宣稱可與業界最強正面交鋒。兩者比輕量低延遲的 Muse Spark 更大、能力更強，新增「主動記憶」與「主動聚焦」能力，即日起開放 Muse Code 訂戶使用。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"Meta 宣稱自己重返 AI 前沿。該公司推出兩款新模型——Muse Wonder 與 Muse Wonder Full，號稱可與業界最強正面交鋒，即日起開放 Muse Code 訂戶使用。\\n發生了什麼事\\nMuse Spark 定位輕量低延遲，Wonder 系列則更大、據稱能力更強，在編碼等複雜任務上有更高的基準分數與更好的表現。新模型新增「主動記憶」與「主動聚焦」能力；Meta 最大的模型被形容為可與全球最強比肩，並加入防止 agent 脫軌的新功能。這次發表接在 Muse Spark（改組後的超級智慧實驗室首款模型）與話題 AI 代理 Muse 之後。TechCrunch 稱 Wonder 是 Meta 首款前沿模型；The Decoder 則說 Wonder Full 擠進 AI 第一梯隊。\\n為什麼重要\\n過去兩年 Meta 在模型競賽中一直處於追趕位置，前沿版本落後對手。若 Wonder 的基準宣稱站得住腳，Meta 將重返第一梯隊的對話——而「主動記憶」／「主動聚焦」的訴求也顯示，戰場已從原始能力轉向 agent 的可靠性。\\n來源異同\\nTechCrunch、《The Verge》、Engadget、《連線》（Wired）、The Decoder 報導的是同一場發表，細節一致——兩款模型、Code 訂戶可用、從 Spark 到 Wonder 的升級。來源摘要中沒有事實衝突。\\n仍不確定\\n摘要中提到的基準分數與「主動記憶」／「主動聚焦」的具體機制都是宣稱、未經展示；Code 訂戶之外的定價與獨立評測也沒有細節；引用前請查閱完整報導。\"},\"sources\":[{\"name\":\"TechCrunch\",\"url\":\"https://techcrunch.com/2026/10/12/meta-releases-its-first-frontier-model-muse-wonder/\"},{\"name\":\"The Verge\",\"url\":\"https://www.theverge.com/ai-artificial-intelligence/1009479/meta-muse-wonder-full-ai-model\"},{\"name\":\"Engadget\",\"url\":\"https://www.engadget.com/2284478/meta-says-its-caught-up-to-the-frontier-with-its-latest-wonder-ai-models/\"},{\"name\":\"Wired AI\",\"url\":\"https://www.wired.com/story/muse-wonder-puts-meta-back-at-the-ai-frontier/\"},{\"name\":\"The Decoder\",\"url\":\"https://the-decoder.com/metas-new-frontier-model-muse-wonder-full-breaks-into-the-ai-top-tier/\"}],\"disagreements\":null,\"trustS
