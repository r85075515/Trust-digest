fessional Go tournament in Taipei on Thursday, November 26, 2026, defeating fellow Taiwanese player Lai Jyun-fu 3-1 in the best-of-five championship series. The victory earned Hsu his third professional Go title of the 2026 season.\n\nAs the first edition of the Xuan Le Cup on Taiwan's professional Go calendar, the tournament pitted Taiwan's top-ranked players in a multi-game title format. Hsu's 3-1 triumph over Lai Jyun-fu underscores his sustained consistency at the top of Taiwanese Go following his landmark 2023 Hangzhou Asian Games gold medal.\n\nFocus Taiwan (Central News Agency) and International Community Radio Taipei (ICRT) report identical facts regarding the tournament name, the 3-1 final score in the best-of-five series, runner-up Lai Jyun-fu, and Hsu's tally of three titles in 2026. Neither outlet reported any scoring disputes or format changes.\n\nDetailed game-by-game komi margins, total prize purse distribution, and Hsu's next scheduled international tournament appearances were not specified in the brief wire reports.\n\nTrust label: Multi-source agreement — Confirmed by Central News Agency (Focus Taiwan) and ICRT with consistent match results."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-entertainment-113-hsu-hao-hung-wins-inaugural-xuan-le-cup-go\",\"category\":\"entertainment\",\"title\":{\"en\":\"Asian Games Gold Medalist Hsu Hao-hung Wins Inaugural Xuan Le Cup Go Title\",\"zh-TW\":\"亞運金牌棋士許皓鋐 3 比 1 擊敗賴均輔 奪首屆「宣樂盃」職業圍棋賽冠軍\"},\"summary\":{\"en\":\"Taiwanese Go champion Hsu Hao-hung defeated Lai Jyun-fu 3-1 in the best-of-five final to win the inaugural Xuan Le Cup professional Go tournament, securing his third title of 2026. Takeaway: Hsu reinforced his domestic dominance in Taiwanese professional Go ahead of upcoming international competitions.\",\"zh-TW\":\"杭州亞運圍棋金牌得主許皓鋐在首屆「宣樂盃」職業圍棋賽五戰三勝制決賽中，以 3 比 1 擊敗賴均輔奪得冠軍，抱回個人 2026 年第三座職業賽桂冠。一句重點結論：許皓鋐在國內新創大型賽事再度封王，延續其台灣棋壇頂尖戰力。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n杭州亞運圍棋男子個人賽金牌得主許皓鋐（Hsu Hao-hung）於 2026 年 11 月 26 日在首屆「宣樂盃」職業圍棋賽五戰三勝制決賽中，以 3 比 1 擊敗台灣好手賴均輔（Lai Jyun-fu），順利摘下首屆冠軍獎盃，這也是許皓鋐在 2026 年拿下的第三座職業賽事冠軍。\\n\\n「為什麼重要」\\n「宣樂盃」為台灣職業棋壇新創賽事，採五戰三勝制考驗棋手穩定度與臨場應變。許皓鋐繼亞運奪金後持續在國內各大頭銜戰保持高勝率，展現其在台灣棋界的領軍地位與穩定競技狀態。\\n\\n「來源異同」\\n中央社英文網（Focus Taiwan）與台北國際社區廣播電台（ICRT）對賽事名稱、五戰三勝制 3 比 1 比數、亞軍賴均輔以及許皓鋐今年第三冠等事實記載完全一致，並無報導分歧。\\n\\n「仍不確定」\\n決賽各局詳細目數差距、首屆賽事總獎金分配明細，以及許皓鋐下一場國際大賽出賽時程，目前公開報導中尚未進一步揭露。\"},\"glossary\":[{\"term\":{\"en\":\"Xuan Le Cup\",\"zh-TW\":\"宣樂盃職業圍棋賽\"},\"blurb\":{\"en\":\"A newly established Taiwanese professional Go tournament featuring a best-of-five championship final.\",\"zh-TW\":\"台灣新創辦的職業圍棋賽事，決賽採用五戰三勝制決出冠軍。\"}},{\"term\":{\"en\":\"Best-of-Five Series\",\"zh-TW\":\"五戰三勝制\"},\"blurb\":{\"en\":\"A championship match format in which the first player to win three games claims the series title.\",\"zh-TW\":\"職業棋賽常見的番棋賽制，率先贏得三盤對局的棋手即獲得最終優勝。\"}},{\"term\":{\"en\":\"Professional Go\",\"zh-TW\":\"職業圍棋\"},\"blurb\":{\"en\":\"Competitive board game play sanctioned by national Go associations where ranked professionals compete for titles and prize money.\",\"zh-TW\":\"由各國棋院認證並授予職業段位的棋士所參與的競技圍棋體系。\"}}],\"sources\":[{\"name\":\"Focus Taiwan (CNA)\",\"url\":\"https://focustaiwan.tw/sports/202611270005\"},{\"name\":\"ICRT\",\"url\":\"https://www.icrt.com.tw/info_details.php?mlevel1=6\u0026mlevel2=12\u0026news_id=312596\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"Professional Go board and stones during tournament play\",\"zh-TW\":\"職業圍棋比賽棋盤與黑白棋子\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":86,\"trustBreakdown\":{\"crossCorroboration\":22,\"outletReputation\":22,\"recencyClarity\":22,\"sourceDiversity\":20},\"publishedAt\":\"2026-11-27T16:08:57.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":5,\"D2\":5,\"D3\":4,\"D4\":4,\"D5\":4,\"total\":22},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\
