ht: the court, not the press, will now test the complaints. The outcome will shape how the two former employees' claims are judged and whether further charges follow.\nSources agree / disagree\nRolling Stone Music and BBC Entertainment agree on the core facts: a Spanish court investigation, two former employees as complainants, and alleged abuse at Caribbean homes in 2021. No numeric or name conflicts appear in the short feed descriptions.\nStill uncertain\nThe missing pieces are the key ones: what exactly the complaint alleges, which court is handling the case and how far the investigation has progressed, and whether Iglesias or his representatives have responded. The feed snippets give no dates for the complaint, no detail on the alleged incidents, and no word on next procedural steps. Verify on the publisher pages.\nTrust label: Two-source agreement"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-entertainment-02-julio-iglesias-under-inv\",\"category\":\"entertainment\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-entertainment-02-julio-iglesias-under-inv.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Julio Iglesias Under Investigation for Sexual Abuse Claims\",\"zh-TW\":\"相關封面圖：胡里奧·伊格萊西亞斯因性虐待指控接受調查\"},\"publishedAt\":\"2026-11-19T01:48:52.000Z\",\"title\":{\"en\":\"Julio Iglesias Under Investigation Over Sexual Abuse Claims\",\"zh-TW\":\"胡里奧·伊格萊西亞斯（Julio Iglesias）因性侵指控接受調查\"},\"summary\":{\"en\":\"Spanish singer Julio Iglesias, 83, faces a criminal investigation after two former employees accused him of abusing them at Caribbean residences in 2021. Rolling Stone and the BBC both report the court probe; the complaint's details and the investigation's next steps remain undisclosed. Watch for the court's next move and any statement from Iglesias.\",\"zh-TW\":\"83 歲西班牙歌手胡里奧·伊格萊西亞斯（Julio Iglesias）遭兩名前員工指控 2021 年在加勒比海住所性侵，西班牙法院已展開刑事調查。《滾石》與 BBC 均報導此事，但投訴細節與調查進度尚未公開；接下來看法院動向與伊格萊西亞斯方面是
