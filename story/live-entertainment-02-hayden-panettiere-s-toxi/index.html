g on August 16 was not treated as suspicious.\nWhat happened\nPanettiere, 36, died in August from the toxic effects of fentanyl, Xanax, and several other drugs, according to the toxicology report revealed by the Greenville County Coroner's Office a month after she died. The report's findings, together with the medical examiner's determination, led investigators to rule the death accidental and close the case. Panettiere was known for her roles in Heroes and Nashville.\nWhy it matters\nA closed investigation with an accidental-overdose finding answers the central public question about a young actor's death, while leaving the private circumstances to the family. The toxicology report matters because it replaces speculation with a medical determination: the cause was the combined toxic effects of the drugs named, not foul play.\nSources agree / disagree\nBillboard, Hollywood Life, and BBC Entertainment agree on the core facts: the accidental ruling, the closed case, the August 16 date, and the drugs named in the toxicology report. No outlet disputes another's account, and the BBC's report of the local police probe ending matches the other outlets' case-closed reporting. Trust label: Multi-source agreement — three outlets agree on the ruling, the closed case, and the toxicology findings.\nStill uncertain\nThe snippets do not name the several other drugs beyond fentanyl and Xanax, and a quoted sentence from the authorities breaks off mid-sentence in the feed text. The full toxicology report and the complete official statement should be checked before quoting further detail."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-entertainment-02-hayden-panettiere-s-toxi\",\"category\":\"entertainment\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-entertainment-02-hayden-panettiere-s-toxi.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Hayden Panettiere’s Toxicology Report: What We Know About Her Death Investigation\",\"zh-TW\":\"相關封面圖：海頓潘妮蒂爾的毒理學報告：我們對她的死亡調查了解多少\"},\"publishedAt\":\"2026-10-29T03:01:24.000Z\",\"title\":{\"en\":\"Hayden Panettiere's Death Ruled Accidental Overdose, Investigation Closed\",\"zh-TW\":\"海頓·潘妮蒂爾（Hayden Panettiere）之死裁定為意外過量，調查結案\"},\"summary\":{\"en\":\"The investigation into Hayden Panettiere's death is closed after investigators found an accidental overdose was to blame, and police confirmed her passing on August 16 was not treated as suspicious. The Heroes and Nashville actress was 36. A toxicology report named fentanyl, Xanax, and several other drugs.\",\"zh-TW\":\"海頓·潘妮蒂爾（Hayden Panettiere）死亡案調查已經結案，調查發現死因是意外服藥過量；警方證實她 8 月 16 日的辭世未被視為可疑。這位《英雄》與《音樂之鄉》的演員年僅 36 歲。接下來看：毒理學報告點名芬太尼、Xanax 與其他幾種藥物。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"演員海頓·潘妮蒂爾（Hayden Panettiere）死亡案的調查已經結案，調查發現死因是意外服藥過量。格林維爾警察局證實，她 8 月 16 日的辭世並未被視為可疑案件。\\n發生了什麼事\\n36 歲的潘妮蒂爾在 8 月死於芬太尼、Xanax 與其他幾種藥物的毒性作用；相關毒理學報告由格林維爾縣驗屍官辦公室在她去世一個月後公布。報告的發現，加上法醫的認定，讓調查人員裁定死亡為意外，並結案。潘妮蒂爾以《英雄》（Heroes）與《音樂之鄉》（Nashville）中的角色聞名。\\n為什麼重要\\n裁定意外過量並結案的調查，回答了關於這位年輕演員之死最核心的公眾疑問，同時把私人情節留給家屬。毒理學報告之所以重要，是因為它以醫學認定取代了揣測：死因是所列藥物的綜合毒性作用，而非他殺。\\n來源異同\\nBillboard、Hollywood Life 與英國廣播公司娛樂版（BBC Entertainment）對核心事實的報導一致：意外裁定、結案、8 月 16 日的日期，以及毒理學報告中列出的藥物。沒有任何一家媒體質疑另一家的說法；英國廣播公司關於地方警方調查結束的報導，也與其他媒體的結案報導相符。信任標籤：N源一致——三家媒體對裁定、結案與毒理學發現的報導一致。\\n仍不確定\\n摘要沒有點名芬太尼與 Xanax 之外的其他幾種藥物，當局的一句引言也在摘要文字中途截斷。引用更多細節前，請查閱完整的毒理學報告與官方聲明。\"},\"sources\":[{\"name\":\"Billboard\",\"url\":\"https://www.billboard.com/music/music-news/hayden-panettiere-death-ruled-accidental-case-closed-reports-1236370116/\"},{\"name\":\"Hollywood Life\",\"url\":\"https://hollywoodlife.com/2026/10/28/hayden-panettiere-toxicology-report-updates/\"},{\"name\":\"BBC Entertainment\",\"url\":\"https://www.bbc.co.uk/news/articles/c6lylxjkkp0vo?at_medium=RSS\u0026at_campaign=rss\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":21,\"outletReputation\":14,\"crossCorroboration\":22,\"recencyClarity\":25},\"tags\":[\"entertainment\",\"live-ingest\",\"billboard\",\"hollywood-life\",\"bbc-entertainment\"],\"glossary\":[{\"blurb\":{\"en\":\"Actress known for Heroes and Nashville, who died at 36.\",\"zh-TW\":\"以《英雄》與《音樂之鄉》聞名、36 歲辭世的演員。\"},\"term\":{\"en\":\"Hayden Panettiere\",\"zh-TW\":\"海頓·潘妮蒂爾\"}},{\"blurb\":{\"en\":\"Police department that confirmed the August 16 passing was not treated as suspicious.\",\"zh-TW\":\"證實 8 月 16 日辭世未被視為可疑的警察局。\"},\"term\":{\"en\":\"Greenville Police Department\",\"zh-TW\":\"格林維爾警察局\"}},{\"blurb\":{\"en\":\"Coroner's office that revealed the toxicology report a month after the death.\",\"zh-TW\":\"在死後一個月公布毒理學報告的驗屍官辦公室。\"},\"term\":{\"en\":\"Greenville County Coroner's Office\",\"zh-TW\":\"格林維爾縣驗屍官辦公室\"}},{\"blurb\":{\"en\":\"Music industry publication that reported the death ruled accidental and the case closed.\",\"zh-TW\":\"報導死亡裁定意外、案件結案的音樂產業刊物。\"},\"term\":{\"en\":\"Billboard\",\"zh-TW\":\"Billboard\"}},{\"blurb\":{\"en\":\"BBC entertainment news desk that reported the accidental ruling ending the police probe.\",\"zh-TW\":\"報導意外裁定、結束警方調查的英國廣播公司娛樂新聞部門。\"},\"term\":{\"en\":\"BBC Entertainment\",\"zh-TW\":\"BBC 娛樂版\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://r85075515.g
