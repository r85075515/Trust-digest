rogram. Stakeholders have 45 days after publication in the Federal Register to submit comments.\n\n「Why it matters」\nInformation technology examinations shape how banks manage core systems, third-party technology risks, and cybersecurity controls. Gathering industry and public input can influence future supervisory expectations and compliance workloads for financial institutions.\n\n「Source differences」\nThe official agency press release is titled \"FDIC Seeks Input Regarding Information Technology Examinations\", stating the request for information and the 45-day comment window after Federal Register publication. A separate financial news summary is titled \"FDIC seeks input on IT examination changes for supervised\", summarizing the request as seeking feedback on potential revisions to address evolving cyber risks.\n\n「Still uncertain」\nWhether the agency will propose formal rule or examination manual changes after the comment period closes remains to be determined.\n\nTrust label: High confidence based on primary regulator release and news reporting."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-230-fdic-it-examinations-rfi\",\"category\":\"finance\",\"title\":{\"en\":\"FDIC Seeks Public Input on Information Technology Examinations\",\"zh-TW\":\"FDIC 徵求對資訊科技檢查機制的意見\"},\"summary\":{\"en\":\"The Federal Deposit Insurance Corporation issued a request for information on November 27, 2026 regarding its information technology examination program for supervised institutions. Comments will be due 45 days after Federal Register publication. The move signals a potential review of bank technology oversight amid evolving cyber risks.\",\"zh-TW\":\"美國聯邦存款保險公司於 2026 年 11 月 27 日發布徵求意見公告，針對受監管機構的資訊科技檢查計畫徵詢外界回饋。意見徵集將於聯邦公報刊登後 45 天截止，顯示監管機關正評估因應網路風險演變的科技查核調整方向。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n美國聯邦存款保險公司於 2026 年 11 月 27 日發布新聞稿，針對資訊科技檢查計畫啟動徵求意見程序，各界可在該公告刊登於聯邦公報後的 45 天內提交意見。\\n\\n「為什麼重要」\\n資訊科技檢查直接影響銀行對核心系統、第三方科技風險
