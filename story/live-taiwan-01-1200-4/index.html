-off driven by the re-pricing of Nvidia and AI bellwethers.\nWhat happened\nCentral News Agency reports U.S. AI tech stocks fell, the Philadelphia Semiconductor Index dropped more than 5 percent, and Japanese and Korean markets also slid. Taiwan stocks opened low and kept falling to 39,786.45, down 1,253.63 points, then heavyweights stopped falling and turned positive; the broader index flipped from red to green and at one point rose nearly 100 points, holding the 40,000 mark for now. A second CNA item adds that TSMC's ADR fell more than 6 percent, while Taiwan index futures rose against the trend in night trading to close at 40,935, up 154 points, and TSMC futures closed at 2,211, up 2 points. Futures analysts cited in the report say the market is re-rating Nvidia and AI indicator stocks after Jensen Huang's departure, putting pressure on Taiwan's supply chain, and that Taiwan stocks are fighting to hold 40,000.\nWhy it matters\nThe 40,000 level is the line the market is defending: the morning low broke well below it, and the recovery back above it is the day's real story. The takeaway: the AI-stock storm that produced Monday's historic plunge is still setting the tone, but futures are already pricing a calmer session — the fight is over whether 40,000 holds.\nSources agree / disagree\nThis card rests on Central News Agency alone, with two items from its markets desk. The two items agree on the direction and the driver; the raw feed's “1200 vs 6” figures note is ingest noise — 1,200 points and 6 percent are different units, not a conflict.\nStill uncertain\nThe close, the full-day range, trading volume, and which heavyweights led the rebound were not in the feed material. Verify them in the full CNA reporting before quoting closing figures.\nTrust label: Single source — Central News Agency only, with no corroboration in the material at hand."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-01-1200-4\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-taiwan-01-1200-4.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 台股早盤一度跌逾1200點　權值股翻紅守穩4萬點\",\"zh-TW\":\"相關封面圖：台股早盤一度跌逾1200點　權值股翻紅守穩4萬點\"},\"publishedAt\":\"2026-11-17T01:17:28.000Z\",\"title\":{\"en\":\"TAIEX Plunges Over 1,200 Points Intraday, Then Claws Back to Hold 40,000\",\"zh-TW\":\"台股早盤一度大跌逾 1200 點，權值股翻紅守住 4 萬點\"},\"summary\":{\"en\":\"Taiwan's TAIEX plunged on November 17, falling as low as 39,786.45 — down 1,253.63 points — as U.S. AI stocks slid and the Philadelphia Semiconductor Index dropped more than 5 percent. Heavyweight stocks turned positive and the index recovered to hold the 40,000 level. Takeaway: a sharp open, a steadier close; the AI-stock storm is still setting the tone.\",\"zh-TW\":\"台股 11 月 17 日早盤重挫，最低跌至 39,786.45 點、大跌 1,253.63 點，主因美國 AI 股挫跌、費城半導體指數跌逾 5%。隨後權值股止跌翻紅，大盤由黑翻紅一度上漲近百點，暫守 4 萬點關卡。結論：開盤重挫、收盤回穩，AI 股風暴仍在定調。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"台股 11 月 17 日開低走跌，最低跌至 39,786.45 點、大跌 1,253.63 點，受美國 AI 股挫跌拖累；隨後權值股止跌翻紅，大盤由黑翻紅，暫守 4 萬點關卡。早盤的劇烈震盪，延續了市場重估輝達與 AI 指標股評價引發的賣壓。\\n發生了什麼事\\n中央社報導，美國 AI 科技股挫跌，費城半導體指數跌逾 5%，日韓股市也下挫。台股今天開低走跌，最低 39,786.45 點、大跌 1,253.63 點，隨後權值股止跌翻紅，大盤由黑翻紅一度上漲近百點，暫守 4 萬點關卡。中央社另一篇報導補充，台積電 ADR 跌逾 6%，台指期夜盤則逆勢勁揚收 40,935 點、上漲 154 點，台積電期貨夜盤收 2,211 點、上漲 2 點。期貨法人分析，黃仁勳去職後市場重估輝達（Nvidia）和 AI 指標股評價，台廠供應鏈承壓，台股今天力守 4 萬點大關。\\n為什麼重要\\n4 萬點是市場正在防守的關卡：早盤低點大幅跌破它，隨後收復它，才是今天真正的故事。結論是：造成週一歷史性暴跌的 AI 股風暴仍在定調，但期貨夜盤已經在反映較平穩的盤勢——爭奪的焦點就是 4 萬點守不守得住。\\n來源異同\\n本卡只有中央社一家來源，產經證券線的兩篇報導。兩篇在方向與原因上一致；來源摘要的「1200 比 6」數字註記是 ingest 雜訊——1200 點與 6% 是不同單位，不是衝突。\\n仍不確定\\n收盤價、全日區間、成交量、以及哪些權值股領軍反彈，摘要都沒有，引用收盤數字前請查中央社完整報導。\"},\"sources\":[{\"name\":\"中央社-產經證券\",\"url\":\"https://www.cna.com.tw/news/afe/202611170024.aspx\"}],\"disagreements\":null,\"trustScore\":59,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"中央社-產經證券\",\"中央社-產經證券\"],\"glossary\":[{\"term\":{\"en\":\"TAIEX\",\"zh-TW\":\"台灣加權股價指數（TAIEX）\"},\"blurb\":{\"en\":\"Taiwan's benchmark stock index.\",\"zh-TW\":\"台灣股市的基準指數。\"}},{\"term\":{\"en\":\"TSMC\",\"zh-TW\":\"台積電（TSMC）\"},\"blurb\":{\"en\":\"Taiwan chipmaker whose ADR fell more than 6 percent.\",\"zh-TW\":\"ADR 跌逾 6% 的台灣晶片製造商。\"}},{\"term\":{\"en\":\"Philadelphia Semiconductor Index\",\"zh-TW\":\"費城半導體指數\"},\"blurb\":{\"en\":\"U.S. chip-stock index that fell more than 5 percent.\",\"zh-TW\":\"跌逾 5% 的美國晶片股指數。\"}},{\"term\":{\"en\":\"CNA\",\"zh-TW\":\"中央社（CNA）\"},\"blurb\":{\"en\":\"Taiwan's Central News Agency, the sole source for this card.\",\"zh-TW\":\"本卡唯一來源，台灣的中央通訊社。\"}},{\"term\":{\"en\":\"Jensen Huang\",\"zh-TW\":\"黃仁勳（Jensen Huang）\"},\"blurb\":{\"en\":\"Nvidia's departed CEO, whose exit triggered the re-rating.\",\"zh-TW\":\"去職引發市場重估的輝達執行長。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-taiwan-01-1200-4/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-taiwan-01-1200-4/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified
