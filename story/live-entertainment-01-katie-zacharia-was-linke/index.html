as on shaky ground from her first press conference, including over questions about her claims of being a lawyer despite not passing a bar exam.\nWhat happened\nBBC World reports Zacharia leaving the White House role less than five days into the job; CNBC and PBS NewsHour carry the same news — she is out as Trump's White House press secretary after less than a week. The short tenure followed a debut dogged by criticism of her credentials and readiness. Separately, Wired reported that the short-lived press secretary had been listed as an adviser to a Kristi Noem–linked company that aims to use AI for mining — a rare-earths startup connection the headline calls \"even weirder than it sounds.\" Both the company and Zacharia say she never worked there. The same feed cluster also carries a CNBC item in which Trump says the White House did not order Starlink restrictions in Ukraine, after Ukrainian officials complained SpaceX had limited internet connectivity without advance notice — a separate story sharing the cluster.\nWhy it matters\nA press secretary lasting less than a week is a staffing failure visible to the entire press corps: the job is the administration's daily interface with the media, and a revolving door there signals disarray louder than any single gaffe. The Wired coda — an AI rare-earths startup, a Noem-linked company, a denied advisory role — shows how fast the vetting conversation metastasized beyond the briefing room. For an administration already fielding credibility questions, the episode is expensive in the one currency the press shop is supposed to protect: trust.\nSources agree / disagree\nBBC, CNBC, PBS NewsHour, The Hill, Axios and others agree on the core fact: Zacharia is out after less than a week. Wired alone carries the startup-adviser thread, with the denial from both sides included. The Starlink/Ukraine item is a separate CNBC story co-clustered here, not a contradiction. The feed notes figures differ across outlets in headlines and snippets, so treat specific numbers as outlet-specific until verified.\nStill uncertain\nThe snippets do not give the official reason for the exit, who replaces her, or any detail on the startup's actual operations. \"Less than a week\" versus \"less than five days\" is outlet phrasing, not a verified timeline; verify on publisher pages before quoting."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-entertainment-01-katie-zacharia-was-linke\",\"category\":\"entertainment\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-entertainment-01-katie-zacharia-was-linke.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Katie Zacharia Was Linked to an AI Rare-Earths Startup. It’s Even Weirder Than It Sounds\",\"zh-TW\":\"相關封面圖：凱蒂·扎卡里亞 (Katie Zacharia) 與一家人工智慧稀土新創公司有聯繫。這比聽起來更奇怪\"},\"publishedAt\":\"2026-10-17T05:20:40.000Z\",\"title\":{\"en\":\"Katie Zacharia Exits as White House Press Secretary After Less Than a Week\",\"zh-TW\":\"扎卡利亞（Katie Zacharia）上任不到一週，去職白宮新聞秘書\"},\"summary\":{\"en\":\"Katie Zacharia is out as White House press secretary less than five days into the job, after a debut marred by criticism of her credentials — including claims of being a lawyer without passing a bar exam. A Wired report linked her to an AI rare-earths startup tied to Kristi Noem; both she and the company deny she worked there.\",\"zh-TW\":\"扎卡利亞（Katie Zacharia）擔任白宮新聞秘書不到五天就去職，處女秀被資歷質疑淹沒——包括自稱律師卻沒通過律師考試。Wired 另篇報導把她與一家和諾姆（Kristi Noem）有關的 AI 稀土新創連在一起；她本人與該公司都說她從未在那工作過。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"扎卡利亞（Katie Zacharia）將卸下白宮新聞秘書一職，上任不到五天。她的公開處女秀以排山倒海的資歷質疑收場——從第一場記者會起就站不穩，包括被質疑自稱律師卻沒通過律師考試。\\n發生了什麼事\\nBBC World 報導扎卡利亞上任不到五天就離開白宮職位；CNBC 與 PBS 新聞一小時同樣報導——她在擔任川普（Donald Trump）的白宮新聞秘書不到一週後去職。短命任期的背後，是處女秀一路被資歷與準備不足的批評追著打。另外，Wired 報導這位短命新聞秘書曾被列為一家與諾姆（Kristi Noem）有關的公司的顧問——該公司想用 AI 做採礦，標題稱這家 AI 稀土新創的內情「比聽起來更離奇」。該公司與扎卡利亞都說她從未在那工作過。同一個來源群組還有一則 CNBC 消息：川普表示白宮沒有下令限制 Starlink 在烏克蘭的使用，此前烏克蘭官員抱怨 SpaceX 無預警限制了網路連線——這是搭同一群組便車的另一則故事。\\n為什麼重要\\n新聞秘書撐不到一週，是整個記者團都看得見的人事失敗：這個職位是政府每天面對媒體的介面，旋轉門轉得這麼快，比任何單一失言都更響亮地宣告混亂。Wired 的尾聲——AI 稀土新創、與諾姆有關的公司、被否認的顧問職——顯示審查爭議從簡報室外溢得有多快。對一個本就在面對公信力質疑的政府來說，這一集賠掉的正是新聞室該守護的唯一貨幣：信任。\\n來源異同\\nBBC、CNBC、PBS 新聞一小時、The Hill、Axios 等家對核心事實一致：扎卡利亞上任不到一週去職。Wired 獨家報導新創顧問這條線，並附上雙方的否認。Starlink／烏克蘭那則是搭同一群組的 CNBC 獨立故事，並非矛盾。來源摘要提醒各媒體標題與摘要中的數字有所出入，具體數字請視為各媒體說法，查證後再引用。\\n仍不確定\\n來源摘要沒有官方去職原因、繼任人選，也沒有該新創實際營運的細節。「不到一週」或「不到五天」是各媒體的措辭，不是經過驗證的時間線；引用前請到媒體頁面查證。\"},\"sources\":[{\"name\":\"BBC World\",\"url\":\"https://www.bbc.co.uk/news/articles/c32l4ekpvzl8o?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"CNBC\",\"url\":\"https://www.cnbc.com/2026/10/16/trump-katie-zacharia-white-house.html\"},{\"name\":\"Wired AI\",\"url\":\"https://www.wired.com/story/katie-zacharia-was-linked-to-an-ai-rare-earths-startup-its-even-weirder-than-it-sounds/\"},{\"name\":\"PBS NewsHour\",\"url\":\"https://www.pbs.org/newshour/show/news-wrap-zacharia-out-as-white-house-press-secretary-after-less-than-a-week-on-the-job\"},{\"name\":\"The Hill\",\"url\":\"https://thehill.com/homenews/administration/6155603-katie-zacharia-press-secretary-exit-statement/\"},{\"name\":\"Axios\",\"url\":\"https://www.axios.com/2026/10/16/trump-katie-zacharia-press-secretary\"},{\"name\":\"Financial Times\",\"url\":\"https://www.ft.com/content/ae21e5e0-6696-4cd2-877c-7d269b3bcf48?syn-25a6b1a6=1\"},{\"name\":\"TMZ\",\"url\":\"https://www.tmz.com/2026/10/16/katie-zacharia-resigns-white-house-press-secretary/\"},{\"name\":\"Hollywood Life\",\"url\":\"https://hollywoodlife.com/feature/who-is-katie-zacharia-husband-tyler-zacharia-5565722/\"},{\"name\":\"NPR News\",\"url\":\"https://www.npr.org/2026/10/16/nx-s1-6005302/katie-zacharia-is-out-as-press-secretary-white-house-says\"}],\"disagreements\":{\"en\":\"Figures differ across outlets (e.g. 9 vs 24 in headlines/snippets).\",\"zh-TW\":\"不同媒體的數字有所不同（例如，標題/摘要中的數字為 9 比 24）。\"},\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":25,\"outletReputation\":19,\"crossCorroboration\":17,\"recencyClarity\":25},\"tags\":[\"entertainment\",\"live-ingest\",\"bbc-world\",\"cnbc\",\"cnbc\"],\"glossary\":[{\"term\":{\"en\":\"Katie Zacharia\",\"zh-TW\":\"扎卡利亞\"},\"blurb\":{\"en\":\"Former White House press secretary who left the job after less than a week.\",\"zh-TW\":\"前白宮新聞秘書，上任不到一週就去職。\"}},{\"term\":{\"en\":\"White House\",\"zh-TW\":\"白宮\"},\"blurb\":{\"en\":\"US presidential office whose press secretary role Zacharia briefly held.\",\"zh-TW\":\"美國總統府；扎卡利亞曾短暫擔任其新聞秘書。\"}},{\"term\":{\"en\":\"Kristi Noem\",\"zh-TW\":\"諾姆\"},\"blurb\":{\"en\":\"US political figure linked to the AI rare-earths startup in Wired's report.\",\"zh-TW\":\"美國政治人物；Wired 報導中的 AI 稀土新創與她有關。\"}},{\"term\":{\"en\":\"Wired\",\"zh-TW\":\"Wired\"},\"blurb\":{\"en\":\"Tech magazine that reported Zacharia's listing as an adviser to the startup.\",\"zh-TW\":\"科技雜誌，報導扎卡利亞曾被列為該新創顧問。\"}},{\"term\":{\"en\":\"SpaceX\",\"zh-TW\":\"SpaceX\"},\"blurb\":{\"en\":\"Company whose Starlink internet service Ukrainian officials said was limited without notice.\",\"zh-TW\":\"其 Starlink 網路服務據烏克蘭官員抱怨遭無預警限制的公司。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://r85075515.github.io/Trust-digest/\"}],[\"$\",\"meta\",\"5\",{\"proper
