red exports rose 27.5% year-on-year in October, beating the 26.2% consensus forecast in a Reuters poll and accelerating from 24.0% growth in September. Shipments to the United States—Thailand's largest export market—jumped 42.9%, while exports to China rose 21.3%. At the same time, imports surged 53.2% year-on-year, widening Thailand's October trade deficit to a record US$12.34 billion, well above the roughly US$5.89 billion to US5.98 billion shortfall economists had anticipated.\n\nThe divergence reveals a structural dynamic in Southeast Asian trade: strong global electronics and AI-related assembly demand is lifting Thai export volumes, but heavy inbound shipments of components, raw materials, and stimulus-driven goods are simultaneously eroding the country's current account cushion.\n\nReuters (via The Edge Malaysia), Xinhua, and Investify (citing Business Recorder) reported identical headline numbers for the 27.5% export surge and the US$12.34 billion trade deficit. Minor differences appeared only in the exact Reuters consensus deficit figure cited (US$5.89 billion vs. US$5.98 billion).\n\nHow much of the 53.2% import spike reflects temporary front-loading ahead of potential U.S. tariff shifts versus sustained domestic capital investment will become clearer once detailed customs breakdowns are digested.\nTrust label: Multi-source agreement — Wire services and business outlets confirm the official Thai Commerce Ministry October trade figures."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-164-thailand-october-exports-record-trade-deficit\",\"category\":\"finance\",\"title\":{\"en\":\"Thailand's October Exports Surge 27.5% to 5-Year High, Yet Trade Deficit Hits Record $12.34B\",\"zh-TW\":\"泰國 10 月出口年增 27.5% 創逾五年新高，惟進口暴增致貿易逆差擴大至 123.4 億美元破紀錄\"},\"summary\":{\"en\":\"Thailand's Commerce Ministry reported on November 27 that October 2026 customs-cleared exports jumped 27.5% year-on-year, the fastest pace since June 2021, fueled by shipments to the U.S. and China. However, a 53.2% surge in imports pushed the monthly trade deficit to a record $12.34 billion, more than double market forecasts.\",\"zh-TW\":\"泰國商務部 11 月 27 日公布最新貿易數據，2026 年 10 月海關出口年增率達 27.5%，創 2021 年 6 月以來逾五年最快增速，對美國與中國出口分別大增 42.9% 與 21.3%。然而受進口暴增 53.2% 拖累，10 月貿易逆差反而擴大至 123.4 億美元創歷史新高，遠超市場預期，凸顯製造業中間財進口需求與外部順差之間的失衡壓力。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n泰國商務部於 2026 年 11 月 27 日公布海關貿易統計，10 月出口年增率攀升至 27.5%，優於路透調查市場預估的 26.2%，也較 9 月的 24.0% 進一步加速，寫下 2021 年 6 月以來最強表現。其中對最大出口市場美國出貨年增 42.9%，對中國出口成長 21.3%；但同期進口年增率高達 53.2%，導致泰國 10 月貿易逆差急劇擴大至 123.4 億美元創歷史新高，遠高於分析師預估的約 58.9 億至 59.8 億美元。\\n\\n「為什麼重要」\\n這份「出口創高、逆差破紀錄」的數據揭示東南亞製造業的結構性拉鋸：全球電子與 AI 硬體組裝需求雖強勁帶動泰國出口動能，但龐大的零組件、原物料進口以及內需刺激政策推升的採購，正同步侵蝕泰國的經常帳緩衝空間。\\n\\n「來源異同」\\n路透（The Edge Malaysia 轉載）、新華社與引述《商業紀錄報》（Business Recorder）的 Investify 均一致載明 10 月出口年增 27.5%、進口激增 53.2% 及逆差 123.4 億美元的官方數據；僅在引述路透調查的逆差預期值上出現 58.9 億美元與 59.8 億美元的細微尾數差異。\\n\\n「仍不確定」\\n高達 53.2% 的進口增幅中，究竟有多少比例屬於因應潛在美國關稅變動的提前備貨，又有多少轉化為長期製造業資本支出，仍有待後續細項數據進一步釐清。\\nTrust label: Multi-source agreement — 多家通訊社與商業媒體均核實泰國商務部公布的 10 月官方進出口數據。\"},\"glossary\":[{\"term\":{\"en\":\"Customs-Cleared Exports\",\"zh-TW\":\"海關通關出口\"},\"blurb\":{\"en\":\"Merchandise trade figures recorded when goods physically cross national borders through customs, distinct from balance-of-payments data.\",\"zh-TW\":\"貨物實際通過海關邊境時統計的實體商品貿易數據，與央行國際收支口徑有所區別。\"}},{\"term\":{\"en\":\"Trade Deficit\",\"zh-TW\":\"貿易逆差（入超）\"},\"blurb\":{\"en\":\"An economic measure of a negative balance of trade in which a country's imports exceed its exports during a given period.\",\"zh-TW\":\"一國在特定期間內商品進口總值大於出口總值的貿易差額狀態。\"}},{\"term\":{\"en\":\"Front-Loading\",\"zh-TW\":\"提前備貨（搶出口／搶進口）\"},\"blurb\":{\"en\":\"Accelerating shipments or purchases ahead of anticipated tariff hikes, regulatory changes, or supply bottlenecks.\",\"zh-TW\":\"企業為規避預期中的關稅調升、法規變動或供應鏈瓶頸，提前集中下單與出貨的商業行為。\"}}],\"sources\":[{\"name\":\"The Edge Malaysia (Reuters)\",\"url\":\"https://theedgemalaysia.com/node/827591\"},{\"name\":\"Xinhua Net\",\"url\":\"https://english.news.cn/asiapacific/20261127/89e9146d735c4552bbcdbf0a5ad3bd8b/c.html\"},{\"name\":\"Investify / Business Recorder\",\"url\":\"https://www.investify.pk/news/100000163059/thailand-s-october-exports-rise-27-5-on-year-highest-in-5-years\"}],\"imageUrl\":\"/covers/live/live-finance-164-thailand-october-exports-record-trade-deficit.jpg\",\"imageAlt\":{\"en\":\"Container port cranes representing Thailand's surging export and import volumes\",\"zh-TW\":\"象徵泰國進出口貿易量激增的貨櫃港口起重機\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":86,\"trustBreakdown\":{\"crossCorroboration\":23,\"outletReputation\":21,\"recencyClarity\":22,\"sourceDiversity\":20},\"publishedAt\":\"2026-11-27T18:06:35.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":4,\"D2\":4,\"D3\":4,\"D4\":4,\"D5\":4,\"total\":20},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-finance-164-thailand-october-exports-record-trade-deficit/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-finance-164-thailand-october-exports-record-trade-deficit/\"}],[\"$\",\"meta\"
