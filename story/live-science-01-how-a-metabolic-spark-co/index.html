nknowns, though the available summary names no specific researchers or new findings.\nWhy it matters\nHow life began is one of the deepest unanswered questions in science, and the metabolism-first idea reframes it: instead of genes or replication coming first, it puts energy and chemistry at the start. For readers, the explainer offers a clear way into a debate that usually stays locked in specialist journals, and it sets up the evidence the series will present next.\nSources agree / disagree\nOnly Quanta Magazine has published this instalment, and it is presented as an explainer rather than a report of new research. Trust label: Single source — only Quanta Magazine has published this explainer so far.\nStill uncertain\nThe metabolism-first theory remains a hypothesis, and the available summary cites no experiments or evidence for or against it. Which researchers back the theory, and how it stands against rival accounts of life's origins, is not covered here; follow the series for the evidence."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-science-01-how-a-metabolic-spark-co\",\"category\":\"science\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-science-01-how-a-metabolic-spark-co.jpg\",\"imageAlt\":{\"en\":\"Cover related to: How a metabolic spark could have jump-started life\",\"zh-TW\":\"相關封面圖：代謝火花如何點燃生命\"},\"publishedAt\":\"2026-11-11T15:10:30.000Z\",\"title\":{\"en\":\"Quanta Explainer: How a Metabolic Spark Could Have Jump-Started Life\",\"zh-TW\":\"量子雜誌（Quanta Magazine）生命起源週：代謝火花如何點燃生命\"},\"summary\":{\"en\":\"［未證實·單一來源］Quanta Magazine's Origins of Life Week explores the metabolism-first theory: for well over 4 billion years, cells' ability to gather, transform and harness chemical energy has powered life. This is a science explainer, not a new research finding, tackling one of science's biggest unknowns. Watch for the series' later instalments on the evidence.\",\"zh-TW\":\"［未證實·單一來源］《量子雜誌》（Quanta Magazine）生命起源週專題探討「代謝優先」理論：40 多億年前，細胞收集、轉化並利用化學能的能力，可能是生命誕生的起點。這是一篇科學解說，而非新研究成果，重點在於解釋生命起源的最大未知數之一。接下來看該系列本週後續報導如何展開代謝與生命起源的證據。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"超過 40 億年來，新陳代謝之火一直在為生命引擎提供動力——《量子雜誌》（Quanta Magazine）生命起源週專題探討，這股「代謝火花」可能就是生命的起點。\\n發生了什麼事\\n《量子雜誌》（Quanta Magazine）推出生命起源週專題解說，探討「代謝優先」理論：細胞從周圍環境收集、轉化並利用化學能的能力，是驅動生命複雜機制的核心力量。該系列預告本週將陸續刊出更多報導，探討科學最大的未知數之一；摘要未點名具體研究人員或新發現。\\n為什麼重要\\n生命如何誕生，是科學最深的未解問題之一，而「代謝優先」理論換了一個起點：不是基因或複製先行，而是能量與化學反應先行。對讀者來說，這篇解說把一場平常鎖在專業期刊裡的辯論講清楚了，也為系列後續的證據鋪路。\\n來源異同\\n目前僅《量子雜誌》一家刊載這篇專題，性質是解說而非新研究成果的報導。信任標籤：單一來源——目前僅《量子雜誌》一家刊載這篇解說。\\n仍不確定\\n「代謝優先」仍是假說，摘要未引述支持或反對的實驗證據。哪些研究人員支持這項理論、它與其他生命起源說法如何競爭，摘要皆未涵蓋；證據請追蹤系列後續報導。\"},\"sources\":[{\"name\":\"Quanta Magazine\",\"url\":\"https://www.quantamagazine.org/what-is-the-metabolism-first-theory-for-the-origin-of-life-20261111/\"}],\"disagreements\":null,\"trustScore\":47,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":10,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"science\",\"live-ingest\",\"quanta-magazine\"],\"glossary\":[{\"term\":{\"en\":\"Quanta Magazine\",\"zh-TW\":\"《量子雜誌》（Quanta Magazine）\"},\"blurb\":{\"en\":\"A science publication running the Origins of Life Week series.\",\"zh-TW\":\"科學刊物，推出生命起源週系列。\"}},{\"term\":{\"en\":\"metabolism-first theory\",\"zh-TW\":\"代謝優先理論\"},\"blurb\":{\"en\":\"The idea that metabolism, not genes, came first in life's origins.\",\"zh-TW\":\"主張代謝而非基因先行於生命起源的理論。\"}},{\"term\":{\"en\":\"origin of life\",\"zh-TW\":\"生命起源\"},\"blurb\":{\"en\":\"The question of how life first arose on Earth.\",\"zh-TW\":\"生命如何在地球上首次出現的問題。\"}},{\"term\":{\"en\":\"metabolism\",\"zh-TW\":\"新陳代謝\"},\"blurb\":{\"en\":\"The chemical processes by which cells gather and use energy.\",\"zh-TW\":\"細胞收集並利用能量的化學過程。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])<
