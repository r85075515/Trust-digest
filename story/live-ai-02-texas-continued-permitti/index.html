 Citizen, identified 35 permitting actions in the weeks after the moratorium.\nWhat happened\nThe FracTracker analysis found the permitting pipeline kept moving despite Abbott's order. The issue barely registered with candidates last year but now looms large in races that could decide control of Congress. In Sunbury, Ohio — a Republican-leaning Columbus suburb — a proposed large data center has upended local politics, and Inside Climate News frames the backlash as ''pitchfork populism' over data centers' rattling Ohio's US Senate race. Related items in the cluster: Wired reports the data center industry has a new PR plan aimed at kids ('your kid's field trip'), and Bloomberg reports ABB's third-quarter orders beat expectations as data center and utility demand for electrical components surged.\nWhy it matters\nThe gap between the governor's political signal and the regulators' actions is the story — a moratorium that didn't stop permits feeds the perception that the pause was theater. Meanwhile the backlash is migrating from local zoning fights into congressional politics.\nSources agree / disagree\nThe Inside Climate News items are mutually consistent; Wired and Bloomberg add adjacent color rather than conflicting facts. No numeric or name conflicts.\nStill uncertain\nWhat the 35 permitting actions specifically covered, and whether the moratorium had any binding mechanism, need the FracTracker report itself. Verify before quoting."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-ai-02-texas-continued-permitti\",\"category\":\"ai\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-ai-02-texas-continued-permitti.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Texas Continued Permitting Data Centers After Abbott’s Pause, Report Finds\",\"zh-TW\":\"相關封面圖：報告發現，在雅培暫停後，德州繼續允許資料中心建設\"},\"publishedAt\":\"2026-10-20T05:14:57.000Z\",\"title\":{\"en\":\"FracTracker: Texas Kept Permitting Data Centers After Abbott's Pause\",\"zh-TW\":\"FracTracker：德州州長下令暫停後，資料中心許可照發不誤\"},\"summary\":{\"en\":\"Texas regulators kept processing data center permits after Gov. Greg Abbott ordered a pause last month, a FracTracker analysis of public records found, identifying 35 permitting actions in the weeks after the moratorium. The finding lands as data centers become a flashpoint in races that could decide control of Congress.\",\"zh-TW\":\"石油天然氣監督組織 FracTracker 分析公開紀錄發現，德州州長格雷格·阿博特（Greg Abbott）上月下令暫停資料中心許可後，監管機關仍照常審核，數週內有 35 項許可行動。資料中心爭議已延燒至可能決定國會控制權的選戰。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"石油天然氣監督組織 FracTracker 週一發布公開紀錄分析：德州州長格雷格·阿博特（Greg Abbott）上月下令暫停資料中心許可後，監管機關根本沒停手——FracTracker 與 Public Citizen 在暫停令後的數週內確認了 35 項許可行動。\\n發生了什麼事\\nFracTracker 的分析發現，儘管有州長命令，許可審核照常進行。去年候選人幾乎沒人關注這個議題，如今它卻在一場可能決定國會控制權的選戰中舉足輕重。在俄亥俄州森伯里（Sunbury）——哥倫布市傾向共和黨的郊區——一座大型資料中心提案顛覆了當地政治；Inside Climate News 以「資料中心引爆的干草叉民粹主義」形容這波反彈如何撼動俄州聯邦參議員選戰。同批相關消息：Wired 報導資料中心產業推出針對兒童的新公關計畫（「你孩子的校外教學」）；彭博社報導 ABB 第三季訂單優於預期，受惠於資料中心與公用事業對電氣元件的需求激增。\\n為什麼重要\\n州長的政治訊號與監管機關的實際作為之間的落差才是重點——一紙沒擋下任何許可的暫停令，只會讓人覺得是演戲。與此同時，反彈正從地方土地使用攻防蔓延進國會政治。\\n來源異同\\nInside Climate News 的相關報導彼此一致；Wired 與彭博社提供相鄰背景而非衝突事實。無數字或人名衝突。\\n仍不確定\\n35 項許可行動的具體內容、暫停令有無實質約束力，都要看 FracTracker 報告原文；引用前請查證。\"},\"sources\":[{\"name\":\"Wired AI\",\"url\":\"https://www.wired.com/story/data-center-industry-is-trying-to-woo-kids/\"},{\"name\":\"Bloomberg News\",\"url\":\"https://www.bloomberg.com/news/articles/2026-10-20/abb-orders-surge-past-expectations-as-data-centers-fuel-40-jump\"},{\"name\":\"Inside Climate News\",\"url\":\"https://insideclimatenews.org/news/19102026/texas-continued-permitting-data-centers-after-moratorium/\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":21,\"outletReputation\":19,\"crossCorroboration\":22,\"recencyClarity\":25},\"tags\":[\"ai\",\"live-ingest\",\"wired-ai\",\"bloomberg-news\",\"inside-climate-news\"],\"glossary\":[{\"term\":{\"en\":\"FracTracker\",\"zh-TW\":\"FracTracker\"},\"blurb\":{\"en\
