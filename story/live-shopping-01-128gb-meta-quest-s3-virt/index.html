e lists $297.50, so the two figures in the same listing do not match. Free store pickup is available where offered, and shipping is otherwise free with a Target Circle Card, a Target Circle 360 membership, or on orders over $35.\nWhat happened\nSlickdeals lists a Target deal, found by community member SUCHaDEAL, for the 128GB Meta Quest S3 virtual reality headset plus a $50 Target gift card. The deal text gives the sale price as $294.49, but the headline gives $297.50, a gap of $3.01 within one listing. The community thumb score is +36. Shipping is free with a Target Circle Card or Target Circle 360 membership, or on orders over $35, and free store pickup is available where offered.\nWhy it matters\nThe gift card changes the real cost. A buyer paying about $295 also receives $50 in Target credit, so the effective price of the headset is far lower than the sticker figure, as long as the buyer will actually spend the credit at Target. That is the whole point of the bundle, and it is also why the $3.01 price gap matters less than confirming which figure appears at checkout.\nSources agree-disagree\nOnly Slickdeals carries this deal in the feed, so no second outlet confirms the price, the gift card, or the shipping terms. Within the single listing, the headline price of $297.50 and the deal-text price of $294.49 disagree, and the deal text is the more detailed figure. Trust label: Single source.\nStill uncertain\nThe feed does not say which of the two prices, $294.49 or $297.50, is charged at checkout, when the offer ends, or whether the $50 gift card has an expiry date or usage restrictions. No headset specifications beyond 128GB of storage appear in the source, so buyers should check the Target listing for the final price and the gift card terms before ordering."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-shopping-01-128gb-meta-quest-s3-virt\",\"category\":\"shopping\",\"adult\":false,\"isHeadline\":false,\"isPopular\":fal =rss\u0026utm_content=fp\u0026utm_medium=RSS2\"}],\"disagreements\":{\"en\":\"Headline price $297.50 vs deal-text price $294.49 for the same Meta Quest S3 bundle at Target (Slickdeals).\",\"zh-TW\":\"同一筆 Target 的 Meta Quest S3 套裝優惠，標題售價 297.50 美元，內文售價 294.49 美元，兩者不一（Slickdeals）。\"},\"trustScore\":47,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":10,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"shopping\",\"live-ingest\",\"slickdeals-frontpage\"],\"glossary\":[{\"term\":{\"en\":\"Meta\",\"zh-TW\":\"Meta\"},\"blurb\":{\"en\":\"US technology company that makes the Meta Quest S3 headset.\",\"zh-TW\":\"美國科技公司，Meta Quest S3 頭戴裝置的製造商。\"}},{\"term\":{\"en\":\"Meta Quest S3\",\"zh-TW\":\"Meta Quest S3\"},\"blurb\":{\"en\":\"Virtual reality headset sold in this Target bundle with 128GB of storage.\",\"zh-TW\":\"這次 Target 套裝販售的虛擬實境頭戴裝置，儲存容量 128GB。\"}},{\"term\":{\"en\":\"Target\",\"zh-TW\":\"Target\"},\"blurb\":{\"en\":\"US retailer offering the Meta Quest S3 bundle with a $50 gift card.\",\"zh-TW\":\"美國零售商，這檔優惠附 50 美元禮卡販售 Meta Quest S3 套裝。\"}},{\"term\":{\"en\":\"Slickdeals\",\"zh-TW\":\"Slickdeals\"},\"blurb\":{\"en\":\"Deal-sharing site that listed the Target Meta Quest S3 offer.\",\"zh-TW\":\"優惠分享網站，刊出這檔 Target 的 Meta Quest S3 優惠。\"}},{\"term\":{\"en\":\"Target Circle\",\"zh-TW\":\"Target Circle\"},\"blurb\":{\"en\":\"Target loyalty programme whose card or membership gives free shipping on this deal.\",\"zh-TW\":\"Target 會員計畫，持卡或會員可享這檔優惠免運。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"
