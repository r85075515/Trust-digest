hird reading by a roll-call vote of 316 in favor and 260 against, with no abstentions. The adopted legislation sets total federal expenditures at EUR 555.94 billion and allocates EUR 11.61 billion in support for Ukraine, while authorizing Berlin to enter into Ukraine-related procurement contracts with payment commitments extending through 2031.\n\nWhy it matters\nWhile European Union member states remain deadlocked in Brussels over a proposed bloc-wide loan package for Kyiv, bilateral legislative approval from the EU's largest economy secures predictable 2027 funding that covers nearly half of Ukraine's projected financing gap and enables defense contractors to lock in multi-year production schedules.\n\nSource differences\nThe official German Bundestag report (\"Bundestag beschließt Ausgaben von 555,94 Milliarden Euro für 2027\") provides the exact statutory figures from the third reading: total federal spending of EUR 555.94 billion, EUR 11.61 billion earmarked for Ukraine, and the 316–260 roll-call vote result. The Kyiv Independent (\"Germany votes through nearly 12 billion euros in Ukraine support for 2027\") frames the rounded EUR 11.6 billion figure in U.S. dollar terms (USD 12.7 billion) and notes its share of Kyiv's 2027 budget shortfall. Euromaidan Press (\"Germany locks in €11.6 billion for Ukraine's defense next year\") details the multi-year contract commitment horizon through 2031 and situates the budget alongside Germany's broader post-Cold War defense spending expansion.\n\nStill uncertain\nThe exact breakdown of the EUR 11.61 billion Ukraine allocation between direct military hardware, air-defense deliveries, and civilian fiscal support, as well as whether EU leaders will reach consensus on joint European financing in December 2026, remains unconfirmed.\n\nTrust label: Official confirmation — Verified against the official German Bundestag third-reading record and corroborated by The Kyiv Independent and Euromaidan Press."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-411-germany-2027-ukraine-budget\",\"category\":\"international\",\"title\":{\"en\":\"German Bundestag Approves EUR 555.94 Billion 2027 Budget Including EUR 11.61 Billion for Ukraine\",\"zh-TW\":\"德國聯邦議院三讀通過 5,559.4 億歐元 2027 年預算法，含 116.1 億歐元援烏經費\"},\"summary\":{\"en\":\"Germany's Bundestag passed the 2027 Budget Act on November 27, 2026, by a 316–260 roll-call vote, setting total federal spending at EUR 555.94 billion and allocating EUR 11.61 billion for Ukraine alongside multi-year procurement commitments through 2031.\",\"zh-TW\":\"德國聯邦議院（Bundestag）於 2026 年 11 月 27 日以記名表決 316 票贊成、260 票反對三讀通過《2027 年預算法》（Haushaltsgesetz 2027），核定聯邦總支出 5,559.4 億歐元，其中編列 116.1 億歐元援烏經費並授權簽署付款期程可延至 2031 年的跨年度合約，為烏克蘭 2027 年財政與防務提供確定性。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n2026 年 11 月 27 日，德國聯邦議院（Bundestag）在三讀程序以記名表決 316 票贊成、260 票反對、0 票棄權，正式通過《2027 年預算法》（Haushaltsgesetz 2027）。該法案核定聯邦政府 2027 年總支出為 5,559.4 億歐元，其中編列 116.1 億歐元用於支援烏克蘭，並授權德國政府簽署付款期程可延至 2031 年的跨年度援烏採購合約。\\n\\n「為什麼重要」\\n在歐盟成員國就援烏聯合貸款案仍在布魯塞爾僵持之際，歐盟最大經濟體率先透過國內立法完成三讀，為基輔鎖定可預期的 2027 年度財源，得以填補烏克蘭近半數預期財政缺口，也讓軍工供應鏈可依跨年度授權提前排產。\\n\\n「來源異同」\\n德國聯邦議院官網（Deutscher Bundestag）官方報導〈Bundestag beschließt Ausgaben von 555,94 Milliarden Euro für 2027〉完整載明三讀法定精確數字，包括 5,559.4 億歐元聯邦總支出、116.1 億歐元援烏經費及 316 票對 260 票記名表決結果；基輔獨立報（The Kyiv Independent）〈Germany votes through nearly 12 billion euros in Ukraine support for 2027〉以約 116 億歐元（折合 127 億美元）呈現援烏規模，並指出其可支應烏克蘭 2027 年近半數預算缺口；歐洲廣場新聞（Euromaidan Press）〈Germany locks in €11.6 billion for Ukraine's defense next year〉則重點解析合約付款期程可延至 2031 年的授權條款及德國整體國防開支背景。\\n\\n「仍不確定」\\n這筆 116.1 億歐元援烏經費在武器裝備採購、防空系統與民事財政援助之間的細部配置比例，以及歐盟各國領袖能否在 2026 年 12 月就整體援烏方案達成共識，目前仍待後續公布。\\n\\nTrust label: Official confirmation — 依據德國聯邦議院官網三讀官方報導核實，並與 The Kyiv Independent 及 Euromaidan Press 報導一致。\"},\"glossary\":[{\"term\":{\"en\":\"Haushaltsgesetz 2027 (2027 Budget Act)\",\"zh-TW\":\"《2027 年預算法》（Haushaltsgesetz 2027）\"},\"blurb\":{\"en\":\"The federal statute enacted by the German Bundestag establishing authorized government revenues, expenditures, and borrowing limits for fiscal year 2027.\",\"zh-TW\":\"德國聯邦議院審議通過的聯邦法律，規範 2027 會計年度聯邦政府各項歲入、歲出規模與舉債授權。\"}},{\"term\":{\"en\":\"Bundestag\",\"zh-TW\":\"德國聯邦議院（Bundestag）\"},\"blurb\":{\"en\":\"The directly elected lower house of Germany's federal parliament holding primary legislative and budgetary authority.\",\"zh-TW\":\"德國聯邦國會由選民直選產生的下議院，掌握聯邦立法與國家預算最終審議權。\"}},{\"term\":{\"en\":\"Commitment Authorization (Verpflichtungsermächtigung)\",\"zh-TW\":\"跨年度付款授權\"},\"blurb\":{\"en\":\"German budgetary authorization permitting ministries to enter into binding multi-year contracts now with disbursements scheduled across future fiscal years.\",\"zh-TW\":\"德國預算法制中允許行政部門在當年度先簽訂多年期合約、並於未來數個會計年度分期編列預算付款的授權機制。\"}}],\"sources\":[{\"name\":\"The Kyiv Independent\",\"url\":\"https://kyivindependent.com/germany-votes-through-nearly-12-billion-euros-in-ukraine-support-for-2027/\"},{\"name\":\"Euromaidan Press\",\"url\":\"https://euromaidanpress.com/2026/11/27/germany-locks-in-e11-6-billion-for-ukraines-defense-next-year-parliament-also-lets-berlin-sign-deals-now-and-pay-through-2031/\"},{\"name\":\"Deutscher Bundestag\",\"url\":\"https://www.bundestag.de/dokumente/textarchiv/2026/kw48-de-haushaltsgesetz-2027-dritte-lesung-1232350\"}],\"imageUrl\":\"/covers/live/live-international-411-germany-2027-ukraine-budget.jpg\",\"imageAlt\":{\"en\":\"German Bundestag Approves EUR 555.94 Billion 2027 Budget Including EUR 11.61 Billion for Ukraine\",\"zh-TW\":\"德國聯邦議院三讀通過 5,559.4 億歐元 2027 年預算法，含 116.1 億歐元援烏經費\"},\"isHeadline\":true,\"isPopular\":true,\"trustScore\":92,\"trustBreakdown\":{\"crossCorroboration\":23,\"outletReputation\":23,\"recencyClarity\":24,\"sourceDiversity\":22},\"publishedAt\":\"2026-11-28T09:25:38.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":24,\"D2\":23,\"D3\":24,\"D4\":22,\"D5\":23,\"total\":23},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"
