ons, having passed Pluto's orbit, measured a proxy for the amount of hydrogen around it. In the interstellar medium, the region between stars in our galaxy, the spacecraft found a hydrogen signal that the new map uses to challenge a tranquil picture of the galaxy. The feed snippet breaks off mid-figure at \"around 130,\" giving no unit or completed value, so this card does not state that figure as a finding.\nWhy it matters\nThe judgment is revisionary: a map built from a distant spacecraft's hydrogen measurements replaces emptiness with structure. If the space between stars is foggy rather than void, models of the galaxy's environment must account for material long treated as negligible. The finding's weight rests on one spacecraft's proxy measurement, which is why the truncated figure matters: the map's claim outruns the snippet's evidence.\nSources agree / disagree\nQuanta Magazine is the only outlet in the bundle, so the map and the New Horizons measurement have no corroboration here. No conflict is flagged. Trust label: Single source — one outlet reports the New Horizons findings, with no corroboration in the bundle.\nStill uncertain\nThe snippet cuts off before completing the hydrogen figure, and it gives no map method, peer-review status, research team, or comparison with earlier measurements. The \"around 130\" fragment cannot be quoted as a result. Verify the full Quanta Magazine article before citing any number or conclusion."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-science-02-a-new-map-of-empty-space\",\"category\":\"science\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-science-02-a-new-map-of-empty-space.jpg\",\"imageAlt\":{\"en\":\"Cover related to: A New Map of ‘Empty’ Space Challenges a Tranquil Picture of the Galaxy\",\"zh-TW\":\"相關封面圖：一張新的「空」太空地圖挑戰了銀河系的寧靜圖景\"},\"publishedAt\":\"2026-10-30T14:52:05.000Z\",\"title\":{\"en\":\"NASA New Horizons Map Challenges Tranquil Picture of the Galaxy\",\"zh-TW\":\"美國國家航空暨太空總署（NASA）新視野號（New Horizons）新地圖，挑戰銀河系寧靜想像\"},\"summary\":{\"en\":\"[Unconfirmed · Single source] NASA's New Horizons spacecraft, past Pluto's orbit, measured a proxy for hydrogen around it and mapped the seemingly empty space between stars, Quanta Magazine reports. The interstellar medium holds a barely perceptible fog of hydrogen and other neutral atoms, challenging a tranquil picture of the galaxy.\",\"zh-TW\":\"［未證實·單一來源］美國國家航空暨太空總署（NASA）新視野號（New Horizons）飛越冥王星軌道後，測量周圍氫含量的替代指標，繪製恆星之間看似空無的空間地圖。星際介質藏著幾乎難以察覺的氫與其他中性原子霧，挑戰銀河系寧靜的想像。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"看似空無的太空藏著一層幾乎難以察覺的氫與其他中性原子霧，美國國家航空暨太空總署（NASA）新視野號（New Horizons）的測量結果如此顯示，Quanta Magazine 報導。\\n發生了什麼事\\n2020 年，飛越冥王星軌道的新視野號（New Horizons）測量了周圍氫含量的替代指標。在銀河系恆星之間的區域，也就是星際介質（ISM），太空船偵測到的氫訊號被用來繪製新地圖，挑戰銀河系寧靜的圖景。摘要在「約 130」處中斷，沒有單位也沒有完整數值，本卡因此不把這個數字當成研究發現來陳述。\\n為什麼重要\\n判斷具有修正意味：一張以遙遠太空船氫測量為基礎的地圖，用結構取代了空無。如果恆星之間的空間是霧狀而非真空，銀河系環境模型就必須納入長期被視為微不足道的物質。發現的分量繫於單一太空船的替代指標測量，截斷的數字因此格外關鍵：地圖的主張超出了摘要證據所能支撐的範圍。\\n來源異同\\n本批素材只有 Quanta Magazine 一家媒體，地圖與新視野號（New Horizons）測量結果沒有其他佐證，也沒有標示衝突。信任標籤：僅1源——一家媒體報導新視野號（New Horizons）的發現，本批素材中沒有佐證。\\n仍不確定\\n摘要在氫含量數字完成前就中斷，也沒有地圖方法、同儕審查狀態、研究團隊或與先前測量的比較。「約 130」這個片段不能當成結果引用。引用任何數字或結論之前，請查閱 Quanta Magazine 完整文章。\"},\"sources\":[{\"name\":\"Quanta Magazine\",\"url\":\"https://www.quantamagazine.org/a-new-map-of-empty-space-challenges-a-tranquil-picture-of-the-galaxy-20261030/\"}],\"disagreements\":null,\"trustScore\":47,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":10,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"science\",\"live-ingest\",\"quanta-magazine\"],\"glossary\":[{\"blurb\":{\"en\":\"US space agency that operates the New Horizons spacecraft.\",\"zh-TW\":\"操作新視野號（New Horizons）太空船的美國太空機構。\"},\"term\":{\"en\":\"NASA\",\"zh-TW\":\"美國國家航空暨太空總署\"}},{\"blurb\":{\"en\":\"Spacecraft that measured hydrogen beyond Pluto's orbit.\",\"zh-TW\":\"在冥王星軌道之外測量氫含量的太空船。\"},\"term\":{\"en\":\"New Horizons\",\"zh-TW\":\"
