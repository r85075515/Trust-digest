on. The New York Times headline describes the toll more broadly as dozens killed at a humanitarian hub, which is consistent with the figure of at least 26 rather than a competing count.\n\nWhy it matters\nStriking a building used to distribute aid crosses a line that even war usually observes in public debate. If the target was a functioning aid centre, the attack will be cited as evidence about how Russia treats civilian relief, and it will shape how donors and neighbouring states judge the safety of humanitarian corridors.\n\nSources agree-disagree\nBBC and Al Jazeera agree on at least 26 killed at the aid centre, and the New York Times account is consistent with that scale. The raw feed's note about differing figures does not describe a real casualty conflict: the number 10 in the bundled material is a 10% data-centre capacity figure from a separate Tom's Hardware item about Russian data centres, not a death toll. That item is unrelated to the strike and is mentioned here only to avoid mistaking it for corroboration.\n\nStill uncertain\nThe material provided gives no confirmed final casualty count, no named village beyond the Zaporizhzhia region, and no Russian response to the specific strike. Those gaps leave the full toll and the stated reason for the attack unconfirmed.\n\nTrust label: Multi-source agreement"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-03-russian-strike-on-ukrain\",\"category\":\"international\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-international-03-russian-strike-on-ukrain.png\",\"imageAlt\":{\"en\":\"Cover related to: Russian Strike on Ukraine Humanitarian Hub Kills Dozens\",\"zh-TW\":\"相關封面圖：俄羅斯對烏克蘭人道主義中心的襲擊造成數十人死亡\"},\"publishedAt\":\"2026-11-03T01:56:27.000Z\",\"title\":{\"en\":\"Russian strike on Ukraine aid centre kills at least 26, BBC and Al Jazeera report\",\"zh-TW\":\"俄羅斯空襲烏克蘭援助中心至少 26 死，BBC 與半島電視台報導\"},\"summary\":{\"en\":\"At least 26 people were killed in Russian strikes on a school being used as a humanitarian aid centre in Ukraine, BBC and Al Jazeera report. Officials say at least nine 3,000kg aerial bombs hit a southern village in the Zaporizhzhia region. Watch for a confirmed casualty count and any response from Moscow.\",\"zh-TW\":\"BBC 與半島電視台（Al Jazeera）報導，俄羅斯空襲烏克蘭一所用作人道援助中心的學校，至少 26 人死亡。官員表示，至少九枚 3,000 公斤空投炸彈擊中札波羅熱地區南部一座村莊。接下來看確認後的傷亡數字，以及莫斯科方面是否回應。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"發生了什麼事\\nBBC 與半島電視台（Al Jazeera）報導，俄羅斯空襲烏克蘭一所用作人道援助中心的學校，至少 26 人死亡，烏克蘭總統稱這起攻擊極其可怕。官員表示，至少九枚 3,000 公斤空投炸彈擊中札波羅熱（Zaporizhzhia）地區南部一座村莊。這起攻擊發生在鄰近赫爾松（Kherson）短暫人道休戰結束一天後。《紐約時報》（New York Times）標題以「數十人」概括傷亡，與至少 26 人的數字一致，而非相互競爭的數字。\\n\\n為什麼重要\\n空襲一棟正在發放援助的建築，踩過了戰爭公開辯論中通常仍被承認的界線。如果目標確實是一座運作中的援助中心，這起攻擊將成為外界評斷俄羅斯如何對待平民救援的證據，也會影響捐助方與鄰國如何評估人道走廊的安全。\\n\\n來源異同\\nBBC 與半島電視台對援助中心至少 26 人死亡的說法一致，《紐約時報》的規模描述也相符。原始素材提到數字差異，但並非真實的傷亡衝突：綑綁材料中的 10 是另一則 Tom's Hardware 關於俄羅斯資料中心的 10% 容量數字，不是死亡人數。那則內容與空襲無關，此處提及只是避免把它誤當成佐證。\\n\\n仍不確定\\n提供的材料沒有最終確認的傷亡數字、沒有超出札波羅熱地區的具名村莊，也沒有俄方針對這起攻擊的回應。缺少這些資訊，完整傷亡與攻擊理由都還未經證實。\"},\"sources\":[{\"name\":\"BBC World\",\"url\":\"https://www.bbc.co.uk/news/articles/cjy56dndlyz0o?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"NYT World\",\"url\":\"https://www.nytimes.com/2026/11/02/world/europe/russian-strike-zaporizhzhia-ukraine.html\"},{\"name\":\"Tom's Hardware\",\"url\":\"https://www.tomshardware.com/tech-industry/data-centers/putin-demands-russian-data-centers-supply-capacity-to-the-state-in-wake-of-ukraine-drone-attacks-10-percent-capacity-must-be-available-for-state-it-infrastructure-with-24-hours-notice\"},{\"name\":\"Al Jazeera\",\"url\":\"https://www.aljazeera.com/video/newsfeed/2026/11/3/multiple-russian-strikes-kill-at-least-26-at-ukraine-aid-centre?traffic_source=rss\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":25,\"outletReputation\":19,\"crossCorroboration\":17,\"recencyClarity\":25},\"tags\":[\"international\",\"live-ingest\",\"bbc-world\",\"nyt-world\",\"tom's-hardware\"],\"glossary\":[{\"term\":{\"en\":\"Zaporizhzhia\",\"zh-TW\":\"札波羅熱\"},\"blurb\":{\"en\":\"Region in southern Ukraine where the strike hit.\",\"zh-TW\":\"空襲發生的烏克蘭南部地區。\"}},{\"term\":{\"en\":\"Kherson\",\"zh-TW\":\"赫爾松\"},\"blurb\":{\"en\":\"Neighbouring region where a truce had ended.\",\"zh-TW\":\"短暫休戰剛結束的鄰近地區。\"}},{\"term\":{\"en\":\"Humanitarian aid centre\",\"zh-TW\":\"人道援助中心\"},\"blurb\":{\"en\":\"Site distributing relief to civilians.\",\"zh-TW\":\"向平民發放救援物資的地點。\"}},{\"term\":{\"en\":\"BBC\",\"zh-TW\":\"英國廣播公司\"},\"blurb\":{\"en\":\"British broadcaster reporting the strike.\",\"zh-TW\":\"報導這起空襲的英國廣播機構。\"}},{\"term\":{\"en\":\"Al Jazeera\",\"zh-TW\":\"半島電視台\"},\"blurb\":{\"en\":\"News outlet reporting at least 26 killed.\",\"zh-TW\":\"報導至少 26 人死亡的新聞媒體。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-international-03-russian-strike-on-ukrain/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-international-03-russian-strike-on-ukrain/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title
