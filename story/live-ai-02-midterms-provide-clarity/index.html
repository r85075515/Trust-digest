specially in Texas grid operator ERCOT, he said, driven by speculation from developers.\nWhat happened\nBurke's argument, as reported by Utility Dive, is that developers filed speculative interconnection requests that inflated the queue, making the data-center boom look larger than the real demand for power. The midterms, in his view, clarified the political and permitting picture enough to separate serious projects from paper ones. The same cluster also carried a separate story: Novartis CEO Vas Narasimhan, who sits on Anthropic's board, saying AI will shave four years off drug development but will not cure all disease within a decade.\nWhy it matters\nThe judgment is about power, not politics: if the queue was padded with speculative filings, Texas does not need as much new generation as feared, and utilities can plan against real load instead of paper load. For readers watching electricity prices and grid investment, Burke's claim — if the updated numbers back it — reframes the data-center boom from a stampede into a queue with a filter.\nSources agree / disagree\nOnly Utility Dive is reporting Burke's remarks in the snippets; the Novartis item comes from a different outlet and is a separate story. Trust label: Single source — one outlet, unconfirmed by others.\nStill uncertain\nThe snippets do not give the size of the overstated queue, the updated figures, or which midterm outcomes Burke credits with the new clarity. Those details require the full reporting on the linked publisher pages."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-ai-02-midterms-provide-clarity\",\"category\":\"ai\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-ai-02-midterms-provide-clarity.png\",\"imageAlt\":{\"en\":\"Cover related to: Midterms provide clarity on data center development: Vistra CEO\",\"zh-TW\":\"相關封面圖：瑞致達執行長：中期選舉明確了資料中心的發展\"},\"publishedAt\":\"2026-11-24T18:01:55.000Z\",\"title\":{\"en\":\"Midterms Bring Clarity on Data Center Build-Out, Vistra CEO Says\",\"zh-TW\":\"瑞致達（Vistra）執行長：期中選舉讓資料中心發展明朗化\"},\"summary\":{\"en\":\"[Unconfirmed · single source] The midterm elections have brought clarity on data center development, Vistra CEO James Burke said, arguing that load interconnection queues were overstated across the country — especially in ERCOT — driven by speculation from developers. The takeaway: the data-center pipeline is smaller than the headlines suggested.\",\"zh-TW\":\"［未證實·單一來源］瑞致達（Vistra）執行長詹姆斯·柏克（James Burke）表示，期中選舉讓資料中心的發展明朗化；他認為全美併網排隊容量被高估了——尤其在德州電網 ERCOT——主因是開發商的投機性申請。重點是資料中心實際排隊量比新聞標題暗示的小，這會改變德州真正需要新增多少電力；後續看排隊數字的更新。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"瑞致達（Vistra）執行長詹姆斯·柏克（James Burke）表示，期中選舉讓資料中心的發展明朗化；他認為全美併網排隊容量被高估了，尤其在德州電網 ERCOT，主因是開發商的投機性申請。\\n發生了什麼事\\n柏克的說法（據 Utility Dive 報導）是，開發商提交了投機性的併網申請，灌水了排隊數字，讓資料中心熱潮看起來比實際電力需求更大；期中選舉則讓政治與許可前景明朗，足以分辨認真的項目與紙上項目。同批另有一則不同新聞：諾華（Novartis）執行長瓦斯·納拉辛漢（Vas Narasimhan，身兼 Anthropic 董事）表示，AI 可把藥物開發縮短四年，但十年內治癒不了所有疾病。\\n為什麼重要\\n結論關乎電力，不是政治：如果排隊數字是投機申請灌水的，德州就不需要如擔憂的那麼多新增發電，電力公司可以按真實負載、而非紙上負載來規劃。對關注電價與電網投資的讀者來說，若更新數字支持柏克的說法，資料中心熱潮就從一窩蜂變成一條有篩選的排隊隊伍。\\n來源異同\\n片段中只有 Utility Dive 報導柏克的發言；諾華那則來自另一家媒體，是不同新聞。信任標籤：僅1源——單一來源、未經他家證實。\\n仍不確定\\n片段未說明被高估的排隊容量有多大、更新後的數字是多少，也未說明柏克指的是哪些期中選舉結果帶來明朗化，須看完整報導才能確認。\"},\"sources\":[{\"name\":\"The Decoder\",\"url\":\"https://the-decoder.com/novartis-ceo-says-ai-will-shave-four-years-off-drug-development-not-cure-all-disease/\"},{\"name\":\"Utility Dive\",\"url\":\"https://www.utilitydive.com/news/vistra-midterms-data-center-ercot-pjm/875626/\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":13,\"outletReputation\":10,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"ai\",\"live-ingest\",\"the-decoder\",\"utility-dive\"],\"glossary\":[{\"term\":{\"en\":\"Vistra\",\"zh-TW\":\"瑞致達\"},\"blurb\":{\"en\":\"U.S. power company whose CEO commented on data centers.\",\"zh-TW\":\"執行長就資料中心發言的美國電力公司。\"}},{\"term\":{\"en\":\"James Burke\",\"zh
