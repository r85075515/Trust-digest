ose acquisition company Black Spade Acquisition III Co (NYSE: BIII) published and began mailing its Rule 424(b)(3) definitive proxy statement and prospectus (Registration No. 333-299478) to shareholders. Signed by Executive Chairman and Co-CEO Chi Wai Dennis Tam, the filing sets an extraordinary general meeting for December 18, 2026, to vote on the proposed business combination with Astrum Space Inc and Astrum Networks Pte. Ltd., alongside a special resolution to rename the surviving company \"Astrum Space Company\". Based on the 10.00 USD per share IPO reference price, the prospectus outlines a pro forma post-de-SPAC equity valuation ranging from 1,057.5 million USD under a 100% public share redemption scenario to 1,230.0 million USD under a no-redemption scenario.\n\nWhy it matters\nFiling and mailing the definitive Rule 424(b)(3) prospectus clears the SEC registration disclosure hurdle and initiates the formal shareholder voting window, moving the billion-dollar space-sector de-SPAC transaction into its final closing stretch.\n\nSource differences\nBlack Spade Acquisition III Co's investor portal published the Rule 424(b)(3) filing under \"November 27, 2026 - 424B3: Prospectus [Rule 424(b)(3)]\", containing the full shareholder letter dated November 27, 2026, and the redemption valuation tables. The corresponding SEC EDGAR filing is titled \"black spade acquisition iii co (a cayman islands exempted company)\", recording the December 18, 2026 shareholder meeting notice and merger proposals.\n\nStill uncertain\nThe business combination remains unclosed and subject to shareholder approval at the December 18, 2026 meeting as well as customary closing conditions; final cash proceeds and post-closing share count will depend on the actual level of public shareholder redemptions.\n\nTrust label: Official confirmation — Confirmed directly via Black Spade Acquisition III Co's Rule 424(b)(3) prospectus and SEC EDGAR filing."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-435-black-spade-iii-astrum-space-de-spac-prospectus\",\"category\":\"finance\",\"title\":{\"en\":\"Black Spade Acquisition III Mails Final Prospectus for $1.23B Astrum Space Merger Vote\",\"zh-TW\":\"黑桃亞洲三號寄發最終合併說明書 推進 12.3 億美元 Astrum Space 上市案\"},\"summary\":{\"en\":\"Black Spade Acquisition III Co (NYSE: BIII) filed its Rule 424(b)(3) final prospectus on November 27, 2026, mailing proxy materials to shareholders ahead of a December 18 extraordinary general meeting to vote on its business combination with Astrum Space at an implied post-merger valuation of up to 1.23 billion USD.\",\"zh-TW\":\"特殊目的收購公司黑桃亞洲三號（Black Spade Acquisition III Co，NYSE: BIII）於 2026 年 11 月 27 日提交 Rule 424(b)(3) 最終公開說明書並向股東寄發委託書，訂於 12 月 18 日召開股東特別大會表決與太空企業 Astrum Space 之業務合併案，合并後隱含總估值最高達 12.3 億美元。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n開曼群島註冊特殊目的收購公司黑桃亞洲三號（Black Spade Acquisition III Co，NYSE: BIII）於 2026 年 11 月 27 日正式發布並開始向股東寄發依據美國《證券法》Rule 424(b)(3) 提交之最終委託書暨公開說明書（註冊編號 333-299478）。該文件由執行主席兼聯席執行長譚志偉（Chi Wai Dennis Tam）簽署，公告將於 2026 年 12 月 18 日召開股東特別大會，表決與 Astrum Space Inc 及 Astrum Networks Pte. Ltd. 的業務合併案，並提請特別決議將存續公司更名為「Astrum Space Company」。依每股 10.00 美元 IPO 基準價計算，說明書揭露合併完成（de-SPAC）後的備考總估值介於 10.575 億美元（假設公開股東 100% 贖回）至 12.30 億美元（假設零贖回）之間。\\n\\n「為什麼重要」\\n最終版 Rule 424(b)(3) 公開說明書生效並正式寄發，代表該交易已完成美國證管會（SEC）註冊揭露審查並進入股東正式投票倒數階段，使這起逾 10 億美元規模的太空產業 SPAC 合併案邁向交割最後關卡。\\n\\n「來源異同」\\n黑桃亞洲三號投資人關係網站刊出的文件標題為「November 27, 2026 - 424B3: Prospectus [Rule 424(b)(3)]」，完整載明 2026 年 11 月 27 日致股東信及不同贖回情境下的股權估值試算表；美國證管會 EDGAR 資料庫對應申報檔案標題為「black spade acquisition iii co (a cayman islands exempted company)」，列明 2026 年 12 月 18 日股東特別大會通知及公司更名等各項表決議案。\\n\\n「仍不確定」\\n本項業務合併案尚未完成交割，仍須待 2026 年 12 月 18 日股東特別大會表決通過並滿足慣常交割先決條件；最終留存現金規模與合併後流通在外股數，亦將視公開市場股東實際行使贖回權的比例而定。\\n\\nTrust label: Official confirmation — 已由黑桃亞洲三號官方發布之 Rule 424(b)(3) 公開說明書與美國證管會 EDGAR 申報文件直接核實。\"},\"glossary\":[{\"term\":{\"en\":\"De-SPAC\",\"zh-TW\":\"SPAC 業務合併交割\"},\"blurb\":{\"en\":\"The merger transaction through which a publicly traded special purpose acquisition company combines with a private operating business to take it public.\",\"zh-TW\":\"已掛牌的特殊目的收購公司（SPAC）與未上市營運企業完成併購，使後者正式成為上市公司的交易程序。\"}},{\"term\":{\"en\":\"Rule 424(b)(3) prospectus\",\"zh-TW\":\"Rule 424(b)(3) 最終公開說明書\"},\"blurb\":{\"en\":\"A definitive prospectus filed with the U.S. SEC under Securities Act Rule 424(b)(3) containing substantive transaction terms and shareholder voting materials.\",\"zh-TW\":\"依據美國 1933 年《證券法》第 424(b)(3) 條向證管會提交的最終公開說明書，載明交易核心條款並寄發予股東作為投票依據。\"}},{\"term\":{\"en\":\"Redemption scenario\",\"zh-TW\":\"股東贖回情境\"},\"blurb\":{\"en\":\"Pro forma valuation modeling showing how post-merger share count and cash change depending on how many SPAC shareholders cash out before closing.\",\"zh-TW\":\"評估 SPAC 合併案交割前，若不同比例的公開股東選擇贖回現金而非轉換為新公司股票，對總估值與股本結構的影響試算。\"}}],\"sources\":[{\"name\":\"Black Spade Acquisition III Co\",\"url\":\"https://www.bsaiii.com/sec-filings/content/0001213900-26-124480/ea0303223-09.htm\"},{\"name\":\"U.S. SEC EDGAR\",\"url\":\"https://www.sec.gov/Archives/edgar/data/2087087/000121390026124480/ea0303223-09.htm\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"Black Spade Acquisition III Mails Final Prospectus for $1.23B Astrum Space Merger Vote\",\"zh-TW\":\"黑桃亞洲三號寄發最終合併說明書 推進 12.3 億美元 Astrum Space 上市案\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":85,\"trustBreakdown\":{\"crossCorroboration\":22,\"outletReputation\":24,\"recencyClarity\":22,\"sourceDiversity\":17},\"publishedAt\":\"2026-11-28T10:22:56.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":23,\"D2\":23,\"D3\":22,\"D4\":21,\"D5\":19,\"total\":22},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source
