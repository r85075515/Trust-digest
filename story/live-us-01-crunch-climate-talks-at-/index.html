s driven by human-caused warming, 91 leaders were expected in Turkey, but many were absent. The Guardian also carried analysis of the challenge facing Australian climate minister Chris Bowen at the talks, while Bloomberg's item paired the climate talks with other news, including a US soldier arrested in the UK.\n\nWhy it matters\nCOP31 is the annual test of whether governments will turn climate pledges into action, and the absence of leaders from major polluting nations weakens the signal before negotiations begin. The central question is whether the final text names fossil fuels as the cause of the climate emergency; a summit that dodges that wording would show how far the talks still are from confronting the main driver of warming.\n\nSources agree–disagree\nBloomberg and The Guardian agree that the leaders' summit is under way in Antalya and that attendance is patchy, and both treat fossil fuels as the central fault line. The raw feed flagged a numeric mismatch, but the figures compared came from different items in the cluster, such as a newsletter number and the 91-leader count, not from conflicting reports of the same fact.\n\nStill uncertain\nNo outcomes have been agreed yet, and the feed summaries give no detail of what leaders actually said or what draft text is on the table. The Guardian notes that Australia had earlier bid to host a major climate summit in Adelaide, but that is background rather than news from Antalya. Bloomberg's headline also mentions a US soldier arrested in the UK, yet the feed summary provides no details of that story.\n\nTrust label: Two-source agreement — Bloomberg and The Guardian cover the same summit, with details still developing."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-us-01-crunch-climate-talks-at-\",\"category\":\"us\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"publishedAt\":\"2026-11-11T07:57:06.000Z\",\"title\":{\"en\":\"COP31 Leaders' Summit Opens in Antalya as Major Polluters Stay Away\",\"zh-TW\":\"COP31 領袖峰會在安塔利亞登場，多個排碳大國領袖缺席\"},\"summary\":{\"en\":\"Day three of the COP31 climate summit opened in Antalya, Turkey, with 91 heads of government expected but leaders of Canada, Japan and several European states absent. Whether talks name fossil fuels as the cause of the crisis is the central test. Watch for the leaders' speeches and any draft text.\",\"zh-TW\":\"聯合國 COP31 氣候峰會第三天在土耳其安塔利亞登場，預計 91 位政府首腦出席，但加拿大、日本與多個歐洲國家領袖缺席。談判能否點名化石燃料是氣候危機的成因，是本次峰會的核心考驗，接下來看領袖發言與草案文本。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"聯合國 COP31 氣候峰會 11 月 11 日在土耳其安塔利亞進入領袖峰會日，預計 91 位政府首腦出席，但多個排碳大國領袖缺席。衛報（The Guardian）報導，加拿大、日本與多個歐洲國家領袖未到場；彭博（Bloomberg）則把這一天定調為談判的關鍵時刻。\\n\\n發生了什麼事\\n領袖峰會在安塔利亞登場，各國政府首腦依序就氣候危機發言。衛報即時報導指出，經歷又一年人為暖化導致的乾旱、洪水與野火後，91 位領袖預計齊聚土耳其，但多人缺席；衛報另刊出澳洲氣候部長鮑文（Chris Bowen）在峰會面臨的挑戰分析。彭博的快訊則把氣候談判與其他新聞並列，包括一名美軍士兵在英國被捕。\\n\\n為什麼重要\\nCOP31 是各國政府能否把氣候承諾化為行動的年度考驗，排碳大國領袖缺席，談判還沒開始訊號就已轉弱。核心問題是峰會最終文本是否點名化石燃料是氣候緊急狀態的成因；若迴避這個說法，等於顯示談判離直面暖化主因還很遠。\\n\\n來源異同\\n彭博與衛報一致認為領袖峰會正在安塔利亞進行、出席情況不整齊，且都把化石燃料視為主要分歧。原始摘要曾標示數字差異，但比對的是群組內不同稿件的數字，例如通訊編號與 91 位領袖的數字，並非同一事實的衝突報導。\\n\\n仍不確定\\n目前尚未達成任何成果，摘要也未說明領袖實際說了什麼、桌上擺了哪些草案文本。衛報提到澳洲先前曾爭取在阿德萊德主辦大型氣候峰會，那是背景而非安塔利亞現場消息；彭博標題另提美軍士兵在英國被捕，但摘要未提供該案任何細節。\"},\"sources\":[{\"name\":\"Bloomberg News\",\"url\":\"https://www.bloomberg.com/news/audio/2026-11-11/crunch-climate-talks-at-cop31-us-soldier-arrested-in-uk-more\"},{\"name\":\"The Guardian Climate Crisis\",\"url\":\"https://www.theguardian.com/environment/live/2026/nov/11/climate-crisis-talks-turkey-latest-news-updates\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":13,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"us\",\"live-ingest\",\"bloomberg-news\",\"the-guardian-climate-crisis\",\"the-guardian-climate-crisis\"],\"glossary\":[{\"term\":{\"en\":\"COP31\",\"zh-TW\":\"COP31\"},\"blurb\":{\"en\":\"The 31st UN climate conference, held in Turkey in 2026.\",\"zh-TW\":\"第 31 屆聯合國氣候大會，2026 年在土耳其舉行。\"}},{\"term\":{\"en\":\"Antalya\",\"zh-TW\":\"安塔利亞\"},\"blurb\":{\"en\":\"A city on Turkey's Mediterranean coast hosting the summit.\",\"zh-TW\":\"土耳其地中海沿岸城市，本屆峰會舉辦地。\"}},{\"term\":{\"en\":\"fossil fuels\",\"zh-TW\":\"化石燃料\"},\"blurb\":{\"en\":\"Coal, oil and gas, whose burning drives global warming.\",\"zh-TW\":\"煤、石油與天然氣，燃燒是全球暖化的主因。\"}},{\"term\":{\"en\":\"Chris Bowen\",\"zh-TW\":\"鮑文\"},\"blurb\":{\"en\":\"Australia's climate change minister.\",\"zh-TW\":\"澳洲氣候變遷部長。\"}},{\"term\":{\"en\":\"UN climate summit\",\"zh-TW\":\"聯合國氣候峰會\"},\"blurb\":{\"en\":\"The annual UN meeting where governments negotiate climate action.\",\"zh-TW\":\"各國政府每年在聯合國框架下談判氣候行動的會議。\"}},{\"term\":{\"en\":\"Bloomberg\",\"zh-TW\":\"彭博\"},\"blurb\":{\"en\":\"A global financial news and data provider.\",\"zh-TW\":\"全球財經新聞與數據供應商。\"}}],\"imageUrl\":\"/covers/live/live-us-01-crunch-climate-talks-at-.jpg\",\"imageAlt\":{\"en\":\"COP31 climate summit leaders' day in Antalya, Turkey\",\"zh-TW\":\"土耳其安塔利亞 COP31 氣候峰會領袖日\"}}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-us-01-crunch-climate-talks-at-/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live
