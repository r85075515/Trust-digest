roximately 400 employees in the United States into the company and establishes a dedicated U.S. operating subsidiary, MDA Space USA.\n\nWhy it matters\nIntegrating Blue Canyon Technologies expands MDA Space's domestic U.S. manufacturing footprint and small-satellite bus capabilities, positioning the combined entity to compete more directly for U.S. defense, intelligence, and commercial constellation contracts.\n\nSource differences\nMDA Space's official press release (\"MDA SPACE COMPLETES ACQUISITION OF BLUE CANYON\") and syndicated wire distribution on Fidelity (\"mda space completes acquisition of blue canyon technologies\") confirm the November 27 closing date and the addition of 400 BCT employees. SpaceQ's industry coverage (\"MDA Space closes Blue Canyon Technologies acquisition\") specifically highlights the creation of MDA Space USA following the transaction's completion.\n\nStill uncertain\nFinal purchase price adjustments, specific integration timelines for existing BCT satellite production lines, and upcoming U.S. government contract awards under the new MDA Space USA structure were not detailed in the closing announcements.\n\nTrust label: Official confirmation — Confirmed via MDA Space's November 27, 2026 corporate closing announcement and corroborated by aerospace trade outlet SpaceQ."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-tech-328-mda-blue-canyon-deal\",\"category\":\"tech\",\"title\":{\"en\":\"MDA Space Completes Acquisition of Small-Satellite Maker Blue Canyon Technologies\",\"zh-TW\":\"MDA Space 完成收購小型衛星製造商 Blue Canyon Technologies 成立美國子公司\"},\"summary\":{\"en\":\"Canadian space firm MDA Space closed its acquisition of Colorado-based small-satellite manufacturer Blue Canyon Technologies on November 27, 2026, adding 400 employees and forming MDA Space USA.\",\"zh-TW\":\"加拿大航太企業 MDA Space 於2026年11月27日正式完成對美國科羅拉多州小型衛星製造商 Blue Canyon Technologies（BCT）的收購案，納入約400名專業員工並整併成立「MDA Space USA」，強化其在北美防衛與商業衛星製造的布局。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n總部位於多倫多的加拿大航太公司 MDA Space 於2026年11月27日宣布，正式完成對美國科羅拉多州小型衛星製造商 Blue Canyon Technologies（BCT）的收購交易。此項併購為 MDA Space 增添約400名美國專業員工，並據此組建美國營運子公司「MDA Space USA」。\\n\\n「為什麼重要」\\n透過整合 Blue Canyon Technologies 在小型衛星平台與航太零組件的製造能量，MDA Space 得以建立完整的美國本土生產與工程基地，有助於爭取美國國防、情報機構及商業低軌衛星星系的採購合約。\\n\\n「來源異同」\\nMDA Space 官方新聞稿（標題原文：\\\"MDA SPACE COMPLETES ACQUISITION OF BLUE CANYON\\\"）與 Fidelity 轉載之新聞稿電訊（標題原文：\\\"mda space completes acquisition of blue canyon technologies\\\"）均證實交易於11月27日完成交割並納入400名 BCT 員工；航太專業媒體 SpaceQ（標題原文：\\\"MDA Space closes Blue Canyon Technologies acquisition\\\"）則進一步點出該併購案促成 MDA Space USA 的正式成立。\\n\\n「仍不確定」\\n交割公告未揭露最終交易金額調整細節、現有 BCT 產線的具體整併時程，以及新成立的 MDA Space USA 短期內預計承接的美國政府訂單規模。\\n\\nTrust label: Official confirmation — 依據 MDA Space 於 2026 年 11 月 27 日發布的官方交割公告與航太媒體 SpaceQ 報導核實。\"},\"glossary\":[{\"term\":{\"en\":\"Small-Satellite (SmallSat)\",\"zh-TW\":\"小型衛星\"},\"blurb\":{\"en\":\"Spacecraft of low mass and size, typically under 500 kilograms, widely deployed in low Earth orbit constellations for communications and Earth observation.\",\"zh-TW\":\"質量通常低於500公斤的輕量化太空載具，廣泛應用於低地球軌道通訊星系與對地觀測任務。\"}},{\"term\":{\"en\":\"MDA Space USA\",\"zh-TW\":\"MDA Space 美國子公司\"},\"blurb\":{\"en\":\"The U.S. operating subsidiary formed by Canadian aerospace firm MDA Space following its acquisition of Blue Canyon Technologies.\",\"zh-TW\":\"加拿大航太公司 MDA Space 在完成收購 Blue Canyon Technologies 後，於美國整併成立的營運子公司。\"}},{\"term\":{\"en\":\"Satellite Bus\",\"zh-TW\":\"衛星平台（衛星本體）\"},\"blurb\":{\"en\":\"The core structural and propulsion infrastructure of a spacecraft that provides power, attitude control, and communications for mission payloads.\",\"zh-TW\":\"衛星的核心結構與推進基礎設施，負責為任務酬載提供電力、姿態控制與通訊功能。\"}}],\"sources\":[{\"name\":\"MDA Space\",\"url\":\"https://mda.space/article/mda-space-completes-acquisition-of-blue-canyon-technologies\"},{\"name\":\"SpaceQ\",\"url\":\"https://spaceq.ca/mda-space-closes-blue-canyon-technologies-acquisition/\
