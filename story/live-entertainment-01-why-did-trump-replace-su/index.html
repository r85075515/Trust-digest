s mass detentions, deportations and deployment of armed agents in US cities. Immigration was once a political strength for Trump, but after two years of enforcement it became a liability, and the midterm result cost Republicans control of Congress. Liz Landers reports on the shake-up for PBS NewsHour.\nWhy it matters\nThe swap is a signal, not just a staffing change. Trump is trading a moderating voice for one of the most maximalist champions of his agenda, which suggests he plans to double down on the hardline policies that helped Republicans lose control of Congress. The choice will shape how the White House governs now that Democrats hold both chambers.\nSources agree / disagree\nCNBC, PBS NewsHour, Axios, NPR News and Hollywood Life agree on the core facts: Wiles is out, Miller is in, and the move followed the midterm defeat. No outlet in the cluster disputes the timing or the appointment. Trust label: Multi-source agreement — five outlets report the same shake-up with the same timing and outcome.\nStill uncertain\nThe feed snippets do not give Wiles's own response, the exact date Miller takes over, or what role, if any, Wiles keeps. They also do not explain whether other senior staff will change. Verify the details in the full reporting before quoting them."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-entertainment-01-why-did-trump-replace-su\",\"category\":\"entertainment\",\"adult\":false,\"isHeadline\":true,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-entertainment-01-why-did-trump-replace-su.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Trump Replaces Chief of Staff Susie Wiles With Stephen Miller After Midterm Defeat\",\"zh-TW\":\"相關封面圖：川普（Donald Trump）中期選舉慘敗後撤換幕僚長，改由米勒（Stephen Miller）接任\"},\"publishedAt\":\"2026-11-06T23:55:50.000Z\",\"title\":{\"en\":\"Trump Replaces Chief of Staff Susie Wiles With Stephen Miller After Midterm Defeat\",\"zh-TW\":\"川普（Donald Trump）中期選舉慘敗後撤換幕僚長，改由米勒（Stephen Miller）接任\"},\"summary\":{\"en\":\"President Donald Trump has replaced White House chief of staff Susie Wiles with longtime adviser Stephen Miller, three days after Democrats swept the midterm elections and won control of both chambers. The move trades a moderating voice for the hardline architect of Trump's immigration agenda. Watch whether Miller doubles down on the policies blamed for the defeat.\",\"zh-TW\":\"美國總統川普（Donald Trump）在民主黨橫掃中期選舉、奪下參眾兩院控制權三天後，撤換白宮幕僚長蘇西·懷爾斯（Susie Wiles），改由長期顧問史蒂芬·米勒（Stephen Miller）接任。這是用移民政策的強硬派設計師換掉少數溫和派，預料白宮將加倍推動導致敗選的強硬路線。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"美國總統川普（Donald Trump）在民主黨橫掃中期選舉、奪下參眾兩院控制權三天後，撤換白宮幕僚長蘇西·懷爾斯（Susie Wiles），改由長期顧問史蒂芬·米勒（Stephen Miller）接任。川普週五宣布這項人事異動，報導指出他對中期選舉的敗選感到憤怒。\\n發生了什麼事\\n人事異動發生在中期選舉投票三天後。懷爾斯是川普身邊少數的溫和派力量，如今卸下幕僚長職務，由米勒接手。米勒是政府大規模拘留、驅逐與在美國城市部署武裝人員政策的推手。移民議題曾是川普的政治強項，但經過兩年強力執法後反而成為負擔，中期選舉結果更讓共和黨失去國會控制權。PBS 新聞一小時（PBS NewsHour）的莉茲·蘭德斯（Liz Landers）報導了這次異動。\\n為什麼重要\\n這次換人不只是人事調整，更是一個訊號。川普用議程中最激進的擁護者換掉溫和派，顯示他打算在導致共和黨敗選的強硬政策上加倍押注。民主黨如今掌握參眾兩院，這項人事選擇將決定白宮接下來如何施政。\\n來源異同\\nCNBC、PBS 新聞一小時、Axios、美國國家公共廣播電台（NPR）與好萊塢生活（Hollywood Life）對核心事實的報導一致：懷爾斯去職、米勒接任，異動發生在中期選舉敗選之後。沒有任何一家媒體質疑異動的時機或人選。信任標籤：多源一致——五家媒體以相同的時機與結果報導同一項人事異動。\\n仍不確定\\n來源摘要沒有懷爾斯本人的回應，也沒有米勒正式上任的確切日期，或懷爾斯是否留任其他職務。摘要也沒有說明其他高層人事是否會跟著調整。引用細節前請查閱完整報導。\"},\"sources\":[{\"name\":\"CNBC\",\"url\":\"https://www.cnbc.com/2026/11/06/trump-stephen-miller-wiles-chief-of-staff.html\"},{\"name\":\"PBS NewsHour\",\"url\":\"https://www.pbs.org/newshour/show/what-trump-picking-stephen-miller-for-chief-of-staff-signals-about-his-agenda\"},{\"name\":\"Axios\",\"url\":\"https://www.axios.com/2026/11/06/susie-wiles-trump-stephen-miller-chief-of-staff\"},{\"name\":\"Hollywood Life\",\"url\":\"https://hollywoodlife.com/2026/11/06/why-did-trump-replace-susie-wiles/\"},{\"name\":\"NPR News\",\"url\":\"https://www.npr.org/2026/11/06/nx-s1-6032795/stephen-miller-replace-susie-wiles-trumps-chief-of-staff\"},{\"name\":\"MIT Technology Review\",\"url\":\"https://www.technologyreview.com/2026/11/04/1148022/us-energy-midterm/\"}],\"disagreements\":null,\"trustScore\":93,\"trustBreakdown\":{\"sourceDiversity\":25,\"outletReputation\":18,\"crossCorroboration\":25,\"recencyClarity\":25},\"tags\":[\"entertainment\",\"live-ingest\",\"cnbc\",\"pbs-newshour\",\"axios\"],\"glossary\":[{\"term\":{\"en\":\"Donald Trump\",\"zh-TW\":\"川普\"},\"blurb\":{\"en\":\"President of the United States who replaced his chief of staff after the midterm defeat.\",\"zh-TW\":\"中期選舉敗選後撤換幕僚長的美國總統。\"}},{\"term\":{\"en\":\"Susie Wiles\",\"zh-TW\":\"蘇西·懷爾斯\"},\"blurb\":{\"en\":\"Outgoing White House chief of staff, described as one of Trump's few moderating forces.\",\"zh-TW\":\"卸任的白宮幕僚長，被形容為川普身邊少數的溫和派力量。\"}},{\"term\":{\"en\":\"Stephen Miller\",\"zh-TW\":\"史蒂芬·米勒\"},\"blurb\":{\"en\":\"Longtime Trump adviser and hardline architect of the immigration agenda, now chief of staff.\",\"zh-TW\":\"川普的長期顧問、移民政策的強硬派設計師，現任白宮幕僚長。\"}},{\"term\":{\"en\":\"White House chief of staff\",\"zh-TW\":\"白宮幕僚長\"},\"blurb\":{\"en\":\"The president's top aide, who runs the White House staff.\",\"zh-TW\":\"總統的首席幕僚，負責統領白宮幕僚團隊。\"}},{\"term\":{\"en\":\"US midterm elections\",\"zh-TW\":\"美國中期選舉\"},\"blurb\":{\"en\":\"The 2026 US elections held midway through the presidential term.\",\"zh-TW\":\"2026 年在總統任期中段舉行的美國選舉。\"}},{\"term\":{\"en\":\"PBS NewsHour\",\"zh-TW\":\"PBS 新聞一小時\"},\"blurb\":{\"en\":\"US public television news programme that reported the shake-up.\",\"zh-TW\":\"報導這次人事異動的美國公共電視新聞節目。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"re
