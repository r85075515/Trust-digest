pened\nResearchers reported Monday that sharing a Muse conversation via a web link can surface sensitive information. In response to questions from Ars Technica, Meta said it is suspending the sharing feature while the company reviews it and considers changes. Like many online services, Muse has allowed users to share searches and conversations through links. Separately, Wired AI reports that adult performers are asking why Meta allows its AI agent to sext while restricting their social media accounts.\nWhy it matters\nThe episode puts two Meta problems on the same page: a privacy failure in link-based sharing, and the perception of inconsistent content standards. For creators whose livelihood depends on platforms, the contrast between an AI agent allowed to talk dirty and human creators facing account restrictions is the point of contention.\nSources agree / disagree\nArs Technica's headline focuses on the exposure of personal and business secrets through shared conversations; Wired AI's headline focuses on creators' anger over the double standard. Both report Meta's decision to suspend sharing while it reviews the behavior. No numeric or name conflicts appear.\nStill uncertain\nThe snippets do not detail exactly what kinds of sensitive information were exposed, how many users were affected, or what changes Meta is considering. Check the full reports before quoting specifics."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-tech-01-onlyfans-creators-are-pi\",\"category\":\"tech\",\"adult\":false,\"isHeadline\":true,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-tech-01-onlyfans-creators-are-pi.jpg\",\"imageAlt\":{\"en\":\"Cover related to: OnlyFans Creators Are Pissed That Meta Lets Muse Talk Dirty\",\"zh-TW\":\"相關封面圖：OnlyFans 創作者對 Meta 讓 Muse 說髒話感到憤怒\"},\"publishedAt\":\"2026-10-20T12:33:13.000Z\",\"title\":{\"en\":\"OnlyFans creators criticize Meta after researchers report Muse can expose shared conversation secrets\",\"zh-TW\":\"研究指 Meta（Meta）旗下 AI 代理 Muse（Muse）分享對話恐外洩隱私，OnlyFans（OnlyFans）創作者批評雙重標準\"},\"summary\":{\"en\":\"Researchers reported Monday that Meta's new general-purpose AI agent Muse can expose sensitive information when users share conversations through web links. Meta told Ars it is suspending the sharing feature while it reviews the issue. Adult performers are asking why the agent may sext while their social accounts face restrictions.\",\"zh-TW\":\"研究人員週一指出，Meta 新推出的通用 AI 代理 Muse 在用戶透過網頁連結分享對話時，可能外洩敏感資訊。Meta 回覆 Ars 表示將暫停分享功能並檢討。成人創作者質疑：為何 AI 代理可以傳情色訊息，他們的社群帳號卻處處受限。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"研究人員指出 Meta（Meta）新推出的通用 AI 代理 Muse（Muse）在分享對話時可能外洩隱私後，OnlyFans（OnlyFans）創作者開始質疑 Meta 的內容標準是否雙重。\\n發生了什麼事\\n研究人員週一報告，用戶透過網頁連結分享 Muse 對話時，可能暴露個人與商業機密。Meta 回覆《Ars Technica》提問時表示，將暫停分享功能並進行檢討、考慮修改。與多數線上服務一樣，Muse 原本允許用戶以連結分享搜尋與對話。另據《Wired》AI 版報導，成人表演者質疑：為何 Meta 允許自家 AI 代理傳情色訊息，他們的社群帳號卻處處受限。\\n為什麼重要\\n這件事把 Meta 的兩個問題擺在同一頁：一是連結分享的隱私漏洞，二是內容標準被認為不一致。對靠平台維生的創作者而言，AI 代理可以說髒話、人類創作者卻被限號，正是爭議核心。\\n來源異同\\n《Ars Technica》聚焦分享對話外洩個人與商業機密；《Wired》AI 版聚焦創作者對雙重標準的憤怒。兩家都報導了 Meta 暫停分享功能並檢討的回應，未見數字或人名衝突。\\n仍不確定\\n摘要未說明外洩的敏感資訊具體是哪些類型、有多少用戶受影響，也未說明 Meta 考慮的修改方向，引用細節前請查閱完整報導。\"},\"sources\":[{\"name\":\"Ars Technica\",\"url\":\"https://arstechnica.com/security/2026/10/meta-muse-exposes-users-personal-and-business-secrets-when-they-share-conversations/\"},{\"name\":\"Wired AI\",\"url\":\"https://www.wired.com/story/onlyfans-creators-are-pissed-that-meta-lets-muse-talk-dirty/\"}],\"disagreements\":null,\"trustScore\":71,\"trustBreakdown\":{\"sourceDiversity\":13,\"outletReputation\":19,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"tech\",\"live-ingest\",\"ars-technica\",\"wired-ai\"],\"glossary\":[{\"term\":{\"en\":\"Muse\",\"zh-TW\":\"Muse\"},\"blurb\":{\"en\":\"Meta's new general-purpose AI agent at the center of the reports.\",\"zh-TW\":\"事件核心、Meta 新推出的通用 AI 代理。\"}},{\"term\":{\"en\":\"Meta\",\"zh-TW\":\"Meta\"},\"blurb\":{\"en\":\"US technology company that owns Facebook,
