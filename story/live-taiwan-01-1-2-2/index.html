 impoundment, joint liability for passengers in the same vehicle, and preventive license suspension. In Kaohsiung, one case involved a scooter not owned by the drug-driving rider and carrying a passenger; the scooter was impounded and the rider, passenger, and owner together face fines of more than NT$250,000 at most. In the other case, the scooter rider refused drug testing and was fined up to NT$270,000 under the new system.\n\nWhy it matters\nThe case shows the new penalties being applied on their first day, not only in Kaohsiung but also in Taoyuan and elsewhere. The scale cited for the first half of the year, more than 12,000 citations, is presented as the reason for preventing drug driving through higher fines and heavier measures. The new system reaches beyond the driver alone, covering vehicle impoundment, fines for passengers riding together, preventive license suspension, and high fines for refusing a test.\n\nSources agree / disagree\nBoth items in this cluster come from PTS News and cover the first day of the new system, one focusing on Kaohsiung and Taoyuan cases appearing in succession and the other on the two Kaohsiung cases within an hour. The source material flags differing figures across the snippets, for example 12,000 citations set against the one-hour timeframe in the headlines, which refer to different measures rather than a single shared statistic, so readers should keep each figure attached to what it counts.\nTrust label: Single source — Both items come from PTS News, so this cluster rests on one outlet's reporting.\n\nStill uncertain\nThe feed descriptions may omit context, updates, or corrections, and the snippets do not give the final confirmed fine amounts for each person in the Kaohsiung cases, only the maximum amounts described. Whether the preventive license suspension and passenger liability measures were applied in each case is also not fully specified in the short excerpts, so the publisher pages should be checked for the latest complete reporting."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-01-1-2-2\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-taiwan-01-1-2-2.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 毒駕加重罰新制上路1小時 高雄警連查2起、沒入2機車\",\"zh-TW\":\"相關封面圖：毒駕加重罰新制上路1小時 高雄警連查2起、沒入2機車\"},\"publishedAt\":\"2026-11-01T05:09:47.000Z\",\"title\":{\"en\":\"Kaohsiung police catch two drug-driving cases within an hour of tougher penalties\",\"zh-TW\":\"高雄（Kaohsiung）警方在毒駕加重罰新制上路一小時內查獲兩起並沒入兩輛機車\"},\"summary\":{\"en\":\"Taiwan's tougher drug-driving penalties took effect on the 31st, raising fines to NT$120,000 for scooter riders, NT$150,000 for car drivers, and NT$270,000 for a first refusal of testing, plus vehicle impoundment. Within an hour, Qianzhen police in Kaohsiung caught two cases and impounded two scooters, as cases also appeared in Taoyuan.\",\"zh-TW\":\"毒駕加重罰新制於31日上路，罰則提高為機車騎士新台幣12萬元、汽車駕駛15萬元、首次拒測27萬元，並納入沒入車輛等處分。新制上路不到一小時，高雄（Kaohsiung）前鎮警方接連查獲兩起毒駕並沒入機車，桃園（Taoyuan）等地也陸續查獲。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"攸關行政罰的毒駕新制於31日正式上路，執法幾乎立即開始。新制上路還不到一小時，高雄（Kaohsiung）前鎮警方就接連查獲兩起毒駕並沒入兩輛機車，新制首日在桃園（Taoyuan）等地也陸續查獲毒駕。\\n\\n發生了什麼事\\n報導引述警方數字指出，今年前半年警方舉發毒駕超過12000件，換算每天至少60多件。新制將罰則提高為機車騎士新台幣12萬元、汽車駕駛15萬元、首次拒測27萬元，並納入沒入車輛、同車乘客連坐罰、預防性吊照等作為。高雄（Kaohsiung）一起案件因機車非毒駕駕駛所有且雙載，除沒入機車外，駕駛、乘客與車主三人最高可罰25萬餘元；另一起機車駕駛拒絕毒測，依新制開罰最高27萬元。\\n\\n為什麼重要\\n這起案件顯示新罰則在上路首日就被實際適用，不只在高雄（Kaohsiung），桃園（Taoyuan）等地也有查獲。報導以前半年超過12000件的舉發規模，作為提高罰金與加重處分防範毒駕的背景。新制涵蓋範圍不只駕駛本人，還包括沒入車輛、同車乘客連坐罰、預防性吊照，以及拒測的高額罰鍰。\\n\\n來源異同\\n本彙集兩則都來自公視（PTS），報導新制首日，一則聚焦高雄（Kaohsiung）與桃園（Taoyuan）陸續查獲，另一則聚焦高雄一小時內兩起。來源材料標示摘要數字有差異，例如12000件舉發與標題的一小時時間範圍，兩者指的是不同衡量對象而非同一個統計，讀者應把每個數字與它所計量的事物對應看待。\\n\\n仍不確定\\n來源摘要可能省略背景、更新或更正，片段也未給出高雄（Kaohsiung）各案件每人的最終確定罰鍰，只給出所述最高金額。預防性吊照與乘客連坐是否適用於每起案件，短摘錄也未完全說明，最新完整報導仍須查閱媒體頁面。\"},\"sources\":[{\"name\":\"公視新聞網\",\"url\":\"https://news.pts.org.tw/article/833777\"}],\"disagreements\":{\"en\":\"Figures differ across outlets (e.g. 12000 vs 1 in headlines/snippets).\",\"zh-TW\":\"不同媒體的數字有所不同（例如，標題/摘要中的數字為 12000 與 1）。\"},\"trustScore\":58,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":21,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"公視新聞網\",\"公視新聞網\"],\"glossary\":[{\"term\":{\"en\":\"PTS News\",\"zh-TW\":\"公視（PTS）\"},\"blurb\":{\"en\":\"PTS News is the outlet that reported the first-day drug-driving enforcement in Kaohsiung and Taoyuan.\",\"zh-TW\":\"公視（PTS）是報導高雄與桃園毒駕新制首日執法的媒體。\"}},{\"term\":{\"en\":\"Road Traffic Management and Penalty Act\",\"zh-TW\":\"道路交通管理處罰條例（Road Traffic Management and Penalty Act）\"},\"blurb\":{\"en\":\"The Road Traffic Management and Penalty Act is the law under which drug-driving fines and penalties were raised.\",\"zh-TW\":\"道路交通管理處罰條例（Road Traffic Management and Penalty Act）是調高毒駕罰金與處分的法律依據。\"}},{\"term\":{\"en\":\"Qianzhen District\",\"zh-TW\":\"前鎮（Qianzhen）\"},\"blurb\":{\"en\":\"Qianzhen is the Kaohsiung district whose police caught two drug-driving cases within an hour.\",\"zh-TW\":\"前鎮（Qianzhen）是高雄警方一小時內查獲兩起毒駕的轄區。\"}},{\"term\":{\"en\":\"Drug driving\",\"zh-TW\":\"毒駕（Drug driving）\"},\"blurb\":{\"en\":\"Drug driving is the conduct targeted by the tougher penalties that took effect on the 31st.\",\"zh-TW\":\"毒駕（Drug driving）是31日上路加重罰新制所針對的行為。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-taiwan-01-1-2-2/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:
