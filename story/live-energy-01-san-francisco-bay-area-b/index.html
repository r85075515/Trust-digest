sea level. Monthly tide records have already been set across the city, with some gauges expected to go even higher tomorrow.\nWhat happened\nRenowned climatologist Daniel Swain used his virtual office hours on Monday to set the record straight about California's flood risk: water levels along the state's coast, bays and estuaries will test record-high or close to record-high November tides up and down the coast this week. Low-lying roadways in San Francisco have already flooded, and one community in northern California has been evacuated.\nWhy it matters\nThis is a stress test, not a one-day event: the same tides return with each cycle, and a warmer climate loads the dice toward higher water. For readers on the coast, the practical question is which roads and neighborhoods flood first — and whether this week's records become the new normal for November.\nSources agree / disagree\nInside Climate News and The Guardian both report the same setup — king tides plus El Niño plus warming — and the same on-the-ground effects, with no conflicting figures. Trust label: Two-source agreement — two outlets agree on the core claims.\nStill uncertain\nThe snippets do not name the evacuated community, give a street-level list of flooded roads, or say when tides will fall back below flood stage. Those details require the full reporting on the linked publisher pages."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-energy-01-san-francisco-bay-area-b\",\"category\":\"energy\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-energy-01-san-francisco-bay-area-b.jpg\",\"imageAlt\":{\"en\":\"Cover related to: San Francisco Bay Area Braces for Record Coastal Flooding\",\"zh-TW\":\"相關封面圖：舊金山灣區為創紀錄的沿海洪水做好準備\"},\"publishedAt\":\"2026-11-25T00:07:57.000Z\",\"title\":{\"en\":\"San Francisco Bay Area Braces for Record Coastal Flooding\",\"zh-TW\":\"舊金山灣區嚴防創紀錄沿海洪水\"},\"summary\":{\"en\":\"A rare combination of king tides and an extreme El Niño, amplified by global warming, is expected to push water up to 3 feet above sea level along the San Francisco Bay Area this week, flooding low-lying roads and prompting an evacuation in one northern California community. Monthly tide records have already been set; higher water is expected tomorrow.\",\"zh-TW\":\"大潮與極端聖嬰現象罕見疊加，在全球暖化推波助瀾下，本週舊金山灣區水位可能高出海平面 3 英尺（約 0.9 公尺），低窪道路已淹水、北加州一處社區已撤離。全市多處已創下單月潮汐紀錄，明日水位預料更高。低窪地區居民留意官方洪水警示。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"大潮與極端聖嬰現象罕見疊加，在全球暖化推波助瀾下，舊金山灣區本週水位可能高出海平面 3 英尺（約 0.9 公尺），創下沿海洪水紀錄。全市多處已創單月潮汐紀錄，明日水位預料還會更高。\\n發生了什麼事\\n知名氣候學家丹尼爾·斯溫（Daniel Swain）週一在線上辦公時間澄清加州洪水風險：本週全州海岸、海灣與河口的水位將挑戰 11 月歷來最高或接近最高的潮汐。舊金山低窪道路已淹水，北加州一處社區已撤離。\\n為什麼重要\\n這是一場壓力測試，不是單日事件：同樣的潮汐每個週期都會回來，而暖化的氣候讓水位更容易創新高。對沿海居民來說，實際問題是哪條路、哪個社區先淹——以及本週的紀錄會不會變成往後 11 月的新常態。\\n來源異同\\nInside Climate News 與《衛報》報導的成因與現場影響一致——大潮加聖嬰加暖化，沒有數字衝突。信任標籤：2源一致——兩家媒體對核心事實說法一致。\\n仍不確定\\n片段未指明撤離的是哪個社區、未列出淹水道路，也未說明潮汐何時回落到警戒水位以下，須看各家完整報導才能確認。\"},\"sources\":[{\"name\":\"Inside Climate News\",\"url\":\"https://insideclimatenews.org/news/24112026/san-francisco-bay-area-coastal-flooding/\"},{\"name\":\"The Guardian Environment\",\"url\":\"https://www.theguardian.com/weather/2026/nov/24/california-coast-flooding-thanksgiving-travel\"}],\"disagreements\":null,\"trustScore\":72,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":19,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"energy\",\"live-ingest\",\"inside-climate-news\",\"the-guardian-environment\"],\"glossary\":[{\"term\":{\"en\":\"King tide\",\"zh-TW\":\"大潮\"},\"blurb\":{\"en\":\"Exceptionally high tide that occurs a few times a year.\",\"zh-TW\":\"每年出現數次的異常高潮汐。\"}},{\"term\":{\"en\":\"El Niño\",\"zh-TW\":\"聖嬰現象\"},\"blurb\":{\"en\":\"Pacific warming pattern amplifying this week's tides.\",\"zh-TW\":\"加劇本週潮汐的太平洋暖化現象。\"}},{\"term\":{\"en\":\"Daniel Swain\",\"zh-TW\":\"丹尼爾·斯溫\"},\"blurb\":{\"en\":\"Climatologist who briefed the flood risk on Monday.\",\"zh-TW\":\"週一說明洪水風險的氣候學家。\"}},{\"ter
