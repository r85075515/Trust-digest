s from late November, with the city's first lights marking the start of the most charming time of year in the capital, 650 metres above sea level. Vogue Taiwan's 48-hour guide starts at the giant Christmas bauble in Plaza de España, moves through the Christmas market at Plaza Mayor, and stops at San Ginés, the century-old shop, for freshly fried churros. The guide's pitch is to live like a local: stay up late, eat slowly and drink a little, in a city that never sleeps.\n\nWhy it matters\nThe switch-on is the starting gun for Madrid's winter tourism season, and the guide is aimed squarely at travellers deciding whether the trip is worth it: the lights, the market and the food are the draw, and the 48-hour frame makes the visit plannable in a single weekend.\n\nSources agree / disagree\nThis is a single-outlet travel guide from Vogue Taiwan, so there is no second source to corroborate the details; the dates and places come from that one guide. Trust label: Single source — one outlet's guide, with no independent corroboration in this cluster.\n\nStill uncertain\nThe snippet gives no switch-on time, no market dates or hours, and no prices or booking details for the itinerary. Check the full Vogue guide — and the city's official listings — before planning around it."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-beauty-01-vogue-2026-11-21-1-400\",\"category\":\"beauty\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-beauty-01-vogue-2026-11-21-1-400.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Vogue去哪玩｜2026馬德里聖誕點燈11/21登場！走進1,400萬顆燈海、像當地人一樣晚睡、慢食、微醺，感受不夜城魅力\",\"zh-TW\":\"相關封面圖：Vogue去哪玩｜2026馬德里聖誕點燈11/21登場！走進1,400萬顆燈海、像當地人一樣晚睡、慢食、微醺，感受不夜城魅力\"},\"publishedAt\":\"2026-11-21T05:16:40.000Z\",\"title\":{\"en\":\"Madrid Christmas Lights Switch On November 21 Amid 14 Million Bulbs\",\"zh-TW\":\"馬德里聖誕點燈 11 月 21 日登場，1,400 萬顆燈海點亮不夜城\"},\"summary\":{\"en\":\"Madrid's 2026 Christmas season opens on November 21, when the high-altitude capital lights up with 14 million bulbs. Vogue Taiwan's 48-hour guide runs from the giant Christmas bauble in Plaza de España to the Plaza Mayor market and churros at the century-old San Ginés. Takeaway: go late, eat slowly, and linger — that is how locals do Madrid in winter.\",\"zh-TW\":\"2026 年馬德里聖誕季 11 月 21 日揭幕，海拔 650 公尺的高原首都將點亮 1,400 萬顆聖誕燈。Vogue 48 小時行程從西班牙廣場巨型聖誕球、馬約爾廣場聖誕市集，一路吃到百年名店 San Ginés 現炸吉事果。takeaway：晚睡、慢食、微醺，像當地人一樣過聖誕。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"2026 年馬德里聖誕季 11 月 21 日登場，這座海拔 650 公尺的高原首都將點亮 1,400 萬顆聖誕燈，化身冬日童話。\\n發生了什麼事\\n每年 11 月下旬第一盞聖誕燈點亮，就是馬德里一年中最迷人的時刻。Vogue 的 48 小時行程從西班牙廣場的巨型聖誕球出發，逛馬約爾廣場聖誕市集，再到百年名店 San Ginés 吃現炸吉事果。行程主打在地步調：晚睡、慢食、微醺，感受不夜城的魅力。\\n為什麼重要\\n點燈是馬德里冬季旅遊季的起跑槍，這份指南就是寫給正在猶豫要不要去的人：燈海、市集、美食是賣點，48 小時框架讓整趟行程一個週末就能排完。\\n來源異同\\n這是 Vogue 台灣版的單一來源旅遊指南，沒有第二家媒體可佐證日期與地點細節。信任標籤：僅1源——單一媒體指南，本批內無其他來源佐證。\\n仍不確定\\n摘要未提供點燈時間、市集日期與營業時間，也沒有行程的價格或預訂資訊。排定行程前請查閱 Vogue 全文與官方公告。\"},\"sources\":[{\"name\":\"Vogue Taiwan\",\"url\":\"https://www.vogue.com.tw/article/馬德里-景點\"}],\"disagreements\":null,\"trustScore\":47,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":10,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"beauty\",\"live-ingest\",\"vogue-taiwan\"],\"glossary\":[{\"term\":{\"en\":\"Madrid\",\"zh-TW\":\"馬德里\"},\"blurb\":{\"en\":\"Capital of Spain, 650 metres above sea level, hosting the Christmas lights.\",\"zh-TW\":\"西班牙首都，海拔 650 公尺，本次聖誕點燈的城市。\"}},{\"term\":{\"en\":\"Vogue Taiwan\",\"zh-TW\":\"Vogue 台灣版\"},\"blurb\":{\"en\":\"Taiwan edition of Vogue magazine, publisher of the 48-hour Madrid guide.\",\"zh-TW\":\"Vogue 雜誌台灣版，本次 48 小時馬德里指南的出版方。\"}},{\"term\":{\"en\":\"Plaza de España\",\"zh-TW\":\"西班牙廣場\"},\"blurb\":{\"en\":\"Madrid square home to the giant Christmas bauble in the guide.\",\"zh-TW\":\"馬德里廣場，指南中巨型聖誕球的所在地。\"}},{\"term\":{\"en\":\"Plaza Mayor\",\"zh-TW\":\"馬約爾廣場\"},\"blurb\":{\"en\":\"Historic Madrid square hosting the Christmas market.\",\"zh-TW\":\"馬德里歷史廣場，聖誕市集的舉辦地。\"}},{\"term\
