stine Action,” as rendered in the feed snippet. The Metropolitan Police alleged that demonstrators were meeting to purposefully commit a crime. The coverage describes the event as the largest such mass demonstration under Andy Burnham's premiership opposing the proscription of Palestine Action, and as the largest such gathering under Burnham in the related snippet.\nWhy it matters\nThe arrests matter because they show the ban being enforced against public expressions of support: most of those detained were held, police said, for expressing support for a proscribed organisation rather than for other conduct described in the snippets. The scale described — hundreds gathering and almost 140 arrested at the largest such demonstration of the current premiership — makes the protest a notable test of how the proscription is being applied in public.\nSources agree / disagree\nThree outlets cover the same event: Al Jazeera, Sky News UK, and The Guardian. They agree that hundreds gathered outside the embassy and that the arrests numbered almost 140, with Sky News UK giving the precise figure of 139. Figures differ across the headlines and snippets, flagged as 039 versus 139, so the precise count as rendered in some snippets is inconsistent even though the fuller reports converge on 139.\nTrust label: Accounts differ — Multiple outlets cover the event, but the arrest figure is rendered inconsistently across the snippets, flagged as 039 versus 139.\nStill uncertain\nThe snippets do not say what happened to those arrested after detention, whether charges followed, or how the government responded. Feed descriptions can omit context, updates, or corrections, so the outcomes for the 139 people and any later developments remain to be confirmed in the full reporting."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-02-almost-140-arrested-at-p\",\"category\":\"international\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-international-02-almost-140-arrested-at-p.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Almost 140 arrested at protest against Palestine Action ban outside US embassy in London\",\"zh-TW\":\"相關封面圖：近140人因抗議巴勒斯坦行動禁令在美國駐倫敦大使館外被捕\"},\"publishedAt\":\"2026-10-31T22:10:53.000Z\",\"title\":{\"en\":\"Palestine Action protest outside the United States embassy in London leads to almost 140 arrests\",\"zh-TW\":\"巴勒斯坦行動（Palestine Action）抗議在倫敦引發近一百四十人被捕\"},\"summary\":{\"en\":\"Police said 139 people were arrested during a protest in central London in support of Palestine Action, after hundreds gathered outside the United States embassy to oppose the United Kingdom government's ban on the group. Police said most of those detained were held for expressing support for a proscribed organisation.\",\"zh-TW\":\"警方表示，倫敦市中心一場聲援巴勒斯坦行動（Palestine Action）的抗議中有一百三十九人被捕；此前數百人聚集在美國大使館外，反對英國政府對該組織的禁令。警方稱，多數被拘留者是因表達支持被禁組織而遭拘留。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"倫敦一場反對英國政府禁止巴勒斯坦行動（Palestine Action）的抗議中，近一百四十人被捕；此前數百名抗議者聚集在美國大使館外，反對此一禁令。\\n發生了什麼事\\n警方表示，倫敦市中心聲援巴勒斯坦行動（Palestine Action）的抗議共有 一百三十九人被捕，多數人因表達支持被禁組織而遭拘留。數百人聚集在倫敦南部巴特西（Battersea）的美國大使館外，手持標語，摘要所示文字包括反對種族滅絕、支持該組織等字句。都會警察（Met）指稱示威者聚眾蓄意犯罪。報導形容此為現任首相伯納姆（Andy Burnham）任內反對禁令的最大規模群眾示威。\\n為什麼重要\\n此事的重要性在於禁令正被用於執法處理公開表達支持的行為：警方稱多數被拘留者是因表達支持被禁組織而遭拘留，而非摘要所述的其他行為。數百人聚集、近一百四十人被捕的規模，使此抗議成為檢視禁令如何落實的重要案例。\\n來源異同\\n三家媒體報導同一事件：半島電視台（Al Jazeera）、天空新聞（Sky News UK）與衛報（The Guardian），皆指出數百人聚集於大使館外、被捕人數近一百四十人，天空新聞（Sky News UK）給出一百三十九人的精確數字。惟各標題與摘要的數字有差異，標示為零三九對一百三十九，部分摘要呈現的數字不一致，較完整報導則一致指向一百三十九人。\\n仍不確定\\n摘要未說明被捕者拘留後的處置、是否遭起訴，以及政府回應；一百三十九人的後續與事態發展仍待完整報導確認。\"},\"sources\":[{\"name\":\"Al Jazeera\",\"url\":\"https://www.aljazeera.com/video/newsfeed/2026/10/31/aje-onl-nf_palestine-action-supporters-arrested-in-london-311026?traffic_source=rss\"},{\"name\":\"Sky News UK\",\"url\":\"https://news.sky.com/story/139-people-arrested-during-protest-in-support-of-palestine-action-13606066\"},{\"name\":\"The Guardian UK News\",\"url\":\"https://www.theguardian.com/uk-news/2026/oct/31/protest-against-palestine-action-ban-outside-us-embassy-in-london\"}],\"disagreements\":{\"en\":\"Figures differ across outlets (e.g. 039 vs 139 in headlines/snippets).\",\"zh-TW\":\"不同媒體的數字有所不同（例如，標題/摘要中的數字為 039 與 139）。\"},\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":21,\"outletReputation\":20,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"international\",\"live-ingest\",\"al-jazeera\",\"sky-news-uk\",\"the-guardian-uk-news\"],\"glossary\":[{\"term\":{\"en\":\"Palestine Action\",\"zh-TW\":\"巴勒斯坦行動（Palestine Action）\"},\"blurb\":{\"en\":\"Palestine Action is the proscribed organisation whose ban by the United Kingdom government the London protest opposed.\",\"zh-TW\":\"巴勒斯坦行動（Palestine Action）是遭英國政府禁止、此次倫敦抗議所反對禁令的組織。\"}},{\"term\":{\"en\":\"Andy Burnham\",\"zh-TW\":\"伯納姆（Andy Burnham）\"},\"blurb\":{\"en\":\"Andy Burnham is the premier under whose premiership the coverage describes this as the largest such mass demonstration.\",\"zh-TW\":\"伯納姆（Andy Burnham）是報導所稱此為其任內最大規模同類示威的首相。\"}},{\"term\":{\"en\":\"Metropolitan Police (Met)\",\"zh-TW\":\"都會警察（Met）\"},\"blurb\":{\"en\":\"The Met is the police force that reported 139 arrests and alleged demonstrators were meeting to purposefully commit a crime.\",\"zh-TW\":\"都會警察（Met）是通報一百三十九人被捕、並指稱示威者聚眾蓄意犯罪的警方。\"}},{\"term\":{\"en\":\"United States embassy in London\",\"zh-TW\":\"美國駐倫敦大使館（United States Embassy in London）\"},\"blurb\":{\"en\":\"The United States embassy in Battersea, south London, is the site outside which hundreds of protesters gathered.\",\"zh-TW\":\"美國駐倫敦大使館（United States Embassy in London）位於倫敦南部巴特西（Battersea），是數百名抗議者聚集的地點。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom
