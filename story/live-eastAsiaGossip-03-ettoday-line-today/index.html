er 20, Chen in a dreamy white gown, Kawamura saying he looks forward to the future with Tian-chan (天醬).\nWhat happened\nETtoday, Yahoo News, NOWnews and LINE TODAY all carry the same sequence. Chen and Kawamura surprised fans by announcing their marriage in March, then said they would run a YouTube channel together and kept sharing slices of their life on social media. On November 20 Chen posted the wedding photos, writing that their story is just beginning; Kawamura echoed her, saying he looks forward to the future with Tian-chan. At the banquet, their five-year-old daughter walked in holding hands with them, and a line from Chen's mother moved the room. Fans flooded the posts with congratulations.\nWhy it matters\nThe verdict is plain: this is a deliberate, family-first public reveal. Chen and Kawamura announced the marriage first and saved the images for eight months, then put their daughter at the center of the banquet — a choice that frames the marriage as a family story, not a publicity stunt, and gives their joint channel a ready-made audience.\nSources agree / disagree\nETtoday, Yahoo News, NOWnews and LINE TODAY agree on every core fact — the March announcement, the November 20 photos, the joint channel, the daughter's entrance and the mother's line. Trust label: Multi-source agreement — four outlets report the same wedding story with no conflicting details in the snippets.\nStill uncertain\nThe snippets give no banquet date, no guest list and no further quotes beyond the two short lines from the couple. The wedding itself is confirmed; the finer details still need the full reports."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-eastAsiaGossip-03-ettoday-line-today\",\"category\":\"eastAsiaGossip\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-eastAsiaGossip-03-ettoday-line-today.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 陳天仁、河村一樹絕美婚紗照曝！ 深情告白：我們的故事正要開始 | ETtoday星光雲 - LINE TODAY\",\"zh-TW\":\"相關封面圖：陳天仁、河村一樹絕美婚紗照曝！ 深情告白：我們的故事正要開始 | ETtoday星光雲 - LINE TODAY\"},\"publishedAt\":\"2026-11-20T17:11:00.000Z\",\"title\":{\"en\":\"Chen Tianren and Kazuki Kawamura Share Wedding Photos Eight Months After Announcing Marriage\",\"zh-TW\":\"陳天仁與河村一樹曬婚紗照：3 月公開婚訊，11 月 20 日甜蜜放閃\"},\"summary\":{\"en\":\"Actress Chen Tianren and Japanese YouTuber Kazuki Kawamura shared wedding photos on November 20, eight months after announcing their marriage in March. Their five-year-old daughter walked in holding hands at the banquet, and a line from Chen's mother moved the room. The couple also run a YouTube channel together. Next: more of their shared life online.\",\"zh-TW\":\"女星陳天仁與日本 YouTuber 河村一樹（Kazuki Kawamura）3 月公開婚訊後，11 月 20 日曬出婚紗照；婚宴上 5 歲女兒牽手進場，媽媽一句話感動全場。兩人共同經營 YouTube 頻道，這場跨國婚姻的公開亮相，等於向粉絲宣告新生活正式開始。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"女星陳天仁與日本 YouTuber 河村一樹（Kazuki Kawamura）結婚了，而且大方曬出來：3 月公開婚訊 8 個月後，兩人 11 月 20 日曬出婚紗照，陳天仁一襲夢幻白紗，河村一樹說期待與天醬的未來。\\n發生了什麼事\\nETtoday、Yahoo新聞、NOWnews 與 LINE TODAY 報導一致。陳天仁與河村一樹 3 月驚喜公開婚訊，隨後宣布共同經營 YouTube 頻道，平時透過社群記錄生活。11 月 20 日陳天仁發文曬出一系列婚紗照，寫下「我們的故事正要開始」；河村一樹呼應，說期待跟天醬的未來。婚宴上 5 歲女兒牽手進場，媽媽一句話感動全場，網友湧入按讚祝賀。\\n為什麼重要\\n結論很直接：這是一場刻意以家庭為主角的公開亮相。兩人先公布婚訊，隔 8 個月才曬婚紗照，又讓女兒站在婚宴中央，等於把婚姻寫成家庭故事，不是宣傳操作，也順勢替共同頻道攢下現成觀眾。\\n來源異同\\nETtoday、Yahoo新聞、NOWnews 與 LINE TODAY 對核心事實一致：3 月婚訊、11 月 20 日婚紗照、共同頻道、女兒牽手進場、媽媽一句話。信任標籤：多家來源一致——四家媒體報導同一場婚事，來源摘要裡沒有衝突細節。\\n仍不確定\\n來源摘要沒有婚宴日期、賓客名單，夫妻兩人的引言也只有短短兩句。婚事本身已確認，細節仍待完整報導。\"},\"sources\":[{\"name\":\"ETtoday 影劇\",\"url\":\"https://star.ettoday.net/news/3275754\"},{\"name\":\"Google News TW Entertainment\",\"url\":\"https://news.google.com/rss/articles/CBMijAJBVV95cUxNOWVfZWE1VkVLUEswaVlNaWd6RXpSQnlTd3FBOU1Nc1NaUl9iOWFXQXlNaHEtenJreUhvb3RISkhjN09JUWtRZXA3X0doenJhcEc4bXhsd3VqZW5BVEdTLWZ5MWJmRHRUQlFnakw5Nk80d2hCekVRWGw1Zm9adlg1UjM1dWMwVkM1QzVRMTFhVl9MWWg4Q29mUkNyOHBfcUMwUVdmS2F5Szl1ZFc5dlhsQ3FkWW44SGl2V2syZFctdmRjTEtadm5mZVl1VVNMZ3N0VlZvNGJVbzRaZ1FibTZtbGlmemtIel81eTlnZ05DbHdpQ1d3akVNOGVNb19rYmljbUZLN3MwX1JJOGh4?oc=
