ersity Research Institute for care before being released on November 10, 2026 with a satellite collar. After moving about 20.53 kilometers across elevations of 1,003 to 1,564 meters, the bear stayed stationary for 12 hours on November 23 and emitted a mortality signal on November 24. Search teams found the carcass on November 26 in forested terrain at about 1,246 meters elevation between Jialun Mountain and the Da'an River valley with no obvious external injuries or suspicious signs nearby, and an X-ray at National Taiwan University Veterinary Hospital on November 27 found no fractures or metal objects, prompting transfer to the Veterinary Research Institute for necropsy with support from the Tiangou tribal bear patrol team.\n\nWhy it matters: Tracking post-release movement and causes of mortality helps wildlife agencies refine rescue, rehabilitation, and release protocols for protected Formosan black bears.\n\nSource differences: Both reports stem from the same Forestry and Nature Conservation Agency Hsinchu Branch release and Central News Agency wire chain. 信吉衛視 carries the exact title 「司馬限林道黑熊「芭甘」野放2週死亡　初步排除人為因素」, while 商傳媒 carries the exact title 「小黑熊「芭甘」野放死亡原因不明　排除人為因素將進一步病理解剖」.\n\nStill uncertain: The exact cause of death remains undetermined pending pathology and necropsy findings from the Veterinary Research Institute.\n\nTrust label: Single source — both listed outlets reflect a single agency release and wire chain."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-466-bagan-formosan-black-bear-death\",\"category\":\"taiwan\",\"title\":{\"en\":\"Formosan Black Bear Bagan Found Dead Two Weeks After Release, Human Harm Preliminarily Ruled Out\",\"zh-TW\":\"台灣黑熊「芭甘」野放兩週後死亡，初步排除人為因素\"},\"summary\":{\"en\":\"Formosan black bear Bagan died about two weeks after its November 10, 2026 release in Miaoli, with X-rays preliminarily ruling out human-caused trauma pending necropsy. Key takeaway: satellite tracking and veterinary pathology are guiding post-release survival monitoring.\",\"zh-TW\":\"台灣黑熊「芭甘」於 2026 年 11 月 10 日在苗栗野放後約兩週死亡，11 月 27 日經 X 光檢查初步排除人為因素，詳細死因待解剖釐清。關鍵結論：衛星追蹤與獸醫病理檢查正協助評估野放個體存活與保育風險。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」黑熊「芭甘」今年 2 月受困苗栗泰安司馬限山區陷阱，經在地族人通報並後送生物多樣性研究所救治照養，評估符合條件後於 11 月 10 日野放並配戴衛星頸圈追蹤。野放後累積移動約 20.53 公里、活動海拔 1,003 至 1,564 公尺，11 月 23 日靜止 12 小時，24 日發出死亡訊號。搜尋隊於 26 日在佳仁山與大安溪谷間海拔約 1,246 公尺林地尋獲遺體，外觀無明顯外傷且周邊無可疑跡象，27 日經台灣大學動物醫院 X 光檢查未見骨折或體內金屬異物，初步排除槍傷等人為因素，遺體後送農業部獸醫研究所解剖，在地天狗部落黑熊巡守隊全程協助。\\n\\n「為什麼重要」追蹤野放個體移動軌跡與死因，有助主管機關檢視救援照養與野放評估流程，強化瀕危野生動物保育。\\n\\n「來源異同」兩篇報導同屬林業及自然保育署新竹分署發布與中央社稿鏈。信吉衛視頁面實際標題逐字為「司馬限林道黑熊「芭甘」野放2週死亡　初步排除人為因素」，商傳媒頁面實際標題逐字為「小黑熊「芭甘」野放死亡原因不明　排除人為因素將進一步病理解剖」。\\n\\n「仍不確定」確切死因仍待農業部獸醫研究所解剖與病理解剖結果出爐。\\n\\nTrust label: Single source — 所列兩個來源皆屬同一主管機關發布與稿鏈。\"},\"glossary\":[{\"term\":{\"en\":\"Satellite collar\",\"zh-TW\":\"衛星頸圈\"},\"blurb\":{\"en\":\"A tracking collar that transmits wildlife location and movement signals via satellite.\",\"zh-TW\":\"透過衛星傳送野生動物位置與活動訊號的追蹤裝置。\"}},{\"term\":{\"en\":\"Necropsy\",\"zh-TW\":\"病理解剖\"},\"blurb\":{\"en\":\"Post-mortem examination of an animal body to determine the cause of death.\",\"zh-TW\":\"對動物遺體進行的解剖與病理檢查，用以釐清死因。\"}},{\"term\":{\"en\":\"Mortality signal\",\"zh-TW\":\"死亡訊號\"},\"blurb\":{\"en\":\"An alert triggered by a tracking device after prolonged lack of movement.\",\"zh-TW\":\"追蹤裝置在偵測到長時間靜止後發出的警示訊號。\"}}],\"sources\":[{\"name\":\"信吉衛視\",\"url\":\"https://www.sjtv.com.tw/articles/127698?lang=en\"},{\"name\":\"商傳媒\",\"url\":\"http://sunmedia.tw/news/collaborative/61y1WYZxLcfCO86A8I5yFRvK6wLSxYeB7Wykku3cbs4WnM3clZOcPqfAypp98\"}],\"imageUrl\":\"/covers/live/live-taiwan-466-bagan-formosan-black-bear-death.jpg\",\"imageAlt\":{\"en\":\"Formosan Black Bear Bagan Found Dead Two Weeks After Release, Human Harm Preliminarily Ruled Out\",\"zh-TW\":\"台灣黑熊「芭甘」野放兩週後死亡，初步排除人為因素\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":58,\"trustBreakdown\":{\"crossCorroboration\":12,\"outletReputation\":16,\"recency
