hy it matters\nSuccession is the question every dominant company eventually faces, and it matters more when the chief executive is as closely identified with the company as Huang is with Nvidia. A scandal puts the question on the table sooner than any board would like, and investors watch closely for any sign of a plan. Even an unscientific list frames the debate about who could plausibly run the world's most valuable chip company.\nSources agree / disagree\nOnly TechCrunch has published this list, and the outlet itself flags it as highly unscientific. Trust label: Single source — only TechCrunch has reported this list, which the outlet presents as speculation.\nStill uncertain\nThe candidates themselves are not named in the available summary, and neither Nvidia nor its board has said anything about succession in this reporting. What exactly has put Huang 'in hot water' is not spelled out in the TechCrunch summary either; check the full article for the list and its context."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-tech-02-who-could-replace-jensen\",\"category\":\"tech\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-tech-02-who-could-replace-jensen.png\",\"imageAlt\":{\"en\":\"Cover related to: Who could replace Nvidia CEO Jensen Huang?\",\"zh-TW\":\"相關封面圖：誰能接替輝達執行長黃仁勳？\"},\"publishedAt\":\"2026-11-12T03:13:10.000Z\",\"title\":{\"en\":\"Nvidia Has No Succession Plan: Who Could Replace Jensen Huang?\",\"zh-TW\":\"輝達（Nvidia）無接班計畫：誰能接替黃仁勳（Jensen Huang）？\"},\"summary\":{\"en\":\"［未證實·單一來源］TechCrunch says Nvidia has no succession plan and its CEO Jensen Huang is in hot water, so the outlet drafted a shortlist of possible successors. The list is openly 'highly unscientific' — editorial speculation, not insider reporting. Watch whether Nvidia or its board addresses succession planning.\",\"zh-TW\":\"［未證實·單一來源］TechCrunch 指出，輝達（Nvidia）沒有接班計畫，執行長黃仁勳（Jensen Huang）又捲入醜聞，於是該媒體列出一份接班人選名單。名單明言「高度不科學」，只是編輯部的推測遊戲，並非公司內部消息。接下來看輝達是否回應接班問題，或董事會是否釋出任何安排。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"輝達（Nvidia）沒有接班計畫，執行長黃仁勳（Jensen Huang）又捲入醜聞——TechCrunch 乾脆自己列了一份接班人選名單。\\n發生了什麼事\\nTechCrunch 11 月 11 日刊文，問誰能接替黃仁勳，並明言這份接班人選名單「高度不科學」。文章的前提很直白：輝達沒有接班計畫，執行長又陷入困境，於是編輯部自行擬了一份名單。摘要未列出名單上的具體人選，這篇文章屬於編輯部的推測，而非來自公司內部的消息。\\n為什麼重要\\n接班問題是每家龍頭企業遲早要面對的考題，執行長與公司的連結越深，問題就越關鍵。醜聞讓這道題目提前浮上檯面，投資人也在看董事會是否有任何安排。即使名單並不科學，它也框出了「誰有資格掌管全球最有價值的晶片公司」這場辯論。\\n來源異同\\n目前僅 TechCrunch 一家刊出這份名單，該媒體自己也標明名單「高度不科學」。信任標籤：單一來源——目前僅 TechCrunch 報導這份名單，且屬該媒體的推測。\\n仍不確定\\n摘要未列出名單上的具體人選，輝達與董事會也未在報導中對接班問題表態。黃仁勳「陷入困境」的具體所指，摘要同樣沒有說明；名單與背景請查閱原文。\"},\"sources\":[{\"name\":\"TechCrunch\",\"url\":\"https://techcrunch.com/2026/11/11/who-could-replace-jensen-huang-a-highly-unscientific-list-of-possible-successors/\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":18,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"tech\",\"live-ingest\",\"techcrunch\"],\"glossary\":[{\"term\":{\"en\":\"Nvidia\",\"zh-TW\":\"輝達（Nvidia）\"},\"blurb\":{\"en\":\"The chipmaker led by Jensen Huang, dominant in AI hardware.\",\"zh-TW\":\"由黃仁勳領導的晶片大廠，在 AI 硬體居主導地位。\"}},{\"term\":{\"en\":\"Jensen Huang\",\"zh-TW\":\"黃仁勳（Jensen Huang）\"},\"blurb\":{\"en\":\"Nvidia's co-founder and chief executive.\",\"zh-TW\":\"輝達共同創辦人兼執行長。\"}},{\"term\":{\"en\":\"succession plan\",\"zh-TW\":\"接班計畫\"},\"blurb\":{\"en\":\"A company's prepared arrangement for replacing its chief executive.\",\"zh-TW\":\"企業為接替執行長預先做的安排。\"}},{\"term\":{\"en\":\"TechCrunch\",\"zh-TW\":\"TechCrunch\"},\"blurb\":{\"en\":\"A technology news outlet and the source of this list.\",\"zh-TW\":\"科技新聞媒體，本次名單的來源。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Mul
