ned\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"id\",\"live-international-11-assam-kaziranga-bus-crash\",\"d\"],[\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$L2\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L3\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[\"__PAGE__\",[\"$\",\"$1\",\"c\",{\"children\":[\"$L4\",null,[\"$\",\"$L5\",null,{\"children\":[\"$L6\",[\"$\",\"$L7\",null,{\"promise\":\"$@8\"}]]}]]}],{},null,false]},null,false]},null,false]},null,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[[\"$\",\"$L9\",null,{\"children\":\"$La\"}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]],[\"$\",\"$Lb\",null,{\"children\":[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$c\",null,{\"fallback\":null,\"children\":\"$Ld\"}]}]}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$e\",[]],\"s\":false,\"S\":true}\n"])</script><script>self.__next_f.push([1,"f:I[8587,[\"619\",\"static/chunks/619-ba102abea3e3d0e4.js\",\"683\",\"static/chunks/683-79ba81592d27b8d5.js\",\"954\",\"static/chunks/app/story/%5Bid%5D/page-1edab3740c901284.js\"],\"default\"]\n10:Td6b,"])</script><script>self.__next_f.push([1,"What happened\nA passenger minibus carrying around 30 people, many of them college students headed home, collided head-on with a container truck on National Highway 715 at Rangajan, near the Hathikuli Tea Estate in Assam's Golaghat district, on Friday, November 13. The minibus was travelling from Golaghat toward Nagaon; the truck was heading toward Upper Assam. The highway skirts Kaziranga National Park, a UNESCO World Heritage site known for its one-horned rhinoceroses. The death toll rose through the night as injured passengers died in hospital: Golaghat police superintendent Swapnaneel Deka first confirmed 23 deaths to Reuters, and by Saturday officials put the toll at 26. Rural development minister Atul Bora said the dead included 14 women and 12 men, among them a minor; 24 of the victims had been identified by Saturday, with two still unidentified. Education Minister Ranoj Pegu said 18 people remained injured, seven of them in critical condition in intensive care at Jorhat Medical College Hospital.\n\nWhy it matters\nTwenty-six deaths make this one of India's deadliest road crashes this year, and it happened on a corridor where the danger was documented in advance: a district transport official told PTI the same minibus had repeated overspeeding violations along the Kaziranga stretch and had been fined in March for driving at 102 km/h. Police say the bus was travelling at very high speed in violation of restrictions imposed near the park, and dashcam footage reportedly shows it veering into the truck's lane. The crash has turned a local enforcement failure into a state-level accountability question.\n\nSources agree / disagree\nReuters, AP, PTI and the BBC all describe the same head-on collision, location and timeline. The toll figures differ only as sequential updates of the same count - 23 (Reuters, Friday police count), 24 (AP) and 26 (PTI, confirmed by officials on Saturday) - and are presented here in that order rather than as competing claims. The injured count is given as 20 by PTI-based reports, while The Hindu, citing the education minister, reported 18 still hospitalised on Saturday; the figures cover different moments and definitions. Compensation is consistently reported: Assam Chief Minister Himanta Biswa Sarma, who visited the site on Saturday, announced 900,000 rupees for each bereaved family - 500,000 from the Chief Minister's Relief Fund, 200,000 from the state disaster fund and 200,000 from Prime Minister Narendra Modi's national relief fund - plus 50,000 rupees for each injured person. President Droupadi Murmu and Prime Minister Modi were among the national leaders who condoled the deaths.\n\nStill uncertain\nThe cause is not established. Police suspect overspeeding and loss of control; the chief minister said the possibility that the minibus driver suffered a stroke could not be ruled out, while stressing no medical cause has been confirmed. A detailed investigation is under way, and Sarma has promised it will look at every possible cause and that road checks on the corridor will be strengthened. The toll could still change while seven of the injured remain in critical condition.\n\nTrust label: Multi-source agreement - Reuters, AP and PTI reporting converge on the event, location and final toll of 26; the only open item is the cause, which officials say is still under investigation.\n\nLinked sources (outlet names only): Reuters, Press Trust of India, The Hindu"])</script><script>self.__next_f.push([1,"11:Ta1a,"])</script><script>self.__next_f.push([1,"發生了什麼事\n印度東北部阿薩姆邦（Assam）11 月 13 日（週五）發生重大車禍：一輛載著約 30 人的小巴——乘客多為返家的大學生——在國道 715 號戈拉加特縣（Golaghat）蘭加詹（Rangajan）、哈提庫利茶園（Hathikuli Tea Estate）附近，與一輛對向貨櫃車迎頭相撞。小巴由戈拉加特開往納岡（Nagaon），貨櫃車則往上阿薩姆方向行駛；事發路段緊鄰以獨角犀聞名的卡齊蘭加國家公園（Kaziranga National Park，聯合國教科文組織世界遺產）。死亡人數隨傷者陸續不治攀升：戈拉加特縣警長德卡（Swapnaneel Deka）先向路透證實 23 死，至週六官員確認增至 26 死。邦鄉村發展部長波拉（Atul Bora）表示死者含 14 名女性與 12 名男性、其中一人未成年；截至週六 24 人身分已確認、2 人待查。教育部長佩古（Ranoj Pegu）表示仍有 18 人住院，其中 7 人在久爾哈特醫學院醫院（Jorhat Medical College Hospital）加護病房命危。\n\n為什麼重要\n26 死是印度今年最嚴重的道路事故之一，而且危險早有紀錄：縣交通官員向印度新聞信託社（PTI）透露，這輛小巴在卡齊蘭加路段有多次超速違規紀錄，今年 3 月曾因時速 102 公里被罰。警方指小巴當時在國家公園限速路段高速行駛，行車紀錄器畫面顯示它偏入貨櫃車道。一場本可預防的執法漏洞，就此燒成邦級問責問題。\n\n來源異同\n路透、美聯社、PTI 與 BBC 對事故本身、地點與時間線說法一致。死亡數字 23（路透，週五警方數字）、24（美聯社）、26（PTI，週六官員確認）是同一計數的先後更新，本文依序並列、不作衝突處理。傷者人數 PTI 系報導為 20 人，《印度教徒報》（The Hindu）引教育部長說法為週六仍住院 18 人，兩者時間點與定義不同。撫卹金額各源一致：邦長薩爾馬（Himanta Biswa Sarma）週六親赴現場，宣布每名罹難者家屬可獲 90 萬盧比——邦長救濟基金 50 萬、邦災害基金 20 萬、總理莫迪（Narendra Modi）的國家救濟基金 20 萬——傷者每人另獲 5 萬盧比；總統穆爾穆（Droupadi Murmu）與莫迪皆公開致哀。\n\n仍不確定\n肇因尚未定論：警方懷疑超速失控；邦長稱不能排除小巴司機駕駛中中風的可能，但強調尚無醫學證據證實。官方已展開詳細調查，薩爾馬承諾查明所有可能原因並加強該路段路檢。7 名傷者仍命危，死亡人數不排除再變。"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"adult\":false,\"body\":{\"en\":\"$10\",\"zh-TW\":\"$11\"},\"category\":\"international\",\"disagreements\":null,\"glossary\":[{\"term\":{\"en\":\"Kaziranga National Park\",\"zh-TW\":\"卡齊蘭加國家公園（Kaziranga National Park）\"},\"blurb\":{\"en\":\"UNESCO World Heritage site in Assam famous for one-horned rhinoceroses; the crash highway skirts the park.\",\"zh-TW\":\"位於阿薩姆邦的世界遺產，以獨角犀聞名；事發國道緊鄰園區。\"}},{\"term\":{\"en\":\"Himanta Biswa Sarma\",\"zh-TW\":\"薩爾馬（Himanta Biswa Sarma）\"},\"blurb\":{\"en\":\"Chief minister of Assam; visited the crash site and announced the compensation package.\",\"zh-TW\":\"阿薩姆邦長，親赴事故現場並宣布撫卹方案。\"}},{\"term\":{\"en\":\"Press Trust of India (PTI)\",\"zh-TW\":\"印度新聞信託社（PTI）\"},\"blurb\":{\"en\":\"India's largest news agency; its reporting carried the officials' confirmed toll of 26.\",\"zh-TW\":\"印度最大通訊社，26 死的官員確認數字由其報導。\"}},{\"term\":{\"en\":\"Swapnaneel Deka\",\"zh-TW\":\"德卡（Swapnaneel Deka）\"},\"blurb\":{\"en\":\"Senior superintendent of police of Golaghat district, who gave the first confirmed toll to Reuters.\",\"zh-TW\":\"戈拉加特縣警長，向路透給出第一個確認死亡數字。\"}},{\"term\":{\"en\":\"ex gratia\",\"zh-TW\":\"撫卹金（ex gratia）\"},\"blurb\":{\"en\":\"One-off government compensation payment to victims' families; here 900,000 rupees per deceased, pooled from state and central funds.\",\"zh-TW\":\"政府一次性發給罹難者家屬的補償；本案每名死者 90 萬盧比，由邦與中央基金合併支應。\"}}],\"id\":\"live-international-11-assam-kaziranga-bus-crash\",\"imageAlt\":{\"en\":\"\",\"zh-TW\":\"\"},\"imageUrl\":\"\",\"isHeadline\":true,\"isPopular\":true,\"publishedAt\":\"2026-11-14T17:32:08.000Z\",\"sources\":[{\"name\":\"Reuters\",\"url\":\"https://www.reuters.com/world/india/truck-bus-collision-indias-assam-kills-least-23-people-2026-11-13/\"},{\"name\":\"Connected to India\",\"url\":\"https://www.connectedtoindia.com/assam-bus-truck-crash-kills-26-near-kaziranga-national-park-cm-vows-to-fortify-road-checks/\"},{\"name\":\"The Daily Jagran\",\"url\":\"https://www.thedailyjagran.com/india/news/assam-kaziranga-bus-truck-accident-latest-updates-death-injured-dashcam-video-cm-himanta-sarma-pm-modi-exgratia-10336241\"}],\"summary\":{\"en\":\"A minibus carrying around 30 people, many of them college students, rammed head-on into a container truck on the highway skirting Kaziranga National Park in Assam on November 13. The toll rose from 23 to a confirmed 26 by Saturday, with 18 injured and seven critical. The bus had a record of overspeeding fines on the same corridor; Chief Minister Sarma visited the site, announced 900,000 rupees per bereaved family and ordered a full investigation.\",\"zh-TW\":\"一輛載約 30 人、多為返家大學生的小巴，11 月 13 日在印度阿薩姆邦卡齊蘭加國家公園旁的國道上迎頭撞上貨櫃車。死亡人數由 23 升至週六官員確認的 26 人，另 18 人受傷、7 人命危。該小巴在同一路段有多次超速罰單紀錄；邦長薩爾馬親赴現場，宣布每名罹難者家屬獲 90 萬盧比撫卹並下令全面調查。\"},\"tags\":[],\"title\":{\"en\":\"Assam Minibus Rams Truck Near Kaziranga Park: Toll Confirmed at 26\",\"zh-TW\":\"阿薩姆小巴撞貨櫃車 26 死：卡齊蘭加公園旁國道迎頭相撞\"},\"trustBreakdown\":{\"crossCorroboration\":23,\"outletReputation\":24,\"recencyClarity\":18,\"sourceDiversity\":15},\"trustScore\":80}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-international-11-assam-kaziranga-bus-crash/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagre
