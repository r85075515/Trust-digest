osition bloc is close to a governing majority.\nWhat happened\nTurnout reached its highest in over two decades in a tense national vote framed as a choice between increasingly strident hard-right views and hopes for a diverse land, with the outcome expected to shape the country's identity for years. Exit polls put both Netanyahu's alliance and Eisenkot's bloc well short of the seats needed to govern. Projections show opposition parties winning more seats than Netanyahu's coalition, which could set up a change of government — but without a majority of their own, the result points to weeks of negotiations. Nick Schifrin reports for PBS NewsHour.\nWhy it matters\nA record vote that produces no majority is a verdict and a deadlock at once. Voters turned out to decide the country's direction after war, and the arithmetic says no camp gets to decide alone. The negotiation that follows — who trades what for a coalition — will determine the postwar direction more concretely than any campaign slogan did.\nSources agree-disagree\nNPR, NYT, CNBC, PBS NewsHour, Axios, and the Financial Times agree there is no clear winner, but the snippets carry conflicting figures (7 versus 61 in headlines and summaries) without stating what those numbers measure, so they cannot be reconciled here. ⚠ Conflicting accounts, unconfirmed — the seat projections differ across outlets and the feed material does not give a comparable basis. Trust label: accounts differ — agreement on the deadlock, disagreement on the numbers.\nStill uncertain\nFinal seat counts, the exact turnout figure, and who will form a government are all unresolved in the snippets. The missing information is the coalition math itself: which parties clear the threshold, and what price each demands for joining."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-01-in-israel-s-election-it-\",\"category\":\"international\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-international-01-in-israel-s-election-it-.jpg\",\"imageAlt\":{\"en\":\"Cover related to: In Israel’s Election, It’s Nationalism vs. Founding Ideals\",\"zh-TW\":\"相關封面圖：以色列選舉中，民族主義與建國理想之爭\"},\"publishedAt\":\"2026-10-28T05:17:20.000Z\",\"title\":{\"en\":\"Netanyahu's bloc and Eisenkot's rivals both fall short in record-turnout Israel election\",\"zh-TW\":\"納坦雅胡（Benjamin Netanyahu）與艾森科特（Gadi Eisenkot）陣營皆未過半，以色列創紀錄投票率選出僵局\"},\"summary\":{\"en\":\"Israelis turned out in their highest numbers in over two decades for their first election since the October 7 attacks and the Gaza war, but exit polls and projections show no clear winner: neither Prime Minister Benjamin Netanyahu's alliance nor Gadi Eisenkot's opposition bloc reaches a governing majority. The takeaway: a record vote produced a negotiation, not a mandate.\",\"zh-TW\":\"以色列人以 20 多年來最高投票率，投下 10 月 7 日襲擊與加薩戰爭以來的首次選舉，但出口民調與預測都顯示沒有明顯贏家：總理納坦雅胡（Benjamin Netanyahu）的聯盟與艾森科特（Gadi Eisenkot）的反對陣營都未達執政多數。結論：創紀錄的一票投出的不是授權，而是談判。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"以色列人以 20 多年來最高的投票率，投下 10 月 7 日襲擊與加薩戰爭以來的首次選舉——結果卻沒有贏家：總理納坦雅胡（Benjamin Netanyahu）的聯盟與艾森科特（Gadi Eisenkot）的反對陣營都遠未達到執政多數。\\n發生了什麼事\\n這場緊張的全國投票被定位為一場選擇：日益強硬的極右觀點，對上對多元土地的期待，結果可能在未來幾年形塑國家的認同。出口民調顯示，納坦雅胡的聯盟與艾森科特的陣營都遠低於組閣所需的席次。預測顯示反對黨贏得的席次多於納坦雅胡領導的聯盟，可能為政府更迭鋪路——但反對陣營自己也沒有多數，結果指向數週的談判。PBS NewsHour 的尼克·希夫林（Nick Schifrin）報導了這一進展。\\n為什麼重要\\n一場創紀錄的投票同時投出了裁決與僵局。選民在戰後出來決定國家方向，但席次算術說，沒有任何陣營可以單獨決定。接下來的談判——誰拿什麼換組閣——將比任何競選口號更具體地決定戰後走向。\\n來源異同\\nNPR、《紐約時報》、CNBC、PBS NewsHour、Axios、《金融時報》都同意沒有明顯贏家，但摘要層級出現了說法不一的數字（標題與摘要中的 7 與 61），卻沒有交代這些數字量的是什麼，無法在此對照。⚠ 說法衝突，尚未證實——各家席次預測不同，摘要未提供可比較的基準。信任標籤：敘述有分歧——僵局有共識，數字無共識。\\n仍不確定\\n最終席次、確切投票率數字、由誰組閣，摘要裡都還沒有。缺失的關鍵資訊就是組閣算術本身：哪些政黨跨過門檻、各自為入閣開出什麼價碼。\"},\"sources\":[{\"name\":\"NPR World\",\"url\":\"https://www.npr.org/2026/10/27/nx-s1-6019381/israel-elections\"},{\"name\":\"NYT World\",\"url\":\"https://www.nytimes.com/2026/10/27/world/middleeast/israel-election-identity.html\"},{\"name\":\"CNBC\",\"url\":\"https://www.cnbc.com/2026/10/28/israel-election-netanyahu-trump-gaza-.html\"},{\"name\":\"PBS NewsHour\",\"url\":\"https://www.pbs.org/newshour/show/projections-show-no-clear-winner-in-israels-election\"},{\"name\":\"Axios\",\"url\":\"https://www.axios.com/2026/10/27/netanyahu-eisenkot-israel-election-exit-polls\"},{\"name\":\"Financial Times\",\"url\":\"https://www.ft.com/content/4f122702-3765-4e9f-a94f-4b786bc2af15\"}],\"disagreements\":{\"en\":\"Figures differ across outlets (e.g. 7 vs 61 in headlines/snippets).\",\"zh-TW\":\"各家報導的數字有出入（標題／摘要層級出現 7 與 61 兩種數字），但摘要未交代數字所指為何，無法直接對照。\"},\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":25,\"outletReputation\":20,\"crossCorroboration\":17,\"recencyClarity\":25},\"tags\":[\"international\",\"live-ingest\",\"npr-world\",\"nyt-world\",\"cnbc\"],\"glossary\":[{\"term\":{\"en\":\"Benjamin Netanyahu\",\"zh-TW\":\"納坦雅胡\"},\"blurb\":{\"en\":\"Prime Minister of Israel and leader of the governing alliance.\",\"zh-TW\":\"以色列總理，執政聯盟領袖。\"}},{\"term\":{\"en\":\"Gadi Eisenkot\",\"zh-TW\":\"艾森科特\"},\"blurb\":{\"en\":\"Leader of Israel's opposition bloc.\",\"zh-TW\":\"以色列反對陣營領袖。\"}},{\"term\":{\"en\":\"exit poll\",\"zh-TW\":\"出口民調\"},\"blurb\":{\"en\":\"A survey of voters conducted on election day.\",\"zh-TW\":\"投票日當天對選民的抽樣調查。\"}},{\"term\":{\"en\":\"Gaza war\",\"zh-TW\":\"加薩戰爭\"},\"blurb\":{\"en\":\"The war in Gaza following the October 7 attacks.\",\"zh-TW\":\"10 月 7 日襲擊後爆發的加薩戰爭。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":
