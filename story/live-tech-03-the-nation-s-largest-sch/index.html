w York Times, Google said it will disable Search for schools that opt out of its AI features. Starting next year, schools will not have the option to disable Gemini-powered features without also disabling Search. Schools in New York, Los Angeles and Chicago are considering alternatives to Google, and Chris Phillips, Google's vice president of education, explained the policy to the Times.\n\nWhy it matters\nSearch is a basic classroom tool, so tying it to AI features forces districts into an all-or-nothing choice: accept AI in schools or give up Search too. What the country's largest districts decide will shape whether smaller districts follow.\n\nSources agree / disagree\nThis is a single-outlet item from The Verge, reporting on The New York Times, so both the policy details and the districts' deliberations rest on that one chain of reporting, with no second outlet to cross-check.\n\nStill uncertain\nThe feed material names no alternative products, gives no decision timeline for the districts, and does not carry Phillips's full remarks, so the policy's details and the districts' final calls remain to be confirmed.\n\nTrust label: Single source — One outlet reporting on The New York Times; not yet corroborated elsewhere."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-tech-03-the-nation-s-largest-sch\",\"category\":\"tech\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-tech-03-the-nation-s-largest-sch.jpg\",\"imageAlt\":{\"en\":\"Cover related to: The nation’s largest school districts consider ditching Google Search\",\"zh-TW\":\"相關封面圖：美國最大的學區考慮放棄 Google 搜索\"},\"publishedAt\":\"2026-11-18T23:18:35.000Z\",\"title\":{\"en\":\"Google Ties Search to AI Features as Largest US School Districts Consider Alternatives\",\"zh-TW\":\"谷歌（Google）綁定 AI 功能，紐約、洛杉磯、芝加哥大學區考慮棄用搜尋\"},\"summary\":{\"en\":\"[Unconfirmed · Single source] Google will disable Search for schools that opt out of its AI features, and from next year schools cannot switch off Gemini-powered features without also losing Search. New York, Los Angeles and Chicago are among the largest US districts weighing alternatives. Watch whether districts follow through or Google softens the terms.\",\"zh-TW\":\"［未證實·單一來源］谷歌（Google）表示，選擇停用 AI 功能的學校將同步失去搜尋功能，明年起學校無法只關 Gemini 功能而不關搜尋。紐約、洛杉磯與芝加哥等全美最大學區正在考慮替代方案。谷歌（Google）教育副總裁克里斯·菲利普斯（Chris Phillips）向《紐約時報》說明這項政策，接下來看各大學區是否真的出走。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"谷歌（Google）明年起不再讓學校只關 AI 功能、保留搜尋，全美最大的幾個學區正在考慮出走。\\n\\n發生了什麼事\\n根據《紐約時報》報導，谷歌（Google）表示選擇停用 AI 功能的學校將同步失去搜尋功能；明年起學校無法在不停用搜尋的情況下停用 Gemini 功能。紐約、洛杉磯與芝加哥的學校正在考慮谷歌（Google）的替代方案。谷歌（Google）教育副總裁克里斯·菲利普斯（Chris Phillips）向《紐約時報》說明這項政策。\\n\\n為什麼重要\\n搜尋是學校日常教學的基本工具，把搜尋與 AI 功能綁在一起，等於逼學區二選一：要嘛接受 AI 功能進校園，要嘛連搜尋一起放棄，全美最大學區的動向會直接影響其他學區的跟進意願。\\n\\n來源異同\\n目前只有 The Verge 一家來源轉述《紐約時報》報導，政策內容與三大學區的動向都以這篇為準，沒有第二家媒體交叉比對。\\n\\n仍不確定\\n摘要素材未說明替代方案有哪些、學區何時決定，也未提供菲利普斯（Phillips）說明的完整內容，政策細節與學區的最終決定仍待追蹤。\"},\"sources\":[{\"name\":\"The Verge\",\"url\":\"https://www.theverge.com/ai-artificial-intelligence/1037151/school-districts-ditching-google\"}],\"disagreements\":null,\"trustScore\":54,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":17,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"tech\",\"live-ingest\",\"the-verge\"],\"glossary\":[{\"term\":{\"en\":\"Google\",\"zh-TW\":\"谷歌（Google）\"},\"blurb\":{\"en\":\"US technology company behind Search and Gemini.\",\"zh-TW\":\"搜尋與 Gemini 背後的美國科技公司。\"}},{\"term\":{\"en\":\"Gemini\",\"zh-TW\":\"Gemini\"},\"blurb\":{\"en\":\"Google's family of AI features and models.\",\"zh-TW\":\"谷歌的人工智慧功能系列。\"}},{\"term\":{\"en\":\"Chris Phillips\",\"zh-TW\":\"克里斯·菲利普斯（Chris Phillips）\"},\"blurb\":{\"en\":\"Google's vice president of education.\",\"zh-TW\":\"谷歌教育副總裁。\"}},{\"term\":{\"en\":\"The New York Times\",\"zh-TW\":\"紐約時報（The New York Times）\"},\"blurb\":{\"en\":\"US newspaper that first reported the policy.\",\"zh-TW\":\"率先報導這項政策的美國報紙。\"}},{\"term\":{\"en\":\"The Verge\",\"zh-TW\":\"The Verge\"},\"blurb\":{\"en\":\"US technology news outlet reporting on the story.\",\"zh-TW\":\"轉述報導的美國科技媒體。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-tech-03-the-nation-s-largest-sch/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-tech-03-the-nation-s-largest-sch/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"d:\"$8:metadata\"\n"])</script></body></html>
