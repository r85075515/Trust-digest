nity Alliance and two local claimants seeking USD 11 million in alleged lost property values from the City of Phoenix over Menlo Digital's 38-acre, five-building data center project near 48th Street and Thistle Landing Drive. Under Arizona law, the city has 60 days to respond before plaintiffs can file suit within 120 days.\n\nWhy it matters\nThe dispute highlights growing neighborhood pushback across the Phoenix metro area against hyperscale data center construction, focusing on industrial noise, utility strain, and municipal zoning transparency.\n\nSource differences\nKJZZ (\"Attorney plans to sue Phoenix over a controversial data center project in Ahwatukee\") quotes Ramirez alleging Phoenix skirted zoning hearing procedures and confirms the 60-day statutory response window. KTAR (\"Ahwatukee residents say Phoenix let data center dodge new rules, seek $11M\") details residents' claims that the city permitted the 38-acre project to bypass updated municipal data center regulations. Arizona Daily Independent (\"Neighborhood Sues Phoenix Over Ahwatukee Data Center\") identifies the developer as Menlo Digital and notes neighborhood complaints over noise and nuisance.\n\nStill uncertain\nHow the City of Phoenix will formally respond within the 60-day statutory period and whether construction schedules at the Menlo Digital MD-PHX1 campus will face court injunctions remain unresolved.\n\nTrust label: Multi-source agreement — KJZZ, KTAR, and Arizona Daily Independent corroborate the USD 11 million notice of claim, project location, and zoning dispute."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-arizona-297-ahwatukee-menlo-digital-data-center-claim\",\"category\":\"arizona\",\"title\":{\"en\":\"Ahwatukee Residents File USD 11 Million Claim Against Phoenix Over Menlo Digital Data Center\",\"zh-TW\":\"鳳凰城阿瓦圖基居民不滿 Menlo Digital 資料中心開發 向市府求償 1,100 萬美元\"},\"summary\":{\"en\":\"Members of the Ahwatukee Community Alliance filed an USD 11 million notice of claim against the City of Phoenix, alleging officials allowed Menlo Digital's five-building data center near 48th Street and Thistle Landing Drive to bypass updated zoning rules. Attorney Anthony Ramirez said a lawsuit will follow if Phoenix does not respond within 60 days.\",\"zh-TW\":\"亞利桑那州鳳凰城阿瓦圖基社區聯盟成員正式向鳳凰城市府提出 1,100 萬美元賠償通知書，指控市府容許 Menlo Digital 在第 48 街與 Thistle Landing 路口的五棟資料中心園區規避新版分區審查。代表律師安東尼・拉米雷斯（Anthony Ramirez）表示，若市府 60 天內未回應將提告。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」律師安東尼・拉米雷斯（Anthony Ramirez）代表鳳凰城南區「阿瓦圖基社區聯盟」（Ahwatukee Community Alliance）及兩名當地索賠人，向鳳凰城市政府遞交正式賠償通知書（Notice of Claim），針對開發商 Menlo Digital 位於第 48 街與 Thistle Landing 路口占地 38 英畝、共五棟建築的資料中心開發案，求償 1,100 萬美元房產價值減損。依亞利桑那州法定程序，市府須在 60 天內回覆，否則原告將於 120 天內正式提告。\\n\\n「為什麼重要」大鳳凰城地區近年因電力充沛與稅務優惠吸引大批超大規模資料中心進駐，本案反映住宅區鄰近工業級機房所引發的噪音、水電負荷與市政土地分區程序爭議正持續升溫。\\n\\n「來源異同」KJZZ（原文標題：\\\"Attorney plans to sue Phoenix over a controversial data center project in Ahwatukee\\\"）引述拉米雷斯質疑市府未經完整分區聽證即放行該案，並確認 60 天法定回覆期；KTAR（原文標題：\\\"Ahwatukee residents say Phoenix let data center dodge new rules, seek $11M\\\"）詳述居民指控市府讓該 38 英畝案場規避新版資料中心管制規範；Arizona Daily Independent（原文標題：\\\"Neighborhood Sues Phoenix Over Ahwatukee Data Center\\\"）則點明開發商為 Menlo Digital 並整理社區對噪音與鄰避效應的抗議。\\n\\n「仍不確定」鳳凰城市府在 60 天期限內將提出何種正式答辯，以及 Menlo Digital 旗下 MD-PHX1 園區施工進度是否會遭法院裁定暫停，仍有待後續發展。\\n\\nTrust label: Multi-source agreement — KJZZ、KTAR 與 Arizona Daily Independent 三家亞利桑那媒體均核實 1,100 萬美元賠償通知書、案場位置與土地分區爭議。\"},\"glossary\":[{\"term\":{\"en\":\"Notice of claim\",\"zh-TW\":\"行政賠償通知書\"},\"blurb\":{\"en\":\"A mandatory pre-lawsuit filing under Arizona law giving a public entity 60 days to review and settle a monetary claim before litigation.\",\"zh-TW\":\"依亞利桑那州法律規定，向政府機關提起民事求償訴訟前必須先遞交的書面通知，給予機關 60 天審查與和解期。\"}},{\"term\":{\"en\":\"Zoning hearing\",\"zh-TW\":\"土地分區聽證會\"},\"blurb\":{\"en\":\"A public municipal proceeding where officials and residents review land-use designations, variances, or site plan approvals.\",\"zh-TW\":\"市政府審理土地使用分區變更、容積調整或開發計畫許可前，開放利害關係人與居民陳述意見的公開程序。\"}},{\"term\":{\"en\":\"Hyperscale data center\",\"zh-TW\":\"超大規模資料中心\"},\"blurb\":{\"en\":\"A massive computing facility housing thousands of servers and high-capacity cooling systems to support cloud and AI workloads.\",\"zh-TW\":\"容納數千台以上伺服器與大型冷卻系統、專為雲端運算與人工智慧工作負載設計的超大型機房設施。\"}}],\"sources\":[{\"name\":\"KJZZ\",\"url\":\"https://www.kjzz.org/politics/2026-11-26/attorney-plans-to-sue-phoenix-over-a-controversial-data-center-project-in-ahwatukee\"},{\"name\":\"KTAR\",\"url\":\"https://ktar.com/arizona-news/ahwatukee-data-center-notice-of-claim-phoenix\"},{\"name\":\"Arizona Daily Independent\",\"url\":\"https://arizonadailyindependent.com/2026/11/23/neighborhood-sues-phoenix-over-ahwatukee-data-center/\"}],\"imageUrl\":\"/covers/live/live-arizona-297-ahwatukee-menlo-digital-data-center-claim.png\",\"imageAlt\":{\"en\":\"Ahwatukee Residents File USD 11 Million Claim Against Phoenix Over Menlo Digital Data Center\",\"zh-TW\":\"鳳凰城阿瓦圖基居民不滿 Menlo Digital 資料中心開發 向市府求償 1,100 萬美元\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":85,\"trustBreakdown\":{\"crossCorroboration\":22,\"outletReputation\":21,\"recencyClarity\":21,\"sourceDiversity\":21},\"publishedAt\":\"2026-11-28T01:07:55.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":22,\"D2\":21,\"D3\":21,\"D4\":21,\"D5\":21,\"total\":21},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-arizona-297-ahwat
