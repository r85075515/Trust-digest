ain momentum on clean energy development. They also wanted to see countries re What happened\nUN’s COP31 Climate Conference Fizzles Out as Global Policy Divides Deepen. No one expected the 31st Conference of the Parties to be game-changing — from the start, everyone called it an “implementation” COP — but those gathered in Antalya, Turkey, hoped it would at least maintain momentum on clean energy development. They also wanted to see countries reaffirm their commitment to multilateral climate action amid heightened geopolitical tension. Instead, the talks collapse Countries could not find consensus on climate finance, fossil fuels and carbon capture. By Bob Berwyn ANTALYA, Turkey—By the time the United Nations COP31 climate talks ended Sunday afternoon, the conference center resembled a going-out-of-business sale at a pawnshop for broken dreams. Hunter Valley Operations expansion in New South Wales would allow additional 430m tonnes of coal to be extracted and burned Sign up for climate and environment editor Adam Morton’s free Clear Air newsletter here Climate campaigners are urging the Albanese government to heed a “line in the sand” warning on fossil fuels issued by dozens of countries at a UN climate summit and refuse a massive coalmi Countries at the Cop31 climate summit failed to reach a keystone agreement for the first time in 17 years. The talks, co-chaired by Turkey and Australia, were intended to produce a pact that would have injected urgency into climate action and financing for vulnerable states. Instead, the deal failed after a standoff over fossil fuels and support for countries exposed to the climate crisis. Guardia Why it matters\nThis cluster was assembled from 4 feed item(s) across 3 outlet(s) (Grist, Inside Climate News, The Guardian Climate Crisis) in the energy category. Axiom links out to each publisher; this digest only restates titles and short feed descriptions — not full articles. Sources agree / disagree\nMultiple outlets are covering clos 地緣政治緊張局勢加劇的情況下重申對多邊氣候行動的承諾。相反，談判破裂了，各國無法就氣候融資、化石燃料和碳捕獲達成共識。作者：Bob Berwyn 土耳其安塔利亞——聯合國 COP31 氣候談判週日下午結束時，會議中心就像是夢想破碎的當舖倒閉出售。獵人谷在新南威爾斯州的營運擴張將允許額外開採和燃燒 4.3 億噸煤炭。氣候活動人士敦促阿爾巴尼亞政府留意數十個國家在聯合國氣候峰會上發出的關於化石燃料的「沙中線」警告，並拒絕大規模煤炭開採。在第 31 屆締約方會議氣候高峰會上，各國未能達成一項關鍵協議，這是 17 年來的首次。此次會談由土耳其和澳洲共同主持，旨在達成協議，為氣候行動和脆弱國家的融資注入緊迫性。相反，在化石燃料和對受氣候危機影響的國家的支持問題上陷入僵局後，該協議失敗了。瓜迪亞 為什麼這很重要\\n此集群由能源類別中 3 個管道（Grist、內部氣候新聞、衛報氣候危機）的 4 個飼料項目組成。 Axiom 連結到每個出版商；該摘要僅重述標題和簡短的提要描述，而不是完整的文章。 消息來源同意/不同意\\n多家媒體報導了密切相關的頭條新聞：「COP31 如何成為氣候外交的『至暗時刻』」（Grist）；「隨著全球政策分歧加深，聯合國 COP31 氣候會議失敗」（氣候新聞內部）；「活動人士敦促阿爾巴尼亞政府在第 31 屆締約方會議之後拒絕『氣候炸彈衛報 煤礦」（Cop 31）談判「 31」；\\n不同媒體的數字有所不同（例如，標題/摘要中的數字為 50 比 17）。 仍不確定\\n摘要描述可以省略上下文、更新或更正。點擊連結的管道以獲取最新的完整報告。信任分數是啟發式的，而不是事實檢定的保證。 連結來源（僅限媒體名稱）：Grist、內部氣候新聞、衛報氣候危機\"},\"sources\":[{\"name\":\"Grist\",\"url\":\"https://grist.org/cop31/how-cop31-became-climate-diplomacys-darkest-moment/\"},{\"name\":\"Inside Climate News\",\"url\":\"https://insideclimatenews.org/news/22112026/uns-cop31-climate-conference-fizzles-out-as-global-policy-divides-deepen/\"},{\"name\":\"The Guardian Climate Crisis\",\"url\":\"https://www.theguardian.com/australia-news/2026/nov/24/campaigners-urge-albanese-government-to-reject-climate-bomb-coalmine-expansion-after-cop31\"}],\"disagreements\":{\"en\":\"Figures differ across outlets (e.g. 50 vs 17 in headlines/snippets).\",\"zh-TW\":\"不同媒體的數字有所不同（例如，標題/摘要中的數字為 50 比 17）。\"},\"trustScore\":78,\"trustBreakdown\":{\"sourceDiversity\":20,\"outletReputation\":19,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"energy\",\"live-ingest\",\"grist\",\"inside-climate-news\",\"the-guardian-climate-crisis\"]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"d
