e location — Biscayne Bay is a heavily used stretch of water off Miami — while the question that matters next is what investigators find about the cause.\nSources agree / disagree\nOnly CNA carries this story in the cluster, so the account has no cross-outlet check here. Trust label: Single source — one established news agency reporting the crash, with no corroborating coverage in this batch.\nStill uncertain\nThe cause of the crash is unknown, and the excerpt does not identify the victims, the helicopter's owner or operator, or whether an investigation has begun. Those are the facts that determine what happened; follow CNA's updates for the official findings."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-03-1-2\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-taiwan-03-1-2.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 邁阿密附近直升機墜海灣　釀1死2重傷\",\"zh-TW\":\"相關封面圖：邁阿密附近直升機墜海灣　釀1死2重傷\"},\"publishedAt\":\"2026-11-05T00:22:54.000Z\",\"title\":{\"en\":\"Helicopter Filming Boats Crashes Into Biscayne Bay Near Miami, Killing One\",\"zh-TW\":\"邁阿密比斯肯灣（Biscayne Bay）直升機墜海，拍攝船隻時釀 1 死 2 重傷\"},\"summary\":{\"en\":\"A helicopter filming boats on the water crashed into Biscayne Bay near Miami, killing one man and seriously injuring two others, police said. The crash was reported by CNA from Miami on November 4. The takeaway: a routine filming flight ended in a fatal accident — the cause is still unknown.\",\"zh-TW\":\"警方表示，一架正在拍攝水上船隻的直升機在邁阿密附近墜入比斯肯灣（Biscayne Bay），造成一名男子喪生、另兩人重傷。中央社（CNA）11 月 4 日自邁阿密報導此事。結論是：一趟例行的拍攝飛行以致命事故收場，墜機原因仍不明。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"警方表示，一架正在拍攝水上船隻的直升機在邁阿密附近墜入比斯肯灣（Biscayne Bay），造成一名男子喪生、另兩人重傷。\\n發生了什麼事\\n中央社（CNA）11 月 4 日自邁阿密報導，這架直升機在水上拍攝船隻的任務中墜入比斯肯灣。一名男子喪生，另兩人重傷。來源摘要沒有更多細節——沒有直升機營運者、機上人數（除傷亡者外），也沒有墜機前一刻發生了什麼。\\n為什麼重要\\n結論很直接：一趟例行的空中拍攝工作，在邁阿密繁忙的休閒水域變成致命事故。對讀者而言，眼前重要的是傷亡數字與地點——比斯肯灣是邁阿密外海使用頻繁的水域——而接下來關鍵的問題是調查人員對墜機原因的發現。\\n來源異同\\n這個集群只有中央社一家報導，本批無法跨媒體核對。信任標籤：僅1源——一家主流通訊社報導墜機事故，本批沒有其他佐證報導。\\n仍不確定\\n墜機原因不明，摘要也沒有交代罹難者身分、直升機所有人或營運者，以及調查是否已經展開。這些才是決定事件經過的事實；官方調查結果請追蹤中央社後續報導。\"},\"sources\":[{\"name\":\"中央社-國際\",\"url\":\"https://www.cna.com.tw/news/aopl/202611050022.aspx\"}],\"disagreements\":null,\"trustScore\":59,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"中央社-國際\"],\"glossary\":[{\"term\":{\"en\":\"Biscayne Bay\",\"zh-TW\":\"比斯肯灣\"},\"blurb\":{\"en\":\"Bay off Miami where the helicopter crashed.\",\"zh-TW\":\"直升機墜落的邁阿密外海海灣。\"}},{\"term\":{\"en\":\"Miami\",\"zh-TW\":\"邁阿密\"},\"blurb\":{\"en\":\"Florida city near the crash site.\",\"zh-TW\":\"墜機地點附近的佛羅里達城市。\"}},{\"term\":{\"en\":\"CNA\",\"zh-TW\":\"中央社\"},\"blurb\":{\"en\":\"Central News Agency, Taiwan's national news agency and the sole source here.\",\"zh-TW\":\"中央通訊社，台灣的國家通訊社，本則唯一來源。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-taiwan-03-1-2/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-taiwan-03-1-2/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content
