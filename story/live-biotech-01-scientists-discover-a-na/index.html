from several damaging effects of a high-salt diet.\nWhat happened\nMice given the LPC70 supplement had lower blood pressure, better memory, and improved social interactions compared with mice consuming excess salt, according to the ScienceDaily item. The same feed cluster carries two unrelated ScienceDaily items: one on a surprising difference in how male and female skin repairs itself — researchers tracked individual skin stem cells in living mice for five months and found female cells work together in a highly coordinated way, driven by sex hormones, which helps explain why wounds heal faster in female mice — and one on a newly discovered two-way relationship between sleep and growth hormone, showing how the brain balances physical recovery with wakefulness, with possible implications for metabolism, brain health and future treatments for sleep and neurological disorders.\nWhy it matters\nThe salt finding widens the stakes of a high-sodium diet from cardiovascular risk to cognition and behavior — and points to a dietary compound as a potential protective lever. The skin and sleep items matter in their own right: sex-aware healing biology and the sleep–hormone loop are both active frontiers with direct treatment implications.\nSources agree / disagree\nAll three items come from a single outlet, ScienceDaily's health and medicine desk; they are separate studies, not corroborating reports, and there are no conflicts between them.\nStill uncertain\nThese are mouse studies reported in truncated feed snippets — whether LPC70's protection translates to humans, and the clinical path for the skin and sleep findings, are all unaddressed in the feed."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-biotech-01-scientists-discover-a-na\",\"category\":\"biotech\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-biotech-01-scientists-discover-a-na.webp\",\"imageAlt\":{\"en\":\"Cover related to: Scientists discover a natural compound that could protect the brain from too much salt\",\"zh-TW\":\"相關封面圖：科學家發現一種天然化合物可以保護大腦免受過多鹽的影響\"},\"publishedAt\":\"2026-10-18T13:46:34.000Z\",\"title\":{\"en\":\"Scientists discover a natural compound that could protect the brain from too much salt\",\"zh-TW\":\"科學家發現一種天然化合物可以保護大腦免受過多鹽的影響\"},\"summary\":{\"en\":\"Japanese researchers found that a soy-derived compound called LPC70 helped protect mice from several damaging effects of a high-salt diet — lower blood pressure, better memory and improved social behavior. The same ScienceDaily cluster also covers sex differences in skin healing and a sleep–growth-hormone link.\",\"zh-TW\":\"日本研究人員發現，大豆衍生化合物 LPC70 有助保護小鼠免受高鹽飲食的多種傷害：血壓較低、記憶較好、社交行為改善。同一批 ScienceDaily 消息還談了皮膚修復的性別差異，以及睡眠與生長激素的關聯。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"吃太多鹽不只升高血壓，還可能損害記憶與社交行為。在一項新研究中，日本研究人員發現大豆衍生化合物 LPC70 有助保護小鼠免受高鹽飲食的多種傷害。\\n發生了什麼事\\n據 ScienceDaily 報導，與攝取過量鹽分的小鼠相比，補充 LPC70 的小鼠血壓較低、記憶較好，社交互動也有改善。同一批來源還有兩則不相關的 ScienceDaily 消息：一是男女皮膚修復方式的驚人差異——研究人員在活體小鼠身上追蹤個別皮膚幹細胞五個月，發現雌性細胞以高度協調的方式協同工作，受性激素驅動，這有助解釋為何雌性小鼠傷口癒合較快；二是睡眠與生長激素之間新發現的雙向關係，顯示大腦如何精細平衡身體修復與清醒，可能有助解釋熬夜為何傷害代謝與腦健康，並為睡眠與神經疾病的新療法開門。\\n為什麼重要\\n鹽的發現把高鈉飲食的風險從心血管擴大到認知與行為，也指向一種飲食化合物可能成為保護手段。皮膚與睡眠兩則各有分量：具性別意識的癒合生物學、睡眠—激素迴路，都是有直接治療意涵的活躍前沿。\\n來源異同\\n三則都來自同一家：ScienceDaily 健康醫學版；是三項各自獨立的研究，互不佐證，也無衝突。\\n仍不確定\\n這些都是小鼠研究，且來源摘要多處截斷：LPC70 的保護作用能否轉譯到人類，皮膚與睡眠發現的臨床路徑為何，摘要都沒談。\"},\"sources\":[{\"name\":\"ScienceDaily 健康醫學\",\"url\":\"https://www.sciencedaily.com/releases/2026/10/261017230032.htm\"}],\"disagreements\":null,\"trustScore\":54,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":17,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"biotech\",\"live-ingest\",\"sciencedaily-健康醫學\",\"sciencedaily-健康醫學\",\"sciencedaily-健康醫學\"],\"glossary\":[{\"term\":{\"en\":\"LPC70\",\"zh-TW\":\"LPC70\"},\"blurb\":{\"en\":\"Soy-derived compound that protected mice from high-salt diet effects in the study.\",\"zh-TW\":\"大豆衍生化合物，在研究中保護小鼠免受高鹽飲食傷害。\"}},{\"term\":{\"en\":\"ScienceDaily\",\"zh-TW\":\"ScienceDaily\"},\"blurb\":{\"en\":\"Science news site; its health and medicine desk is the cluster's sole outlet.\",\"zh-TW\":\"科學新聞網站；其健康醫學版是這批消息的唯一出處。\"}},{\"term\":{\"en\":\"Japanese researchers\",\"zh-TW\":\"日本研究團隊\"},\"blurb\":{\"en\":\"Research team behind the LPC70 high-salt-diet mouse study.\",\"zh-TW\":\"LPC70 高鹽飲食小鼠研究背後的研究團隊。\"}},{\"term\":{\"en\":\"growth hormone\",\"zh-TW\":\"生長激素\"},\"blurb\":{\"en\":\"Hormone newly linked to sleep in a two-way relationship.\",\"zh-TW\":\"與睡眠新發現雙向關聯的激素。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://r85075515.github.io/Trust-digest/\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"Axiom\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"zh_TW\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:locale:alternate\",\"content\":\"en_US\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"9\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"10\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"11\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN)
