r endorsement to Rogers over Democratic Senate nominee Abdul El-Sayed, withdrawing her support from the Democrat. A second, more tabloid-toned account describes her as begging the federal government for protection after infuriating Democrats by withdrawing support for El-Sayed and backing Rogers, and says she attributes the threats to her political reversal. Both accounts agree on the sequence: endorsement switch, threats reported, protection requested.\n\nWhy it matters\nDeath threats against an elected official over an endorsement cross from political disagreement into personal safety, and a request for Marshals protection signals that the threats were treated as serious. The case also shows the intensity of the Michigan Senate contest, where a Democratic congresswoman's endorsement of the Republican candidate was bound to provoke a strong reaction inside her own party. How authorities respond, and whether protection is granted, will indicate how such threats against lawmakers are handled during a heated campaign. The underlying political dispute, which candidate Stevens supports, remains separate from the safety question her request raises.\n\nSources agree / disagree\nTrust label: Two-source agreement — Two outlets report the same protection request and the same endorsement switch behind it, differing mainly in tone.\nOne account is a straight news report citing two senior administration officials, while the other uses more sensational language but confirms the same facts: the switch from El-Sayed to Rogers, the alleged death threats, and the request for federal protection. No source in the feed disputes that the request was made.\n\nStill uncertain\nThe snippets do not describe the content, number, or source of the alleged threats, and the word allegedly in one headline underlines that the threats themselves are Stevens's report to authorities rather than independently verified evidence. Whether the Marshals granted protection, and whether any investigation or arrest followed, is not stated. Reaction from Rogers, El-Sayed, or party leaders is also absent from the material provided."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-entertainment-02-haley-stevens-allegedly-\",\"category\":\"entertainment\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-entertainment-02-haley-stevens-allegedly-.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Haley Stevens Allegedly Receiving Death Threats, Asks U.S. Marshals For Protection\",\"zh-TW\":\"相關封面圖：海莉史蒂文斯據稱收到死亡威脅，請求美國法警提供保護\"},\"publishedAt\":\"2026-11-03T23:09:25.000Z\",\"title\":{\"en\":\"Haley Stevens requests United States Marshals protection after alleged death threats over endorsement switch\",\"zh-TW\":\"海莉・史蒂文斯（Haley Stevens）因改挺對手遭死亡威脅，請求美國法警（U.S. Marshals）保護\"},\"summary\":{\"en\":\"Michigan Representative Haley Stevens has requested United States Marshals protection after telling authorities she received death threats for endorsing Republican Mike Rogers in the state's contested Senate race, two outlets report. Stevens, a Democrat, had switched her endorsement on Sunday from Democratic nominee Abdul El-Sayed to Rogers.\",\"zh-TW\":\"密西根州（Michigan）眾議員海莉・史蒂文斯（Haley Stevens）向當局表示，因在該州參議院選戰中支持共和黨的邁克・羅傑斯（Mike Rogers）而收到死亡威脅，已請求美國法警（U.S. Marshals）提供保護。她原支持民主黨提名人阿卜杜勒・艾爾賽義德（Abdul El-Sayed），週日改挺羅傑斯。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"密西根州（Michigan）眾議員海莉・史蒂文斯（Haley Stevens）在出人意料地改挺共和黨參議院候選人後，通報收到死亡威脅，並請求聯邦提供保護。\\n\\n發生了什麼事\\n民主黨籍的史蒂文斯（Haley Stevens）告訴當局，她因在密西根州競爭激烈的參議院選舉中支持共和黨人邁克・羅傑斯（Mike Rogers）而收到死亡威脅，消息來源為兩名川普（Donald Trump）政府高層官員。她已請求美國法警（U.S. Marshals）提供保護。威脅發生在她週日出人意料的決定之後：她撤回對民主黨參議院提名人阿卜杜勒・艾爾賽義德（Abdul El-Sayed）的支持，改挺羅傑斯。另一則語氣較聳動的報導形容她在激怒民主黨人後向聯邦政府求助，並稱她將威脅歸因於這次政治轉向。兩則報導對事件順序說法一致：改挺、通報威脅、請求保護。\\n\\n為什麼重要\\n民選官員因表態支持而收到死亡威脅，已從政治分歧跨入人身安全問題，而請求法警保護顯示這些威脅被當作嚴重事件處理。此案也顯示密西根州參議院選戰的激烈程度：一位民主黨眾議員改挺共和黨候選人，必然在自家政黨內引發強烈反應。當局如何回應、是否核准保護，將顯示選戰白熱化期間針對國會議員的威脅如何被處理。至於史蒂文斯支持誰這個政治爭議本身，與她的請求所凸顯的安全問題是兩回事。\\n\\n來源異同\\n兩家媒體報導的是同一件保護請求與背後的改挺事件，主要差異在語氣。一家是引述兩名政府高層官員的正規新聞報導，另一家用語較聳動，但證實了相同事實：由艾爾賽義德（Abdul El-Sayed）改挺羅傑斯（Mike Rogers）、據稱的死亡威脅，以及向聯邦請求保護。摘要中沒有來源質疑請求已提出一事。\\n\\n仍不確定\\n摘要未描述據稱威脅的內容、數量或來源，而一則標題中的「據稱」也凸顯威脅本身是史蒂文斯向當局的通報，並非獨立驗證的證據。法警是否已核准保護、是否有後續調查或逮捕，都沒有交代。羅傑斯、艾爾賽義德或兩黨領袖的反應，同樣不在所提供的素材中。\"},\"sources\":[{\"name\":\"Axios\",\"url\":\"https://www.axios.com/2026/11/03/haley-stevens-death-threats-marshals\"},{\"name\":\"TMZ\",\"url\":\"https://www.tmz.com/2026/11/03/haley-stevens-asks-for-us-marshals-protection-amid-threats/\"}],\"disagreements\":null,\"trustScore\":45,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":11,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"entertainment\",\"live-ingest\",\"axios\",\"tmz\"],\"glossary\":[{\"term\":{\"en\":\"Haley Stevens\",\"zh-TW\":\"海莉・史蒂文斯（Haley Stevens）\"},\"blurb\":{\"en\":\"Haley Stevens is the Michigan Democratic representative who requested protection after reporting death threats.\",\"zh-TW\":\"海莉・史蒂文斯（Haley Stevens）是通報死亡威脅並請求保護的密西根州民主黨眾議員。\"}},{\"term\":{\"en\":\"Mike Rogers\",\"zh-TW\":\"邁克・羅傑斯（Mike Rogers）\"},\"blurb\":{\"en\":\"Mike Rogers is the Republican Senate candidate whose endorsement by Stevens preceded the reported threats.\",\"zh-TW\":\"邁克・羅傑斯（Mike Rogers）是共和黨參議院候選人，史蒂文斯改挺他之後傳出威脅事件。\"}},{\"term\":{\"en\":\"Abdul El-Sayed\",\"zh-TW\":\"阿卜杜勒・艾爾賽義德（Abdul El-Sayed）\"},\"blurb\":{\"en\":\"Abdul El-Sayed is the Democratic Senate nominee whose support Stevens withdrew.\",\"zh-TW\":\"阿卜杜勒・艾爾賽義德（Abdul El-Sayed）是被史蒂文斯撤回支持的民主黨參議院提名人。\"}},{\"term\":{\"en\":\"United States Marshals\",\"zh-TW\":\"美國法警（U.S. Marshals）\"},\"blurb\":{\"en\":\"The United States Marshals are the federal service from which Stevens requested protection.\",\"zh-TW\":\"美國法警（U.S. Marshals）是史蒂文斯請求提供保護的聯邦單位。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</scri
