entral Television’s Yuyuantantan account.\nWhat happened\nDigiTimes reports the approval, citing the October 22 Yuyuantantan post, and frames it as a signal that Beijing intends to permit Chinese AI companies to pursue global commercialization. The Register adds the other half of the picture: Beijing’s Ministry of Commerce announced restrictions in mid-October by revising its Catalogue of Technologies Prohibited and Restricted from Export in China, meaning Chinese companies must apply for a license to export some advanced technologies. The approval and the restriction are two sides of the same policy moment, not a reversal.\nWhy it matters\nThe judgment is that Beijing is running a dual track: let national champions earn revenue and market share abroad, while keeping a licensing gate on the technologies it considers sensitive. For DeepSeek and MiniMax, the practical question is no longer whether they may sell overseas, but which models and transfers fall inside the license requirement and how quickly approvals come.\nSources agree / disagree\nDigiTimes and The Register agree on the core approval. The ingest note about figures differing (22 versus 23) is a date difference, not a conflict: the Yuyuantantan post is dated October 22, and the DigiTimes report is dated October 23, so both dates are presented in parallel. Trust label: Two-source agreement — two outlets agree on the approval.\nStill uncertain\nThe snippets do not specify which models are covered, which countries are in scope, what the license criteria are, or whether MiniMax’s terms differ from DeepSeek’s. Those details require the full reporting."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-01-china-clears-deepseek-mi\",\"category\":\"semiconductor\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-semiconductor-01-china-clears-deepseek-mi.jpg\",\"imageAlt\":{\"en\":\"Cover related to: China clears DeepSeek,
