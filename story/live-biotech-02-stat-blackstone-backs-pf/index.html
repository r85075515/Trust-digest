lion backing from Blackstone gives Pfizer room to run a large Phase 3 program without carrying the full cost alone. Monthly dosing could appeal to patients who prefer fewer injections, and success would give Pfizer a foothold in the fast-growing obesity drug market. For Blackstone, the deal is a large wager that the treatment will clear its trials and win share.\n\nSources agree / disagree\nSTAT News and BioPharma Dive agree on the core facts: Blackstone is backing Pfizer's monthly obesity treatment. BioPharma Dive adds the $1.5 billion figure and the Metsera background; STAT News confirms the bet without giving a figure.\nTrust label: Two-source agreement — two outlets report the same deal; the dollar figure comes from BioPharma Dive alone.\n\nStill uncertain\nThe feed material does not give the deal's structure, such as how much is upfront or tied to milestones. It does not say when Phase 3 results are expected or what the drug's trial data show so far. The $1.5 billion figure rests on BioPharma Dive alone and should be checked against the companies' own announcements."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-biotech-02-stat-blackstone-backs-pf\",\"category\":\"biotech\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-biotech-02-stat-blackstone-backs-pf.jpg\",\"imageAlt\":{\"en\":\"Cover related to: STAT+: Blackstone backs Pfizer’s bet on monthly obesity treatment\",\"zh-TW\":\"相關封面圖：STAT+：黑石支持輝瑞每月進行肥胖治療的賭注\"},\"publishedAt\":\"2026-11-12T16:44:00.000Z\",\"title\":{\"en\":\"Blackstone Bets $1.5B on Pfizer's Monthly Obesity Drug\",\"zh-TW\":\"黑石（Blackstone）豪押 15 億美元支持輝瑞每月一次肥胖治療\"},\"summary\":{\"en\":\"Blackstone is backing Pfizer's bet on a monthly obesity treatment, committing $1.5 billion to the drug, according to BioPharma Dive. The deal will fund a sprawling Phase 3 program for a monthly GLP-1 shot Pfizer acquired by winning a bidding war for its previous owner, Metsera. The investment signals confidence in a competitive weight-loss market.\",\"zh-TW\":\"黑石（Blackstone）支持輝瑞（Pfizer）押注每月一次的肥胖治療，據 BioPharma Dive 報導，投資金額達 15 億美元。這筆交易將資助一項大規模第三期計畫，針對輝瑞在競購戰中擊敗對手、自 Metsera 手中取得的每月 GLP-1 注射藥物。這筆投資顯示市場對競爭激烈的減重市場仍具信心。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"黑石（Blackstone）以 15 億美元支持輝瑞（Pfizer）押注每月一次的肥胖治療。這筆交易將資助一項大規模第三期計畫，針對輝瑞在競購戰中勝出、自該藥物前東家 Metsera 手中取得的每月 GLP-1 注射藥物。\\n\\n發生了什麼事\\nSTAT 新聞報導，黑石支持輝瑞對每月肥胖治療的押注。BioPharma Dive 指出金額為 15 億美元，並稱這筆交易將支持一項大規模第三期計畫。輝瑞在競購戰中勝出，自 Metsera 手中取得這項藥物。這款藥物為每月注射一次的 GLP-1 療法。\\n\\n為什麼重要\\n黑石 15 億美元的支持，讓輝瑞不必獨自承擔大規模第三期計畫的全部成本。每月給藥一次可能吸引偏好減少注射次數的患者，若試驗成功，將讓輝瑞在快速成長的肥胖藥物市場站穩腳步。對黑石而言，這筆交易是一場重注，押的是該療法能通過試驗並搶下市占。\\n\\n來源異同\\nSTAT 新聞與 BioPharma Dive 對核心事實一致：黑石支持輝瑞的每月肥胖治療。BioPharma Dive 補上 15 億美元的金額與 Metsera 的背景，STAT 新聞證實這項押注，但未給出數字。\\n信任標籤：雙源一致——兩家媒體報導同一筆交易；金額數字僅出自 BioPharma Dive。\\n\\n仍不確定\\n現有素材未說明交易結構，例如多少屬於前期款項、多少與里程碑掛鉤。素材也未說明第三期結果預計何時出爐，或該藥物目前的試驗數據表現。15 億美元的數字僅仰賴 BioPharma Dive，應以兩家公司的官方公告為準。\"},\"sources\":[{\"name\":\"STAT News 生技版\",\"url\":\"https://www.statnews.com/2026/11/12/biotech-news-blackstone-backs-pfizer-bet-on-monthly-obesity-treatment/?utm_campaign=rss\"},{\"name\":\"BioPharma Dive\",\"url\":\"https://www.biopharmadive.com/news/blackstone-pfizer-berobenatide-deal/874483/\"}],\"disagreements\":null,\"trustScore\":62,\"trustBreakdown\":{\"sourceDiversity\":13,\"outletReputation\":10,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"biotech\",\"live-ingest\",\"stat-news-生技版\",\"biopharma-dive\"],\"glossary\":[{\"blurb\":{\"en\":\"Investment firm backing Pfizer's obesity drug bet.\",\"zh-TW\":\"支持輝瑞肥胖藥物押注的投資公司。\"},\"term\":{\"en\":\"Blackstone\",\"zh-TW\":\"黑石\"}},{\"blurb\":{\"en\":\"Drugmaker developing the monthly obesity treatment.\",\"zh-TW\":\"開發每月肥胖治療藥物的藥廠。\"},\"term\":{\"en\":\"Pfizer\",\"zh-TW\":\"輝瑞\"}},{\"blurb\":{\"en\":\"Previous owner of the drug, acquired by Pfizer after a bidding war.\",\"zh-TW\":\"該藥物的前東家，輝瑞在競購戰中勝出後取得。\"},\"term\":{\"en\":\"Metsera\",\"zh-TW\":\"Metsera\"}},{\"blurb\":{\"en\":\"Class of drugs used for obesity treatment, given here as a monthly shot.\",\"zh-TW\":\"肥胖治療藥物類別，此處為每月注射一次。\"},\"term\":{\"en\":\"GLP-1\",\"zh-TW\":\"GLP-1\"}},{\"blurb\":{\"en\":\"Large late-stage clinical trial program.\",\"zh-TW\":\"大規模後期臨床試驗計畫。\"},\"term\":{\"en\":\"Phase 3\",\"zh-TW\":\"第三期\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-biotech-02-stat-blackstone-backs-pf/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-biotech-02-stat-blackstone-backs-pf/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"d:\"$8:metadata\"\n"])</script></body></html>
