oxia and NVIDIA Begin 1.1 PB SSD-Based GPU Memory Expansion Tests\",\"zh-TW\":\"鎧俠與輝達啟動 1.1 PB 固態硬碟擴充 GPU 記憶體測試\"},\"summary\":{\"en\":\"Kioxia and NVIDIA have begun testing 1.1 PB SSD-based GPU memory expansion to address high-bandwidth memory capacity limits. The key takeaway is that storage-tiered memory expansion offers a path to scale AI memory capacity beyond HBM bottlenecks.\",\"zh-TW\":\"鎧俠與輝達啟動 1.1 PB 固態硬碟擴充 GPU 記憶體測試，以因應高頻寬記憶體容量瓶頸。關鍵結論在於透過儲存層級擴充記憶體，有助突破單靠 HBM 的容量限制。\"},\"body\":{\"en\":\"「What happened」 Kioxia and NVIDIA have begun proof-of-concept testing on 1.1 PB SSD-based GPU memory expansion using Kioxia SSDs and NVIDIA SCADA software to help address HBM capacity limits.\\n「Why it matters」 As AI workloads grow in memory demands, pairing SSD-based expansion with GPU memory architectures points to alternative ways to scale effective capacity alongside HBM.\\n「Source differences」 TrendForce and Kioxia's official release both cover the collaboration, with Kioxia detailing 1.1 PB raw SSD capacity and 2 trillion vector potential while TrendForce notes latency and commercial rollout details remain undisclosed.\\n「Still uncertain」 How SSD-based memory expansion performs on latency and endurance in production AI clusters, as well as when commercial deployments will follow, remains to be seen.\\nTrust label: Official confirmation — Supported by Kioxia's official announcement and TrendForce reporting on the collaboration.\",\"zh-TW\":\"「發生了什麼事」：鎧俠與輝達啟動 1.1 PB 固態硬碟擴充 GPU 記憶體概念驗證測試，結合鎧俠 SSD 與輝達 SCADA 軟體以因應 HBM 容量瓶頸。\\n「為什麼重要」：隨著人工智慧工作負載對記憶體容量的需求攀升，透過固態硬碟擴充 GPU 記憶體提供了在 HBM 之外擴大有效容量的技術路徑。\\n「來源異同」：TrendForce 報導與鎧俠官方公告皆指出雙方正進行相關合作測試，其中鎧俠說明約 1.1 PB 原始 SSD 容量與 2 兆向量潛力，TrendForce 則指出延遲與商用時程等細節尚待揭露。\\n「仍不確定」：固態硬碟擴充方案在實際 AI 叢集中的延遲表現、耐用度及正式商用時程仍待後續驗證。\\nTrust label: Official confirmation — 經鎧俠官方公告與 TrendForce 報導核實此項合作測試。\"},\"glossary\":[{\"term\":{\"en\":\"HBM\",\"zh-TW\":\"高頻寬記憶體\"},\"blurb\":{\"en\":\"High-bandwidth stacked memory commonly paired with AI accelerators to deliver fast data throughput.\",\"zh-TW\":\"常與 AI 加速器搭配的高堆疊頻寬記憶體，提供高資料傳輸吞吐量。\"}},{\"term\":{\"en\":\"PB\",\"zh-TW\":\"拍位元組\"},\"blurb\":{\"en\":\"A unit of digital storage equal to 1,000 terabytes or one quadrillion bytes in decimal terms.\",\"zh-TW\":\"數位儲存容量單位，十進位下相當於 1,000 TB。\"}},{\"term\":{\"en\":\"GPU memory expansion\",\"zh-TW\":\"GPU 記憶體擴充\"},\"blurb\":{\"en\":\"Techniques that extend memory capacity available to graphics processing units beyond onboard memory.\",\"zh-TW\":\"在晶片內建記憶體之外擴充繪圖處理器可用記憶體容量的技術。\"}}],\"sources\":[{\"name\":\"TrendForce\",\"url\":\"https://www.trendforce.com/news/2026/11/27/news-kioxia-nvidia-begin-1-1-pb-ssd-based-gpu-memory-expansion-tests-to-address-hbm-capacity-limits/\"},{\"name\":\"Kioxia\",\"url\":\"https://www.kioxia.com/en-jp/business/news/2026/20261126-1.html\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"Kioxia and NVIDIA Begin 1.1 PB SSD-Based GPU Memory Expansion Tests\",\"zh-TW\":\"鎧俠與輝達啟動 1.1 PB 固態硬碟擴充 GPU 記憶體測試\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":78,\"trustBreakdown\":{\"crossCorroboration\":23,\"outletReputation\":22,\"recencyClarity\":19,\"sourceDiversity\":14},\"publishedAt\":\"2026-11-27T20:21:08.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":21,\"D2\":20,\"D3\":20,\"D4\":19,\"D5\":19,\"total\":20},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-semiconductor-212-kioxia-nvidia-ssd-gpu-memory/\"}],[\"$\",\"meta\",\"3\",{\"pro
