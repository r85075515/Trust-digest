s on sale now during Amazon's Holiday Beauty Haul.\nWhat happened\nThe writer describes Big Lip Plumpgasm as the perfect plumping lip gloss, good for 'endless compliments,' and notes it is currently discounted as part of Amazon's two-week Holiday Beauty Haul. The same feed batch carried two separate deal roundups: Allure's 'Amazon Holiday Beauty Event 2026' editors' picks, and CNET Deals' Amazon deals of the day, which flagged budget Earfun earbuds near their lowest price ever plus $30 off both the Amazon Fire Stick 4K and the Soundcore Boom 2 speaker.\nWhy it matters\nThe verdict is timing: Amazon's holiday beauty event compresses the year's best beauty prices into two weeks, and a writer's 'repurchase to the last drop' pick is a stronger signal than a generic roundup. For shoppers, the move is simple — check the live price, because event pricing shifts.\nSources agree / disagree\nThree outlets, three separate promotions — no shared claim to conflict. Trust label: Bundled stories——Allure, Refinery29, and CNET each promote a different deal, swept into one cluster; Refinery29's Charlotte Tilbury lip product is this card's main thread.\nStill uncertain\nThe snippets give no exact discount percentage or sale price for the lip gloss, and event prices can change. Verify the live price on the product page before buying."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-shopping-01-my-new-fav-charlotte-til\",\"category\":\"shopping\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-shopping-01-my-new-fav-charlotte-til.jpg\",\"imageAlt\":{\"en\":\"Cover related to: My New Fav Charlotte Tilbury Products Are On Sale For Amazon’s Holiday Beauty Haul\",\"zh-TW\":\"相關封面圖：我最喜歡的夏洛特蒂爾伯里 (Charlotte Tilbury) 新產品正在亞馬遜假日美容系列促銷中\"},\"publishedAt\":\"2026-10-21T19:56:49.000Z\",\"title\":{\"en\":\"Refinery29: Charlotte Tilbury's Big Lip Plumpgasm Leads Amazon's Holiday Beauty Haul\",\"zh-TW\":\"Refinery29：Charlotte Tilbury 明星唇彩登上 Amazon 假日美妝特賣\"},\"summary\":{\"en\":\"Refinery29 flags Charlotte Tilbury's Big Lip Plumpgasm — the writer's one must-repurchase lip gloss — on sale in Amazon's two-week Holiday Beauty Haul. Allure and CNET ran separate roundups ($30 off Fire Stick 4K, Soundcore Boom 2). Takeaway: lip-gloss buyers get the window; verify the live price first.\",\"zh-TW\":\"Refinery29 的購物編輯點名 Charlotte Tilbury 的 Big Lip Plumpgasm——她唯一會用到底、立刻回購的唇彩——正在 Amazon 為期兩週的假日美妝特賣（Holiday Beauty Haul）中打折。Allure 與 CNET 同批各有獨立的優惠整理（Fire Stick 4K、Soundcore Boom 2 降 30 美元）。結論：唇彩買家把握這波，下單前先確認即時價格。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"兩週的優惠，一支值得回購的唇彩：Refinery29 的購物編輯說，Charlotte Tilbury 的 Big Lip Plumpgasm 是她少數會用到底、立刻回購的化妝品——而它正在 Amazon 假日美妝特賣（Holiday Beauty Haul）中打折。\\n發生了什麼事\\n編輯形容 Big Lip Plumpgasm 是完美的豐唇唇彩，「讚美拿到手軟」，目前正在為期兩週的 Amazon 假日美妝特賣中特價。同批另有兩份獨立的優惠整理：Allure 的「Amazon 2026 假日美妝活動」編輯精選，以及 CNET Deals 的 Amazon 每日優惠，點名平價 Earfun 耳機接近史低，外加 Fire Stick 4K 與 Soundcore Boom 2 喇叭各降 30 美元。\\n為什麼重要\\n結論是時機：Amazon 的假日美妝活動把全年最好的美妝價格壓進兩週，而編輯「用到底還回購」的背書，比泛泛的優惠整理更有參考價值。對買家來說動作很簡單——下單前先看即時價格，因為活動價格會變動。\\n來源異同\\n三家媒體、三個各自獨立的促銷，沒有共同主張可供衝突。信任標籤：混裝——Allure、Refinery29、CNET 各自推銷不同的促銷，被掃進同一群組；Refinery29 的 Charlotte Tilbury 唇彩是本卡主線。\\n仍不確定\\n來源摘要沒有唇彩的確切折扣數字，活動價格也可能變動。下單前請到商品頁確認即時價格。\"},\"sources\":[{\"name\":\"Allure\",\"url\":\"https://www.allure.com/story/amazon-holiday-beauty-event-2026-best-deals\"},{\"name\":\"Refinery29\",\"url\":\"https://www.refinery29.com/en-us/charlotte-tilbury-amazon-holiday-beauty-haul-sale?utm_source=feed\u0026utm_medium=rss\"},{\"name\":\"CNET Deals\",\"url\":\"https://www.cnet.com/deals/amazon-deals-of-the-day-2026-10-21/\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":19,\"outletReputation\":10,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"shopping\",\"live-ingest\",\"allure\",\"refinery29\",\"cnet-deals\"],\"glossary\":[{\"term\":{\"en\":\"Charlotte Tilbury\",\"zh-TW\":\"Charlotte Tilbury\"},\"blurb\":{\"en\":\"Bea
