y. Labor, energy, and transportation costs are adding further pressure to food prices. Families face a pricier Halloween, and some shoppers are trading down to cheaper options.\nWhat happened\nCNBC reported that Halloween is getting pricier as chocolate costs climb and that Hershey may feel the pinch. Bloomberg reported that higher cocoa and sugar prices are driving candy cost inflation, and interviewed Leonard about changing consumer behavior. Leonard said the price rise on popular candy bags is prompting some shoppers to choose cheaper alternatives. He discussed the shift on Bloomberg Businessweek Daily.\nWhy it matters\nThe judgment is simple: candy is a small purchase that makes inflation visible, and a 50-cent rise is enough to change behavior at the shelf. When shoppers trade down for Halloween treats, price pressure is no longer abstract. For Hershey and other sellers, the question is whether higher input costs can be passed on without losing volume.\nSources agree / disagree\nCNBC and Bloomberg agree that chocolate and candy costs are rising, with no conflicting figures in the snippets. Trust label: Two-source agreement — two outlets agree on the core claims. The 50-cent figure comes from Leonard's Bloomberg interview, while the Hershey point comes from CNBC's headline framing.\nStill uncertain\nThe snippets do not give overall candy price inflation rates, Hershey's sales or profit figures, or how widespread trading down has become. The Bloomberg item is a video interview summary, so Leonard's full remarks are not reproduced; verify figures in the full reporting."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-01-chocolate-price-spook-fa\",\"category\":\"finance\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-finance-01-chocolate-price-spook-fa.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Chocolate Price Spook Families for Halloween\",\"zh-TW\":\"相關封面圖：萬聖節巧克力價格嚇壞了家庭\"},\"publishedAt\":\"2026-10-30T22:21:45.000Z\",\"title\":{\"en\":\"Hershey and Halloween Candy: Cocoa and Sugar Prices Push Costs Higher\",\"zh-TW\":\"好時（Hershey）與萬聖節糖果：可可與糖價推高成本\"},\"summary\":{\"en\":\"Higher cocoa and sugar prices are driving above-average cost inflation for candy, CNBC and Bloomberg reported, making Halloween more expensive for families. Stew Leonard's chief executive Stew Leonard Jr. said popular candy bags cost about 50 cents more than last year. Some shoppers are trading down as affordability reshapes buying.\",\"zh-TW\":\"可可與糖價上漲，帶動糖果成本通膨高於平均水準，CNBC 與彭博（Bloomberg）報導，萬聖節對家庭變得更貴。超市史都·李奧納德（Stew Leonard's）執行長小李奧納德（Stew Leonard Jr.）表示，熱門糖果袋裝比去年貴約 50 美分，部分消費者轉買較便宜的選擇。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"熱門萬聖節糖果袋裝比去年貴約 50 美分：超市史都·李奧納德（Stew Leonard's）執行長小李奧納德（Stew Leonard Jr.）向彭博（Bloomberg）表示，可可與糖價上漲帶動糖果成本通膨高於平均水準。人力、能源與運輸成本進一步推高食品價格。萬聖節對家庭變得更貴，部分消費者轉買較便宜的選擇。\\n發生了什麼事\\nCNBC 報導巧克力成本攀升讓萬聖節變貴，好時（Hershey）可能感受到壓力。彭博報導可可與糖價推高糖果成本通膨，並訪問李奧納德談論負擔能力如何改變消費者行為。李奧納德表示，熱門糖果漲價促使部分消費者改買較便宜的選擇。他在《彭博商業週刊日報》（Bloomberg Businessweek Daily）節目中談論這個轉變。\\n為什麼重要\\n判斷很簡單：糖果是小額消費，卻讓通膨變得看得見，50 美分的漲幅就足以改變貨架前的選擇。消費者連萬聖節糖果都降級購買，價格壓力就不再抽象。對好時與其他業者而言，問題是原料成本上漲能否轉嫁，又不流失銷量。\\n來源異同\\nCNBC 與彭博對巧克力與糖果成本上漲的報導一致，摘要片段沒有數字衝突。信任標籤：兩源一致——兩家媒體對核心主張的報導一致。50 美分數字來自李奧納德接受彭博訪問的說法，好時可能受壓的說法來自 CNBC 的標題角度。\\n仍不確定\\n摘要片段沒有糖果整體漲幅、好時的銷售或獲利數字，也沒有說明降級購買有多普遍。彭博報導是影音訪問摘要，沒有完整引述李奧納德的發言；引用數字前請查閱完整報導。\"},\"sources\":[{\"name\":\"CNBC\",\"url\":\"https://www.cnbc.com/2026/10/30/halloween-gets-pricier-as-chocolate-costs-rise-hershey-could-feel-it.html\"},{\"name\":\"Bloomberg\",\"url\":\"https://www.bloomberg.com/news/videos/2026-10-30/chocolate-price-spook-families-for-halloween-video\"}],\"disagreements\":null,\"trustScore\":72,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":19,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"finance\",\"live-ingest\",\"cnbc\",\"bloomberg\"],\"glossary\":[{\"term\":{\"en\":\"Hershey\",\"zh-TW\":\"好時\"},\"blurb\":{\"en\":\"Chocolate maker that
