t under which Peak will acquire substantially all assets and assume substantially all liabilities of Scottsdale, Arizona-based Southwest Heritage Bank in an all-cash transaction. Unanimously approved by the boards of all three entities, the deal is expected to deliver Bancorp 34 stockholders an estimated 20.67 to 22.18 USD per share, representing an aggregate transaction value of 159 million to 171 million USD.\n\nWhy it matters\nHeadquartered at 8777 East Hartford Drive in Scottsdale, Southwest Heritage Bank operates seven full-service community bank branches across Scottsdale, Gilbert, Tucson, and Green Valley in Arizona, plus Alamogordo and Las Cruces in New Mexico. For Peak Credit Union—which serves more than 250,000 members across Washington and Oregon—the acquisition establishes a physical commercial banking and treasury-management footprint in the Southwest where many of its members spend part of the year.\n\nSource differences\nThe joint press release carried by Fidelity (\"Southwest Heritage Bank Announces Acquisition Agreement with\") and PR Newswire (\"Peak Credit Union Announces Agreement to Acquire Southwest\") specifies the estimated 159 million to 171 million USD valuation, the 20.67 to 22.18 USD per-share payout range, and all seven branch locations. Dealroom News (\"Peak Credit Union to buy Southwest Heritage Bank in cross-regional\") places the transaction in broader industry context as the 11th credit-union acquisition of a bank announced in 2026, while noting that the two institutions will continue operating independently until closing.\n\nStill uncertain\nThe acquisition remains subject to customary regulatory clearances and approval by Bancorp 34 shareholders, and the exact per-share payout within the 20.67 to 22.18 USD estimate depends on remaining asset distributions prior to dissolution in the second half of 2027.\n\nTrust label: Single source — Secondary coverage derives from the November 27, 2026 joint corporate press release issued by Peak Credit Union, Southwest Heritage Bank, and Bancorp 34, Inc."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-arizona-316-peak-credit-union-southwest-heritage-bank\",\"category\":\"arizona\",\"title\":{\"en\":\"Peak Credit Union Agrees to Acquire Scottsdale-Based Southwest Heritage Bank\",\"zh-TW\":\"Peak 信用合作社達成協議，將收購總部位於斯科茨代爾的西南遺產銀行\"},\"summary\":{\"en\":\"Peak Credit Union announced a definitive all-cash agreement on November 27, 2026, to acquire Scottsdale-headquartered Southwest Heritage Bank, a subsidiary of Bancorp 34, Inc., in a deal valued at an estimated 159 million to 171 million USD. The transaction expands the Pacific Northwest credit union into Arizona and New Mexico, with closing expected in the second half of 2027.\",\"zh-TW\":\"華盛頓與奧勒岡州金融機構 Peak 信用合作社於 2026 年 11 月 27 日宣布與總部位於亞利桑那州斯科茨代爾的西南遺產銀行（Southwest Heritage Bank）及其母公司 Bancorp 34 簽署全現金收購協議，交易總值估計達 1.59 億至 1.71 億美元，預計 2027 年下半年完成交割。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n2026 年 11 月 27 日，Peak 信用合作社（Peak Credit Union）與 Bancorp 34, Inc. 共同宣布簽署最終收購協議，Peak 將以全現金方式收購總部位於亞利桑那州斯科茨代爾的西南遺產銀行（Southwest Heritage Bank）絕大部分資產並承擔其負債。該交易已獲三方董事會一致通過，預計 Bancorp 34 股東每股可獲 20.67 至 22.18 美元，整體交易估值介於 1.59 億至 1.71 億美元之間。\\n\\n「為什麼重要」\\n西南遺產銀行在亞利桑那州的斯科茨代爾、吉爾伯特、土桑與綠谷設有五家分行，並在新墨西哥州設有兩家分行。對服務華盛頓州與奧勒岡州逾 25 萬名會員的 Peak 信用合作社而言，此案使其商業放貸與財資管理業務正式跨足美國西南部，服務大量季節性旅居亞利桑那州的現有會員。\\n\\n「來源異同」\\nFidelity（\\\"Southwest Heritage Bank Announces Acquisition Agreement with\\\"）與 PR Newswire（\\\"Peak Credit Union Announces Agreement to Acquire Southwest\\\"）刊載的聯名新聞稿完整揭露 1.59 億至 1.71 億美元估值區間、每股 20.67 至 22.18 美元分配預估及七家分行明細；Dealroom News（\\\"Peak Credit Union to buy Southwest Heritage Bank in cross-regional\\\"）則從產業趨勢切入，指出這是 2026 年全美第 11 起信用合作社收購商業銀行案，並強調交割前雙方維持獨立營運。\\n\\n「仍不確定」\\n本案仍須取得金融監管機關核准與 Bancorp 34 股東會同意，且 Bancorp 34 預計於 2027 年下半年交割後解散清算，最終每股實際分配金額仍視清算前剩餘資產結算而定。\\n\\nTrust label: Single source — 相關報導均源自 Peak 信用合作社與 Bancorp 34 於 2026 年 11 月 27 日發布的同一份聯名新聞稿。\"},\"glossary\":[{\"term\":{\"en\":\"Credit Union\",\"zh-TW\":\"信用合作社\"},\"blurb\":{\"en\":\"A member-owned, not-for-profit financial cooperative that provides deposit, lending, and banking services to its members.\",\"zh-TW\":\"由社員共同擁有、採非營利合作社模式運作的金融機構，為社員提供存款、放款與各類銀行服務。\"}},{\"term\":{\"en\":\"All-Cash Transaction\",\"zh-TW\":\"全現金收購\"},\"blurb\":{\"en\":\"An acquisition structure in which the buyer pays for the target company's assets or shares entirely in cash rather than issuing stock.\",\"zh-TW\":\"收購方完全以現金支付對價取得目標公司資產或股權，不涉及發行新股交換的併購方式。\"}},{\"term\":{\"en\":\"Treasury Management\",\"zh-TW\":\"財資管理\"},\"blurb\":{\"en\":\"Corporate banking services that help businesses optimize cash flow, liquidity, payments, and financial risk.\",\"zh-TW\":\"協助企業客戶管理現金流、流動性、收付款清算與資金風險的商業銀行金融服務。\"}}],\"sources\":[{\"name\":\"PR Newswire\",\"url\":\"https://www.prnewswire.com/news-releases/peak-credit-union-announces-agreement-to-acquire-southwest-heritage-bank-302951825.html\"},{\"name\":\"Fidelity\",\"url\":\"https://www.fidelity.com/news/article/mergers-and-acquisitions/202611271745ACCESSWRNAPR_____1415658\"},{\"name\":\"Dealroom News\",\"url\":\"https://dealroom.co/news/176788-peak-credit-union-to-buy-southwest-heritage-bank-in-cross-regional-push/\"}],\"imageUrl\":\"/covers/live/live-arizona-316-peak-credit-union-southwest-heritage-bank.jpg\",\"imageAlt\":{\"en\":\"Peak Credit Union Agrees to Acquire Scottsdale-Based Southwest Heritage Bank\",\"zh-TW\":\"Peak 信用合作社達成協議，將收購總部位於斯科茨代爾的西南遺產銀行\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":76,\"trustBreakdown\":{\"crossCorroboration\":20,\"outletReputation\":21,\"recencyClarity\":22,\"sourceDiversity\":13},\"publishedAt\":\"2026-11-28T02:11:49.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":21,\"D2\":20,\"D3\":19,\"D4\":20,\"D5\":20,\"total\":20},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-widt
