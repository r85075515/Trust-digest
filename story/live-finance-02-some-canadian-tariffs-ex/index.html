 as part of a wider break, noting that some Republicans are now opposing President Donald Trump on tariffs, and that Collins just got him to back down on Canadian levies.\nWhat happened\nThe exemption at issue is the same Friday decision covered elsewhere in this digest: Trump dropped some US tariffs on Canada, a move the White House said would better serve the public interest. Collins presents the outcome as the payoff of her own lobbying, aimed at voters in a state where the trade war has stung families, businesses, and farmers.\nWhy it matters\nCollins is converting a policy concession into campaign capital. The MarketWatch angle matters because it reframes a single senator's win as a symptom: tariff dissent inside Trump's own party is no longer confined to private grumbling. If more Republicans defect on tariffs, the White House's trade-war coalition gets harder to hold.\nSources agree-disagree\nMarketWatch and Bloomberg News both center the Collins win; Bloomberg's item is an audio roundup whose title also lists oil at a six-month high, but its feed summary gives no detail on oil, so this card does not expand that item. No fact conflicts appear between the two sources. Trust label: 2-source agreement.\nStill uncertain\nThe feed summaries do not specify which Canadian levies were dropped, how many Republicans are actually breaking ranks, or whether the exemption survives past the midterm campaign."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-02-some-canadian-tariffs-ex\",\"category\":\"finance\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-finance-02-some-canadian-tariffs-ex.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Some Canadian Tariffs Exempted, Oil at Six-Month High, More\",\"zh-TW\":\"相關封面圖：加拿大免部分關稅，石油價格創六個月新高，更多\"},\"publishedAt\":\"2026-10-24T03:45:52.000Z\",\"title\":{\"en\":\"Collins Touts Her Tariff Lobbying Win as Some Republicans Break With Trump\",\"zh-TW\":\"柯林斯（Susan Collins）宣傳關稅遊說戰果，部分共和黨人也與川普（Donald Trump）唱反調\"},\"summary\":{\"en\":\"Five-term Maine Senator Susan Collins is touting her successful lobbying against certain Canadian tariffs as she faces a tough midterm race. MarketWatch notes some Republicans are now opposing President Donald Trump on tariffs, and Collins just got him to back down on Canadian levies. Watch whether the exemption holds, or fades once the campaign ends.\",\"zh-TW\":\"面臨艱困期中選戰的五連任緬因州參議員柯林斯，正大打自己成功遊說、擋下部分加拿大關稅的政績。市場觀察（MarketWatch）指出，部分共和黨人已在關稅議題上與川普唱反調，而柯林斯剛讓他在加拿大關稅上讓步。接下來看豁免能否撐過選舉，還是選後就縮水。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"緬因州參議員柯林斯正拿一樁遊說戰果打選戰：面臨艱困期中選戰的五連任共和黨人，大打自己成功擋下部分加拿大關稅的政績。市場觀察（MarketWatch）把這件事放在更大的裂縫裡看：部分共和黨人已在關稅議題上與川普唱反調，而柯林斯剛讓他在加拿大關稅上讓步。\\n發生了什麼事\\n這次豁免就是本 digest 另一張卡提到的週五決定：川普取消美國對加拿大的部分關稅，白宮稱此舉更符合公共利益。柯林斯把結果包裝成自己遊說的成果，訴求對象是貿易戰已讓家庭、企業與農民受傷的州內選民。\\n為什麼重要\\n柯林斯把一項政策讓步轉換成選戰資本。市場觀察的角度之所以重要，在於它把單一參議員的勝利重新定位為徵兆：黨內對關稅的不滿已不只是私下抱怨。如果更多共和黨人在關稅上倒戈，白宮的貿易戰陣線會越來越難維持。\\n來源異同\\n市場觀察與彭博新聞（Bloomberg News）都以柯林斯的勝利為核心；彭博那則是音訊綜合報導，標題另列石油創六個月新高，但摘要未給細節，本卡不展開。兩家之間沒有事實衝突。信任標籤：2源一致。\\n仍不確定\\n摘要未說明哪些加拿大關稅被取消、到底有多少共和黨人倒戈，也沒說豁免能不能撐過期中選戰。\"},\"sources\":[{\"name\":\"MarketWatch\",\"url\":\"https://www.marketwatch.com/story/some-republicans-are-opposing-trump-on-tariffs-maines-susan-collins-just-got-him-to-back-down-on-canadian-levies-02b202ae?mod=mw_rss_topstories\"},{\"name\":\"Bloomberg News\",\"url\":\"https://www.bloomberg.com/news/audio/2026-10-24/some-canadian-tariffs-exempted-oil-at-six-month-high-more\"}],\"disagreements\":null,\"trustScore\":72,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":19,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"finance\",\"live-ingest\",\"marketwatch\",\"bloomberg-news\"],\"glossary\":[{\"term\":{\"en\":\"Susan Collins\",\"zh-TW\":\"柯林斯\"},\"blurb\":{\"en\":\"Five-term Republican senator for Maine, touting her tariff lobbying win.\",\"zh-TW\":\"五連任的緬因州共和黨參議員，正宣傳關稅遊說戰果。\"}},{\"term\":{\"en\":\"Donald Trump\",\"zh-TW\":\"川普\"},\"blurb\":{\"en\":\"President of the United States, whose Canada tariffs Collins lobbied against.\",\"zh-TW\":\"美國總統，柯林斯遊說反對其加拿大關稅的對象。\"}},{\"term\":{\"en\":\"MarketWatch\",\"zh-TW\":\"市場觀察\"},\"blurb\":{\"en\":\"Financial news outlet that framed the story as Republican tariff dissent.\",\"zh-TW\":\"將此事定位為共和黨關稅倒戈的財經新聞媒體。\"}},{\"term\":{\"en\":\"Bloomberg News\",\"zh-TW\":\"彭博新聞\"},\"blurb\":{\"en\":\"News outlet whose audio roundup also covered the tariff exemption.\",\"zh-TW\":\"音訊綜合報導也涵蓋關稅豁免的新聞媒體。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://r85075515.github.io/Trust-digest/\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"Axiom\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"zh_TW\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:locale:alternate\",\"content\":\"en_US\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"9\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"10\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"11\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, di
