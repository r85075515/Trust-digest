 million, according to China Daily News. The judgment also cut against his public image of being broke: ETtoday reported the ruling exposed assets of NT$29.21 million, and Mirror News put his debts at NT$200 million after five years of marriage, saying he has restarted livestreaming to rebuild.\nWhy it matters\nThe verdict gives him a partial win and a large shortfall at the same time: NT$1.15 million is a fraction of the NT$9 million he sought, and he told a livestream he feared the money would never arrive. The gap between the claim and the award, and between his pleas of poverty and the NT$29.21 million in assets the judgment exposed, is the story — a public figure who built sympathy on hardship now has a court record that complicates that picture.\nSources agree / disagree\nLiberty Times, ETtoday, Mirror Media, SETN and Mirror News agree on the core facts: three men, a NT$9 million claim and a NT$1.15 million award. The figures that look different are different quantities, not conflicts: NT$9 million sought versus NT$1.15 million awarded, and NT$29.21 million in assets versus NT$200 million in debts. Trust label: Multi-source agreement — multiple outlets agree on the core facts.\nStill uncertain\nWhether the NT$1.15 million can actually be collected is open — Pi Laoban himself said on a livestream he feared it would never arrive. The full judgment details are not in the feed snippets, and the three men's responses were reported as published but their contents are not shown here. His real name was not published in the sources, which use only the nickname Pi Laoban. Verify details in the full reporting before quoting specifics."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-eastAsiaGossip-02-900-01j\",\"category\":\"eastAsiaGossip\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-eastAsiaGossip-02-900-01j.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 【疲老闆自爆被戴綠帽！告警察、藥師小王求償900萬 判決出爐】 疲老闆自爆，妻子與多名男子發展不正當關係... （#01J）\",\"zh-TW\":\"相關封面圖：【疲老闆自爆被戴綠帽！告警察、藥師小王求償900萬 判決出爐】 疲老闆自爆，妻子與多名男子發展不正當關係... （#01J）\"},\"publishedAt\":\"2026-11-05T07:59:36.000Z\",\"title\":{\"en\":\"Pi Laoban Seeks NT$9 Million After Accusing Wife of Affair; Court Awards NT$1.15 Million\",\"zh-TW\":\"「疲老闆」指控妻子出軌求償 900 萬，法院判賠 115 萬\"},\"summary\":{\"en\":\"Pi Laoban (疲老闆), a well-known Chiayi snack e-commerce seller once dubbed the 'Costco of snacks,' accused his wife of cheating with three men and sued for NT$9 million; reports say the court awarded NT$1.15 million. The verdict caps a year in which he closed his nine-year-old physical stores over unpaid supplier bills.\",\"zh-TW\":\"嘉義知名電商「疲老闆」——曾被稱為「零食界好市多」——指控妻子婚內出軌 3 名男子，向警察、藥師等人求償 900 萬元，法院判賠 115 萬元。這紙判決替他事業、婚姻雙雙觸礁的一年寫下註腳，接下來看判賠金額能否實際拿到。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"嘉義知名電商「疲老闆」——曾被稱為「零食界好市多」——指控妻子婚內出軌 3 名男子，向警察、藥師等人求償 900 萬元，法院判賠 115 萬元。多家台灣媒體都有報導。\\n發生了什麼事\\n「疲老闆」這一年事業、婚姻雙雙觸礁。今年 4 月，他因積欠上百家廠商貨款，結束經營 9 年的實體門市。接著爆出婚變：他指控妻子與 3 名男子發展婚外關係，其中包括警察、藥師與房仲執行長，並向警察、藥師求償 900 萬元。法院判賠 115 萬元，中華日報（China Daily News）如此報導。判決書也打臉他哭窮的形象：ETtoday 報導判決書揭露他名下有 2921 萬元家產；鏡報則稱 5 年婚姻告終，他扛下 2 億元巨債，已經重啟直播拚東山再起。\\n為什麼重要\\n這紙判決同時是部分勝利與大幅落差：115 萬元只是求償 900 萬元的一小部分，他本人也在直播中說，怕這筆錢根本拿不到。求償與判賠之間的落差，以及哭窮形象與判決書揭露的 2921 萬元家產之間的落差，正是這則新聞的重點：一位靠艱苦形象博取同情的網紅，如今多了一份讓形象變複雜的法院紀錄。\\n來源異同\\n自由時報（Liberty Times）、ETtoday、鏡週刊（Mirror Media）、三立新聞網（SETN）與鏡報對核心事實的報導一致：3 名男子、求償 900 萬元、判賠 115 萬元。看似不同的數字說的是不同的事，不是衝突：900 萬元是求償金額，115 萬元是判賠金額；2921 萬元是家產，2 億元是債務。信任標籤：多源一致——多家媒體對核心事實的報導一致。\\n仍不確定\\n115 萬元判賠能不能實際拿到還不知道，「疲老闆」本人在直播中說怕拿不到。判決書全文細節不在來源摘要中，3 名男子的回應雖有報導露出，內容也未呈現。來源只用「疲老闆」這個暱稱，沒有公開他的真實姓名；引用細節前請查閱完整報導。\"},\"sources\":[{\"name\":\"自由時報\",\"url\":\"https://ent.ltn.com.tw/news/breakingnews/5630579\"},{\"name\":\"tw.news.yahoo.com\",\"url\":\"https://news.google.com/rss/articles/CBMivAJBVV95cUxPNzMwMmVQZEx6NzRwRi1BQjZhWDQ3RUNsYnowbUlNRUdlYmVnck9wU0k4N19RenRObDBpXzlKVUFqaFowUmI0N3VZWl9qWTB6RGxPY0hHLW5TS00tTnh3dzI4LTNYeTBlUTZPYjVDOEtKa2tGZHpuSzJkWHh2TWlJTTAzaVJkNy1JWDhoRkRIREJJ
