ricted memory. The feed snippet cuts off mid-figure, so no quantity can be verified from it. Why it matters The judgment is that the leak sits at the packaging step, not the border. If low-end processors can serve as cover for high-end memory, export controls must police the bundle rather than the chip alone, and enforcement becomes a cat-and-mouse game over how shipments are assembled. Sources agree / disagree This card bundles two unrelated items: Semiconductor Engineering's week in review, which carries the smuggling report, and an EE Times piece on Europe's chip industry, whose snippet supplies no verifiable claims. The two do not corroborate each other. Trust label: Bundled stories — two unrelated items share one card; the smuggling claim rests on a single outlet citing The Information. Still uncertain The scale of the smuggling is unknown, the truncated figure in the snippet is unusable, and whether Huawei customers actually received the memory is unconfirmed. No official response appears in the snippet."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-01-europe-s-chip-industry-p\",\"category\":\"semiconductor\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"https://www.eetimes.com/wp-content/uploads/European-Sovereignty.jpg\",\"imageAlt\":{\"en\":\"High-bandwidth memory chips at the center of a reported smuggling route to China\",\"zh-TW\":\"高頻寬記憶體晶片疑似經走私流入中國\"},\"publishedAt\":\"2026-11-06T09:53:05.000Z\",\"title\":{\"en\":\"HBM Smuggling Reportedly Funnels Samsung and SK Hynix Memory to Chinese AI Developers\",\"zh-TW\":\"傳三星（Samsung）、SK 海力士（SK hynix）高頻寬記憶體經走私流入中國 AI 業者\"},\"summary\":{\"en\":\"［未證實·單一來源］High-bandwidth memory from Samsung and SK hynix is reportedly reaching Chinese AI chip developers through smuggling that exploits US export-control loopholes, according to Semiconductor Engineering, citing The Information. Intermediaries bundle the memory with low-end server processors, ship the package to China, then strip out the memory for resale.\",\"zh-TW\":\"［未證實·單一來源］《半導體工程》（Semiconductor Engineering）引述《The Information》報導，三星（Samsung）與 SK 海力士（SK hynix）的高頻寬記憶體疑似經走私流入中國 AI 晶片業者：中間商把記憶體與低階伺服器處理器綑綁出貨，運抵中國後再拆出轉售。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"三星（Samsung）與 SK 海力士（SK hynix）的高頻寬記憶體，疑似經走私流入中國 AI 晶片業者，走的是利用美國出口管制漏洞的管道。《半導體工程》（Semiconductor Engineering）引述《The Information》的報導指出此事。\\n發生了什麼事\\n中間商把高頻寬記憶體與低階伺服器處理器綑綁在一起出貨，運抵中國後再把記憶體拆出來轉售，買家包括華為（Huawei）的客戶。整批貨外表看起來只是普通的低階伺服器零件，真正值錢的是裡面受管制的記憶體。摘要中的數字在「約 60 萬」處截斷，無法核對數量。\\n為什麼重要\\n判斷在於：漏洞出在打包的環節，不在邊境。低階處理器可以替高階記憶體打掩護，出口管制就必須查整批貨、而不只是查單顆晶片，查緝變成一場比拼出貨手法的拉鋸戰。\\n來源異同\\n這張卡混裝了兩件不相關的內容：《半導體工程》的每週回顧刊載走私報導，《EE Times》的歐洲晶片產業評論摘要則沒有提供可以核對的主張，兩者無法互相佐證。信任標籤：混裝報導——同一張卡有兩件不相關內容，走私說法僅靠一家媒體引述《The Information》。\\n仍不確定\\n走私規模未知，摘要截斷的數字無法使用，華為客戶是否真的收到這批記憶體也未經證實。摘要中沒有出現官方回應。\"},\"sources\":[{\"name\":\"EE Times\",\"url\":\"https://www.eetimes.com/europe-chip-industry-perfect-storm-or-perfect-timing/\"},{\"name\":\"Semiconductor Engineering\",\"url\":\"https://semiengineering.com/chip-industry-week-in-review-163/\"}],\"disagreements\":null,\"trustScore\":49,\"trustBreakdown\":{\"sourceDiversity\":13,\"outletReputation\":10,\"crossCorroboration\":6,\"recencyClarity\":20},\"tags\":[\"semiconductor\",\"live-ingest\",\"ee-times\",\"semiconductor-engineering\"],\"glossary\":[{\"term\":{\"en\":\"HBM\",\"zh-TW\":\"高頻寬記憶體\"},\"blurb\":{\"en\":\"High-bandwidth memory used in AI chips, the smuggled component in this report.\",\"zh-TW\":\"AI 晶片使用的高頻寬記憶體，也是報導中走私的零件。\"}},{\"term\":{\"en\":\"Samsung\",\"zh-TW\":\"三星\"},\"blurb\":{\"en\":\"South Korean chipmaker whose HBM is named in the smuggling report.\",\"zh-TW\":\"走私報導中點名的高頻寬記憶體韓國製造商。\"}},{\"term\":{\"en\":\"SK hynix\",\"zh-TW\":\"SK 海力士\"},\"blurb\":{\"en\":\"South Korean chipmaker whose HBM is named in the smuggling report.\",\"zh-TW\":\"走私報導中點名的高頻寬記憶體韓國製造商。\"}},{\"term\":{\"en\":\"Huawei\",\"zh-TW\":\"華為\"},\"blurb\":{\"en\":\"Chinese technology company whose customers a
