firmed in a rare joint statement issued November 25, 2026, that they have settled their nearly four-year legal battle over Château Miraval, the French vineyard estate they acquired in 2008 and where they wed in 2014. \"We have settled out of court in the best interests of our family and will not be commenting further,\" the statement read. Both parties agreed to dismiss their claims against each other, while keeping the financial terms confidential.\n\nThe litigation began in February 2022 after Jolie sold her stake in the estate to Tenute del Mondo, a wine division linked to the Stoli Group, without Pitt's consent. Resolving their direct claims removes one of Hollywood's longest-running post-divorce courtroom disputes, though Pitt's separate lawsuit against Stoli Group owner Yuri Shefler remains ongoing.\n\nNew York Daily News (via ArcaMax), Men's Journal, Canadian Lawyer, and The Daily Jagran all reported the November 25 joint statement verbatim and confirmed the confidential out-of-court settlement. New York Daily News additionally noted that Pitt's separate suit against Yuri Shefler has not been dismissed.\n\nThe exact financial settlement figures and the resulting ownership structure of Château Miraval have not been disclosed.\nTrust label: Multi-source agreement — Multiple entertainment and legal outlets confirm the former couple's November 25 joint settlement statement."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-entertainment-170-brad-pitt-angelina-jolie-settle-chateau-miraval\",\"category\":\"entertainment\",\"title\":{\"en\":\"Brad Pitt and Angelina Jolie Settle Four-Year Legal Battle Over French Winery Château Miraval Out of Court\",\"zh-TW\":\"布萊德・彼特與安潔莉娜・裘莉達成庭外和解，結束法國米拉瓦爾酒莊四年訴訟戰\"},\"summary\":{\"en\":\"Hollywood actors Brad Pitt and Angelina Jolie announced in a rare joint statement on November 25, 2026, that they have settled their nearly four-year legal dispute over Château Miraval, their former French winery estate, out of court. Both sides dismissed claims against each other without disclosing financial terms, closing a major chapter of their post-divorce litigation.\",\"zh-TW\":\"布萊德・彼特（Brad Pitt）與安潔莉娜・裘莉（Angelina Jolie）於 2026 年 11 月 25 日發布聯合聲明，宣布已就法國米拉瓦爾酒莊（Château Miraval）近四年的所有權與股權出售糾紛達成庭外和解。雙方撤回訴訟且未公開財務條款，為兩人離婚後最具爭議的法律戰畫下句點，但彼特針對酒業買家 Stoli 集團老闆的另案訴訟仍在進行。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n好萊塢前銀色夫妻布萊德・彼特（Brad Pitt）與安潔莉娜・裘莉（Angelina Jolie）於 2026 年 11 月 25 日發表罕見聯合聲明，證實兩人已就法國普羅旺斯米拉瓦爾酒莊（Château Miraval）長達近四年的法律訴訟達成庭外和解。聲明表示：「為了我們家庭的最大利益，我們已達成庭外和解，未來不再對此發表任何評論。」雙方已撤回對彼此的告訴，具體財務與和解條件則未對外公開。\\n\\n「為什麼重要」\\n這場始於 2022 年 2 月的官司源於裘莉未經彼特同意，便將其持有的酒莊股份出售給 Stoli 集團旗下葡萄酒事業 Tenute del Mondo，期間更牽扯出保密協議與家暴指控等攻防。兩人直接撤訴和解，象徵好萊塢歷時最久的離婚衍生資產官司正式落幕；不過彼特針對 Stoli 集團老闆尤里・謝夫勒（Yuri Shefler）提起的另案訴訟目前仍在審理中。\\n\\n「來源異同」\\n《紐約每日新聞》（New York Daily News）、Men's Journal、Canadian Lawyer 與 The Daily Jagran 均一致引述雙方 11 月 25 日發布的聯合聲明全文並確認庭外和解；《紐約每日新聞》進一步補充彼特對俄羅斯裔億萬富豪謝夫勒的獨立訴訟尚未終結。\\n\\n「仍不確定」\\n本次庭外和解涉及的具體金額補償，以及和解後米拉瓦爾酒莊的最終股權歸屬與經營權安排，雙方均保密未予披露。\\nTrust label: Multi-source agreement — 多家娛樂與法律專業媒體均已核實彼特與裘莉於 11 月 25 日發布的聯合和解聲明。\"},\"glossary\":[{\"term\":{\"en\":\"Château Miraval\",\"zh-TW\":\"米拉瓦爾酒莊\"},\"blurb\":{\"en\":\"A historic 1,200-acre estate and rosé winery in Correns, Provence, France, purchased by Pitt and Jolie in 2008.\",\"zh-TW\":\"位於法國普羅旺斯科朗斯（Correns）的知名葡萄酒莊園，由彼特與裘莉於 2008 年聯手買下並於 2014 年在此完婚。\"}},{\"term\":{\"en\":\"Out-of-Court Settlement\",\"zh-TW\":\"庭外和解\"},\"blurb\":{\"en\":\"A legally binding agreement reached privately between disputing parties to resolve a civil lawsuit without a trial verdict.\",\"zh-TW\":\"民事訴訟當事人在法院作出最終判決前，私下協商達成具法律拘束力的協議並撤回起訴的紛爭解決方式。\"}},{\"term\":{\"en\":\"Cross-Complaint\",\"zh-TW\":\"反訴（交叉訴訟）\"},\"blurb\":{\"en\":\"A legal claim filed by a defendant in response to an initial lawsuit, asserting counter-allegations arising from the same dispute.\",\"zh-TW\":\"民事訴訟被告針對原告的起訴，在同一訴訟程序中就相關爭議提出反制請求的法律程序。\"}}],\"sources\":[{\"name\":\"New York Daily News (ArcaMax)\",\"url\":\"https://www.arcamax.com/entertainment/entertainmenttoday/s-4353323\"},{\"name\":\"Men's Journal\",\"url\":\"https://www.mensjournal.com/news/brad-pitt-and-angelina-jolie-issue-rare-joint-statement-after-legal-battle\"},{\"name\":\"Canadian Lawyer\",\"url\":\"https://www.canadianlawyermag.com/news/international/jolie-pitt-settle-legal-bout-over-chateau-miraval-out-of-court/394973\"}],\"imageUrl\":\"/covers/live/live-entertainment-170-brad-pitt-angelina-jolie-settle-chateau-miraval.png\",\"imageAlt\":{\"en\":\"French vineyard estate representing Château Miraval in Provence\",\"zh-TW\":\"代表法國普羅旺斯米拉瓦爾酒莊的葡萄園景觀\"},\"isHeadline\":false,\"isPopular\":true,\"trustScore\":87,\"trustBreakdown\":{\"crossCorroboration\":23,\"outletReputation\":21,\"recencyClarity\":22,\"sourceDiversity\":21},\"publishedAt\":\"2026-11-27T18:06:35.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":4,\"D2\":4,\"D3\":4,\"D4\":4,\"D5\":4,\"total\":20},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-entertainment-170-brad-pitt-angelina-jolie-settle-chateau-miraval/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigr
