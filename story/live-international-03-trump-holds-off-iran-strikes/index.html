 comments he made to CNN on Sunday that new strikes were highly unlikely as long as talks to end the war progressed — while tying restraint to Iran signing a strong agreement. He also said he plans to keep up the US naval blockade in the Strait of Hormuz for now. Oil markets repriced immediately: Brent crude settled down $5.75, or 5.85%, at $92.57 a barrel on Monday, its lowest since late August, and fell more than $7 a barrel in post-settlement trade; US WTI settled down 4.38% at $86.85. Brent had already fallen 16% the previous week.\nWhy it matters\nThis is the clearest de-escalation signal from Washington in this war: the president publicly took new strikes off the table, credited Gulf mediators, and tied the pause to diplomacy rather than to military necessity. But the signal is narrower than the market reaction. The blockade — the measure actually choking Gulf oil flows — remains in place, the restraint is explicitly temporary and conditional, and fighting around Hormuz has not stopped: Iran's Revolutionary Guard said three tankers exploded and caught fire in the strait on Sunday. Oil is now pricing in a deal that nobody has signed; if talks stall, the same barrels can reprice back up just as fast.\nSources agree / disagree\nReuters, the Wall Street Journal and Taiwanese financial media agree on the core facts: the hold-off, the Qatar meeting and the oil slide. They diverge on how far diplomacy has actually gone. Some Taiwanese coverage described a preliminary consensus on nuclear talks, citing an Al Arabiya source; Israeli media reported that Iran had approved Qatari-brokered interim terms — reopening Hormuz and halting tanker attacks in exchange for the US lifting the blockade and freeing $8 billion of frozen Iranian funds in Qatar. Neither government has confirmed those terms, and a senior Iranian security official said Tehran will not negotiate unless Washington first takes practical steps on Iran's conditions; senior US and Gulf officials have also cast doubt on an imminent deal. Trust label: Wire-led reporting — the president's remarks are on the record; reported deal terms are unconfirmed by either side.\nStill uncertain\nWhether any interim agreement exists at all, and on what terms, is unconfirmed by both Washington and Tehran. Trump's restraint is explicitly conditional ('at this point') and reversible, and the blockade continues. Iran's foreign minister says Tehran is still offering to reopen Hormuz within two days if the war ends on all fronts — a formulation the US has not accepted. The next facts to watch are whether the blockade is eased in practice and whether tanker traffic through Hormuz resumes without attacks."])</script><script>self.__next_f.push([1,"11:Tb32,"])</script><script>self.__next_f.push([1,"美國總統川普（Donald Trump）週一表示，將暫緩對伊朗的新一輪軍事打擊，原因是包括卡達首相在內的區域國家勸說；國際油價應聲重挫，路透社報導。\n發生了什麼事\n川普在接受路透社專訪、以及隨後於白宮記者室露面時作上述表示；當天稍早，他在白宮會見了美伊之間的主要調人、卡達首相穆罕默德（Sheikh Mohammed bin Abdulrahman Al Thani）。川普說，對伊朗採取軍事行動「目前沒必要」，呼應他週日對 CNN 的說法：只要結束戰爭的談判有進展，新的打擊「非常不可能」發生——但他同時把克制綁在伊朗簽署一份強力協議上。他也明說，美國對荷莫茲海峽（Strait of Hormuz）的海上封鎖目前照舊。油市立即重新定價：布蘭特原油（Brent）週一收跌 5.75 美元、跌幅 5.85%，收在每桶 92.57 美元，創 8 月底以來新低，盤後續跌逾 7 美元；美國西德州原油（WTI）收跌 4.38% 至 86.85 美元。布蘭特原油上週已先跌了 16%。\n為什麼重要\n這是這場戰爭以來華府最明確的降溫訊號：總統公開把新打擊收回桌下、歸功海灣調停方，並把暫停綁在外交進展、而非軍事需要上。但訊號比市場反應窄得多：真正掐住海灣石油流量的封鎖並未解除，克制明示是暫時且附條件的，而荷莫茲周邊的戰火也沒停——伊朗革命衛隊稱週日有三艘油輪在海峽爆炸起火。換句話說，油價正在為一份還沒有人簽字的協議定價；談判若卡住，同樣的油價可以一樣快地漲回去。\n來源異同\n路透社、《華爾街日報》與台灣財經媒體對核心事實——暫緩打擊、卡達會談、油價重挫——說法一致。分歧在外交究竟走到了哪一步：部分台灣媒體引述 Al Arabiya 消息人士，稱美伊已就核談判達成初步共識；以色列媒體則報導伊朗已批准卡達斡旋的暫時協議條款——伊朗重開荷莫茲、停止攻擊油輪，換取美國解除封鎖、釋放凍結在卡達的 80 億美元伊朗資金。但這些條款未獲任何一方政府證實：伊朗高階安全官員稱，除非華府先就伊朗的條件採取實際步驟，德黑蘭不打算談判；美方與海灣官員也對「協議在即」表示懷疑。本卡以路透口徑為準：已證實的是暫緩打擊與克制訊號，不是協議達成。\n仍不確定\n暫時協議是否存在、條款為何，美伊雙方都未證實。川普的克制明示附條件（「目前」）且可隨時收回，封鎖仍在實施。伊朗外長稱，德黑蘭仍願在「各戰線停火」的前提下於兩天內重開荷莫茲——這個前提美方尚未接受。接下來要看的是：封鎖是否在實務上鬆動、以及海峽油輪交通能否在不再遇襲的情況下恢復。"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-03-trump-holds-off-iran-strikes\",\"category\":\"interna \"The international benchmark for oil prices; it settled down 5.85% at $92.57 a barrel on Monday.\",\"zh-TW\":\"國際油價基準；週一收跌 5.85% 至每桶 92.57 美元。\"}},{\"term\":{\"en\":\"Naval blockade\",\"zh-TW\":\"海上封鎖\"},\"blurb\":{\"en\":\"The US naval operation restricting shipping through the Strait of Hormuz; Trump said it stays in place for now despite the strike pause.\",\"zh-TW\":\"美國海軍限制荷莫茲海峽航運的行動；川普說暫緩打擊之餘，封鎖目前照舊。\"}},{\"term\":{\"en\":\"Qatar (mediator)\",\"zh-TW\":\"卡達（調停方）\"},\"blurb\":{\"en\":\"Gulf state acting as chief intermediary between Washington and Tehran; its prime minister met Trump at the White House on Monday.\",\"zh-TW\":\"在華府與德黑蘭之間擔任主要調人的海灣國家；其首相週一在白宮與川普會談。\"}},{\"term\":{\"en\":\"Interim agreement\",\"zh-TW\":\"暫時協議\"},\"blurb\":{\"en\":\"A reported short-term deal — Hormuz reopened for an end to the blockade and release of frozen funds — that neither government has confirmed.\",\"zh-TW\":\"外傳的短期安排——以重開荷莫茲換取解除封鎖與釋放凍結資金——未獲任何一方政府證實。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-international-03-trump-holds-off-iran-strikes/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-internatio
