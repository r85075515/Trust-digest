 Tuesday, board chairman Harvey Jones said Huang resigned on November 12 \"after disclosure of personal behavior inconsistent with the company's code of conduct, standards, and cultural norms,\" and that \"the Nvidia board unanimously accepted his resignation and does not intend to reinstate Jensen as CEO.\" Jones said the board has retained the search firm Heidrick \u0026 Struggles and is weighing internal and external candidates, and that he and interim CEO Colette Kress would take no questions about the circumstances of Huang's departure.\n\nWhat happened: The statement ended a day of open pressure: Huang's morning statement offering to return, a petition of roughly 180,000 to 200,000 signatures, an employee letter to Jones, and President Trump's public support for reinstatement on Monday. The board answered with its first on-the-record position since the resignation, delivered at the top of its first earnings call without Huang. The numbers underneath were strong: third-quarter revenue of $115.8 billion, up 103% year over year and 20% sequentially, beat the $109.1 billion LSEG consensus; adjusted EPS of $2.68 beat the $2.48 expected; data center revenue more than doubled to $107.6 billion. Fourth-quarter guidance of $130.0 billion, plus or minus 3%, topped the $125.25 billion consensus and assumes no data-center compute revenue from China; Kress also raised the fiscal 2028 growth outlook to about 75%, from 70% in August. Shares swung after hours before recovering to trade roughly 2–3% higher during the call; the stock remains down about 17% this year.\n\nWhy it matters: The comeback question is now settled by the only body that can settle it. What remains is the search — with Treasury Secretary Scott Bessent publicly insisting the hire come from outside, and the board now formally considering both paths — plus the independent investigation and Huang's December congressional testimony, which proceed regardless of who holds the CEO title.\n\nSources agree / disagree: CNBC, Engadget, The Times and Reuters carry Jones's wording identically; after-hours share moves are described with small variations (an initial dip, then up about 2–3% during the call), presented here as a range.\n\nStill uncertain: The board gave no timeline for naming a permanent CEO and no detail on the investigation; whether Huang's congressional testimony in December reopens the governance fight is unknown.\n\nTrust label: Multi-source agreement — the chairman's statement was made on a public earnings call and is quoted identically across outlets; earnings figures are from the company's release via Reuters and LSEG data."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"adult\":false,\"body\":{\"en\":\"$10\",\"zh-TW\":\"發生了什麼事\\n黃仁勳（Jensen Huang）上午才說「很榮幸」回任，數小時後，輝達（Nvidia）董事會在財報法說會開場就把門正式關上。董事長瓊斯（Harvey Jones）表示，黃仁勳於 11 月 12 日「在揭露與公司行為準則、標準與文化規範不符的個人行為後」辭職，「輝達董事會一致接受他的辭呈，且無意讓黃仁勳復任執行長」。瓊斯並說，董事會已聘請海德思哲（Heidrick \u0026 Struggles）獵頭公司尋找新任執行長，內部與外部人選都在考慮之列；他與臨時執行長克雷斯（Colette Kress）不會回答任何關於黃離職情事的問題。\\n\\n為什麼重要\\n這是董事會自黃辭職以來第一次具名、公開的正式立場，直接回應了一整天的施壓：黃本人的回任聲明、約 18 萬至 20 萬人的連署、員工致瓊斯的公開信，以及川普（Donald Trump）週一的公開支持。回鍋問題至此由唯一有權決定的機構拍板。接下來的主線是執行長遴選——財政部長貝森特（Scott Bessent）公開堅持必須外找，董事會則正式表示內外都在看——以及不因人事而停的獨立調查與黃 12 月的國會作證。同場公布的辭職後首份財報數字強勁：第三季營收 1,158 億美元、年增 103%，優於市場預期的 1,091 億；資料中心營收翻倍至 1,076 億美元；第四季財測約 1,300 億美元（±3%），高於市場預期的 1,252.5 億，且未假設任何中國資料中心算力收入；克雷斯並把下一會計年度成長展望自 70% 上修至約 75%。股價盤後一度震盪，法說期間回到約漲 2–3%；惟今年以來仍跌約 17%。\\n\\n來源異同\\nCNBC、Engadget、《泰晤士報》與路透對瓊斯原話的引述完全一致；盤後股價走勢各家描述略有出入（一度下跌、其後於法說期間漲約 2–3%），本文以區間並列。財報數字出自公司發布、經路透與 LSEG 數據核對。\\n\\n仍不確定\\n董事會未給出新任執行長的任命時程，也未透露獨立調查進度；黃 12 月的國會作證是否重燃治理爭議，仍屬未知。\"},\"category\":\"semiconductor\",\"disagreements\":null,\"glossary\":[{\"blurb\":{\"en\":\"Nvidia's chairman, who opened the earnings call by stating the board unanimously accepted Huang's resignation and does not intend to reinstate him.\",\"zh-TW\":\"輝達董事長，在財報法說會開場明言董事會一致接受黃仁勳辭呈、無意讓他復任執行長。\"},\"term\":{\"en\":\"Harvey Jones\",\"zh-TW\":\"瓊斯（Harvey Jones）\"}},{\"blurb\":{\"en\":\"The executive search firm the board retained to find Nvidia's next CEO, weighing internal and external candidates.\",\"zh-TW\":\"董事會聘請的獵頭公司，負責輝達新任執行長遴選，內部與外部人選並行評估。\"},\"term\":{\"en\":\"Heidrick \u0026 Struggles\",\"zh-TW\":\"海德思哲（Heidrick \u0026 Struggles）\"}},{\"blurb\":{\"en\":\"Nvidia's CFO and interim CEO, who hosted the earnings call and raised the fiscal 2028 growth outlook to about 75%.\",\"zh-TW\":\"輝達財務長兼臨時執行長，主持本場法說，並把下一會計年度成長展望上修至約 75%。\"},\"term\":{\"en\":\"Colette Kress\",\"zh-TW\":\"克雷斯（Colette Kress）\"}},{\"blurb\":{\"en\":\"Nvidia's Q3 fiscal 2027 results: revenue $115.8B (+103% YoY) and Q4 guidance of about $130B, the first report since Huang's exit.\",\"zh-TW\":\"輝達辭職後首份財報：第三季營收 1,158 億美元、年增 103%，第四季財測約 1,300 億美元。\"},\"term\":{\"en\":\"Q3 FY27 earnings\",\"zh-TW\":\"第三季財報（Q3 FY27）\"}}],\"id\":\"live-semiconductor-22-board-rules-out-huang-return\",\"imageAlt\":{\"en\":\"\",\"zh-TW\":\"\"},\"imageUrl\":\"\",\"isHeadline\":true,\"isPopular\":true,\"publishedAt\":\"2026-11-17T23:20:22.000Z\",\"sources\":[{\"name\":\"Reuters\",\"url\":\"https://www.reuters.com/business/nvidia-forecasts-quarterly-revenue-above-estimates-first-report-since-huangs-2026-11-17/\"},{\"name\":\"Engadget\",\"url\":\"https://www.engadget.com/2319982/nvidias-board-chair-says-the-company-is-not-considering-reinstating-jensen-huang-as-ceo/\"},{\"name\":\"The Times\",\"url\":\"https://www.thetimes.com/us/business-us/article/record-third-quarter-revenue-brings-relief-for-nvidia-2kx6sn6j6\"}],\"summary\":{\"en\":\"Nvidia's board closed the door on Jensen Huang's return on the record: opening Tuesday's earnings call, chairman Harvey Jones said the board \\\"unanimously accepted his resignation and does not intend to reinstate Jensen as CEO,\\\" hours after Huang offered to come back. The board has hired Heidrick \u0026 Struggles to run the CEO search. The first post-Huang earnings beat expectations — Q3 revenue $115.8 billion, up 103% — with Q4 guidance of about $130 billion.\",\"zh-TW\":\"輝達董事會正式關上黃仁勳（Jensen Huang）的回任大門：董事長瓊斯（Harvey Jones）在週二財報法說會開場明言，董事會「一致接受他的辭呈，且無意讓黃仁勳復任執行長」——就在黃本人表態願意回任的數小時後。董事會已聘海德思哲（Heidrick \u0026 Struggles）展開執行長遴選。同場的辭職後首份財報優於預期：第三季營收 1,158 億美元、年增 103%，第四季財測約 1,300 億美元。\"},\"tags\":[],\"title\":{\"en\":\"Board Shuts the Door: Nvidia Chair Says Directors 'Do Not Intend to Reinstate' Huang, Hours After His Offer to Return\",\"zh-TW\":\"董事會正式關門：輝達董事長法說會明言無意讓黃仁勳復任執行長，辭職後首份財報營收翻倍\"},\"trustBreakdown\":{\"crossCorroboration\":25,\"outletReputation\":24,\"recencyClarity\":15,\"sourceDiversity\":22},\"trustScore\":86}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-semiconductor-22-board-rules-out-huang-return/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-semiconductor-22-board-rules-out-huang-return/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explaina
