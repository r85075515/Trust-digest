ing nearly 750,000 beneficiaries to cast ballots through December 15 ahead of a formal beneficiaries' meeting on December 18. The split ratio is preliminarily estimated at 1-for-7, aimed at lowering the trading threshold and increasing portfolio allocation flexibility.\n\nFounded in June 2012 at an initial issue price of NT$30 per unit, 006208 has seen its net asset value climb to around NT$210 per unit. Under a 1-for-7 split, each existing board lot of 1,000 units worth roughly NT$210,000 would convert into seven lots priced at approximately NT$30,000 each, without changing total investor equity.\n\nPassage of the split requires attendance by beneficiaries representing more than half of all issued units and approval from more than half of the voting rights present. If approved, Fubon expects to suspend trading briefly in mid-February 2027 and resume post-split trading on February 23, 2027.\n\nTrust label: Multi-source agreement — United Daily News, Business Today, and Anue consistently report the voting timeline, 1-for-7 preliminary ratio, and February 2027 execution schedule."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-153-fubon-006208-etf-split-voting-begins\",\"category\":\"finance\",\"title\":{\"en\":\"Fubon Opens Shareholder Vote on 1-for-7 Split of Taiwan 50 ETF (006208)\",\"zh-TW\":\"富邦台50（006208）分割投票正式開跑 暫估1拆7降投資門檻\"},\"summary\":{\"en\":\"Fubon Asset Management opened electronic voting on November 27 for a proposed 1-for-7 split of its 006208 ETF, potentially cutting the per-lot entry price from NT$210,000 to NT$30,000.\",\"zh-TW\":\"富邦投信於11月27日起正式開放富邦台50 ETF（006208）分割案電子投票，近75萬名受益人可參與表決至12月15日，並於12月18日召開受益人會議。本次分割倍數暫估為1拆7，若順利通過並於明年2月執行，每張交易金額有望從約21萬元降至3萬元，大幅降低小資族投資門檻。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n富邦投信於11月26日舉行記者會後，自11月27日起至12月15日正式開放富邦台50 ETF（006208）分割案電子投票，近75萬名受益人可透過集保電子投票平台或證券下單應用程式行使表決權，並將於12月18日以書面方式召開受益人會議公布結果。\\n\\n「為什麼重要」\\n006208自2012年以每單位30元發行以來淨值持續攀升，本次分割倍數暫估為1拆7；若以每單位淨值210元估算，分割後每單位淨值將調整為30元，整張交易金額可望由約21萬元降至3萬元。此舉雖不改變受益人總資產價值，但能顯著降低投資門檻並提升資金配置與定期定額彈性。\\n\\n「來源異同」\\n聯合新聞網、今周刊與鉅亨網報導的投票起訖日、近75萬受益人數、暫估1拆7倍數及12月18日開會時程完全一致；今周刊進一步詳列通過門檻須達已發行總數二分之一以上出席且出席表決權二分之一以上同意，以及預計2027年2月23日恢復交易的完整時程表。\\n\\n「仍不確定」\\n分割議案仍須待12月18日受益人會議達法定出席與同意門檻方能正式通過，且最終實際分割倍數將依執行前基準日淨值換算確定。\\n\\nTrust label: Multi-source agreement — 聯合新聞網、今周刊與鉅亨網對006208分割投票時程與暫估倍數報導完全一致。\"},\"glossary\":[{\"term\":{\"en\":\"ETF unit split\",\"zh-TW\":\"ETF 受益憑證分割\"},\"blurb\":{\"en\":\"Dividing each existing fund unit into multiple lower-priced units proportionally, reducing per-lot trading cost without altering total asset value.\",\"zh-TW\":\"將既有基金單位按固定比例拆分為多份較低單價的單位，總資產價值不變但可降低單張交易門檻。\"}},{\"term\":{\"en\":\"Beneficiaries' meeting\",\"zh-TW\":\"受益人會議\"},\"blurb\":{\"en\":\"A formal governance vote by fund unit holders required to approve structural changes such as splits, mergers, or fee revisions.\",\"zh-TW\":\"共同基金或 ETF 持有人針對分割、合併或修改信託契約等重大事項進行表決的法定會議。\"}},{\"term\":{\"en\":\"Net Asset Value (NAV)\",\"zh-TW\":\"每單位淨值（NAV）\"},\"blurb\":{\"en\":\"The per-unit market value of a fund's total assets minus liabilities, used as the baseline for pricing and split calculations.\",\"zh-TW\":\"基金總資產扣除負債後除以發行總單位數所得的每單位價值，作為交易與分割換算基準。\"}}],\"sources\":[{\"name\":\"聯合新聞網 UDN\",\"url\":\"https://udn.com/news/story/7239/9904916\"},{\"name\":\"今周刊 Business Today\",\"url\":\"https://www.businesstoday.com.tw/article/category/183013/post/202611260034/\"},{\"name\":\"鉅亨網 Anue (via TradingView)\",\"url\":\"https://tw.tradingview.com/news/cnyes:a63c41baeacdf:0/\"}],\"imageUrl\":\"/covers/live/live-finance-153-fubon-006208-etf-split-voting-begins.png\",\"imageAlt\":{\"en\":\"Cover related to: Fubon Opens Shareholder Vote on 1-for-7 Split of Taiwan 50 ETF (006208)\",\"zh-TW\":\"相關封面圖：富邦台50（006208）分割投票正式開跑 暫估1拆7降投資門檻\"},\"isHeadline\":false,\"isPopular\":true,\"trustScore\":90,\"trustBreakdown\":{\"crossCorroboration\":23,\"outletReputation\":22,\"recencyClarity\":23,\"sourceDiversity\":22},\"publishedAt\":\"2026-11-27T17:45:24.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":23,\"D2\":22,\"D3\":23,\"D4\":22,\"D5\":22,\"total\":22},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-finance-153-fubon-006208-etf-split-voting-begins/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-finance-153-fubon-006208-etf-split-voting-begins/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"d:\"$8:metadata\"\n"])</script></body></html>
