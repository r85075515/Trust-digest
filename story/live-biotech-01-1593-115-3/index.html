 news here, not the routine report approval. A board that signs off on quarterly accounts and then declines to distribute a dividend is telling shareholders to expect the cash to stay in the company, whether for investment or caution. For Qihua holders, the filing is a small but direct signal about capital allocation this quarter.\nSources agree / disagree\nAll three feed items come from GeneOnline, so this is one outlet's filing feed rather than independent corroboration, and the bundle mixes two different companies. Trust label: Bundled stories — one outlet's feed groups Qihua's report, Qihua's dividend decision and Kwong Yue's report together.\nStill uncertain\nThe snippets carry no figures from the Q3 report — no revenue, profit or margin — and no reason for the no-dividend decision. Verify details in the full filings before quoting specifics."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-biotech-01-1593-115-3\",\"category\":\"biotech\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"publishedAt\":\"2026-11-05T06:55:52.000Z\",\"title\":{\"en\":\"Qihua Board Approves Q3 2026 Financial Report and Passes on Dividend\",\"zh-TW\":\"祺驊（Qihua）董事會通過 115 年第 3 季財報，決議不發放股利\"},\"summary\":{\"en\":\"[Unconfirmed — single source] Qihua (1593) says its board approved the consolidated financial report for Q3 2026 and resolved not to pay a Q3 dividend, according to GeneOnline filings dated November 5. The same feed bundle also carries a separate Q3 report approval from Kwong Yue (4438), a different company.\",\"zh-TW\":\"［未證實·單一來源］祺驊（1593）公告董事會通過 115 年第 3 季合併財務報告，並決議不發放第 3 季股利，公告日期為 11 月 5 日。同一批來源另有廣越（4438）通過第 3 季財報的公告，屬於不同公司，閱讀時不要混為一談。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"祺驊（1593）公告董事會通過 115 年第 3 季合併財務報告，並決議不發放第 3 季股利。基因線上（GeneOnline）11 月 5 日刊出相關公告。\\n發生了什麼事\\n11 月 5 日有兩則祺驊公告。董事會通過 115 年第 3 季合併財務報告，另一則董事會決議不發放第 3 季股利。公告發言人為執行副總經理連子瑞（Lian Zih-rui）與財務長彭昶惟（Peng Chang-wei），發言時間分別為 14 點 53 分與 14 點 49 分。同一批來源另有一則廣越（4438）通過第 3 季財報的公告，那是不同公司，只是被來源管道歸在同一批，不是祺驊的子公司。\\n為什麼重要\\n真正的新聞是不發股利的決議，不是例行的財報通過。董事會簽核季報、接著決定不發股利，等於告訴股東現金要留在公司裡，無論是為了投資還是保守以對。對祺驊股東來說，這份公告是本季資金配置的直接訊號。\\n來源異同\\n三則來源都出自基因線上，實際上是一家媒體的公告管道，不是獨立佐證，而且同一批混進了兩家不同公司。信任標籤：多則合併——同一家媒體的來源把祺驊財報、祺驊股利決議與廣越財報歸在一起。\\n仍不確定\\n來源摘要沒有第 3 季財報數字，沒有營收、獲利或毛利率，也沒有說明不發股利的理由；引用細節前請查閱完整公告。\"},\"sources\":[{\"name\":\"基因線上 GeneOnline\",\"url\":\"https://geneonline.news/%E7%A5%BA%E9%A9%8A-1593-%E5%85%AC%E5%91%8A%E6%9C%AC%E5%85%AC%E5%8F%B8%E8%91%A3%E4%BA%8B%E6%9C%83%E9%80%9A%E9%81%8E115%E5%B9%B4%E7%AC%AC3%E5%AD%A3%E5%90%88%E4%BD%B5%E8%B2%A1%E5%8B%99%E5%A0%B1/\"}],\"disagreements\":null,\"trustScore\":47,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":10,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"biotech\",\"live-ingest\",\"基因線上-geneonline\",\"基因線上-geneonline\",\"基因線上-geneonline\"],\"glossary\":[{\"term\":{\"en\":\"Qihua\",\"zh-TW\":\"祺驊\"},\"blurb\":{\"en\":\"Taiwan-listed company (1593) whose board approved its Q3 2026 financial report.\",\"zh-TW\":\"台灣上市公司（1593），董事會通過 115 年第 3 季財報。\"}},{\"term\":{\"en\":\"Kwong Yue\",\"zh-TW\":\"廣越\"},\"blurb\":{\"en\":\"Taiwan-listed company (4438) whose separate Q3 report approval was bundled in the same feed.\",\"zh-TW\":\"台灣上市公司（4438），第 3 季財報公告被歸在同一批來源。\"}},{\"term\":{\"en\":\"GeneOnline\",\"zh-TW\":\"基因線上\"},\"blurb\":{\"en\":\"Taiwanese biotech news outlet that carried the filings.\",\"zh-TW\":\"刊出相關公告的台灣生技新聞媒體。\"}},{\"term\":{\"en\":\"Lian Zih-rui\",\"zh-TW\":\"連子瑞\"},\"blurb\":{\"en\":\"Executive vice president of Qihua and spokesperson for one of the filings.\",\"zh-TW\":\"祺驊執行副總經理，公告發言人之一。\"}},{\"term\":{\"en\":\"Peng Chang-wei\",\"zh-TW\":\"彭昶惟\"},\"blurb\":{\"en\":\"Chief financial officer of Qihua and spokesperson for one of the filings.\",\"zh-TW\":\"祺驊財務長，公告發言人之一。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"]
