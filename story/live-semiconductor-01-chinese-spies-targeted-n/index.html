ned\nSources claim that an executive at a Singapore AI firm suspected of steering Nvidia chips to China, with close business ties to Huang, was passing information to Beijing as a Chinese intelligence asset. The executive was not named. According to The New York Times, US intelligence has known of her activities for over a year and briefed President Donald Trump, but the summary does not state what was briefed. Both outlets frame it as a spy plot targeting Huang.\nWhy it matters\nThe judgment is direct: the claim, if accurate, would place an alleged intelligence asset close to the head of a company central to AI chip controls, linking chip diversion and national security. The summaries present it as belief and allegation, not established fact, so readers should treat it as an unconfirmed intelligence claim.\nSources agree / disagree\nThe Decoder and Tom's Hardware relayed the New York Times report with consistent accounts of the unnamed executive, the alleged information passing, and the briefing. Trust label: Two-source agreement — two outlets agree on the relayed report's core claims.\nStill uncertain\nThe material did not name the executive or firm, state what information was allegedly passed, or whether Nvidia, Huang, or any government confirmed or denied it. It did not state what Trump was briefed on. Verify the full reporting before treating the allegation as fact."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-01-chinese-spies-targeted-n\",\"category\":\"semiconductor\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-semiconductor-01-chinese-spies-targeted-n.png\",\"imageAlt\":{\"en\":\"Cover related to: Chinese spies targeted Nvidia CEO Jensen Huang, according to The New York Times\",\"zh-TW\":\"相關封面圖：根據《紐約時報》報道，中國間諜瞄準了英偉達執行長黃仁勳\"},\"publishedAt\":\"2026-10-29T13:42:38.000Z\",\"title\":{\"en\":\"Jensen Huang Targeted in Reported Chinese Spy Plot, New York Times Says\",\"zh-TW\":\"黃仁勳（Jensen Huang）據報成為中國間諜陰謀目標\"},\"summary\":{\"en\":\"US intelligence agencies believe an unnamed executive close to Nvidia chief Jensen Huang was passing information to Beijing, according to a New York Times report. The claim remains an allegation relayed by two outlets, with no named executive, firm, or official confirmation disclosed in the material provided.\",\"zh-TW\":\"根據《紐約時報》報導，美國情報機構認為黃仁勳（Jensen Huang）身邊一名未具名高階主管向北京傳遞資訊；此說法仍屬經兩家媒體轉述的指控，未公開高階主管姓名、公司名稱或官方證實，須審慎看待。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"根據《紐約時報》報導，美國情報機構認為，輝達（Nvidia）執行長黃仁勳（Jensen Huang）身邊圈子裡的一名高階主管是中國的線人，The Decoder 與 Tom's Hardware 轉述了這項報導。\\n發生了什麼事\\n摘要指出，多個消息來源稱，新加坡一家 AI 公司的一名高階主管涉嫌將 Nvidia 的 AI 圖形處理器引導至中國，且與黃仁勳有密切業務關係，顯然以中國情報資產身分向北京傳遞資訊；該名高階主管在提供的材料中沒有具名。根據《紐約時報》，美國情報部門已知悉她的活動超過一年，並已向川普（Donald Trump）總統簡報，但截斷的摘要到此為止，沒有說明簡報內容。The Decoder 的標題把報導描述為中國間諜針對黃仁勳，Tom's Hardware 則描述為黃仁勳可能透過一名中國情報資產成為間諜陰謀的目標。\\n為什麼重要\\n判斷很直接：如果說法屬實，意味著一名被指稱的情報資產接近一家處於 AI 晶片管制核心的公司負責人，把企業人脈、晶片流向與國家安全連結起來。也正因如此，據報向總統簡報一事才重要，但摘要把說法呈現為情報機構的認定與指控，而非已確立的事實；在相關證據或官方回應公開前，應視為經媒體轉述的情報說法。\\n來源異同\\nThe Decoder 與 Tom's Hardware 轉述了同一篇《紐約時報》報導，對未具名高階主管、被指稱的傳遞資訊行為與簡報一事的說法一致。信任標籤：雙源一致——兩家媒體對轉述報導的核心主張報導一致。\\n仍不確定\\n材料沒有具名該高階主管或新加坡公司，沒有說明被指稱傳遞了什麼資訊、說法背後的消息來源，也沒有說明 Nvidia、黃仁勳、該公司或任何政府是否證實或否認；沒有說明川普獲簡報的內容或後續行動。在把指控視為事實前，請查閱《紐約時報》完整報導與任何官方回應。\"},\"sources\":[{\"name\":\"The Decoder\",\"url\":\"https://the-decoder.com/chinese-spies-targeted-nvidia-ceo-jensen-huang-according-to-the-new-york-times/\"},{\"name\":\"Tom's Hardware\",\"url\":\"https://www.tomshardware.com/tech-industry/policy/nvidia-ceo-jensen-huang-may-have-been-the-target-of-a-spy-plot-through-chinese-intelligence-asset-report-claims-exec-from-firm-under-investigation-for-smuggling-banned-ai-chips-to-china-accused-of-being-a-spy-was-also-feeding-information-to-beijing\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":13,\"outletReputation\":10,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"semiconductor\"
