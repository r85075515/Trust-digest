ack of 1-ounce Lay's Barbecue potato chip bags for $15.18, dropping to $12.90 after a 10% clipped coupon and 5% Subscribe \u0026 Save. The offer is limited to select Amazon accounts, with free shipping for Prime members or on orders over $35. Slickdeals score +36.\",\"zh-TW\":\"Amazon 上架樂事燒烤味洋芋片40包1盎司裝，售價15.18美元，剪下商品頁10%折價券再享訂閱制95折，實付12.90美元。僅限部分 Amazon 帳號，Prime 會員或滿35美元免運。Slickdeals 社群評分 +36。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"Amazon 上架樂事燒烤味洋芋片40包1盎司裝，折後12.90美元，平均一包約0.32美元。\\n發生了什麼事\\nSlickdeals 刊登：40包裝售價15.18美元，剪下商品頁10%折價券再享訂閱制95折，實付12.90美元。Prime 會員或滿35美元免運。這筆交易僅限部分 Amazon 帳號，折價券通常每帳號限用一次，下單須先登入。Slickdeals 社群評分 +36。\\n為什麼重要\\n平均一包約0.32美元，比單包零食便宜，這正是整箱買的意義——前提是買家的帳號看得到這張券，優惠並非人人有份。\\n來源異同\\n交易來自 Slickdeals 首頁單一刊登，價格引自 Amazon；結帳時請再確認12.90美元總價。信任標籤：單一來源——僅 Slickdeals 一家刊登。\\n仍不確定\\n哪些帳號符合資格沒有說明，折價券與訂閱制折扣維持多久也未知。\"},\"sources\":[{\"name\":\"Slickdeals Frontpage\",\"url\":\"https://slickdeals.net/f/20316738-40-pack-1-oz-lay-s-barbecue-flavored-potato-chips-12-90-w-s-s-free-shipping-w-prime-or-on-35?utm_source=rss\u0026utm_content=fp\u0026utm_medium=RSS2\"}],\"disagreements\":null,\"trustScore\":47,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":10,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"shopping\",\"live-ingest\",\"slickdeals-frontpage\"],\"glossary\":[{\"term\":{\"en\":\"Lay's\",\"zh-TW\":\"樂事\"},\"blurb\":{\"en\":\"Snack brand behind the barbecue potato chips.\",\"zh-TW\":\"零食品牌，本洋芋片的製造商。\"}},{\"term\":{\"en\":\"Amazon\",\"zh-TW\":\"亞馬遜\"},\"blurb\":{\"en\":\"Online retailer selling the 40-pack.\",\"zh-TW\":\"線上零售商，本案賣場。\"}},{\"term\":{\"en\":\"Subscribe \u0026 Save\",\"zh-TW\":\"訂閱制\"},\"blurb\":{\"en\":\"Amazon subscription program giving 5% off here.\",\"zh-TW\":\"亞馬遜訂閱方案，本案享95折。\"}},{\"term\":{\"en\":\"Slickdeals\",\"zh-TW\":\"Slickdeals\"},\"blurb\":{\"en\":\"Deal-sharing community that flagged the offer.\",\"zh-TW\":\"優惠分享社群，刊登本筆交易。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":
