People exercising more than eight hours per week showed almost no average cognitive decline, suggesting that staying active may offer important benefits as the disease progresses.\nWhat happened\nThe study tracked physical activity against the course of the disease over seven years. The pattern held across the measures the summary names: memory, thinking, and movement all declined more slowly in more active patients, and the most active group, above eight hours a week, barely declined cognitively on average. The finding is presented as a benefit of staying active, not as a treatment claim.\nWhy it matters\nParkinson's is a progressive disease, so anything that slows decline matters enormously to patients and families, even before it becomes a drug. Exercise is cheap, available, and already recommended for general health; evidence that it tracks with slower decline gives doctors and patients a concrete reason to protect activity levels. The next question is whether structured exercise programs can reproduce the effect deliberately.\nSources agree-disagree\nThis card rests on a single outlet, ScienceDaily's health and medicine coverage, which bundled four separate research items into one feed cluster. The Parkinson's study is the card's main story; the same bundle also lists a dental-implant infection finding, a virus-assembly discovery, and a hidden immune defense against small cell lung cancer, each noted here in one line and not expanded. Trust label: single source only.\nStill uncertain\nThe summary gives no sample size, no study design, and no answer to the central question: does exercise slow the disease, or do people whose disease progresses more slowly simply stay more active? Until the full study is read, this card treats the link as an association, not a proven cause."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-biotech-01-scientists-discover-a-su\",\"category\":\"biotech\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-biotech-01-scientists-discover-a-su.webp\",\"imageAlt\":{\"en\":\"Cover related to: Scientists discover a surprising double benefit of exercise for Parkinson’s\",\"zh-TW\":\"相關封面圖：科學家發現運動對帕金森氏症有驚人的雙重好處\"},\"publishedAt\":\"2026-10-23T11:12:28.000Z\",\"title\":{\"en\":\"Parkinson's Patients Who Exercise More Decline More Slowly, Seven-Year Study Finds\",\"zh-TW\":\"巴金森氏症（Parkinson's）患者動得越多退化越慢，七年研究證實\"},\"summary\":{\"en\":\"People with Parkinson's disease who were more physically active saw slower declines in memory, thinking, and movement over seven years, and those exercising over eight hours a week showed almost no average cognitive decline. Staying active may offer real benefits as the disease progresses. The summary does not say whether the link is cause or correlation.\",\"zh-TW\":\"一項七年研究發現，巴金森氏症患者身體活動量越大，記憶、思考與行動能力的退化越慢；每週運動超過 8 小時者，平均認知幾乎沒有衰退。保持活動可能在疾病進展過程中帶來實質好處。接下來看完整研究怎麼說：摘要沒交代這是相關性還是因果。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"一項七年研究發現，運動對巴金森氏症患者有令人意外的雙重好處：身體活動量越大的人，記憶、思考與行動能力的退化越慢。每週運動超過 8 小時者，平均認知幾乎沒有衰退，顯示保持活動可能在疾病進展過程中帶來重要好處。\\n發生了什麼事\\n研究用七年時間追蹤身體活動量與疾病進展的關係。摘要點名的三項指標都呈現同一模式：活動量越大，記憶、思考、行動退化越慢；最活躍的一組每週運動超過 8 小時，平均認知幾乎沒有衰退。這項發現定位為保持活動的好處，不是治療宣稱。\\n為什麼重要\\n巴金森氏症是進行性疾病，任何能讓退化變慢的因素，對患者與家屬都意義重大，即使它還不是藥物。運動便宜、隨手可得，本來就對一般健康有益；有證據顯示它與較慢的退化相關，給醫師與患者一個具體理由去維持活動量。接下來的問題是：結構化的運動計畫能不能刻意重現這種效果。\\n來源異同\\n本卡只有一個來源：ScienceDaily 健康醫學版把四則獨立研究捆成同一批摘要。巴金森氏症研究是本卡主線；同批另有植牙感染、病毒組裝、小細胞肺癌免疫防禦三則，此處各用一句帶過，不展開。信任標籤：僅1源。\\n仍不確定\\n摘要未給樣本數、研究設計，也沒回答核心問題：是運動讓疾病變慢，還是疾病進展較慢的人本來就動得比較多？在讀到完整研究之前，本卡把這層關係當成相關性，而非已證實的因果。\"},\"sources\":[{\"name\":\"ScienceDaily 健康醫學\",\"url\":\"https://www.sciencedaily.com/releases/2026/10/261022081314.htm\"}],\"disagreements\":null,\"trustScore\":54,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":17,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"biotech\",\"live-ingest\",\"sciencedaily-健康醫學\",\"sciencedaily-健康醫學\",\"sciencedaily-健康醫學\"],\"glossary\":[{\"term\":{\"en\":\"Parkinson's disease\",\"zh-TW\":\"巴金森氏症\"},\"blurb\":{\"en\":\"Progressive disease whose patients were tracked in the seven-year study.\",\"zh-TW\":\"七年研究追蹤對象的進行性疾病。\"}},{\"term\":{\"en\":\"ScienceDaily\",\"zh-TW\":\"ScienceDaily\"},\"blurb\":{\"en\":\"Science news outlet whose health coverage bundled the four research items.\",\"zh-TW\":\"健康版把四則研究捆成一批的新聞媒體。\"}},{\"term\":{\"en\":\"Dental implant\",\"zh-TW\":\"植牙\"},\"blurb\":{\"en\":\"Titanium implant at the center of the bundle's infection finding.\",\"zh-TW\":\"同批感染研究主角的鈦金屬植體。\"}},{\"term\":{\"en\":\"Small cell lung cancer\",\"zh-TW\":\"小細胞肺癌\"},\"blurb\":{\"en\":\"Aggressive cancer targeted by the bundle's hidden immune defense finding.\",\"zh-TW\":\"同批免疫防禦研究針對的侵襲性癌症。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://r85075515.github.io/Trust-digest/\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"Axiom\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"zh_TW\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:locale:alternate\",\"content\":\"en_US\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"9\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\
