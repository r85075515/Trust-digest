h European leaders this week. The BBC and The Guardian both preview the speech.\nWhat happened\nBurnham is due to tell the audience on Monday that Brexit 'has not worked' and to pledge that he will sign a new deal with the European Union. He will meet European leaders at a summit this week and aims to secure agreements that 'could raise GDP by 0.4%'. The remarks follow a string of comments criticising Brexit: on Saturday he told the Welsh Labour conference that the UK has 'lost more than we gained'. The Guardian reports the same planned remarks, confirming the BBC's preview. The speech itself has not yet been delivered, so the reports describe what Burnham is expected to say.\nWhy it matters\nA prime minister declaring Brexit a failure and promising a new EU deal is a sharp political signal, and the 0.4% GDP figure gives the pledge an economic frame. If the summit produces the agreements Burnham describes, it would mark a concrete shift in the UK's relationship with the EU rather than just rhetoric. The test now is whether the summit delivers — a speech is a promise, not a deal.\nSources agree / disagree\nThe BBC and The Guardian agree on the planned remarks, the summit timing and the GDP figure. Trust label: Multi-source agreement — two outlets agree on what Burnham will say and what the summit is meant to deliver.\nStill uncertain\nThe details of the new deal are not given: which agreements are on the table, which leaders Burnham will meet, and how the 0.4% GDP estimate was calculated. Because the speech has not happened yet, the wording could also change. Check the full reports and the speech itself before quoting the remarks as delivered."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-03-uk-lost-more-than-it-gai\",\"category\":\"international\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-international-03-uk-lost-more-than-it-gai.jpg\",\"imageAlt\":{\"en\":\"Cover related to: UK lost more than it gained from Brexit, Burnham to say ahead of EU summit\",\"zh-TW\":\"相關封面圖：伯納姆在歐盟高峰會前表示，英國脫歐帶來的損失大於收益\"},\"publishedAt\":\"2026-11-16T08:15:07.000Z\",\"title\":{\"en\":\"Burnham to Say Brexit 'Has Not Worked' and Pledge New EU Deal Ahead of Summit\",\"zh-TW\":\"伯納姆（Andy Burnham）將在歐盟峰會前表態：脫歐「沒有奏效」，將簽新協議\"},\"summary\":{\"en\":\"Prime Minister Andy Burnham will say on Monday that the Brexit Britain was given 'has not worked' and that the UK has 'lost more than we gained', the BBC and The Guardian report. He will pledge a new EU deal ahead of this week's summit that could raise GDP by 0.4%. Watch whether the summit delivers that agreement.\",\"zh-TW\":\"英國首相伯納姆（Andy Burnham）將在週一演說中表示，英國得到的脫歐協議「沒有奏效」，英國「失去的比得到的更多」，BBC 與《衛報》報導。他本週將與歐洲領袖會面，爭取簽署可能讓 GDP 提升 0.4% 的新協議。接下來看峰會能否兌現這項協議。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"英國首相伯納姆（Andy Burnham）將在週一演說中表示，英國得到的脫歐協議「沒有奏效」，英國「失去的比得到的更多」，BBC 與《衛報》都預告了這場演說。他本週將與歐洲領袖會面，爭取簽署新協議。\\n發生了什麼事\\n伯納姆預定週一表示，脫歐「沒有奏效」，並承諾將與歐盟簽署新協議。他本週將在峰會上與歐洲領袖會面，爭取達成「可能讓 GDP 提升 0.4%」的協議。這是他一連串批評脫歐的最新發言：週六他在威爾斯工黨會議上才說，英國「失去的比得到的更多」。《衛報》報導了同樣的預定發言，與 BBC 的預告互相印證。演說尚未發表，報導描述的是他預計要說的話。\\n為什麼重要\\n首相公開認定脫歐失敗、承諾簽新協議，是強烈的政治信號，0.4% 的 GDP 數字又給了承諾一個經濟框架。如果峰會真的談成伯納姆所說的協議，英國與歐盟的關係將出現實質轉變，不只是口頭表態。現在的考驗是峰會能不能兌現——演說是承諾，不是協議。\\n來源異同\\nBBC 與《衛報》對預定發言、峰會時程與 GDP 數字一致。信任標籤：2源一致——兩家對伯納姆將說什麼、峰會要達成什麼的報導一致。\\n仍不確定\\n新協議的細節沒有交代：談判桌上有哪幾項協議、伯納姆會見哪些領袖、0.4% 的 GDP 估算怎麼算出來的。演說尚未發表，用語也可能變動。引用發言前請查閱完整報導與演說原文。\"},\"sources\":[{\"name\":\"BBC UK\",\"url\":\"https://www.bbc.co.uk/news/articles/crp3e1n5kezpo?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"The Guardian UK News\",\"url\":\"https://www.theguardian.com/politics/2026/nov/16/andy-burnham-brexit-has-not-worked-sign-new-deal-with-eu\"}],\"disagreements\":null,\"trustScore\":72,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":19,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"international\",\"live-ingest\",\"bbc-uk\",\"the-guardian-uk-news\"],\"glossary\":[{\"blurb\":{\"en\":
