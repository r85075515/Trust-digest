lywood Life, Just Jared"])</script><script>self.__next_f.push([1,"11:Tac8,"])</script><script>self.__next_f.push([1,"泰勒絲 (Taylor Swift) 和傑克安東諾夫 (Jack Antonoff) 以及路德維希戈蘭森 (Ludwig Göransson) 於 11 月 18 日星期三開始了他們向廣泛預測的奧斯卡榮耀邁進的漫長征程，當時第 17 屆年度好萊塢音樂媒體獎 (HMMA) 在加利福尼亞州好萊塢的阿瓦隆頒獎典禮上舉行。 發生了什麼事\n泰勒絲 (Taylor Swift) 和傑克安東諾夫 (Jack Antonoff)、路德維希戈蘭森 (Ludwig Göransson) 榮獲 2026 年好萊塢音樂媒體獎：完整獲獎者名單。 11 月 18 日星期三，第 17 屆年度好萊塢音樂媒體獎 (HMMA) 在加利福尼亞州好萊塢的阿瓦隆頒獎典禮上，泰勒·斯威夫特 (Taylor Swift) 和傑克·安東諾夫 (Jack Antonoff) 以及路德維希·戈蘭森 (Ludwig Göransson) 開始了他們向廣泛預測的奧斯卡榮耀邁進的漫途征途。史威夫特和安東諾夫為《玩具總動員 5》創作的《我知道，我知道你》贏得了動畫電影歌曲獎。泰勒絲 (Taylor Swift) 在預先錄製的影片中接受了她的第一個 HMMA，影片中顯示泰勒絲 (Taylor Swift) 回到了她鄉村音樂事業起飛的地方…在 CMA 頒獎典禮上，以兩首歌迷最愛的歌曲《我們的歌》和《我知道，我知道你》的混搭呈現了懷舊的表演。週三晚上，泰勒重返 CMA 舞台……鄉村音樂協會獎正在慶祝具有里程碑意義的一年……一些最大的鄉村明星很早就出現在紅地毯上展示他們最好的造型。第 60 屆年度活動將於週三晚上舉行，帶來盛大的…鄉村音樂明星雲集之夜在音樂城拉開序幕！以下是今年 CMA 獲獎者名單（即時更新）。 為什麼這很重要\n此集群由娛樂類別中 4 個頻道（Billboard、TMZ、Hollywood Life、Just Jared）的 5 個 Feed 項目組成。 Axiom 連結到每個出版商；該摘要僅重述標題和簡短的提要描述，而不是完整的文章。 消息來源同意/不同意\n多家媒體報導了密切相關的頭條新聞：“Taylor Swift 和 Jack Antonoff、Ludwig Göransson 贏得 2026 年好萊塢音樂媒體獎：完整獲獎者名單”（公告牌）； “泰勒·斯威夫特在闊別 13 年之後重返 CMA 頒獎鄉村舞台”（TMZ）； “泰勒·斯威夫特 (Taylor Swift) 領銜年度音樂協會第 60020 年年度頒獎典禮。得獎者：誰贏得了第 60 屆鄉村音樂協會年度獎？\n不同媒體的數字有所不同（例如，標題/摘要中的數字為 18 比 13）。 仍不確定\n摘要描述可以省略上下文、更新或更正。點擊連結的管道以獲取最新的完整報告。信任分數是啟發式的，而不是事實檢定的保證。 連結來源（僅限頻道名稱）：Billboard、TMZ、Hollywood Life、Just Jared"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-entertainment-02-taylor-swift-jack-antono\",\"category\":\"entertainment\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-entertainment-02-taylor-swift-jack-antono.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Taylor Swift \u0026 Jack Antonoff, Ludwig Göransson Win at 2026 Hollywood Music in Media Awards: Full Winners List\",\"zh-TW\":\"相關封面圖：泰勒絲 (Taylor Swift) 和傑克安東諾夫 (Jack Antonoff)、路德維希戈蘭森 (Ludwig Göransson) 榮獲 2026 年好萊塢音樂媒體獎：完整獲獎者名單\"},\"publishedAt\":\"2026-11-19T06:00:00.000Z\",\"title\":{\"en\":\"Taylor
