909+0749, positioned well beyond the expanding shell of supernova remnant G42.1-0.2. Although the two objects initially appeared unrelated due to their separation, radio imaging revealed a comet-like tail trailing behind PSR J1909+0749 and pointing directly back toward the center of G42.1-0.2, linking the fast-moving neutron star to the supernova explosion that created it.\n\nWhy it matters\nFinding a pulsar that has completely exited its parent supernova remnant provides a rare observational benchmark for testing models of asymmetric supernova birth kicks, interstellar medium resistance, and why only about 400 of an estimated 2,000 Milky Way supernova remnants have been detected.\n\nSource differences\nTech Explorist reported the discovery under \"Runaway Pulsar May Have Escaped Its Supernova Remnant\" (https://www.techexplorist.com/pulsar-racing-space-scientists-found-launched/110005/), specifying the pulsar designation PSR J1909+0749 and remnant G42.1-0.2. Universe Magazine covered the same study in \"A runaway pulsar escaped from the remnants of a supernova\" (https://universemagazine.com/en/a-runaway-pulsar-escaped-from-the-remnants-of-a-supernova/), highlighting the Milky Way remnant count gap, with full factual agreement.\n\nStill uncertain\nPrecise three-dimensional proper motion measurements and the exact age of the explosion remain to be refined through follow-up radio observations.\n\nTrust label: Single source — Tech Explorist and Universe Magazine both report on the same astronomical study led by Rohit Dokara."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-science-290-runaway-pulsar-psr-j1909\",\"category\":\"science\",\"title\":{\"en\":\"Astronomers Spot Runaway Pulsar PSR J1909+0749 Escaping Supernova Shell\",\"zh-TW\":\"天文學家發現逃逸波霎 PSR J1909+0749 衝出超新星殘骸外殼\"},\"summary\":{\"en\":\"In findings reported on November 27, 2026, an astronomy team led by Rohit Dokara identified pulsar PSR J1909+0749 well outside supernova remnant G42.1-0.2, with a comet-like tail pointing back toward its birth explosion.\",\"zh-TW\":\"根據 2026 年 11 月 27 日發布的天文觀測報導，由羅希特・多卡拉（Rohit Dokara）領導的研究團隊結合多項無線電巡天數據，發現高速移動的波霎 PSR J1909+0749 已完全脫離超新星殘骸 G42.1-0.2 的外殼，其後方如彗星般的尾跡精準指向數千年前誕生它的爆炸中心。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n由前德國馬克斯・普朗克無線電天文研究所學者羅希特・多卡拉（Rohit Dokara）領導的天文團隊，透過整合多項無線電巡天觀測資料，發現一顆罕見的逃逸波霎 PSR J1909+0749 已飛離超新星殘骸 G42.1-0.2 的膨脹外殼之外。雖然兩者在天區上相距甚遠、乍看毫無關聯，但觀測影像顯示 PSR J1909+0749 後方拖曳著一條宛如彗星的尾跡，且方向精準回指 G42.1-0.2 的中心，證實這顆高速中子星正是誕生於該場超新星爆炸。\\n\\n「為什麼重要」\\n波霎完全衝出母體超新星殘骸外殼的實例極為罕見，這項「冒煙槍」級別的關聯證據能協助天文學家驗證超新星不對稱爆炸賦予中子星的「誕生反衝力」（birth kick）模型，並解釋為何銀河系推估應有約 2,000 個超新星殘骸，至今卻僅觀測到約 400 個。\\n\\n「來源異同」\\nTech Explorist 在「Runaway Pulsar May Have Escaped Its Supernova Remnant」（https://www.techexplorist.com/pulsar-racing-space-scientists-found-launched/110005/）詳列天體編號 PSR J1909+0749 與殘骸 G42.1-0.2 的彗尾特徵；Universe Magazine 則在「A runaway pulsar escaped from the remnants of a supernova」（https://universemagazine.com/en/a-runaway-pulsar-escaped-from-the-remnants-of-a-supernova/）補充銀河系超新星殘骸觀測數量落差與演化階段估算，兩篇報導引述同一研究，並無矛盾。\\n\\n「仍不確定」\\n該顆波霎在三維空間中的精確自行速度與該次超新星爆發的準確年代，仍需後續更高靈敏度的無線電觀測進一步校準。\\n\\nTrust label: Single source — Tech Explorist 與 Universe Magazine 均報導羅希特・多卡拉團隊的同一項天文研究成果。\"},\"glossary\":[{\"term\":{\"en\":\"Pulsar\",\"zh-TW\":\"波霎（脈衝星）\"},\"blurb\":{\"en\":\"A rapidly rotating, highly magnetized neutron star formed in a supernova explosion that emits beams of electromagnetic radiation like a cosmic lighthouse.\",\"zh-TW\":\"大質量恆星經超新星爆炸後塌縮形成的高速自轉強磁場中子星，會如宇宙燈塔般規律發射電磁波束。\"}},{\"term\":{\"en\":\"Supernova Remnant\",\"zh-TW\":\"超新星殘骸\"},\"blurb\":{\"en\":\"The expanding shell of gas, dust, and shockwaves ejected into space when a massive star ends its life in a supernova explosion.\",\"zh-TW\":\"大質量恆星發生超新星爆發時，向外高速拋射的氣體、塵埃與激波所形成的膨脹星雲殼層結構。\"}},{\"term\":{\"en\":\"Birth Kick\",\"zh-TW\":\"誕生反衝力（Birth Kick）\"},\"blurb\":{\"en\":\"A high-velocity propulsion imparted to a newborn neutron star during an asymmetric supernova explosion, capable of launching it out of its parent remnant.\",\"zh-TW\":\"超新星爆炸過程因物質拋射不對稱而賦予新生中子星的強大動量，可使其以極高速度射出原本的殘骸雲氣。\"}}],\"sources\":[{\"name\":\"Tech Explorist\",\"url\":\"https://www.techexplorist.com/pulsar-racing-space-scientists-found-launched/110005/\"},{\"name\":\"Universe Magazine\",\"url\":\"https://universemagazine.com/en/a-runaway-pulsar-escaped-from-the-remnants-of-a-supernova/\"}],\"imageUrl\":\"/covers/live/live-science-290-runaway-pulsar-psr-j1909.webp\",\"imageAlt\":{\"en\":\"Astronomers Spot Runaway Pulsar PSR J1909+0749 Escaping Supernova Shell\",\"zh-TW\":\"天文學家發現逃逸波霎 PSR J1909+0749 衝出超新星殘骸外殼\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":75,\"trustBreakdown\":{\"crossCorroboration\":16,\"outletReputation\":21,\"recencyClarity\":24,\"sourceDiversity\":14},\"publishedAt\":\"2026-11-28T00:37:18.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":21,\"D2\":18,\"D3\":20,\"D4\":19,\"D5\":19,\"total\":19},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-science-290-runaway-pulsar-psr-j1909/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-sci
