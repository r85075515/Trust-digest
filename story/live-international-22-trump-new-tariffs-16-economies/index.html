 major trading partners, with new import duties on a wide range of goods expected to follow, Reuters reported Tuesday, citing three people with knowledge of the matter. The results could come as soon as Tuesday or Wednesday, and the US Trade Representative's office is expected to propose duties that stack on top of the tariffs already imposed during Trump's second term.\n\nWhat happened: USTR launched the probe in March under Section 301 of the Trade Act of 1974, examining what it calls evidence of excess industrial capacity in China, the European Union, India, Japan, South Korea, Mexico, Vietnam, Taiwan, Thailand, Malaysia, Indonesia, Switzerland, Norway, Singapore, Bangladesh and Cambodia. The move is widely read as the administration rebuilding its tariff regime on a new legal footing after the Supreme Court struck down its earlier tariff program in February. No rates have been set or disclosed, and neither USTR nor the White House responded to Reuters' requests for comment. A separate March probe into weak enforcement of anti-forced-labor laws covers 59 countries and the EU.\n\nWhy it matters: Taiwan is on the list. A stacked, capacity-based tariff round aimed principally at China would still land on Taiwanese, Japanese, Korean and EU exporters across autos, batteries, semiconductors, steel, electronics and solar — and it arrives the same week markets whipsawed on the Nvidia reinstatement, with traders already flagging the inflation risk as the Federal Reserve weighs a December move. The legal theory is also new: not deficits or national security, but foreign \"excess capacity\" itself as the unfair practice.\n\nSources agree/disagree: Reuters, the Wall Street Journal and the Financial Times agree on the timing (this week), the 16-economy scope and the stacking design; none has rates, product lists or an effective date, because none has been announced. All reporting rests on officials and people familiar with the matter ahead of a formal unveiling.\n\nStill uncertain: Everything that decides the real impact — rates by country, covered products, exemptions (including any for semiconductors), the effective date, and whether trade-deal partners get carve-outs. Beijing's and Brussels' responses, and whether the announcement slips past Wednesday, are the immediate tells.\n\nTrust label: Multi-source agreement — three top outlets concur on the plan and its scope; it remains a reported intention ahead of any official announcement, with rates and product coverage undisclosed."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"adult\":false,\"body\":{\"en\":\"$10\",\"zh-TW\":\"發生了什麼事：路透週二（24 日）引述三名知情人士報導，川普政府即將公布 301 條款（Section 301）調查結果——針對 16 個主要貿易夥伴被指存在的「過剩產能」——預期隨後將對廣泛商品加徵新進口關稅。結果最快週二或週三出爐，美國貿易代表署（USTR）預計提出的稅率將疊加在川普第二任已實施的關稅之上。USTR 今年 3 月依 1974 年《貿易法》301 條款啟動調查，範圍包括中國、歐盟、印度、日本、南韓、墨西哥、越南、台灣、泰國、馬來西亞、印尼、瑞士、挪威、新加坡、孟加拉與柬埔寨。此舉普遍被解讀為：在最高法院今年 2 月推翻先前的關稅 regime 後，行政部門換一個法律基礎重建關稅體系。目前稅率未定、未公布，USTR 與白宮都未回應路透置評請求。另一項 3 月啟動的調查針對 59 國與歐盟的反強迫勞動執法不力。\\n\\n為什麼重要：台灣在名單上。這輪以產能為名、主要瞄準中國的疊加關稅，仍會落在台灣、日本、南韓與歐盟的出口商身上——汽車、電池、半導體、鋼鐵、電子與太陽能都在潛在範圍；而且時點正值市場因輝達復職劇烈震盪、交易員已在提醒聯準會 12 月決策前的通膨風險。法律理論也是新的：不是逆差、不是國安，而是外國的「過剩產能」本身構成不公平貿易行為。\\n\\n來源異同：路透、《華爾街日報》與《金融時報》對時點（本週）、16 經濟體範圍與疊加設計一致；三家都沒有稅率、品項清單或生效日，因為官方尚未公布。所有報導都建立在正式公布前的官員與知情人士說法上。\\n\\n仍不確定：決定實際衝擊的一切都還未知——各國稅率、涵蓋品項、豁免（包括半導體是否除外）、生效日期、已有貿易協議的夥伴是否另有安排。北京與布魯塞爾的回應、以及公布會否拖過週三，是最近的觀察點。\"},\"category\":\"international\",\"disagreements\":null,\"glossary\":[{\"blurb\":{\"en\":\"Section 301 of the Trade Act of 1974, the US law authorizing tariffs in response to unfair foreign trade practices; the legal basis for the new duties.\",\"zh-TW\":\"1974 年《貿易法》授權美國因應外國不公平貿易行為加徵關稅的條款；本次新關稅的法律基礎。\"},\"term\":{\"en\":\"Section 301\",\"zh-TW\":\"301 條款（Section 301）\"}},{\"blurb\":{\"en\":\"The US Trade Representative's office, which ran the excess-capacity investigation and is expected to propose the new duty rates.\",\"zh-TW\":\"主責貿易談判與 301 調查的美國機構，本次過剩產能調查由其執行、新稅率預計由其提出。\"},\"term\":{\"en\":\"USTR\",\"zh-TW\":\"美國貿易代表署（USTR）\"}},{\"blurb\":{\"en\":\"US Trade Representative under Trump, whose office is expected to unveil the probe findings as soon as this week.\",\"zh-TW\":\"川普政府的貿易代表，其辦公室預計最快本週公布調查結果。\"},\"term\":{\"en\":\"Jamieson Greer\",\"zh-TW\":\"葛里爾（Jamieson Greer）\"}},{\"blurb\":{\"en\":\"The administration's stated target: foreign industrial production capacity Washington says is artificially expanded and flooding global markets.\",\"zh-TW\":\"美方此次的指控核心：華府稱外國工業產能被人為擴張、淹沒全球市場。\"},\"term\":{\"en\":\"Excess capacity\",\"zh-TW\":\"過剩產能（Excess Capacity）\"}}],\"id\":\"live-international-22-trump-new-tariffs-16-economies\",\"imageAlt\":{\"en\":\"Containers at a shipping port (file image)\",\"zh-TW\":\"港口貨櫃（資料畫面）\"},\"imageUrl\":\"\",\"isHeadline\":true,\"isPopular\":true,\"publishedAt\":\"2026-11-24T17:46:58.000Z\",\"sources\":[{\"name\":\"Reuters\",\"url\":\"https://www.reuters.com/world/us/trump-administration-set-unveil-new-tariffs-after-probe-on-excess-factory-2026-11-24/\"}],\"summary\":{\"en\":\"The Trump administration is set to unveil Section 301 findings on \\\"excess capacity\\\" in 16 economies — China, the EU, Japan, Korea, Taiwan and 10 others — with new duties expected to stack on existing tariffs, rebuilding the regime the Supreme Court voided in February. Rates, products and dates are undisclosed; USTR and the White House have not commented. Taiwan's exporters are squarely in scope.\",\"zh-TW\":\"川普政府即將公布 301 條款「過剩產能」調查結果，對象含中國、歐盟、日本、南韓、台灣等 16 個經濟體，新關稅預計疊加在現行稅率上，重建今年 2 月被最高法院推翻的關稅體系。稅率、品項與生效日都未公布，USTR 與白宮未置評；台灣出口商確定在射程內，先看週二、週三的正式公布內容。\"},\"tags\":[],\"title\":{\"en\":\"Trump Set to Unveil New Tariffs on 16 Economies Including Taiwan, China and the EU After Excess-Capacity Probe\",\"zh-TW\":\"川普將對台、中、歐、日等 16 經濟體祭出新一輪關稅：301 調查結果最快週二公布、稅率未定\"},\"trustBreakdown\":{\"crossCorroboration\":24,\"outletReputation\":26,\"recencyClarity\":22,\"sourceDiversity\":12},\"trustScore\":84}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0
