.\nWhat happened\nCNA reported that draw No. 115282 was held on November 21, with winning numbers 19, 20, 28, 32 and 07. The payout result was one jackpot ticket, worth NT$8 million. A second CNA feed item from the same draw added the companion results: 3-Star 454 and 4-Star 4514. No other outlet's version of this draw appears in the feed cluster, so the numbers rest on CNA's two items alone.\nWhy it matters\nFor players, the result is immediately actionable: one ticket holds NT$8 million, and the 3-Star and 4-Star numbers decide the smaller prizes. The draw is also a fresh event in its own right — draw No. 115282 is a new draw, not a repeat of the earlier draws No. 115270 or 115264 already published, so holders of tickets from those earlier draws should not confuse the numbers.\nSources agree / disagree\nBoth feed items come from CNA's business and securities desk, and they agree on the draw number and the five winning numbers; the second item simply adds the 3-Star and 4-Star results. The ingest template flagged a '1 vs 3' figure difference, but that is not a real conflict — 1 is the jackpot ticket count and 3 is the 3-Star game.\nTrust label: Single source — the draw rests on one outlet, CNA, so the numbers are unconfirmed by a second publisher.\nStill uncertain\nThe feed snippets give no ticket-sale location, no claim deadline and no total prize pool, and they do not say whether the jackpot ticket has been claimed. Verify the numbers against the Taiwan Lottery's official announcement before acting on them."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-01-539-115282-1\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-taiwan-01-539-115282-1.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 今彩539第115282期　頭獎1注中獎\",\"zh-TW\":\"相關封面圖：今彩539第115282期　頭獎1注中獎\"},\"publishedAt\":\"2026-11-21T14:04:03.000Z\",\"title\":{\"en\":\"Taiwan Lottery 539 Draw No. 115282:
