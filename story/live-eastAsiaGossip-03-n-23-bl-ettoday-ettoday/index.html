 and male actors were among those implicated. As the storm spread, a well-known BL actor identified as B was suggested online to have secretly filmed a female artist at the same agency. The actor named, Boom (Tharatorn Jantharaworakarn), broke his silence with a formal statement denying all the allegations completely.\nWhy it matters\nThe reported scale is what makes this a major scandal: a single private group of about 230,000 members, holding non-consensual images of celebrities, students, and ordinary women alike, plus AI-faked nudes. The case has also moved beyond anonymous group members, because a named performer, Boom, felt it necessary to issue a formal denial against online suggestions linking him to secret filming, and a related headline reports he will take legal action. The combination of non-consensual filming, AI fabrication, and celebrity implication is why the coverage frames it as a Thai Nth Room.\nSources agree / disagree\nETtoday, Google News, and Yahoo Taiwan entertainment all carry the same core account: a roughly 230,000-member private group, non-consensual images, and Boom's denial and stated legal action. No numeric or name conflicts were detected in the short feed snippets, and the outlets' headlines are consistent on the group's size and on Boom being the actor who responded.\nTrust label: Multi-source agreement — Several outlets report the same group size, the same kind of content, and the same denial by the named actor.\nStill uncertain\nThe snippets do not establish who ran the group, whether any arrests or platform actions have followed, or what evidence, if any, lies behind the online suggestions about Boom, who denies all allegations. The identities behind the other reported implications are also not established in the feed text. Feed descriptions can omit context, updates, or corrections, so the publisher pages should be checked for the latest reporting."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-eastAsiaGossip-03-n-23-bl-ettoday-ettoday\",\"category\":\"eastAsiaGossip\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-eastAsiaGossip-03-n-23-bl-ettoday-ettoday.png\",\"imageAlt\":{\"en\":\"Cover related to: 泰版N號房！女星遭偷拍「23萬人暗黑群」意淫截圖曝光　導演、BL男星全在內\u2028 - ETtoday星光雲| ETtoday新聞雲\",\"zh-TW\":\"相關封面圖：泰版N號房！女星遭偷拍「23萬人暗黑群」意淫截圖曝光　導演、BL男星全在內 - ETtoday星光雲| ETtoday新聞雲\"},\"publishedAt\":\"2026-10-31T16:36:00.000Z\",\"title\":{\"en\":\"Thailand entertainment industry shaken by secret-filming group with 230,000 members\",\"zh-TW\":\"泰國演藝圈爆偷拍醜聞，23萬人私密群組涉未經同意影像\"},\"summary\":{\"en\":\"A whistleblower exposed a private Facebook group of about 230,000 members sharing non-consensual intimate images of female celebrities, students, and ordinary women, plus AI-faked nude photos. Actor Boom, full name Tharatorn Jantharaworakarn, denied online suggestions he secretly filmed a fellow artist.\",\"zh-TW\":\"吹哨者踢爆一個約23萬名成員的臉書（Facebook）私密群組，內含女性名人、學生與一般女性的未經同意私密影像及人工智慧造假裸照。男星布姆（Boom）遭影射偷拍同公司女藝人，已發聲明全盤否認。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"泰國演藝圈爆發重大性騷擾醜聞，被比作泰版N號房；吹哨者踢爆一個約23萬名成員的私密群組，分享未經同意的影像。\\n發生了什麼事\\n吹哨者在社群平台（X）踢爆臉書（Facebook）上一個私密偷拍與性騷擾群組，成員高達23萬人，群內充斥大量女性名人、學生與一般女性的未經同意私密影像，以及人工智慧造假裸照。報導稱導演與男演員也在涉入者之列。風暴擴大之際，一名被稱為「B」的知名男星遭網路影射曾偷拍同經紀公司的女藝人。被指涉的男星布姆（Boom）打破沉默發出正式聲明，全盤否認所有指控。\\n為什麼重要\\n報導的規模使此案成為重大醜聞：單一私密群組成員約23萬人，持有女性名人、學生與一般女性的未經同意影像，還有人工智慧造假裸照。此案也已超出匿名群組成員的範圍：被點名的布姆（Boom）認為有必要正式否認偷拍影射，相關標題並稱他將採取法律行動。未經同意偷拍、人工智慧造假與名人涉入三者結合，正是報導稱其為泰版N號房的原因。\\n來源異同\\n三家媒體皆報導同一核心內容：約23萬名成員的私密群組、未經同意的影像，以及布姆（Boom）的否認與表示將採取法律行動。短摘要中未發現數字或名稱衝突，各家標題對群組規模與回應的男星人選說法一致。\\n仍不確定\\n摘要未證實群組由誰經營、是否已有逮捕或平台處置，也未說明影射布姆（Boom）的說法有何證據，而他本人全盤否認。其他被指涉者的身分在現有資料中亦未確立。摘要可能遺漏更新，最新進展應查閱原媒體頁面。\"},\"sources\":[{\"name\":\"ETtoday 影劇\",\"url\":\"https://star.ettoday.net/news/3264171\"},{\"name\":\"Google News\",\"url\":\"https://news.google.com/rss/articles/CBMiTkFVX3lxTE5Wckc4RTlSemZORFZaaEc4bEtQU2lvQ0t1QXdkVGtSRDlsQmxKNlZrZzZJMnlxelhEOFVPVnc2RFdESXJ2c3U4V09MY2V6QdIBTEFVX3lxT
