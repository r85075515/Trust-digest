osted an Instagram Story with white text on a black background reading \"莫名其妙\" (\"utterly baffling\" / \"nonsense\"), appearing to rebut the report and addressing her Singapore itinerary.\nWhy it matters\nIt is a classic celebrity-gossip standoff: an unnamed-sourced tabloid claim of a breakup and a reunion, met with a terse public denial. The check-in overlap is circumstantial; her four-character response is the only on-the-record statement so far.\nSources agree / disagree\nThe entertainment outlets agree on the core claim — tabloid reports an eight-year breakup and a suspected reunion with Wu — and on Wang's \"莫名其妙\" response. The snippets differ on when the split supposedly happened (\"去年\" in one item vs \"今年\" in another), which cannot both be right.\nStill uncertain\nWhether the relationship actually ended, whether Wang and Wu have reunited, and what \"莫名其妙\" was aimed at remain unconfirmed by anyone on the record. Treat the tabloid's claims as unverified."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-eastAsiaGossip-02-8-4\",\"category\":\"eastAsiaGossip\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-eastAsiaGossip-02-8-4.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 王心恬爆8年情斷姚元浩！遭疑復合前男友吳念平　本人黑底白字4字抒發心聲\",\"zh-TW\":\"相關封面圖：王心恬爆8年情斷姚元浩！遭疑復合前男友吳念平　本人黑底白字4字抒發心聲\"},\"publishedAt\":\"2026-10-21T03:21:43.000Z\",\"title\":{\"en\":\"Wang Hsin-tien denies breakup and reunion rumors with a four-character Instagram post\",\"zh-TW\":\"王心恬（Wang Hsin-tien）爆 8 年情斷姚元浩（Yao Yuan-hao）、疑復合吳念平（Wu Nien-ping），本人黑底白字回「莫名其妙」\"},\"summary\":{\"en\":\"A weekly tabloid reported that actress Wang Hsin-tien ended her eight-year relationship with Yao Yuan-hao and may have reunited with former national swimmer Wu Nien-ping, citing overlapping check-ins during a Singapore F1 trip. Wang responded on Instagram Stories on the 21st with a black-background post reading only \\\"莫名其妙\\\" (roughly: \\\"utterly baffling\\\"), appearing to push back at the report.\",\"zh-TW\":\"週刊爆料女星王心恬與姚元浩 8 年感情畫下句點，且疑似重回前游泳國手吳念平懷抱，證據是兩人在新加坡 F1 賽事期間的同地點打卡。王心恬 21 日在限動以黑底白字回應，僅寫四個字：「莫名其妙」，疑似反擊爆料。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"女星王心恬（Wang Hsin-tien）被週刊爆料 8 年情斷姚元浩（Yao Yuan-hao）、疑似復合前男友吳念平（Wu Nien-ping），她以限動黑底白字四字回應：「莫名其妙。」\\n發生了什麼事\\n週刊爆料指出，王心恬與姚元浩情纏 8 年（但上次被拍到已是 2018 年），兩人感情已畫下句點，且王心恬已重回前游泳國手吳念平的懷抱。證據是近日王心恬到新加坡參與 F1 賽車盛事，吳念平也悄悄愛相隨，在同一個地點打卡。ETtoday、Yahoo 奇摩娛樂、NOWnews、中國時報、噓！星聞等媒體跟進報導。她 21 日在 Instagram 限動發文，黑底白字僅寫「莫名其妙」四字，疑似反擊爆料並回應新加坡行程。\\n為什麼重要\\n這是典型的名人八卦對峙：匿名消息來源的週刊爆料（分手＋復合），對上當事人簡短的公開否認。同地點打卡只是間接證據；她這四個字是目前唯一檯面上的說法。\\n來源異同\\n各娛樂媒體對核心爆料一致：週刊稱 8 年情斷、疑復合吳念平，且都報導了王心恬「莫名其妙」的回應。但摘要中對分手時間點的說法不一（有寫「去年」、有寫「今年」），兩者不可能都對。\\n仍不確定\\n兩人是否真的分手、王心恬與吳念平是否復合、「莫名其妙」究竟針對哪一點，都沒有檯面上的人證實，週刊說法應視為未經證實。\"},\"sources\":[{\"name\":\"ETtoday 影劇\",\"url\":\"https://star.ettoday.net/news/3258322\"},{\"name\":\"Google News\",\"url\":\"https://news.google.com/rss/articles/CBMiWkFVX3lxTFBCNlNnTEx6a19RYWlmbnZuUEpJRnBWY1dpZFFlazh6SEkxMHgtamxwUmdaRWNiNmlnelVHZUstYnNHV21XenpaSjdXZjNuWDQ5bEZscnNCN0xGUdIBX0FVX3lxTE1qT2stLWNSYTlLa2FHeV9hZVhfem1KeDctYUdGVDNXVEFPTFFQR0ZzMm41Wk1uaGtQdU9zRExBYlBiQUFtQkRZWFloY0laR2VpYTM3VGZPV2VsV0RpdEFz?oc=5\"},{\"name\":\"Yahoo TW 娛樂\",\"url\":\"https://tw.news.yahoo.com/%E7%8E%8B%E5%BF%83%E6%81%AC%E7%88%868%E5%B9%B4%E6%83%85%E6%96%B7%E5%A7%9A%E5%85%83%E6%B5%A9-%E9%81%AD%E7%96%91%E5%BE%A9%E5%90%88%E5%89%8D%E7%94%B7%E5%8F%8B%E5%90%B3%E5%BF%B5%E5%B9%B3-%E6%9C%AC%E4%BA%BA%E9%BB%91%E5%BA%95%E7%99%BD%E5%AD%974%E5%AD%97%E6%8A%92%E7%99%BC%E5%BF%83%E8%81%B2-052100895.html\"},{\"name\":\"setn.com\",\"url\":\"https://news.google.com/rss/articles/CBMiSEFVX3lxTE1hSF9RTnVYS1k1aXVvaHZ5YTVqT1FNQ0pRemhMejJnQjBKbGJmN0dydjhuSnVIODIzRDlQVWVFNjFVYm1KTmhJONIBTEFVX3lxTFBCYThwVXRUa3NPYy1SeUtNb3pOWHo2YTBQVGJCY21Ga2htSEhYVTRIZ1QzTmlyYWo2UUFCaG9aN0d5SWE5c1BrUk5QX3A?oc=5\"}],\"disagreements\":\"Snippets differ on when the reported split happened (去年 vs 今年); both cannot be right.\",\"trustScore\":55,\"trustBreakdown\":{
