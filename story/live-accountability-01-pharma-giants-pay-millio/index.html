 account. The headline generalizes the finding: pharma giants pay millions to a Russian distributor entangled in corruption allegations to win cancer drug business. The snippet does not give the payment amounts beyond 'millions,' dates of specific deals, or Merck's response.\nWhy it matters\nThe report raises accountability questions about how Western drugmakers reach state buyers in Russia through intermediaries who are themselves sanctioned or corruption-linked.\nSources agree / disagree\nThis is a single investigation from the ICIJ; no second outlet in the feed corroborates its specifics. Trust label: Single source — one investigative consortium's reporting so far.\nStill uncertain\nExact sums, contract dates, responses from Merck and other companies, and any regulatory findings are outside the snippet and must be checked in the full investigation."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-accountability-01-pharma-giants-pay-millio\",\"category\":\"accountability\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-accountability-01-pharma-giants-pay-millio.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Pharma giants pay millions to Russian distributor entangled in corruption allegations to win cancer drug business\",\"zh-TW\":\"相關封面圖：（譯文待補）Pharma giants pay millions to Russian distributor entangled in corruption allegations to win cancer drug business\"},\"publishedAt\":\"2026-11-02T05:59:21.000Z\",\"title\":{\"en\":\"ICIJ: Merck Turned to Sanctioned Oligarch Alexey Repik's R-Pharm to Sell Keytruda to the Russian Government\",\"zh-TW\":\"ICIJ：默克（Merck）透過受制裁寡頭 Repik 的 R-Pharm 向俄羅斯政府銷售 Keytruda\"},\"summary\":{\"en\":\"In selling its blockbuster anticancer drug Keytruda to the Russian government, Merck turned to a hospital supplier with friends in high places — Alexey Repik, a now-sanctioned oligarch close to Russian President Vladimir Putin who founded R-Pharm in 2001, the ICIJ reported in an investigation of pharma payments to the distributor.\",\"zh-TW\":\"國際調查記者同盟（ICIJ）調查報導，在向俄羅斯政府銷售暢銷抗癌藥 Keytruda 時，藥廠默克（Merck）找上一家政商關係深厚的醫院供應商——現已被制裁、與俄羅斯總統普丁（Vladimir Putin）關係密切、2001 年創辦 R-Pharm 的寡頭 Alexey Repik；報導檢視藥廠付給該經銷商的款項。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"一篇調查報導追蹤一款抗癌藥如何經政商關係深厚的經銷商進入俄羅斯。\\n發生了什麼事\\n國際調查記者同盟（ICIJ）報導，在向俄羅斯政府銷售暢銷抗癌藥 Keytruda 時，製藥巨頭默克（Merck）找上一家被形容政商關係深厚的醫院供應商：Alexey Repik，現已被制裁的寡頭，與俄羅斯總統普丁（Vladimir Putin）關係密切，且熟悉俄羅斯與西方商界運作。依文章，Repik 是莫斯科人、經濟學出身，2001 年在賣掉先前事業後創辦 R-Pharm。標題把發現一般化：製藥巨頭付數百萬給一家涉貪腐指控的俄羅斯經銷商，以贏得抗癌藥生意。摘要未給「數百萬」以外的款項金額、具體交易日期或默克的回應。\\n為什麼重要\\n此報導提出究責問題：西方藥廠如何透過本身受制裁或涉貪腐的仲介，接觸俄羅斯的國家買家。\\n來源異同\\n這是 ICIJ 的單一調查，feed 中無第二媒體佐證其具體內容。信任標籤：單一來源——目前為單一調查聯盟的報導。\\n仍不確定\\n確切金額、合約日期、默克與其他公司的回應、任何監管結論，都在摘要之外，須查閱完整調查。\"},\"sources\":[{\"name\":\"ICIJ\",\"url\":\"https://www.icij.org/investigations/cancer-calculus/pharma-giants-pay-millions-to-russian-distributor-entangled-in-corruption-allegations-to-win-cancer-drug-business/\"}],\"disagreements\":null,\"trustScore\":47,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":10,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"accountability\",\"live-ingest\",\"icij\"],\"glossary\":[{\"term\":{\"en\":\"Merck\",\"zh-TW\":\"默克\"},\"blurb\":{\"en\":\"Pharmaceutical giant whose Keytruda sales to Russia the report examines.\",\"zh-TW\":\"製藥巨頭，其對俄 Keytruda 銷售遭報導檢視。\"}},{\"term\":{\"en\":\"Keytruda\",\"zh-TW\":\"Keytruda\"},\"blurb\":{\"en\":\"Merck's blockbuster anticancer drug at the center of the report.\",\"zh-TW\":\"默克暢銷抗癌藥，報導核心。\"}},{\"term\":{\"en\":\"Alexey Repik\",\"zh-TW\":\"Alexey Repik\"},\"blurb\":{\"en\":\"Sanctioned oligarch and R-Pharm founder described as close to Putin.\",\"zh-TW\":\"受制裁寡頭、R-Pharm 創辦人，被述與普丁關係密切。\"}},{\"term\":{\"en\":\"R-Pharm\",\"zh-TW\":\"R-Pharm\"},\"blurb\":{\"en\":\"Russian distributor founded by Repik in 2001, per the report.\",\"zh-TW\":\"俄羅斯經銷商，依報導由 Repik 於 2001 年創辦。\"}},{\"term\":{\"en\":\"ICIJ\",\"zh-TW\":\"國際調查記者同盟\"},\"blurb\":
