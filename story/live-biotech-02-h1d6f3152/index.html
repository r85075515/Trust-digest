ery day, and ingredient transparency is what lets consumers — and pharmacists — check what they are actually using. A medical database update matters because it is the reference layer behind labels: when the reference changes, the information available at the pharmacy counter changes with it. For a popular product category, even a routine update affects a lot of buyers.\nSources agree / disagree\nTwo feed items from one outlet, GeneOnline, carry near-identical headlines, so the coverage is duplicated but not independently confirmed. The two headlines agree on the core event — a US medical database updating sunscreen product information — and differ only in scope: sticks versus products in general. Trust label: Single source — two items from GeneOnline only, with no second outlet confirming the update.\nStill uncertain\nThe feed does not name the database in full, list any product or ingredient, or say what was actually changed. It is also unclear whether the update covers new listings, corrected entries, or both. Check the full GeneOnline report and the database itself before citing any specific product or ingredient."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-biotech-02-h1d6f3152\",\"category\":\"biotech\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-biotech-02-h1d6f3152.png\",\"imageAlt\":{\"en\":\"Cover related to: NLM Database Updates Sunscreen Stick Product Information for Transparency and Safety\",\"zh-TW\":\"相關封面圖：美國醫學資料庫更新防曬棒產品資訊，確保成分透明與使用安全\"},\"publishedAt\":\"2026-11-07T03:21:58.000Z\",\"title\":{\"en\":\"NLM Database Updates Sunscreen Stick Product Information for Transparency and Safety\",\"zh-TW\":\"美國醫學資料庫更新防曬棒產品資訊，確保成分透明與使用安全\"},\"summary\":{\"en\":\"[Unconfirmed · Single source] The US National Library of Medicine's database has updated product information for sunscreen sticks to keep ingredients transparent and use safe, GeneOnline reports. A second, near-identical headline covers sunscreen products more broadly. Details are thin — watch the full report for which products and ingredients changed.\",\"zh-TW\":\"［未證實·單一來源］美國國家醫學圖書館（NLM）旗下資料庫更新防曬棒產品資訊，確保成分透明與使用安全，基因線上（GeneOnline）報導。另一則標題近似的報導涵蓋範圍更廣的防曬產品。來源摘要細節不足，哪些產品與成分有變動，請看完整報導。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"美國國家醫學圖書館（NLM）旗下資料庫更新防曬棒產品資訊，確保成分透明與使用安全，基因線上（GeneOnline）報導。\\n發生了什麼事\\n來源文字很短且中途截斷：它寫道更新來自美國國家醫學圖書館旗下的資料庫，句子在「Dai」一字後斷掉，資料庫全名沒有出現在提供的材料裡。同一家媒體另一則標題近似的報導涵蓋範圍更廣的防曬產品，把同一項更新定位為保障消費者用藥安全。兩則都沒有列出哪些產品被更新、改了什麼。\\n為什麼重要\\n防曬是每天擦在皮膚上的產品，成分透明才能讓消費者與藥師確認自己實際用的是什麼。醫學資料庫的更新之所以重要，是因為它是標示背後的參考層：參考資料一改，藥局櫃檯能查到的資訊也跟著變。對熱門品類來說，即使是例行更新，影響的買家也不少。\\n來源異同\\n兩則來源出自同一家媒體基因線上，標題近似，屬於重複報導而非獨立佐證。兩則標題對核心事件的描述一致——美國醫學資料庫更新防曬產品資訊——差別只在範圍：防曬棒或是防曬產品整體。信任標籤：單一來源——僅基因線上的兩則報導，沒有第二家媒體佐證這項更新。\\n仍不確定\\n來源沒有寫出資料庫全名，沒有列出任何產品或成分，也沒有說實際改了什麼。更新涵蓋的是新增品項、修正條目，還是兩者都有，來源也沒有說明。引用具體產品或成分之前，請先查基因線上的完整報導與資料庫本身。\"},\"sources\":[{\"name\":\"基因線上 GeneOnline\",\"url\":\"https://geneonline.news/%E7%BE%8E%E5%9C%8B%E9%86%AB%E5%AD%B8%E8%B3%87%E6%96%99%E5%BA%AB%E6%9B%B4%E6%96%B0%E9%98%B2%E6%9B%AC%E6%A3%92%E7%94%A2%E5%93%81%E8%B3%87%E8%A8%8A%E7%A2%BA%E4%BF%9D%E6%88%90%E5%88%86%E9%80%8F%E6%98%8E/\"}],\"disagreements\":null,\"trustScore\":47,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":10,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"biotech\",\"live-ingest\",\"基因線上-geneonline\",\"基因線上-geneonline\"],\"glossary\":[{\"blurb\":{\"en\":\"US institution whose database updated the sunscreen product information.\",\"zh-TW\":\"旗下資料庫更新防曬產品資訊的美國機構。\"},\"term\":{\"en\":\"National Library of Medicine\",\"zh-TW\":\"美國國家醫學圖書館\"}},{\"blurb\":{\"en\":\"Stick-form sunscreen product whose information was updated.\",\"zh-TW\":\"本次更新資訊的棒狀防曬產品。\"},\"term\":{\"en\":\"Sunscreen stick\",\"zh-TW\":\"防曬棒\"}},{\"blurb\":{\"en\":\"Outlet that reported the database update.\",\"zh-TW\":\"報導這項資料庫更新的媒體。\"},\"term\":{\"en\":\"GeneOnline\",\"zh-TW\":\"基因線上\"}},{\"blurb\":{\"en\":\"Ingredient and usage details listed for
