ove from a different angle, saying stocks fell as Democratic wins stoked fears for the AI boom. No index levels, percentage moves, individual share prices or closing values are given in the snippets provided. The material is a short live-blog style update rather than a full market report, and it does not name specific companies or sectors beyond the broad references to infrastructure and artificial intelligence.\nWhy it matters\nThe move matters to investors because a change in political control in the United States can change expectations for public spending, growth and technology investment, and those expectations can move markets outside the United States as well. The two angles in the headlines point to two different channels: slower infrastructure build-out on one hand, and concern about the AI boom on the other. The feed text does not weigh which channel mattered more, does not quantify any fall, and does not say whether the expected fall actually happened by the close. Readers should therefore treat this as a snapshot of market expectations at one moment, not as a settled account of a full trading day.\nSources agree / disagree\nThe two outlets agreed that stocks were falling or set to fall after Democratic wins, but they emphasised different reasons, infrastructure in one snippet and the AI boom in the other. Trust label: Two-source agreement — Two outlets reported the same direction for stocks after the US result, while offering different emphases. No conflicting figures were reported in the snippets.\nStill uncertain\nThe snippets give no FTSE 100 level, no percentage change, no list of falling shares and no later update confirming the close. They also do not explain in detail how Democrats could slow infrastructure work or affect the AI boom. A fuller market report would be needed for those points."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-01-ftse-100-live-uk-europea\",\"category\":\"finance\",\"adul
