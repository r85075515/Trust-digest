sity of Oxford, and Shenzhen University of Advanced Technology published a study in Horticulture Research on November 20, 2026, with media coverage following on November 27. Examining Nepenthes mirabilis—the only pitcher plant species native to China—the team produced a chromosome-level genome assembly confirming an XX/XY sex-determination system located on chromosome 12. The Y chromosome's sex-linked region (Y-SLR) spans approximately 3.50 Mb, containing a 2.34 Mb male-specific region (MSY) with 27 annotated genes, of which only three homologs (DYT1, LFY, and MMD1) are shared with the related species Nepenthes gracilis. From the 27 candidate genes, researchers developed 21 male-specific PCR molecular markers capable of identifying seedling sex prior to flowering.\n\nWhy it matters\nBecause dioecious pitcher plants take years to reach reproductive maturity, PCR markers that distinguish male and female seedlings early will accelerate targeted breeding, hybrid cultivar development, and ex-situ conservation of wild Nepenthes populations.\n\nSource differences\nPhys.org published the November 27, 2026 article \"Researchers reveal sex chromosome evolution and molecular sex markers in the pitcher plant Nepenthes mirabilis\", while South China Botanical Garden (CAS) posted \"New Insights into Sex Chromosome Evolution and Molecular Sex Identification in Nepenthes mirabilis\". Both releases summarize the same November 20 Horticulture Research study and report identical genomic coordinates and marker counts.\n\nStill uncertain\nWhile the 21 PCR markers reliably differentiate sex in Nepenthes mirabilis seedlings under laboratory conditions, their cross-species transferability across other cultivated Nepenthes species remains to be validated.\n\nTrust label: Single source — Both Phys.org and South China Botanical Garden (CAS) report findings from the same November 20 Horticulture Research paper and institutional announcement."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-science-444-nepenthes-sex-chromosome-markers\",\"category\":\"science\",\"title\":{\"en\":\"Researchers Map Sex Chromosomes and Develop Early PCR Sex Markers for Native Pitcher Plant Nepenthes mirabilis\",\"zh-TW\":\"研究團隊解析中國唯一原生豬籠草性染色體演化，開發開花前幼苗性別 PCR 分子標記\"},\"summary\":{\"en\":\"In a November 20 Horticulture Research paper covered November 27, researchers from South China Botanical Garden and partner universities assembled a chromosome-level genome of Nepenthes mirabilis, identifying an XX/XY system on chromosome 12 and 21 male-specific PCR markers for pre-flowering seedling sexing.\",\"zh-TW\":\"中國科學院華南植物園聯合多所高校於 11 月 20 日在《園藝研究》發表論文（11 月 27 日獲媒體報導），完成中國唯一原生豬籠草 Nepenthes mirabilis 染色體級基因組組裝，確認第 12 號染色體為 XX/XY 性染色體，並篩出 21 個雄性特異 PCR 分子標記以在開花前判定幼苗性別。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n中國科學院華南植物園聯同華南農業大學、牛津大學與深圳理工大學研究團隊，於 2026 年 11 月 20 日在《園藝研究》（Horticulture Research）發表研究成果，並於 11 月 27 日獲國際科學媒體報導。團隊針對中國唯一原生豬籠草物種 Nepenthes mirabilis 完成染色體級基因組組裝，確認其性別決定機制為 XX/XY 系統且位於第 12 號染色體；其中 Y 染色體性連鎖區域（Y-SLR）約 3.50 Mb，包含約 2.34 Mb 的雄性特有區域（MSY）及 27 個註解基因，與近緣種 N. gracilis 僅共享 DYT1、LFY 與 MMD1 三個同源基因。研究人員進一步自 27 個候選基因中篩選出 21 個雄性特異 PCR 分子標記，可在植株開花前精準判定幼苗性別。\\n\\n「為什麼重要」\\n豬籠草屬雌雄異株植物且從幼苗至開花需時數年，能在苗期透過 PCR 分子標記區分雌雄，將大幅縮短園藝雜交育種週期並提升野生族群遷地保育效率。\\n\\n「來源異同」\\nPhys.org 於 2026 年 11 月 27 日以「Researchers reveal sex chromosome evolution and molecular sex markers in the pitcher plant Nepenthes mirabilis」為題刊文，中國科學院華南植物園（South China Botanical Garden (CAS)）英文官網亦發布「New Insights into Sex Chromosome Evolution and Molecular Sex Identification in Nepenthes mirabilis」。兩篇來源均源自同一篇 11 月 20 日刊出的《園藝研究》論文與研究機構新聞稿，染色體長度與 21 個分子標記數據完全一致。\\n\\n「仍不確定」\\n這 21 個雄性特異 PCR 分子標記在 Nepenthes mirabilis 幼苗的性別鑑定效能已獲驗證，但是否可直接通用於豬籠草屬其他栽培或野生近緣物種仍有待進一步測試。\\n\\nTrust label: Single source — Phys.org 與 South China Botanical Garden (CAS) 均轉述同一篇 11 月 20 日《園藝研究》論文與官方科研新聞稿。\"},\"glossary\":[{\"term\":{\"en\":\"Male-specific region of the Y chromosome (MSY)\",\"zh-TW\":\"Y 染色體雄性特有區域（MSY）\"},\"blurb\":{\"en\":\"The non-recombining segment of the Y chromosome present only in males that carries genes governing male sex determination and development.\",\"zh-TW\":\"僅存在於雄性個體 Y 染色體上、不與 X 染色體發生重組的基因區段，攜帶調控雄性性別發育的關鍵基因。\"}},{\"term\":{\"en\":\"PCR molecular marker\",\"zh-TW\":\"PCR 分子標記（PCR molecular marker）\"},\"blurb\":{\"en\":\"A specific DNA sequence amplified via polymerase chain reaction to rapidly identify genetic traits such as plant sex before physical flowering.\",\"zh-TW\":\"利用聚合酶連鎖反應（PCR）擴增特定 DNA 片段的檢測工具，可在植物開花前快速鑑定性別等遺傳特徵。\"}},{\"term\":{\"en\":\"Nepenthes mirabilis\",\"zh-TW\":\"奇異豬籠草（Nepenthes mirabilis）\"},\"blurb\":{\"en\":\"A tropical carnivorous pitcher plant species and the sole member of the genus Nepenthes native to southern China.\",\"zh-TW\":\"一種熱帶食蟲豬籠草植物，也是豬籠草屬中唯一原生於中國華南地區的物種。\"}}],\"sources\":[{\"name\":\"Phys.org\",\"url\":\"https://phys.org/news/2026-11-reveal-sex-chromosome-evolution-molecular.html\"},{\"name\":\"South China Botanical Garden (CAS)\",\"url\":\"https://english.scbg.ac.cn/news/202611/t20261125_1220647.html\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"Researchers Map Sex Chromosomes and Develop Early PCR Sex Markers for Native Pitcher Plant Nepenthes mirabilis\",\"zh-TW\":\"研究團隊解析中國唯一原生豬籠草性染色體演化，開發開花前幼苗性別 PCR 分子標記\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":79,\"trustBreakdown\":{\"crossCorroboration\":16,\"outletReputation\":24,\"recencyClarity\":24,\"sourceDiversity\":15},\"publishedAt\":\"2026-11-28T10:48:33.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":23,\"D2\":22,\"D3\":21,\"D4\":22,\"D5\":22,\"total\":22},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"n
