estate agents told CNA that nationwide building transfer volumes declined in the first three quarters, yet mortgage registrations moved in the opposite direction and the number of people holding two mortgages reached a new high. Agents believe one reason is that homeowners borrowed against their homes to raise funds for the stock market. The recent sharp swings in Taiwan's stock market have now exposed the risks of that leveraged investing, and agents worry that if confidence does not recover, the housing market's consolidation could drag on longer.\nWhy it matters\nBorrowing against a home to buy stocks ties two markets together: a stock slump can turn into housing stress. For homeowners who took on extra debt, the question is whether they can carry it through a volatile market.\nSources agree-disagree\nOnly CNA has reported this story so far, and the link between mortgage growth and stock investing is the agents' own inference rather than a confirmed figure.\nTrust label: Single source — only CNA has reported this story so far.\nStill uncertain\nThe report gives no figures for the fall in transfer volumes, the rise in mortgage registrations, or the number of dual borrowers, and no data on how much borrowed money actually flowed into stocks. Whether the pattern reflects a broad trend or a subset of borrowers is unclear."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-02-h88d89bca\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-taiwan-02-h88d89bca.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 台股劇震槓桿投資風險浮現　房仲憂房市盤整期拉長\",\"zh-TW\":\"相關封面圖：台股劇震槓桿投資風險浮現　房仲憂房市盤整期拉長\"},\"publishedAt\":\"2026-11-23T08:50:07.000Z\",\"title\":{\"en\":\"Taiwan home sales fall as mortgage borrowing hits a record\",\"zh-TW\":\"台股劇震槓桿投資風險浮現，房仲憂房市盤整期拉長\"},\"summary\":{\"en\":\"[Unverified, single source] Taiwan home sales fell in the first three quarters while mortgage registrations rose and dual borrowers hit a record, as agents say homeowners borrowed against homes to invest in stocks. With the market now rattled, watch whether fragile confidence stretches the housing correction.\",\"zh-TW\":\"［未證實·單一來源］今年前 3 季全國建物買賣移轉棟數減少，抵押權設定棟數卻逆勢增加、雙貸族人數創新高，房仲推測民眾以房屋增貸投入股市。近期股市劇震，槓桿風險浮現，房市盤整期恐拉長。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"台灣房市訊號分歧：今年前 3 季建物買賣移轉棟數減少，抵押權設定棟數卻逆勢增加，雙貸族人數也創新高。\\n發生了什麼事\\n房仲向中央社（CNA）指出，今年前 3 季全國建物買賣移轉棟數減少，抵押權設定棟數卻逆勢增加，雙貸族人數也創新高。房仲推測，原因之一是民眾透過房屋增貸等方式取得資金投入股市。不過近期股市劇震，槓桿投資風險浮現，房仲憂心若信心未能回穩，恐拉長房市盤整期。\\n為什麼重要\\n拿房子增貸去買股票，等於把房市與股市綁在一起：股市一跌，壓力就可能蔓延到房市。對背上額外債務的屋主來說，關鍵是能否撐過市場震盪。\\n來源異同\\n目前僅中央社報導此事，且「增貸資金投入股市」是房仲的推測，而非經數據證實的結論。\\n信任標籤：單一來源，僅中央社報導此事，且增貸投入股市為房仲推測，未經數據證實。\\n仍不確定\\n報導未提供移轉棟數減少幅度、抵押權設定增加幅度或雙貸族人數，也沒有增貸資金實際流入股市的數據。這波現象是普遍趨勢還是少數借款人的行為，仍不清楚。\"},\"sources\":[{\"name\":\"中央社-產經證券\",\"url\":\"https://www.cna.com.tw/news/afe/202611230181.aspx\"}],\"disagreements\":null,\"trustScore\":59,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"中央社-產經證券\"],\"glossary\":[{\"blurb\":{\"en\":\"The registration of a property changing hands through a sale in Taiwan.\",\"zh-TW\":\"台灣房屋因買賣而辦理所有權移轉登記。\"},\"term\":{\"en\":\"Building transfer\",\"zh-TW\":\"建物買賣移轉\"}},{\"blurb\":{\"en\":\"The registration of a property as collateral for a loan.\",\"zh-TW\":\"將房屋登記為貸款擔保品的手續。\"},\"term\":{\"en\":\"Mortgage registration\",\"zh-TW\":\"抵押權設定\"}},{\"blurb\":{\"en\":\"A borrower holding two mortgages at the same time, in this case a home loan plus a home-equity loan.\",\"zh-TW\":\"同時背負兩筆房貸（房貸加房屋增貸）的借款人。\"},\"term\":{\"en\":\"Dual borrower\",\"zh-TW\":\"雙貸族\"}},{\"blurb\":{\"en\":\"Borrowed money used to invest, which magnifies both gains and losses.\",\"zh-TW\":\"借錢投資的手法，會放大獲利也放大虧損。\"},\"term\":{\"en\":\"Leverage\",\"zh-TW\":\"槓桿\"}},{\"blurb\":{\"en\":\"A period when a market moves sideways with little clear direction.\",\"zh-TW\":\"市場橫向整理、方向不明的時期。\"},\"term\":{\"en\":\"Market consolidation\",\"zh-TW\":\"盤整\"}},{\"blurb\":{\"en\":\"Taiwan's national news agency.\",\"zh-TW\":\"台灣的國家通訊社。\"},\"term\":{\"en\":\"CNA\",\"zh-TW\":\"中央社\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-taiwan-02-h88d89bca/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-taiwan-02-h88d89bca/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"d:\"$8:metadata\"\n"])</script></body></html>
