 book deal.\nWhy it matters\nA near-complete series for $3 is the kind of backlist deal that rewards patient readers: the whole arc, one purchase, at the price of a coffee. The community score is the useful signal here — it says this is not just cheap, it is a series readers actually finish and recommend.\nSources agree / disagree\nThis is a single-outlet report: only Slickdeals carries the deal in this cluster, so no independent corroboration is available in the feed. Trust label: Single source — one outlet's reporting, not yet corroborated.\nStill uncertain\nWhether the other stores match the $2.99 price is not stated in the snippets, and the deal may be time-limited. The Kindle price is as-listed at posting time and needs the product page to confirm."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-shopping-02-the-silo-series-wool-shi\",\"category\":\"shopping\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-shopping-02-the-silo-series-wool-shi.jpg\",\"imageAlt\":{\"en\":\"The Silo Series eBook bundle by Hugh Howey\",\"zh-TW\":\"休·豪伊《筒倉》系列電子書合集\"},\"publishedAt\":\"2026-11-09T08:19:57.000Z\",\"title\":{\"en\":\"Hugh Howey's Silo Series eBook Bundle Is $2.99\",\"zh-TW\":\"休·豪伊《筒倉》系列電子書合集 2.99 美元\"},\"summary\":{\"en\":\"[Unconfirmed · single source] Amazon has Hugh Howey's Silo Series — Wool, Shift, Dust, and Silo Stories — as a Kindle eBook for $2.99, a deal the Slickdeals community rates Thumb Score +90. The bundle is also listed at Barnes \u0026 Noble, Apple Books, and Google Play.\",\"zh-TW\":\"［未證實·單一來源］亞馬遜 Kindle 電子書《筒倉》系列（Wool、Shift、Dust 與 Silo Stories，休·豪伊著）售價 2.99 美元，Slickdeals 社群評分高達 +90。Barnes \u0026 Noble、Apple Books 與 Google Play 也有上架。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"休·豪伊（Hugh Howey）的《筒倉》系列——Wool、Shift、Dust 與 Silo Stories——Kindle 電子書在亞馬遜售價 2.99 美元，Slickdeals 社群反應熱烈：評分高達 +90，是圖書優惠中少見的高分。\\n發生了什麼事\\n據 Slickdeals 首頁報導，亞馬遜上架《筒倉》系列合集（休·豪伊著，共四本）Kindle 電子書，售價 2.99 美元。同款合集在 Barnes \u0026 Noble、Apple Books 與 Google Play 也有販售，但摘要未提供這些通路的價格。+90 的社群評分代表高度認可，遠高於一般圖書優惠的分數。\\n為什麼重要\\n整套系列 3 美元，是那種獎勵耐心讀者的舊書優惠：完整故事線、一次買齊，價格只是一杯咖啡。社群評分才是有用的訊號——它說明這不只是便宜，而是讀者真的讀完、願意推薦的系列。\\n來源異同\\n這是單一媒體的報導：本集群只有 Slickdeals 刊載此優惠，來源摘要裡沒有其他媒體佐證。信任標籤：單一來源——僅一家媒體報導，尚未獲得佐證。\\n仍不確定\\n其他通路是否同為 2.99 美元，摘要未說明；優惠可能限時。Kindle 價格為刊出當時的標價，須查閱商品頁面確認。\"},\"sources\":[{\"name\":\"Slickdeals Frontpage\",\"url\":\"https://slickdeals.net/f/20274864-the-silo-series-wool-shift-dust-and-silo-stories-by-hugh-howey-kindle-ebook-2-99?utm_source=rss\u0026utm_content=fp\u0026utm_medium=RSS2\"}],\"disagreements\":null,\"trustScore\":47,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":10,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"shopping\",\"live-ingest\",\"slickdeals-frontpage\"],\"glossary\":[{\"term\":{\"en\":\"Hugh Howey\",\"zh-TW\":\"休·豪伊\"},\"blurb\":{\"en\":\"Author of the Silo Series.\",\"zh-TW\":\"《筒倉》系列的作者。\"}},{\"term\":{\"en\":\"Silo\",\"zh-TW\":\"筒倉系列\"},\"blurb\":{\"en\":\"Science-fiction series comprising Wool, Shift, Dust, and Silo Stories.\",\"zh-TW\":\"包含 Wool、Shift、Dust 與 Silo Stories 的科幻系列。\"}},{\"term\":{\"en\":\"Kindle\",\"zh-TW\":\"Kindle\"},\"blurb\":{\"en\":\"Amazon's eBook platform selling the bundle.\",\"zh-TW\":\"販售此合集的亞馬遜電子書平台。\"}},{\"term\":{\"en\":\"Slickdeals\",\"zh-TW\":\"Slickdeals\"},\"blurb\":{\"en\":\"Deal community that listed the offer.\",\"zh-TW\":\"刊出這筆優惠的折扣社群。\"}},{\"term\":{\"en\":\"eBook\",\"zh-TW\":\"電子書\"},\"blurb\":{\"en\":\"Digital edition of the series.\",\"zh-TW\":\"此系列的數位版本。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) new
