ckup where available, or free ship to store. For orders shipped elsewhere, shipping is free on orders of $25 or more. The headline rounds the price to $8, while the deal text gives the precise $7.99 after the code. Why it matters The verdict for bargain hunters is straightforward: at $7.99 after the code, these oversized throws are selling for about a fifth less than the $9.99 sale price — and pickup keeps the total at $7.99 with no shipping added. The catch is the usual one for deal posts: the price depends on the code still working at checkout, and the $25 free-shipping threshold means a single throw shipped to home would not qualify on its own. Sources agree / disagree This is a single-outlet deal post from Slickdeals Frontpage, so there is no second source to corroborate the price. The only numeric difference is inside the post itself: the headline says $8, the deal text says $7.99 after the code — a rounding difference, not a dispute. Trust label: Single source — one deal post only; verify the price and the code before buying. Still uncertain The feed snippet does not say how long the sale or the code lasts, which Disney designs are included, or whether stock is limited by store. Prices on deal posts can change or sell out quickly; check the Kohl's listing before ordering."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-shopping-02-60-x-72-the-big-one-over\",\"category\":\"shopping\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-shopping-02-60-x-72-the-big-one-over.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Kohl's Big One and Disney plush throws drop to $7.99 with code SAVINGS\",\"zh-TW\":\"相關封面圖：科爾斯 Big One 與迪士尼超大毛絨毯折扣碼後 7.99 美元\"},\"publishedAt\":\"2026-11-09T01:25:29.000Z\",\"title\":{\"en\":\"Kohl's Big One and Disney Plush Throws Drop to $7.99 With Code SAVINGS\",\"zh-TW\":\"科爾斯（Kohl's）Big One 與迪士尼超大毛絨毯折扣碼後 7.99 美元，可免費到店取貨\"},\"summary\":{\"en\":\"［未證實·單一來源］Kohl's lists The Big One and Disney oversized plush throws, 60 by 72 inches, at $9.99, or $7.99 with promo code SAVINGS. Free store pickup applies where available, or free ship to store; otherwise shipping is free on orders over $25 — confirm the code at checkout.\",\"zh-TW\":\"［未證實·單一來源］科爾斯（Kohl's）精選毛絨休閒毯特價 9.99 美元，使用促銷代碼 SAVINGS 可再享 8 折，折後 7.99 美元，品項包括 60 吋 × 72 吋的 Big One 超大超軟毛絨毯與迪士尼超大毛絨毯。有提供門市取貨者可免費取貨，或免費寄送到店；否則滿 25 美元免運費。結帳前請確認折扣碼仍有效。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"根據 Slickdeals 首頁的優惠貼文，科爾斯（Kohl's）精選超大毛絨休閒毯特價 9.99 美元，使用促銷代碼 SAVINGS 可再享 8 折，折後 7.99 美元；品項為 60 吋 × 72 吋的 Big One 超大超軟毛絨毯與迪士尼超大毛絨毯。有提供門市取貨者可免費取貨，該貼文在站內獲得 +28 的 Thumb Score。\\n發生了什麼事\\n優惠涵蓋兩款商品：The Big One 超大超軟毛絨休閒毯與迪士尼超大毛絨休閒毯，尺寸皆為 60 吋 × 72 吋。貼文標價 9.99 美元，結帳輸入促銷代碼 SAVINGS 可再享 8 折，折後 7.99 美元。消費者可選擇免費門市取貨（有提供者）或免費寄送到店；寄送到其他地址者，滿 25 美元免運費。標題將價格寫為 8 美元，內文則為折扣碼後精確的 7.99 美元。\\n為什麼重要\\n對撿便宜的消費者來說結論很直接：折扣碼後 7.99 美元，比 9.99 美元的特價再便宜約兩成，而且到店取貨不加運費，總價就是 7.99 美元。但優惠貼文的老問題仍在：價格取決於結帳時折扣碼是否仍有效；若選擇寄送到家，單買一條毯子未滿 25 美元，運費就得另外計算。\\n來源異同\\n這是 Slickdeals 首頁的單一來源優惠貼文，沒有第二個來源可以佐證價格。唯一的數字差異出現在貼文本身：標題寫 8 美元，內文寫折扣碼後 7.99 美元，屬於四捨五入的差異，不是爭議。信任標籤：單一來源——僅有一則優惠貼文，購買前請先核對價格與折扣碼。\\n仍不確定\\n摘要未說明特價與折扣碼的有效期限、迪士尼款包含哪些圖案，或各門市庫存是否有限。優惠價格可能變動或售完；下單前請先查看科爾斯商品頁。\"},\"sources\":[{\"name\":\"Slickdeals Frontpage\",\"url\":\"https://slickdeals.net/f/20267940-the-big-one-oversized-supersoft-plush-throw-or-disney-oversized-plush-throw-7-99-more-free-store-pickup-at-kohl-s-or-f-s-on-orders-25?utm_source=rss\u0026utm_content=fp\u0026utm_medium=RSS2\"}],\"disagreements\":{\"en\":\"The headline rounds the price to $8, while the deal text gives $7.99 after promo code SAVINGS.\",\"zh-TW\":\"標題將價格寫為 8 美元，內文則為使用促銷代碼 SAVINGS 後的 7.99 美元。\"},\"trustScore\":47,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":10,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"shopping\",\"live-ingest\",\"slickdeals-frontpage\"],\"glossary\":[{\"term\":{\"en\":\"Kohl's\",\"zh-TW\":\"科爾斯\"},\"blurb\":{\"en\":\"US department-store chain selling the throws i
