he cybersecurity company announced on November 18.\nWhat happened\nThe San Francisco startup gives Palo Alto capabilities beyond its traditional cybersecurity business, letting it take part more directly in the infrastructure used to deploy enterprise AI models. Palo Alto has been steadily acquiring companies to capitalise on demand for cyber tools to fight AI, and it raised its outlook in the face of what it called the 'current threat environment and demand we see ahead of us.' CNBC reports shares popped 7% on earnings.\nWhy it matters\nThe deal is Palo Alto's biggest step yet from selling security software into owning a piece of the AI stack itself. If the integration works, Palo Alto stops being only a guardrail on other companies' AI and becomes a supplier of the infrastructure those models run on.\nSources agree / disagree\nCNBC, MarketWatch, DigiTimes and TechNews agree on the $4.5 billion all-stock deal and the November 18 announcement. CNBC's headline puts the share move at 7% on earnings. The cluster note's stray '18' is the November 18 announcement date, not a competing figure — no outlet disputes the deal terms or the 7% move.\nStill uncertain\nThe adjustments to the $4.5 billion valuation and the closing timeline are beyond the snippets. Verify on the publisher pages.\nTrust label: Multi-source agreement"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-01-palo-alto-inks-4-5-billi\",\"category\":\"finance\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-finance-01-palo-alto-inks-4-5-billi.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Palo Alto inks $4.5 billion deal for AI startup Applied Compute, shares pop 7% on earnings\",\"zh-TW\":\"相關封面圖：帕洛阿爾托 (Palo Alto) 斥資 45 億美元收購人工智慧新創公司 Applied Compute，股價因獲利上漲 7%\"},\"publishedAt\":\"2026-11-19T02:17:08.000Z\",\"title\":{\"en\":\"Palo Alto Networks Agrees $4.5 Billion All-Stock Deal for AI Startup Applied Compute\",\"zh-TW\":\"帕洛阿爾托網路（Palo Alto Networks）以 45 億美元全股票交易收購 AI 新創 Applied Compute\"},\"summary\":{\"en\":\"Palo Alto Networks agreed to buy Applied Compute, a platform for post-training and inference of open-weight AI models, in an all-stock deal valued at $4.5 billion, announced November 18. Shares rose 7% on earnings, CNBC reports. The deal pushes Palo Alto into AI infrastructure. Watch the closing adjustments and integration.\",\"zh-TW\":\"帕洛阿爾托網路（Palo Alto Networks）11 月 18 日宣布，已同意以全股票交易收購開放權重 AI 模型後訓練與推理平台 Applied Compute，交易價值 45 億美元。美國消費者新聞與商業頻道（CNBC）報導，財報帶動股價上漲 7%。接下來看交易完成時的估值調整與整合進展。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"網路安全公司帕洛阿爾托網路（Palo Alto Networks）11 月 18 日宣布，已同意以全股票交易收購開放權重 AI 模型後訓練與推理平台 Applied Compute，交易價值 45 億美元，金額可能調整。\\n發生了什麼事\\n這家舊金山新創讓帕洛阿爾托網路獲得傳統網路安全業務以外的能力，得以更直接參與企業 AI 模型部署的基礎設施。帕洛阿爾托網路一直在穩步收購公司，把握對抗 AI 的網路工具需求，並以「當前的威脅環境與我們看到的前方需求」為由上調財測。美國消費者新聞與商業頻道（CNBC）報導，財報帶動股價上漲 7%。\\n為什麼重要\\n這筆交易是帕洛阿爾托網路從銷售安全軟體走向擁有 AI 技術棧一環的最大一步。整合若成功，帕洛阿爾托網路不再只是其他公司 AI 的守門人，而是這些模型運行的基礎設施供應商。\\n來源異同\\n美國消費者新聞與商業頻道、市場觀察（MarketWatch）、電子時報（DigiTimes）與科技新報（TechNews）四家媒體都確認 45 億美元全股票交易與 11 月 18 日宣布；美國消費者新聞與商業頻道頭條稱股價上漲 7%。群組註記中的「18」是 11 月 18 日的宣布日期，並非相互衝突的數字——沒有媒體質疑交易條件或 7% 的漲幅。\\n仍不確定\\n45 億美元估值的調整幅度與交易完成時程超出摘要範圍；引用前請查閱原文。\"},\"sources\":[{\"name\":\"CNBC\",\"url\":\"https://www.cnbc.com/2026/11/18/palo-alto-networks-panw-q1-2027-earnings-.html\"},{\"name\":\"MarketWatch\",\"url\":\"https://www.marketwatch.com/story/palo-alto-networks-stock-soars-as-earnings-show-ai-has-upped-the-stakes-for-cybersecurity-308e34b8?mod=mw_rss_topstories\"},{\"name\":\"DigiTimes\",\"url\":\"https://www.digitimes.com/news/a20261119VL206/palo-alto-networks-ai-inference-startup-acquisition-business.html\"},{\"name\":\"TechNews 科技新報\",\"url\":\"https://technews.tw/2026/11/19/palo-alto-networks-buy-applied-compute/\"}],\"disagreements\":null,\"trustScore\":77,\"trustBreakdown\":{\"sourceDiversity\":25,\"outletReputation\":10,\"crossCorroboration\":17,\"recencyClarity\":25},\"tags\":[\"finance\",\"live-ingest\
