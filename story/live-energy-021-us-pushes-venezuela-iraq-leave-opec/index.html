er Ali Faleh al-Zaidi during summer discussions to consider leaving the oil cartel.\n\nIraq's oil ministry resisted the proposal, and Saudi Crown Prince Mohammed bin Salman intervened over the summer to persuade the Trump administration not to push the issue further.\n\nA U.S. State Department official stated that conversations with Iraq focused on improving energy infrastructure to boost production and transportation, rather than OPEC membership. OPEC and the governments of Venezuela, Iraq, and Saudi Arabia did not respond to requests for comment.\n\nOPEC has already lost four members since 2019, and the reported U.S. maneuvers underscore how Washington has shifted from a major OPEC customer to a primary rival in the global oil market.\n\nTrust label: Multi-source agreement — Times of Israel and Ground News both cite the same Reuters report detailing U.S. pressure on Venezuela and Iraq."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-energy-021-us-pushes-venezuela-iraq-leave-opec\",\"category\":\"energy\",\"title\":{\"en\":\"U.S. Reportedly Pushed Venezuela and Iraq to Consider Leaving OPEC\",\"zh-TW\":\"路透：美國施壓委內瑞拉與伊拉克考慮退出石油輸出國組織\"},\"summary\":{\"en\":\"U.S. officials reportedly prevented Venezuela from paying OPEC dues and urged Iraq to leave the cartel before Saudi Crown Prince Mohammed bin Salman intervened. The diplomatic push highlights Washington's growing rivalry with OPEC over global oil supply.\",\"zh-TW\":\"知情人士向路透透露，美國曾阻止委內瑞拉繳納石油輸出國組織會費，並施壓伊拉克考慮退群，最終因沙烏地王儲介入而暫緩。這顯示美國已從石油買家轉為油市主要競爭者，正直接挑戰產油國聯盟的凝聚力。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n知情人士向路透透露，美國政府阻止委內瑞拉繳納石油輸出國組織（OPEC）年度會費，並在今年夏季的會談中，敦促伊拉克總理阿里・法萊赫・扎伊迪（Ali Faleh al-Zaidi）考慮退出該組織。伊拉克石油部對此表達反對，沙烏地阿拉伯王儲穆罕默德・沙爾曼（Mohammed bin Salman）隨後介入，說服唐納・川普（Donald Trump）政府不要進一步施壓。\\n\\n「為什麼重要」\\nOPEC 自 2019 年以來已流失四個成員國。隨著美國從石油進口客戶轉變為全球油市的主要競爭對手，華府對產油國的外交施壓直接牽動國際油價定價權與能源地緣政治格局。\\n\\n「來源異同」\\n以色列時報與 Ground News 均引述路透報導，對美國施壓委內瑞拉與伊拉克、以及沙國王儲介入的經過描述一致。美國國務院官員則在報導中回應，與伊拉克的對話聚焦於改善能源基礎設施與提升產運能力，而非 OPEC 會籍。\\n\\n「仍不確定」\\nOPEC 官方以及委內瑞拉、伊拉克、沙烏地阿拉伯三國政府均未回應置評請求，華府未來是否會重啟類似外交施壓仍無從確認。\"},\"glossary\":[{\"term\":{\"en\":\"OPEC\",\"zh-TW\":\"石油輸出國組織（OPEC）\"},\"blurb\":{\"en\":\"An intergovernmental organization of oil-exporting nations that coordinates petroleum policies and production quotas.\",\"zh-TW\":\"由主要產油國組成的政府間組織，負責協調石油政策與產量配額以影響國際油價。\"}},{\"term\":{\"en\":\"Membership Dues\",\"zh-TW\":\"會員年費\"},\"blurb\":{\"en\":\"Annual financial contributions required from member states to maintain active standing in an international body.\",\"zh-TW\":\"成員國為維持在國際組織內正式資格所須繳納的年度費用。\"}},{\"term\":{\"en\":\"Energy Infrastructure\",\"zh-TW\":\"能源基礎設施\"},\"blurb\":{\"en\":\"Physical facilities such as pipelines, refineries, and grids used to produce and transport oil and power.\",\"zh-TW\":\"用於能源生產、提煉與輸送的管線、煉油廠及相關硬體設施。\"}}],\"sources\":[{\"name\":\"The Times of Israel (via Reuters)\",\"url\":\"https://www.timesofisrael.com/liveblog_entry/us-pushed-venezuela-iraq-to-consider-leaving-opec-sources-tell-reuters/\"},{\"name\":\"Ground News (citing Reuters)\",\"url\":\"https://ground.news/article/us-pushed-venezuela-iraq-to-consider-leaving-opec-sources-say\"}],\"imageUrl\":\"/covers/live/live-energy-021-us-pushes-venezuela-iraq-leave-opec.jpg\",\"imageAlt\":{\"en\":\"Oil refinery infrastructure in Venezuela\",\"zh-TW\":\"委內瑞拉煉油廠設施\"},\"isHeadline\":true,\"isPopular\":false,\"trustScore\":80,\"trustBreakdown\":{\"crossCorroboration\":18,\"outletReputation\":22,\"recencyClarity\":22,\"sourceDiversity\":18},\"publishedAt\":\"2026-11-27T13:51:37.000Z\",\"disagreements\":\"匿名消息人士指美國施壓伊拉克退出 OPEC，但美國國務院官員稱對話僅聚焦於能源基礎設施而非 OPEC 會籍。\",\"selfCheck\":{\"D1\":4,\"D2\":4,\"D3\":4,\"D4\":4,\"D5\":3,\"total\":19},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([
