ecause her eight o'clock drama was rushing to catch up after typhoon delays.\nWhat happened\nHonduras, nominated for best actor in a miniseries or TV movie for his role in 'Da Xian Weng Zai' (大仙尪仔), lost to veteran actor Chin Han at the 61st Golden Bell Awards. It was his seventh nomination without a win. He said he had written his seventh acceptance speech, which went unused again, and shared it with supporters anyway, calling the decision to skip the ceremony the most painful of his life. Meanwhile, the 55-year-old best supporting actress winner, back after a 12-year gap, missed the ceremony: she could not get leave from the eight o'clock drama 'Tofu Mama' (豆腐媽媽), because the ceremony had been postponed by a typhoon, the drama's production had also stopped, and the set had gone to double-shift shooting to catch up, or the show would have faced an empty slot.\nWhy it matters\nThe verdict is about what the ceremony actually rewarded: two performers whose work was recognized, neither of whom could be in the room. Honduras' seventh unused speech has become its own ritual of persistence, while the supporting actress absence shows how a typhoon's scheduling chaos rippled from the awards stage into nightly drama production. The night's real story is the collision between live television and weather.\nSources agree / disagree\nETtoday, Yahoo TW, LINE TODAY and Google News agree on the two threads: Honduras' seventh miss and unused speech, and the supporting actress win with a typhoon-related absence. Trust label: Multi-source agreement — multiple outlets agree on the core claims. The feed's auto-flagged figure mismatch (55 vs 61) pairs the winner's age with the ceremony number, not a real conflict, so no disagreement is recorded.\nStill uncertain\nWhy Honduras himself skipped the ceremony beyond calling it a painful decision is not spelled out in the feed snippets, and the exact rescheduled ceremony logistics are not detailed. The same batch also noted other ceremony results, including six awards for the drama 'Forget You Not' and the best actor and actress wins, which belong to the same night's coverage rather than this card's two threads."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-eastAsiaGossip-01-61-7-line-today\",\"category\":\"eastAsiaGossip\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-eastAsiaGossip-01-61-7-line-today.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 金鐘61／洪都拉斯7度入圍仍沒得獎！本人吐真心話：人生最痛苦決定 | 緯來娛樂新聞 - LINE TODAY\",\"zh-TW\":\"相關封面圖：金鐘61／洪都拉斯7度入圍仍沒得獎！本人吐真心話：人生最痛苦決定 | 緯來娛樂新聞 - LINE TODAY\"},\"publishedAt\":\"2026-10-27T05:15:00.000Z\",\"title\":{\"en\":\"Golden Bell 61: Seven-Time Nominee Honduras Misses Again as Best Supporting Actress Winner Accepts in Absentia\",\"zh-TW\":\"金鐘61：洪都拉斯第7度入圍落空，謝瓊煖奪女配角卻因《豆腐媽媽》趕拍缺席\"},\"summary\":{\"en\":\"Taiwanese actor Honduras missed out for a seventh time in the Golden Bell miniseries-or-TV-movie best actor race, calling it the most painful decision to skip the ceremony, while the best supporting actress winner missed the show because typhoon delays forced her eight o'clock drama into double-shift shooting. Takeaway: two absences, two reasons, one awards night reshaped by a typhoon.\",\"zh-TW\":\"金鐘61上，台灣演員洪都拉斯第7度角逐迷你劇集電視電影男主角再度落空，他說缺席典禮是「人生最痛苦決定」；而奪下女配角的謝瓊煖也缺席，因為颱風延期打亂拍攝，八點檔《豆腐媽媽》被迫開兩棚趕拍、無法告假。重點：兩人缺席、原因各異，颱風改寫了這一夜的頒獎典禮。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"第61屆金鐘獎之夜，兩個缺席說出了這一夜的故事：7度入圍的洪都拉斯再度與迷你劇集電視電影男主角擦身而過，而奪下女配角的謝瓊煖也無法到場，因為颱風延期打亂拍攝，八點檔正開兩棚趕拍。\\n發生了什麼事\\n洪都拉斯以《大仙尪仔》入圍第61屆金鐘獎迷你劇集電視電影男主角獎，可惜最終敗給秦漢。這是他第7度落敗。他說，這是他第7次寫得獎感言，「還是沒有用上；又不忍心揉掉，畢竟都是我的肺腑之言，我還是分享給所有支持我的朋友知道」，並形容缺席典禮是人生最痛苦的決定。而55歲的謝瓊煖睽違12年再奪金鐘女配角，卻也缺席：她未能向八點檔《豆腐媽媽》告假與會，背後原因跟颱風有關——典禮因為颱風延期，八點檔也因此停工，攝影棚已經開兩棚趕拍，否則可能會開天窗。拍攝中途被喊卡、全場拍手擁抱的畫面，也成了這一夜的花絮。\\n為什麼重要\\n重點在典禮真正表彰了什麼：兩位作品獲得肯定的表演者，卻都無法親自到場。洪都拉斯第7次沒用上的感言，已經變成一種堅持的儀式；而女配角的缺席，則顯示颱風造成的檔期混亂如何從頒獎舞台一路波及八點檔的製作。這一夜真正的故事，是直播典禮與天氣的碰撞。\\n來源異同\\nETtoday、Yahoo TW、LINE TODAY 與 Google News 在兩條主線上一致：洪都拉斯第7度落空與沒用上的感言、女配角得獎與颱風相關的缺席。信任標籤：N源一致——多家媒體對核心主張的報導一致。片段自動標註的數字差異（55 對 61）是把得獎者年齡與屆數配在一起，不是真正的衝突，因此不列入 disagreements。同批還提到同夜其他結果，包括《忘了我記得》獲6獎與視帝、視后得主，那屬於同夜報導，不是本卡的兩條主線。\\n仍不確定\\n洪都拉斯缺席典禮的原因，除了他所說的「痛苦決定」之外，片段中沒有進一步說明；典禮改期的確切安排也沒有細節。\"},\"sources\":[{\"name\":\"ETtoday 影劇\",\"url\":\"https://star.ettoday.net/news/3261551\"},{\"name\":\"Yahoo TW 娛樂\",\"url\":\"https://tw.news.yahoo.com/%E8%AC%9D%E7%93%8A%E7%85%96%E6%8B%8D-%E8%B1%86%E8%85%90%E5%AA%BD%E5%AA%BD-%E7%AA%81%E8%A2%AB%E5%96%8A%E5%8D%A1-%E5%85%A8%E5%A0%B4%E6%8B%8D%E6%89%8B%E6%93%81%E6%8A%B1-%E6%B4%AA%E9%83%BD%E6%8B%89%E6%96%AF%E7%BC%BA%E5%B8%AD%E9%87%91%E9%90%98%E5%90%90%E5%BF%83%E8%81%B2-054356282.html\"},{\"name\":\"today.line.me\",\"url\":\"https://news.google.com/rss/articles/CBMiVkFVX3lxTE0xTnFwcExKMDFOOFNzWFVLUnliOWZzRF9jMzZ0T3BoZHBZaFc3dFZwV3hLUVIwU1ZKbHp4aG9nWlpTNGRVSnpkeUk0OXJEWWFnZ3NQeU5R?oc=5\"},{\"name\":\"Google News\",\"url\":\"https://news.google.com/rss/articles/CBMiWkFVX3lxTFBtYi1XT29Rd1lBbzhmTjREWV80QnAtSjd6dy13c2lTWUE5bTdGUGpRT3huUlZVTVU1RnhpWm1Nb0hFODNMd3AyUnhSMlFZQnhXeTd5YkVkM293Z9IBX0FVX3lxTFB0d0s0S0tnOVBnTEczb21WSFAxODZ4cmpOWHBRNS1TZm9IalFsX0FvOElaaEh1WXlfTlM2X01XRGIyem54aVY4eXB1NE40MUtnZjFNSWZGbFU3ZzZFNkRz?oc=5\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":25,\"outletReputation\":16,\"crossCorroboration\":17,\"recencyClarity\":25},\"tags\":[\"eastAsiaGossip\",\"live-ingest\",\"region:tw\",\"ettoday-影劇\",\"yahoo-tw-娛樂\",\"yahoo-tw-娛樂\"],\"region\":\"tw\",\"glossary\":[{\"term\":{\"en\":\"Golden Bell Awards\",\"zh-TW\":\"金鐘獎\"},\"blurb\":{\"en\":\"Taiwan's major television awards, now in their 61st edition.\",\"zh-TW\":\"台灣主要的電視獎項，本屆為第61屆。\"}},{\"term\":{\"en\":\"Honduras\",\"zh-TW\":\"洪都拉斯\"},\"blurb\":{\"en\":\"Taiwanese actor and seven-time Golden Bell nominee.\",\"zh-TW\":\"台灣演員，第61屆金鐘獎7度入圍者。\"}},{\"term\":{\"en\":\"eight o'clock drama\",\"zh-TW\":\"八點檔\"},\"blurb\":{\"en\":\"The prime-time evening drama slot whose rushed shooting kept the support
