 Bond girl? Its roundup runs from Zendaya and Anna Sawai to Dakota Johnson, floating 45 names for readers to weigh in on.\nWhy it matters\nBond is one of the few franchises where the casting itself is the news — the choice sets the tone for the next decade of films. Picking Pattinson, a global star with both franchise and art-house credibility, signals Amazon MGM wants a Bond who can carry the series while Villeneuve rebuilds it. The takeaway: the lead is locked; the casting conversation now moves to the Bond girl and the rest of the ensemble.\nSources agree / disagree\nETtoday, Yahoo News and Vogue Taiwan agree on the core facts — Pattinson is the new Bond, Villeneuve directs, Amazon MGM announced it. The specific reasons the producers gave were not in the feed material, so they are not repeated here; the Bond-girl names are presented as a fan roundup, not as confirmed casting.\nStill uncertain\nThe producers' stated reasons, the film's timetable, and whether any Bond-girl name has moved beyond speculation were not in the material. Verify them in the full reporting before treating the roundup as a shortlist.\nTrust label: Multi-source agreement — three outlets agree on the casting, the director and the announcement."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-eastAsiaGossip-01-007-yahoo\",\"category\":\"eastAsiaGossip\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-eastAsiaGossip-01-007-yahoo.gif\",\"imageAlt\":{\"en\":\"Cover related to: 第七代新任007龐德出爐！羅伯派汀森接任⋯打敗眾男星 製片曝關鍵原因 - Yahoo新聞\",\"zh-TW\":\"相關封面圖：第七代新任007龐德出爐！羅伯派汀森接任⋯打敗眾男星 製片曝關鍵原因 - Yahoo新聞\"},\"publishedAt\":\"2026-11-17T03:51:11.000Z\",\"title\":{\"en\":\"Robert Pattinson Named the New James Bond, Ending Months of Guessing\",\"zh-TW\":\"羅伯派汀森接任第七代 007 龐德，數月猜謎落幕\"},\"summary\":{\"en\":\"Robert Pattinson is the new James Bond: Amazon MGM and director Denis Villeneuve have confirmed the Twilight and Batman actor will take over from Daniel Craig as 007. Attention turns to the next Bond girl — Zendaya, Anna Sawai and Dakota Johnson are among the names in circulation. Takeaway: the lead is set; the supporting cast is next.\",\"zh-TW\":\"《暮光之城》與《蝙蝠俠》男星羅伯派汀森（Robert Pattinson）確定接任第七代 007 龐德：亞馬遜米高梅影業（Amazon MGM）與《沙丘》導演丹尼·維勒納夫（Denis Villeneuve）正式宣布，他將接棒丹尼爾·克雷格（Daniel Craig）。選角底定後，焦點轉向新一代龐德女郎——千黛亞、澤井杏奈、達珂塔·強生都是熱門人選。結論：男主角已定，配角是下一輪猜謎。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"數個月的猜謎落幕：《暮光之城》與《蝙蝠俠》的英國男星羅伯派汀森（Robert Pattinson）將成為新一代詹姆斯·龐德（James Bond）。亞馬遜米高梅影業（Amazon MGM）與《沙丘》導演丹尼·維勒納夫（Denis Villeneuve）正式宣布選角，派汀森成為影史第七位接下奧斯頓·馬丁車鑰匙的 007。\\n發生了什麼事\\n亞馬遜米高梅影業與維勒納夫宣布，派汀森將接棒丹尼爾·克雷格（Daniel Craig）出演龐德，結束數月來的人選猜測。ETtoday 報導，派汀森從眾多男星中殺出重圍，標題稱製片方說明了選擇他的關鍵原因。男主角底定後，Vogue Taiwan 把焦點轉向下一個問題：誰是新一代龐德女郎？它的盤點從千黛亞、澤井杏奈到達珂塔·強生，一共列出 45 位人選供讀者評選。\\n為什麼重要\\n龐德是少數「選角本身就是新聞」的系列——人選決定了未來十年電影的調性。選擇派汀森這位兼具商業大片與藝術片資歷的全球明星，顯示亞馬遜米高梅要的是一個能扛起系列、同時讓維勒納夫重塑它的龐德。結論是：男主角已定，選角話題接下來移到龐德女郎與其他配角。\\n來源異同\\nETtoday、Yahoo 新聞與 Vogue Taiwan 在核心事實上一致：派汀森是新龐德、維勒納夫執導、亞馬遜米高梅宣布。製片方說明的具體原因未載於摘要，這裡不轉述；龐德女郎名單只是媒體盤點，不是已確認的選角。\\n仍不確定\\n製片方說明的具體原因、電影時程、以及任何龐德女郎人選是否超出傳聞階段，材料中都沒有，引用前請查完整報導。\"},\"sources\":[{\"name\":\"ETtoday 影劇\",\"url\":\"https://star.ettoday.net/news/3273299\"},{\"name\":\"Google News TW 娛樂\",\"url\":\"https://news.google.com/rss/articles/CBMimwNBVV95cUxNNXdid3lHeTd5SEFYOTZpZ05JUUlTZVVKQ2p5ZXZ0aG9WMUdzNDhPMnNoUVpMMTFoZVlqYWFnQndXekkyTVdXdjVMTWJlc1E5Ym1RTTFoUzV0cG55V1BpRjB4cUxoUUlQYXVZYU5KVU10c0xjU2p5bUF1Sko5WktGbkt0S0xRYV9sdWVrQ05yN2RBU19Vc2dScWRrUjFadFNmY00yWkxsZ2hVcmtHS1h2YktRRGFiNVR0eXN1c0ZpRHlFYVJaTEo4Q2t2Qm5aNHhwdkRleTFQazdxVzlKTDAtZERScTBBYndPNk4wT3BrTzNNZGdmSVNlTldmVmRHUDF0bHFzMWJjQXIxYXZNcVRFa1V2RkwzUFNIZG9Zd0VIWnk3VkpzRkxVMTJKRndGNm9IcUJhZkdtdXFON0l3WThuMmNKYkRNTkhNbDJVZlh3VmF0RndSVTJwVEZNSVIzYmhUWENTeGUza3ZWbng2S2taOUJYVW1nMkk5cjIyQVFVcGUwZlBoOVVZa3N1dFNYWHpnSURfU0xabUoyYVk?oc=5\"},{\"name\":\"Vogue Taiwan\",\"url\":\"https://www.vogue.com.tw/galerie/who-will-be-the-next-bond-girl\"}],\"disagreements\":null,\"trustScore\":84,\
