sted jeans as a continuing fashion first choice for improving proportions in autumn-winter 2026. The six combinations run from mom jeans to wide-leg trousers, paired with high heels, ankle boots, and long boots. Dakota Johnson and Gigi Hadid are named as wearers of the style. The summary promises model-like long legs and a French high-end feel, but it does not describe each of the six looks separately or name brands or prices.\nWhy it matters\nThe guide matters as a practical styling judgment, not as a trend forecast backed by sales or runway evidence in the summary: it tells readers that one cut, worn six ways, can solve the proportion problem the headline names. The narrower takeaway is that high-waisted jeans plus heels or boots is presented as the season's proportion formula, with celebrity examples as proof the look is worn widely.\nSources agree / disagree\nOnly one outlet, Vogue Taiwan, was listed, with no second source corroborating the styling claims in the material provided. Trust label: Single source — one outlet presented the six-look guide without independent corroboration in the material provided.\nStill uncertain\nThe missing key information is the description of each of the six looks, the specific cuts, colours, brands, and prices, and any photos showing the outfits. Check the full Vogue Taiwan guide before relying on any individual combination as a complete outfit."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-beauty-02-gigi-hadid-2026-6\",\"category\":\"beauty\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-beauty-02-gigi-hadid-2026-6.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 達珂塔強生、Gigi Hadid都愛穿！2026秋冬必學「高腰牛仔褲」6種穿搭，搭配高跟鞋、短靴告別五五身\",\"zh-TW\":\"相關封面圖：達珂塔強生、Gigi Hadid都愛穿！2026秋冬必學「高腰牛仔褲」6種穿搭，搭配高跟鞋、短靴告別五五身\"},\"publishedAt\":\"2026-10-30T05:53:51.000Z\",\"title\":{\"en\":\"Dakota Johnson and Gigi Hadid Lead Six High-Waisted Jeans Looks for Autumn Winter 2026\",\"zh-TW\":\"達珂塔強生（Dakota Johnson）、吉吉·哈蒂德（Gigi Hadid）示範 2026 秋冬高腰牛仔褲 6 種穿搭\"},\"summary\":{\"en\":\"[Unverified, single source] High-waisted jeans remain the autumn-winter 2026 choice for flattering proportions, Vogue Taiwan reported, with six looks pairing them with heels, ankle boots and long boots. Dakota Johnson and Gigi Hadid wear the style, so watch whether the six combinations become the season's standard formula.\",\"zh-TW\":\"[未證實·單一來源]2026 秋冬高腰牛仔褲仍是修飾比例的時尚首選，Vogue Taiwan 介紹 6 組搭配高跟鞋、短靴與長靴的穿法，達珂塔強生（Dakota Johnson）與吉吉·哈蒂德（Gigi Hadid）都愛穿，後續要看這 6 組公式是否成為本季主流。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"2026 秋冬高腰牛仔褲仍是修飾比例的時尚首選，Vogue Taiwan 介紹 6 組搭配高跟鞋、短靴與長靴的穿法。\\n發生了什麼事\\nVogue Taiwan 指出，高腰牛仔褲在 2026 秋冬仍是修飾比例的時尚首選。6 組穿法從老媽牛仔褲到寬褲，搭配高跟鞋、短靴與長靴。達珂塔強生（Dakota Johnson）與吉吉·哈蒂德（Gigi Hadid）都被點名愛穿這個款式。摘要宣稱這些組合能穿出名模般的長腿與法式高級感，但提供的資料沒有逐一描述 6 組穿法，也沒有說明品牌或價格，沒有呈現個別造型。\\n為什麼重要\\n這篇指南的直接意義是實用的穿搭判斷，而不是摘要中有銷售或伸展台證據支撐的趨勢預測：它告訴讀者，一種褲型用 6 種方式穿，就能解決標題點出的比例問題。這個說法只有在讀者看得到 6 組組合時才有用，摘要沒有提供這些細節。比標題更窄的結論是：高腰牛仔褲搭配高跟鞋或靴子，被當成本季的比例公式，名人範例則用來證明這個穿法受到廣泛穿著。\\n來源異同\\n這張卡片只有 Vogue Taiwan 一家來源，提供的資料中沒有第二家來源佐證穿搭說法。信任標籤：單一來源——僅一家媒體呈現 6 種穿法指南，提供的資料中沒有獨立佐證。摘要只說明款式、6 組組合的概括內容與兩位具名穿著者，沒有可比較的衝突事實。\\n仍不確定\\n仍缺少的關鍵資訊包括 6 組穿法各自的描述、具體褲型、顏色、品牌與價格，以及呈現造型的照片。摘要沒有說明這些細節；把任何一組穿法當成完整造型之前，請查閱 Vogue Taiwan 的完整指南。\"},\"sources\":[{\"name\":\"Vogue Taiwan\",\"url\":\"https://www.vogue.com.tw/article/high-waisted-jeans-style-guide\"}],\"disagreements\":null,\"trustScore\":47,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":10,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"beauty\",\"live-ingest\",\"vogue-taiwan\"],\"glossary\":[{\"term\":{\"en\":\"Dakota Johnson\",\"zh-TW\":\"達珂塔強生\"},\"blurb\":{\"en\":\"Actor named as a wearer of high-waisted jeans in the Vogue Taiwan guide.\",\"zh-TW\":\"Vogue Taiwan 指南點名愛穿高腰牛仔褲的演員。\"}},{\"term\":{\"en\":\"Gigi Hadid\",\"zh-TW\":\"吉吉·哈蒂德\"},\"blurb\":{\"en\":\"Model named as a wearer of high-waisted jeans in the Vogue Taiwan guide.\",\"zh-TW\":\"Vogue Taiwan 指南點名愛
