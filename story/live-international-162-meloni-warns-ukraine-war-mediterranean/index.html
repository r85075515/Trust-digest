Giorgia Meloni stated that while Rome maintains its support for Ukraine against Russia, the war \"should not and cannot be expanded to the Mediterranean.\" Her remarks came days after Ukrainian forces used sea drones to strike a Russian naval vessel docked at a port in Libya. German officials echoed caution against geographical expansion of the conflict, while U.S. President Donald Trump posted that both Ukrainian and Russian forces should avoid actions that intentionally or unintentionally widen the war.\n\nThe warning underscores growing anxiety among Southern European NATO members that long-range maritime drone operations could destabilize shipping lanes and energy infrastructure across the Mediterranean basin. Even as European leaders back Kyiv's defense, they are drawing clearer diplomatic boundaries around theaters outside Eastern Europe.\n\nThe Associated Press, Kyiv Independent, and United24 Media all reported Meloni's Brussels warning and linked it directly to the weekend sea-drone strike in Libya. AP additionally detailed Trump's parallel call for restraint, while Kyiv Independent noted Germany joining Italy in cautioning against geographical escalation.\n\nWhether Kyiv has formally agreed to restrict future maritime operations outside the Black Sea, and the full extent of damage sustained by the Russian vessel in Libya, have not been publicly confirmed.\nTrust label: Multi-source agreement — Wire service reporting and Ukrainian outlets independently confirm Meloni's summit remarks and the Libyan port incident context."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-162-meloni-warns-ukraine-war-mediterranean\",\"category\":\"international\",\"title\":{\"en\":\"Italy's Meloni Warns Against Expanding Russia-Ukraine War Into the Mediterranean\",\"zh-TW\":\"義大利總理梅洛尼警告俄烏戰爭絕不可擴大至地中海海域\"},\"summary\":{\"en\":\"Italian Premier Giorgia Meloni warned at an EU summit in Brussels on November 26 that the Russia-Ukraine war must not spread to the Mediterranean, following a Ukrainian sea-drone strike on a Russian naval vessel docked in Libya. Germany and U.S. President Donald Trump also urged both sides to avoid actions that widen the conflict.\",\"zh-TW\":\"在烏克蘭上週末出動海上無人機襲擊停靠利比亞港口的俄國軍艦後，義大利總理梅洛尼（Giorgia Meloni）11 月 26 日於布魯塞爾歐盟峰會明確警告，俄烏戰爭「不應該也絕不能擴大至地中海」。德國與美國總統川普亦相繼發聲，呼籲交戰雙方避免任何導致戰火外溢的行動，顯示歐洲盟國對衝突地理擴散的高度戒心。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n義大利總理梅洛尼（Giorgia Meloni）於 2026 年 11 月 26 日出席布魯塞爾歐盟峰會時表示，義大利雖持續支持烏克蘭抵抗俄羅斯，但這場戰爭「不應該也絕不能擴大至地中海」。此番表態源於烏軍上週末出動海上無人機，襲擊一艘停靠在利比亞港口的俄國海軍艦艇；德國官員隨後也對衝突地理範圍擴大表達謹慎態度，美國總統川普（Donald Trump）亦發文呼籲俄烏雙方避免任何有意或無意擴大戰事的舉動。\\n\\n「為什麼重要」\\n這項公開警告反映出南歐北約成員國的深層憂慮：一旦遠程海上無人機作戰延伸至地中海，恐直接威脅區域航運安全與海底能源管線。歐洲盟國在持續援烏的同時，正試圖為戰事劃出明確的地理紅線，防止衝突外溢至東歐以外的海域。\\n\\n「來源異同」\\n美聯社（Associated Press）、《基輔獨立報》（Kyiv Independent）與 United24 Media 均一致報導梅洛尼在布魯塞爾的發言及利比亞港口遇襲背景。美聯社補充引述川普呼籲雙方克制的貼文，《基輔獨立報》則點出德國同樣表態反對戰爭地理範圍擴大。\\n\\n「仍不確定」\\n烏克蘭政府是否已私下承諾限制未來在黑海以外海域的遠程行動，以及該艘停泊利比亞的俄國軍艦具體受損程度，目前仍未獲官方公開證實。\\nTrust label: Multi-source agreement — 國際通訊社與烏克蘭媒體均已核實梅洛尼的峰會發言及相關背景。\"},\"glossary\":[{\"term\":{\"en\":\"Sea Drones (USVs)\",\"zh-TW\":\"無人水面載具（海上無人機）\"},\"blurb\":{\"en\":\"Uncrewed surface vessels remotely piloted or autonomous, used by Ukraine for long-range maritime reconnaissance and strikes.\",\"zh-TW\":\"由遠端遙控或自主導航的無人水面船艇，烏克蘭廣泛用於遠程海上偵察與打擊任務。\"}},{\"term\":{\"en\":\"European Council\",\"zh-TW\":\"歐盟高峰會（歐洲理事會）\"},\"blurb\":{\"en\":\"The EU institution comprising heads of state or government of member states that sets the bloc's political and security priorities.\",\"zh-TW\":\"由歐盟各成員國國家元首或政府首腦組成的最高政治決策機構，負責制定歐盟外交與安全方針。\"}},{\"term\":{\"en\":\"Horizontal Escalation\",\"zh-TW\":\"水平升級（地理外溢）\"},\"blurb\":{\"en\":\"The expansion of an armed conflict into new geographic regions or theaters beyond the original combat zone.\",\"zh-TW\":\"武裝衝突突破原有交戰區域，向新的地理板塊或海域擴散的戰略態勢。\"}}],\"sources\":[{\"name\":\"Associated Press\",\"url\":\"https://apnews.com/article/russia-ukraine-war-zelenskyy-po
