ang (楊啟芳), reporting from Seoul on November 25, says the government formed the Exam Fairness Restoration Task Force to draw up concrete measures, including embedding prompt instructions and watermarks in exam papers. TechNews carries the same account: the task force follows the tax accountant exam cheating case and multiple violations in the College Scholastic Ability Test, and it is weighing the same countermeasures.\n\nWhy it matters\nExam integrity is the foundation of the credentials themselves. If AI tools can answer exam questions undetected, the qualification stops meaning what it claims to mean, and every honest candidate pays for it. Seoul is treating this as a system-wide fix rather than punishment for one exam, which is why a dedicated task force — and technical measures built into the papers — is the response.\n\nSources agree / disagree\nThe two outlets agree on the core facts: the task force, the two cheating triggers and the proposed measures all match. No genuine numeric conflict appears in the available snippets, and the two headlines are near-identical. Both reports trace to the same November 25 development.\n\nStill uncertain\nNo timetable appears in the feed text, and neither does the scope: which exams will get the new measures first, how prompt traps and watermarks would work in practice, what penalties cheaters face, or when the task force will report. The plan is announced, not yet detailed.\n\nTrust label: Two-source agreement — two outlets report the same task force, triggers and measures with matching headlines and no substantive conflict."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-02-ai-h78e23475\",\"category\":\"semiconductor\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-semiconductor-02-ai-h78e23475.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 韓國防堵 AI 作弊，擬試卷中嵌入提示指令及浮水印\",\"zh-TW\":\"相關封面圖：韓國防堵 AI 作弊，擬試卷中嵌入提示指令及浮水印\"},\"publishedAt\":\"2026-11-25T09:30:58.000Z\",\"title\":{\"en\":\"South Korea Plans Prompt Traps and Watermarks in Exam Papers to Stop AI Cheating\",\"zh-TW\":\"韓國擬在試卷嵌入提示指令與浮水印防堵 AI 作弊\"},\"summary\":{\"en\":\"South Korea has set up an exam-fairness task force after AI cheating on the tax accountant qualification exam and violations in the university entrance exam, CNA and TechNews report. The panel is weighing measures including embedded prompt instructions and watermarks in exam papers. No timetable or enforcement detail appears in the feed text, so the plan's scope remains unclear.\",\"zh-TW\":\"韓國在稅務師資格考爆發 AI 作弊、大學修學能力試驗多起違規後成立「恢復考試公平性專案小組」，中央社（CNA）與科技新報（TechNews）報導，研擬在試卷嵌入提示指令與浮水印等措施。摘要未提時程與執行細節，方案範圍仍不明朗。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"韓國在稅務師資格考爆發 AI 作弊、大學修學能力試驗多起違規後，成立「恢復考試公平性專案小組」，中央社（CNA）與科技新報（TechNews）報導。\\n\\n發生了什麼事\\n中央社記者楊啟芳 11 月 25 日自首爾發稿指出，韓國政府成立專案小組研擬具體措施，包括在試卷中嵌入提示指令與浮水印。科技新報刊出相同說法：小組源於稅務師資格考作弊案與大學修學能力試驗的多起違規，研擬的防堵手段一致。\\n\\n為什麼重要\\n考試公正性是證書本身的根基。AI 工具若能不被察覺地代答考題，資格認證就失去原有的意義，誠實應考者反而受害。首爾把這件事當成制度問題處理，而非單一考試的懲處，才會成立專責小組，並從試卷本身著手防堵。\\n\\n來源異同\\n兩家媒體核心事實一致：專案小組、兩起作弊觸發事件與研擬措施都吻合，標題幾乎相同。現有摘要中沒有真正的數字衝突，兩則報導都指向 11 月 25 日的同一進展。\\n\\n仍不確定\\n摘要未提時程與範圍：哪些考試先適用新措施、提示指令陷阱與浮水印實際如何運作、作弊者面臨什麼處分、專案小組何時提出方案，都還沒有說法。計畫已經宣布，細節尚未公布。\\n\\n信任標籤：雙來源一致——兩家媒體報導同一專案小組、觸發事件與措施，標題幾乎相同且無實質衝突。\"},\"sources\":[{\"name\":\"TechNews 科技新報\",\"url\":\"https://technews.tw/2026/11/25/south-korea-ai-cheating-prevention-embed-prompts-watermarks-exams/\"},{\"name\":\"中央社-國際\",\"url\":\"https://www.cna.com.tw/news/aopl/202611250216.aspx\"}],\"disagreements\":{\"en\":\"Figures differ across outlets (e.g. 8230 vs 25 in headlines/snippets).\",\"zh-TW\":\"不同媒體的數字有所不同（例如，標題/摘要中的數字為 8230 與 25）。\"},\"trustScore\":64,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":19,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"semiconductor\",\"live-ingest\",\"technews-科技新報\",\"中央社-國際\"],\"glossary\":[{\"term\":{\"en\":\"Exam Fairness Restoration Task Force\",\"zh-TW\":\"恢復考試公平性專案小組（Exam Fairness Restoration Task Force）\"},\"blurb\":{\"en\":\"The South Korean government panel set up to stop AI cheating in exams.\",\"zh-TW\":\"韓國政府為防堵考試 AI 作弊而成立的專案小組。\"}},{\"term\":{\"en\":\"College Scholastic Ability Test\",\"zh-TW\":\"大學修學能力試驗（College Scholastic Ability Test）\"},\"blurb\":{\"en\":\"South Korea's national university entrance exam.\",\"zh-TW\":\"韓國的全國大學入學考試。\"}},{\"term\":{\"en\":\"CNA\",\"zh-TW\":\"中央社（CNA）\"},\"blurb\":{\"en\":\"Taiwan's national news agency, which reported the story from Seoul.\",\"zh-TW\":\"自首爾發稿報導此事的台灣國家通訊社。\"}},{\"term\":{\"en\":\"TechNews\",\"zh-TW\":\"科技新報（TechNews）\"},\"blurb\":{\"en\":\"A Taiwanese technology news outlet that carried the same report.\",\"zh-TW\":\"刊載同一報導的台灣科技新聞媒體。\"}},{\"term\":{\"en\":\"Yang Qifang\",\"zh-TW\":\"楊啟芳（Yang Qifang）\"},\"blurb\":{\"en\":\"The CNA correspondent who reported the story from Seoul.\",\"zh-TW\":\"自首爾發稿的中央社記者。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-semiconductor-02-ai-h78e23475/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-semiconductor-02-ai-h78e23475/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:c
