 as a concept. The collaboration is framed as a cooking experiment built around water, and two of its creative dishes will reappear on WOK by O'BOND's latest seasonal menu, so the experiment outlives the one-off set. Why it matters The verdict is that this is a branding move with a real menu behind it: the water brands get to present themselves as ingredients rather than accompaniments, and the restaurant gets a concept that turns its tasting menu into a talking point. For diners, the practical payoff is concrete — two of the experimental dishes survive into the regular seasonal menu, which is the part of the collaboration they can actually book and taste. Sources agree / disagree The only source is a single Vogue Taiwan item, so nothing here is corroborated elsewhere. The feed also gives the theme as 'EP. ? Water Cycle,' with the episode number missing — the set is real, but its numbered installment is not stated. Trust label: Single source — one Vogue Taiwan item only; treat the details as unconfirmed. Still uncertain The feed snippet names no prices, dates, or the two dishes themselves, and it does not say how long the themed set runs or whether it is a limited engagement. Check the Vogue Taiwan article or the restaurant before booking."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-beauty-02-wok-by-o-bond\",\"category\":\"beauty\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-beauty-02-wok-by-o-bond.jpg\",\"imageAlt\":{\"en\":\"Cover related to: S.Pellegrino and Acqua Panna put water on the menu at WOK by O'BOND\",\"zh-TW\":\"相關封面圖：聖沛黎洛攜手 WOK by O'BOND 以「水」入菜推主題套餐\"},\"publishedAt\":\"2026-11-08T16:23:08.000Z\",\"title\":{\"en\":\"S.Pellegrino and Acqua Panna Put Water on the Menu at WOK by O'BOND\",\"zh-TW\":\"聖沛黎洛（S.Pellegrino）攜手米其林一星 WOK by O'BOND，以「水」入菜推主題套餐\"},\"summary\":{\"en\":\"［未證實·單一來源］S.Pellegrino and Acqua Panna have teamed up with Michelin one-star restaurant WOK by O'BOND on a 'Water Cycle' tasting menu that treats water as the main ingredient, not a side note. Two dishes from the set will return on the restaurant's new-season menu.\",\"zh-TW\":\"［未證實·單一來源］頂級佐餐水聖沛黎洛（S.Pellegrino）與普娜（Acqua Panna），與米其林一星創意料理 WOK by O'BOND 合作推出「水循環」主題套餐，把水扶正當主角，從實際用法與抽象概念探索水在精緻料理中的多樣可能；其中兩道菜色將重現於餐廳最新一季菜單。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"精緻餐飲的佐餐水要走出配角位置了：聖沛黎洛（S.Pellegrino）與普娜（Acqua Panna）攜手米其林一星創意料理 WOK by O'BOND，推出「水循環」主題套餐，把水當成料理的主題，而不只是佐餐的配角；其中兩道菜色將沿用至餐廳最新一季菜單。\\n發生了什麼事\\n長期深耕精緻餐飲的兩款頂級佐餐水——聖沛黎洛與普娜——與 WOK by O'BOND 合作推出「水循環」主題套餐，從兩個角度探索水在精緻料理中的可能：實際使用方式，以及水作為抽象概念可以承載的意涵。這是一場以水為題的料理實驗，主題套餐中的兩道創作菜色也將重現於 WOK by O'BOND 最新一季的菜單上，讓實驗不只停留在一次性套餐。\\n為什麼重要\\n結論是，這是一次有實質菜單支撐的品牌合作：水品牌得以把自己呈現為食材而非配角，餐廳則得到一個能讓品嚐菜單成為話題的概念。對食客來說，實際收穫很具體——兩道實驗菜色會進入常規的新季菜單，這才是合作中真正可以訂位品嚐的部分。\\n來源異同\\n唯一來源是 Vogue Taiwan 的單一報導，沒有其他來源佐證。摘要中主題寫為「EP. ? 水循環」，集數編號缺失——套餐本身屬實，但第幾集並未說明。信任標籤：單一來源——僅有一則 Vogue Taiwan 報導，細節未經證實。\\n仍不確定\\n摘要未提供價格、日期或兩道菜色的名稱，也未說明主題套餐供應多久、是否為期間限定。訂位前請查閱 Vogue Taiwan 原文或餐廳公告。\"},\"sources\":[{\"name\":\"Vogue Taiwan\",\"url\":\"https://www.vogue.com.tw/article/spellegrino-wok-by-obond\"}],\"disagreements\":null,\"trustScore\":47,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":10,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"beauty\",\"live-ingest\",\"vogue-taiwan\"],\"glossary\":[{\"term\":{\"en\":\"S.Pellegrino\",\"zh-TW\":\"聖沛黎洛\"},\"blurb\":{\"en\":\"Italian premium sparkling table water, co-sponsor of the themed menu.\",\"zh-TW\":\"義大利頂級氣泡佐餐水，主題套餐的合作品牌之一。\"}},{\"term\":{\"en\":\"Acqua Panna\",\"zh-TW\":\"普娜\"},\"blurb\":{\"en\":\"Italian premium still table water, co-sponsor of the themed menu.\",\"zh-TW\":\"義大利頂級天然礦泉水，主題套餐的合作品牌之一。\"}},{\"term\":{\"en\":\"WOK by O'BOND\",\"zh-TW\":\"WOK by O'BOND\"},\"blurb\":{\"en\":\"Michelin one-star creative restaurant behind the 'Water Cycle' menu.\",\"zh-TW\":\"推出「水循環」主題套餐的米其林一星創意料理餐廳。\"}},{\"term\":{\"en\":\"Vogue Taiwan\",\"zh-TW\":\"Vogue Taiwan\"},\"blurb\":{\"en\":\"Taiwan ed
