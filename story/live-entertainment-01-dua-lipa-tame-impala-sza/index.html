ts headliners set the tone for fan expectations and ticket demand. Dua Lipa topping the bill as the first female British headliner gives this edition a milestone beyond the lineup itself. The announcement also sets the commercial calendar for the year, with presale windows and travel planning now following the lineup reveal.\nSources agree / disagree\nRolling Stone and BBC Entertainment agree on the three headliners, with the BBC adding the significance of Dua Lipa's first as a female British headliner. Trust label: Two-source agreement — two outlets align on the headliners.\nStill uncertain\nFeed snippets capture headlines and short descriptions, not the full articles. Performance dates, stage assignments and ticket details still await the full schedule from the organizers."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-entertainment-01-dua-lipa-tame-impala-sza\",\"category\":\"entertainment\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-entertainment-01-dua-lipa-tame-impala-sza.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Dua Lipa, Tame Impala and SZA to Headline Coachella 2027\",\"zh-TW\":\"相關封面圖：杜阿·利帕等領銜2027年科切拉音樂節\"},\"publishedAt\":\"2026-11-11T10:53:47.000Z\",\"title\":{\"en\":\"Dua Lipa, Tame Impala and SZA to Headline Coachella 2027\",\"zh-TW\":\"杜阿·利帕等領銜2027年科切拉音樂節\"},\"summary\":{\"en\":\"Dua Lipa, Tame Impala and SZA will headline Coachella 2027, the Southern California festival running over two weekends in April. Madonna, Phoebe Bridgers, Daddy Yankee, Don Toliver and Diljit Dosanjh are also on the bill. The BBC notes Dua Lipa will be the festival's first female British headliner; watch for ticket sales and the full schedule.\",\"zh-TW\":\"2027年科切拉音樂節頭條陣容出爐：杜阿·利帕、Tame Impala 與 SZA 領銜，4月連續兩個週末在南加州登場，同台還有瑪丹娜等人。BBC 指出，杜阿·利帕將成為科切拉首位英國女性頭條歌手。接下來要看門票開賣反應與完整演出時間表。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"2027年科切拉音樂節頭條陣容出爐：杜阿·利帕、Tame Impala 與 SZA 領銜，4月連續兩個週末在南加州登場。\\n發生了什麼事\\n《滾石》報導，杜阿·利帕、Tame Impala 與 SZA 將擔任2027年科切拉音樂節的頭條歌手。同台陣容還包括瑪丹娜、菲比·布里傑斯、洋基老爹、唐·托利弗與迪爾吉特·多薩尼，音樂節將在4月連續兩個週末舉行。BBC 指出，杜阿·利帕將成為科切拉首位英國女性頭條歌手。\\n為什麼重要\\n科切拉是全球矚目的音樂節指標，頭條人選向來牽動樂迷期待與票房。杜阿·利帕以英國女性歌手之姿登上頭條，更為這屆陣容寫下新紀錄。\\n來源異同\\n《滾石》與 BBC 娛樂對頭條三組藝人的說法一致，BBC 另補充杜阿·利帕首位英國女性頭條歌手的意義。信任標籤：雙源一致——兩家媒體對頭條陣容的報導一致。\\n仍不確定\\n來源摘要只呈現標題與簡短描述，並非全文。各組藝人的演出日期、舞台分配與門票資訊，仍待主辦方公布完整時間表。\"},\"sources\":[{\"name\":\"Rolling Stone Music\",\"url\":\"https://www.rollingstone.com/music/music-news/dua-lipa-tame-impala-sza-headline-coachella-2027-1235630556/\"},{\"name\":\"BBC Entertainment\",\"url\":\"https://www.bbc.co.uk/news/articles/cjr4g0n9d1g5o?at_medium=RSS\u0026at_campaign=rss\"}],\"disagreements\":null,\"trustScore\":68,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":15,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"entertainment\",\"live-ingest\",\"rolling-stone-music\",\"bbc-entertainment\"],\"glossary\":[{\"blurb\":{\"en\":\"British singer headlining Coachella 2027, the festival's first female British headliner.\",\"zh-TW\":\"英國歌手，2027年科切拉音樂節頭條歌手，首位英國女性頭條歌手。\"},\"term\":{\"en\":\"Dua Lipa\",\"zh-TW\":\"杜阿·利帕\"}},{\"blurb\":{\"en\":\"Australian music project headlining Coachella 2027.\",\"zh-TW\":\"澳洲音樂企劃，2027年科切拉音樂節頭條歌手之一。\"},\"term\":{\"en\":\"Tame Impala\",\"zh-TW\":\"Tame Impala\"}},{\"blurb\":{\"en\":\"American singer headlining Coachella 2027.\",\"zh-TW\":\"美國歌手，2027年科切拉音樂節頭條歌手之一。\"},\"term\":{\"en\":\"SZA\",\"zh-TW\":\"SZA\"}},{\"blurb\":{\"en\":\"Major Southern California music festival held over two weekends in April.\",\"zh-TW\":\"美國南加州大型音樂節，4月連續兩個週末舉行。\"},\"term\":{\"en\":\"Coachella\",\"zh-TW\":\"科切拉音樂節\"}},{\"blurb\":{\"en\":\"American pop star also on the Coachella 2027 bill.\",\"zh-TW\":\"美國流行歌手，同屆科切拉音樂節演出陣容之一。\"},\"term\":{\"en\":\"Madonna\",\"zh-TW\":\"瑪丹娜\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-sc
