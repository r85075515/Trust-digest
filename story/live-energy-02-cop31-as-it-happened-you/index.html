me court declared the state's decision to award three permits for oil and gas fields in the North Sea invalid, ruling that it had not accounted for the harm caused by burning the fuels.\n\nWhy it matters\nThe speech was Guterres's final address to a climate summit as Secretary-General, framing climate action as central to every aspect of the UN's work rather than a separate agenda. The Norwegian court ruling adds legal weight to the same argument, tying fossil fuel permits to the harm from burning them.\n\nSources agree and disagree\nBoth feed items come from the same outlet, The Guardian, so the account has no independent corroboration in this batch. The two items cover the same speech from different angles.\n\nStill uncertain\nThe feed descriptions do not report what the continuing talks concluded, which leaders remained, or the practical effect of the Norwegian ruling on the three permits.\n\nTrust label: Single source — both items come from The Guardian, so the account awaits corroboration from other outlets."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-energy-02-cop31-as-it-happened-you\",\"category\":\"energy\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-energy-02-cop31-as-it-happened-you.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Cop31 as it happened: ‘You cannot build peace on a burning planet’, warns UN chief Guterres in final climate summit speech\",\"zh-TW\":\"相關封面圖：第三十一屆締約方會議實際情況：聯合國秘書長古特雷斯在氣候峰會最後講話中警告說，“你無法在一個燃燒的星球上建設和平”\"},\"publishedAt\":\"2026-11-13T17:00:14.000Z\",\"title\":{\"en\":\"António Guterres Tells COP31: 'You Cannot Build Peace on a Burning Planet'\",\"zh-TW\":\"安東尼奧·古特雷斯（António Guterres）在第31屆聯合國氣候變化大會（COP31）告別演說：無法在燃燒的星球上建立和平\"},\"summary\":{\"en\":\"Outgoing UN Secretary-General António Guterres told the COP31 climate summit in an emotional farewell address that tackling the climate crisis is central to all human life and must lead global governance. As leaders departed, talks continued on climate science, fossil fuels, electrification and finance.\",\"zh-TW\":\"即將卸任的聯合國秘書長安東尼奧·古特雷斯（António Guterres）在第31屆聯合國氣候變化大會（COP31）發表感人的告別演說，強調應對氣候危機是人類生活的核心，必須居於全球治理的首位。各國領袖離場後，圍繞氣候科學、淘汰化石燃料、電氣化與氣候融資的談判仍在繼續。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"發生了什麼事\\n即將卸任的聯合國秘書長安東尼奧·古特雷斯（António Guterres）在第31屆聯合國氣候變化大會（COP31）發表告別演說，警告「無法在燃燒的星球上建立和平」，並表示應對氣候危機是人類生活的核心，必須居於全球治理的首位。各國領袖離場後，談判仍在繼續，氣候科學、淘汰化石燃料、電氣化與氣候融資的辯論即將全面展開。會場之外，挪威最高法院裁定政府核發北海三座油氣田許可的決定無效，理由是未考量燃燒這些燃料造成的危害。\\n為什麼重要\\n這是安東尼奧·古特雷斯（António Guterres）以秘書長身分在氣候峰會的最後一次演說，將氣候行動定位為聯合國各項工作的核心，而非獨立議題。挪威法院的裁決也為同一論點提供了法律依據，將化石燃料許可與燃燒造成的危害直接連結。\\n來源異同\\n兩則內容均來自同一家媒體《衛報》（The Guardian），本批來源中沒有其他媒體獨立印證，兩則報導是從不同角度描述同一場演說。\\n仍不確定\\n摘要未說明後續談判得出什麼結論、哪些領袖留下，也未說明挪威裁決對三座油氣田許可的實際影響。\"},\"sources\":[{\"name\":\"The Guardian Climate Crisis\",\"url\":\"https://www.theguardian.com/environment/2026/nov/13/cop31-antonio-guterres-united-nations-climate-action\"}],\"disagreements\":null,\"trustScore\":59,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"energy\",\"live-ingest\",\"the-guardian-climate-crisis\",\"the-guardian-climate-crisis\"],\"glossary\":[{\"blurb\":{\"en\":\"The 31st session of the United Nations climate change conference.\",\"zh-TW\":\"聯合國每年舉行的氣候變化締約方大會第三十一屆會議。\"},\"term\":{\"en\":\"COP31\",\"zh-TW\":\"第31屆聯合國氣候變化大會\"}},{\"blurb\":{\"en\":\"Outgoing Secretary-General of the United Nations.\",\"zh-TW\":\"即將卸任的聯合國秘書長。\"},\"term\":{\"en\":\"António Guterres\",\"zh-TW\":\"安東尼奧·古特雷斯\"}},{\"blurb\":{\"en\":\"The international organisation whose climate work Guterres called central.\",\"zh-TW\":\"安東尼奧·古特雷斯（António Guterres）稱氣候行動為其工作核心的國際組織。\"},\"term\":{\"en\":\"United Nations\",\"zh-TW\":\"聯合國\"}},{\"blurb\":{\"en\":\"British news outlet that covered the summit live.\",\"zh-TW\":\"即時報導本次峰會的英國新聞媒體。\"},\"term\":{\"en\":\"The Guardian\",\"zh-TW\":\"衛報\"}},{\"blurb\":{\"en\":\"Norway's highest court, which invalidated three North Sea oil and gas permits.\",\"zh-TW\":\"裁定北海三座油氣田許可無效的挪威最高司法機關。\"},\"term\":{\"en\":\"Norway's supreme court\",\"zh-TW\":\"挪威最高法院\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-energy-02-cop31-as-it-happened-you/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-energy-02-cop31-as-it-happened-you/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"d:\"$8:metadata\"\n"])</script></body></html>
