e parts of the compute budget, screen experiments, and execute runs for next-generation Gemini models without item-by-item human approval. To support safety oversight, training does not reward agents' internal chain-of-thought reasoning so action intent stays in unvarnished natural language for pre-action review by researchers. He also noted that full recursive self-improvement remains far off, that DeepMind has shifted toward a single general algorithm across science and products rather than separate teams for projects like AlphaFold or fusion, and that each Gemini generation uses a bespoke one-off architecture.\n\nWhy it matters: Letting AI agents manage compute allocation and experiment execution speeds up model iteration while raising new oversight requirements for automated research pipelines.\n\nSource differences: Both items belong to the same reporting chain around the podcast remarks, with Product Watch serving as a follow-up summary. The Decoder carries the exact title 「AI agents now control part of Deepmind's compute for Gemini experiments, but recursive self-improvement remains distant」, while Product Watch carries the exact title 「AI Agents Now Control Part of DeepMind's Compute for Gemini Experiments, but Recursive Self-Improvement Remains Distant」.\n\nStill uncertain: The exact share of total compute resources controlled by AI agents was not disclosed.\n\nTrust label: Single source — both listed outlets cover the same podcast remarks in a single reporting chain."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-ai-467-deepmind-ai-agents-gemini-compute\",\"category\":\"ai\",\"title\":{\"en\":\"Google DeepMind VP Says AI Agents Control Some Compute for Next-Gen Gemini Experiments\",\"zh-TW\":\"Google DeepMind 研究副總裁透露 AI 代理人已掌部分運算資源執行下一代 Gemini 實驗\"},\"summary\":{\"en\":\"Google DeepMind VP Koray Kavukcuoglu said on a November 25, 2026 company podcast that AI agents now allocate some compute and run next-generation Gemini experiments without item-by-item human approval. Key takeaway: agentic automation is entering frontier model experimentation while full recursive self-improvement remains distant.\",\"zh-TW\":\"Google DeepMind 研究副總裁卡武克丘奧盧（Koray Kavukcuoglu）於 2026 年 11 月 25 日公司 Podcast 透露，AI 代理人已可自行分配部分運算預算並篩選執行下一代 Gemini 實驗。關鍵結論：AI 代理人已參與前沿模型實驗流程，但完全遞迴自我改進仍遙遠。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」帶領 Gemini 開發的研究副總裁卡武克丘奧盧（Koray Kavukcuoglu）於 2026 年 11 月 25 日公司 Podcast 透露，AI 代理人已能自行決定部分運算預算分配，並篩選、執行下一代 Gemini 實驗，無須人類逐項核准。安全設計上，訓練過程不對代理人的內部思維鏈給予獎勵，讓行動意圖維持未經修飾的自然語言以供研究人員事前審查；他也指出距離完全遞迴自我改進仍很遙遠，且 DeepMind 已改以單一通用演算法服務科學與產品，不再為 AlphaFold 或核融合等專案維持獨立編制，每代 Gemini 皆為手工打造的一次性架構。\\n\\n「為什麼重要」讓 AI 代理人參與運算調度與實驗執行可加快模型研發節奏，同時考驗研究團隊對自動化實驗的安全審查機制。\\n\\n「來源異同」兩篇報導同屬同一 Podcast 發言的報導鏈，其中 Product Watch 為後續彙整。The Decoder 頁面實際標題逐字為「AI agents now control part of Deepmind's compute for Gemini experiments, but recursive self-improvement remains distant」，Product Watch 頁面實際標題逐字為「AI Agents Now Control Part of DeepMind's Compute for Gemini Experiments, but Recursive Self-Improvement Remains Distant」。\\n\\n「仍不確定」AI 代理人目前掌控的運算資源具體占比尚未量化揭露。\\n\\nTrust label: Single source — 所列兩個來源皆屬同一 Podcast 發言報導鏈。\"},\"glossary\":[{\"term\":{\"en\":\"AI agent\",\"zh-TW\":\"AI 代理人\"},\"blurb\":{\"en\":\"A software system that selects actions and executes tasks autonomously toward a goal.\",\"zh-TW\":\"能依目標自主選擇行動並執行任務的 AI 系統。\"}},{\"term\":{\"en\":\"Recursive self-improvement\",\"zh-TW\":\"遞迴自我改進\"},\"blurb\":{\"en\":\"A loop in which an AI system repeatedly upgrades its own capabilities across generations.\",\"zh-TW\":\"AI 系統持續迭代並提升自身能力與架構的循環過程。\"}},{\"term\":{\"en\":\"Chain-of-thought\",\"zh-TW\":\"思維鏈\"},\"blurb\":{\"en\":\"Intermediate reasoning steps generated before a model reaches a final output or action.\",\"zh-TW\":\"模型在產出最終結果或行動前生成的推論中間步驟。\"}}],\"sources\":[{\"name\":\"The Decoder\",\"url\":\"https://the-decoder.com/ai-agents-now-control-part-of-deepminds-compute-for-gemini-experiments-but-recursive-s
