oting generals, at which Huang — recognized for her deep work in publicity, psychological warfare and news, and especially praised for her civil-affairs work — was promoted to major general and appointed political warfare director of the Matsu Defense Command. She becomes the 14th woman general in the defense ministry's public record, and the number of active-duty women major generals rises to five.\nWhy it matters\nThe judgment is about representation with substance: a public-affairs officer reaching general rank through communications and civil-affairs work, not combat command, shows the military valuing the information domain as a career path. For readers, the number to remember is five — the count of active-duty women major generals, now one higher.\nSources agree / disagree\nOnly the Central News Agency is reporting this in the snippets; no second outlet corroborates the ceremony details. Trust label: Single source — one outlet, unconfirmed by others.\nStill uncertain\nThe snippets do not say when Huang takes up the Matsu post, or who succeeds her at Army public affairs. Those details require the full reporting on the linked publisher page."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-03-5\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-taiwan-03-5.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 黃美慧晉任少將接馬防部政戰主任　現役女將軍增至5人\",\"zh-TW\":\"相關封面圖：黃美慧晉任少將接馬防部政戰主任　現役女將軍增至5人\"},\"publishedAt\":\"2026-11-25T04:33:03.000Z\",\"title\":{\"en\":\"Huang Mei-hui Promoted to Major General, Takes Matsu Political Warfare Post\",\"zh-TW\":\"黃美慧晉任少將接馬防部政戰主任　現役女將軍增至 5 人\"},\"summary\":{\"en\":\"[Unconfirmed · single source] Colonel Huang Mei-hui, head of the Army Command's public affairs section, has been promoted to major general and will take over as political warfare director of the Matsu Defense Command, President Lai Ching-te announced at today's promotion ceremony. She becomes the 14th woman general in the defense ministry's public record.\",\"zh-TW\":\"［未證實·單一來源］陸軍司令部公共事務組長黃美慧上校晉任少將，並接任馬防部政戰主任；總統賴清德今天在晉任授階典禮上宣布。她成為國防部公開紀錄中的第 14 名女將軍，現役女少將增至 5 人。這次晉任肯定她在文宣心戰、新聞與民事工作上的深耕。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"陸軍司令部公共事務組長黃美慧上校晉任少將，並接任馬防部政戰主任；總統賴清德今天主持將官晉任授階典禮時宣布。\\n發生了什麼事\\n賴清德總統今天主持將官晉任授階典禮；黃美慧因深耕文宣心戰、新聞等工作，尤其在民事工作上備受肯定，晉任少將並接任馬防部政戰主任。她成為國防部公開紀錄中的第 14 名女將軍，現役女少將增至 5 人。\\n為什麼重要\\n結論關乎有實質內涵的代表性：一位公共事務軍官憑藉文宣與民事工作晉升將官，而非作戰指揮，顯示軍方把資訊領域視為一條職涯路徑。對讀者來說，要記住的數字是 5——現役女少將人數，又多了一位。\\n來源異同\\n片段中只有中央社報導此事，沒有第二家媒體佐證典禮細節。信任標籤：僅1源——單一來源、未經他家證實。\\n仍不確定\\n片段未說明黃美慧何時到任馬防部、陸軍公共事務組長由誰接任，須看完整報導才能確認。\"},\"sources\":[{\"name\":\"中央社-政治\",\"url\":\"https://www.cna.com.tw/news/aipl/202611250113.aspx\"}],\"disagreements\":null,\"trustScore\":59,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"中央社-政治\"],\"glossary\":[{\"term\":{\"en\":\"Huang Mei-hui\",\"zh-TW\":\"黃美慧\"},\"blurb\":{\"en\":\"Newly promoted major general, Matsu political warfare director.\",\"zh-TW\":\"新晉少將、馬防部政戰主任。\"}},{\"term\":{\"en\":\"Lai Ching-te\",\"zh-TW\":\"賴清德\"},\"blurb\":{\"en\":\"President of Taiwan who presided over the ceremony.\",\"zh-TW\":\"主持晉任典禮的總統。\"}},{\"term\":{\"en\":\"Matsu Defense Command\",\"zh-TW\":\"馬防部\"},\"blurb\":{\"en\":\"Defense command for the Matsu islands where Huang takes her post.\",\"zh-TW\":\"黃美慧接任政戰主任的馬祖防衛指揮部。\"}},{\"term\":{\"en\":\"Central News Agency\",\"zh-TW\":\"中央社\"},\"blurb\":{\"en\":\"Taiwan news agency that reported the promotion.\",\"zh-TW\":\"報導晉任的台灣通訊社。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\
