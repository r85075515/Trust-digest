nt at different moments. The centre presents the show as a photographic survey, not a garment retrospective.\n\nSources agree / disagree\nThis card rests on a single Vogue Taiwan report, so there is no second outlet in the material to confirm or challenge the account. No conflicting dates or details appear in the available text.\n\nStill uncertain\nThe material does not give the exhibition dates, venue details beyond the centre, the photographers or works included, or ticket information. Those practical details remain to be confirmed from the centre's own announcement.\n\nTrust label: Single source"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-beauty-01-h7c92e7b5\",\"category\":\"beauty\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-beauty-01-h7c92e7b5.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 國家攝影文化中心新展《時尚流聲：穿在身上的語言》：從攝影梳理台灣時尚影像\",\"zh-TW\":\"相關封面圖：國家攝影文化中心新展《時尚流聲：穿在身上的語言》：從攝影梳理台灣時尚影像\"},\"publishedAt\":\"2026-11-03T07:06:21.000Z\",\"title\":{\"en\":\"National Center of Photography and Images opens Fashion in Flux exhibition\",\"zh-TW\":\"國家攝影文化中心新展《時尚流聲：穿在身上的語言》梳理台灣時尚影像\"},\"summary\":{\"en\":\"[Unconfirmed · Single source] Taiwan's National Center of Photography and Images has opened 'Fashion in Flux: Language Worn on the Body', tracing Taiwan's fashion imagery through photography. The show frames clothing as a language, and visitors can see how photographers shaped the island's fashion history.\",\"zh-TW\":\"［未證實·單一來源］國家攝影文化中心推出新展《時尚流聲：穿在身上的語言》，從攝影角度梳理台灣時尚影像。這場展覽把服裝當成語言，接下來看觀眾如何透過攝影師的鏡頭認識台灣時尚史。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"國家攝影文化中心推出新展《時尚流聲：穿在身上的語言》，從攝影與時尚交會的角度梳理台灣時尚影像。這場展覽把服裝當成語言，把攝影當成記錄這種語言變化的載體。\\n\\n發生了什麼事\\n根據《台灣版 VOGUE》（Vogue Taiwan）報導，這場展覽從攝影與時尚的交會切入，透過照片來梳理台灣時尚影像，呈現台灣時尚形象如何形成與改變。\\n\\n為什麼重要\\n時尚史常只透過服裝本身敘述，這場展覽主張照片本身就是故事的一部分。透過攝影師的鏡頭看時尚，觀眾能以不同方式理解台灣風格在不同時期的意義。\\n\\n來源異同\\n本卡只有《台灣版 VOGUE》（Vogue Taiwan）一則報導，材料中沒有第二家媒體可以佐證或質疑，現有文字也沒有日期或細節衝突。\\n\\n仍不確定\\n
