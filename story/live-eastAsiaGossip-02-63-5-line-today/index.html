e 63 event.\n\nWhat happened\nRuan, nominated again this year for his role in Kuangwang Jingtan (《狂忘警探》), told the audience he had spent years in the industry without truly deciding to devote himself to acting. Host Wen Tien-hsiang (聞天祥) reacted in disbelief, and fellow nominee Liu Kuan-ting (劉冠廷) teased Ruan after he lost his train of thought on stage, joking that he was still acting. Ruan linked the fear to his work on Chou Chu (《周處》), saying the role left him trapped in fear even after filming ended, and that he has only now let go of the fear and anxiety. He is up against Leon Dai (戴立忍) and Liu Kuan-ting in a Best Actor race the coverage frames as five very different performances of screen masculinity.\n\nWhy it matters\nThe confession reframes a veteran star as someone still wrestling with the craft after 24 years, and it hands the Golden Horse 63 race a human storyline beyond the trophies: whether the man who finally decided to be an actor can now win the prize again.\n\nSources agree / disagree\nETtoday, Yahoo News and LINE TODAY all report the same core quote — Ruan only decided last year to commit fully to acting — and the same on-stage moment with Wen and Liu. The raw feed flagged '63 vs 24' as differing figures, but they are not a conflict: 63 is the 63rd Golden Horse Awards and 24 is the length of Ruan's career. Trust label: Multi-source agreement — the outlets agree on the quote and the scene; the flagged numbers measure different things.\n\nStill uncertain\nThe snippets do not give Ruan's full remarks or say whether the jury buzz favours him over Dai or Liu. The bundled feed also mentions other Golden Horse news — Shuang Xi (《雙囍》) winning the audience choice award and The Girl (《女孩》) taking the FIPRESCI prize — without detail."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-eastAsiaGossip-02-63-5-line-today\",\"category\":\"eastAsiaGossip\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-eastAsiaGossip-02-63-5-line-today.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 金馬63／影帝之爭！阮經天力抗戴立忍、劉冠廷 5種男人的極限演技 | 緯來娛樂新聞 - LINE TODAY\",\"zh-TW\":\"相關封面圖：金馬63／影帝之爭！阮經天力抗戴立忍、劉冠廷 5種男人的極限演技 | 緯來娛樂新聞 - LINE TODAY\"},\"publishedAt\":\"2026-11-21T05:55:00.000Z\",\"title\":{\"en\":\"Ethan Ruan Says He Only Committed to Acting Last Year as Golden Horse 63 Best Actor Race Heats Up\",\"zh-TW\":\"阮經天（Ethan Ruan）自爆去年才決心全力當演員，金馬63影帝之爭開打\"},\"summary\":{\"en\":\"Golden Horse Best Actor winner Ethan Ruan, nominated again for Kuangwang Jingtan (《狂忘警探》), told a Golden Horse event he only fully committed to acting last year after a 24-year career. Host Wen Tien-hsiang (聞天祥) was stunned, and Liu Kuan-ting (劉冠廷) teased him for drifting off on stage. Takeaway: the veteran finally chose the craft — now he must win again.\",\"zh-TW\":\"金馬影帝阮經天（Ethan Ruan）——出道24年、已拿過一座金馬影帝，今年再憑《狂忘警探》問鼎——在金馬63活動現場自爆，直到去年才真正決心全力投入演員身分。主持人聞天祥當場驚呼，劉冠廷還虧他現場斷片「還在演」。takeaway：影帝也會怕，熬過恐懼才敢說自己是演員；典禮前看他能否再下一城。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"金馬影帝阮經天（Ethan Ruan）自爆，直到去年才真正決心全力投入演員身分——儘管他出道24年、早就拿過一座金馬影帝——一番話讓金馬63活動現場的主持人當場驚呼。\\n發生了什麼事\\n阮經天今年再憑《狂忘警探》問鼎影帝，在現場坦言闖蕩多年卻遲遲沒有下定決心當演員。主持人聞天祥聽了不敢相信，同場的劉冠廷還虧他現場突然斷片「還在演」。阮經天說，演完《周處》後仍陷在恐懼心魔裡，如今才終於放下恐懼與焦慮。本屆影帝之爭中，他要力抗戴立忍與劉冠廷，報導形容這是五種男人演技的對決。\\n為什麼重要\\n這句自白把一位資深明星重新定調：演了24年，仍在跟表演這門手藝較勁。金馬63的影帝之爭也因此多了一條人味故事線——剛下定決心當演員的人，能不能再拿一座影帝。\\n來源異同\\nETtoday、Yahoo 新聞、LINE TODAY 報導的核心引言一致，現場互動也一致。原始摘要曾標示「63 對 24」數字不一，但兩者並不衝突：63 是第 63 屆金馬獎，24 是阮經天出道年數。信任標籤：N源一致——多家媒體對引言與現場經過報導一致，數字差異是不同事物。同批另有《雙囍》獲觀眾票選最佳影片、《女孩》獲費比西獎的消息。\\n仍不確定\\n摘要未提供阮經天的完整發言，也看不出評審風向是否看好他勝過戴立忍或劉冠廷。得獎結果以典禮公布為準。\"},\"sources\":[{\"name\":\"ETtoday 影劇\",\"url\":\"https://star.ettoday.net/news/3276026\"},{\"name\":\"Google News TW Entertainment\",\"url\":\"https://news.google.com/rss/articles/CBMipwJBVV95cUxPY3UwcGJ2RkxWeXk3X3g5ZEhSZ3FJZ1dON2kzeXotVEdzNHVEc3pfYndEc0x4RnNmVnluM0RiVUhEMGVQLUlZeXB4Z0xwOWNwUFZHb2RwOGFZbHlhZmRfMlYxZWoyVk42Q1B5Szd6RmRERXBSYWZlSHpZaTJkR0JYb2o1WE1IS3lfbHJHQnZqRnNsUEtHTlplRnFYZ20w
