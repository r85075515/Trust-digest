iative to the opposition for the first time in this cycle: Netanyahu's future as prime minister now depends on whether Eisenkot can assemble a coalition, not on Netanyahu's own bloc.\nSources agree / disagree\nEight outlets and nine feed items agree on the core fact — Herzog tapped Eisenkot, not Netanyahu, to form a government. A small numeric difference appears across outlets, with figures of 27 and 28 in headlines and snippets, without explanation of what the numbers refer to.\nTrust label: Multi-source agreement — eight outlets confirm the same mandate, with only a minor unexplained numeric difference.\nStill uncertain\nWhat the 27 and 28 figures refer to is not stated in the summaries, and neither Eisenkot's deadline nor his prospective coalition partners appear in the feed text. The summaries restate headlines and short descriptions, not full articles."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-02-eisenkot-netanyahu-rival\",\"category\":\"international\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-international-02-eisenkot-netanyahu-rival.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Eisenkot, Netanyahu Rival and Opposition Leader, Tapped to Try to Form Government\",\"zh-TW\":\"相關封面圖：艾森科特，內塔尼亞胡的競爭對手和反對黨領袖，被任命嘗試組成政府\"},\"publishedAt\":\"2026-11-07T23:45:45.000Z\",\"title\":{\"en\":\"Eisenkot Tapped to Form Government After Inconclusive Israeli Election\",\"zh-TW\":\"艾森科特獲總統授命組閣，內塔尼亞胡失去先機\"},\"summary\":{\"en\":\"President Isaac Herzog has handed opposition leader Gadi Eisenkot the mandate to form a government after an inconclusive election in which neither his bloc nor Prime Minister Benjamin Netanyahu's won a majority. Israel's main parties have recommended Eisenkot, leaving Netanyahu's hold on power in doubt.\",\"zh-TW\":\"以色列總統赫爾佐格授權反對派領袖艾森科特嘗試組閣；上週大選兩大陣營皆未過半，主要政黨已建議由艾森科特組建新政府，內塔尼亞胡的總理地位面臨挑戰。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"以色列總統赫爾佐格（Isaac Herzog）授權反對派領袖艾森科特（Gadi Eisenkot）嘗試組閣；上週大選中，內塔尼亞胡（Benjamin Netanyahu）陣營與艾森科特陣營皆未取得多數。\\n發生了什麼事\\n艾森科特是前軍事首長，也是內塔尼亞胡的主要競爭對手；以色列主要政黨已建議由艾森科特組建新政府。赫爾佐格的授命對內塔尼亞胡的權力構成打擊。\\n為什麼重要\\n授命本身已改寫權力格局：組閣主導權首次落到反對派手上，內塔尼亞胡能否保住總理職位，取決於艾森科特能否拼出聯合政府。\\n來源異同\\n8 家媒體、9 則報導在核心事實上一致：赫爾佐格授命艾森科特、而非內塔尼亞胡組閣。數字有小差異：各家標題與摘要出現 27 與 28 兩種數字，所指項目未明。信任標籤：多方一致——8 家來源確認同一授命，僅數字細節有出入。\\n仍不確定\\n27 與 28 兩數所指為何未見說明；艾森科特的組閣期限與聯合夥伴名單未見於摘要；摘要僅為各家標題與簡述，並非全文。\"},\"sources\":[{\"name\":\"BBC World\",\"url\":\"https://www.bbc.co.uk/news/articles/cmy8367lj5xlo?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"NPR World\",\"url\":\"https://www.npr.org/2026/11/07/nx-s1-6032606/israeli-president-invites-netanyahus-opposition-leader-to-broker-new-government\"},{\"name\":\"NYT World\",\"url\":\"https://www.nytimes.com/2026/11/07/world/middleeast/israel-eisenkot-government.html\"},{\"name\":\"PBS NewsHour\",\"url\":\"https://www.pbs.org/newshour/world/israels-president-taps-opposition-candidate-eisenkot-to-form-a-government-in-setback-for-netanyahu\"},{\"name\":\"The Hill\",\"url\":\"https://thehill.com/policy/international/6206234-herzog-appoints-eisenkot-form-government/\"},{\"name\":\"Axios\",\"url\":\"https://www.axios.com/2026/11/07/israel-eisenkot-netanyahu-government-herzog\"},{\"name\":\"Financial Times\",\"url\":\"https://www.ft.com/content/bf737648-b974-4f87-ba0b-958f2aff1163?syn-25a6b1a6=1\"},{\"name\":\"Al Jazeera\",\"url\":\"https://www.aljazeera.com/video/newsfeed/2026/11/7/eisenkot-chosen-over-netanyahu-to-form-israels-next-government?traffic_source=rss\"}],\"disagreements\":{\"en\":\"Figures differ across outlets (e.g. 27 vs 28 in headlines/snippets).\",\"zh-TW\":\"不同媒體的數字有所不同（例如，標題/摘要中的數字為 27 比 28）。\"},\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":25,\"outletReputation\":20,\"crossCorroboration\":17,\"recencyClarity\":25},\"tags\":[\"international\",\"live-ingest\",\"bbc-world\",\"npr-world\",\"npr-world\"],\"glossary\":[{\"term\":{\"en\":\"Gadi Eisenkot\",\"zh-TW\":\"艾森科特\"},\"blurb\":{\"en\"
