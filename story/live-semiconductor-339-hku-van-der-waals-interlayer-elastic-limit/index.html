e University of Hong Kong (HKU) and collaborators at Tsinghua University published a study in Nature Communications examining the out-of-plane interlayer elastic limits of van der Waals (vdW) crystals. By performing in-situ tensile tests on graphite and hexagonal boron nitride (h-BN) inside an electron microscope, the researchers observed localized interlayer separation initiating at roughly 3% strain—far lower than the approximately 15% elastic limit predicted by classical uniform-stretching models—and identified flexural phonon instability as the triggering mechanism.\n\nWhy it matters\nTwo-dimensional van der Waals materials such as graphite and h-BN serve as foundational dielectrics, substrates, and active channels in next-generation nanoelectronics and semiconductor devices. Redefining their true interlayer mechanical failure threshold provides crucial design rules for flexible electronics, 2D heterojunction stacking, and strain-engineered semiconductor architectures.\n\nSource differences\nThe University of Hong Kong (\"HKU Engineering Team Reveals the Interlayer Elastic Limits of van der Waals Crystals\") details the contrast between the conventional ~15% uniform-stretching prediction and the experimentally observed ~3% threshold triggered by flexural phonon instability. PubMed (\"Flexural phonon instability defines intrinsic van der Waals elastic limits in the interlayer direction\") provides the Nature Communications bibliographic record (DOI 10.1038/s41467-026-74353-w) and full author list led by Heyi Wang, Miaojie Liu, Zhiping Xu, and Yang Lu.\n\nStill uncertain\nHow chemical doping, ambient temperature variations, or encapsulation layers in commercial semiconductor packaging alter this flexural phonon instability threshold across other 2D transition-metal dichalcogenides remains to be tested.\n\nTrust label: Single source — both cited pages document the same HKU-Tsinghua Nature Communications research paper."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-339-hku-van-der-waals-interlayer-elastic-limit\",\"category\":\"semiconductor\",\"title\":{\"en\":\"HKU and Tsinghua Team Finds Flexural Phonon Instability Limits van der Waals Crystals\",\"zh-TW\":\"港大與清華合作揭凡得瓦晶體層間彈性極限 僅3%應變即觸發層間分離\"},\"summary\":{\"en\":\"Researchers from the University of Hong Kong and Tsinghua University discovered that van der Waals crystals like graphite begin local interlayer separation at just ~3% strain—far below the ~15% predicted by uniform-stretching models—driven by flexural phonon instability.\",\"zh-TW\":\"香港大學楊魯教授團隊與清華大學合作，在《Nature Communications》發表凡得瓦晶體層間彈性極限研究，發現石墨與六方氮化硼在電子顯微鏡拉伸下僅約3%應變即開始層間局部分離，遠低於均勻拉伸模型預測的約15%，主因為「彎曲聲子不穩定性」觸發。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n香港大學機械工程系楊魯（Yang Lu）教授團隊與清華大學研究人員合作，在期刊《Nature Communications》發表關於凡得瓦（van der Waals）晶體層間本質彈性極限的研究。團隊在電子顯微鏡內對石墨（graphite）與六方氮化硼（h-BN）進行原位拉伸實驗，發現層間局部分離在約3%應變時即開始發生（六方氮化硼更低至約2%），遠低於傳統均勻拉伸模型預測的約15%極限；理論計算證實「彎曲聲子不穩定性」（flexural phonon instability）是觸發此現象的核心機制。\\n\\n「為什麼重要」\\n石墨與六方氮化硼等二維凡得瓦材料，是次世代奈米電子學與先進半導體元件中不可或缺的介電層、絕緣基板與通道材料。這項發現修正了學界長期沿用的固體強度理論，為二維半導體異質結堆疊、柔性電子器件防分層設計及應變工程（strain engineering）提供了關鍵力學依據。\\n\\n「來源異同」\\n香港大學官方新聞稿（標題「HKU Engineering Team Reveals the Interlayer Elastic Limits of van der Waals Crystals」）詳述傳統均勻拉伸模型預測約15%彈性極限與實驗測得約3%分離門檻的落差，並點出彎曲聲子不穩定性的物理機制。PubMed 論文索引頁（標題「Flexural phonon instability defines intrinsic van der Waals elastic limits in the interlayer direction」）則載明《Nature Communications》期刊出處（DOI: 10.1038/s41467-026-74353-w）與第一作者王鶴一（Heyi Wang）、通訊作者楊魯與徐志平（Zhiping Xu）等完整作者群。\\n\\n「仍不確定」\\n在實際半導體封裝環境中，化學摻雜、溫度變化或外部包覆層會如何改變二硫化鉬等其他二維凡得瓦半導體材料的彎曲聲子不穩定臨界值，仍待後續實驗驗證。\\n\\nTrust label: Single source — 引述來源均對應香港大學與清華大學發表於《Nature Communications》的同一篇論文。\"},\"glossary\":[{\"term\":{\"en\":\"van der Waals (vdW) crystals\",\"zh-TW\":\"凡得瓦晶體\"},\"blurb\":{\"en\":\"Layered materials such as graphite and hexagonal boron nitride whose atomic sheets are held together by weak intermolecular van der Waals forces.\",\"zh-TW\":\"由單原子層堆疊而成的層狀材料（如石墨與六方氮化硼），層與層之間靠微弱的凡得瓦力結合。\"}},{\"term\":{\"en\":\"Flexural phonon instability\",\"zh-TW\":\"彎曲聲子不穩定性\"},\"blurb\":{\"en\":\"A vibrational wave instability in atomic layers under tension that triggers out-of-plane rippling and premature interlayer separation.\",\"zh-TW\":\"原子層在受拉伸時產生的面外波紋振動不穩定現象，會提前誘發層間局部分離。\"}},{\"term\":{\"en\":\"Hexagonal boron nitride (h-BN)\",\"zh-TW\":\"六方氮化硼（h-BN）\"},\"blurb\":{\"en\":\"An atomically flat, electrically insulating 2D crystal widely used as a dielectric substrate in 2D semiconductor devices.\",\"zh-TW\":\"原子級平整的絕緣二維晶體材料，廣泛作為二維半導體元件中的介電層與保護基板。\"}}],\"sources\":[{\"name\":\"The University of Hong Kong\",\"url\":\"https://lead.hku.hk/en/article/2026/11/hku-engineering-team-reveals-the-interlayer-elastic-limits-of-van-der-waals-crystals/\"},{\"name\":\"PubMed\",\"url\":\"https://pubmed.ncbi.nlm.nih.gov/42270645/\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"HKU and Tsinghua Team Finds Flexural Phonon Instability Limits van der Waals Crystals\",\"zh-TW\":\"港大與清華合作揭凡得瓦晶體層間彈性極限 僅3%應變即觸發層間分離\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":74,\"trustBreakdown\":{\"crossCorroboration\":16,\"outletReputation\":23,\"recencyClarity\":21,\"sourceDiversity\":14},\"publishedAt\":\"2026-11-28T03:17:36.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":20,\"D2\":21,\"D3\":20,\"D4\":22,\"D5\":19,\"total\":20},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigrou
