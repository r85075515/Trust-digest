eives Support From Denny's Diner Amid Affair Scandal. Whether the Trump administration has investigated Jensen Huang for potential national security risks has been the subject of questions. Doing nothing and maintaining an even temperament is often the work of gods. Huang acknowledges he violated code of conduct by having affairs, but denied Trump was instrumental in his return Jensen Huang apologized to staff on Tuesday for the tumult he has caused at Nvidia. The company’s CEO acknowledged he violated the code of conduct for having extramarital affairs, but pushed back on the reports that Donald Trump was instrumental in his reinstatement as chief executive. Sell-off signals investors are bracing for further volatility in key AI sector driving economic growth worldwide Technology shares led a market retreat on Tuesday as caution returned after Jensen Huang’s extraordinary return to Nvidia days after he was forced to resign, with investors bracing for further volatility in a key sector driving economic growth worldwide. A day after Huang’s reinstatemen Why it matters\nThis cluster was assembled from 11 feed item(s) across 8 outlet(s) (CNBC, MarketWatch, The Guardian Business, TechCrunch, Wired AI, The Next Platform, CNBC Economy, TMZ) in the entertainment category. Axiom links out to each publisher; this digest only restates titles and short feed descriptions — not full articles. Sources agree / disagree\nMultiple outlets are covering closely related headlines: \"Vance says he was assured Jensen Huang was not under DOJ investigation\" (CNBC); \"I hate that Jensen Huang is back at Nvidia, but I love what it’s done for my 401(k). Am I a hypocrite?\" (MarketWatch); \"Nvidia CEO Jensen Huang apologizes to staff: ‘I made some terrible mistakes’\" (The Guardian Business); \"Tech sell-off resumes as euphoria from Jensen Huang’s Nvidia return subsides\" (The Guardian Business); \"Jensen Huang broke Nvidia’s code of conduct, and his employees may not forget it\" (TechCrunch)
