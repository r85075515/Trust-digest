 the clip sparked heated discussion online, with some fans treating it as an answer to the divorce rumours.\n\nWhy it matters\nThe clip matters because it is the closest thing fans have to evidence in a rumour cycle built on absence. A laugh off camera proves nothing about a marriage, but in a story where the couple's silence feeds speculation, even an unconfirmed sound becomes the news fans share.\n\nSources agree-disagree\nMultiple outlets, including ETtoday, Yahoo, UDN's gossip section and Next Apple News, agree on the birthday, the tears and the claimed laugh, while treating Liu Shishi's presence as suspected, not confirmed. Reports also repeat unconfirmed divorce rumours, including claims about splitting property worth 800 million in the currency used by those reports, which should not be read as established fact. No outlet in the material confirms that the voice is Liu Shishi.\n\nStill uncertain\nThe material provided does not confirm whose laugh is heard, whether Liu Shishi attended the celebration, or the state of the marriage. The laugh remains a fan identification, not a verified appearance.\n\nTrust label: Accounts differ"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-eastAsiaGossip-02-56-line-today\",\"category\":\"eastAsiaGossip\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-eastAsiaGossip-02-56-line-today.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 吳奇隆56歲生日被「成長影片」逼哭 網友抓劉詩詩也在場!!! - LINE TODAY\",\"zh-TW\":\"相關封面圖：吳奇隆56歲生日被「成長影片」逼哭 網友抓劉詩詩也在場!!! - LINE TODAY\"},\"publishedAt\":\"2026-11-03T02:08:12.000Z\",\"title\":{\"en\":\"Nicky Wu turns 56 in tears as fans think they hear Liu Shishi off camera\",\"zh-TW\":\"吳奇隆 56 歲生日落淚，網友疑聽見劉詩詩在鏡頭外大笑\"},\"summary\":{\"en\":\"Actor Nicky Wu marked his 56th birthday on October 31 with a career retrospective video from his team that moved him to tears, ETtoday and Yahoo reports say. Fans claim a familiar laugh off camera sounds like his wife Liu Shishi, after 11 years of marriage dogged by divorce rumours. Watch whether the couple appears together to settle the talk.\",\"zh-TW\":\"藝人吳奇隆（Nicky Wu）10 月 31 日迎接 56 歲生日，工作團隊準備的人生回顧影片讓他感動落淚，ETtoday 與 Yahoo 報導指出。網友聲稱鏡頭外傳來的熟悉大笑聲疑似妻子劉詩詩（Liu Shishi），兩人結婚 11 年來始終伴隨婚變傳聞。接下來看兩人是否同框，才能平息這波議論。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"發生了什麼事\\n藝人吳奇隆（Nicky Wu）10 月 31 日迎接 56 歲生日，工作團隊準備的人生回顧影片讓他感動落淚。吳奇隆與劉詩詩（Liu Shishi）結婚 11 年，婚變傳聞始終沒停過，兩人近年鮮少公開同框，社群互動也幾乎歸零。生日當天，工作團隊精心準備的人生回顧影片讓他看得落淚，Yahoo 指出他擦淚時不忘露出婚戒。網友隨後聲稱，生日影片中鏡頭外傳來的熟悉大笑聲疑似劉詩詩，瞬間引發熱議，有網友直呼這才是對婚變傳聞最直接的回應。\\n\\n為什麼重要\\n這段影片之所以成為話題，在於它是粉絲在「缺席」堆起的傳聞循環裡，最接近證據的東西。鏡頭外的一聲笑，證明不了婚姻狀態，但在夫妻沉默餵養猜測的故事裡，連一聲未經證實的笑聲都會變成被轉傳的新聞。\\n\\n來源異同\\nETtoday、Yahoo、噓！星聞與壹蘋等多家媒體對生日、落淚與網友聲稱的笑聲說法一致，但都把劉詩詩在場視為疑似，而非確認。報導也重提未經證實的婚變傳聞，包括分割 8 億財產的說法，這些都不應視為既定事實。提供的材料中沒有任何一家媒體確認那個聲音就是劉詩詩。\\n\\n仍不確定\\n提供的材料沒有確認笑聲屬於誰、劉詩詩是否出席慶生，也沒有確認婚姻現況。這聲笑目前只是網友辨認，不是經過核實的現身。\"},\"sources\":[{\"name\":\"ETtoday 影劇\",\"url\":\"https://star.ettoday.net/news/3265265\"},{\"name\":\"Google News\",\"url\":\"https://news.google.com/rss/articles/CBMiWkFVX3lxTE1WZS1Vak5xby03Z3RkTzBwOEIwYWYtSktMc24zZDd0ZXBGWGZTb1VOU3VkUlB0TnNNNXlXcG5uaVQwLTctbW5iUWhtUnFtRHVMcmV5MGNmTldUQdIBX0FVX3lxTE5NeHh6aXFuc1NzRHY5MGF3YTdsMjlrQzNPWk0zRlh5VEkzUFpjQy1vbzhhRnNrOUJfcDJ3QlFBaFhpVk9KdHhWd2hISEFEMVpfVGxXc2N4aF8yY3M4QnNz?oc=5\"},{\"name\":\"Yahoo TW 娛樂\",\"url\":\"https://tw.news.yahoo.com/%E5%90%B3%E5%A5%87%E9%9A%8656%E6%AD%B2%E7%94%9F%E6%97%A5%E5%9B%9E%E9%A1%A7%E4%BA%BA%E7%94%9F%E5%93%AD%E4%BA%86-%E6%93%A6%E6%B7%9A%E4%B8%8D%E5%BF%98%E9%9C%B2%E5%A9%9A%E6%88%92%E6%82%84%E6%8F%AD%E5%A9%9A%E5%A7%BB%E7%8F%BE%E6%B3%81-022100556.html\"},{\"name\":\"Google News TW 娛樂\",\"url\":\"https://news.google.com/rss/articles/CBMiYkFVX3lxTFBzMnZ0Yjk0S01pd0xfNkRiWkJjSzVJV01nQUNBY3ZGQXdpcXkxeXVZb2hJZUhsOXd6cnJWUS1yR1QwLUd1WnhSeGRfYVF3a3NocmJ4YTh3c2FHdmMtTFNLYWRn0gFiQVVfeXFMUHMydnRiOTRLTWl3TF82RGJaQmNLNUlXTWdBQ0FjdkZBd2lxeTF5dVlvaEllSGw5d3pyclZRLXJHVDAtR3VaeFJ4ZF9hUXdrc2hyYnhhOHdzYUd2Yy1MU0thZGc?oc=5\"},{\"name\":\"toda
