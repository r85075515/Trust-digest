 reported a two-part drug safety engineering approach designed to rescue potent but toxic antibiotic candidates. The team linked calicheamicin—a bacterial compound capable of killing drug-resistant pathogens—to an albumin-binding protein via a peptide linker cleaved specifically by neutrophil elastase at infection sites, while co-administering an engineered antidote enzyme, CalU19, that neutralizes any prematurely released drug in circulation before it reaches the liver.\n\nWhy it matters\nMany promising antimicrobial compounds stall before clinical trials because systemic toxicity damages healthy human organs such as the liver. In mice infected with Pseudomonas aeruginosa or Staphylococcus aureus pneumonia, the combined conjugate-and-antidote therapy cleared lung infections without liver injury, and demonstrated laboratory activity against MRSA, E. coli, and Klebsiella pneumoniae.\n\nSource differences\nMIT News (\"Engineering antibiotics could expand the pool of new drug candidates\") highlighted Sangeeta Bhatia's (Sangeeta Bhatia) commentary on rescuing stalled drug-discovery pipelines and noted the underlying paper \"Expanding antimicrobial chemical space by engineering drug safety.\" Daily.dev (\"Engineering antibiotics could expand the pool of new drug candidates\") and Bioengineer.org (\"Calicheamicin Conjugate and Antidote Clear Bacterial Pneumonia in Mice Safely\") both summarized the November 27 MIT release, detailing the neutrophil elastase linker mechanism, the CalU19 antidote enzyme, and activity against MRSA, E. coli, and Klebsiella pneumoniae.\n\nStill uncertain\nThe therapy has so far been evaluated only in laboratory dishes and mouse pneumonia models; human clinical safety, optimal antidote dosing ratios, and generalizability to other toxic antimicrobial classes remain to be established.\n\nTrust label: Single source — All secondary science articles summarize the single November 27, 2026 research announcement issued by MIT News."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-biotech-314-mit-engineered-antibiotic-safety\",\"category\":\"biotech\",\"title\":{\"en\":\"MIT Researchers Pair Engineered Antibiotic with Circulating Antidote to Prevent Liver Damage\",\"zh-TW\":\"MIT 團隊開發「雙重安全機制」抗生素療法，在小鼠肺炎實驗中清除感染且不傷肝\"},\"summary\":{\"en\":\"MIT researchers published a strategy on November 27, 2026, that pairs a targeted calicheamicin antibiotic conjugate with an engineered circulating antidote enzyme, CalU19. In mouse models of bacterial pneumonia, the two-part system cleared infections without causing liver toxicity, offering a way to revive potent antimicrobial candidates previously abandoned for side effects.\",\"zh-TW\":\"美國麻省理工學院（MIT）研究團隊於 2026 年 11 月 27 日發表新型藥物工程策略，將標靶型抗生素「卡奇黴素」（calicheamicin）偶聯物與基因工程改造的循環解毒酵素 CalU19 共同給藥，在細菌性肺炎小鼠模型中成功清除感染且避免肝臟損傷，可望讓過去因毒性遭淘汰的高效力候選抗生素重獲臨床開發機會。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n美國麻省理工學院（MIT）教授巴蒂亞（Sangeeta Bhatia）領導的研究團隊於 2026 年 11 月 27 日公布一項雙重藥物安全工程策略，致力挽救具強大殺菌力卻因毒性過高而受阻的候選抗生素。團隊將具備殺滅抗藥性細菌能力的「卡奇黴素」（calicheamicin）透過特定胜肽連結子接上白蛋白結合蛋白，使其僅在感染部位遇見嗜中性球彈性蛋白酶時釋放藥效，並同步給予改造後的解毒酵素 CalU19，在血液循環中提前中和逸散藥物以保護肝臟。\\n\\n「為什麼重要」\\n許多極具潛力的抗菌化合物在進入臨床試驗前便因全身性毒性或肝損傷風險被迫中止開發。在綠膿桿菌與金黃色葡萄球菌引發的細菌性肺炎小鼠實驗中，該套偶聯藥物加解毒劑組合成功清除肺部感染且未造成肝臟損害，體外實驗亦證實可抑制 MRSA、大腸桿菌與克雷伯氏肺炎菌。\\n\\n「來源異同」\\nMIT News 原始報導（\\\"Engineering antibiotics could expand the pool of new drug candidates\\\"）引述巴蒂亞（Sangeeta Bhatia）對突破新藥研發安全瓶頸的說明，並標明研究論文題目為〈Expanding antimicrobial chemical space by engineering drug safety〉；Daily.dev（\\\"Engineering antibiotics could expand the pool of new drug candidates\\\"）與 Bioengineer.org（\\\"Calicheamicin Conjugate and Antidote Clear Bacterial Pneumonia in Mice Safely\\\"）均轉述自 11 月 27 日 MIT 新聞稿，重點說明嗜中性球彈性蛋白酶切點機制、CalU19 解毒酵素及小鼠肺炎清除結果。\\n\\n「仍不確定」\\n目前研究成果僅完成體外培養皿與小鼠肺炎模型驗證，人體臨床試驗安全性、解毒酵素與抗生素的最佳給藥比例，以及該策略能否通用於其他高毒性抗菌分子，仍有待後續研究確認。\\n\\nTrust label: Single source — 所有科普媒體報導皆轉述自麻省理工學院 MIT News 於 2026 年 11 月 27 日發布的同一篇研究新聞稿。\"},\"glossary\":[{\"term\":{\"en\":\"Calicheamicin\",\"zh-TW\":\"卡奇黴素\"},\"blurb\":{\"en\":\"A potent bacteria-derived enediyne compound capable of cleaving DNA in pathogens, previously limited in systemic antibiotic use by high toxicity to healthy cells.\",\"zh-TW\":\"一種源自細菌的強效烯二炔類天然化合物，能切斷病原體 DNA，過去因對正常人體細胞毒性過高而難以直接作為全身性抗生素使用。\"}},{\"term\":{\"en\":\"Neutrophil Elastase\",\"zh-TW\":\"嗜中性球彈性蛋白酶\"},\"blurb\":{\"en\":\"An enzyme released by white blood cells at sites of bacterial infection and inflammation, used here as a biochemical trigger to release the active drug locally.\",\"zh-TW\":\"白血球在細菌感染與發炎部位釋放的一種蛋白酶，本項研究中作為在病灶局部精準切斷連結子並釋放藥物的生化開關。\"}},{\"term\":{\"en\":\"MRSA\",\"zh-TW\":\"抗藥性金黃色葡萄球菌（MRSA）\"},\"blurb\":{\"en\":\"Methicillin-resistant Staphylococcus aureus, a strain of bacteria resistant to several widely used antibiotics that causes difficult-to-treat infections.\",\"zh-TW\":\"對多種常見 β-內醯胺類抗生素產生抗藥性的金黃色葡萄球菌株，常引發難以治療的院內或社區型嚴重感染。\"}}],\"sources\":[{\"name\":\"MIT News\",\"url\":\"https://news.mit.edu/2026/engineering-antibiotics-could-expand-new-drug-candidates-pool-1127\"},{\"name\":\"Bioengineer.org\",\"url\":\"https://bioengineer.org/calicheamicin-conjugate-and-antidote-clear-bacterial-pneumonia-in-mice-safely/\"},{\"name\":\"daily.dev\",\"url\":\"https://daily.dev/posts/engineering-antibiotics-could-expand-the-pool-of-new-drug-candidates-4mosuhdv7\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"MIT Researchers Pair Engineered Antibiotic with Circulating Antidote to Prevent Liver Damage\",\"zh-TW\":\"MIT 團隊開發「雙重安全機制」抗生素療法，在小鼠肺炎實驗中清除感染且不傷肝\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":77,\"trustBreakdown\":{\"crossCorroboration\":20,\"outletReputation\":23,\"recencyClarity\":21,\"sourceDiversity\":13},\"publishedAt\":\"2026-11-28T02:11:49.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":21,\"D2\":20,\"D3\":19,\"D4\":20,\"D5\":20,\"total\":20},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\
