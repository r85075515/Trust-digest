 its measles elimination status after more than 25 years.\nWhat happened\nAccording to The Hill and Al Jazeera, the Pennsylvania Department of Health said an unvaccinated Centre County resident died after testing positive for measles, the state's ninth measles-related death this year. Pennsylvania has recorded 1,638 measles cases, with the outbreak spreading across 46 counties. The confirmation came less than a week after the United States lost its measles elimination status, a public-health milestone held for more than 25 years.\nWhy it matters\nThe loss of elimination status alongside Pennsylvania's worsening outbreak shows measles spreading again in the United States, with unvaccinated people bearing the greatest risk. A ninth death and 1,638 cases indicate not isolated incidents but a sustained public-health crisis across dozens of counties.\nSources agree / disagree\nThe Hill and Al Jazeera agree on the core facts: the ninth death, the unvaccinated Centre County resident, and the 1,638 cases. The material also notes that figures from the Centers for Disease Control and Prevention (CDC) and the state differ on measles deaths, but the snippets do not give either side's numbers; the automatically flagged gap between 25 and 46 is not a conflict, since 25 refers to years of elimination status and 46 to counties affected. Trust label: Two-source agreement — two outlets agree on the core facts, though the gap between official death counts still needs clarifying.\nStill uncertain\nHow far apart the CDC and Pennsylvania figures are, and why they differ, is not stated in the material. The victim's age and course of illness, the timing of the 1,638 cases, and Pennsylvania's catch-up vaccination and containment measures are also missing."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-us-02-pennsylvania-confirms-9t\",\"category\":\"us\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-us-02-p
