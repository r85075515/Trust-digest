l of the case. The suit stems from a Panorama episode that stitched together two separate sections of a speech Trump gave in 2021, an edit his lawyers call misleading.\n\nWhat happened\nJudge Enjolique Lett ordered Trump to cooperate with the court-mandated discovery process and appear for questioning under oath no later than December 11. BBC News, The Guardian and Axios each reported the order on October 22, all citing the same deadline and the same consequence: non-cooperation could end the lawsuit Trump himself filed.\n\nWhy it matters\nThe ruling turns Trump's own weapon back on him. To keep a $10 billion claim alive, he must now sit across from the BBC's lawyers and answer questions under oath. It is a rare moment in which the plaintiff behind a mega-suit cannot hide behind public statements and rallies — the courtroom rules apply to him too.\n\nSources agree / disagree\nAll three outlets report identical core facts: the December 11 deadline, the $10 billion figure, and the dispute over the edited 2021 speech. No numeric or factual conflicts were detected in the feed snippets.\n\nStill uncertain\nThe snippets do not show whether Trump's legal team will seek a delay or challenge the order; verify procedural details on the publishers' pages before citing them."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-01-us-judge-orders-trump-to\",\"category\":\"international\",\"adult\":false,\"isHeadline\":true,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-international-01-us-judge-orders-trump-to.jpg\",\"imageAlt\":{\"en\":\"Cover related to: US judge orders Trump to sit for deposition in $10bn lawsuit against BBC\",\"zh-TW\":\"相關封面圖：美國法官命令川普在針對 BBC 的 100 億美元訴訟中出庭作證\"},\"publishedAt\":\"2026-10-23T01:38:44.000Z\",\"title\":{\"en\":\"Judge Orders Trump to Sit for Deposition by Dec 11 in $10 Billion BBC Lawsuit\",\"zh-TW\":\"川普（Donald Trump）100 億美元告 BBC 案：法官下令 12 月 11 日前出庭作證\"},\"summary\":{\"en\":\"A federal judge ordered President Donald Trump to sit for a deposition by December 11 in his $10 billion defamation suit against the BBC over a Panorama edit of his 2021 speech — or face possible dismissal. BBC, The Guardian and Axios all report the same deadline, forcing Trump to answer questions under oath in a case he started.\",\"zh-TW\":\"川普對 BBC 提起 100 億美元誹謗訴訟，聯邦法官下令他必須在 12 月 11 日前出庭作證，否則可能整案被駁回。三家媒體報導一致。takeaway：自己開的戰場自己打——再拖，100 億就沒了。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"川普（Donald Trump）對英國廣播公司（BBC）提起的 100 億美元誹謗訴訟出現轉折：聯邦法官下令，他必須在 12 月 11 日前出庭接受宣誓訊問，否則案件可能被直接駁回。\\n發生了什麼事\\n法官恩若莉奎·雷特（Enjolique Lett）裁定川普必須配合法院的證據開示程序，在 12 月 11 日前完成作證。BBC、《衛報》、Axios 三家 10 月 22 日都報導了這道命令，期限與後果一致：不配合，川普自己提的訴訟就可能被終結。訴訟起因是 BBC《全景》（Panorama）節目把川普 2021 年一場演講的兩個不同段落剪接在一起，川普律師團指控剪輯誤導。\\n為什麼重要\\n結論很直接：這是川普自己開的戰場，現在他得親自上場，坐在 BBC 律師對面宣誓回答問題。想保住 100 億美元的求償，就不能再躲在公開聲明和造勢場合後面——法庭規則對他一體適用。\\n來源異同\\n三家媒體核心事實一致：12 月 11 日期限、100 億美元金額、2021 年演講剪輯爭議。信任標籤：N源一致——三家主流媒體對命令內容的報導一致。\\n仍不確定\\n來源摘要未顯示川普律師團是否會申請延期或挑戰這道命令；引用程序細節前請查閱完整報導。\"},\"sources\":[{\"name\":\"BBC World\",\"url\":\"https://www.bbc.co.uk/news/articles/cmy0ryjx7741o?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"The Guardian Business\",\"url\":\"https://www.theguardian.com/us-news/2026/oct/22/trump-bbc-lawsuit-deposition-discovery\"},{\"name\":\"Axios\",\"url\":\"https://www.axios.com/2026/10/22/trump-bbc-lawsuit-december-deposition-deadline\"}],\"disagreements\":null,\"trustScore\":85,\"trustBreakdown\":{\"sourceDiversity\":20,\"outletReputation\":18,\"crossCorroboration\":22,\"recencyClarity\":25},\"tags\":[\"international\",\"live-ingest\",\"bbc-world\",\"the-guardian-business\",\"axios\"],\"glossary\":[{\"term\":{\"en\":\"Donald Trump\",\"zh-TW\":\"川普\"},\"blurb\":{\"en\":\"US president and plaintiff in the $10 billion defamation suit against the BBC.\",\"zh-TW\":\"美國總統，本案原告，對 BBC 提起 100 億美元誹謗訴訟。\"}},{\"term\":{\"en\":\"BBC\",\"zh-TW\":\"英國廣播公司\"},\"blurb\":{\"en\":\"British public broadcaster being sued over a Panorama edit.\",\"zh-TW\":\"
