 the latest research finds that air pollution does more than damage the DNA of lung cells: fine particulate matter known as PM2.5 appears to wake up cells in the lungs that already carry mutations, setting the stage for cancer in people who never smoked. The source text breaks off mid-sentence at this point, so the report as provided does not explain how the awakening happens, how strong the effect is, or what evidence the researchers relied on.\nWhy it matters\nThe finding, if it holds up, changes how the risk of air pollution should be understood. Rather than only causing new genetic damage, pollution may also activate damage that is already present but dormant — meaning that people with no smoking history and no symptoms could still carry a risk that dirty air brings to life. That would make clean-air policy a lung-cancer issue as well as a respiratory one, and it would help explain cases of the disease that have long puzzled doctors and patients alike.\nSources agree / disagree\nThis card rests on a single source: the TechNews report. No other outlet in the material corroborates the finding, and the key sentence of the report is cut off before the mechanism is explained, so the account cannot be cross-checked here. Trust label: Single source — the account comes from one TechNews report, truncated mid-sentence, with no independent corroboration in the material provided.\nStill uncertain\nThe material does not name the study, its authors, the institution behind it, or the journal in which it appeared. It gives no numbers — no sample size, no risk figures, no exposure levels — and the key sentence is cut off before the mechanism is explained. Nothing here establishes how much PM2.5 exposure matters, which mutations are involved, or whether the finding has been replicated."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-03-pm2-5\",\"category\":\"semiconductor\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-semiconductor-03-pm2-5.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 不吸菸也得肺癌，研究：Pm2.5 喚醒肺部突變細胞\",\"zh-TW\":\"相關封面圖：（譯文待補）不吸菸也得肺癌，研究：Pm2.5 喚醒肺部突變細胞\"},\"publishedAt\":\"2026-11-24T05:38:20.000Z\",\"title\":{\"en\":\"PM2.5 May Wake Dormant Mutated Lung Cells in Never-Smokers, Study Finds\",\"zh-TW\":\"研究：細懸浮微粒（PM2.5）喚醒肺部突變細胞，不吸菸也可能罹患肺癌\"},\"summary\":{\"en\":\"[Unverified, single source] Lung cancer has long been linked to smoking, yet people who have never smoked can also develop it, and new research suggests air pollution does more than damage cell DNA, with fine particulate matter known as PM2.5 apparently awakening mutated cells in the lungs.\",\"zh-TW\":\"［未證實·單一來源］肺癌長期被視為與吸菸高度相關，但從未吸菸的人也可能罹患肺癌；最新研究指出，空氣污染不只損害細胞DNA，細懸浮微粒（PM2.5）可能喚醒肺部已突變的細胞。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"肺癌長期被視為與吸菸高度相關的疾病，但從未吸菸的人也可能罹患肺癌；最新研究指出，空氣污染在肺癌中的角色，可能比過去認為的更主動。\\n發生了什麼事\\n科技新報報導，最新研究指出，空氣污染不只會損害肺部細胞的DNA，細懸浮微粒（PM2.5）還可能喚醒肺部已帶有突變的細胞，為從未吸菸者罹患肺癌埋下伏筆。不過素材提供的文字在關鍵句中途截斷，因此未說明喚醒的機制、影響有多大，也未交代研究者依據哪些證據得出結論。\\n為什麼重要\\n如果這項發現站得住腳，空氣污染的風險就必須重新理解：它不只造成新的基因損傷，還可能啟動原本處於休眠狀態的損傷——也就是說，沒有吸菸史、沒有症狀的人，體內仍可能帶有被髒空氣喚醒的風險。這會讓空氣清淨政策同時成為肺癌防治議題，也為長期以來令醫師與病患困惑的不吸菸肺癌病例提供一種解釋。\\n來源異同\\n本卡僅有科技新報一則報導，且關鍵句中途截斷；素材中沒有其他媒體佐證，也無法交叉核對。信任標籤：僅1源——本卡僅依據科技新報一則報導，且關鍵內容截斷，素材中無其他來源佐證。\\n仍不確定\\n素材未提供研究名稱、作者、所屬機構或發表期刊，也沒有數字——沒有樣本數、風險數值或暴露濃度。關鍵句在說明機制之前就截斷了，因此PM2.5暴露的影響有多大、涉及哪些突變、發現是否已被重複驗證，素材都無法回答。\"},\"sources\":[{\"name\":\"TechNews 科技新報\",\"url\":\"https://technews.tw/2026/11/24/lung-cancer-in-non-smokers-study-finds-pm2-5-awakens-mutated-lung-cells/\"}],\"disagreements\":null,\"trustScore\":47,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":10,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"semiconductor\",\"live-ingest\",\"technews-科技新報\"],\"glossary\":[{\"blurb\":{\"en\":\"Fine airborne particles small enough to reach deep into the lungs.\",\"zh-TW\":\"足以深入肺部的細小空氣懸浮微粒。\"},\"term\":{\"en\":\"PM2.5\",\"zh-TW\":\"細懸浮微粒\"}},{\"blurb\":{\"en\":\"Cancer that begins in the lungs.\",\"zh-TW\":\"起源於肺部的癌症。\"},\"term\":{\"en\":\"lung cancer\",\"zh-TW\":\"肺癌\"}},{\"blurb\":{\"en\":\"Cells whose DNA has changed, sometimes a first step toward cancer.\",\"zh-TW\":\"DNA已發生改變的細胞，有時是癌變的第一步。\"},\"term\":{\"en\":\"mutated cells\",\"zh-TW\":\"突變細胞\"}},{\"blurb\":{\"en\":\"A Taiwanese technology news outlet.\",\"zh-TW\":\"台灣科技新聞媒體。\"},\"term\":{\"en\":\"TechNews\",\"zh-TW\":\"科技新報\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-semiconductor-03-pm2-5/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-semiconductor-03-pm2-5/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"d:\"$8:metadata\"\n"])</script></body></html>
