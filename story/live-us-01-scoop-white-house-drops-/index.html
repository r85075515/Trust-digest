 of Heidi Overton to lead the Food and Drug Administration amid opposition from Senate Republicans, it confirmed to The Hill. Overton was set to face a key vote Wednesday in the Senate health committee, where Republicans hold only a one-vote majority. Axios separately learned the White House is dropping the nomination because of a lack of congressional support.\nWhy it matters\nThe decision means the Trump administration must find a new candidate to lead the FDA while Health and Human Services Secretary Robert F. Kennedy Jr. advances his Make America Healthy Again agenda. A nomination collapsing this close to a committee vote signals thin support that the White House chose not to test.\nSources agree / disagree\nThe Hill and Axios agree on the core facts — the nomination is withdrawn and Senate Republican opposition is the reason. No numeric or name conflicts appear in the snippets. Trust label: Two-source agreement — The Hill and Axios report the same core facts.\nStill uncertain\nThe snippets do not name which Republicans opposed Overton or why, and no replacement candidate has been named. Verify details on the publisher pages."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-us-01-scoop-white-house-drops-\",\"category\":\"us\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-us-01-scoop-white-house-drops-.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Scoop: White House drops Heidi Overton's FDA nomination\",\"zh-TW\":\"相關封面圖：獨家新聞：白宮放棄海蒂·奧弗頓 (Heidi Overton) 的 FDA 提名\"},\"publishedAt\":\"2026-11-18T01:08:53.000Z\",\"title\":{\"en\":\"White House Drops Heidi Overton's FDA Nomination Amid Senate GOP Opposition\",\"zh-TW\":\"白宮撤回奧弗頓（Heidi Overton）FDA 提名　參院共和黨反對\"},\"summary\":{\"en\":\"The White House has withdrawn Heidi Overton's nomination to lead the Food and Drug Administration amid opposition from Senate Republicans, The Hill and Axios report. Overton was set to face a key vote Wednesday in the Senate health committee, where Republicans hold only a one-vote majority.\",\"zh-TW\":\"白宮因參議院共和黨人反對，撤回海蒂·奧弗頓（Heidi Overton）出任食品藥物管理局（FDA）局長的提名。奧弗頓原定週三在參議院衛生委員會面臨關鍵投票，共和黨在該委員會僅有一票多數。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"白宮因參議院共和黨人反對，撤回海蒂·奧弗頓出任食品藥物管理局局長的提名。\\n發生了什麼事\\n白宮向《國會山報》（The Hill）證實，由於參議院共和黨人的反對，白宮撤回了海蒂·奧弗頓領導食品藥物管理局的提名。奧弗頓原定週三在參議院衛生委員會面臨關鍵投票，共和黨在該委員會中僅擁有一票多數。Axios 另行獲悉，白宮放棄提名的原因是缺乏國會支持。\\n為什麼重要\\n這項決定意味著川普政府必須另找人選領導 FDA，同時衛生與公眾服務部部長小羅伯特·F·甘迺迪（Robert F. Kennedy Jr.）正推動「讓美國再次健康」（Make America Healthy Again）議程。提名在委員會投票前夕垮台，顯示白宮不願拿薄弱的支持去硬闖。\\n來源異同\\n《國會山報》與 Axios 在核心事實上一致：提名已撤回，原因是參議院共和黨人反對，摘要中沒有數字或名稱衝突。信任標籤：雙源一致——《國會山報》與 Axios 報導相同核心事實。\\n仍不確定\\n來源摘要未說明哪些共和黨人反對、反對理由為何，也未提及接替人選；細節請查閱原始報導。\"},\"sources\":[{\"name\":\"The Hill\",\"url\":\"https://thehill.com/policy/healthcare/6226487-white-house-withdraws-fda-nomination/\"},{\"name\":\"Axios\",\"url\":\"https://www.axios.com/2026/11/17/heidi-overton-fda-nomination-dropped\"}],\"disagreements\":null,\"trustScore\":62,\"trustBreakdown\":{\"sourceDiversity\":13,\"outletReputation\":10,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"us\",\"live-ingest\",\"the-hill\",\"axios\"],\"glossary\":[{\"blurb\":{\"en\":\"Nominee to lead the FDA whose nomination the White House withdrew.\",\"zh-TW\":\"FDA 局長被提名人，白宮已撤回其提名。\"},\"term\":{\"en\":\"Heidi Overton\",\"zh-TW\":\"海蒂·奧弗頓\"}},{\"blurb\":{\"en\":\"US agency that regulates food and drugs; its top post is now vacant again.\",\"zh-TW\":\"美國食品藥物主管機關，局長一職再度出缺。\"},\"term\":{\"en\":\"Food and Drug Administration (FDA)\",\"zh-TW\":\"食品藥物管理局\"}},{\"blurb\":{\"en\":\"US Secretary of Health and Human Services, advancing the Make America Healthy Again agenda.\",\"zh-TW\":\"美國衛生與公眾服務部部長，正推動「讓美國再次健康」議程。\"},\"term\":{\"en\":\"Robert F. Kennedy Jr.\",\"zh-TW\":\"小羅伯特·F·甘迺迪\"}},{\"blurb\":{\"en\":\"Senate committee where Overton was set to face a key vote.\",\"zh-TW\":\"參議院委員會，奧弗頓原定在此面臨關鍵投票。\"},\"term\":{\"en\":\"Senate health committee\",\"zh-TW\":\"參議院衛生委員會\"}},{
