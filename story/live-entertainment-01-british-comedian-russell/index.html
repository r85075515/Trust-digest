e Guardian all report the same sentence.\nWhy it matters\nThis is the sentencing follow-up to the guilty verdicts reported on November 6, when the expected range was six to nine years — the actual term of ten and a half years is longer than that early estimate. The judge's 'sexual predator' characterization also matters: it frames how the court views the pattern of offending, not just the individual counts. The takeaway is that the case has now moved from verdict to punishment, and the sentence is at the severe end of expectations.\nSources agree / disagree\nFour outlets agree on the sentence, the counts, and the judge's words. Trust label: Multi-source agreement — four outlets, consistent facts, including the 10.5-year figure. A separate Guardian item in the cluster reports an ex-partner saying Brand physically assaulted her; that is a related allegation, not part of the sentencing itself.\nStill uncertain\nThe snippets say nothing about whether Brand will appeal, or about parole conditions and where he will serve the sentence. Those details should be checked against the full court reporting."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-entertainment-01-british-comedian-russell\",\"category\":\"entertainment\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-entertainment-01-british-comedian-russell.jpg\",\"imageAlt\":{\"en\":\"Russell Brand sentenced to 10.5 years in prison\",\"zh-TW\":\"羅素·布蘭德被判處 10 年半監禁\"},\"publishedAt\":\"2026-11-10T00:38:32.000Z\",\"title\":{\"en\":\"Russell Brand Sentenced to 10.5 Years for Rape and Sexual Assault\",\"zh-TW\":\"羅素·布蘭德判刑 10 年半：強姦與性侵罪成\"},\"summary\":{\"en\":\"British comedian Russell Brand was sentenced Monday at Southwark Crown Court to 10 and a half years in prison for raping a woman in 2009 and sexually assaulting three others. He was convicted on one count of rape and three counts of sexual assault; the judge called him a 'sexual predator'.\",\"zh-TW\":\"英國喜劇演員羅素·布蘭德（Russell Brand）週一在南華克刑事法庭被判處 10 年半監禁，罪名是 2009 年強姦一名女子並性侵另外三人。他被判一項強姦罪與三項性侵罪成立，法官量刑時稱他為「性掠奪者」。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"英國喜劇演員羅素·布蘭德（Russell Brand）週一在南華克刑事法庭經四週審判後，被判處 10 年半監禁，罪名是 2009 年強姦一名女子並性侵另外三人。本案由六名女性提告，布蘭德被判一項強姦罪與三項性侵罪成立。\\n發生了什麼事\\n經過四週審判，法院判處布蘭德 10 年半徒刑。定罪內容包括 2009 年的一起強姦案與對另外三名女性的性侵。量刑時法官稱布蘭德為「性掠奪者」。NPR、BBC、哥倫比亞廣播公司與《衛報》報導的刑期一致。\\n為什麼重要\\n這是 11 月 6 日有罪判決的量刑後續——當時預期刑期為 6 至 9 年，實際判處的 10 年半比預期更重。法官「性掠奪者」的定性也很關鍵：它界定了法院如何看待整體犯行模式，而不只是個別罪名。結論是，本案已從定罪進入量刑階段，且刑期落在預期的嚴厲一端。\\n來源異同\\n四家媒體對刑期、罪名與法官用詞一致。信任標籤：多源一致——四家媒體、事實一致，包括 10 年半這個數字。集群中另有《衛報》一則前伴侶指控布蘭德曾對她施暴的報導，那是相關指控，並非量刑本身的一部分。\\n仍不確定\\n摘要未提及布蘭德是否上訴，也未說明假釋條件與服刑地點。這些細節請對照完整法庭報導。\"},\"sources\":[{\"name\":\"NPR World\",\"url\":\"https://www.npr.org/2026/11/09/nx-s1-6034335/british-comedian-russell-brand-sentenced\"},{\"name\":\"BBC Entertainment\",\"url\":\"https://www.bbc.co.uk/news/articles/ckzd6dl18dmyo?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"CBS News Crime\",\"url\":\"https://www.cbsnews.com/news/russell-brand-sentenced-prison-rape-sexual-assault/\"},{\"name\":\"The Guardian UK News\",\"url\":\"https://www.theguardian.com/news/2026/nov/09/jemima-goldsmith-says-ex-partner-russell-brand-physically-assaulted-her\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":25,\"outletReputation\":21,\"crossCorroboration\":25,\"recencyClarity\":25},\"tags\":[\"entertainment\",\"live-ingest\",\"npr-world\",\"bbc-entertainment\",\"cbs-news-crime\"],\"glossary\":[{\"term\":{\"en\":\"Russell Brand\",\"zh-TW\":\"羅素·布蘭德\"},\"blurb\":{\"en\":\"British comedian and actor sentenced for rape and sexual assault in 2026.\",\"zh-TW\":\"2026 年因強姦與性侵罪成被判刑的英國喜劇演員。\"}},{\"term\":{\"en\":\"Southwark Crown Court\",\"zh-TW\":\"南華克刑事法庭\"},\"blurb\":{\"en\":\"The London court that tried the case.\",\"zh-TW\":\"審理本案的倫敦刑事法庭。\"}},{\"term\":{\"en\":\"Sexual predator\",\"zh-TW\":\"性掠奪者\"},\"blurb\":{\"en\":\"The term the sentencing judge used to describe Brand.\",\"z
