tes across 11 cities—including Barcelona, Copenhagen, Freetown, Jakarta, and Quito—for youth teams to design rapid responses to heat, flooding, and storms.\n\n「Why it matters」Extreme weather events often outpace traditional multi-year urban planning cycles and hit lower-income or vulnerable neighborhoods hardest. Engaging younger designers aims to generate actionable, site-specific adaptation ideas that city officials can evaluate for implementation.\n\n「Source differences」C40 Cities announces the program launch and challenge scope, while the Holcim Foundation provides additional detail on nominated locations and participating city leaders. 來源標題：「11 cities worldwide call on young people to design rapid urban solutions for extreme weather through the Youth Reinventing Cities challenge」；來源標題：「Youth Reinventing Cities: Sixth Edition | Holcim Foundation」。\n\n「Still uncertain」Which specific youth proposals will be selected or funded for physical construction in each participating city remains to be determined through the competition process.\n\nTrust label: Multi-source agreement — Both C40 Cities and a partner foundation report the sixth edition launch across 11 cities."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-228-c40-youth-reinventing-cities\",\"category\":\"international\",\"title\":{\"en\":\"C40 Cities Launches Sixth Youth Design Challenge Across 11 Cities for Extreme Weather\",\"zh-TW\":\"C40 城市氣候領導聯盟啟動第六屆青年城市重塑挑戰，邀 11 城應對極端氣候\"},\"summary\":{\"en\":\"C40 Cities announced the sixth edition of Youth Reinventing Cities, inviting young teams to propose rapid urban designs for 11 cities facing extreme weather. Key takeaway: Participating municipalities seek fast, practical local interventions alongside long-term climate plans.\",\"zh-TW\":\"C40 城市氣候領導聯盟宣布啟動第六屆「青年城市重塑挑戰」，號召青年團隊為 11 座面臨極端天氣的城市提出快速設計方案。關鍵結論：各市盼在既有規劃之外加快落地應變措施，強化脆弱社區韌性。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」C40 城市氣候領導聯盟於 2026 年 11 月 26 日宣布啟動第六屆「青年城市重塑挑戰」，選定包含巴塞隆納、哥本哈根、自由城、雅加達與基多在內的 11 座城市場域，邀請青年團隊針對高溫、洪澇與風暴提出快速都市設計方案。\\n\\n「為什麼重要」極端天氣頻率升高常超越傳統中長期都市計畫節奏，且對低收入與脆弱社區衝擊尤深。透過青年團隊提出貼近場域的解方，有助市府盤點可快速推動的調適措施。\\n\\n「來源異同」C40 官網側重計畫啟動與徵件方向，Holcim Foundation 報導則補充部分入選城市場域與地方首長發言背景。來源標題：「11 cities worldwide call on young people to design rapid urban solutions for extreme weather through the Youth Reinventing Cities challenge」；來源標題：「Youth Reinventing Cities: Sixth Edition | Holcim Foundation」。\\n\\n「仍不確定」各市最終將採納或投入資源推動哪些青年設計方案，仍須視後續評選與地方推動進度而定。\\n\\nTrust label: Multi-source agreement — C40 聯盟與合作基金會皆證實第六屆計畫啟動與 11 城參與資訊。\"},\"glossary\":[{\"term\":{\"en\":\"Climate adaptation\",\"zh-TW\":\"氣候調適\"},\"blurb\":{\"en\":\"Adjustments in natural or human systems in response to actual or expected climate impacts to reduce harm.\",\"zh-TW\":\"針對實際或預期的氣候衝擊調整自然或社會系統，以降低損害並提升承受能力。\"}},{\"term\":{\"en\":\"Urban heat island\",\"zh-TW\":\"都市熱島效應\"},\"blurb\":{\"en\":\"A phenomenon where built-up urban areas retain more heat than surrounding rural areas.\",\"zh-TW\":\"都市建築與鋪面密集導致氣溫高於周邊郊區或自然環境的現象。\"}},{\"term\":{\"en\":\"Nature-based solutions\",\"zh-TW\":\"自然解方\"},\"blurb\":{\"en\":\"Actions that protect, sustainably manage, and restore ecosystems to address societal challenges.\",\"zh-TW\":\"透過保護、永續管理與恢復自然生態系統，來因應環境與社會挑戰的做法。\"}}],\"sources\":[{\"name\":\"C40 Cities\",\"url\":\"https://www.c40.org/news/11-cities-worldwide-call-on-young-people-to-design-rapid-urban-solutions-for-extreme-weather-through-the-youth-reinventing-cities-challenge/\"},{\"name\":\"Holcim Foundation\",\"url\":\"https://www.holcimfoundation.org/news/2026/youth-reinventing-cities-sixth-edition\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"C40 Cities Launches Sixth Youth Design Challenge Across 11 Cities for Extreme Weather\",\"zh-TW\":\"C40 城市氣候領導聯盟啟動第六屆青年城市重塑挑戰，邀 11 城應對極端氣候\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":82,\"trustBreakdown\":{\"crossCorroboration\":23,\"outletReputation\":21,\"recencyClarity\":21,\"sourceDiversity\":17},\"pub
