d directed the Energy Commission of Nigeria (ECN), led by Director-General Mustapha Abdullahi, to partner with the private sector to establish biofuel production facilities nationwide without compromising national food security.\n\nWhy it matters\nJoining GBEP integrates Africa's most populous nation into an international bioenergy framework, supporting Nigeria's energy diversification agenda alongside existing compressed natural gas and electric vehicle initiatives while aiming to lower domestic energy costs and create new local industries.\n\nSource differences\nThe State House, Abuja (\"The State House, Abuja\") published the official presidential release quoting Tinubu's directive to convert membership into investments and affordable energy; TVC News (\"Tinubu Tasks Energy Commission On Local Biofuel Production After Nigeria Joins Global Partnership\") placed the move in the context of the administration's broader green economy and compressed natural gas policies; The Nation Nigeria (\"Tinubu orders accelerated biofuel production to cut energy costs\") emphasized the directive's focus on cutting energy expenses and generating employment.\n\nStill uncertain\nThe government has not yet announced specific capital allocations, target production volumes, or timelines for breaking ground on the proposed private-sector biofuel facilities.\n\nTrust label: Official confirmation — Confirmed via the State House official press release and corroborated by two independent Nigerian news outlets."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-energy-451-nigeria-gbep-biofuel-directive\",\"category\":\"energy\",\"title\":{\"en\":\"Nigeria Joins Global Bioenergy Partnership, Tinubu Orders Domestic Biofuel Push\",\"zh-TW\":\"奈及利亞正式加入全球生質能源夥伴關係，總統提努布下令加速本土生質燃料生產\"},\"summary\":{\"en\":\"President Bola Ahmed Tinubu welcomed Nigeria's admission as a Partner Country of the Global Bioenergy Partnership and directed the Energy Commission of Nigeria to expand domestic biofuel production without harming food security.\",\"zh-TW\":\"奈及利亞正式獲接納為全球生質能源夥伴關係（GBEP）夥伴國，總統波拉·提努布（Bola Ahmed Tinubu）隨即指示奈及利亞能源委員會攜手私部門在全國建置生質燃料設施，並要求確保不危及國家糧食安全。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n奈及利亞總統波拉·提努布（Bola Ahmed Tinubu）於 2026 年 11 月 28 日對奈及利亞正式獲接納為全球生質能源夥伴關係（GBEP）夥伴國表示歡迎，並指示奈及利亞能源委員會（ECN）署長穆斯塔法·阿卜杜拉希（Mustapha Abdullahi）與私部門合作，在不損害國家糧食安全的前提下於全國建置生質燃料生產設施。\\n\\n「為什麼重要」\\n加入 GBEP 使奈及利亞納入國際生質能源合作架構，有助於推進該國自 2023 年以來推動的壓縮天然氣與電動車等多元能源轉型政策，並期望藉此帶動本土再生燃料產業投資與降低民眾用能成本。\\n\\n「來源異同」\\n奈及利亞總統府官網（\\\"The State House, Abuja\\\"）發布官方新聞稿，完整引述提努布要求將會員資格轉化為投資、新興產業與平價能源的指示；TVC News（\\\"Tinubu Tasks Energy Commission On Local Biofuel Production After Nigeria Joins Global Partnership\\\"）將此舉與政府既有的綠色經濟及壓縮天然氣計畫連結；The Nation Nigeria（\\\"Tinubu orders accelerated biofuel production to cut energy costs\\\"）則聚焦於降低能源開支與創造就業的政策目標。\\n\\n「仍不確定」\\n官方目前尚未公布與私部門合建生質燃料設施的具體投資金額、產能目標及動工時程。\\n\\nTrust label: Official confirmation — 依據奈及利亞總統府官方新聞稿並獲兩家當地媒體獨立報導核實。\"},\"glossary\":[{\"term\":{\"en\":\"Global Bioenergy Partnership (GBEP)\",\"zh-TW\":\"全球生質能源夥伴關係（GBEP）\"},\"blurb\":{\"en\":\"An international initiative hosted by the UN Food and Agriculture Organization that promotes sustainable bioenergy development and policy cooperation.\",\"zh-TW\":\"由聯合國糧農組織託管的國際倡議平台，旨在推動永續生質能源發展與跨國政策合作。\"}},{\"term\":{\"en\":\"Energy Commission of Nigeria (ECN)\",\"zh-TW\":\"奈及利亞能源委員會（ECN）\"},\"blurb\":{\"en\":\"The Nigerian federal agency responsible for strategic planning and coordination of national energy policies.\",\"zh-TW\":\"負責奈及利亞國家能源政策戰略規劃與跨部門協調的聯邦專責機構。\"}},{\"term\":{\"en\":\"Biofuel\",\"zh-TW\":\"生質燃料\"},\"blurb\":{\"en\":\"Liquid or gaseous fuels produced from organic biomass materials, used as renewable alternatives to fossil fuels.\",\"zh-TW\":\"由有機生物質材料提煉而成的液態或氣態燃料，可作為傳統化石燃料的再生能源替代方案。\"}}],\"sources\":[{\"name\":\"The State House, Abuja\",\"url\":\"https://statehouse.gov.ng/president-tinubu-welcomes-nigerias-admission-into-global-bioenergy-partnership-
