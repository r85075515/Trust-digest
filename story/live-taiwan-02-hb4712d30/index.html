agreement on November 18, according to CNA. The pact covers academic research in economics and policy analysis. CIER President Lien Hsien-ming said Taiwan's economy faces many challenges as the international situation grows turbulent, and he expressed hope that cooperation between the two institutes will help improve policy research. The dispatch gives no further details on joint projects, funding, or a timetable.\n\nWhy it matters\nTaiwan's economy sits at the centre of global supply-chain and trade disputes, so the quality of its policy research carries real weight for government decisions. A formal pact between the island's leading academic economics institute and its main applied policy think tank puts their researchers on the same footing and should produce analysis that speaks directly to policymakers. The test is whether the agreement yields joint studies and concrete policy proposals rather than a ceremonial signing.\n\nSources agree / disagree\nOnly CNA has reported the signing so far. No other outlet has confirmed the agreement, and no conflicting account has appeared.\n\nStill uncertain\nThe dispatch does not say what joint projects will come first, how the work will be funded, or when results will appear. Those details will only become clear if the institutes publish a work plan or announce joint research.\n\nTrust label: Single source — Only CNA has reported the signing so far, so details beyond its short dispatch remain unconfirmed."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-02-hb4712d30\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-taiwan-02-hb4712d30.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 中研院經濟所與中經院簽署協議　深化經濟研究合作\",\"zh-TW\":\"相關封面圖：中研院經濟所與中經院簽署協議　深化經濟研究合作\"},\"publishedAt\":\"2026-11-18T08:15:26.000Z\",\"title\":{\"en\":\"Academia Sinica and CIER Sign Pact to Deepen Economic Research Cooperation\",\"zh-TW\":\"中研院經濟所與中經院簽署合作協議，深化經濟研究合作\"},\"summary\":{\"en\":\"[Unconfirmed · Single source] Academia Sinica's Institute of Economics and the Chung-Hua Institution for Economic Research (CIER) signed a cooperation agreement in Taipei on November 18 to advance economic research and policy analysis. CIER President Lien Hsien-ming said Taiwan's economy faces many challenges amid global turbulence. The partnership should sharpen policy research; watch for joint studies and policy recommendations.\",\"zh-TW\":\"［未證實·單一來源］中研院經濟所與中經院11月18日在台北簽署合作協議，推動經濟學術研究與政策分析。中經院院長連賢明（Lien Hsien-ming）表示，國際局勢動盪之下，台灣經濟面臨許多挑戰，期許合作有助優化政策研究；接下來看兩所是否提出具體聯合研究與政策建議。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"中研院經濟所與中經院11月18日在台北簽署合作協議，承諾在經濟學術研究與政策分析上密切合作。\\n\\n發生了什麼事\\n中央社報導，兩所今天簽署合作協議，合作範圍涵蓋經濟學術研究與政策分析。中經院院長連賢明（Lien Hsien-ming）表示，國際局勢動盪之下，台灣經濟面臨許多挑戰，期許兩所合作有助優化政策研究。報導沒有提到具體合作計畫、經費或時程。\\n\\n為什麼重要\\n台灣經濟處在全球供應鏈與貿易爭端中心，政策研究的品質直接影響政府決策。學術重鎮與主要政策智庫正式結盟，能讓研究更貼近政策需求。關鍵在於協議能否產出聯合研究與具體政策建議，而不只是簽署儀式。\\n\\n來源異同\\n目前只有中央社報導這場簽署，沒有其他媒體佐證，也沒有出現不同說法。\\n\\n仍不確定\\n報導沒有說明優先合作項目、經費來源與成果發表時間，須等兩所公布工作計畫或聯合研究才會明朗。\"},\"sources\":[{\"name\":\"中央社-產經證券\",\"url\":\"https://www.cna.com.tw/news/afe/202611180222.aspx\"}],\"disagreements\":null,\"trustScore\":59,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"中央社-產經證券\"],\"glossary\":[{\"term\":{\"en\":\"Institute of Economics, Academia Sinica\",\"zh-TW\":\"中央研究院經濟研究所\"},\"blurb\":{\"en\":\"Academia Sinica's economics research institute, one of the two signatories.\",\"zh-TW\":\"中研院的經濟學研究機構，本次協議簽署方之一。\"}},{\"term\":{\"en\":\"Chung-Hua Institution for Economic Research (CIER)\",\"zh-TW\":\"中華經濟研究院\"},\"blurb\":{\"en\":\"Taiwan's main applied economic policy think tank and the other signatory.\",\"zh-TW\":\"台灣主要的應用經濟政策智庫，本次協議另一簽署方。\"}},{\"term\":{\"en\":\"Lien Hsien-ming\",\"zh-TW\":\"連賢明\"},\"blurb\":{\"en\":\"President of CIER, who spoke about the agreement.\",\"zh-TW\":\"中經院院長，代表院方談論本次合作。\"}},{\
