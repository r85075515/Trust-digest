rida, ICIJ media partner Agência Pública reports.\nWhat happened\nRodrigo Martins de Mello and his family are under investigation by Brazil's Federal Police for helping Alexandre Ramagem, the former director of the country's intelligence agency, according to the report. The allegation is that De Mello helped Ramagem flee to Florida. The snippet gives no count of companies or properties, no addresses or values, and no response from De Mello, Ramagem, or Bolsonaro.\nWhy it matters\nThe judgment is about accountability across borders: if the allegation holds, a wanted man allegedly sheltered an intelligence chief while building a business footprint in Florida. That combination of flight, shelter, and property is what makes the case a test of whether Brazilian investigations can reach assets abroad. On a single investigation's reporting, however, it remains an allegation under investigation, not a proven finding.\nSources agree / disagree\nICIJ is the only outlet in the bundle, reporting through media partner Agência Pública, so the allegations have no corroboration here. No conflict is flagged. Trust label: Single source — one investigation reports the allegations, with no corroboration in the bundle.\nStill uncertain\nThe snippet does not state the charges, warrant status, evidence, or the scale of the Florida network, and it records no denial or comment from those named. The key missing information is the Federal Police's evidence and any response from De Mello or Ramagem. Verify the full ICIJ and Agência Pública reporting before treating the shelter allegation as established."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-accountability-01-amazon-mining-boss-wante-h891d403b\",\"category\":\"accountability\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-accountability-01-amazon-mining-boss-wante-h891d403b.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Amazon mining boss wanted by Brazil for sheltering Jair Bolsonaro’s spy chief has businesses, properties in Florida\",\"zh-TW\":\"相關封面圖：亞馬遜礦業老闆因庇護賈爾·博爾索納羅的間諜頭子而被巴西通緝，他在佛羅裡達州擁有企業和房產\"},\"publishedAt\":\"2026-10-29T21:43:47.000Z\",\"title\":{\"en\":\"Rodrigo Martins de Mello: Brazil Wanted Gold Miner Built Florida Businesses, ICIJ Reports\",\"zh-TW\":\"羅德里戈·馬丁斯·德梅洛（Rodrigo Martins de Mello）：巴西通緝的金礦業者在佛羅里達州建立企業與房產網絡\"},\"summary\":{\"en\":\"[Unconfirmed · Single source] Rodrigo Martins de Mello, a Brazilian gold miner wanted for allegedly helping former President Jair Bolsonaro's spy chief flee to Florida, built a network of companies and properties there, ICIJ's media partner Agência Pública reported. De Mello and his family are under investigation by Brazil's Federal Police for helping former intelligence chief Alexandre Ramagem.\",\"zh-TW\":\"［未證實·單一來源］巴西金礦業者羅德里戈·馬丁斯·德梅洛（Rodrigo Martins de Mello）涉嫌協助前總統賈爾·博爾索納羅（Jair Bolsonaro）的情報首長逃往佛羅里達州而遭通緝，並在當地建立企業與房產網絡，Agência Pública 報導。德梅洛（de Mello）與家人正接受巴西聯邦警察調查，涉嫌協助前情報總監拉馬根（Alexandre Ramagem）。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"一名巴西金礦業者涉嫌協助前總統賈爾·博爾索納羅（Jair Bolsonaro）的情報首長逃往佛羅里達州而遭通緝，並已在當地建立企業與房產網絡，ICIJ 媒體合作夥伴 Agência Pública 報導。\\n發生了什麼事\\n報導指出，羅德里戈·馬丁斯·德梅洛（Rodrigo Martins de Mello）與家人正接受巴西聯邦警察調查，涉嫌協助該國前情報總監亞歷山大·拉馬根（Alexandre Ramagem）。指控內容是德梅洛（de Mello）協助拉馬根（Ramagem）逃往佛羅里達州。摘要沒有企業或房產數量，沒有地址或價值，也沒有德梅洛（de Mello）、拉馬根（Ramagem）或博爾索納羅（Bolsonaro）的回應。\\n為什麼重要\\n判斷關乎跨境究責：如果指控成立，一名遭通緝者涉嫌庇護情報首長，同時在佛羅里達州建立商業版圖。逃亡、庇護與房產的組合，讓本案成為巴西調查能否觸及海外資產的考驗。但僅憑單一調查報導，這仍是調查中的指控，不是已經證實的結論。\\n來源異同\\n本批素材只有 ICIJ 一家媒體，透過媒體合作夥伴 Agência Pública 報導，指控沒有其他佐證，也沒有標示衝突。信任標籤：僅1源——單一調查報導這些指控，本批素材中沒有佐證。\\n仍不確定\\n摘要沒有罪名、通緝令狀態、證據或佛羅里達州網絡的規模，也沒有具名人士的否認或評論。缺失的關鍵資訊是聯邦警察的證據，以及德梅洛（de Mello）或拉馬根（Ramagem）的回應。把庇護指控視為既定事實之前，請查閱 ICIJ 與 Agência Pública 的完整報導。\"},\"sources\":[{\"name\":\"ICIJ\",\"url\":\"https://www.icij.org/news/2026/10/amazon-mining-boss-wanted-by-brazil-for-sheltering-jair-bolsonaros-spy-chief-has-businesses-properties-in-florida/\"}],\"disagreements\":null,\"trustScore\":42,\"trustBr
