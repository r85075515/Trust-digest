icial Black Friday sale is now live, running 12 days through Thanksgiving and Black Friday with price cuts across Apple and Google products. The feed reports AirPods Pro 3 and Apple Watch Series 12 at their lowest prices yet, MacBook Neo from $649, AirPods Max 2 down $120 and AirPods Pro 3 at $179. Google's deals include up to $400 off Pixel 11 series phones and $100 off Pixel Watch 5. The headline iPhone 17 Pro Max offer comes from AT\u0026T, while Woot is separately listing refurbished iPhones and Apple Watches from $90.\n\nWhy it matters\nBlack Friday phone deals often hide behind trade-ins or long contracts, so a no-trade-in offer lowers the barrier — but the low monthly figure depends on a new line and an eligible plan, and the true cost sits in the contract term and monthly fee, not the headline number.\n\nSources agree / disagree\n9to5Toys and CNET Deals agree that Amazon's sale is live and that Apple and Google products are discounted, but they cover different items: the AT\u0026T iPhone 17 Pro Max deal appears only in CNET Deals, so that specific offer rests on a single source.\n\nStill uncertain\nThe feed material gives no contract length, monthly fee details or eligibility limits for the AT\u0026T offer, and no full list or end date for the 12-day sale, so shoppers should check AT\u0026T and Amazon directly before buying.\n\nTrust label: Bundled stories — Several Black Friday deals grouped together; the headline iPhone offer has one source."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-shopping-01-here-s-how-to-get-apple-\",\"category\":\"shopping\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-shopping-01-here-s-how-to-get-apple-.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Here’s How to Get Apple’s iPhone 17 Pro Max for Under $15 a Month From AT\u0026#038;T This Black Friday\",\"zh-TW\":\"相關封面圖：（譯文待補）Here’s How to Get Apple’s iPhone 17 Pro Max for Under $15 a Month
