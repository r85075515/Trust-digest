 shared the first official photos from their Saturday, November 21 wedding on Sunday, November 22, confirming the marriage themselves.\nWhat happened\nMiley Cyrus married Maxx Morando on Saturday, November 21 in Palm Springs, California, following nearly five years together; the couple became engaged in December 2025. The bride and groom shared the first official look at the ceremony on Sunday. A related report notes the ceremony was led by Wayne Coyne of The Flaming Lips. Coverage also revisits Cyrus's dating history, including her famous exes and rumored romances from before the Morando relationship.\nWhy it matters\nCyrus is one of pop's most-watched figures, and the wedding closes a five-year relationship arc that fans have followed since the couple went public. The dating-history retrospectives landing alongside the wedding photos show how the story is being sold: not just a ceremony, but the end of a long public romantic timeline. The takeaway is simple, the wedding is confirmed by the couple themselves, with photos, a day after the ceremony.\nSources agree-disagree\nBillboard, Rolling Stone, Just Jared and the BBC all report the same wedding on the same date, with no contradictions on the core facts. The only wrinkle is dating: some snippets cite November 21, the wedding day, and others November 22, the day the photos were shared. That is a difference between event and announcement, not a conflict. Trust label: Multi-source agreement; wedding date and photo date differ across snippets because one is the ceremony and the other the reveal.\nStill uncertain\nFeed summaries give no guest list, no details on the ceremony itself beyond the officiant, and no word on a honeymoon or public celebration. The dating-history framing is a roundup, not new reporting on any past relationship."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-entertainment-01-miley-cyrus-dating-histo\",\"category\":\"entertainment\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-entertainment-01-miley-cyrus-dating-histo.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Miley Cyrus’ Dating History Revealed: Famous Exes \u0026 Rumored Romances Before Maxx Morando Wedding\",\"zh-TW\":\"相關封面圖：麥莉·賽勒斯 (Miley Cyrus) 的約會歷史揭曉：著名前任和 Maxx Morando 婚禮前的傳聞浪漫史\"},\"publishedAt\":\"2026-11-22T22:31:37.000Z\",\"title\":{\"en\":\"Miley Cyrus Marries Maxx Morando in Palm Springs After Nearly Five Years Together\",\"zh-TW\":\"麥莉·賽勒斯與麥克斯·莫蘭多完婚，近五年愛情長跑修成正果\"},\"summary\":{\"en\":\"Pop superstar Miley Cyrus, 33, married musician Maxx Morando, 28, on Saturday, November 21 in Palm Springs, California, after nearly five years together, sharing the first official wedding photos the next day. The couple got engaged in December 2025. Coverage also revisits her dating history, from her famous exes to the rumored romances before Morando.\",\"zh-TW\":\"流行天后麥莉·賽勒斯（Miley Cyrus），33 歲，11 月 21 日星期六在加州棕櫚泉與 28 歲音樂人麥克斯·莫蘭多（Maxx Morando）完婚，兩人交往近五年，隔天公開首批官方婚禮照片。兩人於 2025 年 12 月訂婚。報導同時回顧她交往史上的知名舊愛與傳聞對象。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"流行天后麥莉·賽勒斯（Miley Cyrus），33 歲，11 月 21 日星期六在加州棕櫚泉與 28 歲音樂人麥克斯·莫蘭多（Maxx Morando）完婚，兩人交往近五年，隔天由新人親自公開首批官方婚禮照片。\\n發生了什麼事\\n麥莉·賽勒斯與麥克斯·莫蘭多在交往近五年後，於 11 月 21 日星期六在加州棕櫚泉完婚；兩人 2025 年 12 月訂婚，婚禮隔天公開首批官方照片。相關報導指出，婚禮由火燄唇樂團（The Flaming Lips）的韋恩·柯恩（Wayne Coyne）主持。報導同時回顧賽勒斯的交往史，包括知名舊愛與莫蘭多之前的傳聞對象。\\n為什麼重要\\n賽勒斯是流行樂界最受關注的人物之一，這場婚禮為粉絲追了五年的感情線畫下句點。婚禮照片與交往史回顧同時出爐，說明這則新聞賣的不只是儀式本身，而是一段公開戀情長跑的收尾。重點很單純：婚禮由新人親自以照片證實，就在儀式隔天。\\n來源異同\\n告示牌（Billboard）、滾石（Rolling Stone）、Just Jared、BBC 四家報導的是同一場婚禮、同一日期，核心事實沒有衝突。唯一的小差異是日期：有的摘要寫 11 月 21 日、有的寫 22 日，那是婚禮當天與公開照片當天的差別，不是事實衝突。信任標籤：4源一致；21 日是婚禮、22 日是公開照片，日期差異來自事件與公布的不同。\\n仍不確定\\n摘要未提賓客名單、儀式細節（除主持人外），也沒說蜜月或公開慶祝的安排。交往史回顧屬於整理舊聞，不是針對任何舊情的新報導。\"},\"sources\":[{\"name\":\"Billboard\",\"url\":\"https://www.billboard.com/culture/lifestyle/miley-cyrus-wedding-photos-maxx-morando-1236387483/\"},{\"name\":\"Rolling Stone Music\",\"url\":\"https://www.rollingstone.com/music/music-news/miley-cyrus-maxx-morando-married-springs-wedding-1235662077/\"},{\"name\":\"Just Jared\",\"url\":\"https://www.justjared.com/2026/11/22/miley-cyrus-dating-history-famous-exes-rumored-romances-before-maxx-morando-wedding/\"},{\"name\":\"BBC Entertainment\",\"url\":\"https://www.bbc.co.uk/news/articles/cq8e0p87l89lo?at_medium=RSS\u0026at_campaign=rss\"}],\"disagreements\":{\"en\":\"Figures differ across outlets (e.g. 11.21 vs 22 in headlines/snippets).\",\"zh-TW\":\"不同媒體的數字有所不同（例如，標題/摘要中的數字為 11.21 與 22）。\"},\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":25,\"outletReputation\":15,\"crossCorroboration\":17,\"recencyClarity\":25},\"tags\":[\"entertainment\",\"live-ingest\",\"billboard\",\"rolling-stone-music\",\"just-jared\"],\"glossary\":[{\"term\":{\"en\":\"Miley Cyrus\",\"zh-TW\":\"麥莉·賽勒斯\"},\"blurb\":{\"en\":\"Pop superstar, 33, who married Maxx Morando on November 21.\",\"zh-TW\":\"流行天后，33 歲，11 月 21 日與莫蘭多完婚。\"}},{\"term\":{\"en\":\"Maxx Morando\",\"zh-TW\":\"麥克斯·莫蘭多\"},\"blurb\":{\"en\":\"Musician, 28, Cyrus's husband after nearly five years together.\",\"zh-TW\":\"音樂人，28 歲，與賽勒斯交往近五年後成婚。\"}},{\"term\":{\"en\":\"Wayne Coyne\",\"zh-TW\":\"韋恩·柯恩\"},\"blurb\":{\"en\":\"Frontman of The Flaming Lips, who led the wedding ceremony.\",\"zh-TW\":\"火燄唇樂團主唱，主持這場婚禮。\"}},{\"term\":{\"en\":\"The Flaming Lips\",\"zh-TW\":\"火燄唇樂團\"},\"blurb\":{\"en\":\"American rock band fronted by Wayne Coyne.\",\"zh-TW\":\"美國搖滾樂團，由韋恩·柯恩領軍。\"}},{\"term\":{\"en\":\"Palm Springs\",\"zh-TW\":\"棕櫚泉\"},\"blurb\":{\"en\":\"California desert city where the wedding took place.\",\"zh-TW\":\"加州沙漠城市，婚禮舉辦地。\"}},{\"term\":{\"en\":\"Billboard\",\"zh-TW\":\"告示牌\"},\"blurb\":{\"en\":\"US music outlet that published the wedding photos story.\",\"zh-TW\":\"刊出婚禮照片報導的美國音樂媒體。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>
