g on the four-part format, the Apple TV home and Jackson's participation.\n\nWhy it matters\nTimberlake is revisiting the two controversies that have defined public arguments about his career for two decades. A docuseries lets him frame those stories in his own voice, but it also invites a fresh round of judgment about what he says, what he leaves out, and who else gets to speak.\n\nSources agree-disagree\nBillboard, Rolling Stone and TMZ converge on the same core facts, all tracing back to the Variety report. No conflicting date, episode count or guest name appears in the material provided.\n\nStill uncertain\nThe material provided gives no confirmed December date, no trailer and no word on whether Jackson or Spears speaks on camera beyond Jackson's guest appearance. Until Apple TV confirms details, the scope of the series remains reported, not announced.\n\nTrust label: Multi-source agreement"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-entertainment-01-justin-timberlake-docuse\",\"category\":\"entertainment\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-entertainment-01-justin-timberlake-docuse.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Justin Timberlake Docuseries: Janet Jackson Talks Super Bowl, He Addresses Ex Britney Spears\",\"zh-TW\":\"相關封面圖：賈斯汀汀布萊克紀錄片系列：珍妮傑克森談論超級碗，他向前布蘭妮斯皮爾斯致辭\"},\"publishedAt\":\"2026-11-03T01:30:36.000Z\",\"title\":{\"en\":\"Justin Timberlake plans four-part Apple TV docuseries with Janet Jackson\",\"zh-TW\":\"賈斯汀·汀布萊克籌備四集 Apple TV 紀錄片，珍妮·傑克森參與\"},\"summary\":{\"en\":\"Pop star Justin Timberlake is making a four-part tell-all docuseries for Apple TV, Variety reported Monday, November 2, with Janet Jackson appearing as a guest. The series will revisit the 2004 Super Bowl halftime show and his past relationship with Britney Spears. Watch for a December date and a trailer to confirm the scope.\",\"zh-TW\":\"流行歌手賈斯汀·汀布萊克（Justin Timberlake）正在為 Apple TV 製作四集自白式紀錄片，Variety 於 11 月 2 日週一報導，珍妮·傑克森（Janet Jackson）將擔任嘉賓。系列將回顧 2004 年超級盃中場表演，以及他與布蘭妮·斯皮爾斯（Britney Spears）的舊情。接下來看 12 月檔期與預告片是否確認全貌。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"發生了什麼事\\n流行歌手賈斯汀·汀布萊克（Justin Timberlake）正在為 Apple TV 製作四集自白式紀錄片，Variety 於 11 月 2 日週一報導，珍妮·傑克森（Janet Jackson）將擔任嘉賓。據報導，這部作品預計 12 月在串流平台上線，截稿時除了討論主題外沒有更多細節。四集系列將涵蓋 2004 年與傑克森同台中場表演時惡名昭彰的「服裝故障」事件，汀布萊克也會談及與布蘭妮·斯皮爾斯（Britney Spears）的舊情。Billboard、Rolling Stone 與 TMZ 都跟進了 Variety 的報導，對四集形式、Apple TV 平台與傑克森參與的說法一致。\\n\\n為什麼重要\\n汀布萊克正在重訪二十年來定義外界對他職業生涯爭論的兩起事件。紀錄片讓他能用自己的聲音框定這些故事，但也會引來新一輪檢視：他說了什麼、略過什麼，以及還有誰能發聲。\\n\\n來源異同\\nBillboard、Rolling Stone 與 TMZ 的核心事實一致，都追溯到 Variety 的報導。提供的材料中沒有相互衝突的日期、集數或嘉賓姓名。\\n\\n仍不確定\\n提供的材料沒有確認的 12 月日期、沒有預告片，也沒有說明除了傑克森擔任嘉賓之外，傑克森或斯皮爾斯是否會在鏡頭前發言。在 Apple TV 確認細節之前，這部系列的規模仍屬報導階段，而非官方宣布。\"},\"sources\":[{\"name\":\"Billboard\",\"url\":\"https://www.billboard.com/music/music-news/justin-timberlake-docuseries-janet-jackson-apple-tv-1236372543/\"},{\"name\":\"Rolling Stone Music\",\"url\":\"https://www.rollingstone.com/music/music-news/justin-timberlake-docuseries-janet-jackson-super-bowl-1235651589/\"},{\"name\":\"TMZ\",\"url\":\"https://www.tmz.com/2026/11/02/justin-timberlake-docuseries-will-discuss-janet-jackson-and-britney-spears/\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":20,\"outletReputation\":15,\"crossCorroboration\":22,\"recencyClarity\":25},\"tags\":[\"entertainment\",\"live-ingest\",\"billboard\",\"rolling-stone-music\",\"tmz\"],\"glossary\":[{\"term\":{\"en\":\"Justin Timberlake\",\"zh-TW\":\"賈斯汀·汀布萊克\"},\"blurb\":{\"en\":\"US pop star making the docuseries.\",\"zh-TW\":\"製作這部紀錄片的美國流行歌手。\"}},{\"term\":{\"en\":\"Janet Jackson\",\"zh-TW\":\"珍妮·傑克森\"},\"blurb\":{\"en\":\"US singer appearing as a guest.\",\"zh-TW\":\"擔任嘉賓的美國歌手。\"}},{\"term\":{\"en\":\"Britney Spears\",\"zh-TW\":\"布蘭妮·斯皮爾斯\"},\"blurb\":{\"en\":\"US pop star and Timberlake's former partner.\",\"zh-TW\":\"美國流行歌手，汀布萊克的前伴侶。\"}},{\"term\":{\"en\":\"Apple TV\",\"zh-TW\":\"Ap
