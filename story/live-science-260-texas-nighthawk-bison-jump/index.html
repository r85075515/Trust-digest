n the Texas Panhandle, identifying bone beds and artifacts from at least seven large-scale communal bison hunting events spanning approximately 3,000 years. Published in the journal American Antiquity, the findings make Nighthawk only the second confirmed buffalo jump ever discovered in Texas, after decades in which steep cliff erosion obscured evidence beneath canyon slopes.\n\n「Why it matters」\nBison jumps required coordinated planning among large groups to stampede herds over cliffs, supporting food security, trade, and ceremonial gatherings. Proving repeated use over three millennia reshapes archaeological understanding of Indigenous social organization and land stewardship across the Southern Plains.\n\n「Source differences」\nCambridge University Press published the peer-reviewed paper \"The Nighthawk Bison Jump: New Evidence for Recurrent Late Holocene Bison Jumping in the Southern Plains\", presenting the geoarchaeological stratigraphy and radiocarbon dating evidence. Smithsonian Magazine published \"Indigenous Hunters Drove Bison Off This Tall Cliff for 3,000 Years. It's Only the Second Buffalo Jump Ever Discovered in Texas\", highlightinglead author August Costa's (August Costa) explanation of communal social gatherings and why cliff erosion had hidden the site.\n\n「Still uncertain」\nResearchers note that steep terrain and limited access to adjacent private land mean additional undiscovered bison jump sites may still exist along the Caprock Escarpment.\n\nTrust label: Official confirmation — Peer-reviewed journal publication by Cambridge University Press is corroborated by independent science journalism."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-science-260-texas-nighthawk-bison-jump\",\"category\":\"science\",\"title\":{\"en\":\"3,000-Year-Old Indigenous Bison Jump Discovered in Texas Panhandle\",\"zh-TW\":\"考古學家在德州狹長地帶發現跨越三千年的原住民野牛跳崖狩獵遺址\"},\"summary\":{\"en\":\"Archaeologists led by Rice University uncovered the Nighthawk bison jump in Texas's Caprock Canyons State Park, documenting at least seven communal bison hunting events spanning roughly 3,000 years. Published in American Antiquity, the study challenges assumptions that cliff-drive hunting was largely absent from the Southern Plains.\",\"zh-TW\":\"由萊斯大學（Rice University）領軍的考古團隊在德州卡普羅克峽谷州立公園發現名為「Nighthawk」的古代野牛跳崖遺址，證實原住民曾在此進行跨越約3,000年、至少七次的集體驅趕野牛跳崖狩獵。這項發表於《美國古物》期刊的研究，打破學界過去認為南部大平原缺乏此類大型集體狩獵設施的假設。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n由萊斯大學（Rice University）人類學家奧古斯特・科斯塔（August Costa）領軍的地質考古團隊，在德州狹長地帶的卡普羅克峽谷州立公園內確認了「Nighthawk」野牛跳崖遺址，出土了跨越約3,000年、至少七次大規模集體野牛狩獵事件的骨骼層與器物。該研究發表於學術期刊《美國古物》（American Antiquity），使 Nighthawk 成為德州史上僅有的第二座獲證實的野牛跳崖遺址，也解釋了懸崖侵蝕與陡坡地形為何讓該遺址長期隱沒。\\n\\n「為什麼重要」\\n野牛跳崖狩獵需要龐大群體嚴密協作，將野牛群驅趕墜落懸崖，不僅提供糧食與物資，也凝聚貿易與儀式聚會。證實同一地點在三千年間反覆使用，改寫了考古學界對北美南部大平原原住民社會組織與土地利用歷史的認知。\\n\\n「來源異同」\\n劍橋大學出版社（Cambridge University Press）刊出同儕審查論文「The Nighthawk Bison Jump: New Evidence for Recurrent Late Holocene Bison Jumping in the Southern Plains」，提出晚全新世地層學與放射性碳定年數據。《史密森尼雜誌》（Smithsonian Magazine）則以「Indigenous Hunters Drove Bison Off This Tall Cliff for 3,000 Years. It's Only the Second Buffalo Jump Ever Discovered in Texas」為題報導，引述第一作者奧古斯特・科斯塔（August Costa）說明集體狩獵的社群交流功能，以及懸崖侵蝕使跳崖點後退約一座美式足球場長度的現象。\\n\\n「仍不確定」\\n研究人員指出，由於當地懸崖坡度陡峭且鄰近私人土地調查受限，卡普羅克斷崖沿線是否還埋藏更多尚未發現的古代野牛跳崖遺址，仍有待未來擴大勘查。\\n\\nTrust label: Official confirmation — 劍橋大學出版社同儕審查學術論文與獨立科學媒體報導互相印證。\"},\"glossary\":[{\"term\":{\"en\":\"Bison Jump\",\"zh-TW\":\"野牛跳崖遺址\"},\"blurb\":{\"en\":\"A cliff formation historically used by Indigenous hunters to stampede and harvest large herds of bison in a coordinated communal drive.\",\"zh-TW\":\"北美原住民過去利用懸崖地形，透過集體圍獵將野牛群驅趕墜崖以獲取食物與物資的狩獵遺址。\"}},{\"term\":{\"en\":\"Geoarchaeology\",\"zh-TW\":\"地質考古學\"},\"blurb\":{\"en\":\"A field combining earth science methods such as soil stratigraphy and erosion analysis with archaeology to interpret ancient human sites.\",\"zh-TW\":\"結合土壤地層學、侵蝕分析等地球科學方法與考古學，以重建古代人類活動環境的跨領域學科。\"}},{\"term\":{\"en\":\"Late Holocene\",\"zh-TW\":\"晚全新世\"},\"blurb\":{\"en\":\"The most recent subdivision of the Holocene epoch, spanning roughly the last 4,200 years of Earth's history.\",\"zh-TW\":\"地質年代全新世的最晚期階段，大約涵蓋距今約4,200年前至今的時期。\"}}],\"sources\":[{\"name\":\"Smithsonian Magazine\",\"url\":\"https://www.smithsonianmag.com/smart-news/indigenous-hunters-drove-bison-off-a-cliff-for-3000-years-its-only-the-second-buffalo-jump-ever-discovered-in-texas-180989941/\"},{\"name\":\"Cambridge University Press\",\"url\":\"https://www.cambridge.org/core/journals/american-antiquity/article/nighthawk-bison-jump-new-evidence-for-recurrent-late-holocene-bison-jumping-in-the-southern-plains/0BDB045A430331AFB2144751F0EEE1A0\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"3,000-Year-Old Indigenous Bison Jump Discovered in Texas Panhandle\",\"zh-TW\":\"考古學家在德州狹長地帶發現跨越三千年的原住民野牛跳崖狩獵遺址\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":92,\"trustBreakdown\":{\"crossCorroboration\":24,\"outletReputation\":24,\"recencyClarity\":21,\"sourceDiversity\":23},\"publishedAt\":\"2026-11-27T22:39:49.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":24,\"D2\":24,\"D3\":23,\"D4\":23,\"D5\":22,\"total\":23},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-science-260-texas-nighthawk-bison-jump/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:desc
