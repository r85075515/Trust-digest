en Yulin and Melody taking the variety show host prize for ‘11 PM Hot Talk.’\nWhat happened\nThe ceremony was delayed from its original date when Typhoon Qiangpi disrupted plans, and was held on the 25th instead. Public Television’s stop-motion animation ‘I Am Chen Paipai’ swept three awards, while veteran director Liu Song used the night to defend the value of public television. Shen Yulin, returning after illness, won with Melody and spoke about what matters most when the applause fades: having friends who stay with you. Banana Brother (香蕉哥哥) won the children’s program host award, capping a 16-year wait described in the coverage.\nWhy it matters\nThe judgment is that this year’s ceremony mattered less for any single trophy than for the fact that it happened at all: a typhoon-delayed, rain-soaked night still produced a full celebration of Taiwan’s program makers. The through-line of the evening, from a stop-motion underdog to a veteran host’s comeback, was persistence — the same quality the ceremony exists to reward.\nSources agree / disagree\nPublic Television News, Yahoo Taiwan Entertainment, Vogue Taiwan, ETtoday and other Taiwanese outlets agree on the main winners. The ingest note about figures differing (3 versus 16) is not a conflict: 3 is the number of awards won by ‘I Am Chen Paipai,’ and 16 is the number of years Banana Brother waited for his win, so the two numbers describe different things and are presented in parallel. Trust label: Multi-source agreement — multiple Taiwanese outlets agree on the main results.\nStill uncertain\nThe snippets do not carry the full winners list, and they disagree in fragments over whether Banana Brother appeared on stage, so this digest does not adopt any single account of his whereabouts. Side items from the same night, including first-time host Chen Handian’s reception, are part of the same ceremony and are not treated as separate stories."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-eastAsiaGossip-01-61-11-line-today\",\"category\":\"eastAsiaGossip\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-eastAsiaGossip-01-61-11-line-today.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 金鐘61／節目類完整得獎名單！《週末最強大》奪綜藝節目獎 沈玉琳《11點熱吵店》獲綜藝節目主持人 幽默喊：我要感謝醫師 - LINE TODAY\",\"zh-TW\":\"相關封面圖：金鐘61／節目類完整得獎名單！《週末最強大》奪綜藝節目獎 沈玉琳《11點熱吵店》獲綜藝節目主持人 幽默喊：我要感謝醫師 - LINE TODAY\"},\"publishedAt\":\"2026-10-26T06:25:00.000Z\",\"title\":{\"en\":\"Golden Bell Awards 61: ‘Weekend’s Strongest’ Takes Variety Prize as Delayed Ceremony Goes Ahead\",\"zh-TW\":\"金鐘61節目類頒獎：《週末最強大》奪綜藝節目獎，沈玉琳、Melody 奪主持人獎\"},\"summary\":{\"en\":\"The 61st Golden Bell Awards ceremony, delayed by a typhoon, was held on October 25, with ‘Weekend’s Strongest’ winning the variety show prize and Shen Yulin and Melody winning variety show host for ‘11 PM Hot Talk.’ Public Television’s stop-motion animation ‘I Am Chen Paipai’ swept three awards. The takeaway: a storm-delayed night delivered a celebration of Taiwan’s television makers.\",\"zh-TW\":\"第 61 屆金鐘獎節目類頒獎典禮因颱風薔琵改期，延至 25 日舉行；《週末最強大》奪下綜藝節目獎，沈玉琳與 Melody 以《11點熱吵店》奪主持人獎，公視停格動畫《我是陳派派》橫掃三獎。結論是：風雨改期沒有澆熄電視人的熱情，典禮照常完成，電視人的堅持成了當晚主調。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"台灣電視圈的夜晚終究還是來了：第 61 屆金鐘獎節目類頒獎典禮因颱風薔琵改期，延至 25 日舉行；《週末最強大》奪下綜藝節目獎，沈玉琳與 Melody 以《11點熱吵店》奪主持人獎。\\n發生了什麼事\\n典禮原訂日期因颱風薔琵攪局而延後，改在 25 日舉行。公視停格動畫《我是陳派派》橫掃三獎，資深導演劉嵩在當晚感性捍衛公視價值。沈玉琳走過病痛挑戰後奪獎，感言提到「人生最值得珍惜的，是掌聲消失後，還有朋友願意陪伴你」。香蕉哥哥奪下兒少節目主持人獎，報導稱這一等就是 16 年。\\n為什麼重要\\n判斷是：今年典禮的意義不在任何單一獎座，而在於它終究辦成了——一場因颱風改期、風雨中的夜晚，依然完整慶祝了台灣的節目製作者。從停格動畫黑馬到資深主持人的復出，當晚的主調都是堅持，而這正是金鐘獎存在的理由。\\n來源異同\\n公視新聞網、Yahoo 台灣娛樂、Vogue Taiwan、ETtoday 等多家台媒對主要得獎名單說法一致。原始素材標註的數字差異（3 與 16）不是衝突：3 是《我是陳派派》的得獎數，16 是香蕉哥哥等了 16 年，兩者指涉不同事項，並列呈現。信任標籤：N源一致——多家台媒對主要結果說法一致。\\n仍不確定\\n片段沒有完整得獎名單，且各家片段對香蕉哥哥是否現身台上說法不一，本卡不採信任何單一說法。同一晚的花絮，包括首度扛主持的陳漢典獲得的評價，都屬於同一場典禮，不另立為其他事件。\"},\"sources\":[{\"name\":\"公視新聞網\",\"url\":\"https://news.pts.org.tw/article/832925\"},{\"name\":\"Google News\",\"url\":\"https://news.google.com/rss/artic
