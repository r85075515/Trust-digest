ed\nWired reports that both YouTube Music and Spotify are pushing AI DJs — synthetic hosts that talk between songs and curate playlists. The essay's verdict is blunt: the hosts' awkward banter and made-up song trivia kill the groove, turning a service meant to set the mood into one that breaks it.\nWhy it matters\nPlaylist curation is the core of a streaming service, and both companies are betting that AI hosts can make it feel personal. If listeners experience the hosts as intrusive rather than charming, the feature becomes a reason to switch off — a reminder that taste is the hardest thing to automate.\nSources agree / disagree\nOnly Wired has covered this essay in this digest so far, and it is a first-person critique rather than a straight news report. Trust label: Single source — one outlet's opinion piece, with no corroborating coverage yet.\nStill uncertain\nThe feed description gives no listener numbers, no company response, and no detail on how widely the AI hosts have rolled out. Verify details in the full Wired piece before quoting it."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-ai-02-ai-djs-completely-kill-m\",\"category\":\"ai\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-ai-02-ai-djs-completely-kill-m.jpg\",\"imageAlt\":{\"en\":\"Cover related to: AI DJs Completely Kill My Groove\",\"zh-TW\":\"相關封面圖：AI DJ 徹底消滅我的音樂風格\"},\"publishedAt\":\"2026-11-15T12:00:00.000Z\",\"title\":{\"en\":\"YouTube Music and Spotify AI DJs Are Killing the Groove, Wired Argues\",\"zh-TW\":\"YouTube Music 與 Spotify 的 AI DJ 毀了聽歌氣氛\"},\"summary\":{\"en\":\"YouTube Music and Spotify want synthetic hosts to curate your playlists, but Wired argues their awkward banter and bogus song trivia are ruining the vibe. The piece is a first-person critique, not a product review — and it lands a broader point: AI curation still can't read the room.\",\"zh-TW\":\"YouTube Music 與 Spotify 想讓合成主持人幫你排播放清單，但《連線》（Wired）認為，尷尬的閒聊與胡編的歌曲冷知識正在毀掉氣氛。這篇是第一人稱評論，不是產品評測——它點出一個更大的問題：AI 排歌還是不懂看場合。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"YouTube Music 與 Spotify 想讓合成主持人幫你排播放清單，但《連線》（Wired）一篇第一人稱文章直言：尷尬的閒聊與胡編的歌曲冷知識，反而毀了聽歌的氣氛。\\n發生了什麼事\\n《連線》報導，YouTube Music 與 Spotify 都在推 AI DJ——在歌曲之間說話、幫忙排歌的合成主持人。文章的結論很直接：主持人尷尬的對話與編造的歌曲資訊破壞了節奏，讓本來要營造氣氛的服務變成掃興的來源。\\n為什麼重要\\n排歌是串流服務的核心，兩家公司都押注 AI 主持人能讓體驗更有人味。聽眾若覺得主持人煩人而非討喜，這功能反而成了關掉的理由——品味是最難自動化的東西。\\n來源異同\\n目前只有《連線》收錄這篇文章，且是第一人稱評論而非純新聞報導。信任標籤：僅1源——一家媒體的觀點文章，尚無其他報導佐證。\\n仍不確定\\n摘要沒有聽眾數據、沒有公司回應，也沒有 AI 主持人推行範圍的細節。引用前請查閱《連線》的完整文章。\"},\"sources\":[{\"name\":\"Wired AI\",\"url\":\"https://www.wired.com/story/ai-djs-completely-kill-my-groove/\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":18,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"ai\",\"live-ingest\",\"wired-ai\"],\"glossary\":[{\"blurb\":{\"en\":\"Google's music streaming service, pushing synthetic AI hosts.\",\"zh-TW\":\"Google 的音樂串流服務，正在推合成 AI 主持人。\"},\"term\":{\"en\":\"YouTube Music\",\"zh-TW\":\"YouTube Music\"}},{\"blurb\":{\"en\":\"Music streaming service using synthetic hosts to curate playlists.\",\"zh-TW\":\"音樂串流服務，用合成主持人幫忙排播放清單。\"},\"term\":{\"en\":\"Spotify\",\"zh-TW\":\"Spotify\"}},{\"blurb\":{\"en\":\"Technology magazine that published the first-person critique.\",\"zh-TW\":\"科技雜誌，刊登這篇第一人稱評論。\"},\"term\":{\"en\":\"Wired\",\"zh-TW\":\"《連線》（Wired）\"}},{\"blurb\":{\"en\":\"Synthetic host that talks between songs and curates playlists.\",\"zh-TW\":\"在歌曲之間說話、幫忙排歌的合成主持人。\"},\"term\":{\"en\":\"AI DJ\",\"zh-TW\":\"AI DJ\"}},{\"blurb\":{\"en\":\"Curated list of songs that the AI hosts arrange for listeners.\",\"zh-TW\":\"由 AI 主持人為聽眾安排的歌曲清單。\"},\"term\":{\"en\":\"Playlist\",\"zh-TW\":\"播放清單\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next
