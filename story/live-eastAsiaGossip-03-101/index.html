ia Yung-chieh, Sun published his disability certificate when online critics accused him of faking a disability for attention.\nWhat happened\nSun visited Taipei 101 in a wheelchair and posted criticism of its accessibility, saying the mall's chairwoman should take responsibility for improving it. The post drew mixed reactions online, and some commenters accused him of staging the complaint and pretending to be disabled. Sun responded by publishing proof of his disability status and saying he was leaving the criticism behind to go on vacation.\nWhy it matters\nThe episode shows the cost of complaining about access in public: a substantive grievance about a landmark building was quickly overtaken by doubts about the complainant himself. If Taipei 101 answers the facilities criticism, the story becomes a test of the building's accessibility; if it stays silent, the personal spat is all readers will remember.\nSources agree-disagree\nETtoday and Yahoo Taiwan agree on the sequence: wheelchair visit, public criticism of Taipei 101, naming of Chia Yung-chieh, 'fake disability' accusations, and Sun's publication of his certificate. No numeric or name conflicts appear across the three feed items. Trust label: Two-source agreement. Both outlets tell the same story with the same turning points.\nStill uncertain\nThe feed summaries do not describe which facilities Sun found unfriendly, whether Taipei 101 has responded, or what the certificate itself shows. Without the mall's reply, readers cannot judge whether the accessibility complaint has been addressed."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-eastAsiaGossip-03-101\",\"category\":\"eastAsiaGossip\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-eastAsiaGossip-03-101.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 孫德榮轟101點名賈永婕遭酸「假身障」　氣炸公開證明…飛離台灣\",\"zh-TW\":\"相關封面圖：孫德榮轟101點名賈永婕遭酸「假身障」　氣炸公開證明…飛離台灣\"},\"publishedAt\":\"2026-11-22T06:54:00.000Z\",\"title\":{\"en\":\"Sun De-rong Slams Taipei 101 Accessibility and Shows Disability Certificate After 'Fake Disability' Jabs\",\"zh-TW\":\"孫德榮砲轟台北101無障礙設施　遭酸「假身障」後公開證明反擊\"},\"summary\":{\"en\":\"Veteran Taiwanese talent manager Sun De-rong, visiting Taipei 101 in a wheelchair, blasted the mall's accessibility and named chairwoman Chia Yung-chieh, then published his disability certificate after online critics accused him of faking a disability. The clash shows how fast an access complaint can turn into a personal attack. Watch whether Taipei 101 responds.\",\"zh-TW\":\"資深經紀人孫德榮（Sun De-rong）坐輪椅到台北101（Taipei 101），發文砲轟商場無障礙設施極不友善，點名董事長賈永婕（Chia Yung-chieh）應盡責管理；遭網友質疑「假身障」作秀後，他公開身障證明反擊，隨後離台度假。無障礙投訴迅速演變成人身攻擊，後續看台北101是否回應。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"資深經紀人孫德榮（Sun De-rong）坐輪椅到台北101（Taipei 101）一趟，把無障礙投訴變成公開論戰，又變成對他本人身分的質疑。他發文砲轟商場無障礙設施極不友善，點名董事長賈永婕（Chia Yung-chieh）應盡責管理；遭網友質疑假冒身障作秀後，他公開身障證明反擊。\\n發生了什麼事\\n孫德榮坐輪椅前往台北101，發文批評商場無障礙設施，要求董事長負責改善。貼文引發正反議論，部分網友指控他為批評而刻意作秀、假冒身障人士。孫德榮隨後公開身障證明反嗆，表示要離台度假，不再理會罵聲。\\n為什麼重要\\n這起風波顯示公開投訴無障礙的代價：對地標商場的實質批評，很快被對投訴者本人的質疑蓋過。台北101若回應設施問題，本案就成為檢驗商場無障礙的案例；若保持沉默，讀者記住的只剩人身爭吵。\\n來源異同\\nETtoday 與雅虎台灣對事件順序一致：輪椅到訪、公開批評台北101、點名賈永婕、遭質疑「假身障」、孫德榮公開證明。三則摘要沒有數字或人名衝突。信任標籤：兩源一致。\\n仍不確定\\n摘要未說明孫德榮認為哪些設施不友善、台北101是否回應、證明內容為何。沒有商場的回覆，讀者無從判斷無障礙投訴是否獲得處理。\"},\"sources\":[{\"name\":\"ETtoday 影劇\",\"url\":\"https://star.ettoday.net/news/3276511\"},{\"name\":\"Yahoo TW 娛樂\",\"url\":\"https://tw.news.yahoo.com/%E6%89%B9%E5%8F%B0%E5%8C%97101%E5%8F%AA%E6%9C%83%E6%94%BE%E7%85%99%E7%81%AB-%E5%AD%AB%E5%BE%B7%E6%A6%AE%E9%81%AD%E9%85%B8-%E5%81%87%E8%BA%AB%E9%9A%9C-%E6%80%92%E5%85%AC%E9%96%8B%E8%BA%AB%E9%9A%9C%E8%AD%89%E6%98%8E%E5%8F%8D%E6%93%8A-080540888.html\"}],\"disagreements\":null,\"trustScore\":70,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":17,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"eastAsiaGossip\",\"live-ingest\",\"region:tw\",\"ettoday-影劇\",\"yahoo-tw-娛樂\",\"yahoo-tw-娛樂\"],\"region\":\"tw\",\"glossary\":[{\"term\":{\"en\":\"Sun De-rong\",\"zh-TW\":\"孫德榮\"},\"blurb\":{\"en\":\"Veteran Taiwanese talent manager who criticised Taipei 101's accessibility.\",\"zh-TW\":\"批評台北101無障礙設施的資深經紀人。\"}},{\"term\":{\"en\":\"Chia Yung-chieh\",\"zh-TW\":\"賈永婕\"},\"blurb\":{\"en\":\"Chairwoman of Taipei 101 named in Sun's criticism.\",\"zh-TW\":\"被孫德榮點名要求負責的台北101董事長。\"}},{\"term\":{\"en\":\"Taipei 101\",\"zh-TW\":\"台北101\"},\"blurb\":{\"en\":\"Taipei landmark mall whose accessibility Sun criticised.\",\"zh-TW\":\"被孫德榮批評無障礙設施的台北地標商場。\"}},{\"term\":{\"en\":\"ETtoday\",\"zh-TW\":\"ETtoday\"},\"blurb\":{\"en\":\"Taiwanese news outlet that reported Sun's criticism.\",\"zh-TW\":\"報導孫德榮批評的台灣新聞媒體。\"}},{\"term\":{\"en\":\"Yahoo Taiwan\",\"zh-TW\":\"雅虎台灣\"},\"blurb\":{\"en\":\"Taiwanese news portal that reported Sun's response.\",\"zh-TW\":\"報導孫德榮反擊的台灣新聞入口網站。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-eastAsiaGossip-03-101/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-eastAsiaGossip-03-101/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"conte
