 during a performance in Chicago, turning the joke back on the doubters.\nWhat happened\nDuring a performance at the United Center in Chicago over the weekend of November 21, Wonder paused between songs, sat behind his piano, and addressed the conspiracy theories with a laugh. \"Get in the car with me and we'll see,\" he told the crowd, inviting anyone who believes he can see to ride along with him. Billboard reported the moment, noting that Wonder has seen and heard all the jokes and rumours about his blindness over the years.\nWhy it matters\nThe moment matters because the rumour has followed one of music's most famous figures for decades, and Wonder chose to answer it in person, on stage, with humour rather than anger. For fans, it was a reminder of the performer's command of a live room; for the wider conversation, it shows how even baseless conspiracy theories can shadow a public figure indefinitely.\nSources agree / disagree\nBillboard is the only source in the material that covers Wonder's remarks; the other item in the bundle, a Guardian piece about internet outages and conspiracy theories, is an unrelated story. No other outlet in the material corroborates the quote, though the event is described as a live performance with an audience present. Trust label: Single source — Only Billboard reported Wonder's on-stage remarks in the material supplied.\nStill uncertain\nThe material does not include a full transcript of Wonder's remarks — the supplied account cuts off mid-sentence — nor any audience video or independent account of the moment. The exact wording beyond the headline quote cannot be confirmed from the material supplied."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-entertainment-02-stevie-wonder-addresses-\",\"category\":\"entertainment\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-entertainment-02-stevie-wonder-addresses-.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Stevie Wonder Addresses Conspiracy Theories About His Blindness: ‘Get in the Car With Me \u0026 We’ll See’\",\"zh-TW\":\"相關封面圖：史蒂夫·旺德談到有關他失明的陰謀論：“和我一起上車，我們會看到的”\"},\"publishedAt\":\"2026-11-24T00:16:05.000Z\",\"title\":{\"en\":\"Stevie Wonder Mocks Blindness Conspiracy Theories at Chicago Concert\",\"zh-TW\":\"史提夫·汪達（Stevie Wonder）在芝加哥演唱會笑談失明陰謀論\"},\"summary\":{\"en\":\"[Unverified, single source] American singer Stevie Wonder, playing piano for a Chicago crowd, laughed off conspiracy theories claiming he is not really blind. Performing at the United Center on November 21, he invited doubters to get in the car with him and see for themselves. The joke shows decades of fame have not stopped the rumours — or his laughter.\",\"zh-TW\":\"［未證實·單一來源］美國傳奇歌手史提夫·汪達（Stevie Wonder）在芝加哥演出時，笑談外界質疑他並非真正失明的陰謀論。他 11 月 21 日在聯合中心（United Center）彈著鋼琴，邀請懷疑者「跟我上車，親眼看看」。這番玩笑顯示，數十年盛名仍擋不住謠言，但他選擇一笑置之。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"史提夫·汪達（Stevie Wonder）聽過各種「他其實看得見」的謠言，而他選擇一笑置之。這位歌手在芝加哥演出時公開回應有關他失明的陰謀論，把玩笑丟回給懷疑者。\\n發生了什麼事\\n11 月 21 日週末，史提夫·汪達（Stevie Wonder）在芝加哥聯合中心（United Center）演出，歌曲之間坐在鋼琴前，笑著回應陰謀論。他對觀眾說，懷疑他看得見的人可以「跟我上車，親眼看看」。告示牌（Billboard）報導了這一刻，並指出汪達多年來聽過各種關於他失明的玩笑與謠言。\\n為什麼重要\\n這一刻值得注意，因為相關謠言跟隨這位樂壇傳奇人物數十年，而汪達選擇在舞台上親自以幽默回應，而非憤怒。對歌迷而言，這展現了他掌控現場的功力；對公眾討論而言，則顯示即使毫無根據的陰謀論，也可能長期纏繞一位公眾人物。\\n來源異同\\n素材中僅有告示牌（Billboard）報導汪達的發言；同一批素材中另一則衛報（The Guardian）關於網路斷線與陰謀論的報導屬於無關事件。素材中沒有其他媒體佐證這段引言，但報導稱這是現場演出的公開時刻。信任標籤：僅1源——本卡主線僅有單一媒體報導，且引文未附完整逐字稿。\\n仍不確定\\n素材未提供汪達發言的完整逐字稿，內文引言在中途截斷，也未附上觀眾影片或其他獨立紀錄。除了標題中的引言外，確切用詞無法從素材中確認。\"},\"sources\":[{\"name\":\"The Guardian Business\",\"url\":\"https://www.theguardian.com/technology/2026/nov/22/hacks-ai-internet-outages-airlines-banks-microsoft-apple\"},{\"name\":\"Billboard\",\"url\":\"https://www.billboard.com/music/rb-hip-hop/stevie-wonder-conspiracy-theories-blindness-comments-1236388335/\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":21,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"entertainment\",\"live-ingest\",\"the-guardian-business\",\"billboard\"],\"glossary\":[{\"term\":{\"en\":\"Stevie Wonder\",\"zh-TW\":\"史提夫·汪達（Stevie Wonder）\"},\"blurb\":{\"en\":\"Legendary American singer who addressed the rumours on stage.\",\"zh-TW\":\"美國傳奇歌手，在舞台上回應謠言。\"}},{\"term\":{\"en\":\"United Center\",\"zh-TW\":\"聯合中心（United Center）\"},\"blurb\":{\"en\":\"Large arena in Chicago where Wonder performed.\",\"zh-TW\":\"芝加哥大型演出場館，汪達演出的地點。\"}},{\"term\":{\"en\":\"Billboard\",\"zh-TW\":\"告示牌（Billboard）\"},\"blurb\":{\"en\":\"American music publication that reported Wonder's remarks.\",\"zh-TW\":\"美國音樂媒體，報導汪達發言的出處。\"}},{\"term\":{\"en\":\"Conspiracy theory\",\"zh-TW\":\"陰謀論（Conspiracy theory）\"},\"blurb\":{\"en\":\"An unsubstantiated claim that events are secretly plotted.\",\"zh-TW\":\"缺乏根據、指稱事件背後另有陰謀的說法。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-entertainment-02-stevie-wonder-addresses-/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-entertainment-02-stevie-wonder-addresses-/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\
