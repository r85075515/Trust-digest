sted an investigation under Senate Bill 1487 into whether the City of Scottsdale violated Arizona's adaptive reuse law by blocking a proposed 275-unit, five-story apartment conversion. Indianapolis-based developer Milhaus planned the project on the site of a closed bank on Northsight Boulevard west of Loop 101. The dispute centers on Scottsdale applying a 0.25 floor area ratio cap—which the lawmakers criticized as \"backdoor density regulation\"—and calculating density at roughly 26 units per acre across the overall parcel, compared with 57 to 68 units per acre at three neighboring complexes. The Arizona Attorney General's Office has confirmed it will investigate the complaint, while City Attorney Artigue declined to comment beyond a November 25 letter.\n\nWhy it matters\nA formal SB 1487 finding against Scottsdale could jeopardize state-shared revenues if the city refuses to cure an identified violation, testing how strictly Arizona municipalities must follow state-mandated commercial-to-residential adaptive reuse rules.\n\nSource differences\nArizona Republic (azcentral) published the November 27 report \"Scottsdale effort to halt apartment conversion investigated\" covering the lawmakers' SB 1487 filing, the Northsight Boulevard parcel metrics, and City Attorney Artigue's refusal to comment beyond his November 25 letter. The Phoenix Focal (focalnews.org) published \"Arizona AG to investigate Scottsdale's handling of 275-unit apartment project\", matching the details on the Milhaus proposal, the 0.25 floor area ratio dispute, and the Attorney General's confirmation of an upcoming probe.\n\nStill uncertain\nThe investigation remains ongoing; the Arizona Attorney General's Office has not disclosed the exact scope or timeline of its review, no determination of statutory violation has been made, and City Attorney Artigue has declined to comment beyond his November 25 letter.\n\nTrust label: Multi-source agreement — Both Arizona Republic (azcentral) and The Phoenix Focal (focalnews.org) independently report the SB 1487 complaint and the Attorney General's confirmation of an investigation."])</script><script>self.__next_f.push([1,"11:T8ef,"])</script><script>self.__next_f.push([1,"「發生了什麼事」\n亞利桑那州民主黨參議員安娜莉絲・奧提茲（Analise Ortiz）與共和黨眾議員李奧・比亞蘇奇（Leo Biasiucci）於 11 月 24 日依州參議院法案 1487（SB 1487）聯名要求調查，指控斯科茨代爾市（Scottsdale）阻擋一項 275 戶五層樓公寓改建案涉嫌違反州法。該案由印第安納波利斯開發商 Milhaus 規劃於 Loop 101 公路以西 Northsight Boulevard 一處已歇業銀行基地開發；雙方爭點在於市府對州「適應性再利用」（adaptive reuse）規則的解釋，市府套用 0.25 樓地板面積比上限（遭兩位議員批評為「後門管制密度」），並以總宗地面積計算密度約每英畝 26 戶，而鄰近三個社區則為每英畝 57 至 68 戶。亞利桑那州檢察總長辦公室已確認受理並將展開調查，市府律師阿蒂格（Artigue）除 11 月 25 日信件外則表示不予置評（declined to comment）。\n\n「為什麼重要」\n依 SB 1487 法案規定，若州檢察總長最終認定地方政府違反州法且市府未予改正，恐影響其州政府共享稅收分配；本案正考驗亞利桑那州地方政府在商業建築轉住宅的適應性再利用審查上之裁量界線。\n\n「來源異同」\nArizona Republic (azcentral) 於 11 月 27 日刊出「Scottsdale effort to halt apartment conversion investigated」，詳述兩位跨黨派議員提出 SB 1487 申訴、Northsight Boulevard 基地密度計算落差，以及市府律師阿蒂格（Artigue）除 11 月 25 日信件外不予置評的回應；The Phoenix Focal (focalnews.org) 亦以「Arizona AG to investigate Scottsdale's handling of 275-unit apartment project」報導同一事件，雙方在 Milhaus 275 戶開發案規模、0.25 樓地板面積比爭議與檢察總長確認調查等核心事實上完全一致。\n\n「仍不確定」\n本案目前仍處於調查進行階段，州檢察總長辦公室尚未公布調查具體範圍與結案時程，亦未認定斯科茨代爾市府違法；市府方面除 11 月 25 日函文外仍維持不予置評態度。\n\nTrust label: Multi-source agreement — Arizona Republic (azcentral) 與 The Phoenix Focal (focalnews.org) 均確認跨黨派議員提出 SB 1487 申訴及州檢察總長將展開調查。"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-arizona-441-scottsdale-ag-1487-investigation\",\"category\":\"arizona\",\"title\":{\"en\":\"Arizona AG to Investigate Scottsdale Over Blocked 275-Unit Apartment Conversion\",\"zh-TW\":\"亞利桑那州檢察總長將調查斯科茨代爾市阻擋 275 戶公寓改建案是否違法\"},\"summary\":{\"en\":\"Following a November 24 SB 1487 complaint from Democratic Sen. Analise Ortiz and Republican Rep. Leo Biasiucci, the Arizona Attorney General's Office confirmed it will investigate whether Scottsdale violated state adaptive reuse law in blocking Milhaus's 275-unit apartment conversion.\",\"zh-TW\":\"亞利桑那州民主黨參議員奧提茲（Analise Ortiz）與共和黨眾議員比亞蘇奇（Leo Biasiucci）於 11 月 24 日依 SB 1487 法案提出聯名申訴後，州檢察總長辦公室已確認將調查斯科茨代爾市（Scottsdale）阻擋 Milhaus 公司 275 戶公寓改建案是否違反州適應性再利用法。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"$11\"},\"glossary\":[{\"term\":{\"en\":\"Senate Bill 1487 (SB 1487)\",\"zh-TW\":\"亞利桑那州參議院法案 1487（SB 1487）\"},\"blurb\":{\"en\":\"An Arizona statute allowing state lawmakers to request an Attorney General investigation into whether a local ordinance or action violates state law, risking state-shared revenues if unresolved.\",\"zh-TW\":\"亞利桑那州法律機制，授權州議員請求州檢察總長調查地方政府法規或行政作為是否牴觸州法，若未改正可能遭扣減州共享稅款。\"}},{\"term\":{\"en\":\"Adaptive reuse\",\"zh-TW\":\"適應性再利用（Adaptive reuse）\"},\"blurb\":{\"en\":\"The conversion of existing commercial, office, or institutional buildings into residential housing under streamlined zoning standards.\",\"zh-TW\":\"將既有商業、辦公或機構建築改造為住宅用途的都市更新與建築轉用模式，適用州法簡化分區審查規範。\"}},{\"term\":{\"en\":\"Floor area ratio (FAR)\",\"zh-TW\":\"樓地板面積比（FAR）\"},\"blurb\":{\"en\":\"The ratio of a building's total floor area to the size of the piece of land upon which it is built, used by municipalities to regulate building bulk and density.\",\"zh-TW\":\"建築物總樓地板面積與基地面積之比值，地方政府常用以管制建築量體與開發密度。\"}}],\"sources\":[{\"name\":\"Arizona Republic (azcentral)\",\"url\":\"https://www.azcentral.com/story/news/metro-phoenix/2026/11/27/arizona-ag-to-see-if-scottsdale-violated-multifamily-housing-law/92949533007/\"},{\"name\":\"The Phoenix Focal (focalnews.org)\",\"url\":\"https://focalnews.org/phoenix-az/politics/arizona-ag-to-investigate-scottsdales-handling-of-275-unit-apartment-project\"}],\"imageUrl\":\"/covers/live/live-arizona-441-scottsdale-ag-1487-investigation.jpg\",\"imageAlt\":{\"en\":\"Arizona AG to Investigate Scottsdale Over Blocked 275-Unit Apartment Conversion\",\"zh-TW\":\"亞利桑那州檢察總長將調查斯科茨代爾市阻擋 275 戶公寓改建案是否違法\"},\"isHeadline\":false,\"isPopular\":true,\"trustScore\":86,\"trustBreakdown\":{\"crossCorroboration\":22,\"outletReputation\":22,\"recencyClarity\":23,\"so
