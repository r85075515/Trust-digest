moving Hegseth from office would have been difficult even if the House had voted to impeach, since conviction requires a Senate trial. An NPR newsletter item bundled with the coverage also noted that the Supreme Court ruled a federal judge did not have authority to halt border wall construction.\n\nWhy it matters\nThe vote tests how far intra-party dissent can go against a sitting defense secretary and shows House Republican leadership closing ranks around Trump's Pentagon chief. The impeachment question is paused, not settled, because Democrats can revive it next year.\n\nSources agree and disagree\nBBC, NPR World and NPR News agree the House blocked the effort for now; NPR's reporting adds the procedural detail that Republicans short-circuited the floor vote. No numeric or factual conflict appears across the three outlets.\n\nStill uncertain\nThe full text of the impeachment articles and the vote margin were not in the feed summaries, and it is unclear when, or whether, Democrats will bring the effort back.\n\nTrust label: Multi-source agreement"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-01-us-house-blocks-bid-to-i\",\"category\":\"international\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"publishedAt\":\"2026-11-11T03:26:42.000Z\",\"title\":{\"en\":\"US House Blocks Bid to Impeach Defense Secretary Pete Hegseth — for Now\",\"zh-TW\":\"美國眾議院暫時擋下彈劾國防部長赫格塞斯的提案\"},\"summary\":{\"en\":\"The US House blocked, for now, a bid to impeach Defense Secretary Pete Hegseth, with Republicans short-circuiting a floor vote on the effort led by Representative Thomas Massie. President Trump praised Hegseth afterward, but Democrats can try again next year. Watch whether the challenge resurfaces.\",\"zh-TW\":\"美國眾議院暫時擋下彈劾國防部長赫格塞斯的提案，共和黨以程序投票阻止全院表決，提案由肯塔基州眾議員馬西發起。川普隨後稱讚赫格塞斯是「偉大的美國愛國者」，但民主黨明年可以捲土重來，接下來看挑戰是否再起。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"美國眾議院暫時擋下彈劾國防部長赫格塞斯（Pete Hegseth）的提案，共和黨以程序投票阻止全院表決。川普（Donald
