C 51407-841-05, Lot GS069303, expiration date 01/2030) after identifying potential aluminum particulate contamination measuring 0.01 to 0.10 millimeters localized on the tablet surfaces. The U.S. Food and Drug Administration (FDA) posted the safety notice, instructing patients to stop taking tablets from the affected lot and return unused portions to their pharmacy.\n\nWhy it matters\nPrescription-strength 800mg ibuprofen is widely prescribed for osteoarthritis, rheumatoid arthritis, and moderate pain, and continued ingestion of metallic particulates can cause minor irritation or abrasion of the stomach and intestinal linings. While regulators noted that the likelihood of a serious adverse event is remote given the microscopic particle size, targeted lot-level recalls prevent prolonged gastrointestinal exposure among chronic pain patients.\n\nSource differences\nThe FDA's official recall notice \"Golden State Medical Supply, Inc. Issues a Voluntary Nationwide Recall of Ibuprofen 800mg Tablets Due to Potential Aluminum Particulate Contamination Localized on the Surface of the Tablets | FDA\" provides the exact NDC code (51407-841-05), lot number (GS069303), expiration date (01/2030), and particle dimensions (0.01 to 0.10 mm). Secondary news reports—The Hill's \"Ibuprofen recalled nationwide over contaminent: FDA - The Hill\", Daily Voice's \"Golden State Medical Supply Recalls Ibuprofen, FDA Says\", and WJXT News4JAX's \"Company recalls 800mg ibuprofen tablets over aluminum particle contamination\"—summarize the FDA notice accurately, with The Hill adding that the lot was distributed through medical wholesaler McKesson, which was instructed to quarantine remaining stock.\n\nStill uncertain\nThe total number of bottles distributed in Lot GS069303 and the specific manufacturing equipment source of the surface aluminum particles were not disclosed in the recall announcement.\n\nTrust label: Official confirmation — Verified directly against the U.S. FDA recall notice and corroborated by The Hill, Daily Voice, and WJXT News4JAX."])</script><script>self.__next_f.push([1,"11:T778,"])</script><script>self.__next_f.push([1,"「發生了什麼事」\n位於美國加州卡馬里奧的Golden State Medical Supply, Inc.（GSMS）針對一批800毫克處方級布洛芬（Ibuprofen）錠劑（NDC 51407-841-05、批號GS069303、效期2030年1月）發起全美消費者層級自願召回，原因為藥片表面發現可能受直徑0.01至0.10毫米的鋁微粒污染。美國食品藥物管理局（FDA）已發布安全警訊，指示患者立即停用該批號藥品並退回原購買藥局。\n\n「為什麼重要」\n800毫克高劑量布洛芬廣泛用於緩解骨關節炎、類風濕性關節炎與中度疼痛，若持續服用含金屬微粒的錠劑，可能對胃部或腸道黏膜造成輕微刺激與磨損。儘管官方指出因微粒極小、引發嚴重不良反應的機率甚微，但精準鎖定單一批號回收有助避免慢性病患長期攝入異物。\n\n「來源異同」\n美國FDA官方公告「Golden State Medical Supply, Inc. Issues a Voluntary Nationwide Recall of Ibuprofen 800mg Tablets Due to Potential Aluminum Particulate Contamination Localized on the Surface of the Tablets | FDA」完整載明藥品代碼NDC 51407-841-05、批號GS069303、效期01/2030及鋁微粒尺寸（0.01至0.10毫米）。國會山莊報「Ibuprofen recalled nationwide over contaminent: FDA - The Hill」、Daily Voice「Golden State Medical Supply Recalls Ibuprofen, FDA Says」及WJXT News4JAX「Company recalls 800mg ibuprofen tablets over aluminum particle contamination」均引述該FDA公告，其中國會山莊報補充該批號經由醫藥批發商McKesson配送並已要求隔離庫存。\n\n「仍不確定」\n批號GS069303在全美實際流出的藥瓶總數，以及生產線上導致藥片表面附著鋁微粒的具體製程環節，官方公告尚未揭露。\n\nTrust label: Official confirmation — 依據美國FDA官方召回公告核實，並由國會山莊報、Daily Voice及WJXT News4JAX報導佐證。"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-biotech-343-gsms-ibuprofen-800mg-recall\",\"category\":\"biotech\",\"title\":{\"en\":\"FDA Posts Nationwide Recall of Golden State Medical Supply 800mg Ibuprofen Over Aluminum Particles\",\"zh-TW\":\"表面疑含鋁微粒 美FDA公告全美召回GSMS批號800毫克布洛芬\"},\"summary\":{\"en\":\"The U.S. Food and Drug Administration published a voluntary consumer-level recall by Golden State Medical Supply for Lot GS069303 of 800mg Ibuprofen tablets due to potential surface aluminum particulate contamination, advising patients to stop use and return bottles to pharmacies.\",\"zh-TW\":\"美國食品藥物管理局（FDA）公告，加州Golden State Medical Supply（GSMS）因藥片表面可能受0.01至0.10毫米鋁微粒污染，在全美自願召回批號GS069303的800毫克處方級布洛芬錠劑。官方評估引發不良反應機率極低，但呼籲患者立即停用並退回原購買藥局。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"$11\"},\"glossary\":[{\"term\":{\"en\":\"National Drug Code (NDC)\",\"zh-TW\":\"美國國家藥品代碼\"},\"blurb\":{\"en\":\"A unique 10- or 11-digit identifier assigned by the FDA to every human drug product in the United States, specifying labeler, product, and package size.\",\"zh-TW\":\"美國FDA核發給每項人用藥品的唯一識別編號，用以標示製造商、藥品成分劑量與包裝規格。\"}},{\"term\":{\"en\":\"Consumer-level recall\",\"zh-TW\":\"消費者層級召回\"},\"blurb\":{\"en\":\"A product recall that extends all the way to individual end users and patients, rather than stopping at wholesalers or retail pharmacies.\",\"zh-TW\":\"召回範圍直接涵蓋終端患者與一般消費者（不僅限於批發商或藥局庫存），要求民眾停用並退回已購產品。\"}},{\"term\":{\"en\":\"Gastrointestinal lining\",\"zh-TW\":\"胃腸道黏膜\"},\"blurb\":{\"en\":\"The protective inner tissue layer of the stomach and intestines that can become irritated by physical particulates or high-dose NSAIDs.\",\"zh-TW\":\"胃部與腸道內壁的保護性組織層，若接觸異物微粒或高劑量非類固醇消炎藥可能產生刺激或發炎。\"}}],\"sources\":[{\"name\":\"U.S. Food and Drug Administration (FDA)\",\"url\":\"https://www.fda.gov/safety/recalls-market-withdrawals-safety-alerts/golden-state-medical-supply-inc-issues-voluntary-nationwide-recall-ibuprofen-800mg-tablets-due\"},{\"name\":\"The Hill\",\"url\":\"https://thehill.com/policy/healthcare/6242753-ibuprofen-recalled-nationwide-over-contaminent-fda/\"},{\"name\":\"Daily Voice\",\"url\":\"https://dailyvoice.com/article/golden-state-medical-supply-recalls-ibuprofen-fda-says/\"},{\"name\":\"WJXT News4JAX\",\"url\":\"https://www.news4jax.com/health/2026/11/27/company-recalls-800mg-ibuprofen-tablets-over-aluminum-particle-contamination/\"}],\"imageUrl\":\"/covers/live/live-biotech-343-gsms-ibuprofen-800mg-recall.png\",\"imageAlt\":{\"en\":\"FDA Posts Nationwide Recall of Golden State Medical Supply 800mg Ibuprofen Over Aluminum Particles\",\"zh-TW\":\"表面疑含鋁微粒 美FDA公告全美召回GSMS批號800毫克布洛芬\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":87,\"trustBreakdown\":{\"crossCorroboration\":23,\"outletReputation\
