egory\":\"biotech\",\"title\":{\"en\":\"NiKang Therapeutics Publishes Phase I/II Results for NKT2152 in Nature Cancer\",\"zh-TW\":\"NiKang Therapeutics 於 Nature Cancer 發表 NKT2152 一／二期臨床結果\"},\"summary\":{\"en\":\"NiKang Therapeutics announced publication of first-in-human Phase I/II data for NKT2152 in Nature Cancer on November 27, highlighting clinical activity in advanced kidney cancer. The key takeaway is published clinical data supporting further development of this candidate therapy.\",\"zh-TW\":\"NiKang Therapeutics 於 11 月 27 日宣布在 Nature Cancer 發表 NKT2152 一／二期臨床試驗數據，呈現晚期腎癌相關臨床活性。關鍵結論在於該候選療法取得同儕期刊臨床數據發表，推進後續研發評估。\"},\"body\":{\"en\":\"「What happened」 NiKang Therapeutics announced on November 27 that first-in-human Phase I/II study results for NKT2152 were published in Nature Cancer, alongside coverage of its activity in advanced kidney cancer.\\n「Why it matters」 Publishing early-stage clinical and biomarker findings in a peer-reviewed journal provides scientific visibility for NKT2152's therapeutic profile.\\n「Source differences」 Business Wire and news reports both cover the November 27 Nature Cancer publication of NKT2152 first-in-human data, with medical news noting advanced kidney cancer and biomarker details.\\n「Still uncertain」 Larger late-stage trials, regulatory approvals, and broader patient outcomes remain to be established through future studies.\\nTrust label: Multi-source agreement — Corroborated by the press release via Business Wire and independent medical news coverage on November 27.\",\"zh-TW\":\"「發生了什麼事」：NiKang Therapeutics 於 11 月 27 日宣布，候選療法 NKT2152 的人體一／二期臨床試驗結果刊登於 Nature Cancer，相關報導亦提及其在晚期腎癌的臨床表現。\\n「為什麼重要」：臨床與生物標記數據刊登於學術期刊，有助外界檢視 NKT2152 在腫瘤治療領域的研發進展與科學依據。\\n「來源異同」：Business Wire 新聞稿與醫藥媒體報導皆確認 11 月 27 日公布 NKT2152 刊登於 Nature Cancer 的消息，醫藥報導並補充晚期腎癌與生物標記觀察重點。\\n「仍不確定」：後續仍需更大規模臨床試驗與主管機關審查，以驗證長期療效、安全性與適用族群。\\nTrust label: Multi-source agreement — 獲 Business Wire 發布之公告與醫藥媒體於 11 月 27 日之報導交叉印證。\"},\"glossary\":[{\"term\":{\"en\":\"Phase I/II clinical trial\",\"zh-TW\":\"一／二期臨床試驗\"},\"blurb\":{\"en\":\"An early-to-mid stage clinical study evaluating safety, dosing, and preliminary efficacy in patients.\",\"zh-TW\":\"評估安全性、劑量與初步療效的早期至中期人體臨床試驗。\"}},{\"term\":{\"en\":\"Biomarker\",\"zh-TW\":\"生物標記\"},\"blurb\":{\"en\":\"A measurable biological indicator used to track disease status or response to a treatment.\",\"zh-TW\":\"可用於追蹤疾病狀態或治療反應的可量測生物指標。\"}},{\"term\":{\"en\":\"Monotherapy\",\"zh-TW\":\"單藥治療\"},\"blurb\":{\"en\":\"Treatment using a single drug or therapy rather than combining multiple drugs at once.\",\"zh-TW\":\"僅使用單一藥物或單一療法的治療方式，而非多藥併用。\"}}],\"sources\":[{\"name\":\"Business Wire\",\"url\":\"https://www.businesswire.com/news/home/20261127496917/en/NiKang-Therapeutics-Announces-Publication-of-First-in-Human\"},{\"name\":\"News-Medical\",\"url\":\"https://www.news-medical.net/news/20261127/Novel-oral-drug-delivers-lasting-responses-in-advanced-kidney-cancer.aspx\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"NiKang Therapeutics Publishes Phase I/II Results for NKT2152 in Nature Cancer\",\"zh-TW\":\"NiKang Therapeutics 於 Nature Cancer 發表 NKT2152 一／二期臨床結果\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":74,\"trustBreakdown\":{\"crossCorroboration\":22,\"outletReputation\":19,\"recencyClarity\":19,\"sourceDiversity\":14},\"publishedAt\":\"2026-11-27T20:21:08.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":21,\"D2\":20,\"D3\":19,\"D4\":19,\"D5\":18,\"total\":19},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\
