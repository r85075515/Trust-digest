de, closing her second turn with \"Still Standing\" — a song about her late father from her latest album, Lost Weekend.\nWhat happened\nSaturday Night Live returned with the third episode of season 52, hosted by comedian and former SNL writer John Mulaney. Bridgers marked her third time performing on the show, following her 2021 debut and her 2023 return as part of boygenius. For her first performance she sang \"Bobby,\" also from Lost Weekend, which debuted back in August. For her second, she performed \"Still Standing,\" with the lights going down as she sang about her late father.\nWhy it matters\nA grief song on live network television is a risk — there is nowhere to hide a false note, literal or emotional. That Bridgers chose her most personal material for a live audience, on a show built for comedy, is what made the performance the night's talking point rather than just another musical guest slot.\nSources agree / disagree\nBillboard, Rolling Stone Music and Just Jared agree on the episode, the host, both songs and the album. Trust label: Multi-source agreement — three outlets agree on the performances and the album.\nStill uncertain\nThe Just Jared piece is framed around the lyrics, but the snippets do not quote them; the full lyric and performance details need the publishers' pages. Whether \"Bobby\" is about a specific person is a separate Just Jared explainer, not settled in this cluster."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-entertainment-02-still-standing-lyrics-ph\",\"category\":\"entertainment\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-entertainment-02-still-standing-lyrics-ph.jpg\",\"imageAlt\":{\"en\":\"Cover related to: ‘Still Standing’ Lyrics: Phoebe Bridgers Sings About Her Late Father on ‘Lost Weekend’ Track\",\"zh-TW\":\"相關封面圖：《Still Standing》歌詞：菲比·布里傑斯 (Phoebe Bridgers) 在《Lost Weekend》歌曲中演唱了她已故的父親\"},\"publishedAt\":\"2026-11-15T08:05:34.000Z\",\"title\":{\"en\":\"Phoebe Bridgers Sings 'Still Standing' for Her Late Father on 'SNL'\",\"zh-TW\":\"菲比·布里傑斯在《週六夜現場》唱〈Still Standing〉悼念亡父\"},\"summary\":{\"en\":\"Phoebe Bridgers returned to Saturday Night Live for the third time on November 14, performing 'Bobby' and then 'Still Standing' — a song about her late father — from her album 'Lost Weekend,' with John Mulaney hosting season 52's third episode. Takeaway: the night's quietest moment was its most personal.\",\"zh-TW\":\"菲比·布里傑斯（Phoebe Bridgers）11 月 14 日第三度登上《週六夜現場》（Saturday Night Live），在約翰·穆蘭尼（John Mulaney）主持的第 52 季第 3 集中，先唱〈Bobby〉，再以新專輯《Lost Weekend》的〈Still Standing〉悼念亡父。結論：當晚最安靜的一刻，也是最私人的一刻。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"菲比·布里傑斯（Phoebe Bridgers）11 月 14 日週六重返《週六夜現場》（Saturday Night Live），帶來動人的演出。這位 32 歲的歌手在當集表演兩次，第二首是出自新專輯《Lost Weekend》、寫給已故父親的〈Still Standing〉。\\n發生了什麼事\\n《週六夜現場》第 52 季第 3 集於 11 月 14 日週六播出，由喜劇演員、前 SNL 編劇約翰·穆蘭尼（John Mulaney）主持。布里傑斯第三度登上這個舞台，先前是 2021 年首演、2023 年以 boygenius 成員身分回歸。她第一首唱了同樣出自《Lost Weekend》的〈Bobby〉，該專輯於 8 月發行；第二首〈Still Standing〉演唱時燈光暗下，唱的是她已故的父親。\\n為什麼重要\\n在直播電視上唱一首悼念亡父的歌是冒險——不論是音準還是情感，都無處可躲。布里傑斯選擇在以喜劇為主的節目上唱最私人的作品，正是這場演出成為當晚話題、而不只是又一組音樂嘉賓的原因。\\n來源異同\\n告示牌（Billboard）、滾石（Rolling Stone）與 Just Jared 對集數、主持人、兩首歌與專輯的報導一致。信任標籤：N源一致——三家媒體對演出內容與專輯的報導一致。\\n仍不確定\\nJust Jared 的文章以歌詞為主，但摘要未引述歌詞；完整歌詞與演出細節須看媒體原始報導。〈Bobby〉是否寫給特定對象是 Just Jared 另一篇解讀文章的主題，本批並未定論。\"},\"sources\":[{\"name\":\"Billboard\",\"url\":\"https://www.billboard.com/culture/product-recommendations/watch-snl-2026-john-mulaney-phoebe-bridgers-live-online-1236380661/\"},{\"name\":\"Rolling Stone Music\",\"url\":\"https://www.rollingstone.com/music/music-news/snl-watch-phoebe-bridgers-performs-bobby-still-standing-1235658394/\"},{\"name\":\"Just Jared\",\"url\":\"https://www.justjared.com/2026/11/15/still-standing-lyrics-phoebe-bridgers-sings-about-her-late-father-on-lost-weekend-track/\"}],\"disagreements\":{\"en\":\"52 is the SNL season number and 32 is Bridgers' age — different figures, no conflict.\",\"zh-TW\":\"52 為
