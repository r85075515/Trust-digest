varez, a former backup dancer who reunited with Grande years after the couple first called it quits.\nWhy it matters\nGrande is one of the world's most watched pop stars, and a first joint red-carpet appearance is the clearest public confirmation of a relationship that had only been rumoured. For fans and the celebrity press, the debut turns months of speculation into a settled fact and sets the terms for how the couple will appear in public from here on.\nSources agree / disagree\nBillboard, TMZ and Hollywood Life agree on the debut itself and the couple's history. The figures flagged in the raw feed — 8217 against 5 — are not a conflict: 8217 appears to be an article identifier, while 5 is the number in Hollywood Life's '5 Things' profile format. Trust label: Multi-source agreement — three outlets agree on the red-carpet debut and the couple's history.\nStill uncertain\nThe summaries give no further detail on the couple's plans, and some passages are truncated, including the description of Grande's outfit. The reporting confirms the public debut, not the private state of the relationship; further detail would need the full articles."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-entertainment-02-who-is-ricky-alvarez-5-t\",\"category\":\"entertainment\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-entertainment-02-who-is-ricky-alvarez-5-t.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Ariana Grande and Ricky Alvarez make red-carpet debut at Focker-in-Law premiere\",\"zh-TW\":\"相關封面圖：愛莉安娜·格蘭德與瑞奇·阿爾瓦雷斯在《Focker-in-Law》首映紅毯首合體\"},\"publishedAt\":\"2026-11-12T00:40:54.000Z\",\"title\":{\"en\":\"Ariana Grande and Ricky Alvarez Make Red-Carpet Debut at 'Focker-in-Law' Premiere\",\"zh-TW\":\"愛莉安娜·格蘭德（Ariana Grande）攜瑞奇·阿爾瓦雷斯（Ricky Alvarez）紅毯首合體\"},\"summary\":{\"en\":\"Pop star Ariana Grande brought boyfriend Ricky Alvarez to the Focker-in-Law premiere in New York on Wednesday night, November 11, marking their first red-carpet appearance together. The pair dated for just over a year in 2015-16 before reuniting years after their split; Alvarez is a former backup dancer. Watch for more joint public appearances.\",\"zh-TW\":\"美國流行天后愛莉安娜·格蘭德（Ariana Grande）11 月 11 日晚間帶著男友瑞奇·阿爾瓦雷斯（Ricky Alvarez）出席《Focker-in-Law》紐約首映，兩人首度同走紅毯。兩人 2015 至 2016 年曾交往一年多，分手多年後復合，阿爾瓦雷斯曾是格蘭德的伴舞。接下來看兩人是否在後續公開場合持續同框。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"傳聞已久的戀情正式走上紅毯：愛莉安娜·格蘭德（Ariana Grande）11 月 11 日晚間帶著男友瑞奇·阿爾瓦雷斯（Ricky Alvarez）出席《Focker-in-Law》紐約首映。\\n發生了什麼事\\nBillboard 與 TMZ 報導，格蘭德帶著傳聞已久的男友阿爾瓦雷斯出席 11 月 11 日晚間在紐約燈塔劇院（Beacon Theatre）舉行的《Focker-in-Law》全球首映，兩人首度同走紅毯。兩人 2015 至 2016 年曾交往一年多，週三晚間是首度一起被拍到走紅毯。Hollywood Life 介紹阿爾瓦雷斯的背景：他曾是格蘭德的伴舞，兩人第一次分手多年後復合。\\n為什麼重要\\n格蘭德是全球最受關注的流行天后之一，首度同走紅毯等於公開確認這段只聞傳聞的戀情。對歌迷與娛樂媒體來說，這場首秀把數月的猜測變成確定的事實，也定調兩人今後公開露面的方式。\\n來源異同\\nBillboard、TMZ、Hollywood Life 三家對紅毯首合體與兩人交往史的報導一致。原始摘要標示的數字差異「8217 比 5」並非衝突：8217 疑為文章編號，5 是 Hollywood Life「5 件事」專題的數字。信任標籤：多源一致——三家媒體對紅毯首合體與兩人交往史的報導一致。\\n仍不確定\\n摘要未提兩人後續計畫，部分段落截斷，包括格蘭德服裝的描述。報導確認的是公開亮相，而非兩人關係的私下狀態，進一步細節請查閱完整報導。\"},\"sources\":[{\"name\":\"Billboard\",\"url\":\"https://www.billboard.com/culture/tv-film/ariana-grande-ricky-alvarez-red-carpet-photos-focker-in-law-1236379763/\"},{\"name\":\"TMZ\",\"url\":\"https://www.tmz.com/2026/11/11/ariana-grande-and-ricky-alvarez-make-red-carpet-debut/\"},{\"name\":\"Hollywood Life\",\"url\":\"https://hollywoodlife.com/feature/who-is-ricky-alvarez-5-things-5547464/\"}],\"disagreements\":null,\"trustScore\":45,\"trustBreakdown\":{\"sourceDiversity\":20,\"outletReputation\":15,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"entertainment\",\"live-ingest\",\"billboard\",\"tmz\",\"hollywood-life\"],\"glossary\":[{\"term\":{\"en\":\"Ariana Grande\",\"zh-TW\":\"愛莉安娜·格蘭德（Ariana Grande）\"},\"blurb\":{\"en\":\"American pop star whose red-carpet debut with Alvarez is the story.\",\"zh-TW\":\"美國流行天后，本次紅毯首合體的主角。\"}},{\"term\":{\"en\":\"Ricky Alvarez\",\"zh-TW\":\"瑞奇·阿爾瓦雷斯（Ricky Alv
