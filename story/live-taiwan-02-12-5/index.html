ore-based missile systems, according to Central News Agency.\nWhat happened\nThe defence ministry released its daily update on Chinese aircraft and vessel movements, covering 6am yesterday to 6am today, as reported by Central News Agency's Yu Kai-hsiang from Taipei on November 23. In that window it detected 12 Chinese vessels and 5 sorties of Chinese aircraft crossing the median line and entering the southwest and eastern airspace. The armed forces responded with mission aircraft and vessels plus shore-based missile systems, monitoring and handling the situation closely.\nWhy it matters\nThe daily count is the steady drumbeat of cross-strait pressure: not an escalation in itself, but a reminder that the median-line crossings and the southwest airspace patrols have become routine. The takeaway is in the response, the ministry's standing answer is to track and shadow with its own aircraft, ships and missiles, and the absence of any reported incident in this update is itself the news.\nSources agree-disagree\nThis cluster has a single outlet, Central News Agency's politics desk, relaying the ministry's update, so there is nothing to cross-check within it. Trust label: Single source. One reputable wire relaying an official release, but uncorroborated within this cluster.\nStill uncertain\nThe summary gives no aircraft types, no vessel classes, and no detail on how close any of them came to Taiwan. The ministry's next daily update will show whether the tempo is rising or holding steady."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-02-12-5\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-taiwan-02-12-5.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 12艘共艦5架次共機擾台　國軍嚴密監控\",\"zh-TW\":\"相關封面圖：12艘共艦5架次共機擾台　國軍嚴密監控\"},\"publishedAt\":\"2026-11-23T01:25:37.000Z\",\"title\":{\"en\":\"Taiwan Tracks 12 Chinese Warships and 5 Warplanes Near the Island\",\"zh-TW\":\"12 艘共艦、5 架次共機擾台，國軍嚴密監控應處\"},\"summary\":{\"en\":\"Taiwan's defence ministry said it detected 12 Chinese naval vessels and 5 Chinese military aircraft crossing the median line and operating in the southwest and eastern airspace, in the 24 hours to 6am today. The military is monitoring the activity closely with aircraft, vessels and shore-based missile systems. Watch for the next daily update.\",\"zh-TW\":\"［未證實·單一來源］國防部發布共機艦動態：自昨天上午 6 時起至今天上午 6 時止，偵獲 12 艘共艦以及 5 架次共機越中線侵擾西南、東部空域，國軍運用任務機艦及岸置飛彈系統嚴密監控與應處。接下來看明日的例行更新。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"國防部發布共機艦動態：自昨天上午 6 時起至今天上午 6 時止，偵獲 12 艘共艦以及 5 架次共機越中線侵擾西南、東部空域，國軍運用任務機艦及岸置飛彈系統嚴密監控與應處。據中央社報導。\\n發生了什麼事\\n國防部發布每日共機艦動態，統計自昨天上午 6 時起至今天上午 6 時止（中央社台北 23 日電，記者游凱翔）。這段期間偵獲 12 艘共艦、5 架次共機越過中線，侵擾西南與東部空域；國軍以任務機艦及岸置飛彈系統嚴密監控與應處。\\n為什麼重要\\n每日數字是台海壓力的穩定鼓點：本身不是升級，但提醒人們越中線與西南空域巡弋已成常態。重點在回應方式——國防部的標準答案是以自家機艦與飛彈追蹤監控，而本次更新未提任何突發事件，這本身就是消息。\\n來源異同\\n本批只有中央社政治組一家來源，轉述國防部的更新，無法跨來源比對。信任標籤：僅1源。\\n仍不確定\\n摘要未提機型、艦種，也沒說任何一架次、一艘艦距離台灣多近。國防部明日的例行更新才能看出態勢是升溫還是持平。\"},\"sources\":[{\"name\":\"中央社-政治\",\"url\":\"https://www.cna.com.tw/news/aipl/202611230031.aspx\"}],\"disagreements\":null,\"trustScore\":59,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"中央社-政治\"],\"glossary\":[{\"term\":{\"en\":\"Ministry of National Defense\",\"zh-TW\":\"國防部\"},\"blurb\":{\"en\":\"Taiwan's defence ministry, which publishes the daily tracking update.\",\"zh-TW\":\"發布每日共機艦動態的台灣國防部。\"}},{\"term\":{\"en\":\"People's Liberation Army\",\"zh-TW\":\"共軍\"},\"blurb\":{\"en\":\"China's armed forces, whose vessels and aircraft were detected.\",\"zh-TW\":\"中國武裝力量，其機艦被偵獲擾台。\"}},{\"term\":{\"en\":\"Median line\",\"zh-TW\":\"中線\"},\"blurb\":{\"en\":\"Unofficial boundary down the middle of the Taiwan Strait.\",\"zh-TW\":\"台灣海峽中間的非正式分界線。\"}},{\"term\":{\"en\":\"Central News Agency\",\"zh-TW\":\"中央社\"},\"blurb\":{\"en\":\"Taiwan's national news agency, which relayed the ministry updat
