cement and was booked into jail on a second-degree murder charge stemming from a fatal shooting in Guadalupe, Arizona, in September 2026.\n\nGuadalupe sits immediately south of Phoenix and borders Tempe, where Maricopa County Sheriff's Office (MCSO) deputies provide primary policing. The arrest advances prosecution in a violent crime case that had remained under active investigation since September.\n\nBoth KTAR News and 12News (KPNX) identify the suspect as 37-year-old Julian Paderez, confirm he turned himself in, and report he was booked on a second-degree murder charge. KTAR characterizes the underlying September incident as a fatal double-shooting, while 12News specifies that the September Guadalupe shooting left one man dead.\n\nCourt arraignment dates, bond conditions, and whether prosecutors will file additional charges related to a second victim remain pending formal Maricopa County Superior Court filings.\n\nTrust label: Multi-source agreement — Corroborated by KTAR News and 12News reporting on Maricopa County Sheriff's Office booking records."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-arizona-177-guadalupe-fatal-shooting-suspect-surrenders\",\"category\":\"arizona\",\"title\":{\"en\":\"Suspect Turns Himself In, Faces Second-Degree Murder Charge in Guadalupe Shooting\",\"zh-TW\":\"亞利桑那瓜達盧佩致命槍擊案 37歲嫌犯投案遭依二級謀殺罪收押\"},\"summary\":{\"en\":\"Maricopa County authorities announced that 37-year-old Julian Paderez surrendered to law enforcement and was booked on a second-degree murder charge in connection with a fatal September shooting in Guadalupe, Arizona. Takeaway: The surrender brings a key arrest in a two-month homicide investigation south of Phoenix.\",\"zh-TW\":\"亞利桑那州馬里科帕郡執法部門通報，涉及今年9月瓜達盧佩（Guadalupe）致命槍擊案的37歲嫌犯朱利安・帕德雷斯（Julian Paderez）已向警方投案，並依二級謀殺罪名收押。一句結論：嫌犯主動投案使大鳳凰城南郊這起延宕兩個月的命案調查取得關鍵進展。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」亞利桑那州馬里科帕郡（Maricopa County）執法單位證實，涉及 2026 年 9 月瓜達盧佩（Guadalupe）致命槍擊案的 37 歲男子朱利安・帕德雷斯（Julian Paderez），已向警方主動投案並被依二級謀殺罪名收押入獄；相關指控尚未經法院認定。\\n\\n「為什麼重要」瓜達盧佩緊鄰鳳凰城南側與坦佩市（Tempe），治安由馬里科帕郡警長辦公室（MCSO）負責管轄。嫌犯在案發兩個月後投案收押，使這起大鳳凰城都會區重大槍擊命案正式進入司法審理階段。\\n\\n「來源異同」《KTAR News》與鳳凰城地方電視台《12News》均一致報導嫌犯為 37 歲的朱利安・帕德雷斯、主動投案及遭依二級謀殺罪收押；《KTAR News》將 9 月案發事件稱為「致命雙人槍擊案」，《12News》則明確指出該起槍擊造成一名男子喪生。\\n\\n「仍不確定」馬里科帕郡高等法院的首次提審日期、保釋金裁定，以及檢方是否會針對另一名傷者追加起訴罪名，目前仍待法院公開卷宗進一步確認。\\n\\nTrust label: Multi-source agreement — 《KTAR News》與《12News》對嫌犯身分、投案與收押罪名報導一致。\"},\"glossary\":[{\"term\":{\"en\":\"Guadalupe, Arizona\",\"zh-TW\":\"亞利桑那州瓜達盧佩\"},\"blurb\":{\"en\":\"An incorporated town in Maricopa County bordered by Phoenix and Tempe in the central Phoenix metropolitan area.\",\"zh-TW\":\"位於亞利桑那州馬里科帕郡的小鎮，被鳳凰城與坦佩市環繞，屬大鳳凰城都會區核心地帶。\"}},{\"term\":{\"en\":\"Maricopa County Sheriff's Office (MCSO)\",\"zh-TW\":\"馬里科帕郡警長辦公室\"},\"blurb\":{\"en\":\"The county law enforcement agency responsible for county jails and contracted policing in communities like Guadalupe.\",\"zh-TW\":\"負責管理馬里科帕郡監獄系統並受託執行瓜達盧佩等地治安巡邏的郡級執法機關。\"}},{\"term\":{\"en\":\"Second-Degree Murder\",\"zh-TW\":\"二級謀殺罪\"},\"blurb\":{\"en\":\"Under Arizona law, an intentional or reckless homicide committed without premeditation.\",\"zh-TW\":\"依亞利桑那州刑法，指未經預謀但具殺人故意或極度漠視人命魯莽行為所致的殺人罪名。\"}}],\"sources\":[{\"name\":\"KTAR News\",\"url\":\"https://ktar.com/arizona-news/suspect-in-fatal-double-shooting-in-guadalupe-turns-himself-in\"},{\"name\":\"12News KPNX\",\"url\":\"https://www.12news.com/article/news/local/valley/man-faces-second-degree-murder-in-deadly-guadalupe-shooting/75-fff308a7-c162-4ced-9124-8bedef9c6b13\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"Maricopa County law enforcement update on suspect Julian Paderez booked in Guadalupe fatal shooting\",\"zh-TW\":\"馬里科帕郡執法單位通報瓜達盧佩致命槍擊案嫌犯投案收押\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":84,\"trustBreakdown\":{\"crossCorroboration\":21,\"outletReputation\":21,\"recencyClarity\":22,\"sourceDiversity\":20},\"publishedAt\":\"2026-11-27T18:24:11.000Z\",\"disagreements\":\"KTAR New
