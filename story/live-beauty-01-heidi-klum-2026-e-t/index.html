ological and film-inspired figures to oversized animal and object designs. No further details about how the 2026 costume was made, how long it took to apply, or where it was worn are given in the available summary.\nWhy it matters\nThe story matters as a recurring entertainment and beauty highlight built around a single reveal each year. Because earlier costumes such as Medusa, E.T., the giant peacock and the worm are still recalled by name, each new look is measured against a well-known back catalogue. The giant severed hand therefore functions both as this year's surprise and as a continuation of that record. The report frames the appeal in the realism of the transformation and in the physical challenge it implies, rather than in a simple or easily worn outfit.\nSources agree / disagree\nOnly Vogue Taiwan is listed for this item, so there is no second outlet in the available material to compare wording, emphasis or additional detail against.\nTrust label: Single source — Only one outlet is listed, so the description rests on that single report.\nStill uncertain\nThe available summary does not describe the costume's construction, materials, application time or the event setting, and it does not include reactions from Klum or others. Those details cannot be confirmed from the material provided here, and readers should rely on the original report for anything beyond the reveal and the list of earlier costumes recalled."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-beauty-01-heidi-klum-2026-e-t\",\"category\":\"beauty\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-beauty-01-heidi-klum-2026-e-t.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 萬聖節女王Heidi Klum 2026造型再次挑戰人體極限，變身超逼真「巨型斷手」！從梅杜莎、E.T.到蚯蚓，回顧歷年最狂造型\",\"zh-TW\":\"相關封面圖：萬聖節女王Heidi Klum 2026造型再次挑戰人體極限，變身超逼真「巨型斷手」！從梅杜莎、E.T.到蚯蚓，回顧歷年最狂造型\"},\"publishedAt\":\"2026-11-01T02:49:47.000Z\",\"title\":{\"en\":\"Heidi Klum unveils 2026 Hal
