an R\u0026D center within the Southern Taiwan Science Park this year to integrate research capabilities, deepen local supply chain cooperation, and link technical ecosystems across Tainan and Kaohsiung for advanced manufacturing and high-end equipment support. Active in Taiwan since 1996 for more than 30 years with support from the Japan-Taiwan Exchange Association, the Kaohsiung City Government, and the Southern Taiwan Science Park Bureau, the company also noted its robotics contest launched in 2016 and held in Kaohsiung's Pier-2 area since 2020. Its new Kaohsiung office is planned for 2027 and has not yet opened.\n\nWhy it matters: Closer engineering and supply chain coordination in southern Taiwan supports equipment readiness as chip manufacturing clusters expand across the region.\n\nSource differences: Both reports stem from the same Central News Agency and company press release chain. 工商時報 carries the exact title 「TEL擴大南台灣布局 高雄新辦公室明年啟用」, while 緯來新聞網 carries the exact title 「東京威力科創加碼投資南台灣　台南設研發中心、高雄新據點」.\n\nStill uncertain: Specific capital expenditure figures and exact opening dates for the planned 2027 Kaohsiung office were not detailed in the reported facts.\n\nTrust label: Single source — both listed outlets trace to a single wire and company release chain."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-468-tokyo-electron-southern-taiwan-expansion\",\"category\":\"semiconductor\",\"title\":{\"en\":\"Tokyo Electron Expands Southern Taiwan Footprint With Tainan R\u0026D Center and 2027 Kaohsiung Office Plan\",\"zh-TW\":\"東京威力科創擴大南台灣布局，設台南研發中心並規劃 2027 年啟用高雄新辦公室\"},\"summary\":{\"en\":\"Tokyo Electron announced on November 26, 2026 that it opened a Tainan R\u0026D center in the Southern Taiwan Science Park this year and plans to consolidate Kaohsiung sites into a new office in 2027. Key takeaway: the move links Tainan and Kaohsiung to support local supply chains and advanced chipmaking equipment needs.\",
