026, in the Battle 4 Atlantis Signature Series in Nassau, Bahamas. Virginia built a 19-point lead early in the contest behind 21 points from Sam Lewis and 17 bench points from Elijah Gertrude.\n\nWhy it matters\nThe neutral-site Thanksgiving week victory keeps the second-ranked Cavaliers undefeated in their Bahamas showcase under head coach Ryan Odom, reinforcing their early-season national title credentials against Big East competition.\n\nSource differences\nAP News published \"Sam Lewis scores 21 points, Elijah Gertrude 17 and No. 2 Virginia handles Xavier 83-71\", providing the wire game recap carried identically by Fox Sports under the same headline \"Sam Lewis scores 21 points, Elijah Gertrude 17 and No. 2 Virginia handles Xavier 83-71\". Virginia's official athletics site published \"No. 2 Cavaliers Keep Rolling in Bahamas\", adding postgame press conference notes from head coach Ryan Odom and Sam Lewis.\n\nStill uncertain\nVirginia's next opponent and tipoff schedule in the remainder of the Battle 4 Atlantis Signature Series, as well as any postgame injury updates from either roster.\n\nTrust label: Single source — Game reporting relies on a single Associated Press wire dispatch syndicated to Fox Sports alongside Virginia Athletics' team release."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-entertainment-335-virginia-defeats-xavier-battle-4-atlantis\",\"category\":\"entertainment\",\"title\":{\"en\":\"No. 2 Virginia Defeats Xavier 83-71 in Battle 4 Atlantis Signature Series\",\"zh-TW\":\"NCAA 男籃第二種子維吉尼亞大學 83 比 71 擊敗澤維爾大學\"},\"summary\":{\"en\":\"Sam Lewis scored 21 points and Elijah Gertrude added 17 off the bench to lead No. 2 Virginia to an 83-71 victory over Xavier on November 27, 2026, in the Battle 4 Atlantis Signature Series in Nassau, Bahamas.\",\"zh-TW\":\"全美排名第二的維吉尼亞大學男籃隊於 2026 年 11 月 27 日在巴哈馬亞特蘭提斯之戰系列賽中，憑藉路易斯（Sam Lewis）攻下 21 分及替補格特魯德（Elijah Gertrude）貢獻 17 分，早早拉開 19 分領先優勢，終場以 83 比 71 擊敗澤維爾大學（Xavier）。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n全美排名第二的維吉尼亞大學（Virginia）男子籃球隊於 2026 年 11 月 27 日在巴哈馬拿騷舉行的「亞特蘭提斯之戰系列賽」（Battle 4 Atlantis Signature Series）出戰澤維爾大學（Xavier）。維吉尼亞大學開賽不久便建立 19 分領先優勢，先發球員路易斯（Sam Lewis）攻下全隊最高 21 分，替補球員格特魯德（Elijah Gertrude）挹注 17 分，終場以 83 比 71 勝出。\\n\\n「為什麼重要」\\n這場在感恩節假期中立場地拿下的勝利，讓總教練奧多姆（Ryan Odom）領軍的維吉尼亞騎士隊在巴哈馬系列賽延續連勝氣勢，面對大東聯盟（Big East）勁旅展現穩定進攻火力，進一步鞏固其季初全國排名第二的競爭地位。\\n\\n「來源異同」\\n美聯社（AP News）發布賽後電訊稿「Sam Lewis scores 21 points, Elijah Gertrude 17 and No. 2 Virginia handles Xavier 83-71」，福斯體育網（Fox Sports）亦以完全相同標題「Sam Lewis scores 21 points, Elijah Gertrude 17 and No. 2 Virginia handles Xavier 83-71」全文轉載該電訊稿；維吉尼亞大學體育官網（Virginia Athletics）則發布「No. 2 Cavaliers Keep Rolling in Bahamas」，補充總教練奧多姆與路易斯的賽後記者會影音紀錄。\\n\\n「仍不確定」\\n維吉尼亞大學在巴哈馬系列賽下一輪的對戰組合與開賽時間，以及雙方球員賽後是否有傷兵狀況，尚待官方賽程更新。\\n\\nTrust label: Single source — 賽事戰報主要源自美聯社單一電訊通稿並由 Fox Sports 轉載，輔以維吉尼亞大學體育官網賽後公告。\"},\"glossary\":[{\"term\":{\"en\":\"Battle 4 Atlantis Signature Series\",\"zh-TW\":\"亞特蘭提斯之戰系列賽\"},\"blurb\":{\"en\":\"An annual Thanksgiving-week NCAA Division I men's college basketball showcase held at the Atlantis Paradise Island resort in Nassau, Bahamas.\",\"zh-TW\":\"每年感恩節週於巴哈馬拿騷天堂島亞特蘭提斯度假村舉辦的 NCAA 第一級男子大學籃球錦標系列賽。\"}},{\"term\":{\"en\":\"Bench Points\",\"zh-TW\":\"替補得分\"},\"blurb\":{\"en\":\"Points scored by non-starting players who enter the game as substitutes, such as Elijah Gertrude's 17-point contribution for Virginia.\",\"zh-TW\":\"由非先發陣容的替補球員上場攻下的分數，本場比賽格特魯德（Elijah Gertrude）替補上陣貢獻 17 分。\"}},{\"term\":{\"en\":\"Wire Syndication\",\"zh-TW\":\"通訊社通稿轉載\"},\"blurb\":{\"en\":\"The distribution of a single news agency dispatch—such as an Associated Press game recap—across multiple partner outlets under identical text.\",\"zh-TW\":\"由美聯社等單一通訊社撰寫新聞稿件後，授權多家合作媒體以相同內文同步刊登的發稿模式。\"}}],\"sources\":[{\"name\":\"AP News\",\"url\":\"https://apnews.com/article/virginia-xavier-score-d14c963fa918171a29a483c5910b4d86\"},{\"name\":\"Fox Sports\",\"url\":\"https://www.foxsports.com/articles/cbk/sam-lewis-
