h into outside acquisitions, and the insurance slowdown is the quarter's main drag on earnings.\nSources agree / disagree\nCNBC, the Financial Times, and Bloomberg agree on the direction — buybacks up, earnings down. The buyback figure differs slightly: the Financial Times puts it at $9.6 billion, while another report gives about $9 billion.\nTrust label: Multi-source agreement — three outlets confirm the same quarterly direction, with only a small difference in the buyback figure.\nStill uncertain\nThe summaries do not explain the gap between the $9 billion and $9.6 billion figures, give no exact overall profit number, and offer no detail on the insurance underwriting decline."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-01-berkshire-hathaway-boost\",\"category\":\"finance\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-finance-01-berkshire-hathaway-boost.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Berkshire Hathaway Boosts Buybacks as Operating Income Slips\",\"zh-TW\":\"相關封面圖：波克夏海瑟威因營業收入下滑而加強回購力度\"},\"publishedAt\":\"2026-11-07T16:43:06.000Z\",\"title\":{\"en\":\"Berkshire Hathaway Steps Up Buybacks to $9.6 Billion as Operating Income Slips 5.8%\",\"zh-TW\":\"波克夏第三季回購96億美元，營業利潤下滑5.8%\"},\"summary\":{\"en\":\"Berkshire Hathaway accelerated share repurchases in the third quarter, spending about $9.6 billion on its own stock, even as operating income fell 5.8 percent year on year. The insurance slowdown weighed on earnings, leaving buybacks rising while profits slipped in a mixed quarter.\",\"zh-TW\":\"波克夏第三季加速回購自家股票，金融時報稱斥資約96億美元；同一季營業收入年減5.8%，保險承保放緩是主要拖累，回購加碼與獲利下滑同時出現。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"波克夏（Berkshire Hathaway）週六表示，第三季加速回購自家股票；同一季營業利潤與整體獲利雙雙下滑。\\n發生了什麼事\\n金融時報（Financial Times）稱波克夏第三季斥資約 96 億美元回購股票，顯示高層認為股價被低估；保險承保業務放緩拖累營業利潤，季度營業收入較去年同期下滑 5.8%。CNBC 標題稱第三季回購增加逾一倍。\\n為什麼重要\\n回購加碼與獲利下滑同時出現，說明波克夏寧可以現金支撐股價，也不急於對外收購；保險業務的疲軟是本季獲利的最大拖累。\\n來源異同\\n三家來源在「回購加碼、獲利下滑」上一致；回購金額有小差異：金融時報稱 96 億美元，另有報導稱約 90 億美元。信任標籤：多方一致——三家來源確認同一季報方向，僅回購金額有小出入。\\n仍不確定\\n90 億與 96 億美元的差額原因未見說明；整體獲利的具體數字未見於摘要；保險承保下滑的細節未提供。\"},\"sources\":[{\"name\":\"CNBC\",\"url\":\"https://www.cnbc.com/2026/11/07/berkshire-hathaway-q3-2026-earnings-buybacks.html\"},{\"name\":\"Financial Times Markets\",\"url\":\"https://www.ft.com/content/1f153350-2377-4e48-a073-0539376eab4c?syn-25a6b1a6=1\"},{\"name\":\"Bloomberg Markets\",\"url\":\"https://www.bloomberg.com/news/articles/2026-11-07/berkshire-hathaway-s-operating-earnings-fall-buybacks-rise\"}],\"disagreements\":{\"en\":\"Figures differ across outlets (e.g. 9 vs 9.6 in headlines/snippets).\",\"zh-TW\":\"不同媒體的數字有所不同（例如，標題/摘要中的數字為 9 與 9.6）。\"},\"trustScore\":79,\"trustBreakdown\":{\"sourceDiversity\":20,\"outletReputation\":20,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"finance\",\"live-ingest\",\"cnbc\",\"financial-times-markets\",\"bloomberg-markets\"],\"glossary\":[{\"term\":{\"en\":\"Berkshire Hathaway\",\"zh-TW\":\"波克夏\"},\"blurb\":{\"en\":\"US investment holding company that stepped up share buybacks this quarter.\",\"zh-TW\":\"美國投資控股公司，本季加速回購自家股票。\"}},{\"term\":{\"en\":\"Share buyback\",\"zh-TW\":\"股票回購\"},\"blurb\":{\"en\":\"A company using cash to buy back its own shares.\",\"zh-TW\":\"公司用現金買回自家股票的做法。\"}},{\"term\":{\"en\":\"Operating income\",\"zh-TW\":\"營業收入\"},\"blurb\":{\"en\":\"Profit earned from a company's core operations.\",\"zh-TW\":\"公司本業營運所得的利潤。\"}},{\"term\":{\"en\":\"Insurance underwriting\",\"zh-TW\":\"保險承保\"},\"blurb\":{\"en\":\"An insurer's core business of taking on policies and risk.\",\"zh-TW\":\"保險公司承接保單、承擔風險的本業。\"}},{\"term\":{\"en\":\"Financial Times\",\"zh-TW\":\"金融時報\"},\"blurb\":{\"en\":\"British financial newspaper and one of this card's sources.\",\"zh-TW\":\"英國財經報紙，本卡來源之一。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial
