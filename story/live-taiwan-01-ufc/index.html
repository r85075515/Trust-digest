nd the briefing room stays without a permanent voice until White answers.\n\nSources agree / disagree\nTrust label: Two-source agreement — CNA and Economic Daily News both reported the same headline and the same facts, with no conflicting dates or claims; both trace the news to Trump's Nov. 7 remarks.\n\nStill uncertain\nThe summaries do not state the setting of Trump's remarks, whether a news conference, interview, or social media post, nor whether White has accepted the invitation or when he would start. Those answers must come from the White House or from White himself."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-01-ufc\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-taiwan-01-ufc.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 白宮新聞秘書仍懸缺　川普邀綜合格鬥賽UFC總裁出任\",\"zh-TW\":\"相關封面圖：白宮新聞秘書仍懸缺　川普邀綜合格鬥賽UFC總裁出任\"},\"publishedAt\":\"2026-11-07T21:21:26.000Z\",\"title\":{\"en\":\"Trump Invites UFC President White to Serve as White House Press Secretary as Post Stays Vacant\",\"zh-TW\":\"川普邀終極格鬥冠軍賽總裁懷特出任白宮新聞秘書　職位懸缺逾三週\"},\"summary\":{\"en\":\"U.S. President Trump (川普) said on Nov. 7 that he has invited Ultimate Fighting Championship (UFC) President White (懷特) to serve as White House press secretary, CNA (中央社) reported from Washington. The post has been vacant since Oct. 16, and whether White accepts the invitation remains to be confirmed.\",\"zh-TW\":\"（中央社華盛頓7日綜合外電報導）美國總統川普今天指出，他已邀請終極格鬥冠軍賽（UFC）總裁懷特出任白宮新聞秘書。該職自10月16日懸缺至今，懷特是否接受邀請，仍待後續消息確認。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"（中央社華盛頓7日綜合外電報導）美國總統川普今天指出，他已邀請終極格鬥冠軍賽（UFC）總裁懷特出任白宮新聞秘書。該職自10月16日懸缺至今，川普這項邀請由中央社引述綜合外電報導。\\n\\n發生了什麼事\\n川普7日指出，他已邀請懷特出任白宮新聞秘書。白宮新聞秘書一職自10月16日懸缺至今。經濟日報同步刊出同一標題與同一事實。\\n\\n為什麼重要\\n對白宮而言，新聞秘書懸缺逾三週後，川普找上終極格鬥冠軍賽總裁接任，懷特是否接受，將決定白宮發言體系何時恢復正常運作。\\n\\n來源異同\\n信任標籤：雙來源一致——中央社與經濟日報皆刊出同一標題與同一事實，未見數字或說法衝突，兩家皆引述川普7日的說法，出處一致。\\n\\n仍不確定\\n摘要未說明川普發言場合是記者會、專訪或社群發文，也未說明懷特是否接受邀請與上任時間，須待白宮或懷特本人後續確認。\"},\"sourc
