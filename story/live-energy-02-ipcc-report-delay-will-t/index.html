ossible threatens global cooperation on the climate crisis.\n\nWhat happened\nRockström told The Guardian that climate science is foundational to the Paris Agreement and to worldwide progress on tackling global heating. Attempts to delay new scientific reports from the Intergovernmental Panel on Climate Change, he warned, threaten the global cooperation needed to confront the crisis. His message is blunt: slowing the panel down invites disaster rather than buying time.\n\nWhy it matters\nIPCC reports are the shared factual basis for climate negotiations and national emissions policy, so a delay is not a scheduling footnote — it pushes back the evidence that governments use to set targets and measure progress. Rockström connects a procedural fight directly to a substantive outcome: if the science arrives late, the cooperation built on it frays. That framing is why a single interview carries weight beyond one scientist's opinion.\n\nSources agree / disagree\nThis is a single-outlet story from The Guardian's climate desk, with no second newsroom corroborating the warning yet. There are no conflicting figures or rival claims in the feed, so the question is not which account to believe but whether other scientists or governments echo Rockström's warning in the coming days.\n\nStill uncertain\nThe feed does not say who is behind the delay, how long it might last, or what specific IPCC timetable is affected. Until those details surface, the warning stands as one prominent scientist's judgement rather than a confirmed account of what is happening inside the panel.\n\nTrust label: Single source — One outlet has reported this warning so far; the cause and scale of the delay remain unconfirmed."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"adult\":false,\"body\":{\"en\":\"$10\",\"zh-TW\":\"世界頂尖氣候科學家之一約翰·羅克斯特羅姆（Johan Rockström）警告，拖延政府間氣候變遷專門委員會（IPCC）新報告，就是在邀請災難。\\n\\n發生了什麼事\\n羅克斯特羅姆接受《衛報》（The Guardian）訪問時表示，氣候科學是《巴黎協定》與全球應對暖化進展的基礎，阻止 IPCC 盡快完成工作、
