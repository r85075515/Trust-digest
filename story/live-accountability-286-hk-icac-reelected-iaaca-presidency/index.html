t it was re-elected President of the International Association of Anti-Corruption Authorities (IAACA). ICAC Commissioner Woo Ying-ming presided over the IAACA meeting in Marrakech, Morocco, on Nov. 25 local time and secured the renewed mandate on behalf of the agency.\n\nWhy it matters\nRetaining the IAACA presidency keeps Hong Kong's anti-graft agency in a central coordinating role across international anti-corruption bodies, supporting cross-border capacity building, multilateral training programs, and judicial dialogue among member jurisdictions.\n\nSource differences\nAll three outlets report directly from the ICAC's Nov. 27 official press release, differing only in headline framing. The ICAC's official release titled \"新近新聞公報- 廉署成功連任國際反貪局聯合會主席廉政專員胡英明\" presents the announcement and highlights the inclusion of a Hong Kong District Court judge at an IAACA seminar. Radio Television Hong Kong's report titled \"胡英明代表廉署成功連任國際反貪局聯合會主席- RTHK\" summarizes the re-election directly, while TVB News's coverage titled \"胡英明成功連任國際反貪局聯合會主席指會積極推動多邊合作\" emphasizes Woo Ying-ming's pledge to advance multilateral cooperation.\n\nStill uncertain\nThe exact term length of the renewed presidency, the vote margin or consensus procedure among IAACA members in Marrakech, and specific newly adopted multi-year budget allocations were not detailed in the cited public summaries.\n\nTrust label: Single source — All cited reports derive from the Hong Kong ICAC's official Nov. 27, 2026 press release."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-accountability-286-hk-icac-reelected-iaaca-presidency\",\"category\":\"accountability\",\"title\":{\"en\":\"Hong Kong ICAC Re-elected President of International Association of Anti-Corruption Authorities\",\"zh-TW\":\"香港廉政公署連任國際反貪局聯合會主席，廉政專員胡英明續掌全球反腐合作\"},\"summary\":{\"en\":\"Hong Kong's Independent Commission Against Corruption (ICAC), represented by Commissioner Woo Ying-ming, was re-elected President of the International Association of Anti-Corruption Authorities (IAACA) at its general meeting in Marrakech, Morocco, with the ICAC announcing the result on Nov. 27, 2026.\",\"zh-TW\":\"香港廉政公署（ICAC）於 2026 年 11 月 27 日公布，廉政專員胡英明（Woo Ying-ming）代表廉署在摩洛哥馬拉喀什主持國際反貪局聯合會（IAACA）會員大會期間，獲成員支持成功連任聯合會主席，將持續牽頭推動多邊反貪協作與經驗交流。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n香港廉政公署於 2026 年 11 月 27 日發布新聞公報指出，廉政專員胡英明（Woo Ying-ming）代表中國香港廉政公署，於當地時間 11 月 25 日在摩洛哥馬拉喀什主持國際反貪局聯合會會議期間，獲成員高度認同並成功連任聯合會主席。\\n\\n「為什麼重要」\\n廉政公署續任國際反貪局聯合會主席，使香港反貪機構持續在國際反腐網絡中扮演核心協調角色，有助推動跨司法管轄區的廉政培訓、多邊反貪合作機制及司法經驗交流。\\n\\n「來源異同」\\n三方來源均依據香港廉政公署 11 月 27 日發布的官方新聞公報撰寫，事實口徑一致，僅標題聚焦略有差異。香港廉政公署官網新聞稿標題原文為「新近新聞公報- 廉署成功連任國際反貪局聯合會主席廉政專員胡英明」，完整披露會議地點及香港區域法院法官李慶年（Lee Hing-nin）首度獲邀於研討會發表演講；香港電台報導標題原文為「胡英明代表廉署成功連任國際反貪局聯合會主席- RTHK」，以簡明新聞電訊交代連任結果；無綫新聞報導標題原文為「胡英明成功連任國際反貪局聯合會主席指會積極推動多邊合作」，側重胡英明表態感謝中央與特區政府支持並推動多邊合作。\\n\\n「仍不確定」\\n目前可查證的公開摘要尚未列明本屆連任主席的具體任期年限、馬拉喀什會員大會的表決票數或共識程序細節，以及下一階段多邊培訓計畫的具體預算規模。\\n\\nTrust label: Single source — 香港電台與無綫新聞報導均引述自香港廉政公署 2026 年 11 月 27 日官方新聞公報。\"},\"glossary\":[{\"term\":{\"en\":\"Independent Commission Against Corruption (ICAC)\",\"zh-TW\":\"香港廉政公署（ICAC）\"},\"blurb\":{\"en\":\"Hong Kong's statutory law enforcement agency established in 1974 to combat public and private sector corruption through investigation, prevention, and community education.\",\"zh-TW\":\"成立於 1974 年的香港法定反貪執法機構，透過執法調查、制度預防與社區教育打擊公私營機構貪污。\"}},{\"term\":{\"en\":\"International Association of Anti-Corruption Authorities (IAACA)\",\"zh-TW\":\"國際反貪局聯合會（IAACA）\"},\"blurb\":{\"en\":\"A global organization of anti-corruption agencies established to promote the effective implementation of the United Nations Convention against Corruption.\",\"zh-TW\":\"致力於推動《聯合國反腐敗公約》有效落實的全球反貪機構國際組織。\"}},{\"term\":{\"en\":\"Multilateral Anti-Corruption Cooperation\",\"zh-TW\":\"多邊反貪合作\"},\"blurb\":{\"en\":\"Cross-border collaboration among multiple jurisdictions' oversight and enforcement bodies to share intelligence, training, and asset-recovery practices.\",\"zh-TW\":\"多個司法管轄區的監察與執法機關進行跨境協作，分享反貪情報、培訓資源與追贓經驗。\"}}],\"sources\":[{\"name\":\"香港廉政公署（ICAC）\",\"url\":\"https://www.icac.org.hk/tc/p/press/index_id_5063.html\"},{\"name\":\"香港電台（RTHK）\",\"url\":\"https://news.rthk.hk/rthk/ch/component/k2/1879496-20261127.htm\"},{\"name\":\"無綫新聞（TVB News）\",\"url\":\"https://news.tvb.com/tc/1208760-%E8%83%A1%E8%8B%B1%E6%98%8E%E6%88%90%E5%8A%9F%E9%80%A3%E4%BB%BB%E5%9C%8B%E9%9A%9B%E5%8F%8D%E8%B2%AA%E5%B1%80%E8%81%AF%E5%90%88%E6%9C%83%E4%B8%BB%E5%B8%AD%E6%8C%87%E6%9C%83%E7%A9%8D%E6%A5%B5%E6%8E%A8%E5%8B%95%E5%A4%9A%E9%82%8A%E5%90%88%E4%BD%9C\"}],\"imageUrl\":\"/covers/live/live-accountability-286-hk-icac-reelected-iaaca-presidency.jpg\",\"imageAlt\":{\"en\":\"Hong Kong ICAC Re-elected President of International Association of Anti-Corruption Authorities\",\"zh-TW\":\"香港廉政公署連任國際反貪局聯合會主席，廉政專員胡英明續掌全球反腐合作\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":84,\"trustBreakdown\":{\"crossCorroboration\":21,\"outletReputation\":24,\"recencyClarity\":24,\"sourceDiversity\":15},\"publishedAt\":\"2026-11-28T00:37:18.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":23,\"D2\":22,\"D3\":22,\"D4\":22,\"D5\":21,\"total\":22},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-accountability-286-hk-icac-reelected-iaaca-presidency/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:descr
