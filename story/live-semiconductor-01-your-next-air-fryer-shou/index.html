risis pushed prices up across Apple's lineup, according to Tom's Hardware.\nWhat happened\nTom's Hardware reported that the MacBook Neo, which made a splash earlier this year as an affordable laptop and put pressure on the wider PC industry, dropped to an all-time low of $599 in Amazon's Black Friday sale. The 256GB citrus model returned to its original launch price after memory shortages drove prices higher across Apple's range. The outlet later updated its report to note the price had moved to $649.\nWhy it matters\nThe deal matters because the MacBook Neo is positioned as one of the best budget laptops available, and its price cut shows how quickly Black Friday discounts can erase the memory-crisis premium that lifted laptop prices. For buyers, it is a reminder that headline sale prices can change within hours.\nSources agree / disagree\nOnly Tom's Hardware covers this deal in the material supplied; other outlets in the bundle reported unrelated Black Friday offers, from SSDs to beauty products, and a BBC test of whether AI tools can spot genuine bargains. The price itself is a moving target: the same report first listed $599 and was later updated to $649. Trust label: Single source — One outlet reported this deal, and its price changed after publication.\nStill uncertain\nThe material does not say how long the $649 price will hold, whether other colours or storage options are discounted, or whether the deal is available outside Amazon. Stock levels and any purchase limits are also unstated."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-01-your-next-air-fryer-shou\",\"category\":\"semiconductor\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-semiconductor-01-your-next-air-fryer-shou.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Your Next Air Fryer Should Be Glass. A Cuisinart Model We Love Is 40% Off for Black Friday\",\"zh-TW\":\"相關封面圖：您的下一個氣炸鍋應該是玻璃的。我們喜歡的 Cuisinart 模特兒黑色星期五 40% 折扣\"},\"publishedAt\":\"2026-11-24T05:00:00.000Z\",\"title\":{\"en\":\"Apple MacBook Neo Hits Record-Low Price in Amazon Black Friday Sale\",\"zh-TW\":\"蘋果（Apple）MacBook Neo 在亞馬遜黑色星期五特賣創下新低價\"},\"summary\":{\"en\":\"[Unverified, single source] Apple's budget laptop, the 256GB MacBook Neo in citrus, fell to $599 in Amazon's Black Friday sale, matching its original launch price before memory shortages pushed prices up. Tom's Hardware called it an all-time low, though the listing was later updated to $649. The deal shows how aggressively retailers are discounting laptops this season.\",\"zh-TW\":\"［未證實·單一來源］蘋果（Apple）平價筆電 MacBook Neo 柑橘色 256GB 款在亞馬遜黑色星期五特賣跌至 599 美元，回到上市原價，也是歷來最低價。不過該商品頁稍後已更新為 649 美元，顯示特賣價格變動快速，入手前應先確認即時售價。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"蘋果（Apple）平價筆電成為今年黑色星期五最受矚目的特價商品。據科技媒體 Tom's Hardware 報導，256GB 柑橘色 MacBook Neo 在亞馬遜特賣跌至 599 美元，回到上市原價，也是歷來最低價。\\n發生了什麼事\\nTom's Hardware 報導，MacBook Neo 今年稍早以平價筆電之姿登場，帶動整體個人電腦市場競爭，在亞馬遜黑色星期五特賣跌至 599 美元，創下歷來最低價。256GB 柑橘色款回到上市原價，先前因記憶體短缺，蘋果（Apple）全線產品售價均已上漲。該媒體稍後更新報導，指出售價已改為 649 美元。\\n為什麼重要\\n這項特價值得注意，因為 MacBook Neo 被視為市面上最好的平價筆電之一，降價顯示黑色星期五折扣已抵銷記憶體短缺帶來的漲價。對買家而言，這也提醒特賣標價可能在數小時內變動，下手前應先確認即時售價。\\n來源異同\\n素材中僅有 Tom's Hardware 報導這項特價；同一批素材的其他媒體報導的是無關的黑色星期五商品，包括固態硬碟與美妝品，以及英國廣播公司（BBC）測試人工智慧能否辨識真正優惠的報導。售價本身也在變動：同一篇報導先寫 599 美元，稍後更新為 649 美元。信任標籤：僅1源——本卡主線僅有單一媒體報導，且售價在刊出後已有變動。\\n仍不確定\\n素材未說明 649 美元的售價會維持多久，其他顏色或容量是否有折扣，也未說明特價是否僅限亞馬遜。庫存數量與購買限制同樣未見於素材。\"},\"sources\":[{\"name\":\"BBC Technology\",\"url\":\"https://www.bbc.co.uk/news/articles/cw8dv4jmnle2o?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"Tom's Hardware\",\"url\":\"https://www.tomshardware.com/laptops/macbook-neo-falls-to-all-time-low-usd599-in-amazon-black-friday-sale-256gb-citrus-model-price-matches-its-original-launch\"},{\"name\":\"Allure\",\"url\":\"https://www.allure.com/story/best-skinceuticals-early-black-friday-deals-11-23-2026\"},{\"name\":\"Fashionista\",\"url\":\"https://fashionista.com/2026/11/skin1004-black-friday-cyber-monday-skin-care-sales\"},{\"name\":\"9to5Toys\",\"url\":\"https://9to5toys.com/2026/11/23/assassins-creed-black-flag-ps5/\"},{\"name\":\"Slickdeals Frontpage\",\"url\":\"https://slickdeals.net/f/20374728-apple-airpods-pro-3-wireless-earbuds-149-free-s-h?utm_source=rss\u0026utm_content=fp\u0026utm_medium=RSS2\"},{\"name\":\"CNET Deals\",\"url\":\"https://www.cnet.com/deals/plaud-note-pro-ai-note-taker-during-black-friday-deal/\"}],\"disagreements\":{\"en\":\"Tom's Hardware first listed the MacBook Neo at $599, then updated the same report to $649. [L1]\",\"zh-TW\":\"Tom's Hardware 同一篇報導先寫 599 美元，稍後更新為 649 美元。[L1]\"},\"trustScore\":77,\"trustBreakdown\":{\"sourceDiversity\":25,\"outletReputation\":10,\"crossCorroboration\":17,\"recencyClarity\":25},\"tags\":[\"semiconductor\",\"live-ingest\",\"bbc-technology\",\"tom's-hardware\",\"tom's-hardware\"],\"glossary\":[{\"term\":{\"en\":\"Apple\",\"zh-TW\":\"蘋果（Apple）\"},\"blurb\":{\"en\":\"American technology company that makes the MacBook Neo.\",\"zh-TW\":\"美國科技公司，MacBook Neo 的製造商。\"}},{\"term\":{\"en\":\"Amazon\",\"zh-TW\":\"亞馬遜（Amazon）\"},\"blurb\":{\"en\":\"American e-commerce platform where the laptop was discounted.\",\"zh-TW\":\"美國電商平台，該筆電特價的銷售通路。\"}},{\"term\":{\"en\":\"Tom's Hardware\",\"zh-TW\":\"Tom's Hardware\"},\"blurb\":{\"en\":\"American technology publication that reported the deal.\",\"zh-TW\":\"美國科技媒體，報導這項特價的出處。\"}},{\"term\":{\"en\":\"MacBook Neo\",\"zh-TW\":\"MacBook Neo\"},\"blurb\":{\"en\":\"Apple's budget laptop, positioned as one of the best affordable laptops.\",\"zh-TW\":\"蘋果平價筆電，被視為市面上最好的平價筆電之一。\"}},{\"term\":{\"en\":\"Black Friday\",\"zh-TW\":\"黑色星期五（Black Friday）\"},\"blurb\":{\"en\":\"Annual year-end shopping sale season in the United States.\",\"zh-TW\":\"美國年終購物特賣季。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next
