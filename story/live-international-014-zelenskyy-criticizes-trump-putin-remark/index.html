tin-remark\",\"category\":\"international\",\"title\":{\"en\":\"Zelenskyy Calls Trump's 'My Friend' Remark About Putin 'Strange,' Urges U.S. Pressure\",\"zh-TW\":\"澤倫斯基批川普稱普丁「我的朋友」很奇怪，促美國加大對俄施壓\"},\"summary\":{\"en\":\"Ukrainian President Volodymyr Zelenskyy urged the United States to pressure Russian President Vladimir Putin, calling Donald Trump's APEC summit remark referring to Putin as 'my friend' strange and comparing it to declaring friendship with Hitler during World War II. The sharp rebuke signals growing diplomatic friction between Kyiv and Washington over how to end the war.\",\"zh-TW\":\"烏克蘭總統澤倫斯基呼籲美國向俄羅斯總統普丁施壓，並直言美國總統川普在 APEC 峰會稱普丁為「我的朋友」十分奇怪，甚至比喻這如同二戰期間稱希特勒為朋友。這番罕見重話凸顯基輔與華府在對俄立場與停戰策略上的外交裂痕正在擴大。\"},\"body\":{\"en\":\"Speaking to the BBC in Kyiv, Ukrainian President Volodymyr Zelenskyy urged the United States to apply pressure on Russian President Vladimir Putin rather than praising him. Zelenskyy described U.S. President Donald Trump's recent APEC summit comment calling Putin 'my friend' as 'strange,' comparing it to declaring friendship with Adolf Hitler during World War II.\\n\\nZelenskyy's blunt criticism reflects Kyiv's deep concern that warmer rhetoric between Washington and Moscow could weaken Western leverage and undermine Ukraine's position in any future peace negotiations.\\n\\nThe Guardian, The Times of Israel, and KSAT (carrying Associated Press reporting) all corroborate Zelenskyy's interview remarks and his call for U.S. pressure on Moscow. White House officials have not yet issued a formal response to Zelenskyy's comparison.\\n\\nTrust label: Multi-source agreement — The Guardian, The Times of Israel, and AP via KSAT report identical quotes from Zelenskyy's Kyiv interview.\",\"zh-TW\":\"「發生了什麼事」\\n烏克蘭總統弗拉基米爾・澤倫斯基（Volodymyr Zelenskyy）在基輔接受英國廣播公司（BBC）專訪時，呼籲美國向俄羅斯總統弗拉基米爾・普丁（Vladimir Putin）施壓。針對美國總統唐納・川普（Donald Trump）在亞太經濟合作會議（APEC）峰會上稱普丁為「我的朋友」，澤倫斯基直言此舉「很奇怪」，並比喻如同在二戰期間宣稱與希特勒是朋友。\\n\\n「為什麼重要」\\n澤倫斯基罕見以強烈歷史類比反擊美國總統的公開言論，反映烏克蘭高度憂心美俄高層互動升溫，恐削弱西方對俄羅斯的集體施壓籌碼，並影響未來俄烏談判走向。\\n\\n「來源異同」\\n衛報（The Guardian）、以色列時報（The Times of Israel）與 KSAT 引述美聯社報導，均一致記錄澤倫斯基稱川普言論「奇怪」及其對美施壓訴求，各來源引述內容無衝突。\\n\\n「仍不確定」\\n白宮與川普團隊尚未對澤倫斯基的二戰比喻作出正式回應，該言論是否會進一步衝擊美國對烏克蘭的後續援助與外交協調仍有待觀察。\"},\"glossary\":[{\"term\":{\"en\":\"APEC Summit\",\"zh-TW\":\"亞太經濟合作會議峰會\"},\"blurb\":{\"en\":\"An annual gathering of leaders from 21 Pacific Rim economies to discuss trade, investment, and regional cooperation.\",\"zh-TW\":\"由 21 個環太平洋經濟體領袖出席的年度會議，討論經貿與區域合作。\"}},{\"term\":{\"en\":\"Kyiv\",\"zh-TW\":\"基輔\"},\"blurb\":{\"en\":\"The capital and most populous city of Ukraine, and the seat of the Ukrainian government.\",\"zh-TW\":\"烏克蘭首都與最大城市，也是烏克蘭中央政府所在地。\"}},{\"term\":{\"en\":\"Diplomatic Leverage\",\"zh-TW\":\"外交籌碼\"},\"blurb\":{\"en\":\"Political, economic, or military pressure used by a country to influence another nation's decisions during negotiations.\",\"zh-TW\":\"國家在談判中用以影響對手決策的政治、經濟或軍事施壓能力。\"}}],\"sources\":[{\"name\":\"The Guardian\",\"url\":\"https://www.theguardian.com/world/live/2026/nov/27/zelenskyy-putin-trump-comments-russia-ukraine-latest-news-updates\"},{\"name\":\"The Times of Israel\",\"url\":\"https://www.timesofisrael.com/zelensky-trump-calling-putin-his-friend-like-calling-hitler-a-friend/\"},{\"name\":\"KSAT (AP)\",\"url\":\"https://www.ksat.com/news/world/2026/11/27/zelenskyy-urges-the-us-to-pressure-putin-calling-trumps-my-friend-remark-strange/\"}],\"imageUrl\":\"/covers/live/live-international-014-zelenskyy-criticizes-trump-putin-remark.jpg\",\"imageAlt\":{\"en\":\"Volodymyr Zelenskyy speaking in Kyiv on US-Russia relations\",\"zh-TW\":\"烏克蘭總統澤倫斯基在基輔談及美俄關係\"},\"isHeadline\":true,\"isPopular\":true,\"trustScore\":89,\"trustBreakdown\":{\"crossCorroboration\":23,\"outletReputation\":22,\"recencyClarity\":23,\"sourceDiversity\":21},\"publishedAt\":\"2026-11-27T13:42:38.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":4,\"D2\":5,\"D3\":4,\"D4\":4,\"D5\":4,\"total\":21},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,
