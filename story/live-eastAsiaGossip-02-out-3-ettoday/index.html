in photos from an overseas trip surfaced; on the 21st she answered with a black-background Instagram Story — and her own account of the Singapore itinerary.\nWhat happened\nETtoday's headline put it bluntly: 'Yao Yuan-hao, OUT' (姚元浩OUT) — Wang has split with Yao, and the evidence for a reunion with Wu is three check-in photos overlapping during an overseas trip, surfaced via her Stories. Follow-ups from SETN's gossip desk and Videoland Entertainment News report the same claim: an early split with Yao, and a suspected rekindling with Wu. Wang responded on the 21st with white text on a black background reading '莫名其妙,' appearing to rebut the reports while addressing her Singapore itinerary herself. A separate item in the same feed batch — Hebe Tien joking on a livestream about unbuttoning her shirt after a donation — is unrelated.\nWhy it matters\nThe verdict is a stalemate: an unnamed-sourced breakup-and-reunion claim against a four-character denial, with check-in overlap as the only evidence. In gossip economics, the denial itself becomes the story — and Wang gave the outlets exactly four characters to quote.\nSources agree / disagree\nETtoday, SETN, Videoland, FTV, and Liberty Times agree on the core claim and on Wang's '莫名其妙' response; none has independent confirmation of the split or the reunion. Trust label: Gossip brief + Unconfirmed——several entertainment outlets followed the same batch of rumors, but neither the split nor the reunion has any on-record confirmation.\nStill uncertain\nWhether the split happened, whether Wang and Wu reunited, and what exactly '莫名其妙' was aimed at are all unconfirmed. Treat the reports as unverified until someone goes on the record."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-eastAsiaGossip-02-out-3-ettoday\",\"category\":\"eastAsiaGossip\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"publishedAt\":\"2026-10-21T07:01:46.000Z\",\"title\":{\"en\":\"Wang Hsin-tien Denies Split and Reunion Rumors With Four-Character Post\",\"zh-TW\":\"王心恬（Wang Hsin-tien）爆分手姚元浩（Yao Yuan-hao）、疑復合吳念平（Wu Nien-ping）：黑底白字回「莫名其妙」\"},\"summary\":{\"en\":\"Taiwanese actress Wang Hsin-tien pushed back at reports she split with Yao Yuan-hao and reunited with ex-swimmer Wu Nien-ping, citing three overlapping check-in photos from a trip abroad. On the 21st she posted a black-background '莫名其妙' ('utterly baffling'). The same batch carried an unrelated Hebe Tien livestream story. Takeaway: report versus denial — the reunion claim is unverified.\",\"zh-TW\":\"台灣女星王心恬（Wang Hsin-tien）遭爆與姚元浩（Yao Yuan-hao）分手、疑與前游泳國手吳念平（Wu Nien-ping）出國打卡照重疊復合；她 21 日在限動以黑底白字四字「莫名其妙」回應，並親自說明新加坡行程。同批另有田馥甄（Hebe Tien）直播的無關新聞。結論：爆料對上否認，復合說法未經證實，先別當真。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"台灣女星王心恬（Wang Hsin-tien）——ETtoday、三立、緯來、民視、自由時報等多家台媒同日跟進——遭爆與姚元浩（Yao Yuan-hao）分手、疑復合前游泳國手吳念平（Wu Nien-ping），本人 21 日在限動以黑底白字四字回應：「莫名其妙。」\\n發生了什麼事\\nETtoday 的標題寫得直接：「姚元浩 OUT」——王心恬與姚元浩分手，而她疑似復合吳念平的證據，是兩人出國期間 3 張打卡照地點重疊，經由她的限動曝光。三立娛樂星聞、緯來娛樂新聞跟進報導同一說法：早已與姚元浩分手，又傳與吳念平舊情復燃。王心恬 21 日在 Instagram 限動發文，黑底白字僅寫「莫名其妙」四字，疑似反擊爆料，並親自說明新加坡行程。同批另有一則無關新聞：田馥甄（Hebe Tien）在直播中被要求解開襯衫釦子，聽到抖內秒改口「可以開到肚臍」。\\n為什麼重要\\n結論是僵局：匿名消息來源的分手＋復合爆料，對上當事人四個字的否認，而打卡照重疊是唯一的證據。在八卦經濟學裡，否認本身就成了新聞——而王心恬只給了媒體四個字可以引用。\\n來源異同\\nETtoday、三立、緯來、民視、自由時報對核心爆料一致，也都報導了王心恬「莫名其妙」的回應；但分手與復合都沒有獨立證實。信任標籤：八卦短稿＋未確認——多家娛樂媒體跟進同一批傳聞，但分手與復合都沒有檯面上的證實。\\n仍不確定\\n兩人是否真的分手、王心恬與吳念平是否復合、「莫名其妙」究竟針對哪一點，都沒有檯面上的人證實。在有人具名說話之前，爆料應視為未經證實。\"},\"sources\":[{\"name\":\"ettoday.net\",\"url\":\"https://news.google.com/rss/articles/CBMiTkFVX3lxTE0yS01ncHJNWFZKTDl3SGRpTTJ0WUp5eF8ya3VoZUh1LVFNcDZta0JoOEFmZ1J5V3ZXUHU2WjlEZjRldDZYODBuU1FqYUpQZ9IBTEFVX3lxTE1rWmdPRTd5U3FyRWxkaVp4MUVwaFdhcFBhUUlGaEhxbE0yUzJWdElCT2JyS29ZMzdhRi1qeHdxU09hUkd4UXFuZlNSb28?oc=5\"},{\"name\":\"setn.com\",\"url\":\"https://news.google.com/rss/articles/CBMiSkFVX3lxTE4xZnVFUVZnZi1BdXlXVVRYcFpYMF9URm1Gbk5qZjB0RjE3QmdidjhSVXBYb3c5aUVQOUdSWkNfY0lpZXpGZno0N1BB0gFfQVVfeXFMT2pVeW5aQjl2QXg2LW5WSGtJOTJsZURKcm1Ocmp5RllTdVlGQVYtT2NrV2FiZ25HQkZyU3
