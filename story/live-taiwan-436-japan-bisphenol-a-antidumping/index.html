ed a cabinet order to levy anti-dumping duties on bisphenol A imported from South Korea and the Separate Customs Territory of Taiwan, Penghu, Kinmen and Matsu. The government will promulgate the ordinance on December 2, 2026, with enforcement running from December 3, 2026, through December 2, 2031.\n\nWhy it matters\nBisphenol A is a foundational chemical feedstock used in polycarbonate plastics and epoxy resins across electronics, automotive, and construction supply chains. Japan's five-year tariff measure raises export barriers for Taiwanese and South Korean petrochemical producers competing in the Japanese market after regulators concluded that dumped imports caused material injury to domestic manufacturers.\n\nSource differences\nThe Ministry of Economy, Trade and Industry press release titled \"大韓民国産並びに台湾、澎湖諸島、金門及び馬祖から成る独立の関税地域産ビスフェノールAに対する不当廉売関税の課税を決定しました\" (2026-11-27) outlines the industrial injury determination and references the Council on Customs, Tariff, Foreign Exchange and Other Transactions report. The Ministry of Finance notice titled \"大韓民国産並びに台湾、澎湖諸島、金門及び馬祖から成る独立の関税地域産ビスフェノールＡに対する不当廉売関税の課税を決定しました\" (2026-11-27) uses shorthand references for South Korea and Taiwan while confirming the identical December 2 promulgation and December 3, 2026 to December 2, 2031 enforcement window.\n\nStill uncertain\nThe retrieved official press release snippets do not list the specific company-by-company duty rate percentages or affected Taiwanese exporters.\n\nTrust label: Official confirmation — Confirmed directly through simultaneous November 27, 2026 cabinet-decision press releases published by Japan's Ministry of Economy, Trade and Industry and Ministry of Finance."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-436-japan-bisphenol-a-antidumping\",\"category\":\"taiwan\",\"title\":{\"en\":\"Japan Cabinet Approves Five-Year Anti-Dumping Duties on Bisphenol A from Taiwan and South Korea\",\"zh-TW\":\"日本內閣拍板對台灣及南韓產雙酚A課徵五年反傾銷稅\"},\"summary\":{\"en\":\"On November 27, 2026, Japan's Cabinet approved an ordinance imposing anti-dumping duties on bisphenol A originating from Taiwan and South Korea. The cabinet order will be promulgated on December 2, 2026, and the duties will take effect from December 3, 2026, through December 2, 2031, following an investigation confirming material injury to Japan's domestic industry.\",\"zh-TW\":\"日本政府於2026年11月27日召開內閣會議，正式通過對原產於台灣及南韓的雙酚A課徵反傾銷稅之政令。該政令預定於12月2日公布，並自12月3日起至2031年12月2日止實施五年，主因為日方調查認定低價進口貨品已對日本國內產業造成實質損害。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」日本經濟產業省與財務省於2026年11月27日同步宣布，日本內閣已通過對原產於南韓及「台灣、澎湖諸島、金門及馬祖單獨關稅領域」之雙酚A課徵反傾銷稅的政令。該政令將於2026年12月2日正式公布，並自12月3日起施行至2031年12月2日止，為期五年。\\n\\n「為什麼重要」雙酚A是製造聚碳酸酯塑膠與環氧樹脂的關鍵石化原料，廣泛應用於電子零組件、車用材料與建材領域。日本主管機關在受理課稅申請並完成調查後，認定傾銷進口貨品對日本國內產業造成實質損害並有保護必要，此項長達五年的關稅措施將直接提高台灣與南韓石化業者銷日成本。\\n\\n「來源異同」經濟產業省新聞稿《大韓民国産並びに台湾、澎湖諸島、金門及び馬祖から成る独立の関税地域産ビスフェノールAに対する不当廉売関税の課税を決定しました》（2026年11月27日）完整載明WTO單獨關稅領域正式名稱、國內產業實質損害認定依據，並附註關稅・外匯等審議會關稅分科會特殊關稅部會答申書連結；財務省公告《大韓民国産並びに台湾、澎湖諸島、金門及び馬祖から成る独立の関税地域産ビスフェノールＡに対する不当廉売関税の課税を決定しました》（2026年11月27日）則在內文簡稱南韓產及台灣產，兩份官方文件對2026年12月2日公布、12月3日至2031年12月2日課徵的時程完全一致。\\n\\n「仍不確定」目前檢視的官方新聞稿摘要未列出各別廠商適用的具體反傾銷稅率百分比，以及受影響台灣出口商名單。\\n\\nTrust label: Official confirmation — 依據日本經濟產業省與財務省2026年11月27日同步發布之內閣決定正式新聞稿核實。\"},\"glossary\":[{\"term\":{\"en\":\"Bisphenol A (BPA)\",\"zh-TW\":\"雙酚A\"},\"blurb\":{\"en\":\"An industrial organic compound primarily used to produce polycarbonate plastics and epoxy resins.\",\"zh-TW\":\"一種工業有機化合物，主要用於生產聚碳酸酯塑膠與環氧樹脂。\"}},{\"term\":{\"en\":\"Anti-dumping duty\",\"zh-TW\":\"反傾銷稅\"},\"blurb\":{\"en\":\"A protectionist tariff imposed by an importing government on foreign goods priced below fair market value that harm domestic producers.\",\"zh-TW\":\"進口國政府針對低於正常價格傾銷、且對本國產業造成損害之外國貨品所加徵的特別關稅。\"}},{\"term\":{\"en\":\"Cabinet Order (Seirei)\",\"zh-TW\":\"政令\"},\"blurb\":{\"en\":\"An executive ordinance enacted by the Cabinet of Japan to implement statutory provisions such as customs tariffs.\",\"zh-TW\":\"日本內閣為執行法律規定（如關稅課徵細則）所制定的行政命令。\"}}],\"sources\":[{\"name\":\"経済産業省 (METI)\",\"url\":\"https://www.meti.go.jp/press/2026/11/20261127003.html\"},{\"name\":\"財務省 (Ministry of Finance Japan)\",\"url\":\"https://www.mof.go.jp/policy/customs_tariff/trade/plan/futou/ka20261127-2.html\"}],\"imageUrl\":\"/covers/live/live-taiwan-436-japan-bisphenol-a-antidumping.png\",\"imageAlt\":{\"en\":\"Japan Cabinet Approves Five-Year Anti-Dumping Duties on Bisphenol A from Taiwan and South Korea\",\"zh-TW\":\"日本內閣拍板對台灣及南韓產雙酚A課徵五年反傾銷稅\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":91,\"trustBreakdown\":{\"crossCorroboration\":23,\"outletReputation\":25,\"recencyClarity\":24,\"sourceDiversity\":19},\"publishedAt\":\"2026-11-28T10:22:56.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":23,\"D2\":24,\"D3\":22,\"D4\":22,\"D5\":22,\"total\":23},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-taiwan-436-japan-bisphenol-a-antidumping/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-taiwan-436-japan-bisphenol-a-antidumping/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"c
