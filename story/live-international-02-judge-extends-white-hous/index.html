anizations President Trump banned last month over their coverage, while their legal challenge against the administration moves forward.\nWhat happened\nDistrict court judge Timothy Kelly ruled Tuesday that the White House must continue allowing journalists from the three outlets into the building as the media coalition's lawsuit plays out; Kelly had first granted relief on September 24 after the administration blocked access last month. PBS NewsHour's Geoff Bennett discussed the legal fight with Ted Boutrous, the attorney representing the three outlets. In separate coverage within the same feed cluster: Axios reports exclusively that the White House is probing explosive claims — relayed by former Trump attorney Alina Habba — that former Kennedy Center leader Ric Grenell failed to deposit a multimillion-dollar donation her billionaire husband made to the center a year ago; and the BBC covers the White House defending its new press secretary amid questions about her legal credentials, noting Katie Zacharia does not appear registered to the bar in any state where she has lived.\nWhy it matters\nPress-access fights are proxy wars over accountability: each ruling extends not just three outlets' credentials but the precedent that coverage critical of a president cannot be punished with exclusion. The Kennedy Center probe, meanwhile, injects a separate \"MAGA blood feud\" storyline — in Axios's words — into an already crowded White House news cycle.\nSources agree / disagree\nThe Guardian and PBS NewsHour corroborate the core of the access ruling — Kelly, the three outlets, the ongoing lawsuit. Figures differ across outlets (e.g. 24 vs 6 in headlines/snippets), and the Axios donation probe and BBC press-secretary items are separate stories sharing the cluster. Trust label: Conflicting figures/accounts — the access ruling itself is corroborated, but the cluster mixes distinct stories and the snippets differ on figures.\nStill uncertain\nThe snippets do not quote Kelly's full reasoning, detail the next steps in the lawsuit, or substantiate the Kennedy Center donation claims beyond Axios's four senior-administration sources. The Zacharia credential questions rest on a single BBC item. Verify in the full reporting."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-02-judge-extends-white-hous\",\"category\":\"international\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-international-02-judge-extends-white-hous.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Judge extends White House access to banned media outlets CNN, MS Now and Politico\",\"zh-TW\":\"相關封面圖：（譯文待補）Judge extends White House access to banned media outlets CNN, MS Now and Politico\"},\"publishedAt\":\"2026-10-15T03:03:16.000Z\",\"title\":{\"en\":\"Judge Timothy Kelly Extends White House Access for CNN, MS Now, Politico\",\"zh-TW\":\"法官凱利（Timothy Kelly）延長白宮准入　CNN、MS Now、Politico 三家被禁媒體續留\"},\"summary\":{\"en\":\"A federal judge ordered the White House to keep admitting journalists from CNN, MS Now and Politico while their lawsuit against the Trump administration plays out. Judge Timothy Kelly extended access after the administration blocked the three outlets last month over their coverage. Separately, Axios reports the White House is probing claims that a multimillion-dollar Kennedy Center donation went missing.\",\"zh-TW\":\"聯邦法官下令白宮，在三家媒體對川普（Donald Trump）政府的訴訟進行期間，繼續讓 CNN、MS Now 與 Politico 的記者進入白宮。蒂莫西·凱利（Timothy Kelly）法官在政府上月以報導內容為由封殺三家媒體後，延長了准入。另據 Axios 獨家，白宮正在調查一筆數百萬美元的甘迺迪中心（Kennedy Center）捐款下落不明指控。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"白宮記者准入之爭回到法院——這一回合媒體贏了。聯邦法官再度下令白宮恢復 CNN、MS NOW 與 Politico 三家新聞機構的完整准入，這三家是川普（Donald Trump）總統上月以報導內容為由封殺的對象；在它們對政府的法律挑戰進行期間，准入維持有效。\\n發生了什麼事\\n聯邦地方法院法官蒂莫西·凱利（Timothy Kelly）週二裁定，在媒體聯盟的訴訟進行期間，白宮必須繼續讓三家媒體的記者進入；凱利在9月24日已先給予救濟，起因是政府上月封殺三家媒體的准入。PBS NewsHour 的 Geoff Bennett 與代表三家媒體的律師鮑楚斯（Ted Boutrous）討論了這場法律戰。同一來源群組另有兩則不同報導：Axios 獨家指白宮正在調查爆炸性指控——據前川普律師哈巴（Alina Habba）轉述，前甘迺迪中心（Kennedy Center）負責人格倫內爾（Ric Grenell）未將其億萬富翁丈夫一年前捐給中心的一筆數百萬美元捐款存入；BBC 則報導白宮為新任新聞秘書辯護，回應外界對其法律資格的質疑，並指出凱蒂·扎卡里亞（Katie Zacharia）似乎未在她居住過的任何州登記律師資格。\\n為什麼重要\\n記者准入之爭是問責制的代理戰爭：每一次裁定延續的不只是三家媒體的採訪證，更是「批評總統的報導不能以排除作為懲罰」的先例。而甘迺迪中心（Kennedy Center）捐款調查則把另一條「MAGA 內鬥」故事線——借用 Axios 的說法——塞進本已擁擠的白宮新聞週期。\\n來源異同\\n衛報（The Guardian）與 PBS NewsHour 互相印證准入裁定的核心：凱利（Timothy Kelly）、三家媒體、進行中的訴訟。不同媒體的數字有所不同（24 vs 6），且 Axios 的捐款調查與 BBC 的新聞秘書報導是同一群組裡的不同故事。信任標籤：數字/說法衝突——准入裁定本身有佐證，但群組混入不同故事，摘要數字也有出入。\\n仍不確定\\n摘要未引述凱利的完整理由、未說明訴訟下一步，也未在 Axios 的四名高層消息來源之外證實甘迺迪中心（Kennedy Center）捐款指控；扎卡里亞（Katie Zacharia）資格質疑僅見於單則 BBC 報導。請查閱完整報導確認。\"},\"sources\":[{\"name\":\"BBC World\",\"url\":\"https://www.bbc.co.uk/news/articles/ckqxne2evqreo?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"The Guardian Business\",\"url\":\"https://www.theguardian.com/us-news/2026/oct/14/white-house-media-ban-lifted-cnn-msnow-politico\"},{\"name\":\"PBS NewsHour\",\"url\":\"https://www.pbs.org/newshour/show/attorney-for-banned-outlets-on-legal-fight-over-white-house-press-access\"},{\"name\":\"Axios\",\"url\":\"https://www.axios.com/2026/10/14/trump-kennedy-center-donation-maga-feud\"}],\"disagreements\":{\"en\":\"Figures differ across outlets (e.g. 24 vs 6 in headlines/snippets).\",\"zh-TW\":\"不同媒體的數字有所不同（例如，標題/摘要中為 24 比 6）。\"},\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":25,\"outletReputation\":18,\"crossCorroboration\":17,\"recencyClarity\":25},\"tags\":[\"international\",\"live-ingest\",\"bbc-world\",\"the-guardian-business\",\"pbs-newshour\"],\"glossary\":[{\"blurb\":{\"en\":\"US district court judge who extended White House access for the three banned outlets.\",\"zh-TW\":\"美國聯邦地方法院法官，延長三家被禁媒體的白宮准入。\"},\"term\":{\"en\":\"Timothy Kelly\",\"zh-TW\":\"蒂莫西·凱利\"}},{\"blurb\":{\"en\":\"US news network whose White House access was restored by the ruling.\",\"zh-TW\":\"美國新聞網，裁定恢復其白宮准入。\"},\"term\":{\"en\":\"CNN\",\"zh-TW\":\"CNN\"}},{\"blurb\":{\"en\":\"News outlet covered by the judge's extended-access order.\",\"zh-TW\":\"新聞媒體，涵蓋在法官延長准入命令中。\"},\"term\":{\"en\":\"MS Now\",\"zh-TW\":\"MS Now\"}},{\"blurb\":{\"en\":\"Political news outlet covered by the judge's extended-access order.\",\"zh-TW\":\"政治新聞媒體，涵蓋在法官延長准入命令中。\"},\"term\":{\"en\":\"Politico\",\"zh-TW\":\"Politico\"}},{\"blurb\":{\"en\":\"Attorney representing the three outlets in the press-access lawsuit.\",\"zh-TW\":\"代表三家媒體打記者准入官司的律師。\"},\"term\":{\"en\":\"Ted Boutrous\",\"zh-TW\":\"鮑楚斯\"}},{\"blurb\":{\"en\":\"Former Trump attorney who relayed the Kennedy Center donation allegations.\",\"zh-TW\":\"前川普律師，轉述甘迺迪中心捐款指控。\"},\"term\":{\"en\":\"Alina Habba\",\"zh-TW\":\"哈巴\"}},{\"blurb\":{\"en\":\"Former Kennedy Center leader accused of failing to deposit a multimillion-dollar donation.\",\"zh-TW\":\"前甘迺迪中心負責人，被指未存入數百萬美元捐款。\"},\"term\":{\"en\":\"Ric Grenell\",\"zh-TW\":\"格倫內爾\"}},{\"blurb\":{\"en\":\"Washington arts center at the heart of the missing-donation probe.\",\"zh-TW\":\"華府藝術中心，捐款下落不明調查的核心。\"},\"term\":{\"en\":\"Kennedy Center\",\"zh-TW\":\"甘迺迪中心\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://r85075515.github.io/Trust-digest/\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"Axiom\"}],[\"$\"
