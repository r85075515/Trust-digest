 the worst thing he did in real life is infidelity with this woman who may or may not be a Chinese spy - but she might be - that's enough, because whatever else there is, we don't know. And to me, that's a security risk.' The call came the same day Senate Democratic leader Chuck Schumer demanded a full accounting of President Donald Trump's defense of Huang and urged Congress to quickly approve new restrictions on chip exports to China, citing reports that Trump was briefed on the affair a year ago and did nothing. Democratic Senator Ruben Gallego said lawmakers need to know 'how much the Chinese spy influenced CEO Jensen's decision,' as Nvidia seeks permission to sell advanced chips to China.\nWhy it matters\nThe pressure is now bipartisan, and a senator from the president's own party is saying the quiet part out loud: even if the board's investigation finds no leak, the extortion argument can never be fully disproved, which raises the bar for keeping Huang in the job. The market is pricing the risk in real time - Nvidia fell another 5.5% on Tuesday to close at $168.89 after Monday's 4.3% drop, a two-day slide of 9.5% from Friday's close that wiped out about $430 billion in market value by press calculations. Analyst Dan Ives estimates investors now assign roughly a 15% chance that Huang is removed, and expects the board's probe to take four to six weeks. The calendar is unforgiving: earnings on Nov 17 and a closed-door congressional briefing requested for Nov 18. The takeaway: Huang's future is no longer just a boardroom question - it is an open political fight in Washington.\nSources agree / disagree\nReuters' two reports (Cramer's call and Schumer's demand) are consistent on the underlying facts. The roughly $430 billion two-day market-value loss is a press calculation from Friday's $186.64 close (The Times and others); intraday estimates ran higher - a difference of timing, not of fact. Trust label: Multi-source agreement - Cramer's remarks are on the record, given to Politico and reported by Reuters.\nStill uncertain\nNeither Huang nor Nvidia has responded to Cramer's call. How many Republican senators share his view, whether the pressure becomes a formal hearing or resolution, how long the board's Wachtell-led investigation will run, and whether Trump will defend Huang again all remain open."])</script><script>self.__next_f.push([1,"11:Tab1,"])</script><script>self.__next_f.push([1,"美國參議院銀行委員會資深共和黨參議員克拉默（Kevin Cramer）週二（11 月 10 日）晚間公開呼籲輝達（Nvidia）執行長黃仁勳（Jensen Huang）辭職：黃仁勳坦承與一名疑似中國間諜的女商人有婚外情後，遭勒索的風險本身就是國安問題。路透社週三凌晨發稿，引用克拉默接受 Politico 訪問的原話。\n發生了什麼事\n克拉默對 Politico 說：「遭勒索的潛在可能性太巨大了——像輝達晶片這麼敏感的東西，我就是認為他得走。」他進一步表示：「就算他實際上做的最糟的事只是對婚姻不忠，對象是這名可能是、也可能不是中國間諜的女子——但她有可能就是——那也已經夠了。其他還有什麼，我們不知道；對我來說，這就是國安風險。」同一天，參議院民主黨領袖舒默（Chuck Schumer）要求國會全面交代川普（Donald Trump）為何為黃仁勳辯護，並推動儘速通過新的對中國晶片出口限制；據報導，川普一年前就被簡報過這段關係卻未採取行動。民主黨參議員加列戈（Ruben Gallego）也說，輝達正申請向中國出售先進晶片的許可，「我們需要知道這名中國間諜對黃執行長的決策影響了多少」。\n為什麼重要\n政治壓力正式跨越黨派，而且出聲的是執政黨自家資深參議員：就算董事會調查最後查無洩密，「勒索風險」這個指控也永遠無法被證偽——董事會想留人，門檻被提前拉高。市場同步定價：輝達週二再跌 5.5%、收 168.89 美元，連同週一的 4.3% 跌幅，兩日較週五收盤下跌 9.5%，市值蒸發約 4,300 億美元（媒體以收盤價計算）。分析師 Dan Ives 估計，市場目前給黃仁勳被去職的機率約 15%，並預期董事會調查需時四到六週。時間壓力不變：11 月 17 日財報、18 日國會閉門簡報。結論是：黃仁勳的去留不再只是董事會的內部問題，已成為華府兩黨公開表態的政治題。\n來源異同\n路透社兩篇發稿（克拉默籲辭職、舒默要求交代）對基本事實口徑一致。兩日市值蒸發約 4,300 億美元是媒體以週五收盤價 186.64 美元計算的數字（《泰晤士報》等）；盤中估算一度更高，屬計算時點差異、非事實衝突。信任標籤：多源一致——克拉默的說法是具名公開發言，經路透社引述 Politico 原話。\n仍不確定\n黃仁勳本人與輝達尚未回應克拉默的辭職呼籲。共和黨內有多少參議員跟進、壓力是否升級為正式聽證或決議，尚未明朗；董事會 Wachtell 調查的時程與結論、川普是否再度公開力挺，也都有待後續。"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"adult\":false,\"body\":{\"en\":\"$10\",\"zh-TW\":\"$11\"},\"category\":\"semiconductor\",\"disagreements\":null,\"glossary\":[{\"blurb\":{\"en\":\"Republican US senator from North Dakota and a senior member of the Senate Banking Committee; publicly called on Nvidia CEO Jensen Huang to resign, citing extortion risk.\",\"zh-TW\":\"美國北達科他州共和黨參議員、參議院銀行委員會資深成員；以勒索風險為由公開呼籲輝達執行長黃仁勳辭職。\"},\"term\":{\"en\":\"Kevin Cramer\",\"zh-TW\":\"克拉默（Kevin mittee, told Politico late on Tuesday that Nvidia CEO Jensen Huang has to go: the potential for extortion is 'so tremendous,' given how sensitive Nvidia's chips are and Huang's admitted affair with a businesswoman suspected of being a Chinese spy. Senate Democratic leader Chuck Schumer piled on the same day, demanding a full accounting of President Trump's defense of Huang - the pressure on Huang is now bipartisan.\",\"zh-TW\":\"美國參議院銀行委員會資深共和黨參議員克拉默（Kevin Cramer）週二晚間對 Politico 表示，黃仁勳（Jensen Huang）與疑似中國間諜的女商人傳出婚外情，遭勒索的潛在風險「太巨大」，以輝達晶片的敏感程度，「他就是得走」。同日民主黨領袖舒默也要求國會徹查川普為何力挺黃仁勳——政治壓力已跨越黨派。\"},\"tags\":[\"semiconductor\",\"live-ingest\",\"breaking\",\"nvidia\",\"huang\",\"congress\",\"cramer\"],\"title\":{\"en\":\"Senator Cramer Calls on Nvidia's Jensen Huang to Resign: 'The Potential for Extortion Is So Tremendous'\",\"zh-TW\":\"共和黨資深參議員克拉默籲黃仁勳辭職：「遭勒索的潛在風險太巨大，他就是得走」\"},\"trustBreakdown\":{\"crossCorroboration\":20,\"outletReputation\":20,\"recencyClarity\":22,\"sourceDiversity\":18},\"trustScore\":80}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-semiconductor-06-cramer-calls-huang-resign/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://a
