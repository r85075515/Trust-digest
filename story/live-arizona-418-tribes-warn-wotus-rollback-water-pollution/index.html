ion\" by the Initiative on Universal Access to Clean Water and the Native American Rights Fund, Indigenous communities in Arizona face heightened water quality risks from a proposed revision to the definition of Waters of the United States (WOTUS). Narrowing federal jurisdiction under the Clean Water Act could remove federal safeguards from ephemeral and seasonal waterways connected to tribal water supplies.\n\nWhy it matters\nTribal nations in Arizona rely on seasonal streams, washes, and connected groundwater for drinking water, agriculture, and cultural needs. Advocates and legal researchers emphasize that tribal water rights depend not only on water quantity but also on water quality remaining adequate to support reservation livelihoods.\n\nSource differences\nKJZZ published its coverage under \"Proposed rollback of water protections could hurt tribes the most,\" focusing on how reduced federal oversight affects tribal communities and water protection. Coyote Gulch published a report post under \"Report: Stripped of Protection, tribal nations and the #WOTUS rollback,\" highlighting the report authors and policy context around the WOTUS rollback.\n\nStill uncertain\nThe final scope of any revised federal rule and the exact waterways affected in Arizona remain subject to formal rulemaking steps before final adoption.\n\nTrust label: Single source — KJZZ reporting and the Coyote Gulch post both draw from the same joint report on tribal nations and the WOTUS rollback."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-arizona-418-tribes-warn-wotus-rollback-water-pollution\",\"category\":\"arizona\",\"title\":{\"en\":\"Report Warns Proposed Federal WOTUS Rollback Would Leave Arizona Tribal Waters Vulnerable\",\"zh-TW\":\"新報告警告聯邦擬縮減淨水法管轄範圍將使亞利桑那原民部落水源暴露於污染風險\"},\"summary\":{\"en\":\"A report by the Initiative on Universal Access to Clean Water and the Native American Rights Fund warns that narrowing Waters of the United States (WOTUS) protections could strip Clean Water Act oversight from seasonal streams vital to Arizona tribes, threatening water quality downstream.\",\"zh-TW\":\"普世潔淨水倡議組織與美國原住民權利基金會發布報告指出，聯邦政府擬限縮「美國水域」（WOTUS）定義，恐使亞利桑那州原民部落依賴的季節性溪流與水源失去《淨水法》保護；關鍵結論在於下游部落水質將面臨更高污染風險。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」根據 KJZZ 於11月27日報導，以及普世潔淨水倡議組織與美國原住民權利基金會發布的報告，聯邦政府擬修訂《淨水法》下的「美國水域」（WOTUS）定義，恐使亞利桑那州原住民族群面臨更嚴峻的水質風險；若聯邦管轄範圍縮減，季節性與間歇性水道可能失去聯邦層級的水質保護。\\n\\n「為什麼重要」亞利桑那州原民部落仰賴季節性溪流、乾河道與相連地下水支應民生、農業與傳統需求。相關研究與倡議指出，部落水權不僅涉及水量分配，更關乎水質是否足以維持保留地運作，一旦上游或相連水道缺乏聯邦規範，下游水質恐受衝擊。\\n\\n「來源異同」KJZZ 報導標題為「Proposed rollback of water protections could hurt tribes the most」，聚焦聯邦水質保護縮減對原民部落的潛在衝擊；Coyote Gulch 刊載的報告相關文章標題為「Report: Stripped of Protection, tribal nations and the #WOTUS rollback」，呈現報告團隊與 WOTUS 縮減議題脈絡。\\n\\n「仍不確定」聯邦規則最終定案內容及亞利桑那州境內受影響水道的具體範圍，仍有待後續正式法規程序確認。\\n\\nTrust label: Single source — KJZZ 報導與 Coyote Gulch 貼文皆指向同一份探討原民部落與 WOTUS 縮減的聯合報告，維持單一來源標示。\"},\"glossary\":[{\"term\":{\"en\":\"Waters of the United States (WOTUS)\",\"zh-TW\":\"美國水域（WOTUS）\"},\"blurb\":{\"en\":\"The regulatory definition determining which streams, rivers, and wetlands fall under federal Clean Water Act authority.\",\"zh-TW\":\"界定哪些溪流、河流與濕地受美國《淨水法》聯邦管轄的法規定義。\"}},{\"term\":{\"en\":\"Clean Water Act\",\"zh-TW\":\"《淨水法》\"},\"blurb\":{\"en\":\"The primary federal statute in the United States governing water pollution control and surface water quality standards.\",\"zh-TW\":\"美國規範地表水污染防治與水質標準的核心聯邦法律。\"}},{\"term\":{\"en\":\"Ephemeral stream\",\"zh-TW\":\"季節性／間歇性溪流\"},\"blurb\":{\"en\":\"A channel that carries water briefly only after rainfall or snowmelt, common across arid western landscapes.\",\"zh-TW\":\"僅在降雨或融雪後短暫有水流經的河道，常見於乾旱的美國西部地區。\"}},{\"term\":{\"en\":\"Tribal water rights\",\"zh-TW\":\"原民部落水權\"},\"blurb\":{\"en\":\"Legal rights to water reserved for Indigenous reservations to support homelands and community needs.\",\"zh-TW\":\"為保障原民保留地家園與社群用水需求而保留的法定水資源權利。\"}}],\"sources\":[{\"name\":\"KJZZ\",\"url\":\"https://w
