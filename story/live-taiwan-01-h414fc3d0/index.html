e news cycle also carried a second election story, with President Donald Trump holding his final rally on 2 November at Washington's Lincoln Memorial Reflecting Pool and his administration pressing a legal fight over about 20,000 questioned California mail ballots, but the mobile stations are the main thread of this card.\n\nWhy it matters\nTurnout efforts usually rely on advertising and persuasion, while this one changes the physical cost of voting itself. If a trailer that shows up in a neighbourhood lifts participation, the model is cheap to copy, and that makes it a practical test worth watching beyond one county.\n\nSources agree and disagree\nCNA and PTS cover related but different angles of the pre-election moment: CNA reports the mobile polling stations, while PTS reports Trump's final rally at the Reflecting Pool. The two accounts do not conflict; they describe separate events in the same election run-up.\n\nStill uncertain\nThe snippets give no turnout figures for the mobile stations, no list of stops, and no detail on how many voters used the trailers, so whether the experiment worked cannot be judged from this coverage.\n\nTrust label: Bundled stories"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-01-h414fc3d0\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-taiwan-01-h414fc3d0.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 美國期中選舉前夕　洛杉磯行動投票所如一日快閃店\",\"zh-TW\":\"相關封面圖：美國期中選舉前夕　洛杉磯行動投票所如一日快閃店\"},\"publishedAt\":\"2026-11-03T01:25:32.000Z\",\"title\":{\"en\":\"Los Angeles County's Mobile Polling Stations Tour Neighbourhoods Like Pop-Up Shops\",\"zh-TW\":\"洛杉磯郡（Los Angeles County）行動投票所巡迴各地，有如一日快閃店\"},\"summary\":{\"en\":\"Los Angeles County turned large trailers into mobile polling stations that toured for 10 days before the US midterm election on 3 November, in a drive to encourage voting reported by CNA. The stations worked like one-day pop-up shops, bringing ballots to voters. The experiment tests whether convenience lifts turnout. Next, watch whether other counties copy the trailer model.\",\"zh-TW\":\"美國期中選舉11月3日登場前，加州（California）洛杉磯郡（Los Angeles County）把大型拖車改裝成行動投票站，選前10天巡迴各地擺攤，有如一日限定的快閃店，據中央社（CNA）報導，此舉是為鼓勵投票。把票箱送到選民家門口的實驗，考驗便利性能否拉抬投票率。接下來看其他郡是否跟進拖車模式。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"發生了什麼事\\n美國期中選舉11月3日登場前，加州（California）洛杉磯郡（Los Angeles County）把大型拖車改裝成行動投票站，選前10天巡迴各地擺攤，有如一日限定的快閃店。據中央社（CNA）駐洛杉磯記者林宏翰2日報導，此舉是為鼓勵投票。做法很直白：與其要選民自己找投票所，不如把投票所送到選民面前。同一選舉週期另有一則消息：川普（Donald Trump）總統2日在華府林肯紀念堂倒影池舉行最終造勢，政府也同步就約2萬張受質疑的加州郵寄選票發動法律戰，但行動投票所才是本卡主線。\\n\\n為什麼重要\\n催票通常靠宣傳與說服，這項做法改變的卻是投票本身的實質成本——距離與時間。如果開進社區的拖車真能拉抬參與，這個模式複製成本低，值得在單一郡之外持續觀察。\\n\\n來源異同\\n中央社（CNA）與公視（PTS）報導選前時刻的不同角度：前者報導行動投票所，後者報導川普在倒影池的最終造勢。兩者描述同一選舉前夕的不同事件，並未互相矛盾。\\n\\n仍不確定\\n摘要未提供行動投票所的投票人數、各站地點，也未說明有多少選民使用拖車投票，實驗是否奏效無法僅憑這批報導判斷。\"},\"sources\":[{\"name\":\"中央社-國際\",\"url\":\"https://www.cna.com.tw/news/aopl/202611030033.aspx\"},{\"name\":\"公視新聞網\",\"url\":\"https://news.pts.org.tw/article/833990\"}],\"disagreements\":null,\"trustScore\":74,\"trustBreakdown\":{\"sourceDiversity\":13,\"outletReputation\":22,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"中央社-國際\",\"公視新聞網\"],\"glossary\":[{\"term\":{\"en\":\"Los Angeles County\",\"zh-TW\":\"洛杉磯郡\"},\"blurb\":{\"en\":\"The California county running the mobile polling stations.\",\"zh-TW\":\"推行行動投票站的加州郡。\"}},{\"term\":{\"en\":\"CNA\",\"zh-TW\":\"中央社\"},\"blurb\":{\"en\":\"The Taiwanese news agency reporting the mobile stations.\",\"zh-TW\":\"報導行動投票站的台灣通訊社。\"}},{\"term\":{\"en\":\"PTS\",\"zh-TW\":\"公視\"},\"blurb\":{\"en\":\"Taiwan's public television service, reporting Trump's rally.\",\"zh-TW\":\"報導川普造勢的台灣公共電視。\"}},{\"term\":{\"en\":\"Mobile polling station\",\"zh-TW\":\"行動投票所\"},\"blurb\":{\"en\":\"A trailer converted into a travelling place to vote.\",\"zh-TW\":\"由拖車改裝而成的巡迴投票地點。\"}},{\"term\":{\"en\":\"Midterm election\",\"zh-TW\":\"期中選舉\"},\"blurb\":{\"en\":\
