keaway is practical: if the switching feature works, Otter becomes usable in genuinely multilingual rooms, not just monolingual ones with a second language bolted on.\nSources agree / disagree\nOnly TechCrunch carries the story in the feed, so there is no independent corroboration. Trust label: Single source — one outlet, a product announcement, no cross-check in the snippets. The two numbers in the coverage — 27 new languages and 30+ total — describe the same expansion, not a conflict.\nStill uncertain\nThe snippets give no launch date for the language-switching feature, no list of the new languages, and no pricing details. Those should be checked against the TechCrunch report."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-tech-01-otter-ai-can-now-follow-\",\"category\":\"tech\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-tech-01-otter-ai-can-now-follow-.jpg\",\"imageAlt\":{\"en\":\"Otter AI adds 27 languages and follows language switching\",\"zh-TW\":\"Otter AI 新增 27 種語言、跟上跨語言切換\"},\"publishedAt\":\"2026-11-10T07:00:00.000Z\",\"title\":{\"en\":\"Otter AI Adds 27 Languages, Now Follows Conversations in 30+\",\"zh-TW\":\"Otter AI 新增 27 種語言，跨語言對話跟得上了\"},\"summary\":{\"en\":\"[Unconfirmed · single source] Otter AI added support for 27 languages, bringing its total to more than 30, and revealed an upcoming feature that can keep following a conversation when speakers switch between languages. The report is from TechCrunch alone; pricing and rollout dates were not in the snippet.\",\"zh-TW\":\"［未證實·單一來源］Otter AI 新增 27 種語言支援，總計超過 30 種，並預告即將推出新功能：說話者中途切換語言也能繼續跟上。消息僅見 TechCrunch 一家報導，定價與上線時間未見於摘要。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"Otter AI 剛新增 27 種語言支援，並預告即將推出新功能：說話者中途切換語言也能繼續跟上。支援總數如今超過 30 種。\\n發生了什麼事\\nOtter AI 為其逐字稿服務新增 27 種語言，支援總數突破 30 種。公司也預告一項功能：對話中途有人切換語言時，逐字稿能繼續跟上，不會中斷。\\n為什麼重要\\n多語言會議是 Otter 的核心場景，而中途切換語言是真實會議的常見痛點——每次有人換語言逐字稿就斷掉，根本沒法用。結論很實際：如果切換功能真的可用，Otter 就能在真正多語言的會議室派上用場，而不只是單一語言加掛第二語言。\\n來源異同\\n來源中只有 TechCrunch 報導此事，無法獨立查證。信任標籤：僅1源——單一媒體、產品公告，摘要中無交叉佐證。報導中的兩個數字——新增 27 種、總計 30 種以上——描述的是同一輪擴張，並非衝突。\\n仍不確定\\n摘要未提供切換功能的上線時間、新增語言清單與定價細節。這些請對照 TechCrunch 報導。\"},\"sources\":[{\"name\":\"TechCrunch\",\"url\":\"https://techcrunch.com/2026/11/09/otter-ai-can-now-follow-conversations-across-30-languages/\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":18,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"tech\",\"live-ingest\",\"techcrunch\"],\"glossary\":[{\"term\":{\"en\":\"Otter AI\",\"zh-TW\":\"Otter AI\"},\"blurb\":{\"en\":\"The AI transcription service adding the new languages.\",\"zh-TW\":\"新增語言的 AI 逐字稿服務。\"}},{\"term\":{\"en\":\"Language switching\",\"zh-TW\":\"跨語言切換\"},\"blurb\":{\"en\":\"Speakers changing from one language to another mid-conversation.\",\"zh-TW\":\"說話者在對話中途從一種語言換到另一種語言。\"}},{\"term\":{\"en\":\"Meeting transcription\",\"zh-TW\":\"會議逐字稿\"},\"blurb\":{\"en\":\"A written record of what was said in a meeting.\",\"zh-TW\":\"會議發言內容的文字紀錄。\"}},{\"term\":{\"en\":\"TechCrunch\",\"zh-TW\":\"TechCrunch\"},\"blurb\":{\"en\":\"The technology news outlet that reported the launch.\",\"zh-TW\":\"報導此次發布的科技新聞媒體。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-tech-01-otter-ai-can-now-follow-/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"
