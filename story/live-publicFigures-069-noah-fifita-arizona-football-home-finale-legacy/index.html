 is set to play his final home game at Casino Del Sol Stadium in Tucson on Saturday, November 28, 2026, when Arizona hosts rival Arizona State in the 100th Territorial Cup. In a November 26 Associated Press profile carried by FOX Sports and WSLS, coaches and teammates praised Fifita's decision to remain loyal to Arizona despite coaching turnover and lucrative transfer portal opportunities.\n\nFollowing a 35–28 overtime road win at Kansas State on November 21, Fifita—also named a 2026 Wuerffel Trophy finalist for community service, academics, and athletics—was recognized for running local youth football camps, coaching flag football, and deferring post-win media interviews to teammates while taking full responsibility after losses.\n\nFOX Sports and WSLS publish the identical Associated Press dispatch by John Marshall, detailing Fifita's Tucson community work, offensive coordinator Seth Doege's praise, and the upcoming Territorial Cup finale.\n\nWhether Fifita will enter the 2027 NFL Draft or pursue remaining collegiate eligibility after the bowl season has not yet been announced.\n\nTrust label: Multi-source agreement — FOX Sports and WSLS carry the identical Associated Press report on Noah Fifita's final home game."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-publicFigures-069-noah-fifita-arizona-football-home-finale-legacy\",\"category\":\"publicFigures\",\"title\":{\"en\":\"No. 16 Arizona Quarterback Noah Fifita Heads Into Territorial Cup Home Finale With Legacy Secured\",\"zh-TW\":\"全美第 16 名亞利桑那大學四分衛諾亞・菲菲塔迎戰主場最終戰，忠誠與社區貢獻獲讚譽\"},\"summary\":{\"en\":\"No. 16 Arizona quarterback Noah Fifita prepares to play his final home game in the 100th Territorial Cup rivalry against Arizona State on November 28 in Tucson. Associated Press highlights his decision to stay loyal to the Wildcats through coaching changes and his deep community involvement.\",\"zh-TW\":\"全美排名第 16 的亞利桑那大學野猫隊四分衛諾亞・菲菲塔（Noah Fifita），將於 11 月 28 日在土桑主場迎戰第 100 屆「領土盃」對決亞利桑那州立大學的生涯主場最終戰。美聯社指出，他在教練團更迭期間選擇留隊並積極投入當地社區服務，已奠定隊史傳奇地位。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n全美大學美式足球排名第 16 的亞利桑那大學野猫隊（Arizona Wildcats）明星四分衛諾亞・菲菲塔（Noah Fifita），將於 2026 年 11 月 28 日晚間在土桑（Tucson）主場迎戰同州宿敵亞利桑那州立大學（Arizona State），在具有百年歷史的第 100 屆「領土盃」（Territorial Cup）上演大學生涯主場最終戰。美聯社（Associated Press）專文指出，儘管經歷教練團更迭與高額轉學市場誘因，菲菲塔始終選擇留守亞利桑那大學。\\n「為什麼重要」\\n在大學體育高度商業化與球員頻繁轉隊的時代，菲菲塔不僅在場上率隊於 11 月 21 日延長賽以 35 比 28 客場擊敗堪薩斯州立大學，場下更在土桑舉辦青少年美式足球訓練營與指導腰旗美式足球，並入圍表彰社區服務與學業表現的 2026 年伍爾費爾獎（Wuerffel Trophy）決選名單；進攻協調員塞斯・多格（Seth Doege）盛讚他是「身邊見過最偉大的人」。\\n「來源異同」\\n福斯體育網（FOX Sports）與電視台《WSLS》均全文刊登美聯社記者約翰・馬歇爾（John Marshall）的報導，對於菲菲塔的社區貢獻、贏球時將受訪機會讓給隊友的作風以及領土盃賽程完全一致，無事實分歧。\\n「仍不確定」\\n菲菲塔在賽季末碗賽結束後是否將正式投入 2027 年 NFL 選秀，目前尚未對外公布決定。\"},\"glossary\":[{\"term\":{\"en\":\"Territorial Cup\",\"zh-TW\":\"領土盃\"},\"blurb\":{\"en\":\"The annual college football rivalry game between the University of Arizona and Arizona State University, first played in 1899.\",\"zh-TW\":\"亞利桑那大學與亞利桑那州立大學之間一年一度的大學美式足球宿敵對抗賽，自 1899 年起舉辦，為全美最古老的州內宿敵獎盃賽之一。\"}},{\"term\":{\"en\":\"Wuerffel Trophy\",\"zh-TW\":\"伍爾費爾獎\"},\"blurb\":{\"en\":\"A premier college football award honoring players who combine exemplary community service with athletic and academic achievement.\",\"zh-TW\":\"美國大學美式足球界最高榮譽之一，專門表彰在社區公益服務、學業成績與球場表現皆具卓越典範的球員。\"}},{\"term\":{\"en\":\"Transfer portal\",\"zh-TW\":\"大學體育轉學系統\"},\"blurb\":{\"en\":\"An NCAA database allowing college athletes to declare their intent to transfer and be recruited by other universities.\",\"zh-TW\":\"全美大學體育協會（NCAA）設立的官方資料庫，允許學生運動員登記轉學意願並接受其他大學招募。\"}}],\"sources\":[{\"name\":\"FOX Sports\",\"url\":\"https://www.foxsports.com/articles/cfb/no-16-arizonas-noah-fifita-heads-into-home-finale-with-his-legacy-secured\"},{\"name\":\"WSLS\",\"url\":\"https://www.wsls.com/sports/2026/11/26/no-16-arizonas-noah-fifita-heads-into-home-finale-with-his-legacy-secured/\"}],\"imageUrl\":\"/covers/live/live-publicFigures-069-noah-fifita-arizona-football-home-finale-legacy.jpg\",\"imageAlt\":{\"en\":\"Arizona quarterback Noah Fifita preparing to pass during a college football game in Tucson\",\"zh-TW\":\"亞利桑那大學四分衛諾亞・菲菲塔在土桑主場比賽中準備傳球\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":84,\"trustBreakdown\":{\"crossCorroboration\":21,\"outletReputation\":22,\"recencyClarity\":21,\"sourceDiversity\":20},\"publishedAt\":\"2026-11-27T14:47:18.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":4,\"D2\":4,\"D3\":4,\"D4\":4,\"D5\":4,\"total\":20},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-publicFigures-069-noah-fifita-arizona-football-home-finale-legacy/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-publicFigures-069-noah-fifita-arizona-football-home-finale-legacy/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</s
