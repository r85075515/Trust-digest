 NT$850 billion is a heavy-volume rally, and the split underneath it matters: local institutions bought while foreign investors sold, so the rally was carried by domestic money rather than foreign inflows. That split is the first thing to check when judging whether the move holds.\n\nSources agree–disagree\nOnly one source, CNA, is listed for this card, so the figures have no second outlet to check them against. The three component flows and the combined net figure are all from the same CNA report and are internally consistent.\n\nStill uncertain\nThe feed summary gives no breakdown of how much each of the three groups bought or sold, no sector detail behind the rally, and no reason for the foreign selling. The full CNA report is the place to check those details.\n\nTrust label: Single source — one outlet, uncorroborated; figures are as reported in that outlet's feed summary."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-01-202-56\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"publishedAt\":\"2026-11-11T07:10:04.000Z\",\"title\":{\"en\":\"Taiwan's Three Major Institutional Investors Net Buy NT$20.26 Billion as TAIEX Jumps 1,545 Points\",\"zh-TW\":\"三大法人買超台股 202.56 億元，加權指數大漲 1545.23 點\"},\"summary\":{\"en\":\"［未證實·單一來源］ Taiwan's three major institutional investor groups bought a net NT$20.26 billion of local shares, CNA reports, as the TAIEX rose 1,545.23 points to close at 44,257.15 on turnover of NT$849.17 billion. Foreign investors sold on balance while investment trusts and dealers bought. Watch whether foreign selling persists into the next session.\",\"zh-TW\":\"［未證實·單一來源］中央社（CNA）報導，三大法人合計買超台股 202.56 億元；台股今天漲 1545.23 點、收在 44257.15 點，成交值 8491.65 億元。外資及陸資賣超、投信與自營商買超；後續看外資賣壓是否延續。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"中央社（CNA）台北報導，三大法人合計買超台股 202.56 億元；台股今天漲 1545.23 點、收在 44257.15 點，成交值 8491.65 億元。外資及陸資賣超，投信與自營商買超。\\n\\n發生了什麼事\\n中央社報導，台股今天漲 1545.23 點、收在 44257.15 點，成交值 8491.65 億元。三大法人中，外資及陸資賣超、投信買超、自營商買超，合計買超 202.56 億元。\\n\\n為什麼重要\\n單日大漲 1545 點、成交值近 8,500 億元，是量能很強的反彈；但結構更關鍵：本地法人買、外資賣，這波漲勢由內資撐起，不是外資流入推動。判斷漲勢能否延續，先看這個分歧。\\n\\n來源異同\\n本卡只有中央社一個來源，數字無從交叉驗證。三類法人的流向與合計買超數都出自同一篇中央社報導，內部一致。\\n\\n仍不確定\\n快訊摘要沒給三類法人各自買賣的金額、沒寫漲勢背後的類股細節，也沒說明外資賣出的原因，須看中央社完整報導。\"},\"sources\":[{\"name\":\"中央社-產經證券\",\"url\":\"https://www.cna.com.tw/news/afe/202611110182.aspx\"}],\"disagreements\":null,\"trustScore\":59,\"trustBreakdown\":{\"crossCorroboration\":6,\"outletReputation\":22,\"recencyClarity\":25,\"sourceDiversity\":6},\"tags\":[\"taiwan\",\"live-ingest\",\"中央社-產經證券\"],\"glossary\":[{\"term\":{\"en\":\"TAIEX\",\"zh-TW\":\"加權指數\"},\"blurb\":{\"en\":\"Taiwan Stock Exchange weighted index, tracking listed shares in Taiwan.\",\"zh-TW\":\"臺灣加權股價指數，反映台股整體走勢。\"}},{\"term\":{\"en\":\"Institutional investors\",\"zh-TW\":\"三大法人\"},\"blurb\":{\"en\":\"Large organisations, such as funds and dealers, that trade shares in volume.\",\"zh-TW\":\"大額交易股票的大型機構，如基金與自營商。\"}},{\"term\":{\"en\":\"Foreign investors\",\"zh-TW\":\"外資\"},\"blurb\":{\"en\":\"Overseas investors trading Taiwan-listed shares.\",\"zh-TW\":\"買賣台股的境外投資人。\"}},{\"term\":{\"en\":\"Investment trusts\",\"zh-TW\":\"投信\"},\"blurb\":{\"en\":\"Domestic fund managers that pool investor money to buy securities.\",\"zh-TW\":\"募集投資人資金買賣有價證券的國內基金業者，俗稱投信。\"}},{\"term\":{\"en\":\"Dealers\",\"zh-TW\":\"自營商\"},\"blurb\":{\"en\":\"Securities firms trading shares with their own capital.\",\"zh-TW\":\"用自有資金買賣股票的證券商，俗稱自營商。\"}},{\"term\":{\"en\":\"CNA\",\"zh-TW\":\"中央社\"},\"blurb\":{\"en\":\"Central News Agency, Taiwan's national news agency.\",\"zh-TW\":\"中央通訊社，台灣的國家通訊社。\"}}],\"imageUrl\":\"/covers/live/live-taiwan-01-202-56.jpg\",\"imageAlt\":{\"en\":\"Taiwan stock market board showing the TAIEX up 1,545 points as institutional investors buy a net NT$20.26 billion\",\"zh-TW\":\"台股大漲 1545 點，三大法人買超 202.56 億元\"}}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"n
