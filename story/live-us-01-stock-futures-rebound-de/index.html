historically struggled. Stock futures rebounded in the same news cycle.\nWhat happened\nDecision Desk HQ projects Democrats will lock down 258 seats in the House for the next Congress, the party's largest majority in a regular election in three decades, according to The Hill, and the largest this century, according to the Financial Times. Bloomberg's bundle headline pairs the result with a rebound in stock futures. The Hill also reports that lawmakers plan to use their powers to investigate claims of corruption levelled at the Trump administration.\nWhy it matters\nA 258-seat majority is not a narrow win; it is a working majority that changes what the next Congress can do, including investigations the party has been promising. The scale of the win, in places Democrats have historically struggled, is the story: it reads as a broad verdict rather than a turnout quirk. The futures rebound in the same breath suggests markets took the outcome in stride.\nSources agree-disagree\nThe Hill, Bloomberg and the Financial Times all report the same Democratic House win. The descriptions differ in framing, largest in three decades versus largest this century, but both point the same way and rest on the same 258-seat projection. Trust label: Bundled stories: the 258-seat projection is corroborated across outlets; the futures rebound comes from the bundle headline.\nStill uncertain\nThe summaries give no final certified totals, no Senate picture, and no detail on which corruption investigations will come first. The 258 figure is a projection, not a certified count, and the futures move is reported without levels."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-us-01-stock-futures-rebound-de\",\"category\":\"us\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-us-01-stock-futures-rebound-de.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Stock Futures Rebound, Democrats Largest House Majority, More\",\"zh-TW\":\"相關封面圖：股票期貨反彈，民主黨在眾議院獲得多數席位，更多\"},\"publishedAt\":\"2026-11-23T02:06:55.000Z\",\"title\":{\"en\":\"Democrats Projected to Win 258 House Seats as Stock Futures Rebound\",\"zh-TW\":\"民主黨預計拿下眾議院 258 席創數十年最大多數，美股期貨反彈\"},\"summary\":{\"en\":\"Democrats are projected to lock down 258 seats in the US House, their largest majority in a regular election in decades, according to Decision Desk HQ, after notable 2026 midterm wins in regions where they have historically struggled. Stock futures rebounded in the same news cycle. Lawmakers plan to use their powers to investigate corruption claims against the Trump administration.\",\"zh-TW\":\"據 Decision Desk HQ 預測，民主黨將在美國眾議院拿下 258 席，創下數十年來定期選舉中最大的多數；2026 年期中選舉中，他們在歷來弱勢的地區也取得顯著勝利。同一波新聞中，美股期貨反彈。議員計畫動用職權調查針對川普政府的貪腐指控。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"民主黨拿下數十年來定期選舉中最大的眾議院多數，據 Decision Desk HQ 預測將在下屆國會掌握 258 席；2026 年期中選舉中，他們在歷來弱勢的地區也取得顯著勝利。同一波新聞中，美股期貨反彈。\\n發生了什麼事\\nDecision Desk HQ 預測民主黨將在下屆國會拿下眾議院 258 席。國會山報（The Hill）稱這是三十年來最大的多數，金融時報（Financial Times）則稱是本世紀最大。彭博（Bloomberg）的綜合標題把這個結果與美股期貨反彈並列。國會山報另指出，議員計畫動用職權調查針對川普政府的貪腐指控。\\n為什麼重要\\n258 席不是險勝，而是一個能做事的多數，改變下屆國會能做什麼，包括民主黨一直承諾的調查。勝選規模才是重點——在歷來弱勢的地區也贏了，讀起來像是一次廣泛的表態，而不只是投票率的偶然。期貨同步反彈，顯示市場對這個結果處之泰然。\\n來源異同\\n國會山報、彭博、金融時報三家報導的是同一場民主黨眾議院勝選。措辭略有不同——三十年最大或本世紀最大——但方向一致，都建立在 258 席的預測上。信任標籤：捆綁報導：258 席預測獲多家來源證實；期貨反彈出自綜合標題。\\n仍不確定\\n摘要未給最終認證票數、未提參議院局勢，也沒說貪腐調查會先從哪一件下手。258 席是預測、不是認證結果，期貨反彈也沒有報出具體點位。\"},\"sources\":[{\"name\":\"The Hill\",\"url\":\"https://thehill.com/homenews/house/6236301-democrats-secure-house-majority/\"},{\"name\":\"Bloomberg News\",\"url\":\"https://www.bloomberg.com/news/audio/2026-11-23/stock-futures-rebound-democrats-largest-house-majority-more\"},{\"name\":\"Financial Times\",\"url\":\"https://www.ft.com/content/9d2983a7-196d-4164-a0c1-e262f32fd8c9?syn-25a6b1a6=1\"}],\"disagreements\":{\"en\":\"Figures differ across outlets (e.g. 258 vs 0 in headlines/snippets).\",\"zh-TW\":\"各個媒體的數字有所不同（例如，標題/摘要中的數字為 258 與 0）。\"},\"trustScore\":79,\"trustBreakdown\":{\"sourceDiversity\":20,\"outletReputation\":20,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"us\",\"live-ingest\",\"the-hill\",\"bloomberg-news\",\"financial-times\"],\"glossary\":[{\"term\":{\"en\":\"Decision Desk HQ\",\"zh-TW\":\"Decision Desk HQ\"},\"blurb\":{\"en\":\"Election results firm behind the 258-seat House projection.\",\"zh-TW\":\"做出 258 席眾議院預測的選舉結果分析機構。\"}},{\"term\":{\"en\":\"Democratic Party\",\"zh-TW\":\"民主黨\"},\"blurb\":{\"en\":\"US political party projected to win the large House majority.\",\"zh-TW\":\"預計拿下眾議院大多數的美國政黨。\"}},{\"term\":{\"en\":\"US House of Representatives\",\"zh-TW\":\"美國眾議院\"},\"blurb\":{\"en\":\"Lower chamber of the US Congress, with 435 seats.\",\"zh-TW\":\"美國國會下議院，共 435 席。\"}},{\"term\":{\"en\":\"Donald Trump\",\"zh-TW\":\"川普\"},\"blurb\":{\"en\":\"President of the United States, whose administration faces planned investigations.\",\"zh-TW\":\"美國總統，其政府面臨計畫中的調查。\"}},{\"term\":{\"en\":\"Bloomberg\",\"zh-TW\":\"彭博\"},\"blurb\":{\"en\":\"Financial news outlet whose bundle headline pairs the win with the futures rebound.\",\"zh-TW\":\"把勝選與期貨反彈並列報導的財經媒體。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-us-01-stock-futures-rebound-de/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and expla
