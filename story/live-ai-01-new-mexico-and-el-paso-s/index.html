enhouse gas emissions by 2050. A few months later, just across the state line in Texas, Meta began building a massive data center on the northeast edge of El Paso, on the New Mexico border. ProPublica's reporting frames the collision directly: the region's climate spending could be wiped out by the new facilities' footprint. In a separate item, Wired AI reports that amid a wave of backlash, industry-friendly groups are employing creative, time-tested strategies to woo the youth — the headline's pitch is “your kid's field trip,” a PR plan to make data centers lovable.\nWhy it matters\nData centers are the physical cost of the AI boom, and their power demand lands hardest on local grids and local climate math. This story is that tension in miniature: a state writes an ambitious 2050 emissions plan while a hyperscaler builds next door. The youth-outreach angle matters too — it shows the industry knows it has a legitimacy problem and is playing a long game for public acceptance.\nSources agree / disagree\nProPublica and Wired AI cover two different angles of the same data-center backlash — the climate arithmetic and the PR playbook — and neither contradicts the other. No numeric or name conflicts appear in the snippets.\nStill uncertain\nThe snippets are truncated; the exact emissions impact of the three data centers, the status of the El Paso build, and what the field-trip programs actually involve are not detailed."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-ai-01-new-mexico-and-el-paso-s\",\"category\":\"ai\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-ai-01-new-mexico-and-el-paso-s.jpg\",\"imageAlt\":{\"en\":\"Cover related to: New Mexico and El Paso Spent Millions on Climate Plans. Three New Data Centers Could Undo Them.\",\"zh-TW\":\"相關封面圖：新墨西哥州和埃爾帕索在氣候計畫上花費了數百萬美元。三個新的資料中心可以消除它們。\"},\"publishedAt\":\"2026-10-18T10:30:00.000Z\",\"title\":{\"en\":\"New Mexico and El Paso Spent Millions on Climate Plans. Three New Data Centers Could Undo Them.\",\"zh-TW\":\"新墨西哥州和埃爾帕索在氣候計畫上花費了數百萬美元。三個新的資料中心可以消除它們。\"},\"summary\":{\"en\":\"New Mexico and El Paso spent millions on climate plans, but three new data centers could undo them: Meta is building a massive facility on El Paso's northeast edge, on the New Mexico border. Separately, Wired reports industry-friendly groups are courting youth — ‘your kid's field trip’ — to sell data centers.\",\"zh-TW\":\"新墨西哥州與埃爾帕索（El Paso）砸下數百萬美元做氣候計畫，但三座新資料中心可能讓一切白費：Meta 正在埃爾帕索東北邊緣、緊鄰新墨西哥州界興建大型設施。另據《連線》（Wired）報導，親產業團體正以「你孩子的校外教學」向年輕世代推銷資料中心。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"新墨西哥州與埃爾帕索（El Paso）砸下數百萬美元做氣候計畫，但三座新的資料中心可能讓一切付諸東流。\\n發生了什麼事\\n去年 12 月，新墨西哥州官員高調公布氣候計畫，要在 2050 年前大幅削減全州溫室氣體排放。幾個月後，州界另一頭的德州傳來消息：Meta 正在埃爾帕索東北邊緣、緊鄰新墨西哥州界興建大型資料中心。ProPublica 的報導直接點出衝突：這些新設施的碳足跡，可能抵銷掉地方政府的氣候投資。另一條《連線》（Wired）的消息則說，面對一波抵制聲浪，親產業團體正用富有創意且行之有年的手法拉攏年輕人——標題寫得很直白：「你孩子的校外教學」，一套讓資料中心變可愛的公關計畫。\\n為什麼重要\\n資料中心是 AI 熱潮的實體代價，用電需求直接壓在地方電網與地方氣候帳本上。這則新聞就是這種張力的縮影：一邊是州政府寫下雄心勃勃的 2050 減排計畫，另一邊是科技巨頭在隔壁大興土木。拉攏年輕人的手法也值得注意——代表產業自知有正當性問題，正在為公眾接受度打長期戰。\\n來源異同\\nProPublica 談氣候帳本，《連線》談公關劇本，兩家從不同角度切入同一波資料中心反彈，彼此不衝突。摘要中沒有數字或名稱矛盾。\\n仍不確定\\n來源摘要多處截斷：三座資料中心的確切排碳衝擊、埃爾帕索廠的進度、校外教學計畫的實際內容，摘要都沒細寫。\"},\"sources\":[{\"name\":\"Wired AI\",\"url\":\"https://www.wired.com/story/data-center-industry-is-trying-to-woo-kids/\"},{\"name\":\"ProPublica\",\"url\":\"https://www.propublica.org/article/data-centers-texas-new-mexico-greenhouse-gas-emissions\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":16,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"ai\",\"live-ingest\",\"wired-ai\",\"propublica\"],\"glossary\":[{\"term\":{\"en\":\"Meta\",\"zh-TW\":\"Meta\"},\"blurb\":{\"en\":\"US technology company building a massive data center on El Paso's northeast edge.\",\"zh-TW\":\"美國科技公司，正在埃爾帕索東北邊緣興建大型資料中心。\"}},{\"term\":{\"en\":\"El Paso\",\"zh-TW\":\"埃爾帕索\"},\"blurb\":{\"en\":\"Texas city on the New Mexico border, site of the new Meta data center.\",\"zh-TW\":\"德州城市，緊鄰新墨西哥州界，Meta 新資料中心所在地。\"}},{\"term\":{\"en\":\"New Mexico\",\"zh-TW\":\"新墨西哥州\"},\"blurb\":{\"en\":\"US state whose 2050 emissions-reduction plan could be undermined by new data centers.\",\"zh-TW\":\"美國州，2050 減排計畫可能被新資料中心抵銷。\"}},{\"term\":{\"en\":\"ProPublica\",\"zh-TW\":\"ProPublica\"},\"blurb\":{\"en\":\"US nonprofit investigative newsroom reporting the climate-plans-vs-data-centers collision.\",\"zh-TW\":\"美國非營利調查新聞機構，報導氣候計畫與資料中心的衝突。\"}},{\"term\":{\"en\":\"Wired\",\"zh-TW\":\"連線\"},\"blurb\":{\"en\":\"Technology media outlet reporting the industry's youth-focused data center PR push.\",\"zh-TW\":\"科技媒體，報導產業向年輕世代推銷資料中心的公關操作。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://r85075515.github.io/Trust-digest/\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"Axiom\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"zh_TW\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:locale:alternate\",\"content\":\"en_US\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"9\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"10\",{\"name\":\"tw
