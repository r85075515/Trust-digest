6, lowering sector module #9 into the tokamak pit between already-installed modules #8 and #1. Standing over 16 meters tall and weighing roughly 1,380 tonnes with its lifting rig, the unit left lateral clearances as tight as 48 millimeters and came within 62 millimeters of cryostat wall piping after applying a 140-millimeter radial offset.\n\nThis marks the first time ITER crews have inserted a sector module directly between two neighboring units already inside the pit, leaving seven of the nine 40-degree vacuum vessel segments in place. Program manager Jens Reich stated that the milestone keeps assembly ahead of the Baseline 2024 schedule and supports completing all nine sector installations by early spring 2027.\n\nITER's official news release (ITER installs seventh sector module in its tightest lift yet) and its accompanying technical feature (A tight squeeze) report identical engineering figures, including the 1,380-tonne total load and seven of nine vacuum vessel modules now installed. Independent external media coverage of the November 26 installation had not yet been indexed at the time of retrieval, so both verified article-level sources originate from the ITER Organization.\n\nSpecialized Toroidal Field Coil In-Pit Installation Tool (TIPI) tables still need to shift the module radially into its final alignment within a 500-micron tolerance, and the final two sector modules remain to be lowered before welding the plasma chamber.\n\nTrust label: Single source — Both verified article-level dispatches originate from the ITER Organization."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-science-191-iter-seventh-tokamak-sector-module\",\"category\":\"science\",\"title\":{\"en\":\"ITER Installs Seventh Tokamak Sector Module With Under 5 Centimeters of Clearance\",\"zh-TW\":\"國際熱核融合實驗反應爐完成第 7 座扇形模組吊裝，兩側間隙不足 5 公分\"},\"summary\":{\"en\":\"ITER assembly teams completed a 24-hour operation on November 26, 2026, lowering the nearly 1,400-tonne seventh tokamak sector module between two already-installed units with less than 5 centimeters of lateral clearance, keeping the project on track to install all nine modules by early spring 2027.\",\"zh-TW\":\"國際熱核融合實驗反應爐（ITER）工程團隊於 2026 年 11 月 26 日完成第 7 座托卡馬克扇形模組吊裝，首度將近 1,400 公噸重型構件嵌入兩座已就位模組之間且兩側最小間隙不到 5 公分，使全數 9 座模組有望如期於 2027 年初春完工。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」國際熱核融合實驗反應爐（ITER）組裝團隊自 2026 年 11 月 25 日啟動吊裝，歷經 24 小時精密作業於 26 日將第 7 座扇形模組（編號 9 號）落座於托卡馬克深坑重力支撐上。該模組高逾 16 公尺、連同吊具重約 1,380 公噸，團隊先採 140 毫米徑向偏移以騰出空間，在最窄處僅留 48 毫米側向間隙且距離低溫恆溫器內壁管線僅 62 毫米的條件下完成就位。\\n\\n「為什麼重要」這是 ITER 首次在深坑內兩座已安裝相鄰模組之間直接嵌入新模組，代表構成電漿真空室的 9 座 40 度扇形模組已有 7 座就位。組裝計畫經理延斯・萊希（Jens Reich）指出，此進展使工程保持領先 2024 年基準時程，並強化團隊在 2027 年初春完成全數 9 座模組安裝的信心。\\n\\n「來源異同」ITER 官方新聞稿與同期發布的技術專文（A tight squeeze）對 11 月 25 日至 26 日完成 24 小時吊裝、1,380 公噸總重以及 9 座模組已有 7 座就位等數據完全一致；截至檢索時外部獨立媒體尚未刊出本次吊裝單篇報導，故目前兩條文章級來源均出自 ITER 官方。\\n\\n「仍不確定」工程團隊後續仍須動用坑內專用定位平台，以 500 微米公差將該模組徑向推回最終設計位置，且最後 2 座扇形模組預計要到 2027 年初春才會全部吊裝完畢。\\n\\nTrust label: Single source — 兩條文章級來源均出自 ITER 官方發布之新聞稿與技術專文。\"},\"glossary\":[{\"term\":{\"en\":\"Tokamak\",\"zh-TW\":\"托卡馬克（Tokamak）\"},\"blurb\":{\"en\":\"A doughnut-shaped magnetic confinement device designed to contain superheated plasma for nuclear fusion.\",\"zh-TW\":\"利用強大環形磁場約束高溫電漿以實現受控核融合反應的環形裝置。\"}},{\"term\":{\"en\":\"Sector module\",\"zh-TW\":\"扇形模組（Sector module）\"},\"blurb\":{\"en\":\"One of nine 40-degree sub-assemblies combining a vacuum vessel section, thermal shield, and two toroidal field coils.\",\"zh-TW\":\"構成反應爐核心的九分之一（40 度）預組裝單元，整合真空室區段、熱屏蔽與兩座環向場線圈。\"}},{\"term\":{\"en\":\"Cryostat\",\"zh-TW\":\"低溫恆溫器（Cryostat）\"},\"blurb\":{\"en\":\"The outer stainless-steel vacuum chamber surrounding ITER's superconducting magnets to maintain cryogenic temperatures.\",\"zh-TW\":\"包覆超導磁體系統的大型不鏽鋼真空外殼，用以維持極低溫運作環境。\"}}],\"sources\":[{\"name\":\"ITER Organization (News Release)\",\"url\":\"https://www.iter.org/iter-installs-seventh-sector-module-its-tightest-lift-yet\"},{\"name\":\"ITE
