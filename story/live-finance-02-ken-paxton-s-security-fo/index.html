related MarketWatch story: Social Security is projected to become insolvent in six years, with proposals like taxing stocks, estates, and employee benefits floated as fixes beyond raising payroll taxes.\nWhat happened\nProPublica reports that after Paxton was impeached in the summer of 2023 on charges of abusing his office for personal gain, he was suspended and barred from conducting any official business for more than three months while awaiting trial in the state Senate — and he traveled during that stretch. Separately, MarketWatch reports on creative proposals to keep Social Security solvent, arguing that \"math is math\" regardless of party.\nWhy it matters\nThe judgment writes itself: a suspended official billing taxpayers millions for security on trips with no stated public purpose is the kind of finding that ends careers — or, in Texas politics, starts a new chapter of them. The Social Security item is the quieter warning: insolvency in six years means the fix debate is no longer theoretical.\nSources agree / disagree\nThe two stories are unrelated and each comes from a single outlet — Paxton solely from ProPublica (with Texas Tribune illustration credit), Social Security solely from MarketWatch. Trust label: Bundled stories + each single-sourced — two separate single-source investigations bundled; the Paxton figures rest on ProPublica's reporting alone.\nStill uncertain\nThe feed snippets give no dollar total beyond \"millions\" and no response from Paxton's office. Verify the full investigation before quoting numbers."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-02-ken-paxton-s-security-fo\",\"category\":\"finance\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-finance-02-ken-paxton-s-security-fo.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Ken Paxton’s Security for Travel Cost Taxpayers Millions. Just 1 in 6 of His Trips Had a Stated Business Purpose.\",\"zh-TW\":\"相關封面圖：肯·帕克斯頓 (Ken Paxton) 的旅行安全花費了納稅人數百萬美元。他的旅行中只有六分之一有明確的商業目的。\"},\"publishedAt\":\"2026-10-10T19:44:00.000Z\",\"title\":{\"en\":\"ProPublica: Ken Paxton's Travel Security Cost Taxpayers Millions\",\"zh-TW\":\"ProPublica：肯·帕克斯頓（Ken Paxton）差旅維安花掉納稅人數百萬美元\"},\"summary\":{\"en\":\"A ProPublica investigation found Texas AG Ken Paxton's travel security cost taxpayers millions, with only one in six trips having a stated business purpose. The cluster also bundles an unrelated MarketWatch item on fixes for Social Security's projected insolvency. MarketWatch separately covers proposals to fix Social Security's projected insolvency.\",\"zh-TW\":\"ProPublica 調查發現，德州檢察長肯·帕克斯頓（Ken Paxton）的差旅維安花掉納稅人數百萬美元，且只有六分之一的行程有明確公務名目。同批另有一條無關的 MarketWatch 報導，談社會安全制度預計破產的解方。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"德州檢察長肯·帕克斯頓（Ken Paxton）的差旅維安花掉納稅人數百萬美元，而且他的行程中只有六分之一有明確的公務名目——這是 ProPublica 調查的發現。同批抓取的另有一條無關的 MarketWatch 報導：社會安全制度預計六年內破產，除了調高薪資稅，對股票、遺產與員工福利課稅等創意解方也被提出來討論。\\n發生了什麼事\\nProPublica 報導，2023年夏天帕克斯頓因被控濫用職權謀私而遭彈劾，被停職並在州參議院審判期間超過三個月不得處理任何公務——而那段時間他照樣出門旅行。另一條 MarketWatch 報導則盤點讓社會安全制度免於破產的方案，主張「數學就是數學」，不分黨派都得面對。\\n為什麼重要\\n判斷不言自明：一個被停職的官員，讓納稅人為沒有公務名目的行程支付數百萬美元維安費——這種調查結果足以終結政治生涯，或者，在德州政治裡開啟新篇章。社會安全那條則是比較安靜的警訊：六年內破產，代表解方之爭已經不是理論題。\\n來源異同\\n兩條新聞互不相關，而且各自只有單一來源：帕克斯頓案只有 ProPublica（插圖掛名德州論壇報），社會安全案只有 MarketWatch。信任標籤：混裝＋各自單一來源——兩篇獨立的單一來源調查被包在一起，帕克斯頓的數字完全建立在 ProPublica 的報導上。\\n仍不確定\\n來源摘要除了「數百萬美元」沒有具體金額，也沒有帕克斯頓辦公室的回應。引用數字前請查閱完整調查報導。\"},\"sources\":[{\"name\":\"MarketWatch\",\"url\":\"https://www.marketwatch.com/story/taxing-stocks-estates-and-employee-benefits-could-keep-social-security-from-running-out-of-money-heres-who-could-pay-the-most-616be82c?mod=mw_rss_topstories\"},{\"name\":\"ProPublica\",\"url\":\"https://www.propublica.org/article/ken-paxton-travel-security-costs\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":13,\"outletReputation\":10,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"finance\",\"live-ingest\",\"marketwatch\",\"marketwatch\",\"propublica\"],\"glossary\":[{\"term\":{\"en\":\"Ken Paxton\",\"zh-TW\":\"肯·帕克斯頓\"},\"blurb\":{\"en\":\"Texas attorney general investigated over travel security spending.\",\"zh-TW\":\"因差旅維安支出被調查的德州檢察長。\"}},{\"term\":{\"en\":\"ProPublica\",\"zh-TW\":\"ProPublica\"},\"blurb\":{\"en\":\"US nonprofit investigative newsroom behind the Paxton investigation.\",\"zh-TW\":\"主導帕克斯頓調查的美國非營利調查新聞機構。\"}},{\"term\":{\"en\":\"Texas Tribune\",\"zh-TW\":\"德州論壇報\"},\"blurb\":{\"en\":\"Texas news outlet credited for the investigation's illustration.\",\"zh-TW\":\"為調查報導提供插圖的德州新聞媒體。\"}},{\"term\":{\"en\":\"MarketWatch\",\"zh-TW\":\"MarketWatch\"},\"blurb\":{\"en\":\"Financial news outlet that reported the Social Security proposals.\",\"zh-TW\":\"報導社會安全解方提案的財經新聞媒體。\"}},{\"term\":{\"en\":\"Social Security\",\"zh-TW\":\"社會安全制度\"},\"blurb\":{\"en\":\"US federal retirement and disability program projected insolvent in six years.\",\"zh-TW\":\"預計六年內破產的美國聯邦退休與殘障給付制度。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://r85075515.github.io/Trust-digest/\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"Axiom\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"zh_TW
