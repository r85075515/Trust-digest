n November 27, cutting management layers in research and development, unifying memory development under a single chain of command, and adding dedicated logic design and advanced packaging teams for custom high-bandwidth memory (HBM). The company also appointed a new head for its U.S. semiconductor operations as part of the annual organizational shake-up.\n\nAs AI hyperscalers increasingly demand custom HBM base dies tailored to specific accelerators, integrating memory architecture with logic design and advanced packaging has become decisive for winning next-generation AI chip orders.\n\nKED Global and DIGITIMES both report Samsung's restructuring of its memory R\u0026D operations and the creation of a dedicated logic design team to accelerate custom HBM development.\n\nSpecific customer design-win targets for custom HBM4E and the timeline for measurable yield improvements from the flattened R\u0026D structure remain undisclosed.\n\nTrust label: Multi-source agreement — KED Global and DIGITIMES report identical details on Samsung's semiconductor R\u0026D overhaul and custom HBM logic team."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-034-samsung-revamps-chip-division-custom-hbm\",\"category\":\"semiconductor\",\"title\":{\"en\":\"Samsung Overhauls Chip Division R\u0026D and Adds Custom HBM Logic Team\",\"zh-TW\":\"三星重組半導體事業部研發架構 增設客製化 HBM 邏輯設計團隊\"},\"summary\":{\"en\":\"Samsung Electronics overhauled its semiconductor operations on November 27, cutting R\u0026D management layers, unifying memory development, and establishing a dedicated logic design team for custom high-bandwidth memory (HBM). The restructuring aims to speed next-generation AI chip development and strengthen advanced packaging competitiveness.\",\"zh-TW\":\"三星電子（Samsung Electronics）於 11 月 27 日大幅重組半導體事業部營運架構，精簡研發管理層級、整合記憶體開發指揮鏈，並針對客製化高頻寬記憶體（HBM）設立專屬邏輯設計與先進封裝團隊。此舉旨在加快次世代 AI 記憶體開發速度，強化在客製化 HBM 市場與競爭對手的抗衡實力。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n三星電子（Samsung Electronics）於 11 月 27 日宣布重組旗下半導體事業部（DS 部門），大幅裁減研發體系中的管理層級、將記憶體開發業務收攏至單一指揮鏈下，並針對客製化高頻寬記憶體（HBM）增設專屬邏輯設計與先進封裝團隊，同時調整美國晶片業務主管人事。\\n\\n「為什麼重要」\\n隨著雲端 AI 巨頭對客製化 HBM 基礎裸晶（Base Die）的需求快速升溫，將記憶體架構與邏輯設計、先進封裝深度整合，已成為爭奪次世代 AI 加速器訂單的勝負關鍵。\\n\\n「來源異同」\\n韓國經濟日報全球版（KED Global）與電子時報（DIGITIMES）均報導三星精簡記憶體研發層級並設立客製化 HBM 邏輯設計團隊的消息，核心組織調整方向完全一致。\\n\\n「仍不確定」\\n組織扁平化後能否在短期內轉化為客製化 HBM4E 的實際良率提升，以及目前具體鎖定的雲端客戶合作名單，三星尚未對外揭露。\"},\"glossary\":[{\"term\":{\"en\":\"Custom HBM (High-Bandwidth Memory)\",\"zh-TW\":\"客製化高頻寬記憶體\"},\"blurb\":{\"en\":\"Stacked DRAM memory engineered with a customized logic base die tailored to a specific AI processor's interface and power requirements.\",\"zh-TW\":\"在垂直堆疊的 DRAM 底部搭配專屬客製化邏輯基礎裸晶的記憶體，針對特定 AI 處理器的頻寬與功耗需求量身打造。\"}},{\"term\":{\"en\":\"Logic Base Die\",\"zh-TW\":\"邏輯基礎裸晶\"},\"blurb\":{\"en\":\"The bottom controller layer of an HBM stack that manages data routing, error correction, and communication with the host GPU or ASIC.\",\"zh-TW\":\"位於 HBM 堆疊最底層的控制晶片層，負責管理資料傳輸路由、錯誤修正及與主運算晶片之間的介面通訊。\"}},{\"term\":{\"en\":\"Advanced Packaging\",\"zh-TW\":\"先進封裝\"},\"blurb\":{\"en\":\"Semiconductor manufacturing techniques that integrate multiple logic and memory dies closely together to boost bandwidth and cut latency.\",\"zh-TW\":\"將多顆邏輯晶片與記憶體裸晶高密度整合封裝的半導體製程技術，可大幅提升傳輸頻寬並降低延遲。\"}}],\"sources\":[{\"name\":\"KED Global\",\"url\":\"https://www.kedglobal.com/corporate-strategy/newsView/ked202611270001\"},{\"name\":\"DIGITIMES\",\"url\":\"https://www.digitimes.com/news/a20261127VL206/samsung-development-hbm-lsi-design.html\"}],\"imageUrl\":\"/covers/live/live-semiconductor-034-samsung-revamps-chip-division-custom-hbm.jpg\",\"imageAlt\":{\"en\":\"Samsung Electronics semiconductor cleanroom and HBM memory architecture\",\"zh-TW\":\"三星電子半導體無塵室與 HBM 高頻寬記憶體架構\"},\"isHeadline\":false,\"isPopular\":true,\"trustScore\":88,\"trustBreakdown\":{\"crossCorroboration\":22,\"outletReputation\":22,\"recencyClarity\":23,\"sourceDiversity\":21},\"publishedAt\":\"2026-1
