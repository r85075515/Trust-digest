e of the disease. The approval is described as the first new hormone therapy for early-stage breast cancer in more than 20 years.\nWhat happened\nThe FDA approved Wilserdly for people with estrogen receptor-positive, HER2-negative stage I to III breast cancer at intermediate to high risk of recurrence after surgery. The drug is used alone after surgery in adults with that subtype, which the FDA said accounts for about 70 percent of breast cancer cases. ET Pharma describes the approval as the FDA approving Roche's breast cancer pill for early-stage patients, identifying the same approval from the company's side. The approval is for early-stage disease, not for all breast cancer, and the feed material does not give dosing, trial results or a launch date.\nWhy it matters\nThe approval matters because the subtype involved is the most common form of breast cancer, so a new hormone therapy option after surgery could affect a large group of patients at intermediate to high risk of recurrence. It also matters as a first in more than 20 years: the long gap suggests that new hormone therapy options for early-stage disease have been rare, and the approval adds a treatment choice where the previous options had been in place for a long time. Patients and clinicians still need the full prescribing information before judging who should receive it.\nSources agree / disagree\nThe FDA announcement and ET Pharma agree that the FDA approved a breast cancer pill for early-stage patients, with the FDA announcement giving the drug name Wilserdly and the disease details. The third source in the cluster, BioPharma Dive, reports a different story: the FDA again turning back Capricor's Duchenne cell therapy, deramiocel. The cluster therefore mixes the breast cancer approval with a separate rejection. Trust label: Bundled stories — Two sources agree on the breast cancer approval, but the cluster also contains a separate Capricor rejection.\nStill uncertain\nThe feed material does not give the evidence behind the approval, such as trial results, side effects, dosing or how Wilserdly compares with existing hormone therapies. It does not give a price or availability date, and it does not explain the Capricor case beyond the FDA's statement about serious data integrity violations and a second rejection since 2025. The full FDA announcement and prescribing information are needed for those details."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-biotech-01-fda-approves-first-new-h\",\"category\":\"biotech\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-biotech-01-fda-approves-first-new-h.png\",\"imageAlt\":{\"en\":\"Cover related to: FDA Approves First New Hormone Therapy for Early-Stage Breast Cancer in More Than 20 Years\",\"zh-TW\":\"相關封面圖：FDA 批准 20 多年來首個治療早期乳癌的新荷爾蒙療法\"},\"publishedAt\":\"2026-11-24T02:03:08.000Z\",\"title\":{\"en\":\"FDA Approves Wilserdly, First New Hormone Therapy for Early-Stage Breast Cancer in Over 20 Years\",\"zh-TW\":\"美國食品藥物管理局（FDA）批准威瑟利（Wilserdly），二十多年來首個早期乳癌新荷爾蒙療法\"},\"summary\":{\"en\":\"The Food and Drug Administration has approved Wilserdly (giredestrant), the first new hormone therapy for early-stage breast cancer in more than 20 years, for adults with estrogen receptor-positive, HER2-negative disease after surgery. The subtype accounts for about 70 percent of breast cancer cases.\",\"zh-TW\":\"美國食品藥物管理局（U.S. Food and Drug Administration，FDA）批准威瑟利（Wilserdly，學名吉雷地司群 giredestrant），這是二十多年來首個早期乳癌新荷爾蒙療法，適用於手術後雌激素受體陽性、人類表皮生長因子受體二型陰性的成人患者。此亞型約占乳癌病例的百分之七十。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"美國食品藥物管理局（U.S. Food and Drug Administration，FDA）批准威瑟利（Wilserdly，學名吉雷地司群 giredestrant），供雌激素受體陽性、人類表皮生長因子受體二型陰性的成人乳癌患者在手術後單獨使用，此為最常見的乳癌亞型。這是二十多年來首個早期乳癌新荷爾蒙療法。\\n發生了什麼事\\n美國食品藥物管理局批准威瑟利，用於手術後復發風險中至高的第一至第三期雌激素受體陽性、人類表皮生長因子受體二型陰性乳癌患者。該藥物供具有此亞型的成人患者在手術後單獨使用，美國食品藥物管理局指出，此亞型約占乳癌病例的百分之七十。經濟時報製藥頻道（ET Pharma）則形容此事為美國食品藥物管理局批准羅氏（Roche）的乳癌藥丸，供早期患者使用，從藥廠角度確認了同一項批准。本次批准針對早期疾病，並非所有乳癌，素材未提供劑量、試驗結果或上市日期。\\n為什麼重要\\n這項批准之所以重要，在於相關亞型是最常見的乳癌類型，因此手術後的新荷爾蒙療法選項，可能影響大批復發風險中至高的患者。這也是二十多年來的首例，顯示早期疾病的新荷爾蒙療法選項相當罕見，此次批准為長期以來選項有限的領域增加了一種治療選擇。患者與醫師仍需完整處方資訊，才能判斷誰適合使用。\\n來源異同\\n美國食品藥物管理局的公告與經濟時報製藥頻道一致指出，美國食品藥物管理局批准了一款乳癌藥丸供早期患者使用，前者提供藥名威瑟利與疾病細節。同一素材組合中的第三個來源生物製藥深潛（BioPharma Dive）報導的則是不同事件：美國食品藥物管理局再度駁回凱普瑞克（Capricor）的杜氏肌肉失養症細胞療法德拉米奧塞爾（deramiocel）。素材組合因此把乳癌批准與另一項駁回混在一起。信任標籤：混裝多則——兩家來源就乳癌批准一致，但素材組合另含一則凱普瑞克駁回新聞。\\n仍不確定\\n素材未提供批准背後的證據，例如試驗結果、副作用、劑量，或威瑟利與現有荷爾蒙療法的比較。素材未提供價格或供應日期，也未說明凱普瑞克一案的細節，只提到美國食品藥物管理局指控其有嚴重資料完整性違規，並自二〇二五年以來第二次駁回。需查閱美國食品藥物管理局完整公告與處方資訊，才能確認這些細節。\"},\"sources\":[{\"name\":\"BioPharma Dive\",\"url\":\"https://www.biopharmadive.com/news/capricor-fda-duchenne-cell-therapy-deramiocel/875384/\"},{\"name\":\"FDA 新聞稿\",\"url\":\"http://www.fda.gov/news-events/press-announcements/fda-approves-first-new-hormone-therapy-early-stage-breast-cancer-more-20-years\"},{\"name\":\"ET Pharma\",\"url\":\"https://pharma.economictimes.indiatimes.com/news/drug-approvals-and-launches/us-fda-approves-roches-breast-cancer-pill-for-early-stage-patients/136117286\"}],\"disagreements\":null,\"trustScore\":68,\"trustBreakdown\":{\"sourceDiversity\":19,\"outletReputation\":10,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"biotech\",\"live-ingest\",\"biopharma-dive\",\"fda-新聞稿\",\"et-pharma\"],\"glossary\":[{\"term\":{\"en\":\"FDA\",\"zh-TW\":\"美國食品藥物管理局\"},\"blurb\":{\"en\":\"The U.S. Food and Drug Administration, the agency that approved Wilserdly.\",\"zh-TW\":\"批准威瑟利的美國主管機關。\"}},{\"term\":{\"en\":\"Wilserdly (giredestrant)\",\"zh-TW\":\"威瑟利\"},\"blurb\":{\"en\":\"A hormone therapy approved for early-stage estrogen receptor-positive, HER2-negative breast cancer after surgery.\",\"zh-TW\":\"獲准用於手術後早期雌激素受體陽性、人類表皮生長因子受體二型陰性乳癌的荷爾蒙療法。\"}},{\"term\":{\"en\":\"Roche\",\"zh-TW\":\"羅氏\"},\"blurb\":{\"en\":\"The company whose breast cancer pill was approved, as described by ET Pharma.\",\"zh-TW\":\"經濟時報製藥頻道所述，其乳癌藥丸獲准的公司。\"}},{\"term\":{\"en\":\"Capricor\",\"zh-TW\":\"凱普瑞克\"},\"blurb\":{\"en\":\"A company whose Duchenne cell therapy was turned back by the FDA in a separate story in the cluster.\",\"zh-TW\":\"其杜氏肌肉失養症細胞療法在素材組合另一則新聞中遭美國食品藥物管理局駁回的公司。\"}},{\"term\":{\"en\":\"Deramiocel\",\"zh-TW\":\"德拉米奧塞爾\"},\"blurb\":{\"en\":\"Capricor's Duchenne cell therapy, rejected by the FDA for a second time since 2025.\",\"zh-TW\":\"凱普瑞克的杜氏肌肉失養症細胞療法，自二〇二五年以來第二次遭美國食品藥物管理局駁回。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-biotech-01-fda-approves-first-new-h/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-biotech-01-fda-approves-first-new-h/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"d:\"$8:metadata\"\n"])</script></body></html>
