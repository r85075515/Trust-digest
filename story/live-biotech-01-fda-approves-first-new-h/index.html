n since 2025. What happened\nFDA Approves First New Hormone Therapy for Early-Stage Breast Cancer in More Than 20 Years. In an unusual statement, the FDA accused Capricor of \u0026ldquo;serious data integrity violations\u0026rdquo; that compromised its study findings and led to deramiocel\u0026rsquo;s second rejection since 2025. The FDA today approved Wilserdly (giredestrant), used alone after surgery in adults with estrogen receptor–positive, HER2-negative breast cancer — the most common subtype of the disease. Wilserdly, is approved for people with estrogen receptor-positive, HER2-negative stage I to III breast cancer at intermediate to high risk of recurrence after surgery. The subtype accounts for about 70% of breast cancer cases, the FDA said. Why it matters\nThis cluster was assembled from 3 feed item(s) across 3 outlet(s) (BioPharma Dive, FDA 新聞稿, ET Pharma) in the biotech category. Axiom links out to each publisher; this digest only restates titles and short feed descriptions — not full articles. Sources agree / disagree\nMultiple outlets are covering closely related headlines: \"FDA again turns back Capricor Duchenne cell therapy\" (BioPharma Dive); \"FDA Approves First New Hormone Therapy for Early-Stage Breast Cancer in More Than 20 Years\" (FDA 新聞稿); \"FDA approves Roche\u0026#039;s breast cancer pill for early-stage patients\" (ET Pharma).\nFigures differ across outlets (e.g. 20 vs 039 in headlines/snippets). Still uncertain\nFeed descriptions can omit context, updates, or corrections. Click through to the linked outlets for the latest full reporting. Trust scores are heuristics, not fact-check guarantees. Linked sources (outlet names only): BioPharma Dive, FDA 新聞稿, ET Pharma"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-biotech-01-fda-approves-first-new-h\",\"category\":\"biotech\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-biotech-01-fda-approves-first-new-h.png
