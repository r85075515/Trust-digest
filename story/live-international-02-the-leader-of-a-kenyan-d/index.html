forest, presenting the deaths as a path to 'meet Jesus.' The four outlets agree on the sentence and on that core fact. No breakdown of the counts, no trial chronology, and no detail of the sentencing hearing appears in the feed material.\nWhy it matters\nThe judgment is about scale and finality: a 200-year sentence is the court's answer to deaths ordered in the name of faith, and it marks the legal end of a case that shocked Kenya and the world. For readers, the takeaway is that the criminal reckoning is done — the sentence is the record now. What remains is not the verdict but the wider accounting: how many died, how the group operated, and what, if anything, changes in oversight of such movements. Those answers are not in these snippets.\nSources agree / disagree\nFour outlets — BBC World, NPR World, The Guardian World, and CBS News Crime — agree on the sentence and the starvation order. Trust label: Multi-source agreement — several major outlets agree on the core facts, with no conflicting details.\nStill uncertain\nThe snippets give no victim count, no location detail beyond 'a forest,' no count-by-count breakdown of the 200 years, and no account of the trial itself. The pre-existing disagreements note in the file flags figures differing across outlets, but no specific numbers appear in the snippets. Check the full court reporting for the victim count and how the sentence was composed."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-02-the-leader-of-a-kenyan-d\",\"category\":\"international\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-international-02-the-leader-of-a-kenyan-d.jpg\",\"imageAlt\":{\"en\":\"Cover related to: The leader of a Kenyan doomsday cult is sentenced to 200 years in prison\",\"zh-TW\":\"相關封面圖：肯亞末日邪教領袖被判200年監禁\"},\"publishedAt\":\"2026-11-06T15:08:43.000Z\",\"title\":{\"en\":\"Kenyan Cult Leader Paul Mackenzie Gets 200 Years for Starving Followers\",\"zh-TW\":\"肯亞末日邪教領袖麥肯齊判刑 200 年：下令信徒餓死孩童「見耶穌」\"},\"summary\":{\"en\":\"Paul Mackenzie (保羅·麥肯齊), the Kenyan doomsday cult leader, has been sentenced to 200 years in prison for ordering his followers to starve their children to death in a forest so they could 'meet Jesus.' The takeaway: the sentence legally closes a case defined by mass deaths — how the counts were stacked remains to be read in full.\",\"zh-TW\":\"肯亞末日邪教領袖保羅·麥肯齊被判處 200 年監禁，他曾下令信徒在森林裡把孩子活活餓死，好讓他們「見耶穌」。結論是：這項判決為這起以集體餓死為核心的案件畫下法律句點，判決書細節、包括刑期如何累計，仍待完整閱讀。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"肯亞末日邪教領袖保羅·麥肯齊被判處 200 年監禁。法院認定他下令信徒在森林裡把孩子活活餓死，好讓他們「見耶穌」。BBC、NPR、衛報與 CBS 新聞都報導了這項判決，為這起有紀錄以來最致命的邪教悲劇之一畫下刑事句點。\\n發生了什麼事\\n領導肯亞末日邪教的麥肯齊被判處 200 年監禁。案件核心的指控在摘要裡簡短卻駭人：他下令信徒把孩子餓死在森林裡，說這是「見耶穌」的途徑。四家媒體對刑期與這項核心事實說法一致。摘要裡沒有罪名細目、審判時間序，也沒有量刑庭的細節。\\n為什麼重要\\n這件事的意義在規模與定讞：200 年刑期是法院對以信仰之名下令奪命的回應，也標誌這起震驚肯亞與全球的案件在法律上告終。對讀者來說，結論是刑事究責已經完成——判決本身就是紀錄。剩下的不是判決，而是更廣泛的清算：死了多少人、這個團體如何運作、對這類團體的監督會不會改變。這些答案不在摘要裡。\\n來源異同\\n四家媒體——BBC 國際版、NPR 國際版、衛報國際版、 CBS 新聞犯罪版——對刑期與餓死命令說法一致。信任標籤：多源一致——多家主要媒體對核心事實說法一致，沒有互相矛盾的細節。\\n仍不確定\\n摘要沒有罹難人數、除了「森林」之外的地點細節、200 年刑期如何由各罪名累計，也沒有審判過程的記述。檔案裡既有的異議欄位提到不同媒體數字有出入，但摘要中沒有出現具體數字。想知道罹難人數與刑期組成，請查完整的法院報導。\"},\"sources\":[{\"name\":\"BBC World\",\"url\":\"https://www.bbc.co.uk/news/articles/cm5yne5984l0o?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"NPR World\",\"url\":\"https://www.npr.org/2026/11/06/nx-s1-6032593/kenya-cult-leader-paul-mackenzie-sentenced-murder\"},{\"name\":\"The Guardian World\",\"url\":\"https://www.theguardian.com/world/2026/nov/06/kenyan-doomsday-sect-leader-jailed-murders-paul-mackenzie\"},{\"name\":\"CBS News Crime\",\"url\":\"https://www.cbsnews.com/news/doomsday-cult-leader-sentenced-murders-kenya-paul-mackenzie/\"}],\"disagreements\":{\"en\":\"Figures differ across outlets (e.g. 191 vs 200 in headlines/snippets).\",\"zh-TW\":\"不同媒體的數字有所不同（例如，標題/摘要中的數字為 191 比 200）。\"},\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":25,\"outletReputation\":21,\"crossCorroboration\":17,\"rec
