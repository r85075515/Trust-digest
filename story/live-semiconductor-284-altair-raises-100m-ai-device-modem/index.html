und shortly after spinning off from Sony. The proceeds will fund manufacturing scale-up and commercial rollout of its ALT1550 cellular modem in 2027, targeting compact battery-powered devices including AI smart glasses, wearables, and industrial Internet of Things (IoT) sensors.\n\nWhy it matters\nNext-generation AI wearables require continuous cloud connectivity without draining small batteries or overheating. By pairing low-power 5G cellular modems with edge AI capabilities on a single architecture, Altair aims to capture rising demand for always-connected personal AI hardware independent of smartphones.\n\nSource differences\nWelcome.ai (\"Altair Raises $100 Million to Scale Its AI Device Modem for 2027 Production\") details the 2027 mass-production timeline for the ALT1550 modem and its focus on smart glasses and wearables. Fudzilla (\"Sony spin-off Altair gets $100 million for low-power 5G chips\") and Beamstart (\"Israeli Chipmaker Altair Secures $100M Series A to Power Edge AI in Wearables\") highlight Altair's recent spin-off from Sony and note that the 100 million USD Series A led global AI hardware funding activity on November 26.\n\nStill uncertain\nThe identities of lead institutional investors in the Series A round, post-money valuation, and confirmed tier-one smart-glasses design wins remain undisclosed.\n\nTrust label: Multi-source agreement — Welcome.ai, Fudzilla, and Beamstart report matching figures on the 100 million USD Series A round, Sony spin-off context, and 2027 ALT1550 production target."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-284-altair-raises-100m-ai-device-modem\",\"category\":\"semiconductor\",\"title\":{\"en\":\"Israeli Chipmaker Altair Semiconductor Raises 100 Million USD to Scale AI Device Modem\",\"zh-TW\":\"以色列晶片商 Altair 完成1億美元募資 推動AI穿戴裝置低功耗數據機量產\"},\"summary\":{\"en\":\"Israeli chipmaker Altair Semiconductor has raised 100 million USD in Series A funding following its spin-off from Sony to scale mass production of its ALT1550 cellular modem in 2027. Designed for smart glasses, wearables, and industrial IoT, the chip integrates ultra-low-power 5G connectivity with on-device edge AI processing.\",\"zh-TW\":\"從索尼（Sony）分拆獨立的以色列晶片設計商 Altair Semiconductor 宣布完成1億美元A輪融資，資金將用於推動旗下 ALT1550 蜂巢式數據機晶片於2027年量產。該晶片專為智慧眼鏡、穿戴裝置與工業物聯網打造，結合超低功耗5G連線與裝置端邊緣AI運算能力。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n甫從索尼（Sony）分拆獨立的以色列蜂巢式通訊晶片廠 Altair Semiconductor 完成1億美元A輪募資。該筆資金將用於加速製造擴產，推動旗下 ALT1550 數據機晶片於2027年正式量產，鎖定AI智慧眼鏡、穿戴式裝置與工業物聯網等低功耗終端市場。\\n\\n「為什麼重要」\\n新一代AI穿戴裝置需要在極小電池容量下維持全天候雲端連線與即時語音視覺互動，避免過熱或頻繁充電。Altair 將超低功耗5G數據機與邊緣AI處理整合於單一晶片方案，切入擺脫手機依賴的獨立連網AI硬體供應鏈。\\n\\n「來源異同」\\nWelcome.ai（\\\"Altair Raises $100 Million to Scale Its AI Device Modem for 2027 Production\\\"）詳述 ALT1550 數據機2027年量產時程及智慧眼鏡應用場景；Fudzilla（\\\"Sony spin-off Altair gets $100 million for low-power 5G chips\\\"）與 Beamstart（\\\"Israeli Chipmaker Altair Secures $100M Series A to Power Edge AI in Wearables\\\"）則補充該公司剛完成自索尼分拆獨立，並指出這筆1億美元A輪融資是11月26日全球AI新創募資案中金額最高的一筆。\\n\\n「仍不確定」\\n本輪A輪融資的領投創投機構名單、投後估值，以及已簽約導入 ALT1550 晶片的一線品牌客戶細節尚未對外公開。\\n\\nTrust label: Multi-source agreement — Welcome.ai、Fudzilla 與 Beamstart 對1億美元融資規模、索尼分拆背景及2027年 ALT1550 量產目標報導一致。\"},\"glossary\":[{\"term\":{\"en\":\"Cellular modem\",\"zh-TW\":\"蜂巢式數據機\"},\"blurb\":{\"en\":\"A semiconductor component that connects electronic devices directly to mobile carrier networks such as 4G LTE and 5G without needing Wi-Fi or a paired phone.\",\"zh-TW\":\"讓電子裝置無需透過 Wi-Fi 或配對手機，即可直接連上 4G LTE 與 5G 行動通訊網路的核心晶片。\"}},{\"term\":{\"en\":\"Edge AI\",\"zh-TW\":\"邊緣AI\"},\"blurb\":{\"en\":\"Running artificial intelligence algorithms locally on a physical device rather than sending all raw data to cloud servers, cutting latency and power consumption.\",\"zh-TW\":\"直接在終端硬體本地執行人工智慧運算，無需將所有原始資料傳回雲端，可大幅降低延遲與傳輸耗電。\"}},{\"term\":{\"en\":\"Corporate spin-off\",\"zh-TW\":\"企業分拆\"},\"blurb\":{\"en\":\"The creation of an independent company through the separation of an existing division or subsidiary from its parent corporation.\",\"zh-TW\":\"母公司將旗下特定事業部或子公司獨立出來，使其成為自主營運並可獨立對外募資的新公司。\"}}],\"sources\":[{\"name\":\"Welcome.ai\",\"url\":\"https://welcome.ai/content/altair-raises-100-million-to-scale-its-ai-device-modem-for-2027-production\"},{\"name\":\"Fudzilla\",\"url\":\"https://fudzilla.com/sony-spin-off-altair-gets-100-million-for-low-power-5g-chips/\"},{\"name\":\"Beamstart\",\"url\":\"https://beamstart.com/news/israeli-chipmaker-altair-secures-100m-series-a-to-power-edge-ai-in-wearables\"}],\"imageUrl\":\"/covers/live/live-semiconductor-284-altair-raises-100m-ai-device-modem.jpg\",\"imageAlt\":{\"en\":\"Israeli Chipmaker Altair Semiconductor Raises 100 Million USD to Scale AI Device Modem\",\"zh-TW\":\"以色列晶片商 Altair 完成1億美元募資 推動AI穿戴裝置低功耗數據機量產\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":77,\"trustBreakdown\":{\"crossCorroboration\":20,\"outletReputation\":18,\"recencyClarity\":21,\"sourceDiversity\":18},\"publishedAt\":\"2026-11-28T00:37:18.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":20,\"D2\":19,\"D3\":20,\"D4\":19,\"D5\":19,\"total\":19},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-semiconductor-284-altair-raises-100m-ai-device-modem/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-
