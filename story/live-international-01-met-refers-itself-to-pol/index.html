rral concerns potential errors in handling a 2019 letter warning of dangers to the Duchess posed by her father. Philippine police are separately investigating alleged child sexual abuse images reportedly found at his former home.\nWhat happened\nSky News UK and The Guardian UK News both reported the self-referral on 29 October. The Guardian specified the letter dates from 2019 and warned of dangers to the Duchess's security posed by her father. The feed summary was truncated and did not state the full allegations or the alleged handling errors. The material did not state a connection between the Philippine investigation and the Met's handling of the letter.\nWhy it matters\nA force referring itself to its watchdog directly admits its handling may have been wrong. An outside review can establish whether warnings about a named public figure's security were acted on properly. The parallel Philippine investigation raises the stakes, but the material does not link the two inquiries.\nSources agree / disagree\nSky News UK and The Guardian UK News covered the same self-referral with consistent headlines and no conflicting facts. Trust label: Two-source agreement — two outlets agree on the core referral and the 2019 letter.\nStill uncertain\nThe full allegations, the specific handling errors, the IOPC response, and the Philippine outcome were not stated. The full reporting should be checked before quoting details."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-01-met-refers-itself-to-pol\",\"category\":\"international\",\"adult\":false,\"isHeadline\":true,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-international-01-met-refers-itself-to-pol.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Met refers itself to police watchdog over handling of letter about Meghan's father\",\"zh-TW\":\"相關封面圖：大都會警察局就梅根父親信件的處理向警方監管機構求助\"},\"publishedAt\":\"2026-10-29T19:55:58.000Z\",\"title\":{\"en\":\"Metropolitan Police Refers Itself to Watchdog Over 2019 Meghan Warning Letter\",\"zh-TW\":\"倫敦警察廳就 2019 年梅根警告信的處理向監管機構自請調查\"},\"summary\":{\"en\":\"The Metropolitan Police referred itself to the Independent Office for Police Conduct over a 2019 letter warning of dangers to the Duchess of Sussex posed by her father, Thomas Markle Sr. Philippine police are investigating alleged child sexual abuse images reportedly found at his former home. Watch for the watchdog's findings on the 2019 handling.\",\"zh-TW\":\"倫敦警察廳（Metropolitan Police）已就處理一封 2019 年信件的方式，向警察行為獨立辦公室（IOPC）自請調查，該信警告蘇塞克斯公爵夫人（Duchess of Sussex）的父親湯瑪斯·馬克爾（Thomas Markle Sr.）可能帶來危險。菲律賓警方正調查據稱在其舊居發現的疑似兒童性虐待影像。後續要看監管機構如何認定 2019 年的處理是否出錯。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"倫敦警察廳（Metropolitan Police）已就一封涉及蘇塞克斯公爵夫人父親湯瑪斯·馬克爾（Thomas Markle Sr.）指控的信件，向警察行為獨立辦公室（IOPC）自請調查。調查焦點是處理一封 2019 年信件時可能出現的錯誤，該信警告公爵夫人的父親可能對她的安全構成危險。同一時間，菲律賓警方正調查據稱在湯瑪斯·馬克爾舊居發現的疑似兒童性虐待影像。\\n發生了什麼事\\nSky News UK 與 The Guardian UK News 都在 10 月 29 日報導了這次自請調查。The Guardian 的報導指出，該信寫於 2019 年，警告公爵夫人的父親對蘇塞克斯公爵夫人的安全構成危險。摘要提到信中對湯瑪斯·馬克爾提出了指控，但摘要遭到截斷，沒有說明指控的完整內容，也沒有說明所謂的處理錯誤是什麼。菲律賓的調查與這次自請調查一併被報導，但資料沒有說明菲律賓調查與倫敦警察廳處理 2019 年信件之間有何關聯。\\n為什麼重要\\n一支警隊主動向監管機構自請調查，等於直接承認自身的處理可能出錯。這件事重要，是因為 2019 年的信件涉及一位具名公眾人物的安全，外部審查才能確認相關警告是否得到妥善處理。菲律賓的平行調查提高了事件的嚴重性，但現有資料沒有把兩項調查連結起來，不應把它們視為同一案件。\\n來源異同\\nSky News UK 與 The Guardian UK News 報導的是同一宗自請調查，標題一致，在簡短的摘要資料中沒有事實衝突。信任標籤：雙源一致——兩家媒體對核心自請調查與 2019 年信件的報導一致。\\n仍不確定\\n2019 年信件的完整指控沒有說明。接受審查的具體處理錯誤沒有說明。IOPC 的回應、任何時間表，以及菲律賓調查的結果也都沒有說明，引用細節前應查閱完整報導。\"},\"sources\":[{\"name\":\"Sky News UK\",\"url\":\"https://news.sky.com/story/met-refers-itself-to-police-watchdog-over-handling-of-letter-about-meghans-father-13605429\"},{\"name\":\"The Guardian UK News\",\"url\":\"https://www.theguardian.com/uk-news/2026/oct/29/metropolitan-police-refers-itself-to-watchdog-over-meghan-warning-letter\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":22,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"international\",\"live-ingest\",\"sky-news-uk\",\"the-guardian-uk-news\"],\"glossary\":[{\"blurb\":{\"en\":\"London police force that referred itself to the police watchdog.\",\"zh-TW\":\"向警方監管機構自請調查的倫敦警隊。\"},\"term\":{\"en\":\"Metropolitan Police\",\"zh-TW\":\"倫敦警察廳（Metropolitan Police）\"}},{\"blurb\":{\"en\":\"Independent body that oversees police conduct in England and Wales.\",\"zh-TW\":\"監督英格蘭與威爾斯警方行為的獨立機構。\"},\"term\":{\"en\":\"Independent Office for Police Conduct\",\"zh-TW\":\"警察行為獨立辦公室（Independent Office for Police Conduct）\"}},{\"blurb\":{\"en\":\"Father of the Duchess of Sussex and subject of the 2019 letter.\",\"zh-TW\":\"蘇塞克斯公爵夫人的父親，2019 年信件的對象。\"},\"term\":{\"en\":\"Thomas Markle Sr.\",\"zh-TW\":\"湯瑪斯·馬克爾（Thomas Markle Sr.）\"}},{\"blurb\":{\"en\":\"Title held by Meghan, whose security the 2019 letter concerned.\",\"zh-TW\":\"梅根的頭銜，2019 年信件涉及其安全。\"},\"term\":{\"en\":\"Duchess of Sussex\",\"zh-TW\":\"蘇塞克斯公爵夫人（Duchess of Sussex）\"}},{\"blurb\":{\"en\":\"UK news outlet that reported the self-referral.\",\"zh-TW\":\"報導這次自請調查的英國新聞媒體。\"},\"term\":{\"en\":\"Sky News UK\",\"zh-TW\":\"Sky News UK\"}},{\"blurb\":{\"en\":\"UK news outlet that reported the 2019 letter.\",\"zh-TW\":\"報導 2019 年信件的英國新聞媒體。\"},\"term\":{\"en\":\"The Guardian UK News\",\"zh-TW\":\"The Guardian UK News\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news
