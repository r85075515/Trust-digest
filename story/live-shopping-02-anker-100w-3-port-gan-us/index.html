 with a Thumb Score of +25.\nWhat happened\nSlickdeals lists the charger on its frontpage: model B121B, a 100W GaN charger with a smart display, sold by AnkerDirect via Amazon for $45.99 in two colors, with free shipping. The specs come from the merchant's product page: total output of 100W, input of 100–240V at 50/60Hz up to 2.3A, two USB-C ports at up to 100W each when used solo, and one USB-A port at up to 33W. With two ports in use, USB-C1 and USB-C2 split the output at 70W and 30W.\nWhy it matters\nThe verdict is that the spec sheet, not the discount, is the story: a single 100W USB-C port can charge a laptop, while the 70W-plus-30W split still powers two devices at once. The smart display adds a visible reason to pick this model over a plain brick. For buyers, the $45.99 price only makes sense if those port splits match what they actually charge.\nSources agree / disagree\nOnly Slickdeals carries this listing, so no second outlet confirms the price or the specs. Trust label: Single source — the digest rests on one deal listing, and the specs come from the merchant's own page.\nStill uncertain\nThe feed digest gives only the merchant's spec list and the listing price; it says nothing about real-world charging speeds, display accuracy, or how long the price will hold. Check the live Amazon listing before buying, since the $45.99 price may already have changed."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-shopping-02-anker-100w-3-port-gan-us\",\"category\":\"shopping\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-shopping-02-anker-100w-3-port-gan-us.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Anker 100W 3-Port GaN USB-C Charger w/ Smart Display (2 Colors) $46 + Free S\u0026H\",\"zh-TW\":\"相關封面圖：（譯文待補）Anker 100W 3-Port GaN USB-C Charger w/ Smart Display (2 Colors) $46 + Free S\u0026H\"},\"publishedAt\":\"2026-11-21T02:59:04.000Z\",\"title\":{\"en\":\"Anker 100W 3-Port GaN
