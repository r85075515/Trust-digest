g-suk and IU, which is not part of this obituary.\nWhy it matters\nLu Qi's death marks the passing of another performer from one of Chinese cinema's most decorated films, prompting renewed attention to the surviving cast and the film's legacy.\nSources agree / disagree\nETtoday, TVBS and CTWANT all report the same death and the same age, 101, with no conflicting facts on the obituary itself. Trust label: Multi-source agreement — several outlets agree on the core claim.\nStill uncertain\nThe snippets give no date, place or cause of death and no family statement; those details await fuller obituaries."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-eastAsiaGossip-03-101-ctwant-line-today\",\"category\":\"eastAsiaGossip\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-eastAsiaGossip-03-101-ctwant-line-today.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 《霸王別姬》又一演員殞落！「關師傅」呂齊辭世 享嵩壽101歲 | CTWANT - LINE TODAY\",\"zh-TW\":\"相關封面圖：《霸王別姬》又一演員殞落！「關師傅」呂齊辭世 享嵩壽101歲 | CTWANT - LINE TODAY\"},\"publishedAt\":\"2026-11-01T22:42:42.000Z\",\"title\":{\"en\":\"'Farewell My Concubine' Actor Lu Qi, Who Played Master Guan, Dies at 101\",\"zh-TW\":\"《霸王別姬》「關師傅」呂齊（Lu Qi）辭世，享嵩壽 101 歲\"},\"summary\":{\"en\":\"Lu Qi, the veteran Chinese actor who played Master Guan, the stern troupe leader in Farewell My Concubine — the only Chinese-language film to win the Cannes Palme d'Or, starring Leslie Cheung, Gong Li and Zhang Fengyi — has died at 101, multiple Taiwanese outlets reported.\",\"zh-TW\":\"中國資深演員呂齊（Lu Qi）辭世，享嵩壽 101 歲；他在影史唯一獲坎城金棕櫚獎的華語電影《霸王別姬》中飾演帶領戲班的「關師傅」，該片由張國榮（Leslie Cheung）、鞏俐（Gong Li）、張豐毅（Zhang Fengyi）主演。多家台灣媒體報導此消息。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"一部里程碑華語電影的又一位演員辭世，享嵩壽 101 歲。\\n發生了什麼事\\nETtoday、TVBS 與週刊王（CTWANT，經 LINE TODAY）皆報導，中國資深演員呂齊（Lu Qi）、在《霸王別姬》中飾演「關師傅」者，已辭世，享嵩壽 101 歲。週刊王摘要回顧該片地位：由張國榮（Leslie Cheung）、鞏俐（Gong Li）、張豐毅（Zhang Fengyi）主演，是影史唯一獲得坎城金棕櫚獎的華語電影，曾獲奧斯卡最佳外語片提名，並奪下金球獎與英國演藝學院電影獎最佳外語片。呂齊在片中飾演帶領戲班的「關師傅」。同一 feed 組另有一則無關的 TVBS 李鍾碩與 IU 消息，不屬於本則訃聞。\\n為什麼重要\\n呂齊辭世象徵華語影史最受殊榮電影之一的演員再凋零一位，也讓外界重新關注仍在世的卡司與該片的傳承。\\n來源異同\\nETtoday、TVBS 與週刊王（CTWANT）皆報導同一辭世消息與同一享年 101 歲，訃聞本身無事實衝突。信任標籤：多源一致——多家媒體對核心主張一致。\\n仍不確定\\n摘要未提供辭世日期、地點、死因與家屬聲明；這些細節待更完整的訃聞。\"},\"sources\":[{\"name\":\"ETtoday 影劇\",\"url\":\"https://star.ettoday.net/news/3264471\"},{\"name\":\"tvbs.com.tw\",\"url\":\"https://news.google.com/rss/articles/CBMiY0FVX3lxTFBnZmdHQ2hTOVNOUW5XT2VtZ2t5ejU1ODhnMDNJUWZTNkFCNEdzVjd6TUZIWHpDdVBnSW1waUhtMWRoTno1Vk5YWHFULV80TXRZNFNBZFN6dDQ2WUxIT1dlWmxrMA?oc=5\"},{\"name\":\"today.line.me\",\"url\":\"https://news.google.com/rss/articles/CBMiVkFVX3lxTE1pcDR3ZU1MZmlwcVZ6VFhLNDg2dHJrTERXMUd5aHNpTGZHR081MVNhNzhlTEE2Q2VXZXI0bGlXb0s0UGhweml4TGJ0UEp3aDVmdUpFaFh3?oc=5\"}],\"disagreements\":{\"en\":\"Figures differ across outlets (e.g. 101 vs 4 in headlines/snippets).\",\"zh-TW\":\"不同媒體的數字有所不同（例如，標題/摘要中為 101 比 4）。\"},\"trustScore\":45,\"trustBreakdown\":{\"sourceDiversity\":21,\"outletReputation\":16,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"eastAsiaGossip\",\"live-ingest\",\"region:tw\",\"ettoday-影劇\",\"gnews-tw-分手+藝人/明星\",\"gnews-line-today-tw-娛樂\"],\"region\":\"tw\",\"glossary\":[{\"term\":{\"en\":\"Lu Qi\",\"zh-TW\":\"呂齊\"},\"blurb\":{\"en\":\"Veteran Chinese actor who played Master Guan and died at 101.\",\"zh-TW\":\"中國資深演員，飾演「關師傅」，辭世享嵩壽 101 歲。\"}},{\"term\":{\"en\":\"Farewell My Concubine\",\"zh-TW\":\"《霸王別姬》\"},\"blurb\":{\"en\":\"Chen Kaige film described as the only Chinese-language Palme d'Or winner.\",\"zh-TW\":\"陳凱歌電影，被述為唯一獲金棕櫚獎的華語片。\"}},{\"term\":{\"en\":\"Master Guan\",\"zh-TW\":\"關師傅\"},\"blurb\":{\"en\":\"Opera troupe leader played by Lu Qi in the film.\",\"zh-TW\":\"呂齊在片中飾演的戲班帶領者。\"}},{\"term\":{\"en\":\"Palme d'Or\",\"zh-TW\":\"金棕櫚獎\"},\"blurb\":{\"en\":\"Top prize of the Cannes Film Festival, won by the film.\",\"zh-TW\":\"坎城影展最高獎，該片曾獲此獎。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"me
