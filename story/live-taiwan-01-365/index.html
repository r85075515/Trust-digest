e services affected. The Japanese government confirmed that its Government Solution Service (GSS), the platform underpinning government information systems, was also affected.\n\nWhy it matters\nEmail and workplace software are the daily infrastructure of offices, so a failure in Exchange Online stops messages from moving and leaves staff unable to reach colleagues or customers. The outage reached beyond companies into government, with Japan confirming its GSS platform was caught up in the failure. A global outage of this breadth turns a single provider's fault into a shared working day lost across countries.\n\nSources agree / disagree\nBoth dispatches come from CNA, one filed from Taipei by Wu Jia-hao and one from Tokyo by Dai Ya-zhen, so the account rests on a single outlet.\nTrust label: Single source — Two CNA dispatches from one outlet, with no independent corroboration in the material reviewed.\n\nStill uncertain\nThe cause of the fault, the number of users affected and a time for full restoration are not stated in the reports. Microsoft said only that it was working to restore service as soon as possible. The full list of affected countries and whether Taiwan's government systems were hit are also unconfirmed."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-01-365\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-taiwan-01-365.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 微軟365全球當機搶修中　官方：代管郵件服務異常將盡快恢復\",\"zh-TW\":\"相關封面圖：微軟365全球當機搶修中　官方：代管郵件服務異常將盡快恢復\"},\"publishedAt\":\"2026-11-13T03:44:04.000Z\",\"title\":{\"en\":\"Microsoft 365 Outage Disrupts Outlook and Teams Worldwide\",\"zh-TW\":\"微軟 365（Microsoft 365）全球當機，Outlook 與 Teams 皆受影響\"},\"summary\":{\"en\":\"[Unconfirmed · single source] Microsoft 365, Outlook and Teams suffered a global outage, with some businesses in Taiwan affected, CNA reports. Microsoft told CNA the fault mainly involves Exchange Online and that restoration is under way, while Japan and the United States were also hit.\",\"zh-TW\":\"［未證實·單一來源］微軟 365（Microsoft 365）、Outlook 與 Teams 今天全球當機，部分台灣企業受影響。微軟（Microsoft）回覆中央社（CNA）表示異常主要涉及 Exchange Online，正在搶修，日本、美國等地同樣受波及。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"微軟 365（Microsoft 365）、Outlook 與 Teams 今天全球當機，部分台灣企業受影響。微軟（Microsoft）回覆中央社（CNA）表示，已掌握 Microsoft 365 服務異常，主要涉及 Exchange Online，正在積極處理，將盡快恢復服務。\\n\\n發生了什麼事\\n當機波及微軟 365（Microsoft 365）、Outlook 與 Teams。中央社（CNA）台北報導指出，部分台灣企業受影響；微軟（Microsoft）在聲明中表示已掌握異常狀況，主要涉及 Exchange Online，現正積極處理。中央社（CNA）東京報導指出，包括日本、美國在內的多個國家及地區受到影響，電子郵件軟體 Outlook 等多項服務出現異常；日本政府也證實，作為政府資訊系統基礎的「政府解決方案服務」（Government Solution Service，GSS）同樣受到波及。\\n\\n為什麼重要\\n電子郵件與辦公軟體是辦公室的日常基礎設施，Exchange Online 故障會讓訊息無法傳遞，員工無法聯繫同事與客戶。當機範圍超出企業，日本政府證實其 GSS 平台也受波及。如此廣泛的全球當機，等於讓單一業者的故障，變成多國共同損失的工作日。\\n\\n來源異同\\n兩則報導皆出自中央社（CNA），分別由台北記者吳家豪（Wu Jia-hao）與東京記者戴雅真（Dai Ya-zhen）發稿，屬於單一媒體。\\n信任標籤：單一來源——僅有中央社（CNA）兩則報導，現有素材中沒有其他獨立佐證。\\n\\n仍不確定\\n故障原因、受影響用戶數量與完全恢復的時間，報導皆未說明。微軟（Microsoft）只表示將盡快恢復服務。受影響國家的完整名單、台灣政府系統是否受波及，也尚未證實。\"},\"sources\":[{\"name\":\"中央社-科技\",\"url\":\"https://www.cna.com.tw/news/ait/202611130092.aspx\"}],\"disagreements\":null,\"trustScore\":59,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"中央社-科技\",\"中央社-科技\"],\"glossary\":[{\"term\":{\"en\":\"Microsoft 365\",\"zh-TW\":\"微軟 365\"},\"blurb\":{\"en\":\"Microsoft's suite of cloud productivity services.\",\"zh-TW\":\"微軟的雲端生產力服務組合。\"}},{\"term\":{\"en\":\"Exchange Online\",\"zh-TW\":\"Exchange Online\"},\"blurb\":{\"en\":\"Microsoft's cloud-hosted email service.\",\"zh-TW\":\"微軟的雲端代管電子郵件服務。\"}},{\"term\":{\"en\":\"Outlook\",\"zh-TW\":\"Outlook\"},\"blurb\":{\"en\":\"Microsoft's email software.\",\"zh-TW\":\"微軟的電子郵件軟體。\"}},{\"term\":{\"en\":\"Teams\",\"zh-TW\":\"Teams\"},\"blurb\":{\"en\":\"Microsoft's workplace chat and meeting service.\",\"zh-TW\":\"微軟的職場聊天與會議服務。\"}},{\"term\":{\"en\":\"CNA\",\"zh-TW\":\"中央社\"},\"blurb\":{\"en\":\"Taiwan's national news agency.\",\"zh-TW\":\"台灣的國家通訊社。\"}},{\"term\":{\"en\":\"Government Solution Service\",\"zh-TW\":\"政府解決方案服務\"},\"blurb\":{\"en\":\"The platform underpinning Japan's government information systems.\",\"zh-TW\":\"日本政府資訊系統的基礎平台。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-taiwan-01-365/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-taiwan-01-365/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"d:\"$8:metadata\"\n"])</script></body></html>
