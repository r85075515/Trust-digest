ar John Wayne Parkway and Smith Enke Road in Maricopa, Arizona. Maricopa police confirmed no injuries occurred and said a juvenile driver who took the vehicle without the owner's knowledge was taken into custody after initially leaving the scene.\n\nWhy it matters\nThe crash destroyed the homeowner's garage wall and heavily damaged a two-month-old vehicle parked inside, requiring structural engineering clearance before the pickup can be safely extracted and highlighting juvenile vehicle-theft and neighborhood traffic safety concerns in Pinal County.\n\nSource differences\nFOX 10 Phoenix (\"Juvenile driver in custody after crashing truck into Maricopa home: PD\") interviewed homeowner Jennie Young and neighbors, detailing the 5:30 a.m. impact, the destroyed garage and parked car, police confirmation of the juvenile suspect's custody, and the pending structural engineer assessment; Hoodline (\"Pickup Crashes Into Maricopa Home, Driver Flees Scene - Hoodline\") cited Arizona's Family (AZFamily) reporting that first responders were dispatched to Sagebrush Trail near John Wayne Parkway and Smith-Enke Road around 5 a.m. and that the driver initially fled before officers arrived.\n\nStill uncertain\nAuthorities have withheld the juvenile's identity and specific criminal charges due to age, and the structural engineer's final clearance to remove the truck from the damaged garage remains pending.\n\nTrust label: Multi-source agreement — Corroborated by FOX 10 Phoenix and Hoodline citing Maricopa Police Department and AZFamily reporting."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-arizona-455-maricopa-pickup-truck-home-crash\",\"category\":\"arizona\",\"title\":{\"en\":\"Juvenile Taken Into Custody After Pickup Truck Crashes Into Maricopa Home\",\"zh-TW\":\"亞利桑那州馬里科帕市皮卡清晨撞入民宅，涉案青少年遭警方拘留\"},\"summary\":{\"en\":\"Maricopa police took a juvenile driver into custody after a pickup truck slammed into a home in the Rancho El Dorado community near John Wayne Parkway and Smith Enke Road around 5:30 a.m. on November 27; no injuries were reported.\",\"zh-TW\":\"亞利桑那州馬里科帕市（Maricopa）2026 年 11 月 27 日清晨 5 時 30 分許發生皮卡衝撞民宅事故，車輛撞毀車庫並波及屋內新車；警方隨後拘留一名未經車主同意駕車的青少年駕駛，所幸無人受傷。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n2026 年 11 月 27 日清晨約 5 時 30 分，亞利桑那州馬里科帕市（Maricopa）蘭喬艾爾多拉多（Rancho El Dorado）社區、靠近約翰韋恩大道與史密斯恩克路（John Wayne Parkway and Smith Enke Road）的一處民宅遭一輛皮卡衝撞。馬里科帕警方證實事故未造成人員傷亡，並表示一名未經車主同意擅自開走皮卡的青少年駕駛在一度逃離現場後已被警方拘留。\\n\\n「為什麼重要」\\n強烈撞擊不僅撞垮民宅車庫門與牆體，也撞毀屋主僅購入兩個月的新車，警方須待結構工程師評估建築安全後才能移出車輛；事件亦引發皮納爾郡（Pinal County）社區對青少年無照偷開車輛與住宅區交通安全的關注。\\n\\n「來源異同」\\nFOX 10 Phoenix（\\\"Juvenile driver in custody after crashing truck into Maricopa home: PD\\\"）實地採訪屋主珍妮·楊（Jennie Young）與鄰居，詳述清晨 5 時 30 分撞擊經過、車庫與屋內新車損毀情況、警方拘留涉案青少年以及等待結構工程師評估；Hoodline（\\\"Pickup Crashes Into Maricopa Home, Driver Flees Scene - Hoodline\\\"）則引述 AZFamily 報導，指出救難人員於清晨 5 時許獲報前往 Sagebrush Trail 現場，且駕駛在警方抵達前曾一度逃離。\\n\\n「仍不確定」\\n基於未成年人保護規定，警方尚未公布涉案青少年姓名與具體起訴罪名，結構工程師對受損車庫能否安全拖離皮卡的最終評估結果亦尚未出爐。\\n\\nTrust label: Multi-source agreement — 綜合 FOX 10 Phoenix 與 Hoodline 引述馬里科帕警局及 AZFamily 報導核實。\"},\"glossary\":[{\"term\":{\"en\":\"Maricopa, Arizona\",\"zh-TW\":\"亞利桑那州馬里科帕市（Maricopa）\"},\"blurb\":{\"en\":\"A fast-growing city in Pinal County, Arizona, located south of the Phoenix metropolitan area.\",\"zh-TW\":\"位於亞利桑那州皮納爾郡（Pinal County）快速發展的城市，地處大鳳凰城都會區南側。\"}},{\"term\":{\"en\":\"Structural Engineer Assessment\",\"zh-TW\":\"結構工程師安全評估\"},\"blurb\":{\"en\":\"An on-site inspection required after a vehicle impacts load-bearing walls to ensure removing the vehicle will not trigger roof or wall collapse.\",\"zh-TW\":\"車輛撞擊建築承重牆體後進行的專業勘驗，用以確認拖離車輛時不會導致屋頂或牆面二次坍塌。\"}},{\"term\":{\"en\":\"Pinal County\",\"zh-TW\":\"皮納爾郡（Pinal County）\"},\"blurb\":{\"en\":\"A county in central Arizona situated between Maricopa County (Phoenix) and Pima County (Tucson).\",\"zh-TW\":\"位於亞利桑那州中部的郡級行政區，介於鳳凰城所在的馬里科帕郡與土桑所在的皮馬郡之間。\"}}],\"sources\":[{\"name\":\"FOX 10 Phoenix\",\"url\":\"https://www.f
