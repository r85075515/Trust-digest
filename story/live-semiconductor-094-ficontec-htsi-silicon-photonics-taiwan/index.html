ed Hermes Testing Solutions Inc. (HTSI, 7856.TW) have strengthened their strategic partnership to expand silicon photonics (SiPh) testing and local assembly capabilities in Taiwan. The collaboration combines ficonTEC's specialized optical alignment and testing equipment with HTSI's manufacturing, engineering, and customer-service infrastructure.\n\nAs artificial intelligence data centers push copper interconnects toward physical limits, Taiwan's semiconductor ecosystem is racing to move silicon photonics and co-packaged optics (CPO) from laboratory validation to high-volume wafer-level production.\n\nTrade outlets including DIGITIMES, PIC Magazine, and BigGo Finance consistently frame the partnership around high-volume SiPh wafer-level testing and CPO readiness in Taiwan, noting the companies' earlier October cooperation framework.\n\nSpecific capital expenditure figures, customer qualification timelines, and initial wafer-level test capacity targets have not been publicly disclosed.\n\nTrust label: Multi-source agreement — Partnership details are confirmed across industry trade media and company announcements."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-094-ficontec-htsi-silicon-photonics-taiwan\",\"category\":\"semiconductor\",\"title\":{\"en\":\"ficonTEC and Taiwan's HTSI Expand Silicon Photonics Testing Capabilities\",\"zh-TW\":\"德商 ficonTEC 攜手台灣致茂轉投資 HTSI 擴大矽光子與 CPO 測試量能\"},\"summary\":{\"en\":\"German photonics automation specialist ficonTEC and Taiwan's Hermes Testing Solutions Inc. (HTSI) expanded their strategic partnership to scale wafer-level silicon photonics and co-packaged optics (CPO) testing in Taiwan.\",\"zh-TW\":\"德國光電自動化設備商 ficonTEC 與台灣測試方案廠華測科技（HTSI）宣布深化策略合作，整合光學對準測試設備與台灣在地工程製造量能，搶攻 AI 資料中心帶動的矽光子晶圓級測試與共同封裝光學（CPO）量產商機。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」德國自動化光電組裝與測試設備大廠 ficonTEC Service GmbH 與台灣華測科技（HTSI，興櫃代號 7856）宣布擴大策略合作，結合 ficonTEC 的高精度光學對準與測試技術，以及 HTSI 在台灣的製造、工程支援與客戶服務能量，共同擴充台灣矽光子（SiPh）測試與在地組裝產能。\\n\\n「為什麼重要」隨著 AI 資料中心高速傳輸需求暴增，傳統銅導線逐漸逼近物理傳輸極限，矽光子與共同封裝光學（CPO）成為次世代高速互連核心技術。此項合作強化台灣半導體供應鏈在晶圓級光電測試環節的基礎設施，協助晶片廠加速從實驗室走向大規模量產。\\n\\n「來源異同」DIGITIMES、國際光電媒體 PIC Magazine 與金融資訊平台 BigGo 均一致指出，雙方自 10 月啟動合作後進一步深化布局，鎖定台灣晶圓級矽光子測試與 CPO 量產需求，各家報導核心事實吻合。\\n\\n「仍不確定」雙方此次合作投入的具體資本支出金額、台灣在地組裝線的預計啟用時程，以及首批導入的晶圓代工或封測客戶名單，均尚未對外公開。\\n\\nTrust label: Multi-source agreement — Partnership details are confirmed across industry trade media and company announcements.\"},\"glossary\":[{\"term\":{\"en\":\"Silicon Photonics (SiPh)\",\"zh-TW\":\"矽光子（SiPh）\"},\"blurb\":{\"en\":\"Technology that integrates optical components onto silicon chips to transmit data using light pulses rather than electrical signals, increasing bandwidth and cutting power use.\",\"zh-TW\":\"將光學元件整合至矽晶圓上的技術，改以光訊號取代傳統電訊號傳輸資料，可大幅提升頻寬並降低功耗。\"}},{\"term\":{\"en\":\"Co-Packaged Optics (CPO)\",\"zh-TW\":\"共同封裝光學（CPO）\"},\"blurb\":{\"en\":\"An advanced packaging architecture that places optical engines directly alongside switch or processor ASICs on the same substrate to shorten signal paths.\",\"zh-TW\":\"將光學引擎與交換器或運算晶片共同封裝在同一基板上的先進封裝架構，可大幅縮短傳輸路徑並降低延遲。\"}},{\"term\":{\"en\":\"Wafer-Level Testing\",\"zh-TW\":\"晶圓級測試\"},\"blurb\":{\"en\":\"Testing integrated circuits and photonic devices directly on the uncut silicon wafer before dicing and packaging to screen out defects early.\",\"zh-TW\":\"在晶圓尚未切割與封裝前，直接對晶圓上的晶片進行電性與光學功能檢測，以提前篩除不良品並降低封裝成本。\"}}],\"sources\":[{\"name\":\"DIGITIMES\",\"url\":\"https://www.digitimes.com/news/a20261126PR204/taiwan-testing-photonics.html?chid=9\"},{\"name\":\"PIC Magazine\",\"url\":\"https://picmagazine.net/article/125873/HTSI_and_ficonTEC_expand_SiPh_testing\"},{\"name\":\"BigGo Finance\",\"url\":\"https://finance.biggo.com/news/46b56695-d9ac-426d-aff1-b51c82f11407\"}],\"imageUrl\":\"/covers/live/live-semiconductor-094-ficontec-htsi-silicon-photonics-taiwan.jpg\",\"imageAlt\":{\"en\":\"ficonTEC and HTSI silicon photonics testing partnership in Taiwan\",\"zh-TW\":\"ficonTEC 與華測科技（HTSI）台灣矽光子測試合作\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":83,\"trustBreakdown\":{\"crossCorroboration\":21,\"outletReputation\":21,\"recencyClarity\":21,\"sourceDiversity\":20},\"publishedAt\":\"2026-11-27T15:40:20.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":5,\"D2\":4,\"D3\":4,\"D4\":4,\"D5\":4,\"total\":21},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-semiconductor-094-ficontec-htsi-silicon-photonics-taiwan/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-semiconductor-094-ficontec-htsi-silicon-photonics-taiwan/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"d:\"$8:metadata\"\n"])</script></body></html>
