. Early entries are already being highlighted, and there is still time to enter.\nWhat happened\nPeople 65 and older have been submitting stories to the Senior Podcast Challenge, with NPR showcasing early entries it loves. The grand prize is a visit to NPR to watch the winner's podcast air live on Weekend Edition. The challenge runs alongside NPR's Student Podcast Challenge, the annual audio competition for grades four through 12, which returns in January. Now in its ninth year, the student contest has involved more than 90,000 students around the country.\nWhy it matters\nThe judgment is simple: public radio is widening the microphone beyond the classroom. A seniors' edition treats older Americans as storytellers rather than just listeners, and the live-broadcast prize gives the contest a payoff that a certificate cannot match. For readers with an older relative who likes to talk, the practical takeaway is that the entry window is still open.\nSources agree / disagree\nOnly NPR itself is reporting this; no second outlet corroborates the details in the snippets. Trust label: Single source — one outlet, unconfirmed by others.\nStill uncertain\nThe snippets do not give the entry deadline, the story length limit, or how winners are judged. Those details require the full reporting on the linked publisher page."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-education-02-npr-s-senior-podcast-cha\",\"category\":\"education\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-education-02-npr-s-senior-podcast-cha.webp\",\"imageAlt\":{\"en\":\"Cover related to: NPR's Senior Podcast Challenge: Early entries we love\",\"zh-TW\":\"相關封面圖：NPR 的高級播客挑戰：我們喜愛的早期作品\"},\"publishedAt\":\"2026-11-22T10:00:00.000Z\",\"title\":{\"en\":\"NPR Opens Senior Podcast Challenge to Storytellers 65 and Older\",\"zh-TW\":\"NPR 開放 65 歲以上長者參加播客挑戰賽\"},\"summary\":{\"en\":\"[Unconfirmed · single source] NPR has opened its Senior Podcast Challenge, inviting people 65 and older to submit audio stories for a chance to win a visit to NPR to watch their podcast air live on Weekend Edition. Early entries are already in, and there is still time to enter.\",\"zh-TW\":\"［未證實·單一來源］NPR 開放「長者播客挑戰賽」，邀請 65 歲以上民眾投稿音訊故事，優勝者可到 NPR 參觀、親眼看自己的播客在《週末版》直播。早期投稿已陸續入選，仍可報名；學生版挑戰賽將於明年 1 月回歸，今年邁入第 9 年、累計逾 9 萬名學生參加。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"NPR 開放「長者播客挑戰賽」，邀請 65 歲以上民眾投稿音訊故事，優勝者可到 NPR 參觀、親眼看自己的播客在《週末版》直播。早期投稿已陸續入選，仍可報名。\\n發生了什麼事\\n65 歲以上的民眾已開始投稿長者播客挑戰賽，NPR 挑出喜愛的早期作品介紹。大獎是到 NPR 參觀、看自己的播客在《週末版》直播。挑戰賽與 NPR 的學生播客挑戰賽並行；學生版是針對 4 至 12 年級的年度音訊比賽，將於明年 1 月回歸，今年邁入第 9 年，全美累計逾 9 萬名學生參加。\\n為什麼重要\\n結論很簡單：公共廣播把麥克風擴大到教室之外。長者版把年長者當成說故事的人，而不只是聽眾；直播播出的大獎是獎狀給不了的回報。家中有愛說故事的長輩的讀者，實際收穫就是：報名窗口還開著。\\n來源異同\\n目前只有 NPR 自己報導，片段中沒有第二家媒體佐證細節。信任標籤：僅1源——單一來源、未經他家證實。\\n仍不確定\\n片段未說明投稿截止日、故事長度上限與評選方式，須看 NPR 完整報導才能確認。\"},\"sources\":[{\"name\":\"NPR Education\",\"url\":\"https://www.npr.org/2026/11/22/nx-s1-6044221/npr-senior-podcast-challenge-early-entries\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":23,\"crossCorroboration\":6,\"recencyClarity\":20},\"tags\":[\"education\",\"live-ingest\",\"npr-education\",\"npr-education\"],\"glossary\":[{\"term\":{\"en\":\"NPR\",\"zh-TW\":\"NPR\"},\"blurb\":{\"en\":\"U.S. public radio network running the challenge.\",\"zh-TW\":\"主辦挑戰賽的美國公共廣播電台。\"}},{\"term\":{\"en\":\"Weekend Edition\",\"zh-TW\":\"《週末版》\"},\"blurb\":{\"en\":\"NPR weekend news program where the winning podcast airs live.\",\"zh-TW\":\"優勝播客將直播播出的 NPR 週末新聞節目。\"}},{\"term\":{\"en\":\"Senior Podcast Challenge\",\"zh-TW\":\"長者播客挑戰賽\"},\"blurb\":{\"en\":\"NPR audio-story contest for people 65 and older.\",\"zh-TW\":\"NPR 針對 65 歲以上民眾的音訊故事比賽。\"}},{\"term\":{\"en\":\"Student Podcast Challenge\",\"zh-TW\":\"學生播客挑戰賽\"},\"blurb\":{\"en\":\"NPR audio contest for grades four through 12.\",\"zh-TW\":\"NPR 針對 4 至 12 年級學生的音訊比賽。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\
