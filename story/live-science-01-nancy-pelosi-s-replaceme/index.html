ress with something most new members lack: a track record of actually writing AI-safety law at the state level. That makes him a lawmaker to watch as Congress debates federal AI rules — his state-level approach could become a template, or a warning, for the national debate. The takeaway is that the Pelosi seat is now held by someone who has already staked out a position on AI regulation.\nSources agree / disagree\nOnly MIT Technology Review carries the story in the feed, so there is no independent corroboration. Trust label: Single source — one outlet, an interview, no cross-check in the snippets.\nStill uncertain\nThe snippets do not say what federal AI rules Wiener favors, or when he might introduce legislation. The interview's details should be checked against the MIT Technology Review piece."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-science-01-nancy-pelosi-s-replaceme\",\"category\":\"science\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-science-01-nancy-pelosi-s-replaceme.jpg\",\"imageAlt\":{\"en\":\"Scott Wiener, Pelosi's successor, ready to regulate AI\",\"zh-TW\":\"佩洛西接班人維納準備監管人工智慧\"},\"publishedAt\":\"2026-11-09T17:05:43.000Z\",\"title\":{\"en\":\"Pelosi's Successor Scott Wiener Is Ready to Regulate AI\",\"zh-TW\":\"佩洛西接班人史考特·維納：準備好監管人工智慧\"},\"summary\":{\"en\":\"[Unconfirmed · single source] Scott Wiener, who won a tight race for former House Speaker Nancy Pelosi's open San Francisco seat, says he is ready to help set federal AI policy. As a California state senator he authored legislation to curb the risks of advanced AI; he was interviewed Friday, hours after being declared the winner.\",\"zh-TW\":\"［未證實·單一來源］贏得前眾議院議長南希·佩洛西（Nancy Pelosi）舊金山空缺席次激戰的史考特·維納（Scott Wiener）表示，他已準備好參與制定聯邦人工智慧政策。他在加州參議員任內起草過約束先進 AI 風險的立法；獲勝宣布數小時後，他於週五接受專訪。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"史考特·維納在加州參議員任內起草了旨在約束先進人工智慧風險的立法。如今他在激戰中贏得前眾議院議長南希·佩洛西（Nancy Pelosi）留下的舊金山空缺席次，可能在制定聯邦人工智慧政策上扮演關鍵角色。\\n發生了什麼事\\n維納贏得佩洛西舊金山眾議院席次的激戰，於週五被宣布獲勝。數小時後接受專訪時，他表示已準備好協助制定聯邦 AI 政策，憑藉的是他在加州參議員任內起草約束先進 AI 風險立法的紀錄。\\n為什麼重要\\n維納帶著多數新任議員沒有的資歷進入國會：在州層級實際寫過 AI 安全法。這使他在國會辯論聯邦 AI 規範時成為值得關注的人物——他的州級做法可能成為全國辯論的範本，也可能成為警示。結論是，佩洛西的席次如今由一位已在 AI 監管議題上表態的人接手。\\n來源異同\\n來源中只有《麻省理工科技評論》報導此事，無法獨立查證。信任標籤：僅1源——單一媒體、專訪，摘要中無交叉佐證。\\n仍不確定\\n摘要未說明維納主張的聯邦 AI 規範具體內容，也未說明他何時可能提出法案。專訪細節請對照《麻省理工科技評論》原文。\"},\"sources\":[{\"name\":\"MIT Technology Review\",\"url\":\"https://www.technologyreview.com/2026/11/09/1148182/nancy-pelosis-replacement-is-ready-to-regulate-ai/\"}],\"disagreements\":null,\"trustScore\":47,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":10,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"science\",\"live-ingest\",\"mit-technology-review\"],\"glossary\":[{\"term\":{\"en\":\"Scott Wiener\",\"zh-TW\":\"史考特·維納\"},\"blurb\":{\"en\":\"California state senator who won Pelosi's open San Francisco House seat.\",\"zh-TW\":\"贏得佩洛西舊金山眾議院空缺席次的加州參議員。\"}},{\"term\":{\"en\":\"Nancy Pelosi\",\"zh-TW\":\"南希·佩洛西\"},\"blurb\":{\"en\":\"Former Speaker of the U.S. House of Representatives.\",\"zh-TW\":\"美國前眾議院議長。\"}},{\"term\":{\"en\":\"Federal AI policy\",\"zh-TW\":\"聯邦人工智慧政策\"},\"blurb\":{\"en\":\"U.S. national rules governing artificial intelligence.\",\"zh-TW\":\"美國管理人工智慧的全國性規範。\"}},{\"term\":{\"en\":\"MIT Technology Review\",\"zh-TW\":\"《麻省理工科技評論》\"},\"blurb\":{\"en\":\"The technology magazine that interviewed Wiener.\",\"zh-TW\":\"專訪維納的科技雜誌。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel
