y, Sangwoo Han, and YoungHee Kim of Seoul National University published a study in Science demonstrating how fiber-optic cables can resolve fine-scale fault mechanics. By applying distributed acoustic sensing (DAS) along a 28-kilometer telecommunications fiber-optic cable in Southern California's Brawley Seismic Zone, the scientists recorded 16 microearthquakes and discovered that a magnitude 2 quake ruptured in two distinct sub-events located 150 meters apart and separated by only 42 milliseconds.\n\nWhy it matters\nSeismologists have traditionally modeled small earthquakes (below magnitude 3) as simple, uniform circular ruptures because sparse surface seismometers lack the resolution to capture sub-second fracture details. Showing that even tiny quakes exhibit complex, multi-stage cascading ruptures helps scientists better understand how small tremors grow into destructive earthquakes and enables dense monitoring using existing underground fiber networks.\n\nSource differences\nPhys.org (\"Fiber-optic sensing unearths surprising complexity in small California earthquake\") reports the Brawley Seismic Zone fiber-optic findings, while SFLORG (\"Fiber Optics Reveal Fragmented Microearthquake Ruptures\") specifies that the magnitude 2 earthquake ruptured in two stages 150 meters apart within 42 milliseconds, and Seoul National University's DeepSurf archive (\"Publication Archives - 지구심부-지표 상호작용 선도연구센터\") lists the Science publication details (Volume 394, Issue 6827, DOI 10.1126/science.aei0507).\n\nStill uncertain\nWhether multi-stage fragmented ruptures occur across all tectonic fault types or are particularly prevalent in geothermal and fluid-rich fault zones like Brawley requires broader fiber-optic deployments.\n\nTrust label: Single source — SFLORG and Seoul National University DeepSurf report on the same Rice University and Seoul National University Science study, alongside Phys.org reporting the same Brawley Seismic Zone fiber-optic study."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-science-340-fiber-optic-das-brawley-microearthquake-rupture\",\"category\":\"science\",\"title\":{\"en\":\"Fiber-Optic Sensing Catches Tiny California Earthquake Splitting Into Two Ruptures\",\"zh-TW\":\"光纖聲學感測揭加州小地震複雜破裂 規模2地震相隔42毫秒分兩階段發生\"},\"summary\":{\"en\":\"Using distributed acoustic sensing along a 28-kilometer fiber-optic cable in California's Brawley Seismic Zone, researchers from Rice University and Seoul National University recorded 16 microearthquakes and found a magnitude 2 event ruptured in two distinct stages 150 meters apart separated by just 42 milliseconds.\",\"zh-TW\":\"萊斯大學與首爾大學團隊利用分散式聲學感測（DAS）技術，透過加州布勞利地震帶一條28公里長的光纖電纜記錄到16次小地震並發表於《Science》，發現其中一次規模2地震並非單純圓形破裂，而是在相距150公尺的兩個位置分兩階段破裂，時間僅隔42毫秒。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n美國萊斯大學（Rice University）教授喬納森・阿霍-富蘭克林（Jonathan Ajo-Franklin）、第一作者韓相宇（Sangwoo Han）與韓國首爾大學教授金英熙（YoungHee Kim）領銜的跨國團隊，於期刊《Science》發表地震物理研究成果。團隊利用分散式聲學感測（DAS）技術，將南加州布勞利地震帶（Brawley Seismic Zone）一條長28公里的地下通訊光纖轉化為高密度感測陣列，共記錄到16次微震，並發現其中一次規模2地震在相距150公尺的兩個位置分兩階段破裂，兩者相隔僅42毫秒。\\n\\n「為什麼重要」\\n過去由於地表傳統地震儀站點間距較大，地震學界通常將規模小於3的微震簡化為單一圓形破裂模型。這項研究證明即使是規模2的小地震也具有複雜的多階段連鎖破裂過程，不僅有助於釐清小地震如何演變為破壞性大地震的物理機制，也展現利用現有地下光纖網路進行高解析度斷層監測的潛力。\\n\\n「來源異同」\\nPhys.org（標題「Fiber-optic sensing unearths surprising complexity in small California earthquake」）報導加州小地震光纖感測研究；SFLORG（標題「Fiber Optics Reveal Fragmented Microearthquake Ruptures」）具體指出該規模2地震在相距150公尺處以42毫秒間隔分兩階段破裂；首爾大學地球深部-地表交互作用研究中心（標題「Publication Archives - 지구심부-지표 상호작용 선도연구센터」）則載明《Science》第394卷第6827期出處（DOI: 10.1126/science.aei0507）。\\n\\n「仍不確定」\\n這種毫秒級的分段破裂機制是否普遍存在於所有構造斷層帶，抑或與布勞利地區地熱流體活動密切相關，仍待在其他斷層部署更多光纖觀測網加以驗證。\\n\\nTrust label: Single source — SFLORG 與首爾大學 DeepSurf 皆報導萊斯大學與首爾大學發表於《Science》的同一篇論文，Phys.org 亦同步報導該項布勞利地震帶光纖感測研究。\"},\"glossary\":[{\"term\":{\"en\":\"Distributed acoustic sensing (DAS)\",\"zh-TW\":\"分散式聲學感測（DAS）\"},\"blurb\":{\"en\":\"A technology that sends laser pulses down fiber-optic cables to detect tiny strain changes caused by seismic waves every few meters.\",\"zh-TW\":\"向光纖發射雷射脈衝並分析背向散射光變化，使整條光纖每隔數公尺就能充當高靈敏度地震感測器的技術。\"}},{\"term\":{\"en\":\"Brawley Seismic Zone\",\"zh-TW\":\"布勞利地震帶\"},\"blurb\":{\"en\":\"An active tectonic and geothermal fault zone in Southern California's Imperial Valley linking the San Andreas and Imperial faults.\",\"zh-TW\":\"位於南加州帝王谷的活躍構造與地熱地震帶，連接聖安德烈亞斯斷層與帝王斷層。\"}},{\"term\":{\"en\":\"Microearthquake\",\"zh-TW\":\"微震（小地震）\"},\"blurb\":{\"en\":\"A low-intensity earthquake—typically below magnitude 3—that is rarely felt by people but reveals active stress along faults.\",\"zh-TW\":\"規模通常小於3的低強度地震，人類極少有感，但能反映斷層帶內部的微細應力釋放過程。\"}}],\"sources\":[{\"name\":\"Phys.org\",\"url\":\"https://phys.org/news/2026-11-fiber-optic-unearths-complexity-small.html\"},{\"name\":\"SFLORG\",\"url\":\"https://www.sflorg.com/2026/11/geo11262601.html\"},{\"name\":\"Seoul National University DeepSurf\",\"url\":\"https://deepsurf.snu.ac.kr/7683/\"}],\"imageUrl\":\"/covers/live/live-science-340-fiber-optic-das-brawley-microearthquake-rupture.png\",\"imageAlt\":{\"en\":\"Fiber-Optic Sensing Catches Tiny California Earthquake Splitting Into Two Ruptures\",\"zh-TW\":\"光纖聲學感測揭加州小地震複雜破裂 規模2地震相隔42毫秒分兩階段發生\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":76,\"trustBreakdown\":{\"crossCorroboration\":17,\"outletReputation\":21,\"recencyClarity\":24,\"sourceDiversity\":14},\"publishedAt\":\"2026-11-28T03:17:36.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":21,\"D2\":21,\"D3\":20,\"D4\":22,\"D5\":20,\"total\":21},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest wi
