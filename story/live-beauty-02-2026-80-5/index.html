uettes span simple flat shoes, classic high-top sneakers, and retro running shoes, and the pitch is versatility: the same white pair works with casual clothes or an elegant outfit, delivering effortless polish in any combination. The trend frames white sneakers as a seasonal staple rather than a novelty buy, and white keeps returning each autumn because it sits between sport and dress codes.\nWhy it matters\nThe takeaway is about wardrobe math, not hype: one white pair that crosses jeans, tailoring, and dresses replaces three separate shoes. For readers, the trend is permission to wear the comfortable pair everywhere — and for retailers, a reason to push the 1980s back catalog.\nSources agree / disagree\nOnly Vogue Taiwan carried the story in this cluster, and the snippet names none of the five models. Trust label: Single source — one fashion outlet's trend pick, with no corroboration.\nStill uncertain\nThe five shoe models are not named in the feed snippet, and no prices, brands, or release dates appear. The trend claim itself is Vogue Taiwan's editorial call; verify the model list in the full article before shopping from it."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-beauty-02-2026-80-5\",\"category\":\"beauty\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-beauty-02-2026-80-5.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 2026秋冬白色球鞋趨勢：80年代最經典的5款復古球鞋回歸！從牛仔褲、西裝褲到裙裝都能搭\",\"zh-TW\":\"相關封面圖：2026秋冬白色球鞋趨勢：80年代最經典的5款復古球鞋回歸！從牛仔褲、西裝褲到裙裝都能搭\"},\"publishedAt\":\"2026-11-10T03:32:25.000Z\",\"title\":{\"en\":\"Five 1980s White Sneakers Lead the Fall-Winter 2026 Comeback\",\"zh-TW\":\"2026秋冬白色球鞋回歸：80年代最經典5款復出\"},\"summary\":{\"en\":\"Retro white sneakers from the 1980s are back as a fall-winter 2026 focal point, Vogue Taiwan reported, with five styles — from minimalist flats to classic high-tops and vintage runners — working across casual outfits, tailoring, and dresses. The trend's pitch is effortless polish, not novelty.\",\"zh-TW\":\"80年代復古白色球鞋再度成為2026秋冬流行焦點，台灣版 Vogue 報導。從簡約平底鞋、經典高筒球鞋到復古跑鞋，5款鞋型無論搭牛仔褲、西裝褲或裙裝都能展現不費力的時髦感。流行賣點是百搭，不是新奇。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"80年代復古白色球鞋再度成為2026秋冬流行焦點，台灣版 Vogue 報導。從簡約平底鞋、經典高筒球鞋到復古跑鞋，5款鞋型無論搭配牛仔褲、西裝褲或裙裝，都能展現不費力的時髦感。\\n發生了什麼事\\n5款鞋型涵蓋簡約平底鞋、經典高筒球鞋與復古跑鞋，賣點是百搭：同一雙白鞋，休閒服裝能穿、優雅造型也能穿，怎麼搭都有不費力的時髦感。這波流行把白球鞋定位成當季基本款，不是嚐鮮單品。\\n為什麼重要\\n重點是衣櫥算術，不是炒作：一雙能橫跨牛仔褲、西裝褲與裙裝的白鞋，可以取代三雙不同的鞋。對讀者來說，這波流行等於放行：舒服的那雙，哪裡都能穿；對店家來說，則是把80年代舊款再推一波的理由。\\n來源異同\\n這批來源只有台灣版 Vogue 一家，摘要也沒有點名5款鞋的型號。信任標籤：僅1源——單一時尚媒體的流行判斷，本批沒有其他來源交叉查證。\\n仍不確定\\n摘要沒有寫出5款鞋的型號，也沒有價格、品牌或發售日期。流行趨勢本身是 Vogue 的編輯判斷，照著買之前請先查閱完整文章。\"},\"sources\":[{\"name\":\"Vogue Taiwan\",\"url\":\"https://www.vogue.com.tw/article/white-sneakers-80s-trends-fall-winter-2026\"}],\"disagreements\":null,\"trustScore\":47,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":10,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"beauty\",\"live-ingest\",\"vogue-taiwan\"],\"glossary\":[{\"term\":{\"en\":\"Vogue Taiwan\",\"zh-TW\":\"台灣版 Vogue\"},\"blurb\":{\"en\":\"Taiwan edition of the fashion magazine and the sole source for this trend story.\",\"zh-TW\":\"時尚雜誌的台灣版，本則流行趨勢的唯一來源。\"}},{\"term\":{\"en\":\"White sneakers\",\"zh-TW\":\"白色球鞋\"},\"blurb\":{\"en\":\"The 1980s retro styles at the center of the fall-winter 2026 trend.\",\"zh-TW\":\"2026秋冬流行焦點的80年代復古鞋款。\"}},{\"term\":{\"en\":\"High-top sneakers\",\"zh-TW\":\"高筒球鞋\"},\"blurb\":{\"en\":\"One of the five retro silhouettes, with a collar rising above the ankle.\",\"zh-TW\":\"5款復古鞋型之一，鞋筒高過腳踝的款式。\"}},{\"term\":{\"en\":\"Vintage runners\",\"zh-TW\":\"復古跑鞋\"},\"blurb\":{\"en\":\"One of the five retro silhouettes, modeled on 1980s running shoes.\",\"zh-TW\":\"5款復古鞋型之一，以80年代跑鞋為藍本的款式。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1
