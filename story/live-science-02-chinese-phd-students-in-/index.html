pitals, universities and employers, and it will be judged by whether graduates perform as well as those who wrote one.\n\nSources agree-disagree\nThis is a single-outlet report from Nature News, so the material provided offers no second account to compare against, and no conflicting figure or name appears in it.\n\nStill uncertain\nThe material provided does not explain the alternative requirement, the assessment standard, or the rollout schedule for further degrees. Without those details, readers cannot tell how rigorous the practical route will be, or how fast it will spread.\n\nTrust label: Single source"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-science-02-chinese-phd-students-in-\",\"category\":\"science\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-science-02-chinese-phd-students-in-.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Chinese PhD students in clinical medicine can graduate without a thesis — more degrees to follow\",\"zh-TW\":\"相關封面圖：中國臨床醫學博士生無需論文即可畢業——還將獲得更多學位\"},\"publishedAt\":\"2026-11-03T00:00:00.000Z\",\"title\":{\"en\":\"China lets clinical medicine PhD students graduate without a thesis\",\"zh-TW\":\"中國臨床醫學博士生不寫論文也能畢業\"},\"summary\":{\"en\":\"[Unconfirmed · Single source] Chinese PhD students in clinical medicine can now graduate without a thesis, Nature reports, expanding the country's practical PhD programme beyond engineering students. More degrees are set to follow. Watch which fields join next and what replaces the thesis as proof of competence.\",\"zh-TW\":\"［未證實·單一來源］《自然》（Nature）報導，中國臨床醫學博士生現在不寫論文也能畢業，把國家的「實務博士」計畫從工科學生擴大到臨床醫學。更多學位將陸續跟進。接下來看哪些領域加入，以及用什麼取代論文作為能力證明。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"發生了什麼事\\n《自然》（Nature）報導，中國臨床醫學博士生現在不寫論文也能畢業，把國家的「實務博士」計畫從工科學生擴大到臨床醫學。這篇報導於 2026 年 11 月 3 日在線上發表。提供的材料說更多學位將陸續跟進，但沒有點名下一個領域、沒有時間表，也沒有說明學生不寫論文要改做什麼。\\n\\n為什麼重要\\n論文長期以來是博士生能獨立做研究的看得見的證明。整個專業領域取消論文，會改變博士學位對醫院、大學與雇主傳達的訊號，成敗將取決於這些畢業生的表現是否不輸寫過論文的人。\\n
