 Score of +46. The Slickdeals heading marks the offer as ending October 31, while the headline price is rounded to $5 and the listing price is $4.99.\nWhat happened\nSlickdeals Frontpage reported that Nintendo eShop has the Royal Edition as a Nintendo Switch digital download on sale for $4.99, crediting community member Slick_Drone for finding the deal. The listing describes the game as the winner of 30 global awards and a story-driven, open-world role-playing game that immerses the player in an epic medieval adventure across the Holy Roman Empire. The snippet then cuts off. No original price is stated, so the size of any discount cannot be calculated from the snippet.\nWhy it matters\nThe deal's appeal rests on the combination of a low headline price and an awards claim, but neither fact alone proves value. A digital download has no shipping or stock question of the usual kind, so the expiry heading and the exact $4.99 price are the details that decide whether the offer is still live. Without an original price or edition contents, readers should treat this as a price notice, not as a verdict that the Royal Edition is worth buying.\nSources agree / disagree\nOnly Slickdeals Frontpage carries this deal in the material provided, so no second source confirms the price, the expiry heading or the awards description. Trust label: Single source — one deal listing, with no corroboration in the available material.\nStill uncertain\nWhether the October 31 end date applies in the reader's region, what the Royal Edition includes, what the original price was, and whether the listing is still active after the heading date are not stated in the snippet. Check Nintendo eShop directly for the current price, contents and availability before buying."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-shopping-02-kingdom-come-deliverance\",\"category\":\"shopping\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/
