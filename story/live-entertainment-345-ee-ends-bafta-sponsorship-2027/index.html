rds, making the February 2027 ceremony its final edition as title partner. BAFTA confirmed that EE communicated the decision in late 2025 based on its business strategy, and the academy is currently in discussions with prospective sponsors to take over for the 2028 film awards.\n\nWhy it matters\nThe sponsorship traces back to 1998 under mobile brand Orange before transitioning to EE in 2013, standing as one of the longest-running corporate partnerships in international film awards. Securing a new headline backer ahead of 2028 will directly shape commercial funding and broadcast branding for Britain's premier film ceremony.\n\nSource differences\nScreen Daily's \"Bafta Film Awards headline sponsor EE to depart after 2027 ceremony\" and the roundups in Simkins LLP's \"Film and TV Briefing: Friday 27 November 2026 - Simkins LLP\" and Digg's \"BAFTA says EE's film awards sponsorship will take its final bow in\" all confirm that EE's partnership concludes after the 2027 ceremony and that BAFTA is seeking a replacement for 2028. Digg's roundup also traces the sponsorship back to Orange in 1998 and its transition to EE in 2013, while BAFTA cited EE's business strategy as the reason.\n\nStill uncertain\nWhich company will replace EE as the BAFTA Film Awards headline sponsor starting in 2028, and whether EE will retain its separate sponsorship of the BAFTA Rising Star Award beyond 2027.\n\nTrust label: Multi-source agreement — Corroborated by Screen Daily, Simkins LLP's industry briefing, and Digg's roundup."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-entertainment-345-ee-ends-bafta-sponsorship-2027\",\"category\":\"entertainment\",\"title\":{\"en\":\"Telecom Giant EE to End Nearly 30-Year BAFTA Film Awards Headline Sponsorship After 2027\",\"zh-TW\":\"結束近30年合作 英國電信商EE將於2027年典禮後卸下BAFTA冠名贊助\"},\"summary\":{\"en\":\"British telecommunications company EE will step down as headline sponsor of the BAFTA Film Awards following the February 2027 ceremony, concluding a nearly three-decade partnership originally started by Orange in 1998 as BAFTA negotiates a replacement sponsor for 2028.\",\"zh-TW\":\"英國電信巨頭EE決定在2027年2月頒獎典禮後，結束對英國電影學院獎（BAFTA）電影獎長達近30年的冠名贊助合作。BAFTA證實此舉基於EE的商業策略調整，目前正與潛在贊助商洽談接手2028年典禮。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n英國行動通訊與網路服務商EE決定不再續簽英國電影學院獎（BAFTA）電影獎的冠名贊助合約，2027年2月舉行的頒獎典禮將是雙方最後一次以冠名形式合作。BAFTA發言人證實，EE係基於商業策略考量於2025年底告知此決定，學院目前正與多家潛在贊助商洽談接手2028年電影獎事宜。\\n\\n「為什麼重要」\\n這項贊助可追溯至1998年由電信品牌Orange啟動、並於2013年轉由EE承接，是全球影視獎項中最長壽的企業冠名合作之一。2028年新任冠名贊助商能否順利敲定，將直接影響英國最重要電影盛會的商業資金規模與轉播品牌布局。\\n\\n「來源異同」\\nScreen Daily報導「Bafta Film Awards headline sponsor EE to depart after 2027 ceremony」、Simkins LLP產業簡報「Film and TV Briefing: Friday 27 November 2026 - Simkins LLP」及Digg彙整稿「BAFTA says EE's film awards sponsorship will take its final bow in」均一致確認EE將於2027年典禮後退出，且BAFTA正洽談2028年新贊助商。Digg彙整稿亦指出該贊助始於1998年Orange、2013年轉為EE，官方口徑則歸因於EE的商業策略調整。\\n\\n「仍不確定」\\n2028年起接替EE成為BAFTA電影獎新任冠名贊助商的企業人選，以及EE是否仍會繼續贊助獨立設立的BAFTA新星獎（Rising Star Award），目前均尚未公布。\\n\\nTrust label: Multi-source agreement — 綜合Screen Daily、Simkins LLP產業簡報及Digg彙整稿交叉核實。\"},\"glossary\":[{\"term\":{\"en\":\"BAFTA Film Awards\",\"zh-TW\":\"英國電影學院獎（BAFTA）\"},\"blurb\":{\"en\":\"The annual awards hosted by the British Academy of Film and Television Arts honoring outstanding British and international cinema.\",\"zh-TW\":\"由英國電影和電視藝術學院主辦的年度電影大獎，被視為奧斯卡金像獎前最重要的英國影壇風向球。\"}},{\"term\":{\"en\":\"Headline sponsor\",\"zh-TW\":\"冠名贊助商\"},\"blurb\":{\"en\":\"The primary commercial partner whose brand name is integrated directly into the official title and top-tier branding of an event.\",\"zh-TW\":\"活動最高層級的商業合作夥伴，其品牌名稱會直接納入典禮官方全名與核心視覺識別中。\"}},{\"term\":{\"en\":\"EE\",\"zh-TW\":\"EE電信\"},\"blurb\":{\"en\":\"A major British mobile network operator and internet service provider formed from the merger of Orange UK and T-Mobile UK, now part of BT Group.\",\"zh-TW\":\"英國主要行動通訊與寬頻服務商，由英國Orange與T-Mobile合併而成，現隸屬於英國電信集團（BT Group）。\"}}],\"sources\":[{\"name\":\
