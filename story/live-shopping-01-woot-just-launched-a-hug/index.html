rk, Samsung and more — stick, upright and robot vacs — with prices starting at $20. CNET's deals desk separately flags the Samsung Buds 4 Pro with ANC 2.0 and Bluetooth 6.1 for just $155, a $95 saving. Slickdeals' frontpage highlights a different Woot promo running in parallel: buy 5+ health and personal care items for 40% off (50% off for new customers), with free shipping for Prime members who log in with their Amazon account and select a shipping address — otherwise $6 per order.\nWhy it matters\nThis pre-holiday-season push is the classic double play: clearance pricing to move inventory, Prime free shipping to lock shoppers into the Amazon ecosystem. For consumers, $20 brand-name vacuums and a $155 flagship earbud sit squarely in the ‘regret-not-buying, don't-regret-buying’ price zone.\nSources agree / disagree\nSlickdeals covers the health-and-personal-care promo, CNET the vacuum and earbud deals — different Woot sales running in parallel, with no numeric conflicts (buy-5-get-40%-off vs. from-$20 are separate offers). Trust label: Two-source promotion — both are deal-intel sources; actual prices per Woot's checkout page.\nStill uncertain\nEnd dates and per-item discount depths are absent from the snippets; check Woot's official pages before buying."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-shopping-01-woot-just-launched-a-hug\",\"category\":\"shopping\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-shopping-01-woot-just-launched-a-hug.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Woot Just Launched a Huge Sale on Vacs From Dyson, Roborock and More With Prices From $20\",\"zh-TW\":\"相關封面圖：Woot 剛推出 Dyson、Roborock 等吸塵器大促銷，售價 20 美元起\"},\"publishedAt\":\"2026-10-18T06:11:42.000Z\",\"title\":{\"en\":\"Woot's Big Vacuum Sale: Dyson, Roborock and More From $20, Plus $155 Samsung Buds 4 Pro\",\"zh-TW\":\"Woot 吸塵器大促銷：戴森、石頭科技等20美元起，三星 Buds 4 Pro 只要155美元\"},\"summary\":{\"en\":\"Woot has launched a huge sale on vacuums from Dyson, Roborock, Roomba, Ecovacs, Shark and Samsung, with prices starting at $20. CNET also flags a $155 Samsung Buds 4 Pro deal, while Slickdeals notes a buy-5-get-40%-off health and personal care promo with free shipping for Prime members.\",\"zh-TW\":\"Woot 推出吸塵器大促銷，戴森、石頭科技、Roomba、Ecovacs、Shark、三星等品牌 20 美元起。CNET 另點名三星 Buds 4 Pro 只要 155 美元；Slickdeals 則提到健康護理用品買5件打6折，Prime 會員免運。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"該換吸塵器了嗎？Woot 說現在就是時候：戴森、石頭科技等大牌吸塵器 20 美元起跳。\\n發生了什麼事\\nWoot 推出了吸塵器大促銷，涵蓋戴森（Dyson）、石頭科技（Roborock）、Roomba、Ecovacs、Shark、三星等知名品牌，棒式、直立式、掃地機器人全包，價格從 20 美元起。CNET 的折扣線另點名：具備 ANC 2.0 與藍牙 6.1 的三星 Buds 4 Pro 耳機只要 155 美元，直接便宜 95 美元。Slickdeals 的前台情報則是另一檔：健康與個人護理用品買5件打6折、新客打5折，Prime 會員免運（需用亞馬遜帳號登入並選好地址），非會員每單運費 6 美元。\\n為什麼重要\\n年底購物季前的這波促銷，是典型的清庫存＋衝會員雙重操作：用低價吸塵器帶流量，用 Prime 免運把人綁進亞馬遜生態系。對消費者來說，20 美元起的品牌吸塵器和 155 美元的旗艦耳機，都是「不買會後悔、買了不心痛」的價格帶。\\n來源異同\\nSlickdeals 聚焦站內健康護理促銷，CNET 聚焦吸塵器與耳機折扣，兩家談的是 Woot 同期的不同檔期，數字上沒有衝突（買5件打6折 vs 20美元起是不同優惠）。信任標籤：2源促銷——兩家都是折扣情報來源，實際價格以 Woot 結帳頁為準。\\n仍不確定\\n促銷的結束時間、各品項的實際折扣幅度都不在摘要中；下單前請以 Woot 官方頁面為準。\"},\"sources\":[{\"name\":\"Slickdeals Frontpage\",\"url\":\"https://slickdeals.net/f/20170815-woot-health-personal-care-buy-5-get-40-off-free-s-h-w-prime?utm_source=rss\u0026utm_content=fp\u0026utm_medium=RSS2\"},{\"name\":\"CNET Deals\",\"url\":\"https://www.cnet.com/deals/woot-vacuum-sale/\"}],\"disagreements\":{\"en\":\"Figures differ across outlets (e.g. 5 vs 20 in headlines/snippets).\",\"zh-TW\":\"不同媒體的數字有所不同（例如，標題/摘要中的數字為 5 比 20）。\"},\"trustScore\":54,\"trustBreakdown\":{\"sourceDiversity\":13,\"outletReputation\":10,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"shopping\",\"live-ingest\",\"slickdeals-frontpage\",\"cnet-deals\",\"cnet-deals\"],\"glossary\":[{\"term\":{\"en\":\"Woot\",\"zh-TW\":\"Woot\"},\"blurb\":{\"en\":\"Amazon-owned deals site running the sale.\",\"zh-TW\":\"亞馬遜旗下的特賣網站，本次促銷主辦方。\"}},{\"term\":{\"en\":\"Dyson\",\"zh-TW\":\"戴森\"},\"blurb\":{\"en\":\"British applia
