cy) said countries agreed to move in the direction of drawing up rules for lethal autonomous weapons systems. The advocacy groups pushing to stop \"killer robots\" said the resolution \"failed to map out a clear direction\" — a deal to keep talking, not a deal to ban anything.\n\nWhy it matters\nLethal autonomous weapons decide for themselves when to kill, and there is still no binding international rule on them. Agreement to negotiate is the slowest possible progress: it keeps the process alive, but it leaves the weapons themselves unregulated for now.\n\nSources agree / disagree\nOnly one outlet, CNA, carries this story in the cluster, so there is no cross-check on the wording of the decision or the scale of the disappointment. Trust label: Single source — CNA alone reports the outcome, and the campaigners' reaction is quoted from the same report.\n\nStill uncertain\nThe snippet does not say what the next negotiating step is, what timetable was set, or which countries pushed for or resisted stronger language. The full CNA report and the meeting record are needed before judging how much was actually agreed."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-01-h30bb8d20\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-taiwan-01-h30bb8d20.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 各國同意朝研議邁進　以管制致命性自主武器\",\"zh-TW\":\"相關封面圖：各國同意朝研議邁進　以管制致命性自主武器\"},\"publishedAt\":\"2026-11-21T07:20:13.000Z\",\"title\":{\"en\":\"UN Meeting: Countries Agree to Move Toward Rules on Lethal Autonomous Weapons\",\"zh-TW\":\"聯合國會議：各國同意朝研議致命自主武器規範邁進，倡議團體批方向不明\"},\"summary\":{\"en\":\"[Unconfirmed · Single source] Countries agreed at a UN meeting in Geneva to move toward negotiating rules for lethal autonomous weapons systems, but campaigners trying to stop so-called \\\"killer robots\\\" called the decision a disappointment that \\\"failed to map out a clear direction.\\\" The door to talks is open; the destination is not.\",\"zh-TW\":\"［未證實·單一來源］各國在日內瓦聯合國會議同意朝研議致命自主武器系統規範邁進，但反「殺手機器人」倡議團體批評決議令人失望，「未能規劃出明確的方向」。takeaway：談判的門開了，但要走到哪裡還沒人說清楚。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"各國同意朝研議致命自主武器系統規範的方向邁進，但致力阻止所謂「殺手機器人」的倡議團體批評，聯合國會議的決議令人失望。\\n發生了什麼事\\n中央社（CNA）自日內瓦報導，各國今天同意朝研議致命自主武器系統規範邁進；倡議團體則表示，決議「未能規劃出明確的方向」。說白了，這是同意繼續談，不是同意禁止什麼。\\n為什麼重要\\n致命性自主武器自行決定何時殺人，國際上至今沒有具約束力的規範。同意研議是最慢的進展：程序保住了，武器本身暫時仍無人管。\\n來源異同\\n本集群只有中央社一家來源，決議文字與失望程度都無從交叉查核。信任標籤：僅1源——只有中央社報導此結果，倡議團體的反應也引自同一篇報導。\\n仍不確定\\n來源摘要未說明下一步談判是什麼、時程如何，也未說明哪些國家主張或抗拒更強硬的措辭；判斷到底談成了多少，須查中央社全文與會議紀錄。\"},\"sources\":[{\"name\":\"中央社-國際\",\"url\":\"https://www.cna.com.tw/news/aopl/202611210119.aspx\"}],\"disagreements\":null,\"trustScore\":59,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"中央社-國際\"],\"glossary\":[{\"term\":{\"en\":\"CNA\",\"zh-TW\":\"中央社\"},\"blurb\":{\"en\":\"Taiwan's Central News Agency, the single source reporting from Geneva.\",\"zh-TW\":\"中央通訊社，自日內瓦報導本案的唯一來源。\"}},{\"term\":{\"en\":\"United Nations\",\"zh-TW\":\"聯合國\"},\"blurb\":{\"en\":\"International body whose meeting produced the decision.\",\"zh-TW\":\"做出此決議的國際組織。\"}},{\"term\":{\"en\":\"Geneva\",\"zh-TW\":\"日內瓦\"},\"blurb\":{\"en\":\"Swiss city where the UN meeting took place.\",\"zh-TW\":\"聯合國會議舉行的瑞士城市。\"}},{\"term\":{\"en\":\"Lethal autonomous weapons systems\",\"zh-TW\":\"致命性自主武器系統\"},\"blurb\":{\"en\":\"Weapons that select and engage targets without human control.\",\"zh-TW\":\"無須人力操控、自行選擇並攻擊目標的武器。\"}},{\"term\":{\"en\":\"Killer robots\",\"zh-TW\":\"殺手機器人\"},\"blurb\":{\"en\":\"Campaigners' shorthand for lethal autonomous weapons.\",\"zh-TW\":\"倡議團體對致命性自主武器的俗稱。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\
