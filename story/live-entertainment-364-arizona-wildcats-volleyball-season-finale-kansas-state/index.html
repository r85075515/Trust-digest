d\nThe University of Arizona Wildcats women's volleyball team closed out its 2026 season on Friday night, November 27, 2026, with a five-set home loss to Kansas State at McKale Center in Tucson, Arizona. After taking the opening two sets 27-25 and 25-16, Arizona dropped the next three sets 19-25, 17-25, and 17-19 in extra points in front of an announced attendance of 2,457.\n\nWhy it matters\nThe Senior Night defeat concludes Arizona's regular-season Big 12 Conference campaign on a narrow two-point fifth-set margin following another five-set loss to Kansas two days earlier, leaving the Wildcats' postseason fate dependent on NCAA tournament selection decisions.\n\nSource differences\nArizona Athletics' official match recap \"Arizona Drops Five-Set Match to Kansas State\" confirms the five-set scores (27-25, 25-16, 19-25, 17-25, 17-19) and notes that the Friday night contest in Tucson was the Wildcats' final match of the season. Big 12 Conference's official statistical page \"Arizona vs Kansas St. - Volleyball - 11/27/2026 - Box Score\" provides the verified venue attendance of 2,457 and the 6:02 PM MST start time.\n\nStill uncertain\nWhether Arizona's overall season record will be sufficient to earn an at-large berth into the 2026 NCAA Division I Women's Volleyball Championship bracket remains to be determined by the selection committee. Trust label: Official confirmation — verified directly via Arizona Athletics' match report and Big 12 Conference official box score data."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-entertainment-364-arizona-wildcats-volleyball-season-finale-kansas-state\",\"category\":\"entertainment\",\"title\":{\"en\":\"Arizona Wildcats Volleyball Falls in Five-Set Season Finale to Kansas State in Tucson\",\"zh-TW\":\"亞利桑那大學野貓女排主場激戰五局惜敗堪薩斯州立大學，結束例行賽季\"},\"summary\":{\"en\":\"The Arizona Wildcats women's volleyball team lost its November 27, 2026 season finale to Kansas State in five sets (27-25, 25-16, 19-25, 17-25, 17-19) at McKale Center in Tucson.\",\"zh-TW\":\"美國大學體育聯盟（NCAA）亞利桑那大學野貓女子排球隊於 2026 年 11 月 27 日在圖森主場 McKale Center 迎戰堪薩斯州立大學，先贏兩局後遭對手連趕三局逆轉，以五局比數 27-25、25-16、19-25、17-25、17-19 惜敗，結束本賽季最後一場比賽。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n亞利桑那大學野貓女子排球隊於 2026 年 11 月 27 日週五晚間，在亞利桑那州圖森市主場 McKale Center 進行本季最後一場例行賽，對陣堪薩斯州立大學。野貓隊前兩局以 27-25、25-16 取得聽牌優勢，但隨後遭對手以 19-25、17-25 扳平，決勝第五局雙方鏖戰至延長賽，最終亞利桑那以 17-19 兩分之差飲恨，現場共吸引 2,457 名觀眾進場。\\n\\n「為什麼重要」\\n這場大四生之夜（Senior Night）惜敗使亞利桑那大學繼兩天前五局不敵堪薩斯大學後再度於決勝局失利，正式結束 Big 12 聯盟例行賽程，也讓球隊能否挺進全國錦標賽增添變數。\\n\\n「來源異同」\\n亞利桑那大學體育部官網戰報「Arizona Drops Five-Set Match to Kansas State」載明五局完整比數（27-25、25-16、19-25、17-25、17-19），並確認此役為野貓隊本季最後一場賽事。Big 12 聯盟官方數據頁面「Arizona vs Kansas St. - Volleyball - 11/27/2026 - Box Score」則完整記錄晚間 6 時 02 分開賽時間與 2,457 人的進場觀眾數。\\n\\n「仍不確定」\\n亞利桑那大學整季戰績是否足以獲得 2026 年 NCAA 一級女子排球錦標賽外卡資格，仍待遴選委員會正式公布名單。Trust label: Official confirmation — 依據亞利桑那大學體育部官方戰報與 Big 12 聯盟官方技術統計核實。\"},\"glossary\":[{\"term\":{\"en\":\"Big 12 Conference\",\"zh-TW\":\"Big 12 聯盟\"},\"blurb\":{\"en\":\"A major NCAA Division I collegiate athletic conference in the United States that includes the University of Arizona and Kansas State University.\",\"zh-TW\":\"美國大學體育聯盟（NCAA）一級主要體育聯盟之一，亞利桑那大學與堪薩斯州立大學均為該聯盟成員。\"}},{\"term\":{\"en\":\"Fifth-set tiebreaker\",\"zh-TW\":\"排球決勝第五局\"},\"blurb\":{\"en\":\"In collegiate volleyball, a decisive fifth set played to 15 points (win by two) when teams split the first four sets.\",\"zh-TW\":\"大學排球賽事中，當雙方前四局戰成 2 比 2 平手時進行的決勝局，採 15 分制且須領先兩分方能獲勝。\"}},{\"term\":{\"en\":\"McKale Center\",\"zh-TW\":\"麥凱爾中心（McKale Center）\"},\"blurb\":{\"en\":\"The primary indoor multi-purpose arena on the University of Arizona campus in Tucson, hosting basketball and volleyball games.\",\"zh-TW\":\"位於亞利桑那大學圖森校區的主要室內綜合體育館，為該校男女籃與女排隊主場。\"}}],\"sources\":[{\"name\":\"Arizona Wildcats Athletics\",\"url\":\"https://arizonawildcats.com/news/2026/11/27/volleyball-arizona-drops-five-set-match-to-kansas-state\"},{\"name\":\"Big 12 Sports\",\"ur
