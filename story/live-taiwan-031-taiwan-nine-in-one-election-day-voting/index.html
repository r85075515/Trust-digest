ipal mayors, county magistrates, city and county councilors, township chiefs, and village heads. Polling stations opened at 8:00 a.m. and close at 4:00 p.m., with the Central Election Commission (CEC) overseeing ballot counting immediately after polls close.\n\nThe local elections serve as a major midterm barometer for President Lai Ching-te's (賴清德) administration and test the organizational strength of the Democratic Progressive Party (DPP), Kuomintang (KMT), and Taiwan People's Party (TPP) ahead of the 2028 national elections.\n\nMajor Taiwanese outlets including CNA and Focus Taiwan report identical polling hours, voting procedures, and electoral races across all 22 administrative divisions.\n\nFinal voter turnout rates and winning margins in closely contested municipalities such as New Taipei, Taoyuan, and Kaohsiung remain undetermined until ballot counting concludes tonight.\n\nTrust label: Multi-source agreement — CNA and Focus Taiwan report identical official election schedules and races."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-031-taiwan-nine-in-one-election-day-voting\",\"category\":\"taiwan\",\"title\":{\"en\":\"Voters Across Taiwan Head to Polls for 2026 Nine-in-One Local Elections\",\"zh-TW\":\"2026 台灣九合一地方公職人員選舉登場 全台選民今赴投票所\"},\"summary\":{\"en\":\"Taiwan's 2026 nine-in-one local elections take place today, deciding mayors, county magistrates, and councilors across 22 cities and counties. Turnout and key municipal races in Taipei, New Taipei, Taoyuan, Taichung, Tainan, and Kaohsiung will set the political tone ahead of 2028.\",\"zh-TW\":\"2026 年台灣九合一地方公職人員選舉於今日舉行，全台 22 縣市選民投票選出直轄市長、縣市長及地方民意代表。六都選情緊繃，投票率與各陣營得票版圖將直接牽動台灣未來兩年的中央與地方政治局勢。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n2026 年台灣九合一地方公職人員選舉今日正式投票，全台 22 縣市同步選出直轄市長、縣市長、直轄市及縣市議員、鄉鎮市長及村里長。投票時間自上午 8 時起至下午 4 時止，投票結束後隨即進行開票作業。\\n\\n「為什麼重要」\\n本次選舉是總統賴清德（Lai Ching-te）執政後的首場全國性地方大選，被視為檢驗中央施政滿意度的期中考，也將重塑民進黨、國民黨與民眾黨在地方的執政版圖，直接影響 2028 年總統與立委選舉布局。\\n\\n「來源異同」\\n中央社（CNA）與 Focus Taiwan 均依據中選會公告報導投票時間、選舉項目與全台 22 縣市開票流程，核心事實與規則完全一致，無來源衝突。\\n\\n「仍不確定」\\n各縣市最終投票率、六都激戰選區的實際得票差距，以及各政黨總席次消長，仍待今日下午 4 時開票完成後才能確認。\"},\"glossary\":[{\"term\":{\"en\":\"Nine-in-One Elections\",\"zh-TW\":\"九合一選舉\"},\"blurb\":{\"en\":\"Taiwan's consolidated local elections held every four years to elect nine categories of municipal, county, and grassroots officials simultaneously.\",\"zh-TW\":\"台灣每四年舉行一次的地方公職人員合併選舉，同時選出直轄市長、縣市長、議員及基層民代等九類公職。\"}},{\"term\":{\"en\":\"Six Special Municipalities\",\"zh-TW\":\"六都\"},\"blurb\":{\"en\":\"Taiwan's six directly governed municipalities: Taipei, New Taipei, Taoyuan, Taichung, Tainan, and Kaohsiung.\",\"zh-TW\":\"指台北市、新北市、桃園市、台中市、台南市與高雄市六個直轄市，占全台逾七成人口。\"}},{\"term\":{\"en\":\"Central Election Commission (CEC)\",\"zh-TW\":\"中央選舉委員會\"},\"blurb\":{\"en\":\"Taiwan's independent government agency responsible for administering elections, referendums, and vote tabulation.\",\"zh-TW\":\"台灣主管全國性與地方性選舉、罷免及公民投票事務的獨立機關。\"}}],\"sources\":[{\"name\":\"Focus Taiwan\",\"url\":\"https://focustaiwan.tw/politics/202611270004\"},{\"name\":\"CNA\",\"url\":\"https://www.cna.com.tw/news/aipl/202611270012.aspx\"}],\"imageUrl\":\"/covers/live/live-taiwan-031-taiwan-nine-in-one-election-day-voting.jpg\",\"imageAlt\":{\"en\":\"Polling station in Taiwan during the 2026 local elections\",\"zh-TW\":\"2026 年台灣九合一地方選舉投票所現場\"},\"isHeadline\":true,\"isPopular\":true,\"trustScore\":92,\"trustBreakdown\":{\"crossCorroboration\":24,\"outletReputation\":24,\"recencyClarity\":24,\"sourceDiversity\":20},\"publishedAt\":\"2026-11-27T14:02:15.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":5,\"D2\":5,\"D3\":4,\"D4\":4,\"D5\":4,\"total\":22},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\
