that he made unwanted sexual advances toward a female House staffer. The committee said the conduct included touching her genitals at a Washington bar, and Gomez disagreed with its findings.\nWhat happened\nThe House Ethics Committee concluded that Gomez's actions violated House rules by making unwelcome sexual advances. The Los Angeles Times and NPR both report that Gomez said he would resign after the report. The committee described substantial evidence that Gomez made unwanted sexual advances toward a female House staffer, including touching her genitals at a Washington bar. Gomez disagreed with the findings, but the available feed material does not give his fuller response or the date on which his resignation would take effect.\nWhy it matters\nThe case concerns conduct by an elected representative toward a congressional staffer, and it was examined through the House's own ethics process rather than only through public claims. A resignation following a formal committee finding is a direct consequence for the member concerned, and it also affects representation for his constituents and the work of the House while the seat is filled. The finding matters because the committee, not only the individuals involved, assessed the evidence and the applicable House rules.\nSources agree / disagree\nThe Los Angeles Times and NPR agree on the central facts: the ethics report found evidence of sexual misconduct, Gomez disagreed with the findings, and he said he would resign. No clear conflict in names or figures appears in the short feed descriptions, although those descriptions do not reproduce the full report or the full articles. Trust label: Two-source agreement — Two outlets report the same finding and the same resignation announcement.\nStill uncertain\nThe feed material does not state when the resignation takes effect, what the committee recommended beyond its finding, or what Gomez said in full beyond disagreeing with the findings. It also does not give further detail about the staffer, whose identity should not be assumed, or about any later House action. Those points require the full committee report and the complete reporting from the linked outlets."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-01-california-democrat-rep-\",\"category\":\"international\",\"adult\":false,\"isHeadline\":true,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-international-01-california-democrat-rep-.jpg\",\"imageAlt\":{\"en\":\"Cover related to: California Democrat Rep. Gomez resigns following ethics report on sexual misconduct allegations\",\"zh-TW\":\"相關封面圖：加州民主黨眾議員戈麥斯在不當性行為指控的道德報告後辭職\"},\"publishedAt\":\"2026-11-23T22:29:53.000Z\",\"title\":{\"en\":\"Jimmy Gomez to Resign After House Ethics Report Finds Sexual Misconduct\",\"zh-TW\":\"吉米·戈梅茲（Jimmy Gomez）在眾議院道德委員會認定性行為不當後將辭職\"},\"summary\":{\"en\":\"Representative Jimmy Gomez will resign after a House Ethics Committee report found substantial evidence that he made unwanted sexual advances toward a female House staffer, including touching her at a Washington bar. Gomez disagreed with the findings, which said his conduct violated House rules.\",\"zh-TW\":\"眾議員吉米·戈梅茲（Jimmy Gomez）在眾議院道德委員會的報告認定他對一名女性眾議院職員有不受歡迎的性騷擾行為後表示將辭職，報告指出相關行為包括在華盛頓（Washington）一間酒吧觸碰對方身體。戈梅茲不同意報告結論，報告則認定他的行為違反眾議院規則。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"加州（California）民主黨籍眾議員吉米·戈梅茲（Jimmy Gomez）在眾議院道德委員會的報告認定他對一名女性眾議院職員有不受歡迎的性騷擾行為後表示將辭去眾議院職務。委員會指出，相關行為包括在華盛頓（Washington）一間酒吧觸碰對方生殖器，戈梅茲則不同意報告結論。\\n發生了什麼事\\n眾議院道德委員會認定，戈梅茲以不受歡迎的性騷擾行為違反眾議院規則。洛杉磯時報（Los Angeles Times）與全國公共廣播電台（National Public Radio，NPR）均報導，戈梅茲在報告出爐後表示將辭職。委員會指出，有充分證據顯示戈梅茲對一名女性眾議院職員作出不受歡迎的性騷擾，包括在華盛頓一間酒吧觸碰對方生殖器。戈梅茲不同意報告結論，但現有素材未提供他更完整的回應，也未說明辭職生效日期。\\n為什麼重要\\n本案涉及民選眾議員對國會職員的行為，且經由眾議院自身的道德程序調查，而非僅憑公開指控。正式委員會認定之後隨之而來的辭職，對當事議員是直接後果，也會影響其選區的代表安排與眾議院運作。委員會認定之所以重要，在於由委員會而非僅由當事人評估證據與適用的眾議院規則。\\n來源異同\\n洛杉磯時報與全國公共廣播電台在核心事實上一致：道德報告認定有性行為不當的證據，戈梅茲不同意結論，並表示將辭職。簡短素材中未見人名或數字上的明顯衝突，但這些素材並未完整呈現報告全文或報導全文。信任標籤：2源一致——兩家媒體報導了相同的認定結果與相同的辭職表態。\\n仍不確定\\n素材未說明辭職何時生效、委員會在認定之外提出何種建議，也未提供戈梅茲除不同意結論之外的完整說法。素材亦未提供該名職員的進一步資訊，不應臆測其身分，也未說明眾議院後續是否採取其他行動。這些關鍵資訊仍缺失，需查閱委員會報告全文與相關媒體的完整報導才能確認。\"},\"sources\":[{\"name\":\"LA Times California\",\"url\":\"https://www.latimes.com/politics/story/2026-11-23/rep-jimmy-gomez-quitting-after-ethics-panel-finds-evidence-of-sexual-misconduct\"},{\"name\":\"NPR News\",\"url\":\"https://www.npr.org/2026/11/23/g-s1-155142/california-democrat-rep-gomez-resigns-following-ethics-report-on-sexual-misconduct-allegations\"}],\"disagreements\":null,\"trustScore\":75,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":22,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"international\",\"live-ingest\",\"la-times-california\",\"npr-news\"],\"glossary\":[{\"term\":{\"en\":\"Jimmy Gomez\",\"zh-TW\":\"吉米·戈梅茲\"},\"blurb\":{\"en\":\"A Democratic member of the U.S. House of Representatives from California.\",\"zh-TW\":\"加州選出的美國眾議院民主黨籍眾議員。\"}},{\"term\":{\"en\":\"House Ethics Committee\",\"zh-TW\":\"眾議院道德委員會\"},\"blurb\":{\"en\":\"The U.S. House committee that examines whether members have violated House rules.\",\"zh-TW\":\"負責調查眾議員是否違反眾議院規則的美國眾議院委員會。\"}},{\"term\":{\"en\":\"U.S. House of Representatives\",\"zh-TW\":\"美國眾議院\"},\"blurb\":{\"en\":\"The lower chamber of the U.S. Congress, whose members are elected to represent districts.\",\"zh-TW\":\"美國國會的下議院，議員由各選區選出。\"}},{\"term\":{\"en\":\"Los Angeles Times\",\"zh-TW\":\"洛杉磯時報\"},\"blurb\":{\"en\":\"A U.S. newspaper that reported Gomez's resignation following the ethics report.\",\"zh-TW\":\"報導戈梅茲在道德報告後辭職的美國報紙。\"}},{\"term\":{\"en\":\"NPR\",\"zh-TW\":\"全國公共廣播電台\"},\"blurb\":{\"en\":\"National Public Radio, a U.S. public broadcaster that also reported the resignation.\",\"zh-TW\":\"同樣報導此辭職消息的美國公共廣播機構。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</scr
