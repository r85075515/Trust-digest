ht of the residency on November 12. She was originally scheduled for four shows, but high demand led her to extend the residency and add dates. Both outlets published the opening-night set list after the show.\n\nWhy it matters\nA Las Vegas residency is a mark of headliner status, and LISA taking one as the first K-pop artist to do so underlines how far K-pop solo careers have travelled beyond group tours. The extension from four shows to six shows that demand outran the original plan, and the set list gives fans a concrete record of how she is presenting her solo catalog on stage.\n\nSources agree / disagree\nBillboard and Just Jared agree on the core facts: the November 12 opening night, the Caesars Palace venue, and the extension from four shows to six. Both published the set list after opening night. No substantive disagreement appears between the two reports.\nTrust label: Two-source agreement — two entertainment outlets report the same opening-night facts and set list.\n\nStill uncertain\nThe feed material gives only short descriptions rather than the full set list, so the complete song order is not reproduced here. It is also unclear from the material whether further dates beyond November 29 are planned, and the full production details of the show were not described in the snippets supplied."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-entertainment-02-lisa-s-viva-la-lisa-set-\",\"category\":\"entertainment\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-entertainment-02-lisa-s-viva-la-lisa-set-.jpg\",\"imageAlt\":{\"en\":\"Cover related to: LISA’s ‘Viva La Lisa’ Set List Revealed After Opening Night of Las Vegas Residency!\",\"zh-TW\":\"相關封面圖：LISA 的“Viva La Lisa”演出名單在拉斯維加斯駐地開幕之夜後揭曉！\"},\"publishedAt\":\"2026-11-13T07:52:24.000Z\",\"title\":{\"en\":\"LISA Opens 'Viva La Lisa' as First K-Pop Headliner of a Las Vegas Residency\",\"zh-TW\":\"LISA 以《Viva La Lisa》開唱，成首位在拉斯維加斯駐唱的 K-pop 歌手\"},\"summary\":{\"en\":\"LISA of BLACKPINK, a K-pop star, opened her 'Viva La Lisa' residency at The Colosseum at Caesars Palace on Thursday night, becoming the first K-pop artist to headline a Las Vegas residency. Billboard and Just Jared revealed the set list after the show. Demand was strong enough to extend the run from four shows to six, through November 29.\",\"zh-TW\":\"BLACKPINK 成員 LISA 是全球知名 K-pop 歌手，週四晚間在凱撒宮（Caesars Palace）羅馬競技場（The Colosseum）展開《Viva La Lisa》駐唱，成為首位在拉斯維加斯駐唱的 K-pop 歌手。Billboard 與 Just Jared 在開幕夜後公布歌單。需求強勁讓場次從 4 場加到 6 場，一路演到 11 月 29 日。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"LISA 在 11 月 12 日週四晚間，於拉斯維加斯凱撒宮（Caesars Palace）羅馬競技場（The Colosseum）展開《Viva La Lisa》駐唱，為個人事業寫下新頁。她是首位在拉斯維加斯擔任駐唱主秀的 K-pop 歌手，開幕夜歌單已經公開。\\n\\n發生了什麼事\\nBillboard 報導，LISA 把個人作品帶上拉斯維加斯大道，演出充滿火焰、皮革與內衣造型橋段，這是預定演到 11 月 29 日的 6 場演出中的第一場。Just Jared 報導，這位 29 歲的 BLACKPINK 歌手兼演員，許多人是透過《白蓮花大飯店（The White Lotus）》認識她，12 日晚間完成駐唱首演。她原本只排定 4 場，因需求強勁而延長駐唱、加場。兩家媒體都在開幕夜後公布歌單。\\n\\n為什麼重要\\n拉斯維加斯駐唱是主秀地位的標誌，LISA 以首位 K-pop 歌手之姿拿下駐唱，顯示 K-pop 個人事業已經走出團體巡演的框架。場次從 4 場加到 6 場，代表需求超出原定規劃，歌單也讓歌迷具體看到她如何在舞台上呈現個人作品。\\n\\n來源異同\\nBillboard 與 Just Jared 的核心事實一致：11 月 12 日開幕夜、凱撒宮場地、場次從 4 場加到 6 場，兩家都在開幕夜後公布歌單。兩篇報導之間沒有實質分歧。\\n信任標籤：雙來源一致——兩家娛樂媒體報導相同的開幕夜事實與歌單。\\n\\n仍不確定\\n素材只有簡短摘要，並非完整歌單，完整曲目順序不在此列出。素材也沒有說明 11 月 29 日之後是否加場，演出的完整製作細節同樣未在摘要中描述。\"},\"sources\":[{\"name\":\"Billboard\",\"url\":\"https://www.billboard.com/lists/lisa-viva-la-lisa-las-vegas-residency-setlist-every-song/\"},{\"name\":\"Just Jared\",\"url\":\"https://www.justjared.com/2026/11/13/lisas-viva-la-lisa-set-list-revealed-after-opening-night-of-las-vegas-residency/\"}],\"disagreements\":{\"en\":\"Figures differ across outlets (e.g. 90 vs 2 in headlines/snippets).\",\"zh-TW\":\"（譯文待補）Figures differ across outlets (e.g. 90 vs 2 in headlines/snippets).\"},\"trustScore\":45,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":15,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"entertainment\",\"live-ingest\",\"billboard\",\"just-jared\"],\"glossary\":[{\"blurb\":{\"en\":\"BLACKPINK singer and actress headlining the 'Viva La Lisa' residency.\",\"zh-TW\":\"擔任《Viva La Lisa》駐唱主秀的 BLACKPINK 歌手兼演員。\"},\"term\":{\"en\":\"LISA\",\"zh-TW\":\"LISA\"}},{\"blurb\":{\"en\":\"K-pop group LISA performs with.\",\"zh-TW\":\"LISA 所屬的 K-pop 團體。\"},\"term\":{\"en\":\"BLACKPINK\",\"zh-TW\":\"BLACKPINK\"}},{\"blurb\":{\"en\":\"Las Vegas venue hosting the 'Viva La Lisa' residency.\",\"zh-TW\":\"舉辦《Viva La Lisa》駐唱的拉斯維加斯場地。\"},\"term\":{\"en\":\"The Colosseum at Caesars Palace\",\"zh-TW\":\"凱撒宮羅馬競技場（The Colosseum at Caesars Palace）\"}},{\"blurb\":{\"en\":\"Television series in which LISA acted.\",\"zh-TW\":\"LISA 參演的電視影集。\"},\"term\":{\"en\":\"The White Lotus\",\"zh-TW\":\"《白蓮花大飯店》（The White Lotus）\"}},{\"blurb\":{\"en\":\"U.S. music publication that reported the opening night and set list.\",\"zh-TW\":\"報導開幕夜與歌單的美國音樂媒體。\"},\"term\":{\"en\":\"Billboard\",\"zh-TW\":\"Billboard\"}},{\"blurb\":{\"en\":\"Entertainment outlet that reported the opening night and set list.\",\"zh-TW\":\"報導開幕夜與歌單的娛樂媒體。\"},\"term\":{\"en\":\"Just Jared\",\"zh-TW\":\"Just Jared\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-entertainment-02-lisa-s-viva-la-lisa-set-/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources
