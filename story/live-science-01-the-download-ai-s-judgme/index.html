ast at everything except judgment.\nWhat happened\nOne of the biggest obstacles to building a data center is getting approval to connect to the grid, a wait that could last as long as a decade — so some developers are not waiting and are instead building their own gas power plants. Separately, a new report from METR, the AI evaluation nonprofit, finds that some capabilities are improving exponentially, but models are not as good at tasks that require judgment as they are at coding. The edition's headline also flags a carbon-removal threat to crops, though the snippets give no detail on that item.\nWhy it matters\nThe judgment is that both stories are about bottlenecks: power for the machines, and judgment for the models. A data center that generates its own electricity solves the grid queue by sidestepping it, and a model that codes brilliantly but judges poorly is a tool that needs supervision precisely where it looks most capable.\nSources agree / disagree\nOnly MIT Technology Review is reporting this edition in the snippets; no second outlet corroborates the items. Trust label: Single source — one outlet, unconfirmed by others.\nStill uncertain\nThe snippets do not name the gas-plant projects, quantify METR's findings, or explain the carbon-removal crop threat beyond the headline. Those details require the full reporting on the linked publisher page."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-science-01-the-download-ai-s-judgme\",\"category\":\"science\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-science-01-the-download-ai-s-judgme.jpg\",\"imageAlt\":{\"en\":\"Cover related to: The Download: AI’s judgment problem and carbon removal’s crop threat\",\"zh-TW\":\"相關封面圖：下載：人工智慧的判斷問題和碳去除對農作物的威脅\"},\"publishedAt\":\"2026-11-24T13:10:00.000Z\",\"title\":{\"en\":\"The Download: AI's Judgment Problem and the Data-Center Gas Boom\",\"zh-TW\":\"《The Download》：AI 的判斷力問題與資料中心燃氣熱潮\"},\"summary\":{\"en\":\"[Unconfirmed · single source] In today's edition of The Download, MIT Technology Review's weekday newsletter, data centers are getting their own natural gas power plants because grid-connection approval can take as long as a decade — and a new METR report finds some AI capabilities improving exponentially, while models still lag at tasks that require judgment versus coding.\",\"zh-TW\":\"［未證實·單一來源］《麻省理工科技評論》平日通訊《The Download》本期要點：資料中心開始自建天然氣發電廠，因為併網核准可能要等十年；AI 評測非營利組織 METR 的新報告則發現，部分能力正指數級進步，但模型在需要判斷力的任務上仍不如寫程式。兩條線索指向同一件事：AI 擴張的速度，快過它周圍的判斷力與電網。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"《麻省理工科技評論》平日通訊《The Download》本期把兩則相互呼應的新聞放在一起：資料中心開始自建天然氣發電廠，而 AI 模型除了判斷力之外，什麼都進步得很快。\\n發生了什麼事\\n蓋資料中心最大的障礙之一是併網核准，等待可能長達十年——有些開發商不等了，改為自建天然氣發電廠。另一方面，AI 評測非營利組織 METR 的新報告發現，部分能力正指數級進步，但模型在需要判斷力的任務上不如寫程式。本期標題還提到碳移除對農作物的威脅，但片段未提供該項細節。\\n為什麼重要\\n結論是兩則新聞都在講瓶頸：機器的電力瓶頸，與模型的判斷力瓶頸。自發電的資料中心繞過了併網排隊；寫程式很厲害、判斷力卻差的模型，則正是最需要監督的地方——尤其在它看起來最能幹的時候。\\n來源異同\\n片段中只有《麻省理工科技評論》報導本期內容，沒有第二家媒體佐證。信任標籤：僅1源——單一來源、未經他家證實。\\n仍不確定\\n片段未指明哪些燃氣電廠項目、未量化 METR 的發現，也未在標題之外說明碳移除對農作物的威脅，須看完整報導才能確認。\"},\"sources\":[{\"name\":\"MIT Technology Review\",\"url\":\"https://www.technologyreview.com/2026/11/24/1149669/the-download-data-centers-gas-ai-consciousness/\"}],\"disagreements\":null,\"trustScore\":47,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":10,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"science\",\"live-ingest\",\"mit-technology-review\",\"mit-technology-review\"],\"glossary\":[{\"term\":{\"en\":\"The Download\",\"zh-TW\":\"《The Download》\"},\"blurb\":{\"en\":\"MIT Technology Review's weekday technology newsletter.\",\"zh-TW\":\"《麻省理工科技評論》的平日科技通訊。\"}},{\"term\":{\"en\":\"METR\",\"zh-TW\":\"METR\"},\"blurb\":{\"en\":\"Nonprofit that evaluates AI capabilities.\",\"zh-TW\":\"評測 AI 能力的非營利組織。\"}},{\"term\":{\"en\":\"MIT Technology Review\",\"zh-TW\":\"《麻省理工科技評論》\"},\"blurb\":{\"en\":\"Outlet publishing The Download.\",\"zh-TW\":\"刊出《The Download》的媒體。\"}},{\"term\":{\"en\"
