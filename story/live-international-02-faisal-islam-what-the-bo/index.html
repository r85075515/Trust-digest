 chief told its correspondent. Separately, Axios reports, citing multiple sources familiar with the matter, that Lutnick was sent a highly classified memo warning about Huang's relationship with Alice Huang. Lutnick oversees the Commerce Department, the agency charged with keeping sensitive US technology out of the hands of American adversaries, which is why the warning raises questions about how the department weighed the information.\n\nWhy it matters\nHuang leads the company whose chips sit at the centre of the US-China technology contest, so any question about his contacts carries weight beyond a personal matter. The memo raises questions about how the department weighed the warning, and that question is what readers should watch for next.\n\nSources agree–disagree\nThe BBC and Axios reports do not contradict each other; they cover different material, and neither outlet's account is confirmed by the other. The feed also bundled an unrelated BBC UK story about an acquitted alleged China spy, which is a separate case and is not part of this card's event.\n\nStill uncertain\nThe feed summaries do not state what, if anything, the Commerce Department did after receiving the memo, whether any formal investigation is under way, or what evidence supports the description of Alice Huang. The full BBC interview and the Axios report are the places to check for what each outlet could verify.\n\nTrust label: Two-source agreement — two outlets covering complementary angles of the same scrutiny, with no contradiction between them."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-02-faisal-islam-what-the-bo\",\"category\":\"international\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"publishedAt\":\"2026-11-11T06:00:21.000Z\",\"title\":{\"en\":\"Nvidia Chief Jensen Huang Discusses China and National Security in BBC Interview as Axios Reports Lutnick Memo\",\"zh-TW\":\"輝達（Nvidia）執行長黃仁勳（Jensen Huang）談中國與國安，Axios 披露商務部長盧特尼克（Howard Lutnick）接獲警告備忘錄\"},\"summary\":{\"en\":\"BBC's Faisal Islam interviewed Nvidia chief executive Jensen Huang about China and national security, while Axios reports Commerce Secretary Howard Lutnick received a classified memo warning about Huang's relationship with alleged Chinese spy Alice Huang. The two reports cover different angles of the same scrutiny; readers should check the full reports for what each outlet could verify.\",\"zh-TW\":\"英國廣播公司（BBC）費薩爾·伊斯蘭（Faisal Islam）專訪輝達（Nvidia）執行長黃仁勳（Jensen Huang），談中國與國家安全；Axios 則披露商務部長盧特尼克（Howard Lutnick）收到機密備忘錄，警告黃仁勳與疑似中國間諜黃愛麗絲（Alice Huang）的關係。兩篇報導角度不同、指向同一波審視，備忘錄內容仍待官方證實，後續看商務部如何回應。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"英國廣播公司（BBC）記者費薩爾·伊斯蘭（Faisal Islam）專訪輝達（Nvidia）執行長黃仁勳（Jensen Huang），談中國與國家安全；Axios 則報導，商務部長盧特尼克（Howard Lutnick）收到高度機密備忘錄，警告黃仁勳與疑似中國間諜黃愛麗絲（Alice Huang）的關係。兩篇報導從不同角度切入同一波審視。\\n\\n發生了什麼事\\nBBC 的專訪由費薩爾·伊斯蘭主訪，黃仁勳在訪談中談中國與國家安全。另一方面，Axios 引述多名知情人士報導，盧特尼克收到一份高度機密備忘錄，警告黃仁勳與黃愛麗絲的關係。盧特尼克主管的商務部負責防止美國敏感技術落入對手手中，備忘錄因此引發外界質疑商務部如何看待這項警告。\\n\\n為什麼重要\\n黃仁勳掌管的公司，其晶片正處於美中科技角力的中心，任何關於他往來對象的疑問都不只是私事。備忘錄到底如何被商務部衡量，是後續最值得追問的一點。\\n\\n來源異同\\nBBC 與 Axios 的報導並不互相矛盾，只是報導內容不同，彼此也無法相互證實。同批快訊另有一則 BBC 英國版關於獲判無罪的疑似中國間諜報導，那是另一起案件，與本卡事件無關。\\n\\n仍不確定\\n快訊摘要沒說商務部收到備忘錄後採取了什麼行動、是否有正式調查進行中，也沒說指稱黃愛麗絲為間諜的依據是什麼。完整專訪與 Axios 報導原文才能確認各家媒體實際查證到什麼。\"},\"sources\":[{\"name\":\"BBC Technology\",\"url\":\"https://www.bbc.co.uk/news/articles/c64g1gzy2vdzo?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"Axios\",\"url\":\"https://www.axios.com/2026/11/10/lutnick-nvidia-jensen-huang-china-memo\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"crossCorroboration\":14,\"outletReputation\":10,\"recencyClarity\":25,\"sourceDiversity\":13},\"tags\":[\"international\",\"live-ingest\",\"bbc-technology\",\"axios\",\"bbc-uk\"],\"glossary\":[{\"term\":{\"en\":\"Nvidia\",\"zh-TW\":\"輝達\"},\"blurb\":{\"en\":\"US chipmaker whose processors power AI data centres.\",\"zh-TW\":\"美國晶片大廠，其處理器是 AI 資料中心的主力。\"}},{\"term\":{\"en\":\"Jensen Huang\",\"zh-TW\":\"黃仁勳\"},\"blurb\":{\"en\":\"Co-founder and chief executive of Nvidia.\",\"zh-TW\":\"輝達共同創辦人兼執行長。\"}},{\"term\":{\"en\":\"Howard Lutnick\",\"zh-TW\":\"盧特尼克\"},\"blurb\":{\"en\":\"US Secretary of Commerce.\",\"zh-TW\":\"美國商務部長。\"}},{\"term\":{\"en\":\"Alice Huang\",\"zh-TW\":\"黃愛麗絲\"},\"blurb\":{\"en\":\"Woman named in the Axios report as a suspected Chinese spy.\",\"zh-TW\":\"Axios 報導中指稱為疑似中國間諜的女子。\"}},{\"term\":{\"en\":\"BBC\",\"zh-TW\":\"英國廣播公司\"},\"blurb\":{\"en\":\"British public-service broadcaster.\",\"zh-TW\":\"英國公共廣播機構。\"}},{\"term\":{\"en\":\"Axios\",\"zh-TW\":\"Axios\"},\"blurb\":{\"en\":\"US news outlet known for short-form reporting and scoops.\",\"zh-TW\":\"美國新聞媒體，以短報導與獨家新聞見長。\"}}],\"imageUrl\":\"/covers/live/live-international-02-faisal-islam-what-the-bo.jpg\",\"imageAlt\":{\"en\":\"Nvidia chief executive Jensen Huang speaking about China and national security in a BBC interview\",\"zh-TW\":\"輝達（Nvidia）執行長黃仁勳（Jensen Huang）接受英國廣播公司（BBC）專訪談中國與國家安全\"}}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-international-02-faisal-islam-what-the-bo/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/s
