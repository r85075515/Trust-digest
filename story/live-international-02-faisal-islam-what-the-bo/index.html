ces familiar told Axios. Why it matters: Lutnick oversees the agency charged with keeping sensitive U.S. technology out of the hands of American adversaries. The warning raises questions about how the department weighed potent Thousands of messages seen by BBC show how a Chinese official sought details of sensitive political matters. Why it matters\nThis cluster was assembled from 3 feed item(s) across 3 outlet(s) (BBC Technology, Axios, BBC UK) in the international category. Axiom links out to each publisher; this digest only restates titles and short feed descriptions — not full articles. Sources agree / disagree\nMultiple outlets are covering closely related headlines: \"Faisal Islam: What the boss of US tech giant Nvidia told me about China and national security\" (BBC Technology); \"Scoop: Commerce Department received national security warning on Nvidia CEO affair\" (Axios); \"Acquitted 'China spy': I was fall guy for security services\" (BBC UK).\nNo clear numeric/name conflicts detected in the short feed snippets; always verify details on the publisher pages. Still uncertain\nFeed descriptions can omit context, updates, or corrections. Click through to the linked outlets for the latest full reporting. Trust scores are heuristics, not fact-check guarantees. Linked sources (outlet names only): BBC Technology, Axios, BBC UK"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-02-faisal-islam-what-the-bo\",\"category\":\"international\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-international-02-faisal-islam-what-the-bo.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Faisal Islam: What the boss of US tech giant Nvidia told me about China and national security\",\"zh-TW\":\"相關封面圖：費薩爾伊斯蘭：美國科技巨頭英偉達的老闆告訴我關於中國和國家安全的事情\"},\"publishedAt\":\"2026-11-11T06:00:21.000Z\",\"title\":{\"en\":\"Faisal Islam: What the boss of US tech giant Nvidia told me about China and national secur
