from Constellation Energy Corporation, following an agreement initially announced in March 2026. The portfolio consists predominantly of combined-cycle and dual-fuel natural gas-fired power plants located in the PJM Interconnection market.\n\nWhy it matters\nThe closing fulfills regulatory divestiture requirements tied to Constellation's Calpine transaction while transferring dispatchable gas capacity to LS Power amid rising PJM electricity demand projections. Constellation retains roughly 55 GW of generating capacity across nuclear, gas, hydro, wind, and solar after divesting about 7 percent of its pre-closing fleet.\n\nSource differences\nLS Power's official release titled \"LS Power Completes Acquisition of 4.4 GW Natural Gas Generation\" confirms the asset type and PJM location without disclosing final cash proceeds. Power Technology's report \"Constellation concludes 4.4GW natural gas-fired power plants sale\" highlights the regulatory divestiture context, while Rigzone's piece \"Empowering People in Oil and Gas\" cites a 5 billion USD valuation figure in its headline.\n\nStill uncertain\nNeither LS Power nor Constellation disclosed the exact final net cash proceeds at closing, and plant-by-plant operational staffing transition schedules have not been itemized.\n\nTrust label: Official confirmation — Confirmed via LS Power's official corporate closing release and corroborated by industry trade coverage from Power Technology and Rigzone."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-energy-322-ls-power-constellation-4-4gw-pjm-deal\",\"category\":\"energy\",\"title\":{\"en\":\"LS Power Completes Acquisition of 4.4 GW Natural Gas Plants from Constellation\",\"zh-TW\":\"LS Power 完成收購 Constellation 旗下 4.4 GW 天然氣發電資產\"},\"summary\":{\"en\":\"LS Power has finalized its acquisition of roughly 4.4 gigawatts of predominantly natural gas-fired generation assets in the PJM market from Constellation Energy Corporation.\",\"zh-TW\":\"能源基礎設施投資商 LS Power 正式完成向 Constellation Energy 收購約 4.4 GW 的發電資產，標的以 PJM 電力市場的複循環天然氣機組為主，交易落幕代表 Constellation 履行了併購 Calpine 案所需的資產剝離承諾。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」LS Power 宣布完成向 Constellation Energy 收購約 4.4 GW 營運中發電資產的交易，該協議最初於 2026 年 3 月對外公布。這批資產主要為位於 PJM 互聯電網市場的複循環與雙燃料天然氣發電機組。\\n\\n「為什麼重要」此項交割不僅讓 Constellation 履行併購 Calpine 案所須的監管資產剝離條件，也讓 LS Power 在 PJM 電網用電需求持續攀升的預期下擴大可調度氣電版圖。Constellation 在出售約占交割前總容量 7% 的這批機組後，仍保有橫跨核能、天然氣、水力、風電與太陽能約 55 GW 的發電容量。\\n\\n「來源異同」LS Power 官方新聞稿《LS Power Completes Acquisition of 4.4 GW Natural Gas Generation》確認了資產類型與 PJM 市場分布，但未披露最終交割金額；能源媒體 Power Technology 的報導《Constellation concludes 4.4GW natural gas-fired power plants sale》點出該交易源於監管剝離要求，而 Rigzone 報導《Empowering People in Oil and Gas》則在標題提及 50 億美元交易規模。\\n\\n「仍不確定」買賣雙方在交割公告中均未公開最終淨現金對價細節，各座電廠的人員移轉與營運交接時程亦未逐一列明。\\n\\nTrust label: Official confirmation — 依據 LS Power 官方交割新聞稿確認，並經 Power Technology 與 Rigzone 等能源產業媒體報導交叉佐證。\"},\"glossary\":[{\"term\":{\"en\":\"PJM Interconnection\",\"zh-TW\":\"PJM 互聯電網\"},\"blurb\":{\"en\":\"A regional transmission organization coordinating wholesale electricity across 13 U.S. states and Washington, D.C.\",\"zh-TW\":\"負責協調美國東部與中西部 13 個州及華府批發電力調度的區域輸電組織。\"}},{\"term\":{\"en\":\"Combined-Cycle Gas Turbine\",\"zh-TW\":\"複循環天然氣發電\"},\"blurb\":{\"en\":\"A power plant setup using both a gas turbine and a steam turbine to generate electricity at higher thermal efficiency.\",\"zh-TW\":\"結合燃氣渦輪機與蒸汽渦輪機回收廢熱發電的高熱效率天然氣發電技術。\"}},{\"term\":{\"en\":\"Divestiture\",\"zh-TW\":\"資產剝離\"},\"blurb\":{\"en\":\"The sale of business units or physical assets, often mandated by regulators to preserve market competition during mergers.\",\"zh-TW\":\"企業出售旗下業務或實體資產的行為，常見於大型併購案中為符合反壟斷監管要求而進行的處分。\"}}],\"sources\":[{\"name\":\"LS Power\",\"url\":\"https://www.lspower.com/news/ls-power-completes-acquisition-of-4-4-gw-natural-gas-generation-assets-from-constellation/\"},{\"name\":\"Power Technology\",\"url\":\"https://www.power-technology.com/news/constellation-natural-g
