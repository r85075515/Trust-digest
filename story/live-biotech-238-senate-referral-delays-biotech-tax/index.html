nomics Legislation Committee for inquiry, with a reporting deadline set for March 2027. The bill had previously passed the lower house on October 29, 2026, and contains proposed changes to Research and Development Tax Incentive rules—including time limits on refundable offsets and removing eligibility for supporting activities—as well as capital gains treatment affecting biotechnology firms.\n\n「Why it matters」Refundable research and development tax offsets are a major non-dilutive funding pillar for early-stage Australian biotech companies. Referring the bill to committee halts immediate passage and gives industry stakeholders a formal window to submit evidence on how the proposed 10-year and 15-year refundability limits could affect clinical budgets and cash flow.\n\n「Source differences」BioPharmaDispatch highlights the delay to both research and development tax and capital gains changes specifically for the biotech sector, citing the headline title: 來源標題：「Senate referral delays R\u0026D tax and capital gains changes for biotech」. Swanson Reed's tax advisory news release details the committee referral date of November 26, 2026, the March 2027 reporting timeline, and specific R\u0026D offset provisions, citing the headline title: 來源標題：「Senate refers Treasury Laws Amendment (Tax Reform No. 4) Bill 2026 to the Economics Legislation Committee for reporting by March 2027」.\n\n「Still uncertain」Whether the Senate committee will recommend amending or removing the refundability time limits after receiving public submissions in early 2027 remains uncertain.\n\nTrust label: Multi-source agreement. Industry news coverage and specialist R\u0026D tax reporting align on the November 26 Senate referral and its delay to the 2026 tax reform bill."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-biotech-238-senate-referral-delays-biotech-tax\",\"category\":\"biotech\",\"title\":{\"en\":\"Senate Referral Delays Biotech R\u0026D Tax and Capital
