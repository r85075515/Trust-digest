 in the snippet, which cuts off mid-sentence.\nWhy it matters\nA Times acquisition would put one of the internet's most-loved film communities inside a major news organization, pairing Letterboxd's passionate user base with the Times' subscription business. For Letterboxd, a deal at around $330 million would mark a striking rise for a niche platform built around logging and reviewing films. For the Times, it would add a social, culture-facing product to a portfolio that has grown well beyond news. Whether the talks produce a signed deal is still open, and rival interest from Sony Pictures Entertainment and A24 shows Letterboxd has drawn more than one suitor.\nSources agree / disagree\nTechCrunch and The Verge agree on the core facts: exclusive talks, a price of around $330 million, and the Times as the buyer. Both trace the news to the Times' own reporting. Trust label: Two-source agreement — two outlets agree on the core facts.\nStill uncertain\nThe talks are not a done deal, and the snippet is cut off before describing what the negotiations include beyond the price. No closing date, final terms or comments from the companies appear in the sources. Verify details in the full reporting before quoting specifics."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-tech-03-the-new-york-times-repor\",\"category\":\"tech\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-tech-03-the-new-york-times-repor.webp\",\"imageAlt\":{\"en\":\"Cover related to: The New York Times reportedly in talks to buy Letterboxd for $330 million\",\"zh-TW\":\"相關封面圖：據報道，《紐約時報》正在洽談以 3.3 億美元收購 Letterboxd\"},\"publishedAt\":\"2026-11-06T00:07:18.000Z\",\"title\":{\"en\":\"New York Times in Talks to Buy Letterboxd for Around $330 Million\",\"zh-TW\":\"《紐約時報》洽談以約 3.3 億美元收購 Letterboxd\"},\"summary\":{\"en\":\"The New York Times Company is in exclusive negotiations to acquire Letterboxd, the social network for film lovers, for around $330 million, TechCrunch and The Verge report, citing the Times' own reporting. Sony Pictures Entertainment and A24 were also rumored to be interested buyers.\",\"zh-TW\":\"紐約時報公司正就以約 3.3 億美元收購電影愛好者社群 Letterboxd 進行獨家談判，TechCrunch 與 The Verge 引述《紐約時報》自身的報導如此指出。索尼影視娛樂與 A24 據傳也曾有意收購。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"紐約時報公司（The New York Times Company）正在就以約 3.3 億美元收購電影愛好者社群 Letterboxd 進行獨家談判，TechCrunch 與 The Verge 引述《紐約時報》自身的報導如此指出。\\n發生了什麼事\\nLetterboxd 是電影愛好者的線上平台，近年來成長迅速。報導指出，時報公司正與 Letterboxd 洽談收購，談判被形容為「獨家談判」，價格約 3.3 億美元。最近有傳言稱，時報公司、索尼影視娛樂（Sony Pictures Entertainment）與 A24 都有興趣收購 Letterboxd。談判除了價格之外還涵蓋哪些內容，來源摘要在句中截斷，沒有寫明。\\n為什麼重要\\n若時報完成收購，網路上最受喜愛的電影社群之一將納入一家大型新聞機構旗下，把 Letterboxd 熱情的用戶群與時報的訂閱業務結合起來。對 Letterboxd 來說，約 3.3 億美元的價格，標誌著一個以記錄與評論電影起家的小眾平台大幅躍升。對時報來說，這將為已遠遠超出新聞範疇的產品組合，再添一項面向社群與文化的產品。談判能否談成仍是未知數，索尼影視娛樂與 A24 的興趣也顯示，Letterboxd 吸引的不只一家買主。\\n來源異同\\nTechCrunch 與 The Verge 對核心事實的報導一致：獨家談判、約 3.3 億美元的價格、買方是時報公司，兩家媒體的消息都源自《紐約時報》自身的報導。信任標籤：雙源一致——兩家媒體對核心事實的報導一致。\\n仍不確定\\n談判還不是定局，來源摘要也在句中截斷，沒有寫明談判內容、成交日期、最終條件，也沒有雙方的回應；引用細節前請查閱完整報導。\"},\"sources\":[{\"name\":\"TechCrunch\",\"url\":\"https://techcrunch.com/2026/11/05/the-new-york-times-reportedly-in-talks-to-buy-letterboxd-for-330-million/\"},{\"name\":\"The Verge\",\"url\":\"https://www.theverge.com/news/1028375/the-new-york-times-letterboxd-acquisition-report\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":13,\"outletReputation\":18,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"tech\",\"live-ingest\",\"techcrunch\",\"the-verge\"],\"glossary\":[{\"blurb\":{\"en\":\"The publisher of The New York Times, in exclusive talks to buy Letterboxd.\",\"zh-TW\":\"《紐約時報》的出版商，正洽談收購 Letterboxd。\"},\"term\":{\"en\":\"The New York Times Company\",\"zh-TW\":\"紐約時報公司\"}},{\"blurb\":{\"en\":\"A social network for film lovers to log and review movies.\",\"zh-TW\":\"讓電影愛好者記錄與評論電影的社群平台。\"},\"term\":{\"en\":\"Letterboxd\",\"zh-TW\":\"Letterboxd\"}},{\"blurb\":{\"en\":\"Technolog
