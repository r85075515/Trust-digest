om $24.80, and VL Court 3.0 shoes from $20.80.\nWhat happened\nThe hoodie, in Medium Grey Heather (HB0041), is $19.20 after the code, with a full zip, drawcord-adjustable hood, kangaroo pockets, and ribbed cuffs and hem, in 53% cotton, 36% recycled polyester, and 11% viscose. The Run 70s 2.0 shoes start at $24.80 — Earth Strata, Off White, and Warm Vanilla at $24.80, Collegiate Green, Core White, and Semi Court Green at $25.60 — with a textile upper and lining and a Cloudfoam midsole. The VL Court 3.0 shoes start at $20.80. Community member SickerDealer shared the deals, and the listings carry Thumb Scores of +35, +13, and +20.\nWhy it matters\nThe takeaway is price discipline: name-brand adidas under $25 with free shipping is a genuine deal, but every price depends on the coupon code working at checkout. The hoodie at $19.20 is the standout — a full-zip fleece for less than a takeout lunch — while the two shoe deals reward buyers who are flexible on color.\nSources agree / disagree\nAll three items come from Slickdeals Frontpage, a single outlet, so the roundup is one source's deal board rather than corroborated reporting. The flagged \"2.0 vs 3.0\" difference is just two model names, not a factual conflict. Trust label: Single source — one deal outlet, three listings, no outside corroboration.\nStill uncertain\nSizes, color availability, and the coupon's expiry date do not appear in the snippet, and prices are marked as after-coupon where applicable. Verify the listing before checkout, since deal prices can change or sell out."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-shopping-01-adidas-men-s-essentials-\",\"category\":\"shopping\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-shopping-01-adidas-men-s-essentials-.jpg\",\"imageAlt\":{\"en\":\"Cover related to: adidas Men's Essentials Fleece 3-Stripes Full-Zip Hoodie (3 Colors) from $19.20 + Free S\u0026H\",\"zh-TW\":\"相關封面圖：（譯文待補）adidas Men's Essentials Fleece 3-Stripes Full-Zip Hoodie (3 Colors) from $19.20 + Free S\u0026H\"},\"publishedAt\":\"2026-11-10T03:48:14.000Z\",\"title\":{\"en\":\"Adidas Deals From $19.20: Hoodie, Run 70s 2.0 and VL Court 3.0\",\"zh-TW\":\"愛迪達（adidas）特價19.20美元起：連帽衫與兩款球鞋\"},\"summary\":{\"en\":\"Three adidas deals lead this Slickdeals roundup: the Essentials Fleece 3-Stripes full-zip hoodie from $19.20, Run 70s 2.0 shoes from $24.80, and VL Court 3.0 shoes from $20.80, all via eBay with code SHOPBRANDS20 and free shipping. Prices are after coupon where applicable, so check the listing before checkout.\",\"zh-TW\":\"Slickdeals 整理三檔愛迪達（adidas）特價：Essentials 三線全拉鍊連帽衫 19.20 美元起、Run 70s 2.0 球鞋 24.80 美元起、VL Court 3.0 球鞋 20.80 美元起，均經 eBay 結帳輸入 SHOPBRANDS20 折扣碼、免運費。標價為折扣後價格，下單前請先核對商品頁。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"Slickdeals 這波整理有三檔愛迪達（adidas）特價，均經 eBay、結帳輸入 SHOPBRANDS20 折扣碼、免運費：Essentials 三線全拉鍊連帽衫 19.20 美元起、Run 70s 2.0 球鞋 24.80 美元起、VL Court 3.0 球鞋 20.80 美元起。\\n發生了什麼事\\n連帽衫為中灰麻花色（Medium Grey Heather，HB0041），折扣後 19.20 美元，全拉鍊、可調式抽繩帽、袋鼠口袋、羅紋袖口與下擺，材質為 53% 棉、36% 再生聚酯纖維、11% 嫘縈。Run 70s 2.0 球鞋 24.80 美元起：大地層／米白／暖香草色 24.80 美元，學院綠／核心白／半場綠 25.60 美元，紡織鞋面與內裡、Cloudfoam 中底。VL Court 3.0 球鞋 20.80 美元起。這幾檔由社群成員 SickerDealer 分享，貼文 Thumb Score 分別為 +35、+13、+20。\\n為什麼重要\\n重點是價格紀律：25 美元以下買到愛迪達名牌還免運，確實是好價，但每個價格都仰賴折扣碼在結帳時生效。19.20 美元的連帽衫最突出——一件全拉鍊刷毛外套，比一份外帶午餐還便宜；兩款球鞋則適合對顏色不挑的買家。\\n來源異同\\n三檔都出自 Slickdeals 一家，是單一媒體的特價看板，不是經過交叉查證的報導。系統標記的「2.0 對 3.0」只是兩個型號名稱，不是事實衝突。信任標籤：僅1源——單一特價媒體、三則商品，本批沒有外部來源交叉查證。\\n仍不確定\\n摘要沒有尺寸、顏色庫存與折扣碼到期日，標價也註明是折扣後價格。特價可能變動或售完，結帳前請先核對商品頁。\"},\"sources\":[{\"name\":\"Slickdeals Frontpage\",\"url\":\"https://slickdeals.net/f/20280990-adidas-men-run-70s-2-0-shoes-2-colors-from-24-8-at-adidas-via-ebay?utm_source=rss\u0026utm_content=fp\u0026utm_medium=RSS2\"}],\"disagreements\":{\"en\":\"Figures differ across outlets (e.g. 2.0 vs 3.0 in headlines/snippets).\",\"zh-TW\":\"（譯文待補）Figures differ across outlets (e.g. 2.0 vs 3.0 in headlines/snippets).\"},\"trustScore\":47,\"tr
