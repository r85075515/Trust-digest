ng 16 consecutive passes in one sequence—while simultaneously measuring electrical charge, water droplets, and reflectivity. The study, published in Geophysical Research Letters under DOI 10.1029/2026GL124507 with analysis led by Professor Giles Harrison (吉爾斯・哈里森), found that larger droplets occurred where cloud-top charge was higher, increasing by about 10 percent across the observed range.\n\nWhy it matters\nStratocumulus clouds cover broad ocean and land areas and strongly influence Earth's radiation balance and rainfall formation. Incorporating electrical charge effects on droplet growth can improve how weather and climate models represent cloud microphysics.\n\nSource differences\nPhys.org, titled \"Roller-coaster flight reveals hidden electricity in clouds\", and 雷丁大學官方新聞, titled \"Rollercoaster FAAM flight reveals hidden electricity in clouds - University of Reading\", present the same underlying finding from the University of Reading release, including the 16 consecutive passes on January 12, 2024, the roughly 10 percent droplet size increase, and DOI 10.1029/2026GL124507.\n\nStill uncertain\nWhether this charge-droplet relationship holds across different seasons, geographic regions, or thicker convective cloud systems remains to be tested in broader airborne campaigns.\n\nTrust label: Single source — Both Phys.org and 雷丁大學官方新聞 stem from the same University of Reading research release."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-science-378-stratocumulus-charge-droplet-size\",\"category\":\"science\",\"title\":{\"en\":\"Research Aircraft Flight Links Stratocumulus Cloud-Top Charge to Droplet Size\",\"zh-TW\":\"研究飛機觀測顯示層雲雲頂電荷與水滴大小相關\"},\"summary\":{\"en\":\"Analysis of FAAM research aircraft flights over southern England on January 12, 2024 found that higher electrical charge near stratocumulus cloud tops coincided with larger water droplets, with droplet size increasing by about 10 percent across the measured range. Published in Geophysical Research Letters (DOI 10.1029/2026GL124507) with analysis led by Professor Giles Harrison (吉爾斯・哈里森), the findings help refine cloud and climate microphysics models.\",\"zh-TW\":\"分析 FAAM 研究飛機於 2024 年 1 月 12 日在英格蘭南部上空觀測的資料顯示，層雲雲頂電荷較高處對應較大水滴，量測範圍內水滴尺寸約增加 10%。該研究於 2026 年 11 月 27 日刊登於 Geophysical Research Letters，由吉爾斯・哈里森（Giles Harrison）教授主導分析，有助改進雲微物理與氣候模式。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\nFAAM 研究飛機於 2024 年 1 月 12 日在英格蘭南部上空反覆進出層雲雲頂（其中一次連續 16 次），同步量測電荷、水滴與反射率。由吉爾斯・哈里森（Giles Harrison）教授主導分析、刊登於 Geophysical Research Letters（DOI 10.1029/2026GL124507）的研究指出，雲頂電荷較高處水滴較大，在量測範圍內水滴尺寸約增加 10%。\\n\\n「為什麼重要」\\n層雲分布廣泛，對地球輻射平衡與降水形成具有關鍵作用。掌握電荷與水滴尺寸的關聯，有助於提升大氣與氣候模式對雲微物理過程的描繪精準度。\\n\\n「來源異同」\\nPhys.org 標題為「Roller-coaster flight reveals hidden electricity in clouds」，雷丁大學官方新聞標題為「Rollercoaster FAAM flight reveals hidden electricity in clouds - University of Reading」；兩者皆源自同一份研究發布內容，均提及 2024 年 1 月 12 日連續 16 次穿雲觀測、約 10% 水滴尺寸增幅與 DOI 10.1029/2026GL124507。\\n\\n「仍不確定」\\n此一電荷與水滴大小的關聯在其他季節、不同地理區域或更深厚的對流雲系中是否同樣成立，仍需更多觀測資料驗證。\\n\\nTrust label: Single source — Phys.org 與雷丁大學官方新聞皆源自同一則研究發布。\"},\"glossary\":[{\"term\":{\"en\":\"Stratocumulus cloud\",\"zh-TW\":\"層積雲\"},\"blurb\":{\"en\":\"A low-level layer or patch of clouds that covers large areas of the sky and affects sunlight reflection.\",\"zh-TW\":\"常見於低空的雲層或雲塊，覆蓋範圍廣並影響陽光反射與地表能量收支。\"}},{\"term\":{\"en\":\"Cloud microphysics\",\"zh-TW\":\"雲微物理\"},\"blurb\":{\"en\":\"Small-scale physical processes governing cloud droplet formation, growth, collision, and precipitation.\",\"zh-TW\":\"決定雲滴生成、凝結成長、碰撞合併與降水形成的微觀物理過程。\"}},{\"term\":{\"en\":\"Digital Object Identifier (DOI)\",\"zh-TW\":\"數位物件識別碼（DOI）\"},\"blurb\":{\"en\":\"A permanent alphanumeric string used to uniquely identify an academic article or dataset online.\",\"zh-TW\":\"用於在網路上永久且唯一識別學術論文或研究資料的標準編碼。\"}}],\"sources\":[{\"name\":\"Phys.org\",\"url\":\"https://phys.org/news/2026-11-roller-coaster-flight-reveals-hidden.html\"},{\"name\":\"雷丁大學官方新聞\",\"ur
