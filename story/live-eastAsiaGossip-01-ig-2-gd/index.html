oon Fung-wong disrupted Golden Bell events, and the awards-week buzz produced an unexpected star sighting: last year's Golden Bell best actor Lien Ping-fa ran into Leung over breakfast at a Taipei hotel and posed for a photo. That night Leung and Lau were spotted on the streets of Taipei, heading to Gold Pig for barbecue. ETtoday's headline captures the playful detail: Leung, bib on, jokingly urged Lau to stop eating.\nWhy it matters\nThe judgment is about star power, not barbecue: when a figure of Leung's stature travels without announcement, a single dinner becomes news across four outlets. For readers, the story is a reminder that in awards week, Taipei's streets are a stage — and a social-media post is all it takes to turn a private meal into a public itinerary.\nSources agree / disagree\nETtoday, Yahoo Taiwan entertainment and Google News Taiwan entertainment all tell the same story: Leung and Lau in Taipei, Gold Pig for barbecue, Lau's Instagram stories as the giveaway. No conflicting facts appear in the snippets. Trust label: consistent across outlets — the same sighting, told four ways.\nStill uncertain\nThe snippets do not say why Leung travelled to Taiwan, how long the couple stayed, or whether the Gold Pig visit was planned around the Golden Bell week. Those details are not in the feed text; check the full reports before repeating them."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-eastAsiaGossip-01-ig-2-gd\",\"category\":\"eastAsiaGossip\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-eastAsiaGossip-01-ig-2-gd.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 梁朝偉低調來台！劉嘉玲IG限動愛相隨行蹤露餡　2人現身GD愛店\",\"zh-TW\":\"相關封面圖：梁朝偉低調來台！劉嘉玲IG限動愛相隨行蹤露餡　2人現身GD愛店\"},\"publishedAt\":\"2026-10-25T04:00:00.000Z\",\"title\":{\"en\":\"Tony Leung and Carina Lau's Low-Key Taipei Trip Ends at G-Dragon's Favorite BBQ Spot\",\"zh-TW\":\"梁朝偉（Tony Leung）偕劉嘉玲（Carina Lau）低調來台，直奔「GD愛店」烤肉\"},\"summary\":{\"en\":\"Film star Tony Leung made a low-key trip to Taipei with his wife Carina Lau, and Lau's Instagram stories gave their whereabouts away. The couple headed to Gold Pig, the barbecue restaurant billed as G-Dragon's favorite. Fellow Golden Bell winner Lien Ping-fa had bumped into Leung over breakfast. Takeaway: one barbecue dinner turned a private trip into the entertainment headline.\",\"zh-TW\":\"國際影星梁朝偉（Tony Leung）偕妻子劉嘉玲（Carina Lau）低調來台，行蹤因劉嘉玲的 Instagram 限動曝光，兩人直奔媒體所稱的「GD愛店」、韓星來台必訪的烤肉名店「金豬食堂」（Gold Pig）大快朵頤。同批另有去年金鐘影帝連炳發在台北飯店早餐區巧遇梁朝偉合影。結論：一頓烤肉就讓一趟私人行程變成娛樂頭條。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"香港影壇傳奇梁朝偉悄悄來到台北，但妻子的 Instagram 限動沒能守住秘密。兩人晚間外出，最後落腳在台灣媒體稱為 G-Dragon 愛店的烤肉名店。\\n發生了什麼事\\n颱風薔琵打亂金鐘活動，頒獎週的熱鬧氣氛意外撞出明星行蹤：去年金鐘影帝連炳發在台北飯店早餐區巧遇梁朝偉，驚喜合影。當晚梁朝偉帶著劉嘉玲現身台北街頭，直奔「金豬食堂」（Gold Pig）大啖烤肉。ETtoday 的標題捕捉了逗趣細節：梁朝偉圍著兜兜，搞笑勸劉嘉玲不要再吃了。\\n為什麼重要\\n判斷不在烤肉，而在明星份量：梁朝偉這個等級的人物不聲張出遊，一頓晚餐就能登上四家媒體。對讀者來說，這則新聞提醒一件事，頒獎週的台北街頭本身就是舞台，一則社群貼文就足以把私人晚餐變成公開行程。\\n來源異同\\nETtoday、Yahoo 台灣娛樂與 Google News 台灣娛樂講的是同一個故事：梁朝偉與劉嘉玲在台北、金豬食堂吃烤肉、劉嘉玲的 Instagram 限動洩露行蹤。摘要片段中沒有事實衝突。信任標籤：各家報導一致——同一樁現身，四種講法。\\n仍不確定\\n摘要片段沒說梁朝偉為何來台、夫妻停留多久、金豬食堂之行是否配合金鐘週安排。這些細節不在摘要文字裡，轉述前請先查閱完整報導。\"},\"sources\":[{\"name\":\"ETtoday 影劇\",\"url\":\"https://star.ettoday.net/news/3260471\"},{\"name\":\"Google News\",\"url\":\"https://news.google.com/rss/articles/CBMiWkFVX3lxTE9ZbFYyVl92U3BDc3VjR1RoSjJOeU1hbE9Ca2p4X0I3UVkzbTE4YWh4QWhYa3JMYlhvc2ZncU9leEp6N2huQ2VxU3hxU1I3cDZHM2Yzc3A3Yld6dw?oc=5\"},{\"name\":\"Yahoo TW 娛樂\",\"url\":\"https://tw.news.yahoo.com/%E6%A2%81%E6%9C%9D%E5%81%89%E7%8F%BE%E8%B9%A4%E5%8F%B0%E7%81%A3%E6%82%84%E6%9C%9D%E8%81%96gd%E6%84%9B%E5%BA%97-%E5%8A%89%E5%98%89%E7%8E%B2%E7%A7%80%E7%81%AB%E8%BE%A3%E7%B7%9A%E6%A2%9D-%E7%82%BA%E7%BE%8E%E9%A3%9F%E8%B2%B7%E5%96%AE-052527257.html\"},{\"name\":\"Google News TW 娛樂\",\"url\":\"https://news.google.com/rss/articles/CBMic0FVX3lxTE5Jblh6Q3ctQi1zUEtGS3RHMjBxYVQwbzlKcmVGaWY1ZXhYMjJ5djRkdkZnSWE5dF9rRjJYOGRMTWJ2U1o2YjBGc0Y1Z2JqaV9DZVFqU0RXMDhSLTVVVVJpM2JoM3hEZ0ViQmNHelZHU01OaHc?oc=5\"}],\"d
