which both TechNews and CNA relayed. The fund would invest in European AI and quantum computing firms, aiming to reduce Europe's dependence on American and Chinese technology. TechNews frames the goal as narrowing the gap with the US and China; CNA's headline stresses cutting reliance on the two powers. Neither report gives a launch date, a funding timetable, or the fund's governance structure.\n\nWhy it matters\nA €50 billion state-backed fund would be one of Europe's largest direct bets on strategic technology. If it materialises, European AI and quantum startups would gain a patient capital source that private markets rarely provide for high-risk, long-horizon work, and Brussels would gain leverage in its push for technological sovereignty.\n\nSources agree / disagree\nTechNews and CNA agree on the core facts: a fund of up to €50 billion, aimed at AI and quantum computing, sourced to a Financial Times disclosure. Both trace to the same original report, so their agreement is not independent corroboration. No figure or factual conflict appears between the two.\n\nStill uncertain\nThe fund remains a reported plan, not a confirmed EU decision. The material gives no start date, no breakdown of funding sources, no list of eligible companies, and no statement from the European Commission. The Financial Times report itself is not quoted beyond its headline claim.\n\nTrust label: Two-source agreement — two outlets relay the same Financial Times disclosure and agree on the €50 billion figure and the AI and quantum focus."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-01-500\",\"category\":\"semiconductor\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-semiconductor-01-500.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 歐盟擬推500億歐元主權科技基金　降低對美中依賴\",\"zh-TW\":\"相關封面圖：歐盟擬推500億歐元主權科技基金　降低對美中依賴\"},\"publishedAt\":\"2026-11-25T08:40:35.000Z\",\"title\":{\"en\":\"EU Plans €50 Billion Sovereign Tech Fund to Cut Reliance on US and China\",\"zh-TW\":\"歐盟擬推 500 億歐元主權科技基金，降低對美中依賴\"},\"summary\":{\"en\":\"The Financial Times reports the EU plans a fund of up to €50 billion for long-term, high-risk investment in European AI and quantum computing companies. The goal is to narrow Europe's technology gap with the United States and China. Both outlets relay the same Financial Times disclosure.\",\"zh-TW\":\"英國《金融時報》（Financial Times）披露，歐盟（EU）擬投入最高 500 億歐元成立主權科技基金，對歐洲人工智慧（AI）與量子運算企業進行長期高風險投資，縮小與美國、中國的科技落差。兩家媒體報導均源自同一披露。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"歐盟（EU）擬成立規模最高 500 億歐元的主權科技基金，英國《金融時報》（Financial Times）披露，這筆資金將投入歐洲人工智慧（AI）與量子運算企業，進行長期高風險投資。\\n\\n發生了什麼事\\n《金融時報》披露這項計畫，科技新報（TechNews）與中央社（CNA）都轉述報導。基金將投資歐洲人工智慧與量子運算企業，目標是降低歐洲對美國與中國科技的依賴。科技新報強調縮小與美中的差距，中央社標題則點出降低依賴。兩篇報導都沒有提到基金啟動時間、撥款時程或管理架構。\\n\\n為什麼重要\\n500 億歐元的國家級基金，將是歐洲歷來對戰略科技最大手筆的直接投資之一。一旦落實，歐洲人工智慧與量子新創將獲得民間市場罕見的長期耐心資金，布魯塞爾推動科技自主也有了實質籌碼。\\n\\n來源異同\\n科技新報與中央社在核心事實上一致：基金規模最高 500 億歐元、鎖定人工智慧與量子運算、消息源自《金融時報》披露。兩家媒體源頭相同，這種一致不算獨立查證。兩者之間沒有數字或事實出入。\\n\\n仍不確定\\n這項基金目前只是據報導的計畫，並非歐盟已確認的決定。現有素材沒有啟動日期、資金來源細目、受惠企業名單，也沒有歐盟執委會的說法。《金融時報》原始報導除標題主張外並未引述更多內容。\\n\\n信任標籤：雙來源一致——兩家媒體轉述同一《金融時報》披露，500 億歐元規模與人工智慧、量子運算方向一致。\"},\"sources\":[{\"name\":\"TechNews 科技新報\",\"url\":\"https://finance.technews.tw/2026/11/25/eu-plans-e50-billion-technology-fund/\"},{\"name\":\"中央社-國際\",\"url\":\"https://www.cna.com.tw/news/aopl/202611250184.aspx\"}],\"disagreements\":null,\"trustScore\":64,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":19,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"semiconductor\",\"live-ingest\",\"technews-科技新報\",\"中央社-國際\"],\"glossary\":[{\"term\":{\"en\":\"European Union\",\"zh-TW\":\"歐盟\"},\"blurb\":{\"en\":\"The political and economic bloc of European member states.\",\"zh-TW\":\"歐洲國家組成的政治與經濟聯盟。\"}},{\"term\":{\"en\":\"Financial Times\",\"zh-TW\":\"金融時報\"},\"blurb\":{\"en\":\"A British business newspaper often first to report European policy plans.\",\"zh-TW\":\"經常率先披露歐洲政策計畫的英國財經報紙。
