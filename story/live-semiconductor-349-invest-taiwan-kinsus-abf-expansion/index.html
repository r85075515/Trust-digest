ed expansion projects from three companies totaling approximately TWD 61.1 billion. Under the Action Plan for Welcoming Overseas Taiwanese Businesses to Return to Invest in Taiwan, substrate maker Kinsus Interconnect Technology (Kinsus Interconnect Technology) accounts for the largest share at TWD 60.17 billion, expanding northern Taiwan plants, adding advanced equipment to scale high-end ABF substrate capacity, hiring 1,074 domestic employees, and deploying AI, digital manufacturing, and energy-saving carbon-reduction measures. Two smaller approvals under the Action Plan for Accelerated Investment by Small and Medium Enterprises include Pin Rui Precision at roughly TWD 690 million and Yi Lianhe Technology at roughly TWD 190 million, bringing cumulative Three Major Programs totals to 1,848 enterprises, roughly TWD 3.071 trillion in investment, and an estimated 176,490 jobs.\n\nWhy it matters\nGrowing artificial intelligence chip demand continues to drive structural capacity expansion in high-end ABF substrates across Taiwan's semiconductor packaging supply chain. Anchoring Kinsus's TWD 60.17 billion facility upgrade alongside smaller supply-chain investments reinforces domestic advanced packaging capacity and smart, low-carbon manufacturing.\n\nSource differences\nCommercial Times (\"AI與淨零雙引擎驅動投資台灣再增三案共611億 - 工商時報\") covers the TWD 61.1 billion three-company approval and highlights Kinsus deploying AI and digital technologies for process monitoring, quality management, and low-carbon production. BigGo Finance (\"Taiwan's Kinsus Interconnect Technology to Spend NT$60.17 Billion\") reports the November 27 approval by the Ministry of Economic Affairs' Invest Taiwan Office and Kinsus's TWD 60.17 billion high-end ABF substrate expansion, while Asia Daily (\"Kinsus Leads NT$61.1 Billion Taiwan Investment Push as AI Substrate Capacity Nears Its Limit\") carries corresponding coverage of the same Invest Taiwan Office announcement.\n\nStill uncertain\nSpecific construction completion schedules, phased capital expenditure timelines for Kinsus's northern Taiwan plant expansion, and target mass-production ramp dates have not been detailed in the public approval summary.\n\nTrust label: Single source — All three outlets report figures released in the November 27, 2026 Invest Taiwan Office press announcement rather than independent company financial audits."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-349-invest-taiwan-kinsus-abf-expansion\",\"category\":\"semiconductor\",\"title\":{\"en\":\"Taiwan Approves NT$61.1 Billion in New Investments Led by Kinsus's NT$60.17 Billion ABF Substrate Expansion\",\"zh-TW\":\"投資台灣事務所通過三案共新台幣 611 億元投資，景碩斥資 601.7 億元擴充高階 ABF 載板產能\"},\"summary\":{\"en\":\"Taiwan's Invest Taiwan Office approved NT$61.1 billion in new domestic investments across three firms on November 27, 2026, led by Kinsus Interconnect Technology's NT$60.17 billion expansion of high-end ABF substrate capacity in northern Taiwan, bringing cumulative Three Major Programs commitments to NT$3.071 trillion.\",\"zh-TW\":\"經濟部投資台灣事務所於2026年11月27日核准三家企業擴大投資台灣、總額約新台幣611億元，其中載板大廠景碩科技（Kinsus Interconnect Technology）透過台商回台方案投資601.7億元擴建北部廠區並擴充高階 ABF 載板產能，預計增聘1,074名本國員工；三大方案累計投資已達約3兆710億元。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n經濟部投資台灣事務所於2026年11月27日通過三家企業擴大投資台灣案件，總投資金額約新台幣611億元。其中，載板廠景碩科技（Kinsus Interconnect Technology）透過歡迎台商回台投資行動方案申請投資601.7億元為最大案，規劃擴建北部廠區、增添先進設備以擴充高階 ABF 載板產能，預計增聘1,074名本國員工，並導入人工智慧與數位技術及節能減碳措施；同批另通過中小企業加速投資行動方案兩案，分別為品睿精密約6.9億元與億聯合科技約1.9億元。截至目前，投資台灣三大方案累計已吸引1,848家企業、約3兆710億元投資，預估創造176,490個就業機會。\\n\\n「為什麼重要」\\n人工智慧晶片需求持續推升先進封裝材料規格與產能需求，景碩科技此次大手筆在台擴充高階 ABF 載板產線並結合智慧製造與低碳轉型，有助於鞏固台灣半導體封裝載板供應鏈的關鍵產能與技術競爭力。\\n\\n「來源異同」\\n工商時報（\\\"AI與淨零雙引擎驅動投資台灣再增三案共611億 - 工商時報\\\"）聚焦三案合計新台幣611億元規模，並詳述景碩科技運用人工智慧及數位技術強化製程監控、品質管理與低碳生產；BigGo Finance（\\\"Taiwan's Kinsus Interconnect Technology to Spend NT$60.17 Billion\\\"）著重經濟部投資台灣事務所27日核准三家企業投資及景碩斥資601.7億元擴充高階 ABF 載板的重點；Asia Daily（\\\"Kinsus Leads NT$61.1 Billion Taiwan Investment Push as AI Substrate Capacity Nears Its Limit\\\"）亦同步轉述同場投資台灣事務所核准公告內容。\\n\\n「仍不確定」\\n景碩科技北部廠區擴建的具體動工與完工時程、分年資本支出配置比例，以及新增高階 ABF 載板產能的實際量產爬坡時間表，仍有待公司後續揭露。\\n\\nTrust label: Single source — 三家媒體均引述經濟部投資台灣事務所2026年11月27日發布的同一份核准新聞稿數據。\"},\"glossary\":[{\"term\":{\"en\":\"ABF Substrate\",\"zh-TW\":\"ABF 載板\"},\"blurb\":{\"en\":\"Ajinomoto Build-up Film substrate used in high-performance integrated circuit packaging to connect high-density chips such as AI processors to printed circuit boards.\",\"zh-TW\":\"採用味之素堆積膜材料製成的高階積體電路載板，用於高腳數、高運算晶片（如人工智慧處理器）與主機板間的訊號連接。\"}},{\"term\":{\"en\":\"Three Major Programs for Investing in Taiwan\",\"zh-TW\":\"投資台灣三大方案\"},\"blurb\":{\"en\":\"Taiwan's government incentive framework comprising programs for returning Taiwanese businesses, rooted Taiwanese enterprises, and small and medium enterprises.\",\"zh-TW\":\"經濟部推動的投資促進政策組合，涵蓋歡迎台商回台、根留台灣企業及中小企業加速投資三大行動方案。\"}},{\"term\":{\"en\":\"Smart Manufacturing\",\"zh-TW\":\"智慧製造\"},\"blurb\":{\"en\":\"The integration of artificial intelligence, digital monitoring, and data analytics into factory operations to improve yield and production efficiency.\",\"zh-TW\":\"在工廠產線導入人工智慧、數位感測與數據分析技術，以強化製程監控、良率管理與生產決策效率。\"}}],\"sources\":[{\"name\":\"工商時報\",\"url\":\"https://www.ctee.com.tw/news/20261127701471-430104\"},{\"name\":\"BigGo Finance\",\"url\":\"https://finance.biggo.com/news/df1aa3ce-5562-4c92-940b-bda74bc186ca\"},{\"name\":\"Asia Daily\",\"url\":\"https://asiadaily.org/news/21041/\"}],\"imageUrl\":\"/covers/live/live-semiconductor-349-invest-taiwan-kinsus-abf-expansion.jpg\",\"imageAlt\":{\"en\":\"Taiwan Approves NT$61.1 Billion in New Investments Led by Kinsus's NT$60.17 Billion ABF Substrate Expansion\",\"zh-TW\":\"投資台灣事務所通過三案共新台幣 611 億元投資，景碩斥資 601.7 億元擴充高階 ABF 載板產能\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":74,\"trustBreakdown\":{\"crossCorroboration\":17,\"outletReputation\":21,\"recencyClarity\":23,\"sourceDiversity\":13},\"publishedAt\":\
