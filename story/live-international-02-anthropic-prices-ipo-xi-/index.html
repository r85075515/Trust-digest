 on Thursday, valuing the AI company at $1.5 trillion on a fully diluted basis.\nWhat happened\nThe company kicked off its IPO roadshow last week, announcing plans to offer 825 million shares. CNBC reports the offering raised over $81 billion, the largest on record, topping SpaceX; the Financial Times also reports an $81 billion raise. TechCrunch, PBS NewsHour and TechNews report the $83-a-share price. The listing will make Anthropic the first publicly traded frontier AI lab in history, per the reports. The Register notes the IPO is scheduled for the same day as the GTA VI release. The same cluster also carried a Bloomberg audio item on Xi Jinping speaking at the APEC leaders summit, with no further detail in the snippets.\nWhy it matters\nA $1.5 trillion valuation and a record raise put a frontier AI lab on public markets for the first time, setting a benchmark for how investors price AI companies. The size of the deal, larger than SpaceX's listing, also tests demand for AI equity at a moment of intense attention on the sector.\nSources agree / disagree\nOutlets agree the IPO priced at $83 a share, above the $70–$78 range, with Thursday trading under ANT and a $1.5 trillion fully diluted valuation; CNBC and the Financial Times put the raise above $81 billion, the largest on record. The $81 billion total and the $83 share price are different quantities — total proceeds versus price per share — not conflicting reports.\nStill uncertain\nThe final prospectus terms, the exact share count sold, and Thursday's first trade are still ahead. The Xi Jinping APEC item in the same cluster has no detail beyond the headline. Verify the raise figure on the publisher pages.\nTrust label: Multi-source agreement"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-02-anthropic-prices-ipo-xi-\",\"category\":\"international\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-international-02-anthropic-prices-ipo-xi-.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Anthropic Prices IPO, Xi Speaks at APEC Leaders Summit, More\",\"zh-TW\":\"相關封面圖：人為定價 IPO、習近平在 APEC 領導人峰會上發表演說等\"},\"publishedAt\":\"2026-11-19T02:54:38.000Z\",\"title\":{\"en\":\"Anthropic Prices IPO at $83 a Share, Raising Over $81 Billion in Record Listing\",\"zh-TW\":\"Anthropic 以每股 83 美元定價 IPO，募資逾 810 億美元創紀錄\"},\"summary\":{\"en\":\"Anthropic priced its IPO at $83 a share, above the $70–$78 range, and will start trading on the Nasdaq as ANT on Thursday at a $1.5 trillion fully diluted valuation. CNBC and the Financial Times put the raise above $81 billion, the largest listing on record, ahead of SpaceX. Watch Thursday's first trade and whether the raise figure is confirmed.\",\"zh-TW\":\"Anthropic 以每股 83 美元定價 IPO，高於 70 至 78 美元的區間，週四將以代號 ANT 在納斯達克掛牌，完全稀釋後估值 1.5 兆美元。CNBC 與《金融時報》稱募資逾 810 億美元，超越 SpaceX 成史上最大上市案。同批另有習近平在 APEC 峰會的演說。接下來看週四首日交易與募資金額是否獲確認。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"Anthropic 已將 IPO 定價為每股 83 美元，高於原先預計的 70 至 78 美元區間；股票週四將以代號 ANT 在納斯達克開始交易，完全稀釋後估值 1.5 兆美元。\\n發生了什麼事\\n公司上週啟動 IPO 路演，計畫發行 8.25 億股。CNBC 報導本次募資逾 810 億美元，創下史上最大發行規模，超越 SpaceX；《金融時報》同樣報導募資 810 億美元。TechCrunch、PBS 與科技新報報導每股 83 美元的定價。報導稱，掛牌後 Anthropic 將成為史上第一家公開上市的前沿 AI 實驗室。《The Register》指出，IPO 日期與《俠盜獵車手 VI》（GTA VI）發售日同一天。同批另有彭博社關於習近平在 APEC 領袖峰會演說的音訊，摘要中無進一步細節。\\n為什麼重要\\n1.5 兆美元估值與創紀錄募資，讓前沿 AI 實驗室首度登上公開市場，為投資人如何為 AI 公司定價立下標竿。募資規模超越 SpaceX，也考驗市場在高度關注 AI 產業之際的認購需求。\\n來源異同\\n各媒體對核心事實一致：每股 83 美元、高於 70 至 78 美元區間、週四以 ANT 掛牌、完全稀釋後估值 1.5 兆美元；CNBC 與《金融時報》稱募資逾 810 億美元，創紀錄。810 億美元是募資總額、83 美元是每股價格，是不同口徑的數字，並非相互衝突的報導。\\n仍不確定\\n最終招股條件、實際售出股數與週四首日交易價仍待揭曉；同批習近平 APEC 演說一項除標題外無細節。募資金額請以各媒體原文確認。\"},\"sources\":[{\"name\":\"CNBC\",\"url\":\"https://www.cnbc.com/2026/11/18/anthropic-ipo-ai-offering-price.html\"},{\"name\":\"Financial Times Markets\",\"url\":\"https://www.ft.com/content/62c0510b-ca65-441e-9baf-675b93903b9e?syn-25a6b1a6=1\"},{\"name\":\"TechCrunch\",\"url\":\"https://techcrunch.com/2026/11/18/anthropic-reportedly-prices-ipo-at-83-a-share-above-projected-range/\"},{\"name\":\"The Register\",\"url\":\"https://www.theregister.com/ai-and-ml/2026/11/18/anthropic-decides-to-go-head-to-head-with-gta-vi-release-schedules-ipo-for-the-same-day/5310872\"},{\"name\":\"TechNews 科技新報\",\"url\":\"https://finance.technews.tw/2026/11/19/anthropic-priced-its-ipo-at-83-per-share/\"},{\"name\":\"PBS NewsHour\",\"url\":\"https://www.pbs.org/newshour/economy/anthropic-prices-its-ipo-at-83-per-share-valuing-the-ai-giant-at-1-5-trillion\"},{\"name\":\"Axios\",\"url\":\"https://www.axios.com/2026/11/18/anthropic-ipo-1-trillion\"},{\"name\":\"Bloomberg News\",\"url\":\"https://www.bloomberg.com/news/audio/2026-11-19/anthropic-prices-ipo-xi-speaks-at-apec-leaders-summit-more\"},{\"name\":\"NPR News\",\"url\":\"https://www.npr.org/2026/11/18/nx-s1-6046212/anthropic-record-ipo-price\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":25,\"outletReputation\":20,\"crossCorroboration\":17,\"recencyClarity\":25},\"tags\":[\"international\",\"live-ingest\",\"cnbc\",\"financial-times-markets\",\"techcrunch\"],\"glossary\":[{\"term\":{\"en\":\"Anthropic\",\"zh-TW\":\"Anthropic\"},\"blurb\":{\"en\":\"AI company behind Claude, listing on the Nasdaq as ANT.\",\"zh-TW\":\"開發 Claude 的 AI 公司，將以代號 ANT 在納斯達克掛牌。\"}},{\"term\":{\"en\":\"IPO\",\"zh-TW\":\"首次公開募股\"},\"blurb\":{\"en\":\"First sale of a company's shares to the public.\",\"zh-TW\":\"公司首次向公眾發售股票。\"}},{\"term\":{\"en\":\"Nasdaq\",\"zh-TW\":\"納斯達克\"},\"blurb\":{\"en\":\"US stock exchange where Anthropic shares will trade.\",\"zh-TW\":\"Anthropic 股票將掛牌的美國證券交易所。\"}},{\"term\":{\"en\":\"SpaceX\",\"zh-TW\":\"SpaceX\"},\"blurb\":{\"en\":\"Company whose listing Anthropic's IPO reportedly surpasses in size.\",\"zh-TW\":\"募資規模被 Anthropic 超越的公司。\"}},{\"term\":{\"en\":\"APEC\",\"zh-TW\":\"亞太經合組織\"},\"blurb\":{\"en\":\"Asia-Pacific Economic Cooperation forum; Xi spoke at its leaders summit.\",\"zh-TW\":\"習近平出席領袖峰會的亞太經合組織。\"}},{\"term\":{\"en\":\"GTA V
