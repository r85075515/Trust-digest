Asia Growth Fund IV, LP, a private equity fund managed by GEF Capital Partners, LLC. A signing ceremony took place on November 26 in Mumbai during the IVCA Climate Capital Summit 2026, attended by Consul-General of Japan in Mumbai Hitomi Sato (Hitomi Sato), JICA Deputy Director General Masataka Takeshita (Masataka Takeshita), and GEF Capital Partners Co-Founder and Managing Partner Raj Pai (Raj Pai). Under the Project for Climate Change Resilient Enterprise Growth Acceleration, the capital will provide growth equity to Indian companies focused on clean energy, clean transportation, energy efficiency, circular economy, and sustainable water and agriculture.\n\n「Why it matters」\nMobilizing institutional development finance into mid-market private equity helps bridge the growth-capital gap for emerging clean-tech firms in India, one of the world's fastest-growing energy markets. The partnership also creates commercial entry pathways for Japanese corporations seeking supply-chain resilience and decarbonization partnerships across South Asia.\n\n「Source differences」\nJICA published the official release \"JICA Invests in GEF Climate Fund to Support Growth of Clean Energy Industries and Decarbonization in India: Contributing to expansion of business opportunities between Indian growth companies and Japanese companies\", detailing the official project title, Sustainable Development Goals alignment, and remarks from Consul-General Hitomi Sato (Hitomi Sato). ANI News published \"JICA invests USD 45 million in GEF’s South Asia Growth Fund IV to support growth of clean Energy Industries and decarbonisation in India\", summarizing the Mumbai signing ceremony and the fund's target sectors across clean energy, green buildings, and decarbonization.\n\n「Still uncertain」\nThe final total closing size of South Asia Growth Fund IV, LP, and the specific Indian portfolio companies scheduled to receive the initial equity tranches have not yet been disclosed.\n\nTrust label: Official confirmation — Official press release from the Japan International Cooperation Agency (JICA) is corroborated by Indian wire coverage."])</script><script>self.__next_f.push([1,"11:T81e,"])</script><script>self.__next_f.push([1,"「發生了什麼事」\n日本國際協力機構（JICA）於2026年11月27日宣布，已正式簽署認購協議，承諾向由 GEF Capital Partners, LLC 管理的私募股權基金「南亞成長基金四號」（South Asia Growth Fund IV, LP）注資最高4,500萬美元。簽約儀式於11月26日在印度孟買舉行的「2026年 IVCA 氣候資本峰會」期間登場，日本駐孟買總領事佐藤仁美（Hitomi Sato）、JICA 民間合作金融部次長竹下正高（Masataka Takeshita）與 GEF Capital Partners 共同創辦人兼執行合夥人拉吉・派（Raj Pai）共同出席。該投資隸屬於「氣候變遷韌性企業成長加速計畫」，將為印度潔淨能源、綠色交通、能源效率、循環經濟及永續水資源與農業企業提供成長型股權資金。\n\n「為什麼重要」\n透過官方開發金融機構引導資金進入中型市場私募股權，有助填補印度新興氣候科技企業在規模化階段的資金缺口。同時，這項合作也為日本企業拓展印度低碳供應鏈與商機建立直接對接管道。\n\n「來源異同」\n日本國際協力機構官網發布新聞稿「JICA Invests in GEF Climate Fund to Support Growth of Clean Energy Industries and Decarbonization in India: Contributing to expansion of business opportunities between Indian growth companies and Japanese companies」，完整列出官方專案名稱、聯合國永續發展目標對應項目及總領事佐藤仁美（Hitomi Sato）的致詞重點。印度亞洲國際新聞社（ANI News）則以「JICA invests USD 45 million in GEF’s South Asia Growth Fund IV to support growth of clean Energy Industries and decarbonisation in India」為題報導，概述孟買簽約儀式及基金涵蓋的綠建築、潔淨能源與去碳化投資領域。\n\n「仍不確定」\n南亞成長基金四號的最終募資總規模，以及首批獲得股權投資的具體印度企業名單，目前尚未對外公布。\n\nTrust label: Official confirmation — 日本國際協力機構官方新聞稿與印度通訊社報導內容一致。"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-energy-258-jica-gef-india-climate-fund\",\"category\":\"energy\",\"title\":{\"en\":\"Japan's JICA Commits USD 45 Million to GEF Climate Fund for India Decarbonization\",\"zh-TW\":\"日本國際協力機構注資4,500萬美元參與 GEF 印度氣候與潔淨能源基金\"},\"summary\":{\"en\":\"The Japan International Cooperation Agency (JICA) signed an agreement committing up to 45 million USD to South Asia Growth Fund IV, LP, managed by GEF Capital Partners, to back clean energy and decarbonization businesses across India. Announced on November 27, 2026, following a Mumbai signing ceremony, the investment links Indian climate enterprises with Japan
