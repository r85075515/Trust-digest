d 109,440 individual frames. Vogue Taiwan's report presents the handmade character of the film as the reason the pairing works: Loewe's identity is built on leather craftsmanship, and the film's insistence on pure handwork echoes it. The report does not list the collection's pieces, prices or release date.\n\nWhy it matters\nHoliday collections are a luxury house's loudest seasonal statement, and borrowing a beloved film gives Loewe a ready-made visual world — its eccentric, hand-built imagery — rather than a logo alone. For Burton's audience, the collaboration puts a cult classic back in front of shoppers more than three decades after its release. The commercial test will be whether the film's fans recognise the tribute in the products themselves; the report offers no detail on how literally the designs quote the film.\n\nSources agree / disagree\nThe item comes from a single outlet, Vogue Taiwan, reporting on a brand announcement. No second outlet in the material confirms the collection's details.\nTrust label: Single source — one outlet's report of a brand announcement, with no independent corroboration in the material provided.\n\nStill uncertain\nThe short feed item gives no product list, no prices, no launch date and no images of the collection, so what shoppers will actually be able to buy is unknown. It also does not say how Burton was involved beyond the collaboration credit. The figures for the film — 227 puppets, 109,440 frames — come from Vogue Taiwan's account and have not been checked against a second source."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-beauty-01-loewe-2026-tim-burton-90\",\"category\":\"beauty\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-beauty-01-loewe-2026-tim-burton-90.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 怪誕鬼才出手，Loewe 2026節日系列致敬名導Tim Burton 90年經典手繪動畫《聖誕夜驚魂》\",\"zh-TW\":\"相關封面圖：怪誕鬼才出手，Loewe 2026節日系列致敬名導Tim Burton 90年經典手繪動畫《聖誕夜驚魂》\"},\"publishedAt\":\"2026-11-13T03:09:20.000Z\",\"title\":{\"en\":\"Loewe and Tim Burton Turn The Nightmare Before Christmas Into a 2026 Holiday Collection\",\"zh-TW\":\"Loewe 攜手提姆·波頓，2026 節日系列致敬《聖誕夜驚魂》\"},\"summary\":{\"en\":\"Loewe has teamed up with Tim Burton on a 2026 holiday collection honouring The Nightmare Before Christmas, the 1993 stop-motion animation built puppet by puppet. The film used 227 jointed puppets and 109,440 frames, a handmade craft the brand pairs with its own leatherwork.\",\"zh-TW\":\"Loewe 攜手提姆·波頓推出 2026 節日系列，致敬 1993 年定格動畫《聖誕夜驚魂》。全片用 227 個可動關節木偶與 109,440 張畫格手工打造，與品牌皮革工藝相互呼應。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"Loewe 攜手導演提姆·波頓（Tim Burton），推出 2026 節日特別系列，向波頓 1993 年的奇幻動畫《聖誕夜驚魂》（The Nightmare Before Christmas）致敬。這次合作把 Loewe 的皮革工藝，與一部完全手工打造的電影放在一起——《Vogue Taiwan》認為，兩種講究手工的傳統正好呼應。\\n\\n發生了什麼事\\n這個系列是 Loewe 的 2026 節日特別系列，致敬提姆·波頓執導的 1993 年動畫《聖誕夜驚魂》。全片是定格動畫，由實物逐一搭建而成，運用多達 227 個可活動關節的木偶與 109,440 張獨立畫格。《Vogue Taiwan》的報導認為，電影的純手工特質正是合作成立的原因：Loewe 的核心精神是皮革工藝，電影對純手工的堅持與之呼應。報導沒有列出系列單品、價格或發售日期。\\n\\n為什麼重要\\n節日系列是精品品牌一年中聲量最大的季節表態，借用一部受喜愛的電影，Loewe 得到的是一個現成的視覺世界——怪誕、手工搭建的影像，而不只是一個標誌。對波頓的觀眾來說，合作讓這部經典在上映三十多年後重新回到消費者眼前。商業上的考驗是影迷能否在產品本身認出這份致敬；報導沒有說明設計在多大程度上直接引用電影。\\n\\n來源異同\\n素材來自單一媒體《Vogue Taiwan》，報導的是一則品牌公告。現有素材沒有第二家媒體證實系列細節。\\n信任標籤：單一來源——一家媒體對品牌公告的報導，現有素材沒有其他獨立佐證。\\n\\n仍不確定\\n簡短摘要沒有產品清單、價格、發售日期與系列實品照片，消費者實際能買到什麼還不清楚。報導也沒有說明波頓除了掛名合作之外如何參與。電影的數字——227 個木偶、109,440 張畫格——來自《Vogue Taiwan》的說法，沒有第二來源核對。\"},\"sources\":[{\"name\":\"Vogue Taiwan\",\"url\":\"https://www.vogue.com.tw/article/loewe-tim-burton-nightmare-before-christmas-collab\"}],\"disagreements\":null,\"trustScore\":47,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":10,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"beauty\",\"live-ingest\",\"vogue-taiwan\"],\"glossary\":[{\"blurb\":{\"en\":\"Luxury fashion house whose leather craft anchors the 2026 holiday collection.\",\"zh-TW\":\"以皮革工藝為核心、推出 2026 節日系列的精品品牌。\"},\"term\":{\"en\":\"Loewe\",\"zh-TW\":\"Loewe\"}},{\"blurb\":{\"en\":\"Film director behind The Nightmare Before Christmas and Loewe's holiday collaborator.\",\"zh-TW\":\"《聖誕夜驚魂》的導演，Loewe 節日系列的合作對象。\"},\"term\":{\"en\":\"Tim Burton\",\"zh-TW\":\"提姆·波頓\"}},{\"blurb\":{\"en\":\"1993 stop-motion fantasy animation that the Loewe collection honours.\",\"zh-TW\":\"Loewe 系列致敬的 1993 年定格奇幻動畫。\"},\"term\":{\"en\":\"The Nightmare Before Christmas\",\"zh-TW\":\"聖誕夜驚魂\"}},{\"blurb\":{\"en\":\"Animation made by photographing physical puppets frame by frame.\",\"zh-TW\":\"逐格拍攝實體木偶製成的動畫形式。\"},\"term\":{\"en\":\"Stop-motion animation\",\"zh-TW\":\"定格動畫\"}},{\"blurb\":{\"en\":\"Taiwan edition of the fashion magazine that reported the Loewe collection.\",\"zh-TW\":\"報導 Loewe 系列的時尚雜誌台灣版。\"},\"term\":{\"en\":\"Vogue Taiwan\",\"zh-TW\":\"Vogue Taiwan\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-beauty-01-loewe-2026-tim-burton-90/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-beauty-01-loewe-2026-tim-burton-90/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source ve
