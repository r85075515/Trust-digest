in front of a streaming audience that may know the movement better than the woman behind it.\nWhy it matters\nHeumann's name is central to disability rights history, yet her personal story remains far less familiar than the laws and protests she helped drive. A documentary centered on her gives new audiences a direct entry point — and gives today's activists a public stage to connect their work to hers.\nSources agree / disagree\nOnly NPR Education has covered the premiere in this digest so far. Trust label: Single source — the account rests on one outlet's feed description, with no corroborating coverage yet.\nStill uncertain\nThe feed description does not name the activists featured, say what ground the film covers, or report how critics received it. Verify details in the full NPR reporting before quoting specifics."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-education-01-a-new-generation-of-disa\",\"category\":\"education\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-education-01-a-new-generation-of-disa.webp\",\"imageAlt\":{\"en\":\"Cover related to: A new generation of disability rights activists carry on Judy Heumann's legacy\",\"zh-TW\":\"相關封面圖：新一代殘疾人權利運動者繼承了朱迪·休曼的遺產\"},\"publishedAt\":\"2026-11-15T10:00:00.000Z\",\"title\":{\"en\":\"Being Heumann Brings Judy Heumann's Disability Rights Legacy to Apple TV\",\"zh-TW\":\"《Being Heumann》登上 Apple TV：茱蒂·休曼（Judy Heumann）的身障平權傳承\"},\"summary\":{\"en\":\"Being Heumann, premiering November 13, 2026 on Apple TV, tells the lesser-known story of Judy Heumann, the mother of the disability rights movement. A new generation of activists explains how they carry her torch today — a reminder that the movement's next chapter is already being written.\",\"zh-TW\":\"紀錄片《Being Heumann》11 月 13 日在 Apple TV 首播，講述身障平權運動之母茱蒂·休曼（Judy Heumann）較少人知的故事。新一代運動者談自己如何接棒前行，提醒觀眾這場運動的下一章已經開始寫了。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"紀錄片《Being Heumann》11 月 13 日在 Apple TV 首播，講述身障平權運動之母茱蒂·休曼（Judy Heumann）的故事，新一代運動者也藉此說明自己如何接棒。\\n發生了什麼事\\n根據美國國家公共廣播電台（NPR）報導，這部片講述休曼較少人知的生平，她被視為現代身障平權運動的奠基者。報導搭配新一代運動者的受訪內容，他們談到自己如何「高舉火炬」，用各自的行動延續休曼的工作。影片 2026 年 11 月 13 日在 Apple TV 上線，讓可能只認識運動、不認識休曼本人的觀眾有機會認識她。\\n為什麼重要\\n休曼的名字在身障平權史上舉足輕重，她個人的故事卻遠不如她推動的法案與抗爭為人熟知。以她為主角的紀錄片給了新觀眾一個直接的入口，也讓今天的運動者有公開舞台，把自己的工作和她的傳承連起來。\\n來源異同\\n目前只有 NPR 教育頻道報導這次首播。信任標籤：僅1源——本卡內容只依據一家媒體的摘要，尚無其他報導佐證。\\n仍不確定\\n摘要沒有列出片中受訪的運動者是誰、影片涵蓋哪些內容，也沒有影評反應。引用細節前請查閱 NPR 的完整報導。\"},\"sources\":[{\"name\":\"NPR Education\",\"url\":\"https://www.npr.org/2026/11/15/nx-s1-6002935/being-heumann-new-generation-disability-rights\"}],\"disagreements\":null,\"trustScore\":60,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":23,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"education\",\"live-ingest\",\"npr-education\"],\"glossary\":[{\"blurb\":{\"en\":\"Disability rights activist widely credited as the mother of the movement.\",\"zh-TW\":\"身障平權運動者，被視為現代身障平權運動之母。\"},\"term\":{\"en\":\"Judy Heumann\",\"zh-TW\":\"茱蒂·休曼（Judy Heumann）\"}},{\"blurb\":{\"en\":\"Documentary film about Heumann's life, premiering on Apple TV.\",\"zh-TW\":\"講述休曼生平的紀錄片，在 Apple TV 首播。\"},\"term\":{\"en\":\"Being Heumann\",\"zh-TW\":\"《Being Heumann》\"}},{\"blurb\":{\"en\":\"Apple's streaming service, premiering the film on November 13, 2026.\",\"zh-TW\":\"蘋果的串流服務，2026 年 11 月 13 日首播本片。\"},\"term\":{\"en\":\"Apple TV\",\"zh-TW\":\"Apple TV\"}},{\"blurb\":{\"en\":\"US public radio network whose education desk covered the premiere.\",\"zh-TW\":\"美國公共廣播網，其教育頻道報導本次首播。\"},\"term\":{\"en\":\"NPR\",\"zh-TW\":\"美國國家公共廣播電台（NPR）\"}},{\"blurb\":{\"en\":\"Movement for equal rights and access for people with disabilities.\",\"zh-TW\":\"爭取身障者平等權利與無障礙環境的運動。\"},\"term\":{\"en\":\"Disability rights movement\",\"zh-TW\":\"身障平權運動\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initia
