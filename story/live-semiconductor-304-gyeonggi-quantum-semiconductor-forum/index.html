ng cluster—hosted the Gyeonggi Quantum Innovation Forum in Suwon, gathering quantum startups, semiconductor companies, academic researchers, and provincial officials to coordinate R\u0026D and talent development. Alongside the forum, provincial officials highlighted a KRW 3 billion public investment program in 2026 supporting local quantum companies, while regional quantum sensor wafer developer EPI Solution (EPI Solution) reported raising KRW 2.5 billion in funding.\n\nWhy it matters\nIntegrating quantum hardware—such as quantum sensors and cryogenic control chips—with established silicon wafer fabrication processes is a key competitive front for semiconductor powerhouses. By linking Gyeonggi's existing chipmaking ecosystem with early-stage quantum component suppliers, South Korea aims to accelerate commercial wafer-scale manufacturing of quantum devices.\n\nSource differences\nThe Quantum Insider covered the event under \"Gyeonggi Province Holds Forum on Quantum and Semiconductor Industry Cooperation\", focusing on the forum's talent pipeline goals, semiconductor partnerships, and the province's KRW 3 billion quantum support allocation. QubitWire reported on the same provincial initiative under \"Gyeonggi reports ₩2.5 billion raised by EPI Solution - QubitWire\", adding specific financing figures for quantum sensor wafer firm EPI Solution based on Gyeonggi Province's Suwon forum announcement.\n\nStill uncertain\nSpecific commercial customer contracts, wafer production volumes, and timelines for integrating EPI Solution's quantum sensor wafers into mainstream semiconductor foundry lines have not been publicly disclosed.\n\nTrust label: Single source — Both specialist outlets draw their figures and event details from Gyeonggi Province's official Suwon quantum forum press release."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-304-gyeonggi-quantum-semiconductor-forum\",\"category\":\"semiconductor\",\"title\":{\"en\":\"South Korea's Gyeonggi Province Hosts Quantum and Semiconductor Cooperation Forum\",\"zh-TW\":\"南韓京畿道舉辦量子與半導體產業合作論壇並投入30億韓元扶植新創\"},\"summary\":{\"en\":\"South Korea's Gyeonggi Province convened the Gyeonggi Quantum Innovation Forum, bringing together regional semiconductor firms, researchers, and officials while committing KRW 3 billion in 2026 funding to local quantum companies—including quantum sensor wafer developer EPI Solution, which raised KRW 2.5 billion.\",\"zh-TW\":\"南韓京畿道舉辦「京畿量子創新論壇」，邀集半導體企業、研究機構與官員共商量子與半導體產業協作；京畿道今年投入30億韓元（KRW 3 billion）扶植量子企業，其中量子感測晶圓業者 EPI Solution 亦宣布募得25億韓元（KRW 2.5 billion）資金。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n南韓半導體製造核心重鎮京畿道於水原市舉辦「京畿量子創新論壇」，集結當地量子新創、半導體企業、學界研究人員及道政府官員，共同研商量子與半導體產業研發合作及人才培育。京畿道在會中公布2026年將投入30億韓元（KRW 3 billion）扶植轄內量子企業，同時披露當地量子感測器晶圓開發商 EPI Solution 已完成25億韓元（KRW 2.5 billion）募資。\\n\\n「為什麼重要」\\n將量子感測器與低溫控制晶片等量子硬體，與成熟的矽晶圓製造製程加以整合，已成為半導體強權競爭的新前線。京畿道透過串聯既有晶片製造聚落與早期量子零組件供應商，企圖加速量子元件邁向晶圓級商業化量產。\\n\\n「來源異同」\\n量子科技媒體 The Quantum Insider 以「Gyeonggi Province Holds Forum on Quantum and Semiconductor Industry Cooperation」報導論壇對半導體夥伴關係、人才培育與京畿道30億韓元扶植預算的規劃；QubitWire 則以「Gyeonggi reports ₩2.5 billion raised by EPI Solution - QubitWire」為題，補充揭露量子感測晶圓廠 EPI Solution 募得25億韓元的具體金額，兩者皆引述京畿道官方新聞稿。\\n\\n「仍不確定」\\nEPI Solution 量子感測晶圓的具體商業客戶訂單、晶圓產能規模，以及正式導入主流半導體晶圓代工產線的時間表，目前均尚未對外揭露。\\n\\nTrust label: Single source — 兩家專業科技媒體均引述南韓京畿道水原量子創新論壇的同一份官方新聞稿數據。\"},\"glossary\":[{\"term\":{\"en\":\"Quantum Sensor Wafer\",\"zh-TW\":\"量子感測器晶圓\"},\"blurb\":{\"en\":\"Semiconductor wafers fabricated with engineered quantum defects or superconducting structures capable of measuring magnetic fields, temperature, or gravity at atomic precision.\",\"zh-TW\":\"利用人工調控量子缺陷或超導結構製成的半導體晶圓，能以原子級精度量測磁場、溫度或重力微幅變化。\"}},{\"term\":{\"en\":\"Gyeonggi Semiconductor Cluster\",\"zh-TW\":\"京畿道半導體聚落\"},\"blurb\":{\"en\":\"South Korea's primary semiconductor manufacturing belt surrounding Seoul—including Suwon, Hwaseong, and Pyeongtaek—housing major memory and foundry facilities.\",\"zh-TW\":\"環繞首爾的南韓核心半導體製造帶，涵蓋水原、華城與平澤等地，聚集全球主要記憶體與晶圓代工基地。\"}},{\"term\":{\"en\":\"Wafer-Scale Integration\",\"zh-TW\":\"晶圓級整合\"},\"blurb\":{\"en\":\"Manufacturing and packaging quantum or photonic components directly on standard silicon wafers to leverage existing chipmaking equipment and lower unit costs.\",\"zh-TW\":\"直接在標準矽晶圓上製造與封裝量子或光子元件，藉此沿用既有半導體製程設備並大幅降低單位生產成本。\"}}],\"sources\":[{\"name\":\"The Quantum Insider\",\"url\":\"https://thequantuminsider.com/2026/11/27/gyeonggi-province-quantum-industry-development-forum/\"},{\"name\":\"QubitWire\",\"url\":\"https://qubitwire.com/articles/gyeonggi-epi-solution-quantum-sensor-wafer-funding\"}],\"imageUrl\":\"/covers/live/live-semiconductor-304-gyeonggi-quantum-semiconductor-forum.png\",\"imageAlt\":{\"en\":\"South Korea's Gyeonggi Province Hosts Quantum and Semiconductor Cooperation Forum\",\"zh-TW\":\"南韓京畿道舉辦量子與半導體產業合作論壇並投入30億韓元扶植新創\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":73,\"trustBreakdown\":{\"crossCorroboration\":15,\"outletReputation\":22,\"recencyClarity\":23,\"sourceDiversity\":13},\"publishedAt\":\"2026-11-28T01:47:08.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":21,\"D2\":19,\"D3\":19,\"D4\":21,\"D5\":19,\"total\":20},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-semiconductor-304-gyeonggi-quantum-semiconductor-forum/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Mul
