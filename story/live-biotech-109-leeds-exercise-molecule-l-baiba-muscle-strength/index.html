on with Harvard Medical School, the University of São Paulo, Wageningen University, and Newcastle University, announced findings on November 26, 2026, revealing a new physiological role for the exercise-released metabokine beta-aminoisobutyric acid (L-BAIBA). Previously studied for its role in fat metabolism, L-BAIBA was found to act through a PGC1α-BAIBA-PPARδ signaling axis to make skeletal muscles stronger, improve energy efficiency, and resist fatigue and metabolic damage.\n\nType 2 diabetes accelerates muscle mass loss and weakness, which in turn impairs patients' ability to exercise and regulate blood glucose—a pressing concern as diagnoses among adults under 40 rise rapidly. Because L-BAIBA is already available as an over-the-counter dietary supplement, identifying its muscle-protective mechanism provides researchers with a concrete molecular target for preserving muscle function in chronic metabolic disease.\n\nReporting by ScienceDaily and TimesJet aligns on the University of Leeds-led collaboration, the PGC1α-BAIBA-PPARδ pathway, and the dual fat-burning and muscle-strengthening effects of L-BAIBA. Both summaries emphasize that while the compound is sold commercially as a supplement, clinical trials are still required to verify therapeutic efficacy in diabetes patients.\n\nOptimal clinical dosing, long-term safety profiles, and human randomized controlled trial outcomes for treating diabetic muscle deterioration remain unestablished.\n\nTrust label: Official statement — Findings are derived from University of Leeds research disclosures summarized by ScienceDaily and corroborated by secondary science reporting."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-biotech-109-leeds-exercise-molecule-l-baiba-muscle-strength\",\"category\":\"biotech\",\"title\":{\"en\":\"University of Leeds Study Finds Exercise Molecule L-BAIBA Strengthens Muscles\",\"zh-TW\":\"英國里茲大學研究發現運動釋放分子 L-BAIBA 可強化肌肉並對抗糖尿病肌損\"},\"summary\":{\"en\":\"Researchers led by the University of Leeds reported on November 26, 2026, that the naturally occurring exercise-induced molecule beta-aminoisobutyric acid (L-BAIBA) directly enhances skeletal muscle strength and fatigue resistance. Already recognized for promoting fat burning, the metabokine operates through a PGC1α-BAIBA-PPARδ signaling pathway to protect muscle tissue from high-blood-sugar damage. The finding points toward potential therapies for muscle deterioration in people with type 2 diabetes.\",\"zh-TW\":\"由英國里茲大學（University of Leeds）領導的跨國研究團隊於 2026 年 11 月 26 日發表研究，發現人體運動時自然分泌的代謝分子「β-氨基異丁酸」（L-BAIBA）不僅能促進脂肪燃燒，更能直接增強骨骼肌力量與抗疲勞能力，並抵禦高血糖引發的肌肉損傷，為第二型糖尿病患者的肌肉退化提供潛在治療新方向。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」由英國里茲大學（University of Leeds）領銜，結合哈佛醫學院、聖保羅大學、瓦赫寧恩大學及紐卡索大學的跨國團隊於 2026 年 11 月 26 日公布研究成果，揭示運動時釋放的天然代謝因子「β-氨基異丁酸」（L-BAIBA）具備強化骨骼肌的新機制。研究顯示，L-BAIBA 透過 PGC1α-BAIBA-PPARδ 訊號傳導軸線運作，可提升肌肉收縮力量、增強能量代謝效率並減緩疲勞與細胞損傷。\\n\\n「為什麼重要」第二型糖尿病常導致患者肌肉量流失與肌力衰退，進而削弱運動能力並惡化血糖控制，在 40 歲以下年輕型糖尿病確診率攀升的趨勢下更顯嚴峻。過去 L-BAIBA 主要被視為促進脂肪燃燒的分子，新發現證實其保護肌肉免受高血糖損害的潛力，為開發慢性代謝疾病伴隨肌少症的藥物開啟新途徑。\\n\\n「來源異同」科學新聞平台 ScienceDaily 與健康媒體 TimesJet 對里茲大學主導之研究團隊、分子作用路徑及 L-BAIBA 兼顧燃脂與強肌的雙重功能描述一致；兩者亦共同提醒，儘管該成分目前已作為膳食補充劑在市面販售，仍須進一步臨床試驗才能確認其對糖尿病患的醫療療效。\\n\\n「仍不確定」將 L-BAIBA 應用於第二型糖尿病肌肉退化治療的人體臨床有效劑量、長期安全性及大規模隨機對照試驗結果，目前仍待後續醫學研究驗證。\"},\"glossary\":[{\"term\":{\"en\":\"L-BAIBA (Beta-Aminoisobutyric Acid)\",\"zh-TW\":\"β-氨基異丁酸\"},\"blurb\":{\"en\":\"A naturally occurring amino acid metabolite released by skeletal muscles during exercise that regulates fat metabolism and muscle endurance.\",\"zh-TW\":\"骨骼肌在運動過程中自然分泌的一種氨基酸代謝物，參與調節脂肪燃燒代謝與肌肉耐力適應。\"}},{\"term\":{\"en\":\"Metabokine\",\"zh-TW\":\"代謝因子\"},\"blurb\":{\"en\":\"A small-molecule metabolite secreted by cells that acts as a signaling messenger to regulate physiological functions in surrounding or distant tissues.\",\"zh-TW\":\"由細胞分泌並具備訊號傳遞功能的小分子代謝產物，可調控鄰近或遠端組織器官的生理代謝反應。\"}},{\"term\":{\"en\":\"Skeletal Muscle Adaptation\",\"zh-TW\":\"骨骼肌適應性重塑\"},\"blurb\":{\"en\":\"Structural and metabolic changes in voluntary muscles—such as increased mitochondrial efficiency and strength—triggered by repeated physical exercise.\",\"zh-TW\":\"隨意肌在反覆運動刺激下產生的結構與代謝調整，包括粒線體能量效率提升、肌力增強與抗疲勞能力改善。\"}}],\"sources\":[{\"name\":\"ScienceDaily (University of Leeds)\",\"url\":\"https://www.sciencedaily.com/releases/2026/11/261126063315.htm\"},{\"name\":\"TimesJet Health\",\"url\":\"https://timesjet.com/news/natural-fat-burner-l-baiba-found-to-build-muscle-strength\"}],\"imageUrl\":\"/covers/live/live-biotech-109-leeds-exercise-molecule-l-baiba-muscle-strength.webp\",\"imageAlt\":{\"en\":\"Biomedical researcher examining skeletal muscle tissue samples in a laboratory\",\"zh-TW\":\"生醫研究人員在實驗室分析骨骼肌細胞與運動代謝機制\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":81,\"trustBreakdown\":{\"crossCorroboration\":19,\"outletReputation\":21,\"recencyClarity\":21,\"sourceDiversity\":20},\"publishedAt\":\"2026-11-27T15:56:21.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":4,\"D2\":4,\"D3\":4,\"D4\":4,\"D5\":3,\"total\":19},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-biotech-109-leeds-exercise-molecule-l-baiba-muscle-strength/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust sco
