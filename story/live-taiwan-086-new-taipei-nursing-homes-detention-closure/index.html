ng raids on two psychiatric nursing facilities in New Taipei City. Prosecutors alleged that operators unlawfully confined more than 100 residents under substandard care conditions while fraudulently claiming government placement subsidies and falsifying business records.\n\nThe case exposes severe oversight vulnerabilities in specialized long-term and psychiatric care facilities, prompting prosecutors to urge municipal health and social welfare authorities nationwide to conduct immediate unannounced inspections. Health officials had previously flagged one facility as high-risk before gathering evidence during an unannounced audit earlier this year.\n\nFocus Taiwan (CNA) and Yam News both reported the detention of six suspects, the alleged mistreatment of over 100 residents, and the suspected offenses including aggravated unlawful confinement resulting in death and multi-perpetrator fraud.\n\nFormal indictments have not yet been filed, and authorities have not finalized full public disclosure of the total amount of government subsidies allegedly defrauded or the exact number of resident deaths linked to the confinement.\n\nTrust label: Multi-source agreement — Court detention rulings, prosecutorial charges, and inspection details were corroborated across Focus Taiwan (CNA) and Yam News."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-086-new-taipei-nursing-homes-detention-closure\",\"category\":\"taiwan\",\"title\":{\"en\":\"Six Detained and Two New Taipei Nursing Homes Shut Down Over Alleged Resident Mistreatment\",\"zh-TW\":\"新北兩家精神護理之家涉非法拘禁逾百住民並詐領補助，法院裁定6人羈押禁見\"},\"summary\":{\"en\":\"The New Taipei District Court on November 26 ordered six individuals detained and held incommunicado, after prosecutors alleged — in charges not yet adjudicated — that over 100 residents were unlawfully confined and mistreated at two psychiatric nursing homes. Authorities shut down the facilities as the investigation into aggravated confinement and subsidy fraud continues.\",\"zh-TW\":\"新北地方法院於2026年11月26日晚間裁定6名涉案人員羈押禁見，檢方指控（尚未經法院認定）新北市兩家精神護理之家涉嫌非法拘禁並虐待超過100名住民，且詐領政府安置費用與偽造業務文書。主管機關已勒令涉案機構停業，凸顯高風險長照與精神照護機構稽查機制亟需強化。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」新北地方法院於2026年11月26日晚間裁定將6名涉案被告羈押禁見。檢警日前針對新北市兩家精神護理之家發動搜索，指控機構人員涉嫌非法拘禁並虐待超過100名住民，且涉嫌加重私行拘禁致死、三人以上共同詐欺取財及業務登載不實等罪嫌，主管機關已勒令相關機構停業。\\n\\n「為什麼重要」此案暴露部分精神護理與長照機構在人員配置與照護品質上的重大管理漏洞，新北檢方已嚴正呼籲各縣市衛政與社政主管機關儘速針對轄內精神護理之家及養護機構進行實地查核，防堵非法超收與不當限制人身自由。\\n\\n「來源異同」中央社英文網（Focus Taiwan）與蕃薯藤新聞（Yam News）均報導法院裁定6人羈押禁見、逾百名住民遭拘禁及詐領安置費等核心案情；中央社進一步說明衛生局先前已將涉案機構列為高風險名單並透過無預警稽查蒐證移送。\\n\\n「仍不確定」檢方目前仍在清查全案涉案金額與具體受害住民名單，全案尚未正式提起公訴，涉案機構歷年詐領政府安置補助的總金額亦待進一步核算。\"},\"glossary\":[{\"term\":{\"en\":\"Held incommunicado\",\"zh-TW\":\"羈押禁見\"},\"blurb\":{\"en\":\"A court-ordered pretrial detention restricting a suspect from receiving visitors or communicating with outsiders to prevent collusion.\",\"zh-TW\":\"法院為防止被告串供或滅證，裁定在看守所收押期間禁止接見與通信的強制處分。\"}},{\"term\":{\"en\":\"Aggravated unlawful confinement\",\"zh-TW\":\"加重私行拘禁罪\"},\"blurb\":{\"en\":\"A criminal offense involving the illegal deprivation of a person's physical liberty accompanied by severe harm or death.\",\"zh-TW\":\"非法剝奪他人行動自由且情節重大或因而致人於死、重傷的刑事罪名。\"}},{\"term\":{\"en\":\"Unannounced inspection\",\"zh-TW\":\"無預警稽查\"},\"blurb\":{\"en\":\"A regulatory audit conducted without prior notice to verify actual operating and care conditions at a facility.\",\"zh-TW\":\"主管機關不事先通知受檢單位而直接派員到場查核實際營運與照護狀況的監督機制。\"}}],\"sources\":[{\"name\":\"Focus Taiwan (CNA)\",\"url\":\"https://focustaiwan.tw/society/202611270013\"},{\"name\":\"Yam News\",\"url\":\"https://n.yam.com/Article/20261127229330\"}],\"imageUrl\":\"/covers/live/live-taiwan-086-new-taipei-nursing-homes-detention-closure.jpg\",\"imageAlt\":{\"en\":\"Exterior of the New Taipei District Court building following detention hearings\",\"zh-TW\":\"裁定涉案人員羈押禁見的新北地方法院外觀\"},\"isHeadline\":true,\"isPopular\":true,\"trustScore\":87,\"trustBreakdown\":{\"crossCorroboration\":23,\"outletRep
