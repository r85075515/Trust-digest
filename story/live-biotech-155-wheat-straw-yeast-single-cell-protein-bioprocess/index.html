ogy for Biofuels and Bioproducts demonstrating an integrated biorefining and fermentation system that turns non-food wheat straw into protein-rich yeast biomass. Using the strain Saccharomyces cerevisiae Z100, the process achieved a crude protein content of 46.9 percent from sugars extracted from agricultural straw residue.\n\nTo overcome fermentation inhibitors commonly generated during lignocellulose breakdown, the team paired biological detoxification using Paecilomyces variotii FN89 to remove furfural with fed-batch respiratory fermentation strategies that suppress the Crabtree effect. Downstream enzymatic lysis and spray drying further stabilized the single-cell protein output.\n\nThe findings offer a circular bioeconomy pathway to upcycle abundant crop waste into sustainable microbial protein for food or feed applications without competing for arable land. Commercial cost competitiveness at industrial bioreactor scale remains to be validated.\n\nTrust label: Multi-source agreement — Bioengineer.org and Protein Production Technology both accurately report the November 26 journal publication, Saccharomyces cerevisiae Z100 strain, and 46.9% crude protein yield."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-biotech-155-wheat-straw-yeast-single-cell-protein-bioprocess\",\"category\":\"biotech\",\"title\":{\"en\":\"Bioprocess Converts Wheat Straw Into Yeast Biomass With 46.9% Crude Protein\",\"zh-TW\":\"新生物精煉製程將小麥秸稈轉化為高蛋白酵母 粗蛋白含量達46.9%\"},\"summary\":{\"en\":\"Researchers published a bioprocess on November 26 that converts non-food wheat straw into Saccharomyces cerevisiae Z100 yeast biomass containing 46.9% crude protein.\",\"zh-TW\":\"生技研究團隊於11月26日發表整合生物精煉與發酵新製程，成功將非糧食農業廢棄物小麥秸稈轉化為高細胞密度酵母生物質，其粗蛋白含量高達46.9%。該技術透過生物解毒去除抑制物並抑制螃蟹樹效應（Crabtree effect），為農業副產物升級為替代性單細胞蛋白提供具規模化潛力的減碳路徑。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n研究團隊於11月26日在《生質燃料與生質產品生物技術》（Biotechnologyfor Biofuels and Bioproducts）期刊發表研究，展示一套整合生物精煉與發酵系統，利用釀酒酵母菌株 Saccharomyces cerevisiae Z100，將小麥秸稈萃取出的糖分轉化為粗蛋白含量達46.9%的單細胞蛋白生物質。\\n\\n「為什麼重要」\\n木質纖維素農業廢棄物在水解過程中常產生抑制發酵的副產物，該研究結合擬青黴菌 Paecilomyces variotii FN89 進行生物解毒以去除糠醛，並透過補料分批呼吸代謝發酵抑制「螃蟹樹效應（Crabtree effect）」，大幅提升菌體密度與蛋白質產率。此技術能將大宗農作物秸稈升級為永續替代蛋白，無須額外占用耕地即可緩解糧食與飼料蛋白供應壓力。\\n\\n「來源異同」\\nBioengineer.org 與 Protein Production Technology 均引述11月26日發表的同儕審查論文，對小麥秸稈原料、Saccharomyces cerevisiae Z100 菌株及最終製程步驟報導一致；Protein Production Technology 明確列出46.9%粗蛋白含量數據，Bioengineer.org 則補充生物解毒菌株、酵素裂解與噴霧乾燥等下游工藝細節。\\n\\n「仍不確定」\\n該研究目前屬實驗室整合製程驗證階段，放大至工業級發酵槽的單位生產成本、最終蛋白產品的食品安全法規認證及商業化時程仍待後續評估。\\n\\nTrust label: Multi-source agreement — Bioengineer.org 與 Protein Production Technology 均一致引述11月26日期刊論文數據與核心生物精煉機制。\"},\"glossary\":[{\"term\":{\"en\":\"Single-cell protein (SCP)\",\"zh-TW\":\"單細胞蛋白（SCP）\"},\"blurb\":{\"en\":\"Edible protein extracted from pure or mixed cultures of microorganisms such as yeast, algae, or bacteria grown on agricultural or industrial substrates.\",\"zh-TW\":\"利用酵母菌、藻類或細菌等微生物在農業或工業基質上培養並萃取出的高蛋白生物質，可用作食品或飼料原料。\"}},{\"term\":{\"en\":\"Crabtree effect\",\"zh-TW\":\"螃蟹樹效應\"},\"blurb\":{\"en\":\"A metabolic phenomenon in which yeast produces ethanol instead of growing biomass when glucose concentrations are high, even in the presence of oxygen.\",\"zh-TW\":\"酵母菌在高濃度葡萄糖環境下，即使氧氣充足仍優先進行酒精發酵而非細胞增殖的代謝現象。\"}},{\"term\":{\"en\":\"Lignocellulosic biomass\",\"zh-TW\":\"木質纖維素生物質\"},\"blurb\":{\"en\":\"Non-edible plant dry matter composed of cellulose, hemicellulose, and lignin, such as wheat straw and corn stover.\",\"zh-TW\":\"由纖維素、半纖維素與木質素構成的非食用植物乾物質，例如小麥秸稈與玉米稈。\"}}],\"sources\":[{\"name\":\"Protein Production Technology\",\"url\":\"https://www.proteinproductiontechnology.com/post/wheat-straw-yeast-biomass-protein-fermentation\"},{\"name\":\"Bioengineer.org\",\"url\":\"https://bioengineer.org/optimized-bioprocess-converts-wheat-straw-into-protein-rich-yeast-biomass-and-products/\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"\",\"zh-TW\":\"\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":87,\"trustBreakdown\":{\"crossCorroboration\":22,\"outletReputation\":21,\"recencyClarity\":23,\"sourceDiversity\":21},\"publishedAt\":\"2026-11-27T17:45:24.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":22,\"D2\":22,\"D3\":22,\"D4\":21,\"D5\":22,\"total\":22},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-biotech-155-wheat-straw-yeast-single-cell-protein-bioprocess/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-biotech-155-wheat-straw-yeast-single-cell-protein-bioprocess/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"d:\"$8:metadata\"\n"])</script></body></html>
