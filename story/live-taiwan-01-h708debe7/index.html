瑞隆的派系，不過賴瑞隆也好幾次強調，不會被派系框架，反而質疑柯志恩，心裡只有黨意沒有民意。另外針對光電業者的政治獻金，以及對於高雄市政不熟等議題，雙方都展開激烈攻防。 高雄市長藍綠陣營候選人柯志恩、賴瑞隆，今（30）日進行六都首場市長辯論會。賴瑞隆主打延續民進黨前3任市長施政，同時猛攻柯志恩支持藍營不利高雄的《財劃法》修法；柯志恩則主張政黨輪替才能揭露市政弊端，並批評賴若當選，將被新潮流派系入主高雄。 Why it matters\nThis cluster was assembled from 2 feed item(s) across 1 outlet(s) (公視新聞網) in the taiwan category. Axiom links out to each publisher; this digest only restates titles and short feed descriptions — not full articles. Sources agree / disagree\nMultiple outlets are covering closely related headlines: \"賴瑞隆、柯志恩高雄市長辯論會 交鋒財劃法、市政熟稔度\" (公視新聞網); \"高雄市長辯論會／賴瑞隆喊「接下第四棒」 柯志恩稱輪替才能揭弊\" (公視新聞網).\nNo clear numeric/name conflicts detected in the short feed snippets; always verify details on the publisher pages. Still uncertain\nFeed descriptions can omit context, updates, or corrections. Click through to the linked outlets for the latest full reporting. Trust scores are heuristics, not fact-check guarantees. Linked sources (outlet names only): 公視新聞網 Additional feed context\n(1) 高雄市長選舉辯論會，昨（30）日晚間登場，民進黨候選人賴瑞隆與國民黨候選人柯志恩，針對《財劃法》議題，從申論激戰到交叉詰問；柯志恩更猛攻賴瑞隆的派系，不過賴瑞隆也好幾次強調，不會被派系框架，反而質疑柯志恩，心裡只有黨意沒有民意。另外針對光電業者的政治獻金，以及對於高雄市政不熟等議題，雙方都展開激烈攻防。\n(2) 高雄市長藍綠陣營候選人柯志恩、賴瑞隆，今（30）日進行六都首場市長辯論會。賴瑞隆主打延續民進黨前3任市長施政，同時猛攻柯志恩支持藍營不利高雄的《財劃法》修法；柯志恩則主張政黨輪替才能揭露市政弊端，並批評賴若當選，將被新潮流派系入主高雄。"])</script><script>self.__next_f.push([1,"11:Tc07,"])</script><script>self.__next_f.push([1,"高雄市長選舉辯論會，昨（30）日晚間登場，民進黨候選人賴瑞隆與國民黨候選人柯志恩，針對《財劃法》議題，從申論激戰到交叉詰問；柯志恩更猛攻賴瑞隆的派系，不過賴瑞隆也好幾次強調，不會被派系框架，反而質疑柯志恩，心裡只有黨意沒有民意。另外針對光電業者的政治獻金，以及對於高雄市政不熟等議題，雙方都展開激烈攻防。 What happened\n賴瑞隆、柯志恩高雄市長辯論會 交鋒財劃法、市政熟稔度. 高雄市長選舉辯論會，昨（30）日晚間登場，民進黨候選人賴瑞隆與國民黨候選人柯志恩，針對《財劃法》議題，從申論激戰到交叉詰問；柯志恩更猛攻賴瑞隆的派系，不過賴瑞隆也好幾次強調，不會被派系框架，反而質疑柯志恩，心裡只有黨意沒有民意。另外針對光電業者的政治獻金，以及對於高雄市政不熟等議題，雙方都展開激烈攻防。 高雄市長藍綠陣營候選人柯志恩、賴瑞隆，今（30）日進行六都首場市長辯論會。賴瑞隆主打延續民進黨前3任市長施政，同時猛攻柯志恩支持藍營不利高雄的《財劃法》修法；柯志恩則主張政黨輪替才能揭露市政弊端，並批評賴若當選，將被新潮流派系入主高雄。 Why it matters\nThis cluster was assembled from 2 feed item(s) across 1 outlet(s) (公視新聞網) in the taiwan category. Axiom links out to each publisher; this digest only restate
