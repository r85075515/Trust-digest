iron phosphate (LFP) battery energy storage system (BESS) to the power grid in Xilin Gol League, Inner Mongolia. Working alongside central state-owned enterprise (SOE) partners, StarCharge completed civil works on schedule and commissioned the step-up substation and storage equipment despite harsh regional climate conditions. The company described the installation as the world's largest single-site BESS.\n\n為什麼重要\nGrid-scale four-hour LFP storage systems play a critical role in absorbing intermittent wind and solar generation in northern China's renewable energy bases and maintaining grid frequency stability during peak demand.\n\n來源異同\nCorporate disclosures distributed via PR Newswire and carried by Morningstar and WebDisclosure consistently report the 1 GW/4 GWh capacity, LFP chemistry, Xilin Gol League location, and completion of step-up substation commissioning. Independent third-party verification of the \"world's largest single-site\" claim was not included in the wire releases.\n\n仍不確定\nTotal capital expenditure for the project, the specific central state-owned enterprise partners involved, and long-term grid dispatch tariff terms have not been publicly disclosed.\n\nTrust label: Single source — Information is based on StarCharge's official corporate announcement distributed across financial wire services."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-energy-134-starcharge-inner-mongolia-bess\",\"category\":\"energy\",\"title\":{\"en\":\"StarCharge Connects 1 GW/4 GWh LFP Battery Energy Storage System to Grid in Inner Mongolia\",\"zh-TW\":\"星星充電內蒙古 1 GW / 4 GWh 磷酸鐵鋰儲能電站正式併網 號稱全球最大單體站點\"},\"summary\":{\"en\":\"Digital energy firm StarCharge announced the grid connection of its 1 GW/4 GWh lithium iron phosphate battery energy storage system in Xilin Gol League, Inner Mongolia. Completed alongside central state-owned enterprise partners, the project is billed by the company as the world's largest single-site BESS. 一句重點結論：星星充電宣布內蒙古錫林郭勒盟 1 GW / 4 GWh 磷酸鐵鋰儲能系統併網，強化高比例綠電調峰能力。\",\"zh-TW\":\"數位能源企業星星充電宣布，位於內蒙古錫林郭勒盟的 1 GW / 4 GWh 磷酸鐵鋰電池儲能系統（BESS）已正式併網運行。該專案由星星充電與央企合作夥伴推進，完成土建工程與升壓站調試，公司稱其為全球最大單體儲能站點。一句重點結論：星星充電宣布內蒙古錫林郭勒盟 1 GW / 4 GWh 磷酸鐵鋰儲能系統併網，強化高比例綠電調峰能力。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n總部位於中國常州的數位能源企業星星充電（StarCharge）於 11 月 27 日發布公告，宣布旗下位於內蒙古錫林郭勒盟的 1 GW / 4 GWh 磷酸鐵鋰（LFP）電池儲能系統（BESS）已順利完成併網。該專案由星星充電與中央國有企業合作夥伴協同推進，克服當地嚴苛氣候與施工挑戰，按期完成土建工程並完成升壓站與儲能設備調試，公司宣稱該專案為全球規模最大的單體電池儲能站點。\\n\\n「為什麼重要」\\n具備 4 小時長時放電能力的吉瓦級磷酸鐵鋰儲能電站，有助於吸納內蒙古風電與太陽能等間歇性再生能源發電量，並在用電尖峰時段提供電網調頻與削峰填谷支撐。\\n\\n「來源異同」\\nPR Newswire、晨星（Morningstar）與 WebDisclosure 刊載的企業公告內容完全一致，均載明 1 GW / 4 GWh 規模、磷酸鐵鋰技術路線與錫林郭勒盟廠址；惟「全球最大單體站點」屬企業單方宣稱，尚無獨立第三方機構認證。\\n\\n「仍不確定」\\n該儲能電站的具體投資總額、參與合作的央企名稱，以及後續併網調度的電價與容量補償機制細節，公告中均未揭露。\"},\"glossary\":[{\"term\":{\"en\":\"Battery Energy Storage System (BESS)\",\"zh-TW\":\"電池儲能系統（BESS）\"},\"blurb\":{\"en\":\"A grid-connected facility using rechargeable battery banks and power conversion equipment to store electricity and dispatch it when demand rises.\",\"zh-TW\":\"透過大規模充電電池組與變流設備連接電網的設施，可儲存離峰或再生能源電力並在尖峰時段釋放。\"}},{\"term\":{\"en\":\"Lithium Iron Phosphate (LFP)\",\"zh-TW\":\"磷酸鐵鋰電池（LFP）\"},\"blurb\":{\"en\":\"A lithium-ion battery chemistry prized for thermal stability, long cycle life, and lower cost, widely used in utility-scale stationary storage.\",\"zh-TW\":\"具備高熱穩定性、長循環壽命與較低成本優勢的鋰離子電池路線，目前廣泛應用於電網級大型儲能電站。\"}},{\"term\":{\"en\":\"Step-up substation\",\"zh-TW\":\"升壓站\"},\"blurb\":{\"en\":\"An electrical facility that raises low-voltage output from power generators or storage units to high transmission voltages for grid integration.\",\"zh-TW\":\"將發電或儲能設備輸出的較低電壓提升至高壓輸電等級，以便順利併入主幹電網的電力設施。\"}}],\"sources\":[{\"name\":\"PR Newswire\",\"url\":\"https://www.prnewswire.com/news-releases/starcharge-connects-1-gw4-gwh-lfp-battery-energy-storage-system-bess-to-grid-in-inner-mongolia-302951746.html\"},{\"name\":\"Morningstar\",\"url\":\"https://www.morningstar.com/news/pr-newswire/20261127cn07364/starcharge-connects-1-gw4-gwh-lfp-battery-energy-storage-system-bess-to-grid-in-inner-mongolia\"},{\"name\":\"WebDisclosure\",\"url\":\"https://www.webdisclosure.com/article/starcharge-etr-starcharge-unveils-worlds-largest-single-site-bess-in-inner-mongolia-8OFli5FgC6h\"}],\"imageUrl\":\"/covers/live/live-energy-134-starcharge-inner-mongolia-bess.jpg\",\"imageAlt\":{\"en\":\"Utility-scale battery energy storage containers in Inner Mongolia\",\"zh-TW\":\"內蒙古大型電池儲能系統設施\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":80,\"trustBreakdown\":{\"crossCorroboration\":18,\"outletReputation\":21,\"recencyClarity\":23,\"sourceDiversity\":18},\"publishedAt\":\"2026-11-27T16:45:11.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":5,\"D2\":4,\"D3\":4,\"D4\":4,\"D5\":4,\"total\":21},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-energy-134-starcharge-inner-mongolia-bess/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-energy-134-starcharge-inner-mongolia-bess/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:
