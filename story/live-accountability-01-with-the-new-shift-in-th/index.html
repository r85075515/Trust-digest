tents to delay cheaper competition. With the new shift in Congress, lawmakers must pass them by the end of the year; if they fail, many of the bills would have to be started from scratch when the new Congress takes over in January, losing the ground gained so far.\n\nWhy it matters\nThe deadline matters because patent rules decide when cheaper rivals can reach patients. If the bills die with the outgoing Congress, drugmakers keep the patent tools the bills were meant to curb, and supporters must rebuild the coalition and reintroduce the measures in a new session — a slow process that could leave the drug-pricing fight stalled for months.\n\nSources agree and disagree\nThis card rests on a single ICIJ investigation, so there is no second outlet to compare it with. No conflicts appear within that report, but its claims are uncorroborated until other outlets cover the bills.\n\nStill uncertain\nThe feed summary does not name the bills or their sponsors, say how many bills are involved, or give their current legislative status — whether they have passed committee or await a floor vote. It also does not say which drugmakers or patents are at issue, or what 'critical ground' would be lost in practice. Those are the key facts a reader would need to judge how close the bills are to passing.\n\nTrust label: Single source — the card rests on one ICIJ investigation, with no second outlet to corroborate it."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-accountability-01-with-the-new-shift-in-th\",\"category\":\"accountability\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-accountability-01-with-the-new-shift-in-th.webp\",\"imageAlt\":{\"en\":\"Cover related to: With the new shift in the U.S. Congress, time is running out on bills targeting drug patents\",\"zh-TW\":\"相關封面圖：（譯文待補）With the new shift in the U.S. Congress, time is running out on bills targeting drug patents\"},\"publishedAt\":\"2026-11-13T17:48:40.000Z\",\"title\":{\"en\":\"U.S. Congress Drug-Patent Bills Face Year-End Deadline as New Congress Looms\",\"zh-TW\":\"美國國會藥品專利法案面臨年底大限：新國會上任前未通過須重頭來過\"},\"summary\":{\"en\":\"U.S. lawmakers are racing to pass bipartisan bills targeting drug patents before the end of the year, warning the measures could lose critical ground if they fail. The bills aim to stop drugmakers from using patents to delay cheaper competition. If they stall, legislators would have to restart many of them when the new Congress takes over in January.\",\"zh-TW\":\"美國國會議員正趕在年底前通過一批針對藥品專利的跨黨派法案，警告若未通過，已取得的關鍵進展可能付諸流水。法案旨在阻止藥廠利用專利拖延較便宜的競爭產品上市；若卡關，新國會明年1月上任後，議員須把其中許多法案從頭來過。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"美國國會議員正面臨時間壓力，須在年底前通過一批針對藥品專利的跨黨派法案，否則這些法案可能喪失已取得的關鍵進展。法案旨在阻止藥廠利用專利拖延較便宜的競爭產品上市；若未能在明年1月新國會上任前立法，議員將被迫把其中許多法案從頭來過，據國際調查記者同盟（ICIJ）報導。\\n\\n發生了什麼事\\n一批針對藥品專利的跨黨派法案在美國國會面臨時間壓力。這些法案旨在阻止藥廠利用專利拖延較便宜的競爭產品上市。隨著國會改組，議員必須在年底前通過法案；若失敗，新國會明年1月上任後，許多法案須從頭開始，已取得的進展也將付諸流水。\\n\\n為什麼重要\\n期限之所以重要，是因為專利規則決定了較便宜的競爭藥品何時能送到病患手中。若法案隨本屆國會任期結束而失效，藥廠將繼續保有法案原本要限制的專利工具，支持者也須在新會期重建聯盟、重新提案——過程緩慢，可能讓藥價改革停滯數月。\\n\\n來源異同\\n本卡僅依據國際調查記者同盟一篇調查報導，沒有第二家媒體可供對照。該報導內部沒有出現衝突，但在其他媒體跟進之前，其說法未經佐證。\\n\\n仍不確定\\n摘要未列出法案名稱或提案人，未說明涉及幾項法案，也未交代目前立法進度——是否已通過委員會、是否等待院會表決。同時也未說明涉及哪些藥廠或專利，或「關鍵進展」實際上指什麼。這些正是判斷法案距離通過還有多遠所需的關鍵資訊。\\n\\n信任標籤：單一來源——本卡僅依據國際調查記者同盟一篇調查報導，未有第二家媒體佐證。\"},\"sources\":[{\"name\":\"ICIJ\",\"url\":\"https://www.icij.org/investigations/cancer-calculus/with-the-new-shift-in-the-u-s-congress-time-is-running-out-on-bills-targeting-drug-patents/\"}],\"disagreements\":null,\"trustScore\":47,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":10,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"accountability\",\"live-ingest\",\"icij\"],\"glossary\":[{\"blurb\":{\"en\":\"International Consortium of Investigative Journalists, the outlet behind this report.\",\"zh-TW\":\"本篇報導的出處，國際調查記者組織。\"},\"term\":{\"en\":\"ICIJ\",\"zh-TW\":\"國際調查記者同盟\"}},{\"blurb\":{\"en\":\"The U.S. federal legislature consi
