rnings call, CEO Wang Xing (Wang Xing) stated that Meituan's AI-related capital expenditure in 2027 will be lower than in 2026 and become more ROI-oriented, while noting that food delivery competition has reached an inflection point with fourth-quarter unit economics expected to improve meaningfully.\n\nWhy it matters\nAs major Chinese internet platforms face pressure to balance heavy AI infrastructure spending with core cash flow and profitability, Meituan's signal of scaling back AI capex in 2027 highlights a shift toward stricter capital discipline in China's tech sector. It also shows how easing subsidy wars in local commerce and food delivery can restore quarterly profitability.\n\nSource differences\nStartup Fortune published \"Meituan expects lower AI capex in 2027 after a RMB2 billion quarterly profit\", focusing on the RMB 115.6 billion revenue, RMB 2.07 billion profit, 2027 AI capex reduction, and expected fourth-quarter delivery improvements. Futu News covered the same November 27 earnings release and call under \"Meituan Conference Call: Wang Xing Reviews \\\"Major Mistakes\\\" in Meituan Select; Food Delivery Competition Reaches Inflection Point, Q4 Unit Economics to Improve Significantly; AI Capital Expenditure to Decline Next Year\", adding Wang Xing's remarks on Meituan Select missteps.\n\nStill uncertain\nManagement has not disclosed a specific RMB target or percentage reduction for 2027 AI capital expenditure, and whether fourth-quarter delivery unit economics will improve despite winter seasonal cost pressures remains to be seen.\n\nTrust label: Multi-source agreement — Both Startup Fortune and Futu News report the same November 27 Q3 2026 financial results and CEO Wang Xing's 2027 AI capital expenditure guidance."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-ai-305-meituan-2027-ai-capex-cut-q3-profit\",\"category\":\"ai\",\"title\":{\"en\":\"Meituan Expects Lower AI Capex in 2027 After Swinging to RMB 2.07 Billion Q3 Profit\",\"zh-TW\":\"美團第三季轉盈20.7億元人民幣，管理層預告2027年 AI 資本支出將下調\"},\"summary\":{\"en\":\"Meituan reported Q3 2026 revenue of RMB 115.6 billion and a RMB 2.07 billion profit on November 27, while CEO Wang Xing indicated AI capital expenditure will decline in 2027 with a stronger focus on return on investment as delivery competition eases.\",\"zh-TW\":\"美團於11月27日公布2026年第三季營收達1,156億元人民幣並轉盈20.7億元人民幣；執行長王興在財報法說會上表示，隨著外送補貼競爭趨緩與單位經濟改善，2027年 AI 資本支出將低於今年並更重視投資報酬率。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n美團於11月27日公布2026年第三季營收達1,156億元人民幣（年增21.6%），單季轉盈20.7億元人民幣。執行長王興在財報會議上指出，美團2027年 AI 相關資本支出將低於今年並更講求投資報酬率（ROI）；同時表示外送競爭已出現拐點，第四季單位經濟效益可望顯著改善。\\n\\n「為什麼重要」\\n在大型網路平台必須兼顧龐大 AI 基礎設施投入與核心現金流獲利的背景下，美團釋出2027年縮減 AI 資本支出的訊號，凸顯中國科技業轉向更嚴格資本紀律的趨勢。同時，在地生活與外送補貼戰降溫也直接反映在單季轉盈的財務表現上。\\n\\n「來源異同」\\nStartup Fortune 以「Meituan expects lower AI capex in 2027 after a RMB2 billion quarterly profit」報導美團1,156億元人民幣營收、20.7億元人民幣獲利、2027年 AI 資本支出下調及第四季外送改善預期；富途牛牛（Futu News）則以「Meituan Conference Call: Wang Xing Reviews \\\\\\\"Major Mistakes\\\\\\\" in Meituan Select; Food Delivery Competition Reaches Inflection Point, Q4 Unit Economics to Improve Significantly; AI Capital Expenditure to Decline Next Year」報導同一場11月27日財報會議，並補充王興對美團優選（Meituan Select）重大失誤的檢討。\\n\\n「仍不確定」\\n美團管理層尚未公布2027年 AI 資本支出的具體金額或降幅比例，且冬季配送成本上升是否會影響第四季單位經濟改善幅度，仍需後續財報驗證。\\n\\nTrust label: Multi-source agreement — Startup Fortune 與富途牛牛（Futu News）均報導同一份11月27日美團2026年第三季財報與執行長王興對2027年 AI 資本支出的說明。\"},\"glossary\":[{\"term\":{\"en\":\"AI Capital Expenditure\",\"zh-TW\":\"AI 資本支出\"},\"blurb\":{\"en\":\"Funds spent by a company to acquire or build long-term artificial intelligence assets such as GPU clusters, data centers, and compute infrastructure.\",\"zh-TW\":\"企業用於購置或建置 GPU 算力叢集、資料中心與相關算力基礎設施等長期人工智慧資產的資金投入。\"}},{\"term\":{\"en\":\"Unit Economics\",\"zh-TW\":\"單位經濟效益\"},\"blurb\":{\"en\":\"The direct revenues and variable costs associated with a single business unit—such as one food delivery order—used to judge core profitability.\",\"zh-TW\":\"衡量單一業務單位（如一筆外送訂單）直接收入與變動成本的獲利模型，用以判斷核心商業模式的健康度。\"}},{\"term\":{\"en\":\"Return on Investment\",\"zh-TW\":\"投資報酬率\"},\"blurb\":{\"en\":\"A financial measure comparing net profit or value generated from an investment relative to its cost.\",\"zh-TW\":\"衡量投資所產生的淨利或效益相對於投入成本比率的財務指標。\"}}],\"sources\":[{\"name\":\"Startup Fortune\",\"url\":\"https://startupfortune.com/meituan-expects-lower-ai-capex-in-2027-after-a-rmb2-billion-quarterly-profit/\"},{\"name\":\"Futu News\",\"url\":\"https://news.futunn.com/en/post/1005858417/meituan-conference-call-wang-xing-reviews-major-mistakes-in-meituan\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"Meituan Expects Lower AI Capex in 2027 After Swinging to RMB 2.07 Billion Q3 Profit\",\"zh-TW\":\"美團第三季轉盈20.7億元人民幣，管理層預告2027年 AI 資本支出將下調\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":76,\"trustBreakdown\":{\"crossCorroboration\":20,\"outletReputation\":17,\"recencyClarity\":23,\"sourceDiversity\":16},\"publishedAt\":\"2026-11-28T01:47:08.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":21,\"D2\":20,\"D3\":19,\"D4\":21,\"D5\":20,\"total\":20},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-ai-305-meituan-2027-ai-capex-cut-q3-profit/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with s
