Congress gave final approval on November 26, 2026, in a 141–0 vote with 99 abstentions, to a revised central bank charter barring monetary financing of government spending. President Javier Milei's administration framed the legislation as ending decades of deficit monetization after annual inflation dropped from nearly 300 percent in early 2024 to 33 percent last month.\n\nThe overhaul codifies currency stability as the central bank's primary mission, aligning institutional rules with Milei's fiscal austerity program even though he fell short of his original campaign pledge to abolish the monetary authority entirely. However, lawmakers softened leadership protections, allowing a president to dismiss central bank governors with a simple Senate majority of 37 votes rather than a two-thirds supermajority.\n\nAP News and Bloomberg both confirmed the 141–0 vote tally, the ban on state financing, and the Senate's modification lowering the threshold for removing central bank officials.\n\nEconomists note that long-term credibility will depend on whether future administrations respect the charter amid recent preliminary indicators showing Argentina's economy slipping into recession.\n\nTrust label: Multi-source agreement — Congressional vote tallies, charter provisions, and Senate amendments were independently reported by AP News and Bloomberg."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-088-argentina-congress-bans-central-bank-money-printing\",\"category\":\"international\",\"title\":{\"en\":\"Argentina's Congress Bars Central Bank From Printing Money to Fund Government Spending\",\"zh-TW\":\"阿根廷國會通過央行組織法修正案，正式禁止央行印鈔融通政府赤字\"},\"summary\":{\"en\":\"Argentina's Chamber of Deputies voted 141–0 with 99 abstentions on November 26 to pass legislation prohibiting the central bank from printing money to finance government deficits. The reform establishes preserving the peso's value as the bank's primary mandate while allowing leadership removal via simple Senate majority.\",\"zh-TW\":\"阿根廷眾議院於2026年11月26日以141票贊成、0票反對、99票棄權通過央行組織法改革法案，禁止中央銀行透過印鈔或直接放款融通政府財政支出，並明定維護披索幣值為央行首要任務。此舉為總統米雷伊（Javier Milei）抑制通膨的制度化關鍵一步，但參議院對央行首長罷免門檻仍保留政治彈性。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」阿根廷國會眾議院於2026年11月26日以141票贊成、0票反對、99票棄權的表決結果，三讀通過中央銀行組織法修正案，正式禁止央行透過印製鈔票或提供貸款來支應政府財政支出。新法將維護披索幣值穩定列為央行首要且核心的法定任務，並刪除前政府時期增列的雙重政策目標。\\n\\n「為什麼重要」阿根廷年度通膨率已從2024年初的近300%降至上月的33%，此次修法將總統米雷伊（Javier Milei）的財政緊縮與停止貨幣化赤字政策制度化，向國際債權人與投資市場釋出長期貨幣紀律訊號，儘管法案未能達成米雷伊競選時完全廢除央行的最初主張。\\n\\n「來源異同」美聯社與彭博社均確認眾議院141比0的表決票數及禁止央行資助政府的條文細節，並一致指出參議院先前修改條文，使總統僅需參議院簡單多數（37票）即可撤換央行首長，低於米雷伊原本要求的三分之二絕對多數門檻。\\n\\n「仍不確定」在初步經濟數據顯示阿根廷經濟可能陷入衰退之際，新組織法能否在未來政權更迭時維持實質獨立性、以及政府何時全面解除外匯管制，仍有待後續觀察。\"},\"glossary\":[{\"term\":{\"en\":\"Deficit monetization\",\"zh-TW\":\"財政赤字貨幣化\"},\"blurb\":{\"en\":\"The practice of a central bank creating new money to directly purchase government debt or fund public spending.\",\"zh-TW\":\"中央銀行透過增發貨幣直接購買政府公債或支應財政支出的作法，易引發高通膨。\"}},{\"term\":{\"en\":\"Central bank charter\",\"zh-TW\":\"央行組織法\"},\"blurb\":{\"en\":\"The statutory mandate defining a central bank's policy objectives, governance structure, and legal powers.\",\"zh-TW\":\"規範中央銀行政策目標、治理架構、獨立性與法定職權的基礎法律。\"}},{\"term\":{\"en\":\"Simple majority\",\"zh-TW\":\"簡單多數決\"},\"blurb\":{\"en\":\"A voting threshold requiring more than half of votes cast, rather than a two-thirds supermajority.\",\"zh-TW\":\"表決時僅需超過半數（或法定過半門檻）同意即可通過，相較三分之二絕對多數門檻較低。\"}}],\"sources\":[{\"name\":\"AP News\",\"url\":\"https://apnews.com/article/javier-milei-central-bank-economy-argentina-peso-primaries-paso-e4598186ef6cbcf05ecc598788c52cec\"},{\"name\":\"Bloomberg\",\"url\":\"https://www.bloomberg.com/news/articles/2026-11-26/milei-s-overhaul-of-argentina-s-central-bank-wins-final-approval-in-congress\"}],\"imageUrl\":\"/covers/live/live-international-088-argentina-congress-bans-central-bank-money-printing.jpg\",\"imageAlt\":{\"en\":\"Argentine Chamber of Deputies session during the central bank re
