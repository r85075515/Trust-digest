eve was carried out by organized crime groups, national police spokesman Edgardo Barahona said. Three of the attacks took place in the village of Vallecillos — one at a soccer field and two at homes — with three people killed in each. A fourth attack in the village of Pacayales killed three more. Local broadcaster Televicentro reported that the Pacayales victims were preliminarily identified as a Yorito municipal councilwoman, her husband and their minor son, killed inside their home.\n\nWhat happened: The attacks struck a mountainous area of Yorito municipality, in Yoro department, in the early hours. National Police, prosecutors and forensic teams were sent to the four scenes to secure evidence and verify identities. \"The National Police's working hypothesis is that criminal organizations were responsible,\" Barahona told a local television channel. \"We have always assumed it was the work of organized crime groups.\"\n\nWhy it matters: Coordinated attacks across four scenes in one rural municipality — including a local elected official and her family — mark an escalation in Honduras' gang and organized-crime violence, which has persisted despite years of security crackdowns and a homicide rate that had fallen from its 2011 peak. An attack that reaches into a municipal council also tests the state's presence in rural areas where criminal groups contest territory.\n\nSources agree / disagree: Reuters, citing the police spokesman, and Honduran outlets including Televicentro, HCH and La Prensa agree on 12 dead across four scenes; the identification of the Pacayales victims as a councilwoman's family comes from local reporting and is described as preliminary.\n\nStill uncertain: The victims' confirmed identities; which group carried out the attacks and why these targets were chosen; whether the toll will rise; and what security response the government will mount in Yorito.\n\nTrust label: Multi-source agreement — police account via Reuters and local media; the organized-crime attribution is the police's working hypothesis, not an established finding."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"adult\":false,\"body\":{\"en\":\"$10\",\"zh-TW\":\"發生了什麼事\\n宏都拉斯國家警察發言人巴拉奧納（Edgardo Barahona）表示，週三凌晨約里托（Yorito）鄉村地區發生四起獨立攻擊，至少 12 人喪生，警方認為是組織犯罪集團所為。其中三起在巴列西約斯村（Vallecillos）——一處足球場與兩戶民宅——每處各 3 人罹難；第四起在帕卡亞萊斯村（Pacayales），再添 3 死。當地電視台 Televicentro 報導，帕卡亞萊斯的死者初步確認為約里托市議員、她的丈夫與未成年兒子，在家中遇害。\\n\\n為什麼重要\\n四個現場同步下手、連地方民選議員一家都不放過，是宏都拉斯幫派與組織犯罪暴力的一次升級。該國治安掃蕩多年、謀殺率已自 2011 年高峰回落，但這類攻擊顯示犯罪集團在鄉村地區爭奪地盤、挑戰國家存在的力道未減。攻擊地點在約羅省（Yoro）約里托市的山區；國家警察、檢方與法醫團隊已赴四處現場蒐證並核對身分。巴拉奧納對當地電視台說：「國家警察的工作假設是犯罪組織所為。我們一直認為這是組織犯罪集團幹的。」\\n\\n來源異同\\n路透引述警方發言人，與 Televicentro、HCH、La Prensa 等宏都拉斯媒體一致：12 死、四個現場。帕卡亞萊斯死者為市議員一家的身分來自當地媒體，屬初步確認。\\n\\n仍不確定\\n罹難者的最終確認身分；下手的集團與選這些目標的原因；死亡人數是否再上升；以及政府將在約里托採取什麼維安回應。\"},\"category\":\"international\",\"disagreements\":null,\"glossary\":[{\"blurb\":{\"en\":\"The rural municipality in Honduras' Yoro department where four attacks killed at least 12 people on Wednesday.\",\"zh-TW\":\"宏都拉斯約羅省的鄉村市鎮，週三四起攻擊造成至少 12 人喪生。\"},\"term\":{\"en\":\"Yorito\",\"zh-TW\":\"約里托（Yorito）\"}},{\"blurb\":{\"en\":\"Deputy commissioner and national police spokesman who confirmed the 12 deaths and the organized-crime hypothesis.\",\"zh-TW\":\"國家警察發言人、副局長，確認 12 人死亡並提出組織犯罪的工作假設。\"},\"term\":{\"en\":\"Edgardo Barahona\",\"zh-TW\":\"巴拉奧納（Edgardo Barahona）\"}},{\"blurb\":{\"en\":\"The village where the fourth attack killed three — preliminarily identified by local media as a municipal councilwoman, her husband and their son.\",\"zh-TW\":\"第四起攻擊的村莊，3 名死者經當地媒體初步確認為一名市議員與其丈夫、兒子。\"},\"term\":{\"en\":\"Pacayales\",\"zh-TW\":\"帕卡亞萊斯村（Pacayales）\"}}],\"id\":\"live-international-16-honduras-yorito-attacks-12-dead\",\"imageAlt\":{\"en\":\"\",\"zh-TW\":\"\"},\"imageUrl\":\"\",\"isHeadline\":true,\"isPopular\":true,\"publishedAt\":\"2026-11-18T17:35:06.000Z\",\"sources\":[{\"name\":\"Reuters\",\"url\":\"https://www.reuters.com/world/americas/least-12-dead-org
