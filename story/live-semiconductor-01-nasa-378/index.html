mitting astronauts to real deep-space missions measured in years.\nSources agree / disagree\nCNA and TechNews carry materially the same dispatch — same crew size, same 378 days, same location — with no conflicting facts. Trust label: Two-source agreement — two outlets agree, both drawing on the same wire report.\nStill uncertain\nCrew identities, medical results and what NASA learned from this rotation await the agency's own briefings; the wire snippet is only the exit announcement."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-01-nasa-378\",\"category\":\"semiconductor\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-semiconductor-01-nasa-378.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 助攻未來火星任務，NASA 太空人隔離 378 天後首踏出模擬艙\",\"zh-TW\":\"相關封面圖：助攻未來火星任務，NASA 太空人隔離 378 天後首踏出模擬艙\"},\"publishedAt\":\"2026-11-02T06:30:37.000Z\",\"title\":{\"en\":\"NASA Simulated Mars Crew of Four Exits Habitat After 378 Days at Johnson Space Center\",\"zh-TW\":\"NASA 模擬火星任務 4 名組員隔離 378 天後步出模擬艙\"},\"summary\":{\"en\":\"Four crew members in NASA's simulated Mars mission at the Johnson Space Center have stepped out of their habitat after 378 days of isolation, Central News Agency reported from Houston; the mission is designed to prepare for possible future NASA astronaut journeys to explore Mars.\",\"zh-TW\":\"中央社（CNA）休士頓報導，在 NASA 詹森太空中心（Johnson Space Center）參與模擬火星任務的 4 名組員，隔離 378 天後首度步出模擬艙；這項任務旨在為 NASA 太空人未來可能的火星探索之旅做準備。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"為期一年多的火星模擬結束，組員回到艙外。\\n發生了什麼事\\n中央社（CNA）11 月 1 日自休士頓綜合外電報導，在 NASA 詹森太空中心（Johnson Space Center）參與模擬火星任務的 4 名組員，隔離 378 天後首度踏出模擬艙。科技新報（TechNews）刊登同一報導。此任務的目的，是為 NASA 太空人未來可能進行的火星探索之旅做準備。摘要未給組員姓名、棲艙名稱、實驗清單或健康發現。\\n為什麼重要\\n長時間模擬是太空機構在把太空人送上以年計的真實深空任務前，測試組員健康、操作與心理的方法。\\n來源異同\\n中央社（CNA）與科技新報（TechNews）刊登實質相同的電文——組員人數、378 天與地點一致——沒有事實衝突。信任標籤：雙源一致——兩家媒體一致，皆源自同一電文。\\n仍不確定\\n組員身分、醫療結果與 NASA 從此輪學到什麼，待 NASA 自身簡報；電文摘要只是步出模擬艙的公告。\"},\"sources\":[{\"nam
