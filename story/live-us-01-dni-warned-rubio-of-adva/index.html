Rubio from Director of National Intelligence Jay Clayton, came days after the State Department ordered the departure of personnel. US officials say the intelligence is one reason the department is drawing down personnel at several facilities.\nWhat happened\nThe memo, dated October 23 and obtained by Axios, puts the threat in the starkest terms available to an intelligence assessment: not merely persistent, but substantially increased, and not merely aspirational, but at advanced stages. The Hill's version stresses the same document and the same recipient, Rubio, and the same timing: the warning followed the department's departure orders by days.\nWhy it matters\nA declassified warning of this kind does two things at once: it justifies the drawdown already under way, and it puts Tehran on notice that Washington claims to see its planning. The risk is symmetric. If the plots are real, the warning may save lives; if the assessment is overstated, the drawdown itself becomes a costly signal that is hard to reverse.\nSources agree-disagree\nThe Hill and Axios report the same October 23 memo, the same author and recipient, and the same advanced-stages characterization. No numeric or name conflicts appear. Trust label: 2-source agreement.\nStill uncertain\nThe summaries do not identify specific targets, locations, or plots, and they give no evidence behind the advanced-stages judgment. How far the personnel drawdown extends, and whether any plot is disrupted or carried out, remains unknown."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-us-01-dni-warned-rubio-of-adva\",\"category\":\"us\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-us-01-dni-warned-rubio-of-adva.jpg\",\"imageAlt\":{\"en\":\"Cover related to: DNI warned Rubio of 'advanced' Iranian efforts to target US personnel, memo shows\",\"zh-TW\":\"相關封面圖：備忘錄顯示，國家情報總監警告盧比奧，伊朗針對美國人員的「高級」行動\"},\"publishedAt\":\"2026-10-24T03:24:37.000Z\",\"title\":{\"en\":\"Declassified Memo: Iran's Plots Against U.S. Officials Reach 'Advanced Stages'\",\"zh-TW\":\"解密備忘錄：伊朗針對美國官員的陰謀已達「進階階段」\"},\"summary\":{\"en\":\"A declassified October 23 memo from Director of National Intelligence Jay Clayton warned Secretary of State Marco Rubio that Iranian plots to target and kill U.S. officials in the Middle East have substantially increased, reaching advanced stages. U.S. officials say the intelligence is one reason the State Department is drawing down personnel. Watch whether the drawdown widens.\",\"zh-TW\":\"國家情報總監克萊頓（Jay Clayton）10 月 23 日的解密備忘錄警告國務卿盧比歐，伊朗在中東針對並殺害美國官員的陰謀已大幅增加，進入「進階階段」。美國官員稱，這份情資是國務院縮減駐外人員的原因之一。接下來看撤員範圍會不會擴大，以及德黑蘭如何回應。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"根據週五的一份解密情報備忘錄，伊朗在中東針對並殺害美國官員的陰謀已大幅增加，進入「進階階段」。這份警告由國家情報總監克萊頓（Jay Clayton）寫給國務卿盧比歐（Marco Rubio），發出時間在國務院下令人員撤離的幾天後。美國官員稱，這份情資是國務院縮減多處機構人員的原因之一。\\n發生了什麼事\\n這份 10 月 23 日、由 Axios 取得的備忘錄，用情報評估所能用的最直白措辭描述威脅：不只是持續存在，而是大幅增加；不只是有意圖，而是已到進階階段。國會山報（The Hill）的版本強調同一份文件與同一位收件人盧比歐，以及同樣的時間點：警告發出於國務院下令撤離的幾天後。\\n為什麼重要\\n這類解密警告同時做兩件事：為已經展開的撤員背書，也向德黑蘭放話，表明華府聲稱看見了它的計畫。風險是對稱的：陰謀若屬實，警告可能救命；評估若誇大，撤員本身就成了難以收回的昂貴訊號。\\n來源異同\\n國會山報與 Axios 報導的是同一份 10 月 23 日備忘錄、同一位作者與收件人、同樣的「進階階段」定性，沒有數字或人名衝突。信任標籤：2源一致。\\n仍不確定\\n摘要未指認具體目標、地點或陰謀，也沒給「進階階段」判斷背後的證據。撤員範圍會擴到多大、有無陰謀被破獲或得逞，目前都未知。\"},\"sources\":[{\"name\":\"The Hill\",\"url\":\"https://thehill.com/policy/international/6169784-clayton-warns-rubio-iran-threats/\"},{\"name\":\"Axios\",\"url\":\"https://www.axios.com/2026/10/24/iran-war-us-embassies-evacuations-threat\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":13,\"outletReputation\":10,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"us\",\"live-ingest\",\"the-hill\",\"axios\"],\"glossary\":[{\"term\":{\"en\":\"Jay Clayton\",\"zh-TW\":\"克萊頓\"},\"blurb\":{\"en\":\"Director of National Intelligence, author of the October 23 memo.\",\"zh-TW\":\"10 月 23 日備忘錄的作者，美國國家情報總監。\"}},{\"term\":{\"en\":\"Marco Rubio\",\"zh-TW\":\"盧比歐\"},\"blurb\":{\"en\":\"US Secretary of State, recipient of the October 23 memo.\",\"zh-TW\":\"10 月 23 日備忘錄的收件人，美國國務卿。\"}},{\"term\":{\"en\":\"Director of National Intelligence\",\"zh-TW\":\"國家情報總監\"},\"blurb\":{\"en\":\"US intelligence chief role held by Clayton.\",\"zh-TW\":\"克萊頓擔任的美國情報首長職位。\"}},{\"term\":{\"en\":\"Axios\",\"zh-TW\":\"Axios\"},\"blurb\":{\"en\":\"News outlet that obtained the October 23 memo.\",\"zh-TW\":\"取得 10 月 23 日備忘錄的新聞媒體。\"}},{\"term\":{\"en\":\"The Hill\",\"zh-TW\":\"國會山報\"},\"blurb\":{\"en\":\"US news outlet that covered the declassified memo.\",\"zh-TW\":\"報導這份解密備忘錄的美國新聞媒體。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://r85075515.github.io/Trust-digest/\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"Axiom\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"zh_TW\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:locale:alternate\",\"content\":\"en_US\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"9\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"10\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"11\",{\"name\":\
