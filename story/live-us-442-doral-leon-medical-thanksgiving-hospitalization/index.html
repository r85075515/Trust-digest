ters in Doral, near Miami, Florida, after employees reported sudden illness following an early Thanksgiving luncheon featuring catered food. Eighteen employees experienced symptoms, and 15 were transported to local hospitals for treatment, prompting responders to upgrade the call to a Level 3 Mass Casualty Incident.\n\nWhy it matters\nThe incident underscores food safety risks during large-scale holiday catering events and required substantial regional emergency medical dispatch, though Leon Medical Centers confirmed no patients at its facilities were affected.\n\nSource differences\nFOX 29 Philadelphia published the syndicated FOX Local report \"Thanksgiving feast sends 15 people to hospital with potential food poisoning: Reports\", citing WINK News and TMZ regarding the 18 sickened employees and 15 hospital transports. FOX 5 DC carried the identical syndicated wire text under the same headline \"Thanksgiving feast sends 15 people to hospital with potential food poisoning: Reports\", confirming consistent figures across outlets.\n\nStill uncertain\nHealth officials and Leon Medical Centers have not yet identified the specific pathogen or contaminated dish responsible, nor have they released updates on the hospitalized employees' recovery status.\n\nTrust label: Single source — Both FOX 29 Philadelphia and FOX 5 DC carry the same FOX Local syndicated report synthesizing WINK News and TMZ coverage."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-us-442-doral-leon-medical-thanksgiving-hospitalization\",\"category\":\"us\",\"title\":{\"en\":\"15 Hospitalized After Potential Food Poisoning at Florida Medical Center Thanksgiving Lunch\",\"zh-TW\":\"佛州醫療機構感恩節員工午宴疑似食物中毒，15 人送醫治療\"},\"summary\":{\"en\":\"Eighteen employees fell ill and 15 were transported to area hospitals after eating a catered Thanksgiving luncheon at Leon Medical Centers' headquarters in Doral, Florida, prompting Miami-Dade Fire Rescue to declare a Level 3 Mass Casualty Incident.\",\"zh-TW\":\"佛羅里達州多拉（Doral）的萊昂醫療中心（Leon Medical Centers）總部舉辦員工感恩節外燴午宴後，共有 18 名員工不適、其中 15 人送醫，邁阿密戴德消防救援局一度將事件升級為第三級大規模傷患事件。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n佛羅里達州邁阿密近郊多拉（Doral）的萊昂醫療中心（Leon Medical Centers）總部舉辦員工感恩節提前慶祝外燴午宴後，多名員工出現疑似食物中毒症狀。邁阿密戴德消防救援局獲報趕赴現場，因出現症狀人數眾多而將通報升級為第三級大規模傷患事件（Level 3 Mass Casualty Incident）；現場共 18 名員工身體不適，其中 15 人被送往鄰近醫院治療。\\n\\n「為什麼重要」\\n這起事件凸顯大型節慶外燴供餐的食品安全與保存風險，並動員當地大量緊急醫療救護量能；不過院方已確認事件僅限於總部員工午宴，並未波及任何就診病患。\\n\\n「來源異同」\\nFOX 29 Philadelphia 刊載 FOX Local 聯播報導「Thanksgiving feast sends 15 people to hospital with potential food poisoning: Reports」，引述當地媒體 WINK News 與 TMZ 資訊列出 18 人不適與 15 人送醫數據；FOX 5 DC 亦刊登同篇聯播稿，標題同為「Thanksgiving feast sends 15 people to hospital with potential food poisoning: Reports」，兩者核心數字與事件地點完全一致。\\n\\n「仍不確定」\\n衛生當局與萊昂醫療中心目前仍在配合外燴業者調查，尚未公布引發不適的具體病原體或問題餐點，也未揭露 15 名送醫員工的後續出院與恢復情況。\\n\\nTrust label: Single source — FOX 29 Philadelphia 與 FOX 5 DC 所刊載均為同一篇 FOX Local 聯播稿，轉述 WINK News 與 TMZ 的現場報導。\"},\"glossary\":[{\"term\":{\"en\":\"Level 3 Mass Casualty Incident\",\"zh-TW\":\"第三級大規模傷患事件（Level 3 Mass Casualty Incident）\"},\"blurb\":{\"en\":\"An emergency dispatch classification used by fire and EMS agencies when the number of patients requires coordinated multi-unit transport and hospital triage.\",\"zh-TW\":\"消防與緊急醫療救護單位使用的應變分級，代表傷病患人數需調度多組救護車隊與醫院檢傷資源協同處理。\"}},{\"term\":{\"en\":\"Doral, Florida\",\"zh-TW\":\"佛羅里達州多拉（Doral, Florida）\"},\"blurb\":{\"en\":\"A city in Miami-Dade County located west of Miami International Airport, hosting major corporate and healthcare headquarters.\",\"zh-TW\":\"位於邁阿密戴德郡、緊鄰邁阿密國際機場西側的城市，聚集多家企業與醫療機構總部。\"}},{\"term\":{\"en\":\"Salmonella\",\"zh-TW\":\"沙門氏菌（Salmonella）\"},\"blurb\":{\"en\":\"A common foodborne bacterium cited by the CDC that causes diarrhea, abdominal cramps, and fever when poultry or prepared dishes are improperly handled.\",\"zh-TW\":\"美國疾管中心列舉的常見食源性細菌，若禽肉或熟食保存與加熱不當，易引發腹瀉、腹痛與發燒。\"}}],\"sources\":[{\"name\":\"FOX 29 Philadelphia\",\"url\":\"https://www.f
