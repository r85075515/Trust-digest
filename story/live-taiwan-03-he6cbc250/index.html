ung said he spoke with Shen on Tuesday morning and heard a hoarse voice, the result of overusing his throat. Shen would rest in the morning, attend the Legislative Yuan's Procedure Committee at noon, and resume campaigning in the afternoon, Chuang said, according to CNA.\nWhy it matters\nThe episode reads as a campaign cold, not a crisis: the candidate loses half a day and keeps the rest of the schedule. For a mayoral race, the cost is a morning of exposure, and the signal to supporters is that the campaign continues the same day rather than pausing.\nSources agree / disagree\nOnly CNA carried the story in this cluster, reporting Chuang's account of his phone call with Shen. Trust label: Single source — one outlet's report of a party official's account, with no independent corroboration in the cluster.\nStill uncertain\nNo diagnosis was given — the report says only that Shen was suspected to be unwell — and there is no word on whether the afternoon events actually went ahead. Verify against later reporting before treating the resumed schedule as confirmed."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-03-he6cbc250\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-taiwan-03-he6cbc250.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 沈伯洋身體不適上午行程喊卡　綠：下午繼續競選活動\",\"zh-TW\":\"相關封面圖：沈伯洋身體不適上午行程喊卡　綠：下午繼續競選活動\"},\"publishedAt\":\"2026-11-10T03:39:23.000Z\",\"title\":{\"en\":\"Shen Poyang Cancels Morning Events Over Illness, Will Campaign in Afternoon\",\"zh-TW\":\"沈伯洋（Shen Poyang）身體不適取消上午行程，下午繼續競選\"},\"summary\":{\"en\":\"DPP Taipei mayoral candidate Shen Poyang cancelled his public morning schedule after falling ill, CNA reported. Party caucus secretary-general Chuang Jui-hsiung said Shen sounded hoarse from overusing his voice, would rest in the morning, attend the Legislative Yuan Procedure Committee at noon, and resume campaigning in the afternoon.\",\"zh-TW\":\"民進黨台北市長參選人沈伯洋（Shen Poyang）疑因身體不適，取消上午公開行程。民進黨團幹事長莊瑞雄（Chuang Jui-hsiung）說，早上通電話聽到他聲音沙啞、喉嚨使用過度，先休息一個上午，中午到立法院程序委員會，下午繼續競選活動。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"民進黨台北市長參選人沈伯洋（Shen Poyang）疑因身體不適，取消週二上午公開行程，中央社（CNA）報導；不過預計下午就會回到競選行程。\\n發生了什麼事\\n民進黨團幹事長莊瑞雄（Chuang Jui-hsiung）說，週二上午與沈伯洋通過電話，聽到他聲音沙啞，是喉嚨使用過度。沈伯洋早上先休息，中午到立法院程序委員會，下午繼續競選活動。\\n為什麼重要\\n這次狀況比較像競選期的操勞，不是危機：候選人只損失半天，行程當天就接續。對市長選戰來說，代價是一個上午的曝光，傳給支持者的訊號是選戰不停擺，而不是暫停。\\n來源異同\\n這批來源只有中央社一家，轉述莊瑞雄對通話內容的說法。信任標籤：僅1源——單一媒體轉述黨團幹部的說法，本批沒有其他來源交叉查證。\\n仍不確定\\n報導沒有給出診斷，只說「疑因」身體不適，也沒有消息確認下午活動是否如期舉行。把恢復行程當成定論之前，請先對照後續報導。\"},\"sources\":[{\"name\":\"中央社-政治\",\"url\":\"https://www.cna.com.tw/news/aipl/202611100078.aspx\"}],\"disagreements\":null,\"trustScore\":59,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"中央社-政治\"],\"glossary\":[{\"term\":{\"en\":\"Shen Poyang\",\"zh-TW\":\"沈伯洋\"},\"blurb\":{\"en\":\"DPP candidate for Taipei mayor who cancelled his morning schedule over illness.\",\"zh-TW\":\"民進黨台北市長參選人，因身體不適取消上午行程。\"}},{\"term\":{\"en\":\"Democratic Progressive Party (DPP)\",\"zh-TW\":\"民進黨\"},\"blurb\":{\"en\":\"Taiwan's ruling party, which nominated Shen for Taipei mayor.\",\"zh-TW\":\"提名沈伯洋參選台北市長的台灣執政黨。\"}},{\"term\":{\"en\":\"Chuang Jui-hsiung\",\"zh-TW\":\"莊瑞雄\"},\"blurb\":{\"en\":\"Secretary-general of the DPP legislative caucus who spoke with Shen.\",\"zh-TW\":\"與沈伯洋通電話的民進黨團幹事長。\"}},{\"term\":{\"en\":\"Legislative Yuan\",\"zh-TW\":\"立法院\"},\"blurb\":{\"en\":\"Taiwan's legislature, whose Procedure Committee Shen was due to attend.\",\"zh-TW\":\"台灣的立法機關，沈伯洋中午要出席其程序委員會。\"}},{\"term\":{\"en\":\"Procedure Committee\",\"zh-TW\":\"程序委員會\"},\"blurb\":{\"en\":\"Legislative Yuan committee that sets the agenda for floor sessions.\",\"zh-TW\":\"負責排定院會議程的立法院委員會。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"wid
