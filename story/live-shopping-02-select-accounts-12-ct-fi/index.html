 \u0026 Save brings the price to $12.75, the deal's headline figure. Shipping is free with Prime or on orders of $35 or more, and the listing notes a limit of one item and an extra 30% saving on the first order.\n\nWhy it matters\nDishwasher cleaner is a repeat purchase, so a stacked coupon and subscription discount cuts a routine household cost by roughly a third, which is why the deal earned a strong community score. The catch is that the final price depends on both discounts still being active at checkout, so the saving is real only if the coupon has not expired and the subscription option is selected.\n\nSources agree–disagree\nOnly Slickdeals has posted this item in the feed, so there is no second price to compare against. The listing itself is internally consistent on the headline price, though the arithmetic of the two discounts is not spelled out in the summary.\n\nStill uncertain\nThe summary does not confirm whether the coupon is still live, whether the extra first-order saving stacks with the headline price, or how long the deal lasts. Prices on Amazon can change quickly, so the $12.75 figure should be verified on the product page before ordering.\n\nTrust label: Single source — one Slickdeals deal post; price not yet corroborated."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-shopping-02-select-accounts-12-ct-fi\",\"category\":\"shopping\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"publishedAt\":\"2026-11-11T07:42:16.000Z\",\"title\":{\"en\":\"Finish Dishwasher Cleaner Tablets Drop to $12.75 with Coupon and Subscribe \u0026 Save\",\"zh-TW\":\"Finish 洗碗機清潔錠疊加優惠券與訂閱制降至 12.75 美元\"},\"summary\":{\"en\":\"［未證實·單一來源］ Amazon lists a 12-count pack of Finish dishwasher cleaner tablets at $19.61, falling to $12.75 after a 30% page coupon and 5% Subscribe \u0026 Save discount. Shipping is free with Prime or on $35+ orders. Check the coupon is still live before buying.\",\"zh-TW\":\"［未證實·單一來源］亞馬遜（Amazon）12
