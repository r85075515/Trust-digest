y Anthropic representative, and does not say whether the system is available now, in testing, or still in early development. No other outlet in the feed covers the same announcement.\n\nWhy it matters\nIf a system could reliably prove which model generated a response, users and auditors would have a way to check claims about model identity rather than taking them on trust. That stated purpose is why the item is notable despite its brevity. However, because the report is so short, readers cannot judge from this material how strong the proof would be, what it would cover, or whether it would work across different models and providers. The importance described here is the importance of the stated goal, not a verified assessment of a finished product.\n\nSources agree / disagree\nTrust label: Single source — Only one outlet reports the FlashProve system, and the item is a single sentence, so there is no corroboration or disagreement to compare.\nNo second source confirms the name FlashProve, Anthropic's plans, or the checking capability described. Nothing in the available material contradicts the report either; it is simply uncorroborated and very thin.\n\nStill uncertain\nAlmost everything practical remains uncertain: how FlashProve works technically, when or whether it will be released, which models it would cover, and whether outside parties could use it freely. The feed item also does not say how Anthropic itself has described the project. Until fuller reporting appears, the only firm facts are that one outlet reports Anthropic is working on such a system and that its stated purpose is verifying model identity."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-tech-03-anthropic-is-working-on-\",\"category\":\"tech\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-tech-03-anthropic-is-working-on-.webp\",\"imageAlt\":{\"en\":\"Cover related to: Anthropic is working on a system to prove AI models’ identity\",\"zh-TW\":\"相關封面圖：Anthropic 正在開發一個系統來證明人工智慧模型的身份\"},\"publishedAt\":\"2026-11-03T22:41:03.000Z\",\"title\":{\"en\":\"Anthropic builds FlashProve, a system to verify which model produced an AI response\",\"zh-TW\":\"安索皮克（Anthropic）開發驗證系統閃證（FlashProve），證明人工智慧回應的來源模型\"},\"summary\":{\"en\":\"Anthropic is working on a system called FlashProve that would let anyone check that an AI response really came from the model it claims to be from, according to a single TechCrunch report. The brief feed item gives no launch timing, technical detail, or independent confirmation of how the system would work.\",\"zh-TW\":\"安索皮克（Anthropic）正在開發名為閃證（FlashProve）的系統，讓任何人都能核查人工智慧回應是否真的來自其聲稱的模型。目前僅有一家媒體的簡短報導，沒有上線時間與技術細節。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"安索皮克（Anthropic）正在開發一套名為閃證（FlashProve）的驗證系統，目的是讓使用者確認某段人工智慧回應究竟出自哪個模型，目前僅有一則簡短科技報導提及此事。\\n\\n發生了什麼事\\n安索皮克（Anthropic）正在開發一個證明人工智慧模型身分的系統，名為閃證（FlashProve）。報導指出，這套系統讓任何人檢查人工智慧回應是否確實來自其聲稱的模型。這就是摘要提供的全部細節：點名公司、點名系統、用一句話說明用途。報導沒有描述技術原理、沒有引述公司代表說法，也沒有說明系統是已上線、測試中還是早期開發階段。其他媒體並未報導同一消息。\\n\\n為什麼重要\\n若系統真能可靠證明回應的來源模型，使用者與稽核者就不必只憑信任接受模型身分的宣稱，而能實際核查。這正是這則短訊值得注意的原因。不過報導過於簡短，讀者無法從現有素材判斷這種證明的強度、涵蓋範圍，或是否適用於不同廠商的模型。這裡所說的重要性指的是該目標本身的重要性，而非對成品的已驗證評價。\\n\\n來源異同\\n本則僅有單一媒體報導，且內容只有一句話，沒有其他來源可以印證，也沒有互相矛盾的說法。沒有第二個來源證實閃證（FlashProve）的名稱、安索皮克（Anthropic）的計畫或所述的核查功能；現有素材也沒有任何內容反駁這則報導，它只是未經印證且資訊非常單薄。\\n\\n仍不確定\\n幾乎所有實務問題都還不確定：閃證（FlashProve）的技術原理、何時或是否會推出、涵蓋哪些模型、外部人士能否自由使用。摘要也未說明安索皮克（Anthropic）本身如何描述這個專案。在更完整的報導出現前，能確認的只有：一家媒體報導該公司正在開發此系統，其宣稱用途是驗證模型身分。\"},\"sources\":[{\"name\":\"TechCrunch\",\"url\":\"https://techcrunch.com/2026/11/03/anthropic-is-working-on-a-system-to-prove-ai-models-identity/\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":18,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"tech\",\"live-ingest\",\"techcrunch\"],\"glossary\":[{\"term\":{\"en\":\"Anthropic\",\"zh-TW\":\"安索皮克（Anthropic）\"},\"blurb\":{\"en\":\"Anthropic is the AI company reported to be developing the FlashProve verification system.\",\"zh-TW\":\"安索皮克（Anthropic）是據報正在開發閃證驗證系統的人工智慧公司。\"}},{\"term\":{\"en\":\"FlashProve\",\"zh-TW\":\"閃證（FlashProve）\"},\"blurb\":{\"en\":\"FlashProve is the name of the system intended to prove which AI model produced a response.\",\"zh-TW\":\"閃證（FlashProve）是該系統的名稱，用途是證明回應出自哪個模型。\"}},{\"term\":{\"en\":\"TechCrunch\",\"zh-TW\":\"科技媒體（TechCrunch）\"},\"blurb\":{\"en\":\"TechCrunch is the technology news outlet that published the single report on FlashProve.\",\"zh-TW\":\"TechCrunch 是刊登這則閃證報導的科技新聞媒體。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-tech-03-anthropic-is-working-on-/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-tech-03-anthropic-is-working-on-/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</scri
