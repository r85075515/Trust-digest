ks and permitting delays have left more than 1,650 gigawatts (GW) of wind and solar projects awaiting connection globally. The agency urged governments and utilities to double annual grid investment to over $600 billion by 2030 to prevent power bottlenecks.\n\nSurging electricity load from hyperscale AI data centers, electric vehicle charging, and industrial electrification is colliding with decade-long permitting timelines for high-voltage transmission lines.\n\nFinancial Times and Reuters both report the 1,650 GW connection queue figure and the IEA's call to double grid capital expenditure, matching the agency's official executive summary.\n\nWhether national regulators in Europe and North America can streamline cross-border transmission permitting fast enough to meet 2028 data center load forecasts remains uncertain.\n\nTrust label: Multi-source agreement — Reuters and Financial Times report identical IEA grid queue figures and investment targets."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-energy-036-iea-global-grid-investment-report-2026\",\"category\":\"energy\",\"title\":{\"en\":\"IEA Warns Global Power Grid Bottlenecks Threaten Renewable and AI Data Center Expansion\",\"zh-TW\":\"國際能源總署示警全球電網瓶頸 恐拖累再生能源與 AI 資料中心擴張\"},\"summary\":{\"en\":\"The International Energy Agency (IEA) reported that over 1,650 gigawatts of renewable power projects remain stalled in grid connection queues worldwide, urging utilities to double annual grid spending. Without faster transmission upgrades, both clean energy targets and surging AI data center electricity demand face severe delays.\",\"zh-TW\":\"國際能源總署（IEA）發布最新報告指出，全球超過 1,650 GW 的再生能源專案仍卡在併網排隊序列中，呼籲各國將年度電網投資倍增。若無法加速輸配電網路升級，不僅潔淨能源轉型目標受阻，AI 資料中心急劇攀升的用電需求也將面臨嚴重供電延遲。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n國際能源總署（IEA）發布最新電網基礎設施評估報告，指出老舊輸電網路與冗長環評審批導致全球超過 1,650 GW（百萬瓩）的風電與光電專案停滯在併網排隊序列中。該機構敦促各國政府與電力公司在 2030 年前將年度電網資本支出倍增至 6,000 億美元以上。\\n\\n「為什麼重要」\\n超大規模 AI 資料中心、電動車充電與工業電氣化帶來的用電負載激增，正與動輒耗時十年的高壓輸電線路審批週期正面衝撞，電網容量已取代發電成本成為能源轉型最大瓶頸。\\n\\n「來源異同」\\n英國《金融時報》（Financial Times）與路透社（Reuters）均引述 IEA 報告中的 1,650 GW 併網排隊規模與年度投資倍增建議，核心數據完全一致。\\n\\n「仍不確定」\\n歐美各國監管機構能否在短期內簡化跨區輸電線路審批程序，以趕上 2028 年 AI 資料中心併網高峰，目前仍充滿變數。\"},\"glossary\":[{\"term\":{\"en\":\"Grid Connection Queue\",\"zh-TW\":\"併網排隊序列\"},\"blurb\":{\"en\":\"The backlog of power generation and storage projects awaiting technical studies and physical interconnection to the electrical grid.\",\"zh-TW\":\"等待電力系統進行併網影響評估與實體線路連接的發電及儲能專案積壓清單。\"}},{\"term\":{\"en\":\"Gigawatt (GW)\",\"zh-TW\":\"百萬瓩（GW）\"},\"blurb\":{\"en\":\"A unit of electrical power equal to one billion watts, roughly equivalent to the output of a large nuclear power reactor.\",\"zh-TW\":\"電功率單位，1 GW 等於 10 億瓦特，約相當於一座大型核能反應爐的發電容量。\"}},{\"term\":{\"en\":\"Hyperscale Data Center\",\"zh-TW\":\"超大規模資料中心\"},\"blurb\":{\"en\":\"Massive computing facilities operated by cloud and AI providers that consume hundreds of megawatts of continuous power.\",\"zh-TW\":\"由雲端與 AI 巨頭營運的大型運算設施，單一園區常消耗數百兆瓦的連續電力。\"}}],\"sources\":[{\"name\":\"Reuters\",\"url\":\"https://www.reuters.com/business/energy/iea-warns-grid-bottlenecks-stall-1650-gw-renewable-projects-2026-11-26/\"},{\"name\":\"Financial Times\",\"url\":\"https://www.ft.com/content/9b4e2f18-7c3d-4a81-9e12-5d6f8a0b3c41\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"High-voltage electrical transmission towers carrying power lines across a landscape\",\"zh-TW\":\"輸送電力的超高壓輸電鐵塔與電線\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":88,\"trustBreakdown\":{\"crossCorroboration\":22,\"outletReputation\":23,\"recencyClarity\":22,\"sourceDiversity\":21},\"publishedAt\":\"2026-11-27T14:02:15.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":4,\"D2\":5,\"D3\":4,\"D4\":4,\"D5\":4,\"total\":21},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]
