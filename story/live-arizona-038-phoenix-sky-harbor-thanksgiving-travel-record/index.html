tion from Friday through Sunday as post-Thanksgiving return travel surges past 160,000 passengers per day. Airport operations added extra Transportation Security Administration (TSA) screening lanes, expanded curbside traffic enforcement, and increased frequency on the PHX Sky Train connecting rental car and economy parking facilities.\n\nAs one of the busiest hub airports in the U.S. Southwest, severe checkpoint or roadway backups at Sky Harbor directly affect connecting flight schedules nationwide.\n\nThe Arizona Republic and AZFamily (3TV/CBS 5) both report the 160,000-passenger daily forecast and identical airport advisories regarding early arrival and parking reservations.\n\nWeather-related cascading flight delays from Midwest and East Coast storm systems could still disrupt afternoon departures out of Phoenix.\n\nTrust label: Multi-source agreement — The Arizona Republic and AZFamily report identical Sky Harbor passenger projections and travel advisories."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-arizona-038-phoenix-sky-harbor-thanksgiving-travel-record\",\"category\":\"arizona\",\"title\":{\"en\":\"Phoenix Sky Harbor Projects Record Thanksgiving Return Travel Volume Through Sunday\",\"zh-TW\":\"鳳凰城天港國際機場迎感恩節返程高峰 單日旅客量料創同期新高\"},\"summary\":{\"en\":\"Phoenix Sky Harbor International Airport officials expect more than 160,000 daily passengers during the post-Thanksgiving return rush, urging travelers to arrive at least two hours early for domestic flights. TSA checkpoint staffing and PHX Sky Train schedules have been expanded to ease terminal congestion.\",\"zh-TW\":\"美國亞利桑那州鳳凰城天港國際機場（Sky Harbor）預估感恩節連假返程高峰單日旅客將突破 16 萬人次，呼籲國內線旅客至少提前兩小時抵達機場。機場已加派運輸安全管理局（TSA）安檢人力並加密航廈接駁列車班次以疏運人潮。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n鳳凰城天港國際機場（Phoenix Sky Harbor International Airport）發布連假疏運提醒，預估週五至週日感恩節返程期間單日客流量將超過 16 萬人次。機場營運單位已增開美國運輸安全管理局（TSA）安檢通道、加強航廈路邊交通管制，並加密連結租車中心與外圍停車場的 PHX Sky Train 接駁列車班次。\\n\\n「為什麼重要」\\n天港機場是美國西南部核心航空樞紐，若安檢或聯外道路出現嚴重壅塞，將直接波及全美轉機航班準點率與旅客行程。\\n\\n「來源異同」\\n當地主流媒體《亞利桑那共和報》（The Arizona Republic）與 AZFamily 電視台均報導單日 16 萬人次預估數據及提前兩小時報到建議，內容完全一致。\\n\\n「仍不確定」\\n美國中西部與東岸冬季風暴系統是否會引發連鎖航班延誤，進而影響鳳凰城午後起降班次準點率，仍需視即時航空調度而定。\"},\"glossary\":[{\"term\":{\"en\":\"Transportation Security Administration (TSA)\",\"zh-TW\":\"美國運輸安全管理局\"},\"blurb\":{\"en\":\"The U.S. federal agency responsible for airport passenger screening and transportation security operations.\",\"zh-TW\":\"隸屬美國國土安全部的聯邦機構，負責全美機場旅客與行李安全檢查及交通運輸安全。\"}},{\"term\":{\"en\":\"PHX Sky Train\",\"zh-TW\":\"鳳凰城機場高架接駁列車\"},\"blurb\":{\"en\":\"An automated people mover linking Phoenix Sky Harbor terminals with Valley Metro Rail, economy parking, and the Rental Car Center.\",\"zh-TW\":\"連接鳳凰城天港機場各航廈、輕軌車站、經濟停車場與租車中心的自動化無人駕駛接駁系統。\"}},{\"term\":{\"en\":\"Hub Airport\",\"zh-TW\":\"航空樞紐機場\"},\"blurb\":{\"en\":\"A major airport used by airlines to concentrate passenger traffic and transfer flights between regional and long-haul routes.\",\"zh-TW\":\"航空公司用來集中客流並銜接區域航線與長程幹線轉機的核心轉運機場。\"}}],\"sources\":[{\"name\":\"The Arizona Republic\",\"url\":\"https://www.azcentral.com/story/travel/airlines/2026/11/27/phoenix-sky-harbor-thanksgiving-return-travel-crowds/76541298007/\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"Travelers moving through Phoenix Sky Harbor International Airport terminal\",\"zh-TW\":\"鳳凰城天港國際機場航廈內的返鄉旅客人潮\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":84,\"trustBreakdown\":{\"crossCorroboration\":21,\"outletReputation\":21,\"recencyClarity\":22,\"sourceDiversity\":20},\"publishedAt\":\"2026-11-27T14:02:15.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":4,\"D2\":4,\"D3\":4,\"D4\":4,\"D5\":3,\"total\":19},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\
