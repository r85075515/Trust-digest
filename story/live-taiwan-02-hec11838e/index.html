ze depends on permits, budgets and political goodwill lining up at the same time, and Cho's message is aimed at keeping those three tracks moving together rather than letting party politics stall them.\n\nSources agree-disagree\nThis is a single-outlet report from CNA, so the material provided offers no second account to compare against, and no conflicting figure or name appears in it. The statement is attributed to Cho in the CNA report, not independently verified by another outlet in the material.\n\nStill uncertain\nThe material provided gives no timetable, no site details and no Taipei City Government response. Without those, readers cannot tell how close the headquarters plan is to a final agreement.\n\nTrust label: Single source"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-02-hec11838e\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-taiwan-02-hec11838e.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 卓榮泰：輝達總部落腳北市　中央全力協助未考慮黨派\",\"zh-TW\":\"相關封面圖：卓榮泰：輝達總部落腳北市　中央全力協助未考慮黨派\"},\"publishedAt\":\"2026-11-03T02:42:47.000Z\",\"title\":{\"en\":\"Premier Cho says central government backs NVIDIA Taipei headquarters regardless of party\",\"zh-TW\":\"卓榮泰：輝達總部落腳北市，中央全力協助不分黨派\"},\"summary\":{\"en\":\"[Unconfirmed · Single source] Premier Cho Jung-tai said the central government is helping NVIDIA set up its headquarters in Taipei through budget, legal and political support, CNA reported on November 3. He said the only goal is keeping major global tech firms in Taiwan, with no party consideration. Watch whether Taipei City and the central government align soon.\",\"zh-TW\":\"［未證實·單一來源］行政院長卓榮泰（Cho Jung-tai）說，中央政府從預算、法制與政治三個層面協助輝達（NVIDIA）企業總部落腳台北市，中央社 11 月 3 日報導。他表示唯一考量是把世界主要科技大廠留在台灣，沒有考慮黨派問題。接下來看北市府與中央能否在後續步驟上對齊。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"發生了什麼事\\n行政院長卓榮泰（Cho Jung-tai）說，中央政府從預算、法制到政治三個層面，協助輝達（NVIDIA）企業總部落腳台北市，中央社（CNA）11 月 3 日台北報導。他表示政府只考慮把世界主要科技大廠留在台灣，並沒有考慮黨派問題；他也盼北市府回憶與中央合作的那段時光，並形容雙方合作是美好的。\\n\\n為什麼重要\\n這番表態把選址決定變成中央與地方合作的試金石。落腳如此規模的總部，需要許可、預算與政治善意同時到位，卓榮泰的訊息正是要讓三條線一起往前走，而不是讓黨派政治拖住進度。\\n\\n來源異同\\n本卡只有中央社（CNA）一家報導，提供的材料中沒有第二家說法可以對照，也沒有相互衝突的數字或人名。這番表態出自中央社報導中的卓榮泰說法，材料中沒有另一家媒體獨立核實。\\n\\n仍不確定\\n提供的材料沒有時間表、沒有選址細節，也沒有北市府的回應。缺少這些資訊，讀者無法判斷總部計畫距離最後定案還有多遠。\"},\"sources\":[{\"name\":\"中央社-政治\",\"url\":\"https://www.cna.com.tw/news/aipl/202611030049.aspx\"}],\"disagreements\":null,\"trustScore\":59,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"中央社-政治\"],\"glossary\":[{\"term\":{\"en\":\"Cho Jung-tai\",\"zh-TW\":\"卓榮泰\"},\"blurb\":{\"en\":\"Premier of Taiwan's Executive Yuan.\",\"zh-TW\":\"行政院長。\"}},{\"term\":{\"en\":\"NVIDIA\",\"zh-TW\":\"輝達\"},\"blurb\":{\"en\":\"US chipmaker planning a Taipei headquarters.\",\"zh-TW\":\"計畫在台北設立總部的美國晶片大廠。\"}},{\"term\":{\"en\":\"CNA\",\"zh-TW\":\"中央社\"},\"blurb\":{\"en\":\"Taiwan's Central News Agency reporting the remarks.\",\"zh-TW\":\"報導這番表態的中央通訊社。\"}},{\"term\":{\"en\":\"Taipei City Government\",\"zh-TW\":\"北市府\"},\"blurb\":{\"en\":\"Taipei municipal government.\",\"zh-TW\":\"台北市政府。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-taiwan-02-hec11838e/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilin
