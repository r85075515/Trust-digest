ed\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"id\",\"live-international-05-house-blocks-hegseth-impeachment\",\"d\"],[\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$L2\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L3\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[\"__PAGE__\",[\"$\",\"$1\",\"c\",{\"children\":[\"$L4\",null,[\"$\",\"$L5\",null,{\"children\":[\"$L6\",[\"$\",\"$L7\",null,{\"promise\":\"$@8\"}]]}]]}],{},null,false]},null,false]},null,false]},null,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[[\"$\",\"$L9\",null,{\"children\":\"$La\"}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]],[\"$\",\"$Lb\",null,{\"children\":[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$c\",null,{\"fallback\":null,\"children\":\"$Ld\"}]}]}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$e\",[]],\"s\":false,\"S\":true}\n"])</script><script>self.__next_f.push([1,"f:I[8587,[\"619\",\"static/chunks/619-ba102abea3e3d0e4.js\",\"523\",\"static/chunks/523-9894ad6cb5d575dd.js\",\"954\",\"static/chunks/app/story/%5Bid%5D/page-b37b1e31acb17fd9.js\"],\"default\"]\n10:Tba1,"])</script><script>self.__next_f.push([1,"The US House voted 211–204 on Tuesday evening (Nov 10) to refer the impeachment resolution against Defense Secretary Pete Hegseth back to the Judiciary Committee, effectively killing the effort led by Republican Rep. Thomas Massie, the Wall Street Journal reports.\nWhat happened\nMassie used a privileged resolution to force action on eight articles of impeachment accusing Hegseth of waging war on Iran without congressional authorization, in violation of the War Powers Act: three articles concern the Iran operations, one the US military's capture of Venezuelan leader Nicolás Maduro, and others the strikes on alleged drug boats in the Caribbean, disregard of laws meant to minimize civilian casualties, and a free-speech dispute involving Sen. Mark Kelly. Rep. Darrell Issa moved to refer the resolution to the Judiciary Committee, and the motion passed 211–204 at 6:02 p.m. ET, cancelling a planned Wednesday vote on the articles themselves. Massie was the only Republican to vote against referral. Eighteen lawmakers did not vote (11 Democrats, 7 Republicans), though by all accounts full attendance would not have changed the outcome.\nWhy it matters\nThis is a procedural kill, not an acquittal: the articles were never voted on, only frozen in a Republican-led committee. Trump posted on Truth Social that the Democrats' attempt had 'miserably FAILED,' that every Republican except 'a major LOSER' Massie backed Hegseth, called Hegseth a 'Great American Patriot' and said the vote exonerated him. The real clock runs to January: after their midterm sweep, Democrats take control of the House and are expected to revive the effort — while Massie, who lost his primary to a candidate backed by Hegseth and Trump, leaves Congress at year-end, making the next round a purely Democratic campaign. Hegseth earlier on Tuesday likened the push to Trump's two impeachments and blamed 'policy disagreements.'\nSources agree / disagree\nThe Wall Street Journal, USA Today, Fox News and The Times agree on the 211–204 tally, Massie as the sole Republican holdout, and referral as the effective end of the effort in this Congress; the House Clerk's record (Roll Call 317) matches. The disagreement is over characterization: Trump calls it exoneration, Democrats and Massie call it a procedural shelving with a January sequel. The party split of the absences (11 Democrats, 7 Republicans) comes from USA Today's count. Trust label: Multi-source agreement — the tally is a matter of official House record.\nStill uncertain\nWhether the Judiciary Committee ever takes the resolution up (it is not expected to, but has not said so); whether the Democrats' January version reuses Massie's eight articles or is rewritten, and whether the incoming House leadership makes Hegseth a priority. Hegseth's own tenure is a further variable: Trump is publicly backing him, but post-midterm personnel changes have already begun at the White House, where the chief of staff has been replaced."])</script><script>self.__next_f.push([1,"11:Tb24,"])</script><script>self.__next_f.push([1,"美國眾議院週二（11 月 10 日）晚間以 211 票對 204 票，通過把針對國防部長赫格塞斯（Pete Hegseth）的彈劾決議送回司法委員會，實質封殺這項由共和黨眾議員馬西（Thomas Massie）發起的彈劾行動，《華爾街日報》報導。\n發生了什麼事\n馬西以「特權決議」（privileged resolution）程序提出八條彈劾條文，指控赫格塞斯未經國會授權對伊朗開戰、違反《戰爭權力法》：八條中三條針對伊朗軍事行動、一條針對美軍擒獲委內瑞拉領導人馬杜羅（Nicolás Maduro），另涉加勒比海毒船打擊、漠視平民傷亡防護法規，以及對參議員凱利（Mark Kelly）的言論自由爭議。共和黨議員伊薩（Darrell Issa）週二傍晚提出送回司法委員會的動議，美東時間晚間 6 時 02 分以 211–204 通過，原訂週三舉行的彈劾條文本身表決因此取消。馬西是唯一反對送回的共和黨人；18 名議員未投票（民主黨 11 人、共和黨 7 人），但各家估算即使全員到場結果也不變。\n為什麼重要\n這是程序封殺，不是無罪判決——彈劾條文沒有被逐條表決否決，而是被送進共和黨主導的委員會冷凍。川普（Donald Trump）在 Truth Social 發文宣稱民主黨的彈劾「慘敗」、每位共和黨人（除「大魯蛇」馬西外）都挺赫格塞斯，稱他是「偉大的美國愛國者」，並說這次表決形同平反。真正的時鐘在明年 1 月：民主黨在期中選舉大勝後將接掌眾院，已表明會重提彈劾；而馬西在初選敗給赫格塞斯與川普支持的對手、年底離開國會，下一輪將是民主黨單獨主導、政治性質完全不同的攻防。赫格塞斯週二稍早把這次逼宮比作川普兩次遭彈劾，稱其源於「政策歧見」。\n來源異同\n《華爾街日報》、《今日美國》（USA Today）、福斯新聞（Fox News）與《泰晤士報》對票數 211–204、馬西是唯一共和黨反對者、送回委員會等於本屆封殺等核心事實說法一致；眾議院書記官的院會紀錄（Roll Call 317）亦同。差異只在定性：川普稱之為「平反」，民主黨與馬西陣營則強調這是程序擱置、明年重來。缺席人數的黨派拆分（民主黨 11 人、共和黨 7 人）來自《今日美國》的點名統計。信任標籤：多源一致——票數有院會正式紀錄可查。\n仍不確定\n司法委員會是否會實際排審這份決議（預料不會，但尚未正式表態）；民主黨明年 1 月的版本會沿用馬西八條還是重寫、以及新任眾院領導層是否真把赫格塞斯列為優先目標，都待觀察。赫格塞斯本人的去留——川普目前力挺，但期中選後白宮人事已開始調整（幕僚長已換人）——仍是變數。"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"adult\":false,\"body\":{\"en\":\"$10\",\"zh-TW\":\"$11\"},\"category\":\"international\",\"disagreements\":null,\"glossary\":[{\"blurb\":{\"en\":\"US Secretary of Defense in the Trump administration; target of Massie's eight impeachment articles over unauthorized military operations.\",\"zh-TW\":\"川普政府的國防部長；馬西八條彈劾條文的對象，指控核心是未經國會授權動武。\"},\"term\":{\"en\":\"Pete Hegseth\",\"zh-TW\":\"赫格塞斯（Pete Hegseth）\"}},{\"blurb\":{\"en\":\"Republican congressman from Kentucky who authored the Hegseth impeachment articles; the only Republican to oppose referral. He lost his primary and leaves Congress at year-end.\",\"zh-TW\":\"肯塔基州共和黨眾議員，彈劾條文提案人，也是唯一反對送回委員會的共和黨人；初選落敗，年底離開國會。\"},\"term\":{\"en\":\"Thomas Massie\",\"zh-TW\":\"馬西（Thomas Massie）\"}},{\"blurb\":{\"en\":\"The formal charges the House votes on; adoption by a simple majority impeaches the official, who is then tried by the Senate.\",\"zh-TW\":\"眾議院表決的正式指控條文；簡單多數通過即構成彈劾，其後由參議院審判。\"},\"term\":{\"en\":\"Articles of impeachment\",\"zh-TW\":\"彈劾條文\"}},{\"blurb\":{\"en\":\"The 1973 law limiting a president's power to commit US forces without congressional approval; the legal core of most of Massie's articles.\",\"zh-TW\":\"1973 年立法，限制總統未經國會授權投入美軍作戰；是馬西多數彈劾條文的法律核心。\"},\"term\":{\"en\":\"War Powers Act\",\"zh-TW\":\"《戰爭權力法》（War Powers Act）\"}},{\"blurb\":{\"en\":\"The House committee to which the impeachment resolution was referred on Nov 10 — a Republican-led committee where the effort is expected to stall.\",\"zh-TW\":\"彈劾決議 11 月 10 日被送回的眾議院委員會；由共和黨主導，彈劾行動預料在此擱置。\"},\"term\":{\"en\":\"House Judiciary Committee\",\"zh-TW\":\"眾議院司法委員會\"}},{\"blurb\":{\"en\":\"A procedure letting a member force House consideration of a resolution within two legislative days; Massie used it to bring the impeachment to the floor over leadership objections.\",\"zh-TW\":\"讓個別議員迫使眾院在兩個立法日內處理決議的程序工具；馬西藉此繞過黨團領導層，把彈劾案送上院會。\"},\"term\":{\"en\":\"Privileged resolution\",\"zh-TW\":\"特權決議（privileged resolution）\"}}],\"id\":\"live-international-05-house-blocks-hegseth-impeachment\",\"imageAlt\":{\"en\":\"\",\"zh-TW\":\"\"},\"imageUrl\":\"\",\"isHeadline\":false,\"isPopular\":true,\"publishedAt\":\"2026-11-11T00:23:46.000Z\",\"sources\":[{\"name\":\"Wall Street Journal\",\"url\":\"https://www.wsj.com/politics/hegseth-survives-impeachment-effort-in-house-7933bc38\"},{\"name\":\"USA Today\",\"url\":\"https://www.usatoday.com/story/news/politics/2026/11/10/pete-hegseth-avoids-impeachment-vote/92714806007/\"},{\"name\":\"Fox News\",\"url\":\"https://foxnews.com/politics/house-gop-leaders-block-massie-hegseth-impeachment-push\"},{\"name\":\"The Times\",\"url\":\"https://www.thetimes.com/us/american-politics/article/pete-hegseth-impeachment-spectacle-vote-f3td3n5f8\"},{\"name\":\"New York Post\",\"url\":\"https://nypost.com/2026/11/10/us-news/pete-hegseth-escapes-impeachment-as-dems-threaten-to-try-again-in-next-congress/\"}],\"summary\":{\"en\":\"The House voted 211–204 on Tuesday evening to refer Rep. Thomas Massie's eight articles of impeachment against Defense Secretary Pete Hegseth to the Judiciary Committee, effectively killing the effort in this Congress and cancelling a planned Wednesday vote on the articles themselves. Massie was the only Republican to oppose the referral, and President Trump declared the attempt a miserable failure that exonerated Hegseth. But the block is procedural, not final: Democrats are expected to revive the effort in January when they take control of the House — by which time Massie himself will have left Congress.\",\"zh-TW\":\"眾議院週二晚以 211 比 204 表決，把馬西（Thomas Massie）對國防部長赫格塞斯（Pete Hegseth）的八條彈劾條文送回司法委員會——形同封殺，原訂週三的彈劾表決取消。馬西是唯一反對送回的共和黨人，川普（Donald Trump）隨即在 Truth Social 宣稱彈劾「慘敗」、赫格塞斯獲得平反。但這只是程序擱置：民主黨明年 1 月接掌眾院後將捲土重來，屆時連提案的馬西都已離開國會，下一輪將由民主黨單獨主導。\"},\"tags\":[\"international\",\"live-ingest\",\"breaking\",\"us-politics\",\"hegseth\",\"impeachment\"],\"title\":{\"en\":\"House Blocks Hegseth Impeachment 211–204, Referring Articles to Committee as Democrats Vow January Retry\",\"zh-TW\":\"眾院 211–204 封殺赫格塞斯彈劾案：送回委員會實質擱置，民主黨揚言明年 1 月重來\"},\"trustBreakdown\":{\"crossCorroboration\":21,\"outletReputation\":21,\"recencyClarity\":22,\"sourceDiversity\":18},\"trustScore\":82}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"cont
