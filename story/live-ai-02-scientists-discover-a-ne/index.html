ivity may rely on internal processes the brain doesn't use What happened\nScientists discover a new type of depression that common antidepressants struggle to treat. AI may not think like the human brain after all, according to a striking new discovery that challenges how scientists understand artificial intelligence. Researchers found that even AI models that closely predict brain activity may rely on internal processes the brain doesn't use, raising important questions about their reliability in neuroscience research. Researchers have discovered a new subtype of depression that may affect nearly one in four people with severe, recurrent, or persistent depression. Known as \"circadian depression,\" it is linked to the body's internal clock and is associated with night owl tendencies, excessive sleep, persistent exhaustion, and more severe symptoms. Traditional antidepressants often work less effectively for these Why it matters\nThis cluster was assembled from 2 feed item(s) across 2 outlet(s) (ScienceDaily AI, ScienceDaily 健康醫學) in the ai category. Axiom links out to each publisher; this digest only restates titles and short feed descriptions — not full articles. Sources agree / disagree\nMultiple outlets are covering closely related headlines: \"AI may not work like the human brain after all, scientists discover\" (ScienceDaily AI); \"Scientists discover a new type of depression that common antidepressants struggle to treat\" (ScienceDaily 健康醫學).\nNo clear numeric/name conflicts detected in the short feed snippets; always verify details on the publisher pages. Still uncertain\nFeed descriptions can omit context, updates, or corrections. Click through to the linked outlets for the latest full reporting. Trust scores are heuristics, not fact-check guarantees. Linked sources (outlet names only): ScienceDaily AI, ScienceDaily 健康醫學"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-ai-02-scientists-discover-a-ne\",\"category\":\"
