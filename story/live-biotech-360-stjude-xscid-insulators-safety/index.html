ration sites of a lentiviral vector in X-linked severe combined immunodeficiency (X-SCID) gene therapy. The findings show that DNA insulators act like protective barriers limiting how inserted genes affect neighboring genes, integration orientation is a leading factor shaping safety risk, and a preliminary machine learning risk-prediction model was developed based on these features.\n\nWhy it matters\nUnderstanding how viral vectors integrate into the genome and influence adjacent genes is central to reducing insertional mutagenesis risks in gene therapy. Mapping three-dimensional chromatin context and genomic features helps guide safer vector design for inherited immune disorders like X-SCID.\n\nSource differences\nSt. Jude Children's Research Hospital publishes \"3D mapping of X-SCID gene therapy reveals genomic features that predict safety\", and News-Medical publishes \"DNA insulators improve safety of gene therapy for X-SCID\". Both outlets draw from the St. Jude Children's Research Hospital release chain covering the November 27, 2026 Science Advances findings.\n\nStill uncertain\nThe machine learning risk-prediction model remains preliminary and requires further validation, and clinical translation across broader patient cohorts and other gene therapy settings remains subject to ongoing evaluation.\n\nTrust label: Single source — Both reports stem from the St. Jude Children's Research Hospital release chain."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-biotech-360-stjude-xscid-insulators-safety\",\"category\":\"biotech\",\"title\":{\"en\":\"3D mapping of X-SCID gene therapy reveals genomic features that predict safety\",\"zh-TW\":\"聖猶大兒童研究醫院繪製 X-SCID 基因治療 3D 圖譜揭示安全預測基因特徵\"},\"summary\":{\"en\":\"A study led by Yong Cheng at St. Jude Children's Research Hospital published November 27, 2026 in Science Advances mapped 329 lentiviral integration sites in X-SCID gene therapy, showing DNA insulators restrain effects on neighboring genes, integration orientation drives safety risk, and a preliminary machine learning model requires further validation.\",\"zh-TW\":\"美國聖猶大兒童研究醫院程勇團隊於 2026 年 11 月 27 日在《Science Advances》發表研究，繪製 X 連鎖重度複合免疫缺陷（X-SCID）基因治療慢病毒載體 329 個整合位點，證實 DNA 絕緣子可限制對鄰近基因影響且整合方向為主導風險因子。其初步機器學習風險預測模型仍待進一步驗證。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n美國聖猶大兒童研究醫院（St. Jude Children's Research Hospital）研究員程勇（Yong Cheng）領導的團隊，於 2026 年 11 月 27 日在期刊《Science Advances》發表研究，繪製 X 連鎖重度複合免疫缺陷（X-SCID）基因治療中慢病毒載體的 329 個整合位點。研究結果顯示，DNA 絕緣子（insulator）宛如防護牆般限制插入基因對鄰近基因的影響，整合方向是影響安全風險的主導因素，團隊並據此建立一套初步機器學習風險預測模型。\\n\\n「為什麼重要」\\n了解病毒載體如何整合至基因組並影響相鄰基因，是降低基因治療插入突變風險的核心關鍵。繪製三維染色質背景與基因組特徵，有助於為 X-SCID 等遺傳性免疫疾病設計更安全的載體。\\n\\n「來源異同」\\nSt. Jude Children's Research Hospital 發布「3D mapping of X-SCID gene therapy reveals genomic features that predict safety」，而 News-Medical 發布「DNA insulators improve safety of gene therapy for X-SCID」。兩家媒體均取材自 St. Jude Children's Research Hospital 的新聞稿鏈，報導 2026 年 11 月 27 日《Science Advances》的同一項研究成果。\\n\\n「仍不確定」\\n該機器學習風險預測模型目前仍屬初步階段且尚待進一步驗證，而在更廣泛患者族群及其他基因治療情境中的臨床轉譯應用仍須持續評估。\\n\\nTrust label: Single source — 兩篇報導均源自 St. Jude Children's Research Hospital 的新聞稿鏈。\"},\"glossary\":[{\"term\":{\"en\":\"X-SCID (X-Linked Severe Combined Immunodeficiency)\",\"zh-TW\":\"X 連鎖重度複合免疫缺陷（X-SCID）\"},\"blurb\":{\"en\":\"A severe inherited immune disorder linked to the X chromosome that impairs immune cell development and function.\",\"zh-TW\":\"與 X 染色體相關的嚴重遺傳性免疫缺陷疾病，會影響免疫細胞發育與功能。\"}},{\"term\":{\"en\":\"DNA Insulator\",\"zh-TW\":\"DNA 絕緣子（DNA Insulator）\"},\"blurb\":{\"en\":\"A genomic sequence element that helps block or restrict regulatory interactions between neighboring genes.\",\"zh-TW\":\"有助於阻隔或限制相鄰基因之間調控交互作用的基因組序列元件。\"}},{\"term\":{\"en\":\"Lentiviral Vector\",\"zh-TW\":\"慢病毒載體（Lentiviral Vector）\"},\"blurb\":{\"en\":\"A viral delivery vehicle derived from lentiviruses used in gene therapy to introduce genetic material into target cells.\",\"zh-TW\":\"基因治療中常用來將遺傳物質送入目標細胞的慢病毒衍生遞送載體。\"}}],\"sources\":[{\"name\":\"St. Jude Children's Research Hospital\",\"url\":\"https://www.stjude.org/media-resources/news-releases/2026-medicine-science-news/3d-mapping-of-x-scid-gene-therapy-reveals-genomic-features-that-predict-safety.html\"},{\"name\":\"News-Medical\",\"url\":\"https://www.news-medical.net/news/20261127/DNA-insulators-improve-safety-of-gene-therapy-for-X-SCID.aspx\"}],\"imageUrl\":\"/covers/live/live-biotech-360-stjude-xscid-insulators-safety.jpg\",\"imageAlt\":{\"en\":\"3D mapping of X-SCID gene therapy reveals genomic features that predict safety\",\"zh-TW\":\"聖猶大兒童研究醫院繪製 X-SCID 基因治療 3D 圖譜揭示安全預測基因特徵\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":74,\"trustBreakdown\":{\"crossCorroboration\":17,\"outletReputation\":23,\"recencyClarity\":21,\"sourceDiversity\":13},\"publishedAt\":\"2026-11-28T04:30:51.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":21,\"D2\":20,\"D3\":21,\"D4\":18,\"D5\":19,\"total\":20},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-biotech-360-stjude-xscid-insulators-safety/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/l
