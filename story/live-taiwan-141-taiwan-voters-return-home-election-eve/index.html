s nine-in-one local elections. At Kaohsiung's Zuoying High Speed Rail station, domestic travelers arriving from northern and central Taiwan mingled with overseas Taiwanese who flew in from the United States, Canada, Switzerland, and Japan specifically to cast ballots in their registered municipalities. In the outlying Penghu archipelago, Magong Airport saw steady arrivals of returning residents, many of whom queued for connecting ferries to smaller secondary islands such as Qimei and Wang'an.\n\nIn Taipei, civic groups organized discounted charter buses departing from Taipei Main Station for young voters heading back to central and southern counties, funded by crowd-sourced donations. Meanwhile, Taiwan High Speed Rail implemented unreserved-seat entry controls at northern stations during peak hours, and highway authorities scheduled over 7,000 intercity bus runs for the election weekend.\n\nThe massive pre-election migration underscores the structural impact of Taiwan's household-registration voting system, which offers neither early voting nor absentee mail-in ballots. Even overseas citizens must physically return to their registered precincts on Election Day to participate, turning intercity transit bottlenecks and youth travel subsidies into pivotal variables for close municipal races.\n\nReports from Focus Taiwan, Formosa News, and Japan's Mainichi Shimbun consistently document the land, air, and sea transit surge alongside overseas arrivals. Mainichi Shimbun additionally highlighted civic crowdfunding for youth buses and discounted cross-strait flights for Taiwanese businesspeople, while Formosa News focused on passenger interviews at Zuoying and Penghu's island ferry operations.\n\nWhether the strong election-eve travel volume translates into higher overall turnout on Saturday—particularly among younger voters and outlying-island residents—remains uncertain until polls close and ballots are tallied.\n\nTrust label: Multi-source agreement —Domestic and international outlets independently report the election-eve return transit wave across Taiwan's rail, air, and ferry networks."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-141-taiwan-voters-return-home-election-eve\",\"category\":\"taiwan\",\"title\":{\"en\":\"Taiwanese Voters Return Home via Land, Air, and Sea Ahead of Local Elections\",\"zh-TW\":\"九合一投票日前夕海陸空湧返鄉潮 海外遊子與跨縣市選民趕赴戶籍地\"},\"summary\":{\"en\":\"On the eve of Taiwan's November 28 nine-in-one local elections, heavy return traffic surged across high-speed rail stations, airports, and island ferries as domestic and overseas voters traveled back to their registered household districts. Because Taiwan requires in-person voting at one's registered domicile without absentee ballots, election-eve transit capacity remains a decisive factor in turnout.\",\"zh-TW\":\"台灣九合一地方選舉將於11月28日投票，前夕全台高鐵、機場與離島交通船湧現返鄉人潮，不少旅居美國、加拿大、瑞士及日本的僑民亦專程搭機返台。由於台灣現行制度規定須回戶籍地親自投票、未設不在籍投票，選前海陸空疏運量能與青年返鄉動能成為牽動投票率的關鍵變數。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n2026年11月27日，距離台灣九合一地方選舉投票僅剩一天，全台主要交通樞紐湧現大規模返鄉人潮。高鐵左營站大廳擠滿拖著行李箱的旅客，除自北中部南下的民眾外，亦有多位旅居美國、加拿大、瑞士與日本的國人專程搭機返台投票。澎湖馬公機場同樣人潮不斷，不少鄉親落地後隨即排隊轉乘交通船前往七美、望安等二級離島。台北車站周邊則有公民團體發起募資包車，協助青年選民返鄉；交通部與雙鐵、國道客運亦同步加開班次並啟動人流管制。\\n\\n「為什麼重要」\\n由於台灣現行選舉制度採戶籍地親自投票，未開放不在籍投票或提前投票，所有設籍選民與海外國人都必須在投票日當天親赴戶籍地投票所。選前海陸空疏運是否順暢、青年與海外選民的返鄉意願高低，往往直接左右選情膠著縣市的最終勝負。\\n\\n「來源異同」\\n民視英語新聞（Formosa News）、中央社英文網（Focus Taiwan）及日本《每日新聞》（Mainichi Shimbun）均一致報導11月27日全台陸海空返鄉疏運盛況與海外選民返台現象。《每日新聞》進一步補充公民團體募資125萬新台幣補助青年車資，以及大陸台商割引機票動態；民視則聚焦高鐵左營站與澎湖離島船運的現場訪談細節。\\n\\n「仍不確定」\\n選前交通樞紐的返鄉熱度能否在11月28日實際轉化為高於上屆的全國投票率，以及青年與海外返鄉選票對各縣市戰局的具體影響，仍有待投票日結束開票後才能確認。\\n\\nTrust label: Multi-source agreement — 國內外多家媒體獨立報導台灣選前一日海陸空返鄉人潮與交通疏運實況。\"},\"glossary\":[{\"term\":{\"en\":\"Nine-in-one local elections\",\"zh-TW\":\"九合一地方選舉\"},\"blurb\":{\"en\":\"Taiwan's nationwide local election cycle held every four years to fill nine categories of municipal, county, and local offices simultaneously.\",\"zh-TW\":\"台灣每四年舉行一次的全國性地方公職人員選舉，同日選出直轄市長、縣市長、議員及村里長等九類地方公職。\"}},{\"term\":{\"en\":\"Household registration voting\",\"zh-TW\":\"戶籍地投票制\"},\"blurb\":{\"en\":\"Taiwan's electoral rule requiring citizens to cast ballots in person at the precinct where their household registration is recorded.\",\"zh-TW\":\"台灣現行投票規定，選民必須在投票日當天親自前往戶籍所在地指定的投開票所領票，不設通訊或境外投票。\"}},{\"term\":{\"en\":\"Secondary offshore islands\",\"zh-TW\":\"二級離島\"},\"blurb\":{\"en\":\"Smaller outlying islands such as Qimei and Wang'an in Penghu that require ferry connections from a main island airport.\",\"zh-TW\":\"指澎湖七美、望安等須先搭機抵馬公後再轉乘交通船前往的較小離島，選前海運接駁對當地投票率尤為關鍵。\"}}],\"sources\":[{\"name\":\"Formosa News\",\"url\":\"https://english.ftvnews.com.tw/news/2026B27W01EA\"},{\"name\":\"Mainichi Shimbun\",\"url\":\"https://mainichi.jp/articles/20261127/k00/00m/030/347000c\"},{\"name\":\"Taiwan News\",\"url\":\"https://www.taiwannews.com.tw/en/news/6481638\"}],\"imageUrl\":\"/covers/live/live-taiwan-141-taiwan-voters-return-home-election-eve.jpg\",\"imageAlt\":{\"en\":\"Travelers carrying luggage at a Taiwan High Speed Rail station ahead of local elections\",\"zh-TW\":\"九合一選舉前夕高鐵站湧現提著行李返鄉投票的旅客人潮\"},\"isHeadline\":false,\"isPopular\":true,\"trustScore\":84,\"trustBreakdown\":{\"crossCorroboration\":21,\"outletReputation\":21,\"recencyClarity\":22,\"sourceDiversity\":20},\"publishedAt\":\"2026-11-27T17:16:28.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":21,\"D2\":22,\"D3\":21,\"D4\":21,\"D5\":20,\"total\":21},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\
