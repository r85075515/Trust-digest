sessments of financial system stability, banking and mutual fund stress tests, and regional risk mitigation measures.\n\n「Why it matters」 Stress test findings and risk-resolution disclosures show how regulators gauge bank capital buffers, liquidity coverage, and vulnerabilities across financial institutions. For market participants, the report signals policy continuity around liquidity support and risk containment.\n\n「Source differences」 Coverage highlights banking stress test resilience and liquidity pass rates across tested institutions, while companion reporting also notes mutual fund liquidity stress tests and early-correction measures for higher-risk banks.\n\n「Still uncertain」 Specific institution-level remediation timelines, credit quality shifts in coming quarters, and detailed execution metrics for risk-reduction plans remain subject to ongoing supervisory follow-up.\n\nTrust label: Multi-source agreement across financial news outlets reporting on the Nov. 27 PBOC financial stability report."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-201-pboc-financial-stability-report-2026\",\"category\":\"finance\",\"title\":{\"en\":\"PBOC Releases 2026 Financial Stability Report with Stress Tests\",\"zh-TW\":\"中國人民銀行發布《中國金融穩定報告（2026）》 公布銀行與基金壓力測試\"},\"summary\":{\"en\":\"China's central bank released its 2026 Financial Stability Report on Nov. 27, 2026, detailing banking and public fund stress test results alongside regional risk oversight. The takeaway is that officials report overall resilience while continuing targeted risk management.\",\"zh-TW\":\"中國人民銀行於 2026 年 11 月 27 日發布《中國金融穩定報告（2026）》，公布銀行業與公募基金壓力測試結果及區域風險處置進展。關鍵結論是官方評估金融體系整體穩健，同時持續推進重點領域風險防範與早期糾正。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」2026 年 11 月 27 日，中國人民銀行發布《中國金融穩定報告（2026）》，評估金融體系穩健性，並公布銀行業與公募基金壓力測試結果及區域風險化解情況。\\n\\n「為什麼重要」壓力測試與風險處置資訊有助外界觀察金融機構資本緩衝、流動性承壓能力與潛在脆弱點。對市場而言，報告反映監管單位在維持流動性與防範系統性風險上的政策基調。\\n\\n「來源異同」部分報導聚焦銀行業壓力測試抵禦能力與不同情境下的流動性通過率；另一些報導則補充公募基金壓力測試及對高風險銀行採取早期糾正措施的細節。\\n\\n「仍不確定」個別機構後續整改進度、未來幾季資產品質變化，以及風險化解措施的實際執行成效，仍有待監管後續追蹤觀察。\\n\\nTrust label: Multi-source agreement across financial news coverage on the Nov. 27 PBOC financial stability report.\"},\"glossary\":[{\"term\":{\"en\":\"Stress test\",\"zh-TW\":\"壓力測試\"},\"blurb\":{\"en\":\"A regulatory simulation assessing how financial institutions perform under severe economic or market shocks.\",\"zh-TW\":\"監管機構用以評估金融機構在假設的極端市場或經濟衝擊下，資本與流動性承受能力的模擬測試。\"}},{\"term\":{\"en\":\"Liquidity coverage\",\"zh-TW\":\"流動性承壓能力\"},\"blurb\":{\"en\":\"A bank or fund's ability to meet short-term cash outflows and redemption demands without forced asset sales.\",\"zh-TW\":\"金融機構或基金在面臨短期資金流出或贖回壓力時，以自有或高流動性資產支應需求的能力。\"}},{\"term\":{\"en\":\"Early correction\",\"zh-TW\":\"早期糾正\"},\"blurb\":{\"en\":\"Supervisory measures applied to weaker institutions—such as capital replenishment or asset limits—before problems escalate.\",\"zh-TW\":\"監管機關在風險擴大前，對體質較弱機構採取補充資本、控管資產或降槓桿等早期干預措施。\"}}],\"sources\":[{\"name\":\"澎湃新聞\",\"url\":\"https://www.thepaper.cn/newsDetail_forward_34576402\"},{\"name\":\"新浪財經\",\"url\":\"https://finance.sina.com.cn/jjxw/2026-11-27/doc-inkaesnc3180005.shtml\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"PBOC Releases 2026 Financial Stability Report with Stress Tests\",\"zh-TW\":\"中國人民銀行發布《中國金融穩定報告（2026）》 公布銀行與基金壓力測試\"},\"isHeadline\":false,\"isPopular\":true,\"trustScore\":82,\"trustBreakdown\":{\"crossCorroboration\":21,\"outletReputation\":21,\"recencyClarity\":22,\"sourceDiversity\":18},\"publishedAt\":\"2026-11-27T19:20:45.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":22,\"D2\":21,\"D3\":21,\"D4\":22,\"D5\":20,\"total\":21},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Ax
