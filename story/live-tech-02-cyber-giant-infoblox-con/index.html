and the scale of the breach — and for now, the scale is the open question.\nWhat happened\nInfoblox confirmed the incident after hackers reached company information, according to TechCrunch. The company is working with external investigators to establish how far the breach goes. The feed material gives no detail on what information was accessed, how the hackers got in, when the incident was detected, or whether customers or their data were affected.\nWhy it matters\nA breach at a cybersecurity vendor carries a double weight: the company sells protection, so an incident against it invites questions about its own defences — and its customers will want to know whether their networks are exposed. The takeaway: the confirmation is the news, but the scope is the story; until Infoblox says what was taken, the incident's seriousness cannot be judged.\nSources agree / disagree\nThis card rests on TechCrunch alone. There is no second outlet in the material to corroborate the incident or the company's account, so the breach is reported, not independently confirmed.\nStill uncertain\nWhat was accessed, how the attackers entered, when it happened, how many systems or customers are affected, and whether any customer data was exposed were not in the feed material. Verify them in the full TechCrunch reporting and any Infoblox statement.\nTrust label: Single source — TechCrunch only, with no corroboration in the material at hand."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-tech-02-cyber-giant-infoblox-con\",\"category\":\"tech\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-tech-02-cyber-giant-infoblox-con.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Cyber giant Infoblox confirms security incident after hackers access ‘company information’\",\"zh-TW\":\"相關封面圖：網路巨擘 Infoblox 確認駭客存取「公司資訊」後發生安全事件\"},\"publishedAt\":\"2026-11-16T22:12:31.000Z\",\"title\":{\"en\":\"Infoblox Confirms Security Incident After Hackers Reach Company Information\",\"zh-TW\":\"Infoblox 證認安全事件：駭客已存取公司資訊\"},\"summary\":{\"en\":\"[Unconfirmed · Single source] Cybersecurity giant Infoblox has confirmed a security incident after hackers accessed company information, TechCrunch reports. The company says it is working with outside investigators to understand the scale of the breach. Takeaway: a security company breached is a story in itself; the scope is still unknown.\",\"zh-TW\":\"［未證實·單一來源］網路安全巨頭 Infoblox 證認一起安全事件：駭客已存取「公司資訊」，據 TechCrunch 報導。公司表示正與外部調查人員合作，了解外洩規模。結論：資安公司自己遭入侵，本身就是新聞；影響範圍仍未知。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"網路安全與自動化巨頭 Infoblox 證認一起安全事件：駭客已存取「公司資訊」，據 TechCrunch 報導。公司表示正與外部調查人員合作，了解外洩規模——而規模正是目前未解的問題。\\n發生了什麼事\\n據 TechCrunch 報導，Infoblox 在駭客存取公司資訊後證認了這起事件。公司正與外部調查人員合作，確認外洩範圍。摘要沒有說明哪些資訊被存取、駭客如何入侵、何時發現事件、以及客戶或其資料是否受影響。\\n為什麼重要\\n資安廠商遭入侵有雙重分量：公司賣的是防護，自身出事會引發對其防禦的質疑——客戶也會想知道自己的網路是否暴露。結論是：證認本身就是新聞，但影響範圍才是故事；在 Infoblox 說明拿走了什麼之前，無從判斷事件的嚴重程度。\\n來源異同\\n本卡只有 TechCrunch 一家來源。材料中沒有第二家媒體可以佐證事件或公司的說法，因此這起外洩是「據報導」，而非「經獨立證實」。\\n仍不確定\\n哪些資訊被存取、攻擊者如何入侵、何時發生、多少系統或客戶受影響、客戶資料是否外洩，摘要都沒有，引用前請查 TechCrunch 完整報導與 Infoblox 的任何聲明。\"},\"sources\":[{\"name\":\"TechCrunch\",\"url\":\"https://techcrunch.com/2026/11/16/cyber-giant-infoblox-confirms-security-incident-after-hackers-access-company-information/\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":18,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"tech\",\"live-ingest\",\"techcrunch\"],\"glossary\":[{\"term\":{\"en\":\"Infoblox\",\"zh-TW\":\"Infoblox\"},\"blurb\":{\"en\":\"Cybersecurity and automation company that confirmed the incident.\",\"zh-TW\":\"證認這起事件的網路安全與自動化公司。\"}},{\"term\":{\"en\":\"TechCrunch\",\"zh-TW\":\"TechCrunch\"},\"blurb\":{\"en\":\"Tech outlet that reported the breach.\",\"zh-TW\":\"報導這起外洩的科技媒體。\"}},{\"term\":{\"en\":\"Data breach\",\"zh-TW\":\"資料外洩\"},\"blurb\":{\"en\":\"Unauthorized access to company information.\",\"zh-TW\":\"未經授權存取公司資訊。\"}},{\"te
