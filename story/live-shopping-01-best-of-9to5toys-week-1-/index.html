nese Loop version at 799 dollars; and a natural Desert Alpine version at 699 dollars. The edition also highlights AirPods Pro 3 at 50 dollars off, and mentions Apple TV 4K pre-orders alongside the watch deals.\nWhy it matters\nFor shoppers, the roundup's value is the concentration of early Black Friday pricing in one place before the main event, including what it describes as all-time low pricing on several Google Pixel 11 series phones at up to 350 dollars off. The Apple Watch Ultra 4 listings cluster around two price points, 699 and 799 dollars, against regular prices of 799 and 899 dollars, which the companion item describes as nearly 100 dollars off and a return to an all-time low.\nSources agree / disagree\nBoth items in this cluster come from the same outlet, 9to5Toys: the weekly roundup itself and a companion item on the Apple Watch Ultra 4 dropping back to an all-time low. Figures differ across the headlines and snippets, flagged as 4 versus 1, reflecting the Ultra 4 model number appearing alongside the Week 1 edition number.\nTrust label: Single source — All pricing in this cluster comes from one outlet's own deal tracking, with no independent price check in the cluster.\nStill uncertain\nPrices in deal roundups change quickly, and the snippets are truncated, so some listings, including the Apple TV 4K mention and the full Pixel range, are incomplete here. The roundup does not, in the available text, say how long any of these prices will remain available."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-shopping-01-best-of-9to5toys-week-1-\",\"category\":\"shopping\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-shopping-01-best-of-9to5toys-week-1-.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Best of 9to5Toys – Week 1 early Black Friday edition: Apple Watch Ultra, AirTag 2, Pixel 11/Watch 5, more\",\"zh-TW\":\"相關封面圖：Best of 9to5Toys – 第 1 週黑色星期五早期版：Apple Watch Ultra、AirTag
