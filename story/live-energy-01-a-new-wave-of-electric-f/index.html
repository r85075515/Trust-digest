 States, some of which can fly.\nWhat happened\nReplacing diesel-powered ferries with electric vessels could reduce emissions and improve air quality, according to the Guardian Environment report. Eric Laakmann, chief executive and co-founder of Vessev, said the boat is quite a curiosity at the moment. The truncated summary does not state what kind of vessel it was, how it flies, where it operates, or how many ferries are involved. The headline says some ferries even fly, but the text provided no explanation, technical detail, or other named ferry, operator, or location beyond New York Harbor.\nWhy it matters\nThe judgment is direct: if electric ferries replace diesel vessels, the benefit is cleaner air and lower emissions on harbor routes, but one curious boat does not prove that scale. Readers should watch for named operators, routes, and deployment numbers before treating the wave as established.\nSources agree / disagree\nOnly The Guardian Environment reported this item, so no second outlet corroborates the emissions claim, the vessel, or the flying-ferry headline. Trust label: Single source — one outlet reported the item.\nStill uncertain\nThe truncated summary did not state the vessel's name, type, propulsion, flying mechanism, operator, or route. It did not state which ferries fly or what evidence supports the emissions claim. Verify the full reporting before quoting the flying claim."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-energy-01-a-new-wave-of-electric-f\",\"category\":\"energy\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-energy-01-a-new-wave-of-electric-f.jpg\",\"imageAlt\":{\"en\":\"Cover related to: A new wave of electric ferries is here in the US. Some even fly\",\"zh-TW\":\"相關封面圖：美國掀起了新一波電動渡輪浪潮。有的甚至會飛\"},\"publishedAt\":\"2026-10-29T10:00:31.000Z\",\"title\":{\"en\":\"Vessev Electric Ferries Draw Attention in New York Harbor\",\"zh-TW\":\"Vessev 電動渡輪在紐約港引起注意\"},\"summary\":{\"en\":\"[Unverified, single source] A small white electric boat in New York Harbor drew attention from sightseeing ferry passengers as electric ferries arrive in the United States. Replacing diesel ferries could cut emissions, but the truncated report gives no vessel, route, or deployment details. The flying-ferry headline claim remains unexplained.\",\"zh-TW\":\"[未證實·單一來源]一艘白色小電動船在紐約港引起觀光渡輪乘客注意，美國新一波電動渡輪據稱可減少排放、改善空氣品質；但截斷的報導未提供船隻、航線或部署細節，實際規模仍待核實。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"一艘白色小電動船在自由女神像陰影下穿過紐約港，引起附近觀光渡輪乘客注意；美國正出現新一波電動渡輪，其中有些甚至會飛。\\n發生了什麼事\\n根據 The Guardian Environment 的單一報導，以電動船取代柴油動力渡輪可以減少排放並改善空氣品質。文中描述的船隻體型小、顏色為白色，Vessev 執行長兼共同創辦人 Eric Laakmann 表示，目前這相當引人好奇。截斷的摘要到此為止，沒有說明這是哪種船隻、如何飛行、在哪裡營運，也沒有說明涉及多少艘渡輪。標題稱有些渡輪甚至會飛，但提供的摘要文字沒有解釋這項說法，也沒有技術細節，也沒有其他具名的渡輪、營運商或紐約港以外的地點。\\n為什麼重要\\n判斷很直接：如果電動渡輪大規模取代柴油船隻，好處是繁忙港口航線的空氣更乾淨、排放更低，但紐約港一艘引人好奇的小船並不能證明這種規模。報導的價值在於顯示公眾對新型船隻的關注，而非證明整個船隊已經轉型；讀者應等待具名的營運商、航線與部署數字，再判斷這波浪潮是否成真。\\n來源異同\\n提供的材料中只有 The Guardian Environment 報導此事，沒有第二家媒體佐證排放說法、船隻本身或會飛的渡輪標題。信任標籤：單一來源——僅一家媒體報導此事。\\n仍不確定\\n截斷的摘要沒有說明船隻名稱、類型、推進方式、飛行機制、營運商、航線、成本或部署規模；沒有說明哪些渡輪會飛、在哪裡營運，也沒有說明支持排放與空氣品質說法的證據。引用會飛的說法或任何部署數字前，請查閱完整報導。\"},\"sources\":[{\"name\":\"The Guardian Environment\",\"url\":\"https://www.theguardian.com/environment/2026/oct/29/us-electric-ferries\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"energy\",\"live-ingest\",\"the-guardian-environment\"],\"glossary\":[{\"blurb\":{\"en\":\"Company whose chief executive commented on the small white boat in New York Harbor.\",\"zh-TW\":\"其執行長評論紐約港白色小船的公司。\"},\"term\":{\"en\":\"Vessev\",\"zh-TW\":\"Vessev\"}},{\"blurb\":{\"en\":\"Chief executive and co-founder of Vessev quoted in the report.\",\"zh-TW\":\"報導中引述的 Vessev 執行長兼共同創辦人。\"},\"term\":{\"en\":\"Eric Laakmann\",\"zh-TW\":\"Eric Laakmann\"}},{\"blurb\":{\"en\":\"Outlet that published the single report on electric ferr
