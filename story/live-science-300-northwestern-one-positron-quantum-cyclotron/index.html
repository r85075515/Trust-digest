d demonstrated the first \"one-positron quantum cyclotron,\" trapping a single positron—the antimatter counterpart of an electron—inside a sealed cryogenic Penning trap cooled to roughly 300 millikelvin for months. The researchers cooled the particle's cyclotron motion into its quantum ground state and observed individual quantum transitions nondestructively, publishing the results in Physical Review Letters (DOI: 10.1103/gbkc-6nlj).\n\nWhy it matters\nThe Standard Model predicts that electrons and positrons should have equal and opposite magnetic moments under charge-parity-time (CPT) symmetry. Measuring the positron's magnetic moment at quantum precision could reveal subtle matter-antimatter asymmetries that help explain why matter survived the Big Bang to form the universe.\n\nSource differences\nPhysical Review Letters (\"One-Positron Quantum Cyclotron | Phys. Rev. Lett. - APS Journals\") details the experimental apparatus, including a 4.2 K superconducting solenoid, 300 mK dilution refrigerator enclosure, and quantum nondemolition detection of single-quantum spin and cyclotron jumps. ScienceDaily (\"Physicists trap antimatter in a breakthrough that could explain why the universe exists\") highlights Northwestern's November 25, 2026 release quoting Gabrielse on testing the Standard Model's matter-antimatter symmetry with National Science Foundation support (grant 2110565). Physics Magazine (\"Physics - A Quantum Cyclotron for Antimatter - APS Journals\") notes that loading a single positron takes 8 to 11 hours and explains how the device could test electron-positron magnetic moment equality below one part per trillion.\n\nStill uncertain\nActual high-precision measurement values for the positron's dimensionless magnetic moment using the new trap—and whether any deviation from electron measurements emerges—await forthcoming experimental runs.\n\nTrust label: Official confirmation — Verified via the peer-reviewed Physical Review Letters study, APS Physics commentary, and Northwestern's ScienceDaily release."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-science-300-northwestern-one-positron-quantum-cyclotron\",\"category\":\"science\",\"title\":{\"en\":\"Northwestern Physicists Trap Single Antimatter Positron in Quantum Cyclotron for Months\",\"zh-TW\":\"西北大學物理團隊打造「單正電子量子迴旋加速器」 成功囚禁單一反物質粒子數月\"},\"summary\":{\"en\":\"Physicists led by Gerald Gabrielse at Northwestern University realized the first one-positron quantum cyclotron, suspending a single antimatter positron in a cryogenic Penning trap for months and cooling it to its lowest quantum energy state. Published in Physical Review Letters, the setup enables ultra-precise comparisons between matter and antimatter magnetic moments.\",\"zh-TW\":\"美國西北大學物理學家傑拉爾德・加布里埃爾斯（Gerald Gabrielse）團隊首度實現「單正電子量子迴旋加速器」，在接近絕對零度的彭寧離子阱中將單一反物質正電子懸浮囚禁長達數月，並冷卻至最低量子基態。該研究發表於《物理評論快報》，為史上最精確檢驗物質與反物質磁矩對稱性鋪路。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」美國西北大學物理與天文學系教授傑拉爾德・加布里埃爾斯（Gerald Gabrielse）領導的研究團隊，成功建構全球首座「單正電子量子迴旋加速器」（one-positron quantum cyclotron），在冷卻至約 300 毫開爾文（mK）的真空彭寧離子阱（Penning trap）中，將電子的反物質對應粒子「正電子」單獨懸浮囚禁數月不致湮滅，並將其迴旋運動冷卻至最低量子基態。該成果已正式刊登於《物理評論快報》（Physical Review Letters，DOI: 10.1103/gbkc-6nlj）。\\n\\n「為什麼重要」粒子物理學標準模型預測電子與正電子的磁矩大小完全相等、方向相反（CPT 對稱性）。透過量子迴旋加速器將正電子磁矩測量精度推向兆分之一以下，有望偵測物質與反物質之間的細微不對稱性，進而解答宇宙大爆炸後為何是物質主導宇宙的核心謎題。\\n\\n「來源異同」《物理評論快報》論文頁（原文標題：\\\"One-Positron Quantum Cyclotron | Phys. Rev. Lett. - APS Journals\\\"）詳述 4.2 K 超導螺線管磁場、300 mK 稀釋製冷機真空腔與量子非破壞性（QND）單量子躍遷觀測技術；ScienceDaily（原文標題：\\\"Physicists trap antimatter in a breakthrough that could explain why the universe exists\\\"）摘錄西北大學新聞稿，引述加布里埃爾斯說明若電子與正電子磁矩出現差異將成為百年來物理學最大發現；美國物理學會《Physics》評論（原文標題：\\\"Physics - A Quantum Cyclotron for Antimatter - APS Journals\\\"）則補充捕獲單一正電子需耗時 8 至 11 小時，並解析其突破 60 年前古典測量極限的意義。\\n\\n「仍不確定」研究團隊利用該新裝置測得的正電子無因次磁矩最終精確數值，以及是否會觀測到偏離電子數值的異常訊號，仍待下一階段精密測量實驗揭曉。\\n\\nTrust label: Official confirmation — 以《物理評論快報》同儕審查論文與美國物理學會《Physics》專文為依據，並獲 ScienceDaily 報導印證。\"},\"glossary\":[{\"term\":{\"en\":\"Positron\",\"zh-TW\":\"正電子\"},\"blurb\":{\"en\":\"The antimatter counterpart of the electron, possessing the same mass and spin but an opposite positive electric charge.\",\"zh-TW\":\"電子的反物質對應粒子，具有與電子相同的質量與自旋，但帶有相反的正電荷。\"}},{\"term\":{\"en\":\"Penning trap\",\"zh-TW\":\"彭寧離子阱\"},\"blurb\":{\"en\":\"A storage device that uses a combination of strong homogeneous magnetic fields and quadrupole electric fields to confine charged particles without physical walls.\",\"zh-TW\":\"結合強均勻磁場與四極電場將帶電粒子懸浮約束於真空中央、避免與器壁接觸湮滅的精密物理裝置。\"}},{\"term\":{\"en\":\"CPT symmetry\",\"zh-TW\":\"CPT 對稱性\"},\"blurb\":{\"en\":\"A fundamental principle of quantum field theory stating that physical laws remain unchanged under simultaneous charge conjugation, parity transformation, and time reversal.\",\"zh-TW\":\"量子場論的基本對稱原理，指物理定律在電荷共軛、宇稱反演與時間反演同時變換下保持不變。\"}}],\"sources\":[{\"name\":\"Physical Review Letters\",\"url\":\"https://link.aps.org/doi/10.1103/gbkc-6nlj\"},{\"name\":\"Physics Magazine\",\"url\":\"https://link.aps.org/doi/10.1103/Physics.19.132\"},{\"name\":\"ScienceDaily\",\"url\":\"https://www.sciencedaily.com/releases/2026/11/261124055849.htm\"}],\"imageUrl\":\"/covers/live/live-science-300-northwestern-one-positron-quantum-cyclotron.webp\",\"imageAlt\":{\"en\":\"Northwestern Physicists Trap Single Antimatter Positron in Quantum Cyclotron for Months\",\"zh-TW\":\"西北大學物理團隊打造「單正電子量子迴旋加速器」 成功囚禁單一反物質粒子數月\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":91,\"trustBreakdown\":{\"crossCorroboration\":23,\"outletReputation\":24,\"recencyClarity\":21,\"sourceDiversity\":23},\"publishedAt\":\"2026-11-28T01:07:55.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":23,\"D2\":23,\"D3\":23,\"D4\":22,\"D5\":22,\"total\":23},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><sc
