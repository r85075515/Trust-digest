mpacts, such as Nepal, which has suffered glacier collapse.\n\nWhy it matters\nElectrification, replacing fossil fuels with clean electricity across transport, heating and industry, is central to cutting emissions, and the companies argue the talks should focus on removing the barriers to it. At the same time, the large fossil-fuel-linked presence at the summit raises questions about whose interests shape the negotiations.\n\nSources agree and disagree\nTwo outlets covered the summit from different angles: ESG Dive on the companies' call, and The Guardian on the fossil-fuel-linked delegations. Their headline figures, over 180 and more than 100, count different groups and are not directly comparable, so they should be read side by side rather than treated as a contradiction.\n\nStill uncertain\nThe feed descriptions do not say what specific steps the companies want the presidency to take, how the presidency has responded, or how large the summit's total attendance is. Those details need the publishers' full reporting.\n\nTrust label: Accounts differ — two outlets report different figures because they count different groups at the talks."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-energy-01-over-180-companies-call-\",\"category\":\"energy\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-energy-01-over-180-companies-call-.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Over 180 companies call on COP31 presidency to fix electrification bottleneck\",\"zh-TW\":\"相關封面圖：超過180家公司呼籲COP31主席解決電氣化瓶頸\"},\"publishedAt\":\"2026-11-13T12:13:29.000Z\",\"title\":{\"en\":\"Over 180 Companies Urge COP31 Presidency to Fix Electrification Bottleneck\",\"zh-TW\":\"逾 180 家企業籲第 31 屆聯合國氣候變化大會（COP31）主席國解決電氣化瓶頸\"},\"summary\":{\"en\":\"More than 180 companies, including H\u0026M Group, Danone, IKEA and Uber, are calling on the COP31 presidency to focus the climate talks on accelerating electrification. ⚠ Figures differ across outlets and are unconfirmed: a separate Guardian analysis counts more than 100 fossil-fuel-linked companies and groups with delegations at the talks.\",\"zh-TW\":\"逾 180 家企業，包括 H\u0026M 集團（H\u0026M Group）、達能（Danone）、宜家（IKEA）與優步（Uber），呼籲第 31 屆聯合國氣候變化大會（COP31）主席國聚焦加速電氣化。⚠ 說法衝突，尚未證實：另有分析統計，超過 100 家與化石燃料相關的企業與團體派出代表團參加本次談判，兩組數字統計對象不同。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"發生了什麼事\\n逾 180 家企業，包括 H\u0026M 集團（H\u0026M Group）、達能（Danone）、宜家（IKEA）與優步（Uber），呼籲第 31 屆聯合國氣候變化大會（COP31）主席國聚焦加速電氣化，解決電氣化瓶頸。第 31 屆聯合國氣候變化大會在土耳其安塔利亞（Antalya）舉行。另據《衛報》（The Guardian）引述的一項分析，超過 100 家與化石燃料利益相關的企業與行業團體派出代表團參加本次談判，其代表團人數超過部分最易受氣候影響的國家，例如曾遭遇冰川崩塌的尼泊爾（Nepal）。\\n\\n為什麼重要\\n電氣化——以潔淨電力取代交通、供暖與工業的化石燃料——是減排的核心，企業主張談判應聚焦排除相關障礙。與此同時，化石燃料相關團體在會場的大量存在，也引發外界關注誰的利益正在左右談判。\\n\\n來源異同\\nESG Dive 報導企業的呼籲，《衛報》（The Guardian）報導化石燃料相關代表團的規模，兩家媒體切入角度不同；標題數字「逾 180 家」與「超過 100 家」統計的對象不同，無法直接比較，不應視為互相矛盾。\\n\\n仍不確定\\n摘要未說明企業要求主席國採取哪些具體措施、主席國如何回應，也未提及大會總出席人數，須以完整報導為準。\"},\"sources\":[{\"name\":\"ESG Dive\",\"url\":\"https://www.esgdive.com/news/over-180-companies-call-on-cop31-presidency-to-fix-electrification-bottleneck/874278/\"},{\"name\":\"The Guardian Climate Crisis\",\"url\":\"https://www.theguardian.com/environment/2026/nov/13/cop31-companies-and-groups-linked-to-fossil-fuels-delegations\"}],\"disagreements\":{\"en\":\"ESG Dive reports over 180 companies calling on the COP31 presidency to fix the electrification bottleneck, while The Guardian reports more than 100 companies and industry groups linked to fossil fuel interests sent delegations to the talks in Turkey. The two figures count different groups and are not directly comparable.\",\"zh-TW\":\"ESG Dive 報導逾 180 家企業呼籲 COP31 主席國解決電氣化瓶頸；《衛報》（The Guardian）則報導，超過 100 家與化石燃料利益相關的企業與行業團體派出代表團參加在土耳其舉行的談判。兩組數字統計的對象不同，無法直接比較。\"},\"trustScore\":64,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":19,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"energy\",\"live-ingest\",\"esg-dive\",\"the-guardian-climate-crisis\"],\"glossary\":[{\"blurb\":{\"en\":\"The 31st UN climate change conference, held in Antalya, Turkey.\",\"zh-TW\":\"在土耳其安塔利亞舉行的第 31 屆聯合國氣候變化大會。\"},\"term\":{\"en\":\"COP31\",\"zh-TW\":\"第 31 屆聯合國氣候變化大會（COP31）\"}},{\"blurb\":{\"en\":\"A global fashion retail group among the companies making the call.\",\"zh-TW\":\"參與連署呼籲的全球服飾零售集團。\"},\"term\":{\"en\":\"H\u0026M Group\",\"zh-TW\":\"H\u0026M 集團（H\u0026M Group）\"}},{\"blurb\":{\"en\":\"A multinational food company among the companies making the call.\",\"zh-TW\":\"參與連署呼籲的跨國食品公司。\"},\"term\":{\"en\":\"Danone\",\"zh-TW\":\"達能（Danone）\"}},{\"blurb\":{\"en\":\"A multinational furniture retailer among the companies making the call.\",\"zh-TW\":\"參與連署呼籲的跨國家具零售商。\"},\"term\":{\"en\":\"IKEA\",\"zh-TW\":\"宜家（IKEA）\"}},{\"blurb\":{\"en\":\"A ride-hailing and delivery company among the companies making the call.\",\"zh-TW\":\"參與連署呼籲的叫車與外送平台公司。\"},\"term\":{\"en\":\"Uber\",\"zh-TW\":\"優步（Uber）\"}},{\"blurb\":{\"en\":\"The Turkish city hosting the COP31 climate summit.\",\"zh-TW\":\"舉辦第 31 屆聯合國氣候變化大會的土耳其城市。\"},\"term\":{\"en\":\"Antalya\",\"zh-TW\":\"安塔利亞（Antalya）\"}},{\"blurb\":{\"en\":\"A country cited as highly vulnerable to climate impacts, including glacier collapse.\",\"zh-TW\":\"被提及為極易受氣候影響、曾遭遇冰川崩塌的國家。\"},\"term\":{\"en\":\"Nepal\",\"zh-TW\":\"尼泊爾（Nepal）\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-energy-01-over-180-companies-call-/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",
