 CNA's relay of the Reuters report.\n\nWhat happened\nReuters reports TSMC is weighing a $22.6 billion investment to build chip manufacturing facilities in Brazos County, Texas. A TSMC business unit has informed Texas officials that property tax relief will be decisive for the project.\n\nWhy it matters\nA $22.6 billion plant would deepen TSMC's manufacturing footprint in the United States and test how far Texas will go with tax incentives to win advanced chip capacity. The tax decision now sits on the critical path of a major supply-chain investment.\n\nSources agree and disagree\nThe story rests on a single CNA item relaying Reuters. No second outlet in this batch confirms the figure, the location or the tax condition.\n\nStill uncertain\nTSMC has not publicly confirmed the plan in the material available, and no timeline, process node or job figures were reported. The size of the tax relief sought and the deadline for Texas to decide are also unknown.\n\nTrust label: Single source — one CNA item relaying Reuters; unconfirmed by TSMC."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-02-hebe9b9b9\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-taiwan-02-hebe9b9b9.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 路透：台積電評估德州設廠　房產稅減免成關鍵條件\",\"zh-TW\":\"相關封面圖：（譯文待補）路透：台積電評估德州設廠　房產稅減免成關鍵條件\"},\"publishedAt\":\"2026-11-24T10:35:23.000Z\",\"title\":{\"en\":\"TSMC Weighs $22.6 Billion Texas Chip Plant as Property Tax Relief Becomes Deciding Factor\",\"zh-TW\":\"台積電（TSMC）評估德州設廠，226 億美元投資案以房產稅減免為關鍵\"},\"summary\":{\"en\":\"[Unverified, single source] Reuters reports TSMC is considering a $22.6 billion chip plant in Brazos County, Texas, with property tax relief as the deciding factor, according to CNA. A TSMC business unit has told Texas officials the incentive will determine the project. Watch whether Texas grants the relief and TSMC confirms the plan.\",\"zh-TW\":\"［未證實·單一來源］路透社報導，台積電（TSMC）有意在美國德州布拉左斯郡（Brazos County）投資 226 億美元興建晶片製造設施；台積電旗下事業單位已告知德州官員，房產稅減免是決定性因素。後續看德州是否給予減免、台積電是否證實計畫。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"路透社報導，台積電（TSMC）有意在美國德州布拉左斯郡（Brazos County）投資 226 億美元興建晶片製造設施，房產稅減免是決定性因素。台積電旗下事業單位已告知德州官員，計畫能否推進取決於能否取得稅賦優惠。\\n\\n發生了什麼事\\n路透社報導，台積電評估在德州布拉左斯郡投資 226 億美元興建晶片製造設施。台積電旗下事業單位已向德州官員表示，房產稅減免將是計畫的決定性因素。\\n\\n為什麼重要\\n226 億美元的設廠案將加深台積電在美國的製造布局，也考驗德州願意以多大的稅賦優惠爭取先進晶片產能。稅賦決定已成為這項重大供應鏈投資的關鍵路徑。\\n\\n來源異同\\n本則消息僅有一則中央社（CNA）轉述路透社的報導。本批次沒有第二家媒體證實投資金額、地點或稅賦條件。\\n\\n仍不確定\\n現有素材中台積電並未公開證實這項計畫，也未報導時程、製程節點或就業人數。台積電爭取的減免規模、德州決定的期限同樣不明。\\n\\n信任標籤：單一來源——僅一則中央社轉述路透社的報導，台積電尚未證實。\"},\"sources\":[{\"name\":\"中央社-產經證券\",\"url\":\"https://www.cna.com.tw/news/afe/202611240263.aspx\"}],\"disagreements\":null,\"trustScore\":59,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"中央社-產經證券\"],\"glossary\":[{\"term\":{\"en\":\"TSMC\",\"zh-TW\":\"台積電（TSMC）\"},\"blurb\":{\"en\":\"Taiwan Semiconductor Manufacturing Company, the world's largest contract chipmaker.\",\"zh-TW\":\"全球最大的晶圓代工廠。\"}},{\"term\":{\"en\":\"Brazos County\",\"zh-TW\":\"布拉左斯郡（Brazos County）\"},\"blurb\":{\"en\":\"A county in Texas, the reported site of the planned plant.\",\"zh-TW\":\"美國德州的一個郡，報導中計畫設廠的地點。\"}},{\"term\":{\"en\":\"Reuters\",\"zh-TW\":\"路透社（Reuters）\"},\"blurb\":{\"en\":\"International news agency that first reported the plan.\",\"zh-TW\":\"率先報導這項計畫的國際通訊社。\"}},{\"term\":{\"en\":\"CNA\",\"zh-TW\":\"中央社（CNA）\"},\"blurb\":{\"en\":\"Taiwan's national news agency, which relayed the Reuters report.\",\"zh-TW\":\"轉述路透社報導的台灣國家通訊社。\"}},{\"term\":{\"en\":\"Property tax relief\",\"zh-TW\":\"房產稅減免\"},\"blurb\":{\"en\":\"A tax incentive on real estate, here the deciding factor for the plant.\",\"zh-TW\":\"針對不動產的稅賦優惠，此案的決定性因素。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"c
