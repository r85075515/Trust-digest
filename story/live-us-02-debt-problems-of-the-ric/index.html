 driven by high interest rates and other global shocks hitting their economies. The NYT frames the story as the debt problems of the richest countries trickling down to the poorest.\nWhy it matters\nWhen the poorest borrowers carry record debt at high rates, servicing it crowds out health, education, and climate spending. A rich-world rate cycle becomes a developing-world fiscal crisis — and the countries least able to absorb the shock pay the most.\nSources agree / disagree\nOnly one outlet, NYT Economy, carries this item in the batch, so there is no second source to corroborate the $9.4 trillion figure. Trust label: Single source — one NYT report; no corroboration from a second outlet in this batch.\nStill uncertain\nThe snippet gives no time frame for the jump, no country breakdown, and no debt composition, and it does not state the underlying source of the $9.4 trillion figure. Verify details on the publisher page."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-us-02-debt-problems-of-the-ric\",\"category\":\"us\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-us-02-debt-problems-of-the-ric.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Debt Problems of the Richest Countries Are Trickling Down to the Poorest\",\"zh-TW\":\"相關封面圖：（譯文待補）Debt Problems of the Richest Countries Are Trickling Down to the Poorest\"},\"publishedAt\":\"2026-11-17T08:45:15.000Z\",\"title\":{\"en\":\"Developing Countries' Debt Hits $9.4 Trillion as Rich Nations' Strains Trickle Down\",\"zh-TW\":\"開發中國家債務衝上 9.4 兆美元　富國債務問題向下蔓延\"},\"summary\":{\"en\":\"[Unconfirmed · Single source] The debt load of developing countries jumped to $9.4 trillion as high interest rates and other global shocks batter their economies, the NYT reports. The report frames it as the debt problems of the richest countries trickling down to the poorest, with the burden falling on economies least able to absorb it.\",\"zh-TW\":\"［未證實·單一來源］開發中國家債務負擔已升至 9.4 兆美元，高利率與其他全球衝擊正重創這些經濟體。報導將此描繪為富國債務問題向下蔓延至最貧窮國家，由最無力承受的經濟體承擔後果。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"開發中國家債務負擔升至 9.4 兆美元，高利率與其他全球衝擊正重創這些經濟體。\\n發生了什麼事\\n開發中國家債務負擔已升至 9.4 兆美元，高利率與其他全球衝擊正重創這些經濟體。《紐約時報》（NYT）將此描繪為最富國家的債務問題向下蔓延至最貧窮國家。\\n為什麼重要\\n最貧窮的借款國背著創紀錄債務、付著高利率，還債就會擠壓醫療、教育與氣候支出。富國的利率循環，到了開發中國家就變成財政危機——最無力承受衝擊的國家，付出最多。\\n來源異同\\n本批只有《紐約時報》經濟版一家報導，9.4 兆美元這個數字沒有第二家媒體佐證。信任標籤：單一來源——僅《紐約時報》一則報導，本批無第二家佐證。\\n仍不確定\\n來源摘要未說明債務攀升的時間範圍、國家分布與債務結構，也未交代 9.4 兆美元數字的原始出處；細節請查閱原始報導。\"},\"sources\":[{\"name\":\"NYT Economy\",\"url\":\"https://www.nytimes.com/2026/11/17/business/economy/global-debt-economy-world-bank.html\"}],\"disagreements\":null,\"trustScore\":60,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":23,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"us\",\"live-ingest\",\"nyt-economy\"],\"glossary\":[{\"blurb\":{\"en\":\"Lower-income countries whose combined debt load reached $9.4 trillion.\",\"zh-TW\":\"低收入國家，合計債務負擔達 9.4 兆美元。\"},\"term\":{\"en\":\"Developing countries\",\"zh-TW\":\"開發中國家\"}},{\"blurb\":{\"en\":\"US newspaper and the sole source for this item.\",\"zh-TW\":\"美國報紙，本則唯一來源。\"},\"term\":{\"en\":\"The New York Times\",\"zh-TW\":\"紐約時報\"}},{\"blurb\":{\"en\":\"Elevated borrowing costs cited as battering developing economies.\",\"zh-TW\":\"偏高的借貸成本，被指重創開發中經濟體。\"},\"term\":{\"en\":\"High interest rates\",\"zh-TW\":\"高利率\"}},{\"blurb\":{\"en\":\"Worldwide economic disruptions cited alongside high rates.\",\"zh-TW\":\"與高利率並列、衝擊各國經濟的全球性動盪。\"},\"term\":{\"en\":\"Global shocks\",\"zh-TW\":\"全球衝擊\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news di
