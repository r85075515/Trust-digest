profile from owning and stocking stores itself to servicing a wider network of partners.\nSources agree / disagree\nThis is currently a single-outlet item from CNA's finance desk, with no corroborating outlet in the feed. Trust label: Single source — only one outlet is reporting this plan so far.\nStill uncertain\nWhether regulators accept the application and whether the September target holds are future events; financial detail must come from the company's filings."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-01-9\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-taiwan-01-9.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 車麗屋轉型平台發展　目標明年9月上櫃\",\"zh-TW\":\"相關封面圖：車麗屋轉型平台發展　目標明年9月上櫃\"},\"publishedAt\":\"2026-11-02T06:42:56.000Z\",\"title\":{\"en\":\"CarRama (Che Li Wu) Shifts to Platform Model, Targets April Application and September Uplist From Emerging Market\",\"zh-TW\":\"車麗屋（CarRama）轉型平台發展，目標明年 4 月申請、9 月上櫃\"},\"summary\":{\"en\":\"Auto goods retailer CarRama has recently listed on Taiwan's Emerging Stock Market; chairman Cho Feng-min said it will shift from a traditional directly operated retail channel to a franchise-service platform model, targeting an application next April and a transfer to full listing next September, Central News Agency reported.\",\"zh-TW\":\"中央社（CNA）報導，車麗屋汽車百貨（CarRama）近期登錄興櫃；董事長卓豐閔（Cho Feng-min）表示，未來將由傳統汽車百貨直營通路，轉向加盟服務的平台型經營模式，下一階段目標明年 4 月申請、9 月轉上櫃。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"一家台灣汽車零售商的上市時程與經營模式轉變，是此則新聞重點。\\n發生了什麼事\\n中央社（CNA）11 月 2 日自台北報導，車麗屋汽車百貨（CarRama）近期登錄興櫃。董事長卓豐閔（Cho Feng-min）表示，公司將由傳統汽車百貨直營通路，朝向以加盟服務為主的平台型經營模式發展。下一階段有明確日期：明年 4 月申請、9 月轉上櫃。摘要未含財務數字、門市數量或加盟條件。\\n為什麼重要\\n此時程給投資人與潛在加盟者具體里程碑，平台轉型也把公司風險結構從自營門市改為服務網絡。\\n來源異同\\n目前僅中央社（CNA）產經證券版一家報導，feed 中無其他媒體佐證。信任標籤：單一來源——目前只有一家媒體報導此計畫。\\n仍不確定\\n主管機關是否受理申請、9 月目標是否成立，都是未來事件；財務細節須查公司申報文件。\"},\"sources\":[{\"name\":\"中央社-產經證券\",\"url\":\"https://www.cna.com.tw/news/afe/202611020141.aspx\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"中央社-產經證券\"],\"glossary\":[{\"term\":{\"en\":\"CarRama\",\"zh-TW\":\"車麗屋\"},\"blurb\":{\"en\":\"Taiwanese auto goods retailer shifting to a franchise platform model.\",\"zh-TW\":\"台灣汽車百貨零售商，轉向加盟平台模式。\"}},{\"term\":{\"en\":\"Cho Feng-min\",\"zh-TW\":\"卓豐閔\"},\"blurb\":{\"en\":\"Chairman of CarRama who outlined the model shift and timetable.\",\"zh-TW\":\"車麗屋董事長，說明轉型與時程。\"}},{\"term\":{\"en\":\"Emerging Stock Market\",\"zh-TW\":\"興櫃\"},\"blurb\":{\"en\":\"Taiwan market tier where CarRama recently listed, before a planned full listing.\",\"zh-TW\":\"台灣市場層級，車麗屋近期登錄於此，計畫再轉上櫃。\"}},{\"term\":{\"en\":\"Central News Agency (CNA)\",\"zh-TW\":\"中央社\"},\"blurb\":{\"en\":\"Taiwan's news agency, whose finance dispatch reported the plan.\",\"zh-TW\":\"台灣通訊社，其產經電文報導此計畫。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-taiwan-01-9/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-taiwan-01-9/\"}],[\"
