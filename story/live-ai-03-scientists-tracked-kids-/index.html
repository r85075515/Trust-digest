ivity may rely on internal processes the brain doesn't use What happened\nScientists tracked kids for 8 years. What they found about screen time was surprising. AI may not think like the human brain after all, according to a striking new discovery that challenges how scientists understand artificial intelligence. Researchers found that even AI models that closely predict brain activity may rely on internal processes the brain doesn't use, raising important questions about their reliability in neuroscience research. Weakening bones may reveal more about brain health than scientists previously realized, with new research linking lower spinal bone density to faster cognitive decline and accelerated changes in the brain's white matter. The surprising connection suggests that routine medical scans could help uncover hidden warning signs of brain aging and identify people at increased risk of dementia. A surprising Finnish study found that children who spent more time using screens tended to have better cognitive processing abilities as teenagers, challenging the assumption that screen time is always harmful. Researchers suggest that what children do on screens may matter more than how much time they spend using them. Why it matters\nThis cluster was assembled from 3 feed item(s) across 2 outlet(s) (ScienceDaily AI, ScienceDaily 健康醫學) in the ai category. Axiom links out to each publisher; this digest only restates titles and short feed descriptions — not full articles. Sources agree / disagree\nMultiple outlets are covering closely related headlines: \"AI may not work like the human brain after all, scientists discover\" (ScienceDaily AI); \"Scientists discover a surprising link between weak bones and faster brain aging\" (ScienceDaily 健康醫學); \"Scientists tracked kids for 8 years. What they found about screen time was surprising\" (ScienceDaily AI).\nNo clear numeric/name conflicts detected in the short feed snippets; always verify details on the publisher pages. Still un
