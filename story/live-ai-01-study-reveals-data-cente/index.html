 boom as a public-health issue, not only an energy or climate one.\n\nWhat happened\nA new study by MIT researchers finds that the rapid expansion of data centers for artificial intelligence harms health and air quality in regions far from where the facilities stand. The team estimates that additional air pollution from the electricity demands of data centers in 2023 resulted in about 650 premature deaths across the United States. The harm is long-distance: pollution tied to powering the centers reaches communities that host no data center at all.\n\nWhy it matters\nThe study breaks the assumption that a data center's costs stay local. If power generation for AI is quietly raising death tolls hundreds of miles away, then siting debates, grid planning, and AI policy all carry a health dimension that host towns alone cannot settle. The 650 figure gives regulators and the industry a concrete number to argue about, rather than a vague warning.\n\nSources agree and disagree\nOnly one outlet, MIT News, carries the finding in this feed, so there is no second source to compare against. No numeric or naming conflicts appear in the available snippet.\n\nStill uncertain\nThe snippet gives no methods, no breakdown by pollutant or region, and no detail on how the deaths were modelled, so the estimate cannot be checked from this material alone. Whether later studies confirm the figure, and which communities bear the heaviest burden, remains open. Readers should verify the details on the publisher's page.\n\nTrust label: Single source — the finding rests on one MIT News report, with no second outlet corroborating it in this feed."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-ai-01-study-reveals-data-cente\",\"category\":\"ai\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-ai-01-study-reveals-data-cente.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Study reveals data centers’ long-distance damage to air quality\",\"zh-TW\":\"相關封面圖：研究揭示資料中心對空氣品質的遠距離損害\"},\"publishedAt\":\"2026-11-19T14:00:00.000Z\",\"title\":{\"en\":\"MIT Study Links Data Center Power Demand to 650 Premature Deaths in 2023\",\"zh-TW\":\"麻省理工學院（MIT）研究：資料中心用電空污 2023 年致全美約 650 人早死\"},\"summary\":{\"en\":\"MIT researchers estimate that air pollution from electricity used by data centers caused about 650 premature deaths across the United States in 2023, with harms reaching regions far from the facilities themselves. The study ties AI's rapid expansion to health costs borne well beyond data-center host communities.\",\"zh-TW\":\"［未證實·單一來源］麻省理工學院（MIT）研究估計，2023 年資料中心用電衍生的空污造成全美約 650 人過早死亡，影響擴及遠離設施的地區。研究指出，人工智慧（AI）擴張的健康代價由設施所在地以外的社區承擔。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"麻省理工學院（MIT）研究人員估計，2023 年資料中心用電衍生的空污造成全美約 650 人過早死亡，傷害落在遠離設施的地區。這項發現把人工智慧熱潮重新定義為公共衛生議題，不只是能源或氣候議題。\\n\\n發生了什麼事\\n麻省理工學院（MIT）研究人員的新研究指出，為人工智慧服務的資料中心快速擴張，損害了遠離設施所在地的地區健康與空氣品質。研究團隊估計，2023 年資料中心電力需求造成的額外空污，導致全美約 650 人過早死亡。傷害是跨地域的：為機房供電產生的污染，波及根本沒有資料中心的社區。\\n\\n為什麼重要\\n這項研究打破了「資料中心代價只留在當地」的假設。為人工智慧供電若在數百英里外悄悄推高死亡人數，選址爭議、電網規劃與人工智慧政策都帶有健康層面，不是機房所在城鎮能單獨決定的。650 這個數字給監管機關與產業一個可以具體爭辯的依據，而非模糊警告。\\n\\n來源異同\\n本批資料只有麻省理工學院新聞（MIT News）一家報導這項發現，沒有第二家來源可供比對。現有摘要中沒有出現數字或名稱衝突。\\n\\n仍不確定\\n摘要未提供研究方法、污染物或地區分布，也未說明死亡人數如何推估，僅憑現有材料無法核對估計值。後續研究是否證實這個數字、哪些社區負擔最重，都還沒有答案，細節應以發布方頁面為準。\\n\\n信任標籤：單一來源——研究結果僅憑 MIT News 一篇報導，本批沒有第二家媒體佐證。\"},\"sources\":[{\"name\":\"MIT News AI\",\"url\":\"https://news.mit.edu/2026/study-reveals-data-centers-long-distance-damage-air-quality-1119\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":23,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"ai\",\"live-ingest\",\"mit-news-ai\"],\"glossary\":[{\"term\":{\"en\":\"Massachusetts Institute of Technology (MIT)\",\"zh-TW\":\"麻省理工學院（Massachusetts Institute of Technology，MIT）\"},\"blurb\":{\"en\":\"A research university in the United States and the home of the study's authors.\",\"zh-TW\":\"美國研究型大學，本研究作者任職的機構。\"}},{\"term\":{\"en\":\"Data center\",\"zh-TW\":\"資料中心\"},\"blurb\":{\"en\":\"A facility housing servers that store data and run computing workloads, including AI.\",\"zh-TW\":\"容納伺服器的設施，負責儲存資料與執行運算工作，包含人工智慧運算。\"}},{\"term\":{\"en\":\"Premature death\",\"zh-TW\":\"過早死亡\"},\"blurb\":{\"en\":\"A death occurring earlier than expected, used here as a measure of pollution's health toll.\",\"zh-TW\":\"比預期提早發生的死亡，此處用來衡量污染造成的健康代價。\"}},{\"term\":{\"en\":\"Air pollution\",\"zh-TW\":\"空氣污染\"},\"blurb\":{\"en\":\"Harmful substances in the air, here tied to electricity generation for data centers.\",\"zh-TW\":\"空氣中的有害物質，此處與資料中心供電產生的排放有關。\"}},{\"term\":{\"en\":\"Artificial intelligence (AI)\",\"zh-TW\":\"人工智慧（Artificial Intelligence，AI）\"},\"blurb\":{\"en\":\"Computer systems that perform tasks such as reasoning and language processing.\",\"zh-TW\":\"能執行推理、語言處理等任務的電腦系統。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-ai-01-study-reveals-data-cente/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-ai-01-study-reveals-data-cente/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",
