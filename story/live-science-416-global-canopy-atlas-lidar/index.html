November 27, 2026. The dataset brings together 3,458 airborne lidar surveys across 56 countries and 224 ecoregions, covering more than 5.5 million hectares of forests, woodlands, and savannas into a standardized three-dimensional structural map.\n\nWhy it matters\nConsistent three-dimensional measurements of canopy and woody ecosystem structure help scientists calibrate upcoming satellite forest-monitoring missions, improve forest carbon stock estimates, and guide conservation and restoration planning across diverse biomes.\n\nSource differences\nPhys.org published its coverage under \"New atlas unites nearly 3,500 laser surveys to map forests across 56 countries,\" framing the compilation around nearly 3,500 lidar surveys across 56 countries. The Nature Ecology \u0026 Evolution paper page appears under \"A global atlas of 3D woody ecosystem structure,\" presenting the primary scientific record for woody ecosystem structure.\n\nStill uncertain\nHow quickly regional conservation agencies and satellite calibration pipelines will adopt the standardized atlas across under-sampled regions remains to be seen as implementation scales.\n\nTrust label: Single source — Coverage from Phys.org and the Nature Ecology \u0026 Evolution paper page stems from the same underlying study, with source diversity weighted conservatively."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-science-416-global-canopy-atlas-lidar\",\"category\":\"science\",\"title\":{\"en\":\"Global Canopy Atlas Unites 3,458 Laser Surveys Across 56 Countries\",\"zh-TW\":\"全球樹冠圖譜整合3,458份光達調查繪製56國三維森林地圖\"},\"summary\":{\"en\":\"Led by the University of Bristol with over 100 institutions, the Global Canopy Atlas published in Nature Ecology \u0026 Evolution integrates 3,458 airborne lidar surveys across 56 countries, giving researchers a consistent 3D baseline to calibrate next-generation forest satellites and estimate carbon storage.\",\"zh-TW\":\"由英國布里斯托大學（University of Bristol）領銜、逾100家機構合作的團隊在《Nature Ecology \u0026 Evolution》發表「全球樹冠圖譜」，整合3,458份機載光達調查、涵蓋56國與逾550萬公頃生態系，核心價值在於提供一致化三維基準以校準下一代森林衛星、估算碳儲量並支援保育修復。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」由英國布里斯托大學（University of Bristol）領銜、全球逾100家機構合作的團隊發表「全球樹冠圖譜」，相關報導於2026年11月27日刊出，研究發表於《Nature Ecology \u0026 Evolution》。該成果整合3,458份機載光達調查，涵蓋56個國家、224個生態區以及逾550萬公頃的森林、林地與莽原，建立一致化的三維森林與木本生態系結構地圖。\\n\\n「為什麼重要」跨區域且一致的三維結構資料，可用於校準下一代衛星森林監測系統、提升森林碳儲量估算精準度，並為生態保育與棲地修復規劃提供科學依據。\\n\\n「來源異同」Phys.org 報導標題為「New atlas unites nearly 3,500 laser surveys to map forests across 56 countries」，側重整合近3,500份雷射調查並涵蓋56國的整體規模；《Nature Ecology \u0026 Evolution》論文頁標題則為「A global atlas of 3D woody ecosystem structure」，呈現木本生態系三維結構研究的學術主文。\\n\\n「仍不確定」各地保育機構與衛星校準流程在資料覆蓋較稀疏區域的導入速度與實務整合進度，仍有待後續應用推展觀察。\\n\\nTrust label: Single source — 兩個來源均圍繞同一篇《Nature Ecology \u0026 Evolution》研究報導鏈，來源多元性已依同源情況從嚴評量。\"},\"glossary\":[{\"term\":{\"en\":\"Airborne lidar\",\"zh-TW\":\"機載光達（LiDAR）\"},\"blurb\":{\"en\":\"Laser-based remote sensing mounted on aircraft to measure three-dimensional vegetation height and canopy structure.\",\"zh-TW\":\"搭載於航空器的雷射遙測技術，用以量測植被高度與三維樹冠結構。\"}},{\"term\":{\"en\":\"Ecoregion\",\"zh-TW\":\"生態區\"},\"blurb\":{\"en\":\"A geographically defined area sharing distinct climate conditions, ecological processes, and biological communities.\",\"zh-TW\":\"具有相似氣候條件、生態過程與生物群聚特徵的地理區域單位。\"}},{\"term\":{\"en\":\"Forest carbon stock\",\"zh-TW\":\"森林碳儲量\"},\"blurb\":{\"en\":\"The total amount of carbon stored within forest biomass, deadwood, litter, and forest soils.\",\"zh-TW\":\"森林生物量、枯立木、凋落物與土壤中儲存的碳總量。\"}},{\"term\":{\"en\":\"Woody ecosystem\",\"zh-TW\":\"木本生態系\"},\"blurb\":{\"en\":\"Terrestrial ecosystems dominated by woody plants such as trees and shrubs, including forests, woodlands, and savannas.\",\"zh-TW\":\"以樹木與灌木等木本植物為主的陸域生態系，涵蓋森林、林地與莽原。\"}}],\"sources\":[{\"name\":\"Phys.org\",\"url\":\"https://phys.org/news/2026-11-atlas-laser-surveys-forests-countries.html\"},{\"name\":\"Nature Ecology \u0026 Evolution\",\"url\"
