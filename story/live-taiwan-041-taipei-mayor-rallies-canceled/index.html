traffic congestion.\n\nDemocratic Progressive Party (DPP) candidate Puma Shen announced in a video statement that he was canceling his final rally and dismantling the stage built on Ren'ai Road near Sun Yat-sen Memorial Hall after lane closures triggered heavy traffic complaints. Shen said his campaign selected Ren'ai Road because other venues—including Ketagalan Boulevard, City Hall Road, and Beiping East Road near DPP headquarters—had already been booked.\n\nDPP supporters alleged political rivals used private individuals to book road rights within seconds of permits opening in October without applying to hold events. Incumbent Mayor Chiang Wan-an of the Kuomintang (KMT) said he would look into whether KMT figures were involved. Chiang also offered Shen use of City Hall Road—which Chiang's campaign had reserved for an election-day event—while shifting his own rally online, an offer Shen's campaign manager Wu Szu-yao declined as the DPP also moved its event online.\n\nTrust label: Multi-source agreement — Focus Taiwan and ICRT report identical sequence of rally cancellations and road-permit offers."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-041-taipei-mayor-rallies-canceled\",\"category\":\"taiwan\",\"title\":{\"en\":\"Leading Taipei Mayoral Candidates Cancel Final Rallies Amid Road-Use Dispute\",\"zh-TW\":\"路權爭議延燒 台北市長主要候選人取消大型選前造勢集會\"},\"summary\":{\"en\":\"Democratic Progressive Party Taipei mayoral candidate Puma Shen and incumbent Mayor Chiang Wan-an both canceled major in-person rallies after lane closures on Ren'ai Road sparked heavy traffic congestion complaints and allegations of strategic road-permit hoarding.\",\"zh-TW\":\"民進黨台北市長候選人沈伯洋（Puma Shen）因仁愛路封路搭台引發嚴重塞車民怨，宣布取消大型實體選前造勢並改採線上舉辦；現任市長蔣萬安（Chiang Wan-an）雖提議讓出市府路路權並將自家造勢改為線上，但遭沈陣營婉拒。路權搶訂爭議迫使台北市長選戰在投票前夕全面轉向線上空戰。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n台北市長選戰主要候選人在投票前夕相繼取消大型實體造勢活動。民進黨候選人沈伯洋（Puma Shen）因在國父紀念館旁的仁愛路封閉車道搭設舞台，引發嚴重交通壅塞與民怨，於週三晚間透過影片宣布取消造勢並拆除舞台。沈伯洋指出，由於凱達格蘭大道、市府路及民進黨中央黨部所在的北平東路等場地皆已被預訂，團隊才選擇仁愛路。\\n\\n「為什麼重要」\\n此事件凸顯大型選舉造勢對都會區交通的衝擊，也引發路權申請機制的政治攻防。民進黨支持者質疑，公開申請紀錄顯示多處路段在 10 月開放申請後數秒內即遭自然人搶訂，卻未實際申請舉辦活動，懷疑對手陣營刻意卡位；這場爭議也直接改變了台北市長選前黃金夜的傳統實體動員模式。\\n\\n「來源異同」\\n中央社英文網（Focus Taiwan）與台北國際社區廣播電台（ICRT）報導的核心事實高度一致，均確認沈伯洋拆台改辦線上活動，以及現任市長蔣萬安（Chiang Wan-an）提出讓出市府路路權並將自家造勢改為線上的經過。Focus Taiwan 進一步補充了 10 月路權遭秒殺的申請紀錄爭議，以及蔣萬安承諾查明是否有國民黨人士涉入的表態。\\n\\n「仍不確定」\\n10 月搶先預訂多處重要路段的自然人背後是否受特定政黨或陣營指使，以及台北市政府後續針對路權申請制度的調查結果，目前仍有待官方進一步說明。\"},\"glossary\":[{\"term\":{\"en\":\"Road-usage rights\",\"zh-TW\":\"路權\"},\"blurb\":{\"en\":\"Official municipal permits required to close public roads or lanes for rallies, parades, or construction.\",\"zh-TW\":\"舉辦遊行、造勢集會或施工時，向地方政府申請暫時使用或封閉公共道路的法定許可。\"}},{\"term\":{\"en\":\"Nine-in-one local elections\",\"zh-TW\":\"九合一地方選舉\"},\"blurb\":{\"en\":\"Taiwan's consolidated local elections held every four years to elect mayors, county magistrates, councilors, and local chiefs.\",\"zh-TW\":\"台灣每四年舉行一次的地方公職人員選舉，合併選出直轄市長、縣市長、議員及村里長等九類公職。\"}},{\"term\":{\"en\":\"Online campaign rally\",\"zh-TW\":\"線上造勢\"},\"blurb\":{\"en\":\"A livestreamed political event held without an in-person street crowd to avoid traffic disruption or weather constraints.\",\"zh-TW\":\"不封路聚集實體群眾，改透過網路直播進行演講與催票的競選活動形式。\"}}],\"sources\":[{\"name\":\"Focus Taiwan (CNA)\",\"url\":\"https://focustaiwan.tw/politics/202611260011\"},{\"name\":\"ICRT\",\"url\":\"https://www.icrt.com.tw/info_details.php?mlevel1=6\u0026mlevel2=12\u0026news_id=312566\"}],\"imageUrl\":\"/covers/live/live-taiwan-041-taipei-mayor-rallies-canceled.jpg\",\"imageAlt\":{\"en\":\"Ren'ai Road in Taipei where campaign stage closures sparked traffic congestion complaints\",\"zh-TW\":\"引發封路塞車爭議的台北市仁愛路街景\"},\"isHeadline\":true,\"isPopular\":true,\"trustScore\":84,\"trustBreakdown\":{\"crossCorroboration\":22,\"outletReputation\":22,\"recencyClarity\":21,\"sourceDiversity\":19},\"publishedAt\":\"2026-11-27T14:15:54.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":4,\"D2\":4,\"D3\":4,\"D4\":4,\"D5\":4,\"total\":20},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-taiwan-041-taipei-mayor-rallies-canceled/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-taiwan-041-taipei-mayor-rallies-canceled/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"d:\"$8:metadata\"\n"])</script></body></html>
