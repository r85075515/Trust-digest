ny accused of smuggling $2 billion in AI chips. Congress wants a closed-door session with Huang over mounting national-security concerns, and the congressmen seeking his time say last week's report spurred the move. The reports cast Huang as the target of the alleged espionage, not as a suspect.\nWhy it matters\nThe judgment is about the stakes, not the gossip: Huang runs the world's largest AI chipmaker, and the suggestion that a foreign intelligence service targeted him through a personal relationship strikes at national security and the chip supply chain at once. A congressional probe turns an unconfirmed report into a formal Washington problem for Nvidia, whatever the allegation turns out to be.\nSources agree / disagree\nTom's Hardware and Axios agree that Huang was called to Congress and faces a probe; both trace the underlying claim to the Financial Times report. Trust label: Two-source agreement — two outlets agree on the summons, while the affair allegation itself remains unconfirmed.\nStill uncertain\nThe relationship is unconfirmed, no response from Huang or Nvidia appears in the snippets, and what Congress will ask is unknown. The smuggling accusation is an accusation, not a finding. Verify details in the full reporting before quoting them."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-01-nvidia-s-jensen-huang-of\",\"category\":\"semiconductor\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"https://cdn.mos.cms.futurecdn.net/fjFkN4c5HUsWwQPK4dVKZR-1920-80.png\",\"imageAlt\":{\"en\":\"Nvidia CEO Jensen Huang called to Congress over reports of a Chinese spy plot.\",\"zh-TW\":\"輝達執行長黃仁勳因中國間諜案報導被國會傳喚。\"},\"publishedAt\":\"2026-11-07T21:06:38.000Z\",\"title\":{\"en\":\"Jensen Huang Called to Congress Over Alleged Chinese Spy Ties\",\"zh-TW\":\"黃仁勳（Jensen Huang）因疑涉中國間諜案被國會傳喚\"},\"summary\":{\"en\":\"Nvidia chief Jensen Huang has been called to Congress over reports of a Chinese spy plot, Tom's Hardware and Axios report. US intelligence believes Huang had a romantic relationship with Alice Huang, a Megaspeed executive suspected of being a Chinese asset; the allegation is unconfirmed, with Huang cast as the target, not a suspect.\",\"zh-TW\":\"輝達（Nvidia）執行長黃仁勳（Jensen Huang）因中國間諜案報導被國會傳喚，Tom's Hardware 與 Axios 報導。美國情報界認為黃仁勳與疑似中國間諜資產的 Megaspeed 高層愛麗絲·黃（Alice Huang）有戀情；指控未經證實，報導將黃仁勳定位為行動目標，而非嫌疑人。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"輝達（Nvidia）執行長黃仁勳（Jensen Huang）因中國間諜案報導被國會正式傳喚，Tom's Hardware 報導；美國情報界認為他與一名疑似中國間諜有戀情。Axios 報導，國會將就此展開調查。\\n發生了什麼事\\n《金融時報》（Financial Times）報導，愛麗絲·黃（Alice Huang，別名黃樂）是新加坡公司 Megaspeed 的高層，據稱與黃仁勳有戀情。Tom's Hardware 稱這起疑似行動為美人計（honeypot），標題還把嫌疑人與一家被控走私 20 億美元 AI 晶片的公司連在一起。國會希望就國家安全疑慮與黃仁勳閉門會談，爭取他時間的議員表示，上週的報導促成了這次傳喚。報導把黃仁勳定位為疑似間諜行動的目標，而非嫌疑人。\\n為什麼重要\\n重點在利害關係，不在綺聞：黃仁勳掌管全球最大的 AI 晶片商，外國情報機構透過私人關係鎖定他的說法，同時衝擊國家安全與晶片供應鏈。國會調查一啟動，不管指控最後是否屬實，對輝達來說都已經是華盛頓層級的正式問題。\\n來源異同\\nTom's Hardware 與 Axios 都確認黃仁勳被國會傳喚、面臨調查，兩家都把核心指控追溯到《金融時報》的報導。信任標籤：雙源一致——兩家媒體對傳喚一事一致，戀情指控本身仍未證實。\\n仍不確定\\n戀情未經證實，來源摘要沒有黃仁勳或輝達的回應，也不知道國會會問什麼。走私指控只是指控，不是定論。引用細節前請查閱完整報導。\"},\"sources\":[{\"name\":\"Tom's Hardware\",\"url\":\"https://www.tomshardware.com/tech-industry/artificial-intelligence/us-intelligence-believes-jensen-huang-had-romantic-relationship-with-chinese-spy-in-honeypot-operation-spy-suspect-linked-to-company-accused-of-smuggling-usd2-billion-in-ai-chips\"},{\"name\":\"Axios\",\"url\":\"https://www.axios.com/2026/11/07/jensen-huang-nvidia-congress-china-spy\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":13,\"outletReputation\":10,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"semiconductor\",\"live-ingest\",\"tom's-hardware\",\"tom's-hardware\",\"axios\"],\"glossary\":[{\"term\":{\"en\":\"Jensen Huang\",\"zh-TW\":\"黃仁勳\"},\"blurb\":{\"en\":\"CEO of Nvidia, called to Congress over the spy reports.\",\"zh-TW\":\"輝達執行長，因間諜案報導被國會傳喚。\"}},{\"term\":{\"en\":\"Nvidia\",\"zh-TW\":\"輝達\"},\"blurb\":{\"en\":\"US
