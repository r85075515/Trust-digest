t No. 3955, a Section 337 complaint filed by Tower Semiconductor Ltd., Tower U.S. Holdings, Inc., Tower Semiconductor Newport Beach, and Tower Semiconductor San Antonio, Inc. against respondent GlobalFoundries Inc. over certain semiconductor devices and computing products.\n\nWhy it matters\nSection 337 investigations carry the remedy of exclusion orders blocking infringing chips and downstream computing products from entering the United States. The proceeding marks an escalation in foundry intellectual property litigation following GlobalFoundries' earlier Section 337 complaint against Tower Semiconductor.\n\nSource differences\nThe USITC's official Federal Register notice (\"Certain Semiconductor Devices, Computing Products Containing\") records Docket No. 3955, names the Tower Semiconductor complainants and respondent GlobalFoundries Inc., and outlines EDIS filing procedures for public interest submissions. CASRAI's November 27, 2026 report (\"USITC Section 337: Tower v GlobalFoundries Notice - CASRAI\") summarizes the solicitation of public interest comments and contextualizes the dispute within the semiconductor foundry market.\n\nStill uncertain\nWhether the Commission will formally institute a full Section 337 investigation following the public interest comment period and how any potential exclusion remedy would affect downstream U.S. electronics supply chains remain undecided.\n\nTrust label: Official confirmation — Verified via the U.S. International Trade Commission's official Docket No. 3955 Federal Register notice and CASRAI's November 27, 2026 coverage."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-326-usitc-tower-globalfoundries-337\",\"category\":\"semiconductor\",\"title\":{\"en\":\"USITC Solicits Public Interest Comments on Tower Semiconductor Section 337 Complaint Against GlobalFoundries\",\"zh-TW\":\"美國國際貿易委員會針對高塔半導體控告格羅方德 337 條款案徵求公眾利益意見\"},\"summary\":{\"en\":\"The U.S. International Trade Commission issued a notice soliciting public interest comments on Docket No. 3955, a Section 337 patent complaint filed by Tower Semiconductor against GlobalFoundries over semiconductor devices and computing products.\",\"zh-TW\":\"美國國際貿易委員會（USITC）就高塔半導體（Tower Semiconductor）對格羅方德（GlobalFoundries）提出的第 337 條款專利侵權申訴案（案號 Docket No. 3955）發布徵求公眾利益意見通知，評估若核發排除令對美國競爭條件與消費者之影響。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n美國國際貿易委員會（USITC）發布通知，針對高塔半導體（Tower Semiconductor Ltd.）及其美國子公司（Tower U.S. Holdings、Newport Beach 與 San Antonio 廠區）對格羅方德（GlobalFoundries Inc.）提出的《1930年關稅法》第 337 條款申訴案（案號 Docket No. 3955），正式向外界徵求公眾利益書面意見。\\n\\n「為什麼重要」\\n第 337 條款調查若認定侵權成立，USITC 可核發有限排除令與禁止令，阻擋涉案半導體元件及內含該元件的運算產品進口美國。此案是繼格羅方德先前對高塔半導體提起 337 調查後，兩大晶圓代工業者專利戰的進一步升級。\\n\\n「來源異同」\\nUSITC 官方聯邦公報通知文件（標題原文：\\\"Certain Semiconductor Devices, Computing Products Containing\\\"）載明案號 Docket No. 3955、原告高塔半導體各法人實體與被告格羅方德（GlobalFoundries Inc.），以及透過 EDIS 系統提交意見的法定程序。CASRAI 於 2026 年 11 月 27 日刊出的報導（標題原文：\\\"USITC Section 337: Tower v GlobalFoundries Notice - CASRAI\\\"）則摘要本次公眾利益徵詢重點並解析晶圓代工市場背景。\\n\\n「仍不確定」\\nUSITC 在蒐集公眾利益意見後是否正式立案啟動完整第 337 條款調查，以及若未來裁定排除令對美國下游電子與運算裝置供應鏈的實際衝擊幅度，仍有待後續裁定。\\n\\nTrust label: Official confirmation — 依據美國國際貿易委員會（USITC）Docket No. 3955 官方公告及 CASRAI 2026 年 11 月 27 日報導核實。\"},\"glossary\":[{\"term\":{\"en\":\"Section 337 Investigation\",\"zh-TW\":\"第 337 條款調查\"},\"blurb\":{\"en\":\"An administrative proceeding conducted by the U.S. International Trade Commission under Section 337 of the Tariff Act of 1930 to adjudicate unfair import practices, primarily patent infringement.\",\"zh-TW\":\"美國國際貿易委員會依據《1930年關稅法》第337條執行的準司法程序，主要審理進口商品侵害美國智慧財產權的不公平貿易行為。\"}},{\"term\":{\"en\":\"Public Interest Comments\",\"zh-TW\":\"公眾利益意見\"},\"blurb\":{\"en\":\"Submissions invited by the USITC before instituting a Section 337 investigation to assess how a potential import ban could affect public health, welfare, U.S. competitive conditions, and consumers.\",\"zh-TW\":\"USITC 在決定是否立案或核發排除令前，向利害關係人與公眾徵求的評估意見，用以衡量禁售令對美國競爭環境與消費者的影響。\"}},{\"term\":{\"en\":\"Exclusion Order\",\"zh-TW\":\"排除令\"},\"blurb\":{\"en\":\"A trade remedy issued by the USITC directing U.S. Customs and Border Protection to bar infringing goods from entering the United States.\",\"zh-TW\":\"由 USITC 核發的貿易救濟命令，指示美國海關與邊境保護局禁止侵權產品進入美國市場。\"}}],\"sources\":[{\"name\":\"U.S. International Trade Commission\",\"url\":\"https://www.usitc.gov/secretary/fed_reg_notices/337/dn_3955_notice11252026sgl.pdf\"},{\"name\":\"CASRAI\",\"url\":\"https://casrai.org/news/usitc-section-337-semiconductor-devices-tower-globalfoundries-complaint-2026-24265\"}],\"imageUrl\":\"/covers/live/live-semiconductor-326-usitc-tower-globalfoundries-337.jpg\",\"imageAlt\":{\"en\":\"USITC Solicits Public Interest Comments on Tower Semiconductor Section 337 Complaint Against GlobalFoundries\",\"zh-TW\":\"美國國際貿易委員會針對高塔半導體控告格羅方德 337 條款案徵求公眾利益意見\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":85,\"trustBreakdown\":{\"crossCorroboration\":21,\"outletReputation\":24,\"recencyClarity\":24,\"sourceDiversity\":16},\"publishedAt\":\"2026-11-28T02:42:49.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":23,\"D2\":21,\"D3\":22,\"D4\":22,\"D5\":17,\"total\":21},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-semiconductor-326-usitc-tower-globalfoundries-337/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"
