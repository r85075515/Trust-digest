 outage while noting that AI is causing both opportunities and new challenges for securing much of the connected world. The single TechCrunch item gives no further detail — no date, venue or fuller quotation for the 'unpatchable' remark, and no specifics on the outage.\nWhy it matters\nThe warning comes from the chief executive of one of the world's largest software and cloud providers: if large parts of critical infrastructure cannot be patched, defending it requires something other than patch cycles. It also frames the Outlook outage as a minor episode against a larger AI security question.\nSources agree / disagree\nOnly TechCrunch covers this in the cluster, so there is nothing to corroborate or contradict the remark here.\nStill uncertain\nThe occasion and context of Nadella's remarks, what infrastructure he had in mind, and the scale and cause of the Outlook outage are all missing from the snippet. Verify on the TechCrunch page.\nTrust label: Single source"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-tech-01-amidst-fears-of-ai-cyber\",\"category\":\"tech\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-tech-01-amidst-fears-of-ai-cyber.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Amidst fears of AI cyberattacks, Satya Nadella says lots of critical infrastructure is ‘unpatchable’\",\"zh-TW\":\"相關封面圖：薩蒂亞·納德拉 (Satya Nadella) 擔心人工智慧網路攻擊，稱許多關鍵基礎設施“無法修補”\"},\"publishedAt\":\"2026-11-18T23:45:00.000Z\",\"title\":{\"en\":\"Satya Nadella Says Much Critical Infrastructure Is 'Unpatchable' Amid AI Cyberattack Fears\",\"zh-TW\":\"薩蒂亞·納德拉（Satya Nadella）：人工智慧網攻威脅下，大量關鍵基礎設施「無法修補」\"},\"summary\":{\"en\":\"[Unconfirmed · Single source] Microsoft CEO Satya Nadella said much critical infrastructure is 'unpatchable' as AI raises fears of cyberattacks, while downplaying the recent Outlook outage. He said AI brings both opportunities and new challenges for securing the connected world. The take
