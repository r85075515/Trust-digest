Stykket in Trøndelag, and Landverk, Gärde, and Duved in Jämtland—in a study published in the journal World Archaeology. Examining the depicted animals' age, sex, and spatial alignment with surrounding terrain, the authors concluded that large, often life-size carvings of elk, reindeer, and bears created between roughly 9,000 and 4,000 B.C. acted as practical landscape signposts marking natural animal crossings or rapids where prey could be driven and hunted, before rock art shifted toward smaller narrative human scenes around 5,000 B.C.\n\nWhy it matters\nThe findings challenge long-standing assumptions that prehistoric Scandinavian petroglyphs were purely symbolic or ritualistic, demonstrating instead that early hunter-gatherers used monumental rock carvings as ecological navigation tools.\n\nSource differences\nPhys.org reported the research under the headline \"Early Stone Age rock carvings in Scandinavia may have been signposts for hunting grounds - Phys.org\", detailing the four studied sites in Sweden and Norway and quoting the authors on practical landscape tools. La Brújula Verde covered the same paper under the headline \"Scandinavian Hunters Carved Huge, Strangely Solitary Moose\", highlighting the solitary nature of the pre-5,000 B.C. moose petroglyphs and the Oct. 30 publication date in World Archaeology.\n\nStill uncertain\nWhether this practical signpost interpretation applies broadly to coastal Scandinavian petroglyph clusters beyond the four inland river and fjord sites examined requires further landscape archaeology surveys.\n\nTrust label: Single source — Both Phys.org and La Brújula Verde second-hand report the same World Archaeology paper, so the evidence traces to a single source."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-science-385-scandinavian-rock-carvings-hunting-signs\",\"category\":\"science\",\"title\":{\"en\":\"Early Stone Age Rock Carvings in Scandinavia May Have Served as Hunting Signposts\",\"zh-TW\":\"斯堪地那維亞早石器時代大型岩畫 考古研究指或為狩獵場路標\"},\"summary\":{\"en\":\"A study published in World Archaeology analyzing four sites in Sweden and Norway suggests early Scandinavian animal rock carvings served as practical hunting signposts rather than purely ritual art.\",\"zh-TW\":\"發表於《世界考古學》（World Archaeology）期刊的新研究指出，古斯堪地那維亞人在西元前 9000 至 4000 年間於峽灣與河岸峭壁雕刻的等比例大型駝鹿與馴鹿岩畫，可能具備實用地理路標功能，用以標示獵物天然渡口或易於圍捕驅趕的急流地形。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n由托馬斯·佩爾松（Tomas Persson）等人發表於《世界考古學》（World Archaeology）期刊的研究，分析了瑞典耶姆特蘭省（Jämtland）的 Landverk、Gärde、Duved 與挪威特倫德拉格郡（Trøndelag）的 Stykket 共四處石器時代岩畫遺址。研究團隊透過比對岩畫動物的年齡、性別特徵與周邊地貌關係，推論古斯堪地那維亞人於西元前 9000 至 4000 年間在峽灣與河岸岩壁雕刻的大型、甚至等比例駝鹿、馴鹿與熊隻圖案，實際上扮演著「狩獵場路標」的實用工具角色，標示動物天然渡水通道或可將獵物驅趕圍捕的危險急流處，直到西元前 5000 年左右岩畫才逐漸轉向包含人類互動的小型敘事場景。\\n\\n「為什麼重要」\\n這項研究打破學界長期將史前北歐岩畫視為純粹宗教儀式或抽象藝術的詮釋框架，揭示早石器時代狩獵採集族群如何將大型岩雕作為傳遞地形與狩獵情報的實用資訊系統。\\n\\n「來源異同」\\nPhys.org 以「Early Stone Age rock carvings in Scandinavia may have been signposts for hunting grounds - Phys.org」為題報導，詳列瑞典與挪威四處研究遺址並引述作者對實用地形工具的說明；西班牙歷史科學媒體 La Brújula Verde 英文版則以「Scandinavian Hunters Carved Huge, Strangely Solitary Moose」為題，強調西元前 5000 年前岩畫多描繪孤立大型駝鹿的特徵及該論文於《World Archaeology》的發表細節。\\n\\n「仍不確定」\\n此一實用路標假說是否同樣適用於這四處河川峽灣遺址以外的北歐沿海岩畫群，仍有待更多景觀考古調查驗證。\\n\\nTrust label: Single source — Phys.org 與 La Brújula Verde 皆為同一篇《World Archaeology》論文的二手報導，證據同源，故標 Single source。\"},\"glossary\":[{\"term\":{\"en\":\"Petroglyph\",\"zh-TW\":\"岩刻畫（Petroglyph）\"},\"blurb\":{\"en\":\"Prehistoric rock art created by pecking, incising, or carving directly into a stone surface.\",\"zh-TW\":\"史前人類透過敲鑿、刻劃等方式直接留在天然岩石表面的圖像。\"}},{\"term\":{\"en\":\"World Archaeology\",\"zh-TW\":\"《世界考古學》期刊\"},\"blurb\":{\"en\":\"An international peer-reviewed academic journal covering archaeological research across all periods and regions.\",\"zh-TW\":\"涵蓋全球各時期與地區考古研究成果的國際同行評審學術期刊。\"}},{\"term\":{\"en\":\"Landscape Archaeology\",\"zh-TW\":\"景觀考古學\"},\"blurb\":{\"en\":\"The study of how past human societies interacted with, navigated, and modified their surrounding physical terrain.\",\"zh-TW\":\"研究古代人類社會如何與周邊自然地形互動、利用並改造環境的考古學分支。\"}}],\"sources\":[{\"name\":\"Phys.org\",\"url\":\"https://phys.org/visualstories/2026-11-early-stone-age-scandinavia-signposts.amp\"},{\"name\":\"La Brújula Verde\",\"url\":\"https://www.labrujulaverde.com/en/2026/11/scandinavian-hunters-carved-huge-strangely-solitary-moose-petroglyphs-researchers-propose-they-were-hunting-signs/\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"Early Stone Age Rock Carvings in Scandinavia May Have Served as Hunting Signposts\",\"zh-TW\":\"斯堪地那維亞早石器時代大型岩畫 考古研究指或為狩獵場路標\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":73,\"trustBreakdown\":{\"crossCorroboration\":22,\"outletReputation\":21,\"recencyClarity\":22,\"sourceDiversity\":8},\"publishedAt\":\"2026-11-28T08:34:01.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":21,\"D2\":22,\"D3\":21,\"D4\":21,\"D5\":21,\"total\":21},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-science-385-scandinavian-rock-carvings-hunting-signs/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-science-385-scandinavian
