ne on the spot and asked, in Chinese, '奪急啦可以回家打砲嗎' ('How desperate were you — couldn't you go home?'), calling the toilet smelly.\nWhat happened\nChang, known for blunt humour on social media, was out early with Amis when he entered the portable toilet opposite the zoo to dispose of dog waste. On the counter he found the opened red condom wrapper. He filmed himself reacting to the scene, saying '很臭耶' ('It stinks!') and asking why anyone could not wait to go home.\nWhy it matters\nThe clip works because it is unmistakably Chang: a mundane dog walk collides with a stranger's mess, and his unfiltered scolding turns it into shareable entertainment. ETtoday carried the original report; Yahoo TW and Google News carried the same story.\nSources agree / disagree\nETtoday, Yahoo TW and Google News agree on the singer, the dog, the portable toilet and the torn red wrapper. Yahoo TW's headline calls the scene an 'embarrassing moment'; the underlying account is the same ETtoday report, so the three items corroborate the clip rather than offering independent reporting.\nStill uncertain\nThe feed snippets do not say where the video was posted, how widely it spread, or who left the wrapper. Check the publisher pages for the full clip.\nTrust label: Multi-source agreement"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-eastAsiaGossip-01-ettoday-ettoday\",\"category\":\"eastAsiaGossip\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-eastAsiaGossip-01-ettoday-ettoday.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 流動廁所驚見保險套！張震嶽傻眼喊「很臭耶」：奪急啦回家好嗎 - ETtoday星光雲| ETtoday新聞雲\",\"zh-TW\":\"相關封面圖：流動廁所驚見保險套！張震嶽傻眼喊「很臭耶」：奪急啦回家好嗎 - ETtoday星光雲| ETtoday新聞雲\"},\"publishedAt\":\"2026-11-19T00:21:00.000Z\",\"title\":{\"en\":\"Chang Chen-yue Finds Torn Condom Wrapper in Portable Toilet, Films His Rant\",\"zh-TW\":\"張震嶽（Chang Chen-yue）在流動廁所發現撕開的保險套包裝，拍片吐槽\"},\"summary\":{\"en\":\"Singer Chang Chen-yue, walking his dog Amis, found a torn red condom wrapper in a portable toilet across from the zoo and filmed himself asking why anyone could not wait to go home. ETtoday, Yahoo TW and Google News carry the same clip. The takeaway is pure Chang Chen-yue: a gross morning walk turned into a viral scolding.\",\"zh-TW\":\"歌手張震嶽（Chang Chen-yue）一早帶愛犬阿米斯（Amis）散步，在動物園對面的流動廁所發現撕開的紅色保險套包裝，拍片吐槽為何不能回家再說。ETtoday、Yahoo TW 與 Google News 報導同一段影片；看點就是張震嶽一貫的直率——一次倒楣的晨間散步變成網路熱傳的吐槽。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"歌手張震嶽（Chang Chen-yue）一早帶愛犬阿米斯（Amis）散步，走進動物園對面的流動廁所清理狗便，卻在台面上發現一枚撕開的紅色保險套包裝。他當場拍片吐槽：「奪急啦可以回家打砲嗎」，還說廁所「很臭耶」。\\n發生了什麼事\\n以直率幽默著稱的張震嶽一早帶阿米斯外出散步，途中走進動物園對面的流動廁所清理狗便，在台面上發現已撕開的紅色保險套外包裝。他當場拍片，說「很臭耶」，並吐槽為何不能回家再說。\\n為什麼重要\\n這段影片的看點就是張震嶽一貫的風格：平凡的遛狗行程撞上陌生人留下的荒謬場面，他不加修飾的吐槽把它變成熱傳娛樂。ETtoday 刊出原始報導，Yahoo TW 與 Google News 轉載同一則消息。\\n來源異同\\n三家來源在主角、愛犬、流動廁所與撕開的紅色包裝上一致。Yahoo TW 標題稱之為「尷尬一幕」，內容仍是同一則 ETtoday 報導，三則是同一段影片的轉載而非獨立採訪。\\n仍不確定\\n摘要未說明影片發布在哪個社群平台、傳播多廣，也未說明是誰留下包裝；完整影片請查閱原文。\"},\"sources\":[{\"name\":\"ETtoday 影劇\",\"url\":\"https://star.ettoday.net/news/3274642\"},{\"name\":\"Google News\",\"url\":\"https://news.google.com/rss/articles/CBMiTkFVX3lxTE5Daks4U3ZCZFpiM3ZQU2lUTE1HS0Q2eEZSRkhyOWtSczZ5enplcnlvOWtoVi1Sd1lHUDZoczBvVTB3T1YtRHVwWG0wbEtlZ9IBTEFVX3lxTFBMb09VcndXV3ltOXp3M2s0b0IwVW14ODBnMDMwUTVsZVRQWW91U2pSUmpyY3lMRkNrRGpQQlVFbHpxbHEwZ3NUOXkwZ3c?oc=5\"},{\"name\":\"Yahoo TW 娛樂\",\"url\":\"https://tw.news.yahoo.com/%E6%B5%81%E5%8B%95%E5%BB%81%E6%89%80%E6%9C%89%E4%BF%9D%E9%9A%AA%E5%A5%97%E5%8C%85%E8%A3%9D-%E5%BC%B5%E9%9C%87%E5%B6%BD%E9%A9%9A%E8%A6%8B-%E5%B0%B7%E5%B0%AC-%E5%B9%95-%E5%82%BB%E7%9C%BC%E5%96%8A-012025023.html\"}],\"disagreements\":null,\"trustScore\":84,\"trustBreakdown\":{\"sourceDiversity\":21,\"outletReputation\":16,\"crossCorroboration\":22,\"recencyClarity\":25},\"tags\":[\"eastAsiaGossip\",\"live-ingest\",\"region:tw\",\"ettoday-影劇\",\"google-news-tw-entertainment\",\"yahoo-tw-娛樂\"],\"region\":\"tw\",\"glossary\":[{\"term\":{\"en\":\"Chang Chen-yue\",\"zh-TW\":\"張震嶽\"},\"blurb\":{\"en\":
