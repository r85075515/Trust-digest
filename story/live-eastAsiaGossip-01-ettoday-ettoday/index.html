r Kuo Hsin's high-profile public defense of their relationship, with Hsu describing the situation only as 'hard to put into words.' SETN and its entertainment desk report the same sequence from the other side: the couple's romance was exposed, then ended, and Hsu issued a late-night statement saying she could no longer stay silent and had gone an entire night without sleep. The same feed cluster bundles two separate veteran-actor items: Anue reports that Jim Carrey, 64, has married a 32-year-old woman after two divorces and a vow never to remarry; World Journal reports that veteran Taiwanese actor Chou Lin (周麟), who once claimed to have dated 3,000 women and lost everything in a divorce, was found dead at his home at 73.\nWhy it matters\nThe Hsu Chih-chi–Kuo Hsin romance played out almost entirely in public — from the relationship going public to a vocal defense to a reported split — so Hsu's cryptic phrasing has turned a private breakup into a guessing game, which is why several Taiwanese outlets are chasing the same story at once. Celebrity splits are reliable traffic for entertainment desks, and each new quote restarts the cycle.\nSources agree / disagree\nETtoday, SETN, and the entertainment desk agree on the core sequence: public romance, then a split, then Hsu's emotional late-night response. No outlet disputes the breakup itself; the wording differs only in tone ('hard to put into words' versus 'a whole night without sleep'). The Carrey and Chou Lin items come from separate outlets and stand as independent threads inside the same cluster. Trust label: Multi-source agreement — several Taiwanese entertainment outlets align on the core facts.\nStill uncertain\nFeed snippets capture headlines and short descriptions, not the full articles. The reasons behind the split and what Hsu's 'hard to put into words' actually refers to remain unknown; check the linked outlets for the latest reporting before quoting specifics."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-eastAsiaGossip-01-ettoday-ettoday\",\"category\":\"eastAsiaGossip\",\"adult\":false,\"isHeadline\":true,\"isPopular\":true,\"publishedAt\":\"2026-10-14T02:45:58.000Z\",\"title\":{\"en\":\"Hsu Chih-chi (徐至琦) and Kuo Hsin (郭鑫) Reported to Have Split After a High-Profile Romance\",\"zh-TW\":\"徐至琦、郭鑫驚爆分手：高調護愛之後，她以「一言難盡」回應\"},\"summary\":{\"en\":\"Taiwanese outlets report that Hsu Chih-chi (徐至琦) and Kuo Hsin (郭鑫) have broken up after a brief but highly public romance, with Hsu calling the situation 'hard to put into words' and posting a late-night statement after a sleepless night. The same news cluster also tracks Jim Carrey's reported marriage at 64 and the death of veteran actor Chou Lin (周麟) at 73.\",\"zh-TW\":\"多家台媒報導，徐至琦與郭鑫高調交往後驚爆分手，女方以「一言難盡」回應，深夜發聲自曝整晚沒睡。同批新聞還包括金凱瑞（Jim Carrey）64 歲傳出婚訊，以及資深藝人周麟 73 歲陳屍獨居處的消息。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"台灣娛樂媒體今天同時在追兩條線：一對新人的分手傳聞，以及兩位資深藝人的人生近況。\\n發生了什麼事\\nETtoday 獨家報導，郭鑫高調維護與徐至琦的戀情之後，兩人驚爆分手，徐至琦僅以「一言難盡」回應。三立新聞與娛樂星聞則從另一側報導同一順序：兩人戀情曝光後又分手，徐至琦深夜發聲表示忍無可忍，自曝整晚沒睡。同批新聞還夾帶兩則資深藝人消息：鉅亨號稱金凱瑞（Jim Carrey）64 歲娶了 32 歲的對象，兩次離婚後曾發誓不再婚；世界新聞網則報導，曾自稱交往過 3000 名女性、離婚淨身出戶的台灣資深藝人周麟，73 歲陳屍獨居處。\\n為什麼重要\\n徐至琦與郭鑫的戀情幾乎全程攤在陽光下——從曝光、高調護愛到傳出分手，女方一句「一言難盡」把私人情事變成全民猜謎，也難怪多家台媒同時追同一條新聞。明星分合本就是娛樂版面的流量保證，每一句新回應都會重啟一輪報導。\\n來源異同\\nETtoday、三立新聞與娛樂星聞對核心順序的說法一致：戀情公開、接著分手、然後是徐至琦情緒化的深夜回應；沒有任何一家否認分手本身，差別只在用詞的溫度（「一言難盡」對「一夜沒睡」）。金凱瑞與周麟兩則來自不同媒體，是同一批新聞裡各自獨立的支線。信任標籤：多源一致——多家台灣娛樂媒體對核心事實的報導一致。\\n仍不確定\\n來源摘要只呈現標題與簡短描述，並非全文。分手的原因、徐至琦「一言難盡」究竟所指為何，目前都無從得知；引用細節前請查閱各媒體的完整報導。\"},\"sources\":[{\"name\":\"ettoday.net\",\"url\":\"https://news.google.com/rss/articles/CBMiTkFVX3lxTFBRNENKRXBNYjJGMGVheUxXSkJwMU1pWDQwcW4tYjFaRDFxejMteTZKVmZTM0pKNEg3Mjc2Wm95cGZNbWpobk9ET1Bta1QtQdIBTEFVX3lxTE5wSFRRNlBwZ2ZsZ1FUeE1NVUV1VC1GU19Dc19Za3hwT1pEQmxwT0lTM18xZS02LVZCdTNvREhfT1dLZU51aWd5aFlpVkM?oc=5\"},{\"name\":\"setn.com\",\"url\":\"https://news.google.com/rss/articles/CBMiSEFVX3lxTE5OLU5QVUJqb0lBUlkwaDkwS3R0d0Z2eDNmRVJLeWsxR3BPYmU2NmJJSXlfOWNURnhTcVJDN2Fab3VC
