intercepting his wife's endorsement deal, and Chia has given an exclusive interview in response, questioning the accuser's motives.\nWhat happened\nAccording to ETtoday, Mirror Media, and other outlets, two incidents involving Xiu have been circulating. One dates back years to a nighttime gathering, where Xiu was said to have held hands with a married woman at a bar and then left in the same car; a witness was quoted asking why he showed so little discretion. The other claim is that Xiu intercepted an aesthetic-medicine endorsement deal meant for Chia, leaving her unaware. Friends were also quoted saying Xiu's attitude toward Chia changed after his draft-evasion case, becoming less considerate. Chia gave an exclusive interview to Mirror Media, saying she would protect her family in her own way and questioning the motives of whoever spread the claims.\nWhy it matters\nChia and Xiu are one of the entertainment industry's best-known couples, and their family image has long been central to their public personas, which is why the rumours have drawn heavy attention. But the bar incident is said to have happened years ago, the claims rest largely on anonymous friends and witnesses, and no direct evidence beyond the couple themselves has been presented; Chia's interview is currently the only on-the-record account from either spouse.\nSources agree / disagree\nETtoday, Yahoo News, and Mirror Media report broadly the same set of claims: the bar encounter, the intercepted endorsement, the changed attitude after the draft-evasion case, and Chia's interview response. The disagreement is not over what was alleged but over credibility: every report rests on anonymous accounts and secondhand retellings, with no direct evidence and no direct response from Xiu himself on the bar incident. Trust label: Unconfirmed — the claims come from anonymous sources without direct evidence, and Chia's response is the only on-the-record account so far.\nStill uncertain\nThe exact time and place of the bar incident, who was present, the identity and motives of the accusers, the specifics of the endorsement deal, and whether Xiu will respond personally are all absent from the material. The details of the draft-evasion case are also outside the material. Whether the marriage is in trouble remains a rumour, and readers should rely on any formal statement from the couple."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-eastAsiaGossip-02-yahoo\",\"category\":\"eastAsiaGossip\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-eastAsiaGossip-02-yahoo.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 修杰楷爆酒吧勾手人妻！「同車離開」疑婚變 賈靜雯發聲了 - Yahoo新聞\",\"zh-TW\":\"相關封面圖：修杰楷爆酒吧勾手人妻！「同車離開」疑婚變 賈靜雯發聲了 - Yahoo新聞\"},\"publishedAt\":\"2026-11-24T04:53:34.000Z\",\"title\":{\"en\":\"Alyssa Chia Responds as Rumours Swirl Around Husband Xiu Jiekai\",\"zh-TW\":\"賈靜雯回應婚變傳聞，丈夫修杰楷遭爆酒吧勾手人妻、攔胡代言\"},\"summary\":{\"en\":\"Actress Alyssa Chia, a two-time Golden Award-winning actress whose marriage has drawn days of tabloid coverage, is facing rumours that her husband, actor Xiu Jiekai, held hands with a married woman at a bar and intercepted her endorsement deal. Chia has responded in an exclusive interview, questioning the accuser's motives and defending her family, while the underlying claims remain unproven.\",\"zh-TW\":\"雙金影后賈靜雯（多家娛樂媒體連日追蹤）與丈夫、演員修杰楷捲入婚變傳聞：修杰楷遭爆多年前在酒吧勾手已婚女子、同車離開，又傳出攔胡賈靜雯的醫美代言。賈靜雯已接受專訪回應，質疑爆料者動機並守護家庭，相關指控目前均未獲證實。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"雙金影后賈靜雯與丈夫、演員修杰楷結婚 11 年，育有兩個女兒，長期以幸福家庭形象示人。近日多家娛樂媒體接連報導，指修杰楷捲入酒吧勾手已婚女子、攔胡妻子代言等爭議，婚變傳聞甚囂塵上；賈靜雯已接受專訪回應，質疑爆料者的動機。\\n發生了什麼事\\n根據 ETtoday、鏡週刊（Mirror Media）等媒體的報導，近日流傳兩起與修杰楷有關的事件：其一是多年前的一場夜間聚會，據稱修杰楷在酒吧與一名已婚女子勾手、隨後同車離開，目擊者質疑他「不懂避嫌」；其二是修杰楷被指攔胡賈靜雯的醫美代言，賈靜雯對此蒙在鼓裡。另有友人稱，修杰楷在閃兵案（逃避兵役案）後對妻子的態度丕變，體貼不再，讓友人為賈靜雯抱屈。賈靜雯接受鏡週刊（Mirror Media）獨家專訪，選擇以自己的方式守護家庭，並回應質疑爆料者的動機。\\n為什麼重要\\n賈靜雯與修杰楷是演藝圈知名的銀色夫妻，家庭形象長期是兩人公開形象的重要部分，相關傳聞因此格外引發關注。值得注意的是，傳聞中的酒吧事件據稱發生在多年前，且爆料來源多為匿名友人或目擊者，事件本身尚未獲得當事人以外的證實；賈靜雯的回應則是目前唯一來自當事人的公開說法。\\n來源異同\\nETtoday、雅虎新聞（Yahoo News）與鏡週刊（Mirror Media）等媒體報導的傳聞內容大致一致：酒吧勾手事件、攔胡代言、閃兵案後態度轉變，以及賈靜雯的專訪回應。分歧不在傳聞內容本身，而在可信度：各家報導都建立在匿名爆料與友人轉述之上，未見當事人以外的直接證據，也未見修杰楷本人對酒吧事件的直接回應。信任標籤：未確認——傳聞來自匿名爆料，缺乏直接證據，賈靜雯的回應是目前唯一的當事人說法。\\n仍不確定\\n酒吧事件的確切時間、地點與在場情形，爆料者的身分與動機，攔胡代言的具體經過，以及修杰楷本人是否會親自回應，現有素材都未說明。閃兵案的具體情形也不在素材範圍內。婚變與否目前僅為傳聞，讀者應以當事人後續的正式說法為準。\"},\"sources\":[{\"name\":\"ETtoday 影劇\",\"url\":\"https://star.ettoday.net/news/3277365\"},{\"name\":\"Google News TW Entertainment\",\"url\":\"https://news.google.com/rss/articles/CBMi6wJBVV95cUxNTlNEZVQtNzdTb1JqYUlOVWg4RjdPT1pEbU8tR1U0WmNaWVR5bkxUeXdKVUZVdWI1aTFWdzBBQjJHa2Itb0lGbTN4clBFcmtORFROcm10WlZnU3FPM0FtMk42eWczNkpEamJqVlRFTzFrTGU1RXNLYWMtc2ZiOGJkamhZcHBaNmJpZ1NuakVCNlJQVDlzeWhKcS1leFpCRElIamo3ekJMWS02TnF6Z0taWnJTTDdUOUFzd1AwbkZBMjJTcGJrZlJSNC1VcG9jOUVwQ1NMOEdsMEZ5X3hoWlVhZU5LUkQ5eXE3cUk2TjFpVTFVMDZIRXpSMWk4OTBXQ3hRaTRhUE5oZm03OUdDNG5kTkN2M3JTeDJEYUlEdFhMOFVKX1U0Nzg1bi1oeG8wMGt4N25tSlZya1E0dEF1NE9ETTVhU1JUYkNqY3FmLTNiVUNjVG5iSUVKQlJXdFpkWTJ0TlB6VEt6OXZ4Z3c?oc=5\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":16,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"eastAsiaGossip\",\"live-ingest\",\"region:tw\",\"ettoday-影劇\",\"ettoday-影劇\",\"ettoday-影劇\"],\"region\":\"tw\",\"glossary\":[{\"term\":{\"en\":\"Alyssa Chia\",\"zh-TW\":\"賈靜雯\"},\"blurb\":{\"en\":\"Taiwanese actress and two-time Golden Award winner for Best Actress; Xiu Jiekai's wife.\",\"zh-TW\":\"台灣演員，兩度獲得金獎影后；修杰楷的妻子。\"}},{\"term\":{\"en\":\"Xiu Jiekai\",\"zh-TW\":\"修杰楷\"},\"blurb\":{\"en\":\"Taiwanese actor; Alyssa Chia's husband.\",\"zh-TW\":\"台灣演員；賈靜雯的丈夫。\"}},{\"term\":{\"en\":\"Mirror Media\",\"zh-TW\":\"鏡週刊\"},\"blurb\":{\"en\":\"Taiwanese weekly magazine that published Chia's exclusive interview.\",\"zh-TW\":\"刊出賈靜雯獨家專訪的台灣週刊。\"}},{\"term\":{\"en\":\"ETtoday\",\"zh-TW\":\"ETtoday\"},\"blurb\":{\"en\":\"Taiwanese online news outlet.\",\"zh-TW\":\"台灣網路新聞媒體。\"}},{\"term\
