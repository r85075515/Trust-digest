c design, a Keysight certification for Tower Semiconductor, and edge AI system integration all point to design work moving beyond single components.\nWhat happened\nSemiconductor Engineering argues photonic design is becoming a system-level challenge: photonic engineers make decisions at many levels, a laser and an optical fiber each have performance requirements, their interface adds variables, and the pieces must perform together as a complete optical link, so meeting individual targets does not necessarily mean the system will perform as expected. SemiWiki reports Keysight Technologies has certified its Advanced Design System (ADS) Photonic Designer for Tower Semiconductor's PH18 silicon photonics process design kits, bringing electronic and photonic circuit development into a shared environment, announced November 9. EE Times Asia reports moving AI processing from the cloud to connected devices is changing how engineers design Internet of Things products, with greater emphasis on system integration, processing efficiency and long-term reliability, and that the shift requires more than adding an AI accelerator, involving sensor quality, memory bandwidth, thermal performance, connectivity and software.\nWhy it matters\nThe common lesson is integration. Whether the system is an optical link or an edge AI device, performance is decided by interfaces and trade-offs across the whole design, not by one component in isolation. That raises the value of shared design environments, such as the Keysight and Tower Semiconductor work, and of early attention to thermal, memory and connectivity limits in IoT products.\nSources agree / disagree\nThe three outlets do not corroborate one another because they cover different subjects; they agree only at the level of theme, that system integration matters. Treating their differing figures as a disagreement would be misleading, since the snippets do not show the numbers measuring the same thing.\nStill uncertain\nThe feed snippets are truncated and do not provide full specifications, test results, or product timelines for any of the three items. The Keysight item does not, in the available text, complete the description of what engineers can do after moving from schematics onward, and the edge AI item cuts off after listing design factors. Details should be checked in the full articles.\nTrust label: Bundled stories — three distinct industry items grouped by a shared system-integration theme, not mutual corroboration of a single event."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-01-edge-ai-design-extends-b\",\"category\":\"semiconductor\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-semiconductor-01-edge-ai-design-extends-b.webp\",\"imageAlt\":{\"en\":\"Cover related to: Edge AI Design Extends Beyond Compute to System Integration\",\"zh-TW\":\"相關封面圖：邊緣人工智慧設計從運算擴展到系統集成\"},\"publishedAt\":\"2026-11-26T02:28:15.000Z\",\"title\":{\"en\":\"Semiconductor Engineering highlights system-level design from photonics to edge AI\",\"zh-TW\":\"半導體工程（Semiconductor Engineering）等三篇報導凸顯從光子到邊緣 AI 的系統級設計\"},\"summary\":{\"en\":\"Three separate industry items share one theme: individual components meeting targets does not guarantee system performance. They cover photonic design as a system-level challenge, Keysight certification for Tower Semiconductor's PH18 process, and edge AI for IoT devices, where integration, efficiency and reliability matter beyond adding an accelerator alone.\",\"zh-TW\":\"三篇不同的產業報導共享同一個主題：個別元件達標，不保證整個系統表現。它們分別談光子設計的系統級挑戰、是德科技（Keysight）針對 Tower Semiconductor PH18 製程的認證，以及物聯網邊緣 AI，重點都在整合、效率與可靠性，而非只加一顆加速器。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"這組摘要把三篇不同的半導體報導放在一起，應理解為主題打包，而非同一項宣布的三種版本：光子設計、是德科技（Keysight）為 Tower Semiconductor 取得的認證，以及邊緣 AI 系統整合，都指向設計工作已超越單一元件。\\n發生了什麼事\\n半導體工程（Semiconductor Engineering）指出，光子設計正成為系統級挑戰：光子工程師要在多個層面做決策，雷射與光纖各有性能要求，兩者介面又帶來另一組變數，所有元件必須作為完整光鏈路一起運作，因此個別元件達標，不代表系統必然如預期表現。SemiWiki 報導，是德科技已讓其先進設計系統（Advanced Design System）光子設計工具通過 Tower Semiconductor PH18 矽光子製程設計套件的認證，把電子與光子電路開發帶入共享環境，該整合於 11 月 9 日宣布。EE Times Asia 則報導，把 AI 處理從雲端移到連網裝置，正在改變物聯網產品的設計方式，更重視系統整合、處理效率與長期可靠性，且這種轉變不只是加一顆 AI 加速器，還涉及感測器品質、記憶體頻寬、散熱表現、連線與軟體。\\n為什麼重要\\n共同課題是整合。無論是光鏈路還是邊緣 AI 裝置，表現都由整個設計的介面與取捨決定，而非單一元件。這提高了共享設計環境的價值，例如是德科技與 Tower Semiconductor 的合作，也凸顯物聯網產品須及早處理散熱、記憶體與連線限制。\\n來源異同\\n三家媒體報導的是不同題目，無法彼此佐證，只在主題層次一致，也就是系統整合很重要。若把摘要中不同的數字當成衝突會造成誤導，因為現有文字並未顯示那些數字在量測同一件事。\\n仍不確定\\n摘要經過截斷，三篇都沒有完整的規格、測試結果或產品時程。是德科技一項在現有文字中未完整說明工程師從原理圖之後能做什麼，邊緣 AI 一項也在列出設計因素後中斷，細節須查閱完整報導。\"},\"sources\":[{\"name\":\"Semiconductor Engineering\",\"url\":\"https://semiengineering.com/why-photonic-design-is-becoming-a-system-level-challenge/\"},{\"name\":\"SemiWiki\",\"url\":\"https://semiwiki.com/eda/keysight-eda/376442-keysight-unites-rf-and-photonic-design-for-tower-semiconductor/\"},{\"name\":\"EE Times Asia\",\"url\":\"https://www.eetasia.com/edge-ai-design-extends-beyond-compute-to-system-integration/\"}],\"disagreements\":null,\"trustScore\":68,\"trustBreakdown\":{\"sourceDiversity\":19,\"outletReputation\":10,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"semiconductor\",\"live-ingest\",\"semiconductor-engineering\",\"semiwiki\",\"ee-times-asia\"],\"glossary\":[{\"term\":{\"en\":\"Keysight Technologies\",\"zh-TW\":\"是德科技\"},\"blurb\":{\"en\":\"Company whose ADS Photonic Designer was certified for Tower Semiconductor's PH18 process design kits.\",\"zh-TW\":\"其 ADS 光子設計工具通過 Tower Semiconductor PH18 製程設計套件認證的公司。\"}},{\"term\":{\"en\":\"Tower Semiconductor\",\"zh-TW\":\"Tower Semiconductor\"},\"blurb\":{\"en\":\"Semiconductor company whose PH18 silicon photonics process is named in the Keysight item.\",\"zh-TW\":\"是德科技報導中被提及 PH18 矽光子製程的半導體公司。\"}},{\"term\":{\"en\":\"Advanced Design System (ADS) Photonic Designer\",\"zh-TW\":\"先進設計系統光子設計工具\"},\"blurb\":{\"en\":\"Keysight design tool that brings electronic and photonic circuit development into a shared environment.\",\"zh-TW\":\"是德科技把電子與光子電路開發帶入共享環境的設計工具。\"}},{\"term\":{\"en\":\"edge AI\",\"zh-TW\":\"邊緣 AI\"},\"blurb\":{\"en\":\"AI processing moved from the cloud to connected devices, as described by EE Times Asia.\",\"zh-TW\":\"EE Times Asia 所述、把 AI 處理從雲端移到連網裝置的做法。\"}},{\"term\":{\"en\":\"Internet of Things (IoT)\",\"zh-TW\":\"物聯網\"},\"blurb\":{\"en\":\"Connected devices whose design is being changed by edge AI processing.\",\"zh-TW\":\"因邊緣 AI 處理而改變設計方式的連網裝置。\"}},{\"term\":{\"en\":\"PH18 silicon photonics process\",\"zh-TW\":\"PH18 矽光子製程\"},\"blurb\":{\"en\":\"Tower Semiconductor process design kits named in the Keysight certification item.\",\"zh-TW\":\"是德科技認證報導中被提及的 Tower Semiconductor 製程設計套件。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-semiconductor-01-edge-ai-design-extends-b/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-semiconductor-01-edge-ai-design-extends-b/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"cont
