vised 135.1 billion USD in September, according to the U.S. Census Bureau's Monthly Advance Economic Indicators Report released on November 27, 2026. Exports of goods rose 3.2% (6.7 billion USD) to 215.8 billion USD, while imports surged 6.1% (21.1 billion USD) to 365.3 billion USD—more than doubling the 61.4 billion USD goods deficit recorded in October 2025.\n\nThe sharper-than-expected deficit—exceeding the 135.9 billion USD consensus forecast—was driven largely by capital goods imports, which climbed 8.5% on the month and 80.0% year over year to 171.4 billion USD amid ongoing U.S. artificial intelligence infrastructure buildouts. Because net imports are subtracted from gross domestic product calculations, the wider trade gap signals that trade could weigh on fourth-quarter U.S. GDP growth.\n\nThe U.S. Census Bureau's official advance report (Release CB26-195), Anadolu Agency, The Financial Express, and MLQ.ai all report identical headline figures for the October deficit (149.5 billion USD), September baseline (135.1 billion USD), exports (215.8 billion USD), imports (365.3 billion USD), and capital goods imports (171.4 billion USD), with no numerical discrepancies.\n\nThe October figures represent advance Census-basis estimates excluding trade in services; full international trade in goods and services data is scheduled for release on December 8, 2026, followed by November advance figures on December 28.\n\nTrust label: Multi-source agreement — Primary U.S. Census Bureau release aligns across international wire and financial news outlets."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-194-us-october-goods-trade-deficit-widens\",\"category\":\"finance\",\"title\":{\"en\":\"U.S. Goods Trade Deficit Widens 10.7% to 149.5 Billion USD in October as Capital Goods Imports Surge\",\"zh-TW\":\"美國 10 月商品貿易逆差擴大至 1,495 億美元遠超預期，資本財進口年增八成\"},\"summary\":{\"en\":\"Advance U.S. Census Bureau data released November 27, 2026, shows the U.S. international trade deficit in goods widened 10.7% in October to 149.5 billion USD, beating economists' 135.9 billion USD forecast as goods imports jumped 21.1 billion USD to 365.3 billion USD on surging capital goods demand.\",\"zh-TW\":\"美國普查局於 2026 年 11 月 27 日公布初步統計，受資本財進口年增 80% 推升整體商品進口大增 211 億美元至 3,653 億美元影響，美國 10 月商品貿易逆差月增 10.7% 達 1,495 億美元，遠高於市場預期的 1,359 億美元，恐對第四季經濟成長構成拖累。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」美國普查局（U.S. Census Bureau）於 2026 年 11 月 27 日發布《每月初步經濟指標報告》（編號 CB26-195），顯示美國 10 月商品貿易逆差擴大至 1,495 億美元，較 9 月修正後的 1,351 億美元增加 144 億美元（月增 10.7%），並較 2025 年同期的 614 億美元翻倍。10 月商品出口月增 3.2%（增加 67 億美元）至 2,158 億美元，商品進口則月增 6.1%（大增 211 億美元）至 3,653 億美元。\\n\\n「為什麼重要」10 月商品逆差大幅超出經濟學家預估的 1,359 億美元，主因資本財進口單月攀升 8.5%、年增高達 80.0% 至 1,714 億美元，反映美國人工智慧資料中心與相關硬體基礎設施建設帶動大量設備進口。由於貿易逆差擴大在國內生產毛額（GDP）核算中屬於減項，這組數據預示淨出口可能再度拖累美國第四季經濟成長。\\n\\n「來源異同」美國普查局官方新聞稿、土耳其安納杜魯新聞社（Anadolu Agency）、《金融快報》（The Financial Express）與 MLQ.ai 均一致載明 10 月逆差 1,495 億美元、出口 2,158 億美元、進口 3,653 億美元及資本財進口 1,714 億美元等核心統計，各來源數據完全吻合、並無衝突。\\n\\n「仍不確定」本次公布的數據僅為不含服務貿易的普查口徑初步估值，完整的 10 月美國商品與服務貿易收支報告將於 2026 年 12 月 8 日公布，11 月初步指標報告則排定於 12 月 28 日發布。\\n\\nTrust label: Multi-source agreement — 美國普查局一手統計公報與多家國際通訊社及財經媒體報導完全一致。\"},\"glossary\":[{\"term\":{\"en\":\"Goods trade deficit\",\"zh-TW\":\"商品貿易逆差\"},\"blurb\":{\"en\":\"The amount by which a country's imports of physical merchandise exceed its exports of physical goods over a given period.\",\"zh-TW\":\"一國在特定期間內實體商品進口總額超過出口總額的差額，不包含旅遊、金融等服務貿易。\"}},{\"term\":{\"en\":\"Capital goods\",\"zh-TW\":\"資本財（Capital goods）\"},\"blurb\":{\"en\":\"Physical assets such as industrial machinery, servers, and electrical equipment used by businesses to produce goods or services.\",\"zh-TW\":\"企業用於生產商品或提供服務的機器設備、伺服器與電機硬體等耐久性生產財。\"}},{\"term\":{\"en\":\"Advance Economic Indicators Report\",\"zh-TW\":\"每月初步經濟指標報告\"},\"blurb\":{\"en\":\"An early monthly statistical release by the U.S. Census Bureau providing preliminary estimates for goods trade, wholesale inventories, and retail inventories.\",\"zh-TW\":\"美國普查局每月提前發布的經濟快報，提供商品貿易收支、批發庫存與零售庫存的初步統計估值。\"}}],\"sources\":[{\"name\":\"U.S. Census Bureau (Release CB26-195)\",\"url\":\"https://www.census.gov/econ/indicators/advance_report.pdf\"},{\"name\":\"Anadolu Agency\",\"url\":\"https://www.aa.com.tr/en/economy/us-goods-trade-deficit-widens-to-1495b-in-october-exceeding-forecasts/4140528\"},{\"name\":\"The Financial Express\",\"url\":\"https://www.financialexpress.com/world-news/us-news/us-trade-deficit-hits-149-5-billion-in-october-how-ai-imports-trade-weighed-on-growth/4395667/lite/\"},{\"name\":\"MLQ.ai\",\"url\":\"https://mlq.ai/news/us-goods-trade-deficit-widens-to-1495-billion-as-imports-jump/\"}],\"imageUrl\":\"/covers/live/live-finance-194-us-october-goods-trade-deficit-widens.jpg\",\"imageAlt\":{\"en\":\"Container ship unloading cargo representing U.S. monthly goods trade figures\",\"zh-TW\":\"貨櫃輪裝卸貨物象徵美國每月商品進出口貿易數據\"},\"isHeadline\":false,\"isPopular\":true,\"trustScore\":91,\"trustBreakdown\":{\"crossCorroboration\":24,\"outletReputation\":24,\"recencyClarity\":24,\"sourceDiversity\":19},\"publishedAt\":\"2026-11-27T18:57:53.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":24,\"D2\":24,\"D3\":24,\"D4\":23,\"D5\":24,\"total\":24},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-finance-194-us-october-goods-trade-deficit-widens/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-sour
