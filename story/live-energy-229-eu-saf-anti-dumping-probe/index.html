ed on October 15, 2026 by the European Biodiesel Board. The official notice also states that the Commission intends to instruct customs authorities to register imports from both origins at an early stage.\n\n「Why it matters」\nSustainable aviation fuel is a key decarbonization pathway for commercial aviation, and potential retroactive customs duties affect supply costs for airlines, fuel blenders, and exporters. The case highlights tension between low-cost renewable fuel supply chains and domestic European biofuel producer protection.\n\n「Source differences」\nThe official legal notice on EUR-Lex is titled \"C_202606262EN.000101.fmx.xml - EUR-Lex\", setting out formal proceeding rules, product scope, and customs registration plans, while the European Commission trade case page is titled \"Trade defence investigations - European Union\" and lists Case AD768 details. Trade and industry coverage includes \"China is making inroads into Europe’s skies with cheap plane fuel. Brussels takes aim\" and \"EBB welcomes the EU Commission’s action to address unfair trading practices from Chinese bioSAF exporters on the EU market\", framing the market context and industry reaction.\n\n「Still uncertain」\nWhether provisional or definitive anti-dumping duties will be imposed, their exact duty rates, and the scope of customs registration remain subject to the investigation findings.\n\nTrust label: High confidence based on primary EU legal and trade records alongside industry coverage."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-energy-229-eu-saf-anti-dumping-probe\",\"category\":\"energy\",\"title\":{\"en\":\"EU Opens Anti-Dumping Investigation Into SAF From China and Singapore\",\"zh-TW\":\"歐盟對中國與新加坡永續航空燃料展開反傾銷調查\"},\"summary\":{\"en\":\"The European Commission initiated an anti-dumping proceeding into sustainable aviation fuel imports from China and Singapore following a complaint filed on October 15, 2026 by the European Biodiesel Board. EU trade and official journal notices outline customs registration plans and investigation procedures. The action signals tighter trade scrutiny over imported aviation biofuels in Europe.\",\"zh-TW\":\"歐盟執委會接獲歐洲生質柴油委員會於 2026 年 10 月 15 日提出的申訴後，正式對源自中國與新加坡的永續航空燃料展開反傾銷調查。歐盟貿易案件頁與官方公報公告載明海關登記計畫與調查程序，顯示歐洲正加強對進口航空生質燃料的貿易審查。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n歐盟執委會依據歐洲生質柴油委員會於 2026 年 10 月 15 日遞交的申訴，對源自中國與新加坡的永續航空燃料啟動反傾銷調查（案件編號 AD768）。官方公告並指出，執委會擬於調查早期指示海關對兩地進口產品辦理登記。\\n\\n「為什麼重要」\\n永續航空燃料是航空業減碳的重要路徑，若後續啟動進口登記並追溯課徵反傾銷稅，將影響航空公司、摻配商與出口商的供應成本與貿易流向，也凸顯平價供應鏈與歐盟本土生質燃料產業保護之間的角力。\\n\\n「來源異同」\\nEUR-Lex 官方公報頁面實際標題為「C_202606262EN.000101.fmx.xml - EUR-Lex」，載明立案程序、產品範圍與海關登記方向；歐盟貿易防衛案件頁面實際標題為「Trade defence investigations - European Union」，列出 AD768 案件資訊。另有報導與產業聲明頁面實際標題分別為「China is making inroads into Europe’s skies with cheap plane fuel. Brussels takes aim」與「EBB welcomes the EU Commission’s action to address unfair trading practices from Chinese bioSAF exporters on the EU market」，側重市場背景與產業立場。\\n\\n「仍不確定」\\n最終是否課徵臨時或確定性反傾銷稅、稅率水準以及進口登記具體措施，仍待調查程序推进與認定。\\n\\nTrust label: 高可信度（基於歐盟官方公報與貿易案件紀錄及產業報導）。\"},\"glossary\":[{\"term\":{\"en\":\"Sustainable aviation fuel\",\"zh-TW\":\"永續航空燃料\"},\"blurb\":{\"en\":\"Renewable or waste-derived jet fuel with a lower lifecycle carbon footprint than conventional fossil aviation fuel.\",\"zh-TW\":\"以生質、廢棄物或其他再生料製成，生命週期碳排低於傳統石化航油的航空燃料。\"}},{\"term\":{\"en\":\"Anti-dumping proceeding\",\"zh-TW\":\"反傾銷調查程序\"},\"blurb\":{\"en\":\"Trade remedy investigation examining whether exports are sold below normal value and injure domestic industry.\",\"zh-TW\":\"調查出口產品是否以低於正常價值價格傾銷，並對進口地國內產業造成損害的貿易救濟程序。\"}},{\"term\":{\"en\":\"Customs registration\",\"zh-TW\":\"海關登記\"},\"blurb\":{\"en\":\"Formal recording of covered imports that can enable retroactive collection of duties if measures are adopted.\",\"zh-TW\":\"對特定進口貨物進行登記，若後續採取救濟措施可能涉及追溯課稅的制度安排。\"}}],\"sources\":[{\"name\":\"EUR-Lex\",\"url\":\"https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=OJ:C
