ng the station for $89.99 shipped as part of its now-live Black Friday sale. The model launched just a few weeks ago at $116, so the deal takes $26 off — 22% — and the station is pitched with device recognition and an AI pet feature. Anker's wider Black Friday sale runs up to 46% off from $16, covering newer models including the 45W Nano charger with a smart display and the compact Nano Neo charger.\n\nWhy it matters\nA 22% cut weeks after launch makes Black Friday the cheapest entry point yet for a new Qi2.2 charger, but the two figures in play describe different things — 22% off this one station versus up to 46% off across the range — so shoppers should not mistake one for the other.\n\nSources agree / disagree\nBoth items come from 9to5Toys, a single outlet, so the $89.99 station price and the up-to-46% range-wide discount rest on one source. The figures describe different scopes, not a conflict between outlets.\n\nStill uncertain\nThe feed material gives no full specifications, device compatibility list or sale end date, so the final price at checkout on Amazon is what counts.\n\nTrust label: Single source — One outlet; the two figures cover different scopes, not a disagreement."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-shopping-02-first-deal-hits-anker-s-\",\"category\":\"shopping\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-shopping-02-first-deal-hits-anker-s-.jpg\",\"imageAlt\":{\"en\":\"Cover related to: First deal hits Anker’s all-new 25W Qi2.2 MagStand station with device recognition, AI pet, more for Black Friday – now just $90\",\"zh-TW\":\"相關封面圖：（譯文待補）First deal hits Anker’s all-new 25W Qi2.2 MagStand station with device recognition, AI pet, more for Black Friday – now just $90\"},\"publishedAt\":\"2026-11-19T08:31:43.000Z\",\"title\":{\"en\":\"Anker's New 25W Qi2.2 MagStand Charging Station Drops to $89.99 for Black Friday\",\"zh-TW\":\"安克（Anker）25W Qi2.2 MagStand 充電座黑五首降：89.99 美元\"},\"summary\":{\"en\":\"[Unconfirmed · Single source] Anker's all-new 25W Qi2.2 MagStand wireless charging station is $89.99 shipped in black at Anker's official Amazon storefront for Black Friday, down $26 from its $116 launch price — a first discount of 22%. Anker's wider sale runs up to 46% off from $16. Check device compatibility before buying.\",\"zh-TW\":\"［未證實·單一來源］安克（Anker）全新 25W Qi2.2 MagStand 無線充電座在亞馬遜（Amazon）官方店面迎來黑五首降，黑色款含運 89.99 美元，比原價 116 美元便宜 26 美元、降幅 22%。同場安克（Anker）全線黑五最高降 46%，自 16 美元起，買前先確認適用裝置再下手。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"安克（Anker）全新 25W Qi2.2 MagStand 無線充電座迎來黑色星期五首降，黑色款含運 89.99 美元。\\n\\n發生了什麼事\\n安克（Anker）官方亞馬遜（Amazon）店面正在舉行黑色星期五特賣，全新 25W Qi2.2 MagStand 無線充電座黑色款含運 89.99 美元。這款充電座數週前才上市，原價 116 美元，這次首降 26 美元、降幅 22%，主打裝置辨識與 AI 寵物等功能。同場安克（Anker）全線特賣最高降 46%，自 16 美元起，涵蓋 45W Nano 充電器、Nano Neo 充電器等新品。\\n\\n為什麼重要\\n25W Qi2.2 是新一代無線充電規格，充電座才上市數週就首降，代表黑五是入手新品的低點；但 22% 降幅只針對這一款，全線最高 46% 的品項不同，別把兩個數字混成同一優惠。\\n\\n來源異同\\n目前只有 9to5Toys 一家來源，兩則報導都出自同一家媒體：89.99 美元是 MagStand 單品價，46% 是安克（Anker）全線特賣的最高降幅，兩個數字談的是不同範圍，並非來源衝突。\\n\\n仍不確定\\n摘要素材未列出充電座的完整規格、適用裝置清單與特賣截止時間，實際折扣以亞馬遜（Amazon）店面結帳價為準。\"},\"sources\":[{\"name\":\"9to5Toys\",\"url\":\"https://9to5toys.com/2026/11/19/first-deal-anker-all-new-25w-qi2-2-magstand-station-black-friday/\"}],\"disagreements\":null,\"trustScore\":47,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":10,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"shopping\",\"live-ingest\",\"9to5toys\",\"9to5toys\"],\"glossary\":[{\"term\":{\"en\":\"Anker\",\"zh-TW\":\"安克（Anker）\"},\"blurb\":{\"en\":\"Electronics brand known for chargers and accessories.\",\"zh-TW\":\"以充電器與配件聞名的電子品牌。\"}},{\"term\":{\"en\":\"MagStand\",\"zh-TW\":\"MagStand\"},\"blurb\":{\"en\":\"Anker's wireless charging stand line.\",\"zh-TW\":\"安克的無線充電座系列。\"}},{\"term\":{\"en\":\"Qi2.2\",\"zh-TW\":\"Qi2.2\"},\"blurb\":{\"en\":\"The latest wireless charging standard.\",\"zh-TW\":\"最新一代無線充電標準。\"}},{\"term\":{\"en\":\"Amazon\",\"
