acing them as he enters a new stage. The remarks came as he takes on a new identity as a guest curator.\nWhat happened\nETtoday reported Yan's rare discussion of emotional trauma, quoting his remark that four breakups nearly stopped him from daring to love again. SETN reported that Yan confirmed four breakups and framed his stance as facing the past bravely while entering a new stage with a new identity. Yan is also making his debut as guest curator of Convergence of Memories (記憶的匯聚), a two-artist exhibition with South Korean artists Kim Gwan-young (金官泳) and Yoo Chung-mok (俞忠穆) showing 27 works in Taipei from November 14 to December 13.\nWhy it matters\nThe judgment is about control of the narrative: Yan is telling a painful history on his own terms instead of leaving it to speculation, and pairing that candor with a new professional role. For a public figure, naming four breakups reframes past relationships as experience rather than rumor. The curator debut gives that message a forward-looking anchor beyond the headlines.\nSources agree / disagree\nETtoday and SETN agree that Yan discussed four breakups and a new identity, with no conflicting facts in the snippets. Trust label: Two-source agreement — two outlets agree on the core claims. Both reports are short feed items, and neither reproduces Yan's remarks in full.\nStill uncertain\nThe snippets do not give the occasion for Yan's remarks, his exact words beyond the quoted line, or details of his current relationship status beyond SETN's headline reference to companionship. The exhibition's curatorial direction is described only briefly; verify details in the full reports."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-eastAsiaGossip-01-4-ettoday-ettoday\",\"category\":\"eastAsiaGossip\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-eastAsiaGossip-01-4-ettoday-ettoday.png\",\"imageAlt\":{\"en\":\"Cover related to: 炎亞綸罕談感情創傷！「分手4次差點不敢再愛」吐露真實心聲 - ETtoday星光雲| ETtoday新聞雲\",\"zh-TW\":\"相關封面圖：炎亞綸罕談感情創傷！「分手4次差點不敢再愛」吐露真實心聲 - ETtoday星光雲| ETtoday新聞雲\"},\"publishedAt\":\"2026-10-30T10:04:00.000Z\",\"title\":{\"en\":\"Aaron Yan: Four Breakups Left Him Afraid to Love Again, as Curator Debut Opens in Taipei\",\"zh-TW\":\"炎亞綸（Aaron Yan）：四次分手後差點不敢再愛，首度策展在台北登場\"},\"summary\":{\"en\":\"Taiwanese entertainer Aaron Yan (炎亞綸), covered by ETtoday and SETN, rarely discussed his romantic history and said four breakups nearly left him afraid to love again. He spoke as he takes on a new role as guest curator for a Taipei exhibition. His message is to face the past and move into a new stage.\",\"zh-TW\":\"台灣藝人炎亞綸（Aaron Yan，ETtoday 與三立新聞網報導），罕見談起感情創傷，表示四次分手讓他差點不敢再愛。他同時以特邀策展人的新身分推出雙個展。直面過去，是他迎接下一階段的方式。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"四次分手讓炎亞綸（Aaron Yan）差點不敢再愛：這位台灣藝人罕見談起感情創傷，ETtoday 與三立新聞網（SETN）均有報導。炎亞綸證實四次分手，表示要勇敢面對、迎接下一階段。發言之際，他正以特邀策展人的新身分登場。\\n發生了什麼事\\nETtoday 報導炎亞綸罕談感情創傷，引述他四次分手後差點不敢再愛的說法。三立新聞網報導他證實分手四次，談及近況與新身分，態度是勇敢面對、迎接下一階段。他首度擔任特邀策展人，與南韓藝術家金官泳、俞忠穆推出雙個展《記憶的匯聚》，11 月 14 日至 12 月 13 日在台北展出 27 件作品。合作源於朋友閒聊，他從記憶堆疊與自我反思找到策展方向，也親自參與展場設計。他笑說：「可能會巧遇本綸喔！」\\n為什麼重要\\n判斷在於敘事主導權：炎亞綸用自己的話講述痛苦經歷，而不是留給外界猜測，同時用新專業身分搭配這份坦率。對公眾人物而言，說出四次分手，是把過去的感情經歷變成經驗，而不是傳聞。策展首秀讓這番話有面向未來的落點，不只停留在感情頭條。\\n來源異同\\nETtoday 與三立新聞網對炎亞綸談及四次分手與新身分的報導一致，摘要片段沒有事實衝突。信任標籤：兩源一致——兩家媒體對核心主張的報導一致。兩則報導都是簡短摘要，沒有完整引述炎亞綸的發言。\\n仍不確定\\n摘要片段沒有說明炎亞綸發言的場合、除引言外的確切用詞，也沒有說明他目前感情狀態的細節，只在標題提及有人陪伴。展覽策展方向只有簡短描述；引用細節前請查閱完整報導。\"},\"sources\":[{\"name\":\"ETtoday 影劇\",\"url\":\"https://star.ettoday.net/news/3263492\"},{\"name\":\"setn.com\",\"url\":\"https://news.google.com/rss/articles/CBMiSEFVX3lxTE5US2JlcWJuTmk3NVU5VzNiYTZUOUtJNS14QnVoS0xWSWNUeTR2UzVnYkF2QWdiSl9lYVQ3UG1ONHZSY05QRU5JZNIBTEFVX3lxTE5nY1ZTTWtvamMxajlWbGo4Q3hMRGVDbGZoZlNraGlmalhBbnZwZnFPelBMMW13MWFUdDZQVzVBUnNjRVZVSkM0OWNhdVI?oc=5\"}],\"disagreements\":null,\"trustScore\":69,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":16,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"eastAsiaGos
