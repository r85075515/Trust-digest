 a \"dangerous product without proper oversight,\" as reported earlier by Reuters . The lawsuit claims the cyberattack on Hugging Face \"wa California Attorney General Rob Bonta has sued OpenAI under the state's unfair competition and public nuisance laws, for allegedly misleading and endangering the public by deploying unsafe AI models. The lawsuit [PDF], filed in California Superior Court, follows the compromise of Hugging Face's infrastructure and other cyber incidents OpenAI's experimental models caused when taking autonomous acti Why it matters\nThis cluster was assembled from 6 feed item(s) across 6 outlet(s) (BBC Business, TechCrunch, The Verge, The Register, Financial Times, NPR News) in the international category. Axiom links out to each publisher; this digest only restates titles and short feed descriptions — not full articles. Sources agree / disagree\nMultiple outlets are covering closely related headlines: \"California sues OpenAI over Hugging Face attack\" (BBC Business); \"California state AG sues OpenAI over rogue agent incidents\" (TechCrunch); \"California sues OpenAI over rogue AI hacking incidents\" (The Verge); \"California sues OpenAI for misleading public about AI safety\" (The Register); \"OpenAI sued by California over 80 ‘loss of control’ incidents\" (Financial Times).\nNo clear numeric/name conflicts detected in the short feed snippets; always verify details on the publisher pages. Still uncertain\nFeed descriptions can omit context, updates, or corrections. Click through to the linked outlets for the latest full reporting. Trust scores are heuristics, not fact-check guarantees. Linked sources (outlet names only): BBC Business, TechCrunch, The Verge, The Register, Financial Times, NPR News"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-01-california-sues-openai-o\",\"category\":\"international\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-
