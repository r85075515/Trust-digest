irstrike killed 11 people in Yemen's Taiz governorate. On the same day, the Saudi-led military coalition backing Yemen's internationally recognized government stated that it had conducted operations against the Houthi group and intercepted drones launched toward the Saudi capital of Riyadh.\n\nThe simultaneous exchanges mark a significant flare-up in direct cross-border military confrontation between Riyadh and the Iran-aligned Houthis, threatening fragile regional de-escalation efforts and commercial security around the Red Sea corridor.\n\nBoth The Hindu and The New Arab rely on the same Agence France-Presse (AFP) wire dispatch, carrying the Houthi media toll of 11 fatalities in Taiz alongside the Saudi-led coalition's statement confirming drone interceptions over Saudi territory.\n\nIndependent verification of the 11 fatalities reported by Houthi media, whether the victims were civilians or fighters, and the exact causal sequence between the Riyadh drone interception and the Taiz strike remain unconfirmed.\n\nTrust label: Single source — Both listed outlets republish the same AFP wire dispatch, while casualty figures rely solely on Houthi media claims."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-173-saudi-coalition-yemen-strike-houthi-drone\",\"category\":\"international\",\"title\":{\"en\":\"Houthi Media Reports 11 Killed in Saudi Strike in Yemen as Coalition Intercepts Riyadh Drone\",\"zh-TW\":\"胡塞媒體稱沙烏地空襲葉門致11死 聯軍宣布攔截飛向利雅德無人機\"},\"summary\":{\"en\":\"Houthi-run media reported on November 27 that a Saudi strike killed 11 people in Yemen's Taiz governorate, while the Saudi-led coalition announced its air defenses intercepted drones targeting Riyadh. Takeaway: Mutual aerial strikes between Riyadh and the Houthis signal a sharp escalation in cross-border hostilities across the Arabian Peninsula.\",\"zh-TW\":\"葉門胡塞武裝媒體於11月27日稱沙烏地空襲葉門塔伊茲省造成11人死亡，同日沙烏地領導的多國聯軍則宣布防空系統擊落飛往利雅德的無人機。一句結論：沙烏地與胡塞武裝再度爆發跨境空襲與無人機攻防，顯示阿拉伯半島安全局勢明顯升溫。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」葉門胡塞武裝所屬媒體於 2026 年 11 月 27 日報導，沙烏地阿拉伯對葉門塔伊茲省（Taiz）發動空襲，造成 11 人喪生；同日，支持葉門國際承認政府的沙烏地領導多國聯軍則發表聲明，證實對胡塞武裝採取軍事行動，並成功攔截飛向沙烏地首都利雅德的無人機。\\n\\n「為什麼重要」利雅德與胡塞武裝在同一天發生跨境空襲與首都防空攔截，顯示雙方直接軍事對抗再度升高，恐衝擊阿拉伯半島既有緩和進程，並為紅海周邊航運與區域安全增添變數。\\n\\n「來源異同」《印度教徒報》（The Hindu）與《新阿拉伯人報》（The New Arab）皆轉載同一則法新社（AFP）電訊稿，並列呈現胡塞媒體宣稱塔伊茲空襲致 11 死的消息，以及沙烏地聯軍攔截無人機的官方說法。\\n\\n「仍不確定」胡塞媒體單方面公布的 11 人死亡數字及死者身分（平民或武裝人員）尚未獲獨立第三方核實，利雅德無人機襲擊與塔伊茲空襲的精確先後因果亦仍待釐清。\\n\\nTrust label: Single source — 兩家媒體均轉載同一則法新社（AFP）通訊社稿件，且傷亡數字僅源自胡塞媒體宣稱。\"},\"glossary\":[{\"term\":{\"en\":\"Saudi-Led Coalition\",\"zh-TW\":\"沙烏地領導多國聯軍\"},\"blurb\":{\"en\":\"A military alliance led by Saudi Arabia supporting Yemen's internationally recognized government against the Houthi movement.\",\"zh-TW\":\"由沙烏地阿拉伯主導的軍事聯盟，旨在支持葉門國際承認政府並對抗胡塞武裝。\"}},{\"term\":{\"en\":\"Taiz Governorate\",\"zh-TW\":\"塔伊茲省\"},\"blurb\":{\"en\":\"A strategic southwestern province in Yemen situated near the Bab el-Mandeb Strait.\",\"zh-TW\":\"位於葉門西南部的戰略要衝省份，鄰近連接紅海與亞丁灣的曼德海峽。\"}},{\"term\":{\"en\":\"Houthi Movement\",\"zh-TW\":\"胡塞武裝\"},\"blurb\":{\"en\":\"An armed political and religious movement controlling northern Yemen, including the capital Sanaa.\",\"zh-TW\":\"控制葉門北部及首都沙那的武裝政治組織，近年持續與沙烏地及紅海航運發生軍事衝突。\"}}],\"sources\":[{\"name\":\"The Hindu\",\"url\":\"https://www.thehindu.com/news/international/saudi-strike-kills-11-in-yemen-reports-houthi-media/article71752134.ece\"},{\"name\":\"The New Arab\",\"url\":\"https://www.newarab.com/news/saudi-strike-kills-11-yemens-taiz?amp\"}],\"imageUrl\":\"/covers/live/live-international-173-saudi-coalition-yemen-strike-houthi-drone.jpg\",\"imageAlt\":{\"en\":\"Map and regional context of Yemen's Taiz governorate and Riyadh following November 27 airstrikes and drone interceptions\",\"zh-TW\":\"11月27日葉門塔伊茲省空襲與利雅德無人機攔截事件區域示意\"},\"isHeadline\":true,\"isPopular\":false,\"trustScore\":72,\"trustBreakdown\":{\"crossCorroboration\":20,\"outletReputation\":21,\"recencyClarity\":21,\"sou
