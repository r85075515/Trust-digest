rception in overtime, but Dillingham's verdict was plain: that game's not on him.\nWhat happened\nWith daylight fading at Mountain America Stadium in Tempe, freshman quarterback Jake Fette sat on the 30-yard marker, head down, overcome with emotion after throwing an interception in overtime. On Saturday against Oklahoma State, Fette was 16-for-25 with 227 yards and two touchdowns, adding 27 yards and a touchdown on the ground. ASU surrendered a 17-point second-half lead and lost 30-27 in overtime, denying its senior class a final home victory. On Sunday, in the same game that ended the seniors' home slate, Dillingham praised Fette publicly.\nWhy it matters\nA freshman quarterback's first overtime heartbreak can define a season, and the coach's public defence is meant to stop it from defining Fette. The numbers back Dillingham up: 227 yards and two touchdowns through the air plus a rushing score is a strong day for a freshman, and the loss also involved a blown 17-point lead. The takeaway is about the program's direction, not one throw: ASU now heads into the 100th Territorial Cup game against rival Arizona.\nSources agree-disagree\nThis cluster is assembled from two feed items across a single outlet, Cronkite News, covering the same game from the Fette angle and the seniors' angle. The figures line up: 16-for-25, 227 yards, 30-27 in overtime. Trust label: Single source. One outlet, two items on the same game, but uncorroborated beyond that.\nStill uncertain\nThe summaries do not give a full scoring sequence, the exact overtime possession, or Fette's status for the Territorial Cup. How the locker room responds to the loss will only show up in the rivalry game."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-arizona-02-that-game-s-not-on-him-k\",\"category\":\"arizona\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-arizona-02-that-game-s-not-on-him-k.jpg\",\"imageAlt\":{\"en\":\"Cover related to: ‘That game’s not on him’: Kenny Dillingham praises ASU QB Jake Fette despite critical interception in loss to Oklahoma State\",\"zh-TW\":\"相關封面圖：「那場比賽不適合他」：肯尼·迪林漢姆稱讚亞利桑那州立大學四分衛傑克·費特，儘管在輸給俄克拉荷馬州立大學的比賽中被關鍵攔截\"},\"publishedAt\":\"2026-11-22T15:55:25.000Z\",\"title\":{\"en\":\"ASU Coach Defends Freshman QB Jake Fette After Overtime Loss to Oklahoma State\",\"zh-TW\":\"亞利桑那州大延長賽不敵奧克拉荷馬州大，總教練力挺菜鳥四分衛費特\"},\"summary\":{\"en\":\"Arizona State fell to Oklahoma State 30-27 in overtime on Saturday, surrendering a 17-point second-half lead, after freshman quarterback Jake Fette threw a critical interception. Fette finished 16-for-25 for 227 yards and two touchdowns. Coach Kenny Dillingham defended him: that game is not on him. Next up is the 100th Territorial Cup against rival Arizona.\",\"zh-TW\":\"［未證實·單一來源］亞利桑那州大（ASU）週六延長賽 27 比 30 不敵奧克拉荷馬州大，下半場 17 分領先化為烏有；菜鳥四分衛傑克·費特（Jake Fette）在延長賽傳出關鍵抄截。費特全場 25 傳 16 中、227 碼、2 次達陣。總教練肯尼·迪林漢姆（Kenny Dillingham）力挺他：「那場比賽不怪他。」下一場是對宿敵亞利桑那大學的第 100 屆領地盃。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"亞利桑那州大（ASU）週六延長賽 27 比 30 不敵奧克拉荷馬州大，總教練肯尼·迪林漢姆（Kenny Dillingham）第一時間跳出來替菜鳥四分衛扛責。傑克·費特（Jake Fette）在延長賽傳出關鍵抄截，但迪林漢姆的結論很直接：「那場比賽不怪他。」\\n發生了什麼事\\n天色漸暗的坦佩（Tempe）山美洲體育場（Mountain America Stadium），菜鳥四分衛費特在延長賽傳出抄截後，坐在 30 碼線上低頭不語、情緒潰堤。對奧克拉荷馬州大一役，他 25 傳 16 中、227 碼、2 次達陣，地面再推進 27 碼、跑出 1 次達陣。亞利桑那州大下半場 17 分領先被翻盤，延長賽 27 比 30 落敗，大四學長們沒能以主場勝利告別。週日，迪林漢姆公開稱讚費特。\\n為什麼重要\\n菜鳥四分衛第一次延長賽心碎可能定調整個球季，總教練公開力挺就是要阻止一記傳球定義費特。數據也站在迪林漢姆這邊：傳球 227 碼、2 次達陣，外加地面達陣，對菜鳥來說已是出色的一天；輸球也和 17 分領先被翻盤有關。重點不在那一傳，而在球隊走向：亞利桑那州大接下來要踢對宿敵亞利桑那大學的第 100 屆領地盃。\\n來源異同\\n本批由同一家來源（Cronkite News）的兩則 feed 組成，分別從費特與大四學長的角度報導同一場比賽。數字一致：16 傳中 25 次、227 碼、延長賽 30 比 27。信任標籤：僅1源。\\n仍不確定\\n摘要未給完整得分過程、延長賽的球權細節，也沒說費特在領地盃是否先發。更衣室如何回應這場敗仗，要到宿敵戰才看得出來。\"},\"sources\":[{\"name\":\"Cronkite News\",\"url\":\"https://cronkitenews.azpbs.org/2026/11/22/that-games-not-on-him-kenny-dillingham-praises-asu-qb-jake-fette-despite-critical-interception-in-loss-to-oklahoma-state/\"}],\"disagreements\":{\"en\":\"Figures differ across outlets (e.g. 16 vs 17 in headlines/snippets).\",\"zh-TW\":\"不同媒體的數字有所不同（例如，標題/摘要中的數字為 16 比 17）。\"},\"trustScore\":47,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":10,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"arizona\",\"live-ingest\",\"cronkite-news\",\"cronkite-news\"],\"glossary\":[{\"term\":{\"en\":\"Jake Fette\",\"zh-TW\":\"傑克·費特\"},\"blurb\":{\"en\":\"Arizona State freshman quarterback who threw the overtime interception.\",\"zh-TW\":\"亞利桑那州大菜鳥四分衛，傳出延長賽關鍵抄截。\"}},{\"term\":{\"en\":\"Kenny Dillingham\",\"zh-TW\":\"肯尼·迪林漢姆\"},\"blurb\":{\"en\":\"Arizona State head coach who publicly defended Fette.\",\"zh-TW\":\"亞利桑那州大總教練，公開力挺費特。\"}},{\"term\":{\"en\":\"Arizona State University\",\"zh-TW\":\"亞利桑那州立大學\"},\"blurb\":{\"en\":\"Tempe university whose Sun Devils lost 30-27 in overtime.\",\"zh-TW\":\"坦佩的大學，太陽魔鬼隊延長賽 27 比 30 落敗。\"}},{\"term\":{\"en\":\"Oklahoma State\",\"zh-TW\":\"奧克拉荷馬州大\"},\"blurb\":{\"en\":\"Visiting team that rallied from 17 points down to win in overtime.\",\"zh-TW\":\"客隊，從落後 17 分逆轉、延長賽獲勝。\"}},{\"term\":{\"en\":\"Territorial Cup\",\"zh-TW\":\"領地盃\"},\"blurb\":{\"en\":\"Annual rivalry game between Arizona State and the University of Arizona.\",\"zh-TW\":\"亞利桑那州大與亞利桑那大學每年一度的宿敵戰。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-arizona-02-that-game-s-not-on-him-k/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\"
