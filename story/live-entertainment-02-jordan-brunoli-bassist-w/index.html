nosed with stage 4 colorectal cancer in 2025, he chose to speak openly about his illness and advocate for others living with it, rather than retreat from public life.\n\nWhat happened\nBrunoli was the bass player in Bugs, a Brisbane-based indie rock trio, and performed on all four of the band's albums, including their latest, Head Noise. Billboard reports that he died on the night of November 18, aged 31, following a public fight with cancer that began with a stage 4 colorectal cancer diagnosis in 2025. Instead of keeping his illness private, he used his platform to advocate for others suffering with illness.\n\nWhy it matters\nBrunoli's death at 31 cuts short a career inside one of Australia's best-loved independent bands, and his public advocacy gave his illness a purpose beyond himself. For a band built on a small, close-knit scene, losing a member who played on every album is a loss that reshapes the group's future. His choice to speak openly also leaves a model for how public figures can handle serious illness.\n\nSources agree-disagree\nOnly Billboard has reported this in the feed, so the details have no second source. Nothing in the material conflicts with itself; the date, age, diagnosis and band history come from a single consistent account.\n\nStill uncertain\nThe feed summary gives no cause of death beyond the cancer battle, no funeral or memorial details, and no statement from the band or his family. It also does not say what comes next for Bugs. Those details need the full Billboard report or statements from those close to him.\n\nTrust label: Single source — one Billboard report with no independent corroboration in the feed."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-entertainment-02-jordan-brunoli-bassist-w\",\"category\":\"entertainment\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-entertainment-02-jordan-brunoli-bassist-w.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Jordan Brunoli, Bassist With Australian Indie Rockers Bugs, Dies at 31\",\"zh-TW\":\"相關封面圖：澳洲獨立搖滾樂團貝斯手 Jordan Brunoli 過世，享年 31 歲\"},\"publishedAt\":\"2026-11-20T08:43:31.000Z\",\"title\":{\"en\":\"Bugs Bassist Jordan Brunoli Dies at 31 After Cancer Battle\",\"zh-TW\":\"澳洲獨立搖滾樂團 Bugs 貝斯手喬丹·布魯諾利（Jordan Brunoli）過世，享年31歲\"},\"summary\":{\"en\":\"[Unconfirmed · Single source] Jordan Brunoli, bassist with Brisbane indie rock trio Bugs, died on Wednesday night, November 18, after a public battle with cancer. He was 31. Diagnosed with stage 4 colorectal cancer in 2025, he used his illness to advocate for others, and played on all four of the band's albums.\",\"zh-TW\":\"［未證實·單一來源］澳洲布里斯本（Brisbane）獨立搖滾三人組 Bugs 貝斯手喬丹·布魯諾利（Jordan Brunoli）11月18日晚間在與癌症公開抗爭後過世，享年31歲。他2025年確診第四期大腸直腸癌，選擇為其他病患發聲，並參與樂團4張專輯演出，最新專輯為《Head Noise》。結論：他沒有選擇低調養病，而是公開抗癌並為其他病患發聲。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"澳洲布里斯本（Brisbane）獨立搖滾三人組 Bugs 貝斯手喬丹·布魯諾利（Jordan Brunoli）11月18日晚間在與癌症公開抗爭後過世，享年31歲。告示牌（Billboard）報導，他2025年確診第四期大腸直腸癌，沒有選擇低調養病，而是公開談論病情、為其他病患發聲。\\n\\n發生了什麼事\\n布魯諾利是布里斯本獨立搖滾三人組 Bugs 的貝斯手，參與樂團4張專輯演出，包括最新專輯《Head Noise》。告示牌報導，他在11月18日晚間過世，享年31歲。2025年確診第四期大腸直腸癌後，他沒有把病情藏起來，而是利用自己的聲量為其他病患倡議。\\n\\n為什麼重要\\n31歲早逝，中斷了他在澳洲深受喜愛的獨立樂團裡的生涯，他公開倡議的選擇也讓這場病超越個人意義。對一個靠緊密場景起家的樂團來說，失去參與每張專輯的成員，是會改寫樂團未來的損失。他公開面對重病的方式，也為公眾人物如何處理重大疾病留下一個範例。\\n\\n來源異同\\n摘要裡只有告示牌一家報導，細節沒有第二個來源佐證。現有材料內部沒有矛盾，日期、年齡、診斷與樂團經歷都出自同一份一致的敘述。\\n\\n仍不確定\\n摘要除了癌症抗爭之外沒有交代死因細節，也沒有葬禮或追思安排、樂團或家屬的聲明，沒有說明 Bugs 接下來何去何從。這些要看告示牌全文或相關人士的說法才能確認。\\n\\n信任標籤：單一來源——僅憑《告示牌》（Billboard）一篇報導，本批沒有獨立佐證。\"},\"sources\":[{\"name\":\"Billboard\",\"url\":\"https://www.billboard.com/music/music-news/jordan-brunoli-bugs-obituary-1236386241/\"}],\"disagreements\":null,\"trustScore\":53,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":16,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"entertainment\",\"live-ingest\",\"billboard\"],\"glossary\":[{\"blurb\":{\"en\":\"Bassist with Australian indie rock trio Bugs, died aged 31.\",\"zh-TW\":\"澳洲獨立搖滾三人組
