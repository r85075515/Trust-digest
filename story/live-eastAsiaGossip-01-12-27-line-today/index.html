 the one pairing the group never staged. Cheung said he hopes to build a show with laughter, tears, and resonance. So said of their friendship: whenever he looks back, Cheung is always there.\nWhy it matters\nThe verdict is about a 41-year friendship finally taking one stage: the concert fills the one gap in BIG FOUR's history, and the surprise announcement turns a long-standing regret into a date fans can plan around. For audiences who grew up with both singers, the show is nostalgia with a deadline — one night in Kaohsiung, not a tour. The pairing works because the story is the friendship, and the concert is where it gets told.\nSources agree / disagree\nETtoday, Mirror Media, CTS News via LINE TODAY, and Vogue Taiwan all report the same announcement with the same facts: December 27, Kaohsiung Music Center, first joint concert, 41 years of friendship. No conflicts appear across the outlets. Trust label: Multi-source agreement — four or more outlets agree on the date, venue, and first-time pairing.\nStill uncertain\nTicketing details, prices, and the setlist are not in the feed snippets, and the sources give no word on whether more dates will follow. Whether the Kaohsiung night is a one-off or the start of something bigger is unknown; check the full reporting for ticket information before planning a trip."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-eastAsiaGossip-01-12-27-line-today\",\"category\":\"eastAsiaGossip\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-eastAsiaGossip-01-12-27-line-today.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 張衛健、蘇永康首度開合體演唱會！ 12月27日高雄圓夢開唱 | 華視新聞 - LINE TODAY\",\"zh-TW\":\"相關封面圖：張衛健、蘇永康首度開合體演唱會！ 12月27日高雄圓夢開唱 | 華視新聞 - LINE TODAY\"},\"publishedAt\":\"2026-11-05T07:40:15.000Z\",\"title\":{\"en\":\"Dicky Cheung and William So Reunite for First Joint Concert in Kaohsiung on December 27\",\"zh-TW\":\"張衛健（Dicky Cheung）與蘇永康（William So）首度合體開唱：12 月 27 日高雄圓夢\"},\"summary\":{\"en\":\"Hong Kong singers Dicky Cheung and William So, friends for 41 years, will hold their first joint concert on December 27 at Kaohsiung Music Center's Haiyin Hall. The D\u0026W 2026 show fulfills a long-standing regret: both are BIG FOUR members who performed with other partners but never together. Cheung promises a show with laughter, tears, and resonance.\",\"zh-TW\":\"認識 41 年的香港歌手張衛健（Dicky Cheung）與蘇永康（William So）無預警宣布，12 月 27 日在高雄流行音樂中心海音館舉辦「D\u0026W 2026 健·康演唱會」，首度合體開唱。兩人同為 BIG FOUR 成員，過去各自與許志安（Andy Hui）、梁漢文（Edmond Leung）合作開唱，唯獨沒有兩人的演唱會；張衛健說，要打造「有笑、有淚、有共鳴」的演出。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"認識 41 年的香港歌手張衛健（Dicky Cheung）與蘇永康（William So）將於 12 月 27 日在高雄流行音樂中心海音館舉辦首度合體演唱會，演出名為「D\u0026W 2026 健·康演唱會 IN KAOHSIUNG」。\\n發生了什麼事\\n張衛健與蘇永康無預警宣布，將於 12 月 27 日在高雄流行音樂中心海音館合體開唱，演出名為「D\u0026W 2026 健·康演唱會」。兩人是認識 41 年的多年好友，也都是 BIG FOUR 的成員。過去他們各自與許志安（Andy Hui）、梁漢文（Edmond Leung）合作開唱過，偏偏就是沒有屬於兩人的演唱會——這是這個團體從未寫過的組合。張衛健表示，希望這次能打造「有笑、有淚、有共鳴」的演出。蘇永康則說：「我永遠回頭一看，他都在。」\\n為什麼重要\\n結論在於一段 41 年的友誼終於站上同一個舞台：這場演唱會補上了 BIG FOUR 歷史上唯一的空缺，而無預警的宣布把一個長期的遺憾變成了一個粉絲可以提前規劃的日期。對一路聽著兩人的歌長大的聽眾來說，這是一場有截止日期的懷舊之夜：12 月 27 日在高雄的一晚，而不是一次巡演。這個組合有效，因為故事本身就是友誼，而演唱會就是講這個故事的地方。\\n來源異同\\nETtoday、鏡週刊、華視新聞（經 LINE TODAY）與台灣版 Vogue 都報導了同一項宣布，事實一致：12 月 27 日、高雄流行音樂中心海音館、首度合體開唱、41 年友誼。各家的說法中沒有出現衝突。信任標籤：多源一致——四家以上媒體對日期、場地與首度合體的說法一致。\\n仍不確定\\n售票細節、票價與歌單，採訪線摘要都沒有提到，來源也沒有說明是否會有更多場次。高雄這一晚是唯一一場還是更大計劃的開端，目前無法確定；規劃前往之前，請查閱完整報導中的售票資訊。\"},\"sources\":[{\"name\":\"ETtoday 影劇\",\"url\":\"https://star.ettoday.net/news/3266872\"},{\"name\":\"Google News\",\"url\":\"https://news.google.com/rss/articles/CBMiigFBVV95cUxNMVh2TkU3a2pEaEx6ZWhucDFNcEFVOC1ueFUwUTNuZ05MUTBRNDh5TFg3TndFQk1pNnZ6bjVWREp2TW02NXJHX0c5T3JYeWFMcjRlUHVVNDZ6cEJEdmgxbUJtSEVlekVGa2VQd1pFNVptMDk3LW40QTFOOFZFODA0OGttMkRXd2NqVkE?oc=5\"},{\"name\":\"Google News TW 娛樂\",\"url\":\"https://news.google.com/rss/articles/CBMiZEFVX3lxTFA1S0dqSkRUT2RCVUpoa3lra3ljN0NoUEk5UWJMYUpHU3pGTmRtRlBYc05BWXA1aVdNaGFOSDBqenNGQUxhVEthZkFFTF9Pa3JBeFJodlJ3cWZlWExiWDZjUy1DX
