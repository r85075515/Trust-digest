ay could top 80mph.\nWhat happened\nAn amber warning for wind will remain in place until 9pm on Sunday, after Storm Boelo battered the north of the UK. Scotland, parts of northern England and Northern Ireland are forecast to be hit with the strongest winds from the country's second storm in as many days. Storm Boelo's winds will peak from Saturday evening, leaving areas in the warning zone braced for gusts of 60-70mph, while the BBC's headline puts the top gusts at 80mph. Travel is disrupted and events are cancelled, and thousands remain without power after Friday's Storm Austen.\nWhy it matters\nThe judgment for readers in the north is practical, not abstract: two storms in two days means the second one hits infrastructure that never recovered from the first. Power cuts and travel disruption compound when crews are already stretched, and an amber warning lasting into Sunday night leaves little room to catch up. Anyone travelling or outdoors in the warning zone should plan around the peak on Saturday evening.\nSources agree / disagree\nSky News, the BBC and The Guardian all cover the same storm with consistent facts: second named storm of the season, amber warning to Sunday night, disruption in the north. The gust figures differ in wording — 60-70mph for warning-zone gusts, up to 80mph for peak gusts in the BBC headline — so this digest prints both rather than picking one. Trust label: consistent reporting, with the gust range shown, not smoothed over.\nStill uncertain\nThe snippets do not name which routes or events are cancelled, how many households are without power, or when power will be restored. Those details live in the full reports and local updates, which change through the weekend; check the linked outlets before travelling."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-01-storm-boelo-travel-disru\",\"category\":\"international\",\"adult\":false,\"isHeadline\":true,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-international-01-storm-boelo-travel-disru.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Storm Boelo: Travel disrupted and events cancelled as UK hit by wind and rain\",\"zh-TW\":\"相關封面圖：風暴博埃洛：英國遭遇風雨攻擊，旅行中斷，活動取消\"},\"publishedAt\":\"2026-10-25T03:03:00.000Z\",\"title\":{\"en\":\"Storm Boelo Batters Northern UK as Amber Wind Warning Holds Until Sunday Night\",\"zh-TW\":\"風暴博埃洛（Storm Boelo）襲擊英國北部，強風警報持續到週日晚間\"},\"summary\":{\"en\":\"Storm Boelo, the UK's second named storm in two days, has battered the north with rain and gusts of up to 80mph. An amber wind warning covers Scotland, Northern Ireland and the far north of England until 9pm on Sunday. Travel is disrupted, events are cancelled, and thousands remain without power after Storm Austen. Takeaway: north should brace through weekend.\",\"zh-TW\":\"博埃洛（Storm Boelo）是英國兩天內第二個命名風暴，強風豪雨襲擊北部，陣風最高達時速 80 英里。蘇格蘭、北愛爾蘭與英格蘭遠北地區的黃色強風警報持續到週日晚間 9 點。交通中斷、活動取消，週五奧斯汀風暴（Storm Austen）過後仍有數千戶停電。結論：北部居民這個週末仍要嚴加防範。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"英國本週末迎來第二場風暴，北部首當其衝。博埃洛在奧斯汀風暴隔天報到，帶來頻繁強陣雨，預報指出風速可能超過時速 80 英里。\\n發生了什麼事\\n博埃洛襲擊英國北部後，黃色強風警報持續到週日晚間 9 點。蘇格蘭、英格蘭北部與北愛爾蘭部分地區預計迎來兩天內第二場風暴的最強風力。風力從週六晚間達到高峰，警戒區陣風達時速 60 至 70 英里，英國廣播公司（BBC）的標題則寫最高陣風達時速 80 英里。交通中斷、活動取消，週五奧斯汀風暴過後仍有數千戶停電。\\n為什麼重要\\n對北部居民來說，重點很實際：兩天兩場風暴，第二場打在還沒復原的基礎設施上。停電與交通中斷會疊加，搶修人力本來就已吃緊，黃色警報一路持續到週日晚間，幾乎沒有喘息空檔。警戒區內要出門或在戶外活動的人，行程要避開週六晚間的風力高峰。\\n來源異同\\n天空新聞（Sky News）、英國廣播公司（BBC）與衛報（The Guardian）報導同一場風暴，事實一致：本季第二個命名風暴、黃色警報到週日晚間、北部交通受阻。陣風數字寫法不同——警戒區陣風 60 至 70 英里、BBC 標題最高陣風 80 英里——本摘要兩邊都寫，不只取其一。信任標籤：報導一致，陣風區間並列呈現、未經平滑處理。\\n仍不確定\\n摘要片段沒寫哪些路線或活動取消、停電戶數多少、何時復電。這些細節都在完整報導與地方更新裡，週末期間隨時會變，出門前請先查閱連結媒體。\"},\"sources\":[{\"name\":\"Sky News UK\",\"url\":\"https://news.sky.com/story/weather-warnings-for-strong-winds-remain-in-place-as-second-storm-in-two-days-subsides-13603443\"},{\"name\":\"BBC UK\",\"url\":\"https://www.bbc.co.uk/news/articles/cmr4ydglq9r3o?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"The Guardian UK News\",\"url\":\"https://www.theguardian.com/uk-news/2026/oct/24/storm-boelo-travel-disrupted-events-cancelled-uk-hit-wind-and-rain\"}],\"disagreements\":null,\"trustScore\":88,\"trustBreakdown\":{\"sourceDiversity\":21,\"outletReputation\":20,\"crossCorroboration\":22,\"recencyClarity\":25},\"tags\":[\"international\",\"live-ingest\",\"sky-news-uk\",\"bbc-uk\",\"the-guardian-uk-news\"],\"glossary\":[{\"term\":{\"en\":\"Storm Boelo\",\"zh-TW\":\"博埃洛\"},\"blurb\":{\"en\":\"Second named storm of the UK season, battering the north with wind and rain.\",\"zh-TW\":\"英國本季第二個命名風暴，以強風豪雨襲擊北部。\"}},{\"term\":{\"en\":\"Storm Austen\",\"zh-TW\":\"奧斯汀\"},\"blurb\":{\"en\":\"First named storm of the weekend, which left thousands without power on Friday.\",\"zh-TW\":\"本週末第一場命名風暴，週五過後留下數千戶停電。\"}},{\"term\":{\"en\":\"Scotland\",\"zh-TW\":\"蘇格蘭\"},\"blurb\":{\"en\":\"Northern part of the UK under the amber wind warning.\",\"zh-TW\":\"英國北部地區，位在黃色強風警報範圍內。\"}},{\"term\":{\"en\":\"Northern Ireland\",\"zh-TW\":\"北愛爾蘭\"},\"blurb\":{\"en\":\"UK region forecast to face the storm's strongest winds.\",\"zh-TW\":\"英國地區，預計迎來風暴最強風力。\"}},{\"term\":{\"en\":\"BBC\",\"zh-TW\":\"英國廣播公司\"},\"blurb\":{\"en\":\"British public broadcaster whose headline put peak gusts at 80mph.\",\"zh-TW\":\"英國公共廣播機構，標題寫最高陣風達時速 80 英里。\"}},{\"term\":{\"en\":\"Sky News\",\"zh-TW\":\"天空新聞\"},\"blurb\":{\"en\":\"British news channel covering the storm's warnings and disruption.\",\"zh-TW\":\"英國新聞頻道，報導風暴警報與交通受阻。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Axio
