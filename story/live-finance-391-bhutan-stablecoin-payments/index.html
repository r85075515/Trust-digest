en stablecoin acceptance among merchants across Bhutan, beginning with USD₮. The initiative builds upon the payment infrastructure that Binance Pay and DK Bank introduced in May 2025, which currently connects more than 3,700 merchants across sectors such as hospitality and aviation, and adds a 5% rebate incentive for users.\n\nWhy it matters\nIntegrating USD₮ directly into an established national QR and banking rail demonstrates how sovereign-level digitalpayment networks are moving beyond pilot phases into everyday retail and tourism settlement. For Bhutan, expanding stablecoin utility lowers cross-border friction for international visitors while deepening domestic fintech adoption through DK Bank's regulated banking framework.\n\nSource differences\nPR Newswire published the official joint release titled \"Binance Pay, DK Bank and Tether Sign MOU to Expand Stablecoin Payments to Merchants Across Bhutan, Starting with USD₮,\" quoting Binance Vice President of Payments and Fiat Thomas Gregory and detailing the May 2025 rollout baseline. Newsfilter.io syndicated the same announcement under the identical headline \"Binance Pay, DK Bank and Tether Sign MOU to Expand Stablecoin Payments to Merchants Across Bhutan, Starting with USD₮,\" highlighting the 5% user rebate, the 3,700-merchant figure, and the non-binding nature of the agreement.\n\nStill uncertain\nBecause the parties signed a non-binding MOU, definitive commercial terms, regulatory clearance timelines from Bhutanese financial authorities, and the exact rollout schedule for additional stablecoins beyond USD₮ have not yet been finalized.\n\nTrust label: Single source — Both outlets carry the same joint corporate press release without independent third-party reporting."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-391-bhutan-stablecoin-payments\",\"category\":\"finance\",\"title\":{\"en\":\"Binance Pay, DK Bank, and Tether Sign MOU to Expand Bhutan Stablecoin Payments\",\"zh-TW\":\"幣安支付、DK 銀行與 Tether 簽署備忘錄擴大不丹穩定幣支付\"},\"summary\":{\"en\":\"Binance Pay, Bhutan's DK Bank, and Tether signed a memorandum of understanding on November 28, 2026, to expand stablecoin merchant payments across Bhutan, starting with USD₮. Building on a network launched in May 2025 with over 3,700 active merchants, the non-binding pact introduces a 5% user rebate while final commercial terms remain under negotiation.\",\"zh-TW\":\"幣安支付、不丹 DK 銀行與 Tether 於 2026 年 11 月 28 日簽署合作備忘錄，將以 USD₮ 為起點擴大不丹全國商戶的穩定幣支付。該非約束性協議奠基於 2025 年 5 月上線、現有逾 3,700 家商戶的支付網絡，並規劃推出 5% 用戶回饋，具體商業條款仍有待後續敲定。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n2026 年 11 月 28 日，幣安支付（Binance Pay）、不丹數位銀行 DK Bank 與穩定幣發行商 Tether 宣布簽署合作備忘錄（MOU），將從 USD₮ 開始擴大不丹全國商戶的穩定幣支付服務。此計畫延續幣安支付與 DK Bank 於 2025 年 5 月啟動的支付網絡（目前已涵蓋飯店、航空等領域逾 3,700 家商戶），並將為用戶提供 5% 回饋優惠。\\n\\n「為什麼重要」\\n將 USD₮ 直接嵌入已運作的國家級銀行與商戶收款體系，顯示主權層級的數位資產支付正從早期試驗邁向日常零售與觀光結算。對不丹而言，擴大穩定幣應用有助降低國際旅客跨境支付摩擦，並透過 DK Bank 的合規銀行架構深化在地金融科技普及。\\n\\n「來源異同」\\n美通社（PR Newswire）刊出官方聯合新聞稿，標題為「Binance Pay, DK Bank and Tether Sign MOU to Expand Stablecoin Payments to Merchants Across Bhutan, Starting with USD₮」，引述幣安支付與法幣副總裁湯瑪斯·葛瑞格里（Thomas Gregory）說法並交代 2025 年 5 月系統上線背景；金融資訊平台 Newsfilter.io 則轉載同篇新聞稿，標題同樣為「Binance Pay, DK Bank and Tether Sign MOU to Expand Stablecoin Payments to Merchants Across Bhutan, Starting with USD₮」，並摘要列出 5% 用戶回饋、逾 3,700 家活躍商戶與協議屬非約束性質等重點。\\n\\n「仍不確定」\\n由於三方此次簽署的是非約束性合作備忘錄，最終商業條款、不丹金融監管機構的具體審批時程，以及 USD₮ 之外其他穩定幣的導入時間表均尚未定案。\\n\\nTrust label: Single source — 兩家來源均源自同一份企業聯合新聞稿，目前尚無獨立第三方媒體查證報導。\"},\"glossary\":[{\"term\":{\"en\":\"Memorandum of Understanding (MOU)\",\"zh-TW\":\"合作備忘錄（MOU）\"},\"blurb\":{\"en\":\"A formal written agreement outlining shared intentions between parties before binding legal contracts are executed.\",\"zh-TW\":\"各方在簽署具法律約束力的正式合約前，用以確立合作意向與框架的書面文件。\"}},{\"term\":{\"en\":\"USD₮\",\"zh-TW\":\"泰達幣（USD₮）\"},\"blurb\":{\"en\":\"A fiat-collateralized stablecoin issued by Tether designed to maintain a 1:1 peg with the US dollar.\",\"zh-TW\":\"由 Tether 發行的法幣儲備型穩定幣，旨在與美元維持 1 比 1 的價值掛鉤。\"}},{\"term\":{\"en\":\"Stablecoin\",\"zh-TW\":\"穩定幣\"},\"blurb\":{\"en\":\"A cryptocurrency engineered to minimize price volatility by pegging its value to a reserve asset such as the US dollar.\",\"zh-TW\":\"透過與美元等儲備資產掛鉤來降低價格波動的加密貨幣，常用於支付與跨境結算。\"}}],\"sources\":[{\"name\":\"PR Newswire\",\"url\":\"https://www.prnewswire.com/news-releases/binance-pay-dk-bank-and-tether-sign-mou-to-expand-stablecoin-payments-to-merchants-across-bhutan-starting-with-usd-302952011.html\"},{\"name\":\"Newsfilter.io\",\"url\":\"https://newsfilter.io/articles/binance-pay-dk-bank-and-tether-sign-mou-to-expand-stablecoin-payments-to-fd6a471a340f532fb8ccba74ab028df8\"}],\"imageUrl\":\"/covers/live/live-finance-391-bhutan-stablecoin-payments.jpg\",\"imageAlt\":{\"en\":\"Binance Pay, DK Bank, and Tether Sign MOU to Expand Bhutan Stablecoin Payments\",\"zh-TW\":\"幣安支付、DK 銀行與 Tether 簽署備忘錄擴大不丹穩定幣支付\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":68,\"trustBreakdown\":{\"crossCorroboration\":12,\"outletReputation\":21,\"recencyClarity\":24,\"sourceDiversity\":11},\"publishedAt\":\"2026-11-28T08:34:56.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":22,\"D2\":21,\"D3\":20,\"D4\":22,\"D5\":21,\"total\":21},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-finance-391-bhutan-stablecoin-payments/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axi
