inflation data showed consumer prices up 3.7% from a year earlier. MarketWatch estimates the increase at an average of about $75 a month — a little more than $900 over the course of 2027.\nWhat happened\nThe 2027 COLA is aimed at helping more than 68 million beneficiaries keep pace with the cost of living. The 3.6% figure is calculated from inflation data, and the increase takes effect next year. PBS NewsHour's explainer walks through what experts say recipients should know, while NPR notes the September inflation reading that drove the adjustment. MarketWatch's headline translates the raise into dollars: about $75 a month on average.\nWhy it matters\nFor tens of millions of retirees and other beneficiaries, the annual COLA is the primary defense against rising prices — and the September 3.7% inflation print shows why it is needed. The adjustment matters politically too: it lands as voters weigh the economy, and whether a 3.6% raise truly keeps pace with household costs will shape how the announcement is received.\nSources agree / disagree\nMarketWatch, PBS NewsHour and NPR covered the same 2027 COLA announcement with consistent core facts: 3.6%, more than 68 million beneficiaries, September inflation at 3.7%. Figures differ across outlets (e.g. 75 vs 900 in headlines/snippets) — but these appear to be the same raise expressed monthly versus annually ($75 x 12 ≈ $900), not a factual conflict. Trust label: Conflicting figures/accounts — outlets agree on the 3.6% figure; the 75 vs 900 difference is a monthly-vs-annual framing difference.\nStill uncertain\nFeed descriptions capture only headlines and short snippets. Exact effective dates, how the increase applies to different benefit types, and whether the raise fully offsets retirees' real cost increases are details to verify in the full reporting."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-01-the-social-security-cola\",\"category\":\"international\",\"adult\":false,\"isHeadline\":true,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-international-01-the-social-security-cola.jpg\",\"imageAlt\":{\"en\":\"Cover related to: The Social Security COLA for 2027 is set. Here's what experts say you need to know\",\"zh-TW\":\"相關封面圖：2027 年社會保障 COLA 已確定。專家說您需要了解以下內容\"},\"publishedAt\":\"2026-10-14T22:31:37.000Z\",\"title\":{\"en\":\"Social Security's 3.6% COLA Boosts 2027 Benefits for 68 Million Americans\",\"zh-TW\":\"2027年社會安全（Social Security）生活成本調整（COLA）3.6%，6,800萬人受惠\"},\"summary\":{\"en\":\"The Social Security Administration has set the 2027 cost-of-living adjustment at 3.6%, raising benefits for more than 68 million Americans as inflation persists. September consumer prices jumped 3.7% from a year ago, and one estimate puts the average monthly increase at about $75 — roughly $900 over the year.\",\"zh-TW\":\"美國社會安全局（Social Security Administration）宣布2027年生活成本調整（COLA）為3.6%，超過6,800萬受益人將調高給付。9月消費者物價年增3.7%，估算平均每月多出約75美元、全年約900美元。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"超過6,800萬名社會安全（Social Security）受益人明年支票將調漲：2027年生活成本調整（COLA）定為3.6%。根據9月通膨數據，消費者物價年增3.7%；MarketWatch 估算，平均每月增加約75美元，全年下來略超過900美元。\\n發生了什麼事\\n2027年COLA旨在協助超過6,800萬名受益人跟上生活成本。3.6%的數字依據通膨數據計算，明年生效。PBS NewsHour 整理專家提醒，NPR 則報導推高調整幅度的9月通膨數據；MarketWatch 的標題把調漲換算成金額：平均每月約75美元。\\n為什麼重要\\n對數千萬退休族和其他受益人而言，年度COLA是抵禦物價上漲的主要防線，而9月3.7%的通膨數字正是其必要性的證明。政治上這也有分量：在選民評估經濟走勢的時刻，3.6%的調漲能否真正追上家庭開支，將決定這則宣布的評價。\\n來源異同\\nMarketWatch、PBS NewsHour、NPR 三家報導同一則2027年COLA宣布，核心事實一致：3.6%、超過6,800萬受益人、9月通膨3.7%。不同媒體的數字有所不同（75 vs 900），但看起來是同一調漲額以月／年不同方式呈現（75×12≈900），並非事實衝突。信任標籤：數字/說法衝突——核心3.6%一致，75與900是月計與年計的表達差異。\\n仍不確定\\n來源只提供標題和簡短摘要。確切生效日期、各類給付的適用方式、調漲是否真正抵銷退休族的實際成本上升，都需查閱完整報導確認。\"},\"sources\":[{\"name\":\"MarketWatch\",\"url\":\"https://www.marketwatch.com/story/social-securitys-cola-will-be-3-6-in-2027-as-inflation-persists-f7c9dff2?mod=mw_rss_topstories\"},{\"name\":\"PBS NewsHour\",\"url\":\"https://www.pbs.org/newshour/economy/what-is-the-social-security-cola-for-2027-heres-how-it-could-affect-you\"},{\"name\":\"NPR News\",\"url\":\"https://www.npr.org/2026/10/14/nx-s1-6000593/inflation-consumer-prices-cpi-social-security-benefits\"}],\"disagreements\":{\"en\":\"Figures differ across outlets (e.g. 75 vs 900 in headlines/snippets).\",\"zh-TW\":\"不同媒體的數字有所不同（例如，標題/摘要中的數字為 75 比 900）。\"},\"trustScore\":78,\"trustBreakdown\":{\"sourceDiversity\":20,\"outletReputation\":19,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"international\",\"live-ingest\",\"marketwatch\",\"pbs-newshour\",\"npr-news\"],\"glossary\":[{\"blurb\":{\"en\":\"US agency that announced the 3.6% COLA for 2027.\",\"zh-TW\":\"美國機構，宣布2027年3.6%的COLA。\"},\"term\":{\"en\":\"Social Security Administration\",\"zh-TW\":\"社會安全局\"}},{\"blurb\":{\"en\":\"Cost-of-living adjustment applied annually to Social Security benefits.\",\"zh-TW\":\"每年調整社會安全給付的生活成本調整機制。\"},\"term\":{\"en\":\"COLA\",\"zh-TW\":\"生活成本調整\"}},{\"blurb\":{\"en\":\"US financial news outlet whose headline framed the raise as $75 a month.\",\"zh-TW\":\"美國財經媒體，標題以每月75美元呈現調漲。\"},\"term\":{\"en\":\"MarketWatch\",\"zh-TW\":\"MarketWatch\"}},{\"blurb\":{\"en\":\"US public television news program that published an explainer on the 2027 COLA.\",\"zh-TW\":\"美國公共電視新聞節目，刊出2027年COLA解說。\"},\"term\":{\"en\":\"PBS NewsHour\",\"zh-TW\":\"PBS NewsHour\"}},{\"blurb\":{\"en\":\"US public radio network that tied the COLA to September's 3.7% inflation reading.\",\"zh-TW\":\"美國公共廣播電台，將COLA與9月3.7%通膨數據連結報導。\"},\"term\":{\"en\":\"NPR News\",\"zh-TW\":\"NPR 新聞\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust sco
