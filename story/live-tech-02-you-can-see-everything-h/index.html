 story has become a box-office draw well beyond the US.\nWhat happened\nYou Can See Everything, a documentary about Elizabeth Holmes, has passed $100 million at the worldwide box office. TechCrunch reports the international rollout is only just beginning, so the total is still climbing from a largely domestic base.\nWhy it matters\nA documentary crossing $100 million is rare, and this one does it on the back of a story the public thought it already knew. Holmes and Theranos have been told as a podcast, a book, a series and now a film, and the box-office number suggests the appetite for the fraud saga has not faded; if anything, the theatrical run shows true-crime founders remain a bankable genre.\nSources agree-disagree\nThis cluster has a single outlet, TechCrunch, so there is nothing to cross-check within it. Trust label: Single source. One reputable outlet, but uncorroborated within this cluster.\nStill uncertain\nThe summary gives no exact gross, no split between domestic and overseas, and no opening dates for the international markets. The $100 million figure is a single-outlet report and should be checked against box-office trackers."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-tech-02-you-can-see-everything-h\",\"category\":\"tech\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-tech-02-you-can-see-everything-h.webp\",\"imageAlt\":{\"en\":\"Cover related to: ‘You Can See Everything’ has made more than $100M worldwide\",\"zh-TW\":\"相關封面圖：《你可以看到一切》全球票房已超過 1 億美元\"},\"publishedAt\":\"2026-11-22T21:42:48.000Z\",\"title\":{\"en\":\"'You Can See Everything,' the Elizabeth Holmes Documentary, Passes $100M Worldwide\",\"zh-TW\":\"伊麗莎白·霍姆斯紀錄片《You Can See Everything》全球票房破 1 億美元\"},\"summary\":{\"en\":\"The new Elizabeth Holmes documentary, You Can See Everything, has made more than $100 million worldwide, and it is only just beginning to roll out internationally. The figure makes the Theranos founder's story one of the year's biggest documentary hits. Watch how far the international rollout carries it.\",\"zh-TW\":\"［未證實·單一來源］講述伊麗莎白·霍姆斯（Elizabeth Holmes）的新紀錄片《You Can See Everything》全球票房已突破 1 億美元，而且國際上映才剛開始。這個數字讓這位 Theranos 創辦人的故事成了今年最賣座的紀錄片之一。接下來看國際上映能把它推多遠。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"據 TechCrunch 報導，講述伊麗莎白·霍姆斯（Elizabeth Holmes）的新紀錄片《You Can See Everything》全球票房已突破 1 億美元，而且國際上映才剛開始。這位 Theranos 創辦人的故事，在美國之外也成了票房吸金機。\\n發生了什麼事\\n《You Can See Everything》這部關於霍姆斯的紀錄片，全球票房已超過 1 億美元。TechCrunch 指出，國際上映才剛起步，票房總數仍在從以美國本土為主的基礎上繼續攀升。\\n為什麼重要\\n紀錄片票房破 1 億美元本來就罕見，而這部片靠的還是一個大家以為早已聽熟的故事。霍姆斯與 Theranos 已經被拍成播客、出成書、做成影集，如今再登大銀幕，票房數字顯示觀眾對這樁詐欺傳奇的胃口還沒消退；詐欺創辦人題材依然是賣座保證。\\n來源異同\\n本批只有 TechCrunch 一家來源，無法跨來源比對。信任標籤：僅1源。\\n仍不確定\\n摘要未給確切票房數字、未拆分美國本土與海外占比，也沒說國際市場的上映日期。1 億美元這個數字出自單一來源，應對照票房統計再確認。\"},\"sources\":[{\"name\":\"TechCrunch\",\"url\":\"https://techcrunch.com/2026/11/22/you-can-see-everything-has-made-more-than-100m-worldwide/\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":18,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"tech\",\"live-ingest\",\"techcrunch\"],\"glossary\":[{\"term\":{\"en\":\"Elizabeth Holmes\",\"zh-TW\":\"伊麗莎白·霍姆斯\"},\"blurb\":{\"en\":\"Founder of Theranos, subject of the documentary.\",\"zh-TW\":\"Theranos 創辦人，本片主角。\"}},{\"term\":{\"en\":\"Theranos\",\"zh-TW\":\"Theranos\"},\"blurb\":{\"en\":\"Blood-testing startup whose fraud collapse is the film's subject.\",\"zh-TW\":\"血液檢測新創公司，其詐欺垮台是本片題材。\"}},{\"term\":{\"en\":\"You Can See Everything\",\"zh-TW\":\"You Can See Everything\"},\"blurb\":{\"en\":\"Documentary about Elizabeth Holmes, now past $100 million worldwide.\",\"zh-TW\":\"講述霍姆斯的紀錄片，全球票房已破 1 億美元。\"}},{\"term\":{\"en\":\"TechCrunch\",\"zh-TW\":\"TechCrunch\"},\"blurb\":{\"en\":\"US tech news outlet that reported the box-office figure.\",\"zh-TW\":\"報導票房數字的美國科技新聞媒體。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"
