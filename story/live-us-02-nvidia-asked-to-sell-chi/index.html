d\nThe released material shows the Commerce Department approved the sale of more than 800,000 AI chips to Chinese companies, including some with military connections. The report's headline states that Nvidia was asked to sell chips to companies tied to the Chinese military and to Megaspeed.\nWhy it matters\nThe Commerce Department polices advanced-chip exports, yet approved more than 800,000 chips for Chinese buyers, including firms with military ties, and the gap between control and approval goes directly to the credibility of the export regime. That lawmakers chose to release confidential material signals that Congress has lost patience with the administration's chip policy.\nSources agree / disagree\nOnly the New York Times has reported the released documents, so there is no second outlet to corroborate the 800,000-chip figure or the list of companies involved.\nStill uncertain\nWhich Chinese companies actually received chips, whether the sales have been completed, why the Commerce Department approved them, and how Megaspeed is connected to the military are not stated in the report. Further clarity depends on responses from the Commerce Department and Nvidia, and on whether lawmakers release more material.\nTrust label: Single source — Only the New York Times has reported the released documents so far."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-us-02-nvidia-asked-to-sell-chi\",\"category\":\"us\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-us-02-nvidia-asked-to-sell-chi.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Nvidia Asked to Sell Chips to Companies Tied to Chinese Military and Megaspeed\",\"zh-TW\":\"相關封面圖：Nvidia 被要求向與中國軍方和 Megaspeed 相關的公司出售晶片\"},\"publishedAt\":\"2026-11-20T01:13:37.000Z\",\"title\":{\"en\":\"Nvidia Was Asked to Sell Chips to Firms Tied to China's Military, Lawmakers Say\",\"zh-TW\":\"輝達（Nvidia）被要求向與中國軍方有關企業售晶片，議員公開機密資料\"},\"summary\":{\"en\":\"[Unconfirmed · Single source] Lawmakers have released confidential information showing the US Commerce Department approved sales of more than 800,000 AI chips to Chinese companies, some with military ties. Nvidia was asked to supply firms linked to China's military and to Megaspeed, according to the New York Times. Watch for responses from the Commerce Department and Nvidia.\",\"zh-TW\":\"［未證實·單一來源］議員公開機密資料顯示，美國商務部已批准向中國企業銷售逾 80 萬顆 AI 晶片，其中部分企業與軍方有關，輝達（Nvidia）被要求向其中與中國軍方及 Megaspeed 有關的公司供貨。資料只有《紐約時報》單一來源，未交代哪些企業已實際收到晶片，接下來看商務部與輝達（Nvidia）如何回應。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"議員公開機密資料顯示，美國商務部已批准向中國企業銷售逾 80 萬顆 AI 晶片，其中部分企業與軍方有關，輝達（Nvidia）被要求向其中與中國軍方及 Megaspeed 有關的公司供貨。\\n發生了什麼事\\n《紐約時報》報導，議員公布的機密資料顯示，美國商務部批准銷售逾 80 萬顆 AI 晶片給中國企業，其中一些與軍方有聯繫。標題指出，輝達（Nvidia）被要求向與中國軍方和 Megaspeed 有關的公司出售晶片。\\n為什麼重要\\n商務部一邊管制先進晶片出口，一邊批准逾 80 萬顆銷往中國，其中還包括軍方關聯企業，管制與放行之間的落差直接衝擊外界對出口管制可信度的判斷。議員選擇公開機密資料，代表國會對行政部門的晶片政策已失去耐心。\\n來源異同\\n只有《紐約時報》一家報導這批議員公開的資料，沒有其他媒體佐證 80 萬顆的數字與涉事企業名單，無法交叉比對。\\n仍不確定\\n哪些中國企業實際收到晶片、銷售是否已經完成、商務部批准的理由為何，報導沒有交代；Megaspeed 與軍方的具體關聯也未說明。後續要看商務部與輝達（Nvidia）的回應，以及議員是否公布更多資料。\"},\"sources\":[{\"name\":\"NYT Economy\",\"url\":\"https://www.nytimes.com/2026/11/19/business/economy/nvidia-chips-commerce-china-huang.html\"}],\"disagreements\":null,\"trustScore\":60,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":23,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"us\",\"live-ingest\",\"nyt-economy\"],\"glossary\":[{\"term\":{\"en\":\"Nvidia\",\"zh-TW\":\"輝達\"},\"blurb\":{\"en\":\"US company that makes AI computer chips.\",\"zh-TW\":\"美國 AI 晶片製造商。\"}},{\"term\":{\"en\":\"US Commerce Department\",\"zh-TW\":\"美國商務部\"},\"blurb\":{\"en\":\"Department that oversees export controls.\",\"zh-TW\":\"負責出口管制的部門。\"}},{\"term\":{\"en\":\"Megaspeed\",\"zh-TW\":\"Megaspeed\"},\"blurb\":{\"en\":\"Company named in the report as tied to China's military.\",\"zh-TW\":\"報導中與中國軍方有關的公司。\"}},{\"term\":{\"en\":\"AI chip\",\"zh-TW\":\"AI 晶片\"},\"blurb\":{\"en\":\"Processor designe
