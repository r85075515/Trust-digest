hville on Wednesday, November 18.\nWhat happened\nSwift delivered a nostalgic mashup of two fan favorites, 'Our Song' and 'I Knew It, I Knew You', returning to the stage where her country music career took off. Billboard, TMZ, Hollywood Life and Just Jared all led with the comeback; TMZ also noted Swift leading arrivals at the 60th annual Country Music Association Awards, and Hollywood Life carried the 2026 winners list, updating live. The ceremony marked a milestone year for the awards, with major country stars appearing early on the red carpet.\nWhy it matters\nSwift's 13-year absence from the CMA stage — her favorite number, as Billboard put it — made the return the night's defining moment and a homecoming to her country roots. The performance dominated coverage of the milestone 60th ceremony.\nSources agree / disagree\nBillboard, TMZ, Hollywood Life and Just Jared agree on the core facts: the 13-year gap, the November 18 date, the Nashville venue and the two-song mashup. No numeric or name conflicts on the performance itself.\nStill uncertain\nThe snippets do not give full setlist details, the complete winners list, or audience and ratings figures. Check the linked outlets for the winners list as it updates.\nTrust label: Multi-source agreement"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-entertainment-01-taylor-swift-returns-to-\",\"category\":\"entertainment\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-entertainment-01-taylor-swift-returns-to-.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Taylor Swift Returns to CMA Awards Stage for Star-Studded ‘I Knew It, I Knew You’ Performance\",\"zh-TW\":\"相關封面圖：泰勒絲 (Taylor Swift) 憑藉眾星雲集的“我知道，我知道你”表演重返 CMA 頒獎舞台\"},\"publishedAt\":\"2026-11-19T02:43:33.000Z\",\"title\":{\"en\":\"Taylor Swift Returns to CMA Awards Stage After 13 Years\",\"zh-TW\":\"泰勒絲（Taylor Swift）睽違 13 年重返鄉村音樂協會獎舞台\"},\"summary\":{\"en\":\"Pop star Taylor Swift ret
