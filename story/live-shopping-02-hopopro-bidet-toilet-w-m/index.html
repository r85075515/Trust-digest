ensor night light and dual self-cleaning nozzles, and the deal earns a community Thumb Score of +17, with free shipping for Prime members or orders over $35.\n\nWhat happened\nSlickdeals lists the HOPOPRO bidet attachment, sold through Amazon, at $129.99 with $100 off via promo code W3LEE8S7 at checkout, bringing the final price to $29.99. The attachment includes a motion-sensor night light and dual self-cleaning nozzles. Shipping is free with Prime or on orders of $35 or more. The listing itself warns that Amazon promo codes do not always apply smoothly, and suggests refreshing the page and re-entering the code if it fails.\n\nWhy it matters\nA $100 cut turns a $130 bathroom add-on into a $30 impulse buy, which is why the deal scores well with the Slickdeals community. Bidet attachments are a low-risk way to try the category without replacing a toilet, and the night light and self-cleaning nozzles are the features that separate this model from the cheapest options. The promo-code wrinkle is the catch: the headline price depends on a code that may need a second attempt.\n\nSources agree-disagree\nOnly Slickdeals has reported this in the feed, so the price has no second source. The title's '$30' and the body's '$29.99 after code' agree; the title rounds the final price, and the body spells out the code that produces it.\n\nStill uncertain\nThe feed does not confirm the code is still live, how long the deal lasts, or whether stock is limited. The title calls the item a bidet toilet while the body describes a bidet attachment that fits an existing toilet, so buyers should check the listing to confirm what is actually being sold. The Thumb Score reflects community votes, not a product review.\n\nTrust label: Single source — one Slickdeals listing with no independent corroboration in the feed."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-shopping-02-hopopro-bidet-toilet-w-m\",\"category\":\"shopping\",\"adult\":false,\"isHeadl
