f 81-year-old former Philippine President Rodrigo Duterte on November 30, 2026, on charges of crimes against humanity stemming from thousands of killings during his anti-drug campaign. Arrested and transferred to The Hague in March 2025, Duterte was ruled medically fit to stand trial in October 2026 following neurological assessments, with prosecutors planning to call fewer than 100 witnesses across roughly 150 hours of core evidence presentation.\n\nAmnesty International, The Japan Times, and the Hong Kong Standard highlight that Duterte is the first former Asian head of state to face trial at the ICC, marking a defining moment for families of victims killed in police and vigilante operations. Meanwhile, human rights advocates have urged Manila to execute outstanding ICC arrest warrants against alleged co-perpetrators, including Senator Ronald dela Rosa, whose whereabouts remain unconfirmed.\n\nThe Japan Times, Hong Kong Standard, and Amnesty International align on the November 30 trial start date, Duterte's October medical fitness ruling, and the broader accountability stakes for Philippine drug-war victims.\n\nHow many total victims will be formally represented during the trial phase and whether Philippine authorities will act on remaining arrest warrants remain unresolved.\n\nTrust label: Multi-source agreement — The Japan Times, Hong Kong Standard, and Amnesty International report identical trial dates, fitness rulings, and case background."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-067-icc-rodrigo-duterte-trial-opening-nov-30\",\"category\":\"international\",\"title\":{\"en\":\"ICC Prepares to Open Historic Crimes Against Humanity Trial of Ex-Philippine President Rodrigo Duterte on November 30\",\"zh-TW\":\"國際刑事法院 11 月 30 日開審菲律賓前總統杜特蒂反人類罪，首名受審亞洲前元首\"},\"summary\":{\"en\":\"The International Criminal Court in The Hague is set to open the trial of 81-year-old former Philippine President Rodrigo Duterte on November 30 on charges of crimes against humanity tied to his anti-drug crackdown. Human rights groups and victims' families view the proceedings as a landmark accountability test, while co-perpetrators remain at large.\",\"zh-TW\":\"海牙國際刑事法院（ICC）將於 11 月 30 日正式開庭審理 81 歲菲律賓前總統杜特蒂（Rodrigo Duterte）任內「掃毒戰爭」所涉反人類罪案，使他成為首位在海牙受審的亞洲前國家元首。人權團體與罹難者家屬視此案為國際司法問責關鍵考驗，但多名共犯至今仍未到案。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n荷蘭海牙國際刑事法院（ICC）將於 2026 年 11 月 30 日正式開庭審理 81 歲菲律賓前總統羅德里戈・杜特蒂（Rodrigo Duterte）所涉「反人類罪」案件，追究其任內發動全國掃毒戰爭期間造成數千人喪命的刑事責任。杜特蒂於 2025 年 3 月遭逮捕並移送海牙羈押，法院在 2026 年 10 月經醫療評估裁定其身心狀況適合受審，檢方預計傳喚不到 100 名證人並以約 150 小時庭期呈現核心證據。\\n「為什麼重要」\\n杜特蒂是首位站上國際刑事法院被告席的亞洲前國家元首，海牙開審對長年尋求司法正義的菲律賓掃毒罹難者家屬具歷史意義；國際特赦組織（Amnesty International）強調，此案不僅檢驗國際司法對國家暴力問責的執行力，也考驗菲律賓現任政府是否願意配合執行對參議員德拉羅薩（Ronald dela Rosa）等共犯的未決逮捕令。\\n「來源異同」\\n《日本時報》（The Japan Times）、《英文虎報》（The Standard）與國際特赦組織官方聲明對於 11 月 30 日開審日期、10 月醫療適審裁定及掃毒案歷史脈絡的報導完全一致，無事實衝突。\\n「仍不確定」\\n主審分庭最終核准納入正式審理程序的被害人參與人數上限，以及菲律賓政府是否會在開庭後配合逮捕仍在逃的同案嫌犯，目前仍未明朗。\"},\"glossary\":[{\"term\":{\"en\":\"Fitness to stand trial\",\"zh-TW\":\"受審能力裁定\"},\"blurb\":{\"en\":\"A judicial determination based on independent medical evaluations confirming a defendant can understand court proceedings and instruct counsel.\",\"zh-TW\":\"法院依據獨立醫療專家鑑定後作出的裁定，確認被告具備理解審判程序並與辯護律師溝通的能力。\"}},{\"term\":{\"en\":\"Crimes against humanity\",\"zh-TW\":\"反人類罪\"},\"blurb\":{\"en\":\"Widespread or systematic acts such as murder committed against a civilian population pursuant to a state or organizational policy.\",\"zh-TW\":\"依據國家或組織政策，對平民人口發動大規模或系統性謀殺等嚴重侵害人權的國際罪行。\"}},{\"term\":{\"en\":\"The Hague\",\"zh-TW\":\"海牙\"},\"blurb\":{\"en\":\"The Dutch administrative city that hosts the International Criminal Court and its detention center.\",\"zh-TW\":\"荷蘭行政首都，為國際刑事法院（ICC）總部及羈押設施所在地。\"}}],\"sources\":[{\"name\":\"The Japan Times\",\"url\":\"https://www.japantimes.co.jp/news/2026/11/27/asia-pacific/duterte-icc-trial-families/\"},{\"name\":\"The Standard (Hong Kong)\",\"url\":\"http
