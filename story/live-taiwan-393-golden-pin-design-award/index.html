ward ceremony at the Taipei Performing Arts Center on the evening of November 26, 2026, with official winner announcements released on November 27. Out of 2,367 submissions from 26 countries and regions, 29 works earned the top Best of the Best title, with Taiwanese entries winning 16 of them—including projects from ASUS, China Motor Corporation, Spring Pool Glass, and the Kaohsiung Station redevelopment.\n\nWhy it matters\nSecuring more than half of the top honors in an international competition drawing over 2,300 entries underscores how Taiwanese industrial manufacturing, circular-material craft, and public infrastructure design are converging. Recognition of projects ranging from consumer electronics and commercial vehicles to recycled glass and transit architecture reflects broader policy efforts to elevate design-led value across Taiwan's economy.\n\nSource differences\nThe Industrial Development Administration (IDA) under the Ministry of Economic Affairs published two official notices on November 27: one titled \"臺灣抱走16 件年度大獎！2026 金點設計獎揭曉\" highlighting Spring Pool Glass's \"SPRINGPOOL ORIGINAL FACTORY,\" the Kaohsiung Station renovation, agricultural-waste building materials, and Tzu Chi's Fengshan denim recycling base; and another titled \"2026金點設計獎揭曉！29件年度大獎台灣囊括16件華碩、中華汽車、春池玻璃與高雄車站脫穎而出\" specifying the total of 29 Best of the Best winners. Yam News syndicated the broader industry release under the headline \"2026金點設計獎揭曉 台灣作品拿下16件年度大獎,\" noting the 2,367 entries across 26 countries and regions.\n\nStill uncertain\nFull commercial production schedules for concept-category winners and detailed jury scoring breakdowns for each individual category have not been published in the summary releases.\n\nTrust label: Official confirmation — Confirmed directly by official announcements from Taiwan's Industrial Development Administration under the Ministry of Economic Affairs."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-393-golden-pin-design-award\",\"category\":\"taiwan\",\"title\":{\"en\":\"Taiwan Wins 16 Best of the Best Honors at 2026 Golden Pin Design Award\",\"zh-TW\":\"2026 金點設計獎揭曉 台灣作品囊括 16 件年度大獎\"},\"summary\":{\"en\":\"Taiwanese entries captured 16 of the 29 Best of the Best awards at the 2026 Golden Pin Design Award ceremony held at Taipei Performing Arts Center on November 26, with results officially announced on November 27. Winners included ASUS, China Motor Corporation, Spring Pool Glass, and the Kaohsiung Station renovation project.\",\"zh-TW\":\"「2026 金點設計獎」於 11 月 26 日晚間在臺北表演藝術中心頒獎並於 11 月 27 日正式揭曉名單，全球共 29 件作品獲頒年度大獎，台灣作品一舉囊括 16 件，包括華碩、中華汽車、春池玻璃「春場」及高雄車站改造等案均脫穎而出。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n由經濟部主辦、台灣設計研究院執行的「2026 金點設計獎」與「金點概念設計獎」頒獎典禮於 2026 年 11 月 26 日晚間在臺北表演藝術中心登場，經濟部產業發展署於 11 月 27 日正式發布得獎公告。本屆共吸引來自 26 個國家與地區、2,367 件作品角逐，最終評選出 29 件「年度大獎」，其中台灣作品抱走 16 件，包括華碩、中華汽車、春池玻璃「春場 SPRINGPOOL ORIGINAL FACTORY」以及高雄車站改造等案均獲殊榮。\\n\\n「為什麼重要」\\n在逾 2,300 件國際參賽作品中拿下超過半數年度大獎，展現台灣在消費電子、商用載具、循環材料工藝與公共建築改造上的整合實力。得獎名單橫跨科技製造與農業廢棄物再生建材、丹寧再生基地，反映設計創新正成為台灣產業升級與永續轉型的核心驅動力。\\n\\n「來源異同」\\n經濟部產業發展署於 11 月 27 日發布兩則官方新聞稿，其中「臺灣抱走16 件年度大獎！2026 金點設計獎揭曉」詳述春池玻璃「春場 SPRINGPOOL ORIGINAL FACTORY」、高雄車站改造、農廢建材與慈濟鳳山工坊丹寧再生基地等得獎亮點；另一則「2026金點設計獎揭曉！29件年度大獎台灣囊括16件華碩、中華汽車、春池玻璃與高雄車站脫穎而出」則完整點出全球 29 件年度大獎總數與華碩、中華汽車等獲獎企業。蕃薯藤新聞（Yam News）則刊出標題為「2026金點設計獎揭曉 台灣作品拿下16件年度大獎」的報導，補充本屆共有 26 個國家與地區、2,367 件作品參賽的整體規模。\\n\\n「仍不確定」\\n部分概念設計獎得獎作品的後續量產商業化時程，以及各獎項類別的細部評審給分明細，目前尚未在官方摘要公告中完整揭露。\\n\\nTrust label: Official confirmation — 依據經濟部產業發展署官方公告與媒體報導相互印證。\"},\"glossary\":[{\"term\":{\"en\":\"Golden Pin Design Award\",\"zh-TW\":\"金點設計獎\"},\"blurb\":{\"en\":\"An annual international design competition organized by Taiwan's Ministry of Economic Affairs recognizing outstanding industrial, visual, spatial, and integration design.\",\"zh-TW\":\"由台灣經濟部主辦的年度國際設計競賽，表彰在產品、傳達、空間與整合設計領域具傑出表現的作品。\"}},{\"term\":{\"en\":\"Taiwan Design Research Institute (TDRI)\",\"zh-TW\":\"台灣設計研究院（TDRI）\"},\"blurb\":{\"en\":\"Taiwan's national-level design policy and promotion organization responsible for executing the Golden Pin Design Award.\",\"zh-TW\":\"台灣國家級設計政策推動與研究機構，負責執行金點設計獎並協助產業導入設計創新。\"}},{\"term\":{\"en\":\"Circular Design\",\"zh-TW\":\"循環設計\"},\"blurb\":{\"en\":\"A design approach focused on reusing waste materials—such as recycled glass, agricultural byproducts, and textiles—to minimize environmental impact.\",\"zh-TW\":\"將回收玻璃、農業廢棄物或舊衣紡織品等再生材料重新導入產品與建築的設計方法，以減少資源消耗。\"}}],\"sources\":[{\"name\":\"經濟部產業發展署 (IDA)\",\"url\":\"https://www.ida.gov.tw/ctlr?PRO=news.NewsView\u0026type=Insights\u0026id=43459\"},{\"name\":\"經濟部產業發展署 (IDA)\",\"url\":\"https://www.ida.gov.tw/ctlr?PRO=news.NewsView\u0026id=43457\"},{\"name\":\"蕃薯藤新聞 (Yam News)\",\"url\":\"https://n.yam.com/Article/20261128185529\"}],\"imageUrl\":\"/covers/live/live-taiwan-393-golden-pin-design-award.webp\",\"imageAlt\":{\"en\":\"Taiwan Wins 16 Best of the Best Honors at 2026 Golden Pin Design Award\",\"zh-TW\":\"2026 金點設計獎揭曉 台灣作品囊括 16 件年度大獎\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":86,\"trustBreakdown\":{\"crossCorroboration\":21,\"outletReputation\":23,\"recencyClarity\":24,\"sourceDiversity\":18},\"publishedAt\":\"2026-11-28T08:34:56.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":23,\"D2\":22,\"D3\":21,\"D4\":23,\"D5\":22,\"total\":22},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-taiwan-393-golden-pin-design-award/\"}],[\"$\",\"meta\",\"3\",
