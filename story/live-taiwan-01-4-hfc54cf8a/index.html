nd attitudes formed in middle school tend to stick. If young people's views on foreigners are hardening while Japan debates immigration policy, the finding matters for schools, media literacy, and the country's longer-term social cohesion. It also raises the question of where teenagers get their information — and how much of it comes from the internet.\nSources agree / disagree\nOnly CNA carries this item in the feed, so the figures are unconfirmed by a second outlet, though they are attributed to a named academic and a specific survey. Nothing in the material contradicts the numbers; the gap is corroboration, not conflict. Trust label: Single source — only CNA reports the survey, citing Professor Nihei's analysis.\nStill uncertain\nThe feed gives no sample size, no survey wording, and no breakdown by age or region, so it is impossible to judge how the question was framed. It also does not establish that online influence caused the shift — Nihei's analysis offers it as a possible factor, not a proven cause. Check the full CNA report and the survey itself before quoting the figures."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-01-4-hfc54cf8a\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-taiwan-01-4-hfc54cf8a.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Tokyo University Survey: Over 40% of Japanese Middle Schoolers Doubt Foreigners Benefit Society\",\"zh-TW\":\"相關封面圖：東京大學調查：逾 4 成日本中學生不認為外國人增加有益\"},\"publishedAt\":\"2026-11-07T06:04:46.000Z\",\"title\":{\"en\":\"Tokyo University Survey: Over 40% of Japanese Middle Schoolers Doubt Foreigners Benefit Society\",\"zh-TW\":\"東京大學調查：逾 4 成日本中學生不認為外國人增加有益\"},\"summary\":{\"en\":\"[Unconfirmed · Single source] Over 40% of Japanese middle schoolers in a 2025 survey do not think more foreigners bring society more benefits, nearly double the 20%-plus share in 2022, CNA reports, citing University of Tokyo sociologist Norihiro Nihei. He links the shift to online influence — a warning sign for how young people form views on immigration.\",\"zh-TW\":\"［未證實·單一來源］2025 年調查中，逾 4 成日本中學生不認為外國人增加對社會有較多好處，較 2022 年的 2 成多增加近一倍。中央社（CNA）引述東京大學社會學教授仁平典宏（Norihiro Nihei）的分析，他認為可能與網路影響有關——年輕人如何形成對移民的看法，值得留意。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"2025 年調查中，逾 4 成日本中學生不認為外國人增加對社會有較多好處，較 2022 年的 2 成多增加近一倍。\\n發生了什麼事\\n中央社（CNA）7 日自東京發出的綜合外電報導，引述東京大學社會學教授仁平典宏（Norihiro Nihei）的分析。仁平典宏發現，2025 年調查中，不認為外國人增加對社會有較多好處的日本中學生超過 4 成，較 2022 年的 2 成多增加近一倍，三年內幾乎翻倍。分析指出，這波轉變可能與網路影響有關。\\n為什麼重要\\n三年內幾乎翻倍，是年輕人態度相當快速的變化，而中學時期形成的看法往往會跟著一個人很久。在日本討論移民政策的同時，如果年輕人對外國人的看法正在變硬，這項發現對學校教育、媒體素養與國家長期的社會凝聚力都有意義。它也帶出一個問題：青少年從哪裡取得資訊，又有多少來自網路。\\n來源異同\\n來源只有中央社一家，數字沒有第二家媒體佐證，不過數字有明確出處：具名的學者與具體的調查。材料中沒有與數字牴觸的說法，缺的是佐證，不是共識。信任標籤：單一來源——僅中央社報導這項調查，引述仁平典宏教授的分析。\\n仍不確定\\n來源沒有寫調查樣本數、題目用詞，也沒有按年齡或地區拆分數據，無法判斷題目如何設計。它也沒有證明網路影響就是轉變的原因——仁平典宏的分析只是提出這是可能的因素，而非已證實的因果。引用數字之前，請先查中央社完整報導與調查本身。\"},\"sources\":[{\"name\":\"中央社-國際\",\"url\":\"https://www.cna.com.tw/news/aopl/202611070083.aspx\"}],\"disagreements\":null,\"trustScore\":59,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"中央社-國際\"],\"glossary\":[{\"blurb\":{\"en\":\"University of Tokyo sociology professor who analyzed the survey.\",\"zh-TW\":\"分析這項調查的東京大學社會學教授。\"},\"term\":{\"en\":\"Norihiro Nihei\",\"zh-TW\":\"仁平典宏\"}},{\"blurb\":{\"en\":\"Japanese university where Nihei teaches sociology.\",\"zh-TW\":\"仁平典宏任教社會學的日本大學。\"},\"term\":{\"en\":\"University of Tokyo\",\"zh-TW\":\"東京大學\"}},{\"blurb\":{\"en\":\"Taiwan's Central News Agency, which reported the survey.\",\"zh-TW\":\"報導這項調查的中央通訊社。\"},\"term\":{\"en\":\"CNA\",\"zh-TW\":\"中央社\"}},{\"blurb\":{\"en\":\"Japanese students surveyed in 2025 and 2022.\",\"zh-TW\":\"2025 年與 2022 年調查中的日本學生。\"},\"term\":{\"en\":\"Middle schoolers\",\"zh-TW\":\"中學生\"}},{\"blurb\":{\"en\":\"People from other countries living in Japan; the survey asked whether their increase benefits society.\",\"zh-TW\":\"居住在日本的外國人；調查詢問其增加是否對社會有益。\"},\"term\":{\"en\":\"Foreign residents\",\"zh-TW\":\"外國人\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-taiwan-01-4-hfc54cf8a/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-taiwan-01-4-hfc54cf8a/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"d:\"$8:metadata\"\n"])</script></body></html>
