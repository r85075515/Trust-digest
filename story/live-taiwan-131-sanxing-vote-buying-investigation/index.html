cted coordinated vote-buying across township mayor, township representative, and village chief races in Sanxing Township. Prosecutors seized cash and notebooks during the raids. Following questioning, Kuomintang township mayoral nominee and incumbent Acting Mayor Chiang Chun-ming (江淳銘) and a township representative candidate surnamed Wu were each ordered released on NT$150,000 bail, while a Guilin Village chief candidate surnamed Wu was released on NT$100,000 bail for alleged violations of the Public Officials Election and Recall Act, which have not yet been determined by a court. One campaign broker was released on NT$300,000 bail, and prosecutors requested incommunicado detention for three other brokers.\n\n為什麼重要\nCoordinated multi-tier vote-buying involves local brokers simultaneously soliciting votes for candidates across different municipal offices, amplifying illicit influence over grassroots elections. Rapid prosecutorial action on the eve of polling underscores judicial enforcement against electoral bribery in Taiwan's local government contests.\n\n來源異同\nBoth the Central News Agency (CNA) and United Daily News (UDN) report identical figures regarding the 13 individuals summoned, the bail amounts of NT$150,000 for Chiang Chun-ming and the township representative candidate, NT$100,000 for the village chief candidate, NT$300,000 for one broker, and detention requests for three other brokers.\n\n仍不確定\nWhether the court will approve the incommunicado detention requests for the three campaign brokers, the exact cash amounts seized, and whether prosecutors will file formal indictments after further investigation remain pending.\n\nTrust label: Multi-source agreement — Core facts on raids, bail amounts, and detention requests match across CNA and UDN reports."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-131-sanxing-vote-buying-investigation\",\"category\":\"taiwan\",\"title\":{\"en\":\"Yilan Prosecutors Probe Multi-Tier Vote-Buying in Sanxing; Acting Mayor Released on Bail\",\"zh-TW\":\"宜蘭檢方偵辦三星鄉一條龍式賄選案 代理鄉長江淳銘 15 萬元交保\"},\"summary\":{\"en\":\"On the eve of Taiwan's local elections, Yilan prosecutors raided locations over alleged coordinated vote-buying in Sanxing Township spanning township mayor, representative, and village chief races. Acting Township Mayor Chiang Chun-ming and two other candidates were released on bail, while prosecutors sought detention for three campaign brokers. 一句重點結論：九合一選舉投票前夕，宜蘭三星鄉爆發跨層級買票疑雲，代理鄉長等三名候選人交保、三名樁腳遭聲押禁見。\",\"zh-TW\":\"九合一地方選舉投票前夕，宜蘭地檢署針對三星鄉疑似從鄉長、鄉代到村長的一條龍式賄選案發動搜索並傳喚 13 人。國民黨提名鄉長候選人、現任代理鄉長江淳銘及兩名鄉代、村長候選人分別以 10 萬至 15 萬元交保，另有三名樁腳遭檢方聲押禁見。一句重點結論：九合一選舉投票前夕，宜蘭三星鄉爆發跨層級買票疑雲，代理鄉長等三名候選人交保、三名樁腳遭聲押禁見。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n九合一地方選舉將於 11 月 28 日投票，宜蘭地方檢察署於選前針對宜蘭縣三星鄉疑似從鄉長、鄉代到村長選舉的一條龍式賄選案發動搜索，並傳喚及通知 13 名相關人士到案，現場查扣現金及筆記本等物。經檢察官偵訊後，認定國民黨提名的鄉長候選人、現任代理鄉長江淳銘（Chiang Chun-ming）與吳姓鄉代候選人、吳姓貴林村長候選人涉犯公職人員選舉罷免法（尚未經法院認定），分別諭令新台幣 15 萬元、15 萬元與 10 萬元交保；同案另有 1 名樁腳以 30 萬元交保，3 名樁腳則遭檢方聲請羈押禁見。\\n\\n「為什麼重要」\\n一條龍式賄選由地方樁腳同時替不同層級候選人買票，容易在基層選舉中形成跨職位的連動影響。檢調在投票前夕迅速搜索並針對多名候選人與樁腳採取強制處分，展現司法機關遏止基層賄選介入選舉結果的執法力道。\\n\\n「來源異同」\\n中央社與聯合新聞網均報導檢方傳喚 13 人到案、查扣現金與筆記本，且對江淳銘等三名候選人的交保金額與三名樁腳遭聲押禁見的敘述完全一致，無事實出入。\\n\\n「仍不確定」\\n法院是否裁准對三名樁腳的羈押禁見聲請、現場查扣現金的具體數額，以及檢方後續是否對涉案候選人與樁腳提起公訴，仍有待司法程序釐清。\"},\"glossary\":[{\"term\":{\"en\":\"Coordinated multi-tier vote-buying\",\"zh-TW\":\"一條龍式賄選\"},\"blurb\":{\"en\":\"An illicit campaign practice in which local brokers simultaneously buy votes for multiple candidates running for different levels of office in the same district.\",\"zh-TW\":\"地方樁腳在同一選區內同時替鄉鎮市長、代表與村里長等不同層級候選人向選民買票的違法行為。\"}},{\"term\":{\"en\":\"Public Officials Election and Recall Act\",\"zh-TW\":\"公職人員選舉罷免法\"},\"blurb\":{\"en\":\"Taiwan's primary statute governing election procedures, campaign rules, and criminal penalties for vote-buying and electoral interference.\",\"zh-TW\":\"規範台灣各級公職人員選舉與罷免程序，並明定賄選等妨害選舉行為刑責的核心法律。\"}},{\"term\":{\"en\":\"Incommunicado detention\",\"zh-TW\":\"羈押禁見\"},\"blurb\":{\"en\":\"A court-ordered pretrial confinement that bars a suspect from receiving visitors or communicating outside, preventing collusion or evidence tampering.\",\"zh-TW\":\"法院裁定將被告收押於看守所並禁止接見與通信的強制處分，用以防止串證或滅證。\"}}],\"sources\":[{\"name\":\"中央社 CNA\",\"url\":\"https://www.cna.com.tw/news/asoc/202611270120.aspx\"},{\"name\":\"聯合新聞網 UDN\",\"url\":\"https://udn.com/news/story/7321/9905915\"}],\"imageUrl\":\"/covers/live/live-taiwan-131-sanxing-vote-buying-investigation.jpg\",\"imageAlt\":{\"en\":\"Yilan District Prosecutors Office building exterior\",\"zh-TW\":\"台灣宜蘭地方檢察署外觀\"},\"isHeadline\":false,\"isPopular\":true,\"trustScore\":91,\"trustBreakdown\":{\"crossCorroboration\":24,\"outletReputation\":24,\"recencyClarity\":23,\"sourceDiversity\":20},\"publishedAt\":\"2026-11-27T16:45:11.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":5,\"D2\":5,\"D3\":4,\"D4\":5,\"D5\":4,\"total\":23},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-taiwan-131-sanxing-vote-buying-investigation/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-taiwan-131-sanxing-vote-buying-i
