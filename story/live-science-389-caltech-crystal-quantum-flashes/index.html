e Synchronized Light Pulses in Laser-Driven Crystal\",\"zh-TW\":\"加州理工團隊觀察雷射激發晶體產生同步光脈衝\"},\"summary\":{\"en\":\"Caltech researchers reported that energizing a crystal with a laser caused billions of atoms to synchronize and emit repeated light pulses through superradiance.\",\"zh-TW\":\"加州理工學院研究團隊指出，以雷射激發晶體後，數十億個原子透過超輻射機制同步發出規律光脈衝。核心結論為原子可自發形成節律發光，有助於連結微波與光學量子訊號。\"},\"body\":{\"en\":\"What happened: Researchers at Caltech reported that aiming a laser at a crystal caused billions of ions to synchronize and emit repeated pulses of light via superradiance.\\nWhy it matters: Combining microwave and optical signals through tunable atomic emission could help link quantum devices and support precision sensing or communications.\\nSource differences: SciTechDaily published \\\"Caltech Scientists Make Billions of Atoms Flash in Perfect Quantum Harmony\\\" and Optica OPN published \\\"Superradiant Source Yields Double Frequency Comb\\\", both reporting the same Nature paper.\\nStill uncertain: How quickly laboratory frequency-comb and superradiance setups can be scaled into practical quantum hardware remains to be seen.\\nTrust label: Single source — Both SciTechDaily and Optica OPN second-hand report the same Nature paper on the Caltech study, so the evidence traces to a single source.\",\"zh-TW\":\"「發生了什麼事」加州理工學院研究團隊指出，以雷射照射晶體後，數十億個離子經由超輻射（superradiance）同步並發出重複的光脈衝。\\n「為什麼重要」這項研究探索可調諧的原子發光機制，有助於在微波與光學訊號之間建立橋樑，對量子裝置連接與精密測量具潛在價值。\\n「來源異同」SciTechDaily 刊出「Caltech Scientists Make Billions of Atoms Flash in Perfect Quantum Harmony」，Optica OPN 則刊出「Superradiant Source Yields Double Frequency Comb」，兩者皆報導同一篇 Nature 論文。\\n「仍不確定」相關實驗架構未來如何工程化並整合至實用量子系統，仍有待後續研究驗證。\\nTrust label: Single source — SciTechDaily 與 Optica OPN 皆為同一篇 Nature 論文的二手報導，證據同源，故標 Single source。\"},\"glossary\":[{\"term\":{\"en\":\"Superradiance\",\"zh-TW\":\"超輻射\"},\"blurb\":{\"en\":\"A collective quantum effect in which excited atoms emit light together in phase.\",\"zh-TW\":\"受激發的原子透過共同電磁場同步並同調發射光線的集體量子現象。\"}},{\"t
