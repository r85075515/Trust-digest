mp was also weighing whether to authorise military strikes on Iran after the November midterm elections.\nWhat happened\nTrump said Friday the war will end soon, or get wrapped up soon, The Hill and Al Jazeera reported. The Hill’s account adds that he was mulling authorising military strikes on Iran following the November midterm elections. Separately, Al Jazeera’s live coverage carried the IRGC’s statement that four tankers had been hit in the Strait of Hormuz. The material gives no damage, casualty, or verification details for the tanker claim, and names no occasion for Trump’s remarks beyond Friday.\nWhy it matters\nThe two claims pull in opposite directions, and that tension is the story: a promise that the conflict will end soon sits beside reported consideration of further strikes and a reported attack on shipping in a vital waterway. Neither markets nor shipping operators can treat soon as a timetable while escalation stays under consideration.\nSources agree / disagree\nThe Hill and Al Jazeera agree on the core claim that Trump said the conflict will end soon. The tanker claim rests on the IRGC statement via Al Jazeera alone. An automated comparison flagged 038 versus 039 in headlines or snippets, but the material supplied attaches no substantive figure to either number, so it does not change the account. Trust label: Two-source agreement — two outlets agree Trump said the war will end soon, while the tanker claim is attributed to the IRGC.\nStill uncertain\nWhether tankers were damaged, anyone was hurt, strikes will be authorised, or what soon means are all unconfirmed, as are the occasion and full wording of Trump’s remarks."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-us-02-iran-war-live-oil-tanker\",\"category\":\"us\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-us-02-iran-war-live-oil-tanker.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Iran war live: Oil tankers
