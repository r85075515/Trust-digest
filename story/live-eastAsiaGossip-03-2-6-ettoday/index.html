en\":[[\"id\",\"live-eastAsiaGossip-03-2-6-ettoday\",\"d\"],[\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$L2\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L3\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[\"__PAGE__\",[\"$\",\"$1\",\"c\",{\"children\":[\"$L4\",null,[\"$\",\"$L5\",null,{\"children\":[\"$L6\",[\"$\",\"$L7\",null,{\"promise\":\"$@8\"}]]}]]}],{},null,false]},null,false]},null,false]},null,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[[\"$\",\"$L9\",null,{\"children\":\"$La\"}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]],[\"$\",\"$Lb\",null,{\"children\":[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$c\",null,{\"fallback\":null,\"children\":\"$Ld\"}]}]}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$e\",[]],\"s\":false,\"S\":true}\n"])</script><script>self.__next_f.push([1,"f:I[8587,[\"619\",\"static/chunks/619-ba102abea3e3d0e4.js\",\"523\",\"static/chunks/523-4833fd1bbfa2c2dd.js\",\"954\",\"static/chunks/app/story/%5Bid%5D/page-b37b1e31acb17fd9.js\"],\"default\"]\n10:Tc1a,"])</script><script>self.__next_f.push([1,"Nvidia founder and chief executive Jensen Huang is at the centre of an affair scandal that has spilled from gossip pages into questions about his job and his fortune. Reports said he admitted an extramarital affair in an internal letter to staff, and coverage has since split into three threads: a possible divorce settlement, a Malaysian chip-transshipment inquiry, and a claim that he has resigned.\n\nWhat happened\nSETN reported that Huang admitted an affair during his marriage and warned that a divorce could trigger a property fight, with online commenters citing one reason he would never divorce. ETtoday reported that his wife could receive half of his assets if they divorced, putting the figure above NT$2.6 trillion, while another ETtoday report cited NT$2.48 trillion and quoted a lawyer saying one precondition applies, and that an affair itself cannot be claimed for compensation. A separate SETN report alleged an affair with a married female subordinate described as a suspected spy, and said Huang could face removal, with Nvidia's board meeting as soon as that day. CNA reported from Kuala Lumpur on November 13 that Malaysia is investigating Speedmatrix, a subsidiary of Megaspeed International, to determine whether advanced AI chips were transshipped to other countries. One report in the cluster further claimed that Nvidia announced on the evening of November 12, Taiwan time, that Huang had resigned as president, chief executive and board member with immediate effect, ending 33 years in charge.\n\nWhy it matters\nThe story matters because Huang is the public face of a leading AI chipmaker, so a personal scandal with a reported corporate and geopolitical edge moves fast. The divorce figures, even as unverified reports, show how large the financial stakes could be, and the Malaysian inquiry links the affair coverage to the separate question of where advanced AI chips end up.\n\nSources agree / disagree\nOutlets agree that an affair scandal surrounds Huang and that he admitted it in a staff letter, and CNA and TechNews agree that Malaysia is investigating the Megaspeed subsidiary. They disagree on the money: ETtoday gave figures above NT$2.6 trillion, NT$2.48 trillion, and about NT$2 trillion in different reports. ⚠ Figures conflict and remain unconfirmed. The resignation claim appears in a single report with no corroboration in the other material.\nTrust label: Unconfirmed — the core affair admission is reported, but the settlement figures conflict, the resignation claim is single-sourced, and much of the coverage comes from gossip and aggregator feeds.\n\nStill uncertain\nNo divorce filing has been reported in the material, so whether Huang and his wife will divorce is unknown. The settlement figures are media estimates, not court findings, and they conflict with each other. The resignation claim has not been confirmed by Nvidia in the material supplied, and the Malaysian inquiry is described only as an investigation, with no finding reported. The affair allegations beyond the staff-letter admission also remain reports rather than established facts."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-eastAsiaGossip-03-2-6-ettoday\",\"category\":\"eastAsiaGossip\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-eastAsiaGossip-03-2-6-ettoday.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 黃仁勳若離婚恐面臨天價分手費！　妻拿走一半逾2.6兆元 - ETtoday新聞雲\",\"zh-TW\":\"相關封面圖：黃仁勳若離婚恐面臨天價分手費！　妻拿走一半逾2.6兆元 - ETtoday新聞雲\"},\"publishedAt\":\"2026-11-13T07:40:47.000Z\",\"title\":{\"en\":\"Jensen Huang Faces Divorce-Settlement Reports After Admitted Affair\",\"zh-TW\":\"黃仁勳（Jensen Huang）認婚外情後，離婚分手費傳聞延燒\"},\"summary\":{\"en\":\"Nvidia founder Jensen Huang, one of the world's best-known tech chiefs, is at the centre of an alleged affair scandal after reports said he admitted an extramarital affair to staff. ETtoday put a divorce settlement above NT$2.6 trillion, while another ETtoday report cited NT$2.48 trillion. None of the figures is verified, so the money talk is speculation.\",\"zh-TW\":\"輝達（Nvidia）創辦人黃仁勳（Jensen Huang）是全球知名科技領袖，婚外情傳聞延燒，據報導他已向員工坦承婚外情。ETtoday 稱若離婚，妻子可分逾 2.6 兆元，另一篇 ETtoday 報導則稱 2.48 兆元，數字不一且未經證實，分手費說法目前只是傳聞。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"輝達（Nvidia）創辦人兼執行長黃仁勳（Jensen Huang）深陷婚外情傳聞，風波從八卦版面延燒到他的職位與財產。據報導，他已透過發給全體員工的內部信坦承婚外情，後續報導分成三條線：可能的離婚分手費、馬來西亞晶片轉運調查，以及他已辭職的說法。\\n\\n發生了什麼事\\n三立新聞網（SETN）報導，黃仁勳坦承婚內出軌，離婚可能引發財產風暴，網友提出他「死都不離」的一個理由。ETtoday 報導，若離婚，妻子可分走一半財產，金額逾 2.6 兆元；另一篇 ETtoday 報導稱 2.48 兆元，並引述律師說法，指有一個前提，外遇本身不能求償。另一篇三立新聞網報導指稱他與一名已婚女下屬、疑似間諜傳出緋聞，黃仁勳可能遭罷免，輝達最快當天開董事會。中央社（CNA）吉隆坡 13 日報導，馬來西亞正在調查 Megaspeed International 子公司 Speedmatrix，釐清是否涉及將先進 AI 晶片轉運至其他國家。另有一則報導稱，台灣時間 12 日晚間，輝達正式發布公告，黃仁勳即日起辭去總裁、執行長及董事會成員職務，結束長達 33 年的領導。\\n\\n為什麼重要\\n黃仁勳是全球指標 AI 晶片大廠的公開面孔，私人緋聞一旦牽連公司與地緣政治，擴散速度很快。分手費數字即使未經證實，也顯示一旦離婚，財務規模可能極為龐大；馬來西亞的調查則把緋聞報導與先進 AI 晶片流向的問題連在一起。\\n\\n來源異同\\n各家報導一致的部分是：黃仁勳捲入婚外情風波，且已向員工坦承；中央社與科技新報一致報導馬來西亞正在調查 Megaspeed 子公司。數字方面分歧明顯：ETtoday 不同報導分別稱逾 2.6 兆元、2.48 兆元與約兩兆元。⚠ 說法衝突，尚未證實。辭職說法只出現在單一報導，沒有其他素材佐證。\\n信任標籤：未經證實——婚外情坦承有報導依據，但分手費數字互相矛盾，辭職說法只有單一來源，且多數報導來自八卦與轉載管道。\\n\\n仍不確定\\n素材中沒有離婚訴訟的消息，黃仁勳夫妻是否離婚仍未知。分手費數字是媒體推估，並非法院認定，且彼此矛盾。辭職說法在現有素材中未獲輝達證實，馬來西亞調查也只說明正在調查，沒有公布任何認定。內部信坦承以外的緋聞指控，同樣停留在報導層次，並非已確認的事實。\"},\"sources\":[{\"name\":\"TechNews 科技新報\",\"url\":\"https://technews.tw/2026/11/13/jensen-huang-affair-scandal-malaysia-investigates-alleged-mistress-former-employer-subsidiary/\"},{\"name\":\"中央社-國際\",\"url\":\"https://www.cna.com.tw/news/aopl/202611130127.aspx\"},{\"name\":\"ettoday.net\",\"url\":\"https://news.google.com/rss/articles/CBMiXkFVX3lxTE51M2NXcnN3ejdWUE5CMTlubUlLb1JYbFRlbGVzNTRxNGUzT1A1THhaaktXdUNlS3pGWFFHR21JbHp0bHNnMXRxTTd5Q2s5WW1PTGVObHBYc0szbXE1dkHSAUtBVV95cUxQOUo5NVFnUFlNX1JyQS1JOG9EOWlCZElKWHRzN0RwenRkT2tqY2pTYkZyd2loMEZvNWRXX0h4YVc4MWd5RUM1R3lqSkk?oc=5\"},{\"name\":\"setn.com\",\"url\":\"https://news.google.com/rss/articles/CBMiS0FVX3lxTE5Ub3RBcFpVMzZYSzJib2xzUWQ1QUY5SjlFMkpIOE9aa1VJWWUxWmpCWTlsdTJ4c0EzZVhVNmNJLTJIdDZDYU5xTzlLSQ?oc=5\"},{\"name\":\"Vogue Taiwan\",\"url\":\"https://www.vogue.com.tw/article/nvidia-ceo-jensen-huang-resigns\"},{\"name\":\"tvbs新聞網\",\"url\":\"https://news.google.com/rss/articles/CBMiT0FVX3lxTE9hS0FfUWg5WjhXQXZBNDBfYjNwc3E3ZlJSb3ZLSmNzRFRhV2phRUJNMllNMVU1b2JvNG9kTnZ6YjRqamVWR0Y3bVBrNXU5S00?oc=5\"},{\"name\":\"rti中央廣播電臺\",\"url\":\"https://news.google.com/rss/articles/CBMiWEFVX3lxTE9BeWpiTHdONnhrNEpjSENSaThHWHJ4ZDdsZ3h1Qy1mQWtPTmoyTXVFa1VPcU1LZkdCVDE0SXpNWnVrZGNyM1lLTkpWWWxGSC0tYjlBOWN1Z0U?oc=5\"},{\"name\":\"民視新聞網\",\"url\":\"https://news.google.com/rss/articles/CBMiYEFVX3lxTE0wOERqTjk3Mnh4NDJseVc3QVAyckJCZU9NYURNTUFvWEpzU1huTVJlUHBxNjhmM2M3S0x
