ondent.\nWhat happened\nSeptember arrivals reached 4.03 million, a 22% year-on-year increase attributed to the Mid-Autumn holiday and multiple festival events. For the first nine months of the year, cumulative arrivals hit 40.7 million, up 12% from the same period last year. The figures were reported by CNA reporter Chang Chien from Hong Kong on October 15.\nWhy it matters\nA 22% monthly jump and a 12% year-to-date gain both point the same way: Hong Kong's visitor economy is still expanding, with holiday calendars doing real work in pulling travelers in. For a city that has bet heavily on mega-events and festivals to revive tourism, September's numbers are a data point in favor of that strategy.\nSources agree / disagree\nThe feed cluster contains a single outlet — CNA's cross-strait desk — so the figures rest on one newsroom's reporting with no independent corroboration in the digest. Trust label: Single source — one outlet only; the numbers are as reported, unverified against the primary release.\nStill uncertain\nThe snippet does not break down arrivals by source market, length of stay or spending, nor does it name the publishing body behind the figures. Verify the breakdown and the primary release before quoting."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-02-9-403-22\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-taiwan-02-9-403-22.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 9月訪港旅客403萬人次 升22%\",\"zh-TW\":\"相關封面圖：9月訪港旅客403萬人次 升22%\"},\"publishedAt\":\"2026-10-15T04:54:49.000Z\",\"title\":{\"en\":\"Hong Kong Logs 4.03 Million September Visitors, Up 22% on Holiday Festivities\",\"zh-TW\":\"9月訪港旅客403萬人次、年增22%　中秋連假與節慶活動帶動\"},\"summary\":{\"en\":\"Hong Kong received 4.03 million visitors in September, up 22% from a year earlier, boosted by the Mid-Autumn Festival holiday and a series of festive events, according to figures reported by CNA. Cumulative arrivals for the first nine months of the year reached 40.7 million, up 12% year on year.\",\"zh-TW\":\"據中央社（CNA）引述公布數據，受惠於中秋節假期及多項節慶活動，9月訪港旅客達403萬人次，較去年同期上升22%。今年頭9個月累計訪港旅客達4,070萬人次，年增12%。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"香港旅遊復甦在9月持續攀升：據中央社（CNA）駐香港記者引述的數據，9月訪港旅客達403萬人次，較去年同期上升22%，受惠於中秋節假期及多項節慶活動。\\n發生了什麼事\\n9月訪港旅客403萬人次，年增22%，歸因於中秋連假與多項節慶活動。今年頭9個月累計訪港旅客達4,070萬人次，較去年同期上升12%。數據由中央社記者張謙10月15日自香港發出。\\n為什麼重要\\n單月成長22%、前9個月累計成長12%，兩個數字指向同一方向：香港的旅客經濟仍在擴張，假期檔期確實發揮了吸客效果。對一個重押大型活動與節慶來重振旅遊的城市而言，9月的數字是支持這套策略的證據。\\n來源異同\\n來源群組只有中央社（CNA）兩岸線一家，數字仰賴單一新聞室的報導，摘要內無獨立佐證。信任標籤：單一來源——僅一家媒體；數字為轉述，未與原始發布對照驗證。\\n仍不確定\\n摘要未提供客源市場、停留天數或消費金額的細分，也沒指明數據的發布單位。引用前請查閱細分數據與原始發布。\"},\"sources\":[{\"name\":\"中央社-兩岸\",\"url\":\"https://www.cna.com.tw/news/acn/202610150103.aspx\"}],\"disagreements\":null,\"trustScore\":59,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"中央社-兩岸\"],\"glossary\":[{\"blurb\":{\"en\":\"Destination city that logged 4.03 million visitor arrivals in September.\",\"zh-TW\":\"9月迎來403萬人次旅客的目的地城市。\"},\"term\":{\"en\":\"Hong Kong\",\"zh-TW\":\"香港\"}},{\"blurb\":{\"en\":\"Taiwan's national news agency, whose Hong Kong correspondent reported the figures.\",\"zh-TW\":\"台灣的國家通訊社，其駐港記者報導了這組數據。\"},\"term\":{\"en\":\"Central News Agency\",\"zh-TW\":\"中央社\"}},{\"blurb\":{\"en\":\"Holiday credited with boosting September visitor arrivals.\",\"zh-TW\":\"被認為帶動9月旅客成長的節日假期。\"},\"term\":{\"en\":\"Mid-Autumn Festival\",\"zh-TW\":\"中秋節\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sour
