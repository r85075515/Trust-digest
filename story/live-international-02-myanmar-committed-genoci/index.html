onal Court of Justice found a state culpable of genocide for the first time. A historic judgment from the International Court of Justice ruled that Myanmar committed genocide against its Rohingya minority. The ruling comes years after Myanmar's Muslim minority was forced to flee. Stephanie Sy discusses what the genocide verdict means for international law and the future of the Rohingya people with Adil Ahmad Haque, author of \"Law and Morality at War.\" Why it matters\nThis cluster was assembled from 4 feed item(s) across 4 outlet(s) (BBC World, NPR World, NYT World, PBS NewsHour) in the international category. Axiom links out to each publisher; this digest only restates titles and short feed descriptions — not full articles. Sources agree / disagree\nMultiple outlets are covering closely related headlines: \"Myanmar committed genocide against Rohingya minority, top UN court rules\" (BBC World); \"The U.N.'s top court rules Myanmar committed genocide against the Rohingya\" (NPR World); \"Myanmar Committed Genocide Against the Rohingya, Top Global Court Finds\" (NYT World); \"International Court of Justice finds Myanmar guilty of genocide against Rohingya\" (PBS NewsHour).\nNo clear numeric/name conflicts detected in the short feed snippets; always verify details on the publisher pages. Still uncertain\nFeed descriptions can omit context, updates, or corrections. Click through to the linked outlets for the latest full reporting. Trust scores are heuristics, not fact-check guarantees. Linked sources (outlet names only): BBC World, NPR World, NYT World, PBS NewsHour"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-02-myanmar-committed-genoci\",\"category\":\"international\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-international-02-myanmar-committed-genoci.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Myanmar Committed Genocide Against the Rohingya, Top Global Court F
