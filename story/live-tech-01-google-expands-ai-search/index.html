e grow 25% year over year to $127.6 billion.\nWhat happened\nThe expansion takes advertising into Google's AI Search experience and rolls it out globally, according to the headline. The timing matters as much as the move: the announcement arrived with Alphabet's third-quarter results, a quarter in which revenue rose 25% from a year earlier to $127.6 billion. The snippets give no list of markets, no ad formats, and no figure for the core advertising growth that is described as slowing.\nWhy it matters\nSearch advertising is the engine of Google's business, so placing ads inside AI-generated search answers is not a side project. If AI Search becomes the front door to search, the ads that follow users there decide how the new experience pays for itself, and the earnings timing suggests Google wants investors to read the expansion as growth, not retreat.\nSources agree / disagree\nThis card rests on a single TechCrunch item. No second outlet in the feed confirms the global rollout, its scope, or the earnings figures, so the account should be read as one outlet's report, not as a corroborated announcement. Trust label: Single source — one TechCrunch item; the rollout and earnings figures are uncorroborated in the feed.\nStill uncertain\nThe snippets do not say when the global expansion completes, which countries are included, what the ads look like, or how much core advertising growth slowed. Verify the rollout details and the earnings breakdown in the full reporting before quoting them."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-tech-01-google-expands-ai-search\",\"category\":\"tech\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-tech-01-google-expands-ai-search.webp\",\"imageAlt\":{\"en\":\"Cover related to: Google expands AI Search ads globally as core ad growth slows\",\"zh-TW\":\"相關封面圖：隨著核心廣告成長放緩，Google在全球擴展人工智慧搜尋廣告\"},\"publishedAt\":\"2026-10-28T21:48:37.000Z\",\"title\":{\"en\":\"Google Expands AI Search Ads Globally as Core Ad Growth Slows\",\"zh-TW\":\"Google 在核心廣告成長放緩之際，於全球擴展人工智慧搜尋廣告\"},\"summary\":{\"en\":\"[Unverified, single source] Google is expanding AI Search ads globally as its core advertising growth slows, TechCrunch reports. The announcement came alongside Alphabet's third-quarter earnings, with revenue up 25% year over year to $127.6 billion. The global rollout's scope is still undisclosed in the snippets.\",\"zh-TW\":\"［未證實·單一來源］Google 在核心廣告成長放緩之際，於全球擴展人工智慧搜尋廣告。這項消息與母公司 Alphabet 第三季財報同時發布，營收年增 25% 至 1,276 億美元。接下來看：全球推出的範圍，摘要尚未交代。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"TechCrunch 報導，Google 正在全球擴展人工智慧搜尋廣告，正值其核心廣告成長放緩之際。這項消息與母公司 Alphabet 的第三季財報同時發布，營收年增 25%，達到 1,276 億美元。\\n發生了什麼事\\n根據標題，這次擴展把廣告帶進 Google 的人工智慧搜尋體驗，並在全球推出。時機與動作本身同樣重要：消息隨著 Alphabet 第三季財報一起發布，該季營收較去年同期成長 25%，達到 1,276 億美元。摘要沒有列出市場名單、廣告形式，也沒有給出被描述為放緩的核心廣告成長數字。\\n為什麼重要\\n搜尋廣告是 Google 業務的引擎，因此在人工智慧生成的搜尋答案中置入廣告，絕不是邊緣計畫。如果人工智慧搜尋成為搜尋的入口，跟著使用者走進去的廣告，就決定了這種新體驗如何為自己買單；而財報時機顯示，Google 希望投資人把這次擴展解讀為成長，而非退縮。\\n來源異同\\n本卡只有 TechCrunch 一則報導。摘要中沒有第二家媒體佐證全球推出的範圍或財報數字，因此應視為一家媒體的報導，而非經過佐證的公告。信任標籤：僅1源——只有 TechCrunch 一則報導，推出範圍與財報數字在摘要中沒有其他來源佐證。\\n仍不確定\\n摘要沒有說明全球擴展何時完成、包含哪些國家、廣告長什麼樣子，也沒有說明核心廣告成長放緩了多少。引用推出細節與財報細目前，請查閱完整報導。\"},\"sources\":[{\"name\":\"TechCrunch\",\"url\":\"https://techcrunch.com/2026/10/28/google-expands-ai-search-ads-globally-as-core-ad-growth-slows/\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":18,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"tech\",\"live-ingest\",\"techcrunch\"],\"glossary\":[{\"blurb\":{\"en\":\"The company expanding AI Search ads globally.\",\"zh-TW\":\"在全球擴展人工智慧搜尋廣告的公司。\"},\"term\":{\"en\":\"Google\",\"zh-TW\":\"Google\"}},{\"blurb\":{\"en\":\"Google's parent company, whose third-quarter revenue grew 25% to $127.6 billion.\",\"zh-TW\":\"第三季營收年增 25% 至 1,276 億美元的 Google 母公司。\"},\"term\":{\"en\":\"Alphabet\",\"zh-TW\":\"Alphabet\"}},{\"blurb\":{\"en\":\"Google's AI-powered search experience, now carrying ads globally.\",\"zh-TW\":\"如今在全球投放廣告的 Google 人工智慧搜尋體驗。\"},\"term\":{\"en\":\"AI Search\",\"zh-TW\":\"人工智慧搜尋\"}},{\"blurb\":{\"en\":\"Technology news outlet that reported the expansion and the earnings figures.\",\"zh-TW\":\"報導本次擴展與財報數字的科技新聞媒體。\"},\"term\":{\"en\":\"TechCrunch\",\"zh-TW\":\"TechCrunch\"}},{\"blurb\":{\"en\":\"The advertising business whose growth is described as slowing.\",\"zh-TW\":\"成長被描述為放緩的廣告業務。\"},\"term\":{\"en\":\"search advertising\",\"zh-TW\":\"搜尋廣告\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://r85075515.github.io/Trust-digest/\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"Axiom\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"zh_TW\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:locale:alternate\",\"content\":\"en_US\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"9\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"10\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"11\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sou
