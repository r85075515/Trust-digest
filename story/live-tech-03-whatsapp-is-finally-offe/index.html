says it is one of the most requested features on the platform.\n\nWhat happened\nThe Verge reported that users will be able to choose a time to send a message instead of sending it immediately, including birthday messages they would otherwise have to remember at 4 a.m. Engadget confirmed the same rollout, noting that most rival messaging platforms have offered scheduling for a very long time and WhatsApp is catching up only now.\n\nWhy it matters\nScheduling is a small feature with a large audience: 3 billion people get a tool for birthdays, reminders and messages that arrive at awkward hours. Its arrival this late also measures how slowly WhatsApp has moved on a basic convenience its rivals treated as standard years ago.\n\nSources agree and disagree\nThe Verge and Engadget agree on the core facts, scheduled messages, private and group chats, up to 14 days ahead, and their figures describe different things: 3 billion users against a 14-day scheduling window, so there is no conflict.\n\nStill uncertain\nThe feed summaries give no rollout timetable, no list of supported platforms at launch, and no detail on editing or cancelling a scheduled message. Availability may vary by region and device.\n\nTrust label: Two-source agreement — The Verge and Engadget report the same rollout with matching details."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"adult\":false,\"body\":{\"en\":\"$10\",\"zh-TW\":\"發生了什麼事\\nWhatsApp 終於推出定時訊息功能，30億用戶可提前排程文字、照片或影片訊息，最長提前14天，私人對話與群組聊天都適用。Meta 表示這是用戶最常要求的功能之一。科技媒體 The Verge 報導，用戶不必立即傳送，可選定時間發送，例如不必在凌晨4點爬起來傳生日訊息；科技媒體 Engadget 也證實同一項更新，並指出多數對手訊息平台早已提供定時功能多年，WhatsApp 直到現在才跟上。\\n\\n為什麼重要\\n這是小功能、大受眾：30億人拿到一個處理生日、提醒與尷尬時段訊息的工具。WhatsApp 這麼晚才補上，也顯示它在對手多年前就視為標配的基本便利功能上，動作有多慢。\\n\\n來源異同\\nThe Verge 與 Engadget 在核心事實上一致——定時訊息、私人與群組對話都適用、最長提前14天。兩組數字講的是不同事物：30億用戶對14天排程窗口，彼此沒有衝突。信任標籤：雙源一致。\\n\\n仍不確定\\n摘要未說明分批推送時程、首發支援哪些平台，也未說明排定後能否編輯或取消訊息。實際上線時間可能因地區與裝置而異。\"},\"category\":\"tech\",\"disagreements\":null,\"glossary\":[{\"blu
