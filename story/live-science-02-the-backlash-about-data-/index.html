buildings themselves than about power: the strain on the grid, rising bills, and who pays for the extra capacity.\nWhy it matters\nThe essay reframes the backlash from 'anti-AI' to 'about electricity,' which changes the policy question. If the core grievance is power, the answers are grid upgrades, rate design, and who bears the cost — not a referendum on AI itself. It pairs with the same day's New York Times column on voter backlash against AI: one piece argues the backlash could slow the boom, the other argues the backlash is really about power. The takeaway is that the politics of data centers will be fought on electricity bills.\nSources agree / disagree\nOnly MIT Technology Review carries the piece in the feed, so there is no independent corroboration. Trust label: Single source — one outlet, a reported essay, no cross-check in the snippets.\nStill uncertain\nThe snippets give no electricity-price data, no resident quotes, and no policy responses. Those details should be checked against the full Algorithm piece."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-science-02-the-backlash-about-data-\",\"category\":\"science\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-science-02-the-backlash-about-data-.jpg\",\"imageAlt\":{\"en\":\"Data Center Alley in Ashburn, Virginia\",\"zh-TW\":\"維吉尼亞州阿什本資料中心巷\"},\"publishedAt\":\"2026-11-09T19:35:33.000Z\",\"title\":{\"en\":\"The Data Center Backlash Might Really Be About Electricity\",\"zh-TW\":\"反資料中心聲浪，說穿了可能是電的問題\"},\"summary\":{\"en\":\"[Unconfirmed · single source] In MIT Technology Review's Algorithm newsletter, a reporter in Ashburn, Virginia — 'Data Center Alley,' the world's largest data center hub — argues the backlash sweeping the U.S. may really be about electricity, not the data centers themselves. The piece is a reported essay from one outlet; its thesis, not a news event, is the point.\",\"zh-TW\":\"［未證實·單一來源］《麻省理工科技評論》Algorithm 電子報的記者身在維吉尼亞州阿什本——「資料中心巷」、全球最大資料中心樞紐——主張席捲全美的反彈聲浪，說穿了可能是電的問題，而非資料中心本身。這是一篇單一媒體的現場評論，重點在論點而非新聞事件。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"上週美國選民前往投票所投票時，《麻省理工科技評論》的記者身在維吉尼亞州阿什本——「資料中心巷」、全球最大資料中心樞紐的一部分。文章主張，席捲全美的反彈聲浪可以說正是從這裡開始成形，而它說穿了可能只是電的問題。\\n發生了什麼事\\n記者在 Algorithm 電子報中寫道，美國人上週投票期間，他開車穿過阿什本，把全國資料中心反彈聲浪的根源追溯到建設最密集的小鎮。論點是，居民抱怨的重點不在建築本身，而在電力：電網壓力、電費上漲，以及額外容量由誰買單。\\n為什麼重要\\n這篇文章把反彈從「反人工智慧」重新框架為「電的問題」，從而改變了政策問題。如果核心不滿是電力，答案就是電網升級、電價設計與成本分攤，而非對人工智慧本身的公投。它與同日《紐約時報》選民反彈人工智慧的專欄互補：一篇主張反彈可能拖慢熱潮，另一篇主張反彈說穿了是電的問題。結論是，資料中心的政治角力將在電費帳單上見分曉。\\n來源異同\\n來源中只有《麻省理工科技評論》刊登這篇文章，無法獨立查證。信任標籤：僅1源——單一媒體、現場評論，摘要中無交叉佐證。\\n仍不確定\\n摘要未提供電價數據、居民引言與政策回應。這些細節請對照 Algorithm 全文。\"},\"sources\":[{\"name\":\"MIT Technology Review\",\"url\":\"https://www.technologyreview.com/2026/11/09/1148194/the-backlash-about-data-centers-might-really-just-be-about-electricity/\"}],\"disagreements\":null,\"trustScore\":47,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":10,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"science\",\"live-ingest\",\"mit-technology-review\"],\"glossary\":[{\"term\":{\"en\":\"Data Center Alley\",\"zh-TW\":\"資料中心巷\"},\"blurb\":{\"en\":\"The Ashburn, Virginia area, home to the world's largest concentration of data centers.\",\"zh-TW\":\"維吉尼亞州阿什本一帶，全球資料中心最密集的地區。\"}},{\"term\":{\"en\":\"Ashburn\",\"zh-TW\":\"阿什本\"},\"blurb\":{\"en\":\"A town in Virginia at the heart of the U.S. data center build-out.\",\"zh-TW\":\"美國資料中心建設核心地帶的維吉尼亞州小鎮。\"}},{\"term\":{\"en\":\"Power grid\",\"zh-TW\":\"電網\"},\"blurb\":{\"en\":\"The network that delivers electricity to homes and businesses.\",\"zh-TW\":\"向家庭與企業供電的網路系統。\"}},{\"term\":{\"en\":\"Algorithm newsletter\",\"zh-TW\":\"Algorithm 電子報\"},\"blurb\":{\"en\":\"MIT Technology Review's weekly newsletter on AI.\",\"zh-TW\":\"《麻省理工科技評論》關於人工智慧的每週電子報。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-
