common bacterium to tumor formation, which matters for future screening and prevention research; the other two items are independent studies and should not be read as related.\nSources agree / disagree\nAll three items come from a single outlet, ScienceDaily, and cover different studies. Trust label: Bundled stories — separate studies grouped in one cluster from one source.\nStill uncertain\nThe snippets give no study sizes, journals or peer-review status; verify each study in its original paper before drawing clinical conclusions."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-biotech-01-scientists-finally-disco\",\"category\":\"biotech\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-biotech-01-scientists-finally-disco.webp\",\"imageAlt\":{\"en\":\"Cover related to: Scientists finally discover how a common gut bacterium can trigger colon cancer\",\"zh-TW\":\"相關封面圖：（譯文待補）Scientists finally discover how a common gut bacterium can trigger colon cancer\"},\"publishedAt\":\"2026-11-01T13:24:51.000Z\",\"title\":{\"en\":\"Johns Hopkins Team Finds How Bacteroides fragilis Toxin Can Trigger Colon Cancer, ScienceDaily Reports\",\"zh-TW\":\"約翰霍普金斯（Johns Hopkins）團隊找出脆弱擬桿菌（Bacteroides fragilis）毒素引發大腸癌的機制\"},\"summary\":{\"en\":\"Scientists at Johns Hopkins have uncovered a crucial missing link between a common gut bacterium and colorectal cancer, solving a mystery of nearly two decades: Bacteroides fragilis produces a toxin that damages the colon's protective lining, triggers chronic inflammation and promotes tumor formation, ScienceDaily reported.\",\"zh-TW\":\"ScienceDaily 報導，約翰霍普金斯（Johns Hopkins）科學家找出常見腸道菌與大腸直腸癌之間關鍵的缺失環節，解開近 20 年謎團：脆弱擬桿菌（Bacteroides fragilis）產生的毒素會損害大腸保護層、引發慢性發炎並促進腫瘤形成。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"約翰霍普金斯關於腸道菌的發現是本組主軸，本組另混裝兩則無關的 ScienceDaily 健康新聞。\\n發生了什麼事\\nScienceDaily 報導，約翰霍普金斯（Johns Hopkins）科學家找出常見腸道菌與大腸直腸癌之間關鍵的缺失環節，解開困擾研究者近 20 年的謎團。該菌脆弱擬桿菌（Bacteroides fragilis）產生的毒素會損害大腸保護層、引發慢性發炎並促進腫瘤形成。同一組另有兩則獨立的 ScienceDaily 報導：其一描述高膽固醇飲食削弱身體膽固醇防禦的隱藏機制，針對該路徑的實驗藥物已通過早期人體安全試驗；其二是一項研究，指出每日吃花生 16 週改善年長者與記憶相關腦區的胰島素反應。\\n為什麼重要\\n主軸發現指明了從常見腸道菌到腫瘤形成的具體路徑，對未來篩檢與預防研究有意義；另兩則是獨立研究，不應視為相關。\\n來源異同\\n三則皆來自同一媒體 ScienceDaily，且報導不同研究。信任標籤：混裝故事——同一來源的不同研究併成一組。\\n仍不確定\\n摘要未給研究規模、期刊或同儕審查狀態；得出臨床結論前，請逐一查閱原始論文。\"},\"sources\":[{\"name\":\"ScienceDaily 健康醫學\",\"url\":\"https://www.sciencedaily.com/releases/2026/10/261031012912.htm\"}],\"disagreements\":null,\"trustScore\":54,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":17,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"biotech\",\"live-ingest\",\"sciencedaily-健康醫學\",\"sciencedaily-健康醫學\",\"sciencedaily-健康醫學\"],\"glossary\":[{\"term\":{\"en\":\"Johns Hopkins\",\"zh-TW\":\"約翰霍普金斯\"},\"blurb\":{\"en\":\"US university whose scientists reported the gut bacterium finding.\",\"zh-TW\":\"美國大學，其科學家發表腸道菌發現。\"}},{\"term\":{\"en\":\"Bacteroides fragilis\",\"zh-TW\":\"脆弱擬桿菌\"},\"blurb\":{\"en\":\"Gut bacterium whose toxin the report links to colon damage and tumors.\",\"zh-TW\":\"腸道菌，報導指其毒素與大腸損害及腫瘤相關。\"}},{\"term\":{\"en\":\"ScienceDaily\",\"zh-TW\":\"ScienceDaily\"},\"blurb\":{\"en\":\"Science news outlet carrying all three items in this cluster.\",\"zh-TW\":\"科學新聞媒體，本組三則皆出自此處。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-biotech-01-scientists-finally-disco/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi
