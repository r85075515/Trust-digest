atters\nA pope traveling three weeks after lung cancer surgery is a health story as much as a diplomatic one: every appearance will be read for signs of his recovery. The itinerary also matters — Peru is where Leo spent two decades, so the tour is a homecoming as well as a first major trip of his papacy. For Catholics across Latin America, the visit is the first chance to see the new pope in the region he knows best.\nSources agree / disagree\nBBC World, NPR World, and NYT World all carry the story and agree on the core facts: the 12-day, three-country tour, the recent lung cancer surgery, and the timing three weeks after the operation. Their angles differ slightly — the BBC on his health, NPR on the tour's shape, the Times on the scale of the travel — but nothing conflicts. Trust label: Multi-source agreement — three major outlets agree on the tour, the surgery, and the timing.\nStill uncertain\nThe feed gives no day-by-day itinerary, no detail on the surgery itself beyond \"lung cancer,\" and no medical assessment beyond the BBC's \"pretty good health.\" Whether the pace of 12 flights in 12 days strains his recovery is the open question the tour itself will answer. Follow the full reporting for schedule changes."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-02-12-planes-in-12-days-pop\",\"category\":\"international\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-international-02-12-planes-in-12-days-pop.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Pope Leo XIV Begins 12-Day Latin America Tour Weeks After Lung Cancer Surgery\",\"zh-TW\":\"相關封面圖：教宗良十四世（Pope Leo XIV）術後三週啟程 12 天拉美行\"},\"publishedAt\":\"2026-11-07T06:59:48.000Z\",\"title\":{\"en\":\"Pope Leo XIV Begins 12-Day Latin America Tour Weeks After Lung Cancer Surgery\",\"zh-TW\":\"教宗良十四世（Pope Leo XIV）術後三週啟程 12 天拉美行\"},\"summary\":{\"en\":\"Pope Leo XIV has begun a 12-day tour of Uruguay, Argentina, and Peru, his first South American trip since lung cancer surgery three weeks ago, the BBC, NPR, and the New York Times report. The 12-planes-in-12-days journey is his first major trip since the operation. Watch his health as the tour unfolds.\",\"zh-TW\":\"教宗良十四世（Pope Leo XIV）展開為期 12 天的烏拉圭、阿根廷與秘魯之行，這是他肺癌手術三週後首次南美洲出訪，BBC、NPR 與《紐約時報》報導。12 天搭 12 班機的行程也是他上月手術後首次重大出訪，接下來看他的健康狀況與行程進展。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"教宗良十四世（Pope Leo XIV）展開為期 12 天的烏拉圭、阿根廷與秘魯之行——12 天搭 12 班機，就在他接受肺癌手術三週後。\\n發生了什麼事\\nBBC、NPR 與《紐約時報》報導，這次出訪是教宗手術後首次南美洲之行，也是他上月接受肺部手術後首次重大出訪。12 天的行程帶他前往烏拉圭、阿根廷與秘魯——秘魯是他度過二十年的地方。BBC 形容他出發時「健康狀況相當不錯」；NPR 則強調這是癌症手術後為期 12 天、橫跨三國的南美洲之行。\\n為什麼重要\\n教宗在肺癌手術三週後出訪，既是外交行程，也是健康議題：每一次公開露面都會被拿來解讀他的恢復狀況。行程本身也有意義——秘魯是良十四世生活二十年的地方，這趟行程既是回鄉，也是他就任教宗後首次重大出訪。對拉丁美洲的天主教徒來說，這是第一次在家門口見到這位最熟悉本地的新教宗。\\n來源異同\\nBBC、NPR 與《紐約時報》三家都報導了這則消息，核心事實一致：12 天、三國之行、最近的肺癌手術，以及術後三週的時間點。角度略有不同——BBC 談健康、NPR 談行程架構、《紐約時報》談旅途規模——但沒有互相牴觸之處。信任標籤：多源一致——三家主要媒體對出訪、手術與時間點的報導一致。\\n仍不確定\\n來源沒有逐日行程，沒有說明手術本身的細節，只寫了「肺癌」，醫療評估也只有 BBC 一句「健康狀況相當不錯」。12 天搭 12 班機的節奏會不會影響他的恢復，是這趟行程本身要回答的開放問題。行程若有變動，請看完整報導。\"},\"sources\":[{\"name\":\"BBC World\",\"url\":\"https://www.bbc.co.uk/news/articles/c60e0001ve9wo?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"NPR World\",\"url\":\"https://www.npr.org/2026/11/06/nx-s1-6026702/pope-leo-begins-12-day-3-country-tour-after-cancer-surgery\"},{\"name\":\"NYT World\",\"url\":\"https://www.nytimes.com/2026/11/06/world/europe/pope-leo-visit-uruguay-argentina-peru.html\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":20,\"outletReputation\":21,\"crossCorroboration\":22,\"recencyClarity\":25},\"tags\":[\"international\",\"live-ingest\",\"bbc-world\",\"npr-world\",\"nyt-world\"],\"glossary\":[{\"blurb\":{\"en\":\"Pope beginning a 12-day Latin America tour after lung cancer surgery.\",\"zh-TW\":\"肺癌手術後展開 12 天拉美行的教宗。\"},\"term\":{\"en\":\"Pope Leo XIV\",\"zh-TW\":\"教宗良十四世\"}},{\"blurb\":{\"en\":\"First country on the Pope's 12-day tour.\",\"zh-TW\":\"教宗 12 天行程的第一站。\"
