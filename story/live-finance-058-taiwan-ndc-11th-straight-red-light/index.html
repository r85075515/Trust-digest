0 points in October, down one point from September, extending its streak of booming 'red light' readings to a record-setting 11 consecutive months. Among the nine underlying components, eight held steady in red-light territory—led by strong AI-driven customs exports, industrial production, and machinery imports—while the manufacturing business climate index dropped from 101.79 to 98.94 points, shifting from yellow-red to green.\n\nThe unprecedented 11-month red-light run underscores how global artificial intelligence and high-performance computing infrastructure spending continues to anchor Taiwan's macroeconomic expansion, even as traditional manufacturers grow cautious over external trade barriers.\n\nFocus Taiwan, Economic Daily News, and Anue (cnyes) all confirm the October score of 40 points, the record 11th consecutive red light, and the single-point drop caused by the manufacturing business climate index turning green. Anue highlights three key forward risks cited by the NDC—US trade policy shifts, geopolitical tensions, and major central bank rate trajectories—while Economic Daily News emphasizes the NDC's assessment that underlying AI demand remains solid.\n\nWhether rising base-period effects and new US Section 301 tariff investigations on non-semiconductor sectors will cool Taiwan's composite indicator out of red-light territory in the fourth quarter remains to be seen.\n\nTrust label: Multi-source agreement — Focus Taiwan, Economic Daily News, and Anue report identical October NDC indicator figures."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-058-taiwan-ndc-11th-straight-red-light\",\"category\":\"finance\",\"title\":{\"en\":\"Taiwan's Economy Flashes Record 11th Consecutive Red Light in October on AI Export Boom\",\"zh-TW\":\"國發會公布10月景氣燈號連11紅再創史上最長紀錄 AI需求支撐出口與投資\"},\"summary\":{\"en\":\"Taiwan's National Development Council reported on November 27, 2026 that the composite monitoring indicator scored 40 points in October, flashing a booming 'red light' for a record-breaking 11th straight month. While AI-driven exports and machinery imports remained robust, the manufacturing business climate index slipped from yellow-red to green amid US tariff and policy uncertainties.\",\"zh-TW\":\"國發會於 2026 年 11 月 27 日公布 10 月景氣對策信號綜合判斷分數為 40 分，較上月減少 1 分，連續第 11 個月亮出代表景氣熱絡的紅燈，再度刷新史上最長紅燈紀錄。AI 應用深化持續推升出口與設備投資，但受美國經貿政策不確定性影響，製造業營業氣候測驗點由黃紅燈轉呈綠燈。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n國家發展委員會於 2026 年 11 月 27 日公布 10 月景氣對策信號綜合判斷分數為 40 分，較上月修正後分數減少 1 分，燈號續呈代表景氣熱絡的紅燈，達成連續 11 個月亮紅燈的歷史最長紀錄。9 項構成項目中，海關出口值、工業生產與機械及電機設備進口值等 8 項燈號維持不變，僅製造業營業氣候測驗點由上修值 101.79 點下滑至 98.94 點，燈號由黃紅燈轉呈綠燈。\\n「為什麼重要」\\n景氣燈號連 11 紅改寫台灣經濟史最長熱絡週期，顯示全球 AI 與高效能運算硬體建置需求仍強勁支撐台灣外貿與資本設備投資；不過製造業信心指標率先轉弱，也反映出非 AI 傳統產業對國際關稅變數的觀望氣氛升溫。\\n「來源異同」\\n中央社英文網（Focus Taiwan）、《經濟日報》與《鉅亨網》對 10 月景氣分數 40 分、連續 11 個月亮紅燈創紀錄，以及製造業營業氣候測驗點降至 98.94 點轉綠燈的數據報導完全一致。《鉅亨網》進一步列出國發會點名的美國經貿政策變化、地緣政治與主要央行貨幣政策三大風險；《經濟日報》則聚焦國發會強調 AI 實質需求依然強勁的判斷。\\n「仍不確定」\\n隨著去年下半年基期墊高，加上美國貿易政策調整及傳統產業復甦步調不一，台灣景氣燈號能否在年底前持續守住 38 分以上的紅燈門檻，仍有待後續出口與製造業信心數據驗證。\"},\"glossary\":[{\"term\":{\"en\":\"Monitoring Indicator (Economic Signal)\",\"zh-TW\":\"景氣對策信號\"},\"blurb\":{\"en\":\"A composite index published monthly by Taiwan's National Development Council using five color lights—from blue (sluggish) to red (booming)—to summarize macroeconomic conditions.\",\"zh-TW\":\"國發會每月公布的綜合景氣指標，透過藍燈、黃藍燈、綠燈、黃紅燈與紅燈五種燈號反映整體經濟冷熱狀態。\"}},{\"term\":{\"en\":\"Red Light (38–45 Points)\",\"zh-TW\":\"景氣紅燈\"},\"blurb\":{\"en\":\"The highest score bracket (38 to 45 points) on Taiwan's monitoring indicator, signaling rapid economic expansion and potential overheating.\",\"zh-TW\":\"景氣對策信號最高分數區間（38 至 45 分），代表國內經濟處於高度熱絡擴張狀態。\"}},{\"term\":{\"en\":\"Manufacturing Business Climate Index\",\"zh-TW\":\"製造業營業氣候測驗點\"},\"blurb\":{\"en\":\"A survey-based component of the monitoring indicator measuring manufacturers' assessment of current and near-term business conditions.\",\"zh-TW\":\"景氣對策信號 9 項構成項目之一，反映製造業廠商對當月及未來半年景氣動向的信心調查結果。\"}}],\"sources\":[{\"name\":\"Focus Taiwan (CNA)\",\"url\":\"https://focustaiwan.tw/business/202611270018\"},{\"name\":\"經濟日報\",\"url\":\"https://money.udn.com/money/story/10869/9906276\"},{\"name\":\"鉅亨網\",\"url\":\"https://news.cnyes.com/news/id/6673800\"}],\"imageUrl\":\"/covers/live/live-finance-058-taiwan-ndc-11th-straight-red-light.jpg\",\"imageAlt\":{\"en\":\"Container ships and cranes at a major Taiwanese port reflecting record export momentum\",\"zh-TW\":\"台灣主要商港貨櫃碼頭與起重機作業景象反映強勁出口動能\"},\"isHeadline\":true,\"isPopular\":true,\"trustScore\":89,\"trustBreakdown\":{\"crossCorroboration\":23,\"outletReputation\":22,\"recencyClarity\":23,\"sourceDiversity\":21},\"publishedAt\":\"2026-11-27T14:28:54.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":5,\"D2\":5,\"D3\":4,\"D4\":4,\"D5\":4,\"total\":22},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-finance-058-taiwan-ndc-11th-straight-red-light/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-finance-058-taiwan-ndc-11th-straight-red-light/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"sum
