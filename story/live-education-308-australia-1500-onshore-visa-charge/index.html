ures) Regulations 2026 (F2026L01607), registered on November 27, adding a AUD 1,500 per-person Onshore Application Charge on top of existing visa application fees across nine visa classes, including Temporary Graduate (subclass 485), Student (subclass 500), and onshore Partner (subclass 820/801) visas.\n\nWhy it matters: Layering AUD 1,500 per applicant onto existing fees raises single subclass 485 costs from AUD 5,750 to AUD 7,250 and subclass 500 onshore costs from AUD 2,500 to AUD 4,000, while charging AUD 1,500 for each accompanying partner or child, increasing financial barriers for international graduates and onshore families.\n\nSource differences: The official Federal Register of Legislation entry (\"Migration Amendment (Onshore Application Charge and Other Measures) Regulations 2026 - Federal Register of Legislation\") establishes the registered legislative instrument F2026L01607 and its November 28 commencement; The Koala News (\"Onshore penalty: Government makes international graduates pay\") focuses on backlash within Australia's international education sector and mentions potential policy review in April 2027; VisaEnvoy (\"$1,500 Onshore Application Charge: Who Pays - VisaEnvoy\") outlines ImmiAccount fee calculations and exemptions for Pacific Island, Timor-Leste, and ASEAN student applicants; No Worries Migration (\"Onshore application charge - No Worries Migration\") and Migration Buro (\"Onshore Application Charge: $1,500 Per Applicant From 28 Nov\") break down the exact F2026L01607 commencement dates and per-dependent fee totals.\n\nStill uncertain: Australian authorities have not published projected annual revenue figures from the surcharge or indicated whether parliamentary disallowance motions will be filed against F2026L01607.\n\nTrust label: Official confirmation — Verified directly through the registered legislative instrument F2026L01607 on Australia's Federal Register of Legislation and corroborated by education news and migration outlets."])</script><script>self.__next_f.push([1,"11:T81a,"])</script><script>self.__next_f.push([1,"「發生了什麼事」澳洲政府於 2026 年 11 月 27 日正式登記《2026 年移民修訂（境內申請費及其他措施）條例》（立法編號 F2026L01607），並於 11 月 28 日起正式施行新的「境內申請附加費」（Onshore Application Charge），凡於澳洲境內遞交臨時畢業生簽證（485 類）、學生簽證（500 類）及境內配偶（820/801 類）等共 9 類簽證者，除既有簽證費外須按申請人頭每人額外繳納 1,500 澳元。\n\n「為什麼重要」疊加現行基礎申請費後，單身 485 類主申請人總費用由 5,750 澳元提高至 7,250 澳元，境內 500 類學生簽證由 2,500 澳元增至 4,000 澳元，且隨行配偶與未成年子女亦須逐一加收 1,500 澳元，顯著推高國際畢業生留澳與家庭團聚成本。\n\n「來源異同」澳洲聯邦立法登記官網條目（「Migration Amendment (Onshore Application Charge and Other Measures) Regulations 2026 - Federal Register of Legislation」）一手載明立法文書 F2026L01607 的登記與 11 月 28 日生效資訊；國際教育媒體 The Koala News（「Onshore penalty: Government makes international graduates pay」）著重高等教育界對新政衝擊的反應及 2027 年 4 月可能檢討政策的動向；移民機構 VisaEnvoy（「$1,500 Onshore Application Charge: Who Pays - VisaEnvoy」）詳列 ImmiAccount 系統計費範例與太平洋島國、東帝汶及東協學生簽證豁免條件；No Worries Migration（「Onshore application charge - No Worries Migration」）與 Migration Buro（「Onshore Application Charge: $1,500 Per Applicant From 28 Nov」）則逐條核對 F2026L01607 條文登記與生效日期及多口之家總規費試算。\n\n「仍不確定」澳洲政府尚未公布此項附加費的年度財政增收預估，國會後續是否針對 F2026L01607 提出撤銷動議亦未明朗。\n\nTrust label: Official confirmation — 直接採信澳洲聯邦立法登記官網已登記之立法文書 F2026L01607，並與國際教育新聞及註冊移民顧問解析相互印證。"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-education-308-australia-1500-onshore-visa-charge\",\"category\":\"education\",\"title\":{\"en\":\"Australia Introduces AUD 1,500 Onshore Visa Application Charge on November 28\",\"zh-TW\":\"澳洲 11 月 28 日起開徵 1,500 澳元境內簽證申請附加費\"},\"summary\":{\"en\":\"Under the Migration Amendment (Onshore Application Charge and Other Measures) Regulations 2026 (F2026L01607), Australia implemented a new AUD 1,500 per-applicant Onshore Application Charge on November 28, 2026, raising base onshore fees for Temporary Graduate (subclass 485) applicants to AUD 7,250 and Student (subclass 500) applicants to AUD 4,000.\",\"zh-TW\":\"依據 2026 年 11 月 27 日登記、11 月 28 日生效的《2026 年移民修訂（境內申請費及其他措施）條例》
