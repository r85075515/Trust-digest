hursday, November 26, 2026, upheld a prison sentence of four years and eight months for a caregiver surnamed Hu convicted of negligent homicide following the 2022 death of a 9-month-old girl at a daycare center in New Taipei City. The high court also finalized sentences against three co-defendants from the facility: a one-year prison term for a caregiver surnamed Liu, a 10-month sentence for a staffer surnamed Lin, and a nine-month sentence for the daycare center's owner, with the latter two sentences suspended for two years.\n\nThe ruling ends a multi-year criminal prosecution into improper infant care practices and inadequate supervision at licensed private daycare centers in Taiwan. By upholding the appellate court's increased sentences for all four defendants, the Supreme Court affirmed strict criminal accountability for caregivers and operators who fail to follow safe-sleep and monitoring protocols.\n\nFocus Taiwan (Central News Agency) and the United Daily News (UDN) consistently report the Supreme Court's affirmation of the Taiwan High Court's sentencing structure across all four defendants, including the 4-year-and-8-month sentence for Hu and the two-year probations granted to Lin and the center owner.\n\nThe exact date for Hu and Liu to begin serving their prison terms and the status of separate civil compensation settlements with the victim's family were not included in the report.\n\nTrust label: Multi-source agreement — Supreme Court ruling reported consistently by Focus Taiwan (CNA) and United Daily News."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-115-taiwan-supreme-court-upholds-daycare-infant-death-sentence\",\"category\":\"taiwan\",\"title\":{\"en\":\"Taiwan Supreme Court Upholds 4-Year, 8-Month Sentence for Caregiver in Daycare Infant Death\",\"zh-TW\":\"新北托嬰中心 9 月大女嬰窒息亡 最高法院判保母 4 年 8 月徒刑定讞\"},\"summary\":{\"en\":\"Taiwan's Supreme Court upheld a 4-year-and-8-month prison sentence for a caregiver convicted of negligent homicide in the 2022 death of a 9-month-old girl at a New Taipei daycare center, finalizing sentences for four defendants. Takeaway: The final ruling concludes a four-year legal battle over infant care safety and supervision duties in private daycare facilities.\",\"zh-TW\":\"新北市某托嬰中心 2022 年發生 9 個月大女嬰死亡案，最高法院駁回上訴，維持主責保母胡姓女子過失致死罪有期徒刑 4 年 8 個月，同案另三名人員亦分別判刑定讞。一句重點結論：歷經四年審理，司法最終確定托育人員與機構負責人的刑事責任。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n針對 2022 年新北市一家托嬰中心發生 9 個月大女嬰在照護期間死亡案，台灣最高法院於 2026 年 11 月 26 日駁回上訴，維持二審對胡姓保母（Hu）依過失致死罪判處有期徒刑 4 年 8 個月的判決。同案其餘三名被告也一併定讞，包括劉姓保母（Liu）判刑 1 年、林姓人員（Lin）判刑 10 個月、托嬰中心負責人判刑 9 個月，後兩人均獲宣告緩刑 2 年。\\n\\n「為什麼重要」\\n本案歷經一、二審審理，高等法院先前認定涉案人員疏失情節重大而加重刑度，最高法院此次全面維持原判，確立托育現場照護人員與機構經營者在嬰幼兒安全防護與督導義務上的刑事責任標準。\\n\\n「來源異同」\\n中央社英文網（Focus Taiwan）與《聯合新聞網》（UDN）均完整引述最高法院裁定內容，對四名被告姓氏、刑期與緩刑條件記載一致，無衝突報導版本。\\n\\n「仍不確定」\\n未獲緩刑的胡姓與劉姓被告具體發監執行日期，以及後續民事賠償執行細節，報導中尚未進一步說明。\"},\"glossary\":[{\"term\":{\"en\":\"Negligent Homicide\",\"zh-TW\":\"過失致死罪\"},\"blurb\":{\"en\":\"A criminal offense in which a person unintentionally causes another's death through a breach of a duty of care.\",\"zh-TW\":\"行為人雖無殺人故意，但因違反客觀注意義務之疏失而導致他人死亡的刑事犯罪。\"}},{\"term\":{\"en\":\"Suspended Sentence (緩刑)\",\"zh-TW\":\"緩刑\"},\"blurb\":{\"en\":\"A court order delaying the enforcement of a prison sentence for a probationary period, after which the sentence is waived if no new offenses occur.\",\"zh-TW\":\"法院對受短期自由刑宣告者，暫緩執行刑罰並設定考驗期間，期滿未撤銷則刑之宣告失其效力。\"}},{\"term\":{\"en\":\"Duty of Care\",\"zh-TW\":\"照護注意義務\"},\"blurb\":{\"en\":\"The legal obligation of licensed childcare providers to maintain safe supervision and prevent foreseeable harm to infants.\",\"zh-TW\":\"合法托育機構與從業人員對受托嬰幼兒依法負有的安全維護、持續觀察與防止可預見危險之義務。\"}}],\"sources\":[{\"name\":\"Focus Taiwan (CNA)\",\"url\":\"https://focustaiwan.tw/society/202611270011\"},{\"name\":\"United Daily News (UDN)\",\"url\":\"https://udn.com/news/story/7321/9905312\"}],\"imageUrl\":\"/covers/live/live-taiwan-115-taiwan-supreme-court-upholds-daycare-infant-death-sentence.jpg\",\"imageAlt\":{\"en\":\"Judicial building in Taiwan representing the Supreme Court ruling\",\"zh-TW\":\"象徵最高法院定讞判決的台灣司法機構建築\"},\"isHeadline\":false,\"isPopular\":true,\"trustScore\":82,\"trustBreakdown\":{\"crossCorroboration\":19,\"outletReputation\":23,\"recencyClarity\":22,\"sourceDiversity\":18},\"publishedAt\":\"2026-11-27T16:08:57.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":5,\"D2\":5,\"D3\":4,\"D4\":3,\"D5\":4,\"total\":21},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-taiwan-115-taiwan-supreme-court-upholds-daycare-infant-death-sentence/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-taiwan-115-taiwan-supreme-court-upholds-daycare-infant-death-sentence/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}]],\"error\":null,\"digest\":\"$und
