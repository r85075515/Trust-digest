ull-year profit record that had already been broken in August. Two drivers are named in the report: this year's capital market conditions, and bank lending that lifted net interest income. The available summary does not break the total down by banking, insurance or securities, and it does not give the individual sector figures behind the combined result.\nWhy it matters\nA 77.5 percent annual increase to a record level shows the scale of the improvement across the financial industry as a whole, rather than in one sector alone. Because the nine-month total has already exceeded a full-year record broken in August, the remaining quarter starts from a historically high base. The drivers named also matter for interpretation: market conditions supporting the result may fluctuate, while lending-driven net interest income is tied to bank loan volumes, so the two sources of growth carry different kinds of sensitivity going forward.\nSources agree / disagree\nOnly CNA is listed for this item, with a single feed report, so there is no second outlet in the available material to compare the headline total or growth rate against.\nTrust label: Single source — Only one outlet is listed, so the figures rest on that single report of the regulator's statistics.\nStill uncertain\nThe available summary gives no sector-by-sector breakdown, no figure for the earlier full-year record it surpassed, and no outlook for the final quarter. Whether the pace of growth continues cannot be judged from the material provided here, and the underlying statistics should be checked in the original report for detail beyond the combined total."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-03-3-1-27\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-taiwan-03-3-1-27.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 金融三業前3季獲利破1.27兆締新猷　持續推高全年紀錄\",\"zh-TW\":\"相關封面圖：金融三業前3季獲利破1.27兆締新猷　持續推高全年紀錄\"},\"publishedAt\":\"2026-11-01T07:01:55.000Z\",\"title\":{\"en\":\"Financial Supervisory Commission figures show Taiwan's three financial sectors earning over NT$1.27 trillion\",\"zh-TW\":\"金融三業前三季獲利破 1.27 兆元刷新紀錄\"},\"summary\":{\"en\":\"Taiwan's banking, insurance and securities sectors together earned NT$1,271.544 billion in the first nine months of the year, up 77.5 percent from a year earlier, according to Financial Supervisory Commission statistics reported by CNA. The total set a record for the period and surpassed a full-year record already broken in August.\",\"zh-TW\":\"中央社（CNA）報導，金融監督管理委員會統計顯示，金融三業前九個月合計獲利達新台幣 1 兆 2715.44 億元，年增 77.5%，不僅寫下同期新高，也改寫 8 月已突破的全年獲利紀錄，受惠於資本市場行情與銀行放款推升淨利息收入。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"中央社（CNA）記者蘇思云（Su Siyun）11 月 1 日於台北報導，金融監督管理委員會統計顯示，金融三業前九個月合計獲利達新台幣 1 兆 2715.44 億元，創下同期新高。\\n發生了什麼事\\n金融三業前三季合計獲利達新台幣 1 兆 2715.44 億元，年成長 77.5%。報導指出，這個數字不僅寫下同期新高，也持續推高 8 月時已突破的全年獲利紀錄。獲利成長的兩項原因被點名：一是今年資本市場行情，二是銀行放款推升淨利息收入。現有摘要未拆分銀行、保險與證券各業別的個別獲利數字。\\n為什麼重要\\n年增 77.5% 且創紀錄，顯示改善幅度是整個金融產業層面的變化，而非單一業別的表現。前九個月合計已超越先前全年紀錄，代表第四季是在歷史高基期上展開。被點名的兩項驅動力性質也不同：資本市場行情可能波動，放款帶動的淨利息收入則與銀行放款量連動，解讀後續走勢時需分開看待。\\n來源異同\\n本則僅有中央社（CNA）一個來源，沒有第二家媒體可供對照合計獲利與成長率，因此無來源間衝突可供比較。\\n仍不確定\\n現有摘要未提供各業別明細、被超越的先前全年紀錄金額，也未給出第四季展望。成長速度能否延續，無法從現有材料判斷，細節需以原始報導與統計為準。\"},\"sources\":[{\"name\":\"中央社-產經證券\",\"url\":\"https://www.cna.com.tw/news/afe/202611010080.aspx\"}],\"disagreements\":null,\"trustScore\":59,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"中央社-產經證券\"],\"glossary\":[{\"term\":{\"en\":\"Financial Supervisory Commission\",\"zh-TW\":\"金融監督管理委員會\"},\"blurb\":{\"en\":\"The Financial Supervisory Commission is the regulator whose statistics are cited for the combined profit figure.\",\"zh-TW\":\"金融監督管理委員會是本則合計獲利數字的統計來源機關。\"}},{\"term\":{\"en\":\"CNA (Central News Agency)\",\"zh-TW\":\"中央社（CNA）\"},\"blurb\":{\"en\":\"CNA is the single outlet listed as reporting the financial sector profit figures.\",\"zh-TW\":\"中央社（CNA）是報導金融三業獲利數字的唯一來源。\"}},{\"term\":{\"en\":\"Su Siyun\",\"zh-TW\":\"蘇思云（Su Siyun）\"},\"blurb\":{\"en\":\"Su Siyun is the CNA reporter credited with the Taipei report on the profit record.\",\"zh-TW\":\"蘇思云（Su Siyun）是本則台北報導的中央社記者。\"}},{\"term\":{\"en\":\"Net interest income\",\"zh-TW\":\"淨利息收入\"},\"blurb\":{\"en\":\"Net interest income is the bank earnings component the report says was lifted by lending growth.\",\"zh-TW\":\"淨利息收入是報導所稱受銀行放款推升的獲利來源。\"}},{\"term\":{\"en\":\"Three financial sectors\",\"zh-TW\":\"金融三業\"},\"blurb\":{\"en\":\"The three financial sectors are the group of financial industries whose combined profit is reported here.\",\"zh-TW\":\"金融三業是本則合計獲利所涵蓋的金融業別總稱。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-taiwan-03-3-1-27/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-taiwan-03-3-1-27/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\
