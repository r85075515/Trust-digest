Cogent Biosciences, Inc) in combination with sunitinib for adults with advanced gastrointestinal stromal tumors (GIST) who have received prior treatment with imatinib. In the PEAK trial (413 patients), median progression-free survival was 16.5 months in the bezuclastinib plus sunitinib arm versus 9.2 months in the sunitinib arm (hazard ratio 0.50, two-sided p-value less than 0.0001), with objective response rate of 46% versus 26%.\n\nWhy it matters: The approval provides a new combination option for patients whose disease progressed on or who were intolerant to imatinib, supported by priority review, breakthrough therapy designation for the combination, and orphan drug designation for bezuclastinib. Prescribing information includes a boxed warning for hepatotoxicity and warnings and precautions for embryo-fetal toxicity.\n\nSource differences: U.S. Food and Drug Administration (\"FDA approves bezuclastinib in combination with sunitinib for advanced gastrointestinal stromal tumors\") provides the official regulatory decision, trial endpoints, dosing, and boxed warning details, while Drug Today Online summarizes the same approval for clinical news readers.\n\nStill uncertain: Full prescribing information for Ekitna is still to be posted on Drugs@FDA, and overall survival data were not mature at the time of the progression-free survival analysis.\n\nTrust label: Official confirmation - The U.S. Food and Drug Administration approval notice directly confirms the indication, PEAK trial results, and safety warnings."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-biotech-422-fda-approves-bezuclastinib-sunitinib-gist\",\"category\":\"biotech\",\"title\":{\"en\":\"FDA Approves Bezuclastinib in Combination with Sunitinib for Advanced GIST\",\"zh-TW\":\"美國 FDA 核准 bezuclastinib 合併 sunitinib 治療晚期胃腸道基質瘤\"},\"summary\":{\"en\":\"On November 24, 2026, the U.S. FDA approved bezuclastinib (Ekitna) with sunitinib for adults with advanced GIST
