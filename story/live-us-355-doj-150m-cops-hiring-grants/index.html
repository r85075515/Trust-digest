gram (CHP). The federal grants will fund the hiring of more than 1,000 law enforcement officers and deputies across state, local, and tribal police agencies.\n\nWhy it matters\nPolice departments across the United States have faced persistent recruitment and staffing shortages. The competitive federal grants directly subsidize entry-level officer salaries and benefits, helping local jurisdictions expand community policing and crime-reduction initiatives under Operation Take Back America and Project Safe Neighborhoods.\n\nSource differences\nThe U.S. Department of Justice Office of Public Affairs release (\"Department of Justice Announces Nearly $150 Million to Hire Over 1,000 Law Enforcement Officers and Deputies\") details the nationwide 2026 COPS Hiring Program awards totaling nearly 150 million USD. A regional release from the U.S. Attorney's Office for the Southern District of Georgia (\"Department of Justice Announces Nearly $150 Million to Hire Over 1,000 Law Enforcement Officers and Deputies\") links the funding to Operation Take Back America and Project Safe Neighborhoods.\n\nStill uncertain\nThe full state-by-state breakdown of individual agency awards and the timeline for recipient departments to complete academy recruitment and deployment were not included in the summary announcements.\n\nTrust label: Official confirmation — Confirmed by U.S. Department of Justice press releases from the Office of Public Affairs and U.S. Attorney's Office."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-us-355-doj-150m-cops-hiring-grants\",\"category\":\"us\",\"title\":{\"en\":\"U.S. Justice Department Awards Nearly 150 Million USD to Hire Over 1,000 Law Enforcement Officers\",\"zh-TW\":\"美國司法部撥款近 1.5 億美元 資助全美增聘逾千名執法人員\"},\"summary\":{\"en\":\"The U.S. Department of Justice announced nearly 150 million USD in 2026 COPS Hiring Program grants through its Office of Community Oriented Policing Services to fund the hiring of more than
