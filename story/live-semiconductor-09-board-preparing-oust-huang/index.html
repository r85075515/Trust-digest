oard is preparing to act against its 63-year-old co-founder days after he acknowledged being unfaithful and while the board's own Wachtell-led investigation is still running. Reuters relayed the Journal's report the same afternoon, noting it could not independently verify it and that Nvidia had not responded. The market treated the report as credible and severe: Nvidia, which had already slipped more than 3% after hours on the Times' Powell story earlier in the evening, extended its after-hours decline to about 8% after the Journal's report. The Journal's markets coverage added that prediction-market odds on Polymarket for Huang resigning or being removed by year-end had risen to 77%. As of publication, neither Nvidia nor Huang has commented on the ouster report.\nWhy it matters\nIf the board moves, it would be removing the founder who built Nvidia into the central supplier of the AI era - a man with no obvious successor, dozens of direct reports and a 3.6% stake, six days before Nov 17 earnings and a week before he is due to give a closed-door briefing to three House committees. It would also mean the board reached its verdict before its own 'thorough and independent' investigation reported, which would tell investors the directors concluded the conduct - two affairs, one a textbook conflict with a direct report, the other a national-security exposure - was disqualifying regardless of what the probe finds on espionage. If the board instead keeps him, it must defend that call against a shareholder class action, a Senate resignation demand and a public record it can no longer describe as a one-off lapse. The takeaway: the question has moved from whether Huang survives the investigation to whether he survives the week.\nSources agree / disagree\nAll reporting traces to the Journal as origin; Reuters explicitly flags that it has not independently verified the report and that Nvidia has not responded. Other outlets (the New York Post, Taiwanese and Hong Kong media) relay the same Journal account. The undisputed scaffolding: the board probe exists, the Powell report was published hours earlier, and the stock's after-hours fall is a matter of market record. Nothing has been announced by Nvidia, and a board 'preparing to meet' is not a decision - preparations can change. Trust label: Single-origin report - Wall Street Journal, people familiar with the matter; relayed by Reuters as unverified, no response from Nvidia or Huang.\nStill uncertain\nWhether the board is meeting today, what exactly it will decide, and whether Huang resigns, is removed, or survives are all unknown. The Wachtell investigation's status, any succession plan, and any statement from Nvidia or Huang would materially update this card."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"adult\":false,\"body\":{\"en\":\"$10\",\"zh-TW\":\"［未證實·單一原始來源］《華爾街日報》週三（11 月 11 日）報導，輝達董事會正準備罷免執行長黃仁勳，導火線是兩段婚外情——他已坦承的、與疑似中國情報人員黃樂的關係，以及《紐約時報》剛揭露的與直屬部屬金伯莉·鮑威爾的關係——董事會最快今天就開會決定他的去留。黃仁勳尚未被解職，也沒有任何決定公布。消息傳出後，輝達股價盤後跌約 8%。\\n發生了什麼事\\n《華爾街日報》引述知情人士指出，董事會準備對這位 63 歲的共同創辦人採取行動——此時距他坦承不忠才幾天，董事會自家委託 Wachtell 律所進行的調查都還在跑。路透社同日下午轉載《華爾街日報》的報導，並註明無法獨立驗證、輝達尚未回應。市場把這則報導當真、而且當重：輝達當晚稍早已因《紐時》的鮑威爾報導盤後跌逾 3%，《華爾街日報》消息出刊後盤後跌幅擴大到約 8%。《華爾街日報》的市場版還指出，Polymarket 上「黃仁勳年底前辭職或被免職」的機率已升至 77%。截至本卡發布，輝達與黃仁勳都未就罷免報導發表回應。\\n為什麼重要\\n如果董事會真的動手，撤換的是把輝達打造成 AI 時代核心供應商的創辦人本人：他沒有明顯接班人、直接部屬多達數十人、持股約 3.6%，而 11 月 17 日就是財報日、一週後他還要向眾院三個委員會作閉門簡報。這也意味董事會會在自家「徹底且獨立」的調查交卷之前就先下判決——等於告訴投資人：兩段外遇（一段是與直屬部屬的教科書級利益衝突、一段是國安曝險）光是行為本身就已構成去職理由，不必等間諜問題的調查結論。若董事會選擇留人，則必須面對股東集體訴訟、參議院的辭職要求，以及再也無法稱為「一時失足」的公開紀錄。結論是：問題已經從「黃仁勳能不能撐過調查」，變成「能不能撐過這一週」。\\n來源異同\\n所有報導都源自《華爾街日報》單一原始來源；路透社明言未獨立驗證、輝達未回應。《紐約郵報》與台港媒體轉載的也是同一份《華爾街日報》說法。無爭議的骨架一致：董事會調查存在、鮑威爾報導在數小時前才刊出、股價盤後跌幅是市場紀錄。輝達尚未宣布任何事，「董事會準備開會」不等於已有決定，準備也可能生變。信任標籤：單一原始來源——《華爾街日報》引述知情人士；路透社以「未驗證」轉載，輝達與黃仁勳均未回應。\\n仍不確定\\n董事會是否今天開會、會做出什麼決定、黃仁勳是辭職、被免職還是留任，全都未明。Wachtell 調查的進度、任何接班安排，以及輝達或黃仁勳的聲明，都會實質更新本卡。\"},\"category\":\"semiconductor\",\"disagreements\":null,\"glossary\":[{\"blurb\":{\"en\":\"Removal of a chief executive by the board before their term or contract ends; Nvidia's bylaws allow its directors to remove any officer at any time, with or without cause, by majority vote.\",\"zh-TW\":\"董事會在任期或合約屆滿前解除執行長職務；輝達章程規定，董事得以多數決隨時解除任何高階主管職務，不論有無正當理由。\"},\"term\":{\"en\":\"Ouster\",\"zh-TW\":\"罷免（ouster）\"}},{\"blurb\":{\"en\":\"Trading after the regular market close; Nvidia fell about 8% in this session on Nov 11 as the Powell report and then the WSJ ouster report landed.\",\"zh-TW\":\"常規交易時段結束後的交易；11 月 11 日輝達在盤後時段先後受鮑威爾報導與 WSJ 罷免報導衝擊，跌約 8%。\"},\"term\":{\"en\":\"After-hours trading\",\"zh-TW\":\"盤後交易（after-hours trading）\"}},{\"blurb\":{\"en\":\"The plan for who takes over when a leader leaves; Reuters notes Huang, Nvidia's co-founder, has no obvious successor and dozens of direct reports.\",\"zh-TW\":\"領導人離任後由誰接手的安排；路透指出，輝達共同創辦人黃仁勳沒有明顯接班人，且直接部屬多達數十人。\"},\"term\":{\"en\":\"Succession\",\"zh-TW\":\"接班安排（succession）\"}}],\"id\":\"live-semiconductor-09-board-preparing-oust-huang\",\"imageAlt\":{\"en\":\"\",\"zh-TW\":\"\"},\"imageUrl\":\"\",\"isHeadline\":true,\"isPopular\":true,\"publishedAt\":\"2026-11-11T23:34:33.000Z\",\"sources\":[{\"name\":\"Reuters (WSJ report relay)\",\"url\":\"https://www.reuters.com/technology/nvidia-is-preparing-oust-ceo-jensen-huang-wsj-reports-2026-11-11/\"},{\"name\":\"Reuters (board credibility analysis)\",\"url\":\"https://www.reuters.com/world/china/nvidias-clubby-board-faces-sticky-honey-pot-test-2026-11-10/\"}],\"summary\":{\"en\":\"[Unverified - single origin] The Wall Street Journal reported Nov 11 that Nvidia's board is preparing to oust CEO Jensen Huang over his two affairs and may meet as soon as Wednesday to decide his future. Reuters relayed the report as unverified; Nvidia has not responded. Shares fell about 8% after hours. Huang, Nvidia's co-founder, has no obvious successor.\",\"zh-TW\":\"［未證實·單一原始來源］《華爾街日報》11 日報導，輝達董事會因黃仁勳的兩段婚外情，正準備罷免這位共同創辦人執行長，最快今天開會決定去留。路透社轉載時註明未獨立驗證，輝達尚未回應。股價盤後跌約 8%。黃仁勳是輝達共同創辦人，且沒有明顯接班人。\"},\"tags\":[\"semiconductor\",\"live-ingest\",\"breaking\",\"nvidia\",\"jensen-huang\",\"board\",\"ouster\"],\"title\":{\"en\":\"Nvidia Board Preparing to Oust Jensen Huang, WSJ Reports\",\"zh-TW\":\"WSJ：輝達董事會準備罷免黃仁勳，最快今天開會定去留\"},\"trustBreakdown\":{\"crossCorroboration\":16,\"outletReputation\":20,\"recencyClarity\":20,\"sourceDiversity\":14},\"trustScore\":70}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-semiconductor-09-board-preparing-oust-huang/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-semiconductor-09-board-preparing-oust-huang/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"d:\"$8:metadata\"\n"])</script></body></html>
