er: service members must refuse illegal orders,' after President Donald Trump accused the lawmakers of sedition and called for them to be arrested.\nWhat happened\nIn remarks reported by Cronkite News, Kelly and other Democrats stood by the year-old video, arguing that refusing an illegal order is required by law. Trump had responded to the video by accusing the lawmakers of sedition, with the feed summary reporting that he called for them to be arrested, hanged, and executed. The same feed cluster separately carries Trump's Saturday statement that he would work with Democrats to cap credit card interest and fees, with PBS NewsHour reporting the cap at 10 percent.\nWhy it matters\nThe dispute is about the limits of military obedience in public, not a courtroom: Kelly is defending a legal duty as a political message, while Trump's sedition accusation raises the stakes for lawmakers who address troops directly. The credit-card proposal, bundled into the same feed, shows Trump courting Democratic cooperation on consumer costs at the same time.\nSources agree-disagree\nThe three outlets in this cluster cover two different stories, not one: Cronkite News reports the Kelly anniversary, while PBS NewsHour and Axios report Trump's credit-card remarks. The feed summary also cites a New York Federal Reserve survey putting the median credit card rate at roughly 22.2 percent, a different figure from the proposed 10 percent cap, not a conflicting one. Trust label: Bundled stories. Two separate stories were grouped into one card, so each should be judged on its own reporting.\nStill uncertain\nThe feed summaries do not give the full wording of Trump's sedition remarks, the date or setting of Kelly's latest comments, or any legislative text for the credit-card cap. The 10 percent cap remains a stated intention, with no bill or timetable in the summaries, and the banking industry's objection — that caps could deny credit to millions — is reported without a named source."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-us-01-a-year-after-trump-sedit\",\"category\":\"us\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-us-01-a-year-after-trump-sedit.jpg\",\"imageAlt\":{\"en\":\"Cover related to: A year after Trump sedition accusation, Kelly and other Democrats stand by illegal-orders warning\",\"zh-TW\":\"相關封面圖：在川普煽動叛亂指控一年後，凱利和其他民主黨人堅持非法命令警告\"},\"publishedAt\":\"2026-11-21T21:20:34.000Z\",\"title\":{\"en\":\"Mark Kelly Stands by Illegal-Orders Warning a Year After Trump's Sedition Accusation\",\"zh-TW\":\"川普煽動叛亂指控一年後，馬克·凱利（Mark Kelly）堅持非法命令警告\"},\"summary\":{\"en\":\"A year after six Democrats urged troops to refuse illegal orders, Senator Mark Kelly says the warning stands, calling the video a simple reminder of the law after President Donald Trump accused the lawmakers of sedition. The same feed bundle carries a separate Trump credit-card cap proposal. Watch whether the cap advances and whether the warning draws a response.\",\"zh-TW\":\"六名民主黨國會議員呼籲軍人拒絕非法命令一年後，亞利桑那州參議員馬克·凱利（Mark Kelly）表示警告依然成立，稱影片只是提醒軍人依法行事；唐納·川普（Donald Trump）總統當時指控議員煽動叛亂，要求逮捕他們。同批另有一則川普主張信用卡利率上限的獨立消息。後續看利率上限能否推進。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"六名民主黨國會議員呼籲軍人拒絕非法命令一年後，亞利桑那州參議員馬克·凱利（Mark Kelly）表示警告依然成立。凱利說，這段影片只是簡單提醒：軍人必須拒絕非法命令；唐納·川普（Donald Trump）總統則指控議員煽動叛亂，要求逮捕他們。\\n發生了什麼事\\n凱利與其他民主黨人在克朗凱特新聞（Cronkite News）報導的談話中，堅持一年前那段影片的立場，主張拒絕非法命令是法律要求。川普當時回應指控議員煽動叛亂，摘要稱他要求逮捕、絞死並處決議員。同批另有一則獨立消息：川普星期六表示願與民主黨合作限制信用卡利息與手續費，公共電視新聞一小時（PBS NewsHour）報導上限為 10%。\\n為什麼重要\\n爭議不在法庭，而在軍人服從的界線能否公開討論：凱利把法律義務當成政治訊息來辯護，川普的煽動叛亂指控則拉高了議員直接對軍人喊話的代價。同批併入的信用卡提案顯示，川普同時在消費者成本議題上爭取民主黨合作。\\n來源異同\\n本批三家來源報的是兩則不同的新聞，不是同一則：克朗凱特新聞（Cronkite News）報導凱利週年談話，公共電視新聞一小時（PBS NewsHour）與 Axios 報導川普的信用卡談話。摘要另引紐約聯邦準備銀行（Federal Reserve Bank of New York）8 月調查，信用卡利率中位數約 22.2%，這與提議的 10% 上限是不同數字，不是互相矛盾。信任標籤：多則併合。\\n仍不確定\\n摘要沒有川普煽動叛亂言論的完整措辭、凱利最新談話的日期與場合，也沒有信用卡上限的法案文本。10% 上限目前只是表態，摘要中沒有法案或時程；銀行業主張上限可能讓數百萬人貸不到款，報導未具名消息來源。\"},\"sources\":[{\"name\":\"PBS NewsHour\",\"url\":\"https://www.pbs.org/newshour/politics/trump-vows-to-work-with-democrats-to-cap-credit-card-interest-rates-at-10\"},{\"name\":\"Axios\",\"url\":\"https://www.axios.com/2026/11/21/trump-credit-cards-rates-warren\"},{\"name\":\"Cronkite News\",\"url\":\"https://cronkitenews.azpbs.org/2026/11/19/kelly-trump-illegal-orders/\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":19,\"outletReputation\":10,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"us\",\"live-ingest\",\"pbs-newshour\",\"axios\",\"cronkite-news\"],\"glossary\":[{\"term\":{\"en\":\"Mark Kelly\",\"zh-TW\":\"馬克·凱利\"},\"blurb\":{\"en\":\"Arizona Democratic senator defending the illegal-orders video.\",\"zh-TW\":\"為非法命令影片辯護的亞利桑那州民主黨參議員。\"}},{\"term\":{\"en\":\"Donald Trump\",\"zh-TW\":\"唐納·川普\"},\"blurb\":{\"en\":\"US president who accused the lawmakers of sedition and proposed the card-rate cap.\",\"zh-TW\":\"指控議員煽動叛亂、提出信用卡利率上限的美國總統。\"}},{\"term\":{\"en\":\"Cronkite News\",\"zh-TW\":\"克朗凱特新聞\"},\"blurb\":{\"en\":\"Arizona news outlet that reported Kelly's anniversary remarks.\",\"zh-TW\":\"報導凱利週年談話的亞利桑那新聞媒體。\"}},{\"term\":{\"en\":\"PBS NewsHour\",\"zh-TW\":\"公共電視新聞一小時\"},\"blurb\":{\"en\":\"US public television news program that reported the 10 percent cap proposal.\",\"zh-TW\":\"報導 10% 上限提案的美國公共電視新聞節目。\"}},{\"term\":{\"en\":\"Axios\",\"zh-TW\":\"Axios\"},\"blurb\":{\"en\":\"US news outlet that reported Trump's credit-card remarks.\",\"zh-TW\":\"報導川普信用卡談話的美國新聞媒體。\"}},{\"term\":{\"en\":\"Federal Reserve Bank of New York\",\"zh-TW\":\"紐約聯邦準備銀行\"},\"blurb\":{\"en\":\"Regional Federal Reserve bank whose August survey put the median card rate at 22.2 percent.\",\"zh-TW\":\"8 月調查顯示信用卡利率中位數約 22.2% 的紐約聯邦準備銀行。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__nex
