ber 26, 2026, the publication of a peer-reviewed study in Nature Machine Intelligence establishing a scaling law for biological AI centered on measurement noise. Co-led by Allon Klein (Allon Klein) of Harvard Medical School and Gokul Gowri (Gokul Gowri) of MIT alongside co-author Dan Raviv (Dan Raviv), the research evaluated how single-cell transcriptomic and protein AI models scale. The authors found that current single-cell technologies often capture fewer than half of the RNA molecules inside a cell, creating a sensitivity ceiling that larger cell counts alone cannot overcome, and observed that the variational autoencoder scVI captured more biological information than the transformer-based Geneformer model across tested tasks.\n\nWhy it matters\nWhile language and protein AI models have improved predictably by scaling dataset volume and parameter counts, single-cell drug discovery models face fundamentally different physical noise limits. The findings give biopharma researchers an empirical framework to allocate R\u0026D budgets toward higher-sensitivity sequencing assays rather than merely profiling larger numbers of noisy cells.\n\nSource differences\nTech Times' independent report \"RNA Counted Per Cell May Limit Single-Cell AI Models More Than Cell Count, Study Finds\" explains how RNA capture efficiency per cell constrains single-cell AI performance relative to simply increasing cell counts. Business Wire's release \"Cellular Intelligence Announces Nature Machine Intelligence Publication Establishing a New Scaling Law for Biological AI\" provides the corporate announcement of the study, while Newsfilter's syndication \"Cellular Intelligence Announces Nature Machine Intelligence Publication Establishing a New Scaling Law for Biological AI\" carries the same release text.\n\nStill uncertain\nIndependent replication of the scaling exponents across additional cell foundation models and experimental platforms beyond the reported findings remains to be verified. Trust label: Multi-source agreement — Tech Times provides independent reporting alongside two syndicated corporate release entries from Business Wire and Newsfilter."])</script><script>self.__next_f.push([1,"11:T7d0,"])</script><script>self.__next_f.push([1,"「發生了什麼事」\n生技公司 Cellular Intelligence 於 2026 年 11 月 26 日宣布，其同儕審查研究已刊登於《自然機器智能》（Nature Machine Intelligence），建立以量測雜訊為核心的生物 AI 尺度定律。該論文由哈佛醫學院克萊因（Allon Klein）與麻省理工學院高里（Gokul Gowri）共同領導，並由拉維夫（Dan Raviv）共同署名。研究發現，現有單細胞量測技術通常僅能捕捉細胞內不到一半的 RNA 分子，形成單靠擴大細胞樣本數無法突破的靈敏度上限；同時在受測任務中，變分自編碼器架構 scVI 捕捉到的生物資訊量高於基於 Transformer 的 Geneformer 模型。\n\n「為什麼重要」\n大型語言模型與蛋白質序列 AI 過去可透過擴充資料量與參數量穩定提升效能，但單細胞轉錄體藥物研發模型受制於截然不同的物理量測誤差。這項研究成果為生技製藥團隊提供量化決策依據，顯示投資於更高靈敏度的定序技術，比盲目累積低品質大規模單細胞數據更具效益。\n\n「來源異同」\nTech Times 獨立報導「RNA Counted Per Cell May Limit Single-Cell AI Models More Than Cell Count, Study Finds」說明單一細胞計數的 RNA 捕捉效率如何限制單細胞 AI 表現，並對比單純增加細胞數量的影響。Business Wire 發布的「Cellular Intelligence Announces Nature Machine Intelligence Publication Establishing a New Scaling Law for Biological AI」為公司官方發布稿，Newsfilter 則以同題「Cellular Intelligence Announces Nature Machine Intelligence Publication Establishing a New Scaling Law for Biological AI」轉載該發布內容。\n\n「仍不確定」\n該尺度定律在更多細胞基礎模型與不同實驗平台上的跨體系可重複性，仍有待後續獨立研究進一步驗證。Trust label: Multi-source agreement — 包含 Tech Times 獨立報導，以及同源自公司新聞稿的 Business Wire 與 Newsfilter 頁面。"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-biotech-362-cellular-intelligence-biological-ai-scaling-law\",\"category\":\"biotech\",\"title\":{\"en\":\"Cellular Intelligence Publishes Biological AI Scaling Law Study in Nature Machine Intelligence\",\"zh-TW\":\"Cellular Intelligence 於《自然機器智能》發表生物 AI 新尺度定律研究\"},\"summary\":{\"en\":\"Cellular Intelligence announced on November 26, 2026, a Nature Machine Intelligence study showing that single-cell AI accuracy is constrained more by RNA measurement sensitivity than dataset size.\",\"zh-TW\":\"生技公司 Cellular Intelligence 於 2026 年 11 月 26 日宣布在《自然機器智能》發表研究，建立生物 AI 新尺度定律，指出單細胞 AI 模型效能受限於現有量測技術僅能捕捉不到一半細胞內 RNA 分子的靈敏度瓶頸，提升量測品質比單純擴大細胞樣本數更關鍵。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"$11\"},\"glossary\":[{\"term\":{\"en\":\"Scaling law\",\"zh-TW\":\"尺度定律\"},\"blurb\":{\"en\":\"An empirical relationship describing how an AI model's performance changes as dataset size, model parameters, compute, or measurement quality scale.\",\"zh-TW\":\"描述 AI 模型效能如何隨資料規模、參數量、算力或量測品質變化而規律演進的經驗法則。\"}},{\"term\":{\"en\":\"Single-cell transcriptomics\",\"zh-TW\":\"單細胞轉錄體學\"},\"blurb\":{\"en\":\"The measurement of messenger RNA levels within individual cells to reveal cell-specific gene expression and disease states.\",\"zh-TW\":\"量測單一細胞內信使 RNA 表現量的技術，用以解析個別細胞的基因活性與疾病狀態。\"}},{\"term\":{\"en\":\"Variational autoencoder (scVI)\",\"zh-TW\":\"變分自編碼器（scVI）\"},\"blurb\":{\"en\":\"A probabilistic deep-learning architecture widely used to model noisy single-cell gene expression data.\",\"zh-TW\":\"廣泛用於建模高雜訊單細胞基因表現數據的機率式深度學習神經網路架構。\"}}],\"sources\":[{\"name\":\"Business Wire\",\"url\":\"https://www.businesswire.com/news/home/20261126210867/en/Cellular-Intelligence-Announces-Nature-Machine-Intelligence-Publication-Establishing-a-New-Scaling-Law-for-Biological-AI\"},{\"name\":\"Tech Times\",\"url\":\"https://www.techtimes.com/articles/331620/20261126/rna-counted-per-cell-may-limit-single-cell-ai-models-more-cell-count-study-finds.htm\"},{\"name\":\"Newsfilter\",\"url\":\"https://newsfilter.io/articles/cellular-intelligence-announces-nature-machine-intelligence-publication-735ceb1aa2d25804ae7fb1e8a68e6599\"}],\"imageUrl\":\"/covers/live/live-biotech-362-cellular-intelligence-biological-ai-scaling-law.png\",\"imageAlt\":{\"en\":\"Cellular Intelligence Publishes Biological AI Scaling Law Study in Nature Machine Intelligence\",\"zh-TW\":\"Cellular Intelligence 於《自然機器智能》發表生物 AI 新尺度定律研究\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":84,\"trustBreakdown\":{\"crossCorroboration\":22,\"outletReputation\":22,\"recencyClarity\":23,\"sourceDiversity\":17},\"publishedAt\":\"2
