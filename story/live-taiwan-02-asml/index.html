strictions on the Dutch semiconductor equipment maker selling to China. Shi Zhuoma argued the curbs would hurt ASML and other European companies. The feed item did not describe the bill's current status or how the Netherlands plans to resist it.\n\nWhy it matters\nASML is the world's key supplier of advanced chipmaking equipment, so broader US curbs would hit its China sales directly. The Dutch pushback turns what looked like a US export-control decision into a friction point between transatlantic allies, with European industry caught in the middle. For buyers of ASML tools, the dispute adds a new layer of political risk to purchase planning.\n\nSources agree / disagree\nOnly one outlet, CNA, has covered the remarks so far, so there is nothing to cross-check against. No numeric or name conflicts appear in the feed item.\n\nStill uncertain\nThe feed gives no details on the bill's text, its timetable, the US response, or the specific form the Dutch resistance would take.\n\nTrust label: Single source — one outlet, no independent corroboration yet."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-02-asml\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-taiwan-02-asml.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 美擴大對中晶片設備禁令恐重創ASML　荷蘭表態抵制\",\"zh-TW\":\"相關封面圖：美擴大對中晶片設備禁令恐重創ASML　荷蘭表態抵制\"},\"publishedAt\":\"2026-11-27T03:24:46.000Z\",\"title\":{\"en\":\"ASML in the Crosshairs as the Netherlands Vows to Resist Tighter US Chip-Equipment Curbs on China\",\"zh-TW\":\"艾司摩爾（ASML）銷中限制：荷蘭表態抵制美國加強管制法案\"},\"summary\":{\"en\":\"[Unconfirmed · Single source] Dutch Trade Minister Shi Zhuoma said on November 26 that the Netherlands will resist a US bill tightening limits on ASML equipment sales to China, arguing the curbs would hurt ASML and other European firms. The remarks were reported by CNA from Amsterdam.\",\"zh-TW\":\"［未證實·單一來源］荷蘭貿易部長史卓瑪（Shi Zhuoma）今天表示，荷蘭將抵制美國加強限制艾司摩爾（ASML）銷售設備至中國的法案，理由是管制將傷害艾司摩爾及其他歐洲企業。發言出自中央社（CNA）11 月 26 日阿姆斯特丹綜合外電報導。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"荷蘭貿易部長史卓瑪今天表示，荷蘭將抵制美國加強限制艾司摩爾（ASML）對中國銷售設備的法案。\\n\\n發生了什麼事\\n中央社（CNA）11 月 26 日阿姆斯特丹綜合外電報導，史卓瑪表示荷蘭將抵制美國相關法案。法案內容是加強限制荷蘭半導體設備大廠艾司摩爾（ASML）銷售設備至中國。史卓瑪的理由是，這些限制將傷害艾司摩爾及其他歐洲企業。報導未說明法案目前進度，也未說明荷蘭打算以何種方式抵制。\\n\\n為什麼重要\\n艾司摩爾是全球先進晶片設備的關鍵供應商，美國管制一旦擴大，直接衝擊它的對中銷售。荷蘭公開表態抵制，代表管制不再只是美國單方面的出口政策，而是演變成跨大西洋盟友之間的摩擦。\\n\\n來源異同\\n目前僅中央社（CNA）一家報導，無其他來源可比對。無數字或人名衝突。\\n\\n仍不確定\\n法案的具體條文、表決時程、美國方面的回應，以及荷蘭抵制的具體手段，來源都沒有提供。\\n\\n信任標籤：僅 1 源——單一媒體報導，尚無其他來源印證。\"},\"sources\":[{\"name\":\"中央社-國際\",\"url\":\"https://www.cna.com.tw/news/aopl/202611270055.aspx\"}],\"disagreements\":null,\"trustScore\":59,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"中央社-國際\"],\"glossary\":[{\"blurb\":{\"en\":\"The Dutch company that makes advanced chipmaking equipment.\",\"zh-TW\":\"荷蘭半導體設備大廠，生產先進晶片製造設備。\"},\"term\":{\"en\":\"ASML\",\"zh-TW\":\"艾司摩爾\"}},{\"blurb\":{\"en\":\"The Netherlands' trade minister.\",\"zh-TW\":\"荷蘭貿易部長。\"},\"term\":{\"en\":\"Shi Zhuoma\",\"zh-TW\":\"史卓瑪\"}},{\"blurb\":{\"en\":\"Taiwan's national news agency and the sole source for this story.\",\"zh-TW\":\"台灣的國家通訊社，本篇報導的唯一來源。\"},\"term\":{\"en\":\"CNA\",\"zh-TW\":\"中央社\"}},{\"blurb\":{\"en\":\"US measures restricting sales of advanced chipmaking equipment to China.\",\"zh-TW\":\"美國限制先進晶片製造設備銷往中國的措施。\"},\"term\":{\"en\":\"US chip-equipment curbs on China\",\"zh-TW\":\"美國對中晶片設備管制\"}},{\"blurb\":{\"en\":\"The European country where ASML is headquartered.\",\"zh-TW\":\"歐洲國家，艾司摩爾總部所在地。\"},\"term\":{\"en\":\"Netherlands\",\"zh-TW\":\"荷蘭\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"chil
