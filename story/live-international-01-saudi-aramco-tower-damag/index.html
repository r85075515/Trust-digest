ssage. Striking the financial district's flagship tower puts the war's reach into Riyadh's commercial core, and the choice of Aramco, the kingdom's economic crown jewel, turns a military strike into a signal aimed at markets as much as at the military. Sources agree / disagree BBC, The New York Times, and the Financial Times all report the same strike with consistent facts. Trust label: Multi-source agreement — three established outlets agree on the core claims. Still uncertain The snippets give no extent of the damage, no count of projectiles, and no details of the Houthi claim or the air-defense response. Whether operations inside the tower were disrupted is also not stated. Verify the damage assessment in the full reporting."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-01-saudi-aramco-tower-damag\",\"category\":\"international\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-international-01-saudi-aramco-tower-damag.png\",\"imageAlt\":{\"en\":\"The Saudi Aramco Tower in Riyadh's financial district after the strike\",\"zh-TW\":\"利雅德金融區的沙烏地阿美大樓在攻擊後受損\"},\"publishedAt\":\"2026-11-08T21:37:36.000Z\",\"title\":{\"en\":\"Houthi Strike Damages Saudi Aramco Tower in Riyadh, No Injuries Reported\",\"zh-TW\":\"葉門胡塞武裝攻擊利雅德，沙烏地阿美（Saudi Aramco）大樓受損、無人受傷\"},\"summary\":{\"en\":\"Yemen's Houthis struck Riyadh, damaging the Saudi Aramco Tower in the King Abdullah Financial District, Saudi authorities said, with falling shrapnel hitting the building and no one hurt. Footage authenticated by BBC Verify shows damage to the tower in the capital's central financial district.\",\"zh-TW\":\"葉門胡塞武裝攻擊利雅德，沙烏地阿美（Saudi Aramco）大樓在阿卜杜拉國王金融區遭掉落彈片擊中受損，沙烏地當局表示無人受傷。BBC 查核團隊認證的影像顯示大樓受損。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"葉門胡塞武裝攻擊利雅德，沙烏地阿美（Saudi Aramco）大樓在阿卜杜拉國王金融區遭掉落彈片擊中受損，沙烏地當局表示無人受傷。\\n發生了什麼事\\nBBC 查核團隊認證的影像顯示，首都中央金融區的大樓受損。這棟大樓是沙烏地阿拉伯國有石油巨頭的辦公地點，金融區也是胡塞武裝鎖定的最受矚目目標之一。沙烏地當局表示，掉落的彈片擊中大樓後無人受傷。攻擊發生在週日。\\n為什麼重要\\n判斷在於：目標本身就是訊息。打中金融區的地標大樓，等於把戰火伸進利雅德的商業核心，選上阿美這塊沙烏地經濟王冠上的明珠，軍事打擊同時也是做給市場看的訊號。\\n來源異同\\nBBC、紐約時報與金融時報（Financial Times）三家報導同一場攻擊，核心事實一致。信任標籤：N源一致——三家主流媒體對核心事實的報導一致。\\n仍不確定\\n摘要沒有說明受損程度、發射物數量，也沒有胡塞方面的說法與防空攔截細節。大樓內的運作是否受影響也未說明，損傷評估請查閱完整報導。\"},\"sources\":[{\"name\":\"BBC World\",\"url\":\"https://www.bbc.co.uk/news/articles/c6ly3mjx958eo?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"NYT World\",\"url\":\"https://www.nytimes.com/2026/11/08/world/middleeast/saudi-aramco-tower-riyadh-hit.html\"},{\"name\":\"Financial Times Markets\",\"url\":\"https://www.ft.com/content/eeadc13e-b915-4591-ab85-54db81030996?syn-25a6b1a6=1\"}],\"disagreements\":null,\"trustScore\":88,\"trustBreakdown\":{\"sourceDiversity\":20,\"outletReputation\":21,\"crossCorroboration\":22,\"recencyClarity\":25},\"tags\":[\"international\",\"live-ingest\",\"bbc-world\",\"nyt-world\",\"financial-times-markets\"],\"glossary\":[{\"term\":{\"en\":\"Saudi Aramco\",\"zh-TW\":\"沙烏地阿美\"},\"blurb\":{\"en\":\"Saudi Arabia's state-owned oil company, whose Riyadh tower was hit.\",\"zh-TW\":\"沙烏地阿拉伯國有石油公司，其利雅德大樓遭攻擊。\"}},{\"term\":{\"en\":\"Houthis\",\"zh-TW\":\"胡塞武裝\"},\"blurb\":{\"en\":\"Yemen-based armed group that launched the strike on Riyadh.\",\"zh-TW\":\"發動利雅德攻擊的葉門武裝組織。\"}},{\"term\":{\"en\":\"King Abdullah Financial District\",\"zh-TW\":\"阿卜杜拉國王金融區\"},\"blurb\":{\"en\":\"Riyadh's central financial district, where the damaged tower stands.\",\"zh-TW\":\"受損大樓所在的利雅德中央金融區。\"}},{\"term\":{\"en\":\"BBC Verify\",\"zh-TW\":\"BBC 查核團隊\"},\"blurb\":{\"en\":\"BBC unit that authenticated footage showing damage to the tower.\",\"zh-TW\":\"認證大樓受損影像的 BBC 查核單位。\"}},{\"term\":{\"en\":\"Riyadh\",\"zh-TW\":\"利雅德\"},\"blurb\":{\"en\":\"Capital of Saudi Arabia, targeted in the Houthi strike.\",\"zh-TW\":\"遭胡塞武裝攻擊的沙烏地阿拉伯首都。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scal
