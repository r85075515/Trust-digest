November 25—reported locally across Arizona on November 26—that officers at the San Luis Port of Entry intercepted over 130 pounds of fentanyl and methamphetamine during a primary and secondary inspection on November 17, 2026. A CBP canine alerted officers to a white 2005 Ford Escort bearing California license plates driven by an 18-year-old U.S. citizen woman. Searching the vehicle, officers uncovered more than 184 packages of fentanyl and methamphetamine, seized both the narcotics and the vehicle, and turned the driver over to Homeland Security Investigations (HSI) for federal prosecution.\n\nWhy it matters\nThe San Luis crossing in Yuma County remains one of the busiest southwest border corridors for synthetic opioid and stimulant interdiction. Seizing more than 130 pounds of fentanyl and methamphetamine in a single passenger vehicle underscores how transnational trafficking networks continue recruiting young U.S. citizen drivers to move large narcotic loads across ports of entry.\n\nSource differences\nThe official CBP release—titled \"CBP stops more than 130 pounds of fentanyl and methamphetamine at San Luis Port of Entry\"—details the November 17 inspection, the 184 packages exceeding 130 pounds, and the handover to HSI. FOX 10 Phoenix covered the announcement under \"Teen US citizen arrested in Arizona after Border Patrol finds over 130 pounds of fentanyl, meth\", adding that the vehicle was a white 2005 Ford Escort with California plates and noting that authorities have not yet released the suspect's name or home state. Hoodline published \"San Luis Border Bust Nets 130 Pounds of Drugs, 18-Year-Old Driver Held\", summarizing the same CBP seizure facts.\n\nStill uncertain\nFederal authorities have not publicly identified the 18-year-old suspect, disclosed her state of residence, or unsealed the specific federal criminal charges filed against her.\n\nTrust label: Official confirmation — Confirmed directly by U.S. Customs and Border Protection's national media release alongside regional reporting by FOX 10 Phoenix and Hoodline."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-arizona-307-san-luis-port-130-pounds-fentanyl-meth-bust\",\"category\":\"arizona\",\"title\":{\"en\":\"CBP Seizes Over 130 Pounds of Fentanyl and Methamphetamine From Teen Driver at San Luis Port\",\"zh-TW\":\"美國海關在亞利桑那聖路易斯口岸查獲逾130磅芬太尼與冰毒，逮捕18歲美籍女駕駛\"},\"summary\":{\"en\":\"U.S. Customs and Border Protection officers at Arizona's San Luis Port of Entry seized more than 184 packages of fentanyl and methamphetamine weighing over 130 pounds from a car driven by an 18-year-old U.S. citizen on November 17, turning the suspect over to Homeland Security Investigations.\",\"zh-TW\":\"美國海關與邊境保護局（CBP）公布，駐守亞利桑那州聖路易斯入境口岸（San Luis Port of Entry）的人員於11月17日查驗一輛由18歲美國公民駕駛的轎車時，在緝毒犬示警後搜出逾184包、總重超過130磅的芬太尼與甲基安非他命；車輛與毒品均已查扣，嫌犯移交國土安全調查局（HSI）偵辦。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n美國海關與邊境保護局（CBP）發布全國新聞稿並經亞利桑那州本地媒體於11月26日報導，駐守亞利桑那州聖路易斯入境口岸（San Luis Port of Entry）的查驗人員於2026年11月17日執行一線與二線檢查時，緝毒犬對一輛掛有加州車牌、由18歲美國籍女性駕駛的白色2005年款福特 Escort 轎車發出示警。人員隨後在車內搜出超過184包芬太尼與甲基安非他命（俗稱冰毒），總重逾130磅；CBP 已查扣涉案車輛與毒品，並將該名女子移交國土安全調查局（HSI）面臨聯邦起訴。\\n\\n「為什麼重要」\\n位於亞利桑那州尤馬郡（Yuma County）的聖路易斯口岸是美墨邊境查緝合成鴉片類藥物與興奮劑的重要關口。單一乘用車夾帶逾130磅芬太尼與冰毒遭查獲，顯示跨國販毒集團持續利用年輕美國公民駕駛掩護跨境走私高純度致命毒品。\\n\\n「來源異同」\\n美國海關與邊境保護局官方新聞稿以「CBP stops more than 130 pounds of fentanyl and methamphetamine at San Luis Port of Entry」發布查緝數量（逾184包、超過130磅）與移交 HSI 資訊；FOX 10 Phoenix 以「Teen US citizen arrested in Arizona after Border Patrol finds over 130 pounds of fentanyl, meth」跟進報導，補充涉案車輛為白色2005年福特 Escort 且當局尚未公布嫌犯姓名與居住州別；Hoodline 則以「San Luis Border Bust Nets 130 Pounds of Drugs, 18-Year-Old Driver Held」摘要同一案件。\\n\\n「仍不確定」\\n聯邦執法機關目前尚未公開該名18歲女性嫌犯的姓名、戶籍州別，也尚未公布聯邦檢方正式起訴的具體罪名。\\n\\nTrust label: Official confirmation — 已直接核對美國海關與邊境保護局（CBP）官方新聞稿，並獲 FOX 10 Phoenix 與 Hoodline 報導一致證實。\"},\"glossary\":[{\"term\":{\"en\":\"San Luis Port of Entry\",\"zh-TW\":\"聖路易斯入境口岸\"},\"blurb\":{\"en\":\"A major U.S.-Mexico border crossing located in Yuma County, southwestern Arizona, connecting San Luis, Arizona with San Luis Río Colorado, Sonora.\",\"zh-TW\":\"位於亞利桑那州西南部尤馬郡的美墨邊境主要陸路口岸，連接亞利桑那州聖路易斯與墨西哥索諾拉州。\"}},{\"term\":{\"en\":\"Homeland Security Investigations\",\"zh-TW\":\"國土安全調查局\"},\"blurb\":{\"en\":\"The principal investigative arm of the U.S. Department of Homeland Security responsible for investigating transnational crime, including cross-border narcotics smuggling.\",\"zh-TW\":\"美國國土安全部轄下主要刑事偵查機構，專責調查跨境毒品走私等跨國犯罪案件。\"}},{\"term\":{\"en\":\"Secondary Inspection\",\"zh-TW\":\"二線詳細查驗\"},\"blurb\":{\"en\":\"An additional, more thorough border screening conducted when primary officers or canine units detect anomalies requiring vehicle disassembly or X-ray scans.\",\"zh-TW\":\"當一線邊境官員或緝毒犬發現異常跡象時，將車輛引導至專用查驗區進行X光掃描或拆檢的進階檢查程序。\"}}],\"sources\":[{\"name\":\"U.S. Customs and Border Protection\",\"url\":\"https://www.cbp.gov/newsroom/national-media-release/cbp-stops-more-130-pounds-fentanyl-and-methamphetamine-san-luis\"},{\"name\":\"FOX 10 Phoenix\",\"url\":\"https://www.fox10phoenix.com/news/teen-us-citizen-arrested-arizona-after-border-patrol-finds-over-130-pounds-fentanyl-meth\"},{\"name\":\"Hoodline\",\"url\":\"https://hoodline.com/2026/11/san-luis-border-bust-nets-130-pounds-of-drugs-18-year-old-driver-held/\"}],\"imageUrl\":\"/covers/live/live-arizona-307-san-luis-port-130-pounds-fentanyl-meth-bust.webp\",\"imageAlt\":{\"en\":\"CBP Seizes Over 130 Pounds of Fentanyl and Methamphetamine From Teen Driver at San Luis Port\",\"zh-TW\":\"美國海關在亞利桑那聖路易斯口岸查獲逾130磅芬太尼與冰毒，逮捕18歲美籍女駕駛\"},\"isHeadline\":false,\"isPopular\":true,\"trustScore\":87,\"trustBreakdown\":{\"crossCorroboration\":22,\"outletReputation\":24,\"recencyClarity\":22,\"sourceDiversity\":19},\"publishedAt\":\"2026-11-28T01:47:08.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":22,\"D2\":21,\"D3\":21,\"D4\":23,\"D5\":21,\"total\":22},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\
