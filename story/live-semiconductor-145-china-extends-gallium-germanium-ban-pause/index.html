ounced ahead of the November 27, 2026 deadline that it will extend the suspension of export restrictions on several critical dual-use minerals bound for the United States by two months, running from November 28, 2026 through January 27, 2027. The extension covers export bans originally imposed in December 2024 on gallium, germanium, antimony, and superhard materials, as well as stricter end-user and end-use reviews for dual-use graphite items.\n\nBeijing had first suspended these targeted U.S. restrictions in November 2025 as part of bilateral trade truce arrangements with Washington. While the latest notice prevents an immediate supply cutoff at the end of November, MOFCOM did not revoke the underlying export-control framework, retaining leverage to reimpose the bans if U.S. technology restrictions escalate.\n\nGallium and germanium are indispensable inputs for compound semiconductors, radio-frequency chips, infrared optics, and fiber-optic communications, while antimony is vital for munitions and graphite for electric vehicle batteries. Extending the pause averts near-term input shortages for U.S. chipmakers and defense contractors while trade negotiations continue into early 2027.\n\nVOA News, Taipei Times, and EnergyNews.pro all confirm the two-month extension window running from November 28, 2026 to January 27, 2027 and the specific minerals covered. VOA and EnergyNews.pro highlighted that the underlying December 2024 prohibition remains on the books rather than being permanently lifted, while Taipei Times contextualized the move alongside concurrent U.S. chip export curbs.\n\nWhether Washington and Beijing can reach a durable agreement on semiconductor controls before the new January 27, 2027 deadline—or whether Beijing will let the suspension lapse—remains uncertain.\n\nTrust label: Multi-source agreement — Multiple international outlets confirm the Ministry of Commerce notice and exact two-month extension dates through January 27, 2027."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-145-china-extends-gallium-germanium-ban-pause\",\"category\":\"semiconductor\",\"title\":{\"en\":\"China Extends Suspension of Gallium and Germanium Export Ban to U.S. Until January 2027\",\"zh-TW\":\"美中貿易休戰再延兩個月 中國商務部延長對美鎵、鍺、銻出口禁令暫停期至明年1月\"},\"summary\":{\"en\":\"China's Ministry of Commerce extended its suspension of export bans on gallium, germanium, antimony, and superhard materials to the United States by two months through January 27, 2027, just ahead of the November 27 expiration, preserving temporary relief for U.S. semiconductor and defense supply chains.\",\"zh-TW\":\"在原定11月27日到期前夕，中國商務部宣布自11月28日起將對美國出口鎵、鍺、銻及超硬材料等軍民兩用物項禁令的暫停期再延長兩個月至2027年1月27日，同步延後對美石墨出口從嚴審查。此舉為美國半導體與光電供應鏈提供短期喘息，但相關管制並未永久撤銷。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n在原定2026年11月27日到期的最後關頭，中國商務部部長王文濤（Wang Wentao）轄下部門正式公告，自11月28日起至2027年1月27日止，繼續暫停執行2024年12月針對美國祭出的鎵、鍺、銻及超硬材料等軍民兩用物項出口禁令，並同步延後對美出口石墨兩用物項的嚴格最終用戶與用途審查。這項最初於2025年11月啟動的暫停措施再獲展延兩個月，實質維繫美中雙邊貿易休戰窗口。\\n\\n「為什麼重要」\\n鎵與鍺是化合物半導體、射頻晶片、紅外線光學與光纖通訊不可或缺的關鍵原料，銻廣泛用於軍工彈藥，石墨則是電動車電池負極核心材料。中方延長暫停期雖為依賴相關供應鏈的美國晶片與國防製造商爭取到兩個月緩衝，但北京並未廢除禁令法源，仍保留隨時重啟管制的籌碼。\\n\\n「來源異同」\\n美國之音（VOA）、《台北時報》（Taipei Times）及能源新聞平台 EnergyNews.pro 均一致確認暫停期延至2027年1月27日及涵蓋礦產清單。美國之音與 EnergyNews.pro 特別強調此次僅為「延長暫停」而非永久取消禁令；《台北時報》則結合美國近期收緊對中 AI 晶片與模型蒸餾管制，點出雙方科技角力仍未降溫。\\n\\n「仍不確定」\\n美中雙方能否在2027年1月27日新期限屆滿前，就半導體出口管制與關稅議題達成更長期的制度性安排，或屆時中方將恢復全面禁運，仍有待後續談判觀察。\\n\\nTrust label: Multi-source agreement — 多家國際媒體一致核實中國商務部公告日期、涵蓋關鍵礦產種類與延長兩個月細節。\"},\"glossary\":[{\"term\":{\"en\":\"Gallium and germanium\",\"zh-TW\":\"鎵與鍺\"},\"blurb\":{\"en\":\"Critical semiconductor and optoelectronic metals essential for compound chips, radar, infrared sensors, and fiber-optic networks.\",\"zh-TW\":\"製造化合物半導體、雷達、紅外線感測器與光纖通訊元件的關鍵稀有金屬，中國在全球精煉供應占主導地位。\"}},{\"term\":{\"en\":\"Dual-use items\",\"zh-TW\":\"軍民兩用物項\"},\"blurb\":{\"en\":\"Materials, components, or technologies that have both commercial civilian applications and military or defense uses.\",\"zh-TW\":\"同時具備商業民用價值與軍事國防用途的材料、零組件或技術，通常受各國出口管制法規嚴格監管。\"}},{\"term\":{\"en\":\"End-user and end-use review\",\"zh-TW\":\"最終用戶與最終用途審查\"},\"blurb\":{\"en\":\"Export control screening requiring exporters to verify who will receive sensitive materials and how they will be used.\",\"zh-TW\":\"出口管制稽核機制，要求出口商證明敏感物項的最終買家身分與實際用途不涉及受限制的軍事或特定領域。\"}}],\"sources\":[{\"name\":\"VOA News\",\"url\":\"https://www.voanews.com/a/china-extends-suspension-period-for-its-ban-on-export-of-critical-minerals-to-us-20261126/8228334.html\"},{\"name\":\"EnergyNews.pro\",\"url\":\"https://energynews.pro/en/china-extends-suspension-of-its-gallium-restrictions-targeting-the-united-states\"},{\"name\":\"ANI News\",\"url\":\"https://www.aninews.in/news/business/china-extends-suspension-of-select-export-restrictions-on-us-by-two-months20261124164029\"}],\"imageUrl\":\"/covers/live/live-semiconductor-145-china-extends-gallium-germanium-ban-pause.jpg\",\"imageAlt\":{\"en\":\"Refined gallium and germanium ingots used in semiconductor manufacturing\",\"zh-TW\":\"用於半導體製造的精煉鎵與鍺關鍵金屬原料\"},\"isHeadline\":false,\"isPopular\":true,\"trustScore\":85,\"trustBreakdown\":{\"crossCorroboration\":22,\"outletReputation\":21,\"recencyClarity\":21,\"sourceDiversity\":21},\"publishedAt\":\"2026-11-27T17:16:28.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":21,\"D2\":22,\"D3\":21,\"D4\":22,\"D5\":20,\"total\":21},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom
