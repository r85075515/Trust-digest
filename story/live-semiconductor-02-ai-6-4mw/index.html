adline of TECO entering the global AI infrastructure chain.\n\nWhy it matters\nModular data centres are a fast way to add AI computing capacity, and a 6.4MW first phase gives TECO a foothold in a market dominated by large cloud builders. The nine-month timeline is aggressive, and if delivery lands on schedule it strengthens TECO's credentials as an AI infrastructure supplier beyond Taiwan.\n\nSources agree–disagree\nTechNews and CNA agree on the core facts: the partners, the Satsumasendai location, the modular format, the 6.4MW first phase, and the 2027 delivery target. The raw feed flagged a numeric mismatch, but the figures cited were a stock code and a date, not conflicting project data, so there is no genuine disagreement between the two reports.\n\nStill uncertain\nNeither feed summary gives the total planned capacity beyond phase one, the contract value, or how the work is split among the three partners. Whether further phases follow, and on what timetable, remains to be disclosed.\n\nTrust label: Two-source agreement — TechNews and CNA report the same core facts."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-02-ai-6-4mw\",\"category\":\"semiconductor\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"publishedAt\":\"2026-11-11T07:46:51.000Z\",\"title\":{\"en\":\"TECO Joins GMI Cloud and KSDI to Build 6.4MW Modular Data Centre in Japan\",\"zh-TW\":\"東元（TECO）攜手 GMI Cloud 與凱信數基赴日建 6.4MW 模組化資料中心\"},\"summary\":{\"en\":\"TECO will work with GMI Cloud and KSDI to build a modular data centre in Satsumasendai, Kagoshima, delivering 6.4MW in the first phase by 2027 after a nine-month build. The deal puts TECO into the global AI infrastructure supply chain; watch whether further phases follow.\",\"zh-TW\":\"電機大廠東元（TECO）宣布與 GMI Cloud 及凱信數基（KSDI）合作，在日本鹿兒島縣薩摩川內市打造模組化資料中心，9 個月工期、2027 年交付首期 6.4MW 容量。此案讓東元打入全球 AI 基礎建設鏈，後續是否擴建值得追蹤。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"電機大廠東元（TECO）宣布進軍全球 AI 基礎建設鏈，將與 AI 雲端服務商 GMI Cloud 及凱信數基（KSDI）在日本九州鹿兒島縣薩摩川內市合作打造模組化資料中心，首期 6.4MW 容量預計 9 個月工期、2027 年交付。\\n\\n發生了什麼事\\n中央社（CNA）報導，東元 11 日下午宣布與 GMI Cloud 及凱信數基株式會社（KSDI）攜手，在薩摩川內市建模組化資料中心（MDC），首期 6.4MW 預計 2027 年交付。科技新報（TechNews）以「東元攻入全球 AI 基礎建設鏈」為題報導同一案子。\\n\\n為什麼重要\\n模組化資料中心是快速擴充 AI 算力的作法，首期 6.4MW 讓東元在大型雲端業者主導的市場取得立足點。9 個月工期相當積極，若能如期交付，將強化東元在台灣以外作為 AI 基礎建設供應商的資歷。\\n\\n來源異同\\n科技新報與中央社在核心事實一致：合作三方、地點、模組化形式、首期 6.4MW 與 2027 年交付目標。原始摘要曾標示數字差異，但比對的其實是股票代碼與日期，並非專案數據衝突，兩家報導並無實質分歧。\\n\\n仍不確定\\n兩家摘要都未提及首期以外的總規劃容量、合約金額，以及三方如何分工；後續是否擴建、時程如何，仍待公布。\"},\"sources\":[{\"name\":\"TechNews 科技新報\",\"url\":\"https://finance.technews.tw/2026/11/11/modular/\"},{\"name\":\"中央社-產經證券\",\"url\":\"https://www.cna.com.tw/news/afe/202611110178.aspx\"}],\"disagreements\":null,\"trustScore\":64,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":19,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"semiconductor\",\"live-ingest\",\"technews-科技新報\",\"中央社-產經證券\"],\"glossary\":[{\"term\":{\"en\":\"TECO\",\"zh-TW\":\"東元\"},\"blurb\":{\"en\":\"Taiwanese maker of electrical equipment and motors.\",\"zh-TW\":\"台灣電機設備與馬達製造商。\"}},{\"term\":{\"en\":\"modular data centre (MDC)\",\"zh-TW\":\"模組化資料中心\"},\"blurb\":{\"en\":\"A prefabricated, quickly deployable data centre built in sections.\",\"zh-TW\":\"以預製模組分段搭建、可快速部署的資料中心。\"}},{\"term\":{\"en\":\"GMI Cloud\",\"zh-TW\":\"GMI Cloud\"},\"blurb\":{\"en\":\"An AI cloud service provider and partner in the project.\",\"zh-TW\":\"AI 雲端服務商，本案合作方之一。\"}},{\"term\":{\"en\":\"KSDI\",\"zh-TW\":\"凱信數基\"},\"blurb\":{\"en\":\"A Japanese digital infrastructure company and partner in the project.\",\"zh-TW\":\"日本數位基礎建設公司，本案合作方之一。\"}},{\"term\":{\"en\":\"Satsumasendai\",\"zh-TW\":\"薩摩川內市\"},\"blurb\":{\"en\":\"A city in Kagoshima Prefecture, Kyushu, Japan.\",\"zh-TW\":\"日本九州鹿兒島縣的城市。\"}},{\"term\":{\"en\":\"megawatt (MW)\",\"zh-TW\":\"百萬瓦\"},\"blurb\":{\"en\":\"One million watts, a unit of electrical power capacity.\",\"zh-TW\":\"一百萬瓦，電力容量的單位。\"}}],\"imageUrl\":\"/covers/live/live-semiconductor-02-ai-6-4mw.jpg\",\"imageAlt\":{\"en\":\"TECO modular data centre project in Satsumasendai, Japan\",\"zh-TW\":\"東元在日本薩摩川內市的模組化資料中心案\"}}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-semiconductor-02-ai-6-4mw/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-semiconductor-02-ai-6-4mw/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"d:\"$8:metadata\"\n"])</script></body></html>
