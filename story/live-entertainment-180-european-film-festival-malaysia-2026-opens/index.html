 evening of November 26, 2026, at TGV Pavilion Kuala Lumpur with a gala screening of 'Fjord', directed by Romanian filmmaker Cristian Mungiu and winner of the Cannes Palme d'Or. Running through December 13, the festival presents 20 feature films representing 17 European Union member states alongside Norway, Switzerland, and Ukraine.\n\nAs one of Southeast Asia's longest-running European cultural showcases, EUFF bridges European cinema with Malaysian audiences, with multiple festival screenings selling out within hours of ticket sales opening.\n\nGempak (Rojak Daily) and The Star Malaysia both confirm the November 26 opening at TGV Pavilion Kuala Lumpur, the December 13 closing date, and the 20-film lineup headlined by Cristian Mungiu's 'Fjord'. Gempak adds details on rapid sellouts across several screenings and the participation of non-EU countries Norway, Switzerland, and Ukraine.\n\nWhether encore screenings will be added in Kuala Lumpur or regional Malaysian cities to accommodate sold-out demand has not yet been announced by festival organizers.\n\nTrust label: Multi-source agreement — Verified across Gempak and The Star Malaysia coverage of the November 26 opening."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-entertainment-180-european-film-festival-malaysia-2026-opens\",\"category\":\"entertainment\",\"title\":{\"en\":\"26th European Film Festival Malaysia Opens in Kuala Lumpur with Cannes Winner 'Fjord'\",\"zh-TW\":\"第26屆馬來西亞歐洲影展吉隆坡揭幕 坎城金棕櫚得主《Fjord》領銜20國佳片\"},\"summary\":{\"en\":\"The 26th European Film Festival Malaysia opened at TGV Pavilion Kuala Lumpur on November 26 with Cristian Mungiu's Palme d'Or winner 'Fjord', showcasing 20 films from 20 European nations through December 13 as multiple screenings sold out within hours. Takeaway: Strong opening ticket demand underscores growing Southeast Asian appetite for curated European arthouse cinema.\",\"zh-TW\":\"第26屆馬來西亞歐洲影展（EUFF）於11月26日晚間在吉隆坡柏威年廣場TGV影城正式揭幕，由羅馬尼亞導演克里斯蒂安・穆基執導的坎城金棕櫚得主《Fjord》擔任開幕片，展期至12月13日並網羅20國20部作品，開賣數小時內多場次即告完售。一句結論：開幕售票熱潮顯示東南亞觀眾對精選歐洲藝術電影需求持續升溫。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」第 26 屆馬來西亞歐洲影展（EUFF）於 2026 年 11 月 26 日晚間在吉隆坡柏威年廣場 TGV 影城正式開幕，由羅馬尼亞導演克里斯蒂安・穆基（Cristian Mungiu）執導的坎城影展金棕櫚獎得獎片《Fjord》擔任開幕首映。本屆影展將持續至 12 月 13 日，匯集來自 17 個歐盟成員國以及挪威、瑞士、烏克蘭共 20 個國家的 20 部電影作品。\\n\\n「為什麼重要」作為東南亞歷史最悠久的歐洲文化交流影展之一，本屆影展開票後數小時內即有多個場次宣告完售，展現馬來西亞及東南亞影迷對歐洲藝術電影的高度關注與票房支持。\\n\\n「來源異同」馬來西亞娛樂媒體《Gempak》與主流英文報《星報》（The Star）均一致報導影展於 11 月 26 日在吉隆坡柏威年廣場 TGV 影城揭幕、展期至 12 月 13 日，並由《Fjord》領銜 20 部參展片；《Gempak》進一步補充多場次開賣即秒殺的盛況及挪威、瑞士、烏克蘭三國參與細節。\\n\\n「仍不確定」針對開賣即完售的熱門場次，主辦單位後續是否會在吉隆坡或其他馬來西亞城市加開場次，目前尚未公布。\\n\\nTrust label: Multi-source agreement — 《Gempak》與馬來西亞《星報》對影展開幕日期、地點與片單報導一致。\"},\"glossary\":[{\"term\":{\"en\":\"European Film Festival Malaysia (EUFF)\",\"zh-TW\":\"馬來西亞歐洲影展\"},\"blurb\":{\"en\":\"An annual film showcase organized by the European Union Delegation to Malaysia and member state embassies.\",\"zh-TW\":\"由歐盟駐馬來西亞代表團與歐洲各國駐馬使館共同主辦的年度電影文化交流盛會。\"}},{\"term\":{\"en\":\"Palme d'Or\",\"zh-TW\":\"坎城金棕櫚獎\"},\"blurb\":{\"en\":\"The highest prize awarded to the best feature film in competition at the Cannes Film Festival.\",\"zh-TW\":\"法國坎城影展正式競賽單元的最高榮譽獎項，頒發給年度最佳劇情長片。\"}},{\"term\":{\"en\":\"Cristian Mungiu\",\"zh-TW\":\"克里斯蒂安・穆基\"},\"blurb\":{\"en\":\"An acclaimed Romanian film director and screenwriter prominent in the Romanian New Wave cinema movement.\",\"zh-TW\":\"羅馬尼亞新浪潮電影代表導演與編劇，多次在坎城影展獲得最高殊榮。\"}}],\"sources\":[{\"name\":\"Gempak (Rojak Daily)\",\"url\":\"https://gempak.com/rojakdaily/entertainment/european-film-festival-malaysia-opens-palme-dor-winner-fjord-multiple-screenings-sell-out-within\"},{\"name\":\"The Star Malaysia\",\"url\":\"https://www.thestar.com.my/lifestyle/entertainment/2026/11/26/european-film-festival-malaysia-returns-with-more-award-winning-offerings\"}],\"imageUrl\":\"/covers/live/live-entertainment-180-european-film-festival-malaysia-2026-opens.jpg\",\"imageAlt\":{\"en\":\"Opening night of the 26th European Film Festival Malaysia featuring Cannes winner Fjord\",\"zh-TW\":\"第26屆馬來西亞歐洲影展揭幕並首映坎城金棕櫚得獎片Fjord\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":85,\"trustBreakdown\":{\"crossCorroboration\":21,\"outletReputation\":22,\"recencyClarity\":22,\"sourceDiversity\":20},\"publishedAt\":\"2026-11-27T18:24:11.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":22,\"D2\":21,\"D3\":21,\"D4\":22,\"D5\":21,\"total\":21},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-entertainment-180-european-film-festival-malaysia-2026-opens/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-entertainment-180-european-film-festival-malaysia-2026-opens/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"d:\"$8:metada
