deral inquiries into a formal state investigation. In a press release, Bonta's office said the subpoena is related to news of former Nvidia CEO Jensen Huang's affair with an alleged Chinese spy, and that the California Department of Justice is asking Nvidia whether its advanced chips or confidential information may have gone to China and whether Nvidia misled investors and the public. The information obtained will help the department evaluate whether Nvidia's actions violated California law.\n\nWhat happened: \"My office is investigating whether Nvidia or Jensen Huang's actions resulted in China obtaining advanced chips or confidential information — and if Nvidia misled investors and the public about this risk, in violation of the law,\" Bonta said, adding that the conduct of Nvidia and its former CEO \"raises bright red flags.\" Just two days earlier, on November 17, Bonta had said only that the scandal had raised red flags and that his office was weighing whether to act; Thursday's subpoena converts that signal into a compulsory legal process.\n\nWhy it matters: Nvidia now faces parallel scrutiny on nearly every front: an SEC civil investigation into whether its disclosures misled investors, Justice Department inquiries around Alice Huang and Megaspeed, the board's own Wachtell-led probe, December testimony before Congress — and now a state attorney general with subpoena power over the company's California operations. State action also opens a track that does not depend on federal priorities or the White House's posture toward Huang.\n\nSources agree / disagree: The attorney general's press release and Reuters agree on the subpoena, its scope (chips and confidential information to China; misleading investors) and Bonta's \"bright red flags\" language. Nvidia has not publicly responded to the subpoena in the reporting so far.\n\nStill uncertain: What documents and testimony the subpoena demands and its deadline; whether the inquiry will widen to individuals, including Huang himself; and whether California will ultimately bring an enforcement action.\n\nTrust label: Multi-source agreement — the attorney general's own press release plus Reuters; Nvidia's response is not yet on record."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"adult\":false,\"body\":{\"en\":\"$10\",\"zh-TW\":\"發生了什麼事\\n加州檢察總長邦塔（Rob Bonta）週四對輝達正式送達調查傳票，黃仁勳醜聞從聯邦層級的詢問升級為州級正式調查。檢察總長辦公室新聞稿指出，傳票與前執行長黃仁勳和一名被指為中國間諜的女子傳出婚外情的消息有關；加州司法部要查的是：輝達的先進晶片或機密資訊是否可能流向中國，以及輝達是否誤導了投資人與公眾。傳票取得的資訊將用來評估輝達的行為是否違反加州法律。邦塔說：「本辦公室正在調查輝達或黃仁勳的行為是否導致中國取得先進晶片或機密資訊——以及輝達是否就此風險誤導投資人與公眾、違反法律。」他並稱輝達與其前執行長的行為「亮起鮮明的紅旗」。僅僅兩天前（11 月 17 日），邦塔還只說醜聞「引起警訊」、辦公室在評估是否行動；週四的傳票把訊號變成了具強制力的法律程序。\\n\\n為什麼重要\\n輝達如今幾乎四面受查：SEC 查披露是否誤導投資人的民事調查、司法部圍繞黃樂（Alice Huang）與 Megaspeed 的偵查、董事會自聘 Wachtell 的內部調查、12 月的國會作證——現在再加上握有傳票權的州檢察總長。州級行動還開了一條不依賴聯邦優先順序、也不受白宮對黃仁勳態度影響的軌道。\\n\\n來源異同\\n檢察總長新聞稿與路透一致：傳票已送達、調查範圍（晶片與機密資訊是否流向中國、是否誤導投資人）、以及「鮮明的紅旗」措辭。輝達迄今尚未公開回應這張傳票。\\n\\n仍不確定\\n傳票要求交出的文件與證詞範圍及期限；調查是否會擴及個人（包括黃仁勳本人）；以及加州最終是否會提起執法行動。\"},\"category\":\"semiconductor\",\"disagreements\":null,\"glossary\":[{\"blurb\":{\"en\":\"California's attorney general, who served the investigative subpoena on Nvidia on November 19.\",\"zh-TW\":\"加州檢察總長，11 月 19 日對輝達送達調查傳票。\"},\"term\":{\"en\":\"Rob Bonta\",\"zh-TW\":\"邦塔（Rob Bonta）\"}},{\"blurb\":{\"en\":\"A compulsory legal demand for documents or testimony; Bonta's office will use what it obtains to evaluate whether Nvidia violated California law.\",\"zh-TW\":\"具強制力的法律要求，命對方交出文件或證詞；邦塔辦公室將據此評估輝達是否違反加州法律。\"},\"term\":{\"en\":\"Investigative subpoena\",\"zh-TW\":\"調查傳票（Investigative Subpoena）\"}},{\"blurb\":{\"en\":\"The Singapore data-center company formerly led by Alice Huang, at the center of allegations that advanced Nvidia chips were diverted toward China.\",\"zh-TW\":\"黃樂曾任高層的新加坡資料中心公司，是先進輝達晶片被指轉往中國的核心。\"},\"term\":{\"en\":\"Megaspeed\",\"zh-TW\":\"Megaspeed\"}}],\"id\":\"live-semiconductor-25-california-ag-subpoenas-nvidia\",\"imageAlt\":{\"en\":\"\",\"zh-TW\":\"\"},\"imageUrl\":\"\",\"isHeadline\":true,\"isPopular\":true,\"publishedAt\":\"2026-11-19T23:05:43.000Z\",\"sources\":[{\"name\":\"California Attorney General's Office\",\"url\":\"https://oag.ca.gov/news/press-releases/attorney-general-bonta-serves-investigative-subpoena-nvidia\"},{\"name\":\"Reuters\",\"url\":\"https://www.reuters.com/legal/litigation/california-ag-subpoenas-nvidia-over-concerns-about-former-ceo-china-2026-11-19/\"}],\"summary\":{\"en\":\"California Attorney General Rob Bonta has served an investigative subpoena on Nvidia, asking whether its advanced chips or confidential information went to China and whether the company misled investors over the Jensen Huang scandal. Bonta called the conduct \\\"bright red flags\\\" — a formal escalation from his November 17 signal that his office was weighing action, and a new state track alongside the SEC and Justice Department inquiries.\",\"zh-TW\":\"加州檢察總長邦塔已對輝達送達調查傳票：查先進晶片或機密資訊是否流向中國、公司是否就黃仁勳醜聞誤導投資人。邦塔稱相關行為「亮起鮮明的紅旗」——這是他 11 月 17 日「評估是否行動」訊號的正式升級，也讓輝達在 SEC 與司法部之外，再多一條州級調查線。\"},\"tags\":[],\"title\":{\"en\":\"California Attorney General Subpoenas Nvidia: Did Chips or Secrets Reach China, and Were Investors Misled?\",\"zh-TW\":\"加州檢察總長正式傳票查輝達：晶片或機密是否流向中國、投資人是否被誤導\"},\"trustBreakdown\":{\"crossCorroboration\":24,\"outletReputation\":24,\"recencyClarity\":21,\"sourceDiversity\":15},\"trustScore\":84}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-semiconductor-25-califor
