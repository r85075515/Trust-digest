ank for International Settlements and former governor of the Bank of Spain, as the next President of the European Central Bank (ECB). He will succeed Christine Lagarde (克里斯蒂娜・拉加德), who announced plans to step down nine months early.\n\nThe selection stabilizes leadership succession at the world's second-most influential central bank as the eurozone navigates sluggish growth, sovereign debt pressures, and inflation management. Hernández de Cos secured backing from France, Germany, and a majority of eurozone governments after the Netherlands withdrew support for rival candidate Klaas Knot (克拉斯・諾特).\n\nOfficial European Council releases and reporting by The Guardian agree on the nomination timeline and the parallel nominations of Laurence Boone (勞倫斯・布恩) and Markus Brunnermeier (馬庫斯・布倫納邁爾) to the ECB executive board.\n\nFormal confirmation still requires non-binding consultations with the European Parliament and the ECB's Governing Council before final adoption.\n\nTrust label: Multi-source agreement — Nomination details and board appointments are corroborated by official European Council press releases and The Guardian."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-077-ecb-next-president-pablo-hernandez-de-cos\",\"category\":\"finance\",\"title\":{\"en\":\"Spain's Pablo Hernández de Cos Selected to Succeed Lagarde as ECB President\",\"zh-TW\":\"西班牙前央行總裁德科斯獲提名出任下屆歐洲央行總裁 接替拉加德\"},\"summary\":{\"en\":\"Eurozone leaders and the European Council selected former Bank of Spain governor Pablo Hernández de Cos to succeed Christine Lagarde as president of the European Central Bank. His appointment marks the first time a Spaniard will lead the eurozone's central bank.\",\"zh-TW\":\"歐元區領袖與歐盟理事會提名西班牙前央行總裁帕布洛・埃爾南德斯・德科斯（Pablo Hernández de Cos）接替克里斯蒂娜・拉加德（Christine Lagarde），出任下一任歐洲央行總裁。這將是歐洲央行自1998年成立以來首度由西班牙籍人士掌舵。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n歐盟理事會正式提名現任國際清算銀行（BIS）總經理、前西班牙央行總裁帕布洛・埃爾南德斯・德科斯（Pablo Hernández de Cos）為下一任歐洲央行總裁，以接替先前宣布將提前9個月卸任的現任總裁克里斯蒂娜・拉加德（Christine Lagarde）。\\n\\n「為什麼重要」\\n此項人事拍板確立了全球第二大主要央行的領導層交接，使歐元區在應對經濟成長疲軟、主權債務風險與通膨控管之際維持貨幣政策連續性。德科斯在獲得法國、德國及多數歐元區政府支持後勝出，而荷蘭方面則撤回對競爭對手克拉斯・諾特（Klaas Knot）的支持。\\n\\n「來源異同」\\n歐盟理事會官方新聞稿與《衛報》（The Guardian）對提名程序及歐洲央行執行委員會同步提名勞倫斯・布恩（Laurence Boone）與馬庫斯・布倫納邁爾（Markus Brunnermeier）的報導完全一致。\\n\\n「仍不確定」\\n根據歐盟程序，該項任命案在歐盟理事會最終正式通過前，仍須完成與歐洲議會及歐洲央行管理委員會的諮詢程序。\"},\"glossary\":[{\"term\":{\"en\":\"European Central Bank (ECB)\",\"zh-TW\":\"歐洲中央銀行\"},\"blurb\":{\"en\":\"The central bank responsible for monetary policy and price stability across the 20 European Union member states that use the euro.\",\"zh-TW\":\"負責制定與執行歐元區20個成員國貨幣政策、維護物價穩定的中央銀行機構。\"}},{\"term\":{\"en\":\"Bank for International Settlements (BIS)\",\"zh-TW\":\"國際清算銀行\"},\"blurb\":{\"en\":\"An international financial institution owned by member central banks that fosters global monetary and financial cooperation.\",\"zh-TW\":\"由各國中央銀行共同擁有的國際金融機構，被稱為「央行的央行」，致力於促進全球貨幣與金融合作。\"}},{\"term\":{\"en\":\"European Council\",\"zh-TW\":\"歐盟理事會（歐洲高峰會）\"},\"blurb\":{\"en\":\"The EU institution comprising the heads of state or government of member states that defines the bloc's political direction and key appointments.\",\"zh-TW\":\"由歐盟各成員國國家元首或政府首腦組成的最高政治決策機構，負責決定歐盟整體政治方向與高層任命。\"}}],\"sources\":[{\"name\":\"European Council Press Release\",\"url\":\"https://www.consilium.europa.eu/en/press/press-releases/2026/11/26/european-council-puts-forward-pablo-hernandez-de-cos-as-next-president-of-the-european-central-bank/\"},{\"name\":\"The Guardian\",\"url\":\"https://www.theguardian.com/business/2026/nov/26/spain-pablo-hernandez-de-cos-next-ecb-president\"}],\"imageUrl\":\"/covers/live/live-finance-077-ecb-next-president-pablo-hernandez-de-cos.jpg\",\"imageAlt\":{\"en\":\"European Central Bank headquarters building in Frankfurt\",\"zh-TW\":\"位於法蘭克福的歐洲中央銀行總部大樓\"},\"isHeadline\":true,\"isPopular\":true,\"trustScore\":88,\"trustBreakdown\":{\"crossCorroboration\":23,\"outletReputation\":23,\"recencyC
