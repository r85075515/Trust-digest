cording to reports of the results.\nWhat happened\nLilly's triple-G drug, retatrutide, topped Novo Nordisk's Ozempic in the trial, as reported by BioPharma Dive and ET Pharma. The advantage held at the highest dose for both blood sugar control and weight loss, but the same dose brought more side effects and more patients stopping treatment. Clinicians quoted in the coverage read the results as Lilly's attempt to gain ground in Novo's established type-2 diabetes market, after eroding the market for Wegovy, Ozempic's weight-loss sibling, and to cement its leadership on the back of superior efficacy with its current bestseller, tirzepatide.\nWhy it matters\nHead-to-head wins change prescribing conversations: doctors weigh the better blood sugar and weight results against the higher burden of side effects and dropouts. For Lilly, the trial is also a market argument, positioning retatrutide as the next step beyond tirzepatide in a rivalry where efficacy claims decide leadership.\nSources agree / disagree\nBioPharma Dive and ET Pharma agree on the core result: retatrutide ahead on blood sugar and weight loss at the highest dose, with more side effects and discontinuations. Neither snippet gives numbers for the size of the advantage, the trial's size, or its duration, so the scale of the win cannot be judged from the feed text. Trust label: Two-source agreement — two outlets agree on the trial result, with no conflicting facts.\nStill uncertain\nThe snippets do not give the doses, the number of participants, the trial duration, or which side effects were most common. The comparison is reported as a trial result, not as an approved treatment claim; verify the full trial data before quoting efficacy or safety figures."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-biotech-01-lilly-s-triple-g-drug-to\",\"category\":\"biotech\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-biotech-01-lilly-s-triple-g-drug-to.png\",\"imageAlt\":{\"en\":\"Cover related to: Lilly’s ‘triple-G’ drug tops Novo’s Ozempic in diabetes trial\",\"zh-TW\":\"相關封面圖：（譯文待補）Lilly’s ‘triple-G’ drug tops Novo’s Ozempic in diabetes trial\"},\"publishedAt\":\"2026-10-29T01:38:20.000Z\",\"title\":{\"en\":\"Lilly's Triple-G Drug Retatrutide Tops Novo's Ozempic in Diabetes Trial\",\"zh-TW\":\"禮來（Lilly）「三重 G」藥物瑞他魯肽在糖尿病試驗中勝過諾和諾德 Ozempic\"},\"summary\":{\"en\":\"The highest dose of Lilly's retatrutide beat Novo's Ozempic on blood sugar and weight loss in a diabetes trial, but brought higher rates of side effects and treatment discontinuations. Clinicians read the result as Lilly's bid for ground in Novo's type-2 diabetes market. Efficacy and tolerability must be weighed together.\",\"zh-TW\":\"禮來瑞他魯肽（retatrutide）最高劑量在糖尿病試驗中，於血糖與體重減輕上勝過諾和諾德的 Ozempic，但副作用與治療中斷率也較高。臨床醫師認為，這是禮來爭取第 2 型糖尿病市場地位的一步。接下來看：療效與耐受性必須一起衡量。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"最高劑量的瑞他魯肽（retatrutide）在頭對頭糖尿病試驗中，在血糖與體重減輕兩項指標上勝過 Ozempic，但也伴隨較高的副作用發生率與治療中斷率。\\n發生了什麼事\\n禮來（Lilly）的「三重 G」藥物瑞他魯肽，在試驗中勝過諾和諾德（Novo Nordisk）的 Ozempic，BioPharma Dive 與 ET Pharma 的報導一致。最高劑量在血糖控制與體重減輕上都占優勢，但同劑量也帶來更多副作用與更多患者停止治療。報導引述的臨床醫師認為，這項結果是禮來試圖在諾和諾德成熟的第 2 型糖尿病市場取得進展；在蠶食 Ozempic 的減重姊妹藥 Wegovy 的市場之後，禮來要憑藉現有暢銷藥替澤帕肽（tirzepatide）的卓越療效，鞏固其領導地位。\\n為什麼重要\\n頭對頭的勝負會改變開藥時的考量：醫師要在更好的血糖與體重效果，與更高的副作用負擔及退出率之間權衡。對禮來而言，這項試驗也是一項市場論述，把瑞他魯肽定位為替澤帕肽之後的下一步；在療效主張決定領導地位的競爭中，這一點至關重要。\\n來源異同\\nBioPharma Dive 與 ET Pharma 對核心結果的報導一致：最高劑量的瑞他魯肽在血糖與體重減輕上領先，副作用與治療中斷也較多。兩則摘要都沒有給出優勢幅度、試驗規模或持續時間，因此無法從摘要文字判斷勝負的規模。信任標籤：兩源一致——兩家媒體對試驗結果的報導一致，無事實衝突。\\n仍不確定\\n摘要沒有交代劑量、受試者人數、試驗持續時間，也沒有說明哪些副作用最常見。這項比較是報導中的試驗結果，並非已核准的治療主張；引用療效或安全性數字前，請查閱完整的試驗數據。\"},\"sources\":[{\"name\":\"BioPharma Dive\",\"url\":\"https://www.biopharmadive.com/news/retatrutide-ozempic-diabetes-trial-results-lilly-novo/873016/\"},{\"name\":\"ET Pharma\",\"url\":\"https://pharma.economictimes.indiatimes.com/news/research-and-development/lillys-retatrutide-scores-another-phase-3-win-outperforming-ozempic-in-head-to-head-study/135285
