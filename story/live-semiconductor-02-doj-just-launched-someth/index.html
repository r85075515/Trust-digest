rt the task force is now operating, with the same leadership names and the same mission wording.\nWhy it matters\nA Justice Department unit for AI is a sign that Washington now treats AI leadership as a law-enforcement and national-security matter, not just a technology race. If the task force acts against manipulation by foreign or domestic actors, it could set precedents for how AI is policed.\nSources agree / disagree\nEngadget and The Register agree the task force is up and running, name the same three leaders, and describe the same mission. Neither outlet disputes the other's account. Trust label: Two-source agreement — Engadget and The Register report the same launch with the same leadership and mission.\nStill uncertain\nThe snippets do not spell out the task force's powers, its staffing, or any case it has opened. They also do not quote the Trump memo itself. Verify the mandate and the memo's wording in the full reporting before quoting them."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-02-doj-just-launched-someth\",\"category\":\"semiconductor\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-semiconductor-02-doj-just-launched-someth.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Justice Department Launches Super Intelligence Task Force to Guard US AI Lead\",\"zh-TW\":\"相關封面圖：美國司法部成立「超級情報工作小組」，守護美國 AI 領先地位\"},\"publishedAt\":\"2026-11-06T16:56:52.000Z\",\"title\":{\"en\":\"Justice Department Launches Super Intelligence Task Force to Guard US AI Lead\",\"zh-TW\":\"美國司法部成立「超級情報工作小組」，守護美國 AI 領先地位\"},\"summary\":{\"en\":\"The US Department of Justice says its Super Intelligence Task Force is now up and running, after President Donald Trump ordered it in a memo last month. Led by Jay Clayton with Stanley Woodward and Stephen Weiss, the unit must keep the technology from being manipulated by bad actors at home or abroad. Watch what powers the task force uses.\",\"zh-TW\":\"美國司法部表示，總統川普（Donald Trump）上月以備忘錄下令成立的「超級情報工作小組」（SINTF）已開始運作。工作小組由傑伊·克萊頓（Jay Clayton）領軍，偕同史丹利·伍德沃德（Stanley Woodward）與史蒂芬·魏斯（Stephen Weiss），任務是防止技術被國內外不良行為者操縱。接下來看這個小組實際會動用哪些權力。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"美國司法部表示，總統川普（Donald Trump）上月以備忘錄下令成立的「超級情報工作小組」（SINTF）現已開始運作。該單位的任務是確保技術不會「被國內外的不良行為者操縱」。\\n發生了什麼事\\n工作小組由傑伊·克萊頓（Jay Clayton）領軍，報導稱其職稱為國家情報總監，偕同副總檢察長史丹利·伍德沃德（Stanley Woodward）與副副總檢察長史蒂芬·魏斯（Stephen Weiss）。其職責是守護美國在人工智慧領域的領先地位。Engadget 與 The Register 都報導工作小組已開始運作，領導人名單與任務描述一致。\\n為什麼重要\\n司法部為 AI 設立專責單位，顯示華府如今把 AI 領先地位視為執法與國安議題，不只是科技競賽。如果工作小組真的對國內外操縱行為出手，將為 AI 如何受監管立下先例。\\n來源異同\\nEngadget 與 The Register 對工作小組已運作、三位領導人姓名與任務描述的報導一致，沒有任何一家質疑另一家的說法。信任標籤：雙源一致——Engadget 與 The Register 以相同的領導人名單與任務報導同一項成立消息。\\n仍不確定\\n來源摘要沒有說明工作小組的權限、人員編制，或已經著手的案件，也沒有引述川普備忘錄的原文。引用職權範圍與備忘錄文字前請查閱完整報導。\"},\"sources\":[{\"name\":\"Engadget\",\"url\":\"https://www.engadget.com/2309257/doj-just-launched-something-called-the-super-intelligence-task-force/\"},{\"name\":\"The Register\",\"url\":\"https://www.theregister.com/ai-and-ml/2026/11/06/dojs-super-intelligence-task-force-up-and-running/5308074\"}],\"disagreements\":null,\"trustScore\":68,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":15,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"semiconductor\",\"live-ingest\",\"engadget\",\"the-register\"],\"glossary\":[{\"term\":{\"en\":\"Super Intelligence Task Force\",\"zh-TW\":\"超級情報工作小組\"},\"blurb\":{\"en\":\"The Justice Department unit, known as SINTF, guarding the US AI lead.\",\"zh-TW\":\"司法部新設單位，簡稱 SINTF，負責守護美國 AI 領先地位。\"}},{\"term\":{\"en\":\"US Department of Justice\",\"zh-TW\":\"美國司法部\"},\"blurb\":{\"en\":\"The US federal department that launched the task force.\",\"zh-TW\":\"成立這個工作小組的美國聯邦部門。\"}},{\"term\":{\"en\":\"Jay Clayton\",\"zh-TW\":\"傑伊·克萊頓\"},\"blurb\":{\"en\":\"Task force leader, described in the reports as director of national intelligence.\",\"zh-TW\":\"工作小組領導人，報導稱其為國家情報總監。\"}},{\"term\":{\"en\":\"Stanley Woodward\",\"zh-TW\":\"史丹利·
