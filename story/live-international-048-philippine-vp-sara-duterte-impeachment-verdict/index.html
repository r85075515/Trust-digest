repared to accept whatever judgment the Senate impeachment court reaches in her ongoing trial over allegations of corruption, unexplained wealth, and misuse of public funds.\n\nSpeaking ahead of defense hearings scheduled for December 1 to 4—where her dentist and a Bureau of Customs deputy commissioner are expected to testify—Duterte ruled out stepping down voluntarily. She remarked that she would only consider resigning if faced with a third impeachment complaint because she could no longer afford legal fees, adding that critics could imprison her if they wished. She also noted she remains uncertain about attending the verdict in person due to scheduled activities in Davao in December.\n\nWhile the Senate has not set an official conclusion date, House prosecution panel member Rep. Gerville Luistro expressed hope that the trial will wrap up by December 18. The impeachment marks the sharpest escalation in the political rift between Duterte and President Ferdinand Marcos Jr., who ran together on a winning ticket in 2022 before their alliance collapsed.\n\nTrust label: Multi-source agreement — Philstar, Inquirer, and McClatchy report consistent statements from Sara Duterte on her impeachment trial."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-048-philippine-vp-sara-duterte-impeachment-verdict\",\"category\":\"international\",\"title\":{\"en\":\"Philippine Vice President Sara Duterte Says She Is Ready for Senate Impeachment Verdict\",\"zh-TW\":\"菲律賓副總統薩拉・杜特蒂稱已準備好接受參議院彈劾判決 辭職不在選項內\"},\"summary\":{\"en\":\"Philippine Vice President Sara Duterte stated she will accept whatever verdict the Senate impeachment court hands down in her corruption and misuse-of-funds trial, ruling out resignation ahead of scheduled December defense hearings.\",\"zh-TW\":\"面臨貪腐與濫用公帑指控的菲律賓副總統薩拉・杜特蒂（Sara Duterte）表示，無論參議院彈劾法庭最終做出何種判決她都會接受，並重申辭職「絕不可能」。參議院將於 12 月初續開聽證會，檢方盼能在 12 月 18 日前結案。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n正在接受菲律賓參議院彈劾審判的副總統薩拉・杜特蒂（Sara Duterte）公開表態，無論彈劾法庭針對其貪腐、來源不明財產及濫用公帑指控做出何種裁決，她都已做好心理準備並將予以接受，同時斷然排除主動辭職的可能性。參議院彈劾法庭已排定 12 月 1 日至 4 日舉行聽證會，傳喚杜特蒂的牙醫及海關局副局長出庭作證。\\n\\n「為什麼重要」\\n這場彈劾審判是薩拉・杜特蒂與總統小馬可仕（Ferdinand Marcos Jr.）政治決裂的最高峰——兩人曾於 2022 年搭檔贏得大選，但執政後關係徹底破裂。由於小馬可仕受憲法單一任期限制不得於 2028 年連任，若杜特蒂遭參議院定罪罷免並褫奪公權，將直接改寫菲律賓 2028 年總統大選的權力版圖。\\n\\n「來源異同」\\n菲律賓星報（Philstar）、菲律賓每日問詢者報（INQUIRER.net）與美媒麥克拉奇報系（Macon Telegraph）報導的立場與事實高度一致。Philstar 詳細記錄了杜特蒂關於「若再遭第三次彈劾恐因付不起律師費而辭職」及 12 月 1 日至 4 日證人名單的說法；INQUIRER.net 補充眾議院檢察團成員路易斯特羅（Gerville Luistro）盼審判於 12 月 18 日結束的時程目標；Macon Telegraph 則點出她另案面臨重大威脅罪刑事指控的背景。\\n\\n「仍不確定」\\n參議院彈劾法庭是否能如眾議院檢方預期在 12 月 18 日前完成全部審理與表決、杜特蒂屆時是否會親自出庭聆聽判決，以及最終票數是否達到定罪門檻，目前均未定案。\"},\"glossary\":[{\"term\":{\"en\":\"Senate impeachment court\",\"zh-TW\":\"參議院彈劾法庭\"},\"blurb\":{\"en\":\"The constitutional tribunal formed by the Philippine Senate to try and decide impeachment cases brought by the House of Representatives.\",\"zh-TW\":\"依據菲律賓憲法由參議院組成的審判機構，負責審理並裁決眾議院通過的政府高官彈劾案。\"}},{\"term\":{\"en\":\"Articles of impeachment\",\"zh-TW\":\"彈劾條款\"},\"blurb\":{\"en\":\"The formal written charges brought against a public official in an impeachment proceeding.\",\"zh-TW\":\"在彈劾程序中針對公職人員違法失職行為所提出的正式書面指控罪狀。\"}},{\"term\":{\"en\":\"Unexplained wealth\",\"zh-TW\":\"來源不明財產\"},\"blurb\":{\"en\":\"Assets or income held by a public official that are disproportionate to their lawful earnings and lack a legitimate explanation.\",\"zh-TW\":\"公職人員名下與其合法薪資收入顯不相當、且無法提出正當來源證明的資產。\"}}],\"sources\":[{\"name\":\"Philstar.com\",\"url\":\"https://www.philstar.com/headlines/2026/11/27/2573060/vp-sara-duterte-we-will-accept-whatever-impeachment-verdict\"},{\"name\":\"INQUIRER.net\",\"url\":\"https://newsinfo.inquirer.net/2348198/vp-duterte-prepared-for-verdict-of-senate-impeachment-court\"},{\"name\":\"The Macon Telegraph\",\"url\":\"https://www.macon.com/news/nation-world/world/article318275385.html\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"Philippine Vice President Sara Duterte speaking during Senate proceedings in Manila\",\"zh-TW\":\"出席菲律賓參議院議程的副總統薩拉・杜特蒂\"},\"isHeadline\":false,\"isPopular\":true,\"trustScore\":85,\"trustBreakdown\":{\"crossCorroboration\":22,\"outletReputation\":21,\"recencyClarity\":22,\"sourceDiversity\":20},\"publishedAt\":\"2026-11-27T14:15:54.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":4,\"D2\":4,\"D3\":4,\"D4\":4,\"D5\":4,\"total\":20},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-international-048-philippine-vp-sara-duterte-impeachment-verdict/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-international-048-philippine-vp-sara-duterte-impeachment-verdict/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"d:\"$8:metadata\"\n"])</script></body></html>
