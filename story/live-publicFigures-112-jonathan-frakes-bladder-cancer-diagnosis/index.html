n \"Star Trek: The Next Generation,\" publicly disclosed that he has been undergoing treatment for bladder cancer. Speaking on the podcast \"Dropping Names with Brent and Jonny,\" the 74-year-old actor recounted that he first noticed blood in his urine—describing it as pink urine—during a morning at a fan convention, which prompted him to seek medical testing. Subsequent evaluation, including a cystoscopy, resulted in a diagnosis of high-grade non-muscle-invasive bladder cancer.\n\nFrakes's candid disclosure draws public attention to urological warning signs that are frequently overlooked or delayed in clinical evaluation. Because non-muscle-invasive bladder cancer is confined to the inner lining of the bladder wall, prompt diagnosis upon noticing hematuria significantly improves clinical management options compared with advanced-stage disease.\n\nEntertainment and mainstream news outlets including the Los Angeles Times, The Daily Beast, and Reader's Digest consistently report the core facts from Frakes's podcast interview, including the initial symptom of blood in his urine and the resulting bladder cancer diagnosis. Outlets vary primarily in headline framing, with some emphasizing his iconic \"Star Trek\" role and others focusing on the physical symptom that prompted his doctor visit.\n\nDetails regarding his ongoing maintenance therapy schedule, long-term recurrence monitoring results, and whether his treatment will affect upcoming directing or acting commitments have not been fully disclosed.\n\nTrust label: Multi-source agreement — Firsthand podcast remarks reported consistently by the Los Angeles Times, The Daily Beast, and Reader's Digest."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-publicFigures-112-jonathan-frakes-bladder-cancer-diagnosis\",\"category\":\"publicFigures\",\"title\":{\"en\":\"Star Trek Actor Jonathan Frakes Reveals Private Battle With Bladder Cancer\",\"zh-TW\":\"《星際爭霸戰》男星強納森・佛瑞克斯公開抗癌經歷 確診早期膀胱癌\"},\"summary\":{\"en\":\"Actor and director Jonathan Frakes, best known as Commander William Riker on Star Trek: The Next Generation, revealed he was diagnosed with high-grade non-muscle-invasive bladder cancer after noticing blood in his urine. Takeaway: Early medical evaluation following a warning symptom led to timely diagnosis and treatment.\",\"zh-TW\":\"以影集《星際爭霸戰：銀河飛龍》中「瑞克中校」聞名的美國演員暨導演強納森・佛瑞克斯（Jonathan Frakes）公開透露，自己先前因發現血尿就醫，經檢查確診高惡性度非肌肉侵犯性膀胱癌。一句重點結論：出現異常警訊後及早接受內視鏡檢查，使病情得以在未擴散前及時發現並治療。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n以經典科幻影集《星際爭霸戰：銀河飛龍》（Star Trek: The Next Generation）中「威廉・瑞克中校」一角深植人心的美國演員暨導演強納森・佛瑞克斯（Jonathan Frakes），在播客節目《Dropping Names with Brent and Jonny》中首度公開抗癌經歷。現年 74 歲的佛瑞克斯表示，他日前出席粉絲見面會期間，某天早晨發現尿液呈現粉紅色血尿症狀，隨即安排就醫並接受膀胱鏡檢查，最終確診為高惡性度非肌肉侵犯性膀胱癌。\\n\\n「為什麼重要」\\n佛瑞克斯坦率分享個人病史，喚起大眾對泌尿道異常出血警訊的重視。非肌肉侵犯性膀胱癌尚侷限於膀胱內壁表層，在出現血尿初期即就醫確診，有助於在腫瘤侵犯肌層前及時介入治療並控制病程。\\n\\n「來源異同」\\n《洛杉磯時報》（Los Angeles Times）、《每日野獸》（The Daily Beast）與《讀者文摘》（Reader's Digest）均引述同一集播客訪談內容，對他因血尿就醫並確診膀胱癌的事實陳述一致。各家媒體差異僅在於標題切角，部分側重其「星際爭霸戰」代表作身分，部分則聚焦引發就醫的身體警訊。\\n\\n「仍不確定」\\n佛瑞克斯後續維持性治療的具體療程安排、定期追蹤結果，以及治療是否影響他未來的導演與演出工作檔期，目前尚未有進一步公開說明。\"},\"glossary\":[{\"term\":{\"en\":\"Non-Muscle-Invasive Bladder Cancer\",\"zh-TW\":\"非肌肉侵犯性膀胱癌\"},\"blurb\":{\"en\":\"Early-stage bladder cancer where tumor cells remain confined to the inner lining (urothelium) and have not grown into the deeper muscle wall.\",\"zh-TW\":\"癌細胞仍侷限於膀胱內壁黏膜層、尚未深入侵犯膀胱肌肉層的早期膀胱癌類型。\"}},{\"term\":{\"en\":\"Cystoscopy\",\"zh-TW\":\"膀胱鏡檢查\"},\"blurb\":{\"en\":\"A diagnostic procedure in which a doctor uses a thin, lighted scope to examine the inside lining of the urethra and bladder.\",\"zh-TW\":\"醫師透過細長內視鏡經尿道進入膀胱，直接檢視尿道與膀胱內壁黏膜病變的臨床診斷程序。\"}},{\"term\":{\"en\":\"Hematuria\",\"zh-TW\":\"血尿\"},\"blurb\":{\"en\":\"The presence of blood in urine, which may turn urine pink, red, or brownish and requires medical evaluation to rule out urological conditions.\",\"zh-TW\":\"尿液中含有紅血球的臨床表現，可能使尿液呈現粉紅或紅色，需就醫排查泌尿系統疾病。\"}}],\"sources\":[{\"name\":\"
