for advancing 6G network construction when appropriate, deploying 5G-A and 10-gigabit optical networks in key areas, accelerating low-orbit satellite internet and ultra-high-speed optical communications, and pushing forward legislation including a Telecom Law and a Radio Spectrum Resources Law.\n\n「Why it matters」 Next-generation wireless, satellite internet, and high-speed optical networks underpin future industrial digital infrastructure and cross-regional computing integration. Pairing technical rollout targets with legal framework drafting signals an effort to align network deployment with regulatory rules.\n\n「Source differences」 Coverage from Xinhua and China Securities Journal highlights the 2030 network goal, 6G and low-orbit satellite internet deployment, and legislative pushes such as the Telecom Law, with China Securities Journal also noting the Radio Spectrum Resources Law. Source titles: \"加强新一代通信网规划建设三部门印发实施方案\" and \"新一代通信网建设迎来“施工图”\".\n\n「Still uncertain」 Specific implementation timelines, regional pilot lists, and final legislative schedules remain subject to subsequent rollout details and rulemaking.\n\nTrust label: Single source. Multiple outlets report on the same three-ministry implementation plan release."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-tech-239-next-gen-telecom-plan\",\"category\":\"tech\",\"title\":{\"en\":\"Three Chinese Ministries Roll Out Next-Generation Telecom Network Plan Targeting 2030\",\"zh-TW\":\"中國三部門發布《新一代通信网建设实施方案》 鎖定 2030 年目標並推進 6G 與電信法\"},\"summary\":{\"en\":\"Three Chinese ministries issued a plan to build a next-generation communications network by 2030, advancing 6G, 5G-A, low-orbit satellite internet, and telecom legislation. Key takeaway: China is setting a formal 2030 infrastructure and legal roadmap for next-generation connectivity.\",\"zh-TW\":\"中國三部門發布《新一代通信网建设实施方案》，提出到 2030 年建成覆蓋完善、性能領先的新一代通信網，並推進 6G、5G-A、低軌衛星網路與電信法制定。關鍵結論：中國已為次世代通訊基建與相關法制訂出明確的 2030 年推進藍圖。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」中國三部門印發《新一代通信网建设实施方案》，提出到 2030 年建成覆蓋完善、性能領先的新一代通信網。方案內容涵蓋適時開展 6G 網路建設、在重點區域部署應用 5G-A 與萬兆光網、加快低軌衛星網際網路與超高速光通訊及算網融合，並推動制定電信法、無線電頻譜資源法等法律法規。\\n\\n「為什麼重要」次世代行動通訊、低軌衛星與高速光纖是數位基建與跨區域算力協同的重要底座。將技術推進方向與電信法等立法工作並列，顯示官方正同步布局網路建設與法規治理框架。\\n\\n「來源異同」新華網與中國證券報均報導三部門印發的方案重點，涵蓋 2030 年目標、6G 與低軌衛星網際網路推進及電信法等立法方向，中國證券報並提及無線電頻譜資源法。來源標題：「加强新一代通信网规划建设三部门印发实施方案」與「新一代通信网建设迎来“施工图”」。\\n\\n「仍不確定」各階段具體落地時程、重點試點地區名單，以及電信法等法規的審議進度仍有待後續細則與立法程序明朗。\\n\\nTrust label: Single source. 多家媒體報導同一份三部門實施方案發布內容。\"},\"glossary\":[{\"term\":{\"en\":\"6G\",\"zh-TW\":\"6G\"},\"blurb\":{\"en\":\"The sixth generation of wireless communications technology following 5G and 5G-A.\",\"zh-TW\":\"繼 5G 與 5G-A 之後的第六代無線通訊技術方向。\"}},{\"term\":{\"en\":\"5G-A\",\"zh-TW\":\"5G-A\"},\"blurb\":{\"en\":\"An intermediate evolution of 5G wireless networks offering higher speeds and capabilities ahead of 6G.\",\"zh-TW\":\"介於 5G 與 6G 之間的演進通訊技術，強調更高傳輸效能與應用能力。\"}},{\"term\":{\"en\":\"Low-orbit satellite internet\",\"zh-TW\":\"低軌衛星網際網路\"},\"blurb\":{\"en\":\"Satellite communications systems operating in low Earth orbit to provide broadband coverage and connectivity.\",\"zh-TW\":\"利用低地球軌道衛星提供網路通訊與覆蓋的系統。\"}}],\"sources\":[{\"name\":\"新华网\",\"url\":\"https://www.xinhuanet.com/20261126/4b41d4626cd0403491defec351fc168a/c.html\"},{\"name\":\"中国证券报\",\"url\":\"https://www.cs.com.cn/xwzx/01/2026/11/27/detail_2026112710055037.html\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"Three Chinese Ministries Roll Out Next-Generation Telecom Network Plan Targeting 2030\",\"zh-TW\":\"中國三部門發布《新一代通信网建设实施方案》 鎖定 2030 年目標並推進 6G 與電信法\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":68,\"trustBreakdown\":{\"crossCorroboration\":18,\"outletReputation\":22,\"recencyClarity\":18,\"sourceDiversity\":10},\"publishedAt\":\"2026-11-27T21:31:13.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":20,\"D2\":19,\"D3\":20,\"D4\":18,\"D5\":19,\"total\":19},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"
