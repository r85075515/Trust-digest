earch, reported by TechNews, found that the nodules on the Pacific seabed are not just a source of nickel, cobalt and copper; their interiors shelter thousands of microscopic organisms. The finding reframes the rocks as homes in their own right, not inert lumps of ore, and raises the stakes for any plan to scoop them from the ocean floor.\n\nWhy it matters\nManganese nodules are attractive precisely because they pack battery metals in one place, but if each nodule is also a small ecosystem, mining them trades one climate asset — the metals for batteries — against another: deep-sea life that cannot move elsewhere. That tradeoff sits at the centre of the deep-sea mining debate.\n\nSources agree / disagree\nOnly TechNews has reported the finding in this cluster, so there is no second outlet to confirm the study's details or scale. Trust label: Single source — one outlet reporting one study, with no independent corroboration in this cluster.\n\nStill uncertain\nThe snippet names no study, journal, research team or Pacific location, and gives no sample size, species breakdown or estimate of how much habitat mining would remove. Verify the study itself before citing the finding as established."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-03-he0bb5984\",\"category\":\"semiconductor\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-semiconductor-03-he0bb5984.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 研究發現太平洋錳結核內藏數千隻微型生物，深海採礦恐摧毀專屬棲地\",\"zh-TW\":\"相關封面圖：研究發現太平洋錳結核內藏數千隻微型生物，深海採礦恐摧毀專屬棲地\"},\"publishedAt\":\"2026-11-21T08:30:29.000Z\",\"title\":{\"en\":\"Pacific Manganese Nodules Shelter Thousands of Tiny Creatures, Study Finds\",\"zh-TW\":\"研究：太平洋錳結核內藏數千隻微型生物，深海採礦恐摧毀棲地\"},\"summary\":{\"en\":\"[Unconfirmed · Single source] A study finds Pacific manganese nodules — prized for nickel, cobalt and copper — shelter thousands of tiny creatures inside, making the rocks a habitat that deep-sea mining could destroy. Only TechNews has reported the finding so far. Takeaway: the mining target is also a home; any extraction debate must weigh what lives inside the rocks.\",\"zh-TW\":\"［未證實·單一來源］最新研究發現，太平洋海底錳結核不只是鎳、鈷、銅礦源，結核內部還藏著數千隻微型生物，本身就是棲地，深海採礦可能一併摧毀。目前僅科技新報（TechNews）報導。takeaway：想挖的礦石也是別人的家，開採爭議不能只算金屬價值。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"最新研究發現，太平洋海底的錳結核內部藏著數千隻微型生物——這些富含金屬的岩石正是深海採礦的目標，開採可能連棲地一起摧毀。\\n發生了什麼事\\n科技新報（TechNews）報導，這項研究指出，太平洋海底被視為採礦目標的錳結核不只是鎳、鈷、銅的礦源，結核內部還住著數千隻微型生物。這些岩石本身就是棲地，而不是沒有生命的礦石，任何把它們從海底撈走的計畫，都得面對這個事實。\\n為什麼重要\\n錳結核吸引人之處正在於把電池金屬集中在一處，但如果每顆結核都是一個小型生態系，開採就是拿一種氣候資產（電池金屬）去換另一種（無法搬家的深海生命）。這個取捨正是深海採礦爭議的核心。\\n來源異同\\n本批只有科技新報一家報導這項研究，沒有第二家媒體可確認研究的細節與規模。信任標籤：僅1源——單一媒體報導單一研究，本批內無其他來源佐證。\\n仍不確定\\n摘要未提供研究名稱、期刊、研究團隊或太平洋的具體位置，也沒有樣本數、物種組成，或開採會移除多少棲地的估算。引用這項發現前請先查證研究本身。\"},\"sources\":[{\"name\":\"TechNews 科技新報\",\"url\":\"https://technews.tw/2026/11/21/deep-sea-mining-targets-rocks-that-are-habitats-inside-and-out/\"}],\"disagreements\":null,\"trustScore\":47,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":10,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"semiconductor\",\"live-ingest\",\"technews-科技新報\"],\"glossary\":[{\"term\":{\"en\":\"Manganese nodules\",\"zh-TW\":\"錳結核\"},\"blurb\":{\"en\":\"Metal-rich rocks on the Pacific seabed that shelter tiny creatures inside.\",\"zh-TW\":\"太平洋海底富含金屬的岩石，內部藏有微型生物。\"}},{\"term\":{\"en\":\"Deep-sea mining\",\"zh-TW\":\"深海採礦\"},\"blurb\":{\"en\":\"Extraction of minerals from the ocean floor, threatening nodule habitats.\",\"zh-TW\":\"從海底開採礦物的行為，威脅錳結核棲地。\"}},{\"term\":{\"en\":\"TechNews\",\"zh-TW\":\"科技新報\"},\"blurb\":{\"en\":\"Taiwanese tech news outlet that reported the study.\",\"zh-TW\":\"報導本研究的台灣科技新聞媒體。\"}},{\"term\":{\"en\":\"Nickel\",\"zh-TW\":\"鎳\"},\"blurb\":{\"en\":\"Battery metal found in manganese nodules.\",\"zh-TW\":\"錳結核中含有的電池金屬。\"}},{\"term\":{\"en\":\"Cobalt\",\"zh-TW\":\"鈷\"},\"blurb\":{\"en\":\"Battery metal found in manganese nodules.\",\"zh-TW\":\"錳結核中含
