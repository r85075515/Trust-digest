",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"id\",\"live-semiconductor-16-lutnick-senate-testimony\",\"d\"],[\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$L2\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L3\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[\"__PAGE__\",[\"$\",\"$1\",\"c\",{\"children\":[\"$L4\",null,[\"$\",\"$L5\",null,{\"children\":[\"$L6\",[\"$\",\"$L7\",null,{\"promise\":\"$@8\"}]]}]]}],{},null,false]},null,false]},null,false]},null,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[[\"$\",\"$L9\",null,{\"children\":\"$La\"}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]],[\"$\",\"$Lb\",null,{\"children\":[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$c\",null,{\"fallback\":null,\"children\":\"$Ld\"}]}]}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$e\",[]],\"s\":false,\"S\":true}\n"])</script><script>self.__next_f.push([1,"f:I[8587,[\"619\",\"static/chunks/619-ba102abea3e3d0e4.js\",\"523\",\"static/chunks/523-9d0ba1348220a1ce.js\",\"954\",\"static/chunks/app/story/%5Bid%5D/page-b37b1e31acb17fd9.js\"],\"default\"]\n10:Td5d,"])</script><script>self.__next_f.push([1,"The Nvidia scandal reached the cabinet on Thursday (Nov 12). Senate Banking Committee Chairman Tim Scott sent letters to Commerce Secretary Howard Lutnick and to former Nvidia CEO Jensen Huang asking both to testify, and Lutnick's spokesperson said the secretary had already agreed to appear voluntarily - his hearing is set for Dec 10, a public session on the Nvidia reports and the Commerce Department's role in matters of national security. Scott, a Republican, said he would consider subpoenaing Huang if he does not appear voluntarily; per Politico, Huang's Senate date is Dec 3. December is now a testimony gauntlet for everyone in this story, and Reuters reports senior White House officials have separately discussed whether Lutnick should be pushed out.\nWhat happened\nScott posted the rationale on X: 'Recent reports raise serious concerns about our national security and the protection of sensitive US technology.' The pressure on Lutnick is specific: his department licenses chip exports, and he has drawn bipartisan criticism for the administration's refusal to add dozens of Chinese companies to the Entity List and for its oversight of Nvidia's exports to China - the same pipeline through which Megaspeed, Alice Huang's firm, held privileged access. The House track hardened in parallel: the three House chairmen wrote to Huang and Nvidia general counsel Tim Teter requiring closed-door transcribed interviews on Dec 1 and Dec 2 respectively, or subpoenas, and asked Commerce Under Secretary Jeffrey Kessler to testify Dec 3. Attorney General Todd Blanche, notably, said Thursday the Justice Department has not yet reached a conclusion on whether Alice Huang is a spy at all.\nWhy it matters\nUntil today this was a corporate scandal with political weather. A cabinet secretary testifying under bipartisan pressure - summoned by a chairman of the president's own party - makes it a government accountability case: who approved what exports, who kept Megaspeed off the blacklist, and who in the administration knew about the Huang-Alice Huang relationship and when (the White House was briefed in the spring, per the Times). Lutnick answering in public on Dec 10, a week after Huang's Senate appearance, sets up a sworn-record collision if their accounts differ. The takeaway: Huang lost his job in a day; the question December answers is whether the administration's China-chip policy - and the men who ran it - survive the same scrutiny.\nSources agree / disagree\nReuters, NBC News, Politico and Newsmax agree on the core: Scott's Thursday letters, Lutnick's voluntary agreement, Dec 10 public hearing, Dec 3 for Huang, subpoena held in reserve for Huang only. Sequencing details vary: Mast's 'briefing before Thanksgiving' formulation (card 13) now sits alongside formal House letters specifying Dec 1-2 transcribed interviews - treat the House date as unsettled. The White House push-out discussions rest on two anonymous sources via Reuters. Trust label: Multi-source agreement; personnel speculation anonymous.\nStill uncertain\nWhether Huang accepts the Senate's Dec 3 date or forces the subpoena question; whether the House interviews land Dec 1-2 or before Thanksgiving as Mast said; what Lutnick knew about Megaspeed and the relationship, and when; whether the White House moves against Lutnick before he testifies; and what Blanche's 'no conclusion' means for any eventual charges against Alice Huang."])</script><script>self.__next_f.push([1,"11:Tbf1,"])</script><script>self.__next_f.push([1,"輝達醜聞週四（11 月 12 日）燒進內閣。參議院銀行委員會主席史考特（Tim Scott）分別致函商務部長盧特尼克（Howard Lutnick）與輝達前執行長黃仁勳，要求兩人作證；盧特尼克的發言人表示部長已主動同意自願出席——他的聽證定於 12 月 10 日，公開進行，主題是輝達相關報導與商務部在國家安全事務中的角色。共和黨籍的史考特說，黃仁勳若不自願出席，他會考慮發傳票；據 Politico，黃在參院的日期是 12 月 3 日。12 月如今成了這起事件所有人的作證馬拉松；路透另報導，白宮高層已私下討論是否要逼盧特尼克下台。\n發生了什麼事\n史考特在 X 上寫明理由：「近期報導引發對國家安全與美國敏感技術保護的嚴重關切。」盧特尼克承受的壓力很具體：晶片出口許可歸他的部門核發，而他因政府拒絕把數十家中國企業列入實體清單、以及對輝達輸中出口的監管，招致跨黨派批評——黃樂的 Megaspeed 正是透過同一條管線取得特權管道。眾院戰線同步升級：三位眾院主席致函黃仁勳與輝達法務長泰特（Tim Teter），要求兩人分別於 12 月 1 日、2 日接受閉門逐字稿訪談，否則發傳票，並要求商務部次長凱斯勒（Jeffrey Kessler）12 月 3 日作證。值得注意的是，司法部長布蘭奇（Todd Blanche）週四表示，司法部對黃樂是否為間諜「尚未得出結論」。\n為什麼重要\n在今天之前，這是帶著政治天氣的企業醜聞。內閣部長在跨黨派壓力下作證——而且召他的是總統同黨的主席——案子就變成政府究責案：哪些出口是誰批准的、誰讓 Megaspeed 不進黑名單、政府裡誰知道黃仁勳與黃樂的關係、何時知道（據《紐時》，白宮春季就已收到簡報）。盧特尼克 12 月 10 日公開作證、在黃仁勳參院作證一週之後，若兩人 under oath 的說法對不上，就是宣誓紀錄的正面相撞。結論是：黃仁勳一天丟了工作；12 月要回答的是，這屆政府的對中晶片政策——以及執行它的人——能否熬過同樣的檢視。\n來源異同\n路透、NBC、Politico 與 Newsmax 對核心一致：史考特週四的信、盧特尼克自願同意、12 月 10 日公開聽證、黃 12 月 3 日、傳票只為黃保留。時序細節有出入：馬斯特「感恩節前簡報」的說法（第 13 號卡）如今與眾院正式信函指定的 12 月 1–2 日訪談並存，眾院日期視為未定。白宮逼退討論來自路透的兩名匿名消息人士。信任標籤：多來源一致；人事揣測屬匿名來源。\n仍不確定\n黃仁勳是否接受參院 12 月 3 日、還是逼出傳票問題；眾院訪談落在 12 月 1–2 日還是如馬斯特所說感恩節前；盧特尼克對 Megaspeed 與那段關係知道多少、何時知道；白宮會不會在他作證前先動手；以及布蘭奇的「尚無結論」對黃樂日後是否被起訴意味著什麼。"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"adult\":false,\"body\":{\"en\":\"$10\",\"zh-TW\":\"$11\"},\"category\":\"semiconductor\",\"disagreements\":null,\"glossary\":[{\"blurb\":{\"en\":\"U.S. Secretary of Commerce since 2025; his department licenses advanced-chip exports. He agreed to testify publicly on Dec 10 about Nvidia and export controls, amid bipartisan criticism and reported White House discussions about pushing him out.\",\"zh-TW\":\"2025 年起任美國商務部長，先進晶片出口許可歸其部門核發。已同意 12 月 10 日公開作證說明輝達與出口管制，正面臨跨黨派批評與白宮逼退傳聞。\"},\"term\":{\"en\":\"Howard Lutnick\",\"zh-TW\":\"霍華德·盧特尼克（Howard Lutnick）\"}},{\"blurb\":{\"en\":\"Republican chairman of the Senate Banking Committee; on Nov 12 he wrote to Lutnick and Huang requesting testimony (Dec 10 and Dec 3), saying he would consider a subpoena for Huang.\",\"zh-TW\":\"參議院銀行委員會共和黨主席；11 月 12 日致函盧特尼克與黃仁勳要求作證（12 月 10 日與 12 月 3 日），並稱會考慮對黃發傳票。\"},\"term\":{\"en\":\"Tim Scott\",\"zh-TW\":\"提姆·史考特（Tim Scott）\"}},{\"blurb\":{\"en\":\"The U.S. Commerce Department's trade blacklist; the administration's refusal to add dozens of Chinese firms to it is a central criticism Lutnick must answer for.\",\"zh-TW\":\"美國商務部的貿易黑名單；政府拒絕將數十家中國企業列入，是盧特尼克必須面對的核心批評之一。\"},\"term\":{\"en\":\"Entity List\",\"zh-TW\":\"實體清單（Entity List）\"}}],\"id\":\"live-semiconductor-16-lutnick-senate-testimony\",\"imageAlt\":{\"en\":\"\",\"zh-TW\":\"\"},\"imageUrl\":\"\",\"isHeadline\":true,\"isPopular\":true,\"publishedAt\":\"2026-11-13T04:30:02.000Z\",\"sources\":[{\"name\":\"Reuters (via KTWB)\",\"url\":\"https://ktwb.com/2026/11/12/us-senate-banking-committee-chair-calls-on-jensen-huang-lutnick-to-testify/\"},{\"name\":\"ENM News\",\"url\":\"https://enmnews.com/2026/11/12/lutnick-caves-pressure-nvidia-firestorm-widens\"},{\"name\":\"Nakoda News (Politico details)\",\"url\":\"https://news.nakoda.ai/article/tim-scott-asks-huang-lutnick-testify-congress-nvidia-inquiry\"}],\"summary\":{\"en\":\"Senate Banking Chairman Tim Scott on Thursday asked Commerce Secretary Howard Lutnick and Jensen Huang to testify over the Nvidia scandal; Lutnick agreed voluntarily and faces a public hearing Dec 10 on export controls and Commerce's role, while Huang's Senate date is Dec 3 with a subpoena in reserve. House committees separately set Dec 1-2 transcribed interviews for Huang and Nvidia's general counsel. Reuters reports White House officials have discussed pushing Lutnick out, and the attorney general said DOJ has not concluded whether Alice Huang is a spy.\",\"zh-TW\":\"參院銀行委員會主席史考特（Tim Scott）週四要求商務部長盧特尼克（Howard Lutnick）與黃仁勳就輝達醜聞作證；盧特尼克已同意自願出席，12 月 10 日公開聽證面對出口管制與商務部角色；黃仁勳參院日期為 12 月 3 日，不到就發傳票。眾院另定 12 月 1–2 日對黃與輝達法務長做逐字稿訪談。路透報導白宮高層已討論逼盧特尼克下台；司法部長則稱對黃樂是否為間諜尚無結論。\"},\"tags\":[\"semiconductor\",\"live-ingest\",\"breaking\",\"nvidia\",\"lutnick\",\"congress\",\"export-controls\"],\"title\":{\"en\":\"Scandal Reaches the Cabinet: Commerce Secretary Lutnick to Testify Dec 10 as Senate Widens Nvidia Inquiry\",\"zh-TW\":\"醜聞燒進內閣：商務部長盧特尼克 12 月 10 日赴參院作證，白宮傳討論逼退\"},\"trustBreakdown\":{\"crossCorroboration\":20,\"outletReputation\":20,\"recencyClarity\":20,\"sourceDiversity\":20},\"trustScore\":80}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-semiconductor-16-lutnick-senate-testimony/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-sourc
