Black Friday deals on the Magic Mouse and iPhone 18 cases, and brought back all-time low pricing on AirTag 2 at $17.50. The M5 MacBook Air is now discounted by up to $250.\n\nWhy it matters\nEarly Black Friday sales now set the pace for holiday shopping, and the Apple discounts show the season's price floor arriving weeks before the day itself. AirTag 2 at $17.50 and $50 off AirPods Pro 3 are the kind of headline cuts that pull shoppers in early, and Best Buy's extra three-day event adds pressure on Amazon and other retailers to match prices.\n\nSources agree / disagree\nThe Apple-deals reporting comes from 9to5Toys, which covered both the Best Buy Doorbuster event and the Amazon offers. The second item in the cluster, from Engadget, covers an unrelated Apple Sports update on live UFC statistics and does not corroborate the deals. No price conflicts appear between the deal reports.\nTrust label: Single source — the deals themselves rest on 9to5Toys alone, and the Engadget item covers a different story.\n\nStill uncertain\nDeal prices and stock can change quickly during an early sale, and the material does not give end dates for the Amazon offers or the full list of discounted Apple models. The M5 MacBook Air discount is described as up to $250 without a breakdown by configuration. Shoppers should check the retailer pages for the current price before buying."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-tech-03-best-early-black-friday-\",\"category\":\"tech\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-tech-03-best-early-black-friday-.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Best early Black Friday Apple deals: AirTag 2, MacBook, AirPods, Apple Watch, more\",\"zh-TW\":\"相關封面圖：黑色星期五早期 Apple 最佳優惠：AirTag 2、MacBook、AirPods、Apple Watch 等\"},\"publishedAt\":\"2026-11-13T08:25:01.000Z\",\"title\":{\"en\":\"Apple Black Friday Deals Arrive Early With AirTag 2 at $17.50\",\"zh-TW\":\"蘋果（Apple）黑色星期五早鳥優惠開跑，AirTag 2 降至 17.50 美元\"},\"summary\":{\"en\":\"Black Friday deals on Apple gear are live, with AirTag 2 at an all-time low of $17.50, AirPods Pro 3 down $50, and the M5 MacBook Air discounted by up to $250. Best Buy has opened a Doorbuster sale, while Amazon has cut prices on the Magic Mouse and iPhone 18 cases. Prices may shift as the sales continue.\",\"zh-TW\":\"蘋果（Apple）黑色星期五早鳥優惠開跑：AirTag 2 降至歷史低點 17.50 美元，AirPods Pro 3 降價 50 美元，M5 MacBook Air 最高降價 250 美元。百思買（Best Buy）推出 Doorbuster 特賣，亞馬遜（Amazon）也調降 Magic Mouse 與 iPhone 18 保護殼價格，入手前宜先確認最新售價。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"想買蘋果（Apple）產品不必等到黑色星期五當天：AirPods、MacBook、AirTag 等早鳥優惠已在百思買（Best Buy）與亞馬遜（Amazon）開跑。焦點降價包括 AirTag 2 只要 17.50 美元、AirPods Pro 3 降價 50 美元，以及最新 M5 MacBook Air 最高降價 250 美元。\\n\\n發生了什麼事\\n9to5Toys 報導，百思買推出為期 3 天的假日 Doorbuster 特賣，在本週稍早開跑的第二週早鳥優惠之外，再加一波降價，涵蓋電視、Bose 喇叭、家電、PS5 儲存裝置、耳機等品類，以及蘋果產品。亞馬遜推出官方蘋果早鳥優惠，包括 Magic Mouse 與 iPhone 18 保護殼，AirTag 2 也回到歷史低價 17.50 美元。最新 M5 MacBook Air 現在最高降價 250 美元。\\n\\n為什麼重要\\n早鳥特賣如今決定了假日購物的節奏，蘋果產品的降價顯示本季的價格底線提前數週出現。AirTag 2 只要 17.50 美元、AirPods Pro 3 降價 50 美元，都是能提前吸引買氣的指標降價，百思買加碼 3 天特賣，也會迫使亞馬遜等其他零售商跟進比價。\\n\\n來源異同\\n蘋果優惠的報導來自 9to5Toys，同時涵蓋百思買 Doorbuster 活動與亞馬遜優惠。同一組素材中的另一則報導來自 Engadget，講的是 Apple Sports 新增 UFC 即時數據，與優惠無關，無法佐證價格。各優惠報導之間沒有價格衝突。\\n信任標籤：單一來源——優惠內容只來自 9to5Toys，Engadget 那則是不同新聞。\\n\\n仍不確定\\n早鳥特賣期間價格與庫存可能快速變動，素材沒有提供亞馬遜優惠的截止日期，也沒有列出全部降價的蘋果機型。M5 MacBook Air 的降價只寫最高 250 美元，沒有按規格細分，購買前宜先到零售商頁面確認最新售價。\"},\"sources\":[{\"name\":\"Engadget\",\"url\":\"https://www.engadget.com/2313383/apple-sports-adds-live-ufc-updates/\"},{\"name\":\"9to5Toys\",\"url\":\"https://9to5toys.com/2026/11/13/best-buy-update-giant-early-black-friday-new-3-day-doorbuster-deals/\"}],\"disagreements\":null,\"trustScore\":67,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":14,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"tech\",\"live-ingest\",\"engadget\",\"9to5toys\",\"9to5toys\"],\"glossary\":[{\"blurb\":{\"en\":\"U.S. technology compan
