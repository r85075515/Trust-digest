 engines alongside chips — can be mass-produced, TrendForce says four barriers must first be broken through.\nWhy it matters\nAn 18-fold demand jump in three years would strain any supply chain, and the four hurdles are the gating factor between a forecast and a real market. If the barriers fall, CPO moves from lab demonstrations to volume shipments, and the companies that solve packaging, yield and testing first will set the terms. If they do not, the optical engine shortfall becomes a bottleneck for AI hardware.\nSources agree / disagree\nThis card rests on a single TechNews report, so there is no second outlet to check the 18-fold forecast or the four hurdles against. Trust label: Single source — one outlet reported the forecast.\nStill uncertain\nThe feed snippet does not name the four hurdles, give the baseline year for the 18-fold growth, or say which companies TrendForce named. Verify details in the full reporting before quoting specifics."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-01-2028-18-trendforce-cpo\",\"category\":\"semiconductor\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-semiconductor-01-2028-18-trendforce-cpo.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 2028 年光引擎需求暴增 18 倍！TrendForce 點名 CPO 量產「四大關卡」先突破\",\"zh-TW\":\"相關封面圖：2028 年光引擎需求暴增 18 倍！TrendForce 點名 CPO 量產「四大關卡」先突破\"},\"publishedAt\":\"2026-11-05T07:41:47.000Z\",\"title\":{\"en\":\"TrendForce: Optical Engine Demand to Surge 18-Fold by 2028 as CPO Nears Mass Production\",\"zh-TW\":\"TrendForce：2028 年光引擎需求暴增 18 倍，CPO 量產先過四大關卡\"},\"summary\":{\"en\":\"[Unconfirmed — single source] TrendForce forecasts optical engine demand will surge 18-fold by 2028 and says makers must first clear four hurdles to mass-produce co-packaged optics (CPO). The research firm presented the outlook at a 2027 tech industry forecast event co-hosted with Capital Securities on November 5.\",\"zh-TW\":\"［未證實·單一來源］研調機構集邦科技（TrendForce）預測 2028 年光引擎需求暴增 18 倍，點名 CPO 量產前必須先突破四大關卡。相關展望在 11 月 5 日與群益證券（Capital Securities）合辦的 2027 科技產業大預測活動上提出。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"研調機構集邦科技（TrendForce）預測 2028 年光引擎需求暴增 18 倍，點名 CPO 量產前必須先突破四大關卡。科技新報（TechNews）11 月 5 日自 2027 科技產業大預測活動報導。\\n發生了什麼事\\n集邦科技與群益證券（Capital Securities）11 月 5 日共同舉辦 2027 科技產業大預測活動，集邦科技在會中提出光引擎展望。光引擎需求預計到 2028 年成長 18 倍，動能來自 AI 基礎建設擴建。CPO 是把光引擎與晶片封裝在一起的技術，集邦科技指出，量產之前必須先突破四大關卡。\\n為什麼重要\\n三年內需求暴增 18 倍，任何供應鏈都會吃緊，四大關卡就是預測與真實市場之間的門檻。關卡一過，CPO 就從實驗室展示走向大量出貨，最先解決封裝、良率與測試問題的業者將握有話語權。關卡過不了，光引擎缺口就會成為 AI 硬體的瓶頸。\\n來源異同\\n本卡只有科技新報一篇報導，沒有第二家媒體可以核對 18 倍預測或四大關卡。信任標籤：單一來源——只有一家媒體報導這項預測。\\n仍不確定\\n來源摘要沒有寫明四大關卡是什麼、18 倍成長的比較基準是哪一年，也沒說集邦科技點名了哪些業者；引用細節前請查閱完整報導。\"},\"sources\":[{\"name\":\"TechNews 科技新報\",\"url\":\"https://technews.tw/2026/11/05/trendforce-2027-annual-forecast-cpo/\"}],\"disagreements\":null,\"trustScore\":47,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":10,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"semiconductor\",\"live-ingest\",\"technews-科技新報\"],\"glossary\":[{\"term\":{\"en\":\"TrendForce\",\"zh-TW\":\"集邦科技\"},\"blurb\":{\"en\":\"Taiwan-based research firm that forecast the 18-fold optical engine demand growth.\",\"zh-TW\":\"預測光引擎需求成長 18 倍的台灣研調機構。\"}},{\"term\":{\"en\":\"Capital Securities\",\"zh-TW\":\"群益證券\"},\"blurb\":{\"en\":\"Taiwanese securities firm that co-hosted the 2027 tech forecast event.\",\"zh-TW\":\"合辦 2027 科技產業大預測活動的台灣證券公司。\"}},{\"term\":{\"en\":\"CPO\",\"zh-TW\":\"CPO\"},\"blurb\":{\"en\":\"Co-packaged optics, technology that packs optical engines alongside chips.\",\"zh-TW\":\"共同封裝光學技術，把光引擎與晶片封裝在一起。\"}},{\"term\":{\"en\":\"Optical engine\",\"zh-TW\":\"光引擎\"},\"blurb\":{\"en\":\"The optical component whose demand TrendForce expects to surge 18-fold by 2028.\",\"zh-TW\":\"集邦科技預測 2028 年需求暴增 18 倍的光學元件。\"}},{\"term\":{\"en\":\"TechNews\",\"zh-TW\":\"科技新報\"},\"blurb\":{\"en\":\"Taiwanese technology news outlet, the sole source for this card.\",\"zh-TW\":\"報導這項預測的台灣科技新聞媒體，本卡的唯
