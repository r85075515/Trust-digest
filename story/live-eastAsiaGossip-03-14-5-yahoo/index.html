 location in New Zealand, with a helicopter ride to snowy and fjord scenery where the proposal reportedly succeeded. The couple were then said to be planning a small, no-budget-limit dream wedding in New Zealand. Against the marriage reports, one headline quotes the response attributed to the manager as a denial that the registration happened. The headlines also repeatedly mention a very short manager response, described as five characters in one headline.\n\nWhy it matters\nThe conflicting headlines show how celebrity marriage news can spread before it is confirmed: registration reports, a cancelled overseas wedding, and a denial are circulating at the same time. For readers, the key point is that the couple's actual status is not settled by these snippets. The long public history described in the coverage, a 14-year relationship and a widely reported proposal trip, explains the intense attention, but attention is not confirmation.\n\nSources agree / disagree\nTrust label: Accounts differ — Some headlines report a completed registration while another reports the manager denying it, and others emphasize a cancelled New Zealand wedding instead.\nThe outlets agree on the background elements: the 14-year relationship, the New Zealand proposal trip, and the planned overseas wedding. They differ on the central question of whether a marriage registration has taken place and on whether the New Zealand wedding is proceeding or cancelled.\n\nStill uncertain\nThe snippets do not include a direct, full statement from Chen Bolin or Ting Hsuan, and the manager's response is conveyed only through short headline summaries that may not capture its full meaning. Whether the couple registered a marriage, postponed a wedding, or cancelled it cannot be determined from this material. The exact wording and context of the denial also remain unclear, so the marital status should be treated as unconfirmed."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"
