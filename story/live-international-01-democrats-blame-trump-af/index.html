petitive midterm map deep into Republican territory.\nWhat happened\nThe Times' economy desk reports Democrats pinning the inflation reading — led by energy prices — on Trump. The same feed batch carried a cluster of adjacent midterm stories: Democratic leaders and election groups filed a 44-page lawsuit Tuesday in the U.S. District Court for the District of Columbia against Trump and the Justice Department, seeking to block federal officials from pressuring states to remove voters from their rolls; Axios reports Democrats accusing Trump of using prosecution threats to pressure election officials; MarketWatch reports the Social Security Administration pushing 'Trump accounts' for babies amid slow uptake; Inside Climate News notes the Trump administration promising new methane rules after a decade of regulatory efforts; plus an LA Times item on Democrats joining a California immigrant group lawsuit and an NPR poll item.\nWhy it matters\nThe verdict is about the calendar: weeks from the midterms, Democrats are converting an economic data point into a blame narrative while simultaneously fighting the administration in court over election mechanics. Inflation frustration reaching Republican territory is what makes this more than messaging — it is map expansion.\nSources agree / disagree\nOnly the Times carries the CPI-blame story; the other six outlets each carry their own. No numeric or name conflicts across the batch. Trust label: Themed bundle——only The New York Times carries the CPI-blames-Trump story; the voter-roll lawsuit, the Trump accounts, and the methane rule are separate stories.\nStill uncertain\nThe snippets give no CPI figures, no breakdown of the energy component, and no detail on the lawsuit's evidence of pressure on states. Verify numbers and filings in the full reporting."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-01-democrats-blame-trump-af\",\"category\":\"international\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-international-01-democrats-blame-trump-af.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Democrats Blame Trump After CPI Report Shows Energy Prices Drove Up Inflation\",\"zh-TW\":\"相關封面圖：CPI報告顯示能源價格推高通膨後民主黨人指責川普\"},\"publishedAt\":\"2026-10-22T01:50:00.000Z\",\"title\":{\"en\":\"NYT: Democrats Blame Trump After CPI Report Shows Energy Prices Drove Inflation\",\"zh-TW\":\"《紐約時報》：CPI 顯示能源價格推高通膨，民主黨把矛頭指向川普\"},\"summary\":{\"en\":\"Democrats blame Donald Trump after a CPI report showed energy prices driving inflation, the New York Times reported, as inflation expands the competitive midterm map into Republican territory. The same batch carried separate stories: a Democratic lawsuit over voter-roll pressure, slow 'Trump accounts' uptake, promised methane rules. Takeaway: weeks from the midterms, inflation is the Democrats' sharpest weapon.\",\"zh-TW\":\"《紐約時報》報導，CPI 報告顯示能源價格推高通膨後，民主黨把矛頭指向川普；通膨民怨正把期中選舉的激戰版圖擴大到共和黨地盤。同批另有民主黨就選民名冊施壓提告川普政府、「川普帳戶」申辦冷清、甲烷新規承諾等獨立新聞。結論：距離期中選舉只剩幾週，通膨是民主黨最利的武器。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"通膨現在是競選武器：《紐約時報》報導，CPI 報告顯示能源價格推高通膨後，民主黨把矛頭指向川普——而這股民怨正把期中選舉的激戰版圖擴大到共和黨深耕的地盤。\\n發生了什麼事\\n時報經濟線報導，民主黨把這份由能源價格帶頭的通膨數據算在川普頭上。同批另有一串相鄰的期中選舉新聞：民主黨領袖與選舉團體週二向哥倫比亞特區聯邦地方法院遞出 44 頁起訴書，控告川普與司法部，要求阻止聯邦官員在選前向各州施壓刪除選民名冊；Axios 報導民主黨指控川普以起訴威脅施壓選務官員；MarketWatch 報導社會安全局力推嬰兒「川普帳戶」但申辦冷清；Inside Climate News 提到川普政府在十年甲烷管制努力後承諾訂新規；另有《洛杉磯時報》民主黨加入加州移民團體提告、NPR 民調等條目。\\n為什麼重要\\n結論看日曆：距離期中選舉只剩幾週，民主黨一邊把經濟數據轉成究責敘事，一邊在法庭上就選舉機制與政府開戰。通膨民怨燒進共和黨地盤，這才不只是喊話，而是版圖擴張。\\n來源異同\\nCPI 究責川普只有時報一家；其他六家各有各的新聞。整批沒有數字或人名衝突。信任標籤：主題拼盤——CPI 指責川普只有《紐約時報》一家；選民名冊訴訟、川普帳戶、甲烷新規是各自獨立的新聞。\\n仍不確定\\n來源摘要沒有 CPI 具體數字、能源分項細節，也沒有起訴書指控施壓的證據細節。引用數字與訴狀內容前請查閱完整報導。\"},\"sources\":[{\"name\":\"MarketWatch\",\"url\":\"https://www.marketwatch.com/story/the-social-security-administration-wants-more-babies-signed-up-for-trump-accounts-but-theres-still-a-catch-4096f16e?mod=mw_rss_topstories\"},{\"name\":\"The Hill\",\"url\":\"https://thehill.com/regulation/court-battles/6164426-democrats-sue-trump-doj-voter-rolls/\"},{\"name\":\"Axios\",\"url\":\"https://www.axios.com/2026/10/21/trump-election-interference-lawsuit-democrats\"},{\"name\":\"NYT Economy\",\"url\":\"https://www.nytimes.com/2026/10/14/business/economy/inflation-trump-democrats-midterms-energy.html\"},{\"name\":\"Inside Climate News\",\"url\":\"https://insideclimatenews.org/news/20102026/trump-administration-promises-new-methane-rules/\"},{\"name\":\"LA Times California\",\"url\":\"https://www.latimes.com/politics/story/2026-10-21/top-democrats-join-california-immigrant-nevada-group-to-sue-over-federal-election-probes\"},{\"name\":\"NPR News\",\"url\":\"https://www.npr.org/2026/10/21/nx-s1-6011179/poll-democrats-republicans-trump-approval\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":25,\"outletReputation\":20,\"crossCorroboration\":17,\"recencyClarity\":25},\"tags\":[\"international\",\"live-ingest\",\"marketwatch\",\"the-hill\",\"axios\"],\"glossary\":[{\"term\":{\"en\":\"Donald Trump\",\"zh-TW\":\"唐納·川普\"},\"blurb\":{\"en\":\"US president blamed by Democrats for inflation.\",\"zh-TW\":\"美國總統，被民主黨歸咎通膨的對象。\"}},{\"term\":{\"en\":\"Democratic Party\",\"zh-TW\":\"民主黨\"},\"blurb\":{\"en\":\"US opposition party pinning inflation on Trump weeks before the midterms.\",\"zh-TW\":\"美國在野黨，在期中選舉前把通膨算在川普頭上。\"}},{\"term\":{\"en\":\"U.S. Department of Justice\",\"zh-TW\":\"美國司法部\"},\"blurb\":{\"en\":\"Federal department sued by Democrats over alleged voter-roll pressure.\",\"zh-TW\":\"被民主黨控告施壓選民名冊的聯邦部會。\"}},{\"term\":{\"en\":\"The New York Times\",\"zh-TW\":\"《紐約時報》\"},\"blurb\":{\"en\":\"US newspaper whose economy desk reported the CPI-blame story.\",\"zh-TW\":\"報導 CPI 究責川普的美國報紙。\"}},{\"term\":{\"en\":\"CPI\",\"zh-TW\":\"消費者物價指數\"},\"blurb\":{\"en\":\"Consumer Price Index; the inflation report at the story's center.\",\"zh-TW\":\"消費者物價指數，本則新聞核心的通膨報告。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"c
