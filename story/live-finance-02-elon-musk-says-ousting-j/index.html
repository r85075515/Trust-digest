it.\nWhat happened\nMusk said he did not think Huang was disloyal to the United States, and that he was not sure what the term 'MAGA' meant. He said he was 'not MAGA,' distancing himself from the political movement linked to Trump, and called his record spending on the US midterms 'pretty foolish.' Musk also said Ukrainian President Volodymyr Zelenskyy was lying about disruptions to Starshield in Ukraine and trying to misuse SpaceX's consumer service, Starlink, for military purposes, as he tried to explain the conflict after weeks of back and forth between Zelenskyy, Musk and the US government.\nWhy it matters\nThe remarks do two things at once: they put Musk publicly on Huang's side as the Nvidia spy scandal hangs over the Trump–Xi meeting, and they put distance between Musk and the MAGA movement he was once closely tied to. The Starlink claims add a third front, with Musk accusing a wartime ally's president of lying about a US company's service.\nSources agree / disagree\nBBC Business, TechCrunch and The Verge cover different remarks from the same DealBook appearance — the midterm spending, the 'I'm not MAGA' line, the Huang defence and the Ukraine–Starlink explanation — and they agree on the occasion and the quotes. No numeric or name conflicts appear in the snippets.\nStill uncertain\nThe full remarks beyond the snippets, any response from Kyiv to the Starshield claim, and any White House reaction to the MAGA distancing are beyond the feed. Verify on the publisher pages.\nTrust label: Multi-source agreement"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-02-elon-musk-says-ousting-j\",\"category\":\"finance\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-finance-02-elon-musk-says-ousting-j.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Elon Musk says ousting Jensen Huang is like ‘kicking Michael Jordan off your team’\",\"zh-TW\":\"相關封面圖：伊隆馬斯克表示驅逐黃仁勳就像“將邁克爾喬丹踢出你的團隊”\"},\"publishedAt\":\"2026-11-19T02:47:34.000Z\",\"title\":{\"en\":\"Elon Musk at DealBook: Ousting Jensen Huang Like 'Kicking Michael Jordan Off Your Team'\",\"zh-TW\":\"伊隆·馬斯克（Elon Musk）：趕走黃仁勳（Jensen Huang）像「把麥可·喬丹（Michael Jordan）踢出球隊」\"},\"summary\":{\"en\":\"At The New York Times' DealBook Summit on Wednesday, Elon Musk said ousting Jensen Huang would be like 'kicking Michael Jordan off your team' and that he did not think Huang was disloyal to the United States. Musk also said he was 'not MAGA' and called his midterm spending 'pretty foolish.' Watch whether the White House responds.\",\"zh-TW\":\"伊隆·馬斯克（Elon Musk）週三在《紐約時報》（The New York Times）DealBook 峰會上表示，趕走黃仁勳（Jensen Huang）就像「把麥可·喬丹（Michael Jordan）踢出球隊」，也不認為黃仁勳對美國不忠。馬斯克也說自己「不是 MAGA」，期中選舉花費「非常愚蠢」。接下來看白宮是否回應。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"伊隆·馬斯克（Elon Musk）週三出席《紐約時報》（The New York Times）DealBook 峰會時表示，趕走黃仁勳（Jensen Huang）就像「把麥可·喬丹（Michael Jordan）踢出球隊」，為這位輝達（Nvidia）執行長辯護。\\n發生了什麼事\\n馬斯克表示，他不認為黃仁勳對美國不忠，也不太確定「MAGA」這個詞是什麼意思。他說自己「不是 MAGA」，與川普（Trump）有關的政治運動保持距離，並稱自己在美國期中選舉花了創紀錄的錢「非常愚蠢」。馬斯克也說，烏克蘭總統澤倫斯基（Volodymyr Zelenskyy）在烏克蘭 Starshield 服務中斷一事上撒謊，試圖把 SpaceX 的消費級服務星鏈（Starlink）挪作軍事用途；他是在澤倫斯基、馬斯克與美國政府來回交鋒數週後，試圖說明這場衝突。\\n為什麼重要\\n這番談話同時做了兩件事：在輝達間諜醜聞籠罩川習會之際，馬斯克公開站在黃仁勳一邊；也拉開了他與自己曾經關係密切的 MAGA 運動之間的距離。星鏈指控又開闢第三條戰線：馬斯克指控一位戰時盟友的總統，就一家美國公司的服務撒謊。\\n來源異同\\n英國廣播公司商業版（BBC Business）、科技博客（TechCrunch）與 The Verge 報導同一場 DealBook 亮相的不同談話——期中選舉花費、「我不是 MAGA」、為黃仁勳辯護、烏克蘭與星鏈說明——三家對場合與引言的說法一致。摘要片段中沒有數字或人名衝突。\\n仍不確定\\n引言之外的完整談話、基輔對 Starshield 指控的回應、白宮對馬斯克與 MAGA 保持距離的反應，都超出摘要範圍；引用前請查閱原文。\"},\"sources\":[{\"name\":\"BBC Business\",\"url\":\"https://www.bbc.co.uk/news/articles/cm9q8j2z3gg8o?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"TechCrunch\",\"url\":\"https://techcrunch.com/2026/11/18/elon-musk-says-im-not-maga/\"},{\"name\":\"The Verge\",\"url\":\"https://www.theverge.com/tech/1037448/elon-musk-ukraine-starlink-starshield-nyt-dealbook\"}],\"disagreements\":null,\"trustScore\":84,\"trustBreakdown\":{\"sourceDiversity\":20,\"outletReputation\":17,\"crossCorroboration\":22,\"recencyClarity\":25},\"tags\":[\"finance\",\"live-ingest\",\"bbc-business\",\"techcrunch\",\"techcrunch\"],\"glossary\":[{\"term\":{\"en\":\"Elon Musk\",\"zh-TW\":\"伊隆·馬斯克\"},\"blurb\":{\"en\":\"Billionaire speaking at the DealBook Summit.\",\"zh-TW\":\"在 DealBook 峰會發言的億萬富翁。\"}},{\"term\":{\"en\":\"Jensen Huang\",\"zh-TW\":\"黃仁勳\"},\"blurb\":{\"en\":\"Chief executive of Nvidia, defended by Musk.\",\"zh-TW\":\"獲馬斯克辯護的輝達執行長。\"}},{\"term\":{\"en\":\"Michael Jordan\",\"zh-TW\":\"麥可·喬丹\"},\"blurb\":{\"en\":\"Basketball player Musk used in his analogy.\",\"zh-TW\":\"馬斯克比喻中提到的籃球員。\"}},{\"term\":{\"en\":\"MAGA\",\"zh-TW\":\"MAGA\"},\"blurb\":{\"en\":\"Political movement linked to Trump that Musk says he is not part of.\",\"zh-TW\":\"與川普有關、馬斯克稱自己不屬於的政治運動。\"}},{\"term\":{\"en\":\"Volodymyr Zelenskyy\",\"zh-TW\":\"澤倫斯基\"},\"blurb\":{\"en\":\"President of Ukraine, accused by Musk of lying about Starshield.\",\"zh-TW\":\"被馬斯克指控在 Starshield 一事上撒謊的烏克蘭總統。\"}},{\"term\":{\"en\":\"Starlink\",\"zh-TW\":\"星鏈\"},\"blurb\":{\"en\":\"SpaceX consumer satellite service.\",\"zh-TW\":\"SpaceX 的消費級衛星服務。\"}},{\"term\":{\"en\":\"Starshield\",\"zh-TW\":\"星盾\"},\"blurb\":{\"en\":\"SpaceX service whose Ukraine disruptions are disputed.\",\"zh-TW\":\"烏克蘭服務中斷情形引發爭議的 SpaceX 服務。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-finance-02-elon-musk-says-ousting-j/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"
