ports the Chitose office as a deepening of the IBM–Rapidus partnership, aimed at advancing 2-nanometer chip production to mass output next year. The same feed batch carries a second, separate item from CNA: Nvidia and Meta deepening cooperation on Meta's personal AI agent Muse and related models, with Nvidia investing $3 billion (about NT$97.4 billion) in a Meta stock issuance. That is a different deal between different companies, bundled into the same card by the ingest feed, and it is not part of the IBM story.\nWhy it matters\nTwo-nanometer production is the frontier of chipmaking, and a local office is a different kind of commitment from a press-release partnership — it means staffing, coordination, and day-to-day problem solving at the fab's doorstep. For Japan's bid to rejoin the leading edge through Rapidus, IBM's physical presence in Chitose is the signal that the project has moved from agreement to execution.\nSources agree-disagree\nTechNews carries the IBM story; CNA carries the Nvidia–Meta story. The feed's flagged figure gap (2 versus 1000) is not a disagreement about one fact — it compares a 2-nanometer process node with a near-NT$100 billion investment in another deal. Trust label: cautious — the main story is single-sourced, and the card bundles two separate stories.\nStill uncertain\nThe snippets give no office size, staffing, or exact mass-production date, and no yield or customer detail for Rapidus's 2nm process. The missing specifics are the execution metrics: how many people, which milestones, and when volume actually starts."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-02-ibm-rapidus-2\",\"category\":\"semiconductor\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-semiconductor-02-ibm-rapidus-2.jpg\",\"imageAlt\":{\"en\":\"Cover related to: IBM 進駐日本北海道千歲市！深化與 Rapidus 合作，助明年 2 奈米量產\",\"zh-TW\":\"相關封面圖：IBM 進駐日本北海道千歲市！深化與 Rapidus 合作，助明年 2 奈米量產\"},\"publishedAt\":\"2026-10-28T06:25:48.000Z\",\"title\":{\"en\":\"IBM moves into Chitose to back Rapidus 2nm production next year\",\"zh-TW\":\"IBM 進駐北海道千歲市，深化 Rapidus 合作、助明年 2 奈米量產\"},\"summary\":{\"en\":\"IBM has opened an office in Chitose, Hokkaido, deepening its partnership with Japanese chipmaker Rapidus toward 2-nanometer mass production next year. A second batch item — Nvidia's $3 billion Meta investment — is separate news. The takeaway: Japan's 2nm bid now has IBM on the ground.\",\"zh-TW\":\"IBM 已在日本北海道千歲市設立辦公室，深化與日本半導體業者 Rapidus 的合作，共同推進明年 2 奈米量產；同批另一則輝達（Nvidia）投資 Meta 30 億美元的消息是不同新聞，不屬於 IBM 這條。結論：日本 2 奈米大計，現在有 IBM 的人進駐到廠所在地。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"IBM 把人放到了 2 奈米賭注所在的地方：公司已在日本北海道千歲市設立辦公室，深化與日本半導體業者 Rapidus 的合作，為明年 2 奈米量產鋪路。\\n發生了什麼事\\nTechNews 報導，這間千歲市辦公室深化了 IBM 與 Rapidus 的合作，目標是把 2 奈米晶片推進到明年量產。同一批摘要裡還有一則來自中央社的不同新聞：輝達（Nvidia）與 Meta 深化在 Meta 個人 AI 代理 Muse 及相關模型的合作，輝達並將投資 30 億美元（約新台幣 974 億元）於 Meta 的股票發行。那是不同公司之間的另一筆交易，是 ingest 摘要把兩則新聞併進同一張卡，不屬於 IBM 這條新聞。\\n為什麼重要\\n2 奈米製程是晶片製造的最前線，而在當地設立辦公室，與新聞稿式的合作是不同等級的承諾——它意味著在晶圓廠門口配置人力、協調與日常解決問題。對日本透過 Rapidus 重返領先製程的布局來說，IBM 在千歲市的實體進駐，是計畫從協議走向執行的訊號。\\n來源異同\\nTechNews 承載 IBM 這條新聞，中央社承載輝達與 Meta 那條新聞。摘要標記的數字落差（2 與 1000）並不是對同一事實的分歧——它拿 2 奈米製程節點去比另一筆交易近 1,000 億台幣的投資金額。信任標籤：審慎——主線新聞只有一家來源，且本卡併入了兩則不同新聞。\\n仍不確定\\n摘要沒有給出辦公室規模、人力或確切量產日期，也沒有 Rapidus 2 奈米製程的良率或客戶細節。缺失的關鍵資訊是執行指標：多少人、哪些里程碑、量產實際何時開始。\"},\"sources\":[{\"name\":\"TechNews 科技新報\",\"url\":\"https://technews.tw/2026/10/28/ibm-moves-into-chitose-for-rapidus-2nm-plant/\"},{\"name\":\"中央社-科技\",\"url\":\"https://www.cna.com.tw/news/ait/202610270222.aspx\"}],\"disagreements\":{\"en\":\"Figures differ across outlets (e.g. 2 vs 1000 in headlines/snippets).\",\"zh-TW\":\"不同媒體的數字有所不同（例如，標題/摘要中的數字為 2 與 1000）。\"},\"trustScore\":64,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":19,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"semiconductor\",\"live-ingest\",\"technews-科技新報\",\"中央社-科技\"],\"glossary\":[{\"term\":{\"en\":\"IBM\",\"zh-TW\":\"IBM\"},\"blurb\":{\"en\":\"U.S. technology company opening an office in Chitose.\",\"zh-TW\":\"在千歲市設辦公室的美國科技公司。\"}},{\"term\":{\"en\":\"Rapidus\",\"zh-TW\":\"Rapidus\"},\"blurb\":{\"en\":\"Japanese chipmaker working with IBM on 2nm production.\",\"zh-TW\":\"與 IBM 合作推進 2 奈米製程的日本半導體業者。\"}},{\"term\":{\"en\":\"Chitose\",\"zh-TW\":\"千歲市\"},\"blurb\":{\"en\":\"Hokkaido city where the Rapidus fab is located.\",\"zh-TW\":\"Rapidus 晶圓廠所在的北海道城市。\"}},{\"term\":{\"en\":\"2nm\",\"zh-TW\":\"2 奈米\"},\"blurb\":{\"en\":\"A chip process node; smaller numbers mean more advanced production.\",\"zh-TW\":\"晶片製程節點，數字越小越先進。\"}},{\"term\":{\"en\":\"Nvidia\",\"zh-TW\":\"輝達\"},\"blurb\":{\"en\":\"U.S. chip company investing in Meta in a separate deal.\",\"zh-TW\":\"在另一筆交易中投資 Meta 的美國晶片公司。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://r85075515.github.io/Trust-digest/\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"Axiom\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"zh_TW\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:locale:alternate\",\"content\":\"en_US\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"9\",{\"name\":\"
