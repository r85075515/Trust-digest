Instagram Stories. The event listing showed an 8 p.m. start time, and the show was described as part of the Wildworld Tour. The snippets also noted that many fans had travelled for the show and that the Michigan debut would therefore have to wait. Separately, Rolling Stone Music carried a headline about the Chicks postponing a Los Angeles concert at the Dolby Theatre hours before showtime due to illness, but the feed text gave no further detail on that act or that venue change.\nWhy it matters\nFor ticket holders, a postponement announced hours before an 8 p.m. start affects travel and plans made for that evening, which is why the timing is a central part of this story. For the tour, the key practical questions are whether a new date is set and how tickets are handled, and neither point is answered in the snippets. The illness itself is described only in general terms, with a wish for rest and recovery, and no medical detail is provided. The presence of a second postponement headline about a different act in the same bundle also means readers should not merge the Detroit and Los Angeles items into one event.\nSources agree / disagree\nBillboard, Rolling Stone Music and Just Jared all carried the KATSEYE Detroit postponement, agreeing on illness as the reason and on Megan as the member affected. Trust label: Multi-source agreement — Three outlets reported the same postponement, the same venue and the same reason. The Los Angeles item about the Chicks appeared as a headline only and is separate from the Detroit reporting.\nStill uncertain\nThe snippets do not give a rescheduled date, refund or ticket-transfer information, or any update on Megan's condition beyond the wish for rest and recovery. They also give no detail on the Chicks postponement beyond its headline."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-entertainment-01-the-chicks-postpone-los-\",\"category\":\"entertainment\",\"adult\":false,\"isHeadline\":false,\"i
