ack Road in Phoenix, right next door to its original Buck \u0026 Rider restaurant near Camelback Road and 44th Street. Occupying a 4,500-square-foot former Panera Bread storefront, the concept will retail fresh daily seafood, hand-rolled sushi, sake, and wine.\n\nWhy it matters\nIn a landlocked desert metropolis like Phoenix, daily air-freighted seafood sourcing has long been a differentiator for Buck \u0026 Rider since opening in 2015. Extending that supply chain into a standalone retail fishmonger and commissary kitchen lets home cooks purchase restaurant-grade seafood directly while scaling prep capacity across Hi Noon Hospitality's restaurant group.\n\nSource differences\nKTAR (\"Buck \u0026 Rider to sell fresh seafood at B\u0026R Fish Shop in Phoenix\") highlights the 4,500-square-foot market's retail offerings—including fresh seafood, hand-rolled sushi, wine, and sake—and notes an exact December opening date has not yet been announced. The AZ Insider (\"Something Fishy Is Happening on Camelback - The AZ Insider\") specifies the 4343 E. Camelback Road address in a former Panera space next to the original Buck \u0026 Rider. Heyman Luxury (\"B\u0026R Fish Shop on Camelback Road: Buck \u0026 Rider's Seafood Hub\") adds that the facility will also cut and process seafood for every Hi Noon Hospitality location.\n\nStill uncertain\nThe exact December grand-opening date, retail operating hours, and daily fish counter pricing remain unannounced.\n\nTrust label: Multi-source agreement — KTAR, The AZ Insider, and Heyman Luxury corroborate the December 2026 opening, 4343 E. Camelback Road address, and 4,500-square-foot retail market concept."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-arizona-295-buck-and-rider-fish-shop-phoenix-opening\",\"category\":\"arizona\",\"title\":{\"en\":\"Buck \u0026 Rider Operator Plans December Opening for 4,500-Square-Foot B\u0026R Fish Shop in Phoenix\",\"zh-TW\":\"鳳凰城知名海鮮餐廳 Buck \u0026 Rider 母集團 12 月推出 4,500 平方英尺零售魚舖\"},\"summary\":{\"en\":\"Hi Noon Hospitality, the operator behind Phoenix seafood restaurant Buck \u0026 Rider, plans to open B\u0026R Fish Shop in December 2026 at 4343 E. Camelback Road next to its original Arcadia location. The 4,500-square-foot retail market will sell fresh seafood, hand-rolled sushi, sake, and wine while serving as a seafood preparation hub.\",\"zh-TW\":\"鳳凰城人氣海鮮餐廳 Buck \u0026 Rider 營運商 Hi Noon Hospitality 宣布，將於 2026 年 12 月在東駱駝背路 4343 號創始店旁開設零售海鮮市場「B\u0026R Fish Shop」。該店占地 4,500 平方英尺，販售每日空運生鮮海產、手捲壽司與清酒，並兼作集團各分店的海鮮分切中央廚房。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」鳳凰城知名餐飲集團 Hi Noon Hospitality 宣布將於 2026 年 12 月在鳳凰城東駱駝背路 4343 號（4343 E. Camelback Road）開設零售海鮮市場「B\u0026R Fish Shop」，店址緊鄰其 2015 年創立的 Buck \u0026 Rider 創始餐廳（近 Camelback Road 與第 44 街路口）。新店改裝自原 Panera Bread 店面，占地約 4,500 平方英尺，主打每日空運新鮮海產、現做手捲壽司、清酒與葡萄酒零售。\\n\\n「為什麼重要」鳳凰城身處內陸沙漠都會區，生鮮海產仰賴高頻率冷鏈空運；Buck \u0026 Rider 將餐廳級供應鏈延伸至独立魚舖並兼作集團中央分切廚房，既能滿足在地家庭自煮採購需求，也有助提升旗下各分店備料效率。\\n\\n「來源異同」KTAR（原文標題：\\\"Buck \u0026 Rider to sell fresh seafood at B\u0026R Fish Shop in Phoenix\\\"）報導這座 4,500 平方英尺市場將販售生鮮海產、手捲壽司、葡萄酒與清酒，並指出 12 月確切開幕日期尚未公布；The AZ Insider（原文標題：\\\"Something Fishy Is Happening on Camelback - The AZ Insider\\\"）補充店址位於東駱駝背路 4343 號原 Panera 店面；Heyman Luxury（原文標題：\\\"B\u0026R Fish Shop on Camelback Road: Buck \u0026 Rider's Seafood Hub\\\"）則點出該空間同時作為 Hi Noon Hospitality 旗下全品牌的海鮮分切中心。\\n\\n「仍不確定」12 月正式開幕日期、每日門市營業時間以及生鮮櫃檯品項定價均尚未對外公布。\\n\\nTrust label: Multi-source agreement — KTAR、The AZ Insider 與 Heyman Luxury 均核實 B\u0026R Fish Shop 將於 2026 年 12 月在鳳凰城東駱駝背路 4343 號開幕。\"},\"glossary\":[{\"term\":{\"en\":\"Fishmonger\",\"zh-TW\":\"專業魚販／生鮮水產舖\"},\"blurb\":{\"en\":\"A specialist retailer that sources, fillets, and sells fresh seafood directly to consumers.\",\"zh-TW\":\"專門採購、分切處理並直接向零售消費者販售生鮮魚貝水產的專賣店。\"}},{\"term\":{\"en\":\"Commissary kitchen\",\"zh-TW\":\"中央備料廚房\"},\"blurb\":{\"en\":\"A centralized food preparation facility that processes ingredients for multiple affiliated restaurant locations.\",\"zh-TW\":\"為同一餐飲集團旗下多家分店集中處理、分切與配送食材的專業中央廚房設施。\"}},{\"term\":{\"en\":\"Air-freighted seafood\",\"zh-TW\":\"空運生鮮海產\"},\"blurb\":{\"en\":\"Fresh fish and shellfish flown daily from coastal fisheries to inland cities to preserve cold-chain freshness.\",\"zh-TW\":\"從沿海漁港每日空運直送內陸城市的高時效冷鏈生鮮魚類與貝類水產。\"}}],\"sources\":[{\"name\":\"KTAR\",\"url\":\"https://ktar.com/arizona-news/buck-rider-to-sell-fresh-seafood-at-br-fish-shop-in-phoenix\"},{\"name\":\"The AZ Insider\",\"url\":\"https://theazinsider.com/something-fishy-is-happening-on-camelback/\"},{\"name\":\"Heyman Luxury\",\"url\":\"https://heymanluxury.com/blog/the-fish-market-coming-to-camelback-road-is-also-buck-and-riders-back-kitchen\"}],\"imageUrl\":\"/covers/live/live-arizona-295-buck-and-rider-fish-shop-phoenix-opening.jpg\",\"imageAlt\":{\"en\":\"Buck \u0026 Rider Operator Plans December Opening for 4,500-Square-Foot B\u0026R Fish Shop in Phoenix\",\"zh-TW\":\"鳳凰城知名海鮮餐廳 Buck \u0026 Rider 母集團 12 月推出 4,500 平方英尺零售魚舖\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":85,\"trustBreakdown\":{\"crossCorroboration\":22,\"outletReputation\":21,\"recencyClarity\":21,\"sourceDiversity\":21},\"publishedAt\":\"2026-11-28T01:07:55.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":22,\"D2\":21,\"D3\":22,\"D4\":21,\"D5\":21,\"total\":21},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-arizona-295-buck-and-rider-fish-shop-phoenix-openin
