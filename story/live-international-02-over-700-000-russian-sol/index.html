ave Died in Ukraine, Analysis Indicates. Ukraine's sinking of a Russian battleship at a port in Libya raises the stakes of the war a notch, writes Frank Gardner. Ukraine carried out an attack on a Russian warship moored at a port in Libya, President Volodymyr Zelenskyy said, claiming that sea drones sank the navy vessel in a surprise assault. (Image credit: Russian Defense Ministry Press Service) Ukraine’s security service says seven drones were launched from mothership in operation that sank Merkury warship Ukraine has confirmed it deployed naval drones in strikes on two Russian vessels off Libya on Sunday, including one that sank the corvette Merkury, one of Russia’s newest vessels. Ukraine’s security service, the SBU, said seven domestically made naval drones were launched from a mother Hacked government data underscores the immense human cost of President Vladimir V. Putin’s war of attrition. Why it matters\nThis cluster was assembled from 5 feed item(s) across 4 outlet(s) (BBC World, NPR World, The Guardian World, NYT World) in the international category. Axiom links out to each publisher; this digest only restates titles and short feed descriptions — not full articles. Sources agree / disagree\nMultiple outlets are covering closely related headlines: \"What strike on Russian ship in Libya says about spread of Ukraine war\" (BBC World); \"Zelenskyy hails Ukraine's attack on a Russian warship docked at a naval base in Libya\" (NPR World); \"Ukraine confirms it used naval drones to strike two Russian ships off Libya\" (The Guardian World); \"Over 700,000 Russian Soldiers Have Died in Ukraine, Analysis Indicates\" (NYT World); \"Ukraine Attack Off Coast of Libya Shows Reach of Its Naval Drones\" (NYT World).\nNo clear numeric/name conflicts detected in the short feed snippets; always verify details on the publisher pages. Still uncertain\nFeed descriptions can omit context, updates, or corrections. Click through to the linked outlets for the latest full reporting.
