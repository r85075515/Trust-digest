ablish a 125,000-square-foot hard pharmaceutical capsule manufacturing plant in Whitsett, Guilford County. Local authorities in the Town of Whitsett and Guilford County collaborated on securing the project, which is projected to create 240 new jobs.\n\nWhy it matters\nAccording to reporting citing state projections, the facility will be the first hard capsule manufacturing plant of its kind in the state and is expected to contribute more than 1.3 billion USD to North Carolina's economy. Strengthening domestic pharmaceutical excipient and capsule production helps diversify U.S. drug supply chains away from single-region reliance.\n\nSource differences\nThe North Carolina Governor's Office release titled \"Governor Stein Announces $125 Million Investment by Indian Pharmaceutical Company for Its First U.S. Hard...\" provides the primary official announcement of the 240 jobs and 125 million USD investment. Local public radio Blue Ridge Public Radio (BPR) in \"ACG Capsules Inc. to invest $125M in Guilford County\" specifies the 125,000-square-foot facility size in Whitsett, while \"ACG will invest $125 million in North Carolina\" from Voz Media adds the projected 1.3 billion USD statewide economic contribution.\n\nStill uncertain\nThe exact construction groundbreaking timeline, phased hiring schedule, and specific state or county economic incentive package terms were not detailed in the available summaries.\n\nTrust label: Official confirmation — Confirmed by the North Carolina Governor's Office announcement and corroborated by Blue Ridge Public Radio (BPR) and Voz Media."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-biotech-376-acg-capsules-nc-plant\",\"category\":\"biotech\",\"title\":{\"en\":\"India's ACG Capsules to Invest 125 Million USD in North Carolina Plant\",\"zh-TW\":\"印度膠囊大廠 ACG 投資 1.25 億美元於北卡羅來納州設廠\"},\"summary\":{\"en\":\"North Carolina Governor Josh Stein (喬許・斯坦) announced that ACG Capsules Inc., a U.S. subsidiary of Mumbai-based ACG Associated Capsules Private Limited, will invest 125 million USD to build a 125,000-square-foot hard pharmaceutical capsule manufacturing facility in Whitsett, Guilford County. The project is expected to create 240 jobs and generate over 1.3 billion USD in economic impact for the state.\",\"zh-TW\":\"北卡羅來納州州長喬許・斯坦（Josh Stein）宣布，總部位於印度孟買的製藥膠囊大廠 ACG 旗下美國子公司 ACG Capsules Inc.，將投資 1.25 億美元在吉爾福德郡（Guilford County）惠特塞特鎮（Whitsett）興建佔地 12.5 萬平方英尺的硬質藥用膠囊製造廠，預計創造 240 個就業機會並帶來逾 13 億美元經濟效益。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n北卡羅來納州州長喬許・斯坦（Josh Stein）宣布，印度孟買製藥輔料與膠囊製造商 ACG Associated Capsules Private Limited 旗下美國子公司 ACG Capsules Inc.，計劃投資 1.25 億美元在吉爾福德郡（Guilford County）惠特塞特鎮（Whitsett）興建佔地 12.5 萬平方英尺的硬質藥用膠囊廠。惠特塞特鎮與吉爾福德郡政府共同促成此案，預計將創造 240 個工作機會。\\n\\n「為什麼重要」\\n根據州政府公布的評估，該廠將成為該州首座硬質藥用膠囊製造基地，並預計為北卡羅來納州經濟貢獻超過 13 億美元。在美國本土擴建藥用膠囊產能，有助於強化北美製藥供應鏈韌性並分散海外採購風險。\\n\\n「來源異同」\\n北卡羅來納州州長辦公室官方新聞稿「Governor Stein Announces $125 Million Investment by Indian Pharmaceutical Company for Its First U.S. Hard...」公布 1.25 億美元投資與 240 個職缺的核心決策；藍嶺公共廣播電台（Blue Ridge Public Radio，BPR）報導「ACG Capsules Inc. to invest $125M in Guilford County」補充廠房面積為 12.5 萬平方英尺；Voz Media 報導「ACG will invest $125 million in North Carolina」則進一步列出逾 13 億美元的整體經濟貢獻預估。\\n\\n「仍不確定」\\n該廠具體動工與投產時程、分階段徵才計畫，以及州與郡政府提供的租稅或補助激勵方案細節，目前尚未在公開摘要中完整揭露。\\n\\nTrust label: Official confirmation — 依據北卡羅來納州州長辦公室官方新聞稿，並獲 Blue Ridge Public Radio（BPR）與 Voz Media 報導佐證。\"},\"glossary\":[{\"term\":{\"en\":\"Hard Pharmaceutical Capsule\",\"zh-TW\":\"硬質藥用膠囊\"},\"blurb\":{\"en\":\"Two-piece shells made from gelatin or plant-based polymers used to enclose powdered or granulated medications.\",\"zh-TW\":\"由明膠或植物性聚合物製成的兩節式外殼，用於填裝粉末或顆粒狀口服藥物。\"}},{\"term\":{\"en\":\"Guilford County\",\"zh-TW\":\"吉爾福德郡\"},\"blurb\":{\"en\":\"A county in North Carolina's Piedmont Triad region that includes Greensboro and the Town of Whitsett.\",\"zh-TW\":\"位於北卡羅來納州皮埃蒙特三子城地區的行政區，轄下包含格林斯伯勒與惠特塞特鎮。\"}},{\"term\":{\"en\":\"Pharmaceutical Supply Chain\",\"zh-TW\":\"製藥供應鏈\"},\"blurb\":{\"en\":\"The end-to-end network of raw material suppliers, excipient makers, drug manufacturers, and distributors.\",\"zh-TW\":\"涵蓋原料藥、輔料與膠囊製造、成品藥生產至物流配送的完整醫藥製造體系。\"}}],\"sources\":[{\"name\":\"North Carolina Governor's Office\",\"url\":\"https://governor.nc.gov/news/press-releases/2026/11/24/governor-stein-announces-125-million-investment-indian-pharmaceutical-company-its-first-us-hard\"},{\"name\":\"Blue Ridge Public Radio (BPR)\",\"url\":\"https://www.bpr.org/2026-11-25/acg-capsules-to-invest-125-million-in-guilford-county\"},{\"name\":\"Voz Media\",\"url\":\"https://voz.us/en/economy/261127/1000965/an-indian-company-will-invest-125-million-in-north-carolina-to-manufacture-drug-capsules.html\"}],\"imageUrl\":\"/covers/live/live-biotech-376-acg-capsules-nc-plant.png\",\"imageAlt\":{\"en\":\"India's ACG Capsules to Invest 125 Million USD in North Carolina Plant\",\"zh-TW\":\"印度膠囊大廠 ACG 投資 1.25 億美元於北卡羅來納州設廠\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":84,\"trustBreakdown\":{\"crossCorroboration\":21,\"outletReputation\":22,\"recencyClarity\":21,\"sourceDiversity\":20},\"publishedAt\":\"2026-11-28T05:29:40.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":22,\"D2\":21,\"D3\":21,\"D4\":20,\"D5\":21,\"total\":21},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-biotech-376-acg-capsules-nc-plant/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axi
