sychological blow on top of a very large points drop, and the chain of cause runs straight through Taiwan's economic core: doubts about US AI infrastructure spending hit US chip stocks first, then hit the island that makes the chips. With only a handful of defensive sectors holding up, the sell-off was broad, not a single-stock story.\nSources agree / disagree\nThis card rests on a single CNA dispatch, so there is no second outlet to check the closing levels or the stated cause against. Trust label: Single source — one outlet reported the close and the cause.\nStill uncertain\nThe dispatch gives no trading volume, no breadth figures beyond the four resilient sectors, and no indication of whether the selling continued after the close. Verify details in the full reporting before quoting specifics."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-02-1374-42000\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-taiwan-02-1374-42000.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 台股再挫1374點　失守42000點整數關卡\",\"zh-TW\":\"相關封面圖：台股再挫1374點　失守42000點整數關卡\"},\"publishedAt\":\"2026-11-05T05:56:11.000Z\",\"title\":{\"en\":\"Taiex Plunges 1,374 Points and Loses the 42,000 Level\",\"zh-TW\":\"台股再挫 1374 點，失守 42000 點整數關卡\"},\"summary\":{\"en\":\"[Unconfirmed — single source] Taiwan stocks plunged 1,374.19 points to 41,574.72, losing the 42,000 level, after worries over US AI data-center spending sank the Philadelphia Semiconductor Index. Only financials, textiles, cement and rubber held up; the index touched an intraday low of 41,513.57.\",\"zh-TW\":\"［未證實·單一來源］台股終場跌 1374.19 點，收 41574.72 點，失守 42000 點整數關卡。市場憂心美國 AI 資料中心建置受影響，費城半導體指數重挫拖累台股開低走低，盤中一度下探 41513.57 點。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"台股 11 月 5 日終場跌 1374.19 點，收 41574.72 點，失守 42000 點整數關卡。市場憂心美國 AI 資料中心建置受影響，費城半導體指數重挫，拖累台股走低。中央社（CNA）記者潘智義（Pan Chih-yi）自台北報導。\\n發生了什麼事\\n台股開低震盪走低，盤中下探 41513.57 點，重挫 1435.34 點，終場下跌 1374.19 點，以 41574.72 點作收。報導指出，市場憂心美國 AI 資料中心建置可能受到影響，美國費城半導體指數重挫，拖累台股走低。當天只有金融、紡織、水泥、橡膠相對抗跌。\\n為什麼重要\\n失守 42000 點是心理關卡失守，疊加在千點以上的跌幅之上，衝擊鏈直接打中台灣經濟核心：美國 AI 基礎建設支出生變，先壓垮美國晶片股，再波及生產晶片的台灣。只有少數防禦類股撐住，代表這是全面賣壓，不是單一個股的問題。\\n來源異同\\n本卡只有中央社一則報導，沒有第二家媒體可以核對收盤數字與下跌原因。信任標籤：單一來源——只有一家媒體報導收盤與原因。\\n仍不確定\\n報導沒有成交量、沒有漲跌家數等盤面數據，只點名四個相對抗跌的類股，也沒說明收盤後賣壓是否延續；引用細節前請查閱完整報導。\"},\"sources\":[{\"name\":\"中央社-產經證券\",\"url\":\"https://www.cna.com.tw/news/afe/202611050139.aspx\"}],\"disagreements\":null,\"trustScore\":59,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"中央社-產經證券\"],\"glossary\":[{\"term\":{\"en\":\"Taiex\",\"zh-TW\":\"加權指數\"},\"blurb\":{\"en\":\"Taiwan's benchmark stock index, which closed at 41,574.72.\",\"zh-TW\":\"台灣加權股價指數，收在 41574.72 點。\"}},{\"term\":{\"en\":\"Philadelphia Semiconductor Index\",\"zh-TW\":\"費城半導體指數\"},\"blurb\":{\"en\":\"US index of semiconductor stocks whose slide dragged Taiwan shares lower.\",\"zh-TW\":\"美國半導體股指數，其重挫拖累台股走低。\"}},{\"term\":{\"en\":\"Pan Chih-yi\",\"zh-TW\":\"潘智義\"},\"blurb\":{\"en\":\"CNA reporter in Taipei who wrote the dispatch on the sell-off.\",\"zh-TW\":\"撰寫這則台股重挫報導的中央社台北記者。\"}},{\"term\":{\"en\":\"CNA\",\"zh-TW\":\"中央社\"},\"blurb\":{\"en\":\"Taiwan's national news agency, the sole source for this card.\",\"zh-TW\":\"台灣的國家通訊社，本卡的唯一來源。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-taiwan-02
