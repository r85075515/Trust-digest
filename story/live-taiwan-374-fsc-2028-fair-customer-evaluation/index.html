omer Treatment Principle evaluation mechanism, developed with the Securities and Futures Institute. The assessment covers 114 financial institutions—34 banks, 43 securities and futures firms, and 37 insurers—across a 130-point scoring scale and adds anti-fraud prevention effectiveness as a bonus indicator for the first time.\n\nWhy it matters\nBy tying supervisory recognition and scoring directly to fraud-prevention outcomes, the FSC pushes banks, brokerages, and insurers to upgrade account monitoring and customer protection protocols amid persistent financial scam risks.\n\nSource differences\nThe FSC official press release (\"新聞稿-金管會公布117年公平待客原則評核機制\") serves as the primary regulatory disclosure detailing the institutional framework and continuity with the 2027 criteria. More News (\"金管會公布117年公平待客評核機制 114家金融業受評、防詐成效納加分\") and Newswire Taiwan (\"金管會公布117年公平待客評核機制，詐騙防制成效首度列為加分指標\") break down the exact breakdown of 114 evaluated entities and the 130-point maximum score.\n\nStill uncertain\nIndividual scoring weightings for sub-indicators under the anti-fraud bonus category and the final list of top-performing institutions will only emerge after the 2027 evaluation period concludes.\nTrust label: Official confirmation — Confirmed directly by the Financial Supervisory Commission's November 26, 2026 regulatory press release alongside financial media coverage."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-374-fsc-2028-fair-customer-evaluation\",\"category\":\"taiwan\",\"title\":{\"en\":\"Taiwan FSC Unveils 2028 Fair Customer Treatment Evaluation Mechanism With Anti-Fraud Bonus\",\"zh-TW\":\"台灣金管會公布 117 年公平待客原則評核機制首度納入防詐成效加分\"},\"summary\":{\"en\":\"Taiwan's Financial Supervisory Commission announced on November 26, 2026, the 2028 Fair Customer Treatment evaluation framework covering 114 financial institutions, introducing anti-fraud effectiveness as a bonus metric for the first time.\",\"zh-TW\":\"台灣金融監督管理委員會於 2026 年 11 月 26 日公布「117 年公平待客原則評核機制」，涵蓋銀行、證券期貨及保險業共 114 家金融服務業，並首度將「詐騙防制成效」納入加分指標，強化金融機構阻詐與消費者保護責任。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n2026 年 11 月 26 日，台灣金融監督管理委員會正式公布委託證基會研提的「117 年公平待客原則評核機制」。本次評核對象涵蓋本國銀行 34 家、證券期貨業 43 家及保險業 37 家，合計 114 家金融服務業，評核指標總分維持 130 分，並首度將「詐騙防制成效」列為加分指標。\\n\\n「為什麼重要」\\n金管會將防詐成效直接連結至年度公平待客評核與公開表揚機制，促使銀行、券商與保險公司從制度面強化異常交易預警與高齡及弱勢客戶關懷，將阻詐責任納入金融業公司治理核心。\\n\\n「來源異同」\\n金管會官方新聞稿（原文標題：「新聞稿-金管會公布117年公平待客原則評核機制」）為主管機關一手公告，載明委託證基會規劃架構及延續 116 年度原則；More News（原文標題：「金管會公布117年公平待客評核機制 114家金融業受評、防詐成效納加分」）與台新社（原文標題：「金管會公布117年公平待客評核機制，詐騙防制成效首度列為加分指標」）則具體列出 34 家銀行、43 家證期業、37 家保險業合計 114 家的受評家數與 130 分總分設計。\\n\\n「仍不確定」\\n防詐加分項目的細部量化配分標準，以及最終進入各業別排名前段與獲獎表揚的金融機構名單，須待 2027 年（民國 116 年）度評核期間結束並完成審查後才會揭曉。\\nTrust label: Official confirmation — 依據金管會 2026 年 11 月 26 日官方新聞稿與財經媒體報導核實。\"},\"glossary\":[{\"term\":{\"en\":\"Fair Customer Treatment Principle\",\"zh-TW\":\"公平待客原則\"},\"blurb\":{\"en\":\"Taiwan's regulatory framework requiring financial institutions to ensure transparency, suitability, and consumer protection.\",\"zh-TW\":\"台灣金管會推動的金融消費者保護準則，要求金融業在商品銷售、資訊揭露與申訴處理上落實公平對待客戶。\"}},{\"term\":{\"en\":\"Securities and Futures Institute\",\"zh-TW\":\"證基會\"},\"blurb\":{\"en\":\"A Taiwan financial market organization commissioned by the FSC to design and administer the annual fair treatment assessment.\",\"zh-TW\":\"中華民國證券暨期貨市場發展基金會，受金管會委託研提並執行年度公平待客原則評核作業。\"}},{\"term\":{\"en\":\"Financial Supervisory Commission\",\"zh-TW\":\"金融監督管理委員會\"},\"blurb\":{\"en\":\"Taiwan's primary financial regulator overseeing banking, securities, futures, and insurance sectors.\",\"zh-TW\":\"台灣最高金融監理機關，負責監督管理銀行、證券、期貨及保險市場與金融消費者保護。\"}}],\"sources\":[{\"name\":\"金融監督管理委員會\",\"url\":\"https://www.fsc.gov.tw/ch/home.jsp?id=96\u0026parentpath=0,2\u0026mcustomize=news_view.jsp\u0026dataserno=202611260002\u0026aplistdn=ou=news,ou=multisite,ou=chinese,ou=ap_root,o=fsc,c=tw\u0026dtable=News\"},{\"name\":\"More News\",\"url\":\"https://more-news.tw/780336/\"},{\"name\":\"台新社\",\"url\":\"https://newswire.com.tw/news/20261126-fsc-fair-customer-evaluation-2027-fraud-prevention\"}],\"imageUrl\":\"/covers/live/live-taiwan-374-fsc-2028-fair-customer-evaluation.jpg\",\"imageAlt\":{\"en\":\"Taiwan FSC Unveils 2028 Fair Customer Treatment Evaluation Mechanism With Anti-Fraud Bonus\",\"zh-TW\":\"台灣金管會公布 117 年公平待客原則評核機制首度納入防詐成效加分\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":88,\"trustBreakdown\":{\"crossCorroboration\":21,\"outletReputation\":25,\"recencyClarity\":22,\"sourceDiversity\":20},\"publishedAt\":\"2026-11-28T05:29:40.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":23,\"D2\":22,\"D3\":22,\"D4\":22,\"D5\":22,\"total\":22},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-taiwan-374-fsc-2028-fair-customer-evaluation/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-taiwan-374-fsc-2028-fair-customer-evaluation/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"Bil
