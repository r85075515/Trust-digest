r, exploring what the price buys — from the Guerlinade heritage spanning a century to rare ingredients and the craft of blending. The premise is simple: a scent only seven other collectors in the world can share. The piece frames the purchase as owning a scent almost no one else can wear: with eight sets per scent worldwide, the buyer joins a group of eight.\nWhy it matters\nAt NT$1.4 million a bottle, the value is not the juice alone but scarcity and heritage. Wasser's answers are the closest thing to a justification the piece offers. The feature leans on the interview to make the case: Wasser's account of heritage, ingredients and craft is presented as the answer to the headline's question.\nSources agree / disagree\nOnly Vogue Taiwan has covered the collection so far, with no other outlet corroborating it yet. Trust label: Single source — only Vogue Taiwan has reported on this collection so far.\nStill uncertain\nThe snippets do not say how many scents the collection holds, what they smell like, or where they are sold. The snippets name no other scent in the collection and give no release date or retail channel. The price is the one hard figure, so check the full feature before quoting details."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-beauty-01-140-thierry-wasser\",\"category\":\"beauty\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-beauty-01-140-thierry-wasser.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 140萬元的香水值得嗎？我親自噴上身，並向嬌蘭首席調香師Thierry Wasser尋找答案\",\"zh-TW\":\"相關封面圖：140萬元的香水值得嗎？我親自噴上身，並向嬌蘭首席調香師Thierry Wasser尋找答案\"},\"publishedAt\":\"2026-11-16T08:10:24.000Z\",\"title\":{\"en\":\"Guerlain's NT$1.4 Million Perfume: Is a Scent Only Eight People Can Own Worth It?\",\"zh-TW\":\"嬌蘭（Guerlain）140 萬 4 千元香水值得嗎？全球每款限量 8 組\"},\"summary\":{\"en\":\"Guerlain's LES PRIVILÈGES collection sells for NT$1.404 million per scent, with only eight sets of each made worldwide, Vogue Taiwan reported. A Vogue editor wore the perfume and interviewed master perfumer Thierry Wasser about the Guerlinade heritage, rare ingredients and craft. The question is whether scarcity and heritage justify the price.\",\"zh-TW\":\"嬌蘭（Guerlain）頂級香氛系列 LES PRIVILÈGES 每款全球限量 8 組、售價 140 萬 4 千元。Vogue 編輯親自試香，並專訪首席調香師蒂埃里·沃瑟（Thierry Wasser），從 Guerlinade 百年傳承、珍稀原料到調香工藝追問頂級香水的價值。值不值得，就看收藏者願不願意為稀缺與傳承買單。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"嬌蘭頂級香氛系列 LES PRIVILÈGES 每款全球限量 8 組、售價 140 萬 4 千元。Vogue 報導指出，編輯親自試香，並專訪首席調香師蒂埃里·沃瑟。\\n發生了什麼事\\n專訪從 Guerlinade 百年傳承、珍稀原料談到調香工藝，追問頂級香水的價值所在。標題提問很直接：140 萬元的香水值得嗎？全世界只有另外七組收藏者能擁有同款香味，是這系列最大的賣點。這系列賣的是幾乎無人能撞香的體驗：每款全球只有 8 組，買下就是八分之一。\\n為什麼重要\\n140 萬 4 千元買的不只是香水本身，而是稀缺性與百年傳承；首席調香師的說法，就是這筆價格最接近答案的解釋。專訪是整篇的支撐：沃瑟對傳承、原料與工藝的說法，就是用來回答標題提問的答案。\\n來源異同\\n目前只有 Vogue Taiwan 一家報導，尚無其他媒體佐證。信任標籤：僅1源——僅 Vogue Taiwan 報導此事，尚無其他媒體佐證。\\n仍不確定\\n系列共有幾款、每款香調為何、在哪裡販售，摘要都沒有說明；系列還有哪些香調、何時上市、透過什麼通路販售，也都沒有提到。唯一確切的數字是售價，引用細節前請查閱完整專訪。\"},\"sources\":[{\"name\":\"Vogue Taiwan\",\"url\":\"https://www.vogue.com.tw/article/嬌蘭-les-privilèges\"}],\"disagreements\":null,\"trustScore\":47,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":10,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"beauty\",\"live-ingest\",\"vogue-taiwan\"],\"glossary\":[{\"blurb\":{\"en\":\"French luxury house behind the LES PRIVILÈGES fragrance collection.\",\"zh-TW\":\"法國精品品牌，本次頂級香氛系列的推出者。\"},\"term\":{\"en\":\"Guerlain\",\"zh-TW\":\"嬌蘭\"}},{\"blurb\":{\"en\":\"Guerlain's master perfumer, interviewed by Vogue about the collection's value.\",\"zh-TW\":\"嬌蘭首席調香師，接受 Vogue 專訪談系列價值。\"},\"term\":{\"en\":\"Thierry Wasser\",\"zh-TW\":\"蒂埃里·沃瑟\"}},{\"blurb\":{\"en\":\"Guerlain's top fragrance line, limited to eight sets per scent worldwide.\",\"zh-TW\":\"嬌蘭頂級香氛系列，每款全球限量 8 組。\"},\"term\":{\"en\":\"LES PRIVILÈGES\",\"zh-TW\":\"LES PRIVILÈGES\"}},{\"blurb\":{\"en\":\"Guerlain's century-old perfumery heritage invoked in the interview.\",\"zh-TW\":\"嬌蘭百年調香傳承，專訪中提及的核心價值。\"},\"term\":{\"en\":\"Guerlin
