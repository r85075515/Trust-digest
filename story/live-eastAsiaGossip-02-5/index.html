who met through the 2021 drama \"Nigeru wa Haji da ga Yaku ni Tatsu\" (月薪嬌妻) and married that year, shared the news with a jointly signed statement thanking fans and everyone who supported them — their first joint life announcement since the wedding. There had been no pregnancy reports; the pregnancy was kept entirely secret. Outlets note possible hints in hindsight: a sudden move two years ago and not renewing a beer commercial contract.\nWhy it matters\nAragaki is one of Japan's most beloved stars, and the couple's extreme privacy — five years of marriage with zero pregnancy rumors — makes this a genuine surprise. The announcement dominated Taiwan and Japanese entertainment coverage within hours.\nSources agree / disagree\nETtoday, Yahoo TW, Vogue Taiwan, and Google News TW entertainment items agree on all core facts — the date, the joint statement, the five-year marriage, the secret pregnancy. No conflicting facts.\nStill uncertain\nThe statement disclosed no details about the baby's sex or birth date. Verify any further details in official announcements."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-eastAsiaGossip-02-5\",\"category\":\"eastAsiaGossip\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-eastAsiaGossip-02-5.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 快訊／新垣結衣生了！　閃婚星野源5年迎第一胎出生\",\"zh-TW\":\"相關封面圖：快訊／新垣結衣生了！　閃婚星野源5年迎第一胎出生\"},\"publishedAt\":\"2026-10-13T07:05:46.000Z\",\"title\":{\"en\":\"Yui Aragaki and Gen Hoshino Announce Birth of First Child\",\"zh-TW\":\"新垣結衣、星野源宣布第一個孩子出生\"},\"summary\":{\"en\":\"Yui Aragaki (新垣結衣), 38, and Gen Hoshino (星野源) announced the birth of their first child, five years after marrying in 2021. The couple, who met through the hit drama that brought them together that year, shared the news via a joint signed statement on their official websites, thanking fans — with no prior pregnancy announcement.\",\"zh-TW\":\"38 歲的新垣結衣與星野源宣布第一個孩子出生，兩人 20
