ned\nYu Shuxin has become embroiled in a reputation-rights lawsuit against online detractors. A 14-year-old netizen posted that he was the actual reposter, pleading for leniency for the sake of his mother with cancer and his amputee grandfather. Yu's studio issued a statement on November 17 clarifying that the defendants do not include the rumored minor, that the defamatory content had been viewed more than 35,000 times, and urging the public not to dox or attack anyone. A separate report says the boy claims his father and grandfather were also named as defendants, and a former lawyer has discussed the mediation behind the scenes. Other headlines in the batch touch on a separate 'apron photo' controversy involving Yu.\nWhy it matters\nThe case tests where accountability for online abuse meets protection for minors: suing haters is a star's legal right, but a child pleading for his sick mother turns a routine lawsuit into a public sympathy test. The studio's four-point statement shows it knows the optics matter as much as the law.\nSources agree / disagree\nETtoday and Yahoo Taiwan agree on the core sequence — lawsuit, the boy's plea, the studio's November 17 statement. They diverge on one point: the boy says his father and grandfather were also listed as defendants, while the studio says the minor is not among the defendants. The '17 vs 4' flagged in the raw feed is not a conflict: 17 is the date and 4 is the number of statements. Trust label: Accounts differ — the studio and the boy give conflicting accounts of who is a defendant, and the claims are unverified.\nStill uncertain\nConflicting accounts, unconfirmed: whether the boy's father and grandfather are defendants, and whether the boy is the actual reposter, rest on his own posts and the studio's statement alone. The mediation details, the identities of the other defendants, and the outcome of the case are all still unknown."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-eastAsiaGossip-02-14-ettoday-ettoday\",\"category\":\"eastAsiaGossip\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-eastAsiaGossip-02-14-ettoday-ettoday.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 虞書欣開告酸民　14歲國中生哭求「放過癌母、截肢爺」 - ETtoday星光雲| ETtoday新聞雲\",\"zh-TW\":\"相關封面圖：虞書欣開告酸民　14歲國中生哭求「放過癌母、截肢爺」 - ETtoday星光雲| ETtoday新聞雲\"},\"publishedAt\":\"2026-11-17T17:50:00.000Z\",\"title\":{\"en\":\"Yu Shuxin Sues Online Haters as 14-Year-Old Pleads for 'Cancer-Stricken Mother, Amputee Grandfather'\",\"zh-TW\":\"虞書欣提告酸民：14歲國中生哭求放過癌母、截肢爺\"},\"summary\":{\"en\":\"Actress Yu Shuxin has sued online haters in a reputation-rights case, and a 14-year-old netizen who says he is the actual reposter pleads for leniency, citing his mother with cancer and amputee grandfather. Her studio said on November 17 the minor is not a defendant — but the boy claims his father and grandfather were listed, a clash still unconfirmed.\",\"zh-TW\":\"女星虞書欣提告酸民打名譽權官司，一名自稱實際轉發者的14歲網友哭求放過，稱母親患癌、爺爺截肢。工作室11月17日澄清，被告不包含網傳的未成年人——但該名少年稱父親、爺爺也被列為被告。⚠ 說法衝突，尚未證實。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"女星虞書欣提告酸民打名譽權官司——一名自稱實際轉發者的14歲網友哭求放過，稱母親患癌、爺爺截肢。\\n發生了什麼事\\n虞書欣近期捲入名譽權官司，提告網路酸民。一名14歲網友發文自稱是實際轉發者，懇求放過患癌的母親與截肢的爺爺，引發熱議。虞書欣工作室11月17日發出聲明澄清，強調被告並不包含網傳的未成年人，造謠內容瀏覽量逾3.5萬人次，呼籲外界不要肉搜攻擊。另有報導稱，該名少年說父親、爺爺也被列為被告，前律師則揭露調解內幕。同批另有虞書欣「圍裙照」爭議的標題。\\n為什麼重要\\n這起官司考驗網路霸凌究責與未成年人保護的界線：提告是明星的合法權利，但孩子為病母求情，立刻把例行訴訟變成輿論同情的考驗。工作室一次發四點聲明，說明它很清楚觀感與法律同樣重要。\\n來源異同\\nETtoday 與 Yahoo 台灣在主線事實上一致——提告、少年求情、工作室11月17日聲明。分歧在一點：少年稱父親、爺爺也被列為被告，工作室則說未成年人不在被告之列。原始 feed 標示的「17 比 4」不是衝突：17 是日期，4 是聲明點數。信任標籤：說法分歧——工作室與少年的被告名單說法互相矛盾，說法未經證實。\\n仍不確定\\n⚠ 說法衝突，尚未證實：少年的父親、爺爺是否為被告，以及少年是否真是實際轉發者，目前只有他自己的發文與工作室聲明兩方說法。調解細節、其他被告身分、官司結果都還不清楚。\"},\"sources\":[{\"name\":\"ETtoday 影劇\",\"url\":\"https://star.ettoday.net/news/3273930\"},{\"name\":\"Google News\",\"url\":\"https://news.google.com/rss/articles/CBMiTkFVX3lxTE1GRXk1MlN6NXQtWUZNbGVxeVJvanFwbzdBb01JYlpVQ1l0VDl1YVFtT1lMVnA4ZWZ1VHBXNUJqOXRHWk5Ccl84dEpfZkpHQdIBTEFVX3lxTE1M
