turn' if countries act with urgency and cooperation. The Guardian's video report captures the opening address.\nWhat happened\nBowen, speaking as COP31 president of negotiations, conceded the overshoot while insisting the 1.5C goal is still recoverable. The Guardian's report notes the backdrop: soaring fossil fuel prices and growing pressure to accelerate the clean-energy transition. The feed snippet cuts off mid-sentence, so Bowen's specific calls are not captured here.\nWhy it matters\nThe judgment is about the framing: the COP31 president is conceding the overshoot in the opening session rather than letting it surface later. That sets the tone for the talks — the question is no longer whether the limit will be breached, but whether countries can return to it, and what they will commit to do so.\nSources agree / disagree\nThis story comes from a single outlet, The Guardian's climate desk, as a video report. Trust label: Single source — one Guardian video report; Bowen's remarks are unverified elsewhere in the cluster.\nStill uncertain\nThe snippet is truncated, so Bowen's specific proposals, any targets, and the reactions of other delegations are all missing. Watch the full Guardian video before quoting his remarks."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-energy-01-australia-s-chris-bowen-\",\"category\":\"energy\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-energy-01-australia-s-chris-bowen-.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Australia's Chris Bowen tells Cop31 the world can still limit global heating to 1.5C – video\",\"zh-TW\":\"相關封面圖：澳洲的 Chris Bowen 告訴 Cop31，世界仍然可以將全球升溫限制在攝氏 1.5 度 – 影片\"},\"publishedAt\":\"2026-11-10T02:23:21.000Z\",\"title\":{\"en\":\"Chris Bowen Tells COP31 the World Can Still Return to 1.5C\",\"zh-TW\":\"鮑文（Chris Bowen）在 COP31 開幕式上說：世界仍可重回攝氏 1.5 度\"},\"summary\":{\"en\":\"At the COP31 opening in Turkey, negotiations president and Australian climate minister Chris Bowen acknowledged the world will overshoot the Paris Agreement's 1.5C limit but said 'we can return' if countries act urgently and together. The Guardian's video report is the only source in this cluster.\",\"zh-TW\":\"在土耳其 COP31 開幕式上，談判主席、澳洲氣候變遷部長鮑文（Chris Bowen）承認世界將超過《巴黎協定》攝氏 1.5 度的升溫上限，但表示各國若緊急行動、攜手合作，「我們可以重回」。本批唯一來源是《衛報》的影片報導。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"在土耳其 COP31 開幕式上，談判主席、澳洲氣候變遷部長鮑文（Chris Bowen）承認世界將超過《巴黎協定》攝氏 1.5 度的升溫上限，但表示各國若緊急行動、攜手合作，「我們可以重回」。這番話出自《衛報》的開幕影片報導。\\n發生了什麼事\\n鮑文以 COP31 談判主席身分發言，承認升溫將超標，同時堅持 1.5 度目標仍可挽回。《衛報》報導提到背景：化石燃料價格飆升，要求加速能源轉型的壓力不斷升高。來源摘要在此截斷，鮑文的具體呼籲沒有被收錄。\\n為什麼重要\\n重點在發言時機：COP31 主席在開幕式上就承認超標，而不是等到談判後期才浮現。這定下了談判基調——問題不再是上限會不會被突破，而是各國能不能重回目標，以及願意承諾什麼。\\n來源異同\\n本批只有《衛報》氣候版一家來源，是一則影片報導。信任標籤：僅1源——僅《衛報》一則影片報導，鮑文的發言未獲本批他處證實。\\n仍不確定\\n來源摘要被截斷，鮑文的具體提案、目標數字、其他代表團的反應全部缺失。引用發言前請觀看《衛報》完整影片。\"},\"sources\":[{\"name\":\"The Guardian Climate Crisis\",\"url\":\"https://www.theguardian.com/environment/video/2026/nov/10/australias-chris-bowen-tells-cop31-the-world-can-still-limit-global-heating-to-15c-video\"}],\"disagreements\":null,\"trustScore\":59,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"energy\",\"live-ingest\",\"the-guardian-climate-crisis\"],\"glossary\":[{\"term\":{\"en\":\"Chris Bowen\",\"zh-TW\":\"鮑文\"},\"blurb\":{\"en\":\"Australian climate minister and COP31 president of negotiations.\",\"zh-TW\":\"澳洲氣候變遷部長兼 COP31 談判主席。\"}},{\"term\":{\"en\":\"COP31\",\"zh-TW\":\"COP31\"},\"blurb\":{\"en\":\"31st UN climate conference, held in Turkey.\",\"zh-TW\":\"在土耳其舉行的第 31 屆聯合國氣候大會。\"}},{\"term\":{\"en\":\"Paris Agreement\",\"zh-TW\":\"巴黎協定\"},\"blurb\":{\"en\":\"2015 climate pact that set the 1.5C warming limit.\",\"zh-TW\":\"2015 年氣候協議，訂下攝氏 1.5 度的升溫上限。\"}},{\"term\":{\"en\":\"The Guardian\",\"zh-TW\":\"衛報\"},\"blurb\":{\"en\":\"British newspaper whose climate desk reported Bowen's remarks.\",\"zh-TW\":\"報導鮑文發言的英國報紙氣候版。\"}},{\"term\
