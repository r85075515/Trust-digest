and Mirror Media agrees on the core sequence. The same card bundles three further items from UHK: a 41-year-old actress said to have ended an eight-year relationship, a 35-year-old actress hinting at a breakup after two years with a second-generation star, and a 35-year-old actress announcing a divorce after three years of marriage.\nWhy it matters\nLeaked private messages can end a rising actor's career overnight — Japanese netizens quoted in the coverage already lament that Keito's career is finished — and the episode shows how quickly an unverified screenshot dump becomes a public trial. Hakata's response also matters: her pivot from apology to defending AV actresses turned a scandal story into a debate about stigma.\nSources agree / disagree\nETtoday, Yahoo, China Times, and Mirror Media agree on the core facts of the Keito–Hakata episode, while the three bundled breakup and divorce items come only from UHK headlines with no detail. The '20 vs 27' flagged in the raw feed is not a conflict: 20 is Hakata's age and 27 is Keito's. No screenshot has been authenticated by either party. Trust label: Bundled stories — several outlets agree on the main episode, but the screenshots are unverified and the bundled items are headline-only.\nStill uncertain\nThe screenshots' authenticity is unconfirmed, neither Keito nor his agency is quoted responding, and the three bundled breakup and divorce claims rest on headlines alone, with the 41-year-old actress unnamed. Treat the episode as an allegation until the parties or their agencies confirm it."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-eastAsiaGossip-01-41-uhk\",\"category\":\"eastAsiaGossip\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-eastAsiaGossip-01-41-uhk.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 41歲女藝人驚爆結束八年情分手內幕！承認唔係好開心：以為唔變就唔使煩 - UHK 港生活\",\"zh-TW\":\"相關封面圖：41歲女藝人驚爆結束八年情分手內幕！承認不是很快樂：以為不變就不用煩 - UHK港生活\"},\"publishedAt\":\"2026-11-17T07:38:04.000Z\",\"title\":{\"en\":\"Tsuna Keito's Leaked DMs to AV Actress Hakata Sayo Spark 'Pure Love' Apology\",\"zh-TW\":\"綱啓永（Tsuna Keito）私訊外流風波：博多彩葉道歉稱追求純愛\"},\"summary\":{\"en\":\"Japanese actor Tsuna Keito, 27, faces a leaked-message storm after a gossip account posted screenshots said to show his Instagram DMs and LINE chats with AV actress Hakata Sayo, 20, including secrecy requests and a sauna invitation. Hakata apologized, saying she sought 'pure love,' then defended AV actresses' dignity, splitting netizens. The card also bundles three breakup and divorce items.\",\"zh-TW\":\"27歲日本男星綱啓永（Tsuna Keito）捲入私訊外流風波：爆料帳號11月16日公開截圖，稱是他與20歲AV女優博多彩葉的Instagram私訊與LINE對話，包括要求保密、邀約一起去三溫暖。博多彩葉道歉，說自己追求的是「純愛」，接著又為AV女優的尊嚴發聲，引發網友兩極討論。同批另有三則分手與離婚消息。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"27歲日本男星綱啓永（Tsuna Keito）捲入私訊外流風波：據稱是他與20歲AV女優博多彩葉私訊對話的截圖11月16日在網上曝光。\\n發生了什麼事\\n日本爆料帳號11月16日公開一系列截圖，聲稱是綱啓永與20歲AV女優博多彩葉的Instagram私訊及LINE對話，內容包括要求保密、邀約一起去三溫暖，還有暗示想見面的曖昧內容。博多彩葉隨後發文道歉，坦言「我原本追求的是純愛」，接著又公開為AV女優的尊嚴發聲，引發網友兩極討論。ETtoday、Yahoo、中時、鏡週刊對事件主線的報導一致。同批另有三則來自 UHK 的消息：41歲女藝人結束八年情、35歲女藝人情人節後暗示與星二代分手、35歲女藝人結婚3年宣布離婚。\\n為什麼重要\\n私訊外流一夜就能斷送當紅男星的前程——報導引述的日本網友已經感嘆他「事業完了」，也顯示未經證實的截圖多快就會變成公開審判。博多彩葉的回應同樣關鍵：她從道歉轉向為AV女優辯護，把醜聞變成一場關於汙名的討論。\\n來源異同\\nETtoday、Yahoo、中時、鏡週刊在綱啓永與博多彩葉事件的主線事實上一致；同批三則分手、離婚消息只有 UHK 的標題，沒有細節。原始 feed 標示的「20 比 27」不是衝突：20歲是博多彩葉的年齡，27歲是綱啓永的年齡。雙方都還沒有證實截圖真偽。信任標籤：混裝多則——多家媒體在主線事件上一致，但截圖未經證實，同批消息只有標題。\\n仍不確定\\n截圖真偽未經證實，綱啓永本人與經紀公司都沒有回應，三則分手、離婚消息只有標題，其中41歲女藝人連姓名都沒公開。在當事人或經紀公司證實之前，先把這起事件視為指控。\"},\"sources\":[{\"name\":\"ETtoday 影劇\",\"url\":\"https://star.ettoday.net/news/3273574\"},{\"name\":\"Google News TW Entertainment\",\"url\":\"https://news.google.com/rss/articles/CBMikANBVV95cUxPUkxzTDJXME0wM19FZG5nWlR3ZVRSYXlfSzl2aFExQVFtaGdKOWNrdnJPeTY2eGN0Y2N2NmUtUFZuc3FhbFQ0OFZMUDducUNCeVhqWG9yeUFyODhDWjNsNEtYNExFOHFSQktmZ1BDR1ZzM3diMU1WaEdjVGVnSVZRdkJPUUdpZ3dsMzljWjBoQy05N19XSG42VXJodEFuTHVfaWY0UnE3ejdoRENoV1FYQzZpMDh5VHVXdHhLbEVxRm00Qm9lVXdYTUlRYWVNNnhxclhaX2Q2MklFd2VWRXlyaldOU1BicjhFWGNT
