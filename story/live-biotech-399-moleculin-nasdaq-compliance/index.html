ained compliance with Nasdaq Listing Rule 5550(a)(2), which requires a minimum bid price of 1.00 USD per share. The company had originally received a deficiency notice on Sept. 15, 2026.\n\nWhy it matters\nRegaining compliance removes an immediate delisting threat for the oncology drug developer, yet strict conditions remain attached undera Nov. 12 Nasdaq Hearings Panel exception. Moleculin must satisfy all continued listing standards through March 15, 2027, followed by a mandatory Panel monitor from March 16 through Nov. 24, 2027, during which any bid-price breach would trigger a delisting determination without a cure period.\n\nSource differences\nStock Titan (\"Moleculin Biotech regains Nasdaq bid-price compliance - Stock Titan\") provides direct SEC EDGAR Form 8-K metadata, confirming Item 7.01 disclosure and Exhibit 99.1 investor presentation details. TradingView News (\"Moleculin Biotech Regains Nasdaq Minimum Bid Price Compliance\") summarizes the key compliance dates and appeal rights if a violation occurs during the 2027 monitoring window.\n\nStill uncertain\nWhether Moleculin Biotech will satisfy all remaining Nasdaq continued listing requirements—such as stockholders' equity thresholds—ahead of the March 15, 2027 deadline remains unresolved.\n\nTrust label: Official confirmation — Backed by Moleculin Biotech's Nov. 27 SEC Form 8-K filing data reported by Stock Titan and TradingView News."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-biotech-399-moleculin-nasdaq-compliance\",\"category\":\"biotech\",\"title\":{\"en\":\"Moleculin Biotech Regains Nasdaq Minimum Bid Price Compliance Under Monitoring Terms\",\"zh-TW\":\"Moleculin Biotech 恢復那斯達克最低股價合規 仍須接受至 2027 年強制監管\"},\"summary\":{\"en\":\"Moleculin Biotech disclosed in an SEC Form 8-K on Nov. 27, 2026, that Nasdaq notified the company on Nov. 24 of regained compliance with the 1.00 USD minimum bid price rule. However, the clinical-stage oncology firm must meet all listing rules through March 15, 2027, and remain under a mandatory Panel monitor until Nov. 24, 2027.\",\"zh-TW\":\"臨床階段生技公司 Moleculin Biotech 於 2026 年 11 月 27 日透過美國證交會（SEC）8-K 文件揭露，已於 11 月 24 日接獲那斯達克通知恢復符合 1.00 美元最低買入價規定。不過該公司仍須在 2027 年 3 月 15 日前維持全面上市合規，並接受強制監管期至 2027 年 11 月 24 日。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n臨床階段腫瘤藥物研發商 Moleculin Biotech（股票代號 MBRX）於 2026 年 11 月 27 日向美國證券交易委員會（SEC）提交 Form 8-K 重大事件申報，揭露公司已於 11 月 24 日收到那斯達克（Nasdaq）正式通知，確認其股價已重新符合上市規則第 5550(a)(2) 條規定的 1.00 美元最低買入價門檻，解除自 9 月 15 日收到違規通知以來的下市警報。\\n\\n「為什麼重要」\\n雖然股價暫時過關，但依據那斯達克聽證委員會於 11 月 12 日授予的豁免條件，該公司仍須在 2027 年 3 月 15 日前達成所有持續上市規範，並於 2027 年 3 月 16 日至 11 月 24 日期間接受委員會強制監管；若監管期間再度跌破最低股價要求，交易所將直接發出下市裁定且不再給予寬限期。\\n\\n「來源異同」\\nStock Titan（\\\"Moleculin Biotech regains Nasdaq bid-price compliance - Stock Titan\\\"）完整列出 SEC EDGAR 資料庫的 Form 8-K 申報時間、Item 7.01 條目及附件 99.1 投資人簡報資訊；TradingView News（\\\"Moleculin Biotech Regains Nasdaq Minimum Bid Price Compliance\\\"）則重點整理 2027 年監管時程與公司可提出上訴的程序權利。\\n\\n「仍不確定」\\nMoleculin Biotech 能否在 2027 年 3 月 15 日期限前滿足股東權益等其餘所有那斯達克持續上市標準，仍有待後續財務與股價表現驗證。\\n\\nTrust label: Official confirmation — 依據 SEC EDGAR 公開之 Form 8-K 申報資訊，並由 Stock Titan 與 TradingView News 報導核對。\"},\"glossary\":[{\"term\":{\"en\":\"Nasdaq Listing Rule 5550(a)(2)\",\"zh-TW\":\"那斯達克上市規則第 5550(a)(2) 條\"},\"blurb\":{\"en\":\"The Nasdaq Capital Market rule requiring listed companies to maintain a minimum closing bid price of 1.00 USD per share.\",\"zh-TW\":\"那斯達克資本市場規範，要求上市公司普通股收盤買入價不得長期低於每股 1.00 美元。\"}},{\"term\":{\"en\":\"SEC Form 8-K\",\"zh-TW\":\"SEC Form 8-K 重大事件申報書\"},\"blurb\":{\"en\":\"A mandatory report U.S. public companies must file with the Securities and Exchange Commission to announce major corporate events.\",\"zh-TW\":\"美國上市公司發生對股東具有重大影響的事件（如上市合規變動）時，必須向證交會提交的即時揭露文件。\"}},{\"term\":{\"en\":\"Mandatory Panel Monitor\",\"zh-TW\":\"聽證委員會強制監管期\"},\"blurb\":{\"en\":\"A post-compliance oversight period imposed by Nasdaq during which a repeat rule violation triggers immediate delisting notice without a grace period.\",\"zh-TW\":\"那斯達克在公司恢復合規後設定的觀察期，期間若再次違規將直接啟動下市程序而不再給予改善寬限期。\"}}],\"sources\":[{\"name\":\"Stock Titan\",\"url\":\"https://www.stocktitan.net/sec-filings/MBRX/8-k-moleculin-biotech-inc-reports-material-event-a4c99eb510c6.html\"},{\"name\":\"TradingView News\",\"url\":\"https://www.tradingview.com/news/tradingview:e5cad1adac447:0-moleculin-biotech-regains-nasdaq-minimum-bid-price-compliance/\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"Moleculin Biotech Regains Nasdaq Minimum Bid Price Compliance Under Monitoring Terms\",\"zh-TW\":\"Moleculin Biotech 恢復那斯達克最低股價合規 仍須接受至 2027 年強制監管\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":85,\"trustBreakdown\":{\"crossCorroboration\":20,\"outletReputation\":21,\"recencyClarity\":24,\"sourceDiversity\":20},\"publishedAt\":\"2026-11-28T08:34:56.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":21,\"D2\":22,\"D3\":22,\"D4\":20,\"D5\":21,\"total\":21},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-biotech-399-moleculin-nasdaq-compliance/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-biotech-399-mol
