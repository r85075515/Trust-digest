ion downward: the quake's magnitude was lowered to 6.9.\nWhat happened\nThe sequence in the report is short. An earthquake occurred off Vanuatu, a tsunami warning was issued, and the warning has since been lifted, with the magnitude now given as 6.9. The report does not describe shaking, waves, or damage, and it does not give a depth or an exact epicenter beyond the waters off Vanuatu.\nWhy it matters\nA lifted warning is the difference between precaution and emergency. For readers in the Pacific region, the revision matters because it closes the immediate threat window: coastal residents can stand down, and attention shifts from evacuation to checking for damage. The brevity of the report is itself the news, no escalation followed.\nSources agree-disagree\nThis card rests on a single outlet, Central News Agency's international desk, citing the Pacific Tsunami Warning Center. There is no second outlet to corroborate or contradict the magnitude or the lifting of the warning. Trust label: single source only.\nStill uncertain\nThe summary does not give the quake's earlier magnitude figure, its depth, or any damage or casualty information. Whether the quake caused any harm on Vanuatu's islands is not yet reported in this feed."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-02-6-9\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-taiwan-02-6-9.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 萬那杜地震規模下修至6.9　海嘯警報解除\",\"zh-TW\":\"相關封面圖：萬那杜地震規模下修至6.9　海嘯警報解除\"},\"publishedAt\":\"2026-10-24T04:58:54.000Z\",\"title\":{\"en\":\"Vanuatu Quake Revised Down to Magnitude 6.9, Tsunami Warning Lifted\",\"zh-TW\":\"萬那杜外海地震規模下修至 6.9，海嘯警報解除\"},\"summary\":{\"en\":\"The Pacific Tsunami Warning Center says a magnitude 6.9 earthquake struck off Vanuatu today, and a tsunami warning issued earlier has now been lifted. The update comes from Taiwan's Central News Agency, citing the center's report. With no damage or casualty details in the summary, the next update to watch is the local damage assessment.\",\"zh-TW\":\"太平洋海嘯警報中心表示，萬那杜外海今天發生規模 6.9 地震，稍早發布的海嘯警報已經解除。消息來自中央社雪梨綜合外電，引述該中心的說法。摘要未提災損或傷亡，接下來看當地災損評估。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"太平洋海嘯警報中心表示，萬那杜外海今天發生規模 6.9 地震，稍早發布的海嘯警報已經解除。中央社雪梨綜合外電引述該中心的說法報導了這項更新。標題數字是一次下修：地震規模被調降至 6.9。\\n發生了什麼事\\n報導中的順序很短：萬那杜外海發生地震、海嘯警報發布、警報隨後解除，規模定為 6.9。報導未描述震感、海浪或災損，也沒給震源深度，只說地點在萬那杜外海。\\n為什麼重要\\n警報解除，就是戒備與緊急狀態的分界。對太平洋地區的讀者來說，這次修正的意義在於關上立即威脅的窗口：沿海居民可以解除戒備，注意力轉向檢查災損。報導本身的簡短就是消息：後續沒有升級。\\n來源異同\\n本卡只有一個來源：中央社國際版引述太平洋海嘯警報中心。沒有第二家媒體可以佐證或反駁規模數字與警報解除。信任標籤：僅1源。\\n仍不確定\\n摘要未給地震原先的規模數字、震源深度，也沒有任何災損或傷亡資訊。地震是否對萬那杜島嶼造成損害，這批摘要還沒有報導。\"},\"sources\":[{\"name\":\"中央社-國際\",\"url\":\"https://www.cna.com.tw/news/aopl/202610240078.aspx\"}],\"disagreements\":null,\"trustScore\":59,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"中央社-國際\"],\"glossary\":[{\"term\":{\"en\":\"Pacific Tsunami Warning Center\",\"zh-TW\":\"太平洋海嘯警報中心\"},\"blurb\":{\"en\":\"Center that reported the Vanuatu quake and lifted the tsunami warning.\",\"zh-TW\":\"通報萬那杜地震並解除海嘯警報的中心。\"}},{\"term\":{\"en\":\"Vanuatu\",\"zh-TW\":\"萬那杜\"},\"blurb\":{\"en\":\"Pacific island nation off whose coast the quake struck.\",\"zh-TW\":\"地震發生於其外海的太平洋島國。\"}},{\"term\":{\"en\":\"Central News Agency\",\"zh-TW\":\"中央社\"},\"blurb\":{\"en\":\"Taiwan news agency that reported the update from Sydney.\",\"zh-TW\":\"從雪梨發出這則更新的台灣新聞媒體。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources,
