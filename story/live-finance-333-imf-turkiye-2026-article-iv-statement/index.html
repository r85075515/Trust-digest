 the Republic of Türkiye on November 27, 2026. The mission noted that Middle East conflict shocks slowed year-on-year growth to 2.3% in Q2 2026, while prompt monetary tightening by the Central Bank of the Republic of Türkiye (CBRT)—including a 300-basis-point effective funding rate hike via suspending one-week repo auctions on November 26—helped bring inflation down from 32.6% in May to 29.8% in October.\n\nWhy it matters\nTürkiye's gross reserves fell by 42 billion USD from end-2025 to 142 billion USD as of November 20 due to foreign-exchange sales, lower gold prices, and global risk-off sentiment. While IMF staff forecast growth to rebound from 2.7% in 2026 to 3.6% in 2027, persistent double-digit inflation expectations and sensitivity to Strait of Hormuz shipping disruptions leave the economy exposed to external shocks.\n\nSource differences\nThe IMF published its primary official release titled \"Republic of Türkiye: Staff Concluding Statement of the 2026 Article IV Mission\", providing full macroeconomic and reserve figures. Traders Union published \"Türkiye faces slower disinflation as IMF flags external shocks and policy risks\", summarizing the same IMF mission statement and highlighting the November 26 repo auction suspension and persistent inflation path from 29.9% at end-2026 to 23.7% in 2027.\n\nStill uncertain\nWhether geopolitical tensions in the Middle East and shipping flows through the Strait of Hormuz will normalize in 2027 as assumed in the IMF baseline, and whether domestic fiscal and monetary policy will remain tight enough to prevent disinflation from stalling.\n\nTrust label: Single source — Both the IMF primary release and Traders Union's coverage rely exclusively on the IMF staff's November 27, 2026 Article IV concluding statement."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-333-imf-turkiye-2026-article-iv-statement\",\"category\":\"finance\",\"title\":{\"en\":\"IMF Projects Türkiye Growth to Rebound to 3.6% in 2027 as Inflation Eases Slowly\",\"zh-TW\":\"IMF 發布土耳其 2026 第四條款磋商聲明 預估明年經濟成長回升至 3.6%\"},\"summary\":{\"en\":\"In its November 27, 2026 Article IV concluding statement, the IMF projected Türkiye's GDP growth to recover from 2.7% in 2026 to 3.6% in 2027, while warning that year-end inflation will ease only gradually from 29.9% to 23.7% amid Middle East conflict risks and lower FX reserves.\",\"zh-TW\":\"國際貨幣基金（IMF）於 2026 年 11 月 27 日發布土耳其第四條款磋商總結聲明，預估土耳其經濟成長率將從 2026 年的 2.7% 回升至 2027 年的 3.6%。不過，IMF 警告受中東衝突推升能源價格及外匯存底降至 1,420 億美元影響，年底通膨率僅能緩步從 29.9% 降至 23.7%，整體風險仍偏向成長趨緩與通膨居高。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n國際貨幣基金（IMF）於 2026 年 11 月 27 日公布土耳其 2026 年第四條款（Article IV）代表團磋商總結聲明。報告指出，中東衝突帶來的能源價格上漲與外需疲軟，使土耳其 2026 年第二季年增率放緩至 2.3%；但土耳其中央銀行（CBRT）於 3 月及時緊縮貨幣政策，並於 11 月 26 日暫停一週期附買回（repo）拍賣使有效融資利率提高 300 個基點，促使通膨率從 5 月的 32.6% 回落至 10 月的 29.8%。\\n\\n「為什麼重要」\\n受外匯干預拋售、金價下跌及全球避險情緒升溫影響，截至 11 月 20 日土耳其外匯存底降至 1,420 億美元，較 2025 年底減少 420 億美元。IMF 雖預估土耳其 GDP 成長率將自 2026 年的 2.7% 回升至 2027 年的 3.6%，但因薪資與定價的回溯慣性，年底通膨率預計僅從 29.9% 緩降至 23.7%，中期仍將維持在雙位數水準。\\n\\n「來源異同」\\nIMF 官網發布一手正式聲明「Republic of Türkiye: Staff Concluding Statement of the 2026 Article IV Mission」，完整揭露成長、通膨、經常帳赤字與外匯存底數據；財經新聞網站 Traders Union 則刊出「Türkiye faces slower disinflation as IMF flags external shocks and policy risks」，綜述同一份 IMF 代表團聲明，聚焦土耳其中央銀行 11 月 26 日暫停一週期附買回拍賣升息 300 個基點及年底通膨自 29.9% 緩降至 23.7% 之風險評估。\\n\\n「仍不確定」\\nIMF 基準預測假設荷姆茲海峽航運將於 2027 年逐步恢復正常，若中東戰事延長或升級，以及土耳其國內政策力道不足，恐導致去通膨進程停滯並擴大外部失衡。\\n\\nTrust label: Single source — 報導內容與數據均源自 IMF 2026 年 11 月 27 日發布之同一份官方第四條款磋商總結聲明。\"},\"glossary\":[{\"term\":{\"en\":\"Article IV Consultation\",\"zh-TW\":\"第四條款磋商\"},\"blurb\":{\"en\":\"An annual bilateral surveillance process under Article IV of the IMF's Articles of Agreement in which IMF economists assess a member country's economic and financial policies.\",\"zh-TW\":\"依據《國際貨幣基金協定》第四條款進行的年度雙邊經濟監督機制，由 IMF 經濟學家團隊赴成員國評估財政、貨幣與金融政策。\"}},{\"term\":{\"en\":\"One-Week Repo Auction\",\"zh-TW\":\"一週期附買回拍賣\"},\"blurb\":{\"en\":\"The Central Bank of the Republic of Türkiye's primary liquidity-provision tool; suspending it forces banks toward higher-rate overnight facilities, effectively tightening borrowing costs.\",\"zh-TW\":\"土耳其中央銀行提供市場流動性的主要政策工具；暫停該拍賣會迫使商業銀行轉向利率較高的隔夜融資窗口，達到實質升息緊縮效果。\"}},{\"term\":{\"en\":\"Current Account Deficit\",\"zh-TW\":\"經常帳赤字\"},\"blurb\":{\"en\":\"A macroeconomic measure occurring when a country's total imports of goods, services, and transfers exceed its exports, reaching 2.2% of Türkiye's GDP in the 12 months to September 2026.\",\"zh-TW\":\"一國商品、服務貿易及移轉收支的總進口大於總出口時產生的逆差；土耳其截至 2026 年 9 月的過去 12 個月經常帳赤字占 GDP 比重擴大至 2.2%。\"}}],\"sources\":[{\"name\":\"International Monetary Fund (IMF)\",\"url\":\"https://www.imf.org/en/news/articles/2026/11/27/cs-2026-11-27-republic-turkiye-staff-concluding-statement-2026-article-iv-mission\"},{\"name\":\"Traders Union\",\"url\":\"https://tradersunion.com/news/institutions/show/4450592-turkiye-imf-disinflation-policy-risks/\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"IMF Projects Türkiye Growth to Rebound to 3.6% in 2027 as Inflation Eases Slowly\",\"zh-TW\":\"IMF 發布土耳其 2026 第四條款磋商聲明 預估明年經濟成長回升至 3.6%\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":81,\"trustBreakdown\":{\"crossCorroboration\":19,\"outletReputation\":24,\"recencyClarity\":25,\"sourceDiversity\":13},\"publishedAt\":\"2026-11-28T03:17:36.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":22,\"D2\":21,\"D3\":20,\"D4\":19,\"D5\":21,\"total\":21},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explain
