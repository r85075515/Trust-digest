signation followed reports of an affair with an alleged Chinese spy, according to The Guardian's timeline of the scandal, and AI expert Gary Marcus has analysed what is at stake for Nvidia and the mess its new chief executive has inherited.\n\nWhy it matters\nHuang was the face of the AI boom powering the US economy and a unique rhetorical and financial booster for the investments driving economic growth, so his sudden departure leaves Nvidia searching for a successor at the height of its influence. NPR reports that the interim chief executive inherits risky AI bets and a legal mess.\n\nSources agree and disagree\nFour outlets — NPR, The New York Times, ESG Dive and The Guardian — agree that Huang resigned and Kress is interim chief executive. The New York Times headline calls Huang the company's 'ousted' chief executive, but its own reporting and the other outlets describe a resignation, so this rewrite follows the reporting rather than the headline.\n\nStill uncertain\nThe feed descriptions do not say who the permanent successor might be, how the board will run the search, or the full findings behind the reported affair. The full articles are needed for those details.\n\nTrust label: Multi-source agreement — four outlets agree on the resignation and the interim appointment, though the circumstances remain partly unconfirmed."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-02-jensen-huang-nvidia-s-ou\",\"category\":\"international\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-international-02-jensen-huang-nvidia-s-ou.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Jensen Huang, Nvidia’s Ousted CEO, Was the Face of the A.I. Boom Powering the U.S. Economy\",\"zh-TW\":\"相關封面圖：Nvidia 被罢免的首席执行官黄仁勋 (Jensen Huang) 是人工智能的代言人。繁榮為美國經濟提供動力\"},\"publishedAt\":\"2026-11-13T11:47:00.000Z\",\"title\":{\"en\":\"Jensen Huang Resigns as Nvidia CEO; Colette Kress Named Interim Chief\",\"zh-TW\":\"黃仁勳（Jensen Huang）辭任輝達（Nvidia）執行長，柯萊特·克雷斯（Colette Kress）暫代職務\"},\"summary\":{\"en\":\"Jensen Huang has resigned as chief executive of Nvidia effective immediately after more than 30 years leading the company, which grew from a $1 billion firm at its 1999 listing to a company valued at more than $4 trillion. Long-time chief financial officer Colette Kress will serve as interim chief executive while the board searches for a permanent successor.\",\"zh-TW\":\"黃仁勳（Jensen Huang）在領導輝達（Nvidia）三十多年後辭去執行長，即刻生效。該公司在他任內從一九九九年上市時市值十億美元的公司，成長為市值逾四兆美元的企業。長期財務長柯萊特·克雷斯（Colette Kress）將擔任臨時執行長，直到董事會找到永久繼任人選。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"發生了什麼事\\n輝達（Nvidia）週四宣布，黃仁勳（Jensen Huang）辭去執行長，即刻生效，長期財務長柯萊特·克雷斯（Colette Kress）將擔任臨時執行長，直到找到永久繼任人選。黃仁勳（Jensen Huang）出身電機工程師，在他領導三十多年期間，公司從一九九九年上市時市值十億美元，成長為市值逾四兆美元的企業。根據《衛報》（The Guardian）整理的事件時間線，這次辭職之前傳出他與一名據稱是中國間諜的女子有婚外情；人工智慧專家蓋瑞·馬庫斯（Gary Marcus）則分析了輝達（Nvidia）面臨的利害關係，以及新任執行長接手的爛攤子。\\n為什麼重要\\n黃仁勳（Jensen Huang）是帶動美國經濟的人工智慧熱潮的代表人物，也是推動經濟成長的投資背後獨特的言論與資金推手，他的突然離任讓輝達（Nvidia）在影響力最高峰之際必須尋找繼任者。國家公共廣播電台（NPR）報導，臨時執行長接手的是高風險的人工智慧賭注與法律糾紛。\\n來源異同\\n四家媒體——國家公共廣播電台（NPR）、《紐約時報》（The New York Times）、ESG Dive 與《衛報》（The Guardian）——一致報導黃仁勳（Jensen Huang）辭職、柯萊特·克雷斯（Colette Kress）暫代執行長。《紐約時報》（The New York Times）標題稱他為「被罷免的」執行長，但其報導內容與其他媒體描述的都是辭職，因此本文以報導內容為準，而非標題用詞。\\n仍不確定\\n摘要未說明永久繼任人選可能是誰、董事會如何進行遴選，也未說明婚外情傳聞背後的完整調查結果，須查閱原文報導。\"},\"sources\":[{\"name\":\"NPR World\",\"url\":\"https://www.npr.org/2026/11/13/nx-s1-6038868/nvidia-interim-ceo-colette-kress-ai-bets-investigation-lutnick\"},{\"name\":\"NYT Economy\",\"url\":\"https://www.nytimes.com/2026/11/12/business/economy/jensen-huang-economy-nvidia-ai.html\"},{\"name\":\"ESG Dive\",\"url\":\"https://www.esgdive.com/news/nvidia-ceo-resigns-scandal-cfo-named-interim-ceo-ai/874506/\"},{\"name\":\"The Guardian Business\",\"url\":\"https://www.theguardian.com/technology/2026/nov/12/jensen-huang-affair-timeline\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":25,\"outletReputation\":21,\"crossCorroboration\":25,\"recencyClarity\":25},\"tags\":[\"international\",\"live-ingest\",\"npr-world\",\"nyt-economy\",\"esg-dive\"],\"glossary\":[{\"blurb\":{\"en\":\"Former chief executive of Nvidia, who led the company for more than 30 years.\",\"zh-TW\":\"領導輝達（Nvidia）三十多年的前任執行長。\"},\"term\":{\"en\":\"Jensen Huang\",\"zh-TW\":\"黃仁勳\"}},{\"blurb\":{\"en\":\"US chipmaker at the centre of the artificial intelligence boom.\",\"zh-TW\":\"處於人工智慧熱潮核心的美國晶片製造商。\"},\"term\":{\"en\":\"Nvidia\",\"zh-TW\":\"輝達\"}},{\"blurb\":{\"en\":\"Nvidia's long-time chief financial officer, now interim chief executive.\",\"zh-TW\":\"輝達（Nvidia）長期財務長，現任臨時執行長。\"},\"term\":{\"en\":\"Colette Kress\",\"zh-TW\":\"柯萊特·克雷斯\"}},{\"blurb\":{\"en\":\"Artificial intelligence expert who analysed the stakes for Nvidia.\",\"zh-TW\":\"分析輝達（Nvidia）局勢的人工智慧專家。\"},\"term\":{\"en\":\"Gary Marcus\",\"zh-TW\":\"蓋瑞·馬庫斯\"}},{\"blurb\":{\"en\":\"US newspaper whose headline called Huang the company's 'ousted' chief executive.\",\"zh-TW\":\"標題稱黃仁勳（Jensen Huang）為「被罷免的」執行長的美國報紙。\"},\"term\":{\"en\":\"The New York Times\",\"zh-TW\":\"紐約時報\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-international-02-jensen-huang-nvidia-s-ou/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagr
