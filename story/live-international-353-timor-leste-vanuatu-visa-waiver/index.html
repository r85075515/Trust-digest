apat at the Government Palace in Dili for a bilateral meeting, during which the two governments signed a visa waiver agreement covering ordinary passport holders. According to the Government of Timor-Leste and state news agency TATOLI, the two leaders also pledged closer cooperation on climate change and ocean protection.\n\nWhy it matters\nThe visa waiver removes entry barriers for citizens traveling between Timor-Leste and Vanuatu, strengthening diplomatic and people-to-people ties between Southeast Asia's newest ASEAN member and a key Pacific Island state. The agreement builds on historic solidarity dating back to Vanuatu's support for Timor-Leste's self-determination under its first prime minister, Walter Lini.\n\nSource differences\nThe Government of Timor-Leste official release (\"Prime Ministers of Timor-Leste and Vanuatu Sign Visa Waiver Agreement During Bilateral Meeting\") documents the signing ceremony at the Government Palace in Dili between Prime Ministers Kay Rala Xanana Gusmão and Jotham Napat. State news agency TATOLI (\"Timor-Leste and Vanuatu sign visa waiver agreement for ordinary passport holders\") specifies that the waiver applies to ordinary passport holders and provides historical context regarding former Vanuatu Prime Minister Walter Lini's support for Timor-Leste's independence struggle.\n\nStill uncertain\nThe exact maximum length of visa-free stay and the effective date when border authorities will begin implementing the exemption were not specified in the initial announcements.\n\nTrust label: Official confirmation — Verified by the Government of Timor-Leste's official press release and corroborated by state news agency TATOLI."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-353-timor-leste-vanuatu-visa-waiver\",\"category\":\"international\",\"title\":{\"en\":\"Timor-Leste and Vanuatu Sign Visa Waiver Agreement for Ordinary Passport Holders\",\"zh-TW\":\"東帝汶與萬那杜簽署普通護照持有人互免簽證協定\"},\"summary\":{\"en\":\"Timor-Leste Prime Minister Kay Rala Xanana Gusmão and Vanuatu Prime Minister Jotham Napat signed a bilateral visa waiver agreement for ordinary passport holders at the Government Palace in Dili on November 26, 2026.\",\"zh-TW\":\"東帝汶總理沙納納・古斯芒（Kay Rala Xanana Gusmão）與萬那杜總理喬坦・納帕特（Jotham Napat）於 2026 年 11 月 26 日在帝力政府宮舉行雙邊會晤，正式簽署普通護照持有人互免簽證協定。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」2026 年 11 月 26 日，東帝汶總理沙納納・古斯芒（Kay Rala Xanana Gusmão）在首都帝力政府宮接見來訪的萬那杜總理喬坦・納帕特（Jotham Napat），雙方舉行雙邊會談並正式簽署針對普通護照持有人的互免簽證協定。根據東帝汶政府官網與國家通訊社 TATOLI 報導，兩國領袖同時承諾在氣候變遷與海洋保護領域深化合作。\\n\\n「為什麼重要」該互免簽證協定消除了兩國公民往來的簽證門檻，有助於深化東帝汶與太平洋島國之間的外交與民間交流。萬那杜首任總理沃爾特・利尼（Walter Lini）曾在東帝汶爭取獨立期間公開聲援其民族自決權，此次簽約延續了兩國長期的歷史情誼與區域合作。\\n\\n「來源異同」東帝汶政府官網新聞稿（原文標題：Prime Ministers of Timor-Leste and Vanuatu Sign Visa Waiver Agreement During Bilateral Meeting）記錄了古斯芒與納帕特在帝力政府宮舉行雙邊會談並簽署協定的儀式；東帝汶國家通訊社 TATOLI（原文標題：Timor-Leste and Vanuatu sign visa waiver agreement for ordinary passport holders）則明確指出免簽適用對象為普通護照持有人，並補充萬那杜首任總理利尼支持東帝汶獨立運動的歷史背景。\\n\\n「仍不確定」免簽停留的最長天數上限，以及兩國邊境管制機關正式實施免簽通關的生效日期，目前尚未在公開聲明中揭露。\\n\\nTrust label: Official confirmation — 東帝汶政府官方新聞稿與國家通訊社 TATOLI 均已正式證實該雙邊免簽協定的簽署。\"},\"glossary\":[{\"term\":{\"en\":\"Visa Waiver Agreement\",\"zh-TW\":\"互免簽證協定\"},\"blurb\":{\"en\":\"A bilateral treaty allowing citizens of signatory nations to enter each other's territory without obtaining a visa in advance.\",\"zh-TW\":\"兩國簽署的雙邊協議，允許締約國公民無需事先申請簽證即可入境對方領土。\"}},{\"term\":{\"en\":\"Ordinary Passport\",\"zh-TW\":\"普通護照\"},\"blurb\":{\"en\":\"The standard travel document issued to regular citizens for tourism, business, or personal travel, distinct from diplomatic passports.\",\"zh-TW\":\"核發給一般公民用於觀光、商務或私人旅行的標準旅行證件，區別於外交或公務護照。\"}},{\"term\":{\"en\":\"Bilateral Meeting\",\"zh-TW\":\"雙邊會晤\"},\"blurb\":{\"en\":\"Direct diplomatic discussions held between representatives or heads of government of two sovereign states.\",\"zh-TW\":\"兩個主權國家代表或政府首長之間直接進行的外交會談與政策磋商。\"}}],\"sources\":[{\"name\":\"Government of Timor-Leste\",\"url\":\"https://timor-leste.gov.tl/?p=54308\u0026print=1\u0026lang=en\"},{\"name\":\"TATOLI Agência Noticiosa de Timor-Leste\",\"url\":\"https://en.tatoli.tl/2026/11/26/timor-leste-and-vanuatu-sign-visa-waiver-agreement-for-ordinary-passport-holders/12/\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"Timor-Leste and Vanuatu Sign Visa Waiver Agreement for Ordinary Passport Holders\",\"zh-TW\":\"東帝汶與萬那杜簽署普通護照持有人互免簽證協定\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":85,\"trustBreakdown\":{\"crossCorroboration\":21,\"outletReputation\":23,\"recencyClarity\":23,\"sourceDiversity\":18},\"publishedAt\":\"2026-11-28T04:30:51.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":23,\"D2\":22,\"D3\":21,\"D4\":21,\"D5\":20,\"total\":21},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-international-353-timor-leste-vanuatu-visa-waiver/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-international-353-timor-leste-vanuatu-visa-waiver/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axi
