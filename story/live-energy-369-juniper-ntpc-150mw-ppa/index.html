owned utility NTPC Ltd for a 150 MW wind-solar hybrid power project. Power supply under the agreement is scheduled to commence in June 2028, with expected annual revenue of 155 crore rupees (1.55 billion INR).\n\nWhy it matters\nThe long-term contract expands Juniper Green Energy's total contracted renewable portfolio to 6.4 GWp and strengthens multi-decade cash-flow visibility backed by India's largest state-owned power utility. Blending wind and solar generation also helps utilities smooth intermittent renewable output on India's grid compared with standalone solar installations.\n\nSource differences\nBusiness Today (\"Juniper Green shares rise 5% as arm inks 150 MW PPA with NTPC; key details\") specifies the subsidiary name Juniper Green Gem, the scheduled June 2028 power supply start date, and the expected annual revenue of 155 crore rupees, while noting total contract value was not disclosed. Financial Express (\"Juniper Green Energy arm signs Rs 155 cr annual revenue PPA with NTPC for 150 MW project\") reports the same 25-year wind-solar hybrid terms. PV Tech (\"Juniper Green Energy signs 150MW hybrid project PPA with NTPC\") and Rediff Money (\"Juniper Green Energy \u0026 NTPC Sign 150 MW Hybrid Energy PPA\") confirm the 25-year duration and note the addition lifts Juniper Green Energy's contracted capacity to 6.4 GWp.\n\nStill uncertain\nJuniper Green Energy has not disclosed the total cumulative contract value, the per-kilowatt-hour tariff rate, or the specific Indian state sites where the 150 MW wind and solar assets will be constructed.\n\nTrust label: Single source — All four trade and financial reports derive from Juniper Green Energy's exchange disclosure regarding the NTPC contract."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-energy-369-juniper-ntpc-150mw-ppa\",\"category\":\"energy\",\"title\":{\"en\":\"Juniper Green Energy Signs 25-Year PPA With NTPC for 150 MW Wind-Solar Hybrid Project\",\"zh-TW\":\"印度 Juniper Green Energy 與國營 NTPC 簽署 150 MW 風光混合 25 年購電協議\"},\"summary\":{\"en\":\"Juniper Green Energy's subsidiary Juniper Green Gem signed a 25-year power purchase agreement with Indian state-owned utility NTPC for a 150 MW wind-solar hybrid project. Scheduled to begin power supply in June 2028, the project is expected to generate 155 crore rupees in annual revenue and lifts the company's total contracted capacity to 6.4 GWp.\",\"zh-TW\":\"印度獨立發電商 Juniper Green Energy 旗下子公司 Juniper Green Gem 與國營電力公司 NTPC 簽署為期 25 年的購電協議（PPA），合作開發 150 MW 風光混合再生能源專案。該案預計於 2028 年 6 月啟動供電，預估年營收達 15.5 億印度盧比，並使該公司累計簽約裝置容量增至 6.4 GWp。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」印度獨立發電商 Juniper Green Energy 透過交易所公告披露，旗下子公司 Juniper Green Gem 已與國營電力公用事業 NTPC 簽署為期 25 年的購電協議（PPA），共同推進一座 150 MW 風光混合再生能源發電專案。該協議預計自 2028 年 6 月啟動供電，預估每年可貢獻 15.5 億印度盧比（155 crore rupees）營收。\\n\\n「為什麼重要」這份長達四分之一世紀的購電合約將 Juniper Green Energy 旗下累計簽約容量推升至 6.4 GWp，並藉由印度最大國營電力公司的信用背書強化長期現金流能見度。相較單一太陽能電廠，風力與太陽能互補配置也有助於平抑印度電網的間歇性供電波動。\\n\\n「來源異同」Business Today 報導「Juniper Green shares rise 5% as arm inks 150 MW PPA with NTPC; key details」完整載明簽約子公司為 Juniper Green Gem、2028 年 6 月預定供電時程與年營收 15.5 億盧比（155 crore rupees），並指出公司未揭露合約總金額；Financial Express 報導「Juniper Green Energy arm signs Rs 155 cr annual revenue PPA with NTPC for 150 MW project」核實相同合約條件；PV Tech 報導「Juniper Green Energy signs 150MW hybrid project PPA with NTPC」與 Rediff Money 報導「Juniper Green Energy \u0026 NTPC Sign 150 MW Hybrid Energy PPA」則補充該案使公司總簽約容量達到 6.4 GWp。\\n\\n「仍不確定」Juniper Green Energy 尚未公開該協議的累計合約總價值、每度電得標電價費率，以及這座 150 MW 風光混合電廠在印度的具體選址地點。\\n\\nTrust label: Single source — 上述四篇能源與財經報導均源自 Juniper Green Energy 針對 NTPC 簽約案發布的同一份公司揭露公告。\"},\"glossary\":[{\"term\":{\"en\":\"Power Purchase Agreement (PPA)\",\"zh-TW\":\"購電協議（PPA）\"},\"blurb\":{\"en\":\"A long-term electricity supply contract between a power generator and a utility or corporate buyer at predetermined pricing terms.\",\"zh-TW\":\"發電業者與電力公用事業或企業買家之間簽訂的長期電力採購合約，預先約定供電期間與價格條件。\"}},{\"term\":{\"en\":\"Wind-Solar Hybrid Project\",\"zh-TW\":\"風光混合發電專案\"},\"blurb\":{\"en\":\"A renewable power installation combining wind turbines and solar panels to deliver steadier electricity across day-night and seasonal cycles.\",\"zh-TW\":\"結合風力發電機與太陽光電板的可再生能源電廠，利用風能與日照的時段互補提升供電穩定度。\"}},{\"term\":{\"en\":\"Independent Power Producer (IPP)\",\"zh-TW\":\"獨立發電商（IPP）\"},\"blurb\":{\"en\":\"A non-utility entity that owns and operates power generation facilities to sell electricity to state utilities or end users.\",\"zh-TW\":\"非傳統公營電業的民營發電企業，負責投資興建並營運電廠，再將電力售予國營電網或終端用戶。\"}}],\"sources\":[{\"name\":\"Business Today\",\"url\":\"https://www.businesstoday.in/markets/stocks/story/juniper-green-shares-jump-as-arm-inks-150-mw-ppa-with-ntpc-key-details-569583-2026-11-26\"},{\"name\":\"Financial Express\",\"url\":\"https://www.financialexpress.com/business/industry-juniper-green-energy-arm-signs-rs-155-cr-annual-revenue-ppa-with-ntpc-for-150-mw-project-4394465/\"},{\"name\":\"PV Tech\",\"url\":\"https://www.pv-tech.org/juniper-green-energy-signs-150mw-hybrid-project-ppa-with-ntpc/\"},{\"name\":\"Rediff Money\",\"url\":\"https://money.rediff.com/news/market/juniper-green-energy-ntpc-sign-150-mw-hybrid-energy-ppa/58804220261126\"}],\"imageUrl\":\"/covers/live/live-energy-369-juniper-ntpc-150mw-ppa.jpg\",\"imageAlt\":{\"en\":\"Juniper Green Energy Signs 25-Year PPA With NTPC for 150 MW Wind-Solar Hybrid Project\",\"zh-TW\":\"印度 Juniper Green Energy 與國營 NTPC 簽署 150 MW 風光混合 25 年購電協議\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":77,\"trustBreakdown\":{\"crossCorroboration\":20,\"outletReputation\":20,\"recencyClarity\":22,\"sourceDiversity\":15},\"publishedAt\":\"2026-11-28T04:58:14.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":21,\"D2\":20,\"D3\":19,\"D4\":21,\"D5\":20,\"total\":20},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initia
