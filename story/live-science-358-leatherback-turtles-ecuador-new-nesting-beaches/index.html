ritically endangered Eastern Pacific leatherback sea turtles are establishing new nesting grounds along several beaches in Ecuador during the 2025–2026 nesting season as ocean temperatures warm. Although Ecuador was not historically recognized as a major nesting area for the subspecies, conservationists documented rising nesting activity, including a tagged female named Bella that nested four to five times in 2026, producing 134 hatchlings from 146 eggs for a 91.8 percent emergence success rate.\n\nWhy it matters\nEastern Pacific leatherbacks—the world's largest sea turtle subspecies—have been projected to face extinction within 60 years due to climate change, coastal development, and fisheries bycatch. Evidence that females are shifting southward to cooler or newly suitable Ecuadorian beaches offers rare ecological resilience and informs community-led coastal hatchery management.\n\nSource differences\nSimon Fraser University's official release, \"Endangered leatherbacks finding new nesting beaches in Ecuador as Pacific Ocean warms, study finds\", provides detailed field observations from Manabí province, quotes adjunct professor Juan José Alava, and recounts the multi-clutch tracking data for the tagged turtle Bella. ScienceDaily's summary, \"Facing extinction, the world's largest sea turtle is making a surprising move\", distills the same SFU research announcement into a brief overview of the 2025–2026 Ecuadorian beach findings.\n\nStill uncertain\nResearchers have not yet determined how many total breeding females are shifting to Ecuadorian coastlines each season or whether warming trends will eventually threaten the sand temperatures of these newly colonized beaches.\n\nTrust label: Single source — Both reports originate from Simon Fraser University's institutional research release."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-science-358-leatherback-turtles-ecuador-new-nesting-beaches\",\"category\":\"science\",\"title\":{\"en\":\"Critically Endangered Leatherback Turtles Establish New Nesting Beaches in Ecuador\",\"zh-TW\":\"極危棱皮龜因應太平洋暖化在厄瓜多開闢新產卵海灘\"},\"summary\":{\"en\":\"A study led by Simon Fraser University researchers found that critically endangered Eastern Pacific leatherback sea turtles are increasingly nesting along Ecuador's beaches—historically outside their primary breeding range—as Pacific Ocean temperatures rise.\",\"zh-TW\":\"西門菲莎大學（Simon Fraser University）研究團隊發現，隨著太平洋海水溫度上升，原本面臨滅絕危機的東太平洋棱皮龜（leatherback sea turtle）近年頻繁在歷史上非主要繁殖區的厄瓜多海灘築巢產卵，單一追蹤雌龜在 2026 年產季更創下逾九成孵化成功率。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n加拿大西門菲莎大學（Simon Fraser University）研究團隊發表研究指出，隨著太平洋海水溫度持續升高，極度瀕危的東太平洋棱皮龜在 2025 至 2026 年產卵季期間，正於厄瓜多沿海多處海灘建立新的繁殖築巢點。研究人員追蹤一隻名為貝拉（Bella）的標記雌龜，發現牠在 2026 年單季築巢四至五次、共產下 146 顆卵並成功孵化出 134 隻幼龜，整體孵化率高達 91.8%。\\n\\n「為什麼重要」\\n東太平洋棱皮龜是全球體型最大的海龜亞種，先前研究推估該族群恐在 60 年內滅絕。此次在傳統繁殖區以外的厄瓜多海岸觀測到穩定築巢與高孵化率，為氣候變遷下的物種適應提供罕見希望，也有助當地社區推動孵化場保育管理。\\n\\n「來源異同」\\n西門菲莎大學官方新聞稿「Endangered leatherbacks finding new nesting beaches in Ecuador as Pacific Ocean warms, study finds」完整呈現厄瓜多馬納比省（Manabí province）現地保育細節、兼任教授胡安・何塞・阿拉瓦（Juan José Alava）的評論，以及標記雌龜貝拉（Bella）的產卵數據；科學新聞網站 ScienceDaily 報導「Facing extinction, the world's largest sea turtle is making a surprising move」則為同一份校方研究新聞稿的摘要版。\\n\\n「仍不確定」\\n目前學界尚無法確認每年轉往厄瓜多海岸產卵的成熟雌龜總數規模，以及未來氣溫持續上升是否會再度影響這批新棲地沙灘的孵化性別比與存活率。\\n\\nTrust label: Single source — 兩篇報導均源自西門菲莎大學發布的同一份研究成果新聞稿。\"},\"glossary\":[{\"term\":{\"en\":\"Eastern Pacific Leatherback\",\"zh-TW\":\"東太平洋棱皮龜（Eastern Pacific Leatherback）\"},\"blurb\":{\"en\":\"A critically endangered subpopulation of the world's largest sea turtle species, historically nesting from Mexico to Costa Rica.\",\"zh-TW\":\"全球體型最大海龜的極危亞族群，過去主要在墨西哥至哥斯大黎加沿岸產卵。\"}},{\"term\":{\"en\":\"Clutch\",\"zh-TW\":\"窩卵數（Clutch）\"},\"blurb\":{\"en\":\"A group of eggs laid by a female sea turtle in a single nesting event.\",\"zh-TW\":\"雌性海龜在單次築巢產卵過程中所產下的整批蛋群。\"}},{\"term\":{\"en\":\"Hatchery Relocation\",\"zh-TW\":\"孵化場移置保育（Hatchery Relocation）\"},\"blurb\":{\"en\":\"A conservation practice where vulnerable sea turtle eggs are moved to protected beach enclosures to shield them from predators, tides, and poaching.\",\"zh-TW\":\"將易受潮汐、掠食者或盜採威脅的海龜卵移至受保護沙灘圍欄內人工監護孵化的保育措施。\"}}],\"sources\":[{\"name\":\"Simon Fraser University\",\"url\":\"https://www.sfu.ca/sfunews/stories/2026/11/endangered-leatherbacks-finding-new-nesting-beaches-in-ecuador-a.html\"},{\"name\":\"ScienceDaily\",\"url\":\"https://www.sciencedaily.com/releases/2026/11/261127203623.htm\"}],\"imageUrl\":\"/covers/live/live-science-358-leatherback-turtles-ecuador-new-nesting-beaches.jpg\",\"imageAlt\":{\"en\":\"Critically Endangered Leatherback Turtles Establish New Nesting Beaches in Ecuador\",\"zh-TW\":\"極危棱皮龜因應太平洋暖化在厄瓜多開闢新產卵海灘\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":76,\"trustBreakdown\":{\"crossCorroboration\":16,\"outletReputation\":24,\"recencyClarity\":22,\"sourceDiversity\":14},\"publishedAt\":\"2026-11-28T04:30:51.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":22,\"D2\":21,\"D3\":22,\"D4\":19,\"D5\":20,\"total\":21},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-science-358-leatherback-turtles-ecuador-new-nesting-beaches/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sou
