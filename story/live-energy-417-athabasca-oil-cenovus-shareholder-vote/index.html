roposed arrangement with Cenovus Energy under which Cenovus will acquire Athabasca for CAD 12.00 per share, representing an equity value of approximately CAD 5.8 billion following the October 5 announcement. The transaction has not closed; Athabasca expects to apply for a final order from the Court of King's Bench of Alberta on December 1, 2026, and completion remains subject to court approval and customary closing conditions.\n\nWhy it matters\nShareholder backing clears a major governance hurdle in the proposed CAD 5.8 billion combination, while leaving final closing contingent on judicial approval and remaining conditions. Once the arrangement closes after court approval and conditions are met, Athabasca is slated to delist from the Toronto Stock Exchange.\n\nSource differences\nGlobeNewswire carried the company release under \"Athabasca Oil Corporation Announces Shareholder Approval of the Proposed Arrangement with Cenovus,\" setting out the shareholder approval of the proposed arrangement and upcoming court steps. Mugglehead reported the development under \"Athabasca Oil shareholders approve C$12 Cenovus sale,\" highlighting the per-share transaction terms in its headline.\n\nStill uncertain\nWhether the Court of King's Bench of Alberta grants the final order on December 1 as expected, and whether all remaining closing conditions are satisfied on schedule, remains pending before any closing occurs.\n\nTrust label: Single source — Both GlobeNewswire and Mugglehead reflect the same company announcement regarding the shareholder vote and pending arrangement, with source diversity rated conservatively."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-energy-417-athabasca-oil-cenovus-shareholder-vote\",\"category\":\"energy\",\"title\":{\"en\":\"Athabasca Oil Shareholders Approve Cenovus Arrangement Pending Court Order\",\"zh-TW\":\"Athabasca Oil 股東通過 Cenovus 合併安排 交易尚未交割仍待法院核准\"},\"summary\":{\"en\":\"Athabasca Oil shareholders voted 98.84% in favor on November 27, 2026, to approve Cenovus Energy's CAD 12.00-per-share acquisition valuing equity at about CAD 5.8 billion; the deal has not closed and remains subject to court approval expected December 1 and closing conditions.\",\"zh-TW\":\"加拿大 Athabasca Oil 於2026年11月27日召開特別股東會，以98.84%贊成票通過 Cenovus Energy 每股12.00加元、股權價值約58億加元的合併安排；交易尚未交割，預計12月1日向法院聲請最終命令，仍待法院核准與交割條件成就後完成，完成後將自多倫多證交所下市。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」加拿大 Athabasca Oil（TSX: ATH）於2026年11月27日召開特別股東會，以98.84%贊成票通過與 Cenovus Energy 的合併安排；該交易於10月5日宣布，由 Cenovus 以每股12.00加元收購 Athabasca，股權價值約58億加元。此交易尚未交割，Athabasca 預計於12月1日向亞伯達省國王座法庭（Court of King's Bench of Alberta）聲請最終命令，仍須法院核准及其他慣常交割條件滿足後才會完成。\\n\\n「為什麼重要」股東會高票贊成推進了這筆股權價值約58億加元的合併程序，但交易尚未完成，仍取決於法院核准與交割條件成就；若後續順利交割，Athabasca 將自多倫多證交所下市。\\n\\n「來源異同」GlobeNewswire 刊載公司公告，標題為「Athabasca Oil Corporation Announces Shareholder Approval of the Proposed Arrangement with Cenovus」，說明股東會通過擬議安排及後續司法程序；Mugglehead 報導標題則為「Athabasca Oil shareholders approve C$12 Cenovus sale」，於標題凸顯每股12加元的交易條件。\\n\\n「仍不確定」亞伯達省國王座法庭是否如期於12月1日核發最終命令，以及其餘交割條件是否順利成就，在正式交割前均屬待定狀態。\\n\\nTrust label: Single source — 兩個來源核心事實同源自公司公告，來源多元性已依單一消息源脈絡壓低評分。\"},\"glossary\":[{\"term\":{\"en\":\"Plan of arrangement\",\"zh-TW\":\"合併安排（Arrangement）\"},\"blurb\":{\"en\":\"A court-supervised corporate restructuring procedure under Canadian law used for mergers, acquisitions, or reorganizations.\",\"zh-TW\":\"加拿大公司法下受法院監督的企業重組或併購法律程序。\"}},{\"term\":{\"en\":\"Equity value\",\"zh-TW\":\"股權價值\"},\"blurb\":{\"en\":\"The implied total value of a company's shares based on the offer price per share and share count.\",\"zh-TW\":\"依每股收購價格與股份數計算出的公司股權總估值。\"}},{\"term\":{\"en\":\"Delisting\",\"zh-TW\":\"下市\"},\"blurb\":{\"en\":\"The removal of a company's listed shares from trading on a stock exchange following completion of a transaction or corporate action.\",\"zh-TW\":\"企業完成併購或特定公司行動後，股票自證券交易所停止掛牌交易。\"}},{\"term\":{\"en\":\"Closing conditions\",\"zh-TW\":\"交割條件\"},\"blurb\":{\"en\":\"Specific legal, regulatory, or contractual requirements that must be met before a transaction is finalized.\",\"zh-TW\":\"併購或交易正式完成前必須達成的法定、監管或契約前提條件。\"}}],\"sources\":[{\"name\":\"GlobeNewswire\",\"url\":\"https://www.globenewswire.com/news-release/2026/11/27/3411482/0/en/athabasca-oil-corporation-announces-shareholder-approval-of-the-proposed-arrangement-with-cenovus.html\"},{\"name\":\"Mugglehead\",\"url\":\"https://mugglehead.com/athabasca-oil-shareholders-approve-cenovus-arrangement/\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"Athabasca Oil Shareholders Approve Cenovus Arrangement Pending Court Order\",\"zh-TW\":\"Athabasca Oil 股東通過 Cenovus 合併安排 交易尚未交割仍待法院核准\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":81,\"trustBreakdown\":{\"crossCorroboration\":20,\"outletReputation\":22,\"recencyClarity\":23,\"sourceDiversity\":16},\"publishedAt\":\"2026-11-28T09:25:38.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":23,\"D2\":22,\"D3\":20,\"D4\":21,\"D5\":19,\"total\":21},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-energy-417-athabasca-oil-cenovus-shareholder-vote/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"c
