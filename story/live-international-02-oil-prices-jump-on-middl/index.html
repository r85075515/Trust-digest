t least three people.\nWhat happened\nBBC, CNBC, the Financial Times, and The Hill converge on the sequence: Houthi strikes hit an airport and an oil field in Saudi Arabia — including a drone attack on Saudi Aramco's Shaybah oilfield that killed two — after which the U.S. ordered non-emergency staff out of Saudi Arabia. CNBC adds the forward-looking piece: Washington and Israel are reportedly weighing fresh strikes against Iran, possibly resuming after the midterms. The Hill's item focuses on the airport attack: one killed, eight wounded at King Fahd airport.\nWhy it matters\nThe verdict is market mechanics: the combination of an actual supply-side attack and a credible threat of U.S.–Israel strikes on Iran is exactly what reprices crude. With Hormuz-adjacent escalation back on the table, energy importers and airlines should expect volatility, not a one-day blip.\nSources agree / disagree\nFour outlets agree on the core sequence — Houthi attacks, U.S. personnel drawdown, reported Iran strike planning, oil price jump. Casualty figures differ because they describe different incidents (airport vs. oilfield). Trust label: Multi-source agreement——four outlets agree on the main line (Houthi attacks, U.S. drawdown, oil price jump); casualty figures differ because the airport and oilfield incidents are different events.\nStill uncertain\nWhether the reported Iran strikes materialize, their timing relative to the midterms, and the scale of any oil supply disruption are all unknown. Treat strike planning as reported, not confirmed."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-02-oil-prices-jump-on-middl\",\"category\":\"international\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-international-02-oil-prices-jump-on-middl.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Oil prices jump on Middle East worries as U.S., Israel reportedly weigh fresh Iran strikes\",\"zh-TW\":\"相關封面圖：據報道，美國和以色列正在權衡對伊朗的新打擊，油價因中東擔憂而上漲\"},\"publishedAt\":\"2026-10-22T05:18:24.000Z\",\"title\":{\"en\":\"U.S., Israel Reportedly Weigh Fresh Iran Strikes as Oil Prices Jump\",\"zh-TW\":\"美國、以色列傳考慮打擊伊朗，油價應聲上漲\"},\"summary\":{\"en\":\"Oil prices jumped as the U.S. and Israel reportedly weigh fresh Iran strikes, after Houthi attacks on a Saudi airport and the Shaybah oilfield killed at least three. Washington ordered non-emergency staff out of Saudi Arabia. Casualty figures differ by incident. Takeaway: with strikes reportedly possible after the midterms, oil markets are pricing in escalation risk.\",\"zh-TW\":\"傳美國與以色列考慮對伊朗發動新一輪打擊，油價因中東憂慮上漲；此前胡塞武裝襲擊沙烏地機場與 Shaybah 油田，造成至少三人死亡，華府已下令非必要人員撤離沙烏地。傷亡數字因機場與油田是不同事件而異。結論：市場已在為期中選舉後可能的打擊預作避險。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"油價又在為戰爭定價：傳美國與以色列考慮對伊朗發動新一輪打擊，油價因中東憂慮上漲；幾天前胡塞武裝才襲擊沙烏地一座機場與一座油田，造成至少三人死亡。\\n發生了什麼事\\nBBC、CNBC、金融時報、《國會山報》對事件順序的報導一致：胡塞武裝襲擊沙烏地機場與油田——包括針對沙烏地阿美（Saudi Aramco）Shaybah 油田的無人機攻擊，造成兩人死亡——之後美國下令非必要人員撤離沙烏地。CNBC 補上前瞻：華府與以色列傳正考慮對伊朗發動新一輪打擊，可能在期中選舉後恢復。《國會山報》則聚焦機場攻擊：法赫德國王機場一死八傷。\\n為什麼重要\\n結論是市場機制：實質的供給面攻擊，加上美以打擊伊朗的可信威脅，正是讓原油重新定價的組合。荷莫茲海峽周邊的升級風險重回檯面，能源進口商與航空業該預期的是持續波動，不是一日行情。\\n來源異同\\n四家媒體對主線一致：胡塞攻擊、美方撤員、傳出打擊伊朗計畫、油價上漲。傷亡數字不同，是因為講的是不同事件（機場 vs 油田）。信任標籤：N源一致——四家對主線（胡塞攻擊→美方撤員→油價上漲）報導一致；傷亡數字因機場與油田是不同事件而異。\\n仍不確定\\n打擊伊朗的傳聞會不會成真、時機與期中選舉的關係、石油供給受干擾的規模，目前都未知。打擊計畫應視為「有報導」，不是「已證實」。\"},\"sources\":[{\"name\":\"BBC World\",\"url\":\"https://www.bbc.co.uk/news/articles/c6x2vpk93770o?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"CNBC\",\"url\":\"https://www.cnbc.com/2026/10/22/us-iran-trump-hormuz-.html\"},{\"name\":\"Financial Times Markets\",\"url\":\"https://www.ft.com/content/f39aa4d2-e290-451f-ae91-b19138b6172f?syn-25a6b1a6=1\"},{\"name\":\"The Hill\",\"url\":\"https://thehill.com/policy/international/6164397-houthi-attacked-king-fahd-airport/\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":25,\"outletReputation\":18,\"crossCorroboration\":25,\"recencyClarity\":25},\"tags\":[\"internation
