equel is far from simple.\nWhy it matters\nA sequel to 'Bishonen' would reunite two of Hong Kong cinema's defining stars in a film that shaped a generation of viewers. Yonfan saying so at his own premiere — in front of a festival audience, on the record — turns a fan wish into a real possibility. The 'Intermission' premiere itself is the news underneath: a four-hour re-cut of 15 films is a director taking stock of a 60-year career in public.\nSources agree / disagree\nETtoday, Yahoo TW, and LINE TODAY all carry the story, and their headlines agree on the core facts: the premiere, the sequel remark, and the two stars. ETtoday goes further with the Fan Zhiwei phone call, a detail the other headlines do not carry. Trust label: Multi-source agreement — three outlets agree on the core facts of the premiere and Yonfan's sequel remark.\nStill uncertain\nNo outlet in the feed confirms a sequel is actually in development — Yonfan said only that he does not rule it out. There is no script, schedule, or cast confirmation, and whether Fung and Wu would return is unaddressed. The Fan Zhiwei detail suggests the casting puzzle is real. Watch for a formal announcement before treating the sequel as a project."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-eastAsiaGossip-03-ebc-line-today\",\"category\":\"eastAsiaGossip\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-eastAsiaGossip-03-ebc-line-today.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Yonfan Open to a 'Bishonen' Sequel as 'Intermission' Premieres at Golden Horse\",\"zh-TW\":\"相關封面圖：楊凡鬆口不排斥拍《美少年之戀》續集，《中場休息》金馬影展亞洲首映\"},\"publishedAt\":\"2026-11-07T06:36:00.000Z\",\"title\":{\"en\":\"Yonfan Open to a 'Bishonen' Sequel as 'Intermission' Premieres at Golden Horse\",\"zh-TW\":\"楊凡鬆口不排斥拍《美少年之戀》續集，《中場休息》金馬影展亞洲首映\"},\"summary\":{\"en\":\"Legendary director Yonfan told a Golden Horse Film Festival audience he is open to a 'Bishonen' (美少年之戀) sequel reuniting Daniel Wu and Stephen Fung, ETtoday reports. His new film 'Intermission' (中場休息), premiering November 7, re-edits 15 of his films into a nearly four-hour work spanning almost 60 years. Watch whether the sequel moves from a maybe to a plan.\",\"zh-TW\":\"傳奇導演楊凡（Yonfan）在金馬影展《中場休息》亞洲首映會上鬆口，不排斥拍《美少年之戀》續集，再讓馮德倫（Stephen Fung）與吳彥祖（Daniel Wu）同台。ETtoday 報導，新片將他 15 部經典重新剪輯成近 4 小時巨作，回顧近 60 年創作歷程。續集會不會從「可能」變成計畫，值得追蹤。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"傳奇導演楊凡（Yonfan）在金馬影展《中場休息》亞洲首映會上鬆口，不排斥拍《美少年之戀》續集，再讓馮德倫（Stephen Fung）與吳彥祖（Daniel Wu）同台。\\n發生了什麼事\\n楊凡新作《中場休息》7 日在金馬影展舉行亞洲首映，這部近 4 小時的作品把他過去 15 部經典電影重新剪輯成一部，回顧近 60 年的光影創作歷程。楊凡現身首映會，首度鬆口坦言不排斥拍《美少年之戀》續集。ETtoday 的標題還補充，楊凡曾致電范植偉（Fan Zhiwei），感嘆「人算不如天算」，暗示續集的選角並不簡單。\\n為什麼重要\\n《美少年之戀》續集若能成真，將讓兩位香港影壇代表性男星再度同台，這部片影響了一整個世代的觀眾。楊凡在自己的首映會上、面對影展觀眾公開這麼說，讓影迷的願望變成了真實的可能。而《中場休息》首映本身就是新聞：把 15 部電影重剪成 4 小時，等於一位導演公開盤點自己 60 年的創作生涯。\\n來源異同\\nETtoday、Yahoo TW 與 LINE TODAY 三家媒體都報導了這則消息，標題對核心事實的描述一致：首映、續集表態與兩位男主角。ETtoday 更進一步寫了致電范植偉的細節，其他標題沒有這一點。信任標籤：多源一致——三家媒體對首映與楊凡續集表態的核心事實報導一致。\\n仍不確定\\n來源中沒有任何一家確認續集真的在籌備——楊凡只說不排斥。劇本、時程、卡司都沒有確認，馮德倫與吳彥祖是否回歸也沒有著落。致電范植偉的細節顯示選角確實是難題。把續集當成正式計畫之前，請先等官方宣布。\"},\"sources\":[{\"name\":\"ETtoday 影劇\",\"url\":\"https://star.ettoday.net/news/3268065\"},{\"name\":\"Yahoo TW 娛樂\",\"url\":\"https://tw.news.yahoo.com/%E9%A6%AE%E5%BE%B7%E5%80%AB-%E5%90%B3%E5%BD%A5%E7%A5%96-%E7%BE%8E%E5%B0%91%E5%B9%B4%E4%B9%8B%E6%88%80-%E6%8B%8D%E7%BA%8C%E9%9B%86-%E5%90%8D%E5%B0%8E%E6%A5%8A%E5%87%A1%E5%9B%9E%E6%87%89%E4%BA%86-062300306.html\"},{\"name\":\"today.line.me\",\"url\":\"https://news.google.com/rss/articles/CBMiVkFVX3lxTE9hUWNPOW5BMmJrQVFCQlRpUEU2NTE4R2N0S0pMZlpaeDd0dno5WGdDdjZTUVRWdWl0LUtFYTI4Qk5uRWdUXy1yVnRDZjF6OU5HZEx1Yl9R?oc=5\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":21,\"outletReputation\":16,\"crossCorroboration\":22,\"recencyClarity\":25},\"tags\":[\"eastAsiaGossip\",\"live-ingest\",\"region:tw\",\"ettoday-影劇\",\"yahoo-tw-娛樂\",\"gnews-line-today-tw-娛樂\"],\"region\":\"tw\",\"glossary\":
