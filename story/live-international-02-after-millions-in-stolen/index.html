t a form of fraud that has robbed SNAP recipients of millions.\nWhat happened\nThe Trump administration is attempting to upgrade food-assistance cards to fight fraud, according to the ProPublica report behind this card's title, with an NPR headline in the same batch also describing the push for a food-assistance card upgrade. The proposed rule is presented as a major step forward in addressing card theft that has taken millions in benefits from SNAP recipients.\nWhy it matters\nThe verdict is about who pays for weak card security: SNAP recipients are low-income households, and stolen benefits mean lost food money with no easy replacement. A card upgrade is a concrete, technical fix rather than another enforcement promise, which is why the proposal matters even before its details are public — if it works, it stops the theft at the point of use.\nSources agree / disagree\nOn the SNAP card-upgrade direction, ProPublica's report and NPR's headline point the same way. Trust label: Single source — the detailed account comes from ProPublica, with NPR contributing only a headline in the feed material. Note separately that this feed cluster also bundled a different event, the third-time federal charges against former FBI director James Comey, which is a separate story and is not expanded in this card.\nStill uncertain\nThe rule's exact requirements, timeline, cost, and whether chip cards would be mandatory are not in the feed snippets. The scale of theft is described only as millions, with no precise figure, and the card-upgrade mechanism beyond the chip-card direction is not detailed."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-02-after-millions-in-stolen\",\"category\":\"international\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-international-02-after-millions-in-stolen.jpg\",\"imageAlt\":{\"en\":\"Cover related to: After Millions in Stolen SNAP Benefits, Trump Administration Moves to Fight Theft\",\"zh-TW\":\"相關封面圖：（譯文待補）After Millions in Stolen SNAP Benefits, Trump Administration Moves to Fight Theft\"},\"publishedAt\":\"2026-10-27T02:01:27.000Z\",\"title\":{\"en\":\"Trump Administration Moves to Upgrade Food-Assistance Cards After Millions in SNAP Theft\",\"zh-TW\":\"川普（Trump）政府推動食品補助卡升級，力抗數百萬美元 SNAP 補助遭竊\"},\"summary\":{\"en\":\"The Trump administration is pushing a rule to upgrade food-assistance cards to fight fraud that has robbed SNAP recipients of millions in benefits, ProPublica reports. The proposed rule is described as a major step against card theft. Takeaway: upgrading cards to chip technology targets the skimming and cloning draining benefits from low-income recipients.\",\"zh-TW\":\"川普政府正推動一項規則，升級食品補助卡、打擊詐欺；ProPublica 報導，這類詐欺已讓 SNAP 受助者損失數百萬美元補助。提案被形容為打擊卡片竊盜的一大步。重點：升級晶片卡瞄準的正是透過側錄與複製盜走低收入戶補助的手法。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"在數百萬美元 SNAP 補助遭竊後，川普政府出手打擊竊盜：推動一項規則升級食品補助卡，ProPublica 形容這是打擊此類詐欺的一大步。\\n發生了什麼事\\n根據本卡標題背後的 ProPublica 報導，川普政府正推動食品補助卡升級以打擊詐欺；同批的 NPR 標題也描述了推動食品補助卡升級的動向。提案被形容為打擊卡片竊盜的一大步，而這類詐欺已經讓 SNAP 受助者損失數百萬美元補助。\\n為什麼重要\\n關鍵在誰為薄弱的卡片安全買單：SNAP 受助者是低收入戶，被盜的補助就是直接少掉的飯錢，而且難以補回。卡片升級是技術上具體的解法，而不只是另一句執法承諾——這正是提案在細節公開前就值得關注的原因：如果有效，就能在使用的當下擋下竊盜。\\n來源異同\\n就 SNAP 卡片升級的方向而言，ProPublica 的報導與 NPR 的標題指向一致。信任標籤：僅1源——詳細敘述來自 ProPublica，NPR 在片段中只有一則標題。另外說明：這批 feed 同時混入另一則事件——前聯邦調查局局長詹姆斯·柯米（James Comey）第三度被聯邦起訴，那是另一則新聞，本卡不展開。\\n仍不確定\\n規則的確切要求、時程、成本，以及晶片卡是否強制使用，片段中都沒有。竊盜規模只說是數百萬美元，沒有精確數字；除了晶片卡方向之外，升級機制也沒有細節。\"},\"sources\":[{\"name\":\"BBC World\",\"url\":\"https://www.bbc.co.uk/news/articles/ckly0xqjnlwvo?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"Axios\",\"url\":\"https://www.axios.com/2026/10/26/james-comey-national-defense-information-charges\"},{\"name\":\"NPR News\",\"url\":\"https://www.npr.org/2026/10/26/nx-s1-6018628/trump-administration-attempting-to-prosecute-former-fbi-director-james-comey-again\"},{\"name\":\"ProPublica\",\"url\":\"https://www.propublica.org/article/snap-theft-chip-cards-trump-rule\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":25,\"outletReputation\":19,\"crossCorroboration\":17,\"recencyClarity\":25},\"tags\":[\"international\",\"live-ingest\",\"bbc-world\",\"axios\",\"npr-news\"],\"glossary\":[{\"term\":{\"en\":\"SNAP\",\"zh-TW\":\"SNAP\"},\"blurb\":{\"en\":\"The US Supplemental Nutrition Assistance Program, which provides food benefits to low-income households.\",\"zh-TW\":\"美國補充營養援助計畫，為低收入戶提供食品補助。\"}},{\"term\":{\"en\":\"ProPublica\",\"zh-TW\":\"ProPublica\"},\"blurb\":{\"en\":\"Investigative news outlet behind this card's main report.\",\"zh-TW\":\"本卡主要報導背後的調查新聞媒體。\"}},{\"term\":{\"en\":\"food-assistance card\",\"zh-TW\":\"食品補助卡\"},\"blurb\":{\"en\":\"The benefit card SNAP recipients use to buy food, targeted for a security upgrade.\",\"zh-TW\":\"SNAP 受助者用來購買食品的補助卡，本次升級的對象。\"}},{\"term\":{\"en\":\"chip card\",\"zh-TW\":\"晶片卡\"},\"blurb\":{\"en\":\"A card with an embedded chip, harder to skim or clone than a magnetic stripe.\",\"zh-TW\":\"內嵌晶片的卡片，比磁條更難側錄或複製。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://r85075515.github.io/Trust-digest/\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"Axiom\"}],[
