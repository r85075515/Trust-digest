e July, a sum that makes him both the party's top known donor and the largest established midterm donor.\nWhat happened\nThe Verge's reporting, citing the Times, frames the figure as a reversal of Musk's talk of doing less political spending. Meanwhile Wired covers a lighter episode: Musk bragged on X about his Grok Lego Star Wars haul, and X users promptly punked him. Wired's \"Uncanny Valley\" episode also digs into where Musk's PAC is spending its millions, the latest ideology Trump has labeled dangerous, and the backlash against the designer behind the Muse logo.\nWhy it matters\nA single donor writing $276 million in checks reshapes the midterm money race — and undercuts Musk's own narrative of political retreat. The Lego episode shows the other side of the Musk-X dynamic: the platform's owner as its most mocked poster.\nSources agree / disagree\nThe Verge and Wired cover different Musk stories from the same news cycle — donations and the Lego episode — with no conflicting facts in the snippets.\nStill uncertain\nSnippets do not break down where the $276 million went beyond Republican groups, nor what exactly the X users' mockery said. Verify on the publisher pages."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-tech-01-elon-musk-bragged-about-\",\"category\":\"tech\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-tech-01-elon-musk-bragged-about-.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Elon Musk Bragged About His Grok Lego Star Wars Haul. Then X Users Punked Him\",\"zh-TW\":\"相關封面圖：馬斯克 (Elon Musk) 吹噓他的 Grok 樂高星際大戰系列。然後 X 個用戶朋克了他\"},\"publishedAt\":\"2026-10-12T17:55:12.000Z\",\"title\":{\"en\":\"Elon Musk Donates $276M to Republicans, Tops Midterm Donor List\",\"zh-TW\":\"馬斯克（Elon Musk）7 月以來捐 2.76 億美元給共和黨，成期中選舉最大金主\"},\"summary\":{\"en\":\"Elon Musk has given at least $276 million to Republican groups since July, The New York Times reports via The Verge, making him the party's top known donor and the biggest established midterm donor. Separately, Wired reports Musk bragged about his Grok Lego Star Wars haul on X — and users promptly punked him.\",\"zh-TW\":\"據《紐約時報》（The New York Times）經《The Verge》報導，馬斯克（Elon Musk）7 月以來已向共和黨團體捐出至少 2.76 億美元，成為該黨檯面上最大金主與期中選舉最大捐助者。另據《連線》（Wired）報導，馬斯克在 X 上炫耀他的 Grok 樂高星際大戰收藏，隨即被網友反嗆。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"馬斯克（Elon Musk）如今是共和黨期中選舉週期檯面上最大的金主——同一週也是網友最愛嘲諷的對象。據《紐約時報》（The New York Times）報導，馬斯克 7 月以來已向共和黨團體捐出至少 2.76 億美元，同時成為該黨最知名的金主與期中選舉規模最大的捐助者。\\n發生了什麼事\\n《The Verge》引述《紐約時報》的報導指出，這個數字與馬斯克先前宣稱要減少政治支出的說法背道而馳。另一方面，《連線》（Wired）報導了較輕鬆的一幕：馬斯克在 X 上炫耀他的 Grok 樂高星際大戰收藏，結果被 X 網友反嗆。《連線》播客「恐怖谷」（Uncanny Valley）本週還探討了馬斯克的政治行動委員會（PAC）把數百萬美元花到哪裡、川普最新點名危險的意識形態，以及針對 Muse 標誌設計師的反彈。\\n為什麼重要\\n單一金主開出 2.76 億美元的支票，足以改寫期中選舉的資金版圖，也戳破馬斯克自己淡出政治的敘事。樂高事件則呈現馬斯克與 X 的另一面：平台老闆成了平台上最常被嘲諷的發文者。\\n來源異同\\n《The Verge》與《連線》報導的是同一新聞週期裡馬斯克的兩件不同的事——捐款與樂高事件，來源摘要中沒有事實衝突。\\n仍不確定\\n摘要沒有細分 2.76 億美元的具體流向，也沒說明網友反嗆的具體內容；引用細節前請查閱完整報導。\"},\"sources\":[{\"name\":\"The Verge\",\"url\":\"https://www.theverge.com/tech/1009604/elon-musk-2026-midterm-republican-donations\"},{\"name\":\"Wired AI\",\"url\":\"https://www.wired.com/story/elon-musk-bragged-about-his-grok-lego-star-wars-haul-then-x-users-punked-him/\"}],\"disagreements\":null,\"trustScore\":70,\"trustBreakdown\":{\"sourceDiversity\":13,\"outletReputation\":18,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"tech\",\"live-ingest\",\"the-verge\",\"wired-ai\",\"wired-ai\"],\"glossary\":[{\"term\":{\"en\":\"Elon Musk\",\"zh-TW\":\"馬斯克\"},\"blurb\":{\"en\":\"X owner and the GOP's top known midterm donor.\",\"zh-TW\":\"X 平台擁有者，共和黨期中選舉檯面上最大金主。\"}},{\"term\":{\"en\":\"Grok\",\"zh-TW\":\"Grok\"},\"blurb\":{\"en\":\"AI chatbot whose Lego Star Wars merchandise Musk showed off.\",\"zh-TW\":\"馬斯克拿來炫耀樂高收藏的人工智慧聊天機器人。\"}},{\"term\":{\"en\":\"X\",\"zh-TW\":\"X\"},\"blurb\":{\"en\":\"Social platform owned by Musk where users mocked him.\",\"zh-TW\":\"馬斯克擁有的社群平台，網友在上面反嗆他。\"}},{\"term\":{\"en\":\"PAC\",\"zh-TW\":\"政治行動委員會\"},\"blurb\":{\"en\":\"Political action committee; Musk's PAC is spending millions this cycle.\",\"zh-TW\":\"政治行動委員會；馬斯克的委員會本週期花費數百萬美元。\"}},{\"term\":{\"en\":\"The New York Times\",\"zh-TW\":\"紐約時報\"},\"blurb\":{\"en\":\"Newspaper that reported the $276 million donation figure.\",\"zh-TW\":\"報導 2.76 億美元捐款數字的報社。\"}},{\"term\":{\"en\":\"Wired\",\"zh-TW\":\"連線\"},\"blurb\":{\"en\":\"Outlet that covered the Lego episode and Musk's PAC spending.\",\"zh-TW\":\"報導樂高事件與馬斯克政治行動委員會支出的媒體。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://r85075515.github.io/Trust-digest/\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"Axiom\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"zh_TW\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:locale:alternate\",\"content\":\"en_US\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"9\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"10\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"11\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources
