acefully, and Stewart was knighted in 2010 for his contribution to drama.\nWhat happened\nPatrick Stewart, a British actor, died on the 28th aged 86, Central News Agency reported. He was known worldwide for playing Captain Picard in Star Trek and Professor X in the X-Men series, and in 2010 Queen Elizabeth II knighted him for his contribution to drama. His spokesperson said he had lived with two forms of dementia and died peacefully in Los Angeles, and the news saddened fans and theatre lovers worldwide.\nWhy it matters\nPatrick Stewart embodied two of the most enduring screen roles of the past four decades, and his death closes a career that linked classical theatre distinction to global franchise fame. The direct judgment is that his loss is felt across two audiences at once: Star Trek viewers who associate him with Captain Picard, and X-Men viewers who associate him with Professor X.\nSources agree / disagree\nPublic Television Service, Google News listings, and Google News Taiwan Entertainment listings agree that Patrick Stewart died aged 86 after playing Captain Picard and Professor X, with no competing age or role claim. The flagged disagreement between 28 and 12 is a false positive: the 28 is the day of death, while the 12 is the December month in a bundled headline about a Taiwan release, so the numbers refer to different things. One bundled sentence covers the remaining headlines: feed headlines also described Avengers: Doomsday as his final work with a December Taiwan release and a tribute photograph posted by Hugh Jackman. Trust label: Multi-source agreement — three listings agree on the death, age, and defining roles.\nStill uncertain\nThe missing information is explicit: the two forms of dementia were not named, funeral and memorial arrangements were not stated, and the final-work and December release claims appear only in bundled headlines, not in the main Central News Agency summary."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-eastAsiaGossip-03-86-x-cna\",\"category\":\"eastAsiaGossip\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-eastAsiaGossip-03-86-x-cna.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 派屈克史都華86歲辭世 演活畢凱艦長、X教授 - 中央社 CNA\",\"zh-TW\":\"相關封面圖：派屈克史都華86歲辭世 演活畢凱艦長、X教授 - 中央社 CNA\"},\"publishedAt\":\"2026-10-30T06:30:11.000Z\",\"title\":{\"en\":\"Patrick Stewart Dies Aged 86 After Roles as Captain Picard and Professor X\",\"zh-TW\":\"派屈克史都華（Patrick Stewart）86 歲辭世，曾演活畢凱艦長與 X 教授\"},\"summary\":{\"en\":\"Patrick Stewart, the British actor known for Captain Picard in Star Trek and Professor X in X-Men, died on the 28th aged 86 in Los Angeles. His spokesperson said he had two forms of dementia and died peacefully; he was knighted in 2010. The news saddened fans, but funeral details were not given.\",\"zh-TW\":\"英國影星派屈克史都華（Patrick Stewart）28 日辭世，享壽 86 歲，生前以《星艦迷航記》畢凱艦長與《X 戰警》X 教授聞名全球，於洛杉磯安詳離世。發言人透露他生前罹患兩種失智症，他 2010 年獲冊封爵士，影迷深感不捨，後續治喪安排尚待公布。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"英國影星派屈克史都華（Patrick Stewart）28 日辭世，享壽 86 歲，於洛杉磯安詳離世，中央社報導。他生前以《星艦迷航記》畢凱艦長與《X 戰警》X 教授聞名全球，2010 年因對戲劇的貢獻獲英國女王伊莉莎白 2 世冊封為爵士。\\n發生了什麼事\\n英國影星派屈克史都華 28 日辭世，享壽 86 歲。他生前以主演《星艦迷航記》中的畢凱艦長，以及《X 戰警》系列裡的 X 教授聞名全球，因為對戲劇的貢獻，2010 年獲得英國女王伊莉莎白 2 世冊封為爵士。發言人透露，他生前罹患兩種失智症，於洛杉磯安詳離世，消息傳出後，全球影迷與戲迷深感不捨。摘要沒有指明兩種失智症的名稱，也沒有說明超出這項說法的死因。\\n為什麼重要\\n派屈克史都華塑造了過去四十年最歷久不衰的兩個銀幕角色，他的辭世為連結古典劇場成就與全球系列電影聲名的演藝生涯畫下句點。直接判斷是：他的離世同時觸動兩群觀眾，《星艦迷航記》觀眾記得他是畢凱艦長，《X 戰警》觀眾記得他是 X 教授。2010 年的冊封顯示，這也是英國的國家文化損失，因為這項榮譽肯定的是超出電影與電視人氣的戲劇貢獻。\\n來源異同\\n公視新聞網、Google News 彙整與 Google News TW 娛樂彙整都確認，派屈克史都華享壽 86 歲辭世，生前演活畢凱艦長與 X 教授，現有資料中沒有互相競爭的年齡或角色說法。標示的 28 與 12 差異是誤判：28 是辭世日期，12 是彙整標題中提到的 12 月台灣上映月份，兩者指涉不同事物。其他彙整標題只用一句話概括：摘要標題也把《復仇者聯盟：末日之戰》描述為他的遺作、12 月在台灣上映，並提到休傑克曼貼出珍貴合照淚別好友。信任標籤：多源一致——三則彙整對辭世、享壽與代表角色的報導一致。\\n仍不確定\\n缺失的關鍵資訊很明確：兩種失智症沒有指明名稱，治喪與追思安排沒有說明，遺作與 12 月上映的說法只出現在彙整標題中，沒有出現在中央社的主要摘要裡。摘要是截斷的內容描述，辭世、享壽、洛杉磯地點、失智症說法與 2010 年冊封以外的細節，在查閱完整報導前都未經證實。\"},\"sources\":[{\"name\":\"公視新聞網\",\"url\":\"https://news.pts.org.tw/article/833585\"},{\"name\":\"Google News\",\"url\":\"https://news.google.com/rss/articles/CBMiX0FVX3lxTE1IdlJ6ZmRoa2pUM0Z4QnEwbktLWUFrUWRGSVpTY20yRnNkd3pqTS12TjVUWmlQVWczY0lvemdoWXRuOG0wZ0RmRWp3d3JSdGdQNWdXcG5Fb254YW5hY0NB?oc=5\"},{\"name\":\"Google News TW 娛樂\",\"url\":\"https://news.google.com/rss/articles/CBMic0FVX3lxTE1DVUUwdzNfQktyX3YtZ0pMVXh5OXAwZnpSU2J0RHM2ZXZ1YUR6cks5Vm1HbHdPd2xjV2w1VTJBb25Da0tUWHlTczhVeDNTcm1JSWFHRnU5eTI2RWhJVjliOXZNenJwQlZvWVV0MTNuZ21PVnc?oc=5\"}],\"disagreements\":{\"en\":\"Figures differ across outlets (e.g. 28 vs 12 in headlines/snippets).\",\"zh-TW\":\"不同媒體的數字有所不同（例如，標題/摘要中的數字為 28 比 12）。\"},\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":21,\"outletReputation\":18,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"eastAsiaGossip\",\"live-ingest\",\"region:tw\",\"公視新聞網\",\"google-news-tw-entertainment\",\"google-news-tw-娛樂\"],\"region\":\"tw\",\"glossary\":[{\"blurb\":{\"en\":\"British actor who died aged 86 after playing Captain Picard and Professor X.\",\"zh-TW\":\"享壽 86 歲辭世，曾演出畢凱艦長與 X 教授的英國影星。\"},\"term\":{\"en\":\"Patrick Stewart\",\"zh-TW\":\"派屈克史都華\"}},{\"blurb\":{\"en\":\"Science fiction franchise in which Stewart played Captain Picard.\",\"zh-TW\":\"史都華在其中演出畢凱艦長的科幻系列作品。\"},\"term\":{\"en\":\"Star Trek\",\"zh-TW\":\"《星艦迷航記》\"}},{\"blurb\":{\"en\":\"Film series in which Stewart played Professor X.\",\"zh-TW\":\"史都華在其中演出 X 教授的電影系列。\"},\"term\":{\"en\":\"X-Men\",\"zh-TW\":\"《X 戰警》\"}},{\"blurb\":{\"en\":\"Taiwanese public broadcaster whose news site reported Stewart's death aged 86.\",\"zh-TW\":\"報導史都華 86 歲辭世的台灣公共廣電新聞媒體。\"},\"term\":{\"en\":\"Public Television Service\",\"zh-TW\":\"公視新聞網\"}},{\"blurb\":{\"en\":\"Actor whose tribute photograph to Stewart appeared in a bundled headline.\",\"zh-TW\":\"在彙整標題中貼出珍貴合照淚別史都華的演員。\"},\"term\":{\"en\":\"Hugh Jackman\",\"zh-TW\":\"休傑克曼\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"view
