, 2026, that he wanted his thanks passed along to U.S. President Donald Trump, crediting U.S. semiconductor restrictions since 2019 with pushing Huawei and China toward technological self-reliance. Ren stated that it is \"only a matter of time\" before China catches up in chipmaking, noting Huawei now invests more than US27 billion annually in research and development, builds domestic data centers, and collaborates with AI developers such as DeepSeek to optimize models for its Ascend processors.\n\nRen's rare on-the-record remarks to a major U.S. newspaper signal Beijing's and Huawei's confidence in framing domestic supply-chain resilience as a strategic success, even as independent analysts highlight a wide hardware performance gap.\n\nThe Chosun Daily, The Next Web, and Tech in Asia all cited the New York Times interview, confirming Ren's message of gratitude to Trump, Huawei's US27 billion annual R\u0026D budget, and Epoch AI's projection that Huawei's AI computing capacity this year remains below 4% of Nvidia's.\n\nWhether Ren's optimistic timeline for overtaking U.S. chipmakers can overcome persistent bottlenecks in advanced lithography equipment and high-bandwidth memory production remains uncertain.\nTrust label: Multi-source agreement — Multiple outlets consistently report the quotes and figures from Ren Zhengfei's New York Times interview alongside Epoch AI's benchmark estimate."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-publicFigures-163-ren-zhengfei-nyt-interview-huawei-ai\",\"category\":\"publicFigures\",\"title\":{\"en\":\"Huawei Founder Ren Zhengfei Thanks Trump in NYT Interview, Says Sanctions Spurred Self-Reliance\",\"zh-TW\":\"華為創辦人任正非接受《紐時》專訪：感謝川普制裁逼出中國晶片自主研發\"},\"summary\":{\"en\":\"In a New York Times interview published November 26, 82-year-old Huawei founder Ren Zhengfei asked that his gratitude be conveyed to U.S. President Donald Trump, arguing that seven years of U.S. export sanctions accelerated Huawei's and China's drive for semiconductor self-reliance. Despite spending over 27 billion annually on R\u0026D, Huawei's AI compute output remains under 4% of Nvidia's.\",\"zh-TW\":\"華為創辦人任正非在 11 月 26 日刊出的《紐約時報》專訪中表示，請代為轉達對美國總統川普（Donald Trump）的感謝，稱過去七年美國技術制裁反而迫使華為與中國加速半導體自主研發。儘管華為每年投入逾 270 億美元研發並與 DeepSeek 合作優化昇騰（Ascend）晶片，研究機構估算其 AI 算力仍不到輝達（Nvidia）的 4%。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n現年 82 歲的華為創辦人兼執行長任正非在 2026 年 11 月 26 日刊登的《紐約時報》（The New York Times）專訪中表示，希望能向美國總統川普（Donald Trump）轉達謝意，認為美方自 2019 年起實施的半導體禁令，反而促使華為與中國走向技術自立。任正非稱中國在晶片領域趕上美國「只是時間問題」，並指出華為目前每年研發支出超過 270 億美元，正積極建置本土資料中心並與 DeepSeek 等開發商合作，針對自家昇騰（Ascend）晶片進行模型優化。\\n\\n「為什麼重要」\\n任正非罕見接受美國主流媒體具名專訪並釋出強硬自信訊號，顯示華為正將本土供應鏈重組塑造成突圍敘事；但第三方研究數據同時揭示，中國國產 AI 算力規模與輝達（Nvidia）之間仍存在巨大鴻溝。\\n\\n「來源異同」\\n《朝鮮日報》（The Chosun Daily）、The Next Web 與 Tech in Asia 均引述《紐約時報》專訪內容，一致確認任正非向川普致謝的發言、華為每年逾 270 億美元的研發投入，以及研究機構 Epoch AI 估算華為今年 AI 運算總算力仍不及輝達 4% 的對比數據。\\n\\n「仍不確定」\\n在先進微影設備受限與高頻寬記憶體（HBM）良率瓶頸尚未完全突破的情況下，華為究竟需要多久才能實質縮小與美系高階晶片的世代差距，目前仍難有定論。\\nTrust label: Multi-source agreement — 多家媒體一致引述《紐約時報》專訪原文數據與 Epoch AI 的算力評估。\"},\"glossary\":[{\"term\":{\"en\":\"Ascend Processors\",\"zh-TW\":\"昇騰（Ascend）處理器\"},\"blurb\":{\"en\":\"Huawei's line of neural-network AI chips designed for data-center training and inference as an alternative to Nvidia GPUs.\",\"zh-TW\":\"華為研發的類神經網路 AI 晶片系列，主打資料中心訓練與推論任務，定位為輝達 GPU 的本土替代方案。\"}},{\"term\":{\"en\":\"Epoch AI\",\"zh-TW\":\"Epoch AI 研究機構\"},\"blurb\":{\"en\":\"An independent research institute tracking trends in AI compute, hardware supply chains, and model scaling.\",\"zh-TW\":\"專注追蹤人工智慧算力趨勢、硬體供應鏈與模型擴展規模的獨立研究組織。\"}},{\"term\":{\"en\":\"Technological Self-Reliance\",\"zh-TW\":\"技術自主（國產替代）\"},\"blurb\":{\"en\":\"China's state-backed industrial policy to replace foreign semiconductors and software with domestic supply chains.\",\"zh-TW\":\"中國政府推動的產業策略，旨在以本土供應鏈取代受出口管制的國外半導體與核心軟體。\"}}],\"sources\":[{\"name\":\"The Chosun Daily\",\"url\":\"https://www.chosun.com/english/industry-en/20
