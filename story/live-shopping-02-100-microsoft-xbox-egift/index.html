 saving on a $100 card, if the code still works at checkout.\nWhat happened\nSlickdeals' frontpage lists the Xbox $100 gift card (email delivery) at Newegg for $90 with promo code BNWF2663. The listing's Thumb Score of +25 reflects community votes in favour of the deal. No other outlet in this cluster confirms the price, the code, or stock, and the snippet gives no expiry date for the promotion.\nWhy it matters\nThe judgment is blunt: a 10 percent discount on a stored-value Xbox card is only worth acting on if the code is still live — promo codes expire without notice, and email-delivery gift cards cannot be returned once sent. For anyone already planning an Xbox purchase, $10 off is real money; for anyone else, it is a reason to spend, not a saving.\nSources agree / disagree\nOnly Slickdeals carries this deal, so there is no independent corroboration of the price or the code. Trust label: Single source — one deal listing, no cross-check. The Thumb Score is a community vote, not a price verification.\nStill uncertain\nThe code's expiry, any purchase limits, and whether the $90 price survives to the checkout page are all unstated. Confirm the promo code and the final total at Newegg checkout before paying."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-shopping-02-100-microsoft-xbox-egift\",\"category\":\"shopping\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-shopping-02-100-microsoft-xbox-egift.jpg\",\"imageAlt\":{\"en\":\"Cover related to: $100 Microsoft Xbox eGift Card (Email Delivery) $90\",\"zh-TW\":\"相關封面圖：（譯文待補）$100 Microsoft Xbox eGift Card (Email Delivery) $90\"},\"publishedAt\":\"2026-11-11T01:45:23.000Z\",\"title\":{\"en\":\"Microsoft Xbox $100 eGift Card Drops to $90 at Newegg With Promo Code\",\"zh-TW\":\"微軟 Xbox 100 美元電子禮品卡在 Newegg 降至 90 美元，需用優惠碼\"},\"summary\":{\"en\":\"[Unconfirmed · Single source] Newegg is selling a $100 Microsoft Xbox eGift Card, delivered by email, for $90 with promo code BNWF2663, according to Slickdeals, where the deal carries a community Thumb Score of +25. No other outlet has confirmed the price, so verify the code and final total at checkout before buying.\",\"zh-TW\":\"［未證實·單一來源］Newegg 以 90 美元出售面額 100 美元的微軟 Xbox 電子禮品卡（電子郵件寄送），需輸入優惠碼 BNWF2663；此優惠來自 Slickdeals，社群評分 Thumb Score 為 +25。尚無其他來源證實價格，下單前請在結帳頁確認優惠碼與最終金額。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"據 Slickdeals 報導，Newegg 以 90 美元出售面額 100 美元的微軟 Xbox 電子禮品卡（電子郵件寄送），需輸入優惠碼 BNWF2663，該優惠在 Slickdeals 的社群評分 Thumb Score 為 +25。若結帳時優惠碼仍有效，等於省下 10 美元。\\n發生了什麼事\\nSlickdeals 首頁列出 Newegg 的 Xbox 100 美元禮品卡（電子郵件寄送）售價 90 美元，優惠碼為 BNWF2663。該優惠的 Thumb Score 為 +25，反映社群投票支持。同批來源中沒有其他媒體證實價格、優惠碼或庫存，摘要也沒給優惠截止日期。\\n為什麼重要\\n結論很直接：Xbox 儲值卡九折只有在優惠碼仍有效時才值得出手——優惠碼可能隨時失效，而電子郵件寄送的禮品卡一旦發出就無法退貨。對本來就要買 Xbox 產品的人來說，省 10 美元是實惠；對其他人來說，這只是花錢的理由，不是省錢。\\n來源異同\\n只有 Slickdeals 刊登這則優惠，價格與優惠碼都沒有獨立查證。信任標籤：僅1源——單一優惠清單，無從比對。Thumb Score 是社群投票，不是價格驗證。\\n仍不確定\\n優惠碼效期、購買數量限制，以及 90 美元價格能否撐到結帳頁，都沒有說明。付款前請在 Newegg 結帳頁確認優惠碼與最終金額。\"},\"sources\":[{\"name\":\"Slickdeals Frontpage\",\"url\":\"https://slickdeals.net/f/20283147-90-xbox-100-gift-card-email-delivery-at-newegg?utm_source=rss\u0026utm_content=fp\u0026utm_medium=RSS2\"}],\"disagreements\":null,\"trustScore\":47,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":10,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"shopping\",\"live-ingest\",\"slickdeals-frontpage\"],\"glossary\":[{\"term\":{\"en\":\"Newegg\",\"zh-TW\":\"Newegg\"},\"blurb\":{\"en\":\"Online electronics retailer selling the Xbox gift card.\",\"zh-TW\":\"出售這張 Xbox 禮品卡的線上電子產品零售商。\"}},{\"term\":{\"en\":\"Xbox\",\"zh-TW\":\"Xbox\"},\"blurb\":{\"en\":\"Microsoft's gaming platform; the gift card is for its store.\",\"zh-TW\":\"微軟遊戲平台，這張禮品卡用於其商店。\"}},{\"term\":{\"en\":\"eGift Card\",\"zh-TW\":\"電子禮品卡\"},\"blurb\":{\"en\":\"Gift card delivered by email rather than as a physical card.\",\"zh-TW\":\"以電子郵件寄送、而非實體卡片的禮品卡。\"}},{\"term\":{\"en\":\"Slickdeals\",\"zh-TW\":\"Slickd
