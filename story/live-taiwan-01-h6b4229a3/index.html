mai, while the Ko Chih-en rally staged a blue-white joint appearance.\nWhy it matters\nThe joint Han-Ko appearance signals blue-white cooperation in a major mayoral race, and Ko Wen-je's detention remark turns his own legal experience into a campaign attack line.\nSources agree / disagree\nCNA and PTS cover complementary halves of the same campaign weekend and do not conflict on the events described. Trust label: Two-source agreement — two outlets agree on the weekend's campaign picture.\nStill uncertain\nThe snippets carry no response from Lai Jui-lung or the DPP to the detention remark, and no detail on the alleged donations beyond Ko Wen-je's claim; treat the claim as an allegation, not a finding."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-01-h6b4229a3\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-taiwan-01-h6b4229a3.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 與韓國瑜一起挺柯志恩　柯文哲：賴瑞隆應收押禁見\",\"zh-TW\":\"相關封面圖：與韓國瑜一起挺柯志恩　柯文哲：賴瑞隆應收押禁見\"},\"publishedAt\":\"2026-11-01T12:49:44.000Z\",\"title\":{\"en\":\"Ko Wen-je Joins Han Kuo-yu to Back Ko Chih-en in Kaohsiung, Says Lai Jui-lung Should Be Detained\",\"zh-TW\":\"柯文哲（Ko Wen-je）偕韓國瑜（Han Kuo-yu）挺柯志恩（Ko Chih-en），稱賴瑞隆（Lai Jui-lung）應收押禁見\"},\"summary\":{\"en\":\"In Kaohsiung, Taiwan People's Party founder Ko Wen-je campaigned alongside Legislative Yuan President Han Kuo-yu for Kuomintang mayoral candidate Ko Chih-en. Ko Wen-je argued that Democratic Progressive Party candidate Lai Jui-lung, who received political donations from Leopard Energy, should be detained incommunicado, as Ko himself was.\",\"zh-TW\":\"民眾黨創黨主席柯文哲（Ko Wen-je）與立法院長韓國瑜（Han Kuo-yu）在高雄同台，力挺國民黨市長參選人柯志恩（Ko Chih-en）。柯文哲主張，收了雲豹能源（Leopard Energy）政治獻金的民進黨參選人賴瑞隆（Lai Jui-lung），應比照他本人收押禁見。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"高雄市長選戰在同一週末集齊三方陣營要角。\\n發生了什麼事\\n中央社（CNA）11 月 1 日自高雄報導，民眾黨創黨主席柯文哲（Ko Wen-je）與立法院長韓國瑜（Han Kuo-yu）同台，力挺國民黨市長參選人柯志恩（Ko Chih-en）。柯文哲表示，民進黨參選人賴瑞隆（Lai Jui-lung）收了雲豹能源（Leopard Energy）政治獻金，應比照他本人直接收押禁見。公視（PTS）則報導週末另一面：總統賴清德（Lai Ching-te）出席高雄醫師節慶祝大會，偕陳其邁（Chen Chi-mai）為賴瑞隆站台，柯志恩後援會成立大會則上演藍白合。\\n為什麼重要\\n韓國瑜與柯文哲同台顯示藍白在重要市長選戰的合作訊號，柯文哲的收押說法則把自身司法經歷轉為競選攻擊主軸。\\n來源異同\\n中央社（CNA）與公視（PTS）報導同一競選週末的互補兩面，所述行程不衝突。信任標籤：雙源一致——兩家媒體對週末選情圖像一致。\\n仍不確定\\n摘要未見賴瑞隆或民進黨對收押說法的回應，也未提供獻金指控的細節；該說法應視為指控，而非已認定事實。\"},\"sources\":[{\"name\":\"中央社-政治\",\"url\":\"https://www.cna.com.tw/news/aipl/202611010157.aspx\"},{\"name\":\"公視新聞網\",\"url\":\"https://news.pts.org.tw/article/833792\"}],\"disagreements\":null,\"trustScore\":74,\"trustBreakdown\":{\"sourceDiversity\":13,\"outletReputation\":22,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"中央社-政治\",\"公視新聞網\"],\"glossary\":[{\"term\":{\"en\":\"Ko Wen-je\",\"zh-TW\":\"柯文哲\"},\"blurb\":{\"en\":\"Founder of the Taiwan People's Party who campaigned for Ko Chih-en in Kaohsiung.\",\"zh-TW\":\"民眾黨創黨主席，在高雄為柯志恩助選。\"}},{\"term\":{\"en\":\"Han Kuo-yu\",\"zh-TW\":\"韓國瑜\"},\"blurb\":{\"en\":\"President of the Legislative Yuan who appeared alongside Ko Wen-je.\",\"zh-TW\":\"立法院長，與柯文哲同台助選。\"}},{\"term\":{\"en\":\"Ko Chih-en\",\"zh-TW\":\"柯志恩\"},\"blurb\":{\"en\":\"Kuomintang candidate for mayor of Kaohsiung.\",\"zh-TW\":\"國民黨高雄市長參選人。\"}},{\"term\":{\"en\":\"Lai Jui-lung\",\"zh-TW\":\"賴瑞隆\"},\"blurb\":{\"en\":\"Democratic Progressive Party candidate for mayor of Kaohsiung, targeted by Ko's remark.\",\"zh-TW\":\"民進黨高雄市長參選人，柯文哲發言的對象。\"}},{\"term\":{\"en\":\"Leopard Energy\",\"zh-TW\":\"雲豹能源\"},\"blurb\":{\"en\":\"Energy company whose political donations Ko Wen-je cited in his remark.\",\"zh-TW\":\"能源公司，柯文哲發言中提及的政治獻金來源。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified new
