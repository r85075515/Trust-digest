f the Senate's more visible Democrats and had been traveling the country campaigning ahead of Tuesday's midterm elections.\nWhy it matters\nA sitting senator's sudden hospitalization days before the midterms affects both his own campaign-season role and the Senate's closely watched balance, making the recovery prognosis the key fact to follow.\nSources agree / disagree\nCNBC, PBS NewsHour, Axios and NPR all report the same office statement, the same Saturday onset and the same recovery expectation, with no conflicting facts. Trust label: Multi-source agreement — four established outlets agree on the core claims.\nStill uncertain\nThe snippets give no medical detail beyond the office statement, no discharge timetable and no word on when Murphy will resume public duties; updates depend on further office or hospital statements."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-01-connecticut-sen-chris-mu\",\"category\":\"international\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-international-01-connecticut-sen-chris-mu.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Connecticut Sen. Chris Murphy is in the hospital after having a stroke, his office says\",\"zh-TW\":\"相關封面圖：康乃狄克州參議員克里斯墨菲 (Chris Murphy) 辦公室稱，他中風後正在醫院接受治療\"},\"publishedAt\":\"2026-11-01T21:44:49.000Z\",\"title\":{\"en\":\"Sen. Chris Murphy Hospitalized After Stroke; Office Says He Is Awake, Alert and Expected to Recover\",\"zh-TW\":\"參議員墨菲（Chris Murphy）中風住院，辦公室稱清醒且可望康復\"},\"summary\":{\"en\":\"Connecticut Sen. Chris Murphy, 53, suffered a stroke on Saturday after numbness in his arm began at his son's hockey game, his office said Sunday. He is being treated at Johns Hopkins Hospital, is awake and alert, responding well and expected to make a full recovery.\",\"zh-TW\":\"康乃狄克州參議員墨菲（Chris Murphy），53 歲，週六在兒子冰球比賽現場手臂發麻，隨後證實中風，辦公室週日表示他正在約翰霍普金斯醫院（Johns Hopkins Hospital）治療，清醒且反應良好，可望完全康復。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"康乃狄克州參議員墨菲（Chris Murphy）中風住院，其辦公室於週日公布消息。\\n發生了什麼事\\n墨菲辦公室表示，這位 53 歲參議員週六中風，在公布前一天住院，目前「清醒且警覺」。幕僚長赫維特（Allison Herwitt）在聲明中說，墨菲週六在兒子的冰球比賽現場「手臂開始發麻」。Axios 報導他在約翰霍普金斯醫院（Johns Hopkins Hospital）治療；辦公室稱他對治療反應良好，可望完全康復。墨菲是參議院較受矚目的民主黨人之一，期中選舉週二登場前，他正四處助選。\\n為什麼重要\\n現任參議員在選前數日突然住院，既影響他本人的助選行程，也牽動參議院勢力消長，康復預後是最需要追蹤的事實。\\n來源異同\\nCNBC、公廣新聞（PBS NewsHour）、Axios 與全國公共廣播電台（NPR）皆引述同一辦公室聲明，發病時間與康復預期一致，沒有事實衝突。信任標籤：多源一致——四家主流媒體對核心主張一致。\\n仍不確定\\n摘要未提供聲明以外的醫療細節、出院時間表與復工時程；後續取決於辦公室或院方的新聲明。\"},\"sources\":[{\"name\":\"CNBC\",\"url\":\"https://www.cnbc.com/2026/11/01/chris-murphy-stroke-senate-hospital.html\"},{\"name\":\"PBS NewsHour\",\"url\":\"https://www.pbs.org/newshour/politics/connecticut-sen-chris-murphy-is-in-the-hospital-after-having-a-stroke-his-office-says\"},{\"name\":\"Axios\",\"url\":\"https://www.axios.com/2026/11/01/chris-murphy-stroke-hospitalized\"},{\"name\":\"NPR News\",\"url\":\"https://www.npr.org/2026/11/01/nx-s1-6025467/chris-murphy-stroke\"}],\"disagreements\":null,\"trustScore\":94,\"trustBreakdown\":{\"sourceDiversity\":25,\"outletReputation\":19,\"crossCorroboration\":25,\"recencyClarity\":25},\"tags\":[\"international\",\"live-ingest\",\"cnbc\",\"pbs-newshour\",\"axios\"],\"glossary\":[{\"term\":{\"en\":\"Chris Murphy\",\"zh-TW\":\"墨菲\"},\"blurb\":{\"en\":\"Democratic senator from Connecticut hospitalized after a stroke.\",\"zh-TW\":\"康乃狄克州民主黨參議員，中風住院。\"}},{\"term\":{\"en\":\"Allison Herwitt\",\"zh-TW\":\"赫維特\"},\"blurb\":{\"en\":\"Murphy's chief of staff, who issued the statement on his condition.\",\"zh-TW\":\"墨菲的幕僚長，發布其病況聲明。\"}},{\"term\":{\"en\":\"Johns Hopkins Hospital\",\"zh-TW\":\"約翰霍普金斯醫院\"},\"blurb\":{\"en\":\"Hospital where Murphy is being treated, according to Axios.\",\"zh-TW\":\"依 Axios 報導，墨菲接受治療的醫院。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__
