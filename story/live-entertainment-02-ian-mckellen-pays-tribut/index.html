,false]],\"m\":\"$undefined\",\"G\":[\"$e\",[]],\"s\":false,\"S\":true}\n"])</script><script>self.__next_f.push([1,"f:I[8587,[\"619\",\"static/chunks/619-ba102abea3e3d0e4.js\",\"878\",\"static/chunks/878-54242d442ebbd731.js\",\"954\",\"static/chunks/app/story/%5Bid%5D/page-e46d620e91a1e02d.js\"],\"default\"]\n10:T6cf,"])</script><script>self.__next_f.push([1,"Patrick Stewart, the Star Trek and X-Men actor, has died at age 86, and Ian McKellen paid tribute to his close friend, recalling he once warned Stewart about Star Trek, The Verge, TMZ and Just Jared reported.\nWhat happened\nAn Instagram message said Stewart died on Wednesday at his Los Angeles home, after a brief journey with Alzheimer's Disease and Lewy Body Dementia. Stewart was born in 1940 in Mirfield, Yorkshire, and began acting in theatre. His social media account announced the death on Thursday afternoon, saying he died in the care of loved ones. McKellen said Stewart wore his heart on his sleeve, a man to rely on and admire. Paul Wesley, a Star Trek: Strange New Worlds actor, said he had met Stewart before his death, but the snippet was truncated.\nWhy it matters\nStewart defined two major screen franchises after a stage career, and McKellen's tribute carries weight as a collaborator of decades. The family's dementia account makes the public record unusually personal. The tribute centres on Stewart's character, not only his credits. Fuller obituaries and career retrospectives are still to come.\nSources agree / disagree\nSix outlets agree Stewart died at 86, with the Instagram announcement consistent across snippets. The flagged 86 versus 8217 is not a competing age; 8217 looks like a snippet encoding artefact, and no outlet reported a different age. Trust label: Multi-source agreement — six outlets agree on the core facts of the death at 86 and the tributes.\nStill uncertain\nMcKellen's full tribute, Wesley's full remarks, and funeral or memorial arrangements were not stated. No statement beyond the Instagram message and social media announcement appeared. Check the full reporting before quoting those details."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-entertainment-02-ian-mckellen-pays-tribut\",\"category\":\"entertainment\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-entertainment-02-ian-mckellen-pays-tribut.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Ian McKellen Pays Tribute to Patrick Stewart, Recalls Warning Him About ‘Star Trek’\",\"zh-TW\":\"相關封面圖：（譯文待補）Ian McKellen Pays Tribute to Patrick Stewart, Recalls Warning Him About ‘Star Trek’\"},\"publishedAt\":\"2026-10-30T01:20:13.000Z\",\"title\":{\"en\":\"Ian McKellen Pays Tribute to Patrick Stewart, Recalls Warning Him About Star Trek\",\"zh-TW\":\"伊恩·麥凱倫（Ian McKellen）悼念派崔克·史都華（Patrick Stewart），回憶曾勸他別接《星際爭霸戰》\"},\"summary\":{\"en\":\"Patrick Stewart, the Star Trek and X-Men actor, has died at age 86. Ian McKellen paid tribute to his close friend and collaborator, recalling that he once warned Stewart about Star Trek. A message on Stewart's Instagram account said he died at home in Los Angeles on Wednesday after living with Alzheimer's disease and Lewy body dementia.\",\"zh-TW\":\"派崔克·史都華（Patrick Stewart），《星際爭霸戰》與《X戰警》演員，享年 86 歲辭世。伊恩·麥凱倫（Ian McKellen）悼念密友兼合作夥伴，回憶曾勸史都華慎接《星際爭霸戰》，史都華 Instagram 帳戶的訊息稱他週三在洛杉磯家中辭世，生前患有阿茲海默症與路易體癡呆症，悼念細節仍待完整報導確認。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"派崔克·史都華（Patrick Stewart），以《星際爭霸戰》與《X戰警》聞名的演員，享年 86 歲辭世，伊恩·麥凱倫（Ian McKellen）悼念密友兼合作夥伴，回憶曾勸史都華慎接《星際爭霸戰》。The Verge、TMZ 與 Just Jared 都報導了死訊與悼念。\\n發生了什麼事\\n史都華 Instagram 帳戶發布的訊息稱，他週三在洛杉磯家中辭世，此前因阿茲海默症與路易體癡呆症經歷了一段短暫而令人心酸的病程，The Verge 如此報導。同一報導指出，史都華 1940 年出生於英國約克郡米菲爾德，在劇場開始演藝生涯。TMZ 報導，麥凱倫因密友兼合作夥伴辭世深受打擊，他回憶史都華「把心擺在袖子上」，是值得信賴、值得欽佩的人。TMZ 報導，史都華的社群媒體帳戶週四下午宣布死訊，貼文稱他週三在摯愛親人的照顧下辭世。TMZ 報導，《星際爭霸戰：奇異新世界》演員保羅·衛斯理（Paul Wesley）週四在洛杉磯機場受訪時表示，他在史都華辭世前曾與他見面，來源摘要經過截斷，沒有說明衛斯理飾演的角色，也沒有完整呈現他的發言內容。\\n為什麼重要\\n史都華的辭世，為橫跨兩大影視系列與先行劇場生涯的演藝人生畫下句點，麥凱倫的悼念格外有分量，因為他是與史都華共事數十年的合作夥伴。這些報導中的公開紀錄格外私人：死因描述來自家屬對失智症病程的說法，悼念聚焦於史都華的為人，而不只是他的作品名單。讀者應把這些悼念視為第一波公開回應，更完整的訃聞與生涯回顧仍待完整報導補上。\\n來源異同\\nThe Verge、TMZ、Just Jared、BBC Entertainment、LA Times California、NPR News 六家媒體報導的死訊與悼念，核心事實一致：史都華享年 86 歲，Instagram 公告與失智症說法在各摘要中一致。機器標示的 86 與 8217 數字差異不是另一個年齡，8217 看似摘要編碼產物，沒有任何媒體報導不同年齡。信任標籤：多源一致——六家媒體對史都華享年 86 歲辭世與隨後的悼念，核心事實一致。\\n仍不確定\\n來源摘要沒有提供麥凱倫悼念全文、衛斯理發言完整內容、葬禮或追思安排，也沒有提供 Instagram 訊息與社群媒體公告以外的其他聲明。截斷的摘要也沒有完整呈現家屬說法的全文。這些關鍵資訊在提供的材料中沒有披露，引用前應查閱完整報導。\"},\"sources\":[{\"name\":\"The Verge\",\"url\":\"https://www.theverge.com/news/1022626/patrick-stewart-star-trek-death\"},{\"name\":\"TMZ\",\"url\":\"https://www.tmz.com/2026/10/29/patrick-stewart-honored-by-ian-mckellen/\"},{\"name\":\"Just Jared\",\"url\":\"https://www.justjared.com/2026/10/29/ian-mckellen-pays-tribute-to-patrick-stewart-recalls-warning-him-about-star-trek/\"},{\"name\":\"BBC Entertainment\",\"url\":\"https://www.bbc.co.uk/news/articles/cye0l23lx15o?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"LA Times California\",\"url\":\"https://www.latimes.com/entertainment-arts/story/2026-10-29/what-is-lewy-body-dementia-patrick-stewart\"},{\"name\":\"NPR News\",\"url\":\"https://www.npr.org/2026/10/29/1230906945/patrick-stewart-dead\"}],\"disagreements\":{\"en\":\"Figures differ across outlets (e.g. 86 vs 8217 in headlines/snippets).\",\"zh-TW\":\"不同媒體的數字有所不同（例如，標題/摘要中的數字為 86 與 8217）。\"},\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":25,\"outletReputation\":19,\"crossCorroboration\":17,\"recencyClarity\":25},\"tags\":[\"entertainment\",\"live-ingest\",\"the-verge\",\"tmz\",\"tmz\"],\"glossary\":[{\"blurb\":{\"en\":\"British actor known for Star Trek and X-Men who died at age 86.\",\"zh-TW\":\"以《星際爭霸戰》與《X戰警》聞名的英國演員，享年 86 歲辭世。\"},\"term\":{\"en\":\"Patrick Stewart\",\"zh-TW\":\"派崔克·史都華\"}},{\"blurb\":{\"en\":\"Actor and close friend and collaborator of Stewart who paid tribute to him.\",\"zh-TW\":\"史都華的密友兼合作夥伴，發文悼念史都華的演員。\"},\"term\":{\"en\":\"Ian McKellen\",\"zh-TW\":\"伊恩·麥凱倫\"}},{\"blurb\
