 status with Nvidia by that October, giving it priority access to chips. When orders for chips subject to US export restrictions stalled, she allegedly used ties to Nvidia and its distributors to secure supplies, helping move about 240,000 H100, H200 and some A100 chips into China. Nvidia did not immediately respond to Reuters' request for comment. The report lands on top of an already-escalating case: Huang has admitted the affair, Nvidia's board has opened an internal investigation, the FBI is looking into the relationship, shareholders have sued, and China's foreign ministry has dismissed the spying claim as 'a groundless accusation, slander, and a smear.'\nWhy it matters\nIf substantiated, this is no longer a personal scandal: a partner-status company at the centre of the network allegedly channelled a quarter-million export-controlled accelerators into China, which would make the affair a direct breach point in US export controls and a first-order problem for Nvidia's board investigation and the FBI's. But the conditional is doing real work. Everything in this report traces to one outlet's two anonymous sources; no document, official or second newsroom has confirmed the shipments, the figure or Century Litong's role. The earlier $4.8 billion Megaspeed order reporting is a separate, smaller claim — the two numbers should not be merged.\nSources agree / disagree\nReuters, The Hindu BusinessLine and Devdiscourse carry the same wire account of The Information's report, and Taiwanese coverage (CNYES, Liberty Times) matches on the $7.5 billion figure and the Century Litong mechanism. That agreement is derivative, not corroboration: every account traces back to the single original report. Reuters states plainly that it could not independently verify it, and Nvidia has not commented on this report. Trust label: Single-origin report, unverified — the underlying affair and investigations are multiply confirmed; the $7.5 billion shipment network is, for now, one investigation's allegation.\nStill uncertain\nAlmost everything specific: whether the shipments happened as described, whether the 240,000-chip and $7.5 billion figures hold, what Century Litong's partner status actually granted, and whether Jensen Huang knew of or benefited from the network — the report does not establish the CEO's knowledge. Watch for Nvidia's response, any comment from Century Litong, and whether the board inquiry or US authorities address the shipment claims directly."])</script><script>self.__next_f.push([1,"11:Ta8a,"])</script><script>self.__next_f.push([1,"《The Information》週二報導，輝達（Nvidia）執行長黃仁勳（Jensen Huang）坦承的外遇對象黃樂（Alice Huang），被指促成至少 75 億美元的輝達晶片出貨到中國企業；路透社轉述時明言，未能獨立核實這篇報導。\n發生了什麼事\n《The Information》引述兩名認識黃樂的人士說：她與丈夫、姊妹在中國與新加坡建立了一組企業網絡，專門取得輝達晶片。網絡核心是上海世紀立通（Shanghai Century Litong），2023 年 6 月成立、同年 10 月就取得輝達「優先雲端夥伴」（preferred cloud partner）地位，獲得晶片的優先取得權。報導稱，當受美國出口管制的晶片訂單卡住時，她利用與輝達及其經銷商的關係取得貨源，協助把約 24 萬顆 H100、H200 與部分 A100 晶片送進中國，貨值至少 75 億美元。輝達未即時回應路透的置評請求。這篇報導疊在一條已經升級的案子上：黃仁勳已坦承外遇、輝達董事會已啟動內部調查、FBI 正在調查這段關係、股東已提集體訴訟；中國外交部則稱間諜指控是「無中生有、造謠抹黑」。\n為什麼重要\n若屬實，這就不再是私人醜聞：網絡核心是一家有輝達夥伴地位的公司，被指把 24 萬顆受管制的高階晶片送進中國——等於美國出口管制在輝達自家通路被鑽出一個洞，董事會調查與 FBI 的案子都會直接升級。但「若屬實」四個字現在扛著全部重量：這篇報導的所有細節只來自一家媒體的兩名匿名消息來源，沒有文件、沒有官方、沒有第二家媒體獨立證實出貨、金額或世紀立通的角色。先前報導的 Megaspeed 48 億美元訂單是另一筆較小的說法，兩組數字不要混為一談。\n來源異同\n路透社、《The Hindu BusinessLine》、Devdiscourse 與台灣媒體（鉅亨網、自由財經）對 75 億美元與世紀立通機制的描述一致——但這是一致的轉述，不是獨立佐證：所有版本都溯源到同一篇原始報導。路透明言未能獨立核實，輝達對這篇報導尚未回應。信任標籤：單一原始來源、未證實——底層的外遇與各項調查有多源證實，75 億美元輸中網絡目前仍是一家媒體的指控。\n仍不確定\n幾乎所有具體內容都不確定：出貨是否如報導所述發生、24 萬顆與 75 億美元是否成立、世紀立通的夥伴地位實際授予了什麼、以及黃仁勳本人是否知情或受益——報導並未證實執行長知情。接下來要看輝達是否回應、世紀立通是否出面、以及董事會調查或美國當局是否直接處理輸中指控。"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-04-huang-network-75b-chips\",\"category\":\"semiconductor\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"\",\"zh-TW\":\"\"},\"publishedAt\":\"2026-11-10T12:40:40.000Z\",\"title\":{\"en\":\"Report: Huang's
