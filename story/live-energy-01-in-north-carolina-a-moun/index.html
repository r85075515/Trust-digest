 disasters in recent years, and many residents are still rebuilding after Hurricane Helene.\nWhat happened\nRepeated flooding has unsettled residents such as Sandra Moody in Canton. Two years after Helene, Democrats see a chance to flip North Carolina's 11th Congressional District with a farmer from Fairview, whose pitch is that he can bring meaningful change to wary voters. The candidate is not named in the snippets. The profile was written by Jack Bell for The Assembly and republished by Inside Climate News.\nWhy it matters\nThis race shows how a hurricane can keep shaping politics long after the storm: recovery, flooding, and rebuilding are the lived issues voters carry into the voting booth. If the Democratic challenger wins over voters who feel left behind by recovery, it will be because the aftermath mattered more than party labels.\nSources agree / disagree\nGrist frames the story as Hurricane Helene haunting the midterms in North Carolina, while Inside Climate News carries the candidate profile. The two angles are consistent: both place Helene's aftermath at the center of this district's midterm contest. Trust label: Two-source agreement — two outlets agree that Helene's aftermath drives this North Carolina midterm contest.\nStill uncertain\nThe snippets do not name the candidate, give no polling, and cut off before Moody's full remarks. The election outcome and the voters' final verdict are unknown; verify the candidate's name and the district's polling in the full reporting."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-energy-01-in-north-carolina-a-moun\",\"category\":\"energy\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-energy-01-in-north-carolina-a-moun.webp\",\"imageAlt\":{\"en\":\"Cover related to: In North Carolina, a ‘Mountain Democrat’ Vies for Residents Still Hurting From Helene\",\"zh-TW\":\"相關封面圖：在北卡羅來納州，一位「山區民主黨人」為仍然受到海倫傷害的居民展開了爭奪\"},\"publishedAt\":\"2026-10-28T18:59:36.000Z\",\"title\":{\"en\":\"North Carolina's Mountain Democrat Courts Voters Still Rebuilding After Helene\",\"zh-TW\":\"北卡羅來納州「山區民主黨人」爭取海倫颶風後仍在重建的選民\"},\"summary\":{\"en\":\"At a busy early-voting site in Canton, North Carolina, on October 19, voters weighed the midterms alongside two years of recovery from Hurricane Helene. A Democratic farmer from Fairview hopes to flip the state's 11th Congressional District. Helene's aftermath, not just party loyalty, may decide this race.\",\"zh-TW\":\"10 月 19 日，北卡羅來納州坎頓提前投票現場人潮忙碌，選民心裡除了期中選舉，還有海倫颶風兩年來的重建。來自費爾維尤的民主黨農民候選人想翻轉該州第 11 國會選區。接下來看：災後重建的感受，可能比黨派忠誠更能決定這一席。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"午餐時間，北卡羅來納州坎頓市海伍德縣公共圖書館人潮忙碌；10 月 19 日提前投票的選民，心裡想的不只是期中選舉。該地區近年來屢遭天災，許多居民仍在海倫颶風過後重建家園。\\n發生了什麼事\\n反覆淹水讓坎頓的居民如桑德拉·穆迪（Sandra Moody）深感不安。海倫颶風兩年後，民主黨人看到翻轉北卡羅來納州第 11 國會選區的機會，推出的是一位來自費爾維尤的農民，他向心存疑慮的選民承諾帶來有意義的改變。摘要沒有具名這位候選人。這篇人物報導由傑克·貝爾（Jack Bell）為 The Assembly 撰寫，經 Inside Climate News 轉載。\\n為什麼重要\\n這場選戰顯示，颶風在風暴過後很久仍能左右政治：復原、淹水與重建，是選民帶進投票所的切身議題。如果民主黨挑戰者能贏得覺得重建工作把他們落下的選民，那是因為災後處境比黨派標籤更重要。\\n來源異同\\nGrist 以「海倫颶風困擾北卡羅來納州期中選舉」為角度，Inside Climate News 則刊登候選人的人物報導。兩個角度一致：都把海倫颶風的餘波放在這個選區期中選戰的中心。信任標籤：兩源一致——兩家媒體都認為海倫颶風的餘波主導了這場北卡羅來納州期中選戰。\\n仍不確定\\n摘要沒有具名候選人、沒有民調數據，穆迪的完整說法也在中途截斷。選舉結果與選民的最終決定目前未知；引用候選人姓名與民調前，請查閱完整報導。\"},\"sources\":[{\"name\":\"Grist\",\"url\":\"https://grist.org/elections/hurricane-helene-haunts-the-midterms-in-north-carolina/\"},{\"name\":\"Inside Climate News\",\"url\":\"https://insideclimatenews.org/news/28102026/in-north-carolina-a-mountain-democrat-vies-for-residents-still-hurting-from-helene/\"}],\"disagreements\":null,\"trustScore\":62,\"trustBreakdown\":{\"sourceDiversity\":13,\"outletReputation\":10,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"energy\",\"live-ingest\",\"grist\",\"inside-climate-news\"],\"glossary\":[{\"blurb\":{\"en\":\"The hurricane whose aftermath and rebuilding still shape this North Carolina district.\",\"zh-TW\":\"餘波與重建至今仍影響這個北卡選區的颶風。\"},\"term\":{\"en\":\"Hurricane Helene\",\"zh-TW\":\"海倫颶風\"}},{\"blurb\":{\"en\":\"The congressional district where the Democratic farmer hopes to win.\",\"zh-TW\":\"民主黨農民候選人希望勝選的國會選區。\"},\"term\":{\"en\":\"North Carolina's 11th Congressional District\",\"zh-TW\":\"北卡羅來納州第 11 國會選區\"}},{\"blurb\":{\"en\":\"Canton voter unsettled by repeated flooding after Helene.\",\"zh-TW\":\"因反覆淹水而深感不安的坎頓選民。\"},\"term\":{\"en\":\"Sandra Moody\",\"zh-TW\":\"桑德拉·穆迪\"}},{\"blurb\":{\"en\":\"Climate news outlet that framed Helene as haunting the North Carolina midterms.\",\"zh-TW\":\"以海倫颶風困擾期中選舉為角度報導的氣候新聞媒體。\"},\"term\":{\"en\":\"Grist\",\"zh-TW\":\"Grist\"}},{\"blurb\":{\"en\":\"Climate news outlet that republished the candidate profile.\",\"zh-TW\":\"轉載候選人人物報導的氣候新聞媒體。\"},\"term\":{\"en\":\"Inside Climate News\",\"zh-TW\":\"Inside Climate News\"}},{\"blurb\":{\"en\":\"Publication that originally published the candidate profile by Jack Bell.\",\"zh-TW\":\"最初刊登傑克·貝爾候選人報導的刊物。\"},\"term\":{\"en\":\"The Assembly\",\"zh-TW\":\"The Assembly\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://r85075515.github.io/Trust-digest/\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"Axiom\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:loca
