pened\nOver the past decade, MIT researchers developed aerial microrobots with bumblebee-like speed, agility and durability for tasks like precision agriculture and search-and-rescue, MIT News reports. Those featherweight microrobots could not carry the electronics needed for navigation, forcing them to remain connected to a motion-capture system in the lab. The researchers have now designed a flapping-wing microrobot that carries its own sensors and computers, according to the headline and the truncated report.\nWhy it matters\nOnboard sensing and computing is the step that turns a lab demonstration into a machine that can navigate on its own. Precision agriculture and search-and-rescue are the uses MIT names, and both need robots that work away from lab equipment.\nSources agree / disagree\nOnly MIT News carries the item, so there is no second account to check it against. No numeric or name conflicts appear, because no second report exists.\nStill uncertain\nThe feed item cuts off before giving the robot's weight, size, flight time or how it navigates, and no performance figures appear in the snippets. MIT News' full report is needed before the advance can be assessed.\nTrust label: Single source"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-ai-01-this-featherweight-flyin\",\"category\":\"ai\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-ai-01-this-featherweight-flyin.jpg\",\"imageAlt\":{\"en\":\"Cover related to: This featherweight, flying robot carries its own sensors and computers\",\"zh-TW\":\"相關封面圖：（譯文待補）This featherweight, flying robot carries its own sensors and computers\"},\"publishedAt\":\"2026-11-18T19:00:00.000Z\",\"title\":{\"en\":\"MIT's Featherweight Flying Robot Now Carries Its Own Sensors and Computers\",\"zh-TW\":\"麻省理工學院（MIT）輕量飛行機器人如今自帶感測器與電腦\"},\"summary\":{\"en\":\"[Unconfirmed · Single source] MIT researchers have designed a featherweight flapping-wing mi
