zh-TW\":\"澳洲納拉伯平原神秘淺溝 揭深埋洞穴向上塌陷與探測線索\"},\"summary\":{\"en\":\"Researchers reported on November 26, 2026, that shallow trenches across Australia's Nullarbor Plain form as deep caves collapse upward over millions of years. Key takeaway: Mapping these surface trenches may help locate unexplored caves on Earth and potentially Mars.\",\"zh-TW\":\"研究團隊於二〇二六年十一月二十六日指出，澳洲納拉伯平原的神秘淺溝源於深層洞穴歷經數百萬年向上塌陷。關鍵結論：這項機制有助科學家尋找地球與火星等天體的隱蔽洞穴。\"},\"body\":{\"en\":\"「What happened」 Scientists published findings on November 26, 2026, explaining that shallow trenches scattered across southern Australia's 200,000-square-kilometer Nullarbor Plain are surface signs of deeply buried caves collapsing upward over millions of years.\\n「Why it matters」 Using drones, aerial photos, satellite models, boreholes, and cave measurements, researchers linked the trenches to hidden subterranean spaces that could hold ancient environmental records and specialized life forms, while offering a method to spot caves on Mars.\\n「Source differences」 ScienceDaily published the report on November 26, 2026, based on The Conversation, and secondary science aggregators summarized the findings.\\n「Still uncertain」 Exact locations of newly targetable underground chambers and whether similar surface features on Mars indicate active cave systems require further study.\\nTrust label: Single source — Coverage stems from a single research report distributed via ScienceDaily and The Conversation.\",\"zh-TW\":\"「發生了什麼事」科學家於二〇二六年十一月二十六日公布研究，指出澳洲南部面積逾二十萬平方公里的納拉伯平原上散布的淺溝，是深層洞穴歷經數百萬年向上塌陷至地表的徵兆。\\n「為什麼重要」研究團隊結合無人機、空拍影像、衛星地形模型、鑽孔與洞穴測量，解開這類無典型河道特徵淺溝的成因，不僅有助尋找保存古環境紀錄與特殊生物的洞穴，也可為探測火星地下洞穴提供線索。\\n「來源異同」ScienceDaily 於二〇二六年十一月二十六日刊載該篇源自 The Conversation 的報導，另有科學摘要網站轉述。\\n「仍不確定」實際可深入探索的地下洞穴點位，以及火星類似地形是否對應洞穴結構，仍需後續觀測與驗證。\\nTrust label: Single source — 報導來自 ScienceDaily 與 The Conversation 的同一篇科學研究說明。\"},\"glossary\":[{\"term\":{\"en\":\"Nullarbor Plain\",\"zh-TW\":\"納拉伯平原\"},\"blurb\":{\"en\":\"Vast limestone plain stretching across southern Australia.\",\"zh-TW\":\"橫跨澳洲南部的廣大石灰岩平原，面積逾二十萬平方公里。\"}},{\"term\":{\"en\":\"Limestone\",\"zh-TW\":\"石灰岩\"},\"blurb\":{\"en\":\"Sedimentary rock composed largely of calcium carbonate that can dissolve and form caves.\",\"zh-TW\":\"以碳酸鈣為主要成分的沉積岩，易受水溶蝕形成洞穴與喀斯特地形。\"}},{\"term\":{\"en\":\"Borehole\",\"zh-TW\":\"鑽孔\"},\"blurb\":{\"en\":\"Narrow shaft drilled into the ground to sample rock and soil layers.\",\"zh-TW\":\"向地下鑽探取得的窄孔，用於觀測岩層與土層結構。\"}}],\"sources\":[{\"name\":\"ScienceDaily\",\"url\":\"https://www.sciencedaily.com/releases/2026/11/261124055901.htm\"},{\"name\":\"The Quantum Disciple\",\"url\":\"https://quantumdisciple.com/news/n-2026-11-26-shallow-trenches-in-australia-reveal-deeply-buried-hidden-ca\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"Nullarbor Plain Trenches Linked to Upward-Collapsing Deep Caves\",\"zh-TW\":\"澳洲納拉伯平原神秘淺溝 揭深埋洞穴向上塌陷與探測線索\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":62,\"trustBreakdown\":{\"crossCorroboration\":15,\"outletReputation\":22,\"recencyClarity\":18,\"sourceDiversity\":7},\"publishedAt\":\"2026-11-27T20:21:08.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":21,\"D2\":20,\"D3\":20,\"D4\":19,\"D5\":20,\"total\":20},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-science-214-nullarbor-trenches-caves/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:descrip
