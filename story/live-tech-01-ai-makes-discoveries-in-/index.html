s questions, the company is back with three more major discoveries.\nWhat happened\nOpenAI's announcement is the latest in a series of claimed scientific breakthroughs credited to AI. Less than a month after the mass manuscript release, OpenAI returned with three more major discoveries spanning math, computer science and physics. What is different this time is the choice to have external experts that OpenAI describes as shepherds guiding the results in computer science and physics, while the mathematics work followed the earlier pattern.\nWhy it matters\nThe verdict hinges on verification: if these discoveries hold up, AI shifts from a research tool to a research collaborator, with academics steering rather than merely checking its output. If they do not, the announcement joins a growing pattern of AI breakthrough claims that outrun peer review. Either way, the shepherd model — outside experts guiding AI work — is the part worth watching, because it is OpenAI's answer to the credibility question.\nSources agree / disagree\nThe Verge and Al Jazeera agree on the announcement: three discoveries, the manuscript-release context, and the shepherd detail. Trust label: Multi-source agreement — two established outlets agree on the core claims. Note the attribution: these are OpenAI's claims, not independently confirmed results.\nStill uncertain\nWhat the three discoveries actually are, whether they have passed peer review, and who the shepherd experts are, are not in the feed snippets. Treat the discoveries as announced, not established, until the underlying work is published and checked."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-tech-01-ai-makes-discoveries-in-\",\"category\":\"tech\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-tech-01-ai-makes-discoveries-in-.jpg\",\"imageAlt\":{\"en\":\"Cover related to: AI makes discoveries in mathematics, computer science, physics, OpenAI says\",\"zh-TW\":\"相關封面圖：OpenAI 表示，人工智慧在數學、電腦科學、物理領域取得了重大發現\"},\"publishedAt\":\"2026-10-27T05:01:13.000Z\",\"title\":{\"en\":\"OpenAI Claims Three New AI-Driven Discoveries in Math, Computing and Physics\",\"zh-TW\":\"OpenAI（OpenAI）宣稱 AI 在數學、電腦科學與物理學取得三項重大發現\"},\"summary\":{\"en\":\"Less than a month after releasing hundreds of manuscripts it said solved long-standing math questions, OpenAI is back with three more major discoveries in math, computer science and physics, The Verge and Al Jazeera report. This time external experts OpenAI calls shepherds guided the computing and physics work. Takeaway: OpenAI is pitching AI-plus-academic collaboration, but the claims await independent verification.\",\"zh-TW\":\"距離大規模發布數百份手稿、宣稱解開長期數學難題還不到一個月，OpenAI 又帶來三項數學、電腦科學與物理學的「重大」發現，The Verge 與 Al Jazeera 報導。這次的不同之處，是由 OpenAI 稱為「牧羊人」的外部專家引導電腦科學與物理學的研究。重點：OpenAI 正在推銷一種 AI 加學界合作的新模式，但這些宣稱仍待獨立驗證。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"OpenAI 表示，人工智慧在數學、電腦科學與物理學取得了重大發現：距離大規模發布數百份手稿、宣稱其中包含長期數學難題的解答還不到一個月，該公司又帶來三項「重大」發現。\\n發生了什麼事\\nOpenAI 的宣布，是歸功於 AI 的一連串科學突破宣稱中的最新一則。距離大規模手稿發布還不到一個月，OpenAI 又帶著橫跨數學、電腦科學與物理學的三項重大發現回來。這次的不同之處，是由 OpenAI 稱為「牧羊人」的外部專家引導電腦科學與物理學的研究成果，而數學的部分則沿用先前的模式。\\n為什麼重要\\n關鍵在驗證：如果這些發現站得住腳，AI 就從研究工具變成研究合作者，學者不再只是檢查它的輸出，而是引導它。如果站不住，這則宣布就會加入一長串跑在同儕審查前面的 AI 突破宣稱。無論如何，「牧羊人」模式——外部專家引導 AI 研究——是最值得看的部分，因為那是 OpenAI 對可信度質疑的回應。\\n來源異同\\nThe Verge 與 Al Jazeera 在宣布內容上一致：三項發現、手稿發布背景、牧羊人細節。信任標籤：N源一致——兩家主流媒體對核心主張的報導一致。但歸因要說清楚：這些是 OpenAI 的宣稱，不是已經獨立確認的成果。\\n仍不確定\\n三項發現到底是什麼、是否通過同儕審查、牧羊人專家是誰，片段中都沒有。在底層研究公開並接受檢驗之前，這些發現只能算「已宣布」，不能算「已確立」。\"},\"sources\":[{\"name\":\"The Verge\",\"url\":\"https://www.theverge.com/ai-artificial-intelligence/1019143/openai-eth-kaseya-science-math-physics\"},{\"name\":\"Al Jazeera\",\"url\":\"https://www.aljazeera.com/economy/2026/10/27/ai-makes-discoveries-in-mathematics-computer-science-physics-openai-says?traffic_source=rss\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":15,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"tech\",\"live-ingest\",\"the-verge\",\"al-jazeera\"],\"glossary\":[{\"term\":{\"en\":\"OpenAI\",\"zh-TW\":\"OpenAI\"},\"blurb\":{\"en\":\"The AI company behind the ChatGPT models, announcing the discoveries.\",\"zh-TW\":\"宣布這些發現的 AI 公司，開發 ChatGPT 模型。\"}},{\"term\":{\"en\":\"shepherd\",\"zh-TW\":\"牧羊人\"},\"blurb\":{\"en\":\"OpenAI's term for external experts guiding AI research results.\",\"zh-TW\":\"OpenAI 對引導 AI 研究成果的外部專家的稱呼。\"}},{\"term\":{\"en\":\"manuscript\",\"zh-TW\":\"手稿\"},\"blurb\":{\"en\":\"A research paper draft, hundreds of which OpenAI released earlier.\",\"zh-TW\":\"研究論文草稿，OpenAI 先前曾大規模發布數百份。\"}},{\"term\":{\"en\":\"peer review\",\"zh-TW\":\"同儕審查\"},\"blurb\":{\"en\":\"Independent expert checking of research before it is accepted.\",\"zh-TW\":\"研究被接受前，由獨立專家進行的檢驗。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://r85075515.github.io/Trust-digest/\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"Axiom\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"zh_TW\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:locale:alternate\",\"content\":\"en_US\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:type\",\"content\":\"
