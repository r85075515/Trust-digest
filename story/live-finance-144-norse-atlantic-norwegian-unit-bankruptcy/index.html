 November 27, 2026, after failing to raise emergency financing to cover short-term liquidity needs. Chief Executive Eivind Roald (艾文德・羅爾德) announced that all flights have been canceled, ticket sales halted, and customer service suspended, advising stranded passengers to seek refunds through the court-appointed bankruptcy trustee.\n\nThe collapse followed a turbulent week in which the carrier was placed on the Oslo Stock Exchange's Recovery Box, suspended flights on November 26, and received lease termination notices on November 27 from aircraft lessors covering all 12 of its jets—notices the airline said it is contesting. Listed parent company Norse Atlantic ASA and its U.K. subsidiary are excluded from the Norwegian bankruptcy petition while management explores restructuring options.\n\nNorse Atlantic's failure underscores the vulnerability of low-cost long-haul airlines to sustained jet fuel price shocks—exacerbated in 2026 by Middle East conflict—and tight aircraft leasing markets, leaving thousands of holiday travelers stranded across transatlantic routes.\n\nAl Jazeera, TheStreet, and MLQ.ai all corroborate the November 27 bankruptcy filing, flight cancellations, and fuel-cost pressures. Al Jazeera emphasized the link between fuel-cost spikes and the conflict in Iran, whereas MLQ.ai detailed the Oslo Børs filing showing that parent Norse Atlantic ASA, the U.K. subsidiary, and contested lease terminations on 12 aircraft remain separate from the operating unit's insolvency.\n\nWhether parent company Norse Atlantic ASA or its U.K. subsidiary can salvage partial operations without its 12 leased aircraft, and how much compensation ticket holders will recover from the bankruptcy estate, remains uncertain.\n\nTrust label: Multi-source agreement — Multiple international business and news outlets confirm the Norwegian operating subsidiary's bankruptcy filing and fleet grounding."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-144-norse-atlantic-norwegian-unit-bankruptcy\",\"category\":\"finance\",\"title\":{\"en\":\"Budget Carrier Norse Atlantic Files for Bankruptcy in Norway, Canceling All Flights\",\"zh-TW\":\"燃料成本重壓！挪威廉航 Norse Atlantic 營運子公司聲請破產、全面停飛停售\"},\"summary\":{\"en\":\"Norwegian low-cost long-haul carrier Norse Atlantic filed for bankruptcy for its main Norwegian operating unit on November 27 after failing to secure short-term liquidity amid surging fuel costs andaircraft lease terminations, immediately canceling all flights and halting ticket sales.\",\"zh-TW\":\"受今年燃料價格飆升及租機公司終止全數12架客機租約衝擊，挪威低成本長程航空 Norse Atlantic 11月27日宣布為主要營運子公司聲請破產，全面取消所有航班並停止售票；母公司 Norse Atlantic ASA 與英國子公司未納入破產程序，正尋求重組續存方案。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n挪威低成本長程航空公司 Norse Atlantic Airways AS 於2026年11月27日因無法籌措足夠資金支應短期流動性需求，正式向阿格德爾地方法院（Agder District Court）聲請破產。執行長艾文德・羅爾德（Eivind Roald）宣布全面取消所有航班、停止機票銷售並關閉客服管道，建議滯留旅客透過破產管理人程序申請退款。此前該公司已於25日遭奧斯陸證交所列入「復甦觀察名單」（Recovery Box）、26日暫停營運，並於27日收到租機公司針對全數12架客機發出的終止租約通知（公司正對此提出異議）。上市母公司 Norse Atlantic ASA 與英國子公司則未納入此次破產聲請。\\n\\n「為什麼重要」\\nNorse Atlantic 倒閉凸顯低成本長程航空在面對高油價與緊縮租機市場時的脆弱性。受中東衝突推升航空燃油成本影響，仰賴低票價與租賃寬體客機營運的跨大西洋廉航首當其衝，也造成感恩節週末大量歐美旅客行程受阻。\\n\\n「來源異同」\\n半島電視台（Al Jazeera）、《TheStreet》與財經資訊平台 MLQ.ai 均一致報導11月27日破產聲請、全面停飛與高油價壓力。半島電視台側重伊朗戰事推升燃油成本對航空業的衝擊；MLQ.ai 則進一步梳理奧斯陸證交所公告細節，指出上市母公司、英國子公司並未破產，且公司正與出租方爭執12架客機的解約效力。\\n\\n「仍不確定」\\n失去12架主力客機租約後，母公司 Norse Atlantic ASA 與英國子公司能否重組並維持部分航線營運，以及購票旅客最終能從破產財團追回多少退款，仍有待法院程序釐清。\\n\\nTrust label: Multi-source agreement — 多家國際財經與新聞媒體一致核實 Norse Atlantic 挪威營運子公司破產停飛與租約糾紛細節。\"},\"glossary\":[{\"term\":{\"en\":\"Low-cost long-haul carrier\",\"zh-TW\":\"低成本長程航空\"},\"blurb\":{\"en\":\"An airline business model offering unbundled budget fares on intercontinental routes, typically sensitive to fuel spikes and aircraft lease rates.\",\"zh-TW\":\"主打跨洲際航線低票價、機上服務拆售的航空營運模式，對燃油價格波動與飛機租金高度敏感。\"}},{\"term\":{\"en\":\"Aircraft lease termination\",\"zh-TW\":\"飛機租約終止\"},\"blurb\":{\"en\":\"Formal notice by aircraft leasing companies reclaiming planes from an airline due to payment defaults or insolvency.\",\"zh-TW\":\"飛機租賃商因航空公司違約或陷入無力償債，依法發出通知收回旗下客機的法律程序。\"}},{\"term\":{\"en\":\"Bankruptcy trustee\",\"zh-TW\":\"破產管理人\"},\"blurb\":{\"en\":\"A court-appointed administrator responsible for liquidating an insolvent company's assets and distributing funds to creditors and ticket holders.\",\"zh-TW\":\"由法院指派接管破產企業資產、審核債權並負責分配剩餘款項給債權人與受影響旅客的法定管理人。\"}}],\"sources\":[{\"name\":\"Al Jazeera\",\"url\":\"https://www.aljazeera.com/economy/2026/11/27/norse-atlantic-files-for-bankruptcy-halts-flights-and-ticket-sales\"},{\"name\":\"TheStreet\",\"url\":\"https://www.thestreet.com/travel/norse-atlantic-files-for-bankruptcy-protection-passengers-left-stranded\"},{\"name\":\"MLQ.ai\",\"url\":\"https://mlq.ai/news/norse-atlantics-operating-airline-files-for-bankruptcy-cancels-all-flights/\"}],\"imageUrl\":\"/covers/live/live-finance-144-norse-atlantic-norwegian-unit-bankruptcy.jpg\",\"imageAlt\":{\"en\":\"Norse Atlantic passenger aircraft grounded following bankruptcy filing\",\"zh-TW\":\"Norse Atlantic 客機在公司聲請破產後全面停飛\"},\"isHeadline\":false,\"isPopular\":true,\"trustScore\":84,\"trustBreakdown\":{\"crossCorroboration\":21,\"outletReputation\":21,\"recencyClarity\":22,\"sourceDiversity\":20},\"publishedAt\":\"2026-11-27T17:16:28.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":21,\"D2\":22,\"D3\":21,\"D4\":21,\"D5\":20,\"total\":21},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"h
