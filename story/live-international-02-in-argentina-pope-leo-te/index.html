ommitted to social justice. In Argentina, Leo also confronts the complicated legacy of Argentine Pope Francis, who never returned home during his 12-year pontificate. Bloomberg's headline frames the visit around unity as Milei ignores Lula's win in Brazil. Why it matters The judgment is blunt: a pope is telling a sitting president that his economic program must answer to the poor, in the president's own country. That puts the Church's social-justice doctrine in direct conversation with Milei's libertarian project, and makes the visit a test of whether the two can share a stage without a public clash. Sources agree / disagree NPR, The New York Times, PBS NewsHour, and Bloomberg all cover the same arrival with consistent facts. Trust label: Multi-source agreement — four established outlets agree on the core claims. Still uncertain The snippets do not carry Leo's exact wording, Milei's response, or the schedule of their meetings. Verify the details in the full reporting before quoting specifics."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-02-in-argentina-pope-leo-te\",\"category\":\"international\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-international-02-in-argentina-pope-leo-te.jpg\",\"imageAlt\":{\"en\":\"Pope Leo XIV speaking to crowds during his South American tour\",\"zh-TW\":\"教宗良十四世在南美之行期間向群眾發表演說\"},\"publishedAt\":\"2026-11-09T00:55:15.000Z\",\"title\":{\"en\":\"Pope Leo Tells Milei in Argentina the Economy Must Serve the Needy\",\"zh-TW\":\"教宗良十四世（Pope Leo XIV）在阿根廷告訴米萊（Javier Milei）：經濟必須為有需要的人服務\"},\"summary\":{\"en\":\"Pope Leo XIV arrived in Argentina and told President Javier Milei that people, not the economy, should come first, urging him to keep Latin America united. The visit, the most politically delicate leg of his South American tour, follows a stop in Uruguay that drew tens of thousands.\",\"zh-TW\":\"教宗良十四世（Pope Leo XIV）抵達阿根廷，告訴總統米萊（Javier Milei）應把人放在經濟之前，並呼籲維持拉丁美洲團結。這是他南美三國之行政治上最微妙的一站，前一站烏拉圭吸引數萬人到場聆聽。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"教宗良十四世（Pope Leo XIV）抵達阿根廷，告訴總統米萊（Javier Milei）應把人放在經濟之前，並呼籲維持拉丁美洲團結。此時該地區兩個最大經濟體正經歷雙邊關係中最緊張的時刻之一。\\n發生了什麼事\\n良十四世的阿根廷之行是他南美三國之行中政治上最微妙的一站。前一站烏拉圭，週日有數萬人擠滿佛羅里達市的主要廣場聆聽他演說。此行正值阿根廷自由派領袖與堅定主張社會正義的天主教會關係緊張之際。在阿根廷，良十四世還要面對阿根廷籍教宗方濟各（Pope Francis）的複雜遺產：方濟各在位 12 年從未返鄉。彭博（Bloomberg）的標題把此行定調為呼籲團結，而米萊對盧拉（Luiz Inácio Lula da Silva）在巴西勝選置之不理。\\n為什麼重要\\n判斷很直接：教宗在總統自己的國家，當面告訴他經濟政策必須向窮人交代。天主教會的社會正義主張，直接對上米萊的自由派路線，這次訪問就是看兩人能不能同台而不公開衝突。\\n來源異同\\nNPR、紐約時報、PBS 新聞一小時（PBS NewsHour）與彭博四家報導同一趟抵達，核心事實一致。信任標籤：N源一致——四家主流媒體對核心主張的報導一致。\\n仍不確定\\n摘要沒有教宗談話的確切用詞、米萊的回應，也沒有兩人會面的行程。引用細節前請查閱完整報導。\"},\"sources\":[{\"name\":\"NPR World\",\"url\":\"https://www.npr.org/2026/11/08/nx-s1-6033992/after-a-successful-trip-to-uruguay-pope-leo-heads-to-argentina\"},{\"name\":\"NYT World\",\"url\":\"https://www.nytimes.com/2026/11/08/world/americas/pope-leo-argentina-milei.html\"},{\"name\":\"PBS NewsHour\",\"url\":\"https://www.pbs.org/newshour/world/pope-arrives-in-argentina-and-tells-milei-that-people-not-the-economy-should-come-first\"},{\"name\":\"Bloomberg News\",\"url\":\"https://www.bloomberg.com/news/articles/2026-11-09/pope-in-argentina-leo-urges-unity-as-milei-ignores-lula-win-in-brazil\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":25,\"outletReputation\":21,\"crossCorroboration\":25,\"recencyClarity\":25},\"tags\":[\"international\",\"live-ingest\",\"npr-world\",\"nyt-world\",\"pbs-newshour\"],\"glossary\":[{\"term\":{\"en\":\"Pope Leo XIV\",\"zh-TW\":\"教宗良十四世\"},\"blurb\":{\"en\":\"Head of the Catholic Church, on a three-nation South American tour.\",\"zh-TW\":\"天主教會領袖，正在進行南美三國之行。\"}},{\"term\":{\"en\":\"Javier Milei\",\"zh-TW\":\"米萊\"},\"blurb\":{\"en\":\"President of Argentina, a libertarian leader at odds with the Church.\",\"zh-TW\":\"阿根廷總統，與天主教會關係緊張的自由派領袖。\"}},{\"term\":{\"en\":\"Pope Francis\",\"zh-TW\":\"教宗方濟各\"},\"blurb\":{\"en\":\"Argentine former pope who never returned home during his 12-year pontificate.\",\"zh-TW\":\"阿根廷籍前任教宗，在位 12 年從未返鄉。\"}},{\"term\":{\"en\":\"Luiz Inácio Lula da Silva\",\"zh-TW\":\"盧拉\"},\"blurb\":{\"en\":\"President of Brazil, whose election win Milei is said to be ignoring.\",\"zh-TW\":\"巴西總統，米萊被指對其勝選置之不理。\"}},{\"term\":{\"en\":\"Catholic Church\",\"zh-TW\":\"天主教會\"},\"blurb\":{\"en\":\"Church deeply committed to social justice, in tension with Milei's government.\",\"zh-TW\":\"堅定主張社會正義的天主教會，與米萊政府關係緊張。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-international-02-in-argentina-pope-leo-te/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-international-02-in-argentina-pope-leo-te/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"d:\"$8:me
