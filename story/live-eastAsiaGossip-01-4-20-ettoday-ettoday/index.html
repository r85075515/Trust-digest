0 — and opened up about why her relationship with actor Liu Shu-hung ended: she has an aversion to saliva.\nWhat happened\nYin Sheng and Liu Shu-hung, known as the \"dumpling-world Wang Leehom,\" were photographed arm-in-arm and watching a movie together in 2018, exposing the relationship. Liu's agent initially insisted they were just good friends and that a hand-holding photo was a trick of angle. The pair later went public, ran a joint channel called Long Yao Si Tu and filmed a shampoo advertisement together. Yin Sheng has now spoken about the split and her dating conditions, including the NT$200,000 monthly income requirement.\nWhy it matters\nThe takeaway is not the income figure itself but what it signals: a former child of the creator economy is publicly pricing her next relationship, and fans are reading the saliva detail as the real reason the old one ended. For readers, the story is worth a minute because it closes the loop on a public couple, not because the conditions are a checklist.\nSources agree / disagree\nETtoday and SETN report the same account — the four conditions, the NT$200,000 figure and the saliva detail — with no conflicting facts. Trust label: Two-source agreement — two outlets agree on the core claims.\nStill uncertain\nThe snippets do not list all four conditions in full, nor do they say when exactly the couple split. Those details require the full reporting on the linked publisher pages."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-eastAsiaGossip-01-4-20-ettoday-ettoday\",\"category\":\"eastAsiaGossip\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-eastAsiaGossip-01-4-20-ettoday-ettoday.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 茵聲開擇偶4條件「還要月收20萬」！　揭分手劉書宏內幕：有口水潔癖 - ETtoday星光雲| ETtoday新聞雲\",\"zh-TW\":\"相關封面圖：茵聲開擇偶4條件「還要月收20萬」！　揭分手劉書宏內幕：有口水潔癖 - ETtoday星光雲| ETtoday新聞雲\"},\"publishedAt\":\"2026-11-24T23:37:00.000Z\",\"title\":{\"en\":\"Yin Sheng Sets Four Conditions for a Partner, Opens Up About Split From Liu Shu-hung\",\"zh-TW\":\"茵聲開擇偶 4 條件「月收 20 萬」：揭與劉書宏分手內幕\"},\"summary\":{\"en\":\"Yin Sheng, a star who rose with the million-subscriber YouTube group This Group of People, has laid out four conditions for a future partner, including a monthly income of NT$200,000, and opened up about her split from actor Liu Shu-hung, saying her aversion to saliva played a part. The pair went public in 2018; her remarks have set fans talking.\",\"zh-TW\":\"百萬 YouTuber 團體「這群人」出身的女星鄭茵聲（茵聲）近日談擇偶條件，開出 4 項要求、其中一項是月收 20 萬，並首度細談與劉書宏分手內幕：她有口水潔癖。兩人 2018 年被拍到親密互動後認愛，還曾合開頻道《龍咬死兔》、合拍洗髮精廣告，如今各自發展；她的擇偶標準一出，立刻成為粉絲熱議話題。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"百萬 YouTuber 團體「這群人」出身的女星鄭茵聲（茵聲）近日談擇偶條件，開出 4 項要求、其中一項是月收 20 萬，並首度細談與劉書宏分手內幕：她有口水潔癖。\\n發生了什麼事\\n茵聲與有「餃界王力宏」之稱的劉書宏 2018 年被拍到摟腰、搭肩看電影，戀情就此曝光。當時劉書宏經紀人一度強調雙方只是「好朋友」，牽手也只是借位拍攝。兩人公開認愛後，還曾以情侶之姿合開頻道《龍咬死兔》，並接下洗髮精廣告放閃。茵聲如今談起擇偶條件，開出 4 項要求、其中一項是月收 20 萬，也談到分手與自己的口水潔癖有關。\\n為什麼重要\\n重點不在月收 20 萬這個數字本身，而在她公開為下一段感情開價——粉絲解讀口水潔癖才是舊情結束的真正原因。這則新聞值得看一分鐘，是因為它為一對公開情侶的故事畫下句點，而不是因為那 4 個條件值得照抄。\\n來源異同\\nETtoday 與三立新聞網報導一致——4 項條件、月收 20 萬、口水潔癖，片段中沒有事實衝突。信任標籤：2源一致——兩家媒體對核心事實說法一致。\\n仍不確定\\n片段未完整列出 4 項條件，也未說明兩人確切分手時間，須看各家完整報導才能確認。\"},\"sources\":[{\"name\":\"ETtoday 影劇\",\"url\":\"https://star.ettoday.net/news/3277976\"},{\"name\":\"setn.com\",\"url\":\"https://news.google.com/rss/articles/CBMiSkFVX3lxTE5wSnlGOWNnWUMxd2hONG54WlBZTDMwaTZyWGlTcWFxX3dLUWZSbkRYQUVTTlNIcUtNRmFjdnMxNWxfcElnZGd5R0VR?oc=5\"}],\"disagreements\":null,\"trustScore\":69,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":16,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"eastAsiaGossip\",\"live-ingest\",\"region:tw\",\"ettoday-影劇\",\"gnews-site:ettoday-分手/復合/婚\",\"gnews-site:setn-分手/婚\"],\"region\":\"tw\",\"glossary\":[{\"term\":{\"en\":\"Yin Sheng\",\"zh-TW\":\"茵聲\"},\"blurb\":{\"en\":\"Stage name of actress Zheng Yinsheng, formerly of This Group of People.\",\"zh-TW\":\"鄭茵聲的藝名，出身「這群人」。\"}},{\"term\":{\"en\":\"This Group of P
