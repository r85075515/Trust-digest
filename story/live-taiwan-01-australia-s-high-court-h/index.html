constitution allows. The hearing marks the first full judicial examination of a policy that has drawn global attention since its adoption.\n\nWhy it matters\nThe ruling will decide whether Australia can keep barring under-16s from social media in its current form. A decision upholding the ban would embolden similar proposals elsewhere, while a decision striking it down would force lawmakers back to narrower tools for protecting children online.\n\nSources agree / disagree\nBBC News and Al Jazeera agree on the core facts: the High Court is hearing a challenge, and the challengers argue the ban is unconstitutional. A third item in the same feed cluster, about a pharmaceutical pricing dispute, concerns a separate matter and is not part of this case.\n\nStill uncertain\nThe court has not yet ruled, and the feed material does not give the hearing schedule, the government's full defence, or the date of a decision. Those details remain to be confirmed from full court reporting.\n\nTrust label: Bundled stories"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-01-australia-s-high-court-h\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-taiwan-01-australia-s-high-court-h.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Australia’s High Court hears bid to overturn under-16s social media ban\",\"zh-TW\":\"相關封面圖：澳洲高等法院審理推翻 16 歲以下青少年社群媒體禁令的申請\"},\"publishedAt\":\"2026-11-03T07:53:38.000Z\",\"title\":{\"en\":\"Australia's High Court hears challenge to under-16s social media ban\",\"zh-TW\":\"澳洲高等法院審理 16 歲以下社群媒體禁令合憲性挑戰\"},\"summary\":{\"en\":\"Australia's High Court has begun hearing a challenge by Reddit and the Digital Freedom Project, which argue the under-16s social media ban is unconstitutional and denies children free communication. The ruling will test whether the world-leading restriction survives, and regulators and platforms worldwide will watch the outcome closely.\",\"zh-TW\":\"澳洲高等法院開始審理 Reddit 與數位自由計畫提出的挑戰，主張 16 歲以下社群媒體禁令違憲、剝奪兒童自由交流的權利。這項裁決將檢驗這項全球首創管制的合憲性，也會成為各國平台監管的參照，接下來看法院是否推翻禁令。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"澳洲高等法院開始審理 16 歲以下社群媒體禁令的挑戰，Reddit 與數位自由計畫主張這項政策違憲。這是全球首創管制的第一次重大司法檢驗，裁決結果可能影響各國如何規範兒童使用社群平台。\\n\\n發生了什麼事\\nReddit 的律師與數位自由計畫向高等法院主張，禁令剝奪兒童自由交流的權利。英國廣播公司（BBC）與半島電視台（Al Jazeera）的報導一致指出，這場審理是要推翻 16 歲以下禁令，挑戰方認為管制超出憲法容許範圍。\\n\\n為什麼重要\\n這項裁決將決定澳洲能否以現行形式繼續禁止 16 歲以下使用社群媒體。維持禁令會鼓勵其他國家跟進類似提案，推翻禁令則迫使立法者改用更精準的兒童線上保護工具。\\n\\n來源異同\\n英國廣播公司（BBC）與半島電視台（Al Jazeera）對核心事實一致：高等法院正在審理挑戰，挑戰方主張禁令違憲。同批資料中另有一則藥品定價爭議，與本案無關，最多一句帶過。\\n\\n仍不確定\\n法院尚未裁決，資料也沒有審理時程、政府完整抗辯或宣判日期，須以完整法庭報導確認。\"},\"sources\":[{\"name\":\"BBC News-Asia\",\"url\":\"https://www.bbc.co.uk/news/articles/ck79py02p1jlo?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"Al Jazeera\",\"url\":\"https://www.aljazeera.com/news/2026/11/3/australias-high-court-hears-bid-to-overturn-under-16s-social-media-ban?traffic_source=rss\"},{\"name\":\"ET Pharma\",\"url\":\"https://pharma.economictimes.indiatimes.com/news/pharma-industry/high-court-restrains-nppa-from-action-against-astrazeneca/135479963\"}],\"disagreements\":null,\"trustScore\":76,\"trustBreakdown\":{\"sourceDiversity\":19,\"outletReputation\":10,\"crossCorroboration\":22,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"bbc-news-asia\",\"al-jazeera\",\"et-pharma\"],\"glossary\":[{\"blurb\":{\"en\":\"Australia's highest court, which rules on constitutional questions.\",\"zh-TW\":\"澳洲最高法院，負責裁決憲法爭議。\"},\"term\":{\"en\":\"High Court of Australia\",\"zh-TW\":\"澳洲高等法院\"}},{\"blurb\":{\"en\":\"A social media platform and one of the challengers in this case.\",\"zh-TW\":\"社群平台，也是本案挑戰方之一。\"},\"term\":{\"en\":\"Reddit\",\"zh-TW\":\"Reddit\"}},{\"blurb\":{\"en\":\"A digital rights advocacy group challenging the ban.\",\"zh-TW\":\"主張數位權利的倡議組織，本案挑戰方之一。\"},\"term\":{\"en\":\"Digital Freedom Project\",\"zh-TW\":\"數位自由計畫\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-
