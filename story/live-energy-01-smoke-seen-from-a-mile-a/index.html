ddletown, Iowa.\nWhat happened\nA large cloud of smoke was seen in Middletown, Iowa, after the Army detonated the nation's entire stockpile of lead azide used for making bombs on Wednesday morning, despite an outpouring of public concern about potential health and environmental effects. The controlled blast took place at about 10 a.m. ET at the Iowa Army Ammunition Plant, to dispose of about 9,700 pounds of the material before it could detonate on its own. The Guardian, which reported the story, notes that a controlled blast to dispose of lead azide risks releasing plumes of toxic chemicals across a 100-mile radius. The feed text spells the town name as Middleton; the town is Middletown, Iowa, and this card uses the correct spelling.\nWhy it matters\nThe judgement is about a trade-off made in public: leaving the stockpile in place risked a spontaneous explosion, while destroying it risked a toxic plume over a wide area, and the Army chose the blast. Residents' concern is not abstract, since the plume warning covers a 100-mile radius, far beyond the mile from which the smoke was visible. For readers, the question is not whether the material is gone, it is what the disposal put into the air and whether anyone is measuring it.\nSources agree / disagree\nOnly The Guardian has reported this so far, in two items from its environment desk covering the same detonation, so there is no independent second outlet to check the account against. Trust label: Single source — one outlet only, so the account is unconfirmed pending corroboration.\nStill uncertain\nWhat was actually released in the plume, whether air or soil monitoring followed the blast, and what officials told residents beforehand are not in the feed snippets. The snippets also do not say how long the stockpile had been stored or why disposal happened now."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-energy-01-smoke-seen-from-a-mile-a\",\"category\":\"energy\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-energy-01-smoke-seen-from-a-mile-a.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Smoke seen from a mile away as army detonates US stockpile of bomb-making chemicals in Iowa\",\"zh-TW\":\"相關封面圖：當軍隊在愛荷華州引爆美國儲存的炸彈製造化學物質時，從一英里外就能看到煙霧\"},\"publishedAt\":\"2026-11-25T18:30:56.000Z\",\"title\":{\"en\":\"US Army Detonates Entire Lead Azide Stockpile in Iowa\",\"zh-TW\":\"美國陸軍在愛荷華州引爆全國疊氮化鉛庫存\"},\"summary\":{\"en\":\"The US Army detonated the nation's entire lead azide stockpile at the Iowa Army Ammunition Plant on Wednesday, sending smoke visible a mile away in Middletown, Iowa. About 9,700 pounds were destroyed despite public concern over a toxic plume. Takeaway: a disposal meant to remove a hazard left residents asking what was in the air.\",\"zh-TW\":\"美國陸軍週三上午在愛荷華州陸軍彈藥廠引爆全國全部疊氮化鉛庫存，這種製炸彈化學品產生的煙霧，在愛荷華州米德爾敦一英里外都看得見。這次受控引爆銷毀約9,700磅，儘管民眾擔心有毒煙羽擴散。重點：一次為消除危險而做的處置，留下附近居民對空氣中物質的疑問。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"美國陸軍週三上午在愛荷華州陸軍彈藥廠引爆全國全部疊氮化鉛庫存，這種製炸彈化學品產生的煙霧，在愛荷華州米德爾敦一英里外都看得見。\\n發生了什麼事\\n週三上午，儘管民眾對潛在健康與環境影響表達強烈擔憂，陸軍仍引爆全國全部用於製炸彈的疊氮化鉛庫存，愛荷華州米德爾敦冒出大片煙霧。這次受控引爆於美東時間上午10點左右在愛荷華州陸軍彈藥廠進行，目的是在約9,700磅化學品自行引爆之前將其銷毀。報導此事的《衛報》指出，處置疊氮化鉛的受控引爆，有可能在100英里半徑內釋放有毒化學物質煙羽。Feed 原文將地名拼為 Middleton，正確地名為 Middletown，本卡採用正確拼法。\\n為什麼重要\\n這裡的判斷在於一項公開做出的取捨：把庫存留在原地，有自行爆炸的風險；銷毀它，則有毒煙羽可能擴散到廣大區域，陸軍選擇了引爆。居民的擔憂並非空泛，因為煙羽警示範圍達100英里，遠超出看得見煙霧的一英里。對讀者來說，問題不是化學品是否已清除，而是處置過程把什麼東西放進空氣裡、有沒有人在監測。\\n來源異同\\n目前只有《衛報》一家報導，環境版的兩則內容談的是同一場引爆，無法以獨立的第二家媒體交叉核對。信任標籤：僅1源——只有一家媒體報導，內容未經證實，待其他來源佐證。\\n仍不確定\\n煙羽實際釋放了什麼物質、引爆後是否有空氣或土壤監測、官員事前如何告知居民，片段中都沒有。庫存存放了多久、為何現在才處置，片段中也沒有說明。\"},\"sources\":[{\"name\":\"The Guardian Environment\",\"url\":\"https://www.theguardian.com/us-news/video/2026/nov/25/cloud-of-smoke-seen-after-us-army-detonates-bomb-making-chemicals-in-iowa-video\"}],\"disagreements\":null,\"trustScore\":59,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"energy\",\"live-
