s.\" The company gave no further details on the circumstances or cause of death. Reed's last on-screen appearance came at Crown Jewel in Riyadh, Saudi Arabia on November 7, where he interfered in the World Tag Team Championship match between The Vision's Bron Breakker and Austin Theory and the team of Penta and Je'Von Evans; Oba Femi threw him off the stage and through two tables. Multiple outlets reported he suffered multiple broken ribs and a lacerated kidney, remained in Saudi Arabia for treatment after the rest of the roster flew home, and had returned to the United States by November 18. WWE's statement extended condolences to his pregnant wife Paige, their daughter, and his family, friends and co-workers.\n\nWhy it matters\nReed was an active, featured performer who had only returned in September from a long injury layoff, and a 38-year-old headliner's sudden death weeks after a high-profile table spot inevitably turns attention to wrestler safety and post-injury care on overseas shows. WWE has not linked the death to the Crown Jewel injury, and no cause has been disclosed.\n\nSource differences\nCNN, USA Today, Sports Illustrated and the Associated Press report the same core facts from WWE's announcement. Injury descriptions vary slightly: most reports describe broken ribs and a lacerated kidney, while Wrestling Observer reporting cited by Entertainment Weekly described broken ribs and a punctured lung. The AP wire dates the Crown Jewel appearance to November 6; most outlets date the Riyadh event to November 7.\n\nStill uncertain\nThe specific medical complications and cause of death have not been disclosed, and neither WWE nor any authority has stated whether the death was related to the Crown Jewel injury. Any connection remains speculation at this stage.\n\nTrust label: Multi-source agreement — WWE's official announcement and reporting by CNN, USA Today, Sports Illustrated and the Associated Press converge on the death, the age and the Crown Jewel injury timeline."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"adult\":false,\"body\":{\"en\":\"$10\",\"zh-TW\":\"發生了什麼事\\nWWE 於 11 月 27 日（週五）宣布，以擂台名布朗森・里德（Bronson Reed）聞名的傑梅因・哈利（Jermaine Haley）當天稍早逝世，享年 38 歲，死因為「醫療併發症」，公司未提供進一步細節。他最後一次公開露面是 11 月 7 日在沙烏地阿拉伯利雅德舉行的皇冠寶石大賽（Crown Jewel），他在世界雙打冠軍賽中亂入（所屬團體 The Vision 的布朗・布雷克（Bron Breakker）與奧斯汀・席奧瑞（Austin Theory）對上彭塔（Penta）與傑馮・伊凡斯（Je'Von Evans）），被歐巴・費米（Oba Femi）摔下舞台、穿透兩張桌子。多家媒體報導他多根肋骨骨折、腎臟撕裂傷，在其他選手返美後獨自留在沙國治療，11 月 18 日前已回到美國。WWE 聲明向他懷孕的妻子佩姬（Paige）、女兒與親友致哀。\\n\\n為什麼重要\\n里德是現役一線選手，今年 9 月才從長期傷停復出；38 歲的他在高調桌子摔技數週後驟逝，必然讓外界聚焦選手安全與海外賽事的傷後照護。但 WWE 並未把死訊與皇冠寶石大賽的受傷連結，死因也未公布，現階段任何因果推論都只是臆測。\\n\\n來源異同\\nCNN、今日美國報（USA Today）、運動畫刊（Sports Illustrated）與美聯社（Associated Press）的核心事實一致。傷勢描述略有出入：多數報導寫肋骨骨折加腎臟撕裂傷，娛樂週刊（Entertainment Weekly）引述摔角觀察家（Wrestling Observer）的說法則寫肋骨骨折加肺穿刺。美聯社把皇冠寶石露面日期寫為 11 月 6 日，多數媒體記為利雅德當地 11 月 7 日。\\n\\n仍不確定\\n「醫療併發症」的具體內容與確切死因尚未公布；WWE 與任何官方單位都未表示死訊與皇冠寶石大賽受傷有關。後續是否驗屍或公布死因、WWE 是否進一步說明傷後處置，仍待觀察。\"},\"category\":\"entertainment\",\"disagreements\":null,\"glossary\":[{\"blurb\":{\"en\":\"Australian WWE wrestler Jermaine Haley (1988–2026), a former NXT North American Champion known for his top-rope Tsunami splash.\",\"zh-TW\":\"澳洲籍 WWE 選手傑梅因・哈利（1988–2026），曾奪 NXT 北美冠軍，招牌技為繩圈頂端躍下的「海嘯飛撲」（Tsunami）。\"},\"term\":{\"en\":\"Bronson Reed\",\"zh-TW\":\"布朗森・里德（Bronson Reed）\"}},{\"blurb\":{\"en\":\"WWE's premium live event held in Riyadh, Saudi Arabia on November 7, 2026, where Reed was injured in a table spot.\",\"zh-TW\":\"WWE 於 2026 年 11 月 7 日在沙烏地阿拉伯利雅德舉行的大型付費賽事，里德在此被摔穿桌子受傷。\"},\"term\":{\"en\":\"Crown Jewel\",\"zh-TW\":\"皇冠寶石大賽（Crown Jewel）\"}},{\"blurb\":{\"en\":\"Nigerian-American WWE wrestler who threw Reed off the stage and through two tables during the Crown Jewel tag title match.\",\"zh-TW\":\"奈及利亞裔美籍 WWE 選手，在皇冠寶石雙打冠軍賽中把里德摔下舞台、穿透兩張桌子。\"},\"term\":{\"en\":\"Oba Femi\",\"zh-TW\":\"歐巴・費米（Oba Femi）\"}},{\"blurb\":{\"en\":\"The WWE faction Reed belonged to, alongside Bron Breakker and Austin Theory, managed by Paul Heyman.\",\"zh-TW\":\"里德所屬的 WWE 反派團體，成員包括布朗・布雷克與奧斯汀・席奧瑞，由保羅・海曼（Paul Heyman）領軍。\"},\"term\":{\"en\":\"The Vision\",\"zh-TW\":\"The Vision\"}}],\"id\":\"live-entertainment-03-bronson-reed-dies-at-38\",\"imageAlt\":{\"en\":\"\",\"zh-TW\":\"\"},\"imageUrl\":\"\",\"isHeadline\":true,\"isPopular\":true,\"publishedAt\":\"2026-11-28T05:38:50.000Z\",\"sources\":[{\"name\":\"CNN\",\"url\":\"https://www.cnn.com/2026/11/27/sport/bronson-reed-wwe-dies?cid=external-feeds_iluminar_meta\"},{\"name\":\"Associated Press (via theScore)\",\"url\":\"https://www.thescore.com/wwe/news/3668467\"},{\"name\":\"USA Today\",\"url\":\"https://www.usatoday.com/story/sports/2026/11/27/bronson-reed-dead-wwe-star/92986594007/\"},{\"name\":\"Sports Illustrated\",\"url\":\"https://www.si.com/fannation/wrestling/wwe/wwe-star-bronson-reed-dead-at-the-age-of-38\"}],\"summary\":{\"en\":\"WWE announced that Bronson Reed (Jermaine Haley) died on November 27 at 38 due to \\\"medical complications,\\\" weeks after a Crown Jewel table spot in Riyadh reportedly left him with broken ribs and a lacerated kidney. WWE gave no further details and has not linked the death to the injury, so the cause remains undisclosed.\",\"zh-TW\":\"WWE 明星布朗森・里德（Bronson Reed，本名傑梅因・哈利 Jermaine Haley）11 月 27 日逝世，享年 38 歲，公司稱死因為「醫療併發症」。他三週前在沙國皇冠寶石大賽被摔穿桌子，據報肋骨骨折、腎臟撕裂並滯留當地治療；WWE 未公布死因細節、也未把兩事連結，確切死因仍不明。\"},\"tags\":[],\"title\":{\"en\":\"WWE star Bronson Reed dies at 38 weeks after Crown Jewel injury\",\"zh-TW\":\"WWE 明星布朗森・里德（Bronson Reed）38 歲驟逝，皇冠寶石受傷三週後死於「醫療併發症」\"},\"trustBreakdown\":{\"crossCorroboration\":30,\"outletReputation\":25,\"recencyClarity\":20,\"sourceDiversity\":15},\"trustScore\":90}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified ne
