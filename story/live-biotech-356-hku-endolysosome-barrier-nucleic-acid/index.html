.min.js\",\"data-cf-beacon\":\"{\\\"token\\\":\\\"515a1416d3c44f5890357f123012d78\\\"}\"}]]}]}]]}],{\"children\":[\"story\",[\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$L2\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L3\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"id\",\"live-biotech-356-hku-endolysosome-barrier-nucleic-acid\",\"d\"],[\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$L2\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L3\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[\"__PAGE__\",[\"$\",\"$1\",\"c\",{\"children\":[\"$L4\",null,[\"$\",\"$L5\",null,{\"children\":[\"$L6\",[\"$\",\"$L7\",null,{\"promise\":\"$@8\"}]]}]]}],{},null,false]},null,false]},null,false]},null,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[[\"$\",\"$L9\",null,{\"children\":\"$La\"}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]],[\"$\",\"$Lb\",null,{\"children\":[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$c\",null,{\"fallback\":null,\"children\":\"$Ld\"}]}]}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$e\",[]],\"s\":false,\"S\":true}\n"])</script><script>self.__next_f.push([1,"f:I[8587,[\"619\",\"static/chunks/619-ba102abea3e3d0e4.js\",\"878\",\"static/chunks/878-0c20ab7a9498be78.js\",\"954\",\"static/chunks/app/story/%5Bid%5D/page-9448c1a7c74df37f.js\"],\"default\"]\n10:T6e7,"])</script><script>self.__next_f.push([1,"What happened\nA research team led by Haibo Jiang in the Department of Chemistry at The University of Hong Kong, with first author Xu Li, published findings in Nature Cell Biology showing that when endolysosomes are damaged, proteins inside the lumen rapidly form dense condensates. These condensates trap nucleic acid medicines such as antisense oligonucleotides so they remain confined even after membrane disruption rather than escaping into the cytosol, under DOI 10.1038/s41556-026-02119-z.\n\nWhy it matters\nMany nucleic acid therapeutics struggle to achieve full intracellular efficacy because only a small fraction escapes endolysosomal compartments to reach targets inside cells. Identifying this intraluminal protein condensate barrier clarifies a previously overlooked bottleneck in intracellular drug delivery.\n\nSource differences\nThe University of Hong Kong publishes \"HKU Chemists Discover a Hidden Barrier that Prevents Nucleic Acid Medicines from Reaching Their Targets Inside Cells\", Phys.org publishes \"Newly discovered barrier could explain why nucleic acid medicines remain trapped inside cells\", and PubMed indexes \"Endolysosomal damage promotes intraluminal protein condensate formation that limits cytosolic leakage\". The University of Hong Kong and Phys.org share the same institutional release chain, while PubMed serves as the abstract index record.\n\nStill uncertain\nFurther studies are needed to determine how different chemical modifications or delivery carriers can bypass or prevent intraluminal protein condensate formation across diverse cell types and therapeutic payloads in vivo.\n\nTrust label: Single source — The University of Hong Kong and Phys.org reflect the same institutional release chain alongside the PubMed abstract record."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-biotech-356-hku-endolysosome-barrier-nucleic-acid\",\"category\":\"biotech\",\"title\":{\"en\":\"HKU Chemists Discover a Hidden Barrier that Prevents Nucleic Acid Medicines from Reaching Their Targets Inside Cells\",\"zh-TW\":\"港大化學團隊發現阻礙核酸藥物抵達細胞標靶的隱藏屏障\"},\"summary\":{\"en\":\"Researchers led by Haibo Jiang at The University of Hong Kong found in Nature Cell Biology that damaged endolysosomes form dense intraluminal protein condensates trapping nucleic acid medicines, explaining why many therapies fail to reach cellular targets.\",\"zh-TW\":\"香港大學江海波團隊於《Nature Cell Biology》發表研究指出，內溶酶體受損時腔內蛋白會形成緻密凝聚體，將核酸藥物困在其中而難以釋放至細胞質。此發現為核酸藥物遞送效率受限提供關鍵機制解釋，有助優化藥物設計。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n香港大學化學系江海波（Haibo Jiang）帶領的研究團隊與第一作者李旭（Xu Li），在期刊《Nature Cell Biology》發表研究（論文 DOI：10.1038/s41556-026-02119-z），顯示當內溶酶體（endolysosome）受損時，腔內蛋白質會迅速形成緻密凝聚體（condensate）。這些凝聚體會將反義寡核苷酸（ASO）等核酸藥物困在其中，使其即使在膜破裂後仍滯留於腔內，無法逃逸進入細胞質。\\n\\n「為什麼重要」\\n許多核酸療法在細胞內難以發揮完整療效，原因在於僅有極少比例藥物能脫離內溶酶體區室抵達細胞標靶。確認這道腔內蛋白質凝聚體屏障，釐清了過去在細胞內藥物遞送過程中受到忽略的關鍵瓶頸。\\n\\n「來源異同」\\nThe University of Hong Kong 發布「HKU Chemists Discover a Hidden Barrier that Prevents Nucleic Acid Medicines from Reaching Their Targets Inside Cells」，Phys.org 發布「Newly discovered barrier could explain why nucleic acid medicines remain trapped inside cells」，而 PubMed 則索引「Endolysosomal damage promotes intraluminal protein condensate formation that limits cytosolic leakage」。The University of Hong Kong 與 Phys.org 同屬同一機構新聞稿鏈，PubMed 則為論文摘要索引紀錄。\\n\\n「仍不確定」\\n不同的化學修飾或遞送載體如何在體內環境跨越或避免不同細胞類型與治療載荷中的腔內蛋白質凝聚體形成，仍有待進一步研究確認。\\n\\nTrust label: Single source — The University of Hong Kong 與 Phys.org 反映同一機構新聞稿鏈，並搭配 PubMed 摘要紀錄。\"},\"glossary\":[{\"term\":{\"en\":\"Endolysosome\",\"zh-TW\":\"內溶酶體（Endolysosome）\"},\"blurb\":{\"en\":\"A membrane-bound cellular organelle involved in sorting, trafficking, and degradation of internalized molecules.\",\"zh-TW\":\"細胞內負責物質分選、運輸與降解的膜狀胞器。\"}},{\"term\":{\"en\":\"Protein Condensate\",\"zh-TW\":\"蛋白質凝聚體（Protein Condensate）\"},\"blurb\":{\"en\":\"A dense, concentrated assembly of proteins that forms within cellular compartments and can sequester molecules.\",\"zh-TW\":\"在胞器或細胞內部聚集形成的緻密蛋白質集合體，可能包覆並滯留其他分子。\"}},{\"term\":{\"en\":\"Antisense Oligonucleotide (ASO)\",\"zh-TW\":\"反義寡核苷酸（ASO）\"},\"blurb\":{\"en\":\"A short synthetic strand of nucleic acids designed to bind specific RNA sequences and modulate gene expression.\",\"zh-TW\":\"能與特定 RNA 序列結合以調控基因表現的短鏈合成核酸分子。\"}}],\"sources\":[{\"name\":\"The University of Hong Kong\",\"url\":\"https://fde-hkunews-prod-ane7c9dag3h4a2de.a01.azurefd.net/en/article/2026/11/hku-chemists-discover-a-hidden-barrier-that-prevents-nucleic-acid-medicines-from-reaching-their-targets-inside-cells/\"},{\"name\":\"Phys.org\",\"url\":\"https://phys.org/news/2026-11-newly-barrier-nucleic-acid-medicines.html\"},{\"name\":\"PubMed\",\"url\":\"https://pubmed.ncbi.nlm.nih.gov/43064811/\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"HKU Chemists Discover a Hidden Barrier that Prevents Nucleic Acid Medicines from Reaching Their Targets Inside Cells\",\"zh-TW\":\"港大化學團隊發現阻礙核酸藥物抵達細胞標靶的隱藏屏障\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":74,\"trustBreakdown\":{\"crossCorroboration\":17,\"outletReputation\":23,\"recencyClarity\":21,\"sourceDiversity\":13},\"publishedAt\":\"2026-11-28T04:30:51.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":21,\"D2\":20,\"D3\":21,\"D4\":18,\"D5\":19,\"total\":20},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-biotech-356-hku-endolysosome-barrier-nucleic-acid/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:descripti
