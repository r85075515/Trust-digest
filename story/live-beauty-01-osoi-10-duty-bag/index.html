g, a design built around a layered, stacked aesthetic, alongside the grand opening of a new flagship store in Hannam-dong, Seoul. The same Vogue Taiwan feed also carries a second anniversary story: Cartier's Women's Initiative program, which supports women entrepreneurs tackling social and environmental challenges, has reached its 20th year. Cartier Taiwan managing director Josephine Chien is quoted saying the company believes in the value of creativity and the courage to turn ideas into reality.\nWhy it matters\nThe judgment is simple: two milestone anniversaries landing in one feed make this a double celebration for fashion and jewelry, and the Hannam-dong opening gives OSOI a physical home for its next decade.\nSources agree / disagree\nBoth items come from Vogue Taiwan alone, so there is no independent corroboration. The 20 and the 10 are not a conflict: 20 years belongs to Cartier's program and 10 years to OSOI. Trust label: Bundled stories — two separate anniversary items in one feed cluster.\nStill uncertain\nThe snippets give no prices, no Duty Bag release date, and no details of the flagship's opening events. Treat the anniversary claims as reported by Vogue Taiwan until further coverage appears."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-beauty-01-osoi-10-duty-bag\",\"category\":\"beauty\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-beauty-01-osoi-10-duty-bag.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 韓國人氣品牌OSOI邁入10週年！全新「Duty Bag」疊加美學登場，同步首爾漢南洞旗艦店盛大揭幕\",\"zh-TW\":\"相關封面圖：韓國人氣品牌OSOI邁入10週年！全新「Duty Bag」疊加美學登場，同步首爾漢南洞旗艦店盛大揭幕\"},\"publishedAt\":\"2026-11-10T11:03:58.000Z\",\"title\":{\"en\":\"OSOI Marks 10th Anniversary with Duty Bag and Hannam-dong Flagship Opening\",\"zh-TW\":\"韓國品牌 OSOI 迎 10 週年，推 Duty Bag 並開幕漢南洞旗艦店\"},\"summary\":{\"en\":\"Korean brand OSOI turns 10 with a new Duty Bag built on layered styling and a flagship store opening in Seoul's Hannam-dong. The same Vogue Taiwan feed also marks Cartier's Women's Initiative at 20 years; the takeaway is a double anniversary week for fashion and jewelry.\",\"zh-TW\":\"［未證實·單一來源］韓國人氣品牌 OSOI 迎接 10 週年，推出全新 Duty Bag、主打疊加美學，並在首爾漢南洞開設旗艦店。同批另有卡地亞靈思湧動女性創業家計畫 20 週年；結論是時尚與珠寶同週迎來雙週年。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"韓國人氣品牌 OSOI 迎接 10 週年，推出全新 Duty Bag、主打疊加美學，並在首爾漢南洞開設旗艦店。\\n發生了什麼事\\n依台灣版《Vogue》報導，OSOI 歡慶 10 週年，帶來全新包款 Duty Bag，並在首爾漢南洞開設全新旗艦門市。同一批來源另有一則週年新聞：卡地亞靈思湧動女性創業家計畫邁入 20 週年，該計畫支持女性創業家以事業回應社會與環境挑戰。卡地亞台灣董事總經理 Josephine Chien 表示，公司相信創意的價值，也珍視將想法付諸實現的勇氣。\\n為什麼重要\\n判斷很簡單：兩則週年里程碑撞在同一批來源，是時尚與珠寶的雙重慶祝；漢南洞旗艦店則給了 OSOI 下一個十年的實體據點。\\n來源異同\\n兩則都只出自台灣版《Vogue》，缺乏獨立查證。20 與 10 不是數字衝突：20 週年屬於卡地亞的計畫，10 週年屬於 OSOI。信任標籤：多則合併——同一批來源裡的兩則獨立週年新聞。\\n仍不確定\\n來源摘要沒給 Duty Bag 售價、發售日期，也沒寫旗艦店開幕活動細節。在更多報導出現前，週年說法請以台灣版《Vogue》的報導為準。\"},\"sources\":[{\"name\":\"Vogue Taiwan\",\"url\":\"https://www.vogue.com.tw/article/cartier-womens-initiative-women-lighting-the-path-20anniversary\"}],\"disagreements\":null,\"trustScore\":47,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":10,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"beauty\",\"live-ingest\",\"vogue-taiwan\",\"vogue-taiwan\"],\"glossary\":[{\"term\":{\"en\":\"OSOI\",\"zh-TW\":\"OSOI\"},\"blurb\":{\"en\":\"Korean fashion brand celebrating its 10th anniversary.\",\"zh-TW\":\"迎接 10 週年的韓國人氣品牌。\"}},{\"term\":{\"en\":\"Duty Bag\",\"zh-TW\":\"Duty Bag\"},\"blurb\":{\"en\":\"OSOI's new bag, designed around a layered, stacked aesthetic.\",\"zh-TW\":\"OSOI 全新包款，主打疊加美學。\"}},{\"term\":{\"en\":\"Hannam-dong\",\"zh-TW\":\"漢南洞\"},\"blurb\":{\"en\":\"Seoul district where OSOI's new flagship store opened.\",\"zh-TW\":\"OSOI 全新旗艦店所在的韓國首爾地區。\"}},{\"term\":{\"en\":\"Cartier\",\"zh-TW\":\"卡地亞\"},\"blurb\":{\"en\":\"Luxury jewelry house behind the Women's Initiative program.\",\"zh-TW\":\"靈思湧動女性創業家計畫背後的珠寶品牌。\"}},{\"term\":{\"en\":\"Cartier Women's Initiative\",\"zh-TW\":\"卡地亞靈思湧動女性創業家計畫\"},\"blurb\":{\"en\":\"Cartier program supporting women entrepren
