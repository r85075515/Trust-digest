mbed all day — 3, then 6, then 10 — and President Recep Tayyip Erdoğan, speaking after a cabinet meeting, confirmed 16 dead and 13 injured, two of them critically, promising that judicial and administrative investigations would establish how it happened and whether negligence was involved. Health Minister Kemal Memişoğlu later announced that one of the critically injured had died, taking the toll to 17; the BBC reported 12 others injured, and the governor said some people were still believed to be under the rubble as rescue work continued. The Menemen Chief Public Prosecutor's Office assigned four prosecutors and a forensic team; Turkish media reported between five and seven people detained in the investigation. The plant, established in 1987, produces about 4.5 million tonnes of steel a year.\nWhy it matters\nThe question is no longer only why a crane fell. The Evrensel daily reported that at least 11 workers had already lost their lives at this factory over the past decade before Monday, and a labour-rights monitor says two more died in accidents there within the past two weeks. With detentions under way and the president personally promising answers on negligence, the investigation's scope — one maintenance job, or the plant's safety record — is now the story. Workers have called a protest in Aliağa for Tuesday evening.\nSources agree / disagree\nAFP, Reuters, TASS and the BBC align on the updated toll of 17 and the investigation; the sequence matters — Erdoğan's 16 was an earlier same-day figure, superseded by the health minister's announcement. Outlets differ on the number detained (five per DHA reports cited by BBC Türkçe, up to seven per Hürriyet) and on the injured count (12 in the latest BBC reporting, 13 in Erdoğan's earlier statement). Trust label: Multi-source agreement — wire services and Turkish officials align on the core facts; detention and injury counts are still moving.\nStill uncertain\nRescue teams were still searching the wreckage and officials have not ruled out further deaths; the dead have not been publicly identified. The precise failure — crane, gas line, maintenance procedure — and whether safety rules were breached remain under investigation, and detention counts differ between outlets."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-02-izmir-steel-plant-blast\",\"category\":\"international\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"Rescue vehicles at the HABAŞ steel plant in Aliağa, İzmir, after an explosion that has now killed 17 workers.\",\"zh-TW\":\"伊茲密爾 HABAŞ 鋼鐵廠爆炸後，救援車輛在場搜救，死亡人數已升至 17 人。\"},\"publishedAt\":\"2026-11-09T16:29:22.000Z\",\"title\":{\"en\":\"İzmir Steel Plant Blast Death Toll Rises to 17; Workers Detained in Probe\",\"zh-TW\":\"土耳其伊茲密爾鋼廠爆炸死亡升至 17 人，檢方拘留多人調查\"},\"summary\":{\"en\":\"The death toll from Monday's explosion at the HABAŞ steel plant in Aliağa, İzmir, has risen to 17, after Turkey's health minister announced a critically injured worker had died; President Erdoğan had earlier confirmed 16 dead. An overhead crane collapsed into an electric arc furnace during maintenance, and prosecutors have detained several people while four prosecutors investigate. The toll has now been revised upward five times since the blast.\",\"zh-TW\":\"土耳其伊茲密爾（İzmir）HABAŞ 鋼鐵廠週一爆炸的死亡人數升至 17 人：衛生部長宣布一名重傷工人不治，此前總統艾爾多安（Recep Tayyip Erdoğan）才確認 16 死。事故是維修期間天車墜入電弧爐引發，檢方已拘留多人、指派 4 名檢察官調查。死亡數字自爆炸以來已五度上修，這座廠過去十年另有至少 11 名工人死於工安事故，調查若只查設備故障，交代不過去。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"土耳其伊茲密爾（İzmir）阿利阿加（Aliağa）HABAŞ 鋼鐵廠爆炸的死亡人數已升至 17 人：衛生部長表示一名重傷工人不治，BBC 引述官方說法報導。\\n發生了什麼事\\n爆炸發生在當地時間週一上午 11:46，當時廠內正在進行維修作業。伊茲密爾省長埃爾班（Süleyman Elban）表示，一台天車（橋式起重機）墜入電弧爐並損壞瓦斯管線，引發爆炸與火災；公司說法是事故發生在電弧爐的計畫性維修期間。確認死亡人數一路上修——3 人、6 人、10 人——總統艾爾多安（Recep Tayyip Erdoğan）在內閣會議後確認 16 人死亡、13 人受傷（其中 2 人危急），並承諾司法與行政調查會查明事故原因與是否涉及疏失。衛生部長梅米什奧盧（Kemal Memişoğlu）隨後宣布一名重傷者不治，死亡升至 17 人；BBC 報導另有 12 人受傷，省長表示相信仍有人受困瓦礫下，搜救持續中。梅內門（Menemen）首席檢察官辦公室已指派 4 名檢察官與法醫團隊調查；土耳其媒體報導已有 5 至 7 人遭拘留。這座鋼廠 1987 年設立，年產鋼約 450 萬噸。\\n為什麼重要\\n問題已經不只是天車為什麼掉下來。《Evrensel》日報指出，這座廠在週一之前、過去十年已有至少 11 名工人死於工安事故；勞工權益監測團體也說，過去兩週內同廠另有兩名工人死於事故。如今檢方拘留多人、總統親自承諾追究疏失，調查的範圍——只查這一次維修，還是查整座廠的工安紀錄——才是接下來的重點。當地工人已號召週二晚間在阿利阿加抗議。\\n來源異同\\n法新社（AFP）、路透社（Reuters）、塔斯社（TASS）與 BBC 對 17 死與調查進展說法一致；要注意時序：艾爾多安的 16 死是同日較早的數字，已被衛生部長的更新取代。分歧在拘留人數（BBC 土耳其語引 DHA 說 5 人、《自由報》（Hürriyet）說 7 人）與受傷人數（BBC 最新報導 12 人、艾爾多安稍早說法 13 人）。信任標籤：多源一致，通訊社與土耳其官方對核心事實對齊；拘留與受傷人數仍在變動。\\n仍不確定\\n搜救仍在進行，官方未排除死亡人數再上升；罹難者身分尚未公布。天車、瓦斯管線與維修程序究竟哪一環出錯、是否違反安全規範，都還在調查中；拘留人數各家報導不一。\"},\"sources\":[{\"name\":\"Associated Press\",\"url\":\"https://accessnorthga.com/ap_article/explosion-at-steel-plant-in-western-turkey-leaves-6-dead-and-8-missing\"},{\"name\":\"The Sun (AFP)\",\"url\":\"https://www.the-sun.com/news/17278828/steel-plant-explosion-turkey-kills-ten/\"},{\"name\":\"DW (via Briefly)\",\"url\":\"https://briefly.co/anchor/Europe_news/story/turkey-workers-killed-in-izmir-steel-plant-blast\"},{\"name\":\"Fact.net.in\",\"url\":\"https://www.fact.net.in/world/at-least-10-killed-15-injured-in-blast-at-steel-plant-in-turkiye-4-workers-missing\"},{\"name\":\"BBC News / Anadolu (via Today News Brief)\",\"url\":\"https://todaynewsbrief.com/article/world-turkey-habas-aliaga-izmir-steel-plant-explosion\"},{\"name\":\"Wire reports (via 7globe)\",\"url\":\"https://www.7globe.in/deadly-explosion-at-turkey-steel-factory-kills-17-workers-injures-12-others/\"}],\"disagreements\":null,\"trustScore\":76,\"trustBreakdown\":{\"sourceDiversity\":18,\"outletReputation\":18,\"crossCorroboration\":20,\"recencyClarity\":20},\"tags\":[\"international\",\"live-ingest\",\"breaking\",\"ap\",\"turkey\"],\"glossary\":[{\"term\":{\"en\":\"HABAŞ\",\"zh-TW\":\"HABAŞ 鋼鐵\"},\"blurb\":{\"en\":\"Turkish iron and steel producer founded in 1987, with annual capacity of about 4.5 million tonnes.\",\"zh-TW\":\"土耳其鋼鐵廠，1987 年設立，年產能約 450 萬噸，本次爆炸的工廠。\"}},{\"term\":{\"en\":\"Aliağa\",\"zh-TW\":\"阿利阿加（Aliağa）\"},\"blurb\":{\"en\":\"Port district in İzmir province hosting heavy industry, including the HABAŞ plant.\",\"zh-TW\":\"伊茲密爾省的港區工業區，HABAŞ 鋼廠所在地。\"}},{\"term\":{\"en\":\"Electric arc furnace\",\"zh-TW\":\"電弧爐\"},\"blurb\":{\"en\":\"A furnace that melts steel using electric arcs; the crane fell into one during casting.\",\"zh-TW\":\"以電弧熔煉鋼鐵的爐體，本次事故中天車墜入的設備。\"}},{\"term\":{\"en\":\"Overhead crane\",\"zh-TW\":\"天車（橋式起重機）\"},\"blurb\":{\"en\":\"A bridge crane running on rails above the plant floor; officials say it toppled into the furnace.\",\"zh-TW\":\"在廠房上方軌道移動的橋式起重機，官方說法是它墜入電弧爐引發爆炸。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-international-02-izmir-steel-plant-blast/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-international-02-izmir-steel-plant-blast/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}]],\"error\":null,\
