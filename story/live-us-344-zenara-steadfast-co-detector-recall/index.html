1 Plug-in Steadfast Haven carbon monoxide (CO) and natural gas detectors, models KH158 and GC03 (Recall No. 27-109). Sold online at truststeadfast.com between February and September 2026 for 48 to 70 USD, the units can fail to sound an alarm when hazardous carbon monoxide levels are present, following one reported failure without injury.\n\nWhy it matters\nCarbon monoxide is an odorless, colorless gas that causes acute poisoning, loss of consciousness, or death, especially during winter heating months when home furnaces and gas appliances run continuously. Because consumers rely on plug-in detectors as a primary life-safety warning, CPSC instructs owners to keep using the current unit until a free replacement arrives, then mark \"RECALLED\" with initials, upload photo proof for registration, and dispose of the defective detector.\n\nSource differences\nThe CPSC official release \"Zenara Recalls 4-in-1 Plug in Steadfast Haven Carbon Monoxide (CO) and Natural Gas Detectors Due to Risk of Serious Injury or Death from Failure to Alert Consumers to Hazardous Levels of Gas and CO\" sets out the exact recall count (about 210,410), model numbers (KH158 and GC03), recall number (27-109), retailer details, and replacement registration procedure. KTVU FOX 2's \"200K carbon monoxide detectors recalled over risk of serious injury\", FOX 13 Tampa Bay's \"200K carbon monoxide detectors recalled over risk of serious injury\", and WPXI's \"Recall alert: Carbon Monoxide, natural gas detectors recalled - WPXI\" accurately relay the CPSC notice while rounding the unit figure to \"more than 210,000\" in body text and \"200K\" in headlines.\n\nStill uncertain\nWhether independent laboratory testing identified a specific sensor or firmware defect behind the alarm failure, and how many units have already been registered for replacement.\n\nTrust label: Official confirmation — Confirmed directly via the U.S. CPSC recall notice and corroborated by KTVU FOX 2, FOX 13 Tampa Bay, and WPXI."])</script><script>self.__next_f.push([1,"11:T730,"])</script><script>self.__next_f.push([1,"「發生了什麼事」\n美國消費品安全委員會（CPSC）發布召回公告（編號27-109），懷俄明州Zenara Commerce LLC召回約210,410台Steadfast Haven四合一插電式一氧化碳（CO）與天然氣警報器，涵蓋型號KH158與GC03。該批產品於2026年2月至9月間透過truststeadfast.com線上販售，售價48至70美元，因接獲一氧化碳外洩時未能鳴響警報的通報（尚無傷亡報告），恐導致嚴重傷害或死亡風險。\n\n「為什麼重要」\n一氧化碳無色無味，冬季居家暖氣與燃氣設備頻繁運轉期間更是中毒高風險期，警報器失靈將使住戶失去關鍵逃生預警。CPSC提醒消費者在收到免費替換品前應繼續插電使用原設備，待註冊確認並用奇異筆寫上「RECALLED」與姓名縮寫拍照上傳後再予丟棄。\n\n「來源異同」\n美國CPSC官方公告「Zenara Recalls 4-in-1 Plug in Steadfast Haven Carbon Monoxide (CO) and Natural Gas Detectors Due to Risk of Serious Injury or Death from Failure to Alert Consumers to Hazardous Levels of Gas and CO」詳列約210,410台數量、KH158與GC03型號、召回編號27-109及註冊更換流程。KTVU FOX 2報導「200K carbon monoxide detectors recalled over risk of serious injury」、FOX 13 Tampa Bay「200K carbon monoxide detectors recalled over risk of serious injury」及WPXI「Recall alert: Carbon Monoxide, natural gas detectors recalled - WPXI」均轉述CPSC公告，標題簡稱為200K、內文則載明逾21萬台。\n\n「仍不確定」\n導致警報器在偵測到一氧化碳外洩時未能鳴響的具體感測器或韌體缺陷原因，以及目前已申請更換的數量，官方尚未進一步說明。\n\nTrust label: Official confirmation — 依據美國CPSC官方召回公告核實，並由KTVU FOX 2、FOX 13 Tampa Bay及WPXI報導佐證。"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-us-344-zenara-steadfast-co-detector-recall\",\"category\":\"us\",\"title\":{\"en\":\"CPSC Recalls 210,410 Steadfast Haven Carbon Monoxide Detectors Over Alarm Failure Risk\",\"zh-TW\":\"偵測一氧化碳恐失靈 美CPSC召回逾21萬台Steadfast Haven警報器\"},\"summary\":{\"en\":\"The U.S. Consumer Product Safety Commission announced a recall of about 210,410 plug-in Steadfast Haven 4-in-1 carbon monoxide and natural gas detectors by Zenara Commerce after a report that the unit failed to sound an alarm during a leak, offering free replacements.\",\"zh-TW\":\"美國消費品安全委員會（CPSC）宣布召回約210,410台Zenara Commerce販售的Steadfast Haven四合一插電式一氧化碳與天然氣警報器（型號KH158與GC03）。主因接獲一氧化碳外洩時未發出警報的通報，恐致嚴重傷亡，業者將提供免費更換。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"$11\"},\"glossary\":[{\"term\":{\"en\":\"Carbon monoxid
