esponse to the climate crisis means 'the world we know is over,' while the UN chief called for a windfall tax on oil and gas firms. At the centre of debate in Antalya is whether the global community can bring itself to name fossil fuels as the cause of the climate emergency. Related coverage also notes the Albanese government's longstanding bid to host a major UN climate summit in Adelaide.\nWhy it matters\nThe casualty figures grow heavier each year, so COP31 will be judged not by how many meetings it holds but by whether nations dare to name fossil fuels in their conclusions. For low-lying island nations such as the Marshall Islands, every word on the negotiating table bears on national survival.\nSources agree / disagree\nGrist and the Guardian agree on the summit's opening, the disaster figures and Heine's warning, while the Guardian's Adam Morton analysis focuses on the task facing Bowen. The figures are not in conflict: more than 50,000 deaths refer to Europe's heat waves and more than 1,500 to Nepal's floods, so they describe different disasters. Trust label: Two-source agreement — two outlets align on the summit and the disaster toll.\nStill uncertain\nFeed snippets capture headlines and short descriptions, not the full articles. The progress of negotiations, national emissions pledges and the outcome of Australia's bid to host a summit still await fuller reporting."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-energy-01-chris-bowen-faces-a-tita\",\"category\":\"energy\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-energy-01-chris-bowen-faces-a-tita.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Bowen Faces Titanic Task as World Leaders Gather for COP31 in Antalya\",\"zh-TW\":\"相關封面圖：COP31 在土耳其登場：鮑文面臨艱鉅任務\"},\"publishedAt\":\"2026-11-11T18:52:08.000Z\",\"title\":{\"en\":\"Bowen Faces Titanic Task as World Leaders Gather for COP31 in Antalya\",\"zh-TW\":\"COP31 在土耳其登場：鮑文面臨艱鉅任務\"},\"summary\":{\"en\":\"Leaders gather Monday in Antalya, Turkey, for the UN's COP31 climate summit after another year of deadly disasters, including heat waves that killed more than 50,000 people in Europe. Marshall Islands President Hilda Heine warns that without an overwhelming response, 'the world we know is over.' Watch whether nations name fossil fuels as the cause of the climate emergency.\",\"zh-TW\":\"聯合國第31屆氣候大會週一在土耳其安塔利亞登場，全球領袖在又一年致命氣候災難後齊聚一堂：歐洲熱浪奪走逾5萬條人命，尼泊爾冰川洪水造成逾1,500人死亡。馬紹爾群島總統希爾達·海涅警告，若無壓倒性應對，「我們所知的世界就結束了」。接下來要看各國能否在會中點名化石燃料是氣候緊急狀態的成因。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"聯合國第31屆氣候大會週一在土耳其安塔利亞登場，全球領袖在又一年致命氣候災難後齊聚一堂，澳洲的克里斯·鮑文面臨艱鉅任務。\\n發生了什麼事\\n世界領袖週一齊聚土耳其安塔利亞，出席聯合國第31屆締約方大會（COP31）。過去一年，加拿大、印尼與巴西的森林大火影響數百萬人，歐洲熱浪奪走逾5萬條人命，尼泊爾冰川融化引發的洪水造成逾1,500人死亡。馬紹爾群島總統希爾達·海涅在峰會上警告，若未能對氣候危機作出壓倒性回應，「我們所知的世界就結束了」；聯合國秘書長則呼籲對石油與天然氣公司課徵暴利稅。會中辯論的焦點，是國際社會能否將化石燃料指認為氣候緊急狀態的成因。同批報導還提到，澳洲艾班尼斯政府長期爭取在阿德萊德主辦聯合國大型氣候峰會。\\n為什麼重要\\n災難數字一年比一年沉重，COP31 的成敗不在開了多少會，而在各國敢不敢在結論中點名化石燃料。對馬紹爾群島這類低窪島國而言，談判桌上的每個字都關係到國家存續。\\n來源異同\\nGrist 與《衛報》對大會登場、災情數字與海涅警告的說法一致，《衛報》另有亞當·莫頓的分析，聚焦鮑文面臨的任務。數字並非衝突：逾5萬人是歐洲熱浪死亡人數，逾1,500人是尼泊爾洪水死亡人數，兩者指涉不同災難。信任標籤：雙源一致——兩家媒體對大會登場與災情的報導一致。\\n仍不確定\\n來源摘要只呈現標題與簡短描述，並非全文。談判的具體進度、各國的減排承諾，以及澳洲申辦峰會的結果，仍待後續報導確認。\"},\"sources\":[{\"name\":\"Grist\",\"url\":\"https://grist.org/climate/what-to-expect-as-world-leaders-gather-for-cop31/\"},{\"name\":\"The Guardian Climate Crisis\",\"url\":\"https://www.theguardian.com/environment/2026/nov/11/the-world-we-know-is-over-marshall-islands-president-cop31\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":20,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"energy\",\"live-ingest\",\"grist\",\"the-guardian-climate-crisis\",\"the-guardian-climate-crisis\"],\"glossary\":[{\"blurb\":{\"en\":\"Australian politician at the centre of the Guardian's COP31 analysis.\",\"zh-TW\":\"澳洲政治人物，《衛報》COP31 分析聚焦他在大會面臨的任務。\"},\"term\":{\"en\":\"Chris Bowen\",\"zh-TW\":\"克里斯·鮑文\"}},{\"blurb\":{\"en\":\"President of the Marshall Islands who warned that 'the world we know is over' without urgent climate action.\",\"zh-TW\":\"馬紹爾群島總統，在 COP31 警告若無緊急行動「我們所知的世界就結束了」。\"},\"term\":{\"en\":\"Hilda Heine\",\"zh-TW\":\"希爾達·海涅\"}},{\"blurb\":{\"en\":\"The UN's 31st climate conference, held in Antalya, Turkey.\",\"zh-TW\":\"聯合國第31屆氣候大會，在土耳其安塔利亞舉行。\"},\"term\":{\"en\":\"COP31\",\"zh-TW\":\"第31屆締約方大會\"}},{\"blurb\":{\"en\":\"Turkish city hosting COP31.\",\"zh-TW\":\"土耳其城市，COP31 舉辦地。\"},\"term\":{\"en\":\"Antalya\",\"zh-TW\":\"安塔利亞\"}},{\"blurb\":{\"en\":\"British news outlet covering COP31 and Bowen's task.\",\"zh-TW\":\"英國新聞媒體，報導 COP31 與鮑文的任務。\"},\"term\":{\"en\":\"The Guardian\",\"zh-TW\":\"《衛報》\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-energy-01-chris-bowen-faces-a-tita/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-energy-01-chris-bowen-faces-a-tita/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description
