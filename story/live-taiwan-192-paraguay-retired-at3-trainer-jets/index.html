yan defense outlet Pucará Defensa. Following Taiwan's retirement of the AT-3 fleet in July 2026 in favor of the indigenous Brave Eagle, the aircraft would be shipped in parts, reassembled locally, and operated as light attack jets, with two to four units slated to arrive in 2027 and full delivery targeted by the end of 2028.\n\nParaguay has not operated combat jets for more than two decades and relies on a 50-to-60-aircraft fleet centered on turboprops for anti-narcotics air interception over dense rain forests. Because the twin-engine subsonic AT-3 uses widely available U.S.-made Honeywell TFE731 turbofans and offers a 2.7-tonne payload across seven hardpoints, the package strengthens bilateral defense ties while giving Paraguay safer twin-engine interception capacity.\n\nTaipei Times and aviation outlet Air Data News both cite Pucará Defensa and Paraguayan Air Force sources regarding the 15-aircraft quantity and local reassembly plan. However, Air Data News's earlier October report noted four jets arriving first without specifying a 2028 completion deadline, whereas the November 28 Taipei Times dispatch adds a two-to-four initial batch in 2027, full completion by end-2028, and potential maintenance support from Taiwan's Air Force and Aerospace Industrial Development Corp (AIDC).\n\nNeither Taiwan's Ministry of National Defense nor Paraguay's government has issued an official public announcement confirming the transfer schedule, export approvals for U.S.-origin engines, or the exact number of retired airframes remaining in Taiwan for museum display.\n\nTrust label: Developing story — Details rely on Paraguayan defense media citing air force sources without formal confirmation from Taipei or Asunción."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-192-paraguay-retired-at3-trainer-jets\",\"category\":\"taiwan\",\"title\":{\"en\":\"Report: Taiwan to Donate 15 Retired AT-3 Trainer Jets to Paraguay\",\"zh-TW\":\"外媒披露台灣擬贈巴拉圭 15 架退役 AT-3 教練機，最快明年起分批交付\"},\"summary\":{\"en\":\"Paraguayan defense outlet Pucará Defensa reported that Taiwan plans to donate 15 retired AT-3 jets—phased out in July 2026 in favor of Brave Eagle trainers—to Paraguay for local reassembly as light attack aircraft through 2028, restoring jet capabilities the South American ally has lacked for over 20 years.\",\"zh-TW\":\"巴拉圭國防專業媒體 Pucará Defensa 引述巴國空軍消息指出，台灣擬將今年 7 月除役的 15 架 AT-3 高級教練機拆解運交巴拉圭就地組裝為輕型攻擊機，預計明年先交 2 至 4 架、2028 年底前全數到位，助該友邦重建暌違逾 20 年的噴射機隊。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」據《台北時報》（Taipei Times）引述巴拉圭軍事媒體 Pucará Defensa 報導，台灣繼 2026 年 7 月將 AT-3 自強號高級教練機除役並由勇鷹高教機接替後，計畫向友邦巴拉圭捐贈 15 架退役 AT-3 機體。這批戰機將採拆解運輸、巴國當地重新組裝方式交付，改作輕型攻擊機使用，預計 2027 年先交付 2 至 4 架，並於 2028 年底前完成全數交付。\\n\\n「為什麼重要」巴拉圭已超過 20 年未操作噴射作戰飛機，現役 50 至 60 架軍機以螺旋槳機種為主，主要負責廣大熱帶雨林上空的反毒攔截任務。AT-3 具備雙發動機安全冗余、採用美製 Honeywell TFE731 渦輪扇發動機便於後勤維保，且擁有 2.7 公噸載彈量與 7 個掛載點，不僅大幅提升巴國空軍攔截能力，也深化台巴軍事合作。\\n\\n「來源異同」《台北時報》與航空媒體 Air Data News 均引述 Pucará Defensa 與巴拉圭空軍消息確認 15 架規模與當地組裝模式；但 Air Data News 較早報導僅提及首批 4 架且未載明 2028 年底全數交付時程，《台北時報》最新報導則補充 2027 年首批 2 至 4 架、2028 年底完成，以及台灣空軍與漢翔（AIDC）可能提供備料與地勤協助等細節。\\n\\n「仍不確定」目前台灣國防部與巴拉圭官方尚未正式發布公告確認此軍援案，美製發動機第三國轉移許可進度及台灣留存作博物館展示的機體數量亦待官方說明。\\n\\nTrust label: Developing story — 目前資訊源自巴拉圭國防媒體引述空軍消息，台巴兩國國防部門尚未正式證實。\"},\"glossary\":[{\"term\":{\"en\":\"AT-3 Tzu Chung\",\"zh-TW\":\"AT-3 自強號高級教練機\"},\"blurb\":{\"en\":\"A twin-engine subsonic jet trainer developed by Taiwan's AIDC that served the Republic of China Air Force until July 2026.\",\"zh-TW\":\"由台灣航發中心（漢翔前身）研發的雙發動機次音速噴射教練機，服役數十年後於 2026 年 7 月除役。\"}},{\"term\":{\"en\":\"AIDC\",\"zh-TW\":\"漢翔航空工業（AIDC）\"},\"blurb\":{\"en\":\"Aerospace Industrial Development Corp., Taiwan's state-backed aerospace manufacturer responsible for the AT-3 and Brave Eagle trainers.\",\"zh-TW\":\"台灣主要航太國防製造商，負責研發與製造 AT-3 及新一代勇鷹高級教練機。\"}},{\"term\":{\"en\":\"Honeywell TFE731\",\"zh-TW\":\"漢威聯合 TFE731 發動機\"},\"blurb\":{\"en\":\"A widely used U.S.-manufactured turbofan engine powering the AT-3, valued for global spare-parts availability.\",\"zh-TW\":\"廣泛應用於商務機與教練機的美製渦輪扇發動機，因全球後勤零件充足而有利巴拉圭維護。\"}}],\"sources\":[{\"name\":\"Taipei Times\",\"url\":\"https://www.taipeitimes.com/News/taiwan/archives/2026/11/28/2003868538\"},{\"name\":\"Air Data News\",\"url\":\"https://www.airdatanews.com/paraguay-to-receive-15-retired-taiwanese-at-3-jet-trainers-report/\"}],\"imageUrl\":\"/covers/live/live-taiwan-192-paraguay-retired-at3-trainer-jets.jpg\",\"imageAlt\":{\"en\":\"Retired Taiwanese AT-3 trainer jets planned for transfer to Paraguay\",\"zh-TW\":\"台灣空軍除役之 AT-3 高級教練機擬援贈友邦巴拉圭\"},\"isHeadline\":false,\"isPopular\":true,\"trustScore\":69,\"trustBreakdown\":{\"crossCorroboration\":16,\"outletReputation\":19,\"recencyClarity\":20,\"sourceDiversity\":14},\"publishedAt\":\"2026-11-27T18:57:53.000Z\",\"disagreements\":\"Taipei Times reports an initial batch of two to four jets in 2027 with full delivery by end-2028, whereas Air Data News's earlier summary of the same Pucará Defensa report cited four initial aircraft without a 2028 completion timeline.\",\"selfCheck\":{\"D1\":22,\"D2\":22,\"D3\":21,\"D4\":18,\"D5\":22,\"total\":21},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-taiwan-192-paraguay-retired-at3-trainer-jets/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN
