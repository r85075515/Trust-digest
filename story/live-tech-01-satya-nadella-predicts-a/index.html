 users once did themselves.\n\nWhat happened\nNadella says AI agents could upend the advertising-driven models that have powered the web for two decades, forcing companies such as Amazon to rethink how they compete for customers. The feed item does not say where or when Nadella made the remarks — no conference, interview or event is named — so the prediction itself is the whole story as reported.\n\nWhy it matters\nThe web economy runs on attention: advertisers pay to reach users, and platforms compete to hold that attention. If AI agents start comparing prices, placing orders and making choices on a user's behalf, the advertising layer in between loses value. Nadella's prediction points to a shift in where competition happens — from winning eyeballs to controlling the agent that acts for the customer — and that shift would reorder the advantages of today's biggest platforms.\n\nSources agree / disagree\nThis is a single-outlet story from TechCrunch, with no second newsroom corroborating the remarks yet. There are no conflicting figures or rival claims in the feed, so the judgement to make is about the prediction's plausibility, not about competing accounts of what was said.\n\nStill uncertain\nThe occasion, the full context of Nadella's remarks and any timetable he offered are all missing, and no response from Amazon or other platform companies has been reported. Whether agents reshape web economics will depend on how quickly they move from demos into everyday shopping and decision-making.\n\nTrust label: Single source — One outlet has reported these remarks so far; the occasion and full context remain unconfirmed."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"adult\":false,\"body\":{\"en\":\"$10\",\"zh-TW\":\"微軟執行長薩蒂亞·納德拉（Satya Nadella）預測，AI 代理將重洗網路經濟，廣告驅動的商業模式首當其衝。\\n\\n發生了什麼事\\n據 TechCrunch 報導，納德拉表示 AI 代理可能顛覆廣告驅動的商業模式，迫使亞馬遜（Amazon）等公司重新思考如何爭取客戶。報導沒有說明納德拉是在哪場活動或訪問中發表這番談話，只留下預測本身。\\n\\n為什麼重要\\n網路經濟過去靠廣告與流量變現，AI 代理若直接替用戶比價、下單、做決定，廣告的中介價值就會縮水。納德拉的判斷等於宣告：平台競爭的戰場要從搶注意力，轉向搶代理背後的入口。\\n\\n來源異同\\n目前只有 TechCrunch 一則報導，沒有其他媒體跟進佐證。沒有數字或說法衝突，整件事就是納德拉的一項預測。\\n\\n仍不確定\\n納德拉發言的場合、完整脈絡與他對時間表的判斷都沒有交代，亞馬遜等公司也未見回應。這項預測能否成真，要看 AI 代理實際滲透到消費行為的速度。\"},\"category\":\"tech\",\"disagreements\":null,\"glossary\":[{\"blurb\":{\"en\":\"Chief executive of Microsoft.\",\"zh-TW\":\"微軟執行長。\"},\"term\":{\"en\":\"Satya Nadella\",\"zh-TW\":\"薩蒂亞·納德拉（Satya Nadella）\"}},{\"blurb\":{\"en\":\"The US technology company Nadella leads.\",\"zh-TW\":\"納德拉領導的美國科技公司。\"},\"term\":{\"en\":\"Microsoft\",\"zh-TW\":\"微軟（Microsoft）\"}},{\"blurb\":{\"en\":\"The e-commerce and cloud company named as facing pressure from AI agents.\",\"zh-TW\":\"被點名將受 AI 代理衝擊的電商與雲端公司。\"},\"term\":{\"en\":\"Amazon\",\"zh-TW\":\"亞馬遜（Amazon）\"}},{\"blurb\":{\"en\":\"Software that acts on a user's behalf, such as comparing prices or placing orders.\",\"zh-TW\":\"可替用戶比價、下單、做決定的軟體。\"},\"term\":{\"en\":\"AI agent\",\"zh-TW\":\"AI 代理（AI agent）\"}},{\"blurb\":{\"en\":\"The technology news outlet that reported Nadella's prediction.\",\"zh-TW\":\"報導納德拉預測的科技新聞媒體。\"},\"term\":{\"en\":\"TechCrunch\",\"zh-TW\":\"TechCrunch\"}}],\"id\":\"live-tech-01-satya-nadella-predicts-a\",\"imageAlt\":{\"en\":\"Cover related to: Satya Nadella predicts AI agents will reshuffle the economics of the web\",\"zh-TW\":\"相關封面圖：薩蒂亞·納德拉 (Satya Nadella) 預測人工智慧代理將重新洗牌網路經濟\"},\"imageUrl\":\"/covers/live/live-tech-01-satya-nadella-predicts-a.jpg\",\"isHeadline\":false,\"isPopular\":false,\"publishedAt\":\"2026-11-18T22:58:11.000Z\",\"sources\":[{\"name\":\"TechCrunch\",\"url\":\"https://techcrunch.com/2026/11/18/satya-nadella-predicts-ai-agents-will-reshuffle-the-economics-of-the-web/\"}],\"summary\":{\"en\":\"[Unconfirmed · Single source] Microsoft chief executive Satya Nadella predicts AI agents will reshuffle the economics of the web, TechCrunch reports. He says agents could disrupt advertising-driven business models and force companies such as Amazon to rethink how they compete for customers. Watch fo
