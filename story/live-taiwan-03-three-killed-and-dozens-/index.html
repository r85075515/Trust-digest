pital, and authorities say it is unclear what caused the blaze.\nWhat happened\nThe fire broke out at a confectionery factory in Indonesia. At least three people were killed and 36 are still missing. At least 15 people were rescued, four of them taken to hospital. Authorities say the cause of the fire is still unclear. The two reports agree on all of these figures, and neither report in the feed names the factory or gives its exact location.\nWhy it matters\nThe missing figure is the story. With 36 people unaccounted for against three confirmed dead, the casualty toll could rise sharply as rescue teams search the site, and families are left waiting for news. The rescue of at least 15 people shows the response reached survivors, but the scale of the missing list points to a serious industrial accident, not a minor fire.\nSources agree-disagree\nBBC News and Al Jazeera report the same core facts: three killed, 36 missing, at least 15 rescued, four hospitalised, cause unknown. No numeric or name conflicts appear between the two reports. Trust label: Two-source agreement.\nStill uncertain\nThe cause of the fire is unknown, and the feed summaries do not name the factory, say where exactly it stands, or report how many people were inside when the fire started. The condition of the four hospitalised people is also not given. Those details will only come from follow-up reporting and official updates from Indonesian authorities."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-03-three-killed-and-dozens-\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-taiwan-03-three-killed-and-dozens-.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Three killed and dozens missing after fire at Indonesian factory\",\"zh-TW\":\"相關封面圖：印尼工廠發生火災，三人死亡，數十人失踪\"},\"publishedAt\":\"2026-11-22T07:46:35.000Z\",\"title\":{\"en\":\"Indonesia Confectionery Factory Fire Kills Three, Leaves 36 M
