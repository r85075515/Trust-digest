ing to him.’\nWhat happened\nCiting ‘national security’ concerns, Trump temporarily ended many of the restrictions on Moscow that Congress recently passed, offering no further details to lawmakers. Senator Lindsey Graham, asked about the move, would only say he looks forward to talking to the president — a notably reserved response. Ukrainian President Volodymyr Zelenskyy condemned the decision as ‘wrong,’ warning it would encourage Russia to continue its assault, and urged support for new U.S. sanctions on Russia. The context cuts deep: Trump signed the Graham Bill — targeting Russia over its invasion of Ukraine — into law just last month; now, after cutting a deal with Moscow to release diesel, he has handed Vladimir Putin a reprieve from threatened energy measures.\nWhy it matters\nThis is the executive branch overriding the legislature in real time: a law Congress passed in September, suspended by the president in October on national-security grounds. Graham watching his own bill get shelved by his own party's president captures an awkward Republican split. For Ukraine, it's a double blow — sanctions relief plus a diesel deal — giving Putin breathing room on both the economic and diplomatic fronts.\nSources agree / disagree\nBBC, NPR, CNBC, the Financial Times, PBS, The Hill and Axios all report the same core facts — the waiver, Graham's response, Zelenskyy's condemnation — with no factual conflicts. Trust label: Multi-source agreement — seven outlets agree on the waiver and the reactions.\nStill uncertain\nThe waiver's exact scope and duration, and what Trump means by the ‘national interest,’ were not explained; nor is it known what Graham and Trump discussed or whether Congress will push back. Verify details in the full reporting before quoting specifics."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-01-sen-graham-on-trump-waiv\",\"category\":\"international\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-international-01-sen-graham-on-trump-waiv.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Sen. Graham on Trump waiving Russia sanctions: ‘I look forward to talking to him’\",\"zh-TW\":\"相關封面圖：參議員格雷厄姆談川普放棄對俄羅斯的製裁：“我期待與他交談”\"},\"publishedAt\":\"2026-10-18T01:10:25.000Z\",\"title\":{\"en\":\"Lindsey Graham on Trump's Russia Sanctions Waiver: ‘I Look Forward to Talking to Him’\",\"zh-TW\":\"葛拉漢（Lindsey Graham）談川普豁免俄羅斯制裁：「我期待跟他談談」\"},\"summary\":{\"en\":\"Senator Lindsey Graham responded coolly to President Trump's decision to temporarily waive Russia sanctions recently passed by Congress, saying he looks forward to talking to him. Ukraine's Zelenskyy condemned the move as ‘wrong,’ warning it would encourage Russia to keep up its assault.\",\"zh-TW\":\"參議員葛拉漢對川普總統暫時豁免國會近期通過的對俄制裁一事回應冷淡，只說「期待跟他談談」。烏克蘭總統澤倫斯基譴責此舉「錯誤」，警告這會鼓勵俄羅斯繼續進攻。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"川普暫時豁免了國會才通過的對俄羅斯制裁，連自家共和黨大將葛拉漢都看不下去——只是他的說法很克制：「我期待跟他談談」。\\n發生了什麼事\\n川普以「國家安全」為由，暫時終止國會近期通過的多項對莫斯科限制措施，但沒有提供更多細節。參議員林賽·葛拉漢（Lindsey Graham）被問到此事時只說「我期待跟他談談」，態度保留。烏克蘭總統澤倫斯基（Volodymyr Zelenskyy）譴責這是「錯誤」的決定，警告此舉會鼓勵俄羅斯繼續進攻，並呼籲支持美國對俄羅斯的新制裁。背景是：川普9月才把針對俄羅斯入侵烏克蘭的《葛拉漢法案》簽署成法律；如今又在與莫斯科達成釋放柴油的協議後，讓普丁暫時躲過原本威脅中的能源制裁。\\n為什麼重要\\n這是行政權直接架空立法權的示範：國會9月才立的法，總統10月就以國家安全為由暫停執行。葛拉漢本人的法案被自己的總統擱置，他的「期待談談」背後是共和黨內的尷尬分裂。對烏克蘭來說，這是雙重打擊：制裁鬆綁＋柴油交易，普丁等於同時拿到經濟與外交的喘息空間。\\n來源異同\\nBBC、NPR、CNBC、金融時報、PBS、國會山報、Axios 七家報導的核心事實一致：豁免制裁、葛拉漢回應、澤倫斯基譴責，沒有事實衝突。信任標籤：N源一致——七家媒體對豁免決定與各方反應的報導一致。\\n仍不確定\\n豁免的確切範圍、期限，以及川普所謂「國家利益」的具體內容都沒有說明；葛拉漢與川普談了什麼、國會是否反制，同樣未知。引用細節前請查閱完整報導。\"},\"sources\":[{\"name\":\"BBC World\",\"url\":\"https://www.bbc.co.uk/news/articles/cxr5yvzv7rp0o?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"NPR World\",\"url\":\"https://www.npr.org/2026/10/17/nx-s1-6006745/us-sanctions-russia\"},{\"name\":\"CNBC\",\"url\":\"https://www.cnbc.com/2026/10/17/trump-waives-russia-related-sanctions-tariffs-before-they-take-effect-.html\"},{\"name\":\"Financial Times Markets\",\"url\":\"https://www.ft.com/content/836eddd7-3adc-4cbb-8527-7a0a7a277e50?syn-25a6b1a6=1\"},{\"name\":\"PBS NewsHour\",\"url\":\"https://www.pbs.org/newshour/world/zelenskyy-urges-support-for-new-u-s-sanctions-on-russia-put-on-hold-by-trump\"},{\"name\":\"The Hill\",\"url\":\"https://thehill.com/homenews/senate/6156233-darline-graham-opposes-trump-russia-waiver/\"},{\"name\":\"Axios\",\"url\":\"https://www.axios.com/2026/10/17/trump-russia-sanctions\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":25,\"outletReputation\":19,\"crossCorroboration\":25,\"recencyClarity\":25},\"tags\":[\"international\",\"live-ingest\",\"bbc-world\",\"npr-world\",\"cnbc\"],\"glossary\":[{\"term\":{\"en\":\"Lindsey Graham\",\"zh-TW\":\"林賽·葛拉漢\"},\"blurb\":{\"en\":\"US Republican senator and sponsor of the Graham Bill.\",\"zh-TW\":\"美國共和黨參議員，《葛拉漢法案》提案人。\"}},{\"term\":{\"en\":\"Donald Trump\",\"zh-TW\":\"川普\"},\"blurb\":{\"en\":\"US president who waived the sanctions.\",\"zh-TW\":\"美國總統，豁免制裁的決策者。\"}},{\"term\":{\"en\":\"Volodymyr Zelenskyy\",\"zh-TW\":\"澤倫斯基\"},\"blurb\":{\"en\":\"President of Ukraine who condemned the waiver.\",\"zh-TW\":\"烏克蘭總統，譴責豁免決定。\"}},{\"term\":{\"en\":\"Vladimir Putin\",\"zh-TW\":\"普丁\"},\"blurb\":{\"en\":\"Russian president given a reprieve on energy measures.\",\"zh-TW\":\"俄羅斯總統，暫時躲過能源制裁。\"}},{\"term\":{\"en\":\"BBC\",\"zh-TW\":\"BBC\"},\"blurb\":{\"en\":\"British broadcaster covering the waiver.\",\"zh-TW\":\"英國廣播公司，報導豁免決定。\"}},{\"term\":{\"en\":\"CNBC\",\"zh-TW\":\"CNBC\"},\"blurb\":{\"en\":\"US financial news outlet covering the waiver.\",\"zh-TW\":\"美國財經新聞媒體，報導豁免決定。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"descriptio
