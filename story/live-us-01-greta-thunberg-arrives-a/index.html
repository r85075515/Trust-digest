d power. The meeting — this year's Conference of the Parties — comes after a year of climate-driven heat waves and other disasters, and Thunberg's arrival puts activist pressure on the talks from day one.\nWhat happened\nThe Associated Press, carried by Mongabay, reported that Thunberg arrived at the meeting venue in Antalya and emphasized protecting people and the planet over profits and power. Al Jazeera's headline carries a slightly fuller version of her remark — 'Everything and everyone we love is at stake' — and says she slammed the COP31 talks. The two accounts agree on the arrival, the venue, and the substance of her message.\nWhy it matters\nThe judgment is plain: Thunberg is the most recognizable face of climate activism, and her presence at the talks turns the opening days into a test of whether negotiators hear the urgency she voices. Her criticism lands as delegates meet after a year in which climate disasters were impossible to ignore.\nSources agree / disagree\nAl Jazeera and Mongabay agree on the arrival and the message; the only difference is the wording of the quote, with Al Jazeera adding 'and everyone.' That is a quote variant, not a factual conflict. Trust label: Two-source agreement — two outlets confirm the arrival and the message.\nStill uncertain\nThe snippets do not say what Thunberg will do next at COP31, whom she plans to meet, or whether any delegation has responded to her criticism. Watch for her next appearance and any official reply."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-us-01-greta-thunberg-arrives-a\",\"category\":\"us\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-us-01-greta-thunberg-arrives-a.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Greta Thunberg arrives at UN climate talks saying ‘everything we love is at stake’\",\"zh-TW\":\"相關封面圖：格蕾塔·通伯格 (Greta Thunberg) 出席聯合國氣候談判並表示“我們所愛的一切都處於危險之中”\"},\"publishedAt\":\"2026-11-11T00:24:27.000Z\",\"title\":{\"en\":\"Greta Thunberg Arrives at COP31 Saying 'Everything We Love Is at Stake'\",\"zh-TW\":\"格蕾塔·通伯格（Greta Thunberg）抵達 COP31：我們所愛的一切都岌岌可危\"},\"summary\":{\"en\":\"Climate activist Greta Thunberg arrived Tuesday at the COP31 climate talks in Antalya, Turkey, urging world leaders to put people and planet before profit and power, the Associated Press reported via Mongabay. Al Jazeera's version of her remark adds 'and everyone.' Next watch is whether her criticism shifts the negotiations.\",\"zh-TW\":\"氣候行動者格蕾塔·通伯格（Greta Thunberg）週二抵達土耳其安塔利亞的 COP31 會場，呼籲世界領袖把人民與地球置於利潤與權力之前，據美聯社（AP）經 Mongabay 報導；半島電視台（Al Jazeera）引述的版本多了「每一個人」。接下來看她的批評是否影響談判。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"氣候行動者格蕾塔·通伯格（Greta Thunberg）週二抵達土耳其安塔利亞的 COP31 會場，向記者表示「我們所愛的一切都岌岌可危」，呼籲世界領袖把人民與地球置於利潤與權力之前。這屆締約方大會登場前的一年，全球經歷了氣候引發的熱浪與其他災害，通伯格的到場讓談判從第一天就面臨行動者的壓力。\\n發生了什麼事\\n美聯社（AP）經 Mongabay 報導，通伯格抵達安塔利亞的會場，強調保護人民與地球的重要性高於利潤與權力。半島電視台（Al Jazeera）的標題引述了稍完整的版本——「我們所愛的一切和每一個人都岌岌可危」——並說她猛烈抨擊 COP31 談判。兩邊對她的到場、地點與發言內容都一致。\\n為什麼重要\\n判斷很直接：通伯格是氣候行動最具代表性的面孔，她的現身讓談判開局幾天成為考驗——談判代表是否聽見她所表達的急迫性。她的批評落在各國代表開會之際，而過去一年氣候災害已到了無法忽視的地步。\\n來源異同\\n半島電視台與 Mongabay 都確認她已到場與發言內容；唯一差別是引言措辭，半島電視台的版本多了「每一個人」，屬於引言版本差異，不是事實衝突。信任標籤：兩源一致——兩家媒體都確認到場與發言內容。\\n仍不確定\\n摘要沒有說通伯格接下來在 COP31 有什麼行程、計畫見誰，也沒有任何代表團回應她的批評。接下來看她的下一次現身與官方回應。\"},\"sources\":[{\"name\":\"Al Jazeera\",\"url\":\"https://www.aljazeera.com/news/2026/11/11/everything-and-everyone-we-love-is-at-stake-thunberg-slams-cop31-talks?traffic_source=rss\"},{\"name\":\"Mongabay\",\"url\":\"https://news.mongabay.com/short-article/2026/11/greta-thunberg-arrives-at-un-climate-talks-saying-everything-we-love-is-at-stake/\"}],\"disagreements\":null,\"trustScore\":62,\"trustBreakdown\":{\"sourceDiversity\":13,\"outletReputation\":10,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"us\",\"live-ingest\",\"al-jazeera\",\"mongabay\"],\"glossary\":[{\"term\":{\"en\":\"Greta Thunberg\",\"zh-TW\":\"格蕾塔·通伯格\"},\"blurb\":{\"en\":\"Swedish climate activist who arrived at the COP31 talks in Antalya.\",\"zh-TW\":\"抵達安塔利亞 COP31 會場的瑞典氣候行動者。\"}},{\"term\":{\"en\":\"COP31\",\"zh-TW\":\"COP31\"},\"blurb\":{\"en\":\"This year's Conference of the Parties climate talks, held in Antalya, Turkey.\",\"zh-TW\":\"今年在土耳其安塔利亞舉行的締約方大會氣候談判。\"}},{\"term\":{\"en\":\"Al Jazeera\",\"zh-TW\":\"半島電視台\"},\"blurb\":{\"en\":\"Outlet whose headline carries the fuller version of Thunberg's remark.\",\"zh-TW\":\"標題引述通伯格較完整發言版本的媒體。\"}},{\"term\":{\"en\":\"Mongabay\",\"zh-TW\":\"Mongabay\"},\"blurb\":{\"en\":\"Outlet that carried the Associated Press report of Thunberg's arrival.\",\"zh-TW\":\"轉載美聯社到場報導的媒體。\"}},{\"term\":{\"en\":\"Associated Press\",\"zh-TW\":\"美聯社\"},\"blurb\":{\"en\":\"Wire service whose report described Thunberg's arrival at the venue.\",\"zh-TW\":\"報導通伯格抵達會場的通訊社。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-us-01-greta-thunberg-arrives-a/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-us-01-greta-thunberg-arrives-a/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-sour
