0 transition ramp leading to State Route 51 in Phoenix. According to local broadcast reporting, the crash left one vehicle overturned on the elevated interchange connector during Thanksgiving Day holiday traffic.\n\nThe I-10 and SR 51 interchange—commonly known locally as part of the Mini-Stack—is one of the busiest freeway connectors in the Phoenix metropolitan area. Even moderate holiday traffic disruptions at this junction can trigger significant backups along central Phoenix commuter corridors.\n\nLocal station 12 News (KPNX) and regional incident trackers Wisevoter and Sher Law Group aligned on the location of the two-vehicle crash on the I-10 to SR 51 ramp and the November 26 date. Reporting remained concise, focusing on traffic disruption and responder presence.\n\nOfficial Arizona Department of Public Safety findings regarding injury severity, potential impairment, and the precise sequence of impact have not yet been released.\n\nTrust label: Single source — Initial incident details originate from 12 News (KPNX) broadcast reporting and are echoed by local incident summaries."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-arizona-105-phoenix-i10-sr51-ramp-rollover-crash\",\"category\":\"arizona\",\"title\":{\"en\":\"Two-Vehicle Rollover Crash Disrupts I-10 Ramp to SR 51 in Phoenix\",\"zh-TW\":\"鳳凰城 10 號州際公路銜接 51 號州道匝道發生兩車翻覆事故\"},\"summary\":{\"en\":\"A two-vehicle rollover collision occurred on November 26, 2026, on the Interstate 10 transition ramp leading to State Route 51 in central Phoenix. Emergency crews responded to the Thanksgiving Day crash, which left one vehicle overturned on the interchange. Authorities have not publicly released details on the extent of injuries or the exact cause of the collision.\",\"zh-TW\":\"亞利桑那州鳳凰城市中心 10 號州際公路（I-10）銜接 51 號州道（SR 51）的交流道匝道，於 2026 年 11 月 26 日感恩節上午發生兩車相撞翻覆事故，造成其中一輛汽車側翻。警消人員隨即趕赴現場處置並疏導車流，確切肇事原因與傷者傷勢程度仍有待警方進一步調查說明。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」鳳凰城警消單位於 2026 年 11 月 26 日上午接獲通報，前往 10 號州際公路（I-10）銜接 51 號州道（SR 51）的轉接匝道處理一起兩車相撞事故。當地電視台報導指出，該起感恩節當日發生的車禍導致其中一輛汽車翻覆在交流道匝道上，影響現場通行。\\n\\n「為什麼重要」I-10 與 SR 51 交會處（當地俗稱 Mini-Stack 交流道）是大鳳凰城都會區最繁忙的高速公路樞紐之一，即便在國定假日期間，該轉接匝道一旦發生事故封閉或縮減車道，仍極易造成市中心東西向與南北向車流回堵。\\n\\n「來源異同」亞利桑那州當地電視台 12 News（KPNX）與地方交通法律資訊站點 Wisevoter、Sher Law Group 對事故發生日期（11 月 26 日）、地點（I-10 往 SR 51 匝道）及涉事車輛數（兩車相撞且一車翻覆）描述一致。各來源均以簡短快訊呈現路況資訊，未過度揣測事故細節。\\n\\n「仍不確定」亞利桑那州公共安全部（AZDPS）尚未正式公布涉事駕駛與乘客的具體傷勢程度、是否涉及酒駕或超速，以及詳細肇事責任歸屬。\"},\"glossary\":[{\"term\":{\"en\":\"Transition Ramp\",\"zh-TW\":\"高架轉接匝道\"},\"blurb\":{\"en\":\"An elevated freeway connector ramp allowing motorists to merge directly from one highway corridor onto another without exiting to surface streets.\",\"zh-TW\":\"連接兩條不同高速公路主線的立體交叉引道，讓駕駛人無須下平面道路即可直接切換公路系統。\"}},{\"term\":{\"en\":\"Mini-Stack Interchange\",\"zh-TW\":\"鳳凰城 Mini-Stack 交流道\"},\"blurb\":{\"en\":\"The major multi-level freeway interchange in central Phoenix connecting Interstate 10, State Route 51, and Loop 202.\",\"zh-TW\":\"位於鳳凰城市中心的大型多層立體交流道樞紐，負責銜接 10 號州際公路、51 號州道與 202 號環狀公路。\"}},{\"term\":{\"en\":\"Rollover Collision\",\"zh-TW\":\"車輛翻覆事故\"},\"blurb\":{\"en\":\"A motor vehicle crash in which a vehicle tips onto its side or roof due to high-speed impact, sharp steering, or roadway elevation changes.\",\"zh-TW\":\"因高速撞擊、急轉或路面高低差導致車輛側翻或四輪朝天翻覆的交通事故，常伴隨較高的車體變形與乘員受傷風險。\"}},{\"term\":{\"en\":\"Arizona Department of Public Safety (AZDPS)\",\"zh-TW\":\"亞利桑那州公共安全部\"},\"blurb\":{\"en\":\"The state-level law enforcement agency responsible for highway patrol, crash investigations, and traffic safety across Arizona interstates.\",\"zh-TW\":\"負責亞利桑那州境內州際公路巡邏、重大車禍事故鑑識調查及交通安全執法的州級警政機關。\"}}],\"sources\":[{\"name\":\"12 News (KPNX Phoenix)\",\"url\":\"https://www.12news.com/article/traffic/incidents/rollover-crash-reported-on-interstate-10-ramp-in-phoenix-thanksgiving-day/75-67d32f6b-324a-498c-8ea3-0eade785552b\"},{\"name\":\"Wisevoter Phoenix Incidents\",\"url\":\"https://wisevoter.com/world/us/az/phoenix/2026/11/26/rollover-crash-i-10-ramp-phoenix\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"Highway interchange ramp connecting Interstate 10 and State Route 51 in Phoenix, Arizona\",\"zh-TW\":\"亞利桑那州鳳凰城 10 號州際公路與 51 號州道立體交流道匝道\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":74,\"trustBreakdown\":{\"crossCorroboration\":17,\"outletReputation\":20,\"recencyClarity\":20,\"sourceDiversity\":17},\"publishedAt\":\"2026-11-27T15:56:21.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":4,\"D2\":4,\"D3\":3,\"D4\":4,\"D5\":3,\"total\":18},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-arizona-105-phoenix-i10-sr51-ramp-rollover-crash/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-arizona-105-phoenix-i10-sr51-ramp-rollover-crash/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}]],\"error\":null
