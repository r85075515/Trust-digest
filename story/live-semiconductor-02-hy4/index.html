ght arena, broadening what developers can build without paying for a closed API. Visual understanding closes the biggest capability gap in the Hunyuan line, letting one model handle text and images together. If the weights arrive on schedule, Hy4 becomes a new option for teams that want a capable Chinese-developed model they can run and adapt themselves.\nSources agree / disagree\nTechNews and CNA report the same release with the same facts: the November 4 launch, the first visual understanding capability, and the coming open-source release of the weights. No conflicts appear in the snippets. Trust label: Two-source agreement — two outlets agree on the launch date, the new capability, and the open-source plan.\nStill uncertain\nThe snippets give no benchmark numbers, no exact open-source date, and no license terms, so the model's real standing against rival models cannot be judged from this digest. Whether the weights arrive on time and under what terms are the questions to watch; check the full reporting for performance details."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-02-hy4\",\"category\":\"semiconductor\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-semiconductor-02-hy4.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 騰訊發布新一代大語言模型 Hy4，首增視覺理解將開源\",\"zh-TW\":\"相關封面圖：（譯文待補）騰訊發布新一代大語言模型 Hy4，首增視覺理解將開源\"},\"publishedAt\":\"2026-11-05T01:40:51.000Z\",\"title\":{\"en\":\"Tencent's Hunyuan Hy4 Adds Visual Understanding, Heads for Open Source\",\"zh-TW\":\"騰訊混元發布 Hy4：首增視覺理解，模型權重將開源\"},\"summary\":{\"en\":\"Tencent's Hunyuan team released Hy4, its new-generation large language model, on November 4. The model adds visual understanding for the first time and strengthens instruction following, long-text comprehension, and long-running agents. Tencent says the model weights will be open-sourced soon.\",\"zh-TW\":\"騰訊混元 4 日發布新一代大語言模型 Hy4，首次引入視覺理解能力，重點強化指令遵從、長文本理解、長程代理與真實生產力任務表現。模型權重將於近期開源，開發者可以留意釋出時間。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"騰訊混元團隊 4 日發布新一代大語言模型 Hy4，首次為該系列模型引入視覺理解能力。\\n發生了什麼事\\n根據中央社（CNA）與科技新報（TechNews）的報導，騰訊混元 4 日發布 Hy4。新模型首次引入視覺理解能力，重點強化指令遵從、長文本理解、長程代理（Long-Running Agent）及真實生產力任務的表現。騰訊表示，模型權重將於近期開源，開發者將能直接拿到模型本身，而不是只能透過 API 使用。\\n為什麼重要\\n結論很直接：騰訊把自己最新的旗艦模型放進開放權重的競爭圈，讓開發者不用付費使用封閉 API 也能搭建應用。視覺理解補上了混元系列最大的能力缺口，讓單一個模型就能同時處理文字與圖像。權重若按時釋出，Hy4 將成為想要一個能自行運行、自行調整的中國開發模型的團隊的新選擇。\\n來源異同\\n科技新報與中央社報導的是同一次發布，事實一致：11 月 4 日發布、首次增加視覺理解能力、權重即將開源。摘要中沒有出現衝突。信任標籤：雙源一致——兩家媒體對發布日期、新能力與開源計劃的說法一致。\\n仍不確定\\n摘要沒有給出測試數據、沒有確切的開源日期，也沒有授權條款，所以從這篇摘要無法判斷 Hy4 在同級模型中的真實位置。權重是否按時釋出、授權條件如何，是接下來要觀察的重點；性能細節請查閱完整報導。\"},\"sources\":[{\"name\":\"TechNews 科技新報\",\"url\":\"https://technews.tw/2026/11/05/tencent-unveils-new-gen-large-language-model-hy4-visual-understanding-open-source/\"},{\"name\":\"中央社-科技\",\"url\":\"https://www.cna.com.tw/news/ait/202611040339.aspx\"}],\"disagreements\":null,\"trustScore\":64,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":19,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"semiconductor\",\"live-ingest\",\"technews-科技新報\",\"中央社-科技\"],\"glossary\":[{\"term\":{\"en\":\"Tencent\",\"zh-TW\":\"騰訊\"},\"blurb\":{\"en\":\"Chinese technology company behind the Hunyuan model line.\",\"zh-TW\":\"開發混元系列模型的中國科技公司。\"}},{\"term\":{\"en\":\"Hunyuan\",\"zh-TW\":\"混元\"},\"blurb\":{\"en\":\"Tencent's large language model product line.\",\"zh-TW\":\"騰訊的大語言模型產品線。\"}},{\"term\":{\"en\":\"Hy4\",\"zh-TW\":\"Hy4\"},\"blurb\":{\"en\":\"Tencent Hunyuan's new-generation large language model, released November 4.\",\"zh-TW\":\"騰訊混元 11 月 4 日發布的新一代大語言模型。\"}},{\"term\":{\"en\":\"TechNews\",\"zh-TW\":\"科技新報\"},\"blurb\":{\"en\":\"Taiwan technology news outlet that covered the Hy4 release.\",\"zh-TW\":\"報導 Hy4 發布的台灣科技新聞媒體。\"}},{\"term\":{\"en\":\"CNA (Central News Agency)\",\"zh-TW\":\"中央社\"},\"blurb\":{\"en\":\"Taiwan's national news agency, which covered the Hy4 release from Taipei.\",\"zh-TW\":\"從台北報導 Hy4 發布的台灣國家通訊社。\"}}]}}]\n
