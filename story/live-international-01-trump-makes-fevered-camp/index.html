fensive campaigning rather than expansion into new territory.\nWhy it matters\nClosing-weekend venue choices are a signal of where a campaign fears losses; rallying in previously won states underlines that congressional control, not the presidency, is what Tuesday decides.\nSources agree / disagree\nBBC and the Financial Times agree on the defensive final push and its congressional stakes, with no conflicting facts. Trust label: Two-source agreement — two outlets agree on the core picture.\nStill uncertain\nThe snippets give no rally locations, crowd or polling detail for this specific weekend; those appear in the outlets' full campaign coverage."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-01-trump-makes-fevered-camp\",\"category\":\"international\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-international-01-trump-makes-fevered-camp.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Trump makes fevered campaign push in final weekend before election\",\"zh-TW\":\"相關封面圖：川普在大選前的最後一個週末大力推動競選活動\"},\"publishedAt\":\"2026-11-02T04:04:28.000Z\",\"title\":{\"en\":\"Trump Makes Fevered Campaign Push in Final Weekend, Rallying in States Republicans Previously Won\",\"zh-TW\":\"川普（Donald Trump）選前最後週末全力衝刺，在共和黨過去勝選的州造勢\"},\"summary\":{\"en\":\"President Donald Trump rallied in states Republicans previously won in the final weekend before Tuesday's elections, showcasing how tight the vote could be in determining control of Congress, as his party defends its congressional majority against signs of a backlash, BBC and the Financial Times reported.\",\"zh-TW\":\"BBC 與金融時報（Financial Times）報導，美國總統川普（Donald Trump）在週二選舉前最後週末，於共和黨過去勝選的州造勢，顯示國會控制權之爭有多緊繃；共和黨正抵禦反彈跡象、捍衛國會多數。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"川普總統在競選最後週末，守的是自己政黨已握有的地盤。\\n發生了什麼事\\n英國廣播公司（BBC）報導，美國總統在共和黨過去勝選的州造勢，顯示週二選舉決定國會控制權的競爭有多緊繃。金融時報（Financial Times）標題指出川普（Donald Trump）在期中選舉向不安的選民做最後訴求，其摘要稱共和黨正抵禦對總統的反彈跡象、捍衛國會控制權。兩則摘要都未列出此則的具體造勢城市，皆把此週末定調為防守型競選，而非開拓新版圖。\\n為什麼重要\\n收尾週末的場地選擇是競選團隊憂心流失何處的訊號；在過去勝選的州造勢，凸顯週二決定的是國會控制權，而非總統職位。\\n來源異同\\n英國廣播公司（BBC）與金融時報（Financial Times）對防守型最後衝刺與國會利害一致，沒有事實衝突。信任標籤：雙源一致——兩家媒體對核心圖像一致。\\n仍不確定\\n摘要未給此週末的造勢地點、人群或民調細節；這些見於兩家媒體的完整選戰報導。\"},\"sources\":[{\"name\":\"BBC World\",\"url\":\"https://www.bbc.co.uk/news/articles/c3j47gjx29vro?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"Financial Times\",\"url\":\"https://www.ft.com/content/75e8405b-124f-44aa-9c5e-0a33d0ee5b92?syn-25a6b1a6=1\"}],\"disagreements\":null,\"trustScore\":72,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":19,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"international\",\"live-ingest\",\"bbc-world\",\"financial-times\"],\"glossary\":[{\"term\":{\"en\":\"Donald Trump\",\"zh-TW\":\"川普\"},\"blurb\":{\"en\":\"President of the United States making the final campaign push.\",\"zh-TW\":\"美國總統，進行最後競選衝刺。\"}},{\"term\":{\"en\":\"BBC\",\"zh-TW\":\"英國廣播公司\"},\"blurb\":{\"en\":\"British broadcaster that reported the rally strategy.\",\"zh-TW\":\"英國廣播機構，報導造勢策略。\"}},{\"term\":{\"en\":\"Financial Times\",\"zh-TW\":\"金融時報\"},\"blurb\":{\"en\":\"Newspaper that reported Trump's final pitch to restive voters.\",\"zh-TW\":\"報紙，報導川普對不安選民的最後訴求。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-international-01-trump-makes-fevered-camp/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"
