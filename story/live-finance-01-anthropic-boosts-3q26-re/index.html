s for the last two quarters. The disclosure lands as the company nears what is expected to be a record-setting IPO.\nWhat happened\nCNBC reports Anthropic's third-quarter revenue hit $16.8 billion ahead of its IPO; DigiTimes headlines the 45% quarter-on-quarter jump and the adjusted profitability streak; the Financial Times puts the jump at 50%; and the BBC notes Anthropic flagging the revenue surge to investors ahead of its stock-market debut. The company framed the figures as evidence that the frontier-lab business model — heavy compute spending preceding profitability — can succeed. The timing is pointed: some investors have grown concerned about the sheer amount of money being spent on AI infrastructure, and rapid growth is proving slower than some had anticipated as fears about the AI trade rattle markets.\nWhy it matters\nThis is the most concrete look yet at whether the economics of frontier AI work. Two straight quarters of adjusted profitability at a $16.8 billion revenue scale would validate the spend-first playbook that the whole industry is running — and give IPO investors a number to anchor on. If the market doubts the durability of that growth, the debut pricing gets much harder.\nSources agree / disagree\nCNBC, DigiTimes, the Financial Times and the BBC all covered the same investor disclosure, but the numbers differ: DigiTimes says revenue rose 45%, the FT says it \"jumped 50%,\" and CNBC leads with the $16.8 billion figure. Figures differ across outlets (e.g. 16.8 vs 45 in headlines/snippets). Trust label: Conflicting figures/accounts — outlets agree an investor disclosure happened but differ on the growth percentage; treat the exact figure as unverified until the primary filing.\nStill uncertain\nFeed snippets do not say whether $16.8 billion is quarterly revenue or an annualized run-rate, what \"adjusted basis\" excludes, or when the IPO prices. The FT's 50% versus DigiTimes' 45% gap needs the underlying numbers. Verify against primary disclosures before quoting."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-01-anthropic-boosts-3q26-re\",\"category\":\"finance\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-finance-01-anthropic-boosts-3q26-re.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Anthropic boosts 3Q26 revenue by 45% and stays profitable as IPO approaches\",\"zh-TW\":\"相關封面圖：Anthropic 2026 年第 3 季營收成長 45%，並在 IPO 臨近之際保持獲利\"},\"publishedAt\":\"2026-10-15T05:55:29.000Z\",\"title\":{\"en\":\"Anthropic Tells Investors Revenue Hit $16.8B, Up 45%, Ahead of Record IPO\",\"zh-TW\":\"Anthropic 向投資人揭露第3季營收168億美元、季增45%，IPO 前夕連兩季獲利\"},\"summary\":{\"en\":\"Anthropic told prospective investors its third-quarter revenue surged 45% to $16.8 billion and that it has been profitable on an adjusted basis for two quarters, as it nears a record-setting IPO. The disclosure gauges whether the frontier-lab model — heavy compute spending before profitability — can work, as some investors fret about AI infrastructure spending.\",\"zh-TW\":\"Anthropic 向潛在投資人透露，第3季營收季增45%達168億美元，且已連續兩季在調整後基礎上獲利，公司正逼近一場創紀錄的 IPO。這份揭露也成為驗證前沿實驗室商業模式——先重金投入算力、再談獲利——是否走得通的試金石，儘管部分投資人對 AI 基礎建設支出感到憂心。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"Anthropic 的數字出爐了，而且很大：這家 AI 實驗室告訴潛在投資人，第3季營收較上季成長45%達168億美元，且已連續兩季在調整後基礎上獲利。這份揭露的時間點，正值公司逼近一場預期將創紀錄的 IPO。\\n發生了什麼事\\nCNBC 報導 Anthropic 第3季營收達168億美元；DigiTimes 以季增45%與連續調整後獲利為標題；金融時報（Financial Times）則寫營收「躍升50%」；BBC 報導 Anthropic 在上市前向投資人展示營收激增。公司把這些數字定位為前沿實驗室商業模式——先重金投入算力、再實現獲利——可行的證據。時機很微妙：部分投資人已對 AI 基礎建設的龐大支出感到憂心，而在 AI 交易疑慮震盪市場之際，成長速度也比部分人預期的慢。\\n為什麼重要\\n這是迄今最具體的一次驗證：前沿 AI 的經濟帳到底算不算得過來。若以168億美元的營收規模連續兩季調整後獲利，等於為整個產業都在跑的「先花錢再說」劇本背書，也給 IPO 投資人一個定價錨點。若市場懷疑這種成長能否持久，上市定價就會難得多。\\n來源異同\\nCNBC、DigiTimes、金融時報（Financial Times）、BBC 四家報導的是同一份投資人揭露，但數字有出入：DigiTimes 寫季增45%，金融時報寫「躍升50%」，CNBC 主打168億美元。不同媒體的數字有所不同（16.8 vs 45）。信任標籤：數字/說法衝突——各家都確認有這份投資人揭露，但成長百分比說法不一；確切數字以原始文件為準。\\n仍不確定\\n來源摘要沒說168億美元是單季營收還是年化數字、「調整後」排除了什麼、IPO 何時定價。金融時報的50%與 DigiTimes 的45%落差需要原始數據釐清。引用前請對照原始揭露文件。\"},\"sources\":[{\"name\":\"CNBC\",\"url\":\"https://www.cnbc.com/2026/10/15/anthropics-third-quarter-revenue-hits-16point8-billion-ipo.html\"},{\"name\":\"DigiTimes\",\"url\":\"https://www.digitimes.com/news/a20261015VL214/anthropic-ipo-ai-business-revenue.html\"},{\"name\":\"Financial Times\",\"url\":\"https://www.ft.com/content/11632d03-358c-454b-af95-d06d4072932b?syn-25a6b1a6=1\"},{\"name\":\"BBC Business\",\"url\":\"https://www.bbc.co.uk/news/articles/cqzjx448vxkgo?at_medium=RSS\u0026at_campaign=rss\"}],\"disagreements\":{\"en\":\"Figures differ across outlets (e.g. 16.8 vs 45 in headlines/snippets).\",\"zh-TW\":\"不同媒體的數字有所不同（例如，標題/摘要中的數字為 16.8 比 45）。\"},\"trustScore\":85,\"trustBreakdown\":{\"sourceDiversity\":25,\"outletReputation\":18,\"crossCorroboration\":17,\"recencyClarity\":25},\"tags\":[\"finance\",\"live-ingest\",\"cnbc\",\"digitimes\",\"financial-times\"],\"glossary\":[{\"blurb\":{\"en\":\"AI lab behind the Claude models, reporting surging revenue ahead of its IPO.\",\"zh-TW\":\"Claude 模型背後的 AI 實驗室，在 IPO 前公布營收激增。\"},\"term\":{\"en\":\"Anthropic\",\"zh-TW\":\"Anthropic\"}},{\"blurb\":{\"en\":\"US business news network reporting Anthropic's revenue at $16.8 billion.\",\"zh-TW\":\"美國財經電視網，報導 Anthropic 營收達168億美元。\"},\"term\":{\"en\":\"CNBC\",\"zh-TW\":\"CNBC\"}},{\"blurb\":{\"en\":\"UK business newspaper that put Anthropic's quarterly jump at 50%.\",\"zh-TW\":\"英國財經報紙，稱 Anthropic 單季成長50%。\"},\"term\":{\"en\":\"Financial Times\",\"zh-TW\":\"金融時報\"}},{\"blurb\":{\"en\":\"Taiwanese tech news outlet reporting the 45% quarter-on-quarter figure.\",\"zh-TW\":\"台灣科技媒體，報導季增45%的數字。\"},\"term\":{\"en\":\"DigiTimes\",\"zh-TW\":\"DigiTimes\"}},{\"blurb\":{\"en\":\"BBC's business desk, covering Anthropic's pre-IPO revenue pitch.\",\"zh-TW\":\"BBC 財經線，報導 Anthropic 上市前的營收說明。\"},\"term\":{\"en\":\"BBC Business\",\"zh-TW\":\"BBC Business\"}},{\"blurb\":{\"en\":\"Initial public offering; Anthropic's expected market debut is described as
