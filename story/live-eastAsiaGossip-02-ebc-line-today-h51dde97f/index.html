ternet exclaimed that older Taiwanese dramas had such a large scale, the report says, and Lin was given the title of ancient Greg Hsu. He has since opened a Threads account, which quickly attracted a large number of followers. Related headlines add a 24-hour marathon livestream of the old dramas, an interview calling him a kissing master, and comparisons calling him a Taiwanese Ji Chang-wook based on young photos being rediscovered.\nWhy it matters\nThe revival matters as entertainment news because it is driven entirely by rediscovery: decades-old broadcast material, recirculated on a current social platform, is creating a new audience and a new public identity for an actor whose recent profile in the snippets is defined by this trend. It also shows older Taiwanese drama being rejudged by present-day viewers, whose surprise at its scale is itself a headline point. The follower surge reported after he joined Threads turns an online joke into measurable renewed attention, though the outlets' figures for that surge conflict, as noted below.\nSources agree / disagree\nETtoday, Yahoo News Taiwan, EBC via LINE TODAY and other entertainment outlets all cover Lin's viral revival and agree on the core story, but the cluster flags sharply differing figures, 12 versus 86.9, in follower-related headlines, with one headline citing 120,000 in an hour and another 869,000. Trust label: Accounts differ — the outlets agree on the viral clips, the nickname, and the new account, but their follower numbers do not align.\nStill uncertain\nThe correct follower count, the exact timing of the surge, and which figure, if either, is accurate remain uncertain given the conflicting headlines expressed in different units. The snippets also do not reproduce Lin's own full comments beyond interview headlines, so his response should be read in the full interviews rather than inferred here."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-eastAsiaGossip-02-ebc-line-today-h51dde97f\",\"category\":\"eastAsiaGossip\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-eastAsiaGossip-02-ebc-line-today-h51dde97f.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 「上古許光漢」林煒激吻片瘋傳！「台灣池昌旭」年輕帥照也被考古 | EBC 東森娛樂 - LINE TODAY\",\"zh-TW\":\"相關封面圖：「上古許光漢」林煒激吻片瘋傳！「台灣池昌旭」年輕帥照也被考古 | EBC 東森娛樂 - LINE TODAY\"},\"publishedAt\":\"2026-11-03T15:14:18.000Z\",\"title\":{\"en\":\"Lin Wei's old drama clips go viral and earn him an 'ancient Greg Hsu' nickname\",\"zh-TW\":\"林煒（Lin Wei）舊劇激吻片段瘋傳，獲封上古許光漢（Greg Hsu）\"},\"summary\":{\"en\":\"Clips of 57-year-old actor Lin Wei's bold intimate scenes and lines from classic dramas such as the Hua Series have gone viral on Threads, surprising viewers at the scale of older Taiwanese dramas. Lin has opened a Threads account that quickly drew many followers, reports say.\",\"zh-TW\":\"57歲資深演員林煒（Lin Wei）在《花系列》等經典台劇中的大尺度親密對戲與台詞近日在Threads上瘋傳，令網友驚呼舊台劇尺度之大。報導稱他已開通Threads帳號並迅速吸引大批粉絲追蹤。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"57歲資深男星林煒（Lin Wei）近日突然再度爆紅，網友挖出他在經典台劇中的大尺度親密對戲與充滿張力的台詞，在Threads上廣泛瘋傳，標題更封他為上古許光漢（Greg Hsu）。\\n發生了什麼事\\n東森娛樂（EBC）經LINE TODAY刊載的主報導指出，林煒（Lin Wei）年輕時憑精緻帥氣的外型深獲觀眾喜愛，他在《花系列》、《我永遠愛你》等經典作品中的大尺度激情對戲與火辣台詞近日被挖出，在Threads上引爆瘋傳。全網驚呼以前的台劇尺度竟然這麼大，他更獲得上古許光漢（Greg Hsu）的封號。稍早他已開啟Threads帳號，火速吸引大批粉絲追蹤。相關標題還提到舊劇24小時馬拉松直播、專訪稱他為接吻大師，以及因年輕帥照被考古而被稱為台灣池昌旭（Ji Chang-wook）的比較。\\n為什麼重要\\n這波翻紅作為娛樂新聞的意義，在於它完全由重新發現所驅動：數十年前的播出素材在當今社群平台上重新流通，為這位演員創造新觀眾與新的公眾形象，而摘要中他近期的形象正由這股風潮定義。它也顯示舊台劇正被當代觀眾重新評價，觀眾對其尺度的驚訝本身就是標題重點。他開通Threads後的追蹤暴增，把網路玩笑轉化為可量化的再度關注，不過各媒體對暴增數字的報導並不一致，詳見下段。\\n來源異同\\n星光雲（ETtoday）、雅虎新聞台灣（Yahoo News Taiwan）、東森娛樂（EBC）經LINE TODAY等娛樂媒體都報導林煒（Lin Wei）的瘋傳翻紅，並對核心故事一致，但群組標示追蹤相關標題的數字差異甚大，有12與86.9之別，一則標題稱1小時12萬，另一則稱86.9萬。各來源同意片段瘋傳、封號與新帳號，但追蹤人數並不一致。\\n仍不確定\\n正確的追蹤人數、暴增的確切時間，以及兩個數字何者準確，在標題單位與說法衝突下仍不確定。摘要除專訪標題外未重現林煒（Lin Wei）的完整說法，其回應應以完整專訪為準，不宜在此推斷。\"},\"sources\":[{\"name\":\"ETtoday 影劇\",\"url\":\"https://star.ettoday.net/news/3265866\"},{\"name\":\"Yahoo TW 娛樂\",\"url\":\"https://tw.news.yahoo.com/%E4%
