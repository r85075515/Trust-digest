r models can process more data types, but whether they can understand them together.\n\nWhat happened\nIn a Q\u0026A published by MIT News, researchers discuss enabling more human-like interaction and understanding in multimodal foundation models. Humans experience the world through sensory information, the piece explains: learning the correspondence between a bird's chirp and the word 'robin', or visually identifying and following a friend such as 'Sarah' in a crowd. People draw on latent 'multimodal' knowledge, information spanning audio, video and other data types, and the research asks how models can do the same.\n\nWhy it matters\nA model that only reads text will always miss what people pick up from sound and sight, and closing that gap is what would make AI assistants feel less like search boxes and more like collaborators. The Q\u0026A frames the work as understanding first, interaction second.\n\nSources agree / disagree\nThis is a single-outlet item from MIT News, the publisher of the Q\u0026A itself, so there is no second source to compare. No numeric or factual conflicts appeared in the feed snippet.\n\nStill uncertain\nThe snippet does not name the researchers, give a publication or model name, or say what results the work has produced so far. Read the full Q\u0026A on MIT News before citing specifics.\nTrust label: Single source — MIT News alone carries this Q\u0026A, and it is the primary publisher."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-ai-02-q-a-enabling-more-human-\",\"category\":\"ai\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-ai-02-q-a-enabling-more-human-.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Q\u0026A: Enabling more human-like interactions and understanding in multimodal foundation models\",\"zh-TW\":\"相關封面圖：問與答：在多模式基礎模型中實現更多類人互動與理解\"},\"publishedAt\":\"2026-11-20T21:00:00.000Z\",\"title\":{\"en\":\"MIT Q\u0026A Explores How Multimodal Models Could Interact More Like Humans\",\"zh-TW\":\"MIT 問答：多模態基礎模型如何更像人類互動與理解\"},\"summary\":{\"en\":\"MIT News asks how multimodal foundation models could learn to connect sound, sight and language the way people do — matching a robin's chirp to the word 'robin' or picking a friend out of a crowd. The piece draws on latent knowledge across audio and video. Takeaway: human-like AI starts with senses, not just text.\",\"zh-TW\":\"MIT News 問答探討多模態基礎模型如何像人一樣，把聲音、影像與語言連起來——聽到鳥鳴想到「知更鳥」，或在人群中認出朋友。關鍵在於跨音訊與影像的潛在知識。takeaway：像人的 AI，先從感官學起，不只靠文字。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"MIT News 問答探討多模態基礎模型如何像人一樣，把聲音、影像與語言連起來——聽到鳥鳴想到「知更鳥」，或在人群中認出朋友。問題不在模型能不能處理更多資料類型，而在能不能一起理解。\\n發生了什麼事\\nMIT News 刊出的問答中，研究者討論如何在多模態基礎模型中實現更像人類的互動與理解。文章說明，人類透過感官訊息體驗世界：學習鳥鳴聲與「知更鳥」這個詞的對應，或在人群中用視覺辨認並跟隨朋友「莎拉」（Sarah）。人能調用跨音訊、影像等資料類型的潛在「多模態」知識，研究想問的是模型如何做到同樣的事。\\n為什麼重要\\n只讀文字的模型，永遠聽不到、看不到人從聲音與影像中抓到的東西；補上這個缺口，AI 助理才可能從搜尋框變成合作者。這場問答先談理解，再談互動。\\n來源異同\\n本則只有 MIT News 一個來源，且就是問答本身的發布者，無從比對第二家說法。片段中沒有數字或事實衝突。信任標籤：僅1源——MIT News 獨家刊載此問答。\\n仍不確定\\n片段未具名研究者、未給論文或模型名稱，也未說明目前已有何成果；引用細節前請讀 MIT News 完整問答。\"},\"sources\":[{\"name\":\"MIT News AI\",\"url\":\"https://news.mit.edu/2026/qa-enabling-more-human-interactions-understanding-multimodal-foundation-models-1120\"}],\"disagreements\":null,\"trustScore\":60,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":23,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"ai\",\"live-ingest\",\"mit-news-ai\"],\"glossary\":[{\"term\":{\"en\":\"MIT News\",\"zh-TW\":\"麻省理工學院新聞\"},\"blurb\":{\"en\":\"MIT's news outlet and publisher of the Q\u0026A.\",\"zh-TW\":\"麻省理工學院的新聞媒體，本問答的發布者。\"}},{\"term\":{\"en\":\"Multimodal foundation models\",\"zh-TW\":\"多模態基礎模型\"},\"blurb\":{\"en\":\"AI models designed to understand information across audio, video and other data types together.\",\"zh-TW\":\"能同時理解音訊、影像等多種資料類型的 AI 模型。\"}},{\"term\":{\"en\":\"Foundation models\",\"zh-TW\":\"基礎模型\"},\"blurb\":{\"en\":\"Large AI models trained on broad data and adapted to many tasks.\",\
