rthy will step down effective December 4, 2026, concluding over 11 years across two stints with the Bengaluru-based e-commerce firm. Chief Product and Technology Officer Balaji Thiagarajan, who joined in September 2025 after engineering leadership roles at Google, Microsoft, and Uber, will co-lead day-to-day operations alongside the Flipkart board on an interim basis until a permanent CEO is named.\n\nWhy it matters\nKrishnamurthy steered Flipkart through Walmart's 16 billion USD acquisition in 2018, expanded quick-commerce unit Flipkart Minutes to nearly 1,200 micro-fulfilment centres, and oversaw the company's domicile shift back to India in March 2026. His exit introduces leadership uncertainty just as Flipkart prepares for a long-awaited public listing and battles fierce quick-commerce rivals.\n\nSource differences\nTechCrunch (\"Flipkart CEO Kalyan Krishnamurthy to step down next week amid IPO uncertainty\") and Reuters via Investing.com (\"Walmart-owned Flipkart CEO Kalyan Krishnamurthy to step down\") confirm the December 4 departure date and interim leadership setup. Times of India (\"Flipkart CEO Kalyan Krishnamurthy in sudden exit after decade at helm\")  add that while Walmart gave no official reason, financial reports point to disagreements between Krishnamurthy and Walmart over IPO timelines, profitability targets, and employee stock option cash-outs.\n\nStill uncertain\nWho Walmart and the Flipkart board will appoint as permanent chief executive and how the leadership transition will reshape Flipkart's 2027 IPO schedule remain unconfirmed.\n\nTrust label: Multi-source agreement — TechCrunch, Reuters, and Times of India agree on the December 4 exit date and Balaji Thiagarajan's interim role."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-283-flipkart-ceo-kalyan-krishnamurthy-steps-down\",\"category\":\"finance\",\"title\":{\"en\":\"Flipkart CEO Kalyan Krishnamurthy to Step Down December 4 Amid IPO Delay\",\"zh-TW\":\"IPO時程生變 沃爾瑪旗下電商 Flipkart 執行長將於12月4日卸任\"},\"summary\":{\"en\":\"Walmart-owned Indian e-commerce giant Flipkart announced that CEO Kalyan Krishnamurthy will step down on December 4, 2026, after nearly a decade leading the company. Chief Product and Technology Officer Balaji Thiagarajan and the board will oversee interim operations while a permanent successor is selected amid reported friction over IPO timing.\",\"zh-TW\":\"沃爾瑪旗下印度電商巨頭 Flipkart 宣布，執掌公司近十年的執行長卡利安・克里希納穆爾蒂（Kalyan Krishnamurthy）將於2026年12月4日卸任。產品與技術長巴拉吉・蒂亞加拉詹（Balaji Thiagarajan）將與董事會共同暫代營運，外界指此番異動與首次公開募股（IPO）延宕及獲利路線分歧有關。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n印度電商巨頭 Flipkart 與母公司沃爾瑪（Walmart）證實，集團執行長卡利安・克里希納穆爾蒂（Kalyan Krishnamurthy）將於2026年12月4日正式卸任，結束他在該公司前後逾11年的任期。曾任職於 Google、微軟與 Uber 的產品與技術長巴拉吉・蒂亞加拉詹（Balaji Thiagarajan）將與董事會共同暫代日常營運，直到永久繼任者產生。\\n\\n「為什麼重要」\\n克里希納穆爾蒂自2017年出任執行長以來，帶領 Flipkart 度過2018年沃爾瑪160億美元收購案，並推出即時零售業務 Flipkart Minutes 對抗本土競爭者，今年3月更剛完成公司註冊地遷回印度。在市場高度關注其首次公開募股（IPO）進度之際，最高領導層換血為上市時程與策略增添變數。\\n\\n「來源異同」\\nTechCrunch（\\\"Flipkart CEO Kalyan Krishnamurthy to step down next week amid IPO uncertainty\\\"）與 Investing.com 轉載路透社報導（\\\"Walmart-owned Flipkart CEO Kalyan Krishnamurthy to step down\\\"）均確認12月4日離職日與過渡安排；《印度時報》（\\\"Flipkart CEO Kalyan Krishnamurthy in sudden exit after decade at helm\\\"）補充指出，官方雖未說明離職原因，但財經消息人士透露雙方在IPO推遲、獲利紀律及員工認股權兌現節奏上存在分歧。\\n\\n「仍不確定」\\n沃爾瑪與 Flipkart 董事會何時宣布正式執行長人選，以及人事更迭是否會進一步延後公司上市計畫，目前尚未定案。\\n\\nTrust label: Multi-source agreement — TechCrunch、路透社與印度時報均確認12月4日卸任時程及臨時管理架構。\"},\"glossary\":[{\"term\":{\"en\":\"Domicile shift\",\"zh-TW\":\"註冊地遷移\"},\"blurb\":{\"en\":\"Relocating a company's legal headquarters from an overseas jurisdiction (such as Singapore) back to its primary operating country (India) ahead of a local listing.\",\"zh-TW\":\"企業在當地掛牌上市前，將法律註冊主體從海外（如新加坡）遷回主要營運國（如印度）的架構重組。\"}},{\"term\":{\"en\":\"Quick commerce\",\"zh-TW\":\"即時零售\"},\"blurb\":{\"en\":\"Ultra-fast delivery of groceries and daily essentials within 10 to 30 minutes using dense networks of local dark stores.\",\"zh-TW\":\"依託高密度小型前置倉網絡，在10至30分鐘內將生鮮雜貨送達消費者的超高速電商模式。\"}},{\"term\":{\"en\":\"ESOP cash-out\",\"zh-TW\":\"員工認股權兌現\"},\"blurb\":{\"en\":\"A liquidity event allowing employees to sell vested company stock options prior to an initial public offering.\",\"zh-TW\":\"企業在正式IPO前安排的股權回購或交易機制，讓員工得以將已歸屬的認股權變現。\"}}],\"sources\":[{\"name\":\"TechCrunch\",\"url\":\"https://techcrunch.com/2026/11/25/flipkart-ceo-kalyan-krishnamurthy-to-step-down-next-week-amid-ipo-uncertainty/\"},{\"name\":\"Investing.com (Reuters)\",\"url\":\"https://www.investing.com/news/stock-market-news/walmartowned-flipkarts-kalyan-krishnamurthy-steps-down-as-ceo-5049946\"},{\"name\":\"The Times of India\",\"url\":\"https://timesofindia.indiatimes.com/business/india-business/kalyan-krishnamurthy-to-exit-flipkart-after-nearly-a-decade-as-ceo/articleshow/136159610.cms\"}],\"imageUrl\":\"/covers/live/live-finance-283-flipkart-ceo-kalyan-krishnamurthy-steps-down.webp\",\"imageAlt\":{\"en\":\"Flipkart CEO Kalyan Krishnamurthy to Step Down December 4 Amid IPO Delay\",\"zh-TW\":\"IPO時程生變 沃爾瑪旗下電商 Flipkart 執行長將於12月4日卸任\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":85,\"trustBreakdown\":{\"crossCorroboration\":22,\"outletReputation\":23,\"recencyClarity\":20,\"sourceDiversity\":20},\"publishedAt\":\"2026-11-28T00:37:18.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":21,\"D2\":22,\"D3\":20,\"D4\":21,\"D5\":21,\"total\":21},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2
