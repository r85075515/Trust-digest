al guest Rosalía. Gillis was announced as a new SNL cast member in 2019 alongside Chloe Fineman and Bowen Yang, then fired before the season began; Just Jared recaps the controversy as he returns. The cluster also bundles unrelated items: Billboard's watch-free guides, WWE's Money in the Bank, SNL UK, and CNET projector deals.\nWhat happened\nPer Billboard and Just Jared, Gillis hosts the October 10 episode with Rosalía performing as musical guest. The 2019 backstory: announced to the cast with Fineman and Yang, then dismissed — the episode marks his second hosting stint after the fallout. Bundled separately in the cluster are Billboard's streaming guides for SNL, WWE Money in the Bank 2026, and SNL UK season 2, plus a CNET deals post on a projector.\nWhy it matters\nThe judgment is about the arc: SNL rehiring as host a comedian it once fired is the show's quiet admission that the audience moved on before the institution did. Gillis's second hosting gig closes the loop — controversy as prologue, ratings as epilogue.\nSources agree / disagree\nBillboard and Just Jared agree on the core facts — the October 10 date, season 52, second-time host, Rosalía as musical guest, and the 2019 firing. Everything else in the cluster (WWE, SNL UK, CNET deals) is unrelated filler. Trust label: Core: multi-source agreement + Bundled stories — two outlets agree on the SNL facts; the rest is bundled noise.\nStill uncertain\nThe snippets recap the controversy only in headline form, without new details on the 2019 dismissal. Verify specifics in the full Just Jared piece before quoting them."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-entertainment-02-why-was-shane-gillis-was\",\"category\":\"entertainment\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-entertainment-02-why-was-shane-gillis-was.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Why Was Shane Gillis Was Fired From ‘Saturday Night Live’ In
