e the greenhouse gas emissions generated for every unit of electricity it consumes across its operations by 65 percent, compared with 2019. The new goal is a response to sharply rising power demand across cloud services and artificial intelligence data centres. Amazon has not previously disclosed this metric, so it is unclear how the company is performing against the target today.\n\nWhy it matters\nElectricity is the thread that ties Amazon's warehouses, offices and data centres together, and power demand from cloud computing and AI is climbing fast. A carbon-intensity goal measures emissions per unit of power rather than total emissions, so it tests whether Amazon's growth can get cleaner even as it gets bigger — the question investors and regulators will now ask at every update.\n\nSources agree / disagree\nTrellis and ESG Dive both reported the goal, and they agree on the target: a 65 percent cut in the carbon intensity of electricity consumption by 2030, against 2019. Neither outlet adds a conflicting figure in the feed excerpts, and both note the same gap — that Amazon has not disclosed its current performance on this metric.\n\nStill uncertain\nWithout a disclosed starting point, nobody outside Amazon can tell how far along the company already is, or how steep the remaining path to 2030 looks. The feed summaries also do not say how Amazon plans to get there — which levers, which timelines — so the first progress report will carry most of the weight.\n\nTrust label: Two-source agreement — Trellis and ESG Dive agree on the 65 percent target and the 2019 baseline."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-energy-01-amazon-sets-2030-goal-to\",\"category\":\"energy\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-energy-01-amazon-sets-2030-goal-to.webp\",\"imageAlt\":{\"en\":\"Cover related to: Amazon sets 2030 goal to cut carbon intensity of its electricity consumption\",\"zh-TW\":\"相關封面圖：亞馬遜設定 2030 年目標以降低電力消耗的碳強度\"},\"publishedAt\":\"2026-11-19T17:25:28.000Z\",\"title\":{\"en\":\"Amazon Sets 2030 Goal to Cut Carbon Intensity of Its Electricity Use by 65%\",\"zh-TW\":\"亞馬遜（Amazon）設 2030 年目標：用電碳強度較 2019 年減 65%\"},\"summary\":{\"en\":\"Amazon has committed to cutting the carbon intensity of its electricity consumption by 65 percent by 2030, against a 2019 baseline. The company has not previously disclosed this metric, so its current performance is unclear. Trellis and ESG Dive agree on the target; watch for Amazon's first progress report.\",\"zh-TW\":\"亞馬遜（Amazon）承諾到 2030 年，用電相關的溫室氣體排放強度較 2019 年降低 65%。公司過去未曾披露這項指標，目前進度不明。Trellis 與 ESG Dive 報導一致，接下來看亞馬遜是否公布首份進度報告。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"亞馬遜（Amazon）承諾到 2030 年，用電相關的溫室氣體排放強度較 2019 年降低 65%。\\n\\n發生了什麼事\\n這家科技與電商巨頭的目標是，營運中每消耗一單位電力所產生的碳排放，較 2019 年基準減少 65%。新目標是對雲端服務與人工智慧資料中心電力需求急速上升的回應。亞馬遜過去未曾披露這項指標，目前進度如何並不清楚。\\n\\n為什麼重要\\n電力把亞馬遜的倉庫、辦公室與資料中心串在一起，而雲端與人工智慧的用電需求正在快速攀升。碳強度目標衡量的是每單位用電的排放，不是總排放量，考驗的是亞馬遜在規模變大的同時能否變得更乾淨，投資人與監管機關往後每次更新都會追問這一點。\\n\\n來源異同\\nTrellis 與 ESG Dive 都報導了這項目標，說法一致：2030 年前用電碳強度較 2019 年減 65%。摘要中兩家沒有互相衝突的數字，也都點出同一個缺口：亞馬遜尚未披露目前在這項指標上的表現。\\n\\n仍不確定\\n沒有公布起點，外界無從判斷亞馬遜目前進度如何、通往 2030 年的路還有多陡。摘要也沒有說明亞馬遜打算用哪些方法、在什麼時程達成目標，首份進度報告將最具分量。\"},\"sources\":[{\"name\":\"Trellis\",\"url\":\"https://trellis.net/article/amazon-carbon-intensity-electricity-goall/\"},{\"name\":\"ESG Dive\",\"url\":\"https://www.esgdive.com/news/amazon-sets-2030-goal-to-cut-carbon-intensity-of-its-electricity-consumption/875208/\"}],\"disagreements\":null,\"trustScore\":62,\"trustBreakdown\":{\"sourceDiversity\":13,\"outletReputation\":10,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"energy\",\"live-ingest\",\"trellis\",\"esg-dive\"],\"glossary\":[{\"term\":{\"en\":\"Amazon\",\"zh-TW\":\"亞馬遜\"},\"blurb\":{\"en\":\"A technology and e-commerce company.\",\"zh-TW\":\"科技與電子商務公司。\"}},{\"term\":{\"en\":\"Trellis\",\"zh-TW\":\"Trellis\"},\"blurb\":{\"en\":\"A news outlet covering sustainability and business.\",\"zh-TW\":\"報導永續與商業議題的新聞媒體。\"}},{\"term\":{\"en\":\"ESG Dive\",\"zh-TW\":\"ESG Dive\"},\"blurb\":{\"en\":\"A news outlet covering sustainability and corporate responsibility.\",\"zh-TW\":\"報導永續與企業責任議題的新聞媒體。\"}},{\"term\":{\"en\":\"Carbon intensity\",\"zh-TW\":\"碳強度\"},\"blurb\":{\"en\":\"Greenhouse gas emissions per unit of electricity consumed.\",\"zh-TW\":\"每單位用電所產生的溫室氣體排放量。\"}},{\"term\":{\"en\":\"2019 baseline\",\"zh-TW\":\"2019 年基準\"},\"blurb\":{\"en\":\"The reference year against which the 2030 target is measured.\",\"zh-TW\":\"衡量 2030 年目標的參照年份。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-energy-01-amazon-sets-2030-goal-to/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-energy-01-amazon-sets-2030-goal-to/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}]],\"error\":null,\"di
