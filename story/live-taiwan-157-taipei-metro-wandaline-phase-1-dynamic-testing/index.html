ing on Phase 1 of the MRT Wanda-Zhonghe-Shulin Line on November 26, marking a major systems-integration milestone toward its scheduled 2027 revenue service launch. The 9.5-kilometer underground line spans nine stations connecting Chiang Kai-shek Memorial Hall in Taipei with Zhonghe and Tucheng in New Taipei City.\n\nEngineers are running driverless trains across the full alignment to verify communications-based train control signaling, platform screen door synchronization, and emergency braking responses under simulated operating speeds. Civil construction on Phase 1 has exceeded 85 percent completion, with station architectural finishing proceeding in parallel.\n\nOnce operational, the line will provide a direct rail link for densely populated communities in Zhonghe and Yonghe while offering transfers to the Tamsui-Xinyi, Songshan-Xindian, and Circular lines.\n\nTrust label: Multi-source agreement — CNAand United Daily News consistently report the November 26 start of full-line dynamic testing, 9.5-kilometer route length, and 2027 target opening."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-157-taipei-metro-wandaline-phase-1-dynamic-testing\",\"category\":\"taiwan\",\"title\":{\"en\":\"Taipei Metro Wanda Line Phase 1 Begins Full-Line Dynamic Train Testing\",\"zh-TW\":\"台北捷運萬大線第一期啟動全線動態測試 朝2027年通車目標邁進\"},\"summary\":{\"en\":\"Taipei's Department of Rapid Transit Systems launched full-line dynamic train testing on Phase 1 of the MRT Wanda-Zhonghe-Shulin Line on November 26 ahead of a planned 2027 opening.\",\"zh-TW\":\"台北市政府捷運工程局於11月26日宣布，捷運萬大中和樹林線第一期工程正式展開全線動態測試，列車依序進行號誌連鎖、通訊與自動駕駛系統整合驗證。萬大線第一期全長9.5公里、設9座地下車站，通車後將有效疏解中永和地區往返台北市區的通勤壅塞並串聯多條既有捷運路網。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n台北市政府捷運工程局於11月26日宣布，台北捷運萬大中和樹林線第一期正式啟動全線電聯車動態測試，在無人駕駛狀態下實車驗證行車監控、號誌連鎖、月台門連動及緊急煞車等機電系統整合表現。\\n\\n「為什麼重要」\\n萬大線第一期全長約9.5公里，起自中正紀念堂站經萬華區進入新北市永和、中和至土城金城機廠，共設9座地下車站。全線動態測試啟動代表土建與機電工程進入通車前關鍵整合階段，預計2027年完工通車後，將大幅縮短中永和及土城居民進入台北市中心時間並分散板南線與中和新蘆線運量。\\n\\n「來源異同」\\n中央社與聯合新聞網均一致報導11月26日啟動全線動態測試、9.5公里路線規模及2027年通車目標；中央社詳細說明通訊式列車控制（CBTC）號誌測試項目，聯合新聞網則補充沿線道路復舊與車站出入口施工進度。\\n\\n「仍不確定」\\n全線系統整合測試及後續初履勘時程是否受缺工或路面復舊作業影響，以及2027年具體通車月份仍待捷運局後續依測試進度公告。\\n\\nTrust label: Multi-source agreement — 中央社與聯合新聞網對萬大線第一期啟動全線動態測試日期、路線規格與通車目標報導一致。\"},\"glossary\":[{\"term\":{\"en\":\"Dynamic train testing\",\"zh-TW\":\"電聯車動態測試\"},\"blurb\":{\"en\":\"Operational testing of rolling stock running on tracks to verify signaling, traction, braking, and automated control systems.\",\"zh-TW\":\"讓列車實際在軌道上運行，以驗證號誌連鎖、牽引動力、煞車及自動駕駛控制系統的整合測試。\"}},{\"term\":{\"en\":\"Communications-Based Train Control (CBTC)\",\"zh-TW\":\"通訊式列車控制系統（CBTC）\"},\"blurb\":{\"en\":\"A modern railway signaling system using continuous wireless communication to manage train spacing and driverless operation safely.\",\"zh-TW\":\"透過高頻率雙向無線通訊即時掌握列車位置與速度，實現安全縮小班距與全自動無人駕駛的現代化號誌系統。\"}},{\"term\":{\"en\":\"Wanda-Zhonghe-Shulin Line\",\"zh-TW\":\"捷運萬大中和樹林線\"},\"blurb\":{\"en\":\"A medium-capacity rapid transit line linking central Taipei with Yonghe, Zhonghe, Tucheng, and Shulin in New Taipei City.\",\"zh-TW\":\"連結台北市中正萬華區與新北市永和、中和、土城及樹林區的中運量捷運路線。\"}}],\"sources\":[{\"name\":\"中央社 CNA\",\"url\":\"https://www.cna.com.tw/news/aloc/202611260184.aspx\"},{\"name\":\"聯合新聞網 UDN\",\"url\":\"https://udn.com/news/story/7323/9904312\"}],\"imageUrl\":\"/covers/live/live-taiwan-157-taipei-metro-wandaline-phase-1-dynamic-testing.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Taipei Metro Wanda Line Phase 1 Begins Full-Line Dynamic Train Testing\",\"zh-TW\":\"相關封面圖：台北捷運萬大線第一期啟動全線動態測試 朝2027年通車目標邁進\"},\"isHeadline\":false,\"isPopular\":true,\"trustScore\":90,\"trustBreakdown\":{\"crossCorroboration\":23,\"outletReputation\":23,\"recencyClarity\":22,\"sourceDiversity\":22},\"publishedAt\":\"2026-11-27T17:45:24.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":23,\"D2\":22,\"D3\":22,\"D4\":22,\"D5\":23,\"total\":22},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"
