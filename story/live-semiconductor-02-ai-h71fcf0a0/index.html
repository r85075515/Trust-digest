not coming back with him.\nWhat happened\nNvidia restored Huang to all his duties on November 23, and international markets and Taiwan stocks rallied in celebration, Taiwan's Central News Agency reported. Three senior semiconductor executives told CNA in telephone interviews that relations between Taiwan supply-chain firms and Nvidia are stabilising. But they said handshake deals and circular financing in AI will face tighter constraints, and that US regulation of the AI industry will not loosen because Huang has returned. TechNews carried the same account.\nWhy it matters\nThe return matters because Huang is the face of the AI chip boom, and his restoration steadied a supply chain that runs heavily through Taiwan. The executives' warning matters just as much: if circular financing — in which AI firms fund each other's purchases — faces tighter scrutiny, the cheap capital that fuelled the AI build-out may get more expensive, even as the rally celebrates Huang's return.\nSources agree / disagree\nCentral News Agency and TechNews agree on the core account: Huang's duties were restored on November 23, markets rallied, and three executives said supply-chain ties are stabilising while financing faces tighter constraints. Neither outlet in the material explains why Huang's duties were suspended in the first place, so that part of the story is missing from both. Trust label: Two-source agreement — Two Taiwan outlets report the same account from the same executive interviews.\nStill uncertain\nThe material never says why Huang was removed from his duties, when that happened, or what the restoration process involved. The three executives are unnamed, and no figures are given for the market rally or for the scale of circular financing. Until Nvidia or regulators say more, the reasons behind the episode remain unexplained."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-02-ai-h71fcf0a0\",\"category\":\"semiconductor\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-semiconductor-02-ai-h71fcf0a0.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 黃仁勳回歸輝達　供應鏈：AI循環融資受約束監管不鬆手\",\"zh-TW\":\"相關封面圖：黃仁勳回歸輝達　供應鏈：AI循環融資受約束監管不鬆手\"},\"publishedAt\":\"2026-11-24T04:30:17.000Z\",\"title\":{\"en\":\"Jensen Huang Returns to Nvidia as Supply Chain Braces for Tighter AI Finance Rules\",\"zh-TW\":\"黃仁勳（Jensen Huang）回歸輝達（NVIDIA），供應鏈預期人工智慧循環融資監管趨緊\"},\"summary\":{\"en\":\"Nvidia restored Jensen Huang to all his duties on November 23, sending international and Taiwan stocks rallying in celebration. Three semiconductor executives told Taiwan's Central News Agency that ties between Taiwan suppliers and Nvidia are stabilising, but handshake deals and circular AI financing will face tighter constraints. US regulation of AI will not loosen, they said.\",\"zh-TW\":\"輝達（NVIDIA）23 日恢復黃仁勳（Jensen Huang）全部職務，國際股市與台股同步上演慶祝行情。3 名半導體高階主管接受中央社（CNA）訪問表示，台灣供應鏈廠商與輝達的關係回穩，但「握手交易」與人工智慧「循環融資」將更受約束，美國對人工智慧產業的監管不會因黃仁勳回鍋而鬆手。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"黃仁勳（Jensen Huang）回歸輝達（NVIDIA），市場以慶祝行情迎接，但供應鏈同時發出警告。輝達 23 日恢復黃仁勳全部職務，然而半導體主管表示，寬鬆的交易方式不會隨他一起回來。\\n發生了什麼事\\n據中央社（CNA）報導，輝達（NVIDIA）23 日恢復黃仁勳（Jensen Huang）全部職務，國際股市與台股同步上演慶祝行情。3 名半導體高階主管接受中央社（CNA）電話訪問表示，台灣供應鏈廠商與輝達的關係回穩，但「握手交易」與人工智慧「循環融資」將更受約束，美國對人工智慧產業的監管不會因黃仁勳回鍋而鬆手。科技新報（TechNews）亦有相同報導。\\n為什麼重要\\n黃仁勳回歸值得注意，因為他是人工智慧晶片熱潮的代表人物，他的復職穩定了高度依賴台灣的供應鏈。主管們的警告同樣重要：若人工智慧業者間互相出資購貨的循環融資面臨更嚴格的審查，支撐人工智慧建設的廉價資金可能變得更昂貴，即使市場正為黃仁勳回歸而慶祝。\\n來源異同\\n中央社（CNA）與科技新報（TechNews）對核心事實一致：黃仁勳 23 日恢復職務、市場上漲、3 名主管表示供應鏈關係回穩，但融資將更受約束。兩家媒體均未說明黃仁勳職務遭停的原因，這部分內容在素材中付之闕如。信任標籤：2源一致——兩家台灣媒體報導內容一致，均引述同一批高階主管訪問。\\n仍不確定\\n素材從未說明黃仁勳職務遭停的原因、何時發生，也未說明恢復職務的程序。3 名主管均未具名，市場漲幅與循環融資的規模也沒有數字。在輝達（NVIDIA）或監管機關進一步說明前，整起事件的來龍去脈仍不清楚。\"},\"sources\":[{\"name\":\"TechNews 科技新報\",\"url\":\"https://technews.tw/2026/11/24/jensen-huang-returns-supply-chain-ai-circular-financing-tighter-constraints-us-regulation-strict/\"},{\"name\":\"中央社-產經證券\",\"url\":\"https://www.cna.com.tw/news/afe/202611240070.aspx\"}],\"disagreements\":null,\"trustScore\":64,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":19,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"semiconductor\",\"live-ingest\",\"technews-科技新報\",\"中央社-產經證券\"],\"glossary\":[{\"term\":{\"en\":\"Jensen Huang\",\"zh-TW\":\"黃仁勳（Jensen Huang）\"},\"blurb\":{\"en\":\"Head of Nvidia, restored to all his duties on November 23.\",\"zh-TW\":\"輝達負責人，11 月 23 日恢復全部職務。\"}},{\"term\":{\"en\":\"Nvidia\",\"zh-TW\":\"輝達（NVIDIA）\"},\"blurb\":{\"en\":\"American AI chipmaker at the centre of the story.\",\"zh-TW\":\"美國人工智慧晶片大廠，本案主角企業。\"}},{\"term\":{\"en\":\"Central News Agency (CNA)\",\"zh-TW\":\"中央社（CNA）\"},\"blurb\":{\"en\":\"Taiwan's national news agency, which interviewed the executives.\",\"zh-TW\":\"台灣通訊社，訪問高階主管的出處。\"}},{\"term\":{\"en\":\"TechNews\",\"zh-TW\":\"科技新報（TechNews）\"},\"blurb\":{\"en\":\"Taiwanese technology news outlet that carried the same account.\",\"zh-TW\":\"台灣科技媒體，報導相同內容的出處。\"}},{\"term\":{\"en\":\"Circular financing\",\"zh-TW\":\"循環融資（Circular financing）\"},\"blurb\":{\"en\":\"An AI-industry financing arrangement named in the reports, said to face tighter constraints.\",\"zh-TW\":\"報導提及的人工智慧產業融資模式，據稱將更受約束。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-semiconductor-02-ai-h71fcf0a0/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:descri
