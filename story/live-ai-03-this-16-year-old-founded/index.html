s and its military allies, judged by a single metric: 'cost per kill.' The Wired article URL identifies the venture as Polemos.\n\nWhat happened\nDandzbergs left school as a teenager to enter Y Combinator, one of the best-known startup accelerators. His company is building a new breed of missile, and its pitch is efficiency: delivering lethal force at the lowest possible cost per kill for the US and allied militaries. The feed summary gives no technical details of the missile, no funding figures, and no customer names.\n\nWhy it matters\nA 16-year-old founder entering the weapons business through a mainstream accelerator is a sharp test of where Silicon Valley draws its lines. The 'cost per kill' framing turns lethality into a unit-economics problem, which is exactly the language venture investors understand — and exactly the language critics will seize on. If the venture gains traction, it will force a public argument about how far AI-era defence startups should go.\n\nSources agree-disagree\nOnly Wired has reported this so far in the feed, so no second outlet confirms the details. There are no numeric or name conflicts in the material available; the gap is corroboration, not contradiction.\n\nStill uncertain\nThe feed gives no missile specifications, range, guidance method, funding amount, valuation, or delivery timeline. It does not say whether any military customer has signed on, what stage testing has reached, or how old Dandzbergs was when he founded the company. All of those points need the full Wired report or further coverage.\n\nTrust label: Single source — one Wired report with no independent corroboration in the feed."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-ai-03-this-16-year-old-founded\",\"category\":\"ai\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-ai-03-this-16-year-old-founded.jpg\",\"imageAlt\":{\"en\":\"Cover related to: This 16-Year-Old Founded an AI
