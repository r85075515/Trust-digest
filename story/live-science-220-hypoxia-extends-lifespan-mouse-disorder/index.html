",\"title\":{\"en\":\"Reduced Oxygen Air Triples Lifespan in Mice With Neurological Disorder\",\"zh-TW\":\"降低氧氣濃度使腦部病變小鼠壽命增至三倍 研究登新期\"},\"summary\":{\"en\":\"Researchers at Gladstone Institutes reported in late November 2026 that breathing lower-oxygen air tripled survival in mice with a genetic motor-neuron disorder linked to protein stress. The key takeaway is promising preclinical evidence for oxygen-modulation strategies, though human proof is pending.\",\"zh-TW\":\"格拉德斯通研究所（Gladstone Institutes）於2026年11月下旬發布研究指出，呼吸較低氧氣濃度的空氣使罹患遺傳性運動神經元病變小鼠的存活時間增至三倍。關鍵結論：低氧調控在動物實驗展現潛力，但人體療效仍待驗證。\"},\"body\":{\"en\":\"「What happened」 In late November 2026, ScienceDaily highlighted findings from Gladstone Institutes showing that mice with a genetic disorder causing motor neuron degeneration lived three times longer when breathing air with reduced oxygen levels.\\n「Why it matters」 Excess oxygen can worsen cellular stress in certain mitochondrial and neurological disorders, so testing controlled hypoxia helps clarify how oxygen levels interact with protein quality control.\\n「Source differences」 ScienceDaily's November 25 release summarizes the Gladstone Institutes findings on motor neuron degeneration and oxygen levels, while longevity and rare-disease summaries note the mouse-model limitation and earlier mechanistic work.\\n「Still uncertain」 Whether controlled hypoxia or oxygen-mimicking drugs can safely benefit human patients with neurological or mitochondrial diseases remains unproven.\\nTrust label: Single source Based primarily on the November 25 ScienceDaily release summarizing Gladstone Institutes findings.\",\"zh-TW\":\"「發生了什麼事」2026年11月下旬，ScienceDaily發布格拉德斯通研究所（Gladstone Institutes）研究摘要，指出讓罹患導致運動神經元退化遺傳疾病的小鼠呼吸較低氧氣濃度的空氣，其存活時間達到原本的三倍。\\n「為什麼重要」對部分粒線體與神經退化疾病而言，過高氧氣可能加劇細胞壓力；探討調控氧氣濃度的機制，有助理解細胞蛋白質品質控管與氧氣的關聯。\\n「來源異同」ScienceDaily於11月25日刊登的報導聚焦小鼠呼吸低氧空氣後存活期延長的現象，相關摘要亦提醒目前結果來自小鼠模型，尚不能直接等同人體療效。\\n「仍不確定」低氧調控或模擬低氧的藥物在人體神經或粒線體疾病中的安全性與實際療效，仍需進一步研究驗證。\\nTrust label: Single source 主要依據11月25日ScienceDaily發布的格拉德斯通研究所研究摘要。\"},\"glossary\":[{\"term\":{\"en\":\"Hypoxia\",\"zh-TW\":\"低氧\"},\"blurb\":{\"en\":\"State in which oxygen availability or tissue oxygen levels are lower than normal.\",\"zh-TW\":\"氧氣供應或組織氧濃度低於正常基準的狀態。\"}},{\"term\":{\"en\":\"Motor Neuron\",\"zh-TW\":\"運動神經元\"},\"blurb\":{\"en\":\"Nerve cells that transmit signals from the brain and spinal cord to control muscle movement.\",\"zh-TW\":\"負責將大腦與脊髓訊號傳遞至肌肉、調控運動功能的神經細胞。\"}},{\"term\":{\"en\":\"Mitochondrial Disorder\",\"zh-TW\":\"粒線體疾病\"},\"blurb\":{\"en\":\"Genetic or cellular condition affecting energy production inside cells' mitochondria.\",\"zh-TW\":\"影響細胞內粒線體能量產生與代謝運作的遺傳或細胞功能異常。\"}}],\"sources\":[{\"name\":\"ScienceDaily\",\"url\":\"https://www.sciencedaily.com/releases/2026/11/261125045304.htm\"},{\"name\":\"Masters of Longevity\",\"url\":\"https://www.masters-of-longevity.com/article/breathing-less-oxygen-tripled-lifespan-in-mice-with-a-deadly-brain-disor-b72bf8e0\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"Reduced Oxygen Air Triples Lifespan in Mice With Neurological Disorder\",\"zh-TW\":\"降低氧氣濃度使腦部病變小鼠壽命增至三倍 研究登新期\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":74,\"trustBreakdown\":{\"crossCorroboration\":16,\"outletReputation\":21,\"recencyClarity\":22,\"sourceDiversity\":15},\"publishedAt\":\"2026-11-27T20:21:08.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":20,\"D2\":18,\"D3\":20,\"D4\":17,\"D5\":19,\"total\":19},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"can
