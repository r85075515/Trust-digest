ts require cutting absolute emissions from operations and electricity use — Scope 1 and Scope 2 — by 42 percent by fiscal year 2031 against a 2025 baseline, according to Trellis.\n\nWhat happened\nTrellis reports that Workday's second round of science-based targets tightens the screws after a mixed first round: two of three 2020 pledges met. The new commitments span most of the company's carbon footprint, with the headline number a 42 percent absolute cut in operational and electricity emissions within six years.\n\nWhy it matters\nCorporate climate pledges are entering their second exam cycle. Workday passed two of three last time; the new bar is steeper and sooner. The era of vague long-term promises is giving way to scorecards — and investors and employees can now grade the homework.\n\nSources agree / disagree\nTrellis is the only outlet in this cluster covering the Workday story. A second item from Science about robot umpires revolutionizing baseball is an unrelated feed mix-in, not a second source on Workday.\n\nStill uncertain\nThe snippet does not detail Scope 3 targets or the fate of the one unmet 2020 pledge; verify on the publisher's page before citing specifics."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-energy-01-inside-workday-s-second-\",\"category\":\"energy\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"publishedAt\":\"2026-10-22T21:59:31.000Z\",\"title\":{\"en\":\"Workday Launches Second Round of Science-Based Climate Targets\",\"zh-TW\":\"Workday：2020 年三項承諾達標兩項，啟動第二輪科學減碳目標\"},\"summary\":{\"en\":\"Workday has adopted a second round of science-based climate targets after meeting two of three pledges from 2020: cut absolute Scope 1 and 2 emissions 42% by fiscal 2031 versus a 2025 baseline. Trellis is the sole outlet on this story. Takeaway: corporate climate pledges are entering their second exam — and the bar just got higher.\",\"zh-TW\":\"Workday 啟動第二輪減碳目標：2031 財年前範疇一、二絕對排放較 2025 年減 42%，此前三項承諾達標兩項。takeaway：企業減碳進入第二輪驗收，這次標準更高。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"企業軟體公司 Workday 在 2020 年三項減碳承諾中達標兩項後，啟動第二輪溫室氣體減排承諾，覆蓋其大部分碳足跡。\\n發生了什麼事\\n根據 Trellis 報導，新一輪近期目標要求以 2025 年為基準，到 2031 財年將營運與用電的絕對碳排放（範疇一＋範疇二）削減 42%。\\n為什麼重要\\n企業減碳承諾進入第二輪驗收：上次三項過兩項，這次標準更高、期限更近。喊口號的時代過了，現在看的是達標率——投資人和員工都可以打分數了。\\n來源異同\\n同批只有 Trellis 報導 Workday 本則；Science 科學新聞同批另有一則「機器人主審」棒球科技新聞，與本則無關。信任標籤：僅1源。\\n仍不確定\\n來源摘要未提範疇三目標，也沒說 2020 年沒達標的那一項後續如何；引用細節前請查閱完整報導。\"},\"sources\":[{\"name\":\"Trellis\",\"url\":\"https://trellis.net/article/workday-new-science-based-targets/\"},{\"name\":\"Science 科學新聞\",\"url\":\"https://www.science.org/content/article/inside-science-robo-ump-revolutionizing-baseball\"}],\"disagreements\":null,\"trustScore\":62,\"trustBreakdown\":{\"sourceDiversity\":13,\"outletReputation\":10,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"energy\",\"live-ingest\",\"trellis\",\"science-科學新聞\"],\"glossary\":[{\"term\":{\"en\":\"Workday\",\"zh-TW\":\"Workday\"},\"blurb\":{\"en\":\"Enterprise software company adopting new climate targets.\",\"zh-TW\":\"企業軟體公司，啟動第二輪減碳目標。\"}},{\"term\":{\"en\":\"Trellis\",\"zh-TW\":\"Trellis\"},\"blurb\":{\"en\":\"Sustainability news outlet that reported the targets.\",\"zh-TW\":\"報導減碳目標的永續新聞媒體。\"}},{\"term\":{\"en\":\"Scope 1 and 2\",\"zh-TW\":\"範疇一與範疇二\"},\"blurb\":{\"en\":\"Direct emissions and emissions from purchased electricity.\",\"zh-TW\":\"直接排放與外購電力排放。\"}},{\"term\":{\"en\":\"Science-based targets\",\"zh-TW\":\"科學基礎減量目標\"},\"blurb\":{\"en\":\"Emissions targets aligned with climate science.\",\"zh-TW\":\"依氣候科學設定的減排目標。\"}}],\"imageUrl\":\"/covers/live/live-energy-01-inside-workday-s-second-.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Workday Launches Second Round of Science-Based Climate Targets\",\"zh-TW\":\"相關封面圖：Workday：2020 年三項承諾達標兩項，啟動第二輪科學減碳目標\"}}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width
