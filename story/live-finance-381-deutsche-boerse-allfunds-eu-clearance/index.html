rse Group's planned acquisition of Allfunds Group, following the joint acquisition agreement announced on Jan. 21, 2026. Regulators concluded that the deal does not raise competition concerns in fund distribution management or fund dealing services. Reuters reported the transaction size at approximately 5.35 billion EUR, while Deutsche Börse noted that Allfunds held 1.76 trillion EUR in assets under administration (AuA) as of Dec. 31, 2025, spanning more than 1,400 fund partners and over 900 distributors across 66 countries. The transaction has not yet closed and remains subject to additional regulatory clearances and sanction by the competent English court of a scheme of arrangement, with completion now expected in the first quarter of 2027.\n\nWhy it matters\nUnconditional Phase I clearance removes a major regulatory hurdle for Deutsche Börse's pan-European fund infrastructure expansion without imposing remedies, advancing the deal toward its expected first-quarter 2027 closing.\n\nSource differences\nDeutsche Börse Group's official press release carries the title \"Deutsche Börse Group Receives Unconditional Clearance of Allfunds Acquisition from European Commission\" and sets out the Phase I clearance, Jan. 21, 2026 joint announcement reference, 1.76 trillion EUR AuA figure as of Dec. 31, 2025, network scale across over 1,400 fund partners and more than 900 distributors in 66 countries, and expected Q1 2027 completion alongside UK court scheme sanction and other approvals. Reuters publishes the report under the title \"Deutsche Boerse wins EU antitrust approval for Allfunds acquisition\" and reports the deal value at about 5.35 billion EUR along with the competition assessment on fund distribution management and fund dealing services.\n\nStill uncertain\nThe exact timeline for remaining supervisory clearances, the scheduled date for English court sanction of the scheme of arrangement, and the precise closing date within the first quarter of 2027 remain unconfirmed.\n\nTrust label: Multi-source agreement — Combining Deutsche Börse Group's official clearance announcement with Reuters reporting corroborates the unconditional Phase I approval and pending closing conditions."])</script><script>self.__next_f.push([1,"11:T8ce,"])</script><script>self.__next_f.push([1,"「發生了什麼事」\n2026 年 11 月 27 日，歐洲聯盟執行委員會（European Commission）在第一階段（Phase I）審查後，無條件核准德意志交易所集團（Deutsche Börse Group）收購基金交易平台 Allfunds Group 的計畫；雙方曾於 2026 年 1 月 21 日聯合宣布此收購協議。歐盟執委會認定該交易在基金分銷管理與基金交易服務市場不會引發競爭疑慮。Reuters 報導交易規模約 53.5 億歐元；德意志交易所集團說明，截至 2025 年 12 月 31 日，Allfunds 管理資產規模（AuA）達 1.76 兆歐元，連結逾 1,400 家基金夥伴與 900 多家分銷商，橫跨 66 個國家。本案尚未完成交割，仍須取得其他監管機關核准以及英國法院對安排計畫（scheme of arrangement）的批准，目前預計於 2027 年第一季完成。\n\n「為什麼重要」\n無條件通過第一階段審查意味著此交易未遭附加競爭救濟條件，為德意志交易所集團整合跨境基金交易與分銷基礎設施掃除一項重要監管障礙，使交易朝 2027 年第一季交割目標推進。\n\n「來源異同」\nDeutsche Börse Group 官方新聞稿標題為「Deutsche Börse Group Receives Unconditional Clearance of Allfunds Acquisition from European Commission」，載明 Phase I 無條件核准、2026 年 1 月 21 日聯合公告脈絡、截至 2025 年 12 月 31 日的 1.76 兆歐元管理資產規模、連結逾 1,400 家基金夥伴與 900 多家分銷商及橫跨 66 國的業務規模，並說明交易尚未完成，仍待其他監管核准與英國法院安排計畫批准，預計 2027 年第一季完成；Reuters 報導標題為「Deutsche Boerse wins EU antitrust approval for Allfunds acquisition」，記載交易規模約 53.5 億歐元，並說明歐盟執委會對基金分銷管理與基金交易服務市場競爭疑慮的評估。\n\n「仍不確定」\n其餘監管機關核准的具體時程、英國法院審理並批准安排計畫的日期，以及 2027 年第一季內確切的交割日期尚待明朗。\n\nTrust label: Multi-source agreement — 結合德意志交易所集團官方核准公告與 Reuters 獨立報導，相互印證無條件通過 Phase I 審查及交易尚未交割的前提。"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-381-deutsche-boerse-allfunds-eu-clearance\",\"category\":\"finance\",\"title\":{\"en\":\"European Commission Clears Deutsche Börse Acquisition of Allfunds Unconditionally\",\"zh-TW\":\"歐盟執委會無條件核准德意志交易所收購 Allfunds 計畫\"},\"summary\":{\"en\":\"The European Commission granted unconditional Phase I antitrust clearance on Nov. 27, 2026, for Deutsche Börse's roughly 5.35 billion EUR acquisition of Allfunds, though closing remains pending until Q1 2027.\",\"zh-TW\":\"歐盟執委會於 2026 年 11 月 2
