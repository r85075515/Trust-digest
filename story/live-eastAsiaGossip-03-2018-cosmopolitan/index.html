 deeply inappropriate to use whether women have children as a political attack and asking him on camera, \"What are you doing?\" Television host Sandy Wu also spoke out. Singer Jacky Wu, by contrast, publicly defended Lo, calling the episode \"what democracy looks like\" and saying he stays out of politics.\nWhy it matters\nJudging women leaders by whether they have children turns a private matter into a public weapon, and the backlash shows where the line now sits in Taiwanese public debate. The story is not about Lo's musical legacy but about whether that kind of remark still passes as acceptable commentary.\nSources agree / disagree\nLiberty Times, ETtoday, and Yahoo News agree on what Lo said and on the split reaction — criticism from Chang, Nifeiya, and Sandy Wu, and support from Jacky Wu. Trust label: Multi-source agreement — three outlets align on the remarks and the reactions.\nStill uncertain\nThe full context of Lo's radio remarks is not in the available summaries, and whether Lo himself has responded to the criticism has not been reported."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-eastAsiaGossip-03-2018-cosmopolitan\",\"category\":\"eastAsiaGossip\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-eastAsiaGossip-03-2018-cosmopolitan.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Lo Ta-yu sparks backlash after remarks on childless women leaders\",\"zh-TW\":\"相關封面圖：羅大佑點名未生子言論引風波\"},\"publishedAt\":\"2026-11-12T08:33:44.000Z\",\"title\":{\"en\":\"Lo Ta-yu Sparks Backlash After Remarks on Childless Women Leaders\",\"zh-TW\":\"羅大佑點名蔡英文等人未生子引風波\"},\"summary\":{\"en\":\"Music legend Lo Ta-yu sparked a backlash after singling out former president Tsai Ing-wen, vice president Hsiao Bi-khim, and former Control Yuan president Chen Chu on a radio show, noting none has children and questioning their care for the next generation. Critics fired back; Jacky Wu defended him. Watch for Lo's response next.\",\"zh-TW\":\"「音樂教父」羅大佑（Lo Ta-yu）在廣播節目點名蔡英文、蕭美琴與陳菊等女性政治人物未生子，質疑她們對下一代的關心程度，引發輿論譁然。張雅琴、妮妃雅等人強烈反擊，吳宗憲則公開力挺。接下來看羅大佑本人是否回應。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「音樂教父」羅大佑（Lo Ta-yu）近日在廣播節目點名前總統蔡英文（Tsai Ing-wen）、副總統蕭美琴（Hsiao Bi-khim）及前監察院長陳菊（Chen Chu）等女性政治人物，提及她們沒有子女，質疑她們對下一代的關心程度，引發輿論譁然。\\n發生了什麼事\\n自由時報報導，羅大佑在廣播節目中質疑蔡英文、蕭美琴與陳菊「都未生子」，言論引爆風波。變裝皇后妮妃雅（Nifeiya）反擊，稱別拿女人子宮評分。資深主播張雅琴（Chang Ya-chin）在節目中火力全開，批評羅大佑拿女性生育與否進行政治攻擊極不恰當，對著鏡頭隔空喊話：「你在做什麼呢？」主持人吳姍儒（Sandy Wu）也發聲。吳宗憲（Jacky Wu）則公開力挺羅大佑，稱「這就是民主」，並表示自己不碰政治。\\n為什麼重要\\n拿女性生育與否評斷政治人物，是把私領域當成公共攻擊的武器；這場論戰的焦點不在羅大佑的音樂地位，而在這種言論是否逾越了公共討論的底線。\\n來源異同\\n自由時報、ETtoday、Yahoo 新聞說法一致：羅大佑在廣播節目發表言論，引發批評與力挺兩派反應。信任標籤：多源一致——三家媒體對言論內容與各方反應的報導一致。\\n仍不確定\\n羅大佑發言的完整上下文未見於摘要；他本人是否回應批評，尚無報導。\"},\"sources\":[{\"name\":\"自由時報\",\"url\":\"https://ent.ltn.com.tw/news/breakingnews/5638610\"},{\"name\":\"ETtoday 影劇\",\"url\":\"https://star.ettoday.net/news/3270958\"},{\"name\":\"Yahoo TW 娛樂\",\"url\":\"https://tw.news.yahoo.com/%E7%BE%85%E5%A4%A7%E4%BD%91%E6%89%B9%E8%94%A1%E8%8B%B1%E6%96%87%E7%AD%89%E4%BA%BA-%E6%B2%92%E7%94%9F%E5%B0%8F%E5%AD%A9-%E8%A2%AB%E7%BD%B5%E7%BF%BB-%E5%90%B3%E5%A7%8D%E5%84%92%E7%99%BC%E8%81%B2%E4%BA%86-080002184.html\"},{\"name\":\"Google News\",\"url\":\"https://news.google.com/rss/articles/CBMiZ0FVX3lxTE1oWlJiSFVsSWhfVVc1Ul9NY2tqd01lTnpNVkNVYmJfMVhqQUwycGtLMV9QR3g2c2duZzRrZ2JpX0wyY0VfUXRDS2V0SUlHQVFYcnFCcWJXMGZDdWtoQ1pTVV9JSEx6Q28?oc=5\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":25,\"outletReputation\":17,\"crossCorroboration\":25,\"recencyClarity\":25},\"tags\":[\"eastAsiaGossip\",\"live-ingest\",\"region:tw\",\"自由時報\",\"ettoday-影劇\",\"yahoo-tw-娛樂\"],\"region\":\"tw\",\"glossary\":[{\"term\":{\"en\":\"Lo Ta-yu\",\"zh-TW\":\"羅大佑\"},\"blurb\":{\"en\":\"Taiwanese singer-songwriter known as the godfather of Taiwanese music.\",\"zh-TW\":\"台灣資深歌手，有「音樂教父」之稱，本次言論風波主角。\"}},{\"term\":{\"en\":\"Chang Ya-chin\",\"zh-TW\":\"張雅琴\"},\"blurb\":{\"en\":\"Veteran Taiwanese news anchor who s
