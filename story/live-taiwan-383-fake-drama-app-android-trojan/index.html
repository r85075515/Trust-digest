as Huangguo and Hongguo. Once installed, the app displays a fake Google Play update prompt requesting VPN activation to bypass built-in security checks, then tricks users into granting accessibility permissions. Under a black screen cover, the trojan grants itself 12 system permissions within seconds—covering SMS, files, camera, microphone, and device administrator—allowing overseas operators to remotely drain online bank accounts and purchase game points. Over the past two months, police logged 100 cases totaling 17.42 million TWD in losses across 22 financial institutions, including 18 banks, one securities firm, and three e-payment providers.\n\nWhy it matters\nThe attack exploits sideloaded Android packages and accessibility abuse to take full remote control of victims' phones, bypassing traditional SMS one-time password defenses across two dozen Taiwanese financial institutions.\n\nSource differences\nLiberty Times reported the CIB statistics and technical attack chain under the headline \"偽冒黃果、紅果等中國看片網站 App藏木馬 境外遙控手機 受害百件遭盜千萬\". Global Views Monthly published the headline \"18間網銀遭盜轉千萬原因揭曉！假黃果、紅果追劇App遭植入木馬惡意程式「全是安卓系統」\", emphasizing that all affected devices run Android.\n\nStill uncertain\nPolice have not yet disclosed the identities or overseas locations of the criminal syndicate members, nor how much of the 17.42 million TWD stolen funds has been frozen or recovered.\n\nTrust label: Multi-source agreement — Independent crime reporting by Liberty Times and Global Views Monthly align on the CIB investigation findings and Android malware mechanism."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-383-fake-drama-app-android-trojan\",\"category\":\"taiwan\",\"title\":{\"en\":\"Fake Chinese Short-Drama Apps Embed Android Trojan in Taiwan, Stealing 17.42 Million TWD\",\"zh-TW\":\"偽冒中國短劇 App 藏安卓木馬肆虐台灣 逾百人受害遭盜 1742 萬元\"},\"summary\":{\"en\":\"Taiwan's Criminal Investigation Bureau reported that Android malware disguised as Chinese short-drama apps has hit 100 victims over two months, stealing 17.42 million TWD across 22 financial institutions.\",\"zh-TW\":\"台灣刑事局統計，不法集團偽冒「黃果」、「紅果」等中國看片短劇網站推出安卓（Android）惡意安裝檔，誘騙民眾開啟 VPN 與無障礙權限後從境外遠端遙控手機盜轉存款，近兩個多月已受理 100 件報案、財損達 1,742 萬元新台幣，波及 22 家金融機構客戶。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n台灣內政部警政署刑事警察局揭露，有不法集團偽冒「黃果」、「紅果」、「抖陰」等中國看片網站，將 Android 木馬程式植入短劇 App 安裝檔。民眾下載開啟後，畫面會跳出偽冒「Google Play 更新」提示要求建立 VPN 連線以阻斷手機安全檢查，再誘導開啟無障礙權限；木馬隨即以黑屏掩護，在數十秒內自行取得簡訊、檔案、相機、麥克風與裝置管理員等 12 類權限，供境外 IP 遠端操作網銀轉帳或購買遊戲點數。刑事局統計，近兩個多月已受理 100 案、財損 1,742 萬元新台幣，受害者涵蓋 18 家銀行、1 家證券商與 3 家電子支付共 22 家金融機構客戶。\\n\\n「為什麼重要」\\n此類新型態手機「奪舍」木馬利用安卓側載安裝檔與無障礙權限漏洞，能直接攔截簡訊驗證碼並遠端操作網銀，對未經官方商店下載 App 的手機用戶構成高度資安與財務威脅。\\n\\n「來源異同」\\n自由時報以標題「偽冒黃果、紅果等中國看片網站 App藏木馬 境外遙控手機 受害百件遭盜千萬」詳列 100 件報案數、1,742 萬元財損、22 家金融機構分布及 12 類授權技術手法；遠見雜誌以標題「18間網銀遭盜轉千萬原因揭曉！假黃果、紅果追劇App遭植入木馬惡意程式「全是安卓系統」」報導，聚焦受害設備全數為 Android 系統的風險特徵。\\n\\n「仍不確定」\\n警方目前仍在擴大偵辦中，尚未公布境外機房主嫌身分及已成功圈存追回的贓款比例。\\n\\nTrust label: Multi-source agreement — 自由時報與遠見雜誌皆引述刑事局偵辦說明，對木馬攻擊手法與受害規模記載一致。\"},\"glossary\":[{\"term\":{\"en\":\"Android Accessibility Service\",\"zh-TW\":\"Android 無障礙權限\"},\"blurb\":{\"en\":\"An Android system feature designed to assist users with disabilities that malware frequently abuses to read screens and simulate taps.\",\"zh-TW\":\"原為協助身心障礙者操作手機的系統功能，常遭惡意程式濫用以讀取螢幕內容並自動模擬點擊授權。\"}},{\"term\":{\"en\":\"Trojan Malware\",\"zh-TW\":\"木馬惡意程式\"},\"blurb\":{\"en\":\"Malicious software disguised as legitimate applications that grants attackers covert remote access to a device.\",\"zh-TW\":\"偽裝成正常應用程式的惡意軟體，安裝後會在背景開啟後門供駭客遠端操控設備。\"}},{\"term\":{\"en\":\"Criminal Investigation Bureau (CIB)\",\"zh-TW\":\"內政部警政署刑事警察局\"},\"blurb\":{\"en\":\"Taiwan's national law enforcement agency responsible for major criminal and cybercrime investigations.\",\"zh-TW\":\"台灣負責重大刑案、科技犯罪與電信網路詐騙偵防的最高刑事偵查機關。\"}}],\"sources\":[{\"name\":\"自由時報\",\"url\":\"https://news.ltn.com.tw/news/society/paper/1780003\"},{\"name\":\"遠見雜誌\",\"url\":\"https://www.gvm.com.tw/article/134873\"}],\"imageUrl\":\"/covers/live/live-taiwan-383-fake-drama-app-android-trojan.jpg\",\"imageAlt\":{\"en\":\"Fake Chinese Short-Drama Apps Embed Android Trojan in Taiwan, Stealing 17.42 Million TWD\",\"zh-TW\":\"偽冒中國短劇 App 藏安卓木馬肆虐台灣 逾百人受害遭盜 1742 萬元\"},\"isHeadline\":false,\"isPopular\":true,\"trustScore\":84,\"trustBreakdown\":{\"crossCorroboration\":21,\"outletReputation\":22,\"recencyClarity\":22,\"sourceDiversity\":19},\"publishedAt\":\"2026-11-28T08:34:01.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":22,\"D2\":22,\"D3\":21,\"D4\":20,\"D5\":21,\"total\":21},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-taiwan-383-fake-drama-app-android-trojan/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-taiwan-383-fake-drama-app-android-trojan/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable tru
