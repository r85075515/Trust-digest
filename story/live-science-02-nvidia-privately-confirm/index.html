d to fight smuggling. Foster is a Democrat who serves on the Committee on Science, Space, and Technology, and he represents Illinois. The feed excerpt does not name the industry group that called the measures potentially infeasible, nor does it quote Nvidia directly — the account of Nvidia's position comes through Foster's retelling of a private conversation.\n\nWhy it matters\nChip smuggling is the enforcement gap in US export controls: rules can restrict sales on paper while advanced chips still reach restricted buyers through third countries. If the largest AI chip maker privately concedes tracking is feasible, that undercuts the industry's public case against the requirement and strengthens the hand of lawmakers who want the measures written into law. It also puts Nvidia in an awkward spot, saying one thing in private and tolerating a different message in public. The practical questions — cost, reliability, who operates the tracking — are not addressed in the material available.\n\nSources agree / disagree\nThe reporting comes from a single outlet, MIT Technology Review, based on its interview with Foster. No second outlet in the material confirms Nvidia's private position, and Nvidia itself has not been quoted directly.\nTrust label: Single source — one outlet's interview account, with the key claim relayed second-hand through a lawmaker.\n\nStill uncertain\nThe feed excerpt is short, so the scope of the tracking measures, the timeline, and the identity of the industry group are all unclear. It is not known whether Nvidia's representatives spoke for the company as a whole, what conditions they attached to feasibility, or whether Foster's account matches what was said. The public record shows only that an industry group disputes feasibility; the private concession rests on one interview."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-science-02-nvidia-privately-confirm\",\"category\":\"science\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-science-02-nvidia-privately-confirm.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Nvidia privately confirmed it could track chips to fight smuggling, even as industry publicly questioned feasibility\",\"zh-TW\":\"相關封面圖：英偉達私下證實，它可以追蹤晶片以打擊走私，儘管業界公開質疑其可行性\"},\"publishedAt\":\"2026-11-12T20:16:24.000Z\",\"title\":{\"en\":\"Nvidia Privately Told Bill Foster Chip Tracking Is Technically Possible\",\"zh-TW\":\"輝達私下向佛斯特證實：追蹤晶片防走私技術上可行\"},\"summary\":{\"en\":\"[Unconfirmed · single source] Nvidia representatives told Representative Bill Foster that tracking chips to fight smuggling is technically possible, Foster told MIT Technology Review, even as an industry group called the measures in the Chip Security Act potentially infeasible. Foster, a Democrat on the Committee on Science, Space, and Technology, described the assurance in a Thursday interview.\",\"zh-TW\":\"［未證實·單一來源］輝達代表私下告訴眾議員佛斯特，追蹤晶片防走私在技術上可行；佛斯特週四接受《麻省理工科技評論》訪問時透露此事，但有業界團體公開稱《晶片安全法》的措施可能不可行。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"輝達（Nvidia）代表私下告訴眾議員比爾·佛斯特（Bill Foster），追蹤晶片以打擊走私在技術上可行，佛斯特週四接受《麻省理工科技評論》（MIT Technology Review）訪問時這麼說；但與此同時，一個業界團體公開稱《晶片安全法》要求的措施「可能不可行」。私下的保證與公開的質疑，如今並列在檯面上。\\n\\n發生了什麼事\\n佛斯特週四接受《麻省理工科技評論》訪問時說，輝達代表表示，實施《晶片安全法》要求的反走私措施在技術上可行。這些措施能讓晶片受到追蹤，以打擊走私。佛斯特是民主黨籍眾議員，任職於科學、太空與技術委員會，代表伊利諾州。摘要沒有點名是哪個業界團體稱措施可能不可行，也沒有直接引述輝達——輝達立場的說法，是透過佛斯特轉述一場私下對話而來。\\n\\n為什麼重要\\n晶片走私是美國出口管制的執法缺口：法規可以在紙面上限制銷售，先進晶片卻仍可能經第三國流向受限買家。如果最大的 AI 晶片商私下承認追蹤可行，等於削弱業界公開反對這項要求的立場，也讓主張立法納入措施的議員更有底氣。同時這讓輝達處境尷尬：私下一個說法，公開卻容忍另一種訊息。至於成本、可靠性、由誰操作追蹤，現有素材都沒有談。\\n\\n來源異同\\n報導來自單一媒體《麻省理工科技評論》，根據該刊對佛斯特的訪問。現有素材沒有第二家媒體證實輝達的私下立場，輝達本身也沒有被直接引述。\\n信任標籤：單一來源——一家媒體的訪問報導，關鍵說法是經由議員轉述的二手消息。\\n\\n仍不確定\\n摘要很短，追蹤措施的範圍、時程、業界團體的身分都不清楚。不知道輝達代表的發言是否代表公司整體立場、他們對可行性附加了什麼條件，也不知道佛斯特的說法是否與當時對話相符。公開紀錄只顯示有業界團體質疑可行性；私下讓步的說法仰賴單一訪問。\"},\"sources\":[{\"name\":\"MIT Technology Review\",\"url\":\"https://www.technologyreview.com/2026/11/12/1148483/nvidia-chip-tracking/\"}],\"disagreements\":null,\"trustScore\":47,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":10,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"science\",\"live-ingest\",\"mit-technology-review\"],\"glossary\":[{\"blurb\":{\"en\":\"Democratic representative from Illinois who serves on the Committee on Science, Space, and Technology.\",\"zh-TW\":\"伊利諾州民主黨眾議員，任職於科學、太空與技術委員會。\"},\"term\":{\"en\":\"Bill Foster\",\"zh-TW\":\"比爾·佛斯特\"}},{\"blurb\":{\"en\":\"Technology magazine that interviewed Foster about Nvidia's private assurance.\",\"zh-TW\":\"就輝達私下保證訪問佛斯特的科技雜誌。\"},\"term\":{\"en\":\"MIT Technology Review\",\"zh-TW\":\"麻省理工科技評論\"}},{\"blurb\":{\"en\":\"Proposed US legislation calling for anti-smuggling measures, including chip tracking.\",\"zh-TW\":\"要求採取反走私措施、包括晶片追蹤的美國立法提案。\"},\"term\":{\"en\":\"Chip Security Act\",\"zh-TW\":\"晶片安全法\"}},{\"blurb\":{\"en\":\"American company that makes the AI chips at the centre of the smuggling debate.\",\"zh-TW\":\"走私爭議核心的 AI 晶片美國業者。\"},\"term\":{\"en\":\"Nvidia\",\"zh-TW\":\"輝達\"}},{\"blurb\":{\"en\":\"Technical measures to follow a chip's location or use after sale, aimed at stopping smuggling.\",\"zh-TW\":\"售後追蹤晶片位置或用途、以打擊走私的技術措施。\"},\"term\":{\"en\":\"Chip tracking\",\"zh-TW\":\"晶片追蹤\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-science-02-nvidia-privately-confirm/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\
