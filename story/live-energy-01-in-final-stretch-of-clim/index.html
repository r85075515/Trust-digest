ast year's United Nations climate gathering in Belém, Brazil, drew historic levels of Indigenous attendance, earning the nickname \"the Indigenous COP.\" The event ended in frustration and protest, with many Indigenous leaders describing it as a continuation of a long-standing pattern of exclusion from international negotiations. As this year's summit entered its final stretch, Indigenous leaders renewed the demand for lasting action, with Grist reporting their message as \"past time to turn promises into action\" and Mongabay reporting a call for lasting action in the closing days.\nWhy it matters\nLast year's record Indigenous attendance did not translate into influence, and leaders say exclusion from negotiations is the pattern, not the exception. A summit that celebrates attendance while ignoring demands risks agreements that Indigenous communities themselves reject. Takeaway: the test of COP31 is not who attends but what the final text commits to.\nSources agree / disagree\nGrist and Mongabay agree on the core event: Indigenous leaders used the summit's final stretch to demand action beyond promises. Neither outlet's short feed description supplies attendance figures or specific demands for this year's summit, so the two reports align on direction but not on detail.\nStill uncertain\nThe feed descriptions do not list the specific commitments Indigenous leaders seek, the negotiating text under discussion, or whether delegates have responded. Full reporting from both outlets is needed to judge what, if anything, changed since Belém.\nTrust label: Multi-source agreement — Two outlets report the same demand from Indigenous leaders at the summit's final stretch."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-energy-01-in-final-stretch-of-clim\",\"category\":\"energy\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-energy-01-in-final-stretch-of-clim.jpg\",\"imageAlt\":{\"en\":\"Cover related to: In final stretch of climate summit, Indigenous leaders call for lasting action\",\"zh-TW\":\"相關封面圖：在氣候高峰會的最後階段，原住民領袖呼籲採取持久行動\"},\"publishedAt\":\"2026-11-17T15:39:30.000Z\",\"title\":{\"en\":\"Indigenous Leaders at COP31 Demand Promises Turn Into Lasting Action\",\"zh-TW\":\"原住民領袖在COP31（第31屆聯合國氣候大會）要求承諾化為持久行動\"},\"summary\":{\"en\":\"Indigenous leaders at COP31 say the time has passed for promises, demanding lasting action as the climate summit enters its final stretch. Last year's Belém gathering drew record Indigenous attendance yet ended in frustration over exclusion from negotiations. The call tests whether this year's summit delivers more than words; watch the final text for binding commitments.\",\"zh-TW\":\"原住民領袖在COP31（第31屆聯合國氣候大會）表示，空洞承諾的時代已經過去，要求高峰會進入最後階段之際拿出持久行動。去年貝倫大會原住民出席人數創歷史新高，卻因被排除在談判之外而失望收場。這次呼籲考驗本屆峰會能否交出實質成果；接下來看最終文本是否納入具約束力的承諾。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"原住民領袖在COP31（第31屆聯合國氣候大會）表示，高峰會必須把承諾化為持久行動，否則又將重演去年在貝倫的失望。\\n發生了什麼事\\n去年在巴西貝倫舉行的聯合國氣候大會，原住民出席人數創歷史新高，被稱為「原住民締約方大會」。大會最終以沮喪與抗議收場，許多原住民領袖形容，這只是長期被排除在國際談判之外的模式延續。今年高峰會進入最後階段之際，原住民領袖再次要求持久行動；Grist 報導他們的訊息是「承諾轉化為行動的時機早已過去」，Mongabay 則報導他們在閉幕前夕呼籲持久行動。\\n為什麼重要\\n去年創紀錄的出席人數並未轉化為影響力，領袖們說被排除在談判之外是常態而非例外。一場高峰會若只慶祝出席人數卻忽視訴求，達成的協議可能連原住民社群自己都不接受。結論：COP31 的考驗不在誰出席，而在最終文本承諾了什麼。\\n來源異同\\nGrist 與 Mongabay 對核心事件說法一致：原住民領袖利用高峰會最後階段，要求超越承諾的行動。兩家媒體的簡短摘要都未提供今年高峰會的出席數字或具體訴求，方向一致，細節不足。\\n仍不確定\\n摘要未列出原住民領袖尋求的具體承諾、談判中的文本內容，也未說明各國代表是否回應。需要兩家媒體的完整報導，才能判斷貝倫之後究竟改變了什麼。\"},\"sources\":[{\"name\":\"Grist\",\"url\":\"https://grist.org/indigenous/indigenous-leaders-at-cop31-say-its-past-time-to-turn-promises-into-action/\"},{\"name\":\"Mongabay\",\"url\":\"https://news.mongabay.com/2026/11/in-final-stretch-of-climate-summit-indigenous-leaders-call-for-lasting-action/\"}],\"disagreements\":null,\"trustScore\":54,\"trustBreakdown\":{\"sourceDiversity\":13,\"outletReputation\":10,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"energy\",\"live-ingest\",\"grist\",\"mongabay\"],\"glossary\":[{\"term\":{\"en\":\"COP31\",\"zh-TW\":\"COP31（第31屆聯合國氣候大會）\"},\"blurb\":{\"en\":\"The 31st Conference of the Parties to the UN climate convention.\",\"zh-TW\":\"《聯合國氣候變遷綱要公約》第31次締約方會議。\"}},{\"term\":{\"en\":\"United Nations Framework Convention on Climate Change (UNFCCC)\",\"zh-TW\":\"聯合國氣候變遷綱要公約（UNFCCC）\"},\"blurb\":{\"en\":\"The UN treaty that hosts the annual COP climate summits.\",\"zh-TW\":\"主辦年度 COP 氣候高峰會的聯合國公約。\"}},{\"term\":{\"en\":\"Belém\",\"zh-TW\":\"貝倫\"},\"blurb\":{\"en\":\"Brazilian city that hosted last year's COP climate gathering.\",\"zh-TW\":\"去年氣候大會主辦城市，位於巴西。\"}},{\"term\":{\"en\":\"Indigenous leaders\",\"zh-TW\":\"原住民領袖\"},\"blurb\":{\"en\":\"Representatives of Indigenous peoples pressing for a role in climate negotiations.\",\"zh-TW\":\"要求在氣候談判中發揮作用的原住民代表。\"}},{\"term\":{\"en\":\"Grist\",\"zh-TW\":\"Grist\"},\"blurb\":{\"en\":\"One of the two outlets reporting the Indigenous leaders' COP31 demand.\",\"zh-TW\":\"報導原住民領袖 COP31 訴求的兩家媒體之一。\"}},{\"term\":{\"en\":\"Mongabay\",\"zh-TW\":\"Mongabay\"},\"blurb\":{\"en\":\"One of the two outlets reporting the Indigenous leaders' COP31 demand.\",\"zh-TW\":\"報導原住民領袖 COP31 訴求的兩家媒體之一。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-energy-01-in-final-stretch-of-clim/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news diges
