Warraq district of Giza at about 6:08 p.m. on Wednesday, hit a concrete barrier, overturned and exploded, engulfing the traffic around it. Egypt's Health Ministry put the toll at at least 31 dead and 21 injured — both figures preliminary — with some of the injured in critical condition with burns covering 70–80% of their bodies. The public prosecution said 27 cars and motorcycles were charred, and ordered DNA sampling to identify victims who could not be recognised.\n\nWhat happened: The tanker was privately operated, the Petroleum Ministry said. Fire crews brought the blaze under control and the Ring Road — the roughly 100-kilometre artery encircling Greater Cairo — was later reopened after the wreckage was cleared, a Health Ministry spokesman told state-linked al-Qahera News. Hundreds of residents gathered near the scene in Warraq, a densely populated district of Imbaba.\n\nWhy it matters: This is one of Egypt's deadliest road disasters in years, and it struck the capital's single most important traffic artery at the evening peak. It will intensify scrutiny of hazardous-cargo transport through dense urban corridors, of tanker maintenance and driver standards among private contractors, and of emergency response times on the Ring Road.\n\nSources agree/disagree: AP, CNN and The Times, all citing Egyptian authorities, agree on at least 31 dead and the overturn-and-fire sequence. Two points diverge: the injured count moved during the day (the Health Ministry first said 25, later 21; the prosecution's statement said 25), and the cause is contested — the prosecution's preliminary inspection says the driver lost control of the steering, while Al-Ahram, citing investigation sources, reports a high-voltage cable fell in front of the tanker. ⚠ Accounts of the cause conflict and are unconfirmed; neither version is established.\n\nStill uncertain: Whether the toll rises further (officials call it preliminary), the confirmed cause, the identities of all victims, and whether the private operator faces charges or Egypt tightens hazardous-cargo rules on urban highways.\n\nTrust label: Multi-source agreement — AP and CNN reporting converges with official Egyptian figures on the toll; the cause is presented in parallel because official accounts conflict."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"adult\":false,\"body\":{\"en\":\"$10\",\"zh-TW\":\"發生了什麼事：一輛載運石油產品與瓦斯鋼瓶的油罐車，週三（25 日）晚間約 18:08 在開羅環城公路（Ring Road）吉薩省（Giza）瓦拉克（El Warraq）區第 10 號隧道上方路段偏離車道，撞上水泥護欄後翻覆爆炸，火勢吞噬周圍車流。埃及衛生部（Ministry of Health）公布至少 31 人死亡、21 人受傷——兩數字皆為初步統計——部分傷者全身 70–80% 燒傷、情況危急。檢察機關表示共有 27 輛汽車與機車燒毀，並下令對無法辨識的罹難者採集 DNA 比對。\\n\\n為什麼重要：這是埃及近年最嚴重的道路災難之一，且發生在首都最重要的交通動脈、晚間尖峰時段。它勢必加劇對危險貨物穿越人口稠密市區的運輸規範、私人承包商油罐車維護與駕駛標準、以及環城公路緊急應變時間的檢視。石油部表示該油罐車為私人營運；消防撲滅後，環城公路已清理並重新開放（衛生部發言人向國營關係媒體 al-Qahera News 表示）。\\n\\n來源異同：美聯社（AP）、CNN 與《泰晤士報》（The Times）引述埃及官方，皆一致至少 31 死與翻覆起火的經過。兩點分歧：傷者數字當日變動（衛生部先稱 25 人、後修為 21 人；檢察機關聲明為 25 人）；成因說法衝突——檢察機關初步勘驗稱駕駛方向盤失控，《金字塔報》（Al-Ahram）引述調查消息來源則稱一條高壓電纜掉落在油罐車前方。⚠ 說法衝突，尚未證實，兩種版本皆未定案。\\n\\n仍不確定：死亡人數是否再上升（官方稱初步數字）、確切成因、全部罹難者身分，以及私人營運商是否面臨起訴、埃及是否收緊市區危險貨物運輸規範。\"},\"category\":\"international\",\"disagreements\":null,\"glossary\":[{\"blurb\":{\"en\":\"The roughly 100-km highway encircling Greater Cairo and linking the Cairo, Giza and Qalyubia governorates; the tanker exploded on it above Tunnel 10.\",\"zh-TW\":\"全長約 100 公里、環繞大開羅並連接開羅、吉薩與蓋盧比亞三省的公路；油罐車在其第 10 號隧道上方路段爆炸。\"},\"term\":{\"en\":\"Ring Road (Cairo)\",\"zh-TW\":\"開羅環城公路（Ring Road）\"}},{\"blurb\":{\"en\":\"The densely populated Giza district where the tanker overturned and caught fire on Wednesday evening.\",\"zh-TW\":\"吉薩省人口稠密的城區，油罐車週三晚間在此翻覆起火。\"},\"term\":{\"en\":\"El Warraq\",\"zh-TW\":\"瓦拉克（El Warraq）\"}},{\"blurb\":{\"en\":\"Egypt's health authority, which issued the casualty figures — at least 31 dead and 21 injured, both preliminary.\",\"zh-TW\":\"發布傷亡數字的埃及衛生主管機關：至少 31 死、21 傷，皆為初步統計。\"},\"term\":{\"en\":\"Egyptian Ministry of Health\",\"zh-TW\":\"埃及衛生部\"}}],\"id\":\"live-international-26-cairo-ring-road-tanker-fire-31-dead\",\"imageAlt\":{\"en\":\"Fire on a highway at night (file image)\",\"zh-TW\":\"夜間公路火災（資料畫面）\"},\"imageUrl\":\"\",\"isHeadline\":true,\"isPopular\":true,\"publishedAt\":\"2026-11-26T05:31:19.000Z\",\"sources\":[{\"name\":\"CNN\",\"url\":\"https://www.cnn.com/2026/11/25/middleeast/cairo-egypt-tanker-fire-latam-intl?cid=external-feeds_iluminar_meta\"}],\"summary\":{\"en\":\"A fuel tanker overturned and exploded on Cairo's Ring Road in Giza's Warraq district on Wednesday evening, killing at least 31 people and injuring 21, Egyptian authorities said — one of Egypt's deadliest road disasters in years. The injured count was revised during the day, and the cause is contested: prosecutors cite a loss of steering control, while Al-Ahram sources describe a fallen high-voltage cable. ⚠ Accounts of the cause conflict and are unconfirmed.\",\"zh-TW\":\"一輛油罐車週三晚間在開羅環城公路吉薩省瓦拉克區翻覆爆炸，埃及官方稱至少 31 死、21 傷，是埃及近年最嚴重的道路災難之一。傷者數字當日曾修訂；成因說法衝突——檢方稱方向盤失控、《金字塔報》消息來源稱高壓電纜掉落。⚠ 說法衝突，尚未證實。\"},\"tags\":[],\"title\":{\"en\":\"Fuel Tanker Explodes on Cairo Ring Road: At Least 31 Dead in One of Egypt's Worst Road Disasters in Years\",\"zh-TW\":\"油罐車在開羅環城公路爆炸：至少 31 死、埃及近年最嚴重道路災難之一\"},\"trustBreakdown\":{\"crossCorroboration\":24,\"outletReputation\":23,\"recencyClarity\":24,\"sourceDiversity\":13},\"trustScore\":84}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-international-26-cairo-ring-road-tanker-fire-31-dead/
