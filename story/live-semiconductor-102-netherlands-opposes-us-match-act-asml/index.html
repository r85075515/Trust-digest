ovember 26, 2026, that the Netherlands opposes the extraterritorial reach of the proposed US Multilateral Alignment of Technology Controls on Hardware (MATCH) Act. The legislation would pressure allies to tighten export controls on semiconductor equipment to China, potentially restricting sales and servicing of ASML Holding NV's immersion deep ultraviolet (DUV) lithography systems. Sjoerdsma stated that the Dutch cabinet is coordinating with the European Commission, Germany, and France to prevent the bill from being attached to an upcoming US defense package.\n\nChina accounts for roughly one-fifth of ASML's annual revenue, and while extreme ultraviolet (EUV) tools are already barred from export to China, expanding restrictions to DUV maintenance and spare parts would directly hit European semiconductor supply chains. ASML CEO Christophe Fouquet (克里斯托夫·富凱) also warned in a separate interview that excessive export curbs risk accelerating Chinese domestic chipmaking self-reliance.\n\nReporting across Bloomberg, Taipei Times, Chosun Ilbo, and The Next Web aligns on Sjoerdsma's parliamentary remarks, the scope of the MATCH Act regarding DUV tools, and EU-level diplomatic lobbying. Coverage differs slightly in emphasis, with European tech outlets highlighting congressional defense-bill negotiations and Asian business press stressing ASML share-price volatility and Chinese equipment localization risks.\n\nWhether US lawmakers will attach the MATCH Act to final defense spending legislation or grant allied exemptions remains undecided in Congress.\n\nTrust label: Multi-source agreement — Official Dutch parliamentary statements and legislative details are corroborated across multiple international business and technology outlets."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-102-netherlands-opposes-us-match-act-asml\",\"category\":\"semiconductor\",\"title\":{\"en\":\"Netherlands Pushes Back Against Proposed US MATCH Act Curbs on ASML\",\"zh-TW\":\"荷蘭政府公開反對美國「匹配法案」加碼限制 ASML 對中出口\"},\"summary\":{\"en\":\"Dutch Foreign Trade Minister Sjoerd Sjoerdsma announced on November 26, 2026, that the Netherlands will resist the proposed US MATCH Act, warning it threatens ASML and European semiconductor competitiveness. The US bill seeks to expand allied export restrictions to cover servicing and immersion DUV lithography systems sold to China. The Dutch government is lobbying Washington to keep the measure out of upcoming defense legislation.\",\"zh-TW\":\"荷蘭外貿與發展合作部長斯約爾茲馬（Sjoerd Sjoerdsma）於 2026 年 11 月 26 日在國會表態，荷蘭政府將反對美國擬議中的《硬體技術管制多邊協調法案》（MATCH Act），警告該法案具域外管轄性質並危及艾司摩爾（ASML）營運。荷方正聯合歐盟執委會與德、法兩國遊說華府，力阻該案納入美國國防授權法案。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」荷蘭外貿與發展合作部長斯約爾茲馬（Sjoerd Sjoerdsma）於 2026 年 11 月 26 日在國會明確表示，荷蘭反對美國《硬體技術管制多邊協調法案》（MATCH Act）的域外管轄條款，直言「美國不是費爾德霍芬（ASML 總部所在地）的老大」。該法案旨在迫使盟國收緊對中半導體設備出口，恐將管制範圍擴大至艾司摩爾（ASML）浸潤式深紫外光（DUV）微影設備的銷售與售後維修服務。荷蘭內閣正聯手歐盟執委會、德國及法國進行外交遊說，力阻美方將該法案夾帶納入即將審議的美國國防法案。\\n\\n「為什麼重要」中國市場約占 ASML 年營收五分之一，在極紫外光（EUV）機台早已禁售中國的情況下，若連 DUV 機台維護與零組件供應也遭切斷，將重創歐洲最具價值科技企業的營收與研發動能。ASML 執行長富凱（Christophe Fouquet）亦警告，過度嚴苛的出口禁令反而可能刺激中國加速發展自主半導體設備供應鏈。\\n\\n「來源異同」彭博、台北時報（Taipei Times）、朝鮮日報（Chosun Ilbo）及科技媒體 The Next Web 對荷蘭部長國會發言內容、MATCH 法案針對 DUV 設備的管制方向及歐盟聯合遊說行動描述一致。各家報導側重點略有差異，歐洲媒體聚焦美國國會國防法案協商進度，亞洲財經媒體則著重分析 ASML 股價波動及中國本土設備替代效應。\\n\\n「仍不確定」美國國會最終是否會將 MATCH 法案納入國防授權法案文本，以及荷蘭政府若面對法案通過後將採取何種具體反制措施，目前仍未定案。\"},\"glossary\":[{\"term\":{\"en\":\"MATCH Act\",\"zh-TW\":\"硬體技術管制多邊協調法案\"},\"blurb\":{\"en\":\"Proposed US legislation (Multilateral Alignment of Technology Controls on Hardware Act) aimed at pressuring allies to align semiconductor export controls against China.\",\"zh-TW\":\"美國國會擬議的《硬體技術管制多邊協調法案》，旨在要求盟國同步收緊對中國的高階半導體設備出口與維修管制。\"}},{\"term\":{\"en\":\"Immersion DUV Lithography\",\"zh-TW\":\"浸潤式深紫外光微影\"},\"blurb\":{\"en\":\"A chipmaking lithography technique that projects deep ultraviolet light through a liquid medium to etch fine circuit patterns onto silicon wafers.\",\"zh-TW\":\"讓深紫外光穿過鏡頭與晶圓間的液體介質以提升解析度的微影技術，廣泛用於成熟及部分先進晶片製程。\"}},{\"term\":{\"en\":\"Extraterritorial Scope\",\"zh-TW\":\"域外管轄效力\"},\"blurb\":{\"en\":\"The application of a country's domestic laws or export restrictions to foreign companies and transactions occurring outside its national borders.\",\"zh-TW\":\"一國將其國內法規或出口管制效力延伸至境外外國企業及跨國商業交易的法律適用範圍。\"}}],\"sources\":[{\"name\":\"Taipei Times (Bloomberg / Reuters)\",\"url\":\"https://www.taipeitimes.com/News/biz/archives/2026/11/27/2003868456\"},{\"name\":\"The Chosun Ilbo\",\"url\":\"https://www.chosun.com/english/industry-en/2026/11/27/AU3HSYL5ZZDKLOB7PYKMYK5QVQ/\"},{\"name\":\"The Next Web\",\"url\":\"https://thenextweb.com/news/netherlands-match-act-us-chip-export-controls\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"ASML semiconductor lithography exhibition booth displaying chipmaking equipment\",\"zh-TW\":\"半導體設備大廠 ASML 展覽攤位與微影技術展示\"},\"isHeadline\":true,\"isPopular\":true,\"trustScore\":86,\"trustBreakdown\":{\"crossCorroboration\":23,\"outletReputation\":22,\"recencyClarity\":21,\"sourceDiversity\":20},\"publishedAt\":\"2026-11-27T15:56:21.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":4,\"D2\":5,\"D3\":4,\"D4\":4,\"D5\":4,\"total\":21},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-semiconductor-102-netherlands-opposes-us-match-act-asml/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$
