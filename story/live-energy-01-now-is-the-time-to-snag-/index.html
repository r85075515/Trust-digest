tential across its supply chain.\nWhat happened\nUtility Dive and ESG Dive report the same pilot — electric yard trucks replacing diesel at California distribution centers. The company says it will evaluate the results before deciding on a broader rollout.\nWhy it matters\nThe judgment: yard trucks are the unglamorous, high-idle workhorses of logistics — they spend much of their operating life idling between trailer moves — and electrifying them is one of the cheapest per-ton emissions cuts a retailer can make. Diesel yard switchers are also concentrated pollution sources in warehouse-adjacent communities, which gives the pilot a regulatory tailwind in California. If Best Buy's numbers work, expect peers like Walmart and Target to follow quickly; fleet electrification at distribution centers is the next obvious domino after delivery vans.\nSources agree / disagree\nUtility Dive and ESG Dive describe the identical pilot with consistent details. Trust label: Multi-source agreement on the pilot's existence. The CNET Chromebook deal headline in this cluster is unrelated shopping content swept in by the feed.\nStill uncertain\nPilot scale, cost figures, and the timeline for a wider rollout have not been disclosed."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-energy-01-now-is-the-time-to-snag-\",\"category\":\"energy\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-energy-01-now-is-the-time-to-snag-.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Now Is the Time to Snag a New Google Chromebook. Save Up to $230 at Best Buy\",\"zh-TW\":\"相關封面圖：現在是時候入手一台新的 Google Chromebook 了。 Best Buy 最高可省 230 美元\"},\"publishedAt\":\"2026-10-15T18:36:28.000Z\",\"title\":{\"en\":\"Best Buy Pilots Battery-Powered Yard Trucks at California Sites\",\"zh-TW\":\"百思買（Best Buy）在加州配送中心試行電動場內車\"},\"summary\":{\"en\":\"Best Buy has deployed electric yard switchers at California distribution sites to cut emissions and will assess wider rollout across its supply chain, Utility Dive and ESG Dive report.\",\"zh-TW\":\"百思買（Best Buy）已在加州配送中心部署電動場內拖車以減少碳排，並將評估擴大到整個供應鏈，Utility Dive 與 ESG Dive 報導。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"百思買（Best Buy）把電動化試驗放在顧客看不到的地方：已在加州配送中心部署電動場內拖車，作為減排計畫一環，並將評估擴大到整個供應鏈的可行性。\\n發生了什麼事\\nUtility Dive 與 ESG Dive 報導的是同一個試行計畫——以電動場內車取代加州配送中心的柴油車。公司表示會先評估試行結果，再決定是否擴大。\\n為什麼重要\\n判斷很簡單：場內拖車是物流業裡不起眼但怠速時間長的吃油怪，電動化是零售商單位減排成本最低的手段之一。試行數字好看的話，同業很快就會跟進。\\n來源異同\\nUtility Dive 與 ESG Dive 描述的是同一個試行計畫，細節一致。信任標籤：N源一致。同一集群裡 CNET 的 Chromebook 促銷是不相關的購物內容。\\n仍不確定\\n試行規模、成本數字與擴大時間表都尚未公布。\"},\"sources\":[{\"name\":\"Utility Dive\",\"url\":\"https://www.utilitydive.com/news/best-buy-pilots-battery-powered-vehicles-at-california-distribution-sites/833125/\"},{\"name\":\"ESG Dive\",\"url\":\"https://www.esgdive.com/news/best-buy-pilots-battery-powered-vehicles-at-california-distribution-sites/833103/\"},{\"name\":\"CNET Deals\",\"url\":\"https://www.cnet.com/deals/google-chromebook-at-best-buy-deal/\"}],\"disagreements\":null,\"trustScore\":68,\"trustBreakdown\":{\"sourceDiversity\":19,\"outletReputation\":10,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"energy\",\"live-ingest\",\"utility-dive\",\"esg-dive\",\"cnet-deals\"],\"glossary\":[{\"term\":{\"en\":\"Best Buy\",\"zh-TW\":\"百思買\"},\"blurb\":{\"en\":\"US electronics retailer piloting electric yard trucks.\",\"zh-TW\":\"試行電動場內車的美國電子零售商。\"}},{\"term\":{\"en\":\"Utility Dive\",\"zh-TW\":\"Utility Dive\"},\"blurb\":{\"en\":\"US energy industry news outlet covering the pilot.\",\"zh-TW\":\"報導試行計畫的美國能源產業媒體。\"}},{\"term\":{\"en\":\"ESG Dive\",\"zh-TW\":\"ESG Dive\"},\"blurb\":{\"en\":\"Sustainability news outlet covering the same pilot.\",\"zh-TW\":\"報導同一試行計畫的永續新聞媒體。\"}},{\"term\":{\"en\":\"Yard switcher\",\"zh-TW\":\"場內拖車\"},\"blurb\":{\"en\":\"Truck used to move trailers within distribution centers.\",\"zh-TW\":\"在配送中心內拖運貨櫃的專用車輛。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charS
