tel's share price in a single day on October 30. The case turns a market rout into a legal question about what the company said, and when.\nWhat happened\nThe lawsuit, filed on Friday in federal court in San Jose, California, seeks class-action certification, Ars Technica reports. It accuses Intel of misleading shareholders about how badly the PC sales downturn would hit the company, and it names the City of Southfield Fire and Police Retirement System among the plaintiffs. The trigger was the October 30 plunge: Intel's stock fell 28.6 percent in one day as the market absorbed the PC slump's impact on the chipmaker.\nWhy it matters\nA 28.6 percent one-day drop is the market's verdict; the lawsuit asks whether investors were given a fair chance to reach it themselves. If the plaintiffs can show Intel downplayed the PC downturn while it was unfolding, the case becomes a test of how much warning a chipmaker owes shareholders when its core market turns. The takeaway: the share price has already moved, but the question of who knew what, and when, is now for a court.\nSources agree / disagree\nThis card rests on Ars Technica alone. There is no second outlet in the material to corroborate the filing, the plaintiffs, or the allegations, so the lawsuit is reported, not independently confirmed.\nStill uncertain\nThe full complaint, the specific statements alleged to be misleading, Intel's response, and the size of the proposed class were not in the feed material. Verify them in the full Ars Technica reporting and the court filing before quoting details.\nTrust label: Single source — Ars Technica only, with no corroboration in the material at hand."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-tech-01-shareholders-sue-intel-i\",\"category\":\"tech\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-tech-01-shareholders-sue-intel-i.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Shareholders sue
