 wealthy could stash and trade expensive pieces without the art ever leaving the building. Rybolovlev is described as a reclusive potash billionaire, though the snippet cuts off mid-word at that point and gives no further biography. The headline frames the outcome as a feud over priceless art spanning the globe. The snippets do not name any specific artwork, price, court, country or allegation, and they do not give either man's account of what went wrong, so the substance of the feud cannot be reconstructed from this material beyond the partnership-to-feud outline.\nWhy it matters\nEven in outline, the item matters because it connects a private art partnership to a storage and trading model, the freeport, that lets expensive art change hands without leaving a building, a structure that raises accountability questions about how high-value art is held and traded. The ICIJ framing, a reclusive billionaire, a fearless dealer and a globe-spanning feud, signals a long-running cross-border dispute rather than a single transaction gone wrong. Readers should note, however, that the feed text provided here is only an introduction: it establishes who the two men are and that their partnership collapsed, but none of the claims, rulings or sums that would let a reader judge the feud itself. Any firmer conclusion requires the full ICIJ reporting.\nSources agree / disagree\nThis account came from a single source, ICIJ. Trust label: Single source — Only one outlet's introduction was provided, so there is no second account to agree or disagree with in this material. No other outlet covered the feud in the snippets supplied.\nStill uncertain\nThe specific artworks, prices, allegations, legal proceedings and each side's position are all absent from the feed text, which cuts off during Rybolovlev's description. The timeline of the partnership and feud is also not given."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-accountability-01-a-reclusi
