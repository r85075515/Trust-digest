Jong Un) toured facilities producing weapons-grade nuclear material and conducting nuclear weapons research at an undisclosed location. State media quoted Kim as calling North Korea's nuclear-armed status an \"absolutely irreversible choice\" and ordering the military to expand the deployment of tactical nuclear weapons across multiple operational domains.\n\nWhy it matters\nThe inspection and state media imagery—which outside analysts noted appeared to show uranium enrichment centrifuges and a suspected nuclear-powered submarine reactor—reinforce Pyongyang's rejection of denuclearization talks following recent diplomatic overtures by U.S. President Donald Trump (Donald Trump). South Korea's Defense Ministry stated that Seoul takes Kim's tactical nuclear remarks seriously and maintains firm deterrence readiness alongside the United States.\n\nSource differences\nPBS News (\"North Korea's Kim vows to build more nuclear weapons after ... - PBS\") and DW (\"Kim Jong Un tours nuclear material sites, urges wider use of tactical nuclear weapons\") carried Associated Press and Reuters dispatches focusing on Kim's call for wider battlefield nuclear deployment and Seoul's military response. Korea JoongAng Daily (\"North Korea unveils apparent nuclear submarine reactor as Kim\") highlighted visual details from Korean Central Television footage, including an apparent submarine reactor, expanded uranium enrichment halls, and upgraded Hwasan-31 tactical warhead designations.\n\nStill uncertain\nNorth Korea did not disclose the date or exact geographic location of Kim's inspection, and independent intelligence agencies have not verified whether the displayed reactor and warhead mockups represent fully operational systems.\n\nTrust label: Multi-source agreement — AP, Reuters, and South Korean press reports align on KCNA's November 26 disclosure and official Seoul reactions."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-317-north-korea-nuclear-facilities\",\"category\":\"international\",\"title\":{\"en\":\"North Korea's Kim Tours Nuclear Material Sites, Vows Wider Tactical Nuclear Deployment\",\"zh-TW\":\"北韓金正恩視察核材料生產設施，宣稱將擴大戰術核武部署\"},\"summary\":{\"en\":\"North Korean state media reported on November 26, 2026, that leader Kim Jong Un inspected nuclear material production and weapons research sites, declaring North Korea's nuclear status irreversible and calling for wider tactical nuclear weapon deployment. South Korea's Defense Ministry said it maintains firm readiness under its U.S. alliance.\",\"zh-TW\":\"北韓官媒於 2026 年 11 月 26 日報導，最高領導人金正恩（Kim Jong Un）視察核材料生產與武器研發設施，宣稱北韓擁核地位「完全不可逆」並下令擴大部署戰術核武；南韓國防部回應表示嚴正看待並維持美韓同盟戒備。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n北韓官方朝中社（KCNA）於 2026 年 11 月 26 日報導，北韓領導人金正恩（Kim Jong Un）視察一處未公開地點的武器級核材料生產基地與核武研究所。官媒引述金正恩發言，宣稱北韓保有核武是「絕對不可逆的選擇」，並要求軍方在多重作戰領域擴大部署戰術核武。\\n\\n「為什麼重要」\\n此次視察緊接在美國總統川普（Donald Trump）釋出會晤意願之後，顯示平壤重申拒絕無核化談判的強硬立場。南韓國防部表示嚴正看待金正恩關於戰場核武的言論，並強調持續在美韓同盟架構下維持堅實軍事戒備。\\n\\n「來源異同」\\nPBS News（\\\"North Korea's Kim vows to build more nuclear weapons after ... - PBS\\\"）與德國之聲（\\\"Kim Jong Un tours nuclear material sites, urges wider use of tactical nuclear weapons\\\"）引述美聯社與路透社電訊，著重金正恩要求擴大戰術核武部署及南韓國防部回應；韓國《中央日報》（\\\"North Korea unveils apparent nuclear submarine reactor as Kim\\\"）則進一步解析朝鮮中央電視台畫面，指出畫面出現疑似核潛艦反應爐、擴建的濃縮鈾離心機廠房以及新型「火山-31」（Hwasan-31）系列戰術核彈頭標示。\\n\\n「仍不確定」\\n北韓官媒未公布金正恩視察的具體日期與設施精確位置，外界情報機構亦尚未證實畫面中的潛艦反應爐與改良型彈頭是否已具備實戰部署能力。\\n\\nTrust label: Multi-source agreement — 美聯社、路透社與南韓主流媒體對朝中社 11 月 26 日公告內容與首爾官方回應的報導一致。\"},\"glossary\":[{\"term\":{\"en\":\"Tactical Nuclear Weapons\",\"zh-TW\":\"戰術核武\"},\"blurb\":{\"en\":\"Lower-yield nuclear warheads designed for use on a regional battlefield rather than long-range strategic strikes against cities.\",\"zh-TW\":\"爆炸當量較小、射程較短的核武器，設計用於區域戰場打擊軍事目標，區別於打擊本土城市目標的戰略核武。\"}},{\"term\":{\"en\":\"Uranium Enrichment\",\"zh-TW\":\"鈾濃縮\"},\"blurb\":{\"en\":\"The industrial process—commonly using gas centrifuges—of increasing the concentration of fissile uranium-235 for reactor fuel or nuclear weapons.\",\"zh-TW\":\"透過氣體離心機等技術提高天然鈾中可裂變同位素鈾-235濃度的工業製程，用於核反應爐燃料或核武器製造。\"}},{\"term\":{\"en\":\"Fissile Material\",\"zh-TW\":\"可裂變材料\"},\"blurb\":{\"en\":\"Nuclear material such as highly enriched uranium or plutonium capable of sustaining a rapid nuclear fission chain reaction.\",\"zh-TW\":\"如高濃縮鈾或鈽等能夠維持快速核分裂連鎖反應的關鍵核材料。\"}}],\"sources\":[{\"name\":\"PBS News\",\"url\":\"https://www.pbs.org/newshour/world/north-koreas-kim-vows-to-build-more-nuclear-weapons-after-ignoring-trumps-overture\"},{\"name\":\"DW\",\"url\":\"https://amp.dw.com/en/kim-jong-un-tours-nuclear-material-sites-urges-wider-use-of-tactical-nuclear-weapons/a-80055887\"},{\"name\":\"Korea JoongAng Daily\",\"url\":\"https://www.koreajoongangdaily.com/korea/north-korea-unveils-apparent-submarine-reactor-as-kim-declares-nuclear-status-nonnegotiable/12992734\"}],\"imageUrl\":\"/covers/live/live-international-317-north-korea-nuclear-facilities.jpg\",\"imageAlt\":{\"en\":\"North Korea's Kim Tours Nuclear Material Sites, Vows Wider Tactical Nuclear Deployment\",\"zh-TW\":\"北韓金正恩視察核材料生產設施，宣稱將擴大戰術核武部署\"},\"isHeadline\":true,\"isPopular\":true,\"trustScore\":84,\"trustBreakdown\":{\"crossCorroboration\":22,\"outletReputation\":22,\"recencyClarity\":21,\"sourceDiversity\":19},\"publishedAt\":\"2026-11-28T02:11:49.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":21,\"D2\":21,\"D3\":20,\"D4\":21,\"D5\":20,\"total\":21},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores
