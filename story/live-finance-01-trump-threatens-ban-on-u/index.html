etail about how either would work.\n\nWhat happened\nTrump said the fight is about preventing Beijing from taking the lead in developing AI technology. He gave little detail on the potential policy, and, according to the BBC, others in his team were hearing about it for the first time. The BBC's headline frames the threat as a ban on overseas construction; the Financial Times' headline frames it as a 'tremendous' tax on data centres built outside the US. The short feed snippets do not say where or when Trump spoke, what legal authority he has in mind, or which projects would be affected.\n\nWhy it matters\nA ban or a punitive tax on overseas data centres would hit the core of the AI build-out: the giant computing facilities that US firms are racing to build at home and abroad. It would also put Washington's technology rivalry with Beijing at the centre of corporate investment decisions, forcing companies to weigh access to cheap power and land abroad against the risk of US penalties.\n\nSources agree / disagree\nBBC Business and the Financial Times agree on the core: Trump threatened action against US firms building data centres overseas, tied it to the AI race with Beijing, and gave little detail. They differ on the instrument — a ban versus a tax — and the snippets do not resolve whether he proposed one, the other, or both. Trust label: Two-source agreement — the two outlets agree on the threat and its stated purpose, but frame the measure differently.\n\nStill uncertain\nNo timetable, scope, legal basis or list of affected firms appears in the snippets, and there is no indication of whether the idea has been developed into a formal proposal. Verify the wording and any follow-up on the publishers' pages before citing the threat as policy."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-01-trump-threatens-ban-on-u\",\"category\":\"finance\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-finance-01-trump-threatens-ban-on-u.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Trump threatens ban on US firms building AI data centres overseas\",\"zh-TW\":\"相關封面圖：川普威脅禁止美國公司在海外建設人工智慧資料中心\"},\"publishedAt\":\"2026-11-20T20:54:12.000Z\",\"title\":{\"en\":\"Trump Threatens Ban or 'Tremendous' Tax on US Firms Building AI Data Centres Abroad\",\"zh-TW\":\"川普（Donald Trump）威脅禁美國企業赴海外建 AI 資料中心，或課重稅\"},\"summary\":{\"en\":\"President Donald Trump threatened to ban US firms from building AI data centres overseas — or hit them with a 'tremendous' tax — saying the fight is about stopping Beijing leading in AI. He gave almost no detail, and aides were reportedly hearing the idea for the first time.\",\"zh-TW\":\"美國總統川普（Donald Trump）威脅禁止美國企業赴海外建 AI 資料中心，或課以重稅，稱關鍵是不能讓北京搶先主導 AI。他幾乎沒給細節，團隊成員據稱也是第一次聽到這個想法。takeaway：話放得很重、細節全無，先看白宮後續是否拿出具體方案。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"美國總統川普（Donald Trump）威脅對赴海外建 AI 資料中心的美國企業出手——可能是禁令，也可能是重稅——但他幾乎沒說明具體做法。\\n發生了什麼事\\n川普稱關鍵是不能讓北京（Beijing）搶先主導 AI 技術。BBC 報導，他對這項潛在政策幾乎沒給細節，團隊裡其他人也是第一次聽到。BBC 標題寫的是「禁止」海外建設，《金融時報》（Financial Times）標題寫的是對海外資料中心課「重稅」。來源摘要未說明川普在何時何地發言、依據什麼法源、哪些計畫會受影響。\\n為什麼重要\\n不論禁令或重稅，一旦成真都會打中 AI 擴張的核心：美國企業正在國內外搶建的巨型算力設施。這也等於把華府與北京的科技競賽，直接綁上企業的投資決策——海外便宜的電力與土地，對上美國罰則的風險，兩邊都得算。\\n來源異同\\nBBC 與《金融時報》核心一致：川普威脅對赴海外建資料中心的美國企業採取行動，理由是 AI 競賽不能輸給北京，且細節極少。兩家對手段的描述不同——禁令或課稅——摘要無法確認他提的是一種、還是兩種。信任標籤：2源一致——兩家對威脅本身與理由報導一致，手段描述有出入。\\n仍不確定\\n摘要中沒有時程、適用範圍、法源依據，也沒有受影響企業名單，更看不出這是否已形成正式方案。引用前請查閱完整報導，別把一句威脅當成既定政策。\"},\"sources\":[{\"name\":\"BBC Business\",\"url\":\"https://www.bbc.co.uk/news/articles/cmde1lw9y54ko?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"Financial Times\",\"url\":\"https://www.ft.com/content/ae564e09-eb0d-42c6-b61f-50a4e61d0240?syn-25a6b1a6=1\"}],\"disagreements\":null,\"trustScore\":72,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":19,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"finance\",\"live-ingest\",\"bbc-business\",\"financial-times\"],\"glossary\":[{\"term\":{\"en\":\"Donald Trump\",\"zh-TW\":\"川普\"},\"blurb\":{\"en\":\"US president who threatened action against firms building AI data centres overseas.\",\"zh-TW\":\"美國總統，威脅對赴海外建 AI 資料中心的企業採取行動。\"}},{\"term\":{\"en\":\"Beijing\",\"zh-TW\":\"北京\"},\"blurb\":{\"en\":\"Capital of China; the rival Trump says the US must not let lead in AI.\",\"zh-TW\":\"中國首都，川普稱美國不能讓其在 AI 搶先的對手。\"}},{\"term\":{\"en\":\"BBC\",\"zh-TW\":\"英國廣播公司\"},\"blurb\":{\"en\":\"British public broadcaster that reported the threat as a ban.\",\"zh-TW\":\"英國公共廣播機構，將此威脅報導為禁令。\"}},{\"term\":{\"en\":\"Financial Times\",\"zh-TW\":\"《金融時報》\"},\"blurb\":{\"en\":\"British business newspaper that reported the threat as a 'tremendous' tax.\",\"zh-TW\":\"英國財經報紙，將此威脅報導為「重稅」。\"}},{\"term\":{\"en\":\"AI data centre\",\"zh-TW\":\"AI 資料中心\"},\"blurb\":{\"en\":\"Large computing facility used to train and run artificial intelligence systems.\",\"zh-TW\":\"用於訓練與運行人工智慧系統的大型算力設施。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-finance-01-trump-threatens-ban-on-u/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-finance-01-trump-threatens-ban-on-u/\"}],[\"$\",\"meta\
