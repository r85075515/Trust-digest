ened\nOn Wednesday, November 25, 2026, the Army carried out a controlled detonation at the Iowa Army Ammunition Plant of more than 9,700 pounds of degraded lead azide, a highly volatile compound used in igniters and blasting caps, held in 68 drums. The Army said the detonation was necessary to prevent the possible spontaneous explosion of the stockpile. The operation went ahead after a federal court gave the green light, following multiple delays, a court challenge and presidential intervention. Federal officials lifted a shelter-in-place order in Middletown, Iowa, after the detonation, and six federal agencies, including the Army, the Department of Health and Human Services, the Environmental Protection Agency and the Bureau of Alcohol, Tobacco, Firearms and Explosives, issued a joint statement. Officials called the operation a success but did not take questions from reporters.\nWhy it matters\nThe material involved is toxic as well as explosive: the detonation triggered evacuations, closures and fears about exposure to toxic lead dust in surrounding communities and states. Elected officials criticised the military over communication shortfalls ahead of the blast, and PBS NewsHour reported that surrounding communities remain on alert while three states say they are monitoring the effects. The gap between official reassurance and local unease is the central issue now.\nSources agree / disagree\nThe Verge, PBS NewsHour, The Hill, Axios, Grist, Inside Climate News and The Guardian all cover the same detonation and the lifted shelter-in-place order. The Verge reports the EPA finding of 'zero' airborne lead after the blast, while Inside Climate News reports the Army describing health risks as 'close to zero'. The figures 9,700 pounds and 68 drums describe the same stockpile in different units and do not conflict.\nStill uncertain\nThe feed text gives no detailed monitoring data, no timeline for further testing, and no account of what officials would say to residents' questions, which were not taken at the briefing described. Longer-term health and environmental findings are not in the source material.\nTrust label: Multi-source agreement — seven outlets report the same detonation, its stated reason and the lifting of the shelter-in-place order, with official risk characterisations attributed to the Army and the EPA."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-tech-03-after-detonating-five-to\",\"category\":\"tech\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-tech-03-after-detonating-five-to.jpg\",\"imageAlt\":{\"en\":\"Cover related to: After Detonating Five Tons of Lead Explosives, Army Says Health Risks Are ‘Close to Zero’\",\"zh-TW\":\"相關封面圖：引爆五噸鉛炸藥後，陸軍表示健康風險“接近零”\"},\"publishedAt\":\"2026-11-26T01:45:46.000Z\",\"title\":{\"en\":\"U.S. Army detonation of lead azide in Iowa leaves nearby communities seeking answers on health risks\",\"zh-TW\":\"美國陸軍在愛荷華州引爆疊氮化鉛，周邊社區追問健康風險\"},\"summary\":{\"en\":\"The U.S. Army carried out a controlled detonation of more than 9,700 pounds of unstable lead azide, held in 68 drums, at the Iowa Army Ammunition Plant, saying it was needed to prevent a possible spontaneous explosion. Officials lifted a shelter-in-place order and described airborne lead risks as close to zero, while surrounding communities and three states kept monitoring.\",\"zh-TW\":\"美國陸軍在愛荷華州陸軍彈藥廠（Iowa Army Ammunition Plant）受控引爆逾 9,700 磅不穩定的疊氮化鉛（Lead Azide），共 68 桶，稱此舉是為了防止庫存材料自爆。官方隨後解除就地避難令，並稱空氣中鉛的健康風險接近零；周邊社區與三個州則持續監測影響。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"美國陸軍在愛荷華州引爆了一批不穩定的含鉛炸藥，並稱行動成功；但周邊居民對鉛塵與健康風險，仍在等更完整的說明。\\n發生了什麼事\\n2026 年 11 月 25 日週三，陸軍在愛荷華州陸軍彈藥廠（Iowa Army Ammunition Plant）受控引爆逾 9,700 磅已劣化的疊氮化鉛（Lead Azide），共 68 桶；這種化合物揮發性高，用於點火器與雷管。陸軍表示，引爆是為了防止庫存材料可能自爆。行動歷經多次延誤、法院挑戰與總統介入後，獲聯邦法院放行才執行。引爆後，聯邦官員解除愛荷華州米德爾敦（Middletown）的就地避難令，陸軍、衛生與公眾服務部（Department of Health and Human Services）、環境保護局（Environmental Protection Agency）、菸酒槍炮及爆裂物管理局（Bureau of Alcohol, Tobacco, Firearms and Explosives）等六個聯邦機構發表聯合聲明。官員稱行動成功，但未接受記者提問。\\n為什麼重要\\n涉案材料既具爆炸性也有毒性：引爆引發疏散與關閉，周邊社區與其他州都擔心暴露於有毒鉛塵。民選官員批評軍方在引爆前溝通不足；周邊社區仍保持警戒，三個州表示正監測影響。官方的安心說法與地方的不安之間的落差，是接下來的核心問題。\\n來源異同\\nThe Verge、PBS NewsHour、The Hill、Axios、Grist、Inside Climate News 與《衛報》報導的是同一次引爆與避難令解除。The Verge 報導環保局稱引爆後空氣中鉛含量為「零」，Inside Climate News 則報導陸軍稱健康風險「接近零」。9,700 磅與 68 桶是以不同單位描述同一批庫存，並不衝突。\\n仍不確定\\n摘要未提供詳細監測數據、後續檢測時間表，也未交代官員如何回應居民提問；陸軍的風險評估能否消除地方疑慮，仍待後續公布的監測結果。\"},\"sources\":[{\"name\":\"The Verge\",\"url\":\"https://www.theverge.com/science/1042109/us-army-detonation-lead-azide-explosives-iowa-ammunition-plant\"},{\"name\":\"PBS NewsHour\",\"url\":\"https://www.pbs.org/newshour/show/what-the-armys-iowa-detonation-means-for-nearby-communities\"},{\"name\":\"The Hill\",\"url\":\"https://thehill.com/homenews/administration/6244295-middletown-shelter-order-lifted/\"},{\"name\":\"Axios\",\"url\":\"https://www.axios.com/2026/11/25/iowa-army-lead-detonation\"},{\"name\":\"Grist\",\"url\":\"https://grist.org/grist-news/what-to-know-about-the-armys-plan-to-detonate-5-tons-of-lead-in-iowa/\"},{\"name\":\"Inside Climate News\",\"url\":\"https://insideclimatenews.org/news/25112026/iowa-lead-explosives-health-risks-close-to-zero/\"},{\"name\":\"The Guardian Environment\",\"url\":\"https://www.theguardian.com/us-news/live/2026/nov/25/iowa-lead-azide-detonation-army-explosion-bomb-live-updates\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":25,\"outletReputation\":18,\"crossCorroboration\":17,\"recencyClarity\":25},\"tags\":[\"tech\",\"live-ingest\",\"the-verge\",\"pbs-newshour\",\"the-hill\"],\"glossary\":[{\"term\":{\"en\":\"lead azide\",\"zh-TW\":\"疊氮化鉛\"},\"blurb\":{\"en\":\"A highly volatile lead compound used in igniters and blasting caps.\",\"zh-TW\":\"揮發性高的鉛化合物，用於點火器與雷管。\"}},{\"term\":{\"en\":\"Iowa Army Ammunition Plant\",\"zh-TW\":\"愛荷華州陸軍彈藥廠\"},\"blurb\":{\"en\":\"The Army ammunition plant in Iowa where the controlled detonation took place.\",\"zh-TW\":\"此次受控引爆所在的愛荷華州陸軍彈藥廠。\"}},{\"term\":{\"en\":\"U.S. Army\",\"zh-TW\":\"美國陸軍\"},\"blurb\":{\"en\":\"The U.S. military service that carried out the detonation.\",\"zh-TW\":\"執行此次引爆的美國軍種。\"}},{\"term\":{\"en\":\"Environmental Protection Agency (EPA)\",\"zh-TW\":\"環境保護局\"},\"blurb\":{\"en\":\"The U.S. federal agency reported as finding zero airborne lead after the blast.\",\"zh-TW\":\"被報導在引爆後測得空氣中鉛含量為零的美國聯邦機構。\"}},{\"term\":{\"en\":\"Middletown, Iowa\",\"zh-TW\":\"米德爾敦\"},\"blurb\":{\"en\":\"The Iowa community where a shelter-in-place order was lifted after the detonation.\",\"zh-TW\":\"引爆後解除就地避難令的愛荷華州社區。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-tech-03-after-detonating-five-to/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-tech-03-after-detonating-five-to/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and exp
