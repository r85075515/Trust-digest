ction to a crawl.\n\nWhat happened\nSenators approved the legislation on Thursday, aiming to speed up permitting reviews for energy infrastructure as demand surges and lawmakers look for ways to increase supply and lower electricity prices. The bill now goes to the House. Environmental groups are aghast, while supporters say it may be the only chance to speed up clean-energy projects. The Guardian's explainer frames the divide as a fraught split among Democrats and green groups over whether the bill helps or hinders the fight against the climate crisis.\n\nWhy it matters\nPermitting is the bottleneck for almost every big energy project, from transmission lines to the data centres driving power demand. Loosening the rules could unlock construction quickly — and lock in a lighter-touch review regime that critics say trades environmental protection for speed.\n\nSources agree / disagree\nBoth items in this cluster come from The Guardian Environment, so there is no second outlet to cross-check against; the two Guardian pieces agree on the vote, the purpose and the split it caused. Trust label: Single source — one outlet's reporting, with no independent corroboration in this cluster.\n\nStill uncertain\nThe snippets give no vote margin, no list of what guardrails are removed, and no read on the House timetable. The Guardian headline's reference to 'Trump's arch' is also unexplained in the snippets. Check the full reporting before citing specifics."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-energy-01-what-to-know-about-the-u\",\"category\":\"energy\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-energy-01-what-to-know-about-the-u.jpg\",\"imageAlt\":{\"en\":\"Cover related to: What to know about the US permitting bill, from datacenters to Trump’s arch\",\"zh-TW\":\"相關封面圖：關於美國許可法案，從資料中心到川普的拱門，您需要了解什麼\"},\"publishedAt\":\"2026-11-20T18:26:08.000Z\",\"title\":{\"en\":\"US Senate Passes Permitting Bill to Fast-Track Energy Projects and Data Centres\",\"zh-TW\":\"美國參議院通過許可法案，為能源與資料中心計畫加速放行\"},\"summary\":{\"en\":\"The US Senate passed a bipartisan bill to fast-track permitting for power plants, transmission lines and data centres by stripping back environmental and legal guardrails. Supporters call it the only chance to speed up clean energy; green groups are aghast. The bill now goes to the House, where its fate is unclear.\",\"zh-TW\":\"美國參議院通過兩黨許可法案，大幅鬆綁環評與法律關卡，為電廠、輸電線路與資料中心加速放行。支持者稱這是加速潔淨能源的唯一機會，環保團體則大表震驚。法案已送眾議院，能否過關仍是未知數。takeaway：許可是能源建設的瓶頸，鬆綁換速度，代價是環境把關變薄。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"美國參議院通過兩黨許可法案，大幅鬆綁環評與法律關卡，為電廠、輸電線路與資料中心加速放行。\\n發生了什麼事\\n參議院週四通過法案，要加快能源基礎設施的許可審查，因應需求暴增，設法增加供電、壓低電價。法案接著送交眾議院。環保團體大表震驚，支持者則稱這是加速潔淨能源計畫的唯一機會。《衛報》（The Guardian）形容，民主黨與綠色團體之間為此嚴重分裂，爭的是這部法案到底有助還是阻礙對抗氣候危機。\\n為什麼重要\\n許可是幾乎所有大型能源計畫的瓶頸，從輸電線到推升用電需求的資料中心都卡在這關。鬆綁能讓工程快速上馬，但批評者認為，這是用環境保護換速度，而且輕量審查一旦定型就很難走回頭路。\\n來源異同\\n本卡兩則來源都出自《衛報》環境版，沒有第二家媒體可交叉比對；兩篇對投票結果、立法目的與引發的分裂報導一致。信任標籤：僅1源——單一媒體報導，本批內無其他來源佐證。\\n仍不確定\\n摘要未提供表決票數、鬆綁了哪些具體關卡，也沒有眾議院的審議時程；標題提到的「川普的拱門」在摘要中也沒有解釋。引用細節前請查閱完整報導。\"},\"sources\":[{\"name\":\"The Guardian Environment\",\"url\":\"https://www.theguardian.com/us-news/2026/nov/20/what-to-know-permitting-bill-energy-passed\"}],\"disagreements\":null,\"trustScore\":59,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"energy\",\"live-ingest\",\"the-guardian-environment\",\"the-guardian-environment\"],\"glossary\":[{\"term\":{\"en\":\"US Senate\",\"zh-TW\":\"美國參議院\"},\"blurb\":{\"en\":\"Upper house of the US Congress, which passed the permitting bill.\",\"zh-TW\":\"美國國會上議院，通過本許可法案。\"}},{\"term\":{\"en\":\"The Guardian\",\"zh-TW\":\"《衛報》\"},\"blurb\":{\"en\":\"British newspaper whose environment desk reported the bill.\",\"zh-TW\":\"英國報紙，其環境版報導了本法案。\"}},{\"term\":{\"en\":\"Data centre\",\"zh-TW\":\"資料中心\"},\"blurb\":{\"en\":\"Large facility housing the computing power behind AI and online services.\",\"zh-TW\":\"容納 AI 與網路服務算力的大型設施。\"}},{\"term\":{\"en\":\"Permitting\",\"zh-TW\":\"許可審查\"},\"blurb\":{\"en\":\"The official approval process required before energy projects can be built.\",\"zh-TW\":\"能源計畫動工前必須通過的官方審核程序。\"}},{\"term\":{\"en\":\"Clean energy\",\"zh-TW\":\"潔淨能源\"},\"blurb\":{\"en\":\"Energy from sources such as wind and solar that produce little pollution.\",\"zh-TW\":\"風力、太陽能等低污染來源的能源。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-energy-01-what-to-know-about-the-u/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-energy-01-what-to-know-about-the-u/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"d:\"$8:metadata\"\n"])</script></body></html>
