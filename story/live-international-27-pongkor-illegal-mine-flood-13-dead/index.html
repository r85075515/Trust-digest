kor, Bogor Regency, West Java, where 13 others have been confirmed dead. Twenty-six workers had entered the roughly 100-metre-deep shafts on Monday when heavy rain sent the Ciseureuh River bursting into the pits, flooding them. West Java police chief Hengki told Reuters six of the 13 dead had been identified, and that the search would continue Thursday barring bad weather.\n\nWhat happened: The mine was an unauthorised operation near the legal Pongkor gold mine run by state-owned miner Antam, which said the pit was unrelated to its operations. Because the digging was illegal, authorities were not alerted for roughly 16 hours. More than 325 personnel — search-and-rescue agency Basarnas, police, military and volunteers — have been pumping water and working narrow, slippery passages; rain forced a temporary suspension on Thursday. The confirmed toll climbed over three days, from 3 to 8 and then 13.\n\nWhy it matters: Illegal small-scale gold mining is widespread and persistently deadly in Indonesia, operating beyond inspection, ventilation and drainage rules in remote terrain that regulators struggle to reach. The 16-hour reporting delay — a direct product of the operation's illegality — is now central to the accountability question, and police are investigating who organised the digging.\n\nSources agree/disagree: Reuters, AP, BBC and Al Jazeera agree on 13 confirmed dead and 13 missing, the Monday flooding sequence and the delayed alert. Early counts differed as bodies were recovered (3, then 8, then 13) — a progression of recovery, not a contradiction.\n\nStill uncertain: Whether any of the 13 missing are alive, the full identities of the dead, who organised and profited from the illegal operation, and whether arrests or a wider crackdown on unlicensed mining in the Pongkor area follow.\n\nTrust label: Multi-source agreement — Reuters reporting from police and rescue authorities converges with AP, BBC and Al Jazeera coverage on the toll and sequence."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"adult\":false,\"body\":{\"en\":\"$10\",\"zh-TW\":\"發生了什麼事：印尼西爪哇省（West Java）茂物縣（Bogor）邦格爾（Pongkor）一座非法金礦週一（23 日）遭洪水灌入，26 名工人進入約 100 公尺深的礦坑時，豪雨使奇瑟勒河（Ciseureuh River）潰入坑道。救難人員週四恢復搜救：13 人已確認死亡、13 人仍受困失聯。西爪哇警察廳長亨基（Hengki）向路透表示，13 名死者中 6 人已辨識身分，天候許可下週四持續搜救。\\n\\n為什麼重要：這座礦場是未經許可的非法開採，鄰近國營礦商安探（Antam）的合法邦格爾金礦——安探聲明該坑與其營運無關。正因非法，事發後約 16 小時當局才獲報，延誤成了究責核心；警方已在調查幕後組織者。印尼非法小型金礦遍布偏遠地區，通風、排水與檢查規範全數缺席，致命事故反覆發生，這次是最新一起。搜救由國家搜救總署（Basarnas）領軍、逾 325 名警消軍民投入抽水與搜救，週四一度因雨暫停；確認死亡數三天內由 3 人、8 人升至 13 人。\\n\\n來源異同：路透、美聯社（AP）、英國廣播公司（BBC）與半島電視台（Al Jazeera）對 13 死、13 失聯、週一洪水灌入與延遲通報的經過一致。早期數字差異（3→8→13）是遺體陸續尋獲的進展，不是矛盾。\\n\\n仍不確定：13 名失聯者是否仍有生還者、全部死者身分、非法開採的組織者與獲利者是誰，以及後續是否逮捕或擴大取締邦格爾一帶的無照礦場。\"},\"category\":\"international\",\"disagreements\":null,\"glossary\":[{\"blurb\":{\"en\":\"The gold-mining area in Bogor Regency, West Java, where the illegal shafts flooded; state miner Antam runs a separate legal mine nearby.\",\"zh-TW\":\"西爪哇茂物縣的金礦區，本次非法礦坑在此淹水；國營安探在附近另有合法礦場。\"},\"term\":{\"en\":\"Pongkor\",\"zh-TW\":\"邦格爾（Pongkor）\"}},{\"blurb\":{\"en\":\"Indonesia's national search and rescue agency, leading the operation to reach the 13 trapped miners.\",\"zh-TW\":\"印尼國家搜救總署，領軍搜救 13 名受困礦工。\"},\"term\":{\"en\":\"Basarnas\",\"zh-TW\":\"國家搜救總署（Basarnas）\"}},{\"blurb\":{\"en\":\"Indonesia's state-owned mining company, operator of the legal Pongkor gold mine; it says the flooded pit was unauthorised and unrelated.\",\"zh-TW\":\"印尼國營礦商，營運合法的邦格爾金礦；聲明淹水礦坑未經許可、與其無關。\"},\"term\":{\"en\":\"Antam\",\"zh-TW\":\"安探（Antam）\"}}],\"id\":\"live-international-27-pongkor-illegal-mine-flood-13-dead\",\"imageAlt\":{\"en\":\"Rescue workers at a mine shaft at night (file image)\",\"zh-TW\":\"夜間礦坑口的搜救人員（資料畫面）\"},\"imageUrl\":\"\",\"isHeadline\":true,\"isPopular\":true,\"publishedAt\":\"2026-11-26T17:31:22.000Z\",\"sources\":[{\"name\":\"Reuters\",\"url\":\"https://www.reuters.com/world/asia-pacific/indonesian-rescuers-resume-search-13-people-trapped-inside-illegal-mine-after-13-2026-11-26/\"}],\"summary\":{\"en\":\"An illegal gold mine in Pongkor, West Java flooded on Monday when a river burst into its 100-metre shafts: 13 miners are confirmed dead and 13 are still trapped, with rescuers resuming the search on Thursday. Because the operation was unauthorised, authorities were alerted only after about 16 hours — a delay now central to the investigation.\",\"zh-TW\":\"印尼西爪哇邦格爾一座非法金礦週一遭河水灌入 100 公尺深坑道：13 名礦工確認死亡、13 人仍受困，搜救週四恢復。因礦場未經許可，事發約 16 小時後當局才獲報——這段延誤已成調查核心。\"},\"tags\":[],\"title\":{\"en\":\"Illegal Gold Mine Floods in Indonesia's Pongkor: 13 Miners Dead, 13 Still Trapped as Rescuers Resume Search\",\"zh-TW\":\"印尼邦格爾非法金礦淹水：13 名礦工死亡、13 人仍受困、搜救恢復進行\"},\"trustBreakdown\":{\"crossCorroboration\":24,\"outletReputation\":23,\"recencyClarity\":23,\"sourceDiversity\":13},\"trustScore\":83}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-international-27-pongkor-illegal-mine-flood-13-dead/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-international-27-pongkor-illegal-mine-flood-13-dead/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",
