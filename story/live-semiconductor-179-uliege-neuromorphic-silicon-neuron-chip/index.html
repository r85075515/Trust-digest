con neuron capable of dynamically adapting its electrical firing patterns—transitioning smoothly from regular spiking to rhythmic bursting—by adjusting just a single control parameter, mirroring biological neuromodulation.\n\nConventional artificial neural chips rely on fixed firing rules or bulky digital circuitry to alter neuron behavior, driving up energy use. Compact, context-adaptive analog silicon neurons enable ultra-low-power sensory processing and motor control in active prostheses, brain-machine interfaces, and autonomous edge robotics.\n\nBoth the University of Liège's EurekAlert! release and Bioengineer.org originate from the same university press release announcing the single-parameter neuromodulation breakthrough by Loris Mendolia and Alessio Franci in the peer-reviewed journal Neuromorphic Computing and Engineering (DOI 10.1088/2634-4386/aeaf14).\n\nScaling the single-neuron analog circuit into multi-thousand-neuron arrays without manufacturing variability degrading precision remains the next engineering hurdle before commercial semiconductor fabrication.\n\nTrust label: Single source — Both entries stem from the same University of Liège press release via EurekAlert! and syndication on Bioengineer.org."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-179-uliege-neuromorphic-silicon-neuron-chip\",\"category\":\"semiconductor\",\"title\":{\"en\":\"University of Liège Engineers Build Low-Power Silicon Neuron That Adapts Pulses Using One Parameter\",\"zh-TW\":\"比利時列日大學研發低功耗類腦矽神經元 單一參數即可動態切換脈衝模式\"},\"summary\":{\"en\":\"Engineers at Belgium's University of Liège unveiled an analog CMOS neuromorphic silicon neuron that mimics biological neuromodulation, switching between regular spiking and bursting with a single control parameter. Takeaway: Replicating biological adaptability in compact low-power silicon removes a major hardware bottleneck for edge robotics and brain-machine interfaces.\",\"zh-TW\":\"比利時列日大學研究團隊發表新型類比CMOS類腦矽神經元晶片，成功模擬生物神經調控機制，僅需調整單一參數即可讓電脈衝在規則放電與叢發模式間切換。一句結論：以單一參數實現類腦可塑性大幅降低硬體複雜度，為低功耗邊緣機器人與腦機介面開闢新路徑。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」比利時列日大學（University of Liège）神經工程團隊發表新型類比互補式金屬氧化物半導體（CMOS）類腦矽神經元電路，透過模擬生物大腦的「神經調控」（neuromodulation）機制，僅需改變單一控制參數，便能讓人工神經元在規則脈衝放電與叢發放電之間靈活切換。\\n\\n「為什麼重要」傳統類神經晶片若要改變神經元反應模式，往往需要複雜數位邏輯或額外功耗。列日大學團隊以精簡類比電路實現情境自適應能力，能在極低功耗下處理感測訊號與運動控制，對主動式義肢、腦機介面及邊緣端機器人具有關鍵應用潛力。\\n\\n「來源異同」列日大學透過《EurekAlert!》發布的官方新聞稿與《Bioengineer.org》刊載內容同屬同一篇大學新聞稿鏈，均說明研究人員洛里斯・門多利亞（Loris Mendolia）與阿萊西奧・弗朗西（Alessio Franci）的單一參數調控成果，並載明論文已刊登於同儕審查期刊《Neuromorphic Computing and Engineering》。\\n\\n「仍不確定」如何將單一類比矽神經元擴展至數千個以上的神經元陣列，並克服先進半導體製程變異對類比電路精準度的影響，仍有待後續晶圓級驗證。\\n\\nTrust label: Single source — 《EurekAlert!》與《Bioengineer.org》皆源自列日大學同一篇官方新聞稿。\"},\"glossary\":[{\"term\":{\"en\":\"Neuromorphic Engineering\",\"zh-TW\":\"類腦神經形態工程\"},\"blurb\":{\"en\":\"Integrated circuit design inspired by the biological architecture and energy efficiency of the human brain.\",\"zh-TW\":\"師法生物大腦神經網路結構與低功耗運作原理的積體電路與晶片設計領域。\"}},{\"term\":{\"en\":\"Neuromodulation\",\"zh-TW\":\"神經調控機制\"},\"blurb\":{\"en\":\"The biological process by which chemical signals alter a neuron's electrical firing pattern to fit changing contexts.\",\"zh-TW\":\"生物神經系統透過化學訊號動態調整神經元放電節律與敏感度，以適應不同環境情境的機制。\"}},{\"term\":{\"en\":\"Analog CMOS Circuit\",\"zh-TW\":\"類比 CMOS 電路\"},\"blurb\":{\"en\":\"Continuous-signal semiconductor circuitry built with standard Complementary Metal-Oxide-Semiconductor manufacturing.\",\"zh-TW\":\"採用標準互補式金屬氧化物半導體製程製造、直接處理連續電流或電壓訊號的低功耗電路。\"}}],\"sources\":[{\"name\":\"EurekAlert! (University of Liège)\",\"url\":\"https://www.eurekalert.org/news-releases/1153471\"},{\"name\":\"Bioengineer.org\",\"url\":\"https://bioengineer.org/low-power-silicon-neuron-uses-single-parameter-to-adapt-electrical-pulses/\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"Microscope image of the University of Liège neuromorphic silicon neuron chip\",\"zh-TW\":\"比利時列日大學研發之低功耗類腦矽神經元晶片顯微影像\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":75,\"trustBreakdown\":{\"crossCorroboration\":21,\"outletReputation\":22,\"recencyClarity\":22,\"sourceDiversity\":10},\"publishedAt\":\"2026-11-27T18:24:11.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":22,\"D2\":22,\"D3\":21,\"D4\":22,\"D5\":21,\"total\":22},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-semiconductor-179-uliege-neuromorphic-silicon-neuron-chip/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-semiconductor-179-uliege-neuromorphic-silicon-neuron-chip/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"d:\"$8:metadata\"\n"])</script></body></html>
