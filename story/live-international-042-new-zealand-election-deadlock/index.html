amentary majority, handing decisive leverage to the unaligned centrist Opportunity Party.\n\nAccording to the confirmed count of 2.8 million votes, Prime Minister Christopher Luxon's National Party and its traditional allies—libertarian ACT with 13 seats and populist NZ First with 12—won a combined 65 seats in the 130-seat unicameral Parliament, one seat short of the 66 required to govern. The left-wing opposition led by Labour's Chris Hipkins secured 58 seats, including 36 for Labour, 17 for the Greens, and five for Te Pāti Māori. Hipkins acknowledged Friday that Opportunity's seven seats would not be enough to form a left-wing government.\n\nLuxon reversed his pre-election pledge against working with Opportunity, led by 38-year-old newcomer Qiulae Wong. However, coalition talks face steep policy hurdles: Wong's five bottom-line demands include tougher climate action and ending bottom-trawling fisheries—directly clashing with ACT and NZ First—and she reiterated she will not join a government if NZ First leader Winston Peters serves as Foreign Minister.\n\nTrust label: Multi-source agreement — AP News and The Hill report identical final seat counts and coalition constraints."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-042-new-zealand-election-deadlock\",\"category\":\"international\",\"title\":{\"en\":\"New Zealand Final Vote Count Ends in Deadlock, Leaving Centrist Opportunity Party as Kingmaker\",\"zh-TW\":\"紐西蘭大選最終計票陷入僵局 中間派新政黨「機會黨」成組閣關鍵\"},\"summary\":{\"en\":\"New Zealand's final election tally left Prime Minister Christopher Luxon's right-wing bloc one seat short of a majority at 65 seats in the 130-seat Parliament, elevating the unaligned centrist Opportunity Party and its seven seats into the decisive kingmaker role.\",\"zh-TW\":\"紐西蘭國會大選最終計票結果出爐，現任總理盧克森（Christopher Luxon）領導的右翼陣營在 130 席國會中拿下 65 席，距離過半門檻僅差 1 席；首度進入國會的中間派「機會黨」（Opportunity Party）憑藉 7 席成為左右新政府組成的關鍵造王者。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n紐西蘭國會大選最終計票結果公布，在總計 280 萬張選票中，左右兩大傳統陣營均未能單獨取得過半席次。現任看守總理盧克森（Christopher Luxon）所屬的國家黨（National Party）連同傳統盟友行動黨（ACT，13 席）與紐西蘭優先黨（NZ First，12 席），合計取得 65 席，距離 130 席單院制國會的 66 席過半門檻僅差 1 席。由希普金斯（Chris Hipkins）領導的工黨（36 席）加上綠黨（17 席）與毛利黨（Te Pāti Māori，5 席）共獲 58 席。首次跨過門檻進入國會的中間派「機會黨」（Opportunity Party）拿下 7 席，成為決定新政府能否組成的關鍵力量。\\n\\n「為什麼重要」\\n兩大主要政黨得票率雙雙跌破 30%（工黨 29.88%、國家黨 28.35%），反映選民對高生活成本的不滿以及對傳統兩黨政治的疏離。由於機會黨的 7 席即使加上左翼陣營也僅 65 席無法過半，希普金斯週五已形同承認敗選；盧克森則被迫推翻選前「絕不與機會黨合作」的承諾，但若談判破裂，紐西蘭恐面臨重新大選的風險。\\n\\n「來源異同」\\n美聯社（AP News）與美國國會山莊報（The Hill）引述的最終席次分布與政黨表態完全一致。報導均指出，由 38 歲政壇新人黃秋蕾（Qiulae Wong）領導的機會黨堅持五大「底線」政策（包含強化氣候行動與禁止底拖網捕魚），與行動黨及紐西蘭優先黨立場尖銳對立，且黃秋蕾重申若紐西蘭優先黨黨魁彼得斯（Winston Peters）續任外交部長，機會黨將拒絕入閣。\\n\\n「仍不確定」\\n盧克森將如何化解機會黨與右翼盟友在氣候、漁業及內閣人事上的政策衝突、機會黨最終會選擇正式聯合政府或「信任與撥款」（confidence and supply）協議，以及組閣談判將持續多久，目前均未明朗。\"},\"glossary\":[{\"term\":{\"en\":\"Kingmaker\",\"zh-TW\":\"造王者\"},\"blurb\":{\"en\":\"A smaller political party whose parliamentary seats hold the balance of power needed for a larger bloc to form a majority government.\",\"zh-TW\":\"在國會兩大陣營皆未過半時，掌握關鍵少數席次、能決定由誰執政的小型政黨。\"}},{\"term\":{\"en\":\"Confidence and supply agreement\",\"zh-TW\":\"信任與撥款協議\"},\"blurb\":{\"en\":\"An arrangement where a minor party agrees to back a minority government on budget bills and no-confidence votes without joining the cabinet.\",\"zh-TW\":\"小黨不加入內閣，但承諾在政府預算案與不信任投票中支持少數派政府執政的政治協議。\"}},{\"term\":{\"en\":\"Unicameral Parliament\",\"zh-TW\":\"單院制國會\"},\"blurb\":{\"en\":\"A legislature consisting of a single legislative chamber, as used in New Zealand's 130-seat House of Representatives.\",\"zh-TW\":\"僅設有一個立法議院的國會制度，紐西蘭即採用 130 席的單院制眾議院。\"}}],\"sources\":[{\"name\":\"AP News\",\"url\":\"https://apnews.com/article/new-zealand-election-results-a19a838d8256a0762703ff0572aca3e6\"},{\"name\":\"The Hill\",\"url\":\"https://thehill.com/homenews/ap/ap-international/ap-final-count-in-new-zealands-election-gives-neither-right-nor-left-bloc-enough-seats-for-a-majority/\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"New Zealand Parliament building in Wellington following the deadlocked final election count\",\"zh-TW\":\"紐西蘭大選最終計票陷入僵局後的威靈頓國會大廈\"},\"isHeadline\":true,\"isPopular\":true,\"trustScore\":88,\"trustBreakdown\":{\"crossCorroboration\":23,\"outletReputation\":23,\"recencyClarity\":22,\"sourceDiversity\":20},\"publishedAt\":\"2026-11-27T14:15:54.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":5,\"D2\":4,\"D3\":4,\"D4\":4,\"D5\":4,\"total\":21},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-international-042-new-zealand-election-deadlock/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-international-042-new-zealand-election-deadlock/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"d
