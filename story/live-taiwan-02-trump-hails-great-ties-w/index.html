mies met for talks in China, Bloomberg reports.\nWhat happened\nTrump made the remarks hours before the meeting, praising his friendship with Xi while playing down the Nvidia case. The BBC frames the same moment from Beijing's side: as Trump and Xi meet, China's AI ambitions face an unexpected hurdle in the Nvidia spy scandal, and China worries the scandal could ramp up pressure on the US to further restrict sales of advanced chips.\nWhy it matters\nTrump's tone sets the summit's public mood, but the chip question underneath it is unresolved: if Washington tightens advanced-chip sales further, China's AI plans take a direct hit. The two leaders' friendly framing will be tested against whatever the talks produce on chips.\nSources agree / disagree\nBloomberg and the BBC report the same remarks from different angles — Bloomberg on Trump's praise and dismissal of the scandal, the BBC on Beijing's chip worries. No numeric or name conflicts appear in the snippets.\nStill uncertain\nDetails of the Nvidia scandal itself, and whether the US will in fact tighten chip restrictions, are beyond the snippets. Verify on the publisher pages.\nTrust label: Two-source agreement"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-02-trump-hails-great-ties-w\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-taiwan-02-trump-hails-great-ties-w.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Trump Hails ‘Great’ Ties With Xi, Downplays Nvidia Scandal\",\"zh-TW\":\"相關封面圖：（譯文待補）Trump Hails ‘Great’ Ties With Xi, Downplays Nvidia Scandal\"},\"publishedAt\":\"2026-11-19T01:44:42.000Z\",\"title\":{\"en\":\"Trump Hails 'Great' Ties With Xi, Downplays Nvidia Spy Scandal Hours Before China Talks\",\"zh-TW\":\"川普（Trump）稱與習近平（Xi Jinping）關係「很好」，淡化輝達（Nvidia）間諜醜聞\"},\"summary\":{\"en\":\"Hours before meeting Xi Jinping in China, Donald Trump hailed his 'great' friendship with the Chinese leader and downplayed the Nvidia spying scandal, Bloomberg reports. Beijing worries the scandal could push Washington to tighten advanced-chip sales further. Watch whether the summit produces any chip-related easing.\",\"zh-TW\":\"川普（Trump）在中國會見習近平（Xi Jinping）前幾小時，稱讚與這位中國領袖的「偉大友誼」，並淡化輝達（Nvidia）間諜醜聞，彭博社（Bloomberg）報導。北京擔心醜聞會推動華府進一步收緊先進晶片銷售。接下來看峰會能否在晶片議題上有所鬆動。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"彭博社（Bloomberg）報導，就在世界兩大經濟體領袖於中國會談前幾小時，美國總統川普（Trump）稱讚與中國國家主席習近平（Xi Jinping）的「偉大友誼」，並淡化涉及輝達（Nvidia）的間諜醜聞。\\n發生了什麼事\\n川普在會談前幾小時發表上述談話，一面讚揚與習近平的友誼，一面淡化輝達案。英國廣播公司（BBC）從北京的角度框定同一時刻：川普與習近平會面之際，中國的 AI 夢想面臨輝達間諜醜聞這個意外障礙；中國擔心醜聞會加大美國進一步限制先進晶片銷售的壓力。\\n為什麼重要\\n川普的語氣定調了峰會的公開氣氛，但底下的晶片問題仍未解決：如果華府進一步收緊先進晶片銷售，中國的 AI 計畫將直接受衝擊。兩位領袖的友好表述，將由會談在晶片議題上的實際成果來檢驗。\\n來源異同\\n彭博社與英國廣播公司從不同角度報導同一組談話——彭博社聚焦川普的讚揚與淡化，英國廣播公司聚焦北京的晶片憂慮。摘要片段中沒有數字或人名衝突。\\n仍不確定\\n輝達醜聞本身的細節、美國是否真的會收緊晶片限制，都超出摘要範圍；引用前請查閱原文。\"},\"sources\":[{\"name\":\"BBC News-Asia\",\"url\":\"https://www.bbc.co.uk/news/articles/c5vg23g92rj4o?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"Bloomberg News\",\"url\":\"https://www.bloomberg.com/news/articles/2026-11-19/trump-hails-great-ties-with-xi-downplays-nvidia-spy-scandal\"}],\"disagreements\":null,\"trustScore\":72,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":19,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"bbc-news-asia\",\"bloomberg-news\"],\"glossary\":[{\"term\":{\"en\":\"Donald Trump\",\"zh-TW\":\"唐納·川普\"},\"blurb\":{\"en\":\"President of the United States, praising his ties with Xi.\",\"zh-TW\":\"稱讚與習近平關係的美國總統。\"}},{\"term\":{\"en\":\"Xi Jinping\",\"zh-TW\":\"習近平\"},\"blurb\":{\"en\":\"President of China, meeting Trump in China.\",\"zh-TW\":\"在中國與川普會面的中國國家主席。\"}},{\"term\":{\"en\":\"Nvidia\",\"zh-TW\":\"輝達\"},\"blurb\":{\"en\":\"US chipmaker at the centre of the spy scandal.\",\"zh-TW\":\"間諜醜聞核心的美國晶片公司。\"}},{\"term\":{\"en\":\"Advanced chips\",\"zh-TW\":\"先進晶片\"},\"blurb\":{\"en\":\"High-end chips whose sale to China the US may further
