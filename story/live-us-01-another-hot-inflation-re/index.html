flation reading came in hot, keeping the Federal Reserve on track to raise interest rates again. The Federal Reserve is widely expected to raise interest rates next month. The feed snippet gives no figure for the inflation reading, no date for the rate decision beyond next month, and no detail on which price index the reading comes from, so this card records the direction of the story only: hot inflation, and a hike still expected.\nWhy it matters\nThe judgement here is about persistence: a hot reading that leaves the hiking path intact tells borrowers and markets that inflation has not cooled enough to change the Fed's course. A rate rise next month would mean higher borrowing costs for mortgages, credit cards and business loans, and it would confirm that the Fed still sees inflation, not growth, as the problem to solve. For readers, the practical signal is timing, not surprise: the market already expects the move, and this reading removes a reason to doubt it.\nSources agree / disagree\nOnly the New York Times has reported this so far, so there is no second outlet to check the account against. Trust label: Single source — one outlet only, so the account is unconfirmed pending corroboration.\nStill uncertain\nThe inflation figure itself, which index it comes from, the size of the expected hike, and whether any Fed officials have commented on the reading are not in the feed snippet. Until the underlying data is published, the story rests on the Times's characterisation of the reading as hot, and the hike remains an expectation rather than a decision."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-us-01-another-hot-inflation-re\",\"category\":\"us\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-us-01-another-hot-inflation-re.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Another Hot Inflation Reading Keeps Fed on Track to Raise Rates Again\",\"zh-TW\":\"相關封面圖：另一個熱門通膨數據使聯準會預計將再次升息\"},\"publishedAt\":\"2026-11-25T19:13:30.000Z\",\"title\":{\"en\":\"Hot Inflation Reading Keeps Fed on Track to Raise Rates Again\",\"zh-TW\":\"通膨數據再度偏熱，聯準會料將再度升息\"},\"summary\":{\"en\":\"[Unconfirmed · Single source] Another hot inflation reading keeps the Federal Reserve on track to raise interest rates again, with a hike expected next month, the New York Times reports. The reading leaves the Fed's tightening path intact rather than forcing a rethink. Takeaway: sticky inflation means higher borrowing costs are coming, and next month is the date to watch.\",\"zh-TW\":\"［未證實·單一來源］《紐約時報》報導，又一項偏熱的通膨數據讓聯準會維持再度升息的路線，市場普遍預期下個月就會升息。這項數據沒有改變聯準會的緊縮路徑，也沒有迫使它重新思考。重點：通膨居高不下意味著借貸成本將再上升，下個月是關鍵時間點。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"《紐約時報》報導，又一項偏熱的通膨數據讓聯準會維持再度升息的路線，市場普遍預期下個月就會升息。\\n發生了什麼事\\n《紐約時報》報導，新出爐的通膨數據偏熱，聯準會因此維持再度升息的路線。市場普遍預期聯準會下個月升息。片段沒有給出通膨數據的具體數字、除了下個月之外也沒有升息決定的日期，更沒有說明數據來自哪項物價指數，因此本卡只記錄故事的方向：通膨偏熱、升息仍在預期之中。\\n為什麼重要\\n這裡的判斷在於持續性：偏熱的數據沒有改變升息路徑，告訴借款人與市場，通膨尚未降溫到足以讓聯準會改變路線。下個月若升息，房貸、信用卡與企業貸款的借貸成本都會上升，也證實聯準會仍把通膨、而非成長，視為要解決的問題。對讀者來說，實際訊號在時機，而非意外：市場早已預期這一步，這項數據只是消除了一個懷疑的理由。\\n來源異同\\n目前只有《紐約時報》一家報導，無法以第二家媒體交叉核對。信任標籤：僅1源——只有一家媒體報導，內容未經證實，待其他來源佐證。\\n仍不確定\\n通膨數據本身的數字、來自哪項指數、預期升息幅度、是否有聯準會官員就此數據發言，片段中都沒有。在底層數據公布之前，整則消息建立在《紐約時報》將數據形容為「偏熱」的基礎上，升息也仍是預期，而非決定。\"},\"sources\":[{\"name\":\"NYT Economy\",\"url\":\"https://www.nytimes.com/2026/11/25/business/economy/inflation-pce-interest-rates.html\"}],\"disagreements\":null,\"trustScore\":60,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":23,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"us\",\"live-ingest\",\"nyt-economy\"],\"glossary\":[{\"term\":{\"en\":\"Federal Reserve\",\"zh-TW\":\"聯準會\"},\"blurb\":{\"en\":\"US central bank, widely expected to raise interest rates next month.\",\"zh-TW\":\"市場普遍預期下個月升息的美國中央銀行。\"}},{\"term\":{\"en\":\"inflation reading\",\"zh-TW\":\"通膨數據\"},\"blurb\":{\"en\":\"A measure of price rises, described as hot in this report.\",\"zh-TW\":\"衡量物價漲幅的數據，本篇報導形容為偏熱。\"}},{\"term\":{\"en\"
