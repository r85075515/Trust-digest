ter, so a 7% average rise already bites, and a roughly 70% jump for heating-oil users is far heavier. A war disrupting fuel supply lands directly on household bills.\nSources agree / disagree\nOnly the New York Times has reported the figures so far, with no other outlet yet corroborating them. Trust label: Single source — only the New York Times has reported the figures, and they await corroboration.\nStill uncertain\nFeed snippets capture headlines and short descriptions, not the full article. The basis for the estimates, regional differences and whether the government will offer relief still await fuller reporting; check the New York Times' full coverage before quoting specifics."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-us-02-heating-costs-will-rise-\",\"category\":\"us\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-us-02-heating-costs-will-rise-.jpg\",\"imageAlt\":{\"en\":\"Cover related to: US Heating Costs to Rise 7% on Average This Winter\",\"zh-TW\":\"相關封面圖：美國今冬暖氣費平均漲7%：暖氣油用戶恐漲約七成\"},\"publishedAt\":\"2026-11-11T17:16:17.000Z\",\"title\":{\"en\":\"US Heating Costs to Rise 7% on Average This Winter\",\"zh-TW\":\"美國今冬暖氣費平均漲7%：暖氣油用戶恐漲約七成\"},\"summary\":{\"en\":\"［未證實·單一來源］US heating costs will rise 7% on average this winter, with households using heating oil facing increases of around 70% as the war in Iran has sharply cut supply of that fuel. Only the New York Times has reported the figures so far. Watch fuel prices and whether relief measures follow for households facing the steepest bills.\",\"zh-TW\":\"［未證實·單一來源］美國今年冬天暖氣費用平均將上漲7%，其中使用暖氣油的家庭漲幅約七成，主因是伊朗戰爭大幅削減了暖氣油供應。目前僅《紐約時報》報導此事。接下來要看油價走勢與政府是否推出補助，減輕寒冬取暖負擔。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"美國今年冬天暖氣費用平均將上漲7%，其中使用暖氣油的家庭漲幅約七成，主因是伊朗戰爭大幅削減了暖氣油供應。\\n發生了什麼事\\n《紐約時報》報導，美國今冬暖氣費用平均上漲7%。使用暖氣油的家庭首當其衝，漲幅約七成，原因是伊朗戰爭大幅削減了暖氣油供應。7% 是全體家庭的平均漲幅，70% 則是暖氣油用戶的漲幅，兩者指涉不同族群，並非數字衝突。\\n為什麼重要\\n暖氣費是每個家庭過冬的剛性支出，平均漲7%已是不小的負擔，暖氣油用戶面臨約七成的漲幅更是沉重。燃料供應受戰爭衝擊，取暖成本直接反映在民生帳單上。\\n來源異同\\n目前僅《紐約時報》一家報導此事，尚無其他媒體佐證。信任標籤：單一來源——僅《紐約時報》報導，尚未獲得其他媒體佐證。\\n仍不確定\\n來源摘要只呈現標題與簡短描述，並非全文。漲幅的計算基準、各地區差異，以及政府是否推出補助，仍待完整報導確認；引用細節前請查閱《紐約時報》的完整報導。\"},\"sources\":[{\"name\":\"NYT Economy\",\"url\":\"https://www.nytimes.com/2026/11/11/business/energy-environment/winter-heating-oil-costs.html\"}],\"disagreements\":null,\"trustScore\":60,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":23,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"us\",\"live-ingest\",\"nyt-economy\"],\"glossary\":[{\"blurb\":{\"en\":\"Fuel used for home heating, whose users face increases of around 70%.\",\"zh-TW\":\"家用暖氣燃料，今冬用戶漲幅約七成。\"},\"term\":{\"en\":\"Heating oil\",\"zh-TW\":\"暖氣油\"}},{\"blurb\":{\"en\":\"Country whose war has sharply cut the supply of heating oil.\",\"zh-TW\":\"伊朗，戰爭大幅削減暖氣油供應的國家。\"},\"term\":{\"en\":\"Iran\",\"zh-TW\":\"伊朗\"}},{\"blurb\":{\"en\":\"US newspaper and the sole outlet reporting the heating-cost figures so far.\",\"zh-TW\":\"美國報紙，目前唯一報導暖氣費漲幅的媒體。\"},\"term\":{\"en\":\"The New York Times\",\"zh-TW\":\"《紐約時報》\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-us-02-heating-costs-will-rise-/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"
