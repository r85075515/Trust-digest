 the move as a long-anticipated entry into photonics by Marvell, characterized as an AI networking specialist that Nvidia Chief Executive Jensen Huang calls the next trillion-dollar company. One headline frames the target as a photonics chipmaker and the purpose as bolstering AI connectivity, while the sister report frames it as expanding Marvell's AI connectivity portfolio. The snippets cut off while describing the implied value of the offer, so the per-share valuation detail is incomplete in the material provided.\n\nWhy it matters\nOptical connectivity is a critical layer in AI data centers, where large volumes of data must move between processors quickly, and owning photonics capability would let Marvell offer more of that stack itself rather than relying on outside suppliers. A transaction valued at about 115 billion dollars would be a major consolidation move in the AI infrastructure supply chain, which explains the attention from semiconductor industry publications. The all-stock structure also matters for shareholders of both companies, since the value they ultimately receive will move with Marvell's share price rather than being fixed in cash. Closing conditions and regulatory steps are not described in the snippets.\n\nSources agree / disagree\nTrust label: Two-source agreement — Two industry outlets report the same acquisition, the same all-stock structure, and the same AI connectivity rationale.\nBoth reports name Marvell as the buyer and Lumentum as the target, and both tie the deal to AI connectivity and data center infrastructure. No conflicting valuation or exchange ratio appears between them; the detailed figures come from the fuller of the two reports and are not contradicted by the other.\n\nStill uncertain\nThe per-share implied value is truncated mid-sentence, and the snippets do not state when the deal is expected to close, what approvals it needs, or how the combined company will be organized. They also do not include reaction from either company's leadership beyond the deal terms. Whether the approximately 115 billion dollar valuation reflects announcement-day prices, and how it may change before closing, cannot be determined from this material."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-01-marvell-snaps-photonics-\",\"category\":\"semiconductor\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"https://www.eetimes.com/wp-content/uploads/Hero-image-Marvell-1.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Marvell Snaps Photonics Chipmaker Lumentum to Bolster AI Connectivity\",\"zh-TW\":\"相關封面圖：Marvell 收購光子晶片製造商 Lumentum 以增強人工智慧連接\"},\"publishedAt\":\"2026-11-03T23:10:39.000Z\",\"title\":{\"en\":\"Marvell agrees to acquire Lumentum in an all-stock deal valued at about 115 billion dollars\",\"zh-TW\":\"邁威爾（Marvell）以約1150億美元全股票交易收購光子晶片商魯門特姆（Lumentum）\"},\"summary\":{\"en\":\"Marvell Technology has agreed to acquire optical component maker Lumentum in an all-stock transaction valued at approximately 115 billion dollars, combining their semiconductor, optical connectivity, and manufacturing capabilities for AI data center infrastructure. Lumentum shareholders will receive 4.5 shares of Marvell common stock for each Lumentum share held.\",\"zh-TW\":\"邁威爾科技（Marvell Technology）同意以全股票交易收購光學元件製造商魯門特姆（Lumentum），交易價值約1150億美元，結合雙方在半導體、光學連接與製造的能力，服務人工智慧資料中心基礎建設。魯門特姆股東每持有一股將換得4.5股邁威爾普通股。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"邁威爾科技（Marvell Technology）同意收購光子技術專家魯門特姆（Lumentum），以一筆大規模全股票交易強化其在人工智慧資料中心連接領域的地位。\\n\\n發生了什麼事\\n邁威爾科技（Marvell Technology）同意以全股票交易收購魯門特姆（Lumentum），交易價值約1150億美元，結合兩家公司在半導體、光學連接與製造方面的能力，服務人工智慧資料中心基礎建設。依協議，魯門特姆股東每持有一股，將換得4.5股邁威爾普通股。報導形容這是邁威爾期待已久進軍光子學的動作；該公司被定位為人工智慧網路專家，輝達（Nvidia）執行長黃仁勳（Jensen Huang）稱其為下一家兆美元公司。一則標題將收購對象定調為光子晶片製造商、目的為增強人工智慧連接，另一則姊妹報導則定調為擴充邁威爾的人工智慧連接產品組合。摘要在描述收購出價的隱含價值時中途截斷，因此每股估值細節在現有素材中並不完整。\\n\\n為什麼重要\\n光學連接是人工智慧資料中心的關鍵層次，大量資料必須在處理器之間快速移動；掌握光子技術能力，將讓邁威爾能自行提供更多這類技術堆疊，而不必依賴外部供應商。一筆價值約1150億美元的交易，將是人工智慧基礎建設供應鏈中的重大整併動作，這也說明半導體產業刊物為何關注此事。全股票結構對兩家公司股東同樣重要，因為他們最終收到的價值將隨邁威爾股價浮動，而非固定現金。摘要未描述交割條件與監管步驟。\\n\\n來源異同\\n兩家產業媒體報導的是同一樁收購：相同的全股票結構與相同的人工智慧連接理由。兩則報導都指明邁威爾（Marvell）為買方、魯門特姆（Lumentum）為收購對象，並都把交易與人工智慧連接及資料中心基礎建設連結。兩者之間沒有互相衝突的估值或換股比率；詳細數字來自較完整的一則報導，未被另一則反駁。\\n\\n仍不確定\\n每股隱含價值在句中被截斷，摘要也未說明交易預計何時交割、需要哪些核准，或合併後公司的組織方式。除了交易條款外，摘要也未收錄兩家公司領導層的反應。這筆約1150億美元的估值是否反映宣布當日的股價、以及在交割前可能如何變化，都無法從現有素材判定。\"},\"sources\":[{\"name\":\"EE Times\",\"url\":\"https://www.eetimes.com/marvell-snaps-photonics-chipmaker-lumentum-to-bolster-ai-connectivity/\"},{\"name\":\"EE Times Asia\",\"url\":\"https://www.eetasia.com/marvell-to-expand-ai-connectivity-portfolio-with-lumentum-acquisition/\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":13,\"outletReputation\":10,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"semiconductor\",\"live-ingest\",\"ee-times\",\"ee-times-asia\"],\"glossary\":[{\"term\":{\"en\":\"Marvell Technology\",\"zh-TW\":\"邁威爾科技（Marvell Technology）\"},\"blurb\":{\"en\":\"Marvell Technology is the semiconductor company acquiring Lumentum in the all-stock deal.\",\"zh-TW\":\"邁威爾科技（Marvell Technology）是在全股票交易中收購魯門特姆的半導體公司。\"}},{\"term\":{\"en\":\"Lumentum\",\"zh-TW\":\"魯門特姆（Lumentum）\"},\"blurb\":{\"en\":\"Lumentum is the optical component and photonics maker being acquired by Marvell.\",\"zh-TW\":\"魯門特姆（Lumentum）是被邁威爾收購的光學元件與光子技術製造商。\"}},{\"term\":{\"en\":\"Jensen Huang\",\"zh-TW\":\"黃仁勳（Jensen Huang）\"},\"blurb\":{\"en\":\"Jensen Huang is Nvidia's chief executive, quoted as calling Marvell the next trillion-dollar company.\",\"zh-TW\":\"黃仁勳（Jensen Huang）是輝達執行長，被引述稱邁威爾為下一家兆美元公司。\"}},{\"term\":{\"en\":\"Nvidia\",\"zh-TW\":\"輝達（Nvidia）\"},\"blurb\":{\"en\":\"Nvidia is the AI chip company whose chief executive's remark about Marvell the reports cite.\",\"zh-TW\":\"輝達（Nvidia）是其執行長對邁威爾評論被報導引述的人工智慧晶片公司。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewp
