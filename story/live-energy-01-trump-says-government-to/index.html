ame on Tuesday evening in Lubbock, Texas, during a campaign rally, according to The Guardian's report. The rules at issue hold oil and gas companies accountable for large leaks of planet-warming methane; Trump said ending them would save companies and consumers billions. The Guardian frames the move as the administration's latest gift to the oil and gas sector, and notes critics warning of climate danger from loosening leak controls.\nWhy it matters\nMethane policy is climate policy with a short fuse: leaks warm the planet quickly, so rules that catch them matter more per ton than many slower pollutants. Turning a rollback into a rally applause line also matters politically — it converts an administrative decision into a midterm promise, and makes the savings claim a campaign number before any regulator has published one.\nSources agree-disagree\nThis card lists only The Guardian, so its announcement account is single-sourced. A related card in the same batch carries Verge and Hill items on the same methane rollback direction, but those outlets are not sources for this card and are not counted as corroboration here. Trust label: single-source — a public announcement reported by one outlet.\nStill uncertain\nThe snippet does not give the rollback's legal form, timeline, or scope — whether 'terminating' means a proposal, a final rule, or a repeal process — and the billions in savings are Trump's claim, not a published estimate. The accountability gap to watch: which leaks, if any, would still be caught once the rules fall."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-energy-01-trump-says-government-to\",\"category\":\"energy\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-energy-01-trump-says-government-to.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Trump says government to ‘terminate’ Biden-era methane emissions rules\",\"zh-TW\":\"相關封面圖：川普表示政府將「終止」拜登時代的甲烷排放規則\"},\"publishedAt\":\"2026-10-28T01:45:27.000Z\",\"title\":{\"en\":\"Trump says administration will 'terminate' Biden-era methane rules\",\"zh-TW\":\"川普（Donald Trump）稱政府將「終止」拜登（Joe Biden）時代甲烷管制\"},\"summary\":{\"en\":\"[Single-source, unconfirmed] President Donald Trump told a Lubbock, Texas, rally on Tuesday evening that his administration is 'terminating' Biden-era rules holding oil and gas companies accountable for large methane leaks, claiming billions in savings. Critics warn of climate danger. The takeaway: deregulation is now a campaign promise delivered on stage, with the climate cost still disputed.\",\"zh-TW\":\"［未證實·單一來源］川普（Donald Trump）週二晚間在德州拉伯克（Lubbock）造勢場合宣布，政府將「終止」拜登（Joe Biden）時代要求石油天然氣公司為甲烷大量洩漏負責的管制，並稱可為企業與消費者省下數十億美元；批評者警告氣候風險。結論：鬆綁已從政見變成台上的承諾，氣候代價仍有爭議。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"川普（Donald Trump）在德州造勢場合說，政府將「終止」拜登（Joe Biden）時代的甲烷管制，把鬆綁包裝成省下數十億美元的利多，批評者則警告氣候風險。\\n發生了什麼事\\n根據《衛報》的報導，宣布是在週二晚間、德州拉伯克（Lubbock）的競選集會上做出的。相關管制要求石油天然氣公司為大量洩漏、導致地球暖化的甲烷負責；川普說，終止管制可為企業與消費者省下數十億美元。《衛報》把這一步定性為政府送給油氣業的最新禮物，並指出批評者警告放寬洩漏管制帶來的氣候危險。\\n為什麼重要\\n甲烷政策是引信很短的氣候政策：洩漏的暖化效應來得快，因此抓漏的規則每噸都比許多慢效污染物更關鍵。把放寬變成造勢場合的掌聲台詞，在政治上同樣重要——它把一項行政決定變成期中選舉承諾，而『省下數十億』的數字在任何監管機關公布估算之前，就先成了競選數字。\\n來源異同\\n本卡只列《衛報》一家來源，因此宣布內容是單一來源。同批另一張卡另有 The Verge 與 The Hill 關於同一甲烷放寬方向的報導，但那些媒體並非本卡來源，在此不計為佐證。信任標籤：僅1源——一家媒體報導的公開宣布。\\n仍不確定\\n摘要沒有交代放寬的法律形式、時間表或範圍——『終止』是指提案、定案規則，還是廢止程序——而數十億美元的節省只是川普的說法，不是已公布的估算。值得追蹤的問責缺口是：規則倒下之後，還有哪些洩漏會被抓到。\"},\"sources\":[{\"name\":\"The Guardian Environment\",\"url\":\"https://www.theguardian.com/us-news/2026/oct/27/trump-biden-era-methane-emissions-rules-oil-gas\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"energy\",\"live-ingest\",\"the-guardian-environment\"],\"glossary\":[{\"term\":{\"en\":\"Donald Trump\",\"zh-TW\":\"川普\"},\"blurb\":{\"en\":\"President of the United States, who announced the methane rollback.\",\"zh-TW\":\"宣布終止甲烷管制的美國總統。\"}},{\"term\":{\"en\":\"Joe Biden\",\"zh-TW\":\"拜登\"},\"blurb\":{\"en\":\"Former U.S. president under whom the methane rules were set.\",\"zh-TW\":\"甲烷管制制定時的前任美國總統。\"}},{\"term\":{\"en\":\"methane\",\"zh-TW\":\"甲烷\"},\"blurb\":{\"en\":\"A planet-warming greenhouse gas leaked by oil and gas operations.\",\"zh-TW\":\"導致地球暖化的強效溫室氣體。\"}},{\"term\":{\"en\":\"The Guardian\",\"zh-TW\":\"衛報\"},\"blurb\":{\"en\":\"British news outlet reporting the Lubbock rally announcement.\",\"zh-TW\":\"報導拉伯克集會宣布的英國媒體。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://r85075515.github.io/Trust-digest/\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"Axiom\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"zh_TW\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:locale:alternate\",\"content\":\"en_US\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"9\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"10\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"11\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainab
