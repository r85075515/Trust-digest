s central question is whether an AI chatbot could sway a voter to switch parties or re-examine political beliefs.\nWhat happened\nPeople pepper artificial intelligence chatbots with questions every day, MIT News reported, but the role of AI platforms in politics ahead of the midterms is the focus of the new tool. The observatory examines how popular platforms respond, in real time, to election-related questions. The report frames the project as a question about influence: whether chatbots could move voters, rather than as a set of findings.\nWhy it matters\nThe judgment is about timing: the dashboard arrives before voters decide, when chatbot answers could still shape how questions are framed. If AI platforms answer political questions unevenly, voters may never see the imbalance. A real-time observatory makes that influence observable instead of leaving it to anecdote.\nSources agree / disagree\nOnly MIT News reports the dashboard in the supplied material, with no second outlet corroborating its scope or methods. Trust label: Single source — one outlet reports the project, with no independent corroboration in the material. MIT News is the institution's own news outlet, reporting its own researchers' work.\nStill uncertain\nThe snippet does not name the researchers, list the platforms examined, describe the dashboard's methods, or report any findings. Whether chatbots sway voters remains an open question in this material, not an answered one. Verify the project's scope and results in the full MIT News report."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-ai-03-q-a-hey-ai-who-should-i-\",\"category\":\"ai\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"https://news.mit.edu/sites/default/files/styles/news_article__cover_image__original/public/images/202610/MIT-ElectionLLM-01-press.jpg?itok=F-_mE_pt\",\"imageAlt\":{\"en\":\"Cover related to: Q\u0026A: Hey AI, who should I vote for this year?\",\"zh-TW\":\"相關封面圖：Q：嘿 AI，今年我該投給誰？\"},\"publishedAt\":\"2026-10-30T19:00:00.000Z\",\"title\":{\"en\":\"MIT: New Dashboard Tracks How AI Chatbots Answer Election Questions\",\"zh-TW\":\"麻省理工學院（MIT）：新儀表板追蹤 AI 聊天機器人如何回答選舉問題\"},\"summary\":{\"en\":\"[Unconfirmed · Single source] MIT researchers built a dashboard called the LLM Election Observatory to examine in real time how popular AI platforms answer political questions. People ask chatbots questions every day, MIT News reported, ahead of the 2026 United States midterm elections. The key question is whether a chatbot could sway a voter to switch parties or rethink beliefs.\",\"zh-TW\":\"［未證實·單一來源］麻省理工學院（MIT）研究人員建立名為大型語言模型選舉觀察站（LLM Election Observatory）的新儀表板，即時檢視熱門 AI 平台如何回答政治問題。人們每天向聊天機器人提問，麻省理工學院新聞報導，2026 年美國期中選舉在即。關鍵問題是，聊天機器人能否影響選民轉換政黨或重新思考政治信念。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"麻省理工學院（MIT）研究人員建立一個儀表板，即時檢視熱門 AI 平台如何回答政治問題，2026 年美國期中選舉在即。儀表板名為大型語言模型選舉觀察站（LLM Election Observatory）。核心問題是，AI 聊天機器人能否影響選民轉換政黨或重新檢視政治信念。\\n發生了什麼事\\n麻省理工學院新聞報導，人們每天向人工智慧聊天機器人提出各種問題，期中選舉在即，AI 平台在政治中的角色成為新工具的關注焦點。觀察站即時檢視熱門平台如何回應選舉相關問題。報導把這項計畫定位為影響力的提問：聊天機器人能否影響選民，而不是一組調查結果。\\n為什麼重要\\n判斷在於時機：儀表板在選民做決定前推出，聊天機器人的回答仍可能形塑問題的框架。AI 平台回答政治問題若有偏差，選民可能永遠看不見這種不平衡。即時觀察站讓這種影響變得可以觀察，而不是只靠零星傳聞。\\n來源異同\\n現有素材只有麻省理工學院新聞報導這個儀表板，沒有第二家媒體佐證計畫範圍或方法。信任標籤：僅1源——只有一家媒體報導這項計畫，素材中沒有獨立佐證。麻省理工學院新聞是該校自有新聞管道，報導自家研究人員的工作。\\n仍不確定\\n摘要片段沒有列出研究人員姓名、受檢視平台、儀表板方法，也沒有報導任何調查結果。聊天機器人是否影響選民，在這批素材中仍是未解問題，不是已有答案。引用計畫範圍與結果前，請查閱麻省理工學院新聞完整報導。\"},\"sources\":[{\"name\":\"MIT News AI\",\"url\":\"https://news.mit.edu/2026/qa-hey-ai-who-should-i-vote-for-this-year-1030\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":23,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"ai\",\"live-ingest\",\"mit-news-ai\"],\"glossary\":[{\"term\":{\"en\":\"MIT\",\"zh-TW\":\"麻省理工學院\"},\"blurb\":{\"en\":\"University whose researchers built the LLM Election Observatory.\",\"zh-TW\":\"研究人員建立大型語言模型選舉觀察站的大學。\"}},{\"term\":{\"en\":\"LLM Election Observatory\",\"zh-TW\":\"大型語言模型選舉觀察站\"},\"blurb\":{\"en\":\"Dashboard examining in real time how AI platforms answer election questions.\",\"zh-TW\":\"即時檢視 AI 平台如何回答選舉問題的儀表板。\"}},{\"term\":{\"en\":\"MIT News\",\"zh-TW\":\"麻省理工學院新聞\"},\"blurb\":{\"en\":\"MIT's news outlet that reported the dashboard.\",\"zh-TW\":\"報導儀表板的麻省理工學院新聞管道。\"}},{\"term\":{\"en\":\"AI chatbots\",\"zh-TW\":\"AI 聊天機器人\"},\"blurb\":{\"en\":\"Chatbot platforms whose political answers the observatory examines.\",\"zh-TW\":\"觀察站檢視其政治回答的聊天機器人平台。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://r85075515.github.io/Trust-digest/\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"Axiom\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"zh_TW\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:locale:alternate\",\"content\":\"en_US\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"9\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"10\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"11\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sour
