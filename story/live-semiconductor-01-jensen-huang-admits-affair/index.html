board said a committee of independent directors, assisted by outside counsel, will oversee the inquiry, stressed that it has no reason to believe US national security or Nvidia secrets were compromised, and expressed confidence in Huang's leadership. The scrutiny stems from October reporting that US officials suspect Alice Huang, a former executive at Nvidia customer Megaspeed, of passing information to China's Ministry of State Security and of cultivating a close relationship with Huang; Huang had previously described the contact as routine business. President Donald Trump publicly backed Huang the same day, calling him a man of integrity and urging people to hear his side.\nWhy it matters\nThe head of the world's most important AI chipmaker has now confirmed the personal relationship at the center of an espionage scare. The board's pairing of an independent probe with a public vote of confidence is an attempt to contain the damage; the real watershed is the November 18 closed-door briefing requested by three House committees, which Huang must accept or reschedule by November 11.\nSources agree / disagree\nCNN, Axios, MarketWatch and The Hindu BusinessLine agree on the memo's contents, the board's statement and the \"no evidence secrets were compromised\" line; both the memo and the board statement are public primary documents. Trust label: Multi-source agreement — multiple tier-one outlets and the primary statements align on the core facts.\nStill uncertain\nHuang did not name the other person, and neither Alice Huang's alleged intelligence role nor Huang's knowledge of it has been established by any party. The investigation's members, law firm and timeline are undisclosed, and whether Huang attends the congressional briefing is open until November 11."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-01-jensen-huang-admits-affair\",\"category\":\"semiconductor\",\"adult\":false,\"isHeadline\":true,\"isPopular\":true,\"imageUrl\":\"https://cdn.mos.cms.futurecdn.net/fjFkN4c5HUsWwQPK4dVKZR-1920-80.png\",\"imageAlt\":{\"en\":\"Nvidia CEO Jensen Huang, who admitted an affair as the board opened an independent investigation.\",\"zh-TW\":\"輝達執行長黃仁勳坦承婚外情，董事會啟動獨立調查。\"},\"publishedAt\":\"2026-11-09T06:01:06.000Z\",\"title\":{\"en\":\"Jensen Huang Admits Affair as Nvidia Board Opens Independent Probe\",\"zh-TW\":\"黃仁勳（Jensen Huang）坦承婚外情，輝達董事會啟動獨立調查\"},\"summary\":{\"en\":\"Nvidia CEO Jensen Huang told staff on Sunday that he had been unfaithful to his wife, apologizing and pledging full cooperation, as the board opened an independent probe into reports he was targeted by foreign intelligence. The board says it has no reason to believe secrets were compromised; the next test is Congress's November 18 briefing.\",\"zh-TW\":\"輝達（Nvidia）執行長黃仁勳（Jensen Huang）週日發全員信坦承對妻子不忠、致歉並承諾全面配合調查；董事會同日宣布由獨立董事委員會加外部律師，調查他是否遭外國情報鎖定，並稱目前無理由相信國安或公司機密外洩。接下來看他是否在 11 日前答應出席國會閉門簡報——這已不是私德問題，而是國安層級的公司治理危機。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"輝達（Nvidia）執行長黃仁勳（Jensen Huang）週日發信給全體員工，坦承自己對妻子不忠；董事會同日宣布啟動獨立調查，查他是否成為外國情報行動的目標，CNN 與 Axios 等多家媒體報導。\\n發生了什麼事\\n黃仁勳在信中寫道「我對妻子不忠。我的行為傷害了她和我們的孩子。沒有任何藉口」，向家人與員工致歉，表示負起全責、全面配合調查，並續任執行長；信中未點名對方。董事會在另一份聲明中表示，將由獨立董事組成委員會、聘請外部律師主持調查，檢視「執行長遭外國情報鎖定」的相關報導；董事會強調，目前沒有理由相信美國國家安全或輝達機密已經外洩，並公開表達對黃仁勳領導的信任。事件源頭是 10 月的報導：美方情報官員懷疑輝達客戶 Megaspeed 的前高層愛麗絲·黃（Alice Huang，黃樂）替中國國安部傳遞情報，並與黃仁勳過從甚密；黃仁勳先前稱雙方只是正常商務往來。川普（Donald Trump）同日公開力挺，稱黃仁勳「為人正直」，盼外界聽取他的說法。\\n為什麼重要\\n全球 AI 晶片龍頭的一把手親口承認私人關係、對象又牽涉間諜疑雲，這同時是公司治理、股價與國家安全三條線的壓力測試。董事會「啟動調查＋公開背書續任」是先把火控制在可查證的範圍內；真正的分水嶺是國會三個委員會要求的 11 月 18 日閉門簡報——黃仁勳必須在 11 日前回覆是否出席。\\n來源異同\\nCNN、Axios、MarketWatch 與 The Hindu BusinessLine 對全員信內容、董事會聲明、「無證據顯示機密外洩」三點說法一致，且全員信與董事會聲明本身都是公開的一手文件。信任標籤：多源一致。\\n仍不確定\\n黃仁勳在信中沒有點名對方；愛麗絲·黃是否涉諜、黃仁勳是否知情，至今沒有任何一方證實。調查委員會成員、委任律師與完成時間未公布；他會不會出席國會簡報，11 日前才有答案。\"},\"sources\":[{\"name\":\"CNN\",\"url\":\"https://www.cnn.com/2026/11/08/business/nvidia-investigation-ceo-jensen-huang?cid=external-feeds_iluminar_meta\"},{\"name\":\"The Hindu BusinessLine\",\"url\":\"https://www.thehindubusinessline.com/info-tech/nvidia-board-launches-probe-into-alleged-spy-plot-after-ceo-admits-affair/article71681234.ece\"},{\"name\":\"MarketSpeaker (Axios)\",\"url\":\"https://marketspeaker.com/nvidia-huang-affair-staff-letter-board-investigation/\"},{\"name\":\"YourStory\",\"url\":\"https://yourstory.com/2026/11/nvidia-ceo-jensen-huang-admits-affair-chinese-spying-allegations-board-probe\"}],\"disagreements\":null,\"trustScore\":80,\"trustBreakdown\":{\"sourceDiversity\":20,\"outletReputation\":18,\"crossCorroboration\":20,\"recencyClarity\":25},\"tags\":[\"semiconductor\",\"live-ingest\",\"breaking\",\"cnn\",\"axios\"],\"glossary\":[{\"term\":{\"en\":\"Jensen Huang\",\"zh-TW\":\"黃仁勳\"},\"blurb\":{\"en\":\"Co-founder and CEO of Nvidia, who admitted the affair and is cooperating with the board's investigation.\",\"zh-TW\":\"輝達共同創辦人兼執行長，本次坦承婚外情並配合董事會調查的當事人。\"}},{\"term\":{\"en\":\"Alice Huang\",\"zh-TW\":\"愛麗絲·黃（Alice Huang）\"},\"blurb\":{\"en\":\"Former Megaspeed executive US officials suspect of working for China's Ministry of State Security; no relation to Jensen Huang.\",\"zh-TW\":\"Megaspeed 前高層，美方情報官員懷疑她替中國國安部工作；與黃仁勳沒有親屬關係。\"}},{\"term\":{\"en\":\"Megaspeed\",\"zh-TW\":\"Megaspeed\"},\"blurb\":{\"en\":\"Singapore-based data-center and cloud company, a major buyer of Nvidia AI chips.\",\"zh-TW\":\"新加坡資料中心與雲端公司，是輝達 AI 晶片的大客戶。\"}},{\"term\":{\"en\":\"Independent investigation\",\"zh-TW\":\"獨立調查\"},\"blurb\":{\"en\":\"Nvidia's probe, overseen by a committee of independent directors with outside counsel, into whether its CEO was targeted by foreign intelligence.\",\"zh-TW\":\"輝達由獨立董事委員會主持、外部律師協助的調查，查執行長是否遭外國情報鎖定。\"}},{\"term\":{\"en\":\"Closed-door briefing\",\"zh-TW\":\"閉門簡報\"},\"blurb\":{\"en\":\"The November 18 session three US House committees have asked Huang to attend; a request, not a subpoena.\",\"zh-TW\":\"眾議院三個委員會要求黃仁勳 11 月 18 日出席說明的會議，屬邀請性質、不是傳票。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"
