ootball game against UCLA. The suspension follows an incident in which several USC band members vandalized part of the UCLA campus ahead of the annual crosstown matchup.\n\nWhy it matters\nThe USC-UCLA game carries major postseason stakes in the Big Ten Conference, with No. 10 UCLA (10-1) aiming to clinch a spot in the conference title game and No. 15 USC (8-3) fighting to keep slim College Football Playoff hopes alive. Barring the famed marching band removes a central gameday tradition in response to off-field misconduct.\n\nSource differences\nAP News (\"USC marching band won't perform at rivalry game after UCLA campus vandalism\") and FOX Sports (\"USC marching band benched for UCLA game after vandalism prank, officials say\") publish the same Associated Press wire report detailing the campus vandalism and both teams' CFP standings.\n\nStill uncertain\nOfficials have not disclosed the exact dollar amount of property damage at UCLA, the specific campus structures targeted, or whether individual band members face criminal charges or university expulsion.\n\nTrust label: Single source — Both AP News and FOX Sports publish the same Associated Press wire report citing USC officials."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-entertainment-397-usc-marching-band-benched\",\"category\":\"entertainment\",\"title\":{\"en\":\"USC Marching Band Benched for UCLA Rivalry Game After Campus Vandalism Prank\",\"zh-TW\":\"成員惡作劇破壞 UCLA 校園設施 南加大樂儀隊遭禁演世仇對決\"},\"summary\":{\"en\":\"The University of Southern California benched its marching band from performing at Saturday's rivalry football game against UCLA after band members vandalized part of the Bruins campus. USC officials announced the disciplinary action on Nov. 27, 2026, ahead of a crucial Big Ten matchup with College Football Playoff implications.\",\"zh-TW\":\"美國南加州大學（USC）官方於 2026 年 11 月 27 日宣布，因樂儀隊多名成員日前惡作劇破壞加州大學洛杉磯分校（UCLA）校園設施，校方決定禁止樂儀隊在週末對陣 UCLA 的傳統世仇美式足球賽中登場演出，使這場攸關季後賽席次的焦點大
