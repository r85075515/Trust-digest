eyed netizens spotted Alice Ko among the crowd, ETtoday reports, setting off a wave of nostalgic commentary.\nWhat happened\nWang traveled to Los Angeles and shared a large group photo, which fans quickly dissected: Alice Ko was identified in the picture, marking a rare public \"reunion\" 16 years after the pair broke up. In separate coverage, Nikki Hsieh — Wang's more recent ex — confirmed that the two have split, are no longer in contact, and that reconciliation is impossible, quashing reunion rumors. Mirror Media separately reported that veteran actor Chen Zhiqiang is embroiled in a dispute with a female executive over product licensing worth millions after a breakup.\nWhy it matters\nFor Taiwan's entertainment press, exes in the same frame is catnip: the Wang–Ko photo revives one of the industry's most-remembered romances, while Hsieh's on-the-record breakup confirmation closes the book on a newer chapter. The cluster shows how celebrity relationship news travels in Taiwan — one photo, one confirmation, one dispute, all feeding the same gossip cycle.\nSources agree / disagree\nThe outlets are not covering one story but several: ETtoday on the Wang–Ko photo, SET News on Hsieh's breakup confirmation, Mirror Media on the Chen Zhiqiang licensing dispute, plus an unrelated \"60-year-old goddess\" item in the mix. Figures differ across outlets (e.g. 60 vs 16 in headlines/snippets) — the \"60\" belongs to that unrelated headline, not to the Wang–Ko timeline. Trust label: Conflicting figures/accounts — several distinct stories are clustered together; treat each headline on its own merits.\nStill uncertain\nThe snippets say nothing about why Wang and Ko were at the same gathering, whether they interacted, or how Hsieh's confirmation was obtained. Details of the Chen Zhiqiang licensing dispute are likewise limited to the headline. Verify in the full articles."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-eastAsiaGossip-02-16-la-ettoday-ettoday\",\"category\":\"eastAsiaGossip\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-eastAsiaGossip-02-16-la-ettoday-ettoday.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 分手16年罕見同框！王柏傑赴LA曬超狂大合照　網眼尖認出「柯佳嬿也在其中」 - ETtoday星光雲| ETtoday新聞雲\",\"zh-TW\":\"相關封面圖：分手16年罕見同框！王柏傑赴LA曬超狂大合照　網眼尖認出「柯佳嬿也在其中」 - ETtoday星光雲| ETtoday新聞雲\"},\"publishedAt\":\"2026-10-14T21:12:00.000Z\",\"title\":{\"en\":\"Wang Bo-Jie Reunites With Ex Alice Ko in LA Photo, 16 Years After Split\",\"zh-TW\":\"分手16年罕見同框　王柏傑洛杉磯大合照被認出柯佳嬿（Alice Ko）也在其中\"},\"summary\":{\"en\":\"Taiwanese actor Wang Bo-Jie posted a star-studded group photo from Los Angeles, and netizens spotted his ex Alice Ko in the frame — a rare appearance 16 years after their split, per ETtoday. Separately, Nikki Hsieh confirmed her breakup with Wang with no chance of reconciliation, while Mirror Media reports a licensing dispute between Chen Zhiqiang and a female executive.\",\"zh-TW\":\"台灣演員王柏傑在洛杉磯（Los Angeles）曬出星光熠熠的大合照，眼尖網友認出前女友柯佳嬿（Alice Ko）也在其中——據 ETtoday，這是兩人分手16年後罕見同框。另方面，謝欣穎（Victoria Hsieh）親口證實已與王柏傑分手、不可能復合；鏡週刊（Mirror Media）則報導陳子強與一名女總裁的商品授權糾紛。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"分手16年後，王柏傑與柯佳嬿（Alice Ko）再度出現在同一個畫面裡——雖然只是一張大合照。這位台灣演員在洛杉磯（Los Angeles）曬出星光熠熠的合照，眼尖網友立刻認出人群中的柯佳嬿（Alice Ko），據 ETtoday 報導，引發一波懷舊討論。\\n發生了什麼事\\n王柏傑赴洛杉磯並分享大合照，粉絲迅速「驗屍」：柯佳嬿（Alice Ko）被認出在照片中，成為兩人分手16年後罕見的公開「同框」。另方面，王柏傑較近期的前任謝欣穎（Victoria Hsieh）親口證實兩人已分手、沒有聯絡、不可能復合，親自打破復合傳言。鏡週刊（Mirror Media）則另行報導，資深演員陳子強與一名女總裁爆發分手後的數百萬元商品授權糾紛。\\n為什麼重要\\n對台灣娛樂媒體來說，前任同框就是流量保證：王柏傑與柯佳嬿（Alice Ko）的合照喚起演藝圈最令人難忘的戀情之一，而謝欣穎（Victoria Hsieh）的親口證實則為較新的篇章畫下句點。這個來源群組正好展示台灣明星感情新聞的傳播方式——一張照片、一句證實、一樁糾紛，全都餵進同一個八卦循環。\\n來源異同\\n各家媒體報的並非同一則新聞，而是好幾則：ETtoday 報王柏傑與柯佳嬿（Alice Ko）合照、三立新聞報謝欣穎（Victoria Hsieh）證實分手、鏡週刊（Mirror Media）報陳子強授權糾紛，另混入一則無關的「60歲女神」消息。不同媒體的數字有所不同（60 vs 16），其中「60」屬於那則無關消息，與王柏傑時間線無關。信任標籤：數字/說法衝突——多則不同新聞被歸在同一群組，請逐則看待。\\n仍不確定\\n摘要未說明王柏傑與柯佳嬿（Alice Ko）為何出席同一聚會、有無互動，也沒說謝欣穎（Victoria Hsieh）的證實從何而來；陳子強授權糾紛的細節也僅止於標題。請查閱完整報導確認。\"},\"sources\":[{\"na
