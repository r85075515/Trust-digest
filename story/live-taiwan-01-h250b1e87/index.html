. The report describes Markle as Meghan's estranged father. No arrest date beyond the report's timing, no bail information, and no statement from Markle or his representatives appears in the snippet.\nWhy it matters\nThe judgment is about the distance between an arrest and a conviction: the charge is grave, and the details in the report — the photos, the storage unit — are specific, but an arrest is an allegation, not a finding. For readers, the takeaway is to follow the court record, not the headline. The family connection to the Duchess of Sussex explains why the story travels, but it has no bearing on the charge itself.\nSources agree / disagree\nOnly the CNA report is in the cluster, so there is no independent confirmation. Trust label: Single source — one wire report; the charge is an allegation until a court rules.\nStill uncertain\nThe snippet gives no case number, court, hearing date, or response from Markle, and it does not say when the storage unit was searched. The exact wording of the charge and whether further counts follow are unknown. Check the court record and the full CNA report for the formal charges before quoting them."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-01-h250b1e87\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-taiwan-01-h250b1e87.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 涉持兒少性虐待影像　梅根父親馬克爾佛州被捕\",\"zh-TW\":\"相關封面圖：（譯文待補）涉持兒少性虐待影像　梅根父親馬克爾佛州被捕\"},\"publishedAt\":\"2026-11-07T00:51:29.000Z\",\"title\":{\"en\":\"Thomas Markle Arrested in Florida Over Child Sexual Abuse Images\",\"zh-TW\":\"梅根父親馬克爾在佛州被捕，涉持兒少性虐待影像\"},\"summary\":{\"en\":\"[Unverified-single-source] Thomas Markle (湯瑪斯·馬克爾), Meghan, Duchess of Sussex's (薩塞克斯公爵夫人梅根) estranged father, has been arrested in Florida for possessing child sexual abuse material, including photos of himself with a nude underage female, found in his rented California storage unit. The takeaway: the arrest is reported but the charges are untested — watch for the charge sheet and any court appearance.\",\"zh-TW\":\"［未證實·單一來源］薩塞克斯公爵夫人梅根關係疏離的父親湯瑪斯·馬克爾在佛羅里達州被捕，罪名是持有兒童性虐待物品，包括他與未成年裸女的合照，這些影像是在他於加州租用的倉庫內查獲。結論是：逮捕消息已有報導，但指控尚未經過司法程序，接下來看正式起訴書與是否出庭應訊。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"薩塞克斯公爵夫人梅根關係疏離的父親湯瑪斯·馬克爾在佛羅里達州被捕，罪名是持有兒童性虐待物品，包括他與未成年裸女的合照。中央社華盛頓的報導指出，這些影像是在他於加州租用的倉庫內查獲。逮捕已有報導，但指控尚未經過法庭檢驗。\\n發生了什麼事\\n馬克爾在佛州被捕，罪名是持有兒童性虐待物品。中央社引述外電報導說，查獲的物品包括馬克爾本人與未成年裸女的合照，這些影像是在他於加州租用的倉庫內發現的。報導稱馬克爾是梅根關係疏離的父親。摘要裡沒有逮捕日期以外的時間、沒有保釋資訊，也沒有馬克爾本人或其代表的回應。\\n為什麼重要\\n這裡要判斷的是逮捕與定罪之間的距離：罪名嚴重，報導裡的細節——照片、倉庫——也很具體，但逮捕只是指控，不是判決。對讀者來說，結論是跟著法院紀錄走，不要只看標題。與薩塞克斯公爵夫人的親屬關係解釋了這則消息為什麼傳得廣，但與罪名本身無關。\\n來源異同\\n群組裡只有中央社這一則報導，沒有獨立查證。信任標籤：僅1源——單一通訊社報導；在法院裁決之前，指控只是指控。\\n仍不確定\\n摘要沒有案號、法院、出庭日期或馬克爾的回應，也沒有說明倉庫是何時被搜查的。指控的確切文字、是否還有其他罪名，都還不清楚。引用正式罪名前，請先查法院紀錄與中央社完整報導。\"},\"sources\":[{\"name\":\"中央社-國際\",\"url\":\"https://www.cna.com.tw/news/aopl/202611070022.aspx\"}],\"disagreements\":null,\"trustScore\":59,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"中央社-國際\"],\"glossary\":[{\"blurb\":{\"en\":\"Estranged father of Meghan, Duchess of Sussex, arrested in Florida.\",\"zh-TW\":\"在佛州被捕的梅根關係疏離的父親。\"},\"term\":{\"en\":\"Thomas Markle\",\"zh-TW\":\"湯瑪斯·馬克爾\"}},{\"blurb\":{\"en\":\"Markle's daughter, the Duchess of Sussex.\",\"zh-TW\":\"馬克爾的女兒，薩塞克斯公爵夫人。\"},\"term\":{\"en\":\"Meghan, Duchess of Sussex\",\"zh-TW\":\"薩塞克斯公爵夫人梅根\"}},{\"blurb\":{\"en\":\"US state where Markle was arrested.\",\"zh-TW\":\"馬克爾被捕的美國州別。\"},\"term\":{\"en\":\"Florida\",\"zh-TW\":\"佛羅里達州\"}},{\"blurb\":{\"en\":\"Taiwanese wire service reporting the arrest.\",\"zh-TW\":\"報導這起逮捕事件的台灣通訊社。\"},\"term\":{\"en\":\"CNA\",\"zh-TW\":\"中央社\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:
