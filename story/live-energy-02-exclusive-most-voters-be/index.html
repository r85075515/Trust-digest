uld soon be back and thriving like never before. His administration has since invoked the American Dream as a justification for proposing to end mandatory reporting of greenhouse gas emissions and to reverse rules cutting emissions.\n\nWhy it matters\nThe finding reframes climate policy as a household balance-sheet issue, not an abstract debate. When voters connect climate change to whether they can buy, insure and keep a home, the politics shift from emissions targets to monthly costs, and politicians who ignore that link risk sounding out of touch.\n\nSources agree-disagree\nOnly Grist is cited in the material provided, across two related items from the same outlet, so there is no independent second newsroom to test the claim against. The raw feed's automated note about differing figures does not correspond to any real conflict in the material: the number 26 is Isley's age, not a survey result.\n\nStill uncertain\nThe material provided gives no survey sample size, margin of error, question wording or polling dates. Without those details, readers cannot judge how strong the word most really is, or which voters were asked.\n\nTrust label: Single source"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-energy-02-exclusive-most-voters-be\",\"category\":\"energy\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-energy-02-exclusive-most-voters-be.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Exclusive: Most voters believe climate change threatens the American Dream\",\"zh-TW\":\"相關封面圖：獨家：大多數選民認為氣候變遷威脅美國夢\"},\"publishedAt\":\"2026-11-02T09:45:00.000Z\",\"title\":{\"en\":\"U.S. voters say climate change threatens the American Dream, Grist reports\",\"zh-TW\":\"美國選民認為氣候變遷威脅美國夢，Grist 獨家報導\"},\"summary\":{\"en\":\"[Unconfirmed · Single source] Most voters believe climate change threatens the American Dream, Grist reports, linking the fear to housing costs and insurance after disasters. Sierra Isley, 26, still sees buying a first home as her version of that dream. Watch whether candidates answer with housing and insurance plans.\",\"zh-TW\":\"［未證實·單一來源］Grist 獨家報導指出，大多數選民認為氣候變遷威脅美國夢，擔憂與災後房價與保險成本有關。26 歲的塞拉·艾斯利（Sierra Isley）仍把買下第一間房視為自己版本的美國夢。接下來看候選人是否拿出住房與保險對策回應。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"發生了什麼事\\nGrist 獨家報導指出，大多數選民認為氣候變遷威脅美國夢，擔憂核心是住房、保險與災後成本。26 歲的塞拉·艾斯利（Sierra Isley）從小想像的美國夢，是郊區一棟圍著白色尖樁籬笆的房子，她說那是從小被教導、也在電視上看到的形象，即使自己對生活的想望略有不同。兩年前，她仍把買下第一間房視為實現自己版本美國夢的機會。唐納·川普（Donald Trump）總統在 2025 年 1 月就職演說中承諾，美國夢很快就會強勢回歸；其政府隨後以美國夢為理由，提議終止溫室氣體強制申報，並扭轉減排規則。\\n\\n為什麼重要\\n這項發現把氣候政策從抽象辯論拉回家庭收支：選民把氣候變遷連結到買不買得起房、保不保得到險、守不守得住房子，政治攻防就從排放目標變成每月開銷。忽視這條連結的政治人物，容易顯得脫離現實。\\n\\n來源異同\\n提供的材料只引用 Grist 一家媒體的兩則相關報導，沒有第二家獨立新聞機構可以對照驗證。原始素材的自動註記提到數字差異，但材料中並無真實衝突：26 是艾斯利的年齡，不是民調數字。\\n\\n仍不確定\\n提供的材料沒有民調樣本數、誤差範圍、題目用字或調查日期。缺少這些資訊，讀者無法判斷「大多數」到底有多強，也不知道受訪的是哪些選民。\"},\"sources\":[{\"name\":\"Grist\",\"url\":\"https://grist.org/economics/american-dream-climate-home-insurance-helene-affordability/\"}],\"disagreements\":null,\"trustScore\":47,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":10,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"energy\",\"live-ingest\",\"grist\",\"grist\"],\"glossary\":[{\"term\":{\"en\":\"Grist\",\"zh-TW\":\"Grist\"},\"blurb\":{\"en\":\"US media outlet covering climate and environment.\",\"zh-TW\":\"報導氣候與環境議題的美國媒體。\"}},{\"term\":{\"en\":\"Sierra Isley\",\"zh-TW\":\"塞拉·艾斯利\"},\"blurb\":{\"en\":\"26-year-old first-time homebuyer quoted by Grist.\",\"zh-TW\":\"Grist 引述的 26 歲首購族。\"}},{\"term\":{\"en\":\"Donald Trump\",\"zh-TW\":\"唐納·川普\"},\"blurb\":{\"en\":\"President of the United States.\",\"zh-TW\":\"美國總統。\"}},{\"term\":{\"en\":\"American Dream\",\"zh-TW\":\"美國夢\"},\"blurb\":{\"en\":\"Idea of home ownership and upward mobility in the US.\",\"zh-TW\":\"在美國擁有住房、向上流動的理想。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=de
