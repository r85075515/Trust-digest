s paths at the upcoming Golden Bell Awards.\nWhat happened\nPer ETtoday and SETN headlines, Hsieh personally confirmed the breakup, puncturing lingering reconciliation rumors; the pair split more than a year ago. Separately, Wang was spotted in a group photo from a Los Angeles trip — sharp-eyed netizens recognized Alice Ko in the frame, a rare same-frame appearance 16 years after their own split. The cluster also carried a Mirror Media item on Chen Tzu-chiang blocking product licensing worth millions after a breakup amid a relationship dispute with a female CEO, and a Vogue Taiwan piece predicting the 2026 Golden Bell best-actress race among Yang Kuei-mei, Alice Ko and Chung Hsin-ling.\nWhy it matters\nThe Golden Bell timing is what makes this more than tabloid routine — two exes confirmed split, one awards night, and a possible red-carpet encounter. Multiple outlets converge on Hsieh's confirmation, which is the solid core of the cluster.\nSources agree / disagree\nETtoday and SETN agree on Hsieh's confirmation ('no contact for over a year,' 'impossible to reconcile'). The ingest's '16 vs 5' figure note is spurious — those numbers belong to different stories. No genuine conflicts.\nStill uncertain\nWhether both actually attend the Golden Bells, and the backstory details, are headline-level only. Verify before treating tabloid framing as fact."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-eastAsiaGossip-01-16-la-ettoday-ettoday\",\"category\":\"eastAsiaGossip\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"publishedAt\":\"2026-10-19T09:20:43.000Z\",\"title\":{\"en\":\"Nikki Hsieh Confirms Split From Wang Po-chieh; No Reconciliation, Golden Bell Reunion Possible\",\"zh-TW\":\"謝欣穎（Nikki Hsieh）認了分手王柏傑（Wang Po-chieh）：已無聯絡、不可能復合，金鐘獎恐同場\"},\"summary\":{\"en\":\"Taiwanese actress Nikki Hsieh confirmed she has split from actor Wang Po-chieh, saying they have not been in contact for over a year and reconciliation is impossible — though the exes may cross paths at the Golden Bell Awards. Wang was separately spotted in a Los Angeles group photo with Alice Ko, 16 years after their breakup.\",\"zh-TW\":\"謝欣穎（Nikki Hsieh）親認與王柏傑（Wang Po-chieh）分手一年多、已無聯絡、不可能復合，但兩人可能在金鐘獎碰頭；王柏傑另被拍到在洛杉磯與柯佳嬿（Alice Ko）分手 16 年後罕見同框。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"謝欣穎（Nikki Hsieh）親自證實與王柏傑（Wang Po-chieh）分手，表示兩人已一年多沒聯絡、「不可能復合」——不過這對舊情人仍可能在即將到來的金鐘獎上碰頭。\\n發生了什麼事\\n據 ETtoday 與三立新聞標題，謝欣穎親認分手，親手打破復合傳言；兩人分手已一年多。另一方面，王柏傑赴洛杉磯曬出的超狂大合照中，眼尖網友認出柯佳嬿（Alice Ko）也在其中——兩人分手 16 年後罕見同框。同批消息還有鏡週刊報導陳子強（Chen Tzu-chiang）分手後擋下數百萬元商品授權、與女總裁爆感情糾紛，以及 Vogue Taiwan 的 2026 金鐘影后預測（楊貴媚（Yang Kuei-mei）、柯佳嬿、鍾欣凌（Chung Hsin-ling）呼聲高）。\\n為什麼重要\\n讓這則八卦超越例行公事的是金鐘獎時機——分手已獲證實，頒獎典禮紅毯上可能狹路相逢。多家媒體對謝欣穎的親口證實報導一致，這是整批消息中最堅實的核心。\\n來源異同\\nETtoday 與三立新聞對謝欣穎的說法一致（一年多沒聯絡、不可能復合）。ingest 註記的「16 比 5」是誤判，數字分屬不同故事；無實質衝突。\\n仍不確定\\n兩人是否都會出席金鐘獎、感情內幕等都只有標題層級；把八卦框架當事實前請先查證。\"},\"sources\":[{\"name\":\"ettoday.net\",\"url\":\"https://news.google.com/rss/articles/CBMiTkFVX3lxTFBEREp3U2F6SGZyYzlDQUNycjRXdVMtS1ZtcWVvTTFyZV81M04zbXpoaTYxbVNxekFCLTRWTkp4R3BBV05GR1ZFdDhpSURNUdIBTEFVX3lxTFA1dlJYNy1RcGI0cVhwWEhjTjRjNGJzTWJfY0lBakFEZ0o4VkxXVjU0cmRYNG94OFN0dHhfQTJkdjZSWk1lekVvZExETjg?oc=5\"},{\"name\":\"setn.com\",\"url\":\"https://news.google.com/rss/articles/CBMiSEFVX3lxTE42WTNoUHVidHJOOW1leFBtSGc3TkFad1JLVmlTS1FuRmpSR1c2SjhlX010ZWNJOGZadXdIQVVKZEtzRDNLZ3pWONIBTEFVX3lxTE51c1o3ZTZnR0pBUFlOd09fZVZ0RFNHd3RrcklBb1VFeGM2ZS1PaHZqNDlnX1MzbDhUTUo4ekZMTEw5TWd2UmN1MmlJR00?oc=5\"},{\"name\":\"Google News\",\"url\":\"https://news.google.com/rss/articles/CBMiTkFVX3lxTFBlbTgwOW5FWjAzMUtyOHJzbzJGdGdGLTAyZ3ZHbFprYW1pZ1JuTWxtZnhwdW53VDFWcDdLWVNYYlJfc3drQnBDSDBvVFlSUdIBTEFVX3lxTFBNTTVhaG5RaDhjUzFzdEpFRjVmZ0tZUnlZT0daMkxBaTZsWWg5TlRfM191UDkteVVfOG9uQVdiSWRqWlRwRjQ2YW1uTkQ?oc=5\"},{\"name\":\"mirrormedia.mg\",\"url\":\"https://news.google.com/rss/articles/CBMiW0FVX3lxTE5yMUhneVhBaFdZSG1RVXhVT0hLbHM0cHhQSHRuX2RLaUlwcWg5cno2US1Ea3JfT0FyZXhHLVN5d21JTWNYaWpHckRGaU1TNm9ya005LTdaSFBNTTjSAWBBVV95cUxOREJ
