done with the EU. Both outlets place the comments at the Dublin summit of the European Political Community, a gathering of European leaders.\n\nWhy it matters\nBurnham is pitching the reset as a correction, not a reversal: a deal that keeps the promises voters believed they were backing in the 2016 referendum. Framing it that way lets him argue for closer ties with the EU while presenting the move as faithful to the referendum result. The language matters because any new UK-EU arrangement will be judged against what Brexit was supposed to deliver.\n\nSources agree / disagree\nBBC Business and The Guardian UK News report the same quote and the same setting, with no disagreement between them.\nTrust label: Two-source agreement — two outlets independently report the same 'win-win' remark from the same Dublin summit.\n\nStill uncertain\nThe available material is brief and gives no detail on what the deal would cover, such as trade, movement, or regulation. Neither outlet reports a timetable or any response from EU leaders. The exact wording of Burnham's full remarks should be checked against the original reports."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-02-burnham-says-win-win-dea\",\"category\":\"international\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-international-02-burnham-says-win-win-dea.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Burnham says 'win-win' deal can be agreed between UK and EU\",\"zh-TW\":\"相關封面圖：伯納姆表示英國和歐盟可以達成「雙贏」協議\"},\"publishedAt\":\"2026-11-13T01:17:58.000Z\",\"title\":{\"en\":\"Andy Burnham Says 'Win-Win' EU Deal Can Be Agreed\",\"zh-TW\":\"安迪·伯納姆（Andy Burnham）：英歐可望達成「雙贏」協議\"},\"summary\":{\"en\":\"Prime Minister Andy Burnham said a 'win-win' deal could be agreed between the UK and the EU, one 'more like the Brexit people thought they were voting for' in 2016. Burnham spoke while meeting fellow leaders at the European Political Community summit in Dublin. The remarks frame the reset as delivering the Brexit voters expected.\",\"zh-TW\":\"英國首相安迪·伯納姆（Andy Burnham）表示，英國與歐盟可以達成「雙贏」協議，「更像人們在 2016 年以為自己投票支持的脫歐」。伯納姆在都柏林歐洲政治共同體峰會期間、與各國領袖會面時發表上述談話。這番話把英歐關係重置，描繪成兌現當年脫歐選民的期待。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"英國首相安迪·伯納姆（Andy Burnham）相信，英國與歐盟可以達成一項「雙贏」協議。他在都柏林歐洲政治共同體峰會期間、與各國領袖會面時表示，這次關係重置可能「更像人們在 2016 年以為自己投票支持的脫歐」。\\n\\n發生了什麼事\\n伯納姆表示，他相信可以與歐盟達成一項對雙方都有利的協議。BBC 報導，他稱協議可能「更像是 2016 年脫歐人士所認為的投票支持」。衛報也傳達同樣訊息，引述伯納姆說與歐盟可以達成「雙贏」協議。兩家媒體都把這番談話定位在都柏林的歐洲政治共同體峰會，這是歐洲各國領袖的聚會。\\n\\n為什麼重要\\n伯納姆把關係重置定位為修正，而非逆轉：一項兌現選民在 2016 年公投時以為自己支持的承諾的協議。這樣的表述讓他能在主張與歐盟走得更近的同時，宣稱此舉忠於公投結果。用詞之所以關鍵，是因為任何新的英歐安排都會拿來與脫歐當初承諾的成果對照檢驗。\\n\\n來源異同\\nBBC 商業版與英國衛報報導的是同一引言與同一場合，兩者之間沒有分歧。\\n信任標籤：雙源一致——兩家媒體各自獨立報導同一句「雙贏」談話，出自同一場都柏林峰會。\\n\\n仍不確定\\n現有素材簡短，未說明協議涵蓋哪些內容，例如貿易、人員流動或監管。兩家媒體都未報導時間表，也未報導歐盟領袖的回應。伯納姆完整談話的確切用詞，應以原始報導為準。\"},\"sources\":[{\"name\":\"BBC Business\",\"url\":\"https://www.bbc.co.uk/news/articles/cm2l5n07l87vo?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"The Guardian UK News\",\"url\":\"https://www.theguardian.com/politics/2026/nov/12/win-win-deal-with-eu-could-be-done-andy-burmham-says\"}],\"disagreements\":null,\"trustScore\":72,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":19,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"international\",\"live-ingest\",\"bbc-business\",\"the-guardian-uk-news\"],\"glossary\":[{\"blurb\":{\"en\":\"UK prime minister, speaking on a UK-EU deal.\",\"zh-TW\":\"英國首相，就英歐協議發表談話。\"},\"term\":{\"en\":\"Andy Burnham\",\"zh-TW\":\"安迪·伯納姆\"}},{\"blurb\":{\"en\":\"Summit of European leaders meeting in Dublin.\",\"zh-TW\":\"歐洲各國領袖在都柏林舉行的峰會。\"},\"term\":{\"en\":\"European Political Community\",\"zh-TW\":\"歐洲政治共同體\"}},{\"blurb\":{\"en\":\"The UK's 2016 vote to leave the EU.\",\"zh-TW\":\"英國 2016 年脫離歐盟的公投。\"},\"term\":{\"en\":\"Brexit\",\"zh-TW\":\"脫歐\"}},{\"blurb\":{\"en\":\"European Union, the UK's negotiating counterpart.\",\"zh-TW\":\"歐洲聯盟，英國的談判對象。\"},\"term\":{\"en\":\"EU\",
