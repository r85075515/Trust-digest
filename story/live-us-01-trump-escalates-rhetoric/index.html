 regards the Constitution like “a piece of toilet paper.”\nWhat happened\nAccording to PBS NewsHour, Trump escalated his rhetoric against El-Sayed as he tries to undermine the Democrat in the Michigan Senate race. Trump claimed El-Sayed’s record of support for jihadists should disqualify him from a Senate seat — that characterization is Trump’s claim, reported here as his words, not as an established fact. El-Sayed responded in an interview with Al Sharpton on PoliticsNation, where he was asked about attacks from Trump and Republicans on his family background and faith, and delivered the toilet paper line about Trump’s regard for the Constitution.\nWhy it matters\nThe judgment is blunt: this exchange is being fought on identity and respect for the Constitution, not on policy, at least in the material available here. As Election Day approaches, voters in Michigan are getting heat rather than substance from both sides of this feud, and that tone is itself the story of the race’s final stretch.\nSources agree / disagree\nPBS NewsHour and The Hill cover the same Sunday exchange from both directions — Trump’s metal detector remark and El-Sayed’s PoliticsNation reply — with no conflicting numbers or names. Trust label: Two-source agreement — two outlets agree on the core exchange.\nStill uncertain\nThe snippets do not cite polling, any response from Senate leadership, or the specific record Trump pointed to when he attacked El-Sayed’s background. Those gaps matter before repeating either side’s charge as fact."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-us-01-trump-escalates-rhetoric\",\"category\":\"us\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-us-01-trump-escalates-rhetoric.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Trump escalates rhetoric against El-Sayed as he tries to undermine Democrat in Michigan Senate race\",\"zh-TW\":\"相關封面圖：川普升級了針對埃爾賽義德的言論，試圖在密西根州參議員競選中削弱民主黨人的影響力\"},\"publishedAt\":\"2026-10-26T01:20:40.000Z\",\"title\":{\"en\":\"Trump Escalates Attacks on Michigan Senate Candidate Abdul El-Sayed\",\"zh-TW\":\"川普（Donald Trump）加碼攻擊密西根參議員候選人艾爾賽義德（Abdul El-Sayed）\"},\"summary\":{\"en\":\"Donald Trump escalated attacks on Michigan Senate candidate Abdul El-Sayed on Sunday, saying El-Sayed should pass through a metal detector to enter the Senate building. El-Sayed answered on PoliticsNation, telling Al Sharpton that Trump has as much regard for the Constitution as “a piece of toilet paper.” The takeaway: the Michigan race is trading personal attacks as Election Day nears.\",\"zh-TW\":\"美國總統川普（Donald Trump）週日（25 日）加碼攻擊密西根州參議員候選人艾爾賽義德（Abdul El-Sayed），稱他進參議院大樓應先通過金屬探測器。艾爾賽義德同日在 PoliticsNation 節目回擊，說川普對憲法的尊重有如「一張衛生紙」。結論是：密西根選戰已淪為公開的人身攻防，選舉日臨近，言詞只會更激烈。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"密西根州參議員選戰週日（25 日）公開互罵：美國總統川普（Donald Trump）稱民主黨候選人艾爾賽義德（Abdul El-Sayed）進參議院大樓應先通過金屬探測器，艾爾賽義德則回敬川普對憲法的尊重有如「一張衛生紙」。\\n發生了什麼事\\n據 PBS NewsHour 報導，川普加碼攻擊艾爾賽義德，意圖削弱這位密西根州民主黨候選人。川普聲稱艾爾賽義德支持聖戰分子的紀錄使他不配擁有參議院席位——這是川普的說法，本卡僅引述其言詞，不當成已證實的事實。艾爾賽義德在 PoliticsNation 節目接受艾爾·夏普頓（Al Sharpton）訪問時回應，被問及川普與共和黨對其家庭背景與信仰的攻擊，拋出了上述衛生紙的說法。\\n為什麼重要\\n判斷很直接：就現有素材而言，這場交鋒打的是身份與對憲法的尊重，不是政策。選舉日臨近，密西根選民從這場恩怨中得到的更多是火氣而非實質，而這種基調本身就是選戰尾聲的故事。\\n來源異同\\nPBS NewsHour 與 The Hill 從正反兩面報導同一場週日交鋒——川普的金屬探測器說法與艾爾賽義德的節目回應——沒有數字或人名衝突。信任標籤：2源一致——兩家媒體對核心交鋒說法一致。\\n仍不確定\\n片段沒有民調、參議院領導層的回應，也沒有川普攻擊艾爾賽義德背景時所指的具體紀錄。在重複任何一方的指控之前，這些缺口必須先補上。\"},\"sources\":[{\"name\":\"PBS NewsHour\",\"url\":\"https://www.pbs.org/newshour/politics/trump-escalates-rhetoric-against-el-sayed-as-he-tries-to-undermine-democrat-in-michigan-senate-race\"},{\"name\":\"The Hill\",\"url\":\"https://thehill.com/homenews/campaign/6171437-el-sayed-trump-has-as-much-regard-for-constitution-as-a-piece-of-toilet-paper/\"}],\"disagreements\":null,\"trustScore\":62,\"trustBreakdown\":{\"sourceDiversity\":13,\"outletReputation\":10,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"us\",\"live-ingest\",\"pbs-newshour\",\"the-hill\"
