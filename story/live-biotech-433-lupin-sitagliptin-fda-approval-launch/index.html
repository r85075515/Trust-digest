ug Administration (FDA) approval and that it has launched Sitagliptin Tablets, USP in 25 mg, 50 mg, and 100 mg strengths in the United States. The generic product is bioequivalent to the reference listed drug Januvia from Merck and is indicated as an adjunct to diet and exercise to improve glycemic control in adults with type 2 diabetes mellitus. According to IQVIA Moving Annual Total (MAT) data for September 2026 cited in the announcement, Januvia had estimated annual U.S. sales of 2,328.8 million USD.\n\nWhy it matters\nEntering the type 2 diabetes oral therapy segment with a bioequivalent generic equivalent to Januvia expands lower-cost treatment access for adult patients and adds a large-market generic product to Lupin's U.S. portfolio.\n\nSource differences\nLupin's official press release is titled \"Lupin Announces U.S. FDA Approval and Launch of Sitagliptin Tablets, USP in the United States\". PR Newswire published the release under the exact same title, \"Lupin Announces U.S. FDA Approval and Launch of Sitagliptin Tablets, USP in the United States\", distributing the identical company announcement.\n\nStill uncertain\nCommercial market share gains, net pricing dynamics, and potential competitive generic entries in the U.S. sitagliptin segment remain to be seen as commercial rollout progresses.\n\nTrust label: Single source — Both listed URLs carry the same Lupin company press release announcing the ANDA approval and U.S. launch."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-biotech-433-lupin-sitagliptin-fda-approval-launch\",\"category\":\"biotech\",\"title\":{\"en\":\"Lupin Announces U.S. FDA Approval and Launch of Generic Sitagliptin Tablets\",\"zh-TW\":\"印度藥廠 Lupin 獲美國 FDA 核准並在美國上市學名藥 Sitagliptin 錠\"},\"summary\":{\"en\":\"On November 27, 2026, Lupin announced U.S. FDA approval of its ANDA and launched Sitagliptin Tablets, USP (25 mg, 50 mg, and 100 mg), bioequivalent to Merck's Januvia for adult type 2 diabetes glycemic control, addressing a U.S. market estimated at 2,328.8 million USD.\",\"zh-TW\":\"印度藥廠 Lupin 於 2026 年 11 月 27 日宣布簡易新藥申請（ANDA）獲美國 FDA 核准並上市 Sitagliptin 錠 USP（25 mg、50 mg、100 mg），具生物相等性用於成人第二型糖尿病血糖控制，切入年銷售額估計 23.288 億美元的美國市場。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\nLupin 於 2026 年 11 月 27 日宣布，其簡易新藥申請（ANDA）已獲美國食品藥物管理局（FDA）核准，並正式在美國推出 Sitagliptin 錠 USP（25 mg、50 mg 與 100 mg 三種劑量）。該學名藥與原廠參考藥 Merck 旗下 Januvia 具生物相等性，適應症為輔助飲食與運動，以改善成人第二型糖尿病患者的血糖控制。依公告引用的 IQVIA 2026 年 9 月滾動年銷售額（MAT）數據，Januvia 在美國年銷售額估計為 23.288 億美元。\\n\\n「為什麼重要」\\n在成人第二型糖尿病口服降糖藥物領域推出與 Januvia 具生物相等性的學名藥，有助於提供具成本效益的替代用藥選擇，並為 Lupin 擴充具規模潛力的美國學名藥產品線。\\n\\n「來源異同」\\nLupin 官方新聞稿頁面實際標題為「Lupin Announces U.S. FDA Approval and Launch of Sitagliptin Tablets, USP in the United States」；PR Newswire 刊登之同一份企業發布稿頁面實際標題亦為「Lupin Announces U.S. FDA Approval and Launch of Sitagliptin Tablets, USP in the United States」，兩者內容同源。\\n\\n「仍不確定」\\n隨著美國市場商業推廣推進，該產品實際取得的處方與市占率表現，以及後續是否面臨其他學名藥競爭者的上市動態，仍有待觀察。\\n\\nTrust label: Single source — 兩筆來源網址均為同一份 Lupin 公司新聞稿，證據同源於該企業公告。\"},\"glossary\":[{\"term\":{\"en\":\"ANDA\",\"zh-TW\":\"簡易新藥申請\"},\"blurb\":{\"en\":\"Abbreviated New Drug Application, the U.S. FDA regulatory pathway used to seek approval for a generic drug shown to be bioequivalent to a reference product.\",\"zh-TW\":\"美國 FDA 審查學名藥的申請途徑，申請人須證明學名藥與原廠參考藥在活性成分、劑量、劑型及生物相等性上一致。\"}},{\"term\":{\"en\":\"Bioequivalence\",\"zh-TW\":\"生物相等性\"},\"blurb\":{\"en\":\"The absence of a significant difference in the rate and extent to which the active ingredient becomes available at the site of action compared with a reference drug.\",\"zh-TW\":\"學名藥與原廠參考藥在相同劑量下，活性成分進入全身循環或作用部位的速率與程度無顯著差異。\"}},{\"term\":{\"en\":\"IQVIA MAT\",\"zh-TW\":\"IQVIA 滾動年銷售額\"},\"blurb\":{\"en\":\"Moving Annual Total, a pharmaceutical sales metric summing total sales over the most recent 12-month period.\",\"zh-TW\":\"醫藥市場統計指標，指最近連續 12 個月的累計銷售總額。\"}}],\"sources\":[{\"name\":\"Lupin\",\"url\":\"https://www.lupin.com/investors/press-releases/lupin-announces-u-s-fda-approval-and-launch-of-sitagliptin-tablets-usp-in-the-united-states\"},{\"name\":\"PR Newswire\",\"url\":\"https://www.prnewswire.com/news-releases/lupin-announces-us-fda-approval-and-launch-of-sitagliptin-tablets-usp-in-the-united-states-302951831.html\"}],\"imageUrl\":\"/covers/live/live-biotech-433-lupin-sitagliptin-fda-approval-launch.jpg\",\"imageAlt\":{\"en\":\"Lupin Announces U.S. FDA Approval and Launch of Generic Sitagliptin Tablets\",\"zh-TW\":\"印度藥廠 Lupin 獲美國 FDA 核准並在美國上市學名藥 Sitagliptin 錠\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":74,\"trustBreakdown\":{\"crossCorroboration\":18,\"outletReputation\":21,\"recencyClarity\":22,\"sourceDiversity\":13},\"publishedAt\":\"2026-11-28T10:22:56.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":21,\"D2\":20,\"D3\":22,\"D4\":19,\"D5\":18,\"total\":20},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-biotech-433-lupin-sitagliptin-fda-approval-launch/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-biotech-433-lupin-sitagliptin-fda-approval-launch/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"co
