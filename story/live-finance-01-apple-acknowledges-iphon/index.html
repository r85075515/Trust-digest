 and affected owners should contact AppleCare for a replacement.\nWhat happened\nPhotos shared online showed faults appearing on the screens of Apple's first foldable device. Following reports of iPhone Duos with cracked and broken inside screens, often showing a bright line running from the center to the right side, Apple said in a statement to Bloomberg and 9to5Mac that it is aware of an issue impacting the inner display on a small number of iPhone Duo units. If an iPhone Duo is affected, Apple says to contact AppleCare for a replacement. The BBC's headline confirms the same bottom line: Apple says it will replace iPhone Duo handsets with screen problems.\nWhy it matters\nThe verdict is about first-generation risk: foldable screens live or die on durability, and a visible fault pattern — a bright line across the fold — is exactly the failure buyers fear most. Apple's quick replacement commitment is damage control, but it does not yet answer whether the fault is a small manufacturing batch issue or a design weakness that will recur.\nSources agree / disagree\nBBC Business and The Verge agree on the core story: cracked inner screens, Apple's acknowledgement, and AppleCare replacements. Trust label: Multi-source agreement — two established outlets agree on the core claims. The feed's auto-flagged figure mismatch (27.2 vs 8216) is an HTML-entity artifact from the iOS version number and a quotation mark, not a real numeric conflict, so no disagreement is recorded. The same feed batch also carried a separate item, iOS 27.2 bringing Apple Pencil support and an Edge Light feature to the iPhone Duo, which is a software story, not part of the screen fault.\nStill uncertain\nThe cause of the cracks, the number of affected units, and whether replacements use revised hardware are not in the feed snippets. Owners should use Apple's official guidance, and readers should not extrapolate a failure rate from social-media photos."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-01-apple-acknowledges-iphon\",\"category\":\"finance\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-finance-01-apple-acknowledges-iphon.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Apple acknowledges iPhone Duo display \u0026#8216;issue\u0026#8217; after reports of cracked screens\",\"zh-TW\":\"相關封面圖：蘋果在螢幕破裂報告後承認 iPhone Duo 顯示“問題”\"},\"publishedAt\":\"2026-10-27T01:48:04.000Z\",\"title\":{\"en\":\"Apple Confirms iPhone Duo Inner-Display Fault and Points Owners to AppleCare Replacements\",\"zh-TW\":\"蘋果（Apple）證實 iPhone Duo 內螢幕故障，呼籲受影響用戶聯繫 AppleCare 換機\"},\"summary\":{\"en\":\"After online photos showed cracked inner screens, often with a bright line from center to right, Apple told Bloomberg and 9to5Mac it is aware of an issue affecting a small number of iPhone Duo units and will replace them via AppleCare. Takeaway: the fault reports put Apple's first foldable under its first durability test.\",\"zh-TW\":\"網路照片顯示 iPhone Duo 內螢幕破裂，常伴隨一條從中央向右延伸的亮線，蘋果隨後向彭博社與 9to5Mac 表示，已知悉少數 iPhone Duo 機型的內螢幕問題，將透過 AppleCare 換機。重點：故障回報讓蘋果首款摺疊機面臨第一次耐用度考驗，換機承諾是目前公司的回應。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"蘋果首款摺疊手機傳出內螢幕破裂後，公司正式承認問題：蘋果向彭博社與 9to5Mac 表示，已知悉少數 iPhone Duo 機型的內螢幕問題，受影響用戶應聯繫 AppleCare 換機。\\n發生了什麼事\\n網路上分享的照片顯示，蘋果首款可折疊裝置的螢幕出現故障。在傳出 iPhone Duo 內側螢幕破裂損壞、常伴隨一條從中央向右延伸的亮線後，蘋果在給彭博社和 9to5Mac 的聲明中表示，已經意識到少數 iPhone Duo 機型「影響內部顯示器的問題」。如果 iPhone Duo 受到影響，蘋果表示請聯繫 AppleCare 進行更換。BBC 的標題也確認了同一個結論：蘋果將更換有螢幕問題的 iPhone Duo 手機。\\n為什麼重要\\n結論關乎第一代產品的風險：摺疊螢幕的成敗就在耐用度，而一條橫跨摺痕的亮線，正是買家最怕看到的故障樣態。蘋果迅速承諾換機是止血，但還沒有回答這是小批量製造問題，還是會反覆出現的設計弱點。\\n來源異同\\nBBC Business 與 The Verge 在核心事實上一致：內螢幕破裂、蘋果承認、AppleCare 換機。信任標籤：N源一致——兩家主流媒體對核心主張的報導一致。片段自動標註的數字差異（27.2 對 8216）是 iOS 版本號與引號的 HTML 實體編碼假象，不是真正的數字衝突，因此不列入 disagreements。同批另有一則軟體消息：iOS 27.2 為 iPhone Duo 帶來 Apple Pencil 支援與 Edge Light 功能，那是軟體新聞，不是螢幕故障的一部分。\\n仍不確定\\n破裂原因、受影響數量、換機是否採用改良硬體，片段中都沒有。用戶應以蘋果官方說明為準，讀者也不應只憑社群照片推估故障率。\"},\"sources\":[{\"name\":\"BBC Business\",\"url\":\"https://www.bbc.co.uk/news/articles/c893zwlev2xpo?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"The Verge\",\"url\":\"https://www.theverge.com/tech/1018827/ios-27-2-iphone-duo-apple-pencil\"}],\"disagreements\":null,\"trustScore\":61,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":16,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"finance\",\"live-ingest\",\"bbc-business\",\"the-verge\",\"the-verge\"],\"glossary\":[{\"term\":{\"en\":\"Apple\",\"zh-TW\":\"蘋果\"},\"blurb\":{\"en\":\"The US technology company behind the iPhone, iPad and Mac.\",\"zh-TW\":\"推出 iPhone、iPad 與 Mac 的美國科技公司。\"}},{\"term\":{\"en\":\"iPhone Duo\",\"zh-TW\":\"iPhone Duo\"},\"blurb\":{\"en\":\"Apple's first foldable iPhone, launched days before this report.\",\"zh-TW\":\"蘋果首款摺疊 iPhone，在本報導前數日上市。\"}},{\"term\":{\"en\":\"AppleCare\",\"zh-TW\":\"AppleCare\"},\"blurb\":{\"en\":\"Apple's support and service program, which handles the replacements here.\",\"zh-TW\":\"蘋果的支援與維修服務計畫，本次換機由此管道處理。\"}},{\"term\":{\"en\":\"Bloomberg\",\"zh-TW\":\"彭博社\"},\"blurb\":{\"en\":\"Financial news outlet that received Apple's statement on the fault.\",\"zh-TW\":\"收到蘋果故障聲明的財經新聞媒體。\"}},{\"term\":{\"en\":\"9to5Mac\",\"zh-TW\":\"9to5Mac\"},\"blurb\":{\"en\":\"Apple-focused news site that also received Apple's statement.\",\"zh-TW\":\"同樣收到蘋果聲明的蘋果主題新聞網站。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:de
