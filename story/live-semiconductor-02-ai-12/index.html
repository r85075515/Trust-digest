pted by first-tier semiconductor makers for advanced packaging, and a thick grinding tape product is in customer validation. Chairman Yang Yunbin (楊允斌) spoke at the presentation, according to the feed summary, which cuts off before his remarks. TechNews frames the story on the company's exclusive hydrolysis tape position in AI packaging; CNA frames it on the release film's adoption by leading chipmakers.\nWhy it matters\nA NT$438 tentative price and a mid-December listing put a number on a small materials supplier riding the AI packaging boom. The release film's adoption by first-tier makers is the concrete signal: the company is already inside the advanced-packaging supply chain rather than hoping to enter it. Takeaway: two products — release film and grinding tape — are the listing story, so watch the final pricing and the first trading days for how the market values that position.\nSources agree / disagree\nTechNews and CNA agree on the listing plan and the product story. The feed's automated disagreement note flags '12 vs 18' — the mid-December listing target against the November 18 report date. Those are two different dates, not conflicting figures.\nStill uncertain\nThe chairman's remarks are truncated in the feed, so his outlook and any financial figures from the presentation are unknown. The final underwriting price, the exact listing date and the allocation of the offering have not been confirmed in the summaries.\nTrust label: Two-source agreement — Two outlets agree on the listing plan and product story, though the chairman's remarks and final pricing are missing from the feed."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-02-ai-12\",\"category\":\"semiconductor\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-semiconductor-02-ai-12.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 獨家「水解膠帶」卡位 AI 封裝！碩正科技預計 12 月中掛牌上櫃\",\"zh-TW\":\"相關封面圖：獨家「水解膠帶」卡位 AI 封裝！碩正科技預計 12 月中掛牌上櫃\"},\"publishedAt\":\"2026-11-18T08:18:30.000Z\",\"title\":{\"en\":\"Shuo Cheng Technology to List in Mid-December on AI Packaging Demand\",\"zh-TW\":\"碩正科技（Shuo Cheng Technology）12 月中掛牌上櫃，離型膜打入先進封裝\"},\"summary\":{\"en\":\"Semiconductor materials maker Shuo Cheng Technology held its pre-listing presentation today, setting a tentative underwriting price of NT$438 per share and targeting a mid-December listing. Its release film is used in advanced packaging by first-tier chipmakers, and a thick grinding tape is in customer validation. Takeaway: two products are driving the listing story — watch the pricing and trading days.\",\"zh-TW\":\"半導體材料廠碩正科技今日舉辦上櫃前業績發表會，公開承銷價格暫定每股 438 元，預計 12 月中掛牌交易。公司離型膜已獲一線半導體廠先進封裝採用，厚型研磨膠帶新產品正配合客戶驗證。結論：兩大產品是掛牌故事主軸，後續看承銷定價與掛牌初期表現。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"半導體材料廠碩正科技今日舉辦上櫃前業績發表會，公開承銷價格暫定每股 438 元，預計 12 月中掛牌交易。\\n發生了什麼事\\n公司表示，離型膜產品已獲一線半導體廠先進封裝採用，厚型研磨膠帶新產品正配合客戶驗證。董事長楊允斌出席發表會，來源摘要在其發言處截斷，談話內容未載。科技新報以獨家水解膠帶卡位 AI 封裝為主軸，中央社則以離型膜獲一線廠採用為主軸。\\n為什麼重要\\n438 元暫定價與 12 月中掛牌，為這家搭上 AI 封裝熱潮的小型材料供應商標出了價碼。離型膜獲一線廠採用是具體信號：公司已打入先進封裝供應鏈，而非還在門外爭取。結論是離型膜與研磨膠帶兩大產品是掛牌故事主軸，後續看承銷定價與掛牌初期表現，判斷市場如何評價這個位置。\\n來源異同\\n科技新報與中央社對掛牌計畫與產品進展的說法一致。來源自動標註的「12 比 18」數字差異，指的是 12 月中掛牌目標與 11 月 18 日報導日期，屬於兩個不同日期，並非數字衝突。\\n仍不確定\\n董事長發言在來源中截斷，展望與發表會財務數字皆不明。最終承銷價格、確切掛牌日期與承銷配售方式，摘要中尚未確認。\"},\"sources\":[{\"name\":\"TechNews 科技新報\",\"url\":\"https://finance.technews.tw/2026/11/18/3d-foplp/\"},{\"name\":\"中央社-產經證券\",\"url\":\"https://www.cna.com.tw/news/afe/202611180224.aspx\"}],\"disagreements\":{\"en\":\"Figures differ across outlets (e.g. 12 vs 18 in headlines/snippets).\",\"zh-TW\":\"各個媒體的數字有所不同（例如，標題/摘要中的數字為 12 比 18）。\"},\"trustScore\":64,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":19,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"semiconductor\",\"live-ingest\",\"technews-科技新報\",\"中央社-產經證券\"],\"glossary\":[{\"blurb\":{\"en\":\"Taiwan semiconductor materials maker preparing to list on the over-the-counter market.\",\"zh-TW\":\"台灣半導體材料廠，
