fered what is reported as its first mission failure in 20 years, failing to deliver the satellites to orbit. Leo is Amazon's rival to SpaceX's Starlink and has struggled to get going. The failure matters because it was the first Amazon launch to use a rocket designed specifically to carry its broadband satellites to low Earth orbit. ULA, a Lockheed Martin-Boeing joint venture known for its ultra-dependable Atlas V, built the rocket. The Verge, Engadget and The Register agree on the failure and the satellite count.\nWhy it matters\nAmazon's plan to run a broadband constellation took a direct hit on its first purpose-built launch, and a reliability blemish on ULA's new rocket after two decades without a mission failure puts both schedules under pressure.\nSources agree / disagree\nThree outlets agree the Vulcan failed and 40 Leo satellites were lost. The figures 15 and 01 are not a conflict: 15 is the November 15 launch date, while 01 does not describe the same fact. The Science item in the cluster covers gas flaring in Ecuador's Amazon and is unrelated to the launch. Trust label: Multi-source agreement — three outlets agree the Vulcan failed and 40 Leo satellites were lost.\nStill uncertain\nThe cause of the failure is not in the snippets. Whether any satellites survived or what ULA's investigation finds is unknown, and Amazon's revised launch plans are not stated; check the full reporting."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-03-ula-vulcan-rocket-failur\",\"category\":\"semiconductor\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-semiconductor-03-ula-vulcan-rocket-failur.jpg\",\"imageAlt\":{\"en\":\"Cover related to: ULA Vulcan rocket failure destroys 40 Amazon Leo satellites\",\"zh-TW\":\"相關封面圖：（譯文待補）ULA Vulcan rocket failure destroys 40 Amazon Leo satellites\"},\"publishedAt\":\"2026-11-16T08:15:51.718Z\",\"title\":{\"en\":\"ULA Vulcan Failure Destroys 40 Amazon Leo Satellites in First Mission Loss\",\"zh-TW\":\"聯合發射聯盟（ULA）火神火箭失敗：40 顆亞馬遜 Leo 衛星全毀\"},\"summary\":{\"en\":\"A United Launch Alliance Vulcan rocket failed after lifting off on November 15, 2026, destroying all 40 Amazon Leo broadband satellites aboard, The Verge, Engadget and The Register reported. It was reportedly ULA's first mission failure in 20 years and the first Amazon launch on a rocket built for its constellation. Watch for ULA's investigation and Amazon's next launch date.\",\"zh-TW\":\"聯合發射聯盟（ULA）火神（Vulcan）火箭 2026 年 11 月 15 日升空後失敗，搭載的 40 顆亞馬遜 Leo 寬頻衛星全數損毀。據報導這是 ULA 20 年來首次任務失敗，也是亞馬遜首度使用為其衛星群量身打造的火箭發射。接下來看 ULA 的失敗調查與亞馬遜後續發射時程。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"聯合發射聯盟火神火箭 2026 年 11 月 15 日升空後失敗，搭載的 40 顆亞馬遜 Leo 寬頻衛星全數損毀。\\n發生了什麼事\\n據報導這是 ULA 20 年來首次任務失敗，衛星未能進入軌道。Leo 是亞馬遜對抗 SpaceX 星鏈的寬頻衛星計畫，起步一直不順。這次失敗格外關鍵，因為這是亞馬遜首度使用專為運送自家寬頻衛星到近地軌道而設計的火箭發射。製造火箭的 ULA 是洛克希德·馬丁與波音的合資企業，以超可靠的擎天神 5 號聞名。The Verge、Engadget、The Register 三家對失敗與衛星數量說法一致。\\n為什麼重要\\n亞馬遜經營寬頻衛星群的計畫，在首度量身打造的發射任務就受重挫；ULA 新火箭在 20 年零任務失敗紀錄後出包，兩邊的發射時程都面臨壓力。\\n來源異同\\n三家對火箭失敗與 40 顆衛星損毀的報導一致。15 是 11 月 15 日的發射日期，01 並非同一事實的數字，兩者不是衝突。同批 Science 報導談的是厄瓜多亞馬遜地區的天然氣燃燒問題，與發射無關。信任標籤：N源一致——三家對火神火箭失敗與衛星損失的報導一致。\\n仍不確定\\n失敗原因未見報導；衛星是否全毀、官方說法為何，全都未知；亞馬遜後續發射計畫也未說明，引用前請查閱完整報導。\"},\"sources\":[{\"name\":\"The Verge\",\"url\":\"https://www.theverge.com/science/1034006/vulcan-rocket-fails-destroying-40-amazon-leo-satellites\"},{\"name\":\"Engadget\",\"url\":\"https://www.engadget.com/2317283/ula-vulcan-rocket-failure-destroys-40-amazon-leo-satellites/\"},{\"name\":\"The Register\",\"url\":\"https://www.theregister.com/networks/2026/11/16/amazon-loses-first-batch-of-broadband-satellites-launched-on-custom-rocket/5310000\"},{\"name\":\"Science 科學新聞\",\"url\":\"https://www.science.org/content/article/satellites-and-boots-ground-uncover-rampant-gas-flaring-ecuador-s-amazon\"}],\"disagreements\":{\"en\":\"The figures 15 and 01 refer to different things: 15 is the November 15 launch date, while 01 does not describe the same fact, so there is no genuine conflict.\",\"zh-TW\":\"15 與 01 指的是不同東西：15 是 11 月 15 日的發射日期，01 並非同一事實的數字，因此不是真正的說法衝突。\"},\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":25,\"outletReputation\":15,\"crossCorroboration\":17,\"recencyClarity\":25},\"tags\":[\"semiconductor\",\"live-ingest\",\"the-verge\",\"engadget\",\"the-register\"],\"glossary\":[{\"blurb\":{\"en\":\"Lockheed Martin-Boeing joint venture whose Vulcan rocket failed.\",\"zh-TW\":\"洛克希德·馬丁與波音的合資企業，本次失敗的火神火箭製造者。\"},\"term\":{\"en\":\"ULA\",\"zh-TW\":\"聯合發射聯盟\"}},{\"blurb\":{\"en\":\"ULA's new heavy-lift rocket, built to carry Amazon's broadband satellites.\",\"zh-TW\":\"聯合發射聯盟的新型重型火箭，為運送亞馬遜寬頻衛星打造。\"},\"term\":{\"en\":\"Vulcan\",\"zh-TW\":\"火神火箭\"}},{\"blurb\":{\"en\":\"Amazon's broadband satellite constellation, a rival to SpaceX's Starlink.\",\"zh-TW\":\"亞馬遜的寬頻衛星群，SpaceX 星鏈的競爭對手。\"},\"term\":{\"en\":\"Amazon Leo\",\"zh-TW\":\"亞馬遜 Leo\"}},{\"blurb\":{\"en\":\"SpaceX's satellite internet constellation, the rival Amazon's Leo is chasing.\",\"zh-TW\":\"SpaceX 的衛星網路，亞馬遜 Leo 追趕的對手。\"},\"term\":{\"en\":\"Starlink\",\"zh-TW\":\"星鏈\"}},{\"blurb\":{\"en\":\"ULA's ultra-dependable workhorse rocket, cited as a contrast to the new Vulcan.\",\"zh-TW\":\"聯合發射聯盟超可靠的主力火箭，與新型火神火箭形成對照。\"},\"term\":{\"en\":\"Atlas V\",\"zh-TW\":\"擎天神 5 號\"}},{\"blurb\":{\"en\":\"US technology news outlet reporting the rocket failure.\",\"zh-TW\":\"美國科技新聞媒體，報導本次火箭失敗。\"},\"term\":{\"en\":\"The Verge\",\"zh-TW\":\"The Verge\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"l
