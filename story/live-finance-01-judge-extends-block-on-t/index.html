 ruling extending the preliminary injunction against President Trump's ban of three news organizations — CNN, MS NOW, and Politico — from the White House. Kelly found that the revocation of the outlets' hard badges likely violated their constitutional rights, and ordered that the administration must continue granting the three organizations access to the White House grounds while their lawsuit proceeds. The ruling is described as a major win for the outlets and a signal that the judge believes their legal claims could succeed on the merits. The same feed cluster bundles two separate stories: PBS NewsHour reports that on her first day at the podium, the new White House press secretary announced President Trump had asked Kimberly Guilfoyle — his son's former fiancée and ambassador to Greece — to resign amid allegations she sought $100,000 from a donor; The Guardian separately reports a judge halted tree removal at a Washington golf course Trump eyes for expansion.\nWhy it matters\nAccess is leverage. By preserving the three outlets' White House access for the duration of the litigation, the court removed the administration's most immediate pressure tool and telegraphed skepticism about the ban's legality. For newsrooms, an extended injunction means coverage continues uninterrupted; for the White House, it means the fight now moves to a full legal argument it may already be losing.\nSources agree / disagree\nCNBC, The Hill, and Axios agree on Kelly's ruling, its late-night timing, and the constitutional-rights reasoning. The Guilfoyle and golf-course items come from separate outlets and stand as independent threads inside the same cluster. Trust label: Multi-source agreement — three outlets agree on the ruling and its reasoning.\nStill uncertain\nThe snippets do not include the full text of Kelly's ruling or a timeline for the underlying lawsuit's resolution; verify details on the publisher pages before quoting specifics."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-01-judge-extends-block-on-t\",\"category\":\"finance\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-finance-01-judge-extends-block-on-t.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Judge extends block on Trump White House ban of MS NOW, CNN and Politico\",\"zh-TW\":\"相關封面圖：法官延長了川普白宮對 MS NOW、CNN 和 Politico 的禁令\"},\"publishedAt\":\"2026-10-14T05:19:36.000Z\",\"title\":{\"en\":\"Judge Timothy Kelly Extends Block on Trump's Ban of CNN, MS NOW and Politico\",\"zh-TW\":\"聯邦法官凱利（Timothy Kelly）延長禁令：川普不得封殺 CNN 等三家媒體\"},\"summary\":{\"en\":\"U.S. Judge Timothy Kelly has extended the preliminary injunction blocking President Trump's revocation of White House hard passes for CNN, MS NOW, and Politico, ruling the move likely violated their constitutional rights. The three outlets keep White House grounds access while their lawsuit proceeds — a major early win signaling the court believes their claims could succeed.\",\"zh-TW\":\"美國聯邦法官凱利（Timothy Kelly）延長初步禁令，擋下川普政府撤銷 CNN、MS NOW 與 Politico 白宮記者證的決定，認定該舉措可能侵害三家媒體的憲法權利。訴訟期間三家媒體可繼續進入白宮採訪，是官司開打以來的重大勝利，也暗示法院認為它們的主張可能成立。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"白宮與媒體的記者證大戰，有了第一張司法成績單——目前是媒體方領先。\\n發生了什麼事\\nCNBC、The Hill 與 Axios 報導，美國聯邦法官凱利（Timothy Kelly）週二深夜裁定，延長針對川普封殺三家媒體——CNN、MS NOW、Politico——的初步禁令。凱利認定，撤銷三家媒體白宮記者證的舉措可能侵害其憲法權利，並命令在訴訟進行期間，政府必須繼續允許這三家媒體進入白宮採訪。報導形容這是三家媒體的重大勝利，也顯示法官認為它們的法律主張可能成立。同批新聞另有兩則獨立消息：PBS 報導，新任白宮發言人上任首日宣布，川普已要求其子的前未婚妻、駐希臘大使 Kimberly Guilfoyle 辭職，起因是她被指曾向一名捐款人索取 10 萬美元；《衛報》則報導，法官叫停了川普有意擴建的華盛頓高爾夫球場的砍樹工程。\\n為什麼重要\\n採訪權就是籌碼。法院讓三家媒體在訴訟期間保有白宮採訪權，等於拔掉了政府最即時施壓的工具，也透露出對禁令合法性的懷疑。對新聞室而言，禁令延長意味著報導不中斷；對白宮而言，這場仗現在要打完整法律攻防，而開局已經不利。\\n來源異同\\nCNBC、The Hill、Axios 對凱利的裁定、深夜裁決的時間點與憲法權利的理由說法一致；Guilfoyle 與高爾夫球場兩則來自不同媒體，是同一批新聞裡的獨立支線。信任標籤：多源一致——三家媒體對裁定與理由的報導一致。\\n仍不確定\\n摘要未收錄凱利裁定的全文，也沒有本案訴訟的時間表；引用細節前請查閱各媒體完整報導。\"},\"sources\":[{\"name\":\"CNBC\",\"url\":\"https://www.cnbc.com/2026/10/14/trump-white-house-msnow-cnn-politico-media-ban.html\"},{\"name\":\"PBS NewsHour\",\"url\":\"https://www.pbs.org/newshour/show/white-house-press-secretarys-debut-brings-news-of-guilfoyles-exit\"},{\"name\":\"The Hill\",\"url\":\"https://thehill.com/regulation/court-battles/6147113-judge-extends-block-trump-media-ban/\"},{\"name\":\"Axios\",\"url\":\"https://www.axios.com/2026/10/14/white-house-cnn-ms-now-politico-access\"},{\"name\":\"The Guardian Environment\",\"url\":\"https://www.theguardian.com/us-news/2026/oct/12/order-halt-tree-removal-washington-dc-golf-course-trump\"}],\"disagreements\":null,\"trustScore\":85,\"trustBreakdown\":{\"sourceDiversity\":25,\"outletReputation\":18,\"crossCorroboration\":17,\"recencyClarity\":25},\"tags\":[\"finance\",\"live-ingest\",\"cnbc\",\"pbs-newshour\",\"the-hill\"],\"glossary\":[{\"term\":{\"en\":\"Timothy Kelly\",\"zh-TW\":\"Timothy Kelly\"},\"blurb\":{\"en\":\"U.S. District Judge who extended the injunction against the White House media ban.\",\"zh-TW\":\"美國聯邦法官，延長擋下白宮媒體禁令的禁制令。\"}},{\"term\":{\"en\":\"MS NOW\",\"zh-TW\":\"MS NOW\"},\"blurb\":{\"en\":\"One of the three news organizations targeted by the White House ban, alongside CNN and Politico.\",\"zh-TW\":\"被白宮禁令針對的三家媒體之一，另兩家為 CNN 與 Politico。\"}},{\"term\":{\"en\":\"Kimberly Guilfoyle\",\"zh-TW\":\"Kimberly Guilfoyle\"},\"blurb\":{\"en\":\"Ambassador to Greece and the president's son's former fiancée, reportedly asked to resign.\",\"zh-TW\":\"駐希臘大使、總統之子的前未婚妻，傳被要求辭職。\"}},{\"term\":{\"en\":\"preliminary injunction\",\"zh-TW\":\"初步禁令\"},\"blurb\":{\"en\":\"A court order preserving the status quo while a lawsuit is decided.\",\"zh-TW\":\"訴訟定讞前維持現狀的法院命令。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"d
