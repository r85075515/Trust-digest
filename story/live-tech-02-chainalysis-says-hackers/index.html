}],{\"children\":[[\"id\",\"live-tech-02-chainalysis-says-hackers\",\"d\"],[\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$L2\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L3\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[\"__PAGE__\",[\"$\",\"$1\",\"c\",{\"children\":[\"$L4\",null,[\"$\",\"$L5\",null,{\"children\":[\"$L6\",[\"$\",\"$L7\",null,{\"promise\":\"$@8\"}]]}]]}],{},null,false]},null,false]},null,false]},null,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[[\"$\",\"$L9\",null,{\"children\":\"$La\"}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]],[\"$\",\"$Lb\",null,{\"children\":[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$c\",null,{\"fallback\":null,\"children\":\"$Ld\"}]}]}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$e\",[]],\"s\":false,\"S\":true}\n"])</script><script>self.__next_f.push([1,"f:I[8587,[\"619\",\"static/chunks/619-ba102abea3e3d0e4.js\",\"523\",\"static/chunks/523-9d0ba1348220a1ce.js\",\"954\",\"static/chunks/app/story/%5Bid%5D/page-b37b1e31acb17fd9.js\"],\"default\"]\n10:T7b2,"])</script><script>self.__next_f.push([1,"Blockchain analysis firm Chainalysis (Chainalysis) says hackers obtained sensitive personal information — including names, usernames, password hashes and live tokens — for all of its customers after breaching its network systems. The report, from Ars Technica, is single-sourced and truncated, but the core claim is unambiguous: every customer is affected.\nWhat happened\nChainalysis disclosed that hackers broke into its network systems and obtained sensitive personal information for all of its users. The data taken includes names, usernames, password hashes, and live tokens — the last of these being credentials that work right now, not merely historical records. The feed snippet cuts off mid-sentence after 'its network s…', so the method of the breach and the company's response are not in the material provided.\nWhy it matters\nThe judgment is about irony and exposure at once: Chainalysis is a firm whose business is tracing crypto crime, and a breach of its own customer data is the kind of incident its clients pay it to help others survive. Live tokens make the breach worse than a password leak, because tokens can be used immediately without cracking anything. For readers, the takeaway is practical: anyone with a Chainalysis account should treat every credential as exposed until the company says otherwise.\nSources agree / disagree\nOnly the Ars Technica report is in the cluster, so there is no independent confirmation. Trust label: Single source — one technology outlet's report; the snippet is truncated, so the breach method and response are unverified.\nStill uncertain\nThe snippet cuts off before describing how the hackers got in, when the breach happened, or what Chainalysis has done since — whether tokens were revoked, users notified, or systems rebuilt. The scale is stated as all customers, but no user count is given. Check the full Ars Technica report and Chainalysis's own disclosure for the timeline and the remediation steps."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-tech-02-chainalysis-says-hackers\",\"category\":\"tech\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-tech-02-chainalysis-says-hackers.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Chainalysis says hackers stole credentials and tokens for all of its customers\",\"zh-TW\":\"相關封面圖：（譯文待補）Chainalysis says hackers stole credentials and tokens for all of its customers\"},\"publishedAt\":\"2026-11-06T20:56:41.000Z\",\"title\":{\"en\":\"Chainalysis Says Hackers Stole Credentials and Tokens for All Customers\",\"zh-TW\":\"Chainalysis 遭駭：駭客竊取全數客戶憑證與權杖\"},\"summary\":{\"en\":\"[Unverified-single-source] Blockchain analysis firm Chainalysis (Chainalysis) says hackers obtained sensitive personal information — including names, usernames, password hashes and live tokens — for all of its customers after breaching its network systems. The takeaway: a breach at a firm that tracks crypto crime is itself the story — affected users should treat every credential as exposed until Chainalysis says otherwise.\",\"zh-TW\":\"［未證實·單一來源］區塊鏈分析公司 Chainalysis 表示，駭客入侵其網路系統後，取得全數客戶的敏感個人資料，包括姓名、使用者名稱、密碼雜湊值與有效的權杖。結論是：一家追蹤加密犯罪的公司自己遭駭，本身就是新聞，在 Chainalysis 另行通知前，受影響用戶應假設每一組憑證都已外洩。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"區塊鏈分析公司 Chainalysis 表示，駭客入侵其網路系統後，取得全數客戶的敏感個人資料，包括姓名、使用者名稱、密碼雜湊值與有效的權杖。這篇報導出自 Ars Technica，是單一來源且遭到截斷，但核心說法毫不含糊：每一位客戶都受到影響。\\n發生了什麼事\\nChainalysis 披露駭客入侵其網路系統，取得全數用戶的敏感個人資料。被竊取的資料包括姓名、使用者名稱、密碼雜湊值與有效的權杖——權杖是現在就能用的憑證，不只是歷史紀錄。摘要在「其網路系統」之後中斷，入侵手法與公司的應對措施不在提供的資料裡。\\n為什麼重要\\n這件事同時關乎諷刺與曝險：Chainalysis 的本業是追蹤加密犯罪，而自家客戶資料遭竊，正是它的客戶付錢請它協助防範的那種事故。有效的權杖讓這次外洩比密碼外洩更嚴重，因為權杖可以立即使用，不需要破解任何東西。對讀者來說，結論很實際：在公司另行通知前，任何有 Chainalysis 帳號的人都應假設每一組憑證都已外洩。\\n來源異同\\n群組裡只有 Ars Technica 這一則報導，沒有獨立查證。信任標籤：僅1源——單一科技媒體的報導；摘要遭到截斷，入侵手法與應對措施未經證實。\\n仍不確定\\n摘要在說明駭客如何入侵、事件何時發生、Chainalysis 事後做了什麼之前中斷——權杖是否已被撤銷、用戶是否已獲通知、系統是否已重建，都不清楚。影響範圍寫的是全數客戶，但沒有給出用戶數量。想看時間線與補救措施，請查 Ars Technica 完整報導與 Chainalysis 自己的披露。\"},\"sources\":[{\"name\":\"Ars Technica\",\"url\":\"https://arstechnica.com/security/2026/11/chainalysis-says-hackers-stole-credentials-and-tokens-for-all-of-its-customers/\"}],\"disagreements\":null,\"trustScore\":56,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":19,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"tech\",\"live-ingest\",\"ars-technica\"],\"glossary\":[{\"blurb\":{\"en\":\"Blockchain analysis firm that disclosed the breach.\",\"zh-TW\":\"披露這次入侵事件的區塊鏈分析公司。\"},\"term\":{\"en\":\"Chainalysis\",\"zh-TW\":\"Chainalysis\"}},{\"blurb\":{\"en\":\"The business of tracing cryptocurrency transactions and crime.\",\"zh-TW\":\"追蹤加密貨幣交易與犯罪的業務。\"},\"term\":{\"en\":\"Blockchain analysis\",\"zh-TW\":\"區塊鏈分析\"}},{\"blurb\":{\"en\":\"Scrambled password representations taken in the breach.\",\"zh-TW\":\"這次外洩中被竊取的密碼雜湊值。\"},\"term\":{\"en\":\"Password hash\",\"zh-TW\":\"密碼雜湊值\"}},{\"blurb\":{\"en\":\"Active login credentials that work immediately if stolen.\",\"zh-TW\":\"遭竊後可立即使用的有效登入憑證。\"},\"term\":{\"en\":\"Live token\",\"zh-TW\":\"有效權杖\"}},{\"blurb\":{\"en\":\"Technology outlet reporting the breach.\",\"zh-TW\":\"報導這次入侵事件的科技媒體。\"},\"term\":{\"en\":\"Ars Technica\",\"zh-TW\":\"Ars Technica\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-tech-02-chainalysis-says-hackers/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-tech-02-chainalysis-says-hackers/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}]],\"error\":null,\"digest\":\"$undefi
