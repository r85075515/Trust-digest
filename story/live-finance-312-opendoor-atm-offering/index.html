program, according to its Form 8-K filing with the U.S. Securities and Exchange Commission. Under the terms, Opendoor may sell shares from time to time at its sole discretion and is not obligated to issue any shares, while Virtu Americas may earn commissions of up to 2.0 percent of gross sales.\n\nWhy it matters\nAn at-the-market facility allows a capital-intensive residential real estate operator to raise cash incrementally at prevailing market prices rather than executing a single discounted secondary offering. However, actual share sales under the 300 million USD shelf would dilute existing stockholders if drawn down.\n\nSource differences\nThe primary SEC filing (\"of The Securities Exchange Act of 1934 - SEC.gov\") formally documents the November 27, 2026 Sales Agreement between Opendoor Technologies Inc. and Virtu Americas. TradingView News (\"Opendoor Technologies Establishes $300 Million At-the-Market\") and TipRanks (\"Opendoor Technologies Announces $300 Million At-the-Market\") summarize the same Form 8-K disclosure, detailing the 2.0 percent maximum sales commission and discretionary issuance terms.\n\nStill uncertain\nBecause sales depend on future market conditions and management discretion, the exact timing, average issuance price, total net proceeds, and degree of shareholder dilution remain undetermined.\n\nTrust label: Single source — All secondary financial reports summarize the single November 27, 2026 Form 8-K filing submitted by Opendoor Technologies to the SEC."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-312-opendoor-atm-offering\",\"category\":\"finance\",\"title\":{\"en\":\"Opendoor Technologies Establishes $300 Million At-the-Market Share Offering\",\"zh-TW\":\"Opendoor Technologies 設立 3 億美元市價發行售股計畫\"},\"summary\":{\"en\":\"Opendoor Technologies filed a Form 8-K on November 27, 2026, disclosing a sales agreement with Virtu Americas to sell up to 300 million USD of common stock via an at-the-market offering. The structure gives Opendoor discretionary equity funding flexibility without obligating immediate share issuance.\",\"zh-TW\":\"美國線上房地產平台 Opendoor Technologies 於 2026 年 11 月 27 日向美國證交會申報 Form 8-K，宣布與券商 Virtu Americas 簽訂最高 3 億美元的市價發行（ATM）售股協議，藉此保留視市場狀況彈性籌資的空間。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n根據美國證券交易委員會（SEC）2026 年 11 月 27 日公開的 Form 8-K 申報文件，住宅房地產交易平台 Opendoor Technologies 與券商 Virtu Americas 簽署售股協議，建立最高 3 億美元的普通股市價發行（At-the-Market）計畫。依協議條款，Opendoor 可完全自主決定出售時機與數量，並無強制發股義務，Virtu Americas 最高可收取總銷售金額 2.0% 的佣金。\\n\\n「為什麼重要」\\n市價發行機制讓需要充裕流動性的房地產營運商能依當時市場價格分批籌資，避免一次性折價增資對股價造成劇烈衝擊，同時補充現有資本資源；但若未來實際動用該 3 億美元額度，仍將對現有股東產生股權稀釋效應。\\n\\n「來源異同」\\nSEC 官網一手申報文件（\\\"of The Securities Exchange Act of 1934 - SEC.gov\\\"）載明 Opendoor Technologies 與 Virtu Americas 於 2026 年 11 月 27 日簽訂售股協議之法律事實；TradingView News（\\\"Opendoor Technologies Establishes $300 Million At-the-Market\\\"）與 TipRanks（\\\"Opendoor Technologies Announces $300 Million At-the-Market\\\"）均為依據同一份 Form 8-K 生成的摘要報導，補充列出最高 2.0% 佣金上限與非強制發售條款。\\n\\n「仍不確定」\\n由於實際售股完全取決於未來市場狀況與管理層裁量，最終執行時程、平均發行價格、實際募資淨額與股權稀釋幅度均尚未確定。\\n\\nTrust label: Single source — 兩篇財經報導皆轉述自 Opendoor Technologies 向 SEC 提交的同一份 Form 8-K 公告，獨立來源多樣性低。\"},\"glossary\":[{\"term\":{\"en\":\"At-the-Market (ATM) Offering\",\"zh-TW\":\"市價發行（ATM）\"},\"blurb\":{\"en\":\"A method of raising capital in which a listed company sells newly issued shares incrementally into the open market at prevailing trading prices.\",\"zh-TW\":\"上市公司透過指定券商，按二級市場即時交易價格分批出售新股以募集資金的籌資方式。\"}},{\"term\":{\"en\":\"Form 8-K\",\"zh-TW\":\"Form 8-K 重大事件申報書\"},\"blurb\":{\"en\":\"A report public companies must file with the U.S. SEC to announce major unscheduled corporate events or material agreements.\",\"zh-TW\":\"美國上市公司依規定向美國證交會申報重大未預期事件或重要合約簽署的即時公告文件。\"}},{\"term\":{\"en\":\"Share Dilution\",\"zh-TW\":\"股權稀釋\"},\"blurb\":{\"en\":\"The reduction in existing shareholders' ownership percentage when a company issues additional shares of stock.\",\"zh-TW\":\"公司增發新
