otech\",\"title\":{\"en\":\"Neuralink Wins FDA Approval for First U.S. Pivotal Brain-Implant Trial in ALS\",\"zh-TW\":\"Neuralink 獲美國 FDA 批准，啟動漸凍人腦機介面關鍵臨床試驗\"},\"summary\":{\"en\":\"Neuralink announced FDA approval for LINK, the first U.S. pivotal clinical trial of an implantable brain-computer interface enrolling adults with ALS. The multi-site study will evaluate whether thought-controlled digital devices can restore everyday independence, marking a major regulatory milestone toward commercializing implanted BCIs.\",\"zh-TW\":\"腦機介面公司 Neuralink 宣布獲得美國食品藥物管理局（FDA）批准，啟動名為 LINK 的關鍵臨床試驗，成為美國首項針對漸凍症（ALS）成年患者的植入式腦機介面關鍵試驗。此案將跨多處臨床中心評估長期安全性與意念操控數位裝置的成效，代表植入式腦機介面朝商業化邁出關鍵一步。\"},\"body\":{\"en\":\"Neuralink announced on November 26, 2026, that it has received U.S. Food and Drug Administration (FDA) approval to launch the LINK Pivotal Study, the first U.S. pivotal clinical trial of an implantable brain-computer interface (BCI) enrolling adults with amyotrophic lateral sclerosis (ALS).\\n\\nRecruitment for the study is now open. Across multiple clinical sites, researchers will assess the long-term safety and reliability of the implant while evaluating whether participants can control digital devices through thought to improve everyday communication and independence.\\n\\nBoth CASRAI and Neuro Rehab Times (NR Times) report the FDA clearance for the LINK pivotal trial in ALS patients and the goal of restoring digital device control. Exact enrollment targets, trial duration, and expected FDA market-submission timelines have not been disclosed in the available reports.\\n\\nTrust label: Multi-source agreement — CASRAI and NR Times both report FDA approval for Neuralink's LINK pivotal ALS trial.\",\"zh-TW\":\"「發生了什麼事」\\n腦機介面公司 Neuralink 於 2026 年 11 月 26 日宣布，已獲美國食品藥物管理局（FDA）核准啟動名為「LINK」的關鍵臨床試驗（Pivotal Study），將招募患有肌萎縮性脊髓側索硬化症（ALS，俗稱漸凍症）的成年受試者，目前並已開放招募。\\n\\n「為什麼重要」\\n這是美國首項針對漸凍症患者的植入式腦機介面關鍵臨床試驗。研究團隊將在多處臨床中心持續驗證系統的長期安全性與可靠性，並評估患者透過意念操控數位裝置能否實質改善日常溝通與生活獨立性，是邁向醫療器材正式上市的核心關卡。\\n\\n「來源異同」\\nCASRAI 與復健醫療媒體 Neuro Rehab Times（NR Times）均確認 Neuralink 取得 FDA 核准啟動 LINK 關鍵試驗，且聚焦漸凍症受試者的意念操控能力與多中心安全性評估，報導重點一致。\\n\\n「仍不確定」\\n目前公開報導尚未揭露 LINK 試驗的總收案人數、完整追蹤期程，以及 Neuralink 預計向 FDA 提出正式上市許可申請的時間表。\"},\"glossary\":[{\"term\":{\"en\":\"Pivotal Clinical Trial\",\"zh-TW\":\"關鍵臨床試驗\"},\"blurb\":{\"en\":\"A late-stage clinical study designed to gather definitive safety and efficacy data required for regulatory marketing approval.\",\"zh-TW\":\"用於蒐集決定性安全性與療效數據、作為主管機關審查產品上市許可依據的後期臨床試驗。\"}},{\"term\":{\"en\":\"Brain-Computer Interface (BCI)\",\"zh-TW\":\"腦機介面\"},\"blurb\":{\"en\":\"A system that translates brain signals directly into commands to operate external digital devices.\",\"zh-TW\":\"能直接讀取大腦神經訊號並轉譯為指令，藉以操控外部電腦或數位裝置的技術系統。\"}},{\"term\":{\"en\":\"Amyotrophic Lateral Sclerosis (ALS)\",\"zh-TW\":\"肌萎縮性脊髓側索硬化症（漸凍症）\"},\"blurb\":{\"en\":\"A progressive neurodegenerative disease that affects nerve cells in the brain and spinal cord, leading to loss of muscle control.\",\"zh-TW\":\"一種進行性神經退化疾病，會影響大腦與脊髓運動神經元，導致肌肉逐漸無力與萎縮。\"}}],\"sources\":[{\"name\":\"CASRAI\",\"url\":\"https://casrai.org/news/neuralink-link-pivotal-trial-als-fda-clearance-2026\"},{\"name\":\"NR Times\",\"url\":\"https://nrtimes.co.uk/neuralink-receives-fda-approval-for-als-study-kind26/\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"Neuralink LINK pivotal brain-computer interface trial for ALS\",\"zh-TW\":\"Neuralink 獲 FDA 批准啟動漸凍症腦機介面臨床試驗\"},\"isHeadline\":false,\"isPopular\":true,\"trustScore\":77,\"trustBreakdown\":{\"crossCorroboration\":20,\"outletReputation\":17,\"recencyClarity\":21,\"sourceDiversity\":19},\"publishedAt\":\"2026-11-27T13:42:38.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":4,\"D2\":3,\"D3\":4,\"D4\":4,\"D5\":4,\"total\":19},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.pu
