ort says the changes have prompted concern about DeepSeek's computing capacity. The TechNews feed item is truncated, so its full text is not available in this cluster.\nWhy it matters\nA fast-growing AI company publicly admitting it is short on compute is unusual, and the limits land directly on heavy users: long-running conversations and long inputs are exactly what researchers and developers rely on. The move raises questions about whether DeepSeek can keep up with demand for its models, and whether more restrictions will follow. For users, the practical effect is immediate: conversations that go quiet for a week will not be there to resume.\nSources agree / disagree\nTechNews and CNA agree on the headline facts — the admitted compute shortage and the new limits. The 40,000-character cap appears only in the CNA dispatch; the truncated TechNews snippet does not confirm it. The feed's auto-flagged '8230 vs 16' is not a real conflict: 16 is the date in the CNA dateline, while 8230 is an unrelated number in the feed text. Trust label: Two-source agreement — two outlets agree on the compute shortage and the seven-day limit.\nStill uncertain\nIt is not clear how long the limits will last, whether they apply to all users or only some, or what DeepSeek plans to do about its capacity. The feed items do not say whether the company has commented beyond the in-service notice. Check the full reports before quoting the limits as settled policy."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-01-deepseek\",\"category\":\"semiconductor\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-semiconductor-01-deepseek.jpg\",\"imageAlt\":{\"en\":\"Cover related to: DeepSeek 自承算力不足，近日設定多種限制引議\",\"zh-TW\":\"相關封面圖：DeepSeek 自承算力不足，近日設定多種限制引議\"},\"publishedAt\":\"2026-11-16T07:40:53.000Z\",\"title\":{\"en\":\"DeepSeek Admits Compute Shortage, Limits Long Chats and Caps Inputs at 40,000 Characters\"
