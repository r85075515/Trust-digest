fort, will still attend, according to Liberty Times.\nWhat happened\nThe first televised debate in the 2026 Taipei mayoral election is co-hosted by TVBS and Sanlih Television and runs from noon to 2 p.m. on October 31. CNA reports four stages: policy statements, cross-examination, media questions, and conclusions, with a follow-up mechanism added to cross-examination. Liberty Times reports that Chiang cancelled public engagements because he felt unwell but will attend as scheduled. The Liberty Times material breaks off before completing a point about Nvidia’s site in the Beitou-Shilin technology park, so that point cannot be relied on here.\nWhy it matters\nA first debate with follow-up questions is a real test, not a set of rehearsed speeches: each candidate must defend an answer on the spot, and voters can compare command of city issues side by side. Chiang’s attendance removes any excuse for absence; Shen gets his clearest chance to look like a credible challenger.\nSources agree / disagree\nCNA and Liberty Times agree on the noon start, the co-hosts, the four-stage format, and the first head-to-head framing. The automated comparison flagged 4 versus 12: CNA gives 4 stages, while 12 in the Liberty Times headline is the 12:00 start time, not a competing stage count, so the two numbers describe different things. Trust label: Two-source agreement — two outlets agree on the debate time, format, and first-encounter framing.\nStill uncertain\nThe debate had not yet taken place in the material supplied, so its outcome, exchanges, and any polling effect are unknown. Chiang’s discomfort and the incomplete Nvidia point are also unconfirmed."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-02-12-00\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-taiwan-02-12-00.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 台北市長選戰首場辯論12:00登場  蔣萬安、沈伯洋正面攻防\",\"zh-TW\":\"相關封面圖：（譯文待補）台北市長選戰首場辯論12:00登場 蔣萬安、沈伯洋正面攻防\"},\"publishedAt\":\"2026-10-31T01:19:40.000Z\",\"title\":{\"en\":\"Chiang Wan-an and Shen Poyang Face Off in Taipei Mayoral Debate at Noon\",\"zh-TW\":\"蔣萬安（Chiang Wan-an）、沈伯洋（Shen Poyang）台北市長首場辯論中午登場\"},\"summary\":{\"en\":\"Taipei mayoral candidates Chiang Wan-an and Shen Poyang hold their first televised debate on October 31, from noon to 2 p.m., co-hosted by TVBS and Sanlih Television. The four-stage format adds follow-up questions to cross-examination, and Chiang will attend despite cancelling engagements over discomfort.\",\"zh-TW\":\"台北市長候選人蔣萬安與沈伯洋10月31日中午參加首場電視辯論，由TVBS與三立電視主辦，分四階段，交叉詰問加入追問機制。蔣萬安因身體不適取消公開行程，仍會如期出席。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"台北市長候選人蔣萬安（Chiang Wan-an）與沈伯洋（Shen Poyang）10月31日中午12時至下午2時參加首場電視辯論，辯論分四個階段，交叉詰問加入追問機制。自由時報（Liberty Times）報導，蔣萬安因身體不適取消公開行程，但仍會如期參加。\\n發生了什麼事\\n2026年台北市長選舉首場電視辯論會10月31日中午12時至下午2時登場，由TVBS與三立電視聯合主辦。中央社報導，辯論分四個階段：政見申論、交叉詰問、媒體提問、結論，交叉詰問加入追問機制。這是現任市長蔣萬安與沈伯洋首次正面交手。自由時報報導，蔣萬安因身體不適取消公開行程，但會如期參加。自由時報的素材在談到輝達（Nvidia）落腳北士科的段落中途截斷，該段內容本卡無法採用。\\n為什麼重要\\n首場辯論加上追問機制，是真考驗，不是各自念稿：候選人必須當場為自己的回答辯護，選民也能在同一個場子比較兩人對市政的掌握。蔣萬安抱病出席，等於排除了缺席的藉口，也拉高了表現的標準；沈伯洋則得到至今最清楚的機會，在同一個房間裡證明自己是夠格的挑戰者。\\n來源異同\\n中央社與自由時報都同意中午登場、主辦單位、四階段形式與首次交手的定位。自動比對標示4與12兩個數字：中央社說的是4個階段，自由時報標題的12是12時開場，不是另一種階段數，兩個數字說的是不同事情。信任標籤：兩源一致——兩家媒體對辯論時間、形式與首次交手的報導一致。\\n仍不確定\\n素材提供時辯論尚未登場，辯論結果、交鋒內容與民調影響都未知。蔣萬安身體不適的具體情形，以及自由時報素材中未寫完的輝達段落，也都未獲證實；辯論交鋒與健康狀況更新，請查閱完整報導。\"},\"sources\":[{\"name\":\"中央社-政治\",\"url\":\"https://www.cna.com.tw/news/aipl/202610310020.aspx\"},{\"name\":\"自由時報\",\"url\":\"https://news.ltn.com.tw/news/politics/breakingnews/5624536\"}],\"disagreements\":{\"en\":\"Figures differ across outlets (e.g. 4 vs 12 in headlines/snippets).\",\"zh-TW\":\"（譯文待補）Figures differ across outlets (e.g. 4 vs 12 in headlines/snippets).\"},\"trustScore\":58,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":21,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"中央社-政治\",\"自由時報\"],\"glossary\":[{\"blu
