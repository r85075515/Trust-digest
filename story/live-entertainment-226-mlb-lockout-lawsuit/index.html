reement. The filing seeks a declaratory judgment that a lockout would be lawful and cannot be barred by federal court injunction, and notes plans to file an unfair labor practice charge.\n\n「Why it matters」Talks over economic terms, including salary cap and floor structures and competitive balance, remain deadlocked. A lockout after December 1 would disrupt offseason transactions and potentially threaten upcoming league operations if no new agreement is reached.\n\n「Source differences」Both reports cover MLB's preemptive court filing ahead of a possible lockout and disputes over salary cap proposals and bargaining conduct. 來源標題：「Major League Baseball sues players' union ahead of lockout, trying to block possible antitrust suit」；來源標題：「MLB sues players’ association in order to ensure lockout is declared legal」。\n\n「Still uncertain」Federal judges have not ruled on the declaratory judgment request, and whether MLB and the union will reach a new collective bargaining agreement before the deadline remains unresolved.\n\nTrust label: Multi-source agreement — Independent sports and news outlets report the lawsuit filing and its labor dispute context."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-entertainment-226-mlb-lockout-lawsuit\",\"category\":\"entertainment\",\"title\":{\"en\":\"Major League Baseball Sues Players Union Ahead of Potential Lockout\",\"zh-TW\":\"美國職棒大聯盟在勞資協議到期前控告球員工會，防範封館反壟斷訴訟\"},\"summary\":{\"en\":\"Major League Baseball filed a declaratory judgment lawsuit against the MLB Players Association ahead of the December 1 collective bargaining deadline. Key takeaway: MLB seeks upfront legal confirmation that a potential lockout is lawful under labor law.\",\"zh-TW\":\"美國職棒大聯盟在 12 月 1 日集體談判協議到期前，向大聯盟球員工會提起確認之訴。關鍵結論：球團試圖提前確立封館的合法性，降低面臨反壟斷訴訟與禁制令的風險。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」美國職棒大聯盟在現行集體談判協議於 2026 年 12 月 1 日到期前，向大聯盟球員工會提起訴訟。訴狀請求法院作出確認判決，認定潛在封館合法且不受聯邦法院禁制令限制，並指出聯盟打算提出不當勞動行為申訴。\\n\\n「為什麼重要」雙方在薪資上限與下
