s Sridhar Natarajan covered the streak in a video segment, and Cotality chief economist Selma Hepp discussed home sales and the outlook for rates and refinancing in a Bloomberg interview.\nWhat happened\nThe seven-week climb is the longest in three years, and it lands on a housing market that was already soft. At 7.4% for the average 30-year fixed mortgage, borrowing costs keep grinding higher for Americans struggling to afford a home. Hepp addressed home sales trends and where rates and refinancing go from here.\nWhy it matters\nThe judgment is affordability math: at 7.4%, the monthly payment prices out marginal buyers while existing owners stay locked into cheaper loans — so listings stay thin and transactions freeze. Until rates or prices give, the market stays stuck.\nSources agree / disagree\nBloomberg and NYT Economy report the same streak and the same 7.4% figure with no conflicting details. Trust label: Multi-source agreement — two outlets aligned, including Hepp's on-the-record Bloomberg interview on the outlook.\nStill uncertain\nWhether the streak extends to an eighth week and how sales volumes respond aren't in the snippets. Verify the latest weekly rate data before quoting a new figure."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-01-highest-mortgage-rates-i\",\"category\":\"finance\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-finance-01-highest-mortgage-rates-i.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Highest Mortgage Rates in 3 Years Chills the Housing Market\",\"zh-TW\":\"相關封面圖：三年來最高的抵押貸款利率令房地產市場降溫\"},\"publishedAt\":\"2026-10-12T15:14:25.000Z\",\"title\":{\"en\":\"US Mortgage Rates Rise Seven Straight Weeks to 7.4%, a Three-Year High\",\"zh-TW\":\"美國房貸利率連七週上漲，30年期達7.4%創三年新高\"},\"summary\":{\"en\":\"US mortgage rates have risen for seven straight weeks — the first such streak in three years — pushing the average 30-year fixed rate to 7.4% and squeezing an already weak housing market, Bloomberg and the NYT report. Cotality chief economist Selma Hepp discussed the outlook in a Bloomberg interview. Next watch is whether buyers keep waiting on the sidelines.\",\"zh-TW\":\"美國房貸利率連續七週上漲——三年來首次——30年期固定利率均值升至7.4%，本已疲軟的房市壓力更大。Cotality 首席經濟學家赫普（Selma Hepp）在彭博訪問中談了後市展望；接下來看買家是否繼續觀望。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"美國房貸利率三年來首次連續七週上漲，給本已疲軟的房市再添壓力；30年期固定利率均值升至7.4%。彭博的納塔拉詹（Sridhar Natarajan）以影音報導了這波連漲，Cotality 首席經濟學家赫普（Selma Hepp）在彭博訪問中談了房屋銷售與利率、轉貸展望。\\n發生了什麼事\\n這波七連漲是三年來最長，落在一個本來就疲軟的房市。30年期固定利率均值7.4%，讓買房本就吃力的人借貸成本繼續墊高。赫普談了銷售趨勢，以及利率與轉貸接下來怎麼走。\\n為什麼重要\\n這是負擔能力的數學：7.4% 的月付金直接把邊際買家擠出市場，舊屋主則死守低利率不賣——掛牌稀少、成交凍結。利率或房價不讓步，市場就繼續卡住。\\n來源異同\\n彭博與紐時經濟版報導的連漲週數與7.4%數字一致，沒有矛盾。信任標籤：N源一致——兩家媒體一致，包含赫普在彭博訪問中對後市的具名發言。\\n仍不確定\\n會不會連漲第八週、成交量如何反應，來源摘要都沒說。引用最新數字前請查當週利率數據。\"},\"sources\":[{\"name\":\"Bloomberg\",\"url\":\"https://www.bloomberg.com/news/videos/2026-10-12/us-mortgage-rates-rise-for-seven-straight-weeks-video\"},{\"name\":\"NYT Economy\",\"url\":\"https://www.nytimes.com/2026/10/08/business/mortgage-rates-housing-prices.html\"}],\"disagreements\":null,\"trustScore\":75,\"trustBreakdown\":{\"sourceDiversity\":13,\"outletReputation\":23,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"finance\",\"live-ingest\",\"bloomberg\",\"nyt-economy\"],\"glossary\":[{\"term\":{\"en\":\"Selma Hepp\",\"zh-TW\":\"赫普\"},\"blurb\":{\"en\":\"Chief economist at Cotality who discussed the rate outlook in a Bloomberg interview.\",\"zh-TW\":\"在彭博訪問中談論利率展望的 Cotality 首席經濟學家。\"}},{\"term\":{\"en\":\"Cotality\",\"zh-TW\":\"Cotality\"},\"blurb\":{\"en\":\"Housing data firm whose chief economist commented on the market.\",\"zh-TW\":\"其首席經濟學家評論房市的住房數據公司。\"}},{\"term\":{\"en\":\"Bloomberg\",\"zh-TW\":\"彭博\"},\"blurb\":{\"en\":\"Financial news outlet that reported the rate streak.\",\"zh-TW\":\"報導這波利率連漲的財經新聞媒體。\"}},{\"term\":{\"en\":\"The New York Times\",\"zh-TW\":\"紐約時報\"},\"blurb\":{\"en\":\"US newspaper whose economy desk covered the housing
