h-bandwidth memory capacity for artificial intelligence and GPU-accelerated data centers. According to Kioxia and hardware reporting, the drives deliver more than 18 million random-read IOPS at a 512-byte block size—nearly double the prior CM10 series—alongside expected sequential read throughput of up to 28 GB/s, 50 DWPD endurance, and direct liquid cooling support.\n\nAs large-scale AI models outgrow onboard GPU HBM capacity, ultra-low-latency storage-class memory offers data center operators a lower-cost tier to feed GPU clusters without severe throughput bottlenecks.\n\nKioxia's official press release and Tom's Hardware both report the 18-million-IOPS random read rating, 28 GB/s PCIe 6.0 x4 sequential read target, and 3-microsecond read latency of third-generation XL-FLASH. Tom's Hardware adds that standalone third-gen XL-FLASH samples arrive in March 2027 with 70% higher density, whereas Kioxia's release notes GP2 SSD evaluation samples will ship to select customers in late 2027.\n\nFinal commercial pricing, capacity configurations, and which hyperscalers or GPU vendors will adopt GP2 drives for production AI clusters have not yet been disclosed.\n\nTrust label: Multi-source agreement — Kioxia's official announcement and Tom's Hardware confirm the GP2 specifications and sampling timeline."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-056-kioxia-gp2-xl-flash-ssd\",\"category\":\"semiconductor\",\"title\":{\"en\":\"Kioxia Unveils GP2 PCIe 6.0 SSDs Using 3rd-Gen XL-Flash to Expand AI GPU Memory\",\"zh-TW\":\"鎧俠發表搭載第三代 XL-FLASH 的 GP2 系列 PCIe 6.0 固態硬碟 鎖定 AI GPU 記憶體擴充\"},\"summary\":{\"en\":\"Kioxia announced its GP2 Series PCIe 6.0 NVMe SSDs on November 26, 2026, built on third-generation XL-FLASH memory to expand effective GPU memory capacity for AI workloads. The drives target over 18 million random-read IOPS and up to 28 GB/s sequential read throughput, with third-gen XL-FLASH samples slated for March 2027 ahead of late-2027 GP2 sampling.\",\"zh-TW\":\"鎧俠（Kioxia）於 2026 年 11 月 26 日發表採用第三代 XL-FLASH 低延遲快閃記憶體的 GP2 系列 PCIe 6.0 NVMe 固態硬碟，專為擴充 AI 伺服器 GPU 有效記憶體容量設計。該系列隨機讀取效能突破 1,800 萬 IOPS、循序讀取最高達 28 GB/s，評估樣品預計於 2027 年底提供指定客戶。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n日本記憶體大廠鎧俠（Kioxia）於 2026 年 11 月 26 日正式發表 KIOXIA GP2 系列 PCIe 6.0 NVMe 固態硬碟，搭載第三代 XL-FLASH 低延遲快閃記憶體，鎖定 AI 與高效能運算環境的 GPU 記憶體擴充需求。該系列在 512 位元組區塊大小下可提供超過 1,800 萬次隨機讀取 IOPS（約為前代 CM10 系列的兩倍），預期循序讀取吞吐量最高達 28 GB/s，並支援直接液冷與高達 50 DWPD 的耐用度。\\n「為什麼重要」\\n隨著大型 AI 模型推論與訓練對記憶體頻寬與容量的需求急遽攀升，單靠晶片端高頻寬記憶體（HBM）成本高昂且容量受限；具備 3 微秒等級超低讀取延遲的儲存級記憶體，可為 AI 資料中心提供更具性價比的 GPU 記憶體延伸層級。\\n「來源異同」\\n鎧俠官方新聞稿與科技媒體《Tom's Hardware》對 GP2 系列超過 1,800 萬 IOPS 隨機讀取、28 GB/s 循序讀取效能及第三代 XL-FLASH 3 微秒讀取延遲的規格報導完全一致。《Tom's Hardware》補充第三代 XL-FLASH 晶片密度提升 70% 並將於 2027 年 3 月率先送樣；鎧俠新聞稿則明確指出 GP2 固態硬碟評估樣品將於 2027 年底提供予指定客戶。\\n「仍不確定」\\nGP2 系列固態硬碟的具體容量規格、量產定價策略，以及首波導入該架構的雲端服務商與 GPU 伺服器夥伴名單，目前尚未對外公開。\"},\"glossary\":[{\"term\":{\"en\":\"XL-FLASH\",\"zh-TW\":\"XL-FLASH 儲存級記憶體\"},\"blurb\":{\"en\":\"Kioxia's ultra-low-latency SLC flash memory technology designed to bridge the speed gap between DRAM and standard NAND SSDs.\",\"zh-TW\":\"鎧俠開發的超低延遲單層單元快閃記憶體技術，用於填補 DRAM 與傳統 NAND 固態硬碟之間的速度落差。\"}},{\"term\":{\"en\":\"IOPS\",\"zh-TW\":\"每秒輸入輸出操作次數\"},\"blurb\":{\"en\":\"Input/Output Operations Per Second, a standard benchmark measuring how many read or write requests a storage device processes per second.\",\"zh-TW\":\"衡量儲存裝置每秒可處理讀取或寫入指令次數的核心效能指標。\"}},{\"term\":{\"en\":\"DWPD\",\"zh-TW\":\"每日全盤寫入次數\"},\"blurb\":{\"en\":\"Drive Writes Per Day, indicating how many times a drive's full capacity can be overwritten daily throughout its warranty period.\",\"zh-TW\":\"衡量企業級固態硬碟耐用度的指標，代表在保固期內每天可將硬碟完整寫入資料的次數。\"}}],\"sources\":[{\"name\":\"Kioxia Corporation\",\"url\":\"https://www.kioxia.com/en-jp/business/news/2026/20261126-2.html\"},{\"name\":\"Tom's Hardware\",\"url\":\"https://www.tomshardware.com/pc-components/ssds/kioxias-3rd-gen-xl-flash-hits-optane-class-3-microsecond-read-latency-with-70-percent-higher-density-samples-march-2027-ahead-of-18-million-iops-gp2-ssds\"},{\"name\":\"中央社訊息平台\",\"url\":\"https://www.cna.com.tw/postwrite/chi/451459\"}],\"imageUrl\":\"/covers/live/live-semiconductor-056-kioxia-gp2-xl-flash-ssd.png\",\"imageAlt\":{\"en\":\"Enterprise PCIe 6.0 NVMe solid-state drive hardware designed for AI data center servers\",\"zh-TW\":\"專為 AI 資料中心伺服器設計的企業級 PCIe 6.0 NVMe 固態硬碟硬體\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":87,\"trustBreakdown\":{\"crossCorroboration\":22,\"outletReputation\":22,\"recencyClarity\":22,\"sourceDiversity\":21},\"publishedAt\":\"2026-11-27T14:28:54.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":5,\"D2\":4,\"D3\":4,\"D4\":4,\"D5\":4,\"total\":21},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-semiconductor-056-kioxia-gp2-xl-flash-ssd/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-semiconductor-056-kioxia-gp2-xl-flash-ssd/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified
