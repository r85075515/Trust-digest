sting Robert Pattinson as 007.\nWhat happened\nBezos told the conference he was originally \"biased against\" Pattinson \"because he's already so famous.\" Pattinson's recent work with director Denis Villeneuve, who is making the franchise's next film for Amazon, helped make the case for him. The BBC and The Verge both reported Bezos's remarks from the conference, where he described his role in the final decision.\nWhy it matters\nA studio owner's public claim of hands-on casting says plenty about how Amazon runs the Bond franchise it now controls: creative calls reach the founder's desk. Pattinson's fame, first counted against him, ended up beside the point. Watch for Amazon's formal announcement and the first footage from Villeneuve's film.\nSources agree / disagree\nBBC Business and The Verge agree on the substance of Bezos's remarks, including the \"heavily involved\" quote and his initial bias against Pattinson. Neither outlet disputes the other on the casting outcome.\nStill uncertain\nThe feed material gives no date for the announcement or the film's release, and no other Amazon executive has publicly confirmed how the final decision was made. The full conference remarks may carry more context than the quoted lines.\nTrust label: Multi-source agreement — BBC Business and The Verge agree on Bezos's account of his role in casting Pattinson."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-02-jeff-bezos-says-he-was-h\",\"category\":\"finance\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-finance-02-jeff-bezos-says-he-was-h.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Jeff Bezos says he was 'heavily involved' in casting Robert Pattinson as new 007\",\"zh-TW\":\"相關封面圖：傑夫貝佐斯表示，他「大力參與」了羅伯派汀森飾演新 007 的工作\"},\"publishedAt\":\"2026-11-18T04:00:54.000Z\",\"title\":{\"en\":\"Jeff Bezos Says He Was 'Heavily Involved' in Casting Robert Pattinson as James Bond\",\"zh-TW\":\"傑夫·貝佐斯（Jeff Bezos）自稱大力參與選角羅伯·派汀森（Robert Pattinson）出任新任 007\"},\"summary\":{\"en\":\"Amazon founder Jeff Bezos said at Semafor's Silicon Valley and the World conference that he was 'heavily involved' in casting Robert Pattinson as the new James Bond, adding he was originally 'biased against' Pattinson 'because he's already so famous.' Pattinson's recent work with director Denis Villeneuve helped make the case. Watch for Amazon's announcement and footage from the new film.\",\"zh-TW\":\"亞馬遜創辦人傑夫·貝佐斯（Jeff Bezos）在 Semafor「矽谷與世界」會議上表示，他「大力參與」選角羅伯·派汀森（Robert Pattinson）出任新任 007（James Bond），還坦言起初對派汀森有偏見，「因為他已經太有名了」。派汀森與導演丹尼斯·維勒納夫（Denis Villeneuve）的近期合作是關鍵。接下來看亞馬遜正式公布與新片首支畫面。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"亞馬遜創辦人傑夫·貝佐斯（Jeff Bezos）表示，他在選出下一任詹姆斯·龐德（James Bond）上扮演了決定性角色。他在 Semafor「矽谷與世界」會議上說，自己「大力參與」了羅伯·派汀森（Robert Pattinson）出任 007 的選角。\\n發生了什麼事\\n貝佐斯在會上表示，他起初對派汀森有偏見，「因為他已經太有名了」。派汀森最近與導演丹尼斯·維勒納夫（Denis Villeneuve）的合作幫他加了分，維勒納夫正為亞馬遜執導系列下一部電影。英國廣播公司（BBC）與 The Verge 都報導了貝佐斯在會上的發言，他在會中談到自己在最終決定中的角色。\\n為什麼重要\\n片廠老闆公開宣稱親自參與選角，說明亞馬遜如何經營它如今掌控的龐德系列：創意決策一路送到創辦人桌上。派汀森的名氣起初被視為扣分項，最後根本無關緊要。接下來看亞馬遜正式公布與維勒納夫新片的首支畫面。\\n來源異同\\nBBC 商業版與 The Verge 對貝佐斯發言內容的說法一致，包括「大力參與」的引言與他起初對派汀森的偏見。兩家對選角結果也沒有分歧。\\n仍不確定\\n來源資料未提供公布日期或電影上映時間，也沒有其他亞馬遜高層公開證實最終決定如何做出。會議發言全文可能比引用的片段有更多脈絡。\"},\"sources\":[{\"name\":\"BBC Business\",\"url\":\"https://www.bbc.co.uk/news/articles/cm5y1eejk292o?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"The Verge\",\"url\":\"https://www.theverge.com/entertainment/1036110/jeff-bezos-james-bond-casting-amazon\"}],\"disagreements\":null,\"trustScore\":68,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":15,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"finance\",\"live-ingest\",\"bbc-business\",\"the-verge\"],\"glossary\":[{\"blurb\":{\"en\":\"Founder of Amazon, who says he was heavily involved in casting the new James Bond.\",\"zh-TW\":\"亞馬遜創辦人，自稱大力參與新任龐德選角。\"},\"term\":{\"en\":\"Jeff Bezos\",\"zh-TW\":\"傑夫·貝佐斯（Jeff Bezos）\"}},{\"blurb\":{\"en\":\"British
