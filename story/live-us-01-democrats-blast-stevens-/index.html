 Senate nominee just months earlier. Its headline quoted critics calling the move 'petty, selfish, unhinged' and a 'betrayal.'\nWhy it matters\nThe fury measures how seriously Democrats take the seat — and the risk that a public feud, days before voting, helps the very candidate Stevens endorsed.\nSources agree / disagree\nThe Hill and Axios agree on the endorsement, the anger and its sources, including her own staff; neither reports a defense from Stevens in the snippets. Trust label: Two-source agreement — two outlets agree on the core claims.\nStill uncertain\nStevens' full reasoning, any staff resignations, and the effect on Tuesday's vote are not established by the snippets."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-us-01-democrats-blast-stevens-\",\"category\":\"us\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-us-01-democrats-blast-stevens-.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Democrats blast Stevens over Michigan 'betrayal'\",\"zh-TW\":\"相關封面圖：民主黨人抨擊史蒂文斯密西根州的“背叛”\"},\"publishedAt\":\"2026-11-02T02:42:11.000Z\",\"title\":{\"en\":\"Democrats Blast Haley Stevens Over Michigan 'Betrayal' After She Endorses Republican Mike Rogers\",\"zh-TW\":\"民主黨人齊轟史蒂文斯（Haley Stevens）密西根「背叛」，因她背書共和黨羅傑斯（Mike Rogers）\"},\"summary\":{\"en\":\"Rep. Haley Stevens's last-minute decision to endorse former Rep. Mike Rogers, the Republican, over Democrat Abdul El-Sayed in Michigan's Senate race has outraged Democrats, drawn fierce backlash from party officials and her own staffers, and given Republicans welcome headlines and hope of flipping the battleground seat, The Hill and Axios reported.\",\"zh-TW\":\"國會山報（The Hill）與 Axios 報導，眾議員史蒂文斯（Haley Stevens）最後一刻決定背書共和黨前眾議員羅傑斯（Mike Rogers）、而非民主黨艾爾賽義德（Abdul El-Sayed），角逐密西根參議員，引發民主黨人憤怒、黨內官員與她自己幕僚的強烈反彈，也給共和黨帶來歡迎的頭條與翻轉此戰場席次的希望。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"民主黨內的反彈，是這則背書 companion 報導的主軸。\\n發生了什麼事\\n國會山報（The Hill）報導，眾議員史蒂文斯（Haley Stevens）最後一刻決定在密西根參議員選戰背書前眾議員羅傑斯（Mike Rogers）、而非民主黨艾爾賽義德（Abdul El-Sayed），引發民主黨人憤怒，同時給共和黨帶來歡迎的頭條與翻轉此戰場席次的一線希望。Axios 報導，史蒂文斯週日背書共和黨人後，遭同黨民主黨人、黨內官員與她自己幕僚的強烈反彈，並稱這對幾個月前差幾個百分點就成為黨內參議員提名人的政治人物而言是驚人逆轉。其標題引述批評者稱此舉「小氣、自私、失控」與「背叛」。\\n為什麼重要\\n這股怒火顯示民主黨多看重此席次——以及公開內鬨在投票前數日反而幫助她所背書候選人的風險。\\n來源異同\\n國會山報（The Hill）與 Axios 對背書、怒火與其來源（包括她自己的幕僚）一致；摘要中皆未見史蒂文斯的辯護。信任標籤：雙源一致——兩家媒體對核心主張一致。\\n仍不確定\\n史蒂文斯的完整理由、是否有幕僚辭職、對週二投票的影響，皆未由摘要確立。\"},\"sources\":[{\"name\":\"The Hill\",\"url\":\"https://thehill.com/homenews/campaign/6187640-democrats-blast-stevens-rogers-endorsement-michigan/\"},{\"name\":\"Axios\",\"url\":\"https://www.axios.com/2026/11/01/haley-stevens-democrats-reaction-rogers-el-sayed\"}],\"disagreements\":null,\"trustScore\":62,\"trustBreakdown\":{\"sourceDiversity\":13,\"outletReputation\":10,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"us\",\"live-ingest\",\"the-hill\",\"axios\"],\"glossary\":[{\"term\":{\"en\":\"Haley Stevens\",\"zh-TW\":\"史蒂文斯\"},\"blurb\":{\"en\":\"Democratic representative whose endorsement triggered the backlash.\",\"zh-TW\":\"民主黨眾議員，其背書引發反彈。\"}},{\"term\":{\"en\":\"Mike Rogers\",\"zh-TW\":\"羅傑斯\"},\"blurb\":{\"en\":\"Republican former representative endorsed by Stevens for Senate.\",\"zh-TW\":\"共和黨前眾議員，獲史蒂文斯背書角逐參議員。\"}},{\"term\":{\"en\":\"Abdul El-Sayed\",\"zh-TW\":\"艾爾賽義德\"},\"blurb\":{\"en\":\"Democratic Senate candidate in Michigan whom Stevens declined to back.\",\"zh-TW\":\"密西根民主黨參議員候選人，史蒂文斯未予支持。\"}},{\"term\":{\"en\":\"The Hill\",\"zh-TW\":\"國會山報\"},\"blurb\":{\"en\":\"US political newspaper that reported the Democratic anger.\",\"zh-TW\":\"美國政治報紙，報導民主黨怒火。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"descriptio
