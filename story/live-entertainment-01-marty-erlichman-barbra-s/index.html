st and then stays with her for over sixty years is a rarity in the modern entertainment business; his death closes a working partnership that spanned virtually the whole of Streisand's long stardom, from the early 1960s onward.\nSources agree / disagree\nThis is currently a single-outlet item from Billboard drawing on the family's or representatives' press release, with no second outlet in the feed. Trust label: Single source — one outlet reporting the announcement so far.\nStill uncertain\nFuneral or memorial arrangements, family statements beyond the release, and any succession for Streisand's management are not in the snippet."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-entertainment-01-marty-erlichman-barbra-s\",\"category\":\"entertainment\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-entertainment-01-marty-erlichman-barbra-s.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Marty Erlichman, Barbra Streisand’s Longtime Manager, Dies at 97\",\"zh-TW\":\"相關封面圖：（譯文待補）Marty Erlichman, Barbra Streisand’s Longtime Manager, Dies at 97\"},\"publishedAt\":\"2026-11-02T01:12:50.000Z\",\"title\":{\"en\":\"Marty Erlichman, Barbra Streisand's Manager for More Than Six Decades, Dies at 97\",\"zh-TW\":\"史翠珊（Barbra Streisand）經紀人 Erlichman 辭世，享年 97 歲，合作逾六十年\"},\"summary\":{\"en\":\"Martin Lee 'Marty' Erlichman, Barbra Streisand's manager for more than six decades, died on October 31 at 97 of age-related causes, a press release issued Sunday states; he is credited with discovering Streisand and helping shape and guide her career since the early 1960s, Billboard reported.\",\"zh-TW\":\"Billboard 報導，史翠珊（Barbra Streisand）的經紀人 Martin Lee「Marty」Erlichman 於 10 月 31 日辭世，享年 97 歲，週日發布的新聞稿稱死因為年齡相關因素；他被認為發掘了史翠珊，自 1960 年代初起協助塑造與引導其事業，合作逾六十年。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"流行音樂界最長久的經紀人—藝人夥伴關係之一落幕。\\n發生了什麼事\\nBillboard 報導，史翠珊（Barbra Streisand）的經紀人 Martin Lee「Marty」Erlichman 於 10 月 31 日辭世，享年 97 歲，
