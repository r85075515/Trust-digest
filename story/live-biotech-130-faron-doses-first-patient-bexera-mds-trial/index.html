een dosed in its global Phase 2b BEXERA clinical trial. The patient received treatment at King's College Hospital in London, UK. The study evaluates Faron's wholly owned investigational immunotherapy bexmarilimab in combination with azacitidine for patients with previously untreated high-risk myelodysplastic syndromes (HR-MDS).\n\nWhy it matters\nHigh-risk myelodysplastic syndromes are aggressive bone marrow disorders with limited frontline treatment options and a high risk of progression to acute myeloid leukemia. Bexmarilimab is designed to reprogram immunosuppressive macrophages in the tumor microenvironment, potentially enhancing response rates when paired with standard hypomethylating therapy.\n\nSource comparison\nBioSpace, OncoDaily, and BioStock all reported Faron's November 26 announcement of first-patient dosing in the Phase 2b BEXERA study. All three outlets aligned on the trial name, target indication of treatment-naive HR-MDS, and the dosing milestone, with OncoDaily specifically noting the treatment site at King's College Hospital in London.\n\nWhat remains uncertain\nInterim efficacy readout timelines, patient enrollment completion dates across global trial sites, and eventual Phase 3 registrational requirements remain subject to clinical recruitment pace.\n\nTrust label: Multi-source agreement — Corroborated by BioSpace, OncoDaily, and BioStock coverage of Faron Pharmaceuticals' clinical trial announcement."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-biotech-130-faron-doses-first-patient-bexera-mds-trial\",\"category\":\"biotech\",\"title\":{\"en\":\"Faron Pharmaceuticals Doses First Patient in Phase 2b BEXERA Trial for High-Risk MDS\",\"zh-TW\":\"芬蘭生技廠 Faron 啟動高風險骨髓增生不良症候群 2b 期臨床 首名患者於倫敦完成給藥\"},\"summary\":{\"en\":\"Faron Pharmaceuticals announced that the first patient was dosed at King's College Hospital in London in its global Phase 2b BEXERA trial evaluating bexmarilimab plus azacitidine for treatment-naive high-risk myelodysplastic syndromes. One-sentence takeaway: Advancing macrophage-targeting immunotherapy into frontline Phase 2b testing offers a potential new option for high-risk blood cancer patients.\",\"zh-TW\":\"芬蘭生技公司 Faron Pharmaceuticals 宣布其 2b 期臨床試驗「BEXERA」已於倫敦國王學院醫院完成首名患者給藥，評估 bexmarilimab 合併 azacitidine 用於初治高風險骨髓增生不良症候群（HR-MDS）的療效。一句重點結論：靶向巨噬細胞的新型免疫療法正式推進至一線 2b 期臨床，為高風險血癌患者帶來新治療契機。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n芬蘭生技公司 Faron Pharmaceuticals 於 2026 年 11 月 26 日宣布，旗下全球 2b 期臨床試驗「BEXERA」已在英國倫敦國王學院醫院（King's College Hospital）完成首名受試者給藥。該試驗針對先前未接受過治療的高風險骨髓增生不良症候群（HR-MDS）患者，評估研究性免疫療法藥物 bexmarilimab 合併標準療法 azacitidine 的臨床表現。\\n\\n「為什麼重要」\\n高風險骨髓增生不良症候群是一種惡性程度高的骨髓造血疾病，現有一線治療選擇有限且極易惡化為急性骨髓性白血病。Bexmarilimab 旨在重新編程腫瘤微環境中抑制免疫反應的巨噬細胞，期望透過與去甲基化藥物併用提升患者緩解率。\\n\\n「來源異同」\\n生技專業媒體 BioSpace、腫瘤醫學新聞 OncoDaily 與北歐生技媒體 BioStock 均報導 Faron 於 26 日公布的首例給藥里程碑，三方在試驗名稱 BEXERA、2b 期階段與初治高風險 MDS 適應症等資訊完全一致；OncoDaily 進一步載明首例給藥醫院為倫敦國王學院醫院。\\n\\n「仍不確定」\\n全球多中心受試者招募完成時程、期中療效數據公布時間點，以及後續三期樞紐試驗設計規格，仍須視臨床收案進度與監管機構意見而定。\"},\"glossary\":[{\"term\":{\"en\":\"High-Risk Myelodysplastic Syndromes (HR-MDS)\",\"zh-TW\":\"高風險骨髓增生不良症候群（HR-MDS）\"},\"blurb\":{\"en\":\"A group of serious bone marrow cancers characterized by ineffective blood cell production and a high likelihood of transforming into acute myeloid leukemia.\",\"zh-TW\":\"一類嚴重的骨髓造血幹細胞惡性疾病，特徵為血球生成異常並具有高度轉化為急性骨髓性白血病的風險。\"}},{\"term\":{\"en\":\"Bexmarilimab\",\"zh-TW\":\"Bexmarilimab 免疫療法\"},\"blurb\":{\"en\":\"An investigational monoclonal antibody targeting Clever-1 on macrophages to reverse immune suppression in bone marrow and solid tumors.\",\"zh-TW\":\"一種靶向巨噬細胞表面 Clever-1 受體的研究性單株抗體，旨在解除骨髓微環境中的免疫抑制並活化抗癌免疫反應。\"}},{\"term\":{\"en\":\"Azacitidine\",\"zh-TW\":\"阿扎胞苷（Azacitidine）\"},\"blurb\":{\"en\":\"A standard-of-care hypomethylating chemotherapy agent used to treat myelodysplastic syndromes by restoring normal gene expression in bone marrow cells.\",\"zh-TW\":\"治療骨髓增生不良症候群的標準去甲基化藥物，透過調節異常 DNA 甲基化來恢復骨髓細胞正常分化功能。\"}}],\"sources\":[{\"name\":\"BioSpace\",\"url\":\"https://www.biospace.com/press-releases/faron-announces-first-patient-dosed-in-phase-2b-bexera-trial-of-bexmarilimab-in-treatment-naive-hr-mds\"},{\"name\":\"OncoDaily\",\"url\":\"https://oncodaily.com/hematology/bexmarilimab-641320\"},{\"name\":\"BioStock\",\"url\":\"https://biostock.se/en/2026/11/nyhetssvepet-2026-11-26/\"}],\"imageUrl\":\"/covers/live/live-biotech-130-faron-doses-first-patient-bexera-mds-trial.png\",\"imageAlt\":{\"en\":\"Clinical research laboratory symbolizing Phase 2b immunotherapy trial for blood cancer\",\"zh-TW\":\"臨床醫學實驗室象徵血癌免疫療法 2b 期試驗啟動\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":86,\"trustBreakdown\":{\"crossCorroboration\":22,\"outletReputation\":22,\"recencyClarity\":22,\"sourceDiversity\":20},\"publishedAt\":\"2026-11-27T16:26:49.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":5,\"D2\":4,\"D3\":4,\"D4\":4,\"D5\":4,\"total\":21},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-biotech-130-faron-doses-first-patient-bexera-mds-trial/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-biotec
