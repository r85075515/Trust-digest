. The warning landed alongside a BBC report that leaked Russian data show the full-scale invasion has fundamentally changed mortality patterns in Russia, with almost 500,000 people lost.\nWhat happened\nMerz warned that Moscow’s ambitions extend beyond Ukraine and pledged to keep military aid flowing to Kyiv, according to Bloomberg News. Separately, the BBC reported that Russia’s own figures show it has lost almost 500,000 people in the Ukraine war, based on leaked data revealing how the full-scale invasion has changed mortality patterns in Russia. The two reports cover the same war from different angles: one is a political warning from Berlin, the other is a statistical picture of the war’s human cost drawn from Russian data.\nWhy it matters\nThe verdict is that Merz is arguing the war cannot be treated as a contained conflict over Ukraine. If Moscow’s aims reach further, continued aid to Kyiv is framed as defence of a wider order rather than support for one country. The casualty figures give that argument its weight: a war that has killed almost half a million people, by Russia’s own numbers, is not a border dispute.\nSources agree / disagree\nBloomberg and the BBC do not corroborate each other, because they report different things: Bloomberg carries Merz’s warning and aid pledge, while the BBC carries the leaked casualty figures. Neither outlet confirms the other’s claim, and there is no numeric or factual conflict between them in these snippets. Trust label: Bundled stories — the card combines Merz’s warning with a separate BBC casualty report; read each on its own evidence.\nStill uncertain\nThe snippets give no venue or occasion for Merz’s remarks, no detail on what aid he pledged, and no breakdown of the almost 500,000 figure — the BBC headline does not say in the snippet how many of the dead were soldiers or civilians, or over what period. Those details require the full reports on the linked publisher pages."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-02-merz-warns-russia-s-war-\",\"category\":\"international\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-international-02-merz-warns-russia-s-war-.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Merz Warns Russia’s War Aims Go Far Beyond Ukraine, Vows Aid\",\"zh-TW\":\"相關封面圖：梅爾茨警告俄羅斯的戰爭目標遠遠超出烏克蘭，並誓言提供援助\"},\"publishedAt\":\"2026-11-25T09:38:15.000Z\",\"title\":{\"en\":\"Friedrich Merz Warns Russia’s War Aims Go Far Beyond Ukraine\",\"zh-TW\":\"梅爾茨（Friedrich Merz）警告俄羅斯戰爭目標遠超烏克蘭，承諾續援基輔\"},\"summary\":{\"en\":\"German Chancellor Friedrich Merz warned that Moscow’s ambitions extend beyond Ukraine and pledged to keep military support flowing to Kyiv, Bloomberg reports. Leaked Russian data show nearly 500,000 people lost in the Ukraine war, the BBC reports. The two reports frame the same war from opposite ends.\",\"zh-TW\":\"德國總理梅爾茨（Friedrich Merz）警告，莫斯科的野心超出烏克蘭，並承諾繼續向基輔提供軍事支援，彭博報導。外洩的俄羅斯數據顯示，烏克蘭戰爭已造成近 50 萬人喪生，BBC 報導。兩則報導從戰爭的兩端描繪同一場戰爭。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"德國總理梅爾茨（Friedrich Merz）警告，俄羅斯的戰爭目標遠遠超出烏克蘭，並承諾繼續向基輔提供軍事支援，彭博新聞（Bloomberg News）11 月 25 日報導。同一時間，BBC 報導外洩的俄羅斯數據顯示，全面入侵從根本上改變了俄羅斯的死亡率模式，烏克蘭戰爭已造成近 50 萬人喪生。\\n發生了什麼事\\n梅爾茨警告，莫斯科的野心超出烏克蘭，並承諾維持對基輔的軍事支援，彭博新聞報導。BBC 則報導，俄羅斯自己的數據顯示，俄方在烏克蘭戰爭中已損失近 50 萬人；依據是外洩數據，顯示全面入侵如何改變俄羅斯的死亡率模式。兩則報導從不同角度談同一場戰爭：一邊是柏林發出的政治警告，另一邊是從俄方數據描繪的戰爭人力代價。\\n為什麼重要\\n結論是：梅爾茨主張這場戰爭不能被當成侷限於烏克蘭的衝突。如果莫斯科的目標更遠，繼續援助基輔就不再只是支援一個國家，而是捍衛更廣的秩序。傷亡數字給了這個主張分量：按俄羅斯自己的數字，一場造成近 50 萬人喪生的戰爭不是邊境糾紛。\\n來源異同\\n彭博與 BBC 沒有互相佐證，因為報導的是不同內容：彭博刊載梅爾茨的警告與援烏承諾，BBC 刊載外洩的傷亡數字。兩家都沒有證實對方的說法，片段中也沒有數字或事實衝突。信任標籤：混裝報導——本卡把梅爾茨的警告與另一則 BBC 傷亡報導合併，請分開看待。\\n仍不確定\\n片段沒有說明梅爾茨發言的場合與時機，也沒交代他承諾的援助內容；近 50 萬人的數字也沒有細分——BBC 標題沒有說明其中多少是軍人、多少是平民，也沒說明統計期間。這些細節要讀兩家媒體的完整報導才能確認。\"},\"sources\":[{\"name\":\"BBC World\",\"url\":\"https://www.bbc.co.uk/news/articles/cmx27g533zwyo?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"Bloomberg News\",\"url\":\"https://www.bloomberg.com/news/articles/2026-11-25/merz-warns-russia-s-war-aims-go-far-beyond-ukraine-vows-aid\"}],\"disagreements\":null,\"trustScore\":72,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":19,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"international\",\"live-ingest\",\"bbc-world\",\"bloomberg-news\"],\"glossary\":[{\"term\":{\"en\":\"Friedrich Merz\",\"zh-TW\":\"梅爾茨\"},\"blurb\":{\"en\":\"German Chancellor who warned that Russia’s war aims go beyond Ukraine.\",\"zh-TW\":\"警告俄羅斯戰爭目標超出烏克蘭的德國總理。\"}},{\"term\":{\"en\":\"Kyiv\",\"zh-TW\":\"基輔\"},\"blurb\":{\"en\":\"Capital of Ukraine, recipient of the military support Merz pledged.\",\"zh-TW\":\"烏克蘭首都，梅爾茨承諾軍事支援的對象。\"}},{\"term\":{\"en\":\"Moscow\",\"zh-TW\":\"莫斯科\"},\"blurb\":{\"en\":\"Russia’s capital, used here for the Russian government.\",\"zh-TW\":\"俄羅斯首都，此處代指俄羅斯政府。\"}},{\"term\":{\"en\":\"BBC\",\"zh-TW\":\"BBC\"},\"blurb\":{\"en\":\"British public broadcaster that reported the leaked Russian casualty figures.\",\"zh-TW\":\"報導外洩俄羅斯傷亡數字的英國公共廣播機構。\"}},{\"term\":{\"en\":\"Bloomberg News\",\"zh-TW\":\"彭博新聞\"},\"blurb\":{\"en\":\"News outlet that reported Merz’s warning and aid pledge.\",\"zh-TW\":\"報導梅爾茨警告與援烏承諾的新聞媒體。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-international-02-merz-warns-russia-s-war-/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":
