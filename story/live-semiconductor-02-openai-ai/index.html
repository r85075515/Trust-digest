according to Central News Agency reporting from Bengaluru on November 22.\nWhat happened\nPachocki said AI developers should agree on common restrictions and use perplexity, a measure of how uncertain a language model is about its predictions, as the shared metric for tracking AI progress. The rule he proposes is simple: until monitoring and safety mechanisms reach the required standard, the set threshold must not be crossed. TechNews carried the same proposal under the same framing.\nWhy it matters\nThis is the concrete version of Pachocki's broader speed-limit argument: a named metric, a named condition, and a named red line. Perplexity gives labs something measurable to argue about instead of trading slogans about safety, and the do-not-cross rule gives the metric teeth. If rival labs adopt it, the industry gets a shared dashboard; if they do not, the proposal still sets the terms of the debate.\nSources agree-disagree\nTechNews and Central News Agency report the same proposal with the same core facts, the same metric and the same condition, with no contradictions. Trust label: Two-source agreement.\nStill uncertain\nThe summaries give no numeric threshold values, no timeline, and no detail on what counts as adequate monitoring or safety mechanisms. The proposal is a framework, not a finished rulebook, and no other lab's response is reported."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-02-openai-ai\",\"category\":\"semiconductor\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-semiconductor-02-openai-ai.jpg\",\"imageAlt\":{\"en\":\"Cover related to: OpenAI 科學家建議以困惑度為指標，訂定 AI 發展業界門檻\",\"zh-TW\":\"相關封面圖：OpenAI 科學家建議以困惑度為指標，訂定 AI 發展業界門檻\"},\"publishedAt\":\"2026-11-23T02:20:14.000Z\",\"title\":{\"en\":\"OpenAI's Chief Scientist Proposes Perplexity as the Yardstick for AI Limits\",\"zh-TW\":\"OpenAI 首席科學家提議：以困惑度為指標，訂定 AI 發展業界門檻\"},\"summary\":{\"en\":\"OpenAI chief scientist Jakub Pachocki says AI developers should set shared limits, using perplexity as a common yardstick, and should not cross the thresholds they set until monitoring and safety mechanisms meet the standard. The idea is a speedometer first, speed limit second. Watch whether rival labs adopt the metric.\",\"zh-TW\":\"OpenAI 首席科學家帕喬基（Jakub Pachocki）建議，AI 開發業者應設下共同限制，並以困惑度（perplexity）作為衡量 AI 發展的共通指標，在監控與安全機制未達標準之前，不能跨越所設門檻。邏輯是先有測速表、再談速限。接下來看其他實驗室是否採用這把尺。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"OpenAI 首席科學家帕喬基（Jakub Pachocki）建議，AI 開發業者應設下共同限制，並以困惑度（perplexity）作為衡量 AI 發展的共通指標，在監控與安全機制未達標準之前，不能跨越所設門檻。據中央社班加羅爾 22 日綜合外電報導。\\n發生了什麼事\\n帕喬基表示，AI 開發業者應設下共同限制，並以困惑度——衡量語言模型對預測有多不確定的指標——作為衡量 AI 發展的共通指標。他提出的規則很簡單：在監控與安全機制達標之前，不能跨越所設門檻。科技新報以相同框架報導了同一項提議。\\n為什麼重要\\n這是帕喬基速限主張的具體版：一個具名的指標、一個具名的條件、一條具名的紅線。困惑度給了各實驗室一個可以具體爭論的量測值，而不是互喊安全口號；而「不得跨越」的規則讓指標有了牙齒。其他實驗室若採用，產業就多了一塊共享儀表板；若不採用，這項提議至少定下了辯論的題目。\\n來源異同\\n科技新報與中央社報導的是同一項提議，核心事實、指標與條件都一致，沒有衝突。信任標籤：2源一致。\\n仍不確定\\n摘要未給門檻數值、時間表，也沒說什麼樣的監控與安全機制才算達標。這項提議是框架、不是成文規則，也未報導其他實驗室的回應。\"},\"sources\":[{\"name\":\"TechNews 科技新報\",\"url\":\"https://technews.tw/2026/11/23/openai-scientists-suggest-perplexity-metric-set-ai-development-industry-thresholds/\"},{\"name\":\"中央社-科技\",\"url\":\"https://www.cna.com.tw/news/ait/202611230017.aspx\"}],\"disagreements\":{\"en\":\"Figures differ across outlets (e.g. 8230 vs 22 in headlines/snippets).\",\"zh-TW\":\"不同媒體的數字有所不同（例如，標題/摘要中的數字為 8230 與 22）。\"},\"trustScore\":64,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":19,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"semiconductor\",\"live-ingest\",\"technews-科技新報\",\"中央社-科技\"],\"glossary\":[{\"term\":{\"en\":\"Jakub Pachocki\",\"zh-TW\":\"帕喬基\"},\"blurb\":{\"en\":\"Chief scientist of OpenAI, who proposed the perplexity yardstick.\",\"zh-TW\":\"OpenAI 首席科學家，提出困惑度指標的人。\"}},{\"term\":{\"en\":\"OpenAI\",\"zh-TW\":\"OpenAI\"},\"blurb\":{\"en\":\"AI company behind ChatGPT and the GPT models.\",\"zh-TW\":\"ChatGPT 與 GPT 模型背後的 AI 公司。\"}},{\
