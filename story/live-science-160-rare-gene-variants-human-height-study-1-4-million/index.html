Center published a landmark study in Nature analyzing genetic sequencing data from more than 1.4 million individuals across 12 cohorts, identifying 207 geneslinked to adult human height. While common genetic variants typically alter stature by millimeters, rare protein-altering mutations in 17 genes exhibited average effect sizes roughly 52 times larger.\n\nAccording to peer-reviewed findings reported on November 26, rare loss-of-function variants in the ACAN gene were associated with an average height reduction of up to 17 centimeters, whereas specific rare variants in FBN1 were linked to increases of up to 11 centimeters. In addition, the analysis clarified the clinical significance of 20 genetic variants previously classified as having uncertain or conflicting pathogenicity in the ClinVar database.\n\nResearchers noted that combining common variants with rare high-impact mutations improves genetic height prediction models and could assist clinicians evaluating unexplained short or tall stature.\n\nTrust label: Multi-source agreement — PubMed, News-Medical, and The Print consistently report the Nature publication, 1.4 million cohort size, 207 associated genes, and the 17 cm maximum height effect."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-science-160-rare-gene-variants-human-height-study-1-4-million\",\"category\":\"science\",\"title\":{\"en\":\"Genetic Study of 1.4 Million People Finds Rare Gene Variants Can Shift Height by Up to 17 cm\",\"zh-TW\":\"跨國140萬人基因研究揭露罕見變異可使成人身高相差高達17公分\"},\"summary\":{\"en\":\"A Nature study analyzing genetic data from over 1.4 million people identified 207 height-linked genes, showing rare loss-of-function variants in 17 genes can shift adult height by up to 17 cm.\",\"zh-TW\":\"發表於《自然》（Nature）期刊的大型跨國基因研究分析逾140萬名受試者數據，找出207個與成人身高相關的基因，其中17個基因的罕見功能喪失變異平均效應達常見變異的52倍，單一罕見變異最高可使身高減少17公分或增加11公分。該成果為臨床診斷不明原因生長異常及解讀「意義未明基因變異」提供重要依據。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n由 Regeneron 基因研究中心領銜的跨國團隊於《自然》（Nature）期刊發表論文，分析來自12個研究佇列、逾140萬人的基因組定序數據，共鎖定207個與成人身高相關的基因，並發現其中17個基因的罕見變異對身高具有極顯著影響。\\n\\n「為什麼重要」\\n過去全基因組關聯研究多聚焦於單一影響僅數毫米的常見變異，本次研究證實該17個基因的罕見功能喪失變異平均效應高達常見變異的52倍，例如 ACAN 基因罕見變異可使身高平均減少達17公分，FBN1 基因特定變異則可增加達11公分。研究同時釐清了 ClinVar 資料庫中20個原本被標記為「意義未明」變異的實際生理功能，有助提升臨床生長異常基因檢測的判讀準確率。\\n\\n「來源異同」\\nPubMed 論文摘要、News-Medical 與 The Print 均一致核實逾140萬人樣本數、207個相關基因及最大17公分身高差異數據；News-Medical 詳述單例功能喪失變異（singleton pLoF）統計方法與 ClinVar 20個變異比對結果，The Print 則引述昆士蘭大學統計遺傳學家評論指出仍需後續分子實驗釐清個別基因機制。\\n\\n「仍不確定」\\n研究樣本中約78%屬歐洲血統，這些罕見高衝擊變異在其他族裔族群中的盛行率與效應幅度，以及新規發現基因的具體細胞調控機制仍待擴大跨族裔定序與實驗驗證。\\n\\nTrust label: Multi-source agreement — PubMed、News-Medical 與 The Print 對該篇《自然》期刊論文的樣本規模、207個基因數與17公分最大效應報導一致。\"},\"glossary\":[{\"term\":{\"en\":\"Loss-of-function (LoF) variant\",\"zh-TW\":\"功能喪失變異（LoF）\"},\"blurb\":{\"en\":\"A genetic mutation that disrupts or eliminates the normal biological function of the protein encoded by a gene.\",\"zh-TW\":\"導致基因所編碼蛋白質失去原有正常生理功能或完全無法合成的基因突變類型。\"}},{\"term\":{\"en\":\"Variant of uncertain significance (VUS)\",\"zh-TW\":\"臨床意義未明變異（VUS）\"},\"blurb\":{\"en\":\"A genetic sequence alteration identified during testing whose impact on health or physical traits is not yet conclusively established.\",\"zh-TW\":\"基因檢測中發現但現有科學證據尚不足以判定其對健康或性狀具有致病性或良性影響的序列變異。\"}},{\"term\":{\"en\":\"ClinVar\",\"zh-TW\":\"ClinVar 基因變異資料庫\"},\"blurb\":{\"en\":\"A public archive maintained by the U.S. National Institutes of Health aggregating reports on relationships among human genetic variants and phenotypes.\",\"zh-TW\":\"由美國國家衛生院維護的公開資料庫，彙整人類基因變異與臨床表型關聯的科學與醫學證據。\"}}],\"sources\":[{\"name\":\"PubMed (Nature)\",\"url\":\"https://pubmed.ncbi.nlm.nih.gov/43086441/\"},{\"name\":\"News-Medical\",\"url\":\"https://www.news-medical.net/news/20261126/A-study-of-14-million-people-reveals-a-missing-piece-of-the-height-puzzle.aspx\"},{\"name\":\"The Print\",\"url\":\"https://theprint.in/feature/rare-gene-variants-can-affect-a-persons-height-by-up-to-17-cm-study-finds/3110200/\"}],\"ima
