des a temporary surcharge of USD 2.10 per unit (748 gallons) of water consumed above monthly thresholds: 20 units for residential accounts, 300 units for commercial accounts, and 15,000 units for industrial accounts. Because homeowners associations (HOAs) with shared irrigation meters are classified as commercial customers, neighborhood boards in North Phoenix warned the surcharge could add tens of thousands of dollars to annual community water bills.\n\nWhy it matters\nIn master-planned Phoenix communities, common-area landscaping irrigation is funded directly through homeowners' monthly HOA dues, meaning commercial-tier drought surcharges could quickly translate into higher resident assessments even in neighborhoods that have already reduced turf.\n\nSource differences\nCity of Phoenix Newsroom (\"Phoenix Prepares for Stage 2 of Drought Management Plan Amid Deep Colorado River Cuts\") sets out the USD 2.10 per-unit surcharge thresholds alongside expanded conservation rebates, including raising grass-removal incentives from USD 2 to USD 4 per square foot. Cronkite News (\"Phoenix calls for a surcharge on water which could cost HOA residents.\") highlights pushback from Stetson Valley and Union Park at Norterra HOA leaders, who note their communities use 120 meters and 19 meters respectively and have already invested in smart irrigation controllers.\n\nStill uncertain\nWhether Phoenix City Council will adjust the 300-unit commercial threshold for shared HOA accounts before declaring Stage 2 remains undecided.\n\nTrust label: Official confirmation — Verified against the City of Phoenix's official Water Services announcement and corroborated by Cronkite News reporting."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-arizona-293-phoenix-stage-2-drought-hoa-surcharge\",\"category\":\"arizona\",\"title\":{\"en\":\"Phoenix Stage 2 Drought Surcharge Plan Draws Pushback From HOA Neighborhoods\",\"zh-TW\":\"鳳凰城擬啟動第二階段乾旱水費附加費 社區管委會憂年增數萬美元負擔\"},\"summary\":{\"en\":\"The City of Phoenix plans to impose a USD 2.10 per-unit surcharge on high water users if Stage 2 of its Drought Management Plan is triggered amid Colorado River cuts. Because homeowners associations on shared meters are billed as commercial accounts with a 300-unit monthly threshold, Phoenix HOA leaders warn residents could face tens of thousands of dollars in annual surcharges.\",\"zh-TW\":\"因應科羅拉多河供水削減，鳳凰城市府計畫在啟動乾旱管理計畫第二階段時，對超額用水戶加收每單位 2.10 美元附加費。由於共用總表的社區管委會（HOA）被歸類為商業用戶、每月免收門檻僅 300 單位，北鳳凰城多個大型社區警告每年恐面臨數萬美元額外水費。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」因應科羅拉多河供水大幅削減，鳳凰城市府公布「乾旱管理計畫第二階段」（Stage 2）應變方案，擬對超過每月用水門檻的高用量戶加收每單位（748 加侖）2.10 美元臨時乾旱附加費。其中一般住宅門檻為每月 20 單位、商業用戶為 300 單位、工業用戶為 15,000 單位。由於共用灌溉水表的社區管委會（HOA）被歸類為商業用戶，北鳳凰城多個社區警告每年恐新增數萬美元水費支出。\\n\\n「為什麼重要」鳳凰城大型規劃社區的公共綠地灌溉水費皆由住戶每月繳交的管理費支應，若市府維持以商業用戶標準計算共同水表額度，即便已推行節水措施的社區仍可能被迫調漲住戶管理費。\\n\\n「來源異同」鳳凰城市政府官網新聞稿（原文標題：\\\"Phoenix Prepares for Stage 2 of Drought Management Plan Amid Deep Colorado River Cuts\\\"）詳列各類用戶每單位 2.10 美元超額附加費門檻，並公布將草皮移除補助由每平方英尺 2 美元提高至 4 美元等節水獎勵；Cronkite News（原文標題：\\\"Phoenix calls for a surcharge on water which could cost HOA residents.\\\"）則聚焦斯泰森谷（Stetson Valley，設 120 顆水表）與諾特拉聯合公園（Union Park at Norterra，設 19 顆水表）社區代表反彈，指出當地已導入智慧灌溉控制器卻仍面臨高額附加費衝擊。\\n\\n「仍不確定」鳳凰城市議會在正式宣布進入乾旱第二階段前，是否會針對社區管委會共用帳戶調整 300 單位計算門檻，目前尚未定案。\\n\\nTrust label: Official confirmation — 以鳳凰城市政府水務局官方公告為一手依據，並獲 Cronkite News 報導印證。\"},\"glossary\":[{\"term\":{\"en\":\"Water unit (CCF)\",\"zh-TW\":\"計費水單位\"},\"blurb\":{\"en\":\"A municipal water billing measure equal to 100 cubic feet, or approximately 748 gallons of water.\",\"zh-TW\":\"市政自來水計費單位，1 單位相當於 100 立方英尺，約為 748 加侖水量。\"}},{\"term\":{\"en\":\"Homeowners association (HOA)\",\"zh-TW\":\"社區屋主協會（管委會）\"},\"blurb\":{\"en\":\"A private neighborhood organization in planned subdivisions that maintains common landscaping and infrastructure funded by resident dues.\",\"zh-TW\":\"美國規劃住宅社區的自治管理組織，向住戶收取管理費以維護公共綠地灌溉與社區設施。\"}},{\"term\":{\"en\":\"Stage 2 Drought Management Plan\",\"zh-TW\":\"第二階段乾旱管理計畫\"},\"blurb\":{\"en\":\"Phoenix's drought alert tier calling for voluntary 5 percent citywide water cuts, boosted rebates, and temporary high-use surcharges.\",\"zh-TW\":\"鳳凰城乾旱應變警戒層級，呼籲全市自願節水 5%、提高節水補助並對高用水戶開徵臨時乾旱附加費。\"}}],\"sources\":[{\"name\":\"City of Phoenix\",\"url\":\"https://www.phoenix.gov/newsroom/water-services-news/phoenix-prepares-for-stage-2-of-drought-management-plan-amid-dee.html\"},{\"name\":\"Cronkite News\",\"url\":\"https://cronkitenews.azpbs.org/2026/11/24/hoa-residents-water-bill-surcharges/\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"Phoenix Stage 2 Drought Surcharge Plan Draws Pushback From HOA Neighborhoods\",\"zh-TW\":\"鳳凰城擬啟動第二階段乾旱水費附加費 社區管委會憂年增數萬美元負擔\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":88,\"trustBreakdown\":{\"crossCorroboration\":22,\"outletReputation\":22,\"recencyClarity\":22,\"sourceDiversity\":22},\"publishedAt\":\"2026-11-28T01:07:55.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":22,\"D2\":22,\"D3\":22,\"D4\":21,\"D5\":21,\"total\":22},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-arizona-293-phoenix-stage-2-drought-hoa-surcharge/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scor
