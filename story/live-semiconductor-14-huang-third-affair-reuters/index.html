(reported by the New York Times on Nov 11); and now an unnamed employee inside his own company.\nWhat happened\nReuters said attempts to reach the woman were unsuccessful and Nvidia declined to comment. No time frame, role or current employment status for the woman was disclosed, and no other outlet has independently confirmed the account as of publication. The report lands on a stock already in freefall: Nvidia fell as much as 14% intraday Thursday before retail dip-buying trimmed the loss to about 5% by the afternoon; Reuters put the week's market-value decline at roughly $550 billion, with the shares down about 26% since the Times first reported the Alice Huang relationship on Oct 29 and around 40% below their Oct 6 high.\nWhy it matters\nOne affair was a scandal; a pattern inside his own workforce is a governance case. Two of the three reported relationships involve Nvidia employees, at least one of them (Powell) a direct report - the fact pattern employment lawyers and the board's Wachtell investigators care most about, because it implicates the company's own conduct policies and what directors knew and when. It also reframes Thursday's resignation: announced as a clean break, it now reads as a board cutting losses against a drip of revelations it could not control. The takeaway: until the Wachtell report and the congressional testimony land, every 'final' account of why Huang fell is provisional - the drip is the story.\nSources agree / disagree\nThere is only one original source: Reuters, anonymous. The resignation itself and the Powell and Alice Huang relationships are multiply confirmed (WSJ, CNN, NYT, Reuters). The third relationship stands on Reuters' two unnamed sources alone; tabloids (NY Post, The Sun) are repeating Reuters, not corroborating it. Trust label: Single original source - unconfirmed.\nStill uncertain\nThe woman's identity, role and whether she still works at Nvidia; when the relationship occurred; whether the board knew before Thursday; whether she faced any consequences; and whether more revelations are coming - the question now hanging over the Nov 17 earnings call and Huang's agreed congressional testimony."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"adult\":false,\"body\":{\"en\":\"$10\",\"zh-TW\":\"［未證實·單一原始來源］黃仁勳（Jensen Huang）辭職宣布後數小時，路透週四（11 月 12 日）引述兩名知情人士報導：這位被逐下台的輝達執行長另與第二名輝達員工有親密關係——路透未具名。若屬實，這將是五天內指向他的第三段婚外關係：被美國當局懷疑為北京工作的 Megaspeed 高管黃樂（Alice Huang，黃 11 月 8 日承認的那一段）、輝達醫療事業副總裁兼其直屬部屬鮑威爾（Kimberly Powell，《紐約時報》11 月 11 日報導）、以及如今這名自家公司的未具名員工。\\n發生了什麼事\\n路透表示聯繫該名女性未果，輝達拒絕評論。報導未披露關係發生的時間、她的職位或目前是否仍在職，截至發稿亦無其他媒體獨立證實。消息落在已然崩跌的股價上：輝達週四盤中一度跌 14%，散戶逢低買盤進場後，午盤跌幅收斂至約 5%；路透估算本週市值蒸發約 5,500 億美元，自《紐時》10 月 29 日首度報導黃樂關係以來股價跌約 26%、較 10 月 6 日高點低約 40%。\\n為什麼重要\\n一段外遇是醜聞；自家員工之間的模式就是公司治理案件。三段關係中兩段涉及輝達員工，其中鮑威爾還是直屬部屬——這正是勞動法律師與董事會 Wachtell 調查最在意的型態，因為它牽動公司自身行為準則的執行、以及董事們何時知情。週四的辭職也因此被重新解讀：原以為是乾淨切割，現在看更像董事會在擋不住的爆料滴漏前止損。結論是：在 Wachtell 報告與國會作證落地之前，任何關於「黃仁勳為何倒下」的定版說法都是暫時的——滴漏本身就是新聞。\\n來源異同\\n原始來源只有一個：路透，匿名。辭職本身與鮑威爾、黃樂兩段關係已多源證實（WSJ、CNN、紐時、路透）。第三段關係僅靠路透兩名未具名消息人士；《紐約郵報》《太陽報》等是轉述路透、不是獨立 corroboration。信任標籤：單一原始來源，未證實。\\n仍不確定\\n該女性的身分、職位與是否仍在輝達任職；關係發生的時間；董事會是否在週四前已知情；她是否面臨任何處置；以及後續是否還有更多爆料——這個問題正懸在 11 月 17 日財報法說與黃仁勳已同意的國會作證之上。\"},\"category\":\"semiconductor\",\"disagreements\":null,\"glossary\":[{\"blurb\":{\"en\":\"Reuters news agency; its two anonymous sources are the sole basis for the third-affair report, and no other outlet has independently confirmed it.\",\"zh-TW\":\"路透通訊社；第三段關係報導僅靠其兩名匿名消息人士，尚無其他媒體獨立證實。\"},\"term\":{\"en\":\"Reuters\",\"zh-TW\":\"路透（Reuters）\"}}],\"id\":\"live-semiconductor-14-huang-third-affair-reuters\",\"imageAlt\":{\"en\":\"\",\"zh-TW\":\"\"},\"imageUrl\":\"\",\"isHeadline\":false,\"isPopular\":true,\"publishedAt\":\"2026-11-12T20:20:17.000Z\",\"sources\":[{\"name\":\"Reuters\",\"url\":\"https://www.reuters.com/technology/former-nvidia-ceo-huang-had-relationship-with-second-employee-sources-say-2026-11-12/\"}],\"summary\":{\"en\":\"[Unverified - single original source] Reuters reported Thursday, citing two people familiar with the matter, that Jensen Huang also had an intimate relationship with a second, unnamed Nvidia employee - a third alleged affair after Alice Huang and direct report Kimberly Powell. Reuters could not reach the woman; Nvidia declined to comment; no timeframe or role was disclosed. Nvidia shares fell as much as 14% intraday Thursday, with the week's market-value loss at roughly $550 billion per Reuters.\",\"zh-TW\":\"［未證實·單一原始來源］路透週四引述兩名知情人士報導：黃仁勳另與第二名未具名的輝達員工有親密關係——繼黃樂與直屬部屬鮑威爾之後的第三段指控。路透聯繫該女性未果，輝達拒絕評論，報導未披露時間與職位。輝達週四盤中一度重挫 14%，路透估算本週市值蒸發約 5,500 億美元。\"},\"tags\":[\"semiconductor\",\"live-ingest\",\"breaking\",\"nvidia\",\"jensen-huang\"],\"title\":{\"en\":\"Follow-Up: Reuters Reports a Third Huang Relationship - With a Second, Unnamed Nvidia Employee\",\"zh-TW\":\"後續：路透指黃仁勳還有第三段關係，對象是第二名未具名輝達員工\"},\"trustBreakdown\":{\"crossCorroboration\":12,\"outletReputation\":20,\"recencyClarity\":20,\"sourceDiversity\":14},\"trustScore\":66}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-semiconductor-14-huang-third-affair-reuters/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axio
