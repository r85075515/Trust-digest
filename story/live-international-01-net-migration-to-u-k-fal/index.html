ics and the Home Office.\n\nWhat happened\nThe 77,000 figure is the difference between the number of people arriving in the UK and the number leaving over the year to June. The drop was largely driven by fewer arrivals from outside the European Union. The figures reflect government action to restrict immigration after a public backlash. The BBC also reports that asylum claims fell alongside net migration. The Guardian carries an analysis asking how much of the fall is due to Labour's policies, a question the feed summaries do not answer.\n\nWhy it matters\nThe figures mark a turning point: net migration is now at its lowest this century outside the pandemic years. For readers, the number is the clearest measure yet of how far the government's restrictions have cut arrivals, and the debate now turns to whether the fall is driven by policy or by wider conditions, and what it means for the labour market, public services and asylum policy.\n\nSources agree / disagree\nThe New York Times, the BBC and The Guardian all report the same 77,000 figure and the same comparison, the lowest since 1997 excluding the pandemic. The BBC adds that asylum claims also fell. No numeric or name conflicts appear across the three outlets' feed summaries.\n\nStill uncertain\nThe feed summaries do not break down the 77,000 figure by visa route, nationality or reason for arrival, and they do not settle how much of the decline Labour's policies caused versus other factors. Full breakdowns sit in the Office for National Statistics and Home Office releases and the publishers' full reporting.\n\nTrust label: Multi-source agreement — three major outlets report the same headline figure and the same 1997 comparison."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-01-net-migration-to-u-k-fal\",\"category\":\"international\",\"adult\":false,\"isHeadline\":true,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-international-01-net-migration-to-u-k-fal.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Net Migration to U.K. Falls to Lowest Level Since 1997, Excluding Pandemic\",\"zh-TW\":\"相關封面圖：英國淨移民人數降至 1997 年以來的最低水準（不包括流行病）\"},\"publishedAt\":\"2026-11-26T20:01:47.000Z\",\"title\":{\"en\":\"UK Net Migration Falls to 77,000, Lowest Since 1997 Outside the Pandemic\",\"zh-TW\":\"英國淨移民降至 7.7 萬人，創 1997 年以來新低（不含疫情期間）\"},\"summary\":{\"en\":\"Net migration to the UK fell to 77,000 in the year to June, the lowest since 1997 outside the pandemic, the Office for National Statistics and the Home Office reported. Fewer arrivals from outside the EU drove the drop, reflecting government restrictions imposed after a public backlash. Asylum claims also fell.\",\"zh-TW\":\"英國（United Kingdom）截至 6 月的一年淨移民降至 7.7 萬人，創 1997 年以來新低（不含疫情期間），國家統計局（Office for National Statistics）與內政部（Home Office）公布。非歐盟（EU）移入減少是主因，反映政府在民意反彈後收緊移民政策；庇護申請也同步下降。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"英國淨移民人數降至 7.7 萬人，創 1997 年以來新低（不含疫情期間）：國家統計局與內政部公布的數據顯示，非歐盟移入減少是主因，庇護申請也同步下降。\\n\\n發生了什麼事\\n英國（United Kingdom）截至 6 月的一年淨移民為 7.7 萬人，是本世紀除新冠疫情期間外最低，也是 1997 年以來最低。國家統計局（Office for National Statistics）與內政部（Home Office）公布的數據顯示，下降主因是非歐盟（EU）移入人數減少，反映政府在民意反彈後收緊移民政策。英國廣播公司（BBC）另指出，庇護申請也同步下降。《衛報》（The Guardian）則刊出分析，追問這波下降有多少可歸因於工黨（Labour Party）的政策，摘要未給出答案。\\n\\n為什麼重要\\n這個數字是衡量政府收緊移民政策成效最直接的指標，淨移民已降至本世紀疫情之外最低點。接下來的爭論焦點在於下降是政策所致還是大環境使然，以及對勞動市場、公共服務與庇護政策的後續影響。\\n\\n來源異同\\n《紐約時報》（The New York Times）、英國廣播公司與《衛報》三家報導的 7.7 萬人數字與「1997 年以來最低（不含疫情）」的比較完全一致，英國廣播公司補充庇護申請下降。三家摘要之間沒有數字或人名衝突。\\n\\n仍不確定\\n摘要未提供按簽證類別、國籍或移入原因細分的數據，也未釐清工黨政策與其他因素各自的影響程度。完整細項須查閱國家統計局與內政部的原始發布及各媒體完整報導。\\n\\n信任標籤：多源一致——三家主要媒體報導的數字與比較口徑相同。\"},\"sources\":[{\"name\":\"NYT World\",\"url\":\"https://www.nytimes.com/2026/11/26/world/europe/uk-net-migration-data.html\"},{\"name\":\"BBC UK\",\"url\":\"https://www.bbc.co.uk/news/articles/cq36gj12n0l3o?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"The Guardian UK News\",\"url\":\"https://www.theguardian.com/uk-news/2026/nov/26/net-migration-to-uk-falls-to-lowest-level-since-1997-excluding-pandemic\"}],\"disagreements\":null,\"trustScore\":80,\"trustBreakdown\":{\"sourceDiversity\":20,\"outletReputation\":21,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"international\",\"live-ingest\",\"nyt-world\",\"bbc-uk\",\"the-guardian-uk-news\"],\"glossary\":[{\"term\":{\"en\":\"Net migration\",\"zh-TW\":\"淨移民\"},\"blurb\":{\"en\":\"The difference between the number of people arriving in a country and the number leaving over a given period.\",\"zh-TW\":\"一段期間內移入人數減去移出人數的差額。\"}},{\"term\":{\"en\":\"Office for National Statistics\",\"zh-TW\":\"國家統計局（Office for National Statistics）\"},\"blurb\":{\"en\":\"The UK's official statistics agency, which publishes migration figures.\",\"zh-TW\":\"英國官方統計機構，負責發布移民數據。\"}},{\"term\":{\"en\":\"Home Office\",\"zh-TW\":\"內政部（Home Office）\"},\"blurb\":{\"en\":\"The UK government department responsible for immigration, policing and national security.\",\"zh-TW\":\"英國內政部門，主管移民、警政與國家安全。\"}},{\"term\":{\"en\":\"Labour Party\",\"zh-TW\":\"工黨（Labour Party）\"},\"blurb\":{\"en\":\"The UK's governing party, whose immigration policies are part of the debate over the fall.\",\"zh-TW\":\"英國執政黨，其移民政策是這波下降成因爭論的焦點。\"}},{\"term\":{\"en\":\"Asylum claim\",\"zh-TW\":\"庇護申請\"},\"blurb\":{\"en\":\"A formal request for protection made by someone fleeing persecution in their home country.\",\"zh-TW\":\"逃離本國迫害者提出的正式庇護請求。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/l
