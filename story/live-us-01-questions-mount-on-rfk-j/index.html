cy under his leadership.\nWhat happened\nThe United States has lost its measles elimination status after more than 25 years, and a new survey reveals widespread misconceptions about the disease and its vaccine. With measles cases surging, more than one-third of Americans still believe or are uncertain about the debunked vaccine-autism link, while most do not know the disease's risks or how many vaccine doses children need. The Hill frames the story around Kennedy's plan to win the status back, and the doubts surrounding it.\nWhy it matters\nThe judgment is blunt: elimination status is not a slogan, it is a measurement, and the measurement is moving the wrong way while public understanding moves with it. If a third of the public is unsure about a settled question — vaccines do not cause autism — then any plan to regain the status has to fix trust first, and the next case count will be the first test of whether it is working.\nSources agree / disagree\nThe Hill and ScienceDaily both report the same facts — status lost after 25 years, cases surging, the survey's findings on vaccine myths — with no conflicting figures in the snippets. Trust label: Two-source agreement — two outlets agree on the core claims.\nStill uncertain\nThe snippets do not spell out what Kennedy's plan actually contains, what vaccination-rate target it sets, or when the status could be regained. Those details require the full reporting on the linked publisher pages."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-us-01-questions-mount-on-rfk-j\",\"category\":\"us\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-us-01-questions-mount-on-rfk-j.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Questions mount on RFK Jr.'s plan to regain measles elimination status\",\"zh-TW\":\"相關封面圖：小 RFK 恢復麻疹消除地位的計劃受到質疑\"},\"publishedAt\":\"2026-11-24T23:52:45.000Z\",\"title\":{\"en\":\"Questions Mount Over RFK Jr.'s Plan to Regain Measles Elimination Status\",\"zh-TW\":\"小羅勃·甘迺迪（RFK Jr.）重奪麻疹消除地位計畫引質疑\"},\"summary\":{\"en\":\"Questions are mounting over Health Secretary Robert F. Kennedy Jr.'s plan to regain measles elimination status, as a growing U.S. outbreak highlights concerns about vaccine hesitancy under his leadership. The U.S. has lost the status it held for over 25 years, and a survey finds over one-third of Americans still believe or doubt the debunked vaccine-autism link.\",\"zh-TW\":\"美國麻疹疫情擴大之際，衛生部長小羅勃·甘迺迪（Robert F. Kennedy Jr.）重奪麻疹消除地位的計畫受到越來越多質疑，外界擔憂他主政下的疫苗猶豫氛圍。美國已失去維持 25 年以上的消除地位；新調查發現，逾三分之一美國人仍相信或不確定已被推翻的疫苗與自閉症關聯。計畫能否取信於人，關鍵看病例數是否下降；後續看 CDC 下一次統計。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"美國麻疹疫情擴大之際，衛生部長小羅勃·甘迺迪（Robert F. Kennedy Jr.）重奪麻疹消除地位的計畫受到越來越多質疑，外界擔憂他主政下的疫苗猶豫氛圍。\\n發生了什麼事\\n美國在維持 25 年以上後失去麻疹消除地位；新調查顯示，民眾對這種致命疾病及其疫苗存在廣泛誤解。隨著麻疹病例激增，逾三分之一美國人仍相信或不確定已被推翻的疫苗與自閉症關聯，多數人也不知道疾病的風險、或兒童需要接種幾劑疫苗。《國會山報》以甘迺迪重奪地位的計畫及其引發的疑慮為主線報導。\\n為什麼重要\\n結論很直白：消除地位不是口號，而是一項測量，而測量結果正朝錯誤方向走，民眾的認知也跟著走。如果三分之一的民眾對一個已有定論的問題——疫苗不會導致自閉症——仍不確定，那麼任何重奪地位的計畫都得先修復信任；下一次病例統計將是計畫是否有效的第一個考驗。\\n來源異同\\n《國會山報》與《每日科學》報導的事實一致——25 年後失去地位、病例激增、調查顯示疫苗迷思普遍，片段中沒有數字衝突。信任標籤：2源一致——兩家媒體對核心事實說法一致。\\n仍不確定\\n片段未說明甘迺迪的計畫具體內容、設定的疫苗接種率目標、或何時可能重奪地位，須看各家完整報導才能確認。\"},\"sources\":[{\"name\":\"The Hill\",\"url\":\"https://thehill.com/newsletters/healthcare/6241511-rfk-jr-measles-elimination-questions/\"},{\"name\":\"ScienceDaily 健康醫學\",\"url\":\"https://www.sciencedaily.com/releases/2026/11/261122060323.htm\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":15,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"us\",\"live-ingest\",\"the-hill\",\"sciencedaily-健康醫學\"],\"glossary\":[{\"term\":{\"en\":\"Robert F. Kennedy Jr.\",\"zh-TW\":\"小羅勃·甘迺迪\"},\"blurb\":{\"en\":\"U.S. Health Secretary whose measles plan is questioned.\",\"zh-TW\":\"麻疹計畫受質疑的美國衛生部長。\"}},{\"term\":{\"en\":\"Measles elimination status\",\"zh-TW\":\"麻疹消除地位\"},\"blurb\":{\"en\":\"Designation the U.S. held for over 25 years before losing it.\",\"zh-TW\":\"美國維持 25 年以上後失去的認定。\"}},{\"term\":{\"en\":\"The Hill\",\"zh-TW\":\"《國會山報》\"},\"blurb\":{\"en\":\"Outlet reporting the questions over Kennedy's plan.\",\"zh-TW\":\"報導甘迺迪計畫受質疑的媒體。\"}},{\"term\":{\"en\":\"CDC\",\"zh-TW\":\"CDC\"},\"blurb\":{\"en\":\"U.S. Centers for Disease Control and Prevention, tracking measles cases.\",\"zh-TW\":\"追蹤麻疹病例的美國疾病管制中心。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-us-01-questions-mount-on-rfk-j/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-us-01-questions-mount-on-rfk-j/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"d:\"$8:metadata\"\n"])</script></body></html>
