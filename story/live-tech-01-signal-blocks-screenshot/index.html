reat' to privacy, but both outlets agree the protection is still incomplete.\n\nWhat happened\nSignal now blocks screenshots by default on iOS 27 and Android so AI agents such as Apple's Siri, Google's Gemini and Meta's Muse cannot capture private conversations. The Decoder reports the move as a direct response to operating-system features that let AI assistants read on-screen content. Signal admits gaps remain, including on macOS, and the coverage calls for a simple way for developers to opt out of AI snooping. The article argues Apple, Google and Microsoft should follow suit with similar protections.\n\nWhy it matters\nPrivate chats are only private if the operating system cannot hand them to an AI, and Signal is treating that as a design problem rather than a settings tweak. If the biggest platforms copy the block, screenshot-based snooping gets harder across the board; if they do not, Signal users on other devices stay exposed.\n\nSources agree / disagree\nEngadget and The Decoder report the same core facts: default screenshot blocking on iOS 27 and Android, the AI-agent rationale, and the admission that the fix is incomplete. No numeric or factual conflicts appeared in the feed snippets.\n\nStill uncertain\nThe snippets do not say when the macOS gap will close, how the block behaves with accessibility tools, or whether Apple, Google or Microsoft have responded. Check the publishers' full reports for those details.\nTrust label: Two-source agreement — Engadget and The Decoder report the same rollout and the same caveat."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-tech-01-signal-blocks-screenshot\",\"category\":\"tech\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-tech-01-signal-blocks-screenshot.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Signal blocks screenshots on iOS 27 and Android to stop AI agents from reading private chats\",\"zh-TW\":\"相關封面圖：Signal 會阻止 iOS 27 和 Android 上的螢幕截圖，以阻止 AI 代理閱讀私人聊天記錄\"},\"publishedAt\":\"2026-11-20T20:18:09.000Z\",\"title\":{\"en\":\"Signal Blocks Screenshots on iOS 27 and Android to Stop AI Agents Reading Private Chats\",\"zh-TW\":\"Signal 在 iOS 27 與 Android 封鎖截圖，防 AI 代理讀取私人對話\"},\"summary\":{\"en\":\"Signal now blocks screenshots by default on iOS 27 and Android to stop AI agents such as Siri, Gemini and Muse from reading private chats, calling the practice an 'existential threat' to privacy. Engadget and The Decoder agree the fix is incomplete, including on macOS. Takeaway: the shield is real, but partial.\",\"zh-TW\":\"Signal 在 iOS 27 與 Android 預設封鎖截圖，防 Siri、Gemini、Muse 等 AI 代理讀取私人對話，並稱之為隱私的「生存威脅」；但 Engadget 與 The Decoder 都指出防護仍不完整，macOS 亦然。takeaway：盾牌有了，但還沒封死。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"Signal 在 iOS 27 與 Android 預設封鎖截圖，阻止 AI 代理讀取私人對話，Engadget 與 The Decoder 報導；Signal 稱這是隱私的「生存威脅」，但兩家都指出防護仍不完整。\\n發生了什麼事\\nSignal 現在在 iOS 27 與 Android 預設封鎖截圖，讓蘋果 Siri、Google Gemini、Meta Muse 等 AI 代理無法截取私人對話。The Decoder 報導，這是針對作業系統讓 AI 助理讀取螢幕內容的回應。Signal 承認防護仍有缺口，包括 macOS，並呼籲給開發者一個簡單的退出 AI 窺探的方法；報導主張蘋果、Google、微軟都應跟進。\\n為什麼重要\\n私人對話要真的私密，作業系統就不能把它交給 AI——Signal 是把這當設計問題處理，不是調個設定而已。三大平台若跟進，截圖式窺探會全面變難；不跟進，Signal 在其他裝置上的用戶就繼續暴露。\\n來源異同\\nEngadget 與 The Decoder 核心事實一致：iOS 27 與 Android 預設封鎖截圖、針對 AI 代理、承認修復不完整。片段中沒有數字或事實衝突。信任標籤：兩源一致——兩家報導同一功能與同一但書。\\n仍不確定\\n片段未說明 macOS 缺口何時補上、封鎖對無障礙工具的影響，也未見蘋果、Google、微軟回應；細節請查完整報導。\"},\"sources\":[{\"name\":\"Engadget\",\"url\":\"https://www.engadget.com/2323574/signal-now-blocks-screenshots-by-default-to-stymie-ai-agents/\"},{\"name\":\"The Decoder\",\"url\":\"https://the-decoder.com/signal-blocks-screenshots-on-ios-27-and-android-to-stop-ai-agents-from-reading-private-chats/\"}],\"disagreements\":null,\"trustScore\":68,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":15,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"tech\",\"live-ingest\",\"engadget\",\"the-decoder\"],\"glossary\":[{\"term\":{\"en\":\"Signal\",\"zh-TW\":\"Signal\"},\"blurb\":{\"e
