e offered what The Hill describes as a discreet CIA partnership opportunity, addressing Cubans tired of the disappointment of failed promises, corruption, and the privileged lives of only a few, and urging them to seize this opportunity to create change.\nWhat happened\nRubio's post came moments after President Donald Trump told a Friday rally for candidates in south Florida that US warships could intervene in Cuba on their way back from the Iran war. The Guardian's version of the story stresses the timing: Rubio spoke as Trump was publicly floating military intervention, turning a rally remark into a direct appeal to Cubans themselves.\nWhy it matters\nA sitting secretary of state openly soliciting covert cooperation from another country's citizens is rare, and the pairing with Trump's warship remark makes it harder to read as a slip. The message tests two audiences at once: Cubans weighing personal risk against political hope, and Havana, which must decide whether to treat the post as rhetoric or as an operational threat.\nSources agree-disagree\nThe Guardian World, The Hill, and Al Jazeera all report the same Friday post and the same core quote. Al Jazeera's headline is the bluntest, framing the offer as collaboration to topple the government, while The Guardian frames it as a call for political change; the underlying facts do not conflict. Trust label: N-source agreement, with headline framing differences noted.\nStill uncertain\nThe feed summaries give no Cuban government response, no detail on what the offered partnership would involve in practice, and no sign that anyone has taken up the offer. Whether the post produces action, arrests, or only noise is not yet knowable from these reports."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-01-marco-rubio-urges-cubans\",\"category\":\"international\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-international-01-marco-rubio-urges-cubans.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Marco Rubio urges Cubans to collaborate with CIA to topple gov’t\",\"zh-TW\":\"相關封面圖：馬可·盧比歐敦促古巴人與中央情報局合作推翻政府\"},\"publishedAt\":\"2026-10-24T03:50:32.000Z\",\"title\":{\"en\":\"Rubio Tells Cubans 'Now Is the Time' and Floats a Secret CIA Partnership\",\"zh-TW\":\"盧比歐（Marco Rubio）喊「現在就是時候」，邀古巴人與中情局秘密合作\"},\"summary\":{\"en\":\"Secretary of State Marco Rubio urged Cubans seeking political change to act, saying 'now is the time,' and offered a discreet CIA partnership to those tired of 'failed promises' and corruption. His Friday post followed President Donald Trump's rally remark that U.S. warships could intervene in Cuba on their way back from the Iran war. Watch for Havana's response.\",\"zh-TW\":\"美國國務卿盧比歐週五在社群貼文向古巴人喊話「現在就是時候」，邀請厭倦「跳票承諾與貪腐」的人與中情局秘密合作、推動政治變革。貼文發出前不久，川普才在南佛州造勢集會上說，美軍艦艇可能在伊朗戰事返程途中介入古巴。接下來看哈瓦那如何回應，以及有沒有人真的接招。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"美國國務卿盧比歐公開呼籲古巴人秘密與中情局合作，告訴尋求國內政治變革的人「現在就是時候」。他在週五的社群貼文中提出這項合作邀請，對象是厭倦「跳票承諾、貪腐，以及少數人的特權生活」的古巴人，呼籲他們抓住機會創造變革。\\n發生了什麼事\\n盧比歐發文前不久，川普才在南佛羅里達一場為候選人造勢的週五集會上說，美軍艦艇可能在伊朗戰事返程途中介入古巴。《衛報》的版本強調這個時間點：川普公開拋出軍事介入的說法，盧比歐隨即把話直接遞給古巴人。\\n為什麼重要\\n現任國務卿公開招攬他國公民進行秘密合作，本來就罕見；搭配川普的軍艦說法，更難把它當成失言。這則貼文同時測試兩個對象：衡量個人風險與政治希望的古巴人，以及必須決定把貼文當成空話、還是實質威脅的哈瓦那。\\n來源異同\\n《衛報》世界版、國會山報（The Hill）、半島電視台（Al Jazeera）三家報導的是同一則週五貼文與同一句核心喊話。半島電視台的標題最直白，寫成合作推翻政府；《衛報》寫成呼籲政治變革；底層事實沒有衝突。信任標籤：N源一致，標題措辭強弱有別。\\n仍不確定\\n摘要未提古巴政府的回應、合作邀請在實務上包含什麼，也沒有任何人接受邀請的跡象。這則貼文會帶來行動、逮捕，還是只有聲量，目前從這些報導還看不出來。\"},\"sources\":[{\"name\":\"The Guardian World\",\"url\":\"https://www.theguardian.com/us-news/2026/oct/23/marco-rubio-cuba-trump\"},{\"name\":\"The Hill\",\"url\":\"https://thehill.com/homenews/administration/6169754-rubio-offers-cia-cuban-partnership/\"},{\"name\":\"Al Jazeera\",\"url\":\"https://www.aljazeera.com/video/newsfeed/2026/10/24/10-24-rubi0-cuba-cia?traffic_source=rss\"}],\"disagreements\":null,\"trustScore\":85,\"trustBreakdown\":{\"sourceDiversity\":20,\"outletReputation\":18,\"crossCorroboration\":22,\"recencyClarity\":25},\"tags\":[\"international\",\"live-ingest\",\"the-guardian-world\",\"the-hill\",\"al-jazeera\"],\"glossary\":[{\"term\":{\"en\":\"Marco Rubio\",\"zh-TW\":\"盧比歐\"},\"blurb\":{\"en\":\"US Secretary of State, author of the Friday social media post to Cubans.\",\"zh-TW\":\"美國國務卿，週五向古巴人發文的作者。\"}},{\"term\":{\"en\":\"Central Intelligence Agency\",\"zh-TW\":\"中情局\"},\"blurb\":{\"en\":\"US intelligence agency Rubio invited Cubans to cooperate with.\",\"zh-TW\":\"美國情報機構，盧比歐邀請古巴人秘密合作的對象。\"}},{\"term\":{\"en\":\"Donald Trump\",\"zh-TW\":\"川普\"},\"blurb\":{\"en\":\"President of the United States, who raised warship intervention at a Florida rally.\",\"zh-TW\":\"美國總統，在佛州集會上提及軍艦介入古巴。\"}},{\"term\":{\"en\":\"The Guardian\",\"zh-TW\":\"衛報\"},\"blurb\":{\"en\":\"British news outlet that covered Rubio's post and its timing.\",\"zh-TW\":\"報導盧比歐貼文及其時間點的英國新聞媒體。\"}},{\"term\":{\"en\":\"The Hill\",\"zh-TW\":\"國會山報\"},\"blurb\":{\"en\":\"US news outlet that described the offer as a discreet CIA partnership.\",\"zh-TW\":\"將邀請形容為謹慎的中情局合作機會的美國新聞媒體。\"}},{\"term\":{\"en\":\"Al Jazeera\",\"zh-TW\":\"半島電視台\"},\"blurb\":{\"en\":\"News outlet whose headline framed the offer most bluntly.\",\"zh-TW\":\"標題措辭最直白的新聞媒體。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust
