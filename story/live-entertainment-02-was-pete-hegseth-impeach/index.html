ame outcome: the House moved to end the effort.\n\nWhy it matters\nThe articles themselves matter more than the vote: eight formal charges against a sitting defense secretary are rare, and Fidell's legal read is the clearest guide to what they alleged and why removal was always a long shot. Readers following the story need the substance, not just the headline result.\n\nSources agree and disagree\nPBS NewsHour and Hollywood Life agree Hegseth was not impeached and the House ended the bid. The outlets differ in angle — PBS leads with legal analysis, Hollywood Life with the news outcome — but not on the facts.\n\nStill uncertain\nThe feed summaries do not quote the articles in full, give the vote margin, or say whether Massie plans to refile. The legal consequences of the articles, beyond the blocked vote, remain unexplained in the summaries.\n\nTrust label: Two-source agreement"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-entertainment-02-was-pete-hegseth-impeach\",\"category\":\"entertainment\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"publishedAt\":\"2026-11-11T03:15:40.000Z\",\"title\":{\"en\":\"Pete Hegseth Was Not Impeached: PBS Breaks Down Thomas Massie's Eight Articles\",\"zh-TW\":\"赫格塞斯未遭彈劾：PBS 拆解馬西提出的八項彈劾條文\"},\"summary\":{\"en\":\"Defense Secretary Pete Hegseth was not impeached: the House blocked the effort, and PBS NewsHour's legal explainer breaks down the eight articles filed by Representative Thomas Massie. Military-law expert Eugene Fidell explains what the articles alleged. Watch whether Massie refiles or Democrats revive the bid next year.\",\"zh-TW\":\"國防部長赫格塞斯並未遭到彈劾：眾議院擋下了提案，PBS NewsHour 法律解析拆解眾議員馬西提出的八項彈劾條文。軍事法專家費德爾說明條文指控內容，接下來看馬西是否重新提案、或民主黨明年是否接手。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"國防部長赫格塞斯（Pete Hegseth）並未遭到彈劾：眾議院擋下了提案，PBS NewsHour 的法律解析則拆解了眾議員馬西（Thomas Massie）提出的八項彈劾條文。\\n\\n發生了什麼事\\n馬西針對赫格塞斯提出八項彈劾條文。PBS NewsHour 訪問軍事法專家費德爾（Eugene Fidell），他曾任海岸防衛隊律師，並共同創辦國家軍事司法研究所，負責解析條文內容。Hollywood Life 的同題報導追蹤同一問題——赫格塞斯是否遭到彈劾——結論相同：眾議院已終結這波行動。\\n\\n為什麼重要\\n條文本身比表決結果更重要：針對現任國防部長提出八項正式指控並不常見，費德爾的法律解讀是最清楚的指引，說明條文指控了什麼、以及免職為何從一開始就希望渺茫。追蹤這則新聞的讀者需要的是實質內容，不只是表決結果。\\n\\n來源異同\\nPBS NewsHour 與 Hollywood Life 都確認赫格塞斯未遭彈劾、眾議院終結提案。兩家角度不同——PBS 主打法律分析，Hollywood Life 主打新聞結果——但事實說法沒有出入。\\n\\n仍不確定\\n摘要未完整引述條文、未給表決票數，也沒說馬西是否打算重新提案。條文除了被擋下的表決之外還有什麼法律後果，摘要中也沒有說明。\"},\"sources\":[{\"name\":\"PBS NewsHour\",\"url\":\"https://www.pbs.org/newshour/show/a-breakdown-of-the-impeachment-articles-filed-against-pete-hegseth\"},{\"name\":\"Hollywood Life\",\"url\":\"https://hollywoodlife.com/2026/11/10/was-pete-hegseth-impeached-updates/\"}],\"disagreements\":null,\"trustScore\":64,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":11,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"entertainment\",\"live-ingest\",\"pbs-newshour\",\"hollywood-life\"],\"glossary\":[{\"term\":{\"en\":\"Pete Hegseth\",\"zh-TW\":\"皮特·赫格塞斯\"},\"blurb\":{\"en\":\"US Secretary of Defense.\",\"zh-TW\":\"美國國防部長。\"}},{\"term\":{\"en\":\"Thomas Massie\",\"zh-TW\":\"湯瑪斯·馬西\"},\"blurb\":{\"en\":\"Republican representative from Kentucky who filed eight articles of impeachment.\",\"zh-TW\":\"提出八項彈劾條文的肯塔基州共和黨眾議員。\"}},{\"term\":{\"en\":\"Eugene Fidell\",\"zh-TW\":\"尤金·費德爾\"},\"blurb\":{\"en\":\"Longtime military-law expert and former Coast Guard lawyer.\",\"zh-TW\":\"長期軍事法專家，曾任海岸防衛隊律師。\"}},{\"term\":{\"en\":\"National Institute of Military Justice\",\"zh-TW\":\"國家軍事司法研究所\"},\"blurb\":{\"en\":\"An organisation working to improve the US military justice system.\",\"zh-TW\":\"致力於改善美國軍事司法制度的機構。\"}},{\"term\":{\"en\":\"PBS NewsHour\",\"zh-TW\":\"PBS NewsHour\"},\"blurb\":{\"en\":\"The evening news programme of the US public broadcaster PBS.\",\"zh-TW\":\"美國公共電視 PBS 的晚間新聞節目。\"}},{\"term\":{\"en\":\"Hollywood Life\",\"zh-TW\":\"Hollywood Life\"},\"blurb\":{\"en\":\"US entertainment news website.\",\"zh-TW\":\"美國娛樂新聞網站。\"}}],\"imageUrl\":\"/covers/live/live-entertainment-02-was-pete-hegseth-impeach.jpg\
