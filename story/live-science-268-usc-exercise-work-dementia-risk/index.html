outhern California analyzed 17 eligible studies screened from 6,270 records in a systematic review and meta-analysis published in The Lancet Public Health. The analysis found that recreational exercise was associated with a 24% lower risk of dementia before benefits leveled off, while physically demanding occupational work showed the opposite pattern, correlating with a 20% higher dementia risk.\n\n「Why it matters」\nPublic health messaging has long treated all physical movement as equally beneficial for brain health. The findings highlight a physical activity paradox in cognitive aging, indicating that leisure time, safe recreational spaces, and workplace protections may be critical alongside encouraging exercise.\n\n「Source differences」\nScienceDaily reported the USC release on November 27, 2026 under the headline \"One type of physical activity is linked to a 20% higher dementia risk\", foregrounding the 24% lower risk from recreational exercise versus the 20% higher risk from physically demanding work. MedPage Today covered the study under \"Most Physical Activity Is Tied to Lower Dementia Risk, but This Type May Raise It\", summarizing the accompanying editorial by University College London researchers Mika Kivimäki (Mika Kivimäki) and Mark Hamer (Mark Hamer) on socioeconomic confounders. PubMed indexed the peer-reviewed paper under \"Domain-specific physical activity levels and risk of dementia: a systematic review and meta-analysis\", confirming inclusion of 17 studies across 6,270 screened records.\n\n「Still uncertain」\nBecause the underlying observational studies rely largely on self-reported activity and occupational physical labor correlates closely with socioeconomic status, fatigue, and workplace exposures, whether physical labor directly causes higher dementia risk requires longitudinal studies using device-based measurements.\n\nTrust label: Multi-source agreement — Peer-reviewed Lancet Public Health meta-analysis is corroborated by USC institutional release and independent medical journalism."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-science-268-usc-exercise-work-dementia-risk\",\"category\":\"science\",\"title\":{\"en\":\"USC Meta-Analysis Finds Leisure Exercise Lowers Dementia Risk While Physical Labor Raises It\",\"zh-TW\":\"南加大統合分析發現休閒運動降失智風險、高體力勞動反增風險\"},\"summary\":{\"en\":\"A University of Southern California systematic review and meta-analysis of 17 studies published in The Lancet Public Health found leisure-time exercise is associated with a 24% lower dementia risk, whereas high occupational physical activity is linked to a 20% higher risk.\",\"zh-TW\":\"美國南加州大學研究團隊在《刺胳針公共衛生》發表的 17 項研究系統性回顧與統合分析顯示，休閒運動與失智風險降低 24% 相關，但高體力負荷的職業勞動卻與失智風險增加 20% 相關。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n美國南加州大學（USC）演化生物學與身體活動實驗室博士後研究員費特（Natan Feter）領銜的團隊，在《刺胳針公共衛生》（The Lancet Public Health）發表系統性回顧與統合分析，從 6,270 筆文獻中篩選出 17 項符合條件的研究進行分析。結果顯示，休閒時間運動與失智症風險降低 24% 相關，而高體力負荷的職業勞動則呈現相反趨勢，與失智症風險升高 20% 相關。\\n\\n「為什麼重要」\\n長期以來公共衛生宣導普遍認為「只要多動就有益大腦健康」。這項研究揭示身體活動對認知老化的矛盾效應，顯示除了鼓勵運動外，保障勞工休閒時間、提供安全運動場域與改善高負荷職場環境同樣關鍵。\\n\\n「來源異同」\\nScienceDaily 於 2026 年 11 月 27 日以「One type of physical activity is linked to a 20% higher dementia risk」為題刊出南加大新聞稿，點出休閒運動降 24% 風險與體力勞動增 20% 風險的對比。MedPage Today 則以「Most Physical Activity Is Tied to Lower Dementia Risk, but This Type May Raise It」報導，並引述倫敦大學學院學者基維馬基（Mika Kivimäki）與哈默（Mark Hamer）在同期評論中對社經背景干擾因子的提醒。PubMed 收錄的同儕審查論文頁標題為「Domain-specific physical activity levels and risk of dementia: a systematic review and meta-analysis」，載明該研究從 6,270 筆紀錄中納入 17 項研究。\\n\\n「仍不確定」\\n由於納入分析的觀察性研究多依賴受試者自我回報活動量，且高體力勞動往往與較低社經地位、睡眠不足及職場環境暴露高度重疊，職業體力活動是否直接導致失智風險上升，仍需透過穿戴式裝置客觀量測的長期追蹤研究加以釐清。\\n\\nTrust label: Multi-source agreement — 同儕審查期刊統合分析獲南加大新聞稿與獨立醫療媒體報導交叉驗證。\"},\"glossary\":[{\"term\":{\"en\":\"Physical Activity Paradox\",\"zh-TW\":\"身體活動悖論（Physical Activity Paradox）\"},\"blurb\":{\"en\":\"The epidemiological finding that leisure-time physical exercise improves health outcomes while high physical activity performed during paid work is linked to worse health risks.\",\"zh-TW\":\"流行病學觀察到的現象，指休閒時間運動有益健康，但工作中從事高強度體力勞動反而與較差的健康結果相關。\"}},{\"term\":{\"en\":\"Systematic Review and Meta-Analysis\",\"zh-TW\":\"系統性回顧與統合分析\"},\"blurb\":{\"en\":\"A research method that systematically identifies all relevant studies on a question and statistically pools their data to estimate an overall effect.\",\"zh-TW\":\"一種嚴謹的實證研究方法，系統性蒐集特定主題的所有相關研究並進行統計合併分析，以評估整體效應。\"}},{\"term\":{\"en\":\"Occupational Physical Activity\",\"zh-TW\":\"職業身體活動\"},\"blurb\":{\"en\":\"Physical exertion performed as part of a person's job duties, such as heavy lifting, prolonged standing, or manual labor.\",\"zh-TW\":\"個人在執行工作職務期間進行的體力消耗活動，例如搬運重物、長時間站立或體力勞動。\"}}],\"sources\":[{\"name\":\"ScienceDaily\",\"url\":\"https://www.sciencedaily.com/releases/2026/11/261125045246.htm\"},{\"name\":\"MedPage Today\",\"url\":\"https://www.medpagetoday.com/neurology/dementia/122675\"},{\"name\":\"PubMed\",\"url\":\"https://pubmed.ncbi.nlm.nih.gov/42612650/\"}],\"imageUrl\":\"/covers/live/live-science-268-usc-exercise-work-dementia-risk.webp\",\"imageAlt\":{\"en\":\"USC Meta-Analysis Finds Leisure Exercise Lowers Dementia Risk While Physical Labor Raises It\",\"zh-TW\":\"南加大統合分析發現休閒運動降失智風險、高體力勞動反增風險\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":88,\"trustBreakdown\":{\"crossCorroboration\":23,\"outletReputation\":23,\"recencyClarity\":20,\"sourceDiversity\":22},\"publishedAt\":\"2026-11-27T23:17:28.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":23,\"D2\":23,\"D3\":21,\"D4\":23,\"D5\":22,\"total\":22},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"
