all when JPMorgan, Goldman Sachs, Wells Fargo, and Citi unveil their results.\nWhat happened\nAll four banks — JPMorgan, Goldman Sachs, Wells Fargo, and Citi — report Tuesday. Per Bloomberg's video segment, the banks are expected to unveil a quarterly stock-trading haul of nearly $19 billion, while Natarajan cautions that the broader earnings picture will be mixed.\nWhy it matters\nThe judgment is about where Wall Street makes its money now: trading revenue is the swing factor, and a near-$19B haul would confirm that volatile markets remain a profit engine for the big banks even as Main Street strains. These four reports set the tone for the entire earnings season in finance.\nSources agree / disagree\nThis is a single Bloomberg video item with no other outlet in the cluster. Trust label: Single source — one outlet's pre-earnings preview, no corroboration.\nStill uncertain\nThese are expectations, not results: the $19B figure and the mixed-bag call both get tested Tuesday. Verify against the actual reported numbers before treating them as fact."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-02-big-banks-set-to-report-\",\"category\":\"finance\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"publishedAt\":\"2026-10-12T15:20:30.000Z\",\"title\":{\"en\":\"JPMorgan, Goldman, Wells Fargo and Citi Report Tuesday; $19B Trading Haul Expected\",\"zh-TW\":\"摩根大通、高盛、富國、花旗週二公布財報，交易收入上看190億美元\"},\"summary\":{\"en\":\"JPMorgan, Goldman Sachs, Wells Fargo and Citi all report earnings Tuesday, with a quarterly stock-trading haul of nearly $19 billion expected, Bloomberg reports. Bloomberg's Sridhar Natarajan expects a mixed bag overall. The results set the tone for Wall Street's quarter; next watch is the actual numbers Tuesday.\",\"zh-TW\":\"摩根大通（JPMorgan）、高盛（Goldman Sachs）、富國銀行（Wells Fargo）、花旗（Citi）週二公布財報，單季股票交易收入預計近190億美元。彭博的納塔拉詹（Sridhar Natarajan）預期整體好壞參半；財報將定調華爾街這一季，接下來看週二實際數字。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"華爾街大銀行週二公布財報，關鍵數字是近190億美元：這是市場預期的四家銀行單季股票交易收入總和。彭博的納塔拉詹（Sridhar Natarajan）預期，摩根大通、高盛、富國銀行、花旗公布財報時，整體將好壞參半。\\n發生了什麼事\\n四家銀行——摩根大通、高盛、富國銀行、花旗——都在週二公布財報。據彭博影音報導，各家預計揭露近190億美元的單季股票交易收入；納塔拉詹提醒，整體獲利表現將好壞參半。\\n為什麼重要\\n這是華爾街現在靠什麼賺錢的判斷：交易收入是擺動因子，近190億美元若達陣，等於確認動盪的市場仍是大型銀行的印鈔機——即便實體經濟吃緊。這四份財報將定調整個金融業財報季的基調。\\n來源異同\\n這是彭博單一影音報導，同批沒有其他媒體。信任標籤：僅1源——一家媒體的財報前瞻，無從查證。\\n仍不確定\\n這些都是預期，不是結果：190億美元與好壞參半的判斷，週二見真章。引用前請對照實際公布數字。\"},\"sources\":[{\"name\":\"Bloomberg\",\"url\":\"https://www.bloomberg.com/news/videos/2026-10-12/big-banks-set-to-report-trading-haul-of-19-billion-video\"}],\"disagreements\":null,\"trustScore\":59,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"finance\",\"live-ingest\",\"bloomberg\"],\"glossary\":[{\"term\":{\"en\":\"Sridhar Natarajan\",\"zh-TW\":\"納塔拉詹\"},\"blurb\":{\"en\":\"Bloomberg journalist previewing the bank earnings.\",\"zh-TW\":\"前瞻銀行財報的彭博記者。\"}},{\"term\":{\"en\":\"Bloomberg\",\"zh-TW\":\"彭博\"},\"blurb\":{\"en\":\"Financial news outlet reporting the earnings preview.\",\"zh-TW\":\"報導財報前瞻的財經新聞媒體。\"}},{\"term\":{\"en\":\"JPMorgan\",\"zh-TW\":\"摩根大通\"},\"blurb\":{\"en\":\"US bank reporting earnings Tuesday.\",\"zh-TW\":\"週二公布財報的美國銀行。\"}},{\"term\":{\"en\":\"Goldman Sachs\",\"zh-TW\":\"高盛\"},\"blurb\":{\"en\":\"US bank reporting earnings Tuesday.\",\"zh-TW\":\"週二公布財報的美國銀行。\"}},{\"term\":{\"en\":\"Citi\",\"zh-TW\":\"花旗\"},\"blurb\":{\"en\":\"US bank reporting earnings Tuesday.\",\"zh-TW\":\"週二公布財報的美國銀行。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and
