en\":[[\"id\",\"live-semiconductor-03-ai-h943d244f\",\"d\"],[\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$L2\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L3\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[\"__PAGE__\",[\"$\",\"$1\",\"c\",{\"children\":[\"$L4\",null,[\"$\",\"$L5\",null,{\"children\":[\"$L6\",[\"$\",\"$L7\",null,{\"promise\":\"$@8\"}]]}]]}],{},null,false]},null,false]},null,false]},null,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[[\"$\",\"$L9\",null,{\"children\":\"$La\"}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]],[\"$\",\"$Lb\",null,{\"children\":[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$c\",null,{\"fallback\":null,\"children\":\"$Ld\"}]}]}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$e\",[]],\"s\":false,\"S\":true}\n"])</script><script>self.__next_f.push([1,"f:I[8587,[\"619\",\"static/chunks/619-ba102abea3e3d0e4.js\",\"523\",\"static/chunks/523-fd7ab8eed1c9bbc2.js\",\"954\",\"static/chunks/app/story/%5Bid%5D/page-b37b1e31acb17fd9.js\"],\"default\"]\n10:Tabd,"])</script><script>self.__next_f.push([1,"Super Micro Computer reported results that beat expectations, helped by strong demand for AI servers, and a companion report on AMD showed the same after-hours strength across two major AI hardware suppliers.\n\nWhat happened\nTechNews reports that Super Micro Computer delivered earnings beyond expectations, with strong AI server demand indicating continued AI infrastructure build-out, and that its shares surged in after-hours trading. CNA, reporting from Washington by correspondent Liao Han-yuan, adds the parallel AMD story: AMD announced third-quarter results with revenue up 45 percent from the same period a year earlier, and Chief Executive Lisa Su said she was confident the company would sustain strong growth over the coming years. The same CNA report says Super Micro Computer, identified as a Taiwanese-founded supplier, also announced results the same day, with revenue well ahead of the same period a year earlier. Both AI equipment makers' share prices rose in after-hours trading. The snippets do not provide Super Micro Computer's exact revenue or profit figures, because the TechNews summary is truncated at the point where the numbers would appear.\n\nWhy it matters\nResults from server and chip suppliers are closely watched as a check on whether AI infrastructure spending is continuing at scale. A 45 percent revenue increase at AMD and a beat at Super Micro Computer point, within these reports, to demand that is still strong rather than fading. After-hours gains for both stocks show investors responding positively to that signal. At the same time, the absence of Super Micro Computer's precise figures in the summary means readers can confirm the direction of its results, expectations beaten and shares up, but not their size from this material alone.\n\nSources agree / disagree\nTrust label: Two-source agreement — Both outlets report strong AI hardware results and after-hours gains, with one adding AMD's detailed growth figure.\nTechNews focuses on Super Micro Computer's beat and the strength of AI server demand, while CNA covers both companies and supplies the specific AMD figure of 45 percent growth and Lisa Su's confidence about future growth. The accounts are complementary and contain no conflicting numbers; the apparent figure mismatch flagged at headline level reflects the truncated summary rather than a real disagreement.\n\nStill uncertain\nSuper Micro Computer's exact revenue, profit, and guidance figures are cut off in the summary and cannot be stated here. The reports also do not break down which products or customers drove the AI server demand, or how much of AMD's growth came from AI-related products. Whether the after-hours gains hold in regular trading is likewise unknown from these snippets."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-03-ai-h943d244f\",\"category\":\"semiconductor\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-semiconductor-03-ai-h943d244f.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 美超微財報優、AI 伺服器需求強勁  盤後飆\",\"zh-TW\":\"相關封面圖：美超微財報優、AI 伺服器需求強勁 盤後飆\"},\"publishedAt\":\"2026-11-04T01:55:53.000Z\",\"title\":{\"en\":\"Super Micro Computer beats earnings expectations on strong AI server demand as AMD revenue jumps 45 percent\",\"zh-TW\":\"美超微（Super Micro Computer）財報優於預期、人工智慧伺服器需求強勁，超微（AMD）營收成長45%\"},\"summary\":{\"en\":\"Super Micro Computer delivered earnings that beat expectations on strong AI server demand, and its shares surged in after-hours trading, TechNews reports. CNA adds that AMD's third-quarter revenue rose 45 percent from a year earlier, Chief Executive Lisa Su expressed confidence in continued strong growth, and both AI equipment makers rose after hours.\",\"zh-TW\":\"科技新報（TechNews）報導，美超微（Super Micro Computer）繳出超乎預期的財報，人工智慧伺服器需求強勁，盤後股價大漲。中央社（CNA）報導，超微（AMD）第3季營收較去年同期成長45%，執行長蘇姿丰（Lisa Su）表示有信心延續強勢成長，兩家業者盤後同步走高。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"美超微（Super Micro Computer）公布優於預期的業績，受惠於人工智慧伺服器需求強勁；另一則關於超微（AMD）的報導顯示，兩大人工智慧硬體供應商盤後同步走強。\\n\\n發生了什麼事\\n科技新報（TechNews）報導，美超微（Super Micro Computer）繳出超乎預期的財報，人工智慧伺服器需求強勁，顯示人工智慧基礎建設持續擴張，股價盤後飆漲。中央社（CNA）記者廖漢原自華盛頓（Washington）發回的報導補上超微（AMD）的平行消息：超微公布第3季財報，營收較去年同期成長45%，執行長蘇姿丰（Lisa Su）指出，有信心未來幾年延續強勢成長。同一則中央社報導指出，台裔業者美超微（Super Micro Computer）同日也公布業績，營收大幅超前去年同期表現。兩家人工智慧設備業者盤後交易價均走高。摘要在美超微的確切數字出現前就被截斷，因此未提供其精確的營收或獲利數字。\\n\\n為什麼重要\\n伺服器與晶片供應商的業績被視為檢驗人工智慧基礎建設支出是否持續放量的指標。超微（AMD）營收成長45%，加上美超微（Super Micro Computer）優於預期，在這兩則報導的範圍內指向需求依然強勁而非消退。兩檔股票盤後上漲，顯示投資人對這個訊號反應正面。同時，由於摘要中缺少美超微的精確數字，讀者只能確認其業績方向——優於預期且股價上漲——無法從現有素材得知幅度大小。\\n\\n來源異同\\n兩家媒體都報導人工智慧硬體業績強勁與盤後上漲，一家補上了超微（AMD）的具體成長數字。科技新報（TechNews）聚焦美超微的優於預期與伺服器需求，中央社（CNA）則同時涵蓋兩家公司，並提供超微成長45%的數字與蘇姿丰（Lisa Su）對未來成長的信心說法。兩則報導互補，沒有互相衝突的數字；標題層次看似的數字不一，來自摘要截斷，而非真正的分歧。\\n\\n仍不確定\\n美超微（Super Micro Computer）的確切營收、獲利與展望數字在摘要中被截斷，此處無法陳述。報導也未拆分哪些產品或客戶驅動了人工智慧伺服器需求，也未說明超微的成長有多少來自人工智慧相關產品。盤後漲勢能否在正規交易時段維持，同樣無法從這些摘要得知。\"},\"sources\":[{\"name\":\"TechNews 科技新報\",\"url\":\"https://finance.technews.tw/2026/11/04/supermicro-announces-first-quarter-of-fiscal-year-2027-financial-results/\"},{\"name\":\"中央社-產經證券\",\"url\":\"https://www.cna.com.tw/news/afe/202611040016.aspx\"}],\"disagreements\":{\"en\":\"Figures differ across outlets (e.g. 8230 vs 3 in headlines/snippets).\",\"zh-TW\":\"各個媒體的數字有所不同（例如，標題/摘要中的數字為 8230 與 3）。\"},\"trustScore\":64,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":19,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"semiconductor\",\"live-ingest\",\"technews-科技新報\",\"中央社-產經證券\"],\"glossary\":[{\"term\":{\"en\":\"Super Micro Computer\",\"zh-TW\":\"美超微（Super Micro Computer）\"},\"blurb\":{\"en\":\"Super Micro Computer is the AI server maker whose earnings beat expectations in the reports.\",\"zh-TW\":\"美超微（Super Micro Computer）是報導中財報優於預期的人工智慧伺服器業者。\"}},{\"term\":{\"en\":\"AMD\",\"zh-TW\":\"超微（AMD）\"},\"blurb\":{\"en\":\"AMD is the chipmaker whose third-quarter revenue rose 45 percent year on year.\",\"zh-TW\":\"超微（AMD）是第3季營收年增45%的晶片大廠。\"}},{\"term\":{\"en\":\"Lisa Su\",\"zh-TW\":\"蘇姿丰（Lisa Su）\"},\"blurb\":{\"en\":\"Lisa Su is AMD's chief executive, who expressed confidence in continued strong growth.\",\"zh-TW\":\"蘇姿丰（Lisa Su）是超微執行長，表示有信心延續強勢成長。\"}},{\"term\":{\"en\":\"TechNews\",\"zh-TW\":\"科技新報（TechNews）\"},\"blurb\":{\"en\":\"TechNews is the technology outlet that reported Super Micro Computer's earnings beat.\",\"zh-TW\":\"科技新報（TechNews）是報導美超微財報優於預期的科技媒體。\"}},{\"term\":{\"en\":\"CNA\",\"zh-TW\":\"中央社（CNA）\"},\"blurb\":{\"en\":\"CNA is the news agency whose Washington report covered both AMD and Super Micro Computer.\",\"zh-TW\":\"中央社（CNA）是自華盛頓報導超微與美超微業績的新聞通訊社。\"}}]}}]\n"])</script><script>se
