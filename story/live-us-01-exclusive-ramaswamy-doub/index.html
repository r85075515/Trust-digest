 reporters Tuesday evening that his campaign was behind a new attack ad featuring his Democratic opponent Amy Acton's mother calling her a \"liar\" and insinuating she suffers from mental health issues. Ramaswamy acknowledged his campaign produced the ad, which began circulating on social media Monday night. Axios has learned the campaign is pouring $4 million into the ad — a bombshell spot in which Acton's estranged mother attacks her daughter. Separately, Ohio Democratic Senate candidate Sherrod Brown pressed his Republican rival Sen. Jon Husted to condemn the ad, posting on X: \"The ad released by Vivek Ramaswamy is disgusting. Everyone, including Jon Husted, should be willing to condemn this ad.\"\nWhy it matters\nRamaswamy is gambling that a deeply personal attack — delivered by the opponent's own mother — moves voters more than the bipartisan disgust it provokes costs him. The $4 million buy makes it a deliberate strategy, not a stray spot, and it is already forcing other Republicans to take a position.\nSources agree / disagree\nThe Hill reports Ramaswamy taking responsibility and Brown's call for condemnation; Axios reports the $4 million spend and the doubling-down. Both describe the same ad and the same backlash. No factual conflicts appear.\nStill uncertain\nThe snippets do not say where the ad is airing, how voters are reacting beyond elite commentary, or whether Acton has responded directly to the spot itself."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-us-01-exclusive-ramaswamy-doub\",\"category\":\"us\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-us-01-exclusive-ramaswamy-doub.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Exclusive: Ramaswamy doubles down on explosive ad featuring rival's mother, despite backlash\",\"zh-TW\":\"相關封面圖：獨家：拉馬斯瓦米不顧強烈反對，加大力度推出以競爭對手母親為主角的爆炸性廣告\"},\"publishedAt\":\"2026-10-21T02:05:45.000Z\",\"title\":{\"en\":\"Ramaswamy doubles down on $4 million attack ad featuring opponent Acton's mother despite backlash\",\"zh-TW\":\"拉馬斯瓦米（Ramaswamy）不顧反彈，加碼 400 萬美元攻擊廣告，主角是對手艾克頓（Acton）的母親\"},\"summary\":{\"en\":\"Ohio gubernatorial candidate Vivek Ramaswamy confirmed Tuesday evening that his campaign was behind a new attack ad featuring his Democratic opponent Amy Acton's mother calling her a \\\"liar\\\" and insinuating she has mental health issues. Axios reports the campaign is pouring $4 million into the ad, doubling down despite fierce bipartisan backlash.\",\"zh-TW\":\"俄亥俄州長候選人拉馬斯瓦米（Vivek Ramaswamy）週二晚間證實，競選團隊製作了以民主黨對手艾米·艾克頓（Amy Acton）母親為主角的攻擊廣告，片中母親稱女兒是「騙子」並暗示她有心理健康問題。Axios 獨家報導，競選團隊砸下 400 萬美元投放，不顧兩黨強烈反彈加碼宣傳。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"拉馬斯瓦米（Vivek Ramaswamy）不顧兩黨強烈反彈，加碼 400 萬美元投放一支以對手母親為主角的爆炸性攻擊廣告。\\n發生了什麼事\\n俄亥俄州（Ohio）州長候選人拉馬斯瓦米週二晚間向記者證實，競選團隊製作了一支新的攻擊廣告，主角是民主黨對手艾米·艾克頓（Amy Acton）的母親，片中稱女兒是「騙子」並暗示她有心理健康問題。拉馬斯瓦米承認廣告由競選團隊製作，週一晚間開始在社群媒體流傳。Axios 獨家獲悉，競選團隊砸下 400 萬美元投放這支「震撼彈」廣告——由艾克頓關係疏遠的母親親自攻擊女兒。另方面，俄亥俄州民主黨參議員候選人布朗（Sherrod Brown）要求共和黨對手、參議員赫斯特德（Jon Husted）譴責這支廣告，他在 X 平台寫道：「拉馬斯瓦米發布的廣告令人作嘔，包括赫斯特德在內，每個人都應該譴責它。」\\n為什麼重要\\n拉馬斯瓦米賭的是：由對手親生母親發動的人身攻擊，帶來的選票多過兩黨譴責造成的損失。400 萬美元的投放規模說明這是深思熟慮的策略，而非偶發插曲，而且已經逼著其他共和黨人表態。\\n來源異同\\n《The Hill》報導拉馬斯瓦米認領廣告與布朗要求譴責；Axios 報導 400 萬美元投放與加碼。兩家描述的是同一支廣告和同一波反彈，未見事實衝突。\\n仍不確定\\n摘要未說明廣告在哪些媒體投放、選民反應如何（除了政界評論），也未說明艾克頓本人是否直接回應這支廣告。\"},\"sources\":[{\"name\":\"The Hill\",\"url\":\"https://thehill.com/homenews/campaign/6161654-ramaswamy-attack-ad-amy-acton/\"},{\"name\":\"Axios\",\"url\":\"https://www.axios.com/2026/10/21/ramaswamy-ad-acton-mother-ohio\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":13,\"outletReputation\":10,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"us\",\"live-ingest\",\"the-hill\",\"the-hill\",\"axios\"],\"glossary\":[{\"term\":{\"en\":\"Vivek Ramaswamy\",\"zh-TW\":\"拉馬斯瓦米\"},\"blurb\":{\"en\":\"Republican candidate for Ohio governor behind the attack ad.\",\"zh-TW\":\"製作這支攻擊廣告的俄亥俄州長共和黨候選人。\"}},{\"term\":{\"en\":\"Amy Acton\",\"zh-TW\":\"艾克頓\"},\"blurb\":{\"en\":\"Democratic opponent for Ohio governor, target of the ad.\",\"zh-TW\":\"廣告攻擊目標、俄亥俄州長民主黨候選人。\"}},{\"term\":{\"en\":\"Sherrod Brown\",\"zh-TW\":\"布朗\"},\"blurb\":{\"en\":\"Ohio Democratic Senate candidate calling for the ad's condemnation.\",\"zh-TW\":\"要求譴責這支廣告的俄亥俄州民主黨參議員候選人。\"}},{\"term\":{\"en\":\"Jon Husted\",\"zh-TW\":\"赫斯特德\"},\"blurb\":{\"en\":\"Republican senator pressed to condemn the ad.\",\"zh-TW\":\"被要求表態譴責的共和黨參議員。\"}},{\"term\":{\"en\":\"Ohio\",\"zh-TW\":\"俄亥俄州\"},\"blurb\":{\"en\":\"US state holding the gubernatorial race.\",\"zh-TW\":\"這場州長選戰所在的美國州。\"}},{\"term\":{\"en\":\"Axios\",\"zh-TW\":\"Axios\"},\"blurb\":{\"en\":\"US news outlet that broke the $4 million ad buy.\",\"zh-TW\":\"獨家報導 400 萬美元廣告投放的美國媒體。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://r85075515.github.io/Trust-digest/\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"Axiom\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"zh_TW\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:locale:alternate\",\"content\":\"en_US\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"9\",{
