to cover millions of teens worldwide.\nWhy it matters\nTeen safety is one of the most scrutinized areas of platform regulation, and this shifts the model from self-reporting to detection: a platform that can spot teens who lie about their age can enforce limits they would otherwise dodge. The takeaway is the scale — millions of teens — and the direction: automated age checks are becoming the default, which raises the next questions about accuracy and appeals.\nSources agree / disagree\nOnly CNA carries the announcement in the feed, so there is no independent corroboration. Trust label: Single source — one outlet, a company announcement, no cross-check in the snippets.\nStill uncertain\nThe snippets give no accuracy rate for the detection, no appeals process for misidentified users, and no list of which Meta platforms are covered. Those details should be checked against CNA's full report."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-02-meta-ai\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-taiwan-02-meta-ai.jpg\",\"imageAlt\":{\"en\":\"Meta expands AI age detection worldwide\",\"zh-TW\":\"Meta 擴大全球 AI 年齡偵測\"},\"publishedAt\":\"2026-11-10T07:48:36.000Z\",\"title\":{\"en\":\"Meta Expands AI Age Detection Worldwide to Catch Teens Lying About Their Age\",\"zh-TW\":\"Meta 擴大全球 AI 年齡偵測，防青少年謊報年齡\"},\"summary\":{\"en\":\"[Unconfirmed · single source] Meta announced it will expand its AI technology for detecting suspected teen users worldwide starting today, to stop minors from lying about their age to dodge safety limits. Even if an account was registered with an adult birthday, the system can proactively identify teens and place them under age-appropriate protections, covering millions of teens globally.\",\"zh-TW\":\"［未證實·單一來源］Meta 今天宣布，即日起將運用 AI 偵測疑似青少年使用者的技術推展至全球，防範未成年使用者虛報年齡規避安全限制。即使註冊時填寫成年人生日，系統也能主動辨識並納入適齡保護機制，預計涵蓋全球數百萬名青少年用戶。（中央社 11 月 10 日台北報導）\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"為防範未成年使用者在網路上虛報年齡以規避安全限制，Meta 今天宣布，即日起將運用人工智慧偵測疑似青少年使用者的技術推展至全球，即使註冊時填寫成年人生日，系統也能主動辨識並納入適齡保護機制，預計涵蓋全球數百萬名青少年用戶。\\n發生了什麼事\\nMeta 宣布即日起將 AI 年齡偵測技術推向全球。系統會從多種訊號判斷帳號是否屬於青少年，即使註冊生日寫的是成年人，也能主動辨識並納入適齡保護；預計涵蓋全球數百萬名青少年用戶。\\n為什麼重要\\n青少年網路安全是平台監管最受檢視的領域之一，而這項做法把模式從「申報制」轉向「偵測制」：平台能揪出謊報年齡的青少年，就能執行他們原本可以規避的限制。結論在於規模——數百萬青少年——與方向：自動化年齡查核正成為預設做法，接下來的問題是準確率與申訴機制。\\n來源異同\\n來源中只有中央社報導這項宣布，無法獨立查證。信任標籤：僅1源——單一媒體、公司宣布，摘要中無交叉佐證。\\n仍不確定\\n摘要未提供偵測準確率、誤判使用者的申訴機制，也未列出涵蓋哪些 Meta 平台。這些細節請對照中央社完整報導。\"},\"sources\":[{\"name\":\"中央社-科技\",\"url\":\"https://www.cna.com.tw/news/ait/202611100194.aspx\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"中央社-科技\"],\"glossary\":[{\"term\":{\"en\":\"Meta\",\"zh-TW\":\"Meta\"},\"blurb\":{\"en\":\"The company behind Facebook, Instagram, and WhatsApp, rolling out the detection.\",\"zh-TW\":\"推出本偵測技術的公司，旗下有 Facebook、Instagram 與 WhatsApp。\"}},{\"term\":{\"en\":\"Age detection\",\"zh-TW\":\"年齡偵測\"},\"blurb\":{\"en\":\"AI technology that estimates whether an account belongs to a teen.\",\"zh-TW\":\"以人工智慧判斷帳號是否屬於青少年的技術。\"}},{\"term\":{\"en\":\"Age-appropriate protection\",\"zh-TW\":\"適齡保護\"},\"blurb\":{\"en\":\"Safety limits and settings matched to a user's age.\",\"zh-TW\":\"依使用者年齡提供的相應安全限制與設定。\"}},{\"term\":{\"en\":\"Teen users\",\"zh-TW\":\"青少年用戶\"},\"blurb\":{\"en\":\"Users under 18 who are meant to be covered by the protections.\",\"zh-TW\":\"應受保護機制涵蓋的未滿 18 歲使用者。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-T
