ter Anthropic's pledge, countered on X by proposing SpaceX shares for children instead.\nWhat happened\nAhead of a possible blockbuster stock market listing, Anthropic pledged to create a public benefit fund, putting five percent of its shares into it. The fund would also look into direct payments to workers at risk of losing their jobs — which The Decoder notes goes further than Anthropic's competitors. Because the fund is a company-owned LLC, Anthropic keeps control of it as a possible IPO approaches. Musk's announcement came after Anthropic's pledge; per The Decoder's headline he counters with SpaceX shares for children, and on X he said the company should just give — the snippet cuts off there. The BBC's headline frames both moves as 'public share giveaways.'\nWhy it matters\nTwo rival visions of AI prosperity-sharing are colliding: a lab-controlled fund with a worker-safety-net mandate versus Musk's direct-to-children equity idea. The LLC structure is the detail to watch — Anthropic retains control, which blunts the 'public benefit' framing.\nSources agree / disagree\nBBC Technology and The Decoder agree on the core pledge (5%, direct payments, IPO timing). Musk's counter-proposal is thinly detailed in the available snippets.\nStill uncertain\nThe fund's mechanics, payout criteria, and Musk's full proposal are not in the snippets. Verify on the publisher pages before quoting terms."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-tech-01-anthropic-plans-fund-for\",\"category\":\"tech\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-tech-01-anthropic-plans-fund-for.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Anthropic plans fund for workers threatened by AI, Musk counters with SpaceX shares for children\",\"zh-TW\":\"相關封面圖：人類計畫為受人工智慧威脅的工人提供基金，馬斯克以 SpaceX 股票為兒童反擊\"},\"publishedAt\":\"2026-10-19T11:19:12.000Z\",\"title\":{\"en\":\"Anthropic Pledges 5% Share Fund for AI-Displaced Workers; Musk Counters With SpaceX Shares for Children\",\"zh-TW\":\"Anthropic 承諾撥 5% 股權成立基金協助受 AI 衝擊勞工；馬斯克（Elon Musk）以 SpaceX 股票給兒童回應\"},\"summary\":{\"en\":\"Anthropic pledged to create a public benefit fund ahead of a possible IPO, putting 5% of its shares into a company-owned LLC that would also explore direct payments to workers at risk of job loss. Elon Musk countered on X, proposing SpaceX shares for children instead.\",\"zh-TW\":\"Anthropic 承諾在可能 IPO 前成立公益基金，將 5% 股權注入公司持有的 LLC，並研議直接補助失業風險勞工。馬斯克（Elon Musk）則在 X 回應，主張以 SpaceX 股票給兒童。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"Anthropic 承諾將 5% 股權注入新成立的公益基金——架構為公司持有的 LLC——該基金還將研議直接補助受 AI 衝擊的失業風險勞工。馬斯克（Elon Musk）在 Anthropic 宣布後跟進，於 X 平台提議改發 SpaceX 股票給兒童。\\n發生了什麼事\\n在可能的重磅上市前，Anthropic 承諾成立公益基金，注入 5% 股權；基金還將研究直接補助面臨失業風險的勞工——The Decoder 指出這比競爭對手走得更遠。由於基金是公司持有的 LLC，Anthropic 在 IPO 逼近之際仍保有控制權。馬斯克的宣布緊隨其後：據 The Decoder 標題，他以「SpaceX 股票給兒童」回應，並在 X 表示公司應該直接給予——摘要在此截斷。BBC 的標題則把雙方動作定調為「公開送股」。\\n為什麼重要\\n兩種 AI 繁榮分配願景正在對撞：實驗室主導、附帶勞工安全網的基金，vs. 馬斯克「直接給兒童股票」的構想。LLC 架構是關鍵細節——Anthropic 保有控制權，讓「公益」成色打了折扣。\\n來源異同\\nBBC 與 The Decoder 對核心承諾（5%、直接補助、IPO 時機）報導一致；馬斯克反提案在現有摘要中細節不足。\\n仍不確定\\n基金運作機制、補助標準與馬斯克完整提案都不在摘要中；引用條款前請查閱原文。\"},\"sources\":[{\"name\":\"BBC Technology\",\"url\":\"https://www.bbc.co.uk/news/articles/cm2kez327gdko?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"The Decoder\",\"url\":\"https://the-decoder.com/anthropic-plans-fund-for-workers-threatened-by-ai-musk-counters-with-spacex-shares-for-children/\"}],\"disagreements\":null,\"trustScore\":62,\"trustBreakdown\":{\"sourceDiversity\":13,\"outletReputation\":10,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"tech\",\"live-ingest\",\"bbc-technology\",\"the-decoder\"],\"glossary\":[{\"term\":{\"en\":\"Anthropic\",\"zh-TW\":\"Anthropic\"},\"blurb\":{\"en\":\"AI lab behind Claude, pledging the 5% public benefit fund.\",\"zh-TW\":\"承諾成立 5% 公益基金的 AI 實驗室，Claude 開發商。\"}},{\"term\":{\"en\":\"Elon Musk\",\"zh-TW\":\"馬斯克\"},\"blurb\":{\"en\":\"Founder of SpaceX and xAI, c
