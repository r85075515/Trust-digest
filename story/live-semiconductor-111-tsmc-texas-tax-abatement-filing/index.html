omptroller of Public Accounts for a property tax abatement under the state's Jobs, Energy, Technology and Innovation (JETI) program. According to filings cited by Reuters and Focus Taiwan, the proposed project in Brazos County, Texas, involves a potential US$22.6 billion investment to construct an advanced wafer facility utilizing TSMC's 2-nanometer or more advanced process technologies to manufacture chips for artificial intelligence, high-performance computing, and mobile devices. The filing notes the project could secure a site of over 3,200 acres and create up to 2,099 direct jobs over 40 years.\n\nThe filing signals that TSMC is actively exploring geographic diversification within the United States beyond its existing manufacturing hub in Phoenix, Arizona, where its first fab entered commercial production in late 2024 and its second 3nm fab is slated for mass production in the third quarter of 2027. In its application, TSMC indicated that securing the property tax abatement is a determinative factor in the financial feasibility of building a multi-billion-dollar advanced fabrication plant in Texas.\n\nFocus Taiwan, Taipei Times, Reuters, and ChosunBiz align on the core parameters of the application, including the US$22.6 billion figure, Brazos County location, 2-nanometer-class technology scope, and the 2,099 direct job estimate. While media reports highlighted the scale of the proposed facility rivaling Samsung's Texas footprint, TSMC's official statement emphasized that the filing was made to keep local authorities informed and that no final investment decision has been reached.\n\nWhether the Texas Comptroller and local authorities will approve the JETI tax abatement, when TSMC's board will make a final capital expenditure decision, and the exact construction or mass-production timeline for the Brazos County site remain unconfirmed.\n\nTrust label: Multi-source agreement — Corporate confirmation from TSMC and regulatory filing details reported consistently across Reuters, Focus Taiwan, and Taipei Times."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-111-tsmc-texas-tax-abatement-filing\",\"category\":\"semiconductor\",\"title\":{\"en\":\"TSMC Confirms Texas Property Tax Abatement Filing for Potential $22.6B Fab\",\"zh-TW\":\"台積電證實遞交德州財產稅減免申請 評估斥資 226 億美元設廠\"},\"summary\":{\"en\":\"Taiwan Semiconductor Manufacturing Co. (TSMC) confirmed it applied for a property tax abatement in Brazos County, Texas, under the state's JETI program for a proposed $22.6 billion advanced chip fab. Takeaway: TSMC stresses the investment remains under evaluation, making tax incentives a decisive factor for potential U.S. expansion.\",\"zh-TW\":\"台積電（TSMC）證實已向德州審計長辦公室提出「就業、能源、技術與創新（JETI）」計畫財產稅減免申請，針對布拉索斯郡（Brazos County）擬議投資 226 億美元的先進晶圓廠案展開評估。一句重點結論：台積電強調投資案仍在評估階段，德州租稅優惠將成為是否拍板設廠的關鍵條件。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n台積電（TSMC）證實已依德州「就業、能源、技術與創新（JETI）」計畫，向德州審計長辦公室（Texas Comptroller of Public Accounts）遞交財產稅減免申請。根據路透社（Reuters）與中央社（Focus Taiwan）引述的申請文件，該擬議案位於德州布拉索斯郡（Brazos County），潛在投資金額達 226 億美元，規劃採用 2 奈米或更先進製程生產人工智慧（AI）、高效能運算與行動裝置晶片，並估計在未來 40 年內創造多達 2,099 個直接就業機會。\\n\\n「為什麼重要」\\n此舉顯示台積電在亞利桑那州鳳凰城廠區之外，正積極評估美國本土的跨州產能布局。台積電在申請書中指出，能否取得財產稅減免將是決定該項 226 億美元投資案是否推進的關鍵因素；若最終拍板，將進一步擴大美國境內的先進邏輯晶片製造版圖。\\n\\n「來源異同」\\n中央社、台北時報（Taipei Times）、路透社與朝鮮日報英文版對投資金額 226 億美元、設廠地點布拉索斯郡、2 奈米級製程及 2,099 個直接職缺等核心數據報導一致。部分外媒從美韓晶圓代工競爭角度切入，台積電官方聲明則著重強調遞件是為讓地方政府掌握進度，投資計畫仍處於評估階段。\\n\\n「仍不確定」\\n德州政府與地方當局是否核准該項財產稅減免、台積電董事會何時做出最終投資決議，以及若核准後的動工與量產時程，目前均尚未確定。\"},\"glossary\":[{\"term\":{\"en\":\"Property Tax Abatement\",\"zh-TW\":\"財產稅減免\"},\"blurb\":{\"en\":\"A temporary reduction or elimination of local property taxes granted by state or local governments to attract large-scale capital investments.\",\"zh-TW\":\"州或地方政府為吸引大型資本投資與創造就業，對企業新建設施提供一定年限的地方財產稅減免優惠。\"}},{\"term\":{\"en\":\"2-Nanometer Process\",\"zh-TW\":\"2 奈米製程\"},\"blurb\":{\"en\":\"TSMC's leading-edge semiconductor manufacturing node offering higher transistor density, faster speed, and lower power consumption for AI and HPC chips.\",\"zh-TW\":\"台積電最先進的商用半導體製造技術世代，可為人工智慧與高效能運算晶片提供更高電晶體密度與更低功耗。\"}},{\"term\":{\"en\":\"JETI Program\",\"zh-TW\":\"德州就業、能源、技術與創新計畫\"},\"blurb\":{\"en\":\"Texas's Jobs, Energy, Technology and Innovation economic incentive framework offering school district property tax limitations for qualifying projects.\",\"zh-TW\":\"德州政府設立的經濟激勵法案框架，針對符合投資與就業門檻的大型製造與能源專案提供學區財產稅上限優惠。\"}}],\"sources\":[{\"name\":\"Focus Taiwan (CNA)\",\"url\":\"https://focustaiwan.tw/business/202611250007\"},{\"name\":\"Taipei Times\",\"url\":\"https://www.taipeitimes.com/News/biz/archives/2026/11/26/2003868388\"},{\"name\":\"Manufacturing Dive\",\"url\":\"https://www.manufacturingdive.com/news/tsmc-proposes-226b-advanced-wafer-fab-texas-AI-semiconductors/875671/\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"TSMC corporate headquarters and semiconductor wafer fabrication facility\",\"zh-TW\":\"台積電企業總部與先進晶圓製造廠外觀\"},\"isHeadline\":true,\"isPopular\":true,\"trustScore\":91,\"trustBreakdown\":{\"crossCorroboration\":24,\"outletReputation\":23,\"recencyClarity\":22,\"sourceDiversity\":22},\"publishedAt\":\"2026-11-27T16:08:57.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":5,\"D2\":5,\"D3\":5,\"D4\":4,\"D5\":5,\"total\":24},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-semiconductor-111-tsmc-texas-tax-abatement-filing/\"}],[\"$\",\"meta\",\"3\",{\"pr
