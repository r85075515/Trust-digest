rategic Studies (IISS) finds that Iran has maintained a steady tempo of covert operations across Europe despite frequent arrests and disruptions by European security services. According to the study, European authorities foiled and arrested suspects in roughly half of all recorded incidents, yet Tehran continued recruiting criminal proxies and executing intimidation and assassination plots.\n\nThe findings underscore persistent counterintelligence vulnerabilities across European jurisdictions and highlight how reliance on local criminal networks lowers operational costs and insulates Iranian state agencies from direct diplomatic fallout.\n\nThe official IISS press summary and coverage by Iran International both highlight the 50% disruption rate and the conclusion that arrests alone have failed to deter ongoing activity.\n\nDetailed case-by-case attribution for still-classified intelligence operations and potential coordinated EU sanctions or terrorist designations in response to the findings remain unconfirmed.\n\nTrust label: Official statement — Findings are directly verified against the published IISS research announcement and corroborated by international security reporting."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-099-iiss-report-iran-covert-operations-europe\",\"category\":\"international\",\"title\":{\"en\":\"Iran Maintains Steady Pace of Covert Operations in Europe Despite Arrests, IISS Report Finds\",\"zh-TW\":\"國際戰略研究所報告：儘管頻遭破獲逮捕 伊朗在歐洲秘密行動仍維持穩定頻率\"},\"summary\":{\"en\":\"A new International Institute for Strategic Studies (IISS) paper finds that Iran has sustained a steady rate of covert plotting and intimidation operations across Europe even though European authorities disrupted roughly half of recorded incidents.\",\"zh-TW\":\"英國智庫國際戰略研究所（IISS）發布最新研究報告指出，儘管歐洲各國執法機構已成功攔截並逮捕約半數紀錄在案的涉案人員，伊朗在歐洲境內針對異議人士與猶太目標的秘密滲透、恐嚇及暗殺策劃仍維持穩定頻率，顯示傳統反制手段尚未形成足夠嚇阻力。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」總部位於倫敦的知名智庫國際戰略研究所（IISS）發表最新專題研究報告指出，儘管歐洲各國情報與執法單位頻繁展開逮捕行動，伊朗在歐洲大陸的秘密行動仍維持穩定發生頻率。報告統計顯示，歐洲當局雖已成功攔截並逮捕約半數紀錄在案的行動涉案人，但德黑蘭方面並未因此收手。\\n\\n「為什麼重要」報告揭示伊朗安全機構近年廣泛外包當地犯罪集團執行監視、縱火、恐嚇與暗殺任務，大幅降低行動成本並製造「可推諉性」。這項趨勢對歐洲跨國反情報協作構成嚴峻考驗，也顯示單靠個案警務逮捕已不足以改變其戰略盤算。\\n\\n「來源異同」IISS 官方新聞摘要與伊朗國際電視台（Iran International）在 11 月 27 日的報導在核心數據（約半數案件遭破獲逮捕）及主要結論（逮捕未遏止行動頻率）上完全一致，無事實分歧。\\n\\n「仍不確定」歐洲各國尚未公開的機密反情報案件細節，以及歐盟成員國是否會依據該報告進一步推動將伊朗革命衛隊列入恐怖組織名單或祭出新一輪制裁，仍有待各國政府後續決策。\\n\\nTrust label: Official statement — Findings are directly verified against the published IISS research announcement and corroborated by international security reporting.\"},\"glossary\":[{\"term\":{\"en\":\"International Institute for Strategic Studies (IISS)\",\"zh-TW\":\"國際戰略研究所（IISS）\"},\"blurb\":{\"en\":\"A prominent London-based global security and defense think tank known for publishing 'The Military Balance' and organizing the Shangri-La Dialogue.\",\"zh-TW\":\"總部位於英國倫敦的全球權威國防與安全智庫，以出版《軍事平衡》年報及主辦香格里拉對話聞名。\"}},{\"term\":{\"en\":\"Criminal Proxy\",\"zh-TW\":\"犯罪代理人\"},\"blurb\":{\"en\":\"Local organized crime networks hired by state intelligence services to carry out covert attacks or intimidation while obscuring state attribution.\",\"zh-TW\":\"遭國家情報機構僱用執行秘密襲擊、縱火或恐嚇任務的當地黑幫或犯罪網絡，藉以掩飾幕後國家指使痕跡。\"}},{\"term\":{\"en\":\"Plausible Deniability\",\"zh-TW\":\"可推諉性（合理否認權）\"},\"blurb\":{\"en\":\"A structure in which senior officials or states can credibly deny responsibility for covert actions carried out by indirect intermediaries.\",\"zh-TW\":\"透過中間人或非官方代理人執行秘密行動，使幕後主使國在事發後得以否認直接涉案的策略設計。\"}}],\"sources\":[{\"name\":\"International Institute for Strategic Studies (IISS)\",\"url\":\"https://www.iiss.org/press/2026/11/iiss-paper-finds-iran-has-sustained-operations-in-europe-despite-frequent-arrests/\"},{\"name\":\"Iran International\",\"url\":\"https://www.iranintl.com/en/202611270083\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"IISS report analyzing Iranian covert security operations in Europe\",\"zh-TW\":\"國際戰略研究所（IISS）分析伊朗在歐洲秘密安全行動報告\"},\
