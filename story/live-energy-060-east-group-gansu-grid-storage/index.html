in Wuwei, Gansu Province, according to industry dispatches published between November 25 and November 27, 2026. Engineered for four-hour discharge duration, the installation operates as an independent grid-scale storage asset at the Jiuduntan photovoltaic and renewable energy base.\n\nGansu is a major hub for China's desert wind and solar generation, where multi-hour grid-scale battery storage is critical to absorbing midday solar surpluses and preventing renewable curtailment.\n\nTaiyangNews's November 27 China solar and storage briefing and APAC BESS's November 25 daily brief both confirm the 200 MW / 800 MWh capacity rating, the Jiuduntan project location, and standalone grid-connection status. EnergyTrend additionally situates the Jiuduntan project within a broader late-November wave of more than 3.8 GWh in Chinese energy storage equipment orders and deployments.\n\nExact battery cell suppliers, project capital expenditure figures, and ancillary grid-service tariff revenues for the Wuwei station have not been publicly itemized.\n\nTrust label: Multi-source agreement — TaiyangNews, APAC BESS, and EnergyTrend confirm the 200 MW / 800 MWh Jiuduntan grid connection."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-energy-060-east-group-gansu-grid-storage\",\"category\":\"energy\",\"title\":{\"en\":\"EAST Group Connects 200 MW / 800 MWh Standalone Energy Storage Project to Grid in Gansu\",\"zh-TW\":\"易事特甘肅武威 200 MW / 800 MWh 獨立儲能電站正式併網 強化西北綠電調峰\"},\"summary\":{\"en\":\"Power electronics manufacturer EAST Group has grid-connected its 200 MW / 800 MWh Jiuduntan standalone battery energy storage project in Wuwei, Gansu Province, according to industry reports published November 25–27, 2026. The four-hour utility-scale storage facility supports grid peak shaving and renewable energy integration in northwest China.\",\"zh-TW\":\"根據 2026 年 11 月 25 日至 27 日能源產業報導，電力電子與儲能設備商易事特（EAST Group）位於甘肅武威九墩灘的 200 MW / 800 MWh 獨立儲能電站已正式併網運行。該座 4 小時長時儲能設施將為中國西北高比例風光新能源基地提供電網調峰與消納支撐。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n根據 2026 年 11 月 25 日至 27 日多家國際能源產業媒體報導，中國電力電子與儲能製造商易事特（EAST Group）位於甘肅省武威市九墩灘光電園區的 200 MW / 800 MWh 獨立儲能專案已正式完成併網。該設施具備 4 小時連續充放電能力，屬於大型電網側獨立儲能電站。\\n「為什麼重要」\\n甘肅河西走廊是中國風電與太陽能發電重鎮，白天光電出力高峰極易造成棄光限電；百兆瓦等級的四小時長時儲能電站併網，可有效執行削峰填谷與電網調頻，提升西北綠電外送與消納穩定度。\\n「來源異同」\\n《TaiyangNews》11 月 27 日中國太陽能與儲能快訊及《APAC BESS》儲能資料庫日報均一致確認該專案 200 MW / 800 MWh 規模、甘肅武威九墩灘場址及獨立儲能併網狀態；《EnergyTrend》則進一步將該案納入 11 月下旬中國合計逾 3.8 GWh 儲能專案與設備招標進展中。\\n「仍不確定」\\n九墩灘儲能電站的具體電芯供應商型號、總投資金額及參與電力現貨與輔助服務市場的收益結算機制，目前尚未對外披露。\"},\"glossary\":[{\"term\":{\"en\":\"Standalone Energy Storage\",\"zh-TW\":\"獨立儲能電站\"},\"blurb\":{\"en\":\"A utility-scale battery facility connected directly to the transmission grid as an independent market entity rather than being tied to a single power plant.\",\"zh-TW\":\"直接接入公共電網並以獨立市場主體身分參與調度與交易的大型電池儲能設施，不依附於單一發電廠。\"}},{\"term\":{\"en\":\"200 MW / 800 MWh\",\"zh-TW\":\"200 兆瓦／800 兆瓦時\"},\"blurb\":{\"en\":\"Power and energy capacity ratings indicating the system can deliver 200 megawatts of output continuously for four hours (800 megawatt-hours total).\",\"zh-TW\":\"儲能系統的功率與容量規格，代表該電站可按 200 兆瓦滿載功率連續放電 4 小時，總儲電量達 800 兆瓦時。\"}},{\"term\":{\"en\":\"Peak Shaving\",\"zh-TW\":\"削峰填谷\"},\"blurb\":{\"en\":\"Charging batteries during periods of excess renewable generation or low demand and discharging during peak electricity consumption hours.\",\"zh-TW\":\"在綠電發電過剩或用電低谷時充電儲存，並於用電尖峰時段放電供應電網的電力調節機制。\"}}],\"sources\":[{\"name\":\"TaiyangNews\",\"url\":\"https://taiyangnews.info/markets/china-solar-pv-news-snippets-november-27-2026\"},{\"name\":\"APAC BESS\",\"url\":\"https://apacbess.com/brief/2026-11-25\"},{\"name\":\"EnergyTrend\",\"url\":\"https://www.energytrend.com/news/20261124-52597.html\"}],\"imageUrl\":\"/covers/live/live-energy-060-east-group-gansu-grid-storage.webp\",\"imageAlt\":{\"en\":\"Utility-scale containerized battery energy storage facility connected to high-voltage grid lines\",\"zh-TW\":\"連接高壓輸電線路的大
