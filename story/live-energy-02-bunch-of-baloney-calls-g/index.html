n which the summit system itself is now being challenged.\nWhy it matters\nThe criticism is aimed at the process, not only at individual governments. Reform calls imply that the summit structure, which critics say allows a single participant to stall progress, is part of why promises to halt the destruction of the natural world go unmet. If governments continue a record of never having met a target, the credibility of setting further targets through the same summits is at stake. That is why the closing of COP17 is being reported less as a conclusion than as a trigger for debate over how these UN biodiversity summits should be reformed.\nSources agree / disagree\nThis cluster rests on a single outlet, The Guardian Climate Crisis, with one feed item. No second source in the cluster confirms the reform calls or the assessment that countries are on track to fail their nature targets, and no numeric or name conflicts were detected in the short snippet.\nTrust label: Single source — Only one outlet and one feed item support this account, so it has not been corroborated within this cluster.\nStill uncertain\nThe snippet is cut off mid-sentence and does not specify which reforms are being proposed, which countries or critics are making the calls, or which targets are about to be missed. It also does not report any formal decision taken at the summit. Feed descriptions can omit context, updates, or corrections, so the full Guardian report is needed for the complete picture."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-energy-02-bunch-of-baloney-calls-g\",\"category\":\"energy\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-energy-02-bunch-of-baloney-calls-g.jpg\",\"imageAlt\":{\"en\":\"Cover related to: ‘Bunch of baloney’: calls grow for Cop summit reforms as countries on track to fail nature targets\",\"zh-TW\":\"相關封面圖：「一派胡言」：隨著各國未能實現自然目標，要求締約方會議改革的呼聲越來越高\"},\"publishedAt\":\"2026-10-31T12:30:06.000Z\",\"title\":{\"en\":\"COP17 closes amid growing calls to reform UN biodiversity summits\",\"zh-TW\":\"第十七屆締約方會議（COP17）閉幕，改革聯合國生物多樣性峰會呼聲升高\"},\"summary\":{\"en\":\"COP17, the UN biodiversity summit focused on protecting nature and restoring ecosystems, concludes on Saturday with critics calling the process a bunch of baloney. Calls are growing for major reforms as countries fail to deliver on promises to halt the destruction of the natural world.\",\"zh-TW\":\"以保護自然與恢復生態系統為主題的第十七屆締約方會議（COP17）於週六閉幕，批評者直指流程荒謬。隨著各國未能履行阻止自然世界毀壞的承諾，要求大幅改革聯合國生物多樣性峰會的呼聲日益升高。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"以保護自然與恢復生態系統為主題的第十七屆締約方會議（COP17）於週六閉幕，批評者斥其流程荒謬，並稱此制度讓單一個人就能阻礙進展。\\n發生了什麼事\\n要求大幅改革聯合國生物多樣性峰會的呼聲日益升高。報導指出，各國未能履行阻止自然世界毀壞的承諾；依報導，各國政府可能延續從未達成任何目標的紀錄。本屆峰會第十七屆締約方會議（COP17）於週六結束，其主題正是保護自然與恢復生態系統，而批評者認為履約落後、且峰會制度本身如今也受到挑戰的，正是這些領域。\\n為什麼重要\\n批評指向的是流程，而非僅是個別政府。改革呼聲意味著峰會結構本身是承諾無法兌現的原因之一，批評者稱此結構讓單一參與者即可拖住進展。若各國延續從未達成目標的紀錄，透過同一套峰會再訂新目標的可信度將受質疑。因此，本屆會議閉幕被報導為改革辯論的引爆點，而不只是一次會議的結束。\\n來源異同\\n本組僅有單一媒體、單則來源，沒有第二個來源可印證改革呼聲，或各國正走向無法達成自然目標的評估；短摘要中亦未發現數字或名稱衝突。\\n仍不確定\\n摘要在句子中途截斷，未說明提出哪些改革、由哪些國家或批評者提出，也未指明哪些目標即將落空，亦未報導峰會作出的任何正式決定。摘要可能遺漏背景與更新，完整面貌須查閱原報導全文。\"},\"sources\":[{\"name\":\"The Guardian Climate Crisis\",\"url\":\"https://www.theguardian.com/environment/2026/oct/31/cop17-reforms-fails-to-deliver-targets\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"energy\",\"live-ingest\",\"the-guardian-climate-crisis\"],\"glossary\":[{\"term\":{\"en\":\"COP17\",\"zh-TW\":\"第十七屆締約方會議（COP17）\"},\"blurb\":{\"en\":\"COP17 is the UN biodiversity summit, focused on protecting nature and restoring ecosystems, that concludes on Saturday.\",\"zh-TW\":\"第十七屆締約方會議（COP17）是於週六閉幕、以保護自然與恢復生態系統為主題的聯合國生物多樣性峰會。\"}},{\"term\":{\"en\":\"UN biodiversity summits\",\"zh-TW\":\"聯合國生物多樣性峰會\"},\"blurb\":{\"en\":\"UN biodiversity summits are the meetings critics want to see undergo major reforms.\"
