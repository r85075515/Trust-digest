g to a Reuters report on November 27, 2026, citing three people familiar with the incident. The intrusion disrupted operations across the platform, revoking some users' administrative rights, pausing back-office system migrations, and blocking updates to applications already running on Cloud One—leaving personnel unable to apply software fixes. Cloud One serves as a central IT hub supporting personnel, logistics, and weapons-tracking applications for the Air Force.\n\nThe breach directly affects operational software maintenance within a core U.S. military cloud infrastructure, raising security concerns over tactical, personnel, and logistics systems hosted on the platform. Blocking application updates during active software vulnerability cycles increases exposure until full administrative control and patching pipelines are restored.\n\nReuters, The Guardian, Forbes, Military Times, and The Times of Israel consistently report the core details from Reuters' exclusive, including the Cloud One platform target, blocked application updates, and revoked administrative privileges. In an official statement to Reuters, the U.S. Air Force declined to comment on the security posture, vulnerabilities, or operational status of specific networks and systems.\n\nThe identity or state affiliation of the threat actors, the full technical scope of the intrusion, and whether sensitive military data was exfiltrated remain unconfirmed.\n\nTrust label: Multi-source agreement — Reuters exclusive corroborated across The Guardian, Forbes, and Military Times, with Air Force non-comment noted."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-tech-116-hackers-breach-us-air-force-cloud-one-platform\",\"category\":\"tech\",\"title\":{\"en\":\"Hackers Breach U.S. Air Force's Flagship Cloud One Computing Platform\",\"zh-TW\":\"駭客入侵美國空軍旗艦雲端平台 Cloud One 應用程式修補一度受阻\"},\"summary\":{\"en\":\"Hackers breached Cloud One, the U.S. Air Force's flagship cloud computing platform supporting personnel, logistics, and weapons-tracking systems, disrupting application updates and revoking some users' administrative rights. Takeaway: The intrusion prevented Air Force personnel from deploying security fixes on running applications, prompting a Pentagon cyber investigation.\",\"zh-TW\":\"路透社引述三名知情人士報導，駭客成功入侵支援美國空軍人事、後勤與武器追蹤系統的旗艦雲端運算平台「Cloud One」，導致部分管理員權限遭撤銷、後台系統遷移暫停，且線上應用程式更新受阻。一句重點結論：此次入侵使空軍人員一度無法為既有應用程式部署安全修補程式，美軍網戰單位已介入評估損害。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n根據路透社（Reuters）於 2026 年 11 月 27 日引述三名知情人士的獨家報導，駭客成功入侵美國空軍旗艦雲端運算平台「Cloud One」。這起入侵事件在平台內部造成運作中斷，不僅導致部分使用者的管理員權限遭到撤銷、後台系統遷移作業被迫暫停，更阻斷了既有線上應用程式的更新功能，使空軍技術人員無法部署軟體修補程式。\\n\\n「為什麼重要」\\nCloud One 是美國空軍的核心資訊樞紐，承載多項人事管理、後勤補給與武器追蹤等關鍵任務系統。駭客行動直接癱瘓應用程式修補通道，使軍事雲端環境暴露於軟體漏洞風險之中，也凸顯國防級雲端基礎設施面臨的網路安全威脅。\\n\\n「來源異同」\\n路透社、《衛報》（The Guardian）、《富比士》（Forbes）、《軍事時報》（Military Times）與《以色列時報》（The Times of Israel）均引述路透社報導，對 Cloud One 平台遭駭、應用程式更新受阻及管理權限遭撤銷等核心細節描述一致。美國空軍官方回應路透社詢問時則表示，不對特定網路與系統的安全態勢、漏洞或運作狀態發表評論。\\n\\n「仍不確定」\\n發動此次攻擊的駭客身分或背後是否涉及特定國家行為者、入侵滲透的完整技術範圍，以及平台內的敏感軍事或人事資料是否已遭竊取，目前均尚未獲得官方證實。\"},\"glossary\":[{\"term\":{\"en\":\"Cloud One\",\"zh-TW\":\"Cloud One 雲端平台\"},\"blurb\":{\"en\":\"The U.S. Air Force's enterprise cloud computing environment designed to host mission-critical personnel, logistics, and operational applications.\",\"zh-TW\":\"美國空軍建置的企業級雲端運算環境，作為承載人事、後勤與武器追蹤等關鍵軍事應用程式的核心資訊樞紐。\"}},{\"term\":{\"en\":\"Administrative Rights\",\"zh-TW\":\"系統管理員權限\"},\"blurb\":{\"en\":\"Elevated system privileges allowing authorized personnel to configure networks, manage user access, and install software patches.\",\"zh-TW\":\"允許授權人員變更系統設定、管理帳號存取與部署安全更新的高階操作權限。\"}},{\"term\":{\"en\":\"Data Exfiltration\",\"zh-TW\":\"資料外洩（滲出）\"},\"blurb\":{\"en\":\"The unauthorized transfer or copying of sensitive information from a compromised computer system or cloud network.\",\"zh-TW\":\"未經授權將機密資訊從遭入侵的電腦系統或雲端網路中複製或傳輸出去的網路攻擊行為。\"}}],\"sources\":[{\"name\":\"The Guardian\",\"url\":\"https://www.theguardian.com/technology/2026/nov/27/hackers-breach-us-air-force-cloud-computing\"},{\"name\":\"Military Times\",\"url\":\"https://www.militarytimes.com/news/your-military/2026/11/27/hackers-breach-us-air-force-flagship-cloud-one-computing-platform/\"},{\"name\":\"Forbes\",\"url\":\"https://www.forbes.com/sites/saradorn/2026/11/27/air-forces-cloud-one-platform-hacked-report-says/\"}],\"imageUrl\":\"/covers/live/live-tech-116-hackers-breach-us-air-force-cloud-one-platform.jpg\",\"imageAlt\":{\"en\":\"Cybersecurity alert representing a cloud network breach\",\"zh-TW\":\"代表軍事雲端網路遭駭客入侵的資安警示畫面\"},\"isHeadline\":true,\"isPopular\":true,\"trustScore\":89,\"trustBreakdown\":{\"crossCorroboration\":23,\"outletReputation\":23,\"recencyClarity\":22,\"sourceDiversity\":21},\"publishedAt\":\"2026-11-27T16:08:57.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":5,\"D2\":5,\"D3\":5,\"D4\":4,\"D5\":5,\"total\":24},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-tech-116-hackers-breach-us-air-force-cloud-one-platform/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-tech-116-hackers-breach-us-air-force-c
