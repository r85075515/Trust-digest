he pause on the permit. The blast is planned for Wednesday morning at around 9:00 a.m. CST.\nWhat happened\nThe Army intends to detonate the nation's stockpile of lead azide, a highly volatile explosive used in military munitions that has been deteriorating underground, at the Middletown plant on Wednesday morning. A federal appeals court lifted the pause on the permit to blow up the unstable bomb-making chemicals, clearing the last legal obstacle; the Army had argued it did not need permission in the first place. Officials sought to reassure residents on Tuesday that barriers have been placed around the blast zone to limit the plume from the detonation.\nWhy it matters\nThe choice is between two bad options: leave tons of degrading explosives in the ground, or set off a controlled blast that could send toxic lead dust across the area. The court decision settles the legal question, but the public-health question — how much lead dust escapes and where it lands — will only be answered after the blast and the monitoring that follows.\nSources agree / disagree\nThe Verge, PBS NewsHour, Inside Climate News, Mongabay and Grist all report the same plan and timing. The figures that look different are the same quantity in different units: nearly 10,000 pounds is five tons. Trust label: Multi-source agreement — five outlets agree on the core claims, with no substantive numeric conflict.\nStill uncertain\nThe snippets do not say how far the lead plume is expected to travel, what exposure thresholds officials are using, or how long air and soil monitoring will continue after the blast. Those details require the full reporting on the linked publisher pages."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-tech-01-court-decision-clears-wa\",\"category\":\"tech\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-tech-01-court-decision-clears-wa.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Court Decision Clears Way for Army to Detonate Lead Explosives in Iowa\",\"zh-TW\":\"相關封面圖：（譯文待補）Court Decision Clears Way for Army to Detonate Lead Explosives in Iowa\"},\"publishedAt\":\"2026-11-24T23:40:32.000Z\",\"title\":{\"en\":\"Court Clears Way for Army to Detonate Nearly 5 Tons of Lead Explosives in Iowa\",\"zh-TW\":\"法院放行：美軍將在愛荷華州引爆近 5 噸鉛炸藥\"},\"summary\":{\"en\":\"A federal appeals court has lifted the pause on the permit for the U.S. Army to detonate its stockpile of deteriorating lead azide at the Iowa Army Ammunition Plant in Middletown, with the blast planned for Wednesday morning around 9:00 a.m. CST. The Army calls a controlled detonation the safest disposal method, though residents fear toxic lead dust.\",\"zh-TW\":\"聯邦上訴法院解除暫停令，美軍得以按計畫於週三上午 9 時（中部時間）在愛荷華州米德爾敦陸軍彈藥廠引爆庫存的變質疊氮化鉛。軍方稱受控引爆是最安全的處置方式，但居民擔心有毒鉛塵擴散；官員稱已在爆區周圍設屏障、限制煙塵。下一步看引爆是否如期進行與事後監測結果。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"聯邦上訴法院解除許可暫停令後，美軍將按計畫於週三上午 9 時（中部時間）在愛荷華州米德爾敦陸軍彈藥廠引爆近 5 噸疊氮化鉛——也就是全美庫存，處置這批已在地下變質的高揮發性炸藥。\\n發生了什麼事\\n美軍計畫週三上午在米德爾敦彈藥廠引爆全國庫存的疊氮化鉛；這種用於軍用彈藥的化合物在地下不斷劣化。聯邦上訴法院解除了炸毀這批不穩定製爆化學品的許可暫停令，掃除最後法律障礙；軍方先前主張根本不需要許可。官員週二向居民保證，已在爆炸區周圍設置屏障、限制爆炸產生的煙塵擴散。\\n為什麼重要\\n這是兩害相權：放任數噸劣化炸藥留在地下，或引爆一次受控爆炸、但可能讓有毒鉛塵擴散。法院判決解決了法律問題，公共衛生問題——鉛塵會飄多遠、落在哪裡——要等引爆後與後續監測才有答案。\\n來源異同\\nThe Verge、PBS NewsHour、Inside Climate News、Mongabay 與 Grist 報導的計畫與時間一致。看似不同的數字其實是同一數量換算單位：近 10,000 磅就是 5 噸，沒有實質衝突。信任標籤：N源一致——五家媒體對核心事實說法一致。\\n仍不確定\\n片段未說明鉛塵預計擴散多遠、官方採用的暴露標準為何、引爆後空氣與土壤監測將持續多久，須看各家完整報導才能確認。\"},\"sources\":[{\"name\":\"The Verge\",\"url\":\"https://www.theverge.com/science/1041819/us-army-detonation-lead-explosives-iowa\"},{\"name\":\"PBS NewsHour\",\"url\":\"https://www.pbs.org/newshour/show/army-plans-explosive-detonation-in-iowa-despite-residents-concerns\"},{\"name\":\"Inside Climate News\",\"url\":\"https://insideclimatenews.org/news/23112026/iowa-army-lead-explosives-detonation/\"},{\"name\":\"Mongabay\",\"url\":\"https://news.mongabay.com/short-article/2026/11/army-entire-u-s-stockpile-of-lead-azide-is-at-iowa-plant-and-set-to-be-detonated-wednesday-morning/\"},{\"name\":\"Grist\",\"url\":\"https://grist.org/grist-news/what-to-know-about-the-armys-plan-to-detonate-5-tons-of-lead-in-iowa/\"}],\"disagreements\":null,\"trustScore\":81,\"trustBreakdown\":{\"sourceDiversity\":25,\"outletReputation\":14,\"crossCorroboration\":17,\"recencyClarity\":25},\"tags\":[\"tech\",\"live-ingest\",\"the-verge\",\"pbs-newshour\",\"inside-climate-news\"],\"glossary\":[{\"term\":{\"en\":\"Lead azide\",\"zh-TW\":\"疊氮化鉛\"},\"blurb\":{\"en\":\"Highly volatile explosive compound used in military munitions.\",\"zh-TW\":\"用於軍用彈藥的高揮發性爆炸化合物。\"}},{\"term\":{\"en\":\"Iowa Army Ammunition Plant\",\"zh-TW\":\"愛荷華陸軍彈藥廠\"},\"blurb\":{\"en\":\"Army munitions plant in Middletown, Iowa, holding the U.S. lead azide stockpile.\",\"zh-TW\":\"位於愛荷華州米德爾敦、存放全美疊氮化鉛庫存的陸軍彈藥廠。\"}},{\"term\":{\"en\":\"Middletown, Iowa\",\"zh-TW\":\"米德爾敦\"},\"blurb\":{\"en\":\"Town in southeast Iowa where the ammunition plant stands.\",\"zh-TW\":\"愛荷華州東南部小鎮，彈藥廠所在地。\"}},{\"term\":{\"en\":\"U.S. Army\",\"zh-TW\":\"美國陸軍\"},\"blurb\":{\"en\":\"Branch of the U.S. armed forces planning the detonation.\",\"zh-TW\":\"計畫引爆的美國武裝部隊軍種。\"}},{\"term\":{\"en\":\"Federal appeals court\",\"zh-TW\":\"聯邦上訴法院\"},\"blurb\":{\"en\":\"Court that lifted the pause on the detonation permit.\",\"zh-TW\":\"解除引爆許可暫停令的法院。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-tech-01-court-decision-clears-wa/\"}],[\"$\",\"meta\",\"3\",{\
