mber 27, 2026, Arizona State University defeated the University of Alaska Anchorage 8-7 in overtime. Alaska Anchorage forward 伊森·華納（Ethan Warrener） tied the score at 7-7 with 24 seconds remaining in the third period, before Arizona State capitalized on a power play 1:52 into overtime to seal the victory.\n\nWhy it matters\nThe win snaps a rough stretch for Arizona State (5-7-0) in front of its home crowd in Tempe and sets up a weekend series rematch on November 28. Despite allowing a season-high seven goals to Alaska Anchorage, the Sun Devils generated 51 shots on goal against 30 allowed and converted 1 of 4 power-play chances when it mattered most.\n\nSource differences\nThe University of Alaska Anchorage Athletics recap \"Hockey falls in overtime in Arizona\" provides detailed scoring sequences, coaching quotes from 艾瑞克·魯德（Eric Rud）, and shot totals (51-30 for ASU, 43 saves by 威廉·格拉姆（William Gramme）), while the official National Collegiate Hockey Conference box score \"Box Score - National Collegiate Hockey Conference\" and UAA's statistical sheet \"Men's Ice Hockey vs Arizona State University on 11/27/2026 | Box Score\" verify the 8-7 final score and overtime power-play finish.\n\nStill uncertain\nLineup adjustments and starting goaltender selections for the November 28 series finale between the two teams in Tempe have not yet been announced.\n\nTrust label: Official confirmation — Confirmed via official National Collegiate Hockey Conference box score records and university athletics game reports."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-entertainment-409-asu-hockey-overtime-win-alaska-anchorage\",\"category\":\"entertainment\",\"title\":{\"en\":\"Arizona State Men's Ice Hockey Edges Alaska Anchorage 8-7 in Overtime Thriller in Tempe\",\"zh-TW\":\"亞利桑那州大男冰延長賽多打少絕殺，主場 8 比 7 險勝阿拉斯加安克拉治\"},\"summary\":{\"en\":\"Arizona State University's men's ice hockey team defeated the University of Alaska Anchorage 8-7 in overtime
