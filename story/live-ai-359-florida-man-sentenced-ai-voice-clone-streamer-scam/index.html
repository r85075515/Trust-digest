t David Anthony Sanchez was sentenced by U.S. District Judge Melissa Damian to 47 months in federal prison and ordered to pay restitution to victims. Sanchez previously pleaded guilty to money laundering and aggravated identity theft after using artificial intelligence to impersonate a popular streamer in a 260,000 USD cryptocurrency fraud scheme.\n\nWhy it matters\nThe sentencing demonstrates that using artificial intelligence to impersonate online figures in cryptocurrency fraud carries severe federal prison penalties, criminal forfeiture or restitution obligations, and felony convictions for aggravated identity theft and money laundering.\n\nSource differences\nU.S. Department of Justice publishes \"Port St. Lucie Man Sentenced to 47 Months in Prison for Using AI to Impersonate Popular Streamer in $260,000 in Cryptocurrency Fraud Scheme\", detailing case number 26-cr-60089, defendant age 36 and Port St. Lucie residence, Judge Melissa Damian's 47-month sentence, guilty pleas to money laundering and aggravated identity theft, and restitution. LiveNOW from FOX publishes \"Florida man who used AI to impersonate popular online streamer to steal $260K sentenced to prison\", and Engadget publishes \"Man Sentenced To 47 Months In Prison After Using AI To Impersonate Streamer N3on\", both covering the prison sentence and cryptocurrency impersonation scheme.\n\nStill uncertain\nSpecific breakdown details of restitution disbursement schedules and any related co-conspirator proceedings beyond what is stated in the official release are not detailed here.\n\nTrust label: Official confirmation — Confirmed by the U.S. Department of Justice release for case 26-cr-60089 alongside coverage from LiveNOW from FOX and Engadget."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-ai-359-florida-man-sentenced-ai-voice-clone-streamer-scam\",\"category\":\"ai\",\"title\":{\"en\":\"Port St. Lucie Man Sentenced to 47 Months in Prison for Using AI to Impersonate Popular Streamer in $260,000 in Cryptocurrency Fraud Scheme\",\"zh-TW\":\"佛州聖露西港男子涉用 AI 冒充實況主進行 26 萬美元加密貨幣詐財案遭判刑 47 個月\"},\"summary\":{\"en\":\"In case 26-cr-60089, U.S. District Judge Melissa Damian sentenced 36-year-old Port St. Lucie resident David Anthony Sanchez to 47 months in federal prison and ordered victim restitution after he pleaded guilty to money laundering and aggravated identity theft for using AI to impersonate a streamer in a 260,000 USD cryptocurrency scheme.\",\"zh-TW\":\"在案號 26-cr-60089 案件中，36 歲佛州聖露西港居民大衛・安東尼・桑切斯（David Anthony Sanchez）因利用 AI 冒充實況主涉及 26 萬美元加密貨幣詐財，認罪洗錢與加重身分竊盜，遭聯邦法官梅麗莎・達米安（Melissa Damian）判處 47 個月監禁並須賠償受害者。此案顯示 AI 冒名詐騙已面臨聯邦重刑追訴。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n在聯邦案件（案號 26-cr-60089）中，36 歲的佛羅里達州聖露西港（Port St. Lucie）居民大衛・安東尼・桑切斯（David Anthony Sanchez），遭聯邦地方法官梅麗莎・達米安（Melissa Damian）判處 47 個月聯邦監禁，並被命令向受害者支付賠償。桑切斯先前已就洗錢與加重身分竊盜罪名認罪，其犯行涉及利用人工智慧（AI）冒充知名實況主進行 260,000 美元加密貨幣詐財計畫。\\n\\n「為什麼重要」\\n此項量刑結果顯示，在加密貨幣詐欺中使用人工智慧冒充網路人物將面臨嚴厲的聯邦監禁刑罰、賠償責任，以及加重身分竊盜與洗錢重罪定罪。\\n\\n「來源異同」\\nU.S. Department of Justice 發布「Port St. Lucie Man Sentenced to 47 Months in Prison for Using AI to Impersonate Popular Streamer in $260,000 in Cryptocurrency Fraud Scheme」，詳述案號 26-cr-60089、被告年齡 36 歲與聖露西港居住地、法官梅麗莎・達米安（Melissa Damian）判處的 47 個月刑期、洗錢與加重身分竊盜認罪內容及賠償命令。LiveNOW from FOX 發布「Florida man who used AI to impersonate popular online streamer to steal $260K sentenced to prison」，Engadget 發布「Man Sentenced To 47 Months In Prison After Using AI To Impersonate Streamer N3on」，兩者均報導該監禁判決與加密貨幣冒名詐財計畫。\\n\\n「仍不確定」\\n官方新聞稿所載以外的具體賠償撥付時程細節，以及任何相關共犯訴訟程序，並未在此處詳述。\\n\\nTrust label: Official confirmation — 經 U.S. Department of Justice 針對案號 26-cr-60089 發布之新聞稿證實，並有 LiveNOW from FOX 與 Engadget 報導佐證。\"},\"glossary\":[{\"term\":{\"en\":\"Aggravated Identity Theft\",\"zh-TW\":\"加重身分竊盜\"},\"blurb\":{\"en\":\"A federal offense involving unlawfully using another person's means of identification in connection with specified crimes.\",\"zh-TW\":\"在特定犯罪過程中不法使用他人身分識別資訊的聯邦罪名。\"}},{\"term\":{\"en\":\"Restitution\",\"zh-TW\":\"賠償（Restitution）\"},\"blurb\":{\"en\":\"Court-ordered payment by a defendant to compensate victims for financial losses caused by the offense.\",\"zh-TW\":\"由法院裁定被告支付，用以填補被害人因犯罪所受財物損失的賠償。\"}},{\"term\":{\"en\":\"Cryptocurrency Fraud Scheme\",\"zh-TW\":\"加密貨幣詐財計畫\"},\"blurb\":{\"en\":\"Deceptive conduct using digital assets or false representations to obtain funds or cryptocurrency from victims.\",\"zh-TW\":\"透過虛假陳述或數位資產手法向被害人詐取資金或加密貨幣的違犯行為。\"}}],\"sources\":[{\"name\":\"U.S. Department of Justice\",\"url\":\"https://www.justice.gov/usao-sdfl/pr/port-st-lucie-man-sentenced-47-months-prison-using-ai-impersonate-popular-streamer\"},{\"name\":\"LiveNOW from FOX\",\"url\":\"https://www.livenowfox.com/news/florida-man-who-used-ai-impersonate-popular-online-streamer-steal-260k-sentenced-prison\"},{\"name\":\"Engadget\",\"url\":\"https://www.engadget.com/2329150/man-sentenced-to-47-month-prison-sentence-after-using-ai-impersonate-streamer/\"}],\"imageUrl\":\"/covers/live/live-ai-359-florida-man-sentenced-ai-voice-clone-streamer-scam.jpg\",\"imageAlt\":{\"en\":\"Port St. Lucie Man Sentenced to 47 Months in Prison for Using AI to Impersonate Popular Streamer in $260,000 in Cryptocurrency Fraud Scheme\",\"zh-TW\":\"佛州聖露西港男子涉用 AI 冒充實況主進行 26 萬美元加密貨幣詐財案遭判刑 47 個月\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":91,\"trustBreakdown\":{\"crossCorroboration\":24,\"outletReputation\":24,\"recencyClarity\":22,\"sourceDiversity\":21},\"publishedAt\":\"2026-11-28T04:30:51.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":24,\"D2\":23,\"D3\":23,\"D4\":22,\"D5\":23,\"total\":23},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}
