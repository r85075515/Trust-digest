2026, on a murder charge in a domestic violence case. Prosecutors allege Chen ordered industrial-grade methanol online in November 2025, picked up the package at a convenience store, and poured the toxic chemical into a liquor bottle belonging to her husband, surnamed Liao, on November 13, 2025. After drinking the contaminated liquor the next day, Liao suffered dizziness, blurred vision, and cardiac arrest, with blood tests showing a methanol concentration of 308.5 milligrams per deciliter before he died on December 27, 2025.\n\nThe indictment highlights the forensic and digital trail used by investigators to uncover concealed domestic poisoning cases after an initial unexplained medical collapse. Police searched Chen's residence on August 8, 2026, seizing her mobile phone and uncovering e-commerce purchase records linking her to the methanol order, leading the Taichung District Court to order her detained incommunicado on August 10.\n\nReporting from Central News Agency (Focus Taiwan) and Taipei Times aligns on the timeline of the November 2025 poisoning, the victim's blood methanol level, the August 2026 search and detention order, and the November 25 indictment. Both outlets frame the alleged act of lacing liquor with industrial alcohol as an intentional act rather than accidental exposure, while noting the allegations await trial judgment.\n\nWhether the defendant has entered a formal plea or contested the forensic interpretation of the online purchase records in court remains unconfirmed pending trial proceedings.\n\nTrust label: Official statement — The indictment, detention order, and forensic findings are verified via prosecutorial disclosures reported by Focus Taiwan and Taipei Times."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-101-taichung-woman-indicted-methanol-poisoning\",\"category\":\"taiwan\",\"title\":{\"en\":\"Taichung Woman Indicted for Murder in Alleged Methanol Poisoning of Husband\",\"zh-TW\":\"台中婦人涉以工業甲醇毒殺丈夫遭檢方依殺人罪起訴\"},\"summary\":{\"en\":\"Prosecutors in Taichung indicted a 43-year-old woman on November 25, 2026, on a murder charge, alleging she poisoned her husband by lacing his liquor with industrial-grade methanol in November 2025. The victim died in December 2025 after suffering multiple organ failure, and the suspect remains detained incommunicado following an August 2026 police search.\",\"zh-TW\":\"台中地檢署於 2026 年 11 月 25 日依殺人罪起訴一名 43 歲陳姓女子，指控其於 2025 年 11 月網購工業級甲醇並摻入丈夫酒瓶中，導致丈夫飲用後多重器官衰竭死亡。被告已於 2026 年 8 月遭法院裁定羈押禁見，全案正式進入司法審理階段。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」台中地檢署於 2026 年 11 月 25 日偵結一起家暴殺人案，依殺人罪起訴 43 歲陳姓女子。檢方指控陳女於 2025 年 11 月網購工業級甲醇，至超商取貨後於 11 月 13 日晚間將甲醇倒入廖姓丈夫的酒瓶內；廖男隔日飲酒後出現頭暈、視力模糊並於送醫前心肺功能停止，血液甲醇濃度高達每分升 308.5 毫克，陷入昏迷逾一個月後於同年 12 月 27 日不治。檢警於 2026 年 8 月 8 日搜索陳女住處並查扣手機與網購紀錄，台中地院隨後裁定羈押禁見。\\n\\n「為什麼重要」本案展現檢警透過死因疑點回溯與數位鑑識，追查隱蔽性極高的家庭內下毒案件。工業甲醇常因外觀與氣味接近食用酒精而遭誤用或惡意摻入飲品，檢方依據網購紀錄與毒物檢驗報告提起公訴，凸顯網購危險化學物質流向追蹤與家暴防治通報的重要性。\\n\\n「來源異同」中央社英文網（Focus Taiwan）與台北時報（Taipei Times）對案發時間軸、死者血液甲醇濃度數據、2026 年 8 月搜索及法院羈押禁見裁定，以及 11 月 25 日起訴罪名均有一致報導，並明確區分檢方起訴指控與法院已裁定之羈押處分。\\n\\n「仍不確定」被告於法庭上的正式答辯方向，以及辯方是否針對網購紀錄與投毒因果關係提出異議，仍有待台中地方法院後續開庭審理釐清。\"},\"glossary\":[{\"term\":{\"en\":\"Industrial-Grade Methanol\",\"zh-TW\":\"工業級甲醇\"},\"blurb\":{\"en\":\"A toxic wood alcohol used as an industrial solvent and fuel that causes severe metabolic acidosis, blindness, and organ failure if ingested.\",\"zh-TW\":\"常用作溶劑與燃料的有毒醇類，人體攝入後會代謝為甲酸，引發嚴重代謝性酸中毒、失明及多重器官衰竭。\"}},{\"term\":{\"en\":\"Detained Incommunicado\",\"zh-TW\":\"羈押禁見\"},\"blurb\":{\"en\":\"A court-ordered pretrial detention measure barring a suspect from receiving visitors or communicating outside legal counsel to prevent collusion or evidence tampering.\",\"zh-TW\":\"法院裁定將被告收押並禁止接見通信的強制處分，旨在防止串供或湮滅證據。\"}},{\"term\":{\"en\":\"Metabolic Acidosis\",\"zh-TW\":\"代謝性酸中毒\"},\"blurb\":{\"en\":\"A life-threatening medical condition in which excessive acid accumulates in body fluids, commonly triggered by toxic alcohol poisoning.\",\"zh-TW\":\"體內酸性物質過度堆積或碳酸氫鹽流失導致血液酸鹼值下降的危急病症，常見於甲醇中毒。\"}}],\"sources\":[{\"name\":\"Focus Taiwan (CNA)\",\"url\":\"https://focustaiwan.tw/society/202611250011\"},{\"name\":\"Taipei Times\",\"url\":\"https://www.taipeitimes.com/News/taiwan/archives/2026/11/26/2003868424\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"Exterior view of the Taichung District Prosecutors Office building in Taiwan\",\"zh-TW\":\"台灣台中地方檢察署建築外觀\"},\"isHeadline\":false,\"isPopular\":true,\"trustScore\":84,\"trustBreakdown\":{\"crossCorroboration\":22,\"outletReputation\":22,\"recencyClarity\":20,\"sourceDiversity\":20},\"publishedAt\":\"2026-11-27T15:56:21.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":4,\"D2\":4,\"D3\":4,\"D4\":4,\"D5\":4,\"total\":20},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-taiwan-101-taichung-woman-indicted-methanol-poisoning/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-taiwan-101-taichung-woman-indicted-methanol-poisoning/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom —
