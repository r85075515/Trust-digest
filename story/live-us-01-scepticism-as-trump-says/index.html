lion in rounded form in the summary, which is a rounding difference rather than a conflict. The snippets do not include the wording of Trump's statement, any official policy document, a reaction from Israel, or an explanation of how the aid would legally be ended, so this digest reports the claim and the sceptical reception as the outlets frame them, without treating the plan as enacted policy.\nWhy it matters\nThe claim matters because the aid package is a longstanding, large annual commitment, and ending it would mark a major shift in the United States relationship with Israel, which is why it has featured prominently in midterm campaigning as described. The scepticism in both headlines is itself part of the story: the outlets present the announcement as a statement to be tested against whether such a package can and will actually be stopped by year's end, rather than as a completed action.\nSources agree / disagree\nThe Financial Times and Al Jazeera agree on the core claim, the $3.8 billion figure, and the end-of-year timeline, and both frame the reaction as sceptical. Trust label: Two-source agreement — both outlets report the same announcement and timeline, with the $4 billion in one summary reading as a rounded version of $3.8 billion.\nStill uncertain\nWhether the aid will actually end, what mechanism would be used, whether Congress has a role, how Israel has responded, and what Trump said verbatim all remain uncertain from the snippets. No official confirmation or policy detail is reproduced in the feed text, so the announcement should be read as a stated plan under scepticism, not a settled change."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-us-01-scepticism-as-trump-says\",\"category\":\"us\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-us-01-scepticism-as-trump-says.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Scepticism as Trump says he’s ending Israel’s $3.8 bn
