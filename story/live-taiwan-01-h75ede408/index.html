search and archival material.\n\nWhy it matters\nMartial law ended in Taiwan in 1987, and the book uses official archives to document how institutions and society changed around that turning point. For readers and researchers, a volume grounded in archival records offers a sourced account of democratization rather than a retrospective opinion piece.\n\nSources agree / disagree\nThis is a single-outlet item from CNA, so no second source is available to confirm the details. No conflicting claims appear in the feed material, but the report is a short dispatch and does not quote the book or its authors.\n\nStill uncertain\nThe feed description does not name the book's authors or editors, give its contents in detail, or say whether it will be sold or distributed publicly. Readers should check the CNA report or the Archives Administration for publication details.\n\nTrust label: Single source — one outlet's dispatch, uncorroborated by other reporting."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-01-h75ede408\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-taiwan-01-h75ede408.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 回望台灣解嚴前後體制轉變　檔案局新書發表記錄民主軌跡\",\"zh-TW\":\"相關封面圖：（譯文待補）回望台灣解嚴前後體制轉變　檔案局新書發表記錄民主軌跡\"},\"publishedAt\":\"2026-11-14T07:28:42.000Z\",\"title\":{\"en\":\"National Archives Launches 'To 1987, Taiwan' on Martial Law's End\",\"zh-TW\":\"檔案局發表《致1987，台灣》新書，回望解嚴前後體制轉變\"},\"summary\":{\"en\":\"Taiwan's National Archives Administration launched the book 'To 1987, Taiwan' at the National Archives on November 14, tracing social change around the lifting of martial law through historical research and archival records. The single-source report gives no detail on the book's contents or contributors.\",\"zh-TW\":\"國家發展委員會檔案管理局 11 月 14 日在國家檔案館舉辦《致1987，台灣》新書發表會，從歷史研究與檔案視角回顧台灣解除戒嚴前後的社會轉變。單一來源報導未說明新書內容與作者群。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"國家發展委員會檔案管理局發表新書《致1987，台灣》，從歷史研究與檔案視角，回望台灣解除戒嚴前後的體制與社會轉變。新書發表會於 11 月 14 日在國家檔案館舉行，定位為記錄台灣民主軌跡的出版品。\\n\\n發生了什麼事\\n國家發展委員會檔案管理局 11 月 14 日在國家檔案館舉辦《致1987，台灣》新書發表會。依中央社（CNA)報導，新書從歷史研究與檔案的視角出發，回顧台灣解除戒嚴前後的社會轉變，並思考民主化的歷程。\\n\\n為什麼重要\\n台灣於 1987 年解除戒嚴，新書以官方檔案記錄該轉折前後的體制與社會變化。對讀者與研究者而言，以檔案為本的著作提供有出處的民主化敘述，而非事後評論。\\n\\n來源異同\\n本則僅來自中央社一家媒體，無法與其他來源比對。現有資料中沒有互相衝突的說法，但這是一則簡短電訊，未引述新書內容或作者。\\n\\n仍不確定\\n來源摘要未列出新書作者或編者、未詳述內容，也未說明是否公開發售。讀者應查閱中央社報導或檔案管理局資訊，確認出版細節。\"},\"sources\":[{\"name\":\"中央社-產經證券\",\"url\":\"https://www.cna.com.tw/news/afe/202611140120.aspx\"}],\"disagreements\":null,\"trustScore\":59,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"中央社-產經證券\"],\"glossary\":[{\"blurb\":{\"en\":\"Taiwan's National Archives Administration, under the National Development Council.\",\"zh-TW\":\"隸屬國家發展委員會的檔案管理機關。\"},\"term\":{\"en\":\"National Archives Administration\",\"zh-TW\":\"國家發展委員會檔案管理局\"}},{\"blurb\":{\"en\":\"A Taiwanese government council overseeing national development planning.\",\"zh-TW\":\"負責國家發展規劃的政府機關。\"},\"term\":{\"en\":\"National Development Council\",\"zh-TW\":\"國家發展委員會\"}},{\"blurb\":{\"en\":\"Taiwan's Central News Agency.\",\"zh-TW\":\"台灣的中央通訊社。\"},\"term\":{\"en\":\"CNA\",\"zh-TW\":\"中央社\"}},{\"blurb\":{\"en\":\"Military rule that restricted civil freedoms in Taiwan until 1987.\",\"zh-TW\":\"台灣實施至 1987 年的軍事統治，限制公民自由。\"},\"term\":{\"en\":\"Martial law\",\"zh-TW\":\"戒嚴\"}},{\"blurb\":{\"en\":\"The CNA reporter credited with the dispatch.\",\"zh-TW\":\"撰寫這則中央社電訊的記者。\"},\"term\":{\"en\":\"Pan Ziyu\",\"zh-TW\":\"潘姿羽\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"
