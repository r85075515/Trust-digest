ishment to a network, not just an individual. When a former top aide falls after his former boss has already been expelled, it signals that investigators are working through a circle of officials, and other people connected to that circle will be watching what comes next.\n\nSources agree-disagree\nThis is a single-outlet report from CNA relaying the official announcement, so the material provided offers no second account to compare against, and no conflicting figure or name appears in it.\n\nStill uncertain\nThe material provided gives no amounts, no timeline of the investigation, and no word on judicial proceedings or asset handling after the expulsion. Those missing details decide whether this ends with party discipline or goes further.\n\nTrust label: Single source"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-03-h8d5a6a40\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-taiwan-03-h8d5a6a40.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 馬興瑞前大秘郭永航被雙開  涉無償接受高端醫療服務\",\"zh-TW\":\"相關封面圖：馬興瑞前大秘郭永航被雙開 涉無償接受高端醫療服務\"},\"publishedAt\":\"2026-11-03T02:43:49.000Z\",\"title\":{\"en\":\"Guo Yonghang, former aide to Ma Xingrui, expelled from party and office\",\"zh-TW\":\"馬興瑞前大秘郭永航被雙開，涉無償接受高端醫療服務\"},\"summary\":{\"en\":\"[Unconfirmed · Single source] China's discipline and supervision authorities expelled Guo Yonghang, former Guangdong CPPCC vice-chairman, from the party and public office on November 2, CNA reported. He was accused of taking free high-end medical services from private firms and trading power for money. Watch whether judicial proceedings follow the party punishment.\",\"zh-TW\":\"［未證實·單一來源］中央社報導，中共中央紀委國家監委 11 月 2 日通報，對廣東省政協前副主席郭永航（Guo Yonghang）開除黨籍及公職。他被指無償接受私營企業提供的高端醫療服務，以及大搞權錢交易。接下來看黨紀處分之後是否進入司法程序。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"發生了什麼事\\n中央社（CNA）台北 11 月 3 日報導，中共中央紀委國家監委 11 月 2 日通報，對廣東省政協前黨組成員、副主席郭永航（Guo Yonghang）開除黨籍及公職（雙開），指他無償接受私營企業提供的高端醫療服務，以及大搞權錢交易。郭永航是前中共政治局委員馬興瑞（Ma Xingrui）的前大秘，而馬興瑞此前已被雙開。\\n\\n為什麼重要\\n這起案件的重要性在於，它指向的是一個網絡，而不只是一個人。當前大秘在前老闆已被雙開之後跟著落馬，代表調查正在清理一圈官員，與這個圈子有關的人都會緊盯下一步。\\n\\n來源異同\\n本卡只有中央社（CNA）轉述官方通報的一家報導，提供的材料中沒有第二家說法可以對照，也沒有相互衝突的數字或人名。\\n\\n仍不確定\\n提供的材料沒有金額、沒有調查時間軸，也沒有雙開之後的司法程序或資產處理說明。缺少這些細節，讀者無法判斷此事是停在黨紀處分，還是會再往前走。\"},\"sources\":[{\"name\":\"中央社-兩岸\",\"url\":\"https://www.cna.com.tw/news/acn/202611030050.aspx\"}],\"disagreements\":null,\"trustScore\":59,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"中央社-兩岸\"],\"glossary\":[{\"term\":{\"en\":\"Guo Yonghang\",\"zh-TW\":\"郭永航\"},\"blurb\":{\"en\":\"Former Guangdong CPPCC vice-chairman expelled from party and office.\",\"zh-TW\":\"被開除黨籍及公職的廣東省政協前副主席。\"}},{\"term\":{\"en\":\"Ma Xingrui\",\"zh-TW\":\"馬興瑞\"},\"blurb\":{\"en\":\"Former Politburo member and Guo's former boss.\",\"zh-TW\":\"郭永航的前老闆、前中共政治局委員。\"}},{\"term\":{\"en\":\"Guangdong CPPCC\",\"zh-TW\":\"廣東省政協\"},\"blurb\":{\"en\":\"Guangdong provincial political advisory body.\",\"zh-TW\":\"廣東省政治協商機構。\"}},{\"term\":{\"en\":\"CNA\",\"zh-TW\":\"中央社\"},\"blurb\":{\"en\":\"Taiwan's Central News Agency relaying the announcement.\",\"zh-TW\":\"轉述這項通報的中央通訊社。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-taiwan-03-h8d5a6a40/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[
