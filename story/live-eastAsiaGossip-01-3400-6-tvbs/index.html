ting her gently throughout their first marriage.\n\nWhat happened\nHsu announced in late 2025 that she had remarried singer Lee Yu-hsi, six years her junior, and on the 5th she confirmed that she is pregnant, nearly a year later. Appearing on Tao Ching-ying's podcast, she said planning around having children became the trigger that ended her six-year marriage. She felt she was the only one who wanted a child, blamed herself for the breakdown, and had even prepared to have a child by other means without remarrying — until Lee appeared. She added that her former husband treated her kindly and that she suffered no grievance in her first marriage.\n\nWhy it matters\nThe interview shifts the story from gossip to a recognisable pressure: when two partners want different things around children, the marriage itself can break under the strain. Hsu speaking openly about self-blame and counselling gives the story a weight beyond celebrity news, because it names a conflict many couples face quietly and shows how long it can take to stop blaming oneself.\n\nSources agree / disagree\nThe main account comes from ETtoday's entertainment desk, whose headline says Hsu broke down after the divorce and sought counselling. Two other items arrived in the same batch — a TVBS headline about singer Chang Hsiu-ching responding to divorce talk, and a China Times opinion piece on why celebrity couples split after long relationships — but neither concerns Hsu. The figure of 34 million in the TVBS headline belongs to that separate story, not to Hsu's, so there is no genuine numerical conflict between the reports.\n\nStill uncertain\nThe feed does not say which month the 5th falls in, what else Hsu said in the full podcast, or whether Lee has commented. The complete interview and the original ETtoday report are needed to confirm the details.\n\nTrust label: Bundled stories — One main report plus unrelated items in the same batch; the main account is uncorroborated."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"adult\":false,\"body\":{\"en\":\"$10\",\"zh-TW\":\"藝人許允樂登上陶晶瑩 Podcast，坦言生育規劃是結束 6 年婚姻的導火線：她曾深深自責、接受心理諮商，也感謝前夫在第一段婚姻裡溫柔以對。\\n\\n發生了什麼事\\n許允樂 2025 年底宣布與小 6 歲的歌手李玉璽再婚，事隔近一年，5 日證實已懷孕。她在陶晶瑩 Podcast 節目上說，生育規劃成為結束 6 年婚姻的導火線，她一度覺得只有自己想生孩子，為此深深自責，甚至做好不靠結婚、也要透過其他方式生子的準備，沒想到李玉璽就出現了。\\n\\n為什麼重要\\n這段自述把焦點從八卦拉回現實：生育期待不一致可以壓垮一段婚姻，而當事人要花很長時間才走出自責。許允樂公開談心理諮商，也讓這類話題多了一個願意說出口的例子。\\n\\n來源異同\\n主線來自 ETtoday 影劇的報導，標題寫她離婚後崩潰、接受心理諮商。同批另有 TVBS 談張秀卿回應離婚話題，以及中時一篇談明星情侶分手的觀點文章，兩者與許允樂主線無關；TVBS 標題出現的 3400 萬數字屬於另一則報導，不是許允樂故事裡的數字。\\n\\n仍不確定\\n許允樂證實懷孕的 5 日是哪一個月、節目播出的完整內容，以及李玉璽本人是否回應，摘要都沒有交代。想確認細節，要看 ETtoday 原文與 Podcast 完整訪談。\"},\"category\":\"eastAsiaGossip\",\"disagreements\":null,\"glossary\":[{\"blurb\":{\"en\":\"Taiwanese entertainer who spoke about her divorce and remarriage on a podcast.\",\"zh-TW\":\"在 Podcast 上談離婚與再婚的台灣藝人。\"},\"term\":{\"en\":\"Hsu Yun-le\",\"zh-TW\":\"許允樂（Hsu Yun-le）\"}},{\"blurb\":{\"en\":\"Singer six years younger than Hsu, whom she remarried in late 2025.\",\"zh-TW\":\"小許允樂 6 歲的歌手，2025 年底與她再婚。\"},\"term\":{\"en\":\"Lee Yu-hsi\",\"zh-TW\":\"李玉璽（Lee Yu-hsi）\"}},{\"blurb\":{\"en\":\"Taiwanese host whose podcast featured Hsu's interview.\",\"zh-TW\":\"訪問許允樂的 Podcast 節目主持人。\"},\"term\":{\"en\":\"Tao Ching-ying\",\"zh-TW\":\"陶晶瑩（Tao Ching-ying）\"}},{\"blurb\":{\"en\":\"Singer featured in a separate TVBS headline in the same batch.\",\"zh-TW\":\"同批另一則 TVBS 報導中的歌手。\"},\"term\":{\"en\":\"Chang Hsiu-ching\",\"zh-TW\":\"張秀卿（Chang Hsiu-ching）\"}},{\"blurb\":{\"en\":\"Taiwanese news outlet whose entertainment desk reported Hsu's story.\",\"zh-TW\":\"報導許允樂故事的台灣新聞媒體影劇版。\"},\"term\":{\"en\":\"ETtoday\",\"zh-TW\":\"ETtoday 新聞雲\"}},{\"blurb\":{\"en\":\"Taiwanese broadcaster behind the separate Chang Hsiu-ching headline.\",\"zh-TW\":\"刊出張秀卿相關標題的台灣電視媒體。\"},\"term\":{\"en\":\"TVBS\",\"zh-TW\":\"TVBS\"}}],\"id\":\"live-eastAsiaGossip-01-3400-6-tvbs\",\"imageAlt\":{\"en\":\"Cover related to: 扛3400萬離婚明星狂洗版！張秀卿不忍6字吐心聲 只有「他」被回應 - TVBS新聞網\",\"zh-TW\":\
