Kona Takahashi, following an initial report by FanSided insider Robert Murray. Takahashi spent his entire prior career with Nippon Professional Baseball's Saitama Seibu Lions, posting a 2.54 ERA and a career-best 20.7% strikeout rate in 2026 after declining MLB offers during the previous posting window and signing a multiyear deal with an opt-out clause.\n\nWhy it matters: Adding Takahashi reinforces Arizona's starting rotation depth without requiring posting fees, as his contract opt-out allowed him to enter the market as an unrestricted free agent. His heavy ground-ball profile, approaching 60% in 2026, fits Chase Field's infield defense.\n\nSource differences: MLB.com's article titled \"Kona Takahashi agrees to deal with Diamondbacks (source)\" notes that a source confirmed the agreement while the club has not yet announced it, and details his 1,337 1/3 NPB innings and 3.30 career ERA. Arizona Sports' article titled \"Diamondbacks signing Japanese pitcher Kona Takahashi\" credits Robert Murray for first reporting the signing on Friday.\n\nStill uncertain: Contract dollar figures, incentives, physical examination completion, and the corresponding 40-man roster move remain unannounced pending official club confirmation.\n\nTrust label: Single source — Both MLB.com and Arizona Sports attribute the initial scoop to FanSided reporter Robert Murray without an official club announcement."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-arizona-456-kona-takahashi-diamondbacks\",\"category\":\"arizona\",\"title\":{\"en\":\"Arizona Diamondbacks Agree to One-Year Deal with Japanese Pitcher Kona Takahashi\",\"zh-TW\":\"亞利桑那響尾蛇與日本右投高橋光成達成一年合約協議\"},\"summary\":{\"en\":\"The Arizona Diamondbacks have reached an agreement on a one-year contract with Japanese right-handed pitcher Kona Takahashi, according to multiple baseball reports on November 27, 2026. The 29-year-old former Saitama Seibu Lions starter posted a 2.54 ERA in 2026 before opting out of his NPB deal to enter MLB free agency, though the club has not yet officially confirmed the signing.\",\"zh-TW\":\"多家美國棒球媒體於 2026 年 11 月 27 日報導，亞利桑那響尾蛇已與日本右投高橋光成（Kona Takahashi）達成一年合約協議。現年 29 歲的高橋光成 2026 年在埼玉西武獅繳出防禦率 2.54 成績，隨後行使跳脫條款以自由球員身分轉戰美職；球團目前尚未正式官宣此簽約。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」2026 年 11 月 27 日，MLB.com 與 Arizona Sports 引述 FanSided 記者羅伯特·莫瑞（Robert Murray）的率先披露，報導亞利桑那響尾蛇已與日本右投先發高橋光成（Kona Takahashi）達成一年合約協議。高橋光成此前職棒生涯全數效力於日本職棒埼玉西武獅，去年透過入札制度未赴美並與西武簽下附帶跳脫條款的複數年合約，2026 年球季投出 2.54 防禦率與生涯新高的 20.7% 三振率後行使跳脫權進入自由市場。\\n\\n「為什麼重要」高橋光成以不受限制自由球員身分加盟，響尾蛇無須支付入札金即可補強先發輪值深度。他在 2026 年接近 60% 的滾地球率，也契合大通球場的內野守備配置。\\n\\n「來源異同」MLB.com 原文標題為「Kona Takahashi agrees to deal with Diamondbacks (source)」，指出消息人士證實雙方達成一年合約但球團尚未正式公布，並詳列其日職生涯 1,337.1 局與 3.30 防禦率；Arizona Sports 原文標題為「Diamondbacks signing Japanese pitcher Kona Takahashi」，強調由羅伯特·莫瑞（Robert Murray）於週五率先披露簽約消息。\\n\\n「仍不確定」合約具體薪資、激勵條款、體檢進度及 40 人名單相應異動，均待響尾蛇球團正式公告才能確認。\\n\\nTrust label: Single source — MLB.com 與 Arizona Sports 均引述記者羅伯特·莫瑞（Robert Murray）的消息來源，球團尚未發布官方聲明。\"},\"glossary\":[{\"term\":{\"en\":\"Posting System\",\"zh-TW\":\"入札制度\"},\"blurb\":{\"en\":\"The transfer mechanism allowing Nippon Professional Baseball players under contract to negotiate with MLB clubs in exchange for a release fee.\",\"zh-TW\":\"日本職棒現役球員在合約期滿前轉戰美國職棒大聯盟的轉隊機制，美職球團須支付原母隊轉隊費。\"}},{\"term\":{\"en\":\"Opt-Out Clause\",\"zh-TW\":\"跳脫條款\"},\"blurb\":{\"en\":\"A contractual provision enabling a player to void the remaining years of a multiyear deal and re-enter free agency.\",\"zh-TW\":\"允許球員在複數年合約特定時間點終止剩餘合約、重新成為自由球員的條款。\"}},{\"term\":{\"en\":\"Ground-Ball Rate\",\"zh-TW\":\"滾地球率\"},\"blurb\":{\"en\":\"The percentage of balls put into play against a pitcher that are hit on the ground, helping limit home runs.\",\"zh-TW\":\"投手被打進場內的球中屬於滾地球的比例，高滾地球率有助於減少全壘打失分。\"}}],\"sources\":[{\"name\":\"MLB.com\",\"url\":\"https://www.mlb.com/news/kona-takahashi-diamondbacks-deal\"},{\"name\":\"Arizona Sports\",\"url\":\"https://arizon
