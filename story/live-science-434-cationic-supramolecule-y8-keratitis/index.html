e cationic supramolecules, with lead candidate Y8 showing low-micromolar MIC90 activity across multiple fungal pathogens. Mechanistically, Y8 disrupts fungal plasma membranes and interacts with cell-wall glucans. In mouse or rabbit models of Candida, Fusarium, and Aspergillus keratitis, its efficacy exceeded or matched standard therapies including voriconazole, natamycin, and amphotericin B; it also showed activity against MRSA, outperforming vancomycin in a mouse MRSA keratitis model, with reported ocular compatibility.\n\nWhy it matters\nInfectious keratitis caused by drug-resistant fungi or bacteria poses severe vision risks and faces treatment limitations. A single molecular class active against both fungal pathogens and MRSA in animal models offers a potential broad-spectrum antimicrobial direction for future ocular therapy research.\n\nSource differences\nThe primary paper in Nature Communications is titled \"A membrane-active cationic supramolecule to treat both fungal and bacterial keratitis\". Bioengineer.org published a summary report titled \"Cationic Supramolecule Treats Fungal and Bacterial Keratitis in Animal Models\" based on the same study.\n\nStill uncertain\nFindings are limited to preclinical animal models and in vitro or ex vivo assays, with no human clinical trial results available; safety, pharmacokinetics, and efficacy in human patients remain unestablished.\n\nTrust label: Single source — Bioengineer.org is a summary report of the same Nature Communications paper, making the evidence single-origin from the study."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-science-434-cationic-supramolecule-y8-keratitis\",\"category\":\"science\",\"title\":{\"en\":\"Cationic Supramolecule Y8 Shows Dual Activity Against Fungal and Bacterial Keratitis in Animal Models\",\"zh-TW\":\"新型陽離子超分子 Y8 展現對抗真菌性與細菌性角膜炎動物模型活性\"},\"summary\":{\"en\":\"Published on November 27, 2026 in Nature Communications, a study reports membrane-active cationic supramolecule Y8 active against fungal pathogens and MRSA, outperforming or matching standard agents in animal keratitis models while remaining limited to preclinical animal testing.\",\"zh-TW\":\"2026 年 11 月 27 日刊於 Nature Communications 的研究指出，具膜活性的陽離子超分子 Y8 對多種真菌病原體與 MRSA 具活性，於角膜炎動物模型表現優於或相當於標準療法，惟目前僅為動物實驗階段。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n2026 年 11 月 27 日發表於 Nature Communications（DOI：10.1038/s41467-026-79812-y）的研究報告指出，團隊開發出具膜活性的陽離子超分子，其中先導化合物 Y8 對多種真菌病原體具低微莫耳濃度 MIC90 活性，作用機制包含破壞真菌細胞質膜並與細胞壁葡聚醣作用。在小鼠或兔子的念珠菌、鐮孢菌、麴菌角膜炎模型中，Y8 療效高於或相當於 voriconazole、natamycin、amphotericin B 等標準療法；對抗藥性金黃色葡萄球菌（MRSA）亦具活性，於小鼠 MRSA 角膜炎模型療效優於 vancomycin，並具眼部相容性。\\n\\n「為什麼重要」\\n真菌或細菌引起的感染性角膜炎可能威脅視力，臨床治療常面臨抗藥性與用藥受限挑戰。Y8 在動物模型中同時展現對真菌病原體與 MRSA 的活性，為後續抗菌分子設計與眼部感染研究提供新的觀察方向。\\n\\n「來源異同」\\nNature Communications 論文頁面實際標題為「A membrane-active cationic supramolecule to treat both fungal and bacterial keratitis」；Bioengineer.org 刊登之摘要報導頁面實際標題為「Cationic Supramolecule Treats Fungal and Bacterial Keratitis in Animal Models」，兩者報導同源於同一篇研究。\\n\\n「仍不確定」\\n目前僅為動物實驗階段，尚無人體試驗結果；Y8 在人體的安全性、眼部藥物動力學與臨床療效皆尚未確立。\\n\\nTrust label: Single source — Bioengineer.org 為同一篇 Nature Communications 論文的摘要報導，證據同源於該研究。\"},\"glossary\":[{\"term\":{\"en\":\"Cationic supramolecule\",\"zh-TW\":\"陽離子超分子\"},\"blurb\":{\"en\":\"A positively charged molecular assembly held together by non-covalent interactions, engineered to interact with negatively charged microbial surfaces.\",\"zh-TW\":\"由非共價作用力組裝而成的帶正電分子結構，可與帶負電的微生物細胞表面產生交互作用。\"}},{\"term\":{\"en\":\"MIC90\",\"zh-TW\":\"最低抑菌濃度 90\"},\"blurb\":{\"en\":\"The minimum concentration of an antimicrobial agent required to inhibit the growth of 90% of tested microbial isolates.\",\"zh-TW\":\"在測試菌株中能抑制 90% 微生物生長所需的最低抗菌劑濃度。\"}},{\"term\":{\"en\":\"Keratitis\",\"zh-TW\":\"角膜炎\"},\"blurb\":{\"en\":\"Inflammation of the cornea, the clear front dome of the eye, which can be caused by infectious agents such as fungi or bacteria.\",\"zh-TW\":\"眼球角膜的發炎反應，可能由真菌或細菌等病原體感染引起。\"}}],\"sources\":[{\"name\":\"Nature Communications\",\"url\":\"https://www.nature.com/articles/s41467-026-79812-y\"},{\"name\":\"Bioengineer.org\",\"url\":\"https://bioengineer.org/cationic-supramolecule-treats-fungal-and-bacterial-keratitis-in-animal-models/\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"Cationic Supramolecule Y8 Shows Dual Activity Against Fungal and Bacterial Keratitis in Animal Models\",\"zh-TW\":\"新型陽離子超分子 Y8 展現對抗真菌性與細菌性角膜炎動物模型活性\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":73,\"trustBreakdown\":{\"crossCorroboration\":17,\"outletReputation\":22,\"recencyClarity\":21,\"sourceDiversity\":13},\"publishedAt\":\"2026-11-28T10:22:56.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":21,\"D2\":21,\"D3\":21,\"D4\":18,\"D5\":18,\"total\":20},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-science-434-cationic-supramolecule-y8-keratitis/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-science-434-cationic-supramolecule-y8-keratitis/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"tw
