 the dead include Deputy Superintendent of Police Haider Zaman of Gambat and Sub-Inspector Mukhtiar, and that attackers fired from elevated positions and set police vehicles ablaze. Rescue 1122, the emergency service, said 12 injured officers were taken to hospital and an emergency was declared at the District Headquarters Teaching Hospital in Kohat. Khyber Pakhtunkhwa Governor Faisal Karim Kundi condemned the attack and demanded a detailed report from police.\nWhy it matters\nNo group had claimed responsibility by Wednesday evening, but the Associated Press reports suspicion falls on the Tehrik-i-Taliban Pakistan (TTP), the Pakistani Taliban, which has stepped up attacks on security forces in Khyber Pakhtunkhwa; police described the attackers as 'Fitna al-Khawarij' - the official term for the banned TTP - together with criminal elements around the illegal mining trade. The scale is the story: police data cited by the Associated Press of Pakistan counts 680 attacks on police in the province in the first nine months of 2026, up from 508 in the same period of 2025. The provincial bar council called a judicial boycott in Kohat district on Thursday in protest. The takeaway: this is not an isolated ambush but the deadliest recent episode in a sustained campaign against the province's police.\nSources agree / disagree\nThe death toll moved during the day: Kohat police first confirmed 10 dead, and Rescue 1122 later put the figure at 11 killed with 12 injured - a same-direction update as rescue teams reached the site (Anadolu Agency also reported 11), presented here side by side rather than merged. All outlets agree on the location, the mining-raid context and that no claim of responsibility had been made. Trust label: Multi-source agreement - police and rescue officials on the record, reported by AP and Pakistan's national press.\nStill uncertain\nWhether the toll rises - some of the wounded were reported in critical condition - the number of attackers, and whether the TTP or another group formally claims the attack all remain open. A police pursuit was under way; its outcome has not been reported."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"adult\":false,\"body\":{\"en\":\"$10\",\"zh-TW\":\"巴基斯坦西北部開伯爾-普什圖省（Khyber Pakhtunkhwa）週三（11 月 11 日）發生重大恐攻：一支警隊在科哈特（Kohat）地區遭武裝分子伏擊，11 名警察殉職，其中包括一名副警司，是該省今年死傷最慘重的單一警隊遇襲事件之一。警隊當時正前往印度河一帶取締非法採金，攻擊者從山頭開火。\\n發生了什麼事\\n伏擊地點在科哈特與卡拉克（Karak）之間的達爾博卡奇（Darbokach）與賈蘭達爾班達（Jalandhar Banda）一帶，警隊正前往甘巴特（Gambat）地區查緝印度河沿岸的非法採金。科哈特警方發言人穆罕默德·瑙曼·澤布（Muhammad Nauman Zeb）表示，死者包括甘巴特副警司海德爾·扎曼（Haider Zaman）與副督察穆赫提亞爾（Mukhtiar），攻擊者居高臨下開火，並焚毀多輛警車。緊急救援單位 Rescue 1122 表示，12 名傷者已送醫，科哈特地區總部教學醫院宣布進入緊急狀態。開伯爾-普什圖省省長費薩爾·卡里姆·昆迪（Faisal Karim Kundi）譴責攻擊，並要求警方提交詳細報告。\\n為什麼重要\\n截至週三晚間尚無組織出面承認犯案；美聯社指出，嫌疑指向巴基斯坦塔利班（Tehrik-i-Taliban Pakistan，TTP）——該組織近月在開伯爾-普什圖省頻頻攻擊安全部隊；警方則稱攻擊者為官方用語所指的 TTP 加上非法採金周邊的犯罪集團。量級才是重點：巴基斯坦通訊社引述警方數據，該省 2026 年前九個月針對警察的攻擊達 680 起，高於 2025 年同期的 508 起。省律師公會已宣布週四在科哈特地區司法罷工抗議。結論是：這不是孤立伏擊，而是該省警隊遭持續攻擊浪潮中最慘烈的一集。\\n來源異同\\n死亡人數白天內有更新：科哈特警方最初確認 10 人殉職，Rescue 1122 在救援抵達後更新為 11 死、12 傷（安納杜魯通訊社同樣報 11 死）——屬同一方向的後續更新，卡內並列呈現、不逕行合併。各地點、取締非法採金的背景、以及尚無組織承認犯案，各家說法一致。信任標籤：多源一致——警方與救援單位具名發言，美聯社與巴基斯坦全國性媒體共同報導。\\n仍不確定\\n部分傷者傷勢危重，死亡人數是否再上升未明；攻擊者人數、TTP 或其他組織是否正式出面承認，也都待確認。警方追捕行動的結果尚未公布。\"},\"category\":\"international\",\"disagreements\":null,\"glossary\":[{\"blurb\":{\"en\":\"District in Pakistan's Khyber Pakhtunkhwa province, between Peshawar and Karak; site of the Nov 11 ambush on a police team raiding illegal gold mining.\",\"zh-TW\":\"巴基斯坦開伯爾-普什圖省的地區，位於白沙瓦與卡拉克之間；11 月 11 日警隊取締非法採金遭伏擊的地點。\"},\"term\":{\"en\":\"Kohat\",\"zh-TW\":\"科哈特（Kohat）\"}},{\"blurb\":{\"en\":\"Pakistan's northwestern province bordering Afghanistan, where attacks on police and security forces have risen sharply since 2025.\",\"zh-TW\":\"巴基斯坦西北部與阿富汗接壤的省分，近年針對警察與安全部隊的攻擊顯著上升。\"},\"term\":{\"en\":\"Khyber Pakhtunkhwa\",\"zh-TW\":\"開伯爾-普什圖省（Khyber Pakhtunkhwa）\"}},{\"blurb\":{\"en\":\"The Pakistani Taliban, a banned militant group distinct from Afghanistan's Taliban; suspected by officials and analysts in the Kohat ambush, though it had not claimed the attack.\",\"zh-TW\":\"巴基斯坦塔利班，被巴國列為禁制組織，與阿富汗塔利班不同；官方與美聯社指其涉嫌科哈特伏擊，但尚未出面承認。\"},\"term\":{\"en\":\"Tehrik-i-Taliban Pakistan (TTP)\",\"zh-TW\":\"巴基斯坦塔利班（Tehrik-i-Taliban Pakistan，TTP）\"}},{\"blurb\":{\"en\":\"Pakistan's integrated emergency rescue service; its Kohat statement put the ambush toll at 11 killed and 12 injured.\",\"zh-TW\":\"巴基斯坦的整合緊急救援單位；其科哈特聲明將伏擊傷亡更新為 11 死、12 傷。\"},\"term\":{\"en\":\"Rescue 1122\",\"zh-TW\":\"Rescue 1122（巴基斯坦緊急救援服務）\"}},{\"blurb\":{\"en\":\"A mid-level police command rank in Pakistan; Gambat DSP Haider Zaman was the senior officer killed in the ambush.\",\"zh-TW\":\"巴基斯坦警階中的中階指揮職；甘巴特副警司海德爾·扎曼是本次伏擊殉職的最高階警官。\"},\"term\":{\"en\":\"Deputy Superintendent of Police (DSP)\",\"zh-TW\":\"副警司（Deputy Superintendent of Police，DSP）\"}}],\"id\":\"live-international-07-kohat-police-ambush\",\"imageAlt\":{\"en\":\"\",\"zh-TW\":\"\"},\"imageUrl\":\"\",\"isHeadline\":false,\"isPopular\":true,\"publishedAt\":\"2026-11-11T17:33:21.000Z\",\"sources\":[{\"name\":\"Zark News (AP / Express Tribune reporting)\",\"url\":\"https://zarknews.com/kohat-ambush-police-killed-dsp/\"},{\"name\":\"Daily Jagran\",\"url\":\"https://www.thedailyjagran.com/world/news/pakistan-terrorist-attack-dsp-and-several-police-personnel-killed-in-khyber-pakhtunkhwa-terrorist-ambush-10335968\"},{\"name\":\"KhabarWire\",\"url\":\"https://khabarwire.com/blog/kohat-police-ambush-gold-mining-2026-11-11/\"}],\"summary\":{\"en\":\"Militants ambushed a police team in Kohat district, Khyber Pakhtunkhwa, on Nov 11 as it travelled to raid illegal gold mining on the River Indus, killing 11 officers - including Deputy Superintendent Haider Zaman - and injuring 12. No group had claimed responsibility by Wednesday evening; the Associated Press reports suspicion falls on the Pakistani Taliban (TTP), which has sharply escalated attacks on the province's police this year.\",\"zh-TW\":\"巴基斯坦開伯爾-普什圖省科哈特（Kohat）一支警隊 11 月 11 日前往印度河一帶取締非法採金途中，在山區遭武裝分子伏擊，11 名警察殉職、12 人受傷，死者包括副警司海德爾·扎曼（Haider Zaman）。尚無組織出面承認犯案；美聯社指出，嫌疑指向今年在該省大幅升級警隊攻擊的巴基斯坦塔利班（TTP）。\"},\"tags\":[\"international\",\"live-ingest\",\"breaking\",\"pakistan\",\"terror-attack\",\"kohat\"],\"title\":{\"en\":\"Ambush in Pakistan's Kohat Kills 11 Police Officers, Including a Deputy Superintendent\",\"zh-TW\":\"巴基斯坦科哈特警隊遭伏擊恐攻：11 名警察殉職，含副警司海德爾·扎曼\"},\"trustBreakdown\":{\"crossCorroboration\":20,\"outletReputation\":18,\"recencyClarity\":20,\"sourceDiversity\":18},\"trustScore\":76}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-international-07-kohat-police-ambush/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-international-07-kohat-police-ambush/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><s
