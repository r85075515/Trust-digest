hat she would 'never get married,' Bai fired back directly, ETtoday and SET News reported. The photos, taken in her Golden Bell Awards gown, also drew admiring comments about the 40-year-old's post-breakup glow.\n\nWhat happened\nBai's first public outing since the breakup four months ago centered on a set of Golden Bell gown photos. Alongside the compliments came trolls mocking her as unmarriageable; she responded to them head-on instead of ignoring the noise. ETtoday, SET News and LINE TODAY's EBC entertainment channel all cover the same photos and the same exchange.\n\nWhy it matters\nA textbook celebrity clapback cycle — breakup, glow-up photos, troll bait, direct response — engineered, intentionally or not, to keep her in the entertainment news rotation. The takeaway for readers: the 40-year-old's post-split form is the actual story here; watch her public appearances after the Golden Bell run.\n\nSources agree / disagree\nAll three outlets cover the same Golden Bell gown photos and the same 'never marrying' exchange. A separate ETtoday roundup of former children's-TV hosts is a different item; some headlines say four hosts, others say three — unrelated to this story's main thread.\n\nStill uncertain\nThe snippets provide no verified follower or engagement figures, so claims about her online reach cannot be confirmed from these sources and are not asserted here."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-eastAsiaGossip-02-4-ebc-line-today\",\"category\":\"eastAsiaGossip\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-eastAsiaGossip-02-4-ebc-line-today.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 斷開孫綻4個月！米可白曬美照遭酸「嫁不掉」親上火線反擊 | EBC 東森娛樂 - LINE TODAY\",\"zh-TW\":\"相關封面圖：斷開孫綻4個月！米可白曬美照遭酸「嫁不掉」親上火線反擊 | EBC 東森娛樂 - LINE TODAY\"},\"publishedAt\":\"2026-10-23T03:00:00.000Z\",\"title\":{\"en\":\"Miko Bai Claps Back at 'Never Marrying' Trolls Four Months After Split\",\"zh-TW\":\"米可白：斷開孫綻 4 個月曬美照，遭酸「嫁不掉」親上火線反擊\"},\"summary\":{\"en\":\"Former children's TV host Miko Bai made her first public appearance four months after splitting with Sun Zhan, posting Golden Bell gown photos that drew 'never marrying' trolls — and she clapped back directly. ETtoday, SET News and LINE TODAY cover the same exchange. Takeaway: a textbook celebrity clapback cycle; the real story is the 40-year-old's post-breakup glow.\",\"zh-TW\":\"前兒童台主持人米可白分手孫綻 4 個月後首亮相，曬金鐘禮服美照遭酸「嫁不掉」，她親自回嗆。takeaway：分手、美照、酸民、回擊——標準聲量循環，40 歲的狀態才是本則真正的看點。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"前兒童台主持人、藝人米可白——與孫綻分手 4 個月後首度公開亮相——曬出美照卻遭網友酸「嫁不掉」，她親上火線反擊。（來源未提供可驗證的粉絲數／聲量數據，此處不編造。）\\n發生了什麼事\\n米可白分手 4 個月後首度公開現身，曬出穿著金鐘禮服的美照，40 歲恢單狀態引發討論；有網友留言酸她「嫁不掉」，她直接回嗆「你有事嗎」。ETtoday、三立新聞、LINE TODAY 東森娛樂都報導了同一組照片與同一段交鋒。\\n為什麼重要\\n分手、美照、酸民、親自回嗆——標準的明星聲量循環。這一波操作讓她穩穩留在娛樂版面上。takeaway：黑紅也是紅，但 40 歲的狀態才是這則新聞真正的賣點；接下來看她金鐘後的公開行程。\\n來源異同\\n三家媒體主線一致：同一組金鐘禮服照、同一句「嫁不掉」交鋒。信任標籤：多源一致。同批 ETtoday 另有「兒童台姐姐」盤點，部分標題寫 4 位、部分寫 3 位——與本則主線無關。\\n仍不確定\\n來源未提供可驗證的粉絲數或互動數據，聲量規模無法從現有來源確認，此處不自行腦補。\"},\"sources\":[{\"name\":\"ETtoday 影劇\",\"url\":\"https://star.ettoday.net/news/3259470\"},{\"name\":\"setn.com\",\"url\":\"https://news.google.com/rss/articles/CBMiSkFVX3lxTE1waEdHNlUwbkNCZTVQNFpOMTBFRWZEbW1aWnd2SDFVUlJJMWxTdFVYd0oteld2OXZCOWxZZTFSSnNPVF9OamhmZjFn0gFfQVVfeXFMUDVBbXRBNTB6V1dBSXZUa2xEaTFleUV4Q2Zvb0ZpX2o1S1ZkU0dCQTNkVzNHc3FKRnBnVmxnSGtQSmV1eDEwRmdZOXdmeUpjaGpUUEJsbS1udFdaaVYzbHc?oc=5\"},{\"name\":\"today.line.me\",\"url\":\"https://news.google.com/rss/articles/CBMiVkFVX3lxTFBaM051ZkN6cU9WQnRqUWI2MmZtZWlNekZOdUlqNldaTEJFckFxemNvdklWS01RNFU1eG5XbVhKN0U4elhGM0h5MWtYQXRTSmoyd1NXN0tB?oc=5\"}],\"disagreements\":null,\"trustScore\":76,\"trustBreakdown\":{\"sourceDiversity\":21,\"outletReputation\":16,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"eastAsiaGossip\",\"live-ingest\",\"region:tw\",\"ettoday-影劇\",\"gnews-site:ettoday-分手/復合/婚\",\"gnews-site:ettoday-分手/復合/婚\"],\"region\":\"tw\",\"glossary\":[{\"term\":{\"en\":\"Miko Bai\",\"zh
