er 27, 2026, setting clear priority rankings for relocating central command headquarters if the Prime Minister's Office is damaged or inaccessible. Under the updated framework, central ministries must prepare for severe infrastructure disruptions—including one-week outages of electricity, telephone, and internet networks, alongside one-month disruptions to water and sewage systems—while keeping emergency operations running for at least seven days without external food or supply deliveries.\n\nThe revision strengthens Japan's administrative resilience against a catastrophic metropolitan earthquake and formally links the selection of backup command sites outside the greater Tokyo region to the government's ongoing secondary-capital designation process.\n\nJapan's Cabinet Office BCP filing, Risk Taisaku (Jiji Press), and Storm Media all confirm the November 27 Cabinet decision, the Prime Minister's Office fallback command order, and the alignment of out-of-Tokyo backup hubs with secondary-capital planning. Storm Media highlights the specific one-week blackout and one-month water-outage stress parameters, whereas Risk Taisaku emphasizes the institutional linkage to the secondary-capital framework.\n\nWhich specific municipalities outside Tokyo will be designated as secondary-capital backup command centers will remain undetermined until the government completes its formal secondary-capital selection review.\n\nTrust label: Multi-source agreement — Cabinet Office documents, Risk Taisaku, and Storm Media confirm the November 27 Tokyo earthquake BCP revision."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-057-japan-cabinet-tokyo-quake-bcp\",\"category\":\"international\",\"title\":{\"en\":\"Japan Cabinet Revises Tokyo Direct-Hit Earthquake Continuity Plan, Weighs Secondary Capital Backup\",\"zh-TW\":\"日本內閣通過首都直下地震業務持續計畫修訂 明定官邸失能指揮順位與副首都銜接\"},\"summary\":{\"en\":\"Japan's Cabinet approved a revised Business Continuity Plan on November 27, 2026 for a major Tokyo direct-hit earthquake, establishing command relocation priorities if the Prime Minister's Office becomes unusable. Ministries must prepare for one-week power and telecom blackouts and one-month water outages, while backup sites outside Tokyo will align with secondary-capital plans.\",\"zh-TW\":\"日本政府於 2026 年 11 月 27 日在內閣會議通過《政府業務持續計畫（首都直下地震對策）》修訂案，明訂首相官邸受損無法使用時的緊急指揮據點轉移優先順序。計畫要求中央部會以停電斷網持續 1 週、上下水道中斷 1 個月為前提整備，東京圈外備援據點將配合「副首都」檢討結果納入。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n日本政府於 2026 年 11 月 27 日召開內閣會議，正式通過《政府業務持續計畫（首都直下地震對策）》修訂案，明文規定當首相官邸因強震受損或無法運作時，政府緊急指揮據點的轉移優先順序。新計畫要求中央各省廳以「停電、電話及網路中斷持續 1 週，上下水道停擺持續 1 個月」的嚴峻情境整備，並確保在無外部糧食補給下維持至少 1 週緊急優先業務運作。\\n「為什麼重要」\\n此次修訂補強了日本在遭遇首都圈毀滅性強震時的國家中樞存續能力，並首度將東京圈外的備援指揮據點規劃與日本政府推動中的「副首都」指定制度正式接軌，避免單一都市圈癱瘓導致全國行政停擺。\\n「來源異同」\\n日本內閣府防災官方公告、《Risk Taisaku》（引述時事通信）與《風傳媒》均一致確認 11 月 27 日內閣通過修訂案、首相官邸失能備援順位及銜接副首都規劃等核心內容。《風傳媒》詳細列明 1 週斷電斷網與 1 個月斷水的整備基準；《Risk Taisaku》則聚焦災害對策本部向副首都轉移的制度設計。\\n「仍不確定」\\n東京圈以外具體將指定哪幾座城市作為副首都與中央政府備援指揮據點，仍待日本政府完成副首都相關選址審查後才會正式寫入計畫。\"},\"glossary\":[{\"term\":{\"en\":\"Tokyo Direct-Hit Earthquake\",\"zh-TW\":\"首都直下地震\"},\"blurb\":{\"en\":\"A major shallow earthquake occurring directly beneath the Greater Tokyo metropolitan area, posing severe risks to Japan's political and economic core.\",\"zh-TW\":\"震央直接位於日本東京首都圈正下方的大型淺層地震，對日本政治、行政與經濟中樞構成重大威脅。\"}},{\"term\":{\"en\":\"Business Continuity Plan (BCP)\",\"zh-TW\":\"政府業務持續計畫\"},\"blurb\":{\"en\":\"Statutory disaster preparedness protocols ensuring central government ministries maintain core command and emergency functions during catastrophic events.\",\"zh-TW\":\"依據日本《首都直下地震對策特別措施法》制定的應變計畫，確保大災發生時中央政府仍能維持核心行政與救災指揮。\"}},{\"term\":{\"en\":\"Secondary Capital Designation\",\"zh-TW\":\"副首都規劃\"},\"blurb\":{\"en\":\"Japan's policy initiative to designate backup regional cities capable of assuming central administrative and economic functions if Tokyo is struck by disaster.\",\"zh-TW\":\"日本政府推動的多極分散型國土政策，擬指定東京以外的備援城市，在首都受災時承接中樞行政機能。\"}}],\"sources\":[{\"name\":\"日本內閣府防災（Cabinet Office, Government of Japan）\",\"url\":\"https://www.bousai.go.jp/jishin/syuto/pdf/syuto_taisaku_20261127.pdf\"},{\"name\":\"Risk Taisaku (Jiji Press)\",\"url\":\"https://www.risktaisaku.com/articles/-/117581\"},{\"name\":\"風傳媒\",\"url\":\"https://www.storm.mg/article/11185776\"}],\"imageUrl\":\"/covers/live/live-international-057-japan-cabinet-tokyo-quake-bcp.jpg\",\"imageAlt\":{\"en\":\"Prime Minister's Official Residence in Tokyo central government district\",\"zh-TW\":\"位於東京千代田區中央政府行政區的日本首相官邸建築\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":87,\"trustBreakdown\":{\"crossCorroboration\":22,\"outletReputation\":22,\"recencyClarity\":23,\"sourceDiversity\":20},\"publishedAt\":\"2026-11-27T14:28:54.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":5,\"D2\":4,\"D3\":4,\"D4\":4,\"D5\":4,\"total\":21},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-international-057-japan-cabinet-tokyo-quake-bcp/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-international-057-japan-cabinet-tokyo-quake-bcp/\"}],[\"$\",\"meta\",\"6\",{
