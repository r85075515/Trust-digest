 a three-minute fireworks finale. Sponsored exclusively by Taishin Shin Kong Financial, the show packed Xinyi District with spectators.\nWhat happened\nCNA reports the full program ran about 14 minutes — one minute of opening fireworks, ten minutes of drone formations, three minutes of closing fireworks. The Liberty Times notes Taishin Shin Kong Financial sponsored the National Day show for the second straight year. The viral moment came from the drone show itself: a formation of chopsticks dropping ingredients into a hot pot — the \"hotpot gag\" — which netizens linked to Mayor Chiang Wan-an's remark likening Taipei to a hot pot. Taipei 101 chair Chia Yung-chieh posted a late-night response, with ETtoday's headline noting city-government support.\nWhy it matters\nThe judgment is about soft power as urban marketing: Taipei 101 has turned the National Day sky into a branded civic ritual, bankrolled by a financial holding company. The hotpot gag shows how fast a light show becomes a political Rorschach test — the mayor didn't plan it, but he owns the meme now.\nSources agree / disagree\nCNA, the Liberty Times, ETtoday, and Yahoo TW Entertainment all confirm the same program facts: theme, 14 minutes, 600 drones, the sponsor, and the hotpot formation. The link to Chiang's remarks is netizen speculation, not a confirmed intent. Trust label: Multi-source agreement — four outlets agree on the facts; the political reading of the hotpot gag is unconfirmed.\nStill uncertain\nWhether the hotpot formation was a deliberate nod to the mayor remains unconfirmed beyond Chia's response. Verify the full response text in the linked articles."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-eastAsiaGossip-04-101-14\",\"category\":\"eastAsiaGossip\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-eastAsiaGossip-04-101-14.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 台北101國慶主題「點亮台灣」　煙火無人機演出14分鐘【圖輯】\",\"zh-TW\":\"相關封面圖：台北101國慶主題「點亮台灣」　煙火無人機演出14分鐘【圖輯】\"},\"publishedAt\":\"2026-10-11T01:37:09.000Z\",\"title\":{\"en\":\"Taipei 101's 'Light Up Taiwan' Show: 14 Minutes of Fireworks and 600 Drones\",\"zh-TW\":\"台北101（Taipei 101）國慶「點亮台灣」：14分鐘煙火＋600台無人機\"},\"summary\":{\"en\":\"Taipei 101's Double Ten show, themed 'Onward Taiwan,' ran 14 minutes with 600 drones, fireworks, and lasers, drawing crowds to Xinyi. A hotpot-shaped drone gag sparked speculation linking it to Mayor Chiang Wan-an's remarks, prompting chair Chia Yung-chieh to respond.\",\"zh-TW\":\"台北101國慶展演以「Onward Taiwan 一起點亮台灣」為主題，14分鐘結合600台無人機、煙火與雷射，擠爆信義區。無人機排出「火鍋哏」圖案，引發網友聯想市長蔣萬安（Chiang Wan-an）談話，董事長賈永婕深夜發文回應。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"台北101用一場14分鐘的展演點亮雙十夜空：600台無人機、煙火、建築燈光與雷射光束，主題是「Onward Taiwan 一起點亮台灣」，晚間10點登場——1分鐘煙火揭幕、10分鐘無人機主秀、3分鐘煙火壓軸。台新新光金控獨家贊助，萬人擠爆信義區。\\n發生了什麼事\\n中央社報導，展演全程約14分鐘：1分鐘煙火開場、10分鐘無人機隊形、3分鐘煙火收尾。自由時報指出，台新新光金控已連續第二年贊助101國慶展演。最出圈的是無人機主秀的一幕：一雙筷子把配料夾進火鍋的「火鍋哏」，被網友聯想為呼應市長蔣萬安（Chiang Wan-an）「台北如同一鍋火鍋」的說法。台北101董事長賈永婕深夜發文回應，ETtoday 標題點出「北市府支持」。\\n為什麼重要\\n判斷在於城市行銷：台北101已經把國慶夜空變成一場有品牌贊助的城市儀式，買單的是金控公司。火鍋哏則示範了一場燈光秀多快能變成政治羅夏測驗——市長沒策劃這一切，但這個哏現在算在他頭上。\\n來源異同\\n中央社、自由時報、ETtoday、Yahoo TW 娛樂四家確認的事實一致：主題、14分鐘、600台無人機、贊助商、火鍋隊形。至於火鍋哏是否影射蔣萬安，只是網友聯想，未經證實。信任標籤：N源一致——四家媒體事實一致；火鍋哏的政治解讀未經證實。\\n仍不確定\\n火鍋隊形是否刻意致敬市長，除了賈永婕的回應外沒有進一步證實。請查閱原文連結確認回應全文。\"},\"sources\":[{\"name\":\"中央社-產經證券\",\"url\":\"https://www.cna.com.tw/news/afe/202610100226.aspx\"},{\"name\":\"自由時報\",\"url\":\"https://ec.ltn.com.tw/article/breakingnews/5602370\"},{\"name\":\"ETtoday 影劇\",\"url\":\"https://star.ettoday.net/news/3252514\"},{\"name\":\"Yahoo TW 娛樂\",\"url\":\"https://tw.news.yahoo.com/101%E5%9C%8B%E6%85%B6%E5%B1%95%E6%BC%94-%E7%81%AB%E9%8D%8B%E6%A2%97-%E8%88%87%E8%94%A3%E8%90%AC%E5%AE%89%E6%9C%89%E9%97%9C-%E8%B3%88%E6%B0%B8%E5%A9%95%E6%B7%B1%E5%A4%9C%E5%9B%9E%E6%87%89%E4%BA%86-004300816.html\"}],\"disagreements\":null,\"trustScore\":88,\"trustBreakdown\":{\"sourceDiversity\":21,\"outletReputation\":20,\"crossCorroboration\":22,\"recencyClarity\":25},\"tags\":[\"eastAsiaGossip\",\"live-ingest\",\"region:tw\",\"中央社-產經證券\",\"自由時報\",\"ettoday-影劇\"],\"region\":\"tw\",\"glossary\":[{\"term\":{\"en\":\"Taipei 101\",\"zh-TW\":\"台北101\"},\"blurb\":{\"en\":\"Taipei landmark tower hosting the National Day light show.\",\"zh-TW\":\"舉辦國慶展演的台北地標大樓。\"}},{\"term\":{\"en\":\"Taishin Shin Kong Financial\",\"zh-TW\":\"台新新光金控\"},\"blurb\":{\"en\":\"Financial holding company sponsoring the show for the second year.\",\"zh-TW\":\"連續第二年贊助國慶展演的金控公司。\"}},{\"term\":{\"en\":\"Chiang Wan-an\",\"zh-TW\":\"蔣萬安\"},\"blurb\":{\"en\":\"Mayor of Taipei, whose hot-pot remark netizens linked to the drone gag.\",\"zh-TW\":\"台北市長，火鍋說法被網友與無人機哏連結。\"}},{\"term\":{\"en\":\"Chia Yung-chieh\",\"zh-TW\":\"賈永婕\"},\"blurb\":{\"en\":\"Chair of Taipei 101 who responded to the hotpot-gag discussion.\",\"zh-TW\":\"回應火鍋哏討論的台北101董事長。\"}},{\"term\":{\"en\":\"Central News Agency\",\"zh-TW\":\"中央社\"},\"blurb\":{\"en\":\"Taiwan's national news agency, source of the program details.\",\"zh-TW\":\"提供展演細節的台灣國家通訊社。\"}},{\"term\":{\"en\":\"Liberty Times\",\"zh-TW\":\"自由時報\"},\"blurb\":{\"en\":\"Taiwanese newspaper that reported the sponsorship.\",\"zh-TW\":\"報導贊助消息的台灣報紙。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"4\",{\"pr
