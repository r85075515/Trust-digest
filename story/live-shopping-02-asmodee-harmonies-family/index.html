ime or on orders of $35 or more. Slickdeals users gave the deal a +19 thumb score.\n\nWhat happened\nThe Slickdeals listing shows Amazon carrying Harmonies at $23.49 — the headline rounds that to $23.50. The same listing notes a previous front-page deal at $27, with a deal score of 29 and 10 comments. Free shipping applies to Prime members or orders over $35.\n\nWhy it matters\nThe saving is modest — about $3.50 off the previous $27 deal — but the +19 thumb score shows deal-hunters consider it a fair price for a family strategy game. For a board-game buyer, this is a small, well-timed discount rather than a deep clearance.\n\nSources agree / disagree\nOnly Slickdeals covers this deal in the cluster, so the price rests on a single listing; there is no second outlet to check it against. The $23.50 headline and $23.49 listing price are the same figure rounded differently, not a conflict. Trust label: Single source — one deal listing, so verify the price on Amazon before buying.\n\nStill uncertain\nDeal prices move fast: the listing does not say how long the $23.49 price lasts or how much stock remains. Check the live Amazon price at checkout, since the deal may already have ended."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-shopping-02-asmodee-harmonies-family\",\"category\":\"shopping\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-shopping-02-asmodee-harmonies-family.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Asmodee Harmonies Family Strategy Board Game $23.50\",\"zh-TW\":\"相關封面圖：Asmodee Harmonies 家庭策略棋盤遊戲 23.50 美元\"},\"publishedAt\":\"2026-11-21T08:31:07.000Z\",\"title\":{\"en\":\"Asmodee's Harmonies Board Game Drops to $23.49 on Amazon\",\"zh-TW\":\"Asmodee《Harmonies》家庭策略桌遊亞馬遜特價 23.49 美元\"},\"summary\":{\"en\":\"Amazon has Asmodee's Harmonies family strategy board game for $23.49, down from a previous front-page deal of $27, with free shipping for Prime members or on order
