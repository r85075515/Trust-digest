n November 26–27, 2026, that third-quarter operating profit reached a record NT$1.802 billion on quarterly revenue of NT$45.304 billion, driven by surging shipments of artificial intelligence servers. Cumulative consolidated revenue for the first three quarters of 2026 rose 57.4 percent year-on-year to NT$118.122 billion, while cumulative earnings per share reached NT$3.77 compared with NT$1.94 in the prior-year period.\n\nThe earnings milestone illustrates how Taiwan's server supply chain continues to capture capital expenditure from hyperscale cloud providers building out AI compute clusters. MiTAC's leadership stated during its investor briefing that the company is expanding manufacturing capacity to accommodate sustained customer demand.\n\nTaiwan News and MiTAC's Q3 earnings call transcript via BigGo Finance both aligned on the record quarterly operating income and AI server growth drivers, with the earnings transcript detailing a 10 percent Q3 gross margin and 5 percent operating margin.\n\nManagement did not issue specific numerical revenue guidance for full-year 2027, as component allocation and customer deployment schedules remain subject to supply chain adjustments.\n\nTrust label: Multi-source agreement — Financial figures and capacity expansion statements were corroborated across Taiwan News and MiTAC's Q3 2026 earnings call transcript."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-tech-083-mitac-record-quarterly-operating-income-ai-servers\",\"category\":\"tech\",\"title\":{\"en\":\"MiTAC Holdings Posts Record Quarterly Operating Income on Strong AI Server Demand\",\"zh-TW\":\"AI 伺服器需求強勁帶動，神達投控第三季營業利益創新高並積極擴充產能\"},\"summary\":{\"en\":\"Taiwan-based MiTAC Holdings Corp. reported record quarterly operating profit of NT$1.802 billion in Q3 2026 as revenue surged on robust AI server demand. Company leadership confirmed ongoing capacity expansion to sustain momentum across cloud computing and enterprise infrastructure.\",\"zh-TW\":\"台灣神達投控（MiTAC Holdings）公布2026年第三季財報，受惠於雲端資料中心與 AI 伺服器需求強勁，單季營業利益達新台幣18.02億元創下歷史新高，前三季累計營收年增57.4%。公司管理層表示正持續擴充海內外產能以支應後續訂單成長。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」神達投控（MiTAC Holdings）於2026年11月26日至27日公布營運成果與法說會訊息，受惠於人工智慧（AI）伺服器出貨強勁，2026年第三季單季合併營收達新台幣453.04億元，單季營業利益攀升至新台幣18.02億元改寫歷史新高。累計今年前三季合併營收達1,181.22億元、年增57.4%，累計稅後每股盈餘（EPS）達3.77元，大幅優於去年同期的1.94元。\\n\\n「為什麼重要」這份財報顯示台灣伺服器供應鏈持續受惠於全球大型雲端服務商（CSP）擴建 AI 算力叢集的資本支出浪潮。神達管理層在法說會中指出，面對客戶對 AI 伺服器與資料中心機櫃的強勁需求，公司正同步推動產能擴充計畫以支撐長期營運成長。\\n\\n「來源異同」Taiwan News 與 BigGo Finance 彙整的神達第三季法說會紀錄均確認單季營業利益創歷史新高及 AI 伺服器成長動能；法說會紀錄進一步揭露第三季毛利率為10%、營業利益率為5%及單季稅後淨利21.75億元等細項財務數據。\\n\\n「仍不確定」神達管理層尚未給出2027年全年的量化營收成長指引，後續實際出貨節奏仍視關鍵零組件供應狀況與客戶資料中心建置進度而定。\"},\"glossary\":[{\"term\":{\"en\":\"Operating income\",\"zh-TW\":\"營業利益\"},\"blurb\":{\"en\":\"Profit realized from a company's core business operations after deducting operating expenses and cost of goods sold.\",\"zh-TW\":\"企業本業營收扣除營業成本與營業費用後的獲利金額，反映核心業務賺錢能力。\"}},{\"term\":{\"en\":\"AI server\",\"zh-TW\":\"AI 伺服器\"},\"blurb\":{\"en\":\"High-performance computing hardware equipped with specialized accelerators designed to train and run artificial intelligence models.\",\"zh-TW\":\"搭載高算力加速器晶片、專為訓練與執行人工智慧模型而設計的高效能資料中心運算設備。\"}},{\"term\":{\"en\":\"Gross margin\",\"zh-TW\":\"毛利率\"},\"blurb\":{\"en\":\"The percentage of revenue retained after accounting for direct production costs.\",\"zh-TW\":\"營業收入減去直接生產成本後的毛利佔營收百分比，用於衡量產品獲利空間。\"}}],\"sources\":[{\"name\":\"Taiwan News\",\"url\":\"https://www.taiwannews.com.tw/en/news/6481817\"},{\"name\":\"BigGo Finance\",\"url\":\"https://finance.biggo.com/quote/3706.TW/earnings-call/TW_3706.TW_2026-11-26\"}],\"imageUrl\":\"/covers/live/live-tech-083-mitac-record-quarterly-operating-income-ai-servers.jpg\",\"imageAlt\":{\"en\":\"High-density AI server racks operating inside a modern data center facility\",\"zh-TW\":\"現代化資料中心機房內運作的高密度 AI 伺服器機櫃\"},\"isHeadline\":false,\"isPopular\":true,\"trustScore\":85,\"trustBreakdown\":{\"crossCorroborat
