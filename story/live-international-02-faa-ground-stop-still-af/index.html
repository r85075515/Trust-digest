dent Xi Jinping and Russia's Vladimir Putin. Two stories share one card: a domestic aviation mess that may clear by tonight, and a high-profile trilateral summit that will dominate the week.\nWhat happened\nU.S. Transportation Secretary Sean Duffy said things could be back to normal at the end of Monday after the FAA ground stop disrupted flights, NPR reports. Trump left for Asia on Monday, PBS reports, for a trip that includes meetings with regional leaders followed by talks with Xi and Putin — his second trip to China this year, coming as the president and his party faced widespread backlash from voters in the recent midterm elections. The same news wrap carries two more threads: Ukrainian President Volodymyr Zelenskyy warned that North Korea is providing Russia with ballistic missiles, and customers at some of the country's largest banks reported difficulty accessing their accounts online.\nWhy it matters\nThe ground stop is the immediate story for travellers; the summit is the week's story for everyone else. The Financial Times' contribution to the bundle makes the point directly: the leaders of the U.S., China and Russia cannot carve up the world between them, even if they wanted to — a caution against reading the trilateral meeting as a new Yalta. The takeaway: the skies may clear tonight, but the summit's meaning will be argued over for much longer.\nSources agree / disagree\nNPR, PBS and the Financial Times agree on the two main threads — the ground stop and the Asia trip — and they cover different angles rather than contradicting each other. The Zelenskyy warning and the bank-access problems are single-mention threads inside the same wrap, reported but not developed.\nStill uncertain\nHow many flights were cancelled or delayed, when the ground stop fully lifts, the summit's agenda and location, and the extent of the bank-access problems were not in the feed material. Verify them in the full reporting before quoting figures.\nTrust label: Bundled stories — three outlets across two main threads plus shorter items in the same news wrap."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-02-faa-ground-stop-still-af\",\"category\":\"international\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-international-02-faa-ground-stop-still-af.jpg\",\"imageAlt\":{\"en\":\"Cover related to: FAA ground stop still affecting thousands of flights. And, Trump meets Xi, Putin in Asia\",\"zh-TW\":\"相關封面圖：美國聯邦航空局 (FAA) 地面停止仍影響數千個航班。而且，川普在亞洲會見習近平和普丁\"},\"publishedAt\":\"2026-11-16T23:45:40.000Z\",\"title\":{\"en\":\"FAA Ground Stop Still Snarling Flights as Trump Heads to Asia for Xi-Putin Summit\",\"zh-TW\":\"FAA 地面停飛仍擾亂數千航班，川普啟程赴亞洲會習近平與普丁\"},\"summary\":{\"en\":\"The FAA ground stop is still disrupting thousands of flights, but Transportation Secretary Sean Duffy said things could be back to normal by the end of Monday. President Trump has left for Asia, where he will meet leaders before talks with China's Xi Jinping and Russia's Vladimir Putin. Takeaway: the skies may clear tonight; the summit is the main event.\",\"zh-TW\":\"FAA 地面停飛仍在擾亂數千航班，但運輸部長尚恩·達菲（Sean Duffy）表示，情況可能在週一結束前恢復正常。與此同時，川普總統已啟程前往亞洲，將先會晤區域領袖，再與中國國家主席習近平、俄羅斯總統普丁會談。結論：天空今晚或許放晴；峰會才是本週主戲。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"FAA 地面停飛仍在影響數千航班，川普總統也已啟程前往亞洲，將先會晤區域領袖，再與中國國家主席習近平、俄羅斯總統普丁會談。一張卡裡有兩則新聞：今晚可能恢復的國內航空亂象，以及將主導本週的高規格三方峰會。\\n發生了什麼事\\nNPR 報導，美國運輸部長尚恩·達菲（Sean Duffy）表示，FAA 地面停飛擾亂航班後，情況可能在週一結束前恢復正常。PBS 報導，川普週一啟程前往亞洲，此行包括會晤區域領袖，隨後與習近平和普丁會談——這是他今年第二次訪問中國，正值總統及其政黨在最近的中期選舉中面臨選民廣泛反彈。同一則新聞綜述還帶出另外兩條線：烏克蘭總統澤倫斯基（Volodymyr Zelenskyy）警告北韓正在向俄羅斯提供彈道飛彈，以及該國幾家最大銀行的客戶反映無法在線上存取帳戶。\\n為什麼重要\\n地面停飛是旅客眼前的故事；峰會是其他所有人本週的故事。《金融時報》在這批來源中的觀點說得很直接：美中俄領袖即使想瓜分世界也做不到——這是對把三方會晤讀成「新雅爾達」的提醒。結論是：天空今晚或許放晴，但峰會的意義會被爭論更久。\\n來源異同\\nNPR、PBS 與《金融時報》在兩條主線上一致——地面停飛與亞洲之行——三家報的是不同角度，而非互相矛盾。澤倫斯基的警告與銀行存取問題是同一綜述中僅提及一次的線索，有報導但未展開。\\n仍不確定\\n取消或延誤的航班數量、地面停飛何時完全解除、峰會的議程與地點、銀行存取問題的範圍，摘要都沒有，引用數字前請查完整報導。\"},\"sources\":[{\"name\":\"NPR World\",\"url\":\"https://www.npr.org/2026/11/16/g-s1-153841/up-first-newsletter-faa-ground-stop-democratic-leaders-congress-trump-asia-trip\"},{\"name\":\"PBS NewsHour\",\"url\":\"https://www.pbs.org/newshour/show/news-wrap-trump-departs-for-trip-to-asia-meetings-with-xi-and-putin\"},{\"name\":\"Financial Times\",\"url\":\"https://www.ft.com/content/f87fc05f-6689-4051-9d6b-40754315355f?syn-25a6b1a6=1\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":20,\"outletReputation\":21,\"crossCorroboration\":22,\"recencyClarity\":25},\"tags\":[\"international\",\"live-ingest\",\"npr-world\",\"npr-world\",\"pbs-newshour\"],\"glossary\":[{\"term\":{\"en\":\"Sean Duffy\",\"zh-TW\":\"尚恩·達菲（Sean Duffy）\"},\"blurb\":{\"en\":\"U.S. transportation secretary who spoke on the ground stop.\",\"zh-TW\":\"就地面停飛發言的美國運輸部長。\"}},{\"term\":{\"en\":\"FAA\",\"zh-TW\":\"美國聯邦航空總署（FAA）\"},\"blurb\":{\"en\":\"U.S. aviation regulator behind the ground stop.\",\"zh-TW\":\"發布地面停飛的美國航空監管機關。\"}},{\"term\":{\"en\":\"Donald Trump\",\"zh-TW\":\"唐納·川普（Donald Trump）\"},\"blurb\":{\"en\":\"U.S. president travelling to Asia for the summit.\",\"zh-TW\":\"前往亞洲參加峰會的美國總統。\"}},{\"term\":{\"en\":\"Xi Jinping\",\"zh-TW\":\"習近平（Xi Jinping）\"},\"blurb\":{\"en\":\"Chinese president meeting Trump in Asia.\",\"zh-TW\":\"將在亞洲與川普會晤的中國國家主席。\"}},{\"term\":{\"en\":\"Vladimir Putin\",\"zh-TW\":\"普丁（Vladimir Putin）\"},\"blurb\":{\"en\":\"Russian president meeting Trump in Asia.\",\"zh-TW\":\"將在亞洲與川普會晤的俄羅斯總統。\"}},{\"term\":{\"en\":\"Volodymyr Zelenskyy\",\"zh-TW\":\"澤倫斯基（Volodymyr Zelenskyy）\"},\"blurb\":{\"en\":\"Ukrainian president who warned on North Korean missiles.\",\"zh-TW\":\"警告北韓飛彈問題的烏克蘭總統。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"ch
