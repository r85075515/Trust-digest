r, Jack Lowden and Josh O'Connor.\nWhat happened\nThe BBC reports that the final screen tests take place this weekend, and that Turner and Lowden appear to be in the mix of actors doing screen tests for the role. Hollywood Life names all three as in the running. NPR offers a perspective piece on the next Bond, rounding out a three-outlet cluster that agrees on the shape of the story: tests now, announcement presumably soon.\nWhy it matters\nThe judgment is that the casting is the franchise: Bond survives by reinvention, and the choice of actor sets the tone for a decade of films. A weekend of final tests means the speculation phase — the lists, the bookmakers, the fan campaigns — is about to meet a decision. For readers, the fun is that all three names are plausible, and none is confirmed.\nSources agree / disagree\nHollywood Life, BBC Entertainment and NPR News cover the same casting moment with no conflicting facts in the snippets: three names, final tests, this weekend. The reporting is hedged throughout — 'reportedly,' 'appear to be' — and this digest keeps that hedge. Trust label: consistent, but unconfirmed — three outlets, one reported shortlist, no official announcement.\nStill uncertain\nNothing here is official: no studio announcement, no confirmation from the actors, no date for the reveal. The snippets also do not say who else tested, or when the decision will be announced. Treat the three names as a reported shortlist, not a cast list."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-entertainment-01-who-will-be-the-next-jam\",\"category\":\"entertainment\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-entertainment-01-who-will-be-the-next-jam.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Who Will Be the Next James Bond? Callum Turner, Jack Lowden \u0026 Josh O’Connor Are in the Running\",\"zh-TW\":\"相關封面圖：誰將成為下一個詹姆士龐德？卡勒姆·特納、傑克·勞登和喬什·奧康納正在競選中\"},\"publishedAt\":\"2026-10-24T20:36:38.000Z\",\"title\":{\"en\":\"Callum Turner, Jack Lowden and Josh O'Connor in Running as Final James Bond Screen Tests Near\",\"zh-TW\":\"卡勒姆·特納（Callum Turner）、傑克·勞登（Jack Lowden）、喬什·奧康納（Josh O'Connor）角逐下一任詹姆士龐德（James Bond）\"},\"summary\":{\"en\":\"Three actors are reportedly in the final screen tests to take on 007: Callum Turner, Jack Lowden and Josh O'Connor. The BBC reports the tests take place this weekend, with Turner and Lowden appearing to be in the mix. A new Bond is nigh for the 64-year-old franchise. Takeaway: the longest casting watch in movies is nearly over — reportedly.\",\"zh-TW\":\"英國演員卡勒姆·特納（Callum Turner）、傑克·勞登（Jack Lowden）與喬什·奧康納（Josh O'Connor）據報導進入最終試鏡，角逐 007 詹姆士龐德（James Bond）一角。英國廣播公司（BBC）報導最終試鏡就在這個週末，特納與勞登看來都在試鏡名單中。結論：影史最久的選角等待據說就快結束，新龐德即將揭曉。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"新的詹姆士龐德即將誕生，接替在這個 64 年電影系列中的上一任演員。據報導，三名英國演員進入最終試鏡，有望接下 007 一角：卡勒姆·特納（Callum Turner）、傑克·勞登（Jack Lowden）與喬什·奧康納（Josh O'Connor）。\\n發生了什麼事\\n英國廣播公司（BBC）報導，最終試鏡就在這個週末，特納與勞登看來都在試鏡名單中。好萊塢生活（Hollywood Life）則點名三人都在角逐行列。國家公共廣播電台（NPR）從評論角度談下一任龐德，三家媒體合起來勾勒出同一輪廓：本週末試鏡，公布應該不遠。\\n為什麼重要\\n判斷是，選角本身就是龐德系列：龐德靠重新塑造活下去，演員人選決定未來十年電影的調性。最終試鏡週末一到，猜測階段——名單、賭盤、粉絲造勢——就快要碰上真正的決定。對讀者來說，樂趣在於三個人選都合理，而且沒有一個獲得證實。\\n來源異同\\n好萊塢生活（Hollywood Life）、BBC 娛樂與 NPR 報導同一選角時刻，摘要片段中沒有事實衝突：三個人名、最終試鏡、本週末。整批報導都帶保留語氣——「據報導」「看來」——本摘要保留同樣的保留。信任標籤：報導一致、但未經證實——三家媒體、同一份據傳短名單、沒有官方公布。\\n仍不確定\\n這裡沒有任何官方消息：沒有片商公布、沒有演員證實、沒有揭曉日期。摘要片段也沒說還有哪些人參加試鏡、何時公布決定。請把三個人名當成據傳短名單，不是演員名單。\"},\"sources\":[{\"name\":\"Hollywood Life\",\"url\":\"https://hollywoodlife.com/feature/who-will-be-the-next-james-bond-5567575/\"},{\"name\":\"BBC Entertainment\",\"url\":\"https://www.bbc.co.uk/news/articles/c50mep10dek7o?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"NPR News\",\"url\":\"https://www.npr.org/2026/10/24/nx-s1-6004258/perspective-the-next-james-bond\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":21,\"outletReputation\":19,\"crossCorroboration\":22,\"recencyClarity\":25},\"tags\":[\"entertainment\",\"live-ingest\",\"hollywood-life\",\"bbc-entertainment\",\"npr-news\"],\"glossary\":[{\"term\":{\"en\":\"James Bond\",\"zh-TW\":\"詹姆士龐德\"},\"blurb\":{\"en\":\"Fictional British secret agent, codenamed 007, at the centre of this casting story.\",\"zh-TW\":\"虛構英國特務，代號 007，本則選角新聞的主角。\"}},{\"term\":{\"en\":\"Callum Turner\",\"zh-TW\":\"卡勒姆·特納\"},\"blurb\":{\"en\":\"British actor reportedly in the final screen tests for James Bond.\",\"zh-TW\":\"英國演員，據報導進入詹姆士龐德最終試鏡。\"}},{\"term\":{\"en\":\"Jack Lowden\",\"zh-TW\":\"傑克·勞登\"},\"blurb\":{\"en\":\"British actor reportedly in the mix for the James Bond screen tests.\",\"zh-TW\":\"英國演員，據報導在詹姆士龐德試鏡名單中。\"}},{\"term\":{\"en\":\"Josh O'Connor\",\"zh-TW\":\"喬什·奧康納\"},\"blurb\":{\"en\":\"British actor named as in the running for the next James Bond.\",\"zh-TW\":\"英國演員，被點名角逐下一任詹姆士龐德。\"}},{\"term\":{\"en\":\"BBC Entertainment\",\"zh-TW\":\"BBC 娛樂\"},\"blurb\":{\"en\":\"Entertainment desk of the British broadcaster, reporting the final tests this weekend.\",\"zh-TW\":\"英國廣播公司娛樂版面，報導最終試鏡就在本週末。\"}},{\"term\":{\"en\":\"Hollywood Life\",\"zh-TW\":\"好萊塢生活\"},\"blurb\":{\"en\":\"Entertainment outlet naming all three actors as in the running.\",\"zh-TW\":\"娛樂媒體，點名三位演員都在角逐行列。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scor
