injectable glucose monitor without sacrificing detection performance.\n\nUnlike conventional continuous glucose monitors that rely on enzymes—which degrade over time and add manufacturing expense—the Texas A\u0026M team's non-enzymatic sensor uses fluorescent molecules and near-infrared light to measure blood sugar levels from beneath the skin. By substituting a β-anomeric mannopentaose-based sensing chemistry, the researchers achieved comparable glucose-sensing performance at a fraction of the material cost.\n\nThe project was funded by the National Science Foundation (NSF) Engineering Research Center for Precise Advanced Technologies and Health Systems for Under-resourced Populations. Researchers noted that additional development and testing are still required before the injectable sensor can advance to human clinical trials.\n\nTrust label: Single source — ScienceDaily report summarizing peer-reviewed findings and Texas A\u0026M University release."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-biotech-045-texas-am-injectable-glucose-sensor\",\"category\":\"biotech\",\"title\":{\"en\":\"Texas A\u0026M Researchers Cut Key Component Cost of Injectable Glucose Sensor\",\"zh-TW\":\"德州農工大學突破皮下注射式血糖感測器材料瓶頸 大幅降低關鍵元件成本\"},\"summary\":{\"en\":\"Texas A\u0026M University researchers developed a lower-cost sensing component for an experimental injectable glucose monitor that uses near-infrared fluorescent light instead of enzymes, preserving accuracy while improving affordability for diabetes care.\",\"zh-TW\":\"美國德州農工大學（Texas A\u0026M University）研究團隊成功大幅降低實驗性皮下注射血糖感測器關鍵感測元件的材料成本，同時維持同等量測精準度。該技術改採近紅外光與螢光分子取代傳統酵素，為普及低成本連續血糖監測奠定基礎。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n美國德州農工大學（Texas A\u0026M University）研究團隊發表最新研究成果，成功在實驗性皮下注射式血糖感測器中，大幅降低關鍵感測元件的製造成本，且未犧牲感測靈敏度與準確性。該研究獲得美國國家科學基金會（NSF）旗下「資源匱乏族群精準先進技術與健康系統工程研究中心」資助。\\n\\n「為什麼重要」\\n目前市面主流的連續血糖監測儀（CGM）多依賴酵素（enzymes）偵測血糖，但酵素隨時間容易降解且推高製造成本，限制了中低收入族群的取得管道。德州農工大學團隊改採「非酵素式」（non-enzymatic）路線，透過皮下植入的螢光分子與近紅外光（near-infrared light）訊號判讀血糖濃度，並以 β-異頭物甘露五糖（β-anomeric mannopentaose）為基礎開發低成本感測材料，有望讓長期連續血糖監測變得更平價普及。\\n\\n「來源異同」\\n本則報導主要依據科學新聞平台 ScienceDaily 轉載德州農工大學官方研究新聞稿與期刊論文摘要，屬單一學術機構發布之基礎研究進展，目前尚無其他獨立媒體進行交叉報導或臨床專家外部評論。\\n\\n「仍不確定」\\n該皮下注射式感測器目前仍處於實驗室研發階段，距離人體臨床試驗、美國食品藥物管理局（FDA）法規審查及實際商業化量產的時間表，以及長期植入人體後的生物相容性表現，均有待後續驗證。\"},\"glossary\":[{\"term\":{\"en\":\"Near-infrared (NIR) fluorescence\",\"zh-TW\":\"近紅外光螢光\"},\"blurb\":{\"en\":\"Light signals in the near-infrared spectrum emitted by fluorescent molecules that can penetrate skin tissue for non-invasive optical readout.\",\"zh-TW\":\"螢光分子受激發後發出的近紅外光波段訊號，具備穿透表層皮膚組織的能力，可用於體外光學讀取生理數據。\"}},{\"term\":{\"en\":\"Non-enzymatic glucose sensor\",\"zh-TW\":\"非酵素式血糖感測器\"},\"blurb\":{\"en\":\"A biosensor that detects glucose levels chemically or optically without relying on biological enzymes that degrade over time.\",\"zh-TW\":\"不依賴易隨時間降解的生物酵素，改以化學或光學分子直接感測葡萄糖濃度的生物感測器。\"}},{\"term\":{\"en\":\"Continuous glucose monitoring (CGM)\",\"zh-TW\":\"連續血糖監測\"},\"blurb\":{\"en\":\"A wearable or implantable medical technology that tracks blood sugar levels continuously day and night without repeated finger-prick tests.\",\"zh-TW\":\"透過穿戴式或植入式感測器全天候自動追蹤血糖變化的醫療技術，可減少反覆採血針刺。\"}}],\"sources\":[{\"name\":\"ScienceDaily\",\"url\":\"https://www.sciencedaily.com/releases/2026/11/261125045256.htm\"},{\"name\":\"Texas A\u0026M Stories\",\"url\":\"https://stories.tamu.edu/news/2026/11/03/researchers-develop-glucose-sensor-component-at-one-tenth-the-cost/\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"Optical glucose monitoring concept using near-infrared fluorescent light beneath the skin\",\"zh-TW\":\"利用皮下近紅外光螢光偵測血糖的生醫感測示意圖\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":74,\"trustBreakdown\":{\"crossCorroboration\":15,\"outletReputation\":21,\"recencyClarity\":22,\"sourceDiversity\":16},\"publishedAt\":\"2026-11-27T14:15:54.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":4,\"D2\":4,\"D3\":3,\"D4\":4,\"D5\":3,\"total\
