side the animal impact: a surge in cases is putting farmers under severe pressure and stress. The snippet truncates after introducing a further point beginning with the topic, so case numbers, regions, dates, and any government measures discussed are not visible in the feed text, and this digest does not supply them.\nWhy it matters\nThe story matters because a record season of a disease that can kill livestock and cause stillbirths is simultaneously an animal welfare emergency, a farm livelihood problem, and a mental pressure issue for farmers, which is how the veterinary association framed it to lawmakers. Presenting it to MPs puts the response in the policy arena, where support for affected farms and disease control would be decided, though the snippet does not report what MPs were asked to do or what they responded.\nSources agree / disagree\nThe Guardian Climate Crisis is the only outlet in this cluster, so there is no second account to compare. Trust label: Single source — the record-season claim, the welfare-crisis characterization, and the farmer-stress testimony all rest on this one Guardian report as excerpted.\nStill uncertain\nCase counts, the areas most affected, how this season compares numerically with previous ones, what caused the surge, and what action, if any, was proposed to MPs all remain uncertain from the truncated snippet. The full article would be needed for the scale of the outbreak and any official response."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-energy-02-great-britain-s-worst-ev\",\"category\":\"energy\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-energy-02-great-britain-s-worst-ev.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Great Britain’s worst-ever bluetongue season ‘a major animal welfare crisis’\",\"zh-TW\":\"相關封面圖：英國有史以來最嚴重的藍舌病季節“一場重大的動物福利危機”\"},\"publishedAt\":\"2026-11-03T15:50:12.000Z\",\"title\":{\"en\":\"Great Britain's worst bluetongue season called a major animal welfare crisis\",\"zh-TW\":\"英國（Great Britain）史上最嚴重藍舌病疫情被稱為重大動物福利危機\"},\"summary\":{\"en\":\"The worst bluetongue season on record has been a major animal welfare crisis in Great Britain, MPs have been told, putting farmers under severe emotional stress. The British Veterinary Association president told MPs a surge in cases is putting farmers under severe pressure, the Guardian reports.\",\"zh-TW\":\"衛報（The Guardian）報導，國會議員被告知，英國（Great Britain）有紀錄以來最嚴重的藍舌病季節已構成重大動物福利危機，農民承受嚴重情緒壓力。英國獸醫協會（British Veterinary Association）主席向議員表示，病例激增使農民面臨巨大壓力。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"英國（Great Britain）正經歷有紀錄以來最嚴重的藍舌病季節；英國獸醫協會（British Veterinary Association）主席向國會議員形容，這波激增已構成重大動物福利危機，使農民承受巨大壓力與嚴重情緒壓力。\\n發生了什麼事\\n衛報（The Guardian）報導，議員被告知，有紀錄以來最嚴重的藍舌病季節是英國（Great Britain）的一場重大動物福利危機。摘要將藍舌病描述為影響綿羊、牛與山羊的病毒性疾病，可造成發燒、病變、死產與死亡。協會主席向議員傳達的訊息，依摘要同時聚焦動物與人的影響：病例激增使農民面臨巨大壓力。摘要在引入下一個論點後即截斷，因此病例數字、地區、日期與討論中的政府措施都未見於摘要，本摘要不另行補充。\\n為什麼重要\\n此事重要，是因為這種可致牲畜死亡與死產的疾病創紀錄流行，同時是動物福利緊急事件、農民生計問題與農民心理壓力問題，獸醫協會向立法者正是如此呈現。將此事提交國會議員，使回應進入政策場域，受影響農場的支援與疾病控管將在此決定，不過摘要未報導議員被要求做什麼或如何回應。\\n來源異同\\n衛報氣候危機版（The Guardian Climate Crisis）是此群組唯一來源，沒有第二個說法可供比對。創紀錄季節的主張、福利危機的定性，以及農民壓力的證詞，都建立在這一份衛報（The Guardian）摘錄報導上。\\n仍不確定\\n病例數、受影響最嚴重的地區、本季與過往在數字上的比較、激增原因，以及是否向議員提出任何行動，僅憑截斷的摘要都仍不確定。需要完整文章才能了解疫情規模與官方回應。\"},\"sources\":[{\"name\":\"The Guardian Climate Crisis\",\"url\":\"https://www.theguardian.com/environment/2026/nov/03/great-britain-worst-ever-bluetongue-season-major-animal-welfare-crisis\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"energy\",\"live-ingest\",\"the-guardian-climate-crisis\"],\"glossary\":[{\"term\":{\"en\":\"Bluetongue\",\"zh-TW\":\"藍舌病（Bluetongue）\"},\"blurb\":{\"en\":\"Bluetongue is the viral disease affecting sheep, cattle and goats in the report.\",\"zh-TW\":\"藍舌病（Bluetongue）是報導中影響綿羊、牛與山羊的病毒性疾病。\"}},{\"term\":{\"en\":\"British Veterinary Association\",\"zh-TW\":\"英國獸醫協會（British Veterinary Association）\"},\"blurb\":{\"en\":\"The British Veterinary Association is the body whose president addressed MPs on the outbreak.\",\"zh-TW\":\"英國獸醫協會（British Veterinary Association）是其主席就疫情向國會議員發言的團體。\"}},{\"term\":{\"en\":\"The Guardian\",\"zh-TW\":\"衛報（The Guardian）\"},\"blurb\":{\"en\":\"The Guardian is the newspaper reporting the testimony to MPs.\",\"zh-TW\":\"衛報（The Guardian）是報導這場向議員證詞的報紙。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-energy-02-great-britain-s-worst-ev/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-energy-02-great-britain-s-worst-ev/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"d:\"$8:metadata\"\n"])</script></body></html>
