 has circulated online.\nWhat happened\nCaizhu (小栗彩朱佳), a cast member of Netflix dating reality show \"Bad Love 2\" (不良一族尋愛記2), was arrested on suspicion of letting staff provide hostess services at her own bar without the required license, in violation of Japan's Entertainment Business Act. Police arrested her together with two men. Cram-school celebrity and entrepreneur Lin Shang-hong posted that he was present when officers suddenly entered the private room, showed their credentials and took her away. Japanese netizens have also resurfaced an earlier controversy from her time on the show, questioning whether she ever reformed.\nWhy it matters\nThe arrest collapses the image Caizhu built as an influencer with a large following: a dating-show personality whose appeal rested on a reformed, straight-talking persona is now the subject of a police case about the very nightlife world the show traded on. For the show itself, it is a reminder that casting \"bad\" personalities carries reputational risk beyond the screen.\nSources agree / disagree\nETtoday, Yahoo TW and Google News TW agree on the core facts: the arrest, the unlicensed hostess work, the two other men arrested, and Lin's eyewitness post. Trust label: Multi-source agreement — three outlets agree on the arrest and the unlicensed hostess operation.\nStill uncertain\nThe snippets do not say what charges will follow, how the bar's licensing actually worked, or what Lin was doing at the bar that night. The earlier on-show controversy is mentioned only in headlines; its details are not in the material at hand."])</script><script>self.__next_f.push([1,"11:T402,"])</script><script>self.__next_f.push([1,"https://news.google.com/rss/articles/CBMi6gJBVV95cUxPdThzSHlreC14VG5BMU9oTG14REU5V1hqckdYdkhhVXBSU2dfWHA4SV9Qelgxa01oWTJfSy1HREstVlFEcmlRNlBNRTJ0REdpRDQxOWdwNmNaemJfOEltT3UtWVRuQUc1My1WNVV1TXBNSE1kZkk4eURZdG5qdmNaTHhWN1pFR1Z4QVpLWUltMzdRc0M4TW5uQ3BJWlhGaTRrSEsyTm82Ty1kSDRIR3JPQ0lzUThJS2ZtQUphM08xR0h3MzRuMVZEQXQ3ZUZjS 讓員工陪客喝酒、提供接待服務，違反日本《風俗營業法》（風營法），與另外 2 名男子一同遭逮。補教名人兼企業家林尚弘發文透露，警方上門抓人的當下他就在現場，親眼看著大批警察突然闖入包廂、亮出證件，最後將人直接帶走。日本網友也翻出她在節目期間的舊爭議，質疑她根本沒改過自新。\\n為什麼重要\\n這次逮捕摧毀了彩朱靠大批追蹤建立的形象：一個以浪子回頭、直言不諱為賣點的戀綜人物，如今成了夜生活經營違規的警方案件主角。對節目本身而言，這也提醒了觀眾，找「不良」人物上節目，名譽風險不只在螢幕上。\\n來源異同\\nETtoday、Yahoo TW 與 Google News TW 對核心事實一致：逮捕、無照陪酒、同案 2 名男子，以及林尚弘在場目睹的發文。信任標籤：N源一致——三家媒體對逮捕與無照陪酒的報導一致。\\n仍不確定\\n摘要未說明後續會如何起訴、酒吧的證照狀況實際如何，也沒說林尚弘當晚為何在場；節目期間的舊爭議只見於標題，細節不在現有材料中。\"},\"sources\":[{\"name\":\"ETtoday 影劇\",\"url\":\"https://star.ettoday.net/news/3272465\"},{\"name\":\"Google News\",\"url\":\"$11\"},{\"name\":\"Yahoo TW 娛樂\",\"url\":\"https://tw.news.yahoo.com/%E4%B8%8D%E8%89%AF-%E6%97%8F2-%E5%BD%A9%E6%9C%B1%E8%A2%AB%E6%8D%95-%E9%96%8B%E5%BA%97%E6%B6%89-%E7%84%A1%E7%85%A7%E9%99%AA%E9%85%92-065205122.html\"}],\"disagreements\":{\"en\":\"Figures 80 and 1.5 refer to different things — 800,000 followers versus 1.5 hours in an unrelated earlier incident on the show — so there is no numeric conflict.\",\"zh-TW\":\"數字 80 與 1.5 指涉不同事項——80萬為追蹤人數，1.5小時為另一則舊聞提及的節目事件時長，故不構成數字衝突。\"},\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":21,\"outletReputation\":16,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"eastAsiaGossip\",\"live-ingest\",\"region:tw\",\"ettoday-影劇\",\"ettoday-影劇\",\"google-news-tw-entertainment\"],\"region\":\"tw\",\"glossary\":[{\"term\":{\"en\":\"Caizhu\",\"zh-TW\":\"彩朱（小栗彩朱佳）\"},\"blurb\":{\"en\":\"Cast member of the Netflix dating show, with 800,000 followers, arrested in Aichi.\",\"zh-TW\":\"Netflix 戀綜成員，坐擁 80 萬追蹤，在愛知縣被捕。\"}},{\"term\":{\"en\":\"Bad Love 2\",\"zh-TW\":\"《不良一族尋愛記2》\"},\"blurb\":{\"en\":\"Netflix dating reality show Caizhu appeared on.\",\"zh-TW\":\"Netflix 戀愛實境節目，彩朱參與演出。\"}},{\"term\":{\"en\":\"Lin Shang-hong\",\"zh-TW\":\"林尚弘\"},\"blurb\":{\"en\":\"Cram-school celebrity and entrepreneur who says he witnessed the police raid.\",\"zh-TW\":\"補教名人兼企業家，發文稱目睹警方突襲。\"}},{\"term\":{\"en\":\"Aichi\",\"zh-TW\":\"愛知縣\"},\"blurb\":{\"en\":\"Japanese prefecture whose police co
