 first word on the 2027 edition's concept.\nWhy it matters\nThe Met Gala theme sets the creative brief for fashion's most watched night, and this choice points the industry's spotlight at the everyday rather than the spectacular. Elevating T-shirts and jeans, and treating throwaway materials as art, is a statement about where fashion finds value — in the familiar, not only in the rare. The theme will shape the red carpet, the exhibition and the conversation around both.\nSources agree / disagree\nThis card rests on a single Vogue Taiwan report, so there is no second outlet to check the theme or its framing against. Trust label: Single source — one outlet reported the theme announcement.\nStill uncertain\nThe snippet gives no exhibition dates, venue details, curators or participating designers, and no word on the gala's co-chairs or dress code. The full announcement and the exhibition's schedule are not shown here. Check the full reporting before quoting dates or names."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-beauty-01-2027-met-gala-extraordin\",\"category\":\"beauty\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-beauty-01-2027-met-gala-extraordin.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 2027 Met Gala主題正式揭曉：「extraORDINARY非凡日常：時尚與日常的詩意」\",\"zh-TW\":\"相關封面圖：2027 Met Gala主題正式揭曉：「extraORDINARY非凡日常：時尚與日常的詩意」\"},\"publishedAt\":\"2026-11-06T01:32:52.000Z\",\"title\":{\"en\":\"2027 Met Gala Theme 'extraORDINARY' Turns Everyday Fashion Into Art\",\"zh-TW\":\"2027 Met Gala 主題揭曉：「非凡日常」把日常時尚變藝術\"},\"summary\":{\"en\":\"The 2027 Met Gala theme is 'extraORDINARY: Fashion and the Poetics of the Everyday,' inviting visitors to look again at daily life. The exhibition will elevate classic garments such as T-shirts and jeans, and show designers turning paper, aluminium and plastic into wearable art.\",\"zh-TW\":\"2027 年 Met Gala 主題定為「extraORDINARY：時尚與日常的詩意」，邀請觀眾「重新觀看」日常生活。展覽將昇華 T 恤、牛仔褲等經典單品，也呈現設計師如何把紙、鋁材、塑膠變成可穿戴藝術。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"2027 年 Met Gala 主題定為「extraORDINARY：時尚與日常的詩意」，邀請觀眾「重新觀看」日常生活。Vogue Taiwan 如此報導。\\n發生了什麼事\\n主題全名為「extraORDINARY：Fashion and the Poetics of the Everyday」（非凡日常：時尚與日常的詩意），展覽將圍繞「重新觀看」日常生活展開。展覽將從兩個方向切入：聚焦 T 恤、牛仔褲等經典服裝的昇華，也探討設計師如何將紙張、鋁材、塑膠等樸素、甚至被視為「一次性」的材料，轉化為可穿戴的藝術作品。這是 2027 年展覽概念首次公布。\\n為什麼重要\\nMet Gala 主題等於為時尚界最受矚目的一夜定下創作命題，這次選擇把聚光燈打向日常而非華麗奇觀。昇華 T 恤與牛仔褲、把一次性材料當成藝術，是對時尚價值來源的一種表態：價值藏在熟悉的事物裡，不只在稀有之物。主題將牽動紅毯、展覽與圍繞兩者的討論。\\n來源異同\\n本卡只有 Vogue Taiwan 一篇報導，沒有第二家媒體可以核對主題或展覽方向。信任標籤：單一來源——只有一家媒體報導主題公布。\\n仍不確定\\n來源摘要沒有寫明展覽日期、場地細節、策展人或參展設計師，也沒有晚會共同主席或著裝要求；完整公布內容與展覽時程未在摘要中呈現，引用日期或人名之前請查閱完整報導。\"},\"sources\":[{\"name\":\"Vogue Taiwan\",\"url\":\"https://www.vogue.com.tw/article/met-gala-2027-theme-extraordinary-fashion-and-the-poetics-of-the-everyday\"}],\"disagreements\":null,\"trustScore\":47,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":10,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"beauty\",\"live-ingest\",\"vogue-taiwan\"],\"glossary\":[{\"term\":{\"en\":\"Met Gala\",\"zh-TW\":\"Met Gala\"},\"blurb\":{\"en\":\"The Metropolitan Museum of Art's annual charity gala, fashion's most watched night.\",\"zh-TW\":\"紐約大都會藝術博物館年度慈善晚會，時尚界最受矚目的盛事。\"}},{\"term\":{\"en\":\"Vogue Taiwan\",\"zh-TW\":\"Vogue Taiwan\"},\"blurb\":{\"en\":\"Taiwan edition of Vogue magazine and this card's only source.\",\"zh-TW\":\"台灣版《Vogue》時尚雜誌，本卡的唯一來源。\"}},{\"term\":{\"en\":\"extraORDINARY\",\"zh-TW\":\"非凡日常\"},\"blurb\":{\"en\":\"The 2027 Met Gala theme, meaning the extraordinary within the everyday.\",\"zh-TW\":\"2027 年 Met Gala 主題，意為「非凡日常」。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"na
