r Jason Wheatley (傑森・惠特利) and a friend came across the scene and helped stabilize her injury before Phoenix fire crews conducted a helicopter hoist rescue to take her to a hospital.\n\nWhy it matters\nSteep terrain and heat or exertion hazards on Camelback Mountain often complicate ground evacuations when a hiker cannot walk. Immediate stabilization by an experienced first responder alongside aerial extraction helps prevent secondary injury and frees ground teams.\n\nSource differences\nBoth PeachtreeTV, titled \"Off-duty firefighter helps rescue teen from Camelback Mountain - PeachtreeTV\", and WVLT, titled \"Off-duty firefighter helps rescue teen from Camelback Mountain\", carry the same underlying wire report covering the 13-year-old's fall, Jason Wheatley's assistance, and the helicopter hoist.\n\nStill uncertain\nDetails on the exact trail route on Camelback Mountain, the girl's hospital condition after transport, and whether any additional hikers required aid are not specified in the provided reports.\n\nTrust label: Single source — Both PeachtreeTV and WVLT share the same underlying report on the rescue."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-arizona-377-camelback-teen-rescue\",\"category\":\"arizona\",\"title\":{\"en\":\"Off-Duty Firefighter Helps Rescue Injured Teen on Camelback Mountain\",\"zh-TW\":\"休假消防員協助救援駱駝背山受傷少女\"},\"summary\":{\"en\":\"On Thanksgiving morning, a 13-year-old girl suffered an ankle injury after falling on Camelback Mountain and was hoisted out by helicopter with help from an off-duty Scottsdale firefighter. Quick bystander medical stabilization and aerial rescue allowed rapid transport without prolonged trail delays.\",\"zh-TW\":\"2026 年 11 月 26 日感恩節上午，一名 13 歲少女在駱駝背山健行摔倒導致腳踝受傷無法行走，由休假中的斯科茨代爾消防員協助穩定傷勢並由鳳凰城消防局直升機吊掛送醫。及時現場處置與空中救援縮短了山區脫困時間。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n2026 年 11 月 26 日感恩節上午，一名 13 歲少女在駱駝背山（Camelback Mountain）健行時摔倒並傷及腳踝，導致無法自行行走。休假中的斯科茨代爾（Scottsdale）消防員傑森・惠特利（Jason Wheatley）與友人恰巧路過並協助穩定傷勢，隨後鳳凰城消防局出動直升機將少女吊掛送醫。\\n\\n「為什麼重要」\\n駱駝背山坡度陡峭，健行者一旦無法行走，地面搬運耗時且風險較高。具備急救專業的休假人員先行穩定傷勢，搭配直升機吊掛後送，有助降低二次傷害風險並加快救援效率。\\n\\n「來源異同」\\nPeachtreeTV 頁面標題為「Off-duty firefighter helps rescue teen from Camelback Mountain - PeachtreeTV」，WVLT 頁面標題為「Off-duty firefighter helps rescue teen from Camelback Mountain」；兩者內容均圍繞 13 歲少女摔倒、傑森・惠特利協助處置與直升機吊掛救援，屬同一報導來源。\\n\\n「仍不確定」\\n目前公開報導未說明少女確切行走的步道路線、送醫後的最新傷勢狀況，以及同場是否有其他同行者需要協助。\\n\\nTrust label: Single source — PeachtreeTV 與 WVLT 源自同一則救援報導。\"},\"glossary\":[{\"term\":{\"en\":\"Camelback Mountain\",\"zh-TW\":\"駱駝背山\"},\"blurb\":{\"en\":\"A prominent mountain landmark and popular hiking destination in Phoenix, Arizona.\",\"zh-TW\":\"位於亞利桑那州鳳凰城的知名山峰地標與熱門健行地點。\"}},{\"term\":{\"en\":\"Helicopter hoist rescue\",\"zh-TW\":\"直升機吊掛救援\"},\"blurb\":{\"en\":\"Aerial extraction using a winch cable from a hovering helicopter when ground evacuation is difficult or time-critical.\",\"zh-TW\":\"在地面撤離困難或具時效急迫性時，由盤旋直升機以絞盤吊索將傷患吊離現場的救援方式。\"}},{\"term\":{\"en\":\"Off-duty first responder\",\"zh-TW\":\"休假急救人員\"},\"blurb\":{\"en\":\"A firefighter, paramedic, or police officer who is not on scheduled shift duty when an incident occurs.\",\"zh-TW\":\"事發時不在排班執勤時段內的消防、救護或警消人員。\"}}],\"sources\":[{\"name\":\"PeachtreeTV\",\"url\":\"https://www.peachtreetv.com/video/2026/11/26/off-duty-firefighter-helps-rescue-teen-camelback-mountain/\"},{\"name\":\"WVLT\",\"url\":\"https://www.wvlt.tv/video/2026/11/26/off-duty-firefighter-helps-rescue-teen-camelback-mountain/\"}],\"imageUrl\":\"/covers/live/live-arizona-377-camelback-teen-rescue.jpg\",\"imageAlt\":{\"en\":\"Off-Duty Firefighter Helps Rescue Injured Teen on Camelback Mountain\",\"zh-TW\":\"休假消防員協助救援駱駝背山受傷少女\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":62,\"trustBreakdown\":{\"crossCorroboration\":16,\"outletReputation\":22,\"recencyClarity\":22,\"sourceDiversity\":2},\"publishedAt\":\"2026-11-28T05:29:40.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":4,\"D2\":4,\
