ike will acquire Zscaler in an all-stock transaction valued at approximately $43.9 billion based on CrowdStrike's November 20, 2026 share price. Zscaler shareholders will receive 1.135 shares of CrowdStrike common stock for each Zscaler share held, representing an implied offer price of $260.41 per share and an equity value of roughly $42.46 billion. Completion is targeted for the second half of CrowdStrike's fiscal year 2028, subject to regulatory and shareholder approvals.\n\nThe acquisition pairs CrowdStrike's Falcon endpoint security platform with Zscaler's cloud-native zero-trust network security services, which process over 750 billion daily transactions across half of the Fortune 500. CrowdStrike CEO George Kurtz (喬治·庫爾茨) stated that the merger positions the combined firm to defend enterprises against AI-accelerated cyberattacks while consolidating vendor sprawl for corporate security teams.\n\nPress disclosures from CrowdStrike and financial reports from International Finance, The Paypers, and Morningstar align on the 1.135 share exchange ratio, the $43.9 billion headline valuation, and the projected $10 billion combined annual recurring revenue at closing. Channel partners cited by Channel Dive noted strong strategic complementarity alongside potential integration complexity across overlapping enterprise modules.\n\nApproval timelines from US and European antitrust regulators, as well as the final dollar value of the all-stock payout upon closing, remain subject to review and market fluctuations.\n\nTrust label: Official statement — Deal structure, exchange ratio, and financial projections are verified via CrowdStrike's official press release and corroborated across financial news outlets."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-tech-106-crowdstrike-acquires-zscaler-all-stock-deal\",\"category\":\"tech\",\"title\":{\"en\":\"CrowdStrike Agrees to Acquire Zscaler in $43.9 Billion All-Stock Deal\",\"zh-TW\":\"CrowdStrike 宣布以 439 億美元全股票收購資安大廠 Zscaler\"},\"summary\":{\"en\":\"CrowdStrike announced a definitive agreement to acquire cloud security provider Zscaler in a $43.9 billion all-stock transaction expected to close in the second half of CrowdStrike's fiscal 2028. Under the terms, Zscaler shareholders will receive 1.135 CrowdStrike shares per share held, uniting endpoint protection with zero-trust network security. The combined entity projects more than $10 billion in annual recurring revenue at closing.\",\"zh-TW\":\"網路資安大廠 CrowdStrike 宣布與雲端資安業者 Zscaler 達成最終收購協議，將以價值約 439 億美元的全股票交易合併雙方業務，預計於 CrowdStrike 2028 會計年度下半年完成交割。此宗資安史上最大規模併購案將整合終端防護與零信任網路安全架構，合併後年度經常性營收（ARR）預估突破 100 億美元。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」網路資安大廠 CrowdStrike（納斯達克代碼：CRWD）與雲端安全公司 Zscaler（納斯達克代碼：ZS）宣布達成最終合併協議，CrowdStrike 將透過全股票交易收購 Zscaler，以 2026 年 11 月 20 日股價計算總估值約 439 億美元。根據協議條款，Zscaler 股東每股可換取 1.135 股 CrowdStrike 普通股，隱含每股收購價為 260.41 美元、股權價值約 424.6 億美元，交易預計於 CrowdStrike 2028 會計年度下半年完成。\\n\\n「為什麼重要」本案締造全球網路安全產業史上最高金額併購紀錄，將 CrowdStrike 的 Falcon 終端防護平台與 Zscaler 每日處理逾 7,500 億筆流量的零信任雲端網路安全服務深度整合。CrowdStrike 執行長庫爾茨（George Kurtz）指出，面對 AI 驅動的新型態網路威脅，企業客戶急需單一整合平台以降低多供應商管理成本，合併後公司交割時年度經常性營收（ARR）預估將超過 100 億美元。\\n\\n「來源異同」CrowdStrike 官方新聞稿與 International Finance、The Paypers、晨星（Morningstar）等財經媒體對 1.135 換股比例、439 億美元總估值及交割時程報導一致。科技通路媒體 Channel Dive 則引述經銷夥伴觀點，在肯定產品互補性的同時，提醒雙方重疊安全模組的技術整合挑戰。\\n\\n「仍不確定」美國與歐盟反壟斷監管機構的審查進度與核准條件，以及全股票交易在最終交割日的實際市場總價值，仍待後續程序確認。\"},\"glossary\":[{\"term\":{\"en\":\"Zero-Trust Network Security\",\"zh-TW\":\"零信任網路安全\"},\"blurb\":{\"en\":\"A cybersecurity framework requiring continuous verification of every user and device before granting access to applications or data, replacing traditional perimeter VPNs.\",\"zh-TW\":\"不預設信任任何內外部連線的資安架構，要求每次存取應用程式或資料前皆須持續驗證身分與裝置狀態，藉此取代傳統虛擬私人網路（VPN）。\"}},{\"term\":{\"en\":\"Endpoint Security\",\"zh-TW\":\"終端安全防護\"},\"blurb\":{\"en\":\"Cybersecurity software deployed on end-user devices such as laptops, servers, and mobile phones to detect and block malware or unauthorized intrusions.\",\"zh-TW\":\"部署於筆記型電腦、伺服器與行動裝置等終端設備的資安防護軟體，用以偵測並阻斷惡意程式與入侵行為。\"}},{\"term\":{\"en\":\"Annual Recurring Revenue (ARR)\",\"zh-TW\":\"年度經常性營收\"},\"blurb\":{\"en\":\"A key subscription business metric representing the predictable revenue a company expects to receive annually from active customer contracts.\",\"zh-TW\":\"衡量訂閱制軟體企業營運規模的核心指標，代表依據現有有效合約每年可穩定獲得的經常性收入總額。\"}}],\"sources\":[{\"name\":\"CrowdStrike Investor Relations\",\"url\":\"https://ir.crowdstrike.com/news-releases/news-release-details/crowdstrike-acquire-zscaler-bringing-network-security-and-zero/\"},{\"name\":\"The Economic Times Brand Equity\",\"url\":\"https://brandequity.economictimes.indiatimes.com/news/digital/crowdstrike-to-acquire-zscaler-in-a-44-billion-deal-that-would-create-a-cybersecurity-giant/136121364\"},{\"name\":\"The Paypers\",\"url\":\"https://thepaypers.com/mergers-aquisitions-and-investments/news/crowdstrike-to-acquire-zscaler-in-usd-439-billion-all-stock-deal\"},{\"name\":\"Morningstar UK\",\"url\":\"https://global.morningstar.com/en-gb/stocks/crowdstrike-earnings-ai-induced-demand-drives-record-quarter-firm-announces-zscaler-deal\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"Corporate logos of cybersecurity firms CrowdStrike and Zscaler\",\"zh-TW\":\"網路資安企業 CrowdStrike 與 Zscaler 公司標誌\"},\"isHeadline\":true,\"isPopular\":true,\"trustScore\":88,\"trustBreakdown\":{\"crossCorroboration\":23,\"outletReputation\":23,\"recencyClarity\":21,\"sourceDiversity\":21},\"publishedAt\":\"2026-11-27T15:56:21.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":5,\"D2\":4,\"D3\":4,\"D4\":4,\"D5\":4,\"total\":21},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified
