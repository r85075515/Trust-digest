media platforms—including Meta's Facebook and Google's YouTube—are not legally liable for the May 2022 racist mass shooting at a Tops Friendly Markets supermarket in Buffalo, New York, which killed 10 Black shoppers and workers. Victims' families and survivors had argued that the platforms' recommendation algorithms functioned as defectively designed products that radicalized the gunman.\n\nAssociated Press and The Guardian report that the ruling shuts down a closely watched legal avenue attempting to bypass federal Section 230 immunity by framing social media algorithms as defective products rather than third-party speech publishers. Meanwhile, jury selection remains underway in the shooter's separate federal hate crime trial, which carries a potential death sentence.\n\nAssociated Press and The Guardian report identical outcomes from the New York Court of Appeals ruling, naming the same platforms, plaintiffs' product-liability theory, and ongoing federal hate crime proceedings.\n\nWhether plaintiffs' attorneys will petition the U.S. Supreme Court to review the constitutional or statutory scope of platform immunity remains undecided.\n\nTrust label: Multi-source agreement — Associated Press and The Guardian report identical rulings from New York's Court of Appeals."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-us-068-ny-top-court-social-media-not-liable-buffalo-shooting\",\"category\":\"us\",\"title\":{\"en\":\"New York's Top Court Rules Social Media Platforms Not Liable for 2022 Buffalo Supermarket Shooting\",\"zh-TW\":\"紐約州最高法院裁定社群平台無須為 2022 年水牛城超市槍擊案負法律責任\"},\"summary\":{\"en\":\"New York's Court of Appeals ruled that social media companies including Facebook and YouTube cannot be held civilly liable for the 2022 racist mass shooting at a Buffalo supermarket that killed 10 people. The decision shields online platforms from product-liability and algorithmic radicalization claims brought by victims' families.\",\"zh-TW\":\"紐約州上訴法院（該州最高法院）裁定，臉書（Facebook）、YouTube 等社群媒體公司無須為 2022 年水牛城超市種族主義大規模槍擊案（造成 10 人死亡）承擔民事賠償責任。該判決確立科技平台免於因演算法推薦或第三方內容被追究產品責任，為美國網路平台免責界線立下重要判例。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n紐約州最高司法機關「紐約州上訴法院」（New York Court of Appeals）本週作出重大裁決，認定臉書（Facebook）、YouTube 等主要社群媒體平台無須為 2022 年 5 月發生於紐約州水牛城超市的種族主義大規模槍擊案（造成 10 名非裔民眾喪生）承擔民事侵權賠償責任。罹難者家屬與倖存者原主張，社群平台的演算法設計存在缺陷、主動推送極端內容使槍手激進化，應適用產品責任法規。\\n「為什麼重要」\\n全美多起訴訟近年試圖以「演算法屬於有缺陷的數位產品」為由，繞過美國聯邦《通訊端正法》第 230 條對網路平台發布第三方內容的免責保護；紐約州最高法院駁回此一訴求，對全美科技巨頭面臨的演算法成癮與極端化訴訟具有指標性影響。與此同時，該案槍手的聯邦仇恨犯罪審判目前仍在進行陪審團遴選，檢方正尋求死刑判決。\\n「來源異同」\\n美聯社（Associated Press）與英國《衛報》（The Guardian）對於紐約州最高法院駁回平台責任訴求、原告主張的產品設計缺陷理論以及聯邦仇恨犯罪案審理進度的報導完全一致，無任何分歧。\\n「仍不確定」\\n原告律師團是否會就平台免責範圍向美國聯邦最高法院提出上訴聲請，目前尚未對外宣布。\"},\"glossary\":[{\"term\":{\"en\":\"New York Court of Appeals\",\"zh-TW\":\"紐約州上訴法院\"},\"blurb\":{\"en\":\"The highest court in the state of New York, whose decisions set binding precedent on state tort and product-liability law.\",\"zh-TW\":\"紐約州最高層級司法機構，其判決對紐約州侵權行為與產品責任法律適用具有最終拘束力。\"}},{\"term\":{\"en\":\"Product-liability theory\",\"zh-TW\":\"產品責任訴訟理論\"},\"blurb\":{\"en\":\"A legal strategy arguing that social media algorithms are defectively designed features rather than protected speech.\",\"zh-TW\":\"原告將社群媒體推薦演算法定性為「設計有缺陷的商業產品」而非受言論免責保護的第三方貼文，藉此向平台求償的法律策略。\"}},{\"term\":{\"en\":\"Section 230\",\"zh-TW\":\"美國《通訊端正法》第 230 條\"},\"blurb\":{\"en\":\"A U.S. federal statute shielding online platforms from civil liability for content created and posted by third-party users.\",\"zh-TW\":\"美國聯邦法律條文，規定網路互動平台原則上無須為第三方用戶發布的言論與內容承擔民事法律責任。\"}}],\"sources\":[{\"name\":\"Associated Press\",\"url\":\"https://apnews.com/article/buffalo-supermarket-shooting-lawsuits-39338cead3894bb06ae673aa9dfa07a1\"},{\"name\":\"The Guardian\",\"url\":\"https://www.theguardian.com/us-news/2026/nov/24/social-media-not-liable-2022-buffalo-mass-shooting\"}],\"imageUrl\":\"/covers/live/live-us-068-ny-top-court-social-media-not-liable-buffalo-shooting.jpg\",\"imageAlt\":{\"en\":\"Courthouse exterior following New York's top court ruling on social media liability in the Buffalo shooting\",\"zh-TW\":\"紐約州最高法院裁定社群平台免為水牛城槍擊案負責後的法院外景\"},\"isHeadline\":false,\"isPopular\":true,\"trustScore\":88,\"trustBreakdown\":{\"crossCorroboration\":23,\"outletReputation\":23,\"recencyClarity\":21,\"sourceDiversity\":21},\"publishedAt\":\"2026-11-27T14:47:18.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":5,\"D2\":4,\"D3\":4,\"D4\":4,\"D5\":4,\"total\":21},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-us-068-ny-top-court-social-media-not-liable-buffalo-shooting/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-us-068-ny-top-court-social-media-not-liable-buffalo-shooting/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>
