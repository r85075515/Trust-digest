 sukiyaki, a French-flavoured guest-chef collaboration with a Michelin-starred chef, and a limited tea pairing from a Japanese tea master.\nWhy it matters\nAutumn and winter mark the start of the year-end dining season, when restaurants compete hardest for group dinners and celebrations. A single roundup that names three places worth booking — a high-end buffet, a famous unagi shop's debut, and a cult doughnut — is a practical shortlist for the season.\nSources agree / disagree\nThis is a single-outlet item from Vogue Taiwan, with no other outlet covering the same roundup. Trust label: Single source — only Vogue Taiwan reports this roundup.\nStill uncertain\nThe summary gives no dish details, prices, or dates for the seasonal items, so the original Vogue Taiwan article is the source for planning a visit."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-beauty-02-11-a-joy-i-m-donut\",\"category\":\"beauty\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-beauty-02-11-a-joy-i-m-donut.jpg\",\"imageAlt\":{\"en\":\"Cover related to: November dining in Taiwan, A Joy winter chapter and Tenman in Taichung\",\"zh-TW\":\"相關封面圖：11 月餐飲新訊，饗 A Joy 迎冬日\"},\"publishedAt\":\"2026-11-12T08:33:38.000Z\",\"title\":{\"en\":\"November Dining in Taiwan: A Joy Opens Winter Chapter as Tenman Lands in Taichung\",\"zh-TW\":\"饗 A Joy 迎冬日：天鰻插旗台中、I’m donut？季節限定開賣\"},\"summary\":{\"en\":\"［未證實·單一來源］November brings fresh dining news across Taiwan: A Joy opens its winter chapter, Japanese unagi specialist Tenman lands its first overseas branch in Taichung, and I'm donut? launches a seasonal raw doughnut. Three bookings well worth making before the year-end rush.\",\"zh-TW\":\"［未證實·單一來源］11 月台灣餐飲圈新訊不斷：饗 A Joy（A Joy）開啟溫暖冬日篇章，日本鰻魚名店天鰻（Tenman）海外首店插旗台中，I’m donut？推出季節限定生甜甜圈。年底聚餐行程，可以先把這三家排進去。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"11 月的台灣餐飲圈很熱鬧：饗 A Joy（A Joy）開啟溫暖冬日篇章，日本鰻魚名店天鰻（Tenman）海外首店插旗台中，I’m donut？則推出「葡萄焦糖乳酪鮮奶油」生甜甜圈季節限
