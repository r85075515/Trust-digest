–20, 2027, in Clisson, France. The milestone festival will feature 308 bands representing 28 countries across 10 stages—four of them newly added. Mainstage 1 will be headlined by Blink-182 (blink-182) on Thursday, Parkway Drive on Friday, Faith No More on Saturday, and French metal act Gojira on Sunday in what will be Gojira's only European performance of 2027. Mainstage 2 headliners include Mötley Crüe, Marilyn Manson, Judas Priest, and Evanescence. Organizers also introduced the \"Extreme Zone,\" a four-stage sub-festival showcasing 124 death, thrash, heavy, and black metal bands, alongside 163 first-time Hellfest performers.\n\n為什麼重要\nExpanding to 10 stages and 308 acts—while securing exclusive European festival appearances from Gojira and rare reunions such as Faith No More and Children of Bodom—cements Hellfest's status as one of Europe's largest heavy music gatherings.\n\n來源異同\nConsequence, MetalTalk, New Noise Magazine, and Sonic Perspectives all confirm the June 17–20, 2027 dates, the 308-band count across 10 stages, the mainstage headliners, Gojira's exclusive European date, and the 124-band Extreme Zone.\n\n仍不確定\nSingle-day ticket release dates, stage-by-stage set times, and whether any late-stage lineup replacements will occur ahead of June 2027 remain to be announced.\n\nTrust label: Multi-source agreement — Festival dates, band count, stage expansion, and headliner roster match across Consequence, MetalTalk, and New Noise Magazine."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-entertainment-140-hellfest-2027-anniversary-lineup\",\"category\":\"entertainment\",\"title\":{\"en\":\"France's Hellfest Unveils 308-Band Lineup for 20th Anniversary Edition Led by Blink-182, Faith No More, and Gojira\",\"zh-TW\":\"法國地獄音樂節公布 20 週年 308 組樂團豪華陣容 Blink-182 與 Gojira 領銜 10 大舞台\"},\"summary\":{\"en\":\"France's Hellfest Open Air Festival unveiled its 20th anniversary lineup for June 17–20, 2027, featuring 308 bands across 10 stages in Clisson. Headliners include Blink-182, Parkway Drive, Faith No More, and Gojira—playing its sole European show of 2027—alongside 163 festival debuts and a new Extreme Zone. 一句重點結論：法國 Hellfest 音樂節公布 2027 年 20 週年完整陣容，集結 308 組樂團橫跨 10 座舞台，並增設極端金屬專區。\",\"zh-TW\":\"法國重金屬音樂節 Hellfest 公布 2027 年 20 週年陣容，明年 6 月在克利松登場，集結 28 國 308 組樂團橫跨 10 座舞台，Blink-182 與法國勁旅 Gojira 等領銜，首度推出「極端地帶」專區。一句重點結論：Hellfest 公布 2027 年 20 週年陣容，308 組樂團橫跨 10 座舞台並增設極端金屬專區。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n法國最具代表性的重金屬與硬搖滾盛會 Hellfest 音樂節正式揭曉 2027 年 20 週年紀念版完整陣容，活動將於 2027 年 6 月 17 日至 20 日在法國克利松（Clisson）舉行。本屆規模大幅擴編至 10 座舞台（含 4 座全新舞台），網羅來自 28 個國家共 308 組樂團演出，其中 163 組為首度登上 Hellfest 舞台。主舞台第一舞台（Mainstage 1）四日壓軸分別由 Blink-182（blink-182）、Parkway Drive、Faith No More 與法國重金屬天團 Gojira 擔綱，這也將是 Gojira 在 2027 年唯一一場歐洲演出；第二舞台（Mainstage 2）則由 Mötley Crüe、Marilyn Manson、Judas Priest 與 Evanescence 領銜，主辦方並首度打造涵蓋 4 座舞台、124 組樂團的「極端地帶」（Extreme Zone）專區。\\n\\n「為什麼重要」\\n在 20 週年里程碑之際將舞台擴增至 10 座並集結逾 300 組樂團，同時囊括 Gojira 歐洲唯一專場以及 Faith No More、Children of Bodom 等睽違多年的重聚演出，進一步鞏固 Hellfest 作為歐洲最大規模重型音樂祭的地位。\\n\\n「來源異同」\\n音樂媒體 Consequence、MetalTalk、New Noise Magazine 與 Sonic Perspectives 對 2027 年 6 月 17 至 20 日檔期、10 座舞台共 308 組樂團、各日壓軸卡司以及 124 組樂團組成的極端地帶專區報導完全一致，無任何衝突。\\n\\n「仍不確定」\\n單日票券開賣時程、各舞台詳細演出時段表，以及距離 2027 年 6 月開演前是否會有個別樂團因巡演檔期異動而調整，仍有待主辦單位後續公布。\"},\"glossary\":[{\"term\":{\"en\":\"Hellfest Open Air\",\"zh-TW\":\"法國地獄音樂節（Hellfest）\"},\"blurb\":{\"en\":\"An annual heavy metal, punk, and hard rock music festival held in Clisson, western France, founded in 2006.\",\"zh-TW\":\"創辦於 2006 年、每年夏季在法國西部克利松舉辦的大型重金屬、龐克與硬搖滾露天音樂節。\"}},{\"term\":{\"en\":\"Festival headliner\",\"zh-TW\":\"音樂節壓軸卡司（Headliner）\"},\"blurb\":{\"en\":\"The marquee artist or band billed at the top of a festival lineup and scheduled to perform the closing set on a main stage.\",\"zh-TW\":\"音樂節海報排名最前、負責在主舞台壓軸時段演出的指標性核心樂團或藝人。\"}},{\"term\":{\"en\":\"Extreme metal\",\"zh-TW\":\"極端金屬（Extreme metal）\"},\"blurb\":{\"en\":\"An umbrella term for faster, heavier, and more abrasive heavy metal subgenres including death metal, black metal, and thrash metal.\",\"zh-TW\":\"涵蓋死亡金屬、黑金屬與鞭擊金屬等曲風更為猛烈、節奏更快且具地下音樂實驗色彩的重金屬音樂分支統稱。\"}}],\"sources\":[{\"name\":\"Consequence\",\"url\":\"https://consequence.net/2026/11/hellfest-2027-lineup-featuring-more-than-300-bands/\"},{\"name\":\"MetalTalk\",\"url\":\"https://www.metaltalk.net/hellfest-2027-announces-308-bands-10-stages-and-new-extreme-zone.php\"},{\"name\":\"New Noise Magazine\",\"url\":\"https://newnoisemagazine.com/news-hellfest-announces-308-bands-for-its-20th-anniversary/\"}],\"imageUrl\":\"/covers/live/live-entertainment-140-hellfest-2027-anniversary-lineup.jpg\",\"imageAlt\":{\"en\":\"Hellfest 2027 20th anniversary lineup poster announcement\",\"zh-TW\":\"法國 Hellfest 2027 年 20 週年音樂節陣容海報\"},\"isHeadline\":false,\"isPopular\":true,\"trustScore\":91,\"trustBreakdown\":{\"crossCorroboration\":24,\"outletReputation\":23,\"recencyClarity\":23,\"sourceDiversity\":21},\"publishedAt\":\"2026-11-27T16:45:11.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":5,\"D2\":5,\"D3\":4,\"D4\":4,\"D5\":4,\"total\":22},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-entertainment-140-hellfest-2027-anniversary-lineup/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, di
