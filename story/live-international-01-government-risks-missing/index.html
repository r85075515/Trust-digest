ppened\nAnalysts say a mooted move to let more petrol and diesel vehicles be sold would wreck the plan to reach net zero by 2050. The Climate Change Committee's analysis suggests the policy would blow a hole in that plan, leaving the government short of targets that carry legal force. The Guardian reports the warning as \"UK will miss climate targets if it weakens EV sales rules,\" while the BBC reports that the government \"risks missing climate targets if EV rules weakened.\"\nWhy it matters\nLegally binding targets turn a policy U-turn into a legal problem, not just a political one: missing them invites court challenges and undermines investor confidence in the EV transition. Carmakers, charging networks and drivers all plan around the rules. Takeaway: weakening the rules saves a political fight today and risks a legal and investment bill tomorrow.\nSources agree / disagree\nThe Guardian and the BBC agree on the warning and its source, the Climate Change Committee, and both frame the outcome as missing binding targets. Neither short feed description quantifies the shortfall or names the ministers behind the mooted change.\nStill uncertain\nThe reports do not say how large the emissions gap would be, when a decision is due, or whether the government has formally proposed the change. The full CCC analysis and a ministerial response are needed to judge how imminent the weakening is.\nTrust label: Multi-source agreement — The Guardian and the BBC report the same Climate Change Committee warning."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-01-government-risks-missing\",\"category\":\"international\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-international-01-government-risks-missing.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Government risks missing climate targets if EV rules weakened, adviser warns\",\"zh-TW\":\"相關封面圖：顧問警告說，如果電動車規則減弱，政府將面臨無法實現氣候目標的風險\"},\"publishedAt\":\"2026-11-18T00:44:48.000Z\",\"title\":{\"en\":\"Climate Change Committee Warns UK Risks Missing Climate Targets if EV Rules Weaken\",\"zh-TW\":\"氣候變遷委員會（Climate Change Committee）警告：英國若放寬電動車規則，恐錯失氣候目標\"},\"summary\":{\"en\":\"Weakening the UK's electric car sales rules would probably cost the government its legally binding climate targets, the Climate Change Committee warns. A mooted move to let more petrol and diesel cars be sold would blow a hole in the 2050 net-zero plan. The warning raises the stakes of the decision; watch whether ministers press ahead or hold the rules.\",\"zh-TW\":\"氣候變遷委員會（Climate Change Committee）警告，削弱英國電動車銷售規則，可能讓政府錯失具法律約束力的氣候目標。擬議放寬汽油與柴油車銷售，將在 2050 淨零計畫上打出缺口。這項警告拉高了決策代價；接下來看部長們是否執意放寬或維持現行規則。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"追蹤英國淨零進展的顧問警告，若削弱電動車銷售規則，英國政府可能錯失具法律約束力的氣候目標。\\n發生了什麼事\\n分析師指出，擬議放寬汽油與柴油車銷售，將破壞 2050 年實現淨零排放的計畫。氣候變遷委員會（Climate Change Committee）的分析顯示，這項政策會在計畫上打出缺口，讓政府無法達成具法律效力的目標。《衛報》以「英國若削弱電動車銷售規則將錯失氣候目標」報導這項警告，BBC 則報導政府「若放寬電動車規則，恐錯失氣候目標」。\\n為什麼重要\\n具法律約束力的目標讓政策轉彎不只是政治問題，更是法律問題：達標失敗可能引發訴訟，也會動搖投資人對電動車轉型的信心。車廠、充電業者與駕駛人都圍繞這些規則做規劃。結論：放寬規則省下今天的政治爭議，卻可能換來明天的法律與投資代價。\\n來源異同\\n《衛報》與 BBC 對警告內容與來源說法一致，都指向氣候變遷委員會，也都把結果定調為錯失具約束力的目標。兩家媒體的簡短摘要都未量化落差幅度，也未點名推動放寬的部長。\\n仍不確定\\n報導未說明排放缺口有多大、決策期限何時，也未說明政府是否已正式提出放寬方案。需要氣候變遷委員會的完整分析與部長回應，才能判斷放寬有多迫近。\"},\"sources\":[{\"name\":\"The Guardian Climate Crisis\",\"url\":\"https://www.theguardian.com/environment/2026/nov/18/uk-will-miss-climate-targets-if-weakens-rules-on-ev-sales-zev-ccc\"},{\"name\":\"BBC UK\",\"url\":\"https://www.bbc.co.uk/news/articles/c63rgqg5l9l2o?at_medium=RSS\u0026at_campaign=rss\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":19,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"international\",\"live-ingest\",\"the-guardian-climate-crisis\",\"bbc-uk\"],\"glossary\":[{\"term\":{\"en\":\"Climate Change Committee (CCC)\",\"zh-TW\":\"氣候變遷委員會（CCC）\"},\"blurb\":{\"en\":\"UK advisory body tracking Britain's progress to net zero.\",\"zh-TW\":\"追蹤英國淨零進展的官方顧問機構。\"}},{\"term\":{\"en\":\"Net zero\",\"zh-TW\":\"淨零排放\"},\"blurb\":{\"en\":\"The UK's 2050 target for balancing greenhouse gas emissions.\",\"zh-TW\":\"英國 2050 年溫室氣體排放收支相抵的目標。\"}},{\"term\":{\"en\":\"Electric vehicle (EV) sales rules\",\"zh-TW\":\"電動車銷售規則\"},\"blurb\":{\"en\":\"UK rules setting how many electric cars must be sold.\",\"zh-TW\":\"規定電動車銷售占比的英國規則。\"}},{\"term\":{\"en\":\"The Guardian\",\"zh-TW\":\"《衛報》（The Guardian）\"},\"blurb\":{\"en\":\"British newspaper that reported the CCC warning.\",\"zh-TW\":\"報導氣候變遷委員會警告的英國報紙。\"}},{\"term\":{\"en\":\"BBC\",\"zh-TW\":\"英國廣播公司（BBC）\"},\"blurb\":{\"en\":\"British public broadcaster that reported the same warning.\",\"zh-TW\":\"報導同一警告的英國公共廣播機構。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-international-01-government-risks-missing/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-international-01-government-risks-missing/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source veri
