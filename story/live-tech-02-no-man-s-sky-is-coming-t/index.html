s the App Store celebrates Indie Games Week.\nWhat happened\nHello Games confirmed the iOS launch date of October 28 for both iPhone and iPad. According to Hello Games' Sean Murray, the mobile version of the game is essentially the full No Man's Sky experience — not a cut-down port. The launch headlines a broader Indie Games Week push that also brings Sifu, Vampire Crawlers, Dome Keeper, and Little Kitty, Big City to iOS.\nWhy it matters\nThe judgment is hardware, not nostalgia: shipping a full procedural universe on a phone is a flex for Apple silicon and a live test of whether premium-scale games can live on mobile. If it runs well, it resets expectations for what phones are for.\nSources agree / disagree\nThe Verge and Engadget report the same announcement — same game, same platforms, same October 28 date — with no conflicting details. Trust label: Multi-source agreement — two outlets aligned on the launch facts.\nStill uncertain\nPricing, device requirements, and performance details aren't in the snippets. Verify at launch before recommending it."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-tech-02-no-man-s-sky-is-coming-t\",\"category\":\"tech\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-tech-02-no-man-s-sky-is-coming-t.jpg\",\"imageAlt\":{\"en\":\"Cover related to: No Man's Sky is coming to iPhone and iPad as the App Store celebrates Indie Games Week\",\"zh-TW\":\"相關封面圖：（譯文待補）No Man's Sky is coming to iPhone and iPad as the App Store celebrates Indie Games Week\"},\"publishedAt\":\"2026-10-12T14:00:00.000Z\",\"title\":{\"en\":\"Hello Games Brings No Man's Sky to iPhone and iPad on October 28\",\"zh-TW\":\"Hello Games：《無人深空》10月28日登陸 iPhone、iPad\"},\"summary\":{\"en\":\"Hello Games is bringing its sci-fi exploration game No Man's Sky to iPhone and iPad on October 28, with founder Sean Murray saying the mobile version is essentially the full game. It headlines the App Store's Indie Games Week push. Next watch is how the full-scale universe performs on phone hardware.\",\"zh-TW\":\"Hello Games 宣布科幻探索遊戲《無人深空》10月28日登陸 iPhone 與 iPad；創辦人莫瑞（Sean Murray）稱行動版基本上是完整遊戲。打頭陣的是 App Store 獨立遊戲週；接下來看完整宇宙在手機硬體上的表現。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"《無人深空》的宇宙即將變小——是好的那種小。Hello Games 宣布，這款長青科幻探索遊戲將登陸 iOS，iPhone 與 iPad 版10月28日上架，正值 App Store 慶祝獨立遊戲週。\\n發生了什麼事\\nHello Games 確認 iOS 版10月28日上架，iPhone、iPad 都有。據 Hello Games 的莫瑞（Sean Murray）說法，行動版基本上是完整的《無人深空》體驗，不是閹割移植版。這次上架是獨立遊戲週的主打，同批登陸 iOS 的還有《師父》（Sifu）、《Vampire Crawlers》、《Dome Keeper》、《Little Kitty, Big City》。\\n為什麼重要\\n這是硬體的判斷，不是懷舊：把一整個程序生成的宇宙塞進手機，是蘋果晶片的肌肉展示，也是檢驗旗艦級遊戲能不能活在手機上的實測。跑得順的話，大家對「手機是拿來幹嘛的」的想像就要重寫。\\n來源異同\\nThe Verge 與 Engadget 報導的發布內容一致——同一款遊戲、同一平台、同一個10月28日——沒有矛盾。信任標籤：N源一致——兩家媒體在上架事實上一致。\\n仍不確定\\n售價、裝置需求、效能表現都不在來源摘要裡。上架後驗證再推薦。\"},\"sources\":[{\"name\":\"The Verge\",\"url\":\"https://www.theverge.com/entertainment/1009541/no-mans-sky-iphone-ipad-launch-date\"},{\"name\":\"Engadget\",\"url\":\"https://www.engadget.com/2283704/no-mans-sky-is-coming-to-iphone-and-ipad-as-the-app-store-celebrates-indie-games-week/\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":17,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"tech\",\"live-ingest\",\"the-verge\",\"engadget\"],\"glossary\":[{\"term\":{\"en\":\"Hello Games\",\"zh-TW\":\"Hello Games\"},\"blurb\":{\"en\":\"Game studio behind No Man's Sky.\",\"zh-TW\":\"《無人深空》背後的遊戲工作室。\"}},{\"term\":{\"en\":\"No Man's Sky\",\"zh-TW\":\"無人深空\"},\"blurb\":{\"en\":\"Long-running sci-fi exploration game coming to iOS.\",\"zh-TW\":\"即將登陸 iOS 的長青科幻探索遊戲。\"}},{\"term\":{\"en\":\"Sean Murray\",\"zh-TW\":\"莫瑞\"},\"blurb\":{\"en\":\"Founder of Hello Games who described the mobile version.\",\"zh-TW\":\"介紹行動版內容的 Hello Games 創辦人。\"}},{\"term\":{\"en\":\"App Store\",\"zh-TW\":\"App Store\"},\"blurb\":{\"en\":\"Apple's app marketplace running the Indie Games Week promotion.\",\"zh-TW\":\"舉辦獨立遊戲週活動的蘋果應用程式商
