 in MIT's History Section, in a new MIT News Q\u0026A. Lindquist, who holds a shared appointment with the MIT Schwarzman College of Computing and the Department of Electrical Engineering and Computer Science, traces how those early assumptions shaped today's models.\n\nWhat happened\nPublished October 22 by MIT News, the Q\u0026A walks through Lindquist's historical argument: the engineers who laid the groundwork for machine intelligence did not prize pure logic — they thought a thinking machine needed something messier, something closer to the human mind's beautiful irrationality.\n\nWhy it matters\nThe interview reframes AI's quirks — its hallucinations and leaps — not as bugs alone but as inheritances from a design philosophy that prized human-like messiness. If you want to understand why AI thinks the way it does, start with the engineers it inherited its brain from.\n\nSources agree / disagree\nMIT News is the sole outlet; the piece is a direct Q\u0026A, so its claims are attributable to Lindquist himself. Trust label: single source (original interview).\n\nStill uncertain\nThe snippet is an interview excerpt — for the full argument, read the complete Q\u0026A on MIT News."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-ai-01-q-a-how-ai-came-to-model\",\"category\":\"ai\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-ai-01-q-a-how-ai-came-to-model.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Q\u0026A: How AI came to model the “messy” human mind\",\"zh-TW\":\"相關封面圖：Q：人工智慧如何模擬「混亂」的人類思維\"},\"publishedAt\":\"2026-10-23T04:00:00.000Z\",\"title\":{\"en\":\"MIT Historian: Generative AI Grew Out of Engineers Who Valued Irrationality\",\"zh-TW\":\"林德奎斯特（Benjamin Lindquist）：生成式 AI 的根，來自一群相信「非理性」必要的工程師\"},\"summary\":{\"en\":\"In an MIT News Q\u0026A, historian Benjamin Lindquist argues generative AI grew out of mid-20th-century engineers who believed some irrationality was essential for human-like thought. Takeaway: AI's quirks aren't just bugs — they're inherited design philosophy.\",\"zh-TW\":\"MIT 歷史學者林德奎斯特在專訪中主張：生成式 AI 植根於相信「非理性」必要的早期工程師思想。takeaway：AI 的怪不只是 bug，是繼承來的設計哲學。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"生成式 AI 模型植根於 20 世紀中葉工程師的想法：他們相信，一定程度的「非理性」，是機器像人類一樣思考的必要條件——麻省理工學院（MIT）歷史學系助理教授本傑明·林德奎斯特（Benjamin Lindquist）在 MIT News 專訪中如是說。林德奎斯特同時在 MIT 史瓦茲曼運算學院與電機工程暨資訊科學系合聘。\\n發生了什麼事\\n這篇 10 月 22 日刊於 MIT News 的問答專訪，梳理了林德奎斯特的歷史論點：為機器智慧打下地基的那批工程師，推崇的並非純粹邏輯——他們認為會思考的機器需要更「亂」一點的東西，更接近人類心智那種美麗的非理性。\\n為什麼重要\\n結論很直接：AI 的「怪」——幻覺、跳躍式聯想——不只是 bug，更是設計哲學的遺產。想理解 AI 為什麼這樣想，先認識它繼承了誰的腦迴路。\\n來源異同\\nMIT News 是唯一來源；本篇為直接問答，論點可歸於受訪者本人。信任標籤：僅1源（專訪原文）。\\n仍不確定\\n來源摘要為專訪節錄，完整論證請查閱 MIT News 全文。\"},\"sources\":[{\"name\":\"MIT News AI\",\"url\":\"https://news.mit.edu/2026/qa-how-ai-came-to-model-messy-human-mind-1023\"}],\"disagreements\":null,\"trustScore\":60,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":23,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"ai\",\"live-ingest\",\"mit-news-ai\"],\"glossary\":[{\"term\":{\"en\":\"Benjamin Lindquist\",\"zh-TW\":\"本傑明·林德奎斯特\"},\"blurb\":{\"en\":\"MIT historian arguing AI inherited engineers' ideas about irrationality.\",\"zh-TW\":\"MIT 歷史學者，主張 AI 繼承了工程師的非理性思想。\"}},{\"term\":{\"en\":\"MIT History Section\",\"zh-TW\":\"MIT 歷史學系\"},\"blurb\":{\"en\":\"Lindquist's home department at MIT.\",\"zh-TW\":\"林德奎斯特任職的 MIT 歷史學系。\"}},{\"term\":{\"en\":\"MIT Schwarzman College of Computing\",\"zh-TW\":\"MIT 史瓦茲曼運算學院\"},\"blurb\":{\"en\":\"MIT computing college sharing Lindquist's appointment.\",\"zh-TW\":\"與林德奎斯特合聘的 MIT 運算學院。\"}},{\"term\":{\"en\":\"Generative AI\",\"zh-TW\":\"生成式 AI\"},\"blurb\":{\"en\":\"AI models that generate text, images and more.\",\"zh-TW\":\"可生成文字、圖像等的 AI 模型。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>se
