nate. TMZ reported that Stevens had 'pulled the plug' on her support for El-Sayed. One top Democrat called the move a 'despicable betrayal,' according to the coverage.\nWhy it matters\nCross-party endorsements this late are rare; coming from the nominee's former primary rival, it hands the Republican campaign a headline and a visual aimed at undecided and disaffected Democratic voters.\nSources agree / disagree\nCNBC, Axios, BBC, TMZ, NPR and The Hill all report the same endorsement, the same Sunday timing and the same primary history, with no conflicting facts. Trust label: Multi-source agreement — six outlets agree on the core claims.\nStill uncertain\nThe snippets do not give Stevens' full stated reasons, El-Sayed's detailed response, or any polling effect; the race outcome remains to be decided on Tuesday."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-entertainment-01-rep-haley-stevens-endors\",\"category\":\"entertainment\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-entertainment-01-rep-haley-stevens-endors.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Rep. Haley Stevens Endorses Republican Mike Rogers For Senate, Abandons Abdul El-Sayed\",\"zh-TW\":\"相關封面圖：眾議員海莉·史蒂文斯支持共和黨麥克·羅傑斯競選參議員，放棄阿卜杜勒·賽義德\"},\"publishedAt\":\"2026-11-02T00:02:15.000Z\",\"title\":{\"en\":\"Rep. Haley Stevens Endorses Republican Mike Rogers for Michigan Senate Over Democrat Abdul El-Sayed\",\"zh-TW\":\"眾議員史蒂文斯（Haley Stevens）背書共和黨羅傑斯（Mike Rogers）角逐密西根參議員\"},\"summary\":{\"en\":\"Democratic Rep. Haley Stevens, who lost Michigan's Democratic Senate nomination to Abdul El-Sayed earlier this year, made a last-minute endorsement of Republican Mike Rogers on Sunday, two days before Michigan's closely watched Senate election, drawing a 'betrayal' charge from a top Democrat.\",\"zh-TW\":\"民主黨眾議員史蒂文斯（Haley Stevens）今年稍早在密西根州民主黨參議員初選敗給艾爾賽義德（Abdul El-Sayed）；週日、選前兩天，她出人意料背書共和黨羅傑斯（Mike Rogers），被一名民主黨高層斥為背叛。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"一名民主黨眾議員背書共和黨提名人，在投票前兩天撼動密西根州參議員選戰。\\n發生了什麼事\\n密西根州眾議員史蒂文斯（Haley Stevens）今年稍早在民主黨參議員初選敗給艾爾賽義德（Abdul El-Sayed），週日卻背書共和黨羅傑斯（Mike Rogers）並與他同台。Axios 形容這是選前兩天的驚人背書，並指出這讓羅傑斯獲得醒目同台畫面；共和黨正試圖在這場可能決定參議院控制權的緊繃選戰中，爭取黑人與猶太選民。TMZ 報導史蒂文斯已撤回對艾爾賽義德的支持。報導引述一名民主黨高層斥此舉為「可鄙的背叛」。\\n為什麼重要\\n選前如此晚的跨黨背書相當罕見，且出自提名人的前初選對手之手，等於送給共和黨陣營一則頭條與爭取游離民主黨選民的畫面。\\n來源異同\\nCNBC、Axios、英國廣播公司（BBC）、TMZ、全國公共廣播電台（NPR）與國會山報（The Hill）皆報導同一背書、同一週日時點與同一初選背景，沒有事實衝突。信任標籤：多源一致——六家媒體對核心主張一致。\\n仍不確定\\n摘要未提供史蒂文斯的完整理由、艾爾賽義德的詳細回應與民調影響；選戰結果仍待週二揭曉。\"},\"sources\":[{\"name\":\"CNBC\",\"url\":\"https://www.cnbc.com/2026/11/01/michigan-senate-stevens-rogers-endorsement-el-sayed.html\"},{\"name\":\"Axios\",\"url\":\"https://www.axios.com/2026/11/01/haley-stevens-mike-rogers-church-michigan-senate\"},{\"name\":\"BBC World\",\"url\":\"https://www.bbc.co.uk/news/articles/c95ynzv88n68o?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"TMZ\",\"url\":\"https://www.tmz.com/2026/11/01/haley-stevens-endorses-mike-rogers/\"},{\"name\":\"NPR News\",\"url\":\"https://www.npr.org/2026/11/01/nx-s1-6020993/michigan-senate-race-abdul-el-sayed-haley-stevens-mike-rogers\"},{\"name\":\"The Hill\",\"url\":\"https://thehill.com/homenews/administration/6187354-trump-haley-stevens-join-republican-party/\"}],\"disagreements\":null,\"trustScore\":93,\"trustBreakdown\":{\"sourceDiversity\":25,\"outletReputation\":18,\"crossCorroboration\":25,\"recencyClarity\":25},\"tags\":[\"entertainment\",\"live-ingest\",\"cnbc\",\"axios\",\"bbc-world\"],\"glossary\":[{\"term\":{\"en\":\"Haley Stevens\",\"zh-TW\":\"史蒂文斯\"},\"blurb\":{\"en\":\"Democratic US representative from Michigan who endorsed the Republican Senate nominee.\",\"zh-TW\":\"密西根州民主黨眾議員，背書共和黨參議員候選人。\"}},{\"term\":{\"en\":\"Mike Rogers\",\"zh-TW\":\"羅傑斯\"},\"blurb\":{\"en\":\"Republican candidate for US Senate in Michigan.\",\"zh-TW\":\"密西根州共和黨參議員候選人。\"}},{\"term\":{\"en\":\"Abdul El-Sayed\",\"zh-TW\":\"艾爾賽義德\"},\"blurb\":{\"en\":\"Democratic nominee for US Senate in Mi
