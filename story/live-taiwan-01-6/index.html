 CNA.\n\nWhat happened\nNvidia announced Huang's return as CEO. The TAIEX surged 3,310.46 points to 40,122.35, recovering more than half the losses since Huang stepped down on November 12.\n\nWhy it matters\nThe rally shows how heavily Taiwan's market weighs Nvidia's leadership: the index clawed back most of the resignation-driven selloff in a single session, tying the chip giant's governance drama directly to Taiwanese investors' wealth.\n\nSources agree and disagree\nThis is a single-outlet report from CNA: one dispatch covers Huang's return, the TAIEX close and the rebound figures, and the same dispatch reports that six investigations into Nvidia and Huang remain open. There is no second outlet in this cluster to corroborate the figures.\n\nStill uncertain\nPresident Donald Trump has backed Huang's return and said it poses no national security risk, but intelligence agencies, judicial regulators and Congress are still pursuing six investigations, and the CNA reporting does not say how far each has advanced or when any will conclude.\n\nTrust label: Single source — one CNA dispatch, not independently corroborated."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-01-6\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-taiwan-01-6.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 黃仁勳重掌輝達　國安與晶片轉運等6大調查未歇\",\"zh-TW\":\"相關封面圖：黃仁勳重掌輝達　國安與晶片轉運等6大調查未歇\"},\"publishedAt\":\"2026-11-24T10:16:08.000Z\",\"title\":{\"en\":\"Jensen Huang Returns as Nvidia CEO as TAIEX Surges 3,310 Points and Six Probes Continue\",\"zh-TW\":\"黃仁勳（Jensen Huang）重掌輝達（Nvidia），台股大漲 3310 點，六大調查仍未歇\"},\"summary\":{\"en\":\"[Unverified, single source] Nvidia founder Jensen Huang returned as CEO, and Taiwan's TAIEX jumped 3,310.46 points to 40,122.35, recovering more than half the losses since his November 12 resignation. Despite President Trump's backing, six investigations into Nvidia and Huang remain open. Watch whether the probes escalate or fade.\",\"zh-TW\":\"［未證實·單一來源］輝達（Nvidia）創辦人黃仁勳（Jensen Huang）復任執行長，台股大漲 3310.46 點、收在 40122.35 點，收復 11 月 12 日他請辭以來逾半跌點。儘管美國總統川普（Donald Trump）力挺，情報、司法與國會針對輝達與黃仁勳的六大調查仍在進行。後續看調查是否升級或收尾。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"輝達（Nvidia）創辦人黃仁勳（Jensen Huang）復任執行長，台股以大漲回應。加權指數上漲 3310.46 點、收在 40122.35 點，自波段低點回升 4679.94 點，收復黃仁勳 11 月 12 日請辭以來逾半跌點。\\n\\n發生了什麼事\\n輝達宣布黃仁勳復任執行長。台股大漲 3310.46 點、收在 40122.35 點，收復他請辭以來逾半失土。\\n\\n為什麼重要\\n這波漲勢顯示台股對輝達領導層的變化極為敏感：單一交易日就收復請辭引發的賣壓大半，晶片巨頭的人事風波直接牽動台灣投資人的資產。\\n\\n來源異同\\n本卡是中央社（CNA）單一媒體的一則報導：復任消息、台股收盤點位、回升幅度與六大調查仍在進行，皆出自同一則報導， cluster 內無第二家媒體可交叉印證。\\n\\n仍不確定\\n美國總統川普（Donald Trump）力挺黃仁勳回任，稱不構成國安風險，但情報機構、司法監管單位與國會的六大調查進展各到什麼程度、何時有結論，中央社報導並未說明。\\n\\n信任標籤：僅1源——中央社單一報導，未經第二家媒體獨立印證。\"},\"sources\":[{\"name\":\"中央社-產經證券\",\"url\":\"https://www.cna.com.tw/news/afe/202611240256.aspx\"}],\"disagreements\":null,\"trustScore\":59,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"中央社-產經證券\",\"中央社-科技\"],\"glossary\":[{\"term\":{\"en\":\"Jensen Huang\",\"zh-TW\":\"黃仁勳（Jensen Huang）\"},\"blurb\":{\"en\":\"Founder and CEO of Nvidia.\",\"zh-TW\":\"輝達（Nvidia）創辦人兼執行長。\"}},{\"term\":{\"en\":\"Nvidia\",\"zh-TW\":\"輝達（Nvidia）\"},\"blurb\":{\"en\":\"US chipmaker leading the AI accelerator market.\",\"zh-TW\":\"主導 AI 加速器市場的美國晶片大廠。\"}},{\"term\":{\"en\":\"TAIEX\",\"zh-TW\":\"台股加權指數\"},\"blurb\":{\"en\":\"Taiwan Stock Exchange's benchmark index.\",\"zh-TW\":\"台灣證券交易所的加權股價指數。\"}},{\"term\":{\"en\":\"Donald Trump\",\"zh-TW\":\"川普（Donald Trump）\"},\"blurb\":{\"en\":\"President of the United States.\",\"zh-TW\":\"美國總統。\"}},{\"term\":{\"en\":\"CNA\",\"zh-TW\":\"中央社（CNA）\"},\"blurb\":{\"en\":\"Taiwan's national news agency.\",\"zh-TW\":\"台灣的國家通訊社。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, init
