nited States, opening on 855 screens over the weekend, according to TechCrunch and The Hill.\nWhat happened\nThe snippets identify the film with comedian and satirist Nathan Fielder and describe it as a nearly three-hour film expected to focus on Holmes's life. The Hill reports the 2,000 sold-out shows figure for the limited US release. Separately, STAT News published a reading guide — “what to read before you go see that new documentary on Elizabeth Holmes” — aimed at viewers heading to screenings.\nWhy it matters\nDocumentary openings of this scale are rare; a second-biggest-ever weekend puts the film in exceptional company and signals that public fascination with the Holmes story has not faded. Sold-out shows across a limited 855-screen release suggest demand well beyond the arthouse crowd, and the STAT reading guide points to a broader cultural conversation building around the film.\nSources agree / disagree\nTechCrunch and The Hill agree on the core box-office beats — the second-biggest documentary opening weekend, 2,000 sold-out shows, 855 screens. STAT's item covers the film from a different angle (a viewer's reading list) rather than the numbers. No numeric or name conflicts appear in the snippets.\nStill uncertain\nThe feed snippets are truncated — the description of what the film focuses on cuts off mid-sentence, and exact gross figures are not included. The precise nature of Nathan Fielder's involvement is described only in passing in the snippets."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-tech-01-everyone-s-watching-the-\",\"category\":\"tech\",\"adult\":false,\"isHeadline\":true,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-tech-01-everyone-s-watching-the-.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Everyone’s watching the Elizabeth Holmes documentary ‘You Can See Everything’\",\"zh-TW\":\"相關封面圖：每個人都在觀看伊麗莎白霍姆斯的紀錄片《你可以看到一切》\"},\"publishedAt\":\"2026-10-18T21:45:04.000Z\",\"title\":{\"en\":\"Elizabe
