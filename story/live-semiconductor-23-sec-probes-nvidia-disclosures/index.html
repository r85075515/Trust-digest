ll Street Journal, citing people familiar with the matter. The probe's full focus could not immediately be learned, the Journal said, but it includes whether the company's disclosures misled investors. The news broke on Tuesday, shortly before Nvidia's earnings report, and marks the scandal's escalation from a boardroom and congressional crisis into a federal regulatory one.\n\nWhat happened: Two disclosure threads are in frame. First, Nvidia earlier this year denied that Jensen Huang had an unusual or unexpected relationship with Alice Huang, the Megaspeed executive U.S. intelligence officials believe works for Chinese intelligence; Huang confessed the affair on November 8. The New York Post, citing its own sources, reported the probe will likely examine that denial. Second, Nvidia last year changed how it discloses international chip sales, eliminating a line item that had shown sales to Singapore — Megaspeed's base — separately. An SEC spokesperson told the Post the agency \"does not comment on the existence or nonexistence of a possible investigation,\" its standard response; Nvidia has not commented on the reported probe. Nvidia shares have fallen more than 10% since Huang was ousted.\n\nWhy it matters: The SEC probe lands on top of everything else: the Justice Department is leading multiple investigations involving Alice Huang, the Commerce Department has investigated Megaspeed since late 2024, the board's Wachtell-led review is running, and Treasury Secretary Scott Bessent has publicly questioned whether Nvidia knowingly sold powerful chips to China to lift its earnings. If the SEC concludes that disclosures around the Huang relationship or Singapore sales misled investors, the consequences run from fines to personal liability for executives — and every past company statement becomes evidence.\n\nSources agree / disagree: Reuters and TechCrunch relay the Journal's reporting; the Post adds its own sourcing on the likely focus. No outlet has an on-the-record confirmation from the SEC or a comment from Nvidia.\n\nStill uncertain: Whether the probe exists in the form described, its scope, and its targets are all unconfirmed; civil investigations can run for years and can close without action.\n\nTrust label: Single source — the investigation is reported by one original source (WSJ, anonymous sourcing), relayed by other outlets; treat as unconfirmed."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"adult\":false,\"body\":{\"en\":\"$10\",\"zh-TW\":\"［未證實·單一原始來源］發生了什麼事\\n《華爾街日報》引述知情人士報導，美國證券交易委員會（SEC）已對輝達（Nvidia）展開民事調查。調查的完整焦點尚無法立即得知，但包括輝達的資訊披露是否誤導投資人。消息在週二、輝達財報公布前不久曝光，代表這場醜聞已從董事會與國會層級，升級為聯邦監管層級。\\n\\n為什麼重要\\n有兩條披露線索浮上檯面。其一，輝達今年稍早曾否認黃仁勳（Jensen Huang）與黃樂（Alice Huang）有「不尋常或意料之外的關係」——黃樂是 Megaspeed 高層，美國情報官員認為她為中國情報機構工作；黃仁勳已於 11 月 8 日坦承這段婚外情。《紐約郵報》引述自家消息來源指，調查很可能檢視這次否認。其二，輝達去年改變了國際晶片銷售的披露方式，取消了原可單獨看見對新加坡（Megaspeed 所在地）銷售的欄位。SEC 發言人對《郵報》僅表示「不評論可能調查之存在與否」，屬其標準回應；輝達未對此報導置評。輝達股價自黃仁勳下台以來已跌逾一成。這件調查疊加在既有壓力之上：司法部主導多項涉及黃樂的調查、商務部自 2024 年底查 Megaspeed、董事會的 Wachtell 調查進行中，財政部長貝森特（Scott Bessent）更公開質疑輝達是否明知晶片銷往中國、只為拉抬業績。若 SEC 認定披露誤導投資人，後果可從罰款一路到高層個人責任。\\n\\n來源異同\\n路透與 TechCrunch 皆為轉述《華爾街日報》的原始報導；《紐約郵報》另以自有消息來源補上「可能檢視否認關係一事」的焦點。至今沒有任何一家媒體取得 SEC 的具名證實，輝達也未回應。\\n\\n仍不確定\\n調查是否如報導所述存在、範圍多大、對象是誰，全未經證實；民事調查可歷時數年，也可能無疾而終。\"},\"category\":\"semiconductor\",\"disagreements\":null,\"glossary\":[{\"blurb\":{\"en\":\"The U.S. securities regulator, reported by the WSJ to have opened a civil investigation into whether Nvidia's disclosures misled investors.\",\"zh-TW\":\"美國證券監管機關，據《華爾街日報》報導已對輝達展開民事調查，查其披露是否誤導投資人。\"},\"term\":{\"en\":\"SEC (Securities and Exchange Commission)\",\"zh-TW\":\"美國證券交易委員會（SEC）\"}},{\"blurb\":{\"en\":\"The company's earlier denial of an unusual relationship between Jensen Huang and Alice Huang — a likely focus of the probe after Huang confessed the affair on Nov 8.\",\"zh-TW\":\"輝達今年稍早否認黃仁勳與黃樂有不尋常關係；黃於 11/8 坦承後，此否認成為調查可能的檢視焦點。\"},\"term\":{\"en\":\"The disclosure denial\",\"zh-TW\":\"披露否認爭議\"}},{\"blurb\":{\"en\":\"The Singapore data-center company at the center of the scandal; Nvidia last year dropped the disclosure line that had shown its Singapore sales separately.\",\"zh-TW\":\"醜聞核心的新加坡資料中心公司；輝達去年取消了可單獨看見對新加坡銷售的披露欄位。\"},\"term\":{\"en\":\"Megaspeed / Singapore sales disclosure\",\"zh-TW\":\"Megaspeed 與新加坡銷售披露\"}}],\"id\":\"live-semiconductor-23-sec-probes-nvidia-disclosures\",\"imageAlt\":{\"en\":\"\",\"zh-TW\":\"\"},\"imageUrl\":\"\",\"isHeadline\":true,\"isPopular\":true,\"publishedAt\":\"2026-11-17T23:38:57.000Z\",\"sources\":[{\"name\":\"The Wall Street Journal\",\"url\":\"https://www.wsj.com/business/sec-is-probing-nvidia-amid-departure-of-ceo-jensen-huang-ee7643f8\"},{\"name\":\"TechCrunch\",\"url\":\"https://techcrunch.com/2026/11/17/sec-reportedly-investigating-nvidia-amid-huang-exit/\"},{\"name\":\"New York Post\",\"url\":\"https://nypost.com/2026/11/17/business/sec-probes-nvidia-after-ceo-jensen-huangs-shock-exit-over-sex-scandal-sources/\"}],\"summary\":{\"en\":\"[Unverified - single original source] The SEC has opened a civil investigation into Nvidia, the Wall Street Journal reports, including whether the company's disclosures misled investors. Likely in frame: Nvidia's earlier denial of an unusual relationship between Jensen Huang and Alice Huang, and last year's change that dropped separate disclosure of Singapore sales. The SEC declined to comment; Nvidia has not responded.\",\"zh-TW\":\"［未證實·單一原始來源］《華爾街日報》報導，美國證券交易委員會（SEC）已對輝達展開民事調查，包括其資訊披露是否誤導投資人。可能被檢視的包括：輝達先前否認黃仁勳（Jensen Huang）與黃樂（Alice Huang）有不尋常關係，以及去年取消單獨披露對新加坡銷售的欄位。SEC 不予評論，輝達尚未回應。\"},\"tags\":[],\"title\":{\"en\":\"SEC Is Probing Nvidia Over Whether Disclosures Misled Investors, WSJ Reports\",\"zh-TW\":\"SEC 調查輝達：披露是否誤導投資人，醜聞升級為聯邦監管案\"},\"trustBreakdown\":{\"crossCorroboration\":17,\"outletReputation\":22,\"recencyClarity\":12,\"sourceDiversity\":15},\"trustScore\":66}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"n
