ne share of SpaceX stock to every eligible American child enrolled in a Trump Account, a tax-advantaged investment vehicle for citizens under 18. Based on SpaceX's November 25 closing price of $127.44 across roughly 70 million active accounts, the initial two-share pledge is valued at nearly $18 billion.\n\nAccording to statements from SpaceX and Musk, the company will issue one new Class A common share per child next month, while Musk will transfer his matching personal share after his lockup period expires in June 2027. Later on November 26, Musk posted on X that he intends to personally donate an additional SpaceX share to every US child each year, potentially giving a child up to 19 shares over 18 years.\n\nMarket analysts noted the program could create one of the largest retail shareholder bases in US history while introducing minors to long-term equity ownership. However, detailed mechanics for verifying eligibility and executing annual transfers have not yet been published.\n\nTrust label: Multi-source agreement — Reuters, CBS News, and The Guardian consistently report the initial two-share pledge, $18 billion valuation, and June 2027 lockup timeline for Musk's personal transfer."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-us-154-musk-spacex-shares-us-children-trump-accounts\",\"category\":\"us\",\"title\":{\"en\":\"Elon Musk and SpaceX Pledge SpaceX Shares to Every US Child via Trump Accounts\",\"zh-TW\":\"馬斯克與 SpaceX 宣布贈與全美兒童公司股票 總值估近180億美元\"},\"summary\":{\"en\":\"Elon Musk and SpaceX pledged to grant every eligible US child SpaceX shares through Trump Accounts, initially valued at nearly $18 billion, with Musk adding an annual share pledge.\",\"zh-TW\":\"特斯拉與 SpaceX 執行長馬斯克（Elon Musk）於11月26日宣布，SpaceX 與其個人將分別贈與每位擁有「川普帳戶」的美國未成年人各1股 SpaceX 股票，按近期股價估算初始總值近180億美元；馬斯克隨後更表態未來每年將再個人加碼贈與1股。此舉旨在透過稅賦優惠儲蓄帳戶擴大散戶長期持股基礎。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\nSpaceX 執行長馬斯克（Elon Musk）於11月26日透過社群平台 X 宣布，SpaceX 將向全美每個已開立的「川普帳戶（Trump Accounts）」發行並贈與1股 A 類普通股，馬斯克個人亦將一對一配對捐出1股；同日晚間馬斯克進一步加碼，承諾未來每年將再個人贈與每位美國兒童1股 SpaceX 股票。\\n\\n「為什麼重要」\\n依 SpaceX 11月25日收盤價每股127.44美元及全美約7,000萬個已開立帳戶估算，首波每股2股的贈與計畫總值將近180億美元。該計畫將全美未成年人納入公司股東結構，可望成為美國史上規模最大的散戶股東基礎，同時藉由稅賦優惠帳戶引導年輕世代長期參與資本市場。\\n\\n「來源異同」\\n路透社（Reuters）、CBS News 與《衛報》（The Guardian）均一致報導首波公司與馬斯克各贈1股、總值約180億美元及透過「川普帳戶」發放的架構；路透社與 Business Insider 進一步追蹤到馬斯克當日稍晚追加「每年再贈1股」的新承諾，ClickOrlando 則引述貼文指出公司股權預計下月發放、馬斯克個人持股須待2027年6月閉鎖期屆滿後轉讓。\\n\\n「仍不確定」\\nSpaceX 與馬斯克尚未公布年度持續贈股的具體執行細則、資格核驗方式，以及若新增開戶數大幅變動時的股權稀釋與稅務處理機制。\\n\\nTrust label: Multi-source agreement — 路透社、CBS News 與《衛報》對 SpaceX 贈股規模、估值計算基準與發放時程報導一致。\"},\"glossary\":[{\"term\":{\"en\":\"Trump Accounts\",\"zh-TW\":\"川普帳戶（Trump Accounts）\"},\"blurb\":{\"en\":\"Tax-advantaged investment accounts established in the United States to help citizens under 18 build long-term market savings.\",\"zh-TW\":\"美國設立的稅賦優惠投資帳戶，旨在協助18歲以下未成年公民累積長期股市儲蓄。\"}},{\"term\":{\"en\":\"Lockup period\",\"zh-TW\":\"股票閉鎖期\"},\"blurb\":{\"en\":\"A contractual restriction preventing company insiders from selling or transferring shares for a set timeframe.\",\"zh-TW\":\"限制公司內部人或大股東在特定期間內不得出售或轉讓持股的契約規範。\"}},{\"term\":{\"en\":\"Class A common stock\",\"zh-TW\":\"A 類普通股\"},\"blurb\":{\"en\":\"A standard tier of corporate equity carrying ownership rights and standard voting power per share.\",\"zh-TW\":\"企業發行的標準普通股類別，賦予股東基本所有權及對應表決權。\"}}],\"sources\":[{\"name\":\"CBS News\",\"url\":\"https://www.cbsnews.com/news/elon-musk-spacex-shares-trump-accounts/\"},{\"name\":\"The Guardian\",\"url\":\"https://www.theguardian.com/technology/2026/nov/26/elon-musk-pledges-to-give-two-spacex-shares-to-every-child-in-the-us\"},{\"name\":\"Quartz (citing Reuters)\",\"url\":\"https://qz.com/musk-annual-spacex-share-every-child-trump-accounts-112726\"},{\"name\":\"Business Insider\",\"url\":\"https://www.businessinsider.com/elon-musk-doubles-down-on-spacex-trump-account-giveaway-2026-11\"}],\"imageUrl\":\"/covers/live/live-us-154-musk-spacex-shares-us-chil
