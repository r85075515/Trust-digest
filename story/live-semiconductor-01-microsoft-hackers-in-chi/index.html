erattacks against global technology systems.\n\nWhat happened\nARTEX is an AI-powered penetration-testing framework that has been in wide use since its public release in July 2026. Attackers have adopted it to automate reconnaissance, credential attacks and exploitation, running campaigns through specialised agents with almost no human involvement. Microsoft said this week that Chinese and North Korean state-sponsored crews are among the growing number of groups known to use the tool in attacks, alongside criminal organisations. Microsoft recommends deception techniques as defences, including honeypots and faked success signals.\n\nWhy it matters\nARTEX turns attacks that once needed skilled operators into something software agents can run at scale, which lowers the bar for breaking into technology systems. Defenders now face adversaries that probe, steal credentials and exploit flaws around the clock, and Microsoft's own recommended countermeasures show that spotting and misleading the automation matters as much as blocking it.\n\nSources agree / disagree\nThe Decoder and The Register agree on the core facts: Microsoft detailed ARTEX this week, the framework dates to a July public release, and state-backed Chinese and North Korean groups use it. Neither outlet's feed summary contradicts the other on names, dates or capabilities.\n\nStill uncertain\nThe feed summaries do not name the specific campaigns linked to ARTEX, quantify how many intrusions it enabled, or say which organisations were hit. They also do not detail how effective honeypots and faked success signals have proved in practice. Microsoft's full technical write-up and the publishers' reporting carry those details.\n\nTrust label: Two-source agreement — two specialist outlets corroborate Microsoft's disclosure."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-01-microsoft-hackers-in-chi\",\"category\":\"semiconductor\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-semiconductor-01-microsoft-hackers-in-chi.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Microsoft: Hackers in China, N Korea using ARTEX AI tool to break into global tech systems\",\"zh-TW\":\"相關封面圖：微軟：中國、北韓駭客使用 ARTEX AI 工具闖入全球科技系統\"},\"publishedAt\":\"2026-11-26T19:04:00.000Z\",\"title\":{\"en\":\"Microsoft Says China- and North Korea-Backed Hackers Use ARTEX AI Tool to Automate Attacks\",\"zh-TW\":\"微軟（Microsoft）指中國與北韓駭客用 ARTEX 人工智慧工具自動化攻擊\"},\"summary\":{\"en\":\"Microsoft has detailed how state-backed hackers from China and North Korea, along with criminal groups, use the open-source ARTEX AI framework to automate reconnaissance, credential attacks and exploitation. In wide use since its public release in July 2026, ARTEX runs attacks with specialised agents and almost no human involvement. Microsoft recommends honeypots and faked success signals as defences.\",\"zh-TW\":\"微軟（Microsoft）詳述中國與北韓官方支持的駭客如何連同犯罪組織，利用開源 ARTEX 人工智慧框架自動執行偵察、憑證攻擊與漏洞利用。該框架自 2026 年 7 月公開發布以來廣泛流傳，以專門代理程式運作，幾乎不需要人力介入。微軟建議以蜜罐與偽造成功訊號防禦。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"微軟揭露：中國與北韓官方支持的駭客正利用開源 ARTEX 人工智慧框架自動攻擊全球科技系統，幾乎不需要人力介入。\\n\\n發生了什麼事\\n微軟（Microsoft）公布 ARTEX 的技術架構。這是一個開源人工智慧滲透測試框架，自 2026 年 7 月公開發布以來廣泛流傳，攻擊者用它自動執行偵察、憑證攻擊與漏洞利用，透過專門的代理程式運作，幾乎不需要人力介入。微軟本週表示，中國與北韓官方支持的駭客組織是已知使用該工具發動攻擊的團體之一，犯罪組織也在使用。微軟建議以欺騙技術防禦，包括蜜罐與偽造成功訊號。\\n\\n為什麼重要\\nARTEX 把原本需要熟練操作者的攻擊交給軟體代理程式大規模執行，闖入科技系統的門檻因而降低。防禦方如今面對的是全天候偵察、竊取憑證、利用漏洞的對手，微軟開出的對策也顯示，識破並誤導這套自動化機制，與直接封堵同等重要。\\n\\n來源異同\\nThe Decoder 與 The Register 報導的核心事實一致：微軟本週詳述 ARTEX、框架源自 7 月公開發布、中國與北韓官方支持的團體正在使用。兩家摘要在名稱、日期與功能上沒有衝突。\\n\\n仍不確定\\n摘要未指明與 ARTEX 相關的具體攻擊行動、未量化它促成的入侵數量，也未說明哪些機構受害；蜜罐與偽造成功訊號的實際防禦成效也未交代。相關細節須查閱微軟完整技術說明與兩家媒體報導。\\n\\n信任標籤：兩源一致——兩家專業媒體相互印證微軟的揭露。\"},\"sources\":[{\"name\":\"The Decoder\",\"url\":\"https://the-decoder.com/microsoft-details-how-state-backed-hackers-use-the-artex-ai-framework-to-automate-cyberattacks/\"},{\"name\":\"The Register\",\"url\":\"https://www.theregister.com/security/2026/11/26/microsoft-hackers-in-china-n-korea-using-artex-ai-tool-to-break-into-global-tech-systems/5312433\"}],\"disagreements\":null,\"trustScore\":62,\"trustBreakdown\":{\"sourceDiversity\":13,\"outletReputation\":10,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"semiconductor\",\"live-ingest\",\"the-decoder\",\"the-register\"],\"glossary\":[{\"term\":{\"en\":\"ARTEX\",\"zh-TW\":\"ARTEX\"},\"blurb\":{\"en\":\"An open-source, AI-powered penetration-testing framework released publicly in July 2026.\",\"zh-TW\":\"2026 年 7 月公開發布的開源人工智慧滲透測試框架。\"}},{\"term\":{\"en\":\"Microsoft\",\"zh-TW\":\"微軟（Microsoft）\"},\"blurb\":{\"en\":\"The US technology company that published ARTEX's technical architecture.\",\"zh-TW\":\"公布 ARTEX 技術架構的美國科技公司。\"}},{\"term\":{\"en\":\"Honeypot\",\"zh-TW\":\"蜜罐\"},\"blurb\":{\"en\":\"A decoy system set up to attract attackers and study their methods.\",\"zh-TW\":\"刻意設置用來吸引攻擊者並研究其手法的誘餌系統。\"}},{\"term\":{\"en\":\"Penetration testing\",\"zh-TW\":\"滲透測試\"},\"blurb\":{\"en\":\"Authorised simulated attacks used to find weaknesses in computer systems.\",\"zh-TW\":\"經授權的模擬攻擊，用於找出電腦系統的弱點。\"}},{\"term\":{\"en\":\"The Decoder\",\"zh-TW\":\"The Decoder\"},\"blurb\":{\"en\":\"A specialist technology outlet that reported Microsoft's ARTEX disclosure.\",\"zh-TW\":\"報導微軟 ARTEX 揭露的專業科技媒體。\"}},{\"term\":{\"en\":\"The Register\",\"zh-TW\":\"The Register\"},\"blurb\":{\"en\":\"A specialist technology outlet that reported Microsoft's ARTEX disclosure.\",\"zh-TW\":\"報導微軟 ARTEX 揭露的專業科技媒體。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements,
