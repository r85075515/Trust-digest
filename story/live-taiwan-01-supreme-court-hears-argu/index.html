es from fossil fuel companies — a question that could shape dozens of similar lawsuits across the country.\nWhat happened\nESG Dive reports the justices heard arguments in the Boulder County case, testing whether local governments can pursue climate damages in state court rather than federal court. In a separate item bundled into this cluster, the BBC reports thousands marched to India's Supreme Court demanding the election chief resign, after a chaotic weekend in Delhi that saw thousands of protesters detained by police.\nWhy it matters\nWhere these cases get heard — state or federal court — can decide whether they survive at all. A ruling for Boulder County would keep the door open for local governments nationwide to press fossil fuel companies for climate costs; a ruling the other way could shut dozens of cases down at once.\nSources agree / disagree\nThe two outlets cover different stories: ESG Dive on the U.S. climate arguments, the BBC on the Delhi march to India's Supreme Court. The \"Supreme Court\" in each headline is a different court — a clustering artifact, not a disagreement.\nStill uncertain\nSnippets give no read on how the justices leaned during arguments, and no details on the Delhi march's demands beyond the headline. Verify in full reporting."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-01-supreme-court-hears-argu\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-taiwan-01-supreme-court-hears-argu.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Supreme Court hears arguments in Boulder County, Colorado, climate case\",\"zh-TW\":\"相關封面圖：最高法院聽取科羅拉多州博爾德縣氣候案件的辯論\"},\"publishedAt\":\"2026-10-12T15:19:17.000Z\",\"title\":{\"en\":\"Supreme Court Hears Boulder County Climate Damages Case\",\"zh-TW\":\"最高法院（Supreme Court）聽取科羅拉多州博爾德縣（Boulder County）氣候損害賠償案辯論\"},\"summary\":{\"en\":\"The U.S. Supreme Court heard arguments in a Boulder County, Colorado, climate case that could affect dozens of similar lawsuits nationwide, weighing whether cities and counties may use state courts to seek damages from fossil fuel companies. Separately, thousands marched to India's Supreme Court demanding the election chief resign.\",\"zh-TW\":\"美國最高法院（Supreme Court）聽取科羅拉多州博爾德縣（Boulder County）氣候案件辯論；此案可能影響全美數十起類似訴訟，爭點是各市縣能否透過州法院向化石燃料公司求償。另有數千人遊行至印度最高法院，要求選舉首長下台。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"美國最高法院（Supreme Court）受理了一起牽動全美的氣候案件。在科羅拉多州博爾德縣（Boulder County）訴訟的辯論中，大法官們正在權衡：各市縣能否透過州法院向化石燃料公司求償——這個問題將左右全美數十起類似訴訟的命運。\\n發生了什麼事\\n據 ESG Dive 報導，大法官聽取了博爾德縣案的辯論，爭點是地方政府能否在州法院、而非聯邦法院追討氣候損害賠償。同一新聞群組裡的另一則消息來自 BBC：數千人遊行至印度最高法院，要求選舉首長辭職；此前德里經歷混亂週末，數千名抗議者被警方拘留。\\n為什麼重要\\n這類案件在哪裡審——州法院還是聯邦法院——可能決定它們能不能活下去。若判博爾德縣勝訴，全美地方政府向化石燃料公司追討氣候成本的大門就還開著；反之，數十起案件可能一次被關掉。\\n來源異同\\n兩家媒體報的是不同的故事：ESG Dive 報美國氣候案件辯論，BBC 報德里遊行至印度最高法院。兩個標題裡的「最高法院」是不同的法院——這是新聞群組的拼湊，不是來源分歧。\\n仍不確定\\n摘要看不出大法官在辯論中的傾向，德里遊行的訴求細節也只有標題；引用細節前請查閱完整報導。\"},\"sources\":[{\"name\":\"BBC News-Asia\",\"url\":\"https://www.bbc.co.uk/news/articles/cwr5y2lgr4gdo?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"ESG Dive\",\"url\":\"https://www.esgdive.com/news/supreme-court-hears-arguments-in-boulder-county-colorado-climate-case/832503/\"}],\"disagreements\":null,\"trustScore\":62,\"trustBreakdown\":{\"sourceDiversity\":13,\"outletReputation\":10,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"bbc-news-asia\",\"esg-dive\"],\"glossary\":[{\"term\":{\"en\":\"U.S. Supreme Court\",\"zh-TW\":\"美國最高法院\"},\"blurb\":{\"en\":\"Top US court hearing the Boulder County climate case.\",\"zh-TW\":\"審理博爾德縣氣候案件的美國最高法院。\"}},{\"term\":{\"en\":\"Boulder County\",\"zh-TW\":\"博爾德縣\"},\"blurb\":{\"en\":\"Colorado county whose climate lawsuit is before the justices.\",\"zh-TW\":\"氣候訴訟已送交大法官審理的科羅拉多州郡。\"}},{\"term\":{\"en\":\"fossil fuel companies\",\"zh-TW\":\"化石燃料公司\"},\"blurb\":{\"en\":\"Energy firms targeted by local governments for climate damages.\",\"zh-TW\":\"被地方政府追討氣候損害
