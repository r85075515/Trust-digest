f Charleroi on November 24, 2026, in the presence of King Philippe. Operated by Walloon satellite maker Aerospacelab, the plant is designed for serial spacecraft production with an annual capacity of up to 500 satellites.\n\nWhy it matters\nEuropean governments and defense planners have sought independent low-Earth-orbit infrastructure amid heavy reliance on U.S. constellations such as Starlink and Starshield. Scaling serial assembly in Charleroi provides domestic manufacturing throughput for Earth observation and communications missions.\n\nSource differences\nZME Science (\"Europe Opens Massive Satellite Factory to Challenge Elon Musk's Starlink and Starshield\") frames the factory as a strategic effort to reduce European dependence on Elon Musk's space networks. Militarnyi (\"Belgium Opens Europe’s Largest Satellite Factory, With Annual Capacity of 500 Spacecraft\") emphasizes serial production specifications and the 500-spacecraft annual output figure. EUalive (\"King Philippe inaugurates Europe’s largest satellite factory near Charleroi\") highlights King Philippe's attendance at the Marcinelle site near Charleroi and reports an investment of roughly 100 million euros.\n\nStill uncertain\nActual first-year production volume, customer contract allocations between commercial and defense buyers, and delivery timelines for initial satellite batches remain undisclosed.\n\nTrust label: Multi-source agreement — Three outlets independently corroborate the Charleroi plant inauguration and 500-satellite annual capacity."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-291-belgium-charleroi-satellite-factory\",\"category\":\"international\",\"title\":{\"en\":\"Belgium Opens Europe's Largest Satellite Factory in Charleroi\",\"zh-TW\":\"比利時沙勒羅瓦啟用歐洲最大衛星工廠 年產能可達 500 顆\"},\"summary\":{\"en\":\"Belgium inaugurated Europe's largest satellite manufacturing plant in Charleroi, operated by Walloon firm Aerospacelab with an annual capacity of up to 500 spacecraft. The facility aims to expand European orbital production capacity and reduce reliance on U.S. satellite networks.\",\"zh-TW\":\"比利時在南部工業城市沙勒羅瓦啟用歐洲最大衛星製造工廠，由瓦隆大區航太企業 Aerospacelab 營運，設計年產能最高達 500 顆航天器。此舉旨在提升歐洲低軌與觀測衛星量產規模，並降低對美國商業衛星通訊系統的依賴。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」比利時國王菲利普（King Philippe）於 2026 年 11 月 24 日出席儀式，在南部工業城市沙勒羅瓦（Charleroi）正式啟用歐洲規模最大的衛星製造工廠。該廠由比利時瓦隆大區衛星製造商 Aerospacelab 營運，主打標準化流水線量產，設計年產能最高可達 500 顆衛星。\\n\\n「為什麼重要」歐洲各國近年高度依賴美國星鏈（Starlink）與星盾（Starshield）等低軌衛星系統，自主軌道基礎設施長期存在產能瓶頸。沙勒羅瓦超級工廠啟用後，可望強化歐洲在地球觀測與通訊領域的本土量產能力。\\n\\n「來源異同」ZME Science（原文標題：\\\"Europe Opens Massive Satellite Factory to Challenge Elon Musk's Starlink and Starshield\\\"）側重歐洲藉此擺脫對伊隆・馬斯克（Elon Musk）太空網路依賴的戰略意義；Militarnyi（原文標題：\\\"Belgium Opens Europe’s Largest Satellite Factory, With Annual Capacity of 500 Spacecraft\\\"）聚焦流水線製造規格與年產 500 顆航天器的設計上限；EUalive（原文標題：\\\"King Philippe inaugurates Europe’s largest satellite factory near Charleroi\\\"）補充工廠位於沙勒羅瓦近郊馬爾西內勒（Marcinelle），並指出投資額約 1 億歐元。\\n\\n「仍不確定」工廠首年實際排產數量、商業與國防客戶訂單比例，以及首批衛星交付時程尚未公開。\\n\\nTrust label: Multi-source agreement — ZME Science、Militarnyi 與 EUalive 三家媒體均核實沙勒羅瓦衛星廠啟用及年產 500 顆規模。\"},\"glossary\":[{\"term\":{\"en\":\"Serial production\",\"zh-TW\":\"流水線量產\"},\"blurb\":{\"en\":\"Manufacturing standardized spacecraft on an assembly line rather than building bespoke units one at a time.\",\"zh-TW\":\"以標準化組裝線批量製造規格一致的衛星，而非傳統單顆客製化手工組裝。\"}},{\"term\":{\"en\":\"Starshield\",\"zh-TW\":\"星盾（Starshield）\"},\"blurb\":{\"en\":\"SpaceX's government- and defense-focused satellite network derived from Starlink technology.\",\"zh-TW\":\"SpaceX 基於星鏈技術開發、專供政府與國防客戶使用的衛星通訊與感測網路。\"}},{\"term\":{\"en\":\"Low-Earth Orbit (LEO)\",\"zh-TW\":\"低地球軌道\"},\"blurb\":{\"en\":\"Orbits roughly 160 to 2,000 kilometers above Earth, favored for low-latency communications and high-resolution imaging.\",\"zh-TW\":\"距離地表約 160 至 2,000 公里的軌道區間，具備低延遲通訊與高解析度對地觀測優勢。\"}}],\"sources\":[{\"name\":\"ZME Science\",\"url\":\"https://www.zmescience.com/space/europe-starshield-alternative-factory-belgium/\"},{\"name\":\"Militarnyi\",\"url\":\"https://militarnyi.com/en/news/belgium-opens-europe-s-largest-satellite-factory-with-annual-capacity-of-500-spacecraft/\"},{\"name\":\"EUalive\",\"url\":\"https://eualive.net/king-philippe-inaugurates-europes-largest-satellite-factory-near-charleroi/\"}],\"imageUrl\":\"/covers/live/live-international-291-belgium-charleroi-satellite-factory.jpg\",\"imageAlt\":{\"en\":\"Belgium Opens Europe's Largest Satellite Factory in Charleroi\",\"zh-TW\":\"比利時沙勒羅瓦啟用歐洲最大衛星工廠 年產能可達 500 顆\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":82,\"trustBreakdown\":{\"crossCorroboration\":22,\"outletReputation\":18,\"recencyClarity\":22,\"sourceDiversity\":20},\"publishedAt\":\"2026-11-28T01:07:55.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":21,\"D2\":20,\"D3\":21,\"D4\":20,\"D5\":20,\"total\":20},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-international-291-belgium-charleroi-satellite-factory/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-international-291-belgium-charler
