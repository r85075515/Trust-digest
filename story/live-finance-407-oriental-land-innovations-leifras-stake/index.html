d-party allotment of treasury shares to Oriental Land Innovations Co., Ltd. (OLI), the wholly owned corporate venture capital arm of Tokyo Disney Resort operator Oriental Land Co., Ltd. Under the terms closed on November 27, LEIFRAS issued treasury shares at JPY 345 per share for total proceeds of JPY 138 million, raising OLI's equity stake to approximately 20 percent.\n\nWhy it matters\nThe completed capital injection deepens ties between Japan's largest theme park operator and a major youth sports and social-business network employing 5,447 staff as of September 2026. Reaching the roughly 20 percent ownership threshold positions OLI as a major strategic shareholder in LEIFRAS while providing growth capital without altering LEIFRAS's independent operational status.\n\nSource differences\nLEIFRAS's official press release \"LEIFRAS Announces Completion of Additional Investment by Oriental Land Innovations\" confirms the November 27 closing of the third-party treasury share allotment, while StreetInsider's report \"Oriental Land Innovations raises stake in Leifras to about 20%\" adds employee headcount context and notes that LEIFRAS will continue operating independently. Quantisnow's filing summary \"LFS: Oriental Land unit closes JPY138M share deal, stake near 20%\" specifies the JPY 138 million transaction size and JPY 345 per-share pricing from the Form 6-K filing.\n\nStill uncertain\nLEIFRAS stated that no specific joint business projects or financial earnings impacts from the expanded partnership have been announced yet, leaving concrete operational synergies undefined.\n\nTrust label: Single source — All coverage traces to LEIFRAS's own November 27 corporate announcement and its Form 6-K filing; the StreetInsider and Quantisnow items are summaries of that same disclosure, with no independent third-party reporting yet."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-407-oriental-land-innovations-leifras-stake\",\"category\":\"finance\",\"title\":{\"en\":\"Oriental Land Innovations Completes JPY 138 Million Share Purchase, Raising LEIFRAS Stake to ~20%\",\"zh-TW\":\"東方樂園創投完成 1.38 億日圓增資交割，對 LEIFRAS 持股升至約 20%\"},\"summary\":{\"en\":\"Japanese youth sports operator LEIFRAS Co., Ltd. completed a third-party allotment of 400,000 treasury shares at JPY 345 per share to Oriental Land Innovations Co., Ltd. on November 27, 2026. The JPY 138 million transaction lifts the Oriental Land corporate venture unit's ownership in Nasdaq-listed LEIFRAS to roughly 20 percent.\",\"zh-TW\":\"日本青少年體育培訓商 LEIFRAS（Nasdaq: LFS）於 2026 年 11 月 27 日完成第三方配售庫藏股交割，以每股 345 日圓向東方樂園創新（Oriental Land Innovations）出售 40 萬股，總額 1.38 億日圓。交易完成後，東京迪士尼營運商旗下創投對 LEIFRAS 持股比例提升至約 20%。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n總部位於東京的青少年體育服務商 LEIFRAS（NASDAQ: LFS）於 2026 年 11 月 27 日宣布，已完成向東方樂園創新公司（Oriental Land Innovations，簡稱 OLI）的庫藏股第三方配售交割。OLI 為東京迪士尼度假區營運商東方樂園（Oriental Land）全資擁有的企業創投子公司，本次交易以每股 345 日圓配售，總交易金額達 1.38 億日圓，使 OLI 對 LEIFRAS 的持股比例拉高至約 20%。\\n\\n「為什麼重要」\\n此次增資交割深化了日本最大主題樂園集團與擁有 5,447 名員工（截至 2026 年 9 月）的青少年體育及社區服務營運商之間的資本連結。持股跨過約 20% 門檻後，OLI 躍居 LEIFRAS 重要策略性股東，為後者挹注營運資金，同時維持其獨立經營架構。\\n\\n「來源異同」\\nLEIFRAS 官方新聞稿「LEIFRAS Announces Completion of Additional Investment by Oriental Land Innovations」確認第三方庫藏股配售於 11 月 27 日正式完成；財經媒體 StreetInsider 報導「Oriental Land Innovations raises stake in Leifras to about 20%」補充了員工規模數據及公司維持獨立營運的聲明；證券申報摘要 Quantisnow「LFS: Oriental Land unit closes JPY138M share deal, stake near 20%」則明確列出 Form 6-K 揭露的 1.38 億日圓總額與每股 345 日圓發行價。\\n\\n「仍不確定」\\nLEIFRAS 表示目前尚未公布任何具體業務合作專案或對財務績效的量化影響，雙方未來的實際營運綜效仍有待揭曉。\\n\\nTrust label: Single source — 全部報導皆源自 LEIFRAS 自家 11 月 27 日公司公告與其 Form 6-K 申報文件，StreetInsider 與 Quantisnow 均為同一揭露的摘要，目前尚無獨立第三方報導。\"},\"glossary\":[{\"term\":{\"en\":\"Third-party allotment of treasury shares\",\"zh-TW\":\"庫藏股第三方配售\"},\"blurb\":{\"en\":\"A corporate financing method where a company sells previously repurchased shares directly to a designated strategic investor rather than on the open market.\",\"zh-TW\":\"企業不透過公開市場，而是將先前買回的庫藏股直接配售予特定策略投資人的募資方式。\"}},{\"term\":{\"en\":\"Corporate venture capital (CVC)\",\"zh-TW\":\"企業創投（CVC）\"},\"blurb\":{\"en\":\"An investment subsidiary established by a parent corporation to take equity stakes in external companies for strategic and financial alignment.\",\"zh-TW\":\"由母公司設立的創投子公司，旨在透過股權投資外部企業以尋求策略合作與財務回報。\"}},{\"term\":{\"en\":\"Form 6-K\",\"zh-TW\":\"美國證交會 Form 6-K 申報\"},\"blurb\":{\"en\":\"A mandatory filing submitted by foreign private issuers listed in the United States to disclose material corporate events to investors.\",\"zh-TW\":\"在美國上市的外國私人發行人向美國證券交易委員會提交的重大訊息揭露文件。\"}}],\"sources\":[{\"name\":\"PR Newswire (LEIFRAS Co., Ltd.)\",\"url\":\"https://www.prnewswire.com/news-releases/leifras-announces-completion-of-additional-investment-by-oriental-land-innovations-302949780.html\"},{\"name\":\"StreetInsider\",\"url\":\"https://www.streetinsider.com/Corporate+News/Oriental+Land+Innovations+raises+stake+in+Leifras+to+about+20%25/27406670.html\"},{\"name\":\"Quantisnow\",\"url\":\"https://quantisnow.com/insight/sec-form-6-k-filed-by-leifras-co-ltd-6808145\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"Oriental Land Innovations Completes JPY 138 Million Share Purchase, Raising LEIFRAS Stake to ~20%\",\"zh-TW\":\"東方樂園創投完成 1.38 億日圓增資交割，對 LEIFRAS 持股升至約 20%\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":76,\"trustBreakdown\":{\"crossCorroboration\":22,\"outletReputation\":21,\"recencyClarity\":22,\"sourceDiversity\":11},\"publishedAt\":\"2026-11-28T09:02:06.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":22,\"D2\":21,\"D3\":21,\"D4\":21,\"D5\":20,\"total\":21},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-sou
