ing aimed a human-intelligence operation at the chief of the world's most important AI chip company, through a personal channel rather than a network intrusion. Even as an unconfirmed memo claim, it puts a human spy story at the center of the US-China chip rivalry, where the fight has mostly been about export controls and hardware.\nSources agree / disagree\nOnly TechCrunch has covered this so far in the cluster, so there is nothing to cross-check against. Trust label: Single source — one outlet's account of the memo, with no corroborating coverage in this cluster.\nStill uncertain\nThe memo's author, authenticity, and circulation are not established in the summary, the executive is unnamed, and no party's response appears. Verify the memo itself in the full reporting before quoting the claim."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-tech-02-megaspeed-exec-was-recru\",\"category\":\"tech\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-tech-02-megaspeed-exec-was-recru.jpg\",\"imageAlt\":{\"en\":\"A US intelligence memo reportedly says a Megaspeed executive was recruited to spy on Nvidia's CEO.\",\"zh-TW\":\"美情報備忘錄據稱指出，Megaspeed 高層受招募監視輝達執行長。\"},\"publishedAt\":\"2026-11-07T21:17:08.000Z\",\"title\":{\"en\":\"Megaspeed Executive Was Recruited to Spy on Nvidia CEO, US Memo Says\",\"zh-TW\":\"美情報備忘錄：Megaspeed 高層受招募監視輝達執行長\"},\"summary\":{\"en\":\"[Unconfirmed · single source] A memo circulated earlier this year reportedly claimed China's Ministry of State Security recruited a female Megaspeed technology executive to spy on Nvidia CEO Jensen Huang, TechCrunch reports. The claim rests on a single memo and is uncorroborated in this cluster.\",\"zh-TW\":\"［未證實·單一來源］TechCrunch 報導，今年稍早流傳的一份備忘錄聲稱，中國國家安全部招募了一名 Megaspeed 女性科技高層，監視輝達（Nvidia）執行長黃仁勳（Jensen Huang）。這項說法僅憑一份備忘錄，本集群內無其他佐證。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"今年稍早流傳的一份備忘錄聲稱，中國國家安全部招募了一名女性科技高層，監視輝達（Nvidia）執行長黃仁勳（Jensen Huang），TechCrunch 報導。\\n發生了什麼事\\n這份今年稍早流傳的備忘錄據稱指出，中國國家安全部招募了一名 Megaspeed 女性高層監視黃仁勳。來源摘要裡的說法僅此而已：沒有高層姓名、沒有備忘錄作者，日期也只有「今年稍早」。TechCrunch 的標題把此事定調為受招募監視輝達執行長，消息來源是一份美國情報備忘錄。\\n為什麼重要\\n重點在目標：如果說法屬實，北京是透過私人管道、而非網路入侵，對全球最重要的 AI 晶片公司掌門人發動人力情報行動。即使只是一份未經證實的備忘錄說法，也把人力間諜故事推到了美中晶片對抗的中心，而這場對抗過去大多圍繞出口管制與硬體打轉。\\n來源異同\\n本集群目前只有 TechCrunch 一家報導，無從交叉比對。信任標籤：單一來源——僅一家媒體報導這份備忘錄，本集群內無其他佐證。\\n仍不確定\\n來源摘要沒有備忘錄的作者、真偽與流傳情形，高層也未具名，各方回應一概付之闕如。引用這項說法前請查閱完整報導。\"},\"sources\":[{\"name\":\"TechCrunch\",\"url\":\"https://techcrunch.com/2026/11/07/chinese-exec-was-recruited-to-spy-on-nvidia-ceo-according-to-us-intelligence-memo/\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":18,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"tech\",\"live-ingest\",\"techcrunch\"],\"glossary\":[{\"term\":{\"en\":\"TechCrunch\",\"zh-TW\":\"TechCrunch\"},\"blurb\":{\"en\":\"Technology news outlet that reported on the memo.\",\"zh-TW\":\"報導這份備忘錄的科技新聞媒體。\"}},{\"term\":{\"en\":\"Megaspeed\",\"zh-TW\":\"Megaspeed\"},\"blurb\":{\"en\":\"Singaporean technology firm whose executive was allegedly recruited.\",\"zh-TW\":\"高層據稱遭招募的新加坡科技公司。\"}},{\"term\":{\"en\":\"Nvidia\",\"zh-TW\":\"輝達\"},\"blurb\":{\"en\":\"US AI chip company led by Jensen Huang, the memo's target.\",\"zh-TW\":\"備忘錄鎖定目標黃仁勳領導的美國 AI 晶片公司。\"}},{\"term\":{\"en\":\"Jensen Huang\",\"zh-TW\":\"黃仁勳\"},\"blurb\":{\"en\":\"CEO of Nvidia, the person the memo's recruit was to spy on.\",\"zh-TW\":\"輝達執行長，備忘錄中招募對象的監視目標。\"}},{\"term\":{\"en\":\"Ministry of State Security\",\"zh-TW\":\"中國國家安全部\"},\"blurb\":{\"en\":\"China's intelligence agency named in the memo as the recruiter.\",\"zh-TW\":\"備忘錄中指為招募方的中國情報機構。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"childre
