nk among the four warmest years since records began. The Guardian's report carries the warning that increased heat will supercharge extreme weather events.\nWhy it matters\nThe timing is the message: negotiators at Cop31 are now bargaining against a baseline that is actively worsening. A faster-accumulating heat imbalance means the extreme weather of recent years — the floods, fires, and heatwaves — is not a plateau but a slope, and every year of delay raises the cost of adaptation.\nSources agree / disagree\nThis is a single-outlet report: only The Guardian carries the story in this cluster, so no independent corroboration is available in the feed. Trust label: Single source — one outlet's reporting, not yet corroborated.\nStill uncertain\nThe snippets give no figures for the energy imbalance or the warming rate, and no detail on the report's methodology. The full WMO report is needed to judge the numbers behind the headline."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-energy-01-a-new-age-of-climate-ext\",\"category\":\"energy\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-energy-01-a-new-age-of-climate-ext.jpg\",\"imageAlt\":{\"en\":\"Earth accumulating heat as the Cop31 climate summit opens\",\"zh-TW\":\"COP31 開幕之際地球積熱加速\"},\"publishedAt\":\"2026-11-09T07:30:02.000Z\",\"title\":{\"en\":\"'A New Age of Climate Extremes': Earth Is Heating Faster, UN Reports\",\"zh-TW\":\"聯合國：地球積熱加速，「極端氣候新時代」來臨\"},\"summary\":{\"en\":\"[Unconfirmed · single source] Heat is accumulating in Earth's systems at an accelerating rate, the UN's weather agency reports as the Cop31 climate summit opens in Turkey, with 2026 on track to be one of the four warmest years on record. The warning: more heat will supercharge extreme weather.\",\"zh-TW\":\"［未證實·單一來源］聯合國氣象機構在土耳其 COP31 氣候峰會開幕之際報告：地球系統積熱速度正在加快，2026 年有望成為史上最熱的四個年份之一。警告很直接：熱量增加將加劇極端天氣。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"地球系統積熱的速度正在加快，聯合國氣象機構在土耳其 COP31 氣候峰會開幕之際發表報告指出，2026 年有望成為有紀錄以來最熱的四個年份之一。該機構的定調是：地球已進入「極端氣候的新時代」。\\n發生了什麼事\\n世界氣象組織（WMO）報告指出，太陽輸入地球的能量與地球散失的能量之間失衡加劇，代表熱量在地球系統中累積的速度比過去更快。報告發表之際，第31屆聯合國氣候峰會（COP31）正在土耳其開幕，2026 年有望躋身史上最熱四個年份。衛報的報導轉述警告：熱量增加將加劇極端天氣事件。\\n為什麼重要\\n時機本身就是訊息：COP31 談判代表如今面對的是一個持續惡化的基準。積熱速度加快代表近年來的洪水、野火與熱浪不是高原，而是斜坡——每拖一年，適應成本就更高。\\n來源異同\\n這是單一媒體的報導：本集群只有衛報刊載此事，來源摘要裡沒有其他媒體佐證。信任標籤：單一來源——僅一家媒體報導，尚未獲得佐證。\\n仍不確定\\n來源摘要未提供能量失衡或暖化速率的數字，也沒有報告方法學的細節。要判斷標題背後的數據，須查閱 WMO 完整報告。\"},\"sources\":[{\"name\":\"The Guardian Climate Crisis\",\"url\":\"https://www.theguardian.com/environment/2026/nov/09/cop31-climate-extremes-earth-global-heating\"}],\"disagreements\":null,\"trustScore\":59,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"energy\",\"live-ingest\",\"the-guardian-climate-crisis\"],\"glossary\":[{\"term\":{\"en\":\"WMO\",\"zh-TW\":\"世界氣象組織\"},\"blurb\":{\"en\":\"UN weather agency behind the heat-accumulation report.\",\"zh-TW\":\"發表積熱報告的聯合國氣象機構。\"}},{\"term\":{\"en\":\"Cop31\",\"zh-TW\":\"第31屆聯合國氣候峰會\"},\"blurb\":{\"en\":\"UN climate summit now opening in Turkey.\",\"zh-TW\":\"正在土耳其開幕的聯合國氣候峰會。\"}},{\"term\":{\"en\":\"UN\",\"zh-TW\":\"聯合國\"},\"blurb\":{\"en\":\"International body whose weather agency issued the report.\",\"zh-TW\":\"其氣象機構發表報告的國際組織。\"}},{\"term\":{\"en\":\"The Guardian\",\"zh-TW\":\"衛報\"},\"blurb\":{\"en\":\"British newspaper that reported the WMO findings.\",\"zh-TW\":\"報導 WMO 研究結果的英國報紙。\"}},{\"term\":{\"en\":\"Extreme weather\",\"zh-TW\":\"極端天氣\"},\"blurb\":{\"en\":\"Severe weather events supercharged by accumulating heat.\",\"zh-TW\":\"因積熱加劇而更嚴重的天氣事件。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\
