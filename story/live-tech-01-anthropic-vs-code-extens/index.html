n the marketplace of Cursor, a maker of artificial-intelligence-assisted developer tools, and Anthropic had not yet warned customers when Ars Technica reported the incident.\nWhat happened\nArs Technica reported that the malicious version, 2.1.313, was available in Cursor’s marketplace for nearly 12 hours, according to the headline. The backdoor threatened as many as 5,000 developers’ machines, multiple sources cited by Ars Technica said. Cursor said on Friday that the compromised package was the Visual Studio Code extension available in its marketplace.\nWhy it matters\nThe danger is scale through trust: developers install official extensions expecting them to be safe, so one compromised package can reach thousands of machines before anyone notices. Twelve hours allows widespread installation, and no warning at report time left developers unable to judge exposure. Supply-chain security for developer tools is therefore not an abstract risk; it is the mechanism by which a single bad package becomes a mass incident.\nSources agree / disagree\nOnly Ars Technica is represented in the material supplied, although it cites multiple sources for the report. No second outlet corroborates the 5,000-machine figure, the nearly-12-hour window, or the claim that Anthropic had not warned customers. No conflicting account appears in the material. Trust label: Single source — one outlet reported the backdoor, citing multiple sources, with no corroboration in the material supplied.\nStill uncertain\nWhat the backdoor did, whether machines were compromised or only put at risk, whether Anthropic warned customers after the report, and what remediation Cursor or Anthropic offered are all unknown from the material supplied. Developers who installed version 2.1.313 should not assume they are safe or compromised on this evidence alone; verify the affected version and any warning in the full Ars Technica report."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-tech-01-anthropic-vs-code-extens\",\"category\":\"tech\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-tech-01-anthropic-vs-code-extens.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Anthropic VS code extension on Cursor backdoored for nearly 12 hours\",\"zh-TW\":\"相關封面圖：Cursor 上的 Anthropic VS 代碼擴充被後門近 12 小時\"},\"publishedAt\":\"2026-10-30T21:09:54.000Z\",\"title\":{\"en\":\"Anthropic Claude Extension on Cursor Was Backdoored for Nearly 12 Hours\",\"zh-TW\":\"Anthropic 旗下 Claude 擴充套件在 Cursor 市集遭植後門近12小時\"},\"summary\":{\"en\":\"[Unconfirmed · Single source] An official extension for Anthropic’s Claude model was backdoored and threatened as many as 5,000 developers’ machines, multiple sources told Ars Technica Friday. Malicious version 2.1.313 sat in Cursor’s marketplace, and Anthropic had not warned customers.\",\"zh-TW\":\"［未證實·單一來源］Anthropic 旗下 Claude 模型的官方擴充套件遭植後門，威脅多達5,000台開發人員電腦，多個來源週五告訴 Ars Technica。惡意版本2.1.313出現在 Cursor 市集，Anthropic 尚未警告客戶。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"Anthropic 旗下 Claude 模型的官方擴充套件遭植入後門，威脅多達5,000台開發人員的電腦，多個消息來源週五告訴 Ars Technica。受影響的套件是 Cursor 市集裡的 Visual Studio Code 擴充套件，Cursor 是一家 AI 輔助開發工具製造商；Ars Technica 報導時，Anthropic 尚未向客戶發出警告。\\n發生了什麼事\\nArs Technica 報導，惡意版本2.1.313在 Cursor 市集上架近12小時，標題如此寫道。這款擴充套件是 Claude 模型的官方擴充套件，後門威脅多達5,000台開發人員的電腦，消息來自 Ars Technica 引述的多個來源。Cursor 週五表示，受損的套件是其市集上架的 Visual Studio Code 擴充套件。素材沒有說明後門做了什麼、開發人員的電腦是實際受害還是僅受威脅，也沒有說明使用者被告知要採取哪些步驟。\\n為什麼重要\\n危險來自信任帶來的規模：開發人員安裝官方擴充套件時預期它是安全的，一個受損套件就能在被察覺之前觸及數千台電腦。近12小時已經夠長，足以讓許多人安裝，而報導當時沒有客戶警告，受影響的開發人員無法判斷自己的曝險程度。開發工具的供應鏈安全不是抽象風險，而是單一不良套件演變成大規模事件的機制。\\n來源異同\\n素材只有 Ars Technica 一家來源，雖然它引述多個消息來源。5,000台電腦的數字、近12小時的時間，以及 Anthropic 尚未警告客戶的說法，都沒有第二家媒體佐證；素材中沒有互相衝突的說法。信任標籤：僅1源——只有一家媒體報導這起後門事件，雖引述多個來源，素材中沒有其他來源佐證。\\n仍不確定\\n後門做了什麼、電腦是實際受害還是僅受威脅、Anthropic 在報導後是否向客戶發出警告、Cursor 或 Anthropic 提供了哪些補救措施，素材都沒有交代。安裝2.1.313版本的開發人員，僅憑這些證據不應認定自己安全或受害；受影響版本與任何警告，請查閱 Ars Technica 完整報導。\"},\"sources\":[{\"name\":\"Ars Technica\",\"url\":\"https://arstechnica.com/security/2026/10/anthropic-vs-code-extension-on-cursor-backdoored-for-nearly-12-hours/\"}],\"disagreements\":null,\"trustScore\":56,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":19,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"tech\",\"live-ingest\",\"ars-technica\"],\"glossary\":[{\"blurb\":{\"en\":\"Artificial intelligence company behind the Claude model and the compromised extension.\",\"zh-TW\":\"人工智慧公司，Claude 模型與受損擴充套件的所屬公司。\"},\"term\":{\"en\":\"Anthropic\",\"zh-TW\":\"Anthropic\"}},{\"blurb\":{\"en\":\"Anthropic’s artificial intelligence model, served by the compromised official extension.\",\"zh-TW\":\"Anthropic 的人工智慧模型，受損官方擴充套件服務的對象。\"},\"term\":{\"en\":\"Claude\",\"zh-TW\":\"Claude\"}},{\"blurb\":{\"en\":\"Maker of artificial-intelligence-assisted developer tools whose marketplace hosted the extension.\",\"zh-TW\":\"AI 輔助開發工具製造商，其市集上架了這款擴充套件。\"},\"term\":{\"en\":\"Cursor\",\"zh-TW\":\"Cursor\"}},{\"blurb\":{\"en\":\"Code editor whose extension format was used by the compromised package.\",\"zh-TW\":\"程式碼編輯器，受損套件使用的擴充套件格式所屬的編輯器。\"},\"term\":{\"en\":\"Visual Studio Code\",\"zh-TW\":\"Visual Studio Code\"}},{\"blurb\":{\"en\":\"Technology news outlet that reported the backdoor, citing multiple sources.\",\"zh-TW\":\"科技新聞媒體，引述多個來源報導這起後門事件。\"},\"term\":{\"en\":\"Ars Technica\",\"zh-TW\":\"Ars Technica\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",
