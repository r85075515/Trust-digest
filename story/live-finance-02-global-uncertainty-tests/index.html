itics, and culture — turns its lens on how global uncertainty is testing India's growth story.\nWhy it matters\nIf AI capex is now big enough to offset a war's drag on world trade, the AI investment cycle has become a macroeconomic stabilizer, not just a tech story. India's growth narrative, meanwhile, faces its toughest external test in years.\nSources agree / disagree\nBloomberg and the NYT cover different items — a TV interview program and the WTO trade assessment — that share the theme of uncertainty versus resilience. No conflicting facts in the snippets.\nStill uncertain\nThe snippets give no WTO figures for the AI offset or India's growth numbers. Verify in full reporting."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-02-global-uncertainty-tests\",\"category\":\"finance\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-finance-02-global-uncertainty-tests.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Global Uncertainty Tests India’s Growth Story\",\"zh-TW\":\"相關封面圖：全球不確定性考驗印度的成長故事\"},\"publishedAt\":\"2026-10-13T07:34:57.000Z\",\"title\":{\"en\":\"WTO Says AI Spending Offset Middle East War's Drag on Global Trade\",\"zh-TW\":\"WTO：AI 相關支出抵銷中東戰爭對全球貿易的拖累\"},\"summary\":{\"en\":\"The World Trade Organization said spending on AI-related goods more than offset the drag on global trade from the Middle East war, fueling more resilient global growth, the NYT reports. Separately, Bloomberg's 'Insight with Haslinda Amin' examines how global uncertainty is testing India's growth story.\",\"zh-TW\":\"世界貿易組織（WTO）表示，AI 相關商品的支出足以抵銷中東戰爭對全球貿易的拖累，帶來更具韌性的全球成長，據《紐約時報》報導。另據彭博報導，「與哈斯琳達·阿明對話」（Insight with Haslinda Amin）探討全球不確定性如何考驗印度的成長故事。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"全球成長比預期更有韌性——多虧 AI 支出。世界貿易組織（WTO）表示，中東戰爭對全球貿易的拖累，已被人工智慧相關商品的支出完全抵銷，據《紐約時報》報導。\\n發生了什麼事\\nWTO 的評估被《紐約時報》下標為「AI 帶來更具韌性的全球成長」：AI 相關商品支出緩衝了戰爭對貿易的衝擊。群組裡另一則消息來自彭博每日節目「與哈斯琳達·阿明對話」（Insight with Haslinda Amin）——以跨商界、金融、政治、文化領袖的深度高規格訪談為主軸——本集把鏡頭轉向全球不確定性如何考驗印度的成長故事。\\n為什麼重要\\n如果 AI 資本支出已經大到足以抵銷一場戰爭對世界貿易的拖累，AI 投資週期就成了總體經濟穩定器，而不只是科技故事。印度的成長敘事，則面臨近年最嚴峻的外部考驗。\\n來源異同\\n彭博與《紐約時報》報的是不同事項——一個電視訪談節目、一個 WTO 貿易評估——共享「不確定性對韌性」的主題。來源摘要中沒有事實衝突。\\n仍不確定\\n摘要沒有 WTO 的 AI 抵銷數字，也沒有印度的成長數據；引用細節前請查閱完整報導。\"},\"sources\":[{\"name\":\"Bloomberg\",\"url\":\"https://www.bloomberg.com/news/videos/2026-10-13/insight-with-haslinda-amin-10-13-2026-video\"},{\"name\":\"NYT Economy\",\"url\":\"https://www.nytimes.com/2026/10/08/business/economy/wto-global-trade-resilient.html\"}],\"disagreements\":null,\"trustScore\":75,\"trustBreakdown\":{\"sourceDiversity\":13,\"outletReputation\":23,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"finance\",\"live-ingest\",\"bloomberg\",\"nyt-economy\"],\"glossary\":[{\"term\":{\"en\":\"WTO\",\"zh-TW\":\"世界貿易組織\"},\"blurb\":{\"en\":\"Body that assessed AI spending's offset of war's trade drag.\",\"zh-TW\":\"評估 AI 支出抵銷戰爭貿易拖累的機構。\"}},{\"term\":{\"en\":\"Haslinda Amin\",\"zh-TW\":\"哈斯琳達·阿明\"},\"blurb\":{\"en\":\"Host of Bloomberg's daily 'Insight' interview program.\",\"zh-TW\":\"彭博每日訪談節目「Insight」主持人。\"}},{\"term\":{\"en\":\"India\",\"zh-TW\":\"印度\"},\"blurb\":{\"en\":\"Economy whose growth story faces global uncertainty.\",\"zh-TW\":\"成長故事面臨全球不確定性考驗的經濟體。\"}},{\"term\":{\"en\":\"AI\",\"zh-TW\":\"人工智慧\"},\"blurb\":{\"en\":\"Spending on AI-related goods cushioned global trade, per WTO.\",\"zh-TW\":\"WTO 認為其相關商品支出緩衝了全球貿易。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"h
