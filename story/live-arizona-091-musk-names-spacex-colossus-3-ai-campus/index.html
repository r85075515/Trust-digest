er campus in southeastern Arizona will be named 'Colossus 3.' Planned for a 747-acre site near Willcox Playa in Cochise County, the facility is submitted through SpaceX's wholly owned subsidiary Tombstone Resources LLC.\n\nAt full buildout, the AI-training gigafactory is projected to require up to 6 gigawatts of electricity, making power supply, water usage, and ecological proximity to Willcox Playa central concerns for local residents and utilities ahead of a scheduled December 9 public hearing.\n\nLocal outlets including the Arizona Republic and Arizona Daily Star emphasize community scrutiny over grid reliability, utility affordability, and proximity to sandhill crane habitat, while SpaceX's project posts and filings highlight pledges to avoid gas plants and industrial water use and to self-fund grid upgrades.\n\nFinal zoning approval, actual power interconnection timelines, and enforceable environmental conditions remain undecided pending the December 9 Cochise County hearing and regulatory review.\n\nTrust label: Multi-source agreement — Core project name, $50 billion scale, 747-acre Cochise County location, and December 9 hearing are corroborated across regional and tech news reports."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-arizona-091-musk-names-spacex-colossus-3-ai-campus\",\"category\":\"arizona\",\"title\":{\"en\":\"Elon Musk Names Proposed $50B Southeast Arizona AI Campus 'Colossus 3'\",\"zh-TW\":\"馬斯克揭曉亞利桑那州東南部 500 億美元 AI 園區命名為「Colossus 3」\"},\"summary\":{\"en\":\"Elon Musk announced on X that SpaceX's proposed $50 billion, 747-acre AI supercomputer campus near Willcox Playa in Cochise County, Arizona, is named 'Colossus 3,' drawing mixed local reactions ahead of a December 9 hearing.\",\"zh-TW\":\"馬斯克（Elon Musk）在社群平台 X 公布，SpaceX 擬於亞利桑那州科奇斯郡威爾科克斯乾湖（Willcox Playa）附近興建的 500 億美元、占地 747 英畝 AI 超級電腦園區命名為「Colossus 3」。該案滿載用電高達 6 百萬瓩，電網與水資源影響將於 12 月 9 日聽證會面臨當地檢視。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」SpaceX 創辦人暨執行長馬斯克（Elon Musk）在社群平台 X 發文揭曉，該公司擬於亞利桑那州東南部科奇斯郡（Cochise County）威爾科克斯乾湖（Willcox Playa）附近興建的超大型 AI 超級電腦園區正式命名為「Colossus 3」。該計畫透過 SpaceX 全資子公司 Tombstone Resources LLC 提出申請，規畫占地 747 英畝、總投資規模達 500 億美元。\\n\\n「為什麼重要」這座 AI 訓練超級工廠全面建成後，預計最高需要 6 百萬瓩（6 GW）電力，規模遠超一般資料中心。隨著 12 月 9 日地方聽證會逼近，如此龐大的用電需求對當地合作社電網穩定度、電價負擔以及周邊生態的潛在衝擊，已成為亞利桑那州能源與地方治理焦點。\\n\\n「來源異同」《亞利桑那共和報》（Arizona Republic）與《亞利桑那每日星報》（Arizona Daily Star）側重報導當地居民對用電、水資源與社區衝擊的質疑，以及電力合作社對電網負擔的評估；科技媒體則聚焦 SpaceX 承諾不設燃氣電廠、不使用工業用水，並自費升級電網以降低居民電費的主張。\\n\\n「仍不確定」園區最終能否通過科奇斯郡規劃與分區委員會審查、6 百萬瓩電網併網時程如何落實，以及聯邦保護沙丘鶴棲地的具體環評限制條件，仍有待 12 月 9 日聽證會與後續行政程序定案。\\n\\nTrust label: Multi-source agreement — Core project name, $50 billion scale, 747-acre Cochise County location, and December 9 hearing are corroborated across regional and tech news reports.\"},\"glossary\":[{\"term\":{\"en\":\"Gigawatt (GW)\",\"zh-TW\":\"百萬瓩（GW）\"},\"blurb\":{\"en\":\"A unit of electrical power equal to one billion watts, roughly equivalent to the output of a large nuclear power reactor.\",\"zh-TW\":\"十億瓦特的電力單位，約相當於一座大型核能發電機組的供電容量。\"}},{\"term\":{\"en\":\"Willcox Playa\",\"zh-TW\":\"威爾科克斯乾湖（Willcox Playa）\"},\"blurb\":{\"en\":\"A seasonal dry lakebed in Cochise County, southeastern Arizona, known as a wintering habitat for migratory sandhill cranes.\",\"zh-TW\":\"位於亞利桑那州東南部科奇斯郡的季節性乾湖盆地，也是候鳥沙丘鶴的重要冬季棲息地。\"}},{\"term\":{\"en\":\"Electric Cooperative\",\"zh-TW\":\"電力合作社\"},\"blurb\":{\"en\":\"A member-owned, not-for-profit utility that distributes electricity to rural and regional communities.\",\"zh-TW\":\"由用戶共同擁有、非營利性質的公用事業組織，負責向偏鄉與區域社區輸送電力。\"}}],\"sources\":[{\"name\":\"Arizona Daily Star / Arizona Republic\",\"url\":\"https://tucson.com/news/local/environment/article_7ed9d201-f9f3-4ea3-ad9a-29af4b65d71d.html\"},{\"name\":\"美國之音華語網 (VOA Chinese / VocoFM)\",\"url\":\"https://news.vocofm.com/%E7%94%A2%E6%A5%AD%E7%A7%91%E6%8A%80/212532/\"},{\"name\":\"Supercomputing Online\",\"url\":\"https://www.supercomputingonline.com/latest/63237-spacexsis-6-gw-supercomputer
