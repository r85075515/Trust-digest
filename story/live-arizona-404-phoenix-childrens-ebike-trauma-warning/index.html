 crashes have become the leading cause of emergency trauma team activations at the hospital, urging parents to think carefully before buying them as holiday gifts. Separately, Gilbert police recently released video footage showing a young rider colliding with a car while crossing a busy intersection; the rider suffered severe injuries and has since been discharged. Broader context from a Stanford-led study published in JAMA analyzing 13,307 pediatric injury visits across six U.S. children's hospitals from 2023 through March 2026 shows pediatric e-bike injuries rising roughly 33% per quarter and e-scooter injuries roughly 15% per quarter, with severe injury and brain injury rates roughly double those of traditional bikes and scooters.\n\nWhy it matters\nAs high-speed electric micromobility devices become popular gifts for children and teens, local emergency physicians are seeing severe trauma cases outpace traditional cycling injuries. The combination of local clinical warnings in Phoenix and multi-hospital JAMA data highlights elevated head and severe trauma risks for young riders.\n\nSource differences\nWisevoter's article titled \"E-Bike Injuries Now Top Trauma Activations\" relays the local Phoenix Children's physician warning and the Gilbert police intersection crash video. Stanford News's official release titled \"E-bike and e-scooter injuries rise among kids and teens\" details the multi-center JAMA study covering 13,307 cases across six children's hospitals.\n\nStill uncertain\nThe sources do not break down the exact total count of e-bike versus e-scooter trauma activations specifically at Phoenix Children's over the past year, nor whether Phoenix Children's was one of the six hospitals included in the JAMA dataset.\nTrust label: Single source — Local Phoenix claims come from a single reporting chain relaying Phoenix Children's physicians, while national background figures come from the Stanford-led JAMA study."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-arizona-404-phoenix-childrens-ebike-trauma-warning\",\"category\":\"arizona\",\"title\":{\"en\":\"Phoenix Children's Doctors Warn E-Bikes and E-Scooters Top Trauma Activations\",\"zh-TW\":\"鳳凰城兒童醫院警告電動自行車與滑板車成急診創傷啟動首因\"},\"summary\":{\"en\":\"Phoenix Children's physicians warned on November 27–28, 2026 that e-bike and e-scooter crashes are now the hospital's top trigger for trauma activations, urging holiday caution as a Stanford JAMA study shows rapid quarterly pediatric injury growth.\",\"zh-TW\":\"鳳凰城兒童醫院（Phoenix Children's）醫師於 2026 年 11 月 27 至 28 日警告，電動自行車與電動滑板車事故已成為該院啟動急診創傷團隊的第一大原因，提醒家長節日購禮前三思；史丹佛主導的 JAMA 研究亦顯示兒童相關傷害每季大幅攀升，重傷與腦傷比例約為傳統載具兩倍。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」鳳凰城兒童醫院（Phoenix Children's）醫師於 2026 年 11 月 27 至 28 日提出警告，指出電動自行車與電動滑板車事故已成為該院啟動急診創傷團隊的第一大原因，並提醒家長在節日送禮季購買前三思。亞利桑那州吉爾伯特（Gilbert）警方近日亦公布一段監視器畫面，顯示一名年輕騎士穿越繁忙路口時與汽車相撞，該名騎士重傷送醫後現已出院。背景數據方面，由史丹佛大學團隊主導並發表於《JAMA》的研究分析 2023 年至 2026 年 3 月期間全美六家兒童醫院共 13,307 例傷害就診紀錄，顯示兒童電動自行車傷害約每季增加 33%、電動滑板車約增加 15%，且電動載具的重傷與腦傷比例約為傳統載具的兩倍。\\n\\n「為什麼重要」隨著電動自行車與滑板車成為青少年熱門節日禮物，行駛速度與碰撞動能遠高於傳統腳踏車，導致急診創傷負擔急劇上升。鳳凰城第一線醫師的警訊與跨院醫學研究數據相互呼應，凸顯兒童與青少年騎乘電動載具面臨的嚴重腦部與身體創傷風險。\\n\\n「來源異同」Wisevoter 報導標題為「E-Bike Injuries Now Top Trauma Activations」，聚焦鳳凰城兒童醫院醫師的在地創傷啟動警告及吉爾伯特警方公布的路口車禍影片；史丹佛大學官方新聞稿標題為「E-bike and e-scooter injuries rise among kids and teens」，則完整呈現《JAMA》六家兒童醫院 13,307 例就診紀錄的量化研究結果。\\n\\n「仍不確定」現有來源未揭露鳳凰城兒童醫院近一年電動自行車與滑板車創傷啟動的具體個案總數，也未說明該院是否名列《JAMA》研究採樣的六家兒童醫院之中。\\nTrust label: Single source — 鳳凰城在地數據與說法僅出自鳳凰城兒童醫院醫師經地方媒體轉述的單一報導鏈，研究數據則出自史丹佛主導的 JAMA 研究。\"},\"glossary\":[{\"term\":{\"en\":\"Trauma activation\",\"zh-TW\":\"急診創傷團隊啟動\"},\"blurb\":{\"en\":\"A hospital emergency protocol mobilizing specialized surgeons, nurses, and diagnostic resources immediately for patients with potentially life-threatening injuries.\",\"zh-TW\":\"醫院針對可能危及生命的嚴重外傷患者，立即召集外科醫師、護理與影像診斷團隊待命搶救的緊急醫療機制。\"}},{\"term\":{\"en\":\"JAMA\",\"zh-TW\":\"美國醫學會雜誌\"},\"blurb\":{\"en\":\"The Journal of the American Medical Association, a peer-reviewed medical journal publishing clinical and public health research.\",\"zh-TW\":\"全名為 Journal of the American Medical Association，為國際具代表性的同儕審查綜合醫學期刊。\"}},{\"term\":{\"en\":\"Quarterly injury growth\",\"zh-TW\":\"每季傷害增幅\"},\"blurb\":{\"en\":\"The average percentage increase in emergency department injury visits measured every three-month quarter over the study period.\",\"zh-TW\":\"研究期間以每三個月為一季所計算的平均急診外傷就診人次成長率。\"}}],\"sources\":[{\"name\":\"Wisevoter\",\"url\":\"https://wisevoter.com/world/us/az/phoenix/2026/11/28/phoenix-e-bike-injuries-top-child-trauma-activations\"},{\"name\":\"Stanford News\",\"url\":\"https://news.stanford.edu/stories/2026/11/e-bike-scooter-injuries-kids-teens-research\"}],\"imageUrl\":\"/covers/live/live-arizona-404-phoenix-childrens-ebike-trauma-warning.jpg\",\"imageAlt\":{\"en\":\"Phoenix Children's Doctors Warn E-Bikes and E-Scooters Top Trauma Activations\",\"zh-TW\":\"鳳凰城兒童醫院警告電動自行車與滑板車成急診創傷啟動首因\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":73,\"trustBreakdown\":{\"crossCorroboration\":15,\"outletReputation\":21,\"recencyClarity\":24,\"sourceDiversity\":13},\"publishedAt\":\"2026-11-28T09:02:06.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":20,\"D2\":21,\"D3\":19,\"D4\":18,\"D5\":20,\"total\":20},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-arizona-404-phoenix-childrens-ebike-trauma-warning/\"}],[\"$\",\"meta\",\"3\",{\"prope
