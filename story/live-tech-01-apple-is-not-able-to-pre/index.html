A flagship launch that buyers cannot reliably get their hands on is a supply problem with a direct consumer cost: waiting times, not just headlines. Ternus's refusal to give a date signals that Apple itself does not yet see a clear end to the constraint, which makes any near-term buying decision a gamble on timing.\n\nSources agree and disagree\nTechCrunch and The Verge agree on the core facts: production is rising, delays run into next year, and Apple will not commit to a date for balance. Their headlines phrase the same admission differently, with no numeric or name conflict across the snippets.\n\nStill uncertain\nNeither snippet gives a production figure, a wait-list length or a date for improvement, so buyers have no way to judge from this coverage how long the shortage will last.\n\nTrust label: Two-source agreement"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-tech-01-apple-is-not-able-to-pre\",\"category\":\"tech\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-tech-01-apple-is-not-able-to-pre.webp\",\"imageAlt\":{\"en\":\"Cover related to: Apple is ‘not able to predict’ when it\u0026#8217;ll have enough iPhone Duos to go around\",\"zh-TW\":\"相關封面圖：蘋果「無法預測」何時會有足夠的 iPhone Duo 可供使用\"},\"publishedAt\":\"2026-11-02T23:25:32.000Z\",\"title\":{\"en\":\"Apple CEO John Ternus Says iPhone Duo Supply Timeline Cannot Be Predicted\",\"zh-TW\":\"蘋果（Apple）執行長約翰·特納斯（John Ternus）坦言無法預測 iPhone Duo 供貨何時跟上需求\"},\"summary\":{\"en\":\"Apple CEO John Ternus told Reuters the company cannot predict when iPhone Duo supply will balance with demand, even as production ramps up and shipping delays stretch into next year. Apple launched its first foldable last month for $1,999. The admission matters for buyers deciding whether to wait. Next, watch Apple's next production update for a firmer timeline.\",\"zh-TW\":\"蘋果（Apple）執行長約翰·特納斯（John Ternus）接受路透社（Reuters）訪問時表示，即使產量正在提升、出貨延遲已延續到明年，公司仍無法預測 iPhone Duo 供需何時平衡。蘋果上個月以1999美元推出首款摺疊機。這番坦言直接影響消費者要不要等貨。接下來看蘋果下一次產能說法是否給出更明確的時間表。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"發生了什麼事\\n蘋果（Apple）執行長約翰·特納斯（John Ternus）接受路透社（Reuters）訪問時表示，公司無法預測 iPhone Duo 供貨何時趕上需求，即使產量正在提升、出貨延遲已延續到明年。特納斯沒有給出供貨限制何時解除的時間表。他說，公司「正在努力盡快將其提供給盡可能多的客戶，但目前我們無法預測供需何時會達到平衡。」蘋果上個月以1999美元推出首款摺疊機，配備5.4吋顯示器，需求自此超過可供貨量。\\n\\n為什麼重要\\n消費者買不到的旗艦新品，是直接反映在等待時間上的供應問題，不只是新聞標題。特納斯不給日期，意味蘋果自己也還看不到限制解除的明確時點，短期內要不要入手，成了一場對時間的賭注。\\n\\n來源異同\\nTechCrunch（TechCrunch）與 The Verge（The Verge）對核心事實一致：產量提升、延遲延續到明年、蘋果不承諾平衡日期。兩家標題用不同措辭表達同一坦言，摘要中未見數字或人名衝突。\\n\\n仍不確定\\n摘要未提供產量數字、等候名單長度或改善日期，消費者無從由這批報導判斷缺貨會持續多久。\"},\"sources\":[{\"name\":\"TechCrunch\",\"url\":\"https://techcrunch.com/2026/11/02/apple-says-its-hard-to-predict-when-iphone-duo-constraints-will-improve/\"},{\"name\":\"The Verge\",\"url\":\"https://www.theverge.com/tech/1024915/apple-iphone-duo-supply-chain-constraints\"}],\"disagreements\":null,\"trustScore\":70,\"trustBreakdown\":{\"sourceDiversity\":13,\"outletReputation\":18,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"tech\",\"live-ingest\",\"techcrunch\",\"the-verge\"],\"glossary\":[{\"term\":{\"en\":\"John Ternus\",\"zh-TW\":\"約翰·特納斯\"},\"blurb\":{\"en\":\"Apple's CEO, speaking in a Reuters interview.\",\"zh-TW\":\"接受路透社訪問的蘋果執行長。\"}},{\"term\":{\"en\":\"iPhone Duo\",\"zh-TW\":\"iPhone Duo\"},\"blurb\":{\"en\":\"Apple's first foldable phone, launched last month.\",\"zh-TW\":\"蘋果上個月推出的首款摺疊機。\"}},{\"term\":{\"en\":\"Reuters\",\"zh-TW\":\"路透社\"},\"blurb\":{\"en\":\"The news agency that interviewed Ternus.\",\"zh-TW\":\"訪問特納斯的新聞通訊社。\"}},{\"term\":{\"en\":\"TechCrunch\",\"zh-TW\":\"TechCrunch\"},\"blurb\":{\"en\":\"A technology news outlet covering Apple's supply comments.\",\"zh-TW\":\"報導蘋果供貨說法的科技新聞媒體。\"}},{\"term\":{\"en\":\"The Verge\",\"zh-TW\":\"The Verge\"},\"blurb\":{\"en\":\"A technology news outlet covering Apple's supply comments.\",\"zh-TW\":\"報導蘋果供貨說法的科技新聞媒體。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\"
