nder Yui, told the meeting he looks forward to more cooperation, and Tennessee's governor-elect said Taiwanese businesses will find new opportunities and closer Taiwan–US ties.\nWhat happened\nThe Taiwanese Chambers of Commerce of North America held its joint board meeting in Tennessee this week, the first large event North American Taiwanese businesses have staged in the US Southeast. At the meeting, Taiwan's representative to the US, Alexander Yui, said he expects the two sides to expand cooperation. The governor-elect also spoke, saying he believes Taiwanese businesses will find new opportunities and that exchanges between Taiwan and the US will grow closer.\nWhy it matters\nThe location is the signal: Taiwanese business groups are planting a flag in the US Southeast, a region courting manufacturing investment, rather than sticking to the usual coastal hubs. If the governor-elect's welcome turns into incentives or deals, Tennessee could become a new node in Taiwan–US supply-chain ties. For now it is a statement of intent, not a signed agreement.\nSources agree / disagree\nOnly CNA has reported the meeting so far, so there is nothing to cross-check against. No numeric or name conflicts appear in the feed snippet. Trust label: Single source — one CNA item, unconfirmed by other outlets; the remarks are reported from the meeting itself.\nStill uncertain\nThe feed snippet is a headline and one paragraph, not a full article. The governor-elect's name, the number of attendees, and any specific cooperation projects or investment figures are not in the material; the full CNA article must be read before quoting details."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"adult\":false,\"body\":{\"en\":\"$10\",\"zh-TW\":\"北美洲台灣商會聯合總會本週在田納西州舉行理監事聯席會議，是北美台商首度在美東南區舉行的大型活動，中央社 11 月 22 日報導。駐美代表俞大㵢在會中表示，期待雙方拓展更多合作機會；新任州長當選人也說，台商將發掘新的合作機會，讓台美往來更加緊密。\\n發生了什麼事\\n北美洲台灣商會聯合總會本週在田納西州舉行理監事聯席會議，為北美台商首度在美東南區舉行大型活動。會中，駐美代表俞大㵢表示，期待雙方拓展更多合作機會；新任州長當選人也說，相信台商將發掘新的合作機會
