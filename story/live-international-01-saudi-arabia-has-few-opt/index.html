od options. Iran has long backed the Houthis, a Yemeni militia, and Tehran has now offered to mediate between its allies and Riyadh even as Saudi Arabia contends with increasingly deadly attacks.\nWhat happened\nThree deadly attacks by the Iran-backed Houthis on an airport in the Saudi capital underscored the asymmetrical nature of their conflict with the kingdom. A Saudi minister vowed a \"serious response\" to the airport strikes (BBC). The FAA warned US airlines about flight risks over Saudi Arabia as the Riyadh airport attacks disrupt travel, with Delta weighing an October 23 launch (CNBC). Bloomberg reports Saudi Arabia fending off fresh strikes after the deadly airport attacks, and Al Jazeera published an explainer on why the Houthis are striking Saudi airports.\nWhy it matters\nThe judgment is about what is being hit: airports are the physical heart of Saudi Arabia's ambitions — tourism, aviation hubs, the economic transformation beyond oil. Sustained strikes on them don't just kill; they price risk into every flight, every investor trip, every conference. That is the asymmetry — cheap drones against a trillion-dollar vision.\nSources agree / disagree\nBBC World, NYT World, CNBC, Bloomberg, and Al Jazeera agree on the escalation arc — the strikes, the Saudi vow of response, Iran's mediation offer, and the FAA warning — but casualty figures differ across outlets (13 vs 23). Trust label: Accounts differ — aligned on the story, split on the death toll.\nStill uncertain\nThe true death toll is unresolved given the conflicting figures, and it is unclear whether Iran's mediation offer is a serious diplomatic move or positioning. Verify casualty numbers and the mediation status in full reporting before quoting them."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-01-saudi-arabia-has-few-opt\",\"category\":\"international\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-international-01-saudi-arabia-has-few-opt.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Saudi Arabia Has Few Options as Houthis Aim at Heart of Its Ambitions\",\"zh-TW\":\"相關封面圖：胡塞武裝瞄準其野心，沙烏地阿拉伯別無選擇\"},\"publishedAt\":\"2026-10-12T14:59:23.000Z\",\"title\":{\"en\":\"Houthi Strikes on Saudi Airports Escalate as Riyadh Vows 'Serious Response'\",\"zh-TW\":\"胡塞武裝襲擊沙烏地機場升級，利雅德誓言「嚴肅回應」\"},\"summary\":{\"en\":\"Iran-backed Houthis struck Riyadh's international airport and another Saudi facility in a major escalation, with outlets reporting 13 dead; Saudi Arabia's minister vowed a 'serious response' while Iran offered to mediate. The FAA warned US airlines over Saudi airspace. Next watch is Riyadh's retaliation and whether mediation gains traction.\",\"zh-TW\":\"伊朗支持的胡塞武裝襲擊利雅德國際機場及沙烏地另一設施，事態大幅升級，各家報導死亡人數為13人；沙烏地部長誓言「嚴肅回應」，伊朗則提議居中調解。美國聯邦航空總署（FAA）警告美籍航空注意沙烏地空域風險；接下來看利雅德如何報復、調解有無進展。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"武裝組織胡塞武裝襲擊了利雅德國際機場及沙烏地另一處設施，依主要報導造成13人死亡——事態大幅升級，沙烏地阿拉伯幾乎沒有好選項。伊朗長期支持這個葉門民兵組織，如今在沙烏地應對日益致命的攻擊之際，德黑蘭提議在胡塞盟友與利雅德之間居中調解。\\n發生了什麼事\\n伊朗支持的胡塞武裝對沙烏地首都機場的三起致命攻擊，凸顯了雙方衝突的不對稱性。沙烏地部長誓言對機場襲擊做出「嚴肅回應」（BBC）。利雅德機場遇襲擾亂旅行，達美航空考慮10月23日開航之際，美國聯邦航空總署（FAA）警告美國航空公司注意沙烏地空域的飛航風險（CNBC）。彭博報導沙烏地在致命機場襲擊後擋下新一波攻擊；半島電視台則刊出了解析胡塞為何襲擊沙烏地機場的報導。\\n為什麼重要\\n這是「打中了什麼」的判斷：機場是沙烏地野心的實體心臟——觀光、航空樞紐、擺脫石油的經濟轉型。持續攻擊機場，殺傷的不只是人命，更是把風險定價進每一班航班、每一趟投資行程、每一場會議。這就是不對稱——廉價無人機對上兆美元願景。\\n來源異同\\nBBC World、NYT World、CNBC、彭博、半島電視台對升級軸線一致——襲擊、沙烏地揚言回應、伊朗調解提議、FAA 警告——但死亡人數各家不一（13人 vs 23人）。信任標籤：敘述有分歧——故事主線一致，死亡數字分歧。\\n仍不確定\\n數字衝突之下，真實死亡人數未定；伊朗的調解提議是認真的外交動作還是姿態操作，也看不出來。引用傷亡數字與調解進度前請查閱完整報導。\"},\"sources\":[{\"name\":\"BBC World\",\"url\":\"https://www.bbc.co.uk/news/articles/cjly0zqq27e4o?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"NYT World\",\"url\":\"https://www.nytimes.com/2026/10/12/world/middleeast/iran-houthis-saudi-arabia-mediate.html\"},{\"name\":\"CNBC\",\"url\":\"https://www.cnbc.com/2026/10/12/faa-saudi-arabia-flight-risks.html\"},{\"name\":\"Bloomberg\",\"url\":\"https://www.bloomberg.com/news/videos/2026-10-12/saudi-arabia-fends-off-fresh-strikes-video\"},{\"name\":\"Al Jazeera\",\"url\":\"https://www.aljazeera.com/news/2026/10/12/why-are-the-houthis-striking-saudi-airports?traffic_source=rss\"}],\"disagreements\":{\"en\":\"Outlets report different death tolls for the airport attacks (13 vs 23).\",\"zh-TW\":\"各家報導的機場襲擊死亡人數不一（13人 vs 23人）。\"},\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":25,\"outletReputation\":20,\"crossCorroboration\":17,\"recencyClarity\":25},\"tags\":[\"international\",\"live-ingest\",\"bbc-world\",\"nyt-world\",\"nyt-world\"],\"glossary\":[{\"term\":{\"en\":\"Houthis\",\"zh-TW\":\"胡塞武裝\"},\"blurb\":{\"en\":\"Iran-backed Yemeni militia carrying out the airport strikes.\",\"zh-TW\":\"發動機場襲擊、受伊朗支持的葉門民兵組織。\"}},{\"term\":{\"en\":\"Saudi Arabia\",\"zh-TW\":\"沙烏地阿拉伯\"},\"blurb\":{\"en\":\"Kingdom targeted by the Houthi airport attacks.\",\"zh-TW\":\"遭胡塞機場襲擊鎖定的王國。\"}},{\"term\":{\"en\":\"Iran\",\"zh-TW\":\"伊朗\"},\"blurb\":{\"en\":\"Longtime backer of the Houthis, now offering to mediate.\",\"zh-TW\":\"長期支持胡塞武裝、如今提議調解的國家。\"}},{\"term\":{\"en\":\"FAA\",\"zh-TW\":\"美國聯邦航空總署\"},\"blurb\":{\"en\":\"US aviation authority that warned airlines about Saudi airspace risks.\",\"zh-TW\":\"警告航空公司注意沙烏地空域風險的美國航空主管機關。\"}},{\"term\":{\"en\":\"Riyadh\",\"zh-TW\":\"利雅德\"},\"blurb\":{\"en\":\"Saudi capital whose international airport was struck.\",\"zh-TW\":\"國際機場遭襲擊的沙烏地首都。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source veri
