 operational. The snippet adds that Microsoft had already patched the vulnerability the malware used, and then truncates, so the full argument about responsibility, patching limits, or revocation is not visible in the feed text. This digest therefore reports the bypass, its timing, and its early-boot position as stated, without completing the article's blame argument.\nWhy it matters\nA bootkit that runs before the operating system and its defenses is significant because it can undermine the very mechanism, Secure Boot, that is meant to guarantee only trusted code starts the machine. If fully patched systems could still be bypassed, the gap lies not in a user failing to update but in how boot trust is established and revoked across the industry. That is why the headline frames the issue as one of responsibility rather than a single missing patch, though the snippet alone does not settle that question.\nSources agree / disagree\nArs Technica is the only outlet in this cluster, so no corroborating or conflicting account is available in the feeds. Trust label: Single source — the BlackLotus history, the Secure Boot bypass, and the patched-vulnerability detail all come from this one report as excerpted.\nStill uncertain\nThe truncated snippet leaves uncertain how the infection was delivered, how widespread it was, what Microsoft or industry partners did in response, and the article's full conclusion on blame. It also does not specify current risk to Windows 11 users. Those points require the full Ars Technica article and should not be inferred from the headline question alone."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-tech-01-uefi-bootkit-infected-fu\",\"category\":\"tech\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-tech-01-uefi-bootkit-infected-fu.jpg\",\"imageAlt\":{\"en\":\"Cover related to: UEFI bootkit infected fully patched Windows machines. Is Microsoft to blame?\",\"zh-TW\":\"相關封面圖：UEFI bootkit 感染了完全修補的 Windows 電腦。微軟是罪魁禍首嗎？\"},\"publishedAt\":\"2026-11-03T16:03:13.000Z\",\"title\":{\"en\":\"BlackLotus bootkit bypassed Secure Boot on fully patched Windows 11 systems\",\"zh-TW\":\"黑蓮（BlackLotus）開機程式繞過安全開機，感染已完整修補的Windows 11系統\"},\"summary\":{\"en\":\"Malware tracked as BlackLotus became in 2023 the first publicly documented in-the-wild UEFI bootkit able to bypass Secure Boot on fully updated Windows 11 systems, Ars Technica reports. By subverting the chain of trust, it ran malicious code before Windows fully loaded and defenses were operational.\",\"zh-TW\":\"科技媒體（Ars Technica）報導，被追蹤為黑蓮（BlackLotus）的惡意軟體在2023年成為首個公開記錄、在野外出現的開機程式，能在完全更新的Windows 11系統上繞過安全開機（Secure Boot），並在系統完全載入前執行惡意程式碼。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"被追蹤為黑蓮（BlackLotus）的惡意軟體，透過攻擊開機最早階段感染已完整修補的Windows電腦；科技媒體（Ars Technica）以微軟（Microsoft）是否應負責為標題提問，質疑這款開機程式如何擊破已更新系統的防護。\\n發生了什麼事\\n科技媒體（Ars Technica）報導，黑蓮（BlackLotus）在2023年成為第一個公開記錄、在野外出現的統一可擴展韌體介面開機程式（UEFI bootkit），能在完全更新的Windows 11系統上繞過安全開機（Secure Boot）。在全產業的信任鏈機制被顛覆後，惡意軟體能在Windows完全載入、許多安全防禦運作之前執行惡意程式碼。摘要並提到，微軟（Microsoft）已修補該惡意軟體利用的漏洞，隨後文字截斷，因此關於責任、修補限制或撤銷機制的完整論述未見於摘要。本摘要僅呈現繞過手法、其時間與開機早期位置，不補完文章的歸責結論。\\n為什麼重要\\n能在作業系統與其防禦之前運行的開機程式之所以重要，是因為它能顛覆安全開機（Secure Boot）本身，該機制原應保證只有受信任的程式碼能啟動電腦。若已完整修補的系統仍能被繞過，缺口不在使用者未更新，而在開機信任如何跨產業建立與撤銷。這也是標題將問題框架為責任歸屬、而非單一漏補漏洞的原因，不過僅憑摘要無法定論。\\n來源異同\\n此群組只有科技媒體（Ars Technica）一家來源，摘要中沒有可佐證或衝突的第二個說法。黑蓮（BlackLotus）的背景、安全開機（Secure Boot）繞過，以及漏洞已修補的細節，都來自這一份摘錄報導。\\n仍不確定\\n截斷的摘要使感染途徑、影響範圍、微軟（Microsoft）或產業夥伴的回應，以及文章對責任的完整結論都仍不確定，也未說明Windows 11使用者目前的風險。這些都需要完整文章才能確認，不應僅憑標題的提問推斷。\"},\"sources\":[{\"name\":\"Ars Technica\",\"url\":\"https://arstechnica.com/security/2026/11/uefi-bootkit-infected-fully-patched-windows-machines-is-microsoft-to-blame/\"}],\"disagreements\":null,\"trustScore\":56,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":19,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"tech\",\"live-ingest\",\"ars-technica\"],\"glossary\":[{\"term\":{\"en\":\"BlackLotus\",\"zh-TW\":\"黑蓮（BlackLotus）\"},\"blurb\":{\"en\":\"BlackLotus is the malware tracked as the first publicly documented in-the-wild UEFI bootkit of its kind.\",\"zh-TW\":\"黑蓮（BlackLotus）是被追蹤為同類中首個公開記錄在野外開機程式的惡意軟體。\"}},{\"term\":{\"en\":\"UEFI bootkit\",\"zh-TW\":\"統一可擴展韌體介面開機程式（UEFI bootkit）\"},\"blurb\":{\"en\":\"A UEFI bootkit is malware that loads at the firmware boot stage before the operating system.\",\"zh-TW\":\"統一可擴展韌體介面開機程式（UEFI bootkit）是在作業系統之前、於韌體開機階段載入的惡意軟體。\"}},{\"term\":{\"en\":\"Secure Boot\",\"zh-TW\":\"安全開機（Secure Boot）\"},\"blurb\":{\"en\":\"Secure Boot is the chain-of-trust mechanism meant to ensure only trusted code starts a computer.\",\"zh-TW\":\"安全開機（Secure Boot）是旨在確保只有受信任程式碼能啟動電腦的信任鏈機制。\"}},{\"term\":{\"en\":\"Microsoft\",\"zh-TW\":\"微軟（Microsoft）\"},\"blurb\":{\"en\":\"Microsoft is the maker of Windows whose responsibility the headline questions.\",\"zh-TW\":\"微軟（Microsoft）是Windows的製造商，其責任在標題中被提出質疑。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-tech-01-uefi-bootkit-infected-fu/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-tech-01-uefi-bootkit-infected-fu/\"}],[\"$\",
