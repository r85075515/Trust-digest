ce was released into the crowd, and one person was taken to hospital.\nWhat happened\nThe evacuation took place during Toliver's performance on Sunday night, when the substance was let off among concertgoers. A major incident was declared, and the arena was cleared. One concertgoer described really distressing scenes as the crowd left the venue. The reports do not say what the substance was, how it was released, or whether anyone was arrested.\nWhy it matters\nA full-arena evacuation of more than 12,000 people is a major test of venue safety and emergency planning, and the incident raises questions about how an unknown substance reached the crowd at one of the UK's largest live-music venues. Concertgoers and the wider live-music industry will watch for the findings and any changes to security checks.\nSources agree-disagree\nRolling Stone, the BBC and Sky News all report the same core facts: an unknown substance was released during the show, more than 12,000 people were evacuated, and one person was taken to hospital.\nTrust label: Multi-source agreement — three outlets report the same core facts with no clear conflicts.\nStill uncertain\nThe identity of the substance, how it was released, who was responsible, and the condition of the person taken to hospital are not stated in the available reports. The investigation's findings and any charges have yet to be reported."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-entertainment-01-don-toliver-s-manchester\",\"category\":\"entertainment\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-entertainment-01-don-toliver-s-manchester.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Don Toliver’s Manchester Show Evacuated After ‘Unknown Substance’ Released in Crowd\",\"zh-TW\":\"相關封面圖：唐·托利弗 (Don Toliver) 的曼徹斯特演出在人群中釋放“未知物質”後撤離\"},\"publishedAt\":\"2026-11-23T09:09:00.000Z\",\"title\":{\"en\":\"Don Toliver's Manchester Show Evacuated After Unknown Substance Released in Crowd\",\"zh-TW\":\"唐·托利弗（Don Toliver）曼徹斯特演唱會人群釋出不明物質 全場疏散\"},\"summary\":{\"en\":\"More than 12,000 people were evacuated from Manchester's Co-op Live arena during US rapper Don Toliver's Sunday night show after an unknown substance was released into the crowd. One person was taken to hospital and a major incident was declared. The cause of the release remains unclear, and police are investigating what happened.\",\"zh-TW\":\"美國饒舌歌手唐·托利弗（Don Toliver）週日晚間在曼徹斯特 Co-op Live 演出時，人群中釋出不明物質，全場逾 12,000 人疏散，1 人送醫，現場宣告重大事件。物質來源與釋放原因仍待調查，後續看警方與場館如何交代。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"逾 12,000 人從英國最大場館 Co-op Live 疏散，事發於美國饒舌歌手唐·托利弗（Don Toliver）週日晚間在曼徹斯特的演出，當時人群中釋出不明物質，1 人送醫。\\n發生了什麼事\\n疏散發生在托利弗週日晚間演出期間，不明物質在觀眾群中釋出。現場宣告重大事件，場館隨即清空。一名觀眾形容離場過程是「真正令人痛苦的場景」。報導未說明物質為何、如何釋出，也未提及是否有人被捕。\\n為什麼重要\\n逾 12,000 人的全場疏散是對場館安全與應變計畫的重大考驗，也讓人質疑不明物質如何進入英國最大音樂場館之一的人群。觀眾與整個現場音樂產業都會關注調查結果，以及安檢是否因此改變。\\n來源異同\\n滾石雜誌、英國廣播公司（BBC）與天空新聞報導的核心事實一致：演出期間釋出不明物質、逾 12,000 人疏散、1 人送醫。\\n信任標籤：多來源一致，三家媒體報導的核心事實相同，未見明顯衝突。\\n仍不確定\\n現有報導未說明物質身分、釋出方式、責任歸屬，也未交代送醫者的狀況。調查結果與是否有人被起訴，尚待後續報導。\"},\"sources\":[{\"name\":\"Rolling Stone Music\",\"url\":\"https://www.rollingstone.com/music/music-news/don-toliver-manchester-show-evacuation-unknown-substance-1235662518/\"},{\"name\":\"BBC Entertainment\",\"url\":\"https://www.bbc.co.uk/news/articles/c9e851dn8516o?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"Sky News UK\",\"url\":\"https://news.sky.com/story/concert-goers-evacuated-from-manchester-co-op-live-as-major-incident-declared-13615479\"}],\"disagreements\":null,\"trustScore\":86,\"trustBreakdown\":{\"sourceDiversity\":21,\"outletReputation\":18,\"crossCorroboration\":22,\"recencyClarity\":25},\"tags\":[\"entertainment\",\"live-ingest\",\"rolling-stone-music\",\"bbc-entertainment\",\"sky-news-uk\"],\"glossary\":[{\"blurb\":{\"en\":\"US rapper performing the Manchester show.\",\"zh-TW\":\"美國饒舌歌手，本場曼徹斯特演出的表演者。\"},\"term\":{\"en\":\"Don Toliver\",\"zh-TW\":\"唐·托利弗（Don Toliver）\"}},{\"blurb\":
