ally this week. The reports said media coverage had alleged that AI-generated characters in the app sent sexually suggestive messages to minors. The feed item did not say whether Apple publicly explained the removal or whether MiniMax responded.\n\nWhy it matters\nTalkie is one of MiniMax's flagship products, and removal cuts off its main download channel in Apple's ecosystem. AI companion apps draw users in with lifelike characters, and when safeguards around minors fail, a store removal is the platform's bluntest response. Other companion apps now have a clear warning about where Apple's line sits. Parents and regulators will read the removal as a test of whether app stores act before harm is documented.\n\nSources agree / disagree\nOnly one outlet, CNA, has covered the story so far, so there is nothing to cross-check against. No numeric or name conflicts appear in the feed item.\n\nStill uncertain\nThe feed gives no specifics on the alleged messages, how many minors were affected, Apple's stated reason, MiniMax's response, or whether Talkie could return to the store.\n\nTrust label: Single source — one outlet, no independent corroboration yet."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-01-ai-talkie\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-taiwan-01-ai-talkie.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 涉向未成年人傳性暗示訊息　蘋果下架AI聊天機器人Talkie\",\"zh-TW\":\"相關封面圖：涉向未成年人傳性暗示訊息　蘋果下架AI聊天機器人Talkie\"},\"publishedAt\":\"2026-11-27T02:55:21.000Z\",\"title\":{\"en\":\"Apple Pulls Talkie After Reports Its AI Characters Sent Sexually Suggestive Messages to Minors\",\"zh-TW\":\"蘋果（Apple）下架 Talkie：AI 角色涉向未成年人傳性暗示訊息\"},\"summary\":{\"en\":\"[Unconfirmed · Single source] Apple removed MiniMax's popular AI chatbot Talkie from the App Store worldwide this week, after media reports alleged its AI-generated characters sent sexually suggestive messages to minors. The removal signals tightening platform tolerance for child-safety risks in AI companion apps.\",\"zh-TW\":\"［未證實·單一來源］蘋果（Apple）本週將 MiniMax 旗下熱門 AI 聊天機器人 Talkie 自全球蘋果應用程式商店（App Store）下架。先前有媒體報導指稱，Talkie 的 AI 生成角色曾向未成年人傳送性暗示訊息。蘋果下架的決定，顯示平台對未成年人安全風險的容忍度正在收緊。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"蘋果（Apple）本週將 MiniMax 的 AI 聊天機器人 Talkie 自全球蘋果應用程式商店（App Store）下架，起因是媒體報導指稱 Talkie 的 AI 生成角色曾向未成年人傳送性暗示訊息。\\n\\n發生了什麼事\\n中央社（CNA）11 月 26 日綜合外電報導，蘋果本週將 Talkie 自全球 App Store 下架。報導指出，下架前已有媒體指稱 Talkie 的 AI 生成角色向未成年人傳送性暗示訊息。來源未說明蘋果是否公開解釋下架原因，也未說明 MiniMax 是否回應。\\n\\n為什麼重要\\nTalkie 是 MiniMax 的熱門產品，下架等於切斷它在蘋果生態系的主要下載管道。AI 陪伴類應用以擬人角色吸引用戶，未成年人保護一旦出缺口，平台方直接以商店下架回應——這是給同類產品最明確的訊號。\\n\\n來源異同\\n目前僅中央社（CNA）一家報導，無其他來源可比對，無法確認下架時間點與指控細節。無數字或人名衝突。\\n\\n仍不確定\\n媒體指控的具體內容、受影響未成年人人數、蘋果的正式說法、MiniMax 的回應，以及 Talkie 是否可能重新上架，來源都沒有提供。\\n\\n信任標籤：僅 1 源——單一媒體報導，尚無其他來源印證。\"},\"sources\":[{\"name\":\"中央社-科技\",\"url\":\"https://www.cna.com.tw/news/ait/202611270043.aspx\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"中央社-科技\"],\"glossary\":[{\"blurb\":{\"en\":\"The US technology company that operates the App Store.\",\"zh-TW\":\"美國科技公司，營運蘋果應用程式商店（App Store）。\"},\"term\":{\"en\":\"Apple\",\"zh-TW\":\"蘋果\"}},{\"blurb\":{\"en\":\"The Chinese AI company behind Talkie.\",\"zh-TW\":\"中國人工智慧公司，Talkie 的開發商。\"},\"term\":{\"en\":\"MiniMax\",\"zh-TW\":\"MiniMax\"}},{\"blurb\":{\"en\":\"MiniMax's AI chatbot app built around AI-generated characters.\",\"zh-TW\":\"MiniMax 推出的 AI 聊天機器人應用程式，以 AI 生成角色為賣點。\"},\"term\":{\"en\":\"Talkie\",\"zh-TW\":\"Talkie\"}},{\"blurb\":{\"en\":\"Apple's marketplace for iPhone and iPad apps.\",\"zh-TW\":\"蘋果的應用程式商店，供用戶下載應用程式。\"},\"term\":{\"en\":\"App Store\",\"zh-TW\":\"蘋果應用程式商店\"}},{\"blurb\":{\"en\":\"Taiwan's national news agency and the sole source for this story.\",\"zh-TW\":\"台灣的國家通訊社，本篇報導的唯一來源。\"},\"term\":{\"en\":\"CNA\",\"zh-TW\":\"中央社\"
