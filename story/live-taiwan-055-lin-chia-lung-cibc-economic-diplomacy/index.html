on (CIECA) alongside Economic Affairs Minister Kung Ming-hsin on November 26, 2026, calling on government ministries and private enterprises to translate government-to-government (G2G) agreements into concrete business-to-business (B2B) overseas investments. Lin outlined industrial ecosystem expansion across semiconductor clusters in Arizona and Texas, supply-chain hubs anchored in Poland for Central and Eastern Europe and Africa, and deeper Taiwan-UK cooperation in semiconductors, AI, silicon photonics, and space technology.\n\nAs global supply chains reorganize around geopolitical resilience, Taiwan's foreign policy leadership is increasingly using industrial diplomacy to secure bilateral economic partnerships and strengthen satellite communications security with European partners.\n\nTaiwan's Ministry of Foreign Affairs (MOFA) official press release and Yam News both confirm Lin's November 26 appearance with Economic Affairs Minister Kung Ming-hsin and CIECA Chairman Lu Jye-cherng, as well as the G2G-to-B2B diplomatic framework. Lianhe Zaobao's report adds specific regional details on Texas and Arizona semiconductor clusters, Poland's hub role, and Taiwan-UK silicon photonics and satellite security cooperation.\n\nSpecific bilateral investment incentives, funding allocations under the Diplomatic Allies Prosperity Project, and timelines for new European or African trade delegations have not yet been itemized.\n\nTrust label: Multi-source agreement — MOFA press release, Yam News, and Lianhe Zaobao consistently report Lin Chia-lung's November 26 CIECA address."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-055-lin-chia-lung-cibc-economic-diplomacy\",\"category\":\"taiwan\",\"title\":{\"en\":\"Foreign Minister Lin Chia-lung Urges Deeper G2G-to-B2B Ties Across US, Europe, and Africa\",\"zh-TW\":\"林佳龍出席國經協會大會 倡議「總合外交」推動半導體與衛星跨洲布局\"},\"summary\":{\"en\":\"Speaking at the Chinese International Economic Cooperation Association (CIECA) annual assembly on November 26, 2026, Taiwan Foreign Minister Lin Chia-lung urged closer public-private alignment to convert government agreements into B2B investments across US semiconductor clusters, Central-Eastern Europe via Poland, and Taiwan-UK space and silicon photonics partnerships.\",\"zh-TW\":\"外交部長林佳龍於 2026 年 11 月 26 日出席「中華民國國際經濟合作協會」（國經協會）會員大會，呼籲結合「總合外交」與「榮邦計畫」，將政府協議（G2G）轉化為企業投資（B2B），深化美歐半導體聚落、波蘭中東歐據點及台英太空與矽光子合作。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n外交部長林佳龍於 2026 年 11 月 26 日與經濟部長龔明鑫共同出席「中華民國國際經濟合作協會」（國經協會）第 7 屆第 3 次會員大會，致詞呼籲整合政府外交資源與民間企業力量，透過「總合外交」及「榮邦計畫」，將政府對政府（G2G）協議轉化為企業對企業（B2B）實質海外投資商機。\\n「為什麼重要」\\n面對全球供應鏈重組與地緣政治變局，外交部明確將半導體、AI、矽光子與太空科技納入經濟外交核心，並點名美國亞利桑那州與德州產業聚落、波蘭中東歐據點及台英科技合作，展現台灣從「行銷世界」轉向「投資世界」的經貿戰略。\\n「來源異同」\\n外交部第 601 號官方新聞稿與《蕃新聞》均確認林佳龍、龔明鑫與國經協會理事長呂桔誠同台出席，並聚焦「總合外交」與 G2G 深化至 B2B 的合作主軸；《聯合早報》進一步詳述德州、波蘭及台英矽光子與衛星通訊安全等具體合作方向。\\n「仍不確定」\\n「榮邦計畫」與台英、台歐新興科技合作的具體預算規模、融資配套及下一波企業海外拓銷團時程，尚待外交部與經濟部後續公布細節。\"},\"glossary\":[{\"term\":{\"en\":\"Integrated Diplomacy\",\"zh-TW\":\"總合外交\"},\"blurb\":{\"en\":\"Taiwan's foreign policy framework combining values-based diplomacy, economic statecraft, and allied supply-chain cooperation.\",\"zh-TW\":\"台灣結合價值外交、經濟外交與盟友供應鏈合作的跨部會對外政策架構。\"}},{\"term\":{\"en\":\"Silicon Photonics\",\"zh-TW\":\"矽光子\"},\"blurb\":{\"en\":\"Technology that integrates optical lasers and waveguides onto silicon microchips to transmit data faster with lower power consumption.\",\"zh-TW\":\"將光學元件整合至矽晶片上的技術，利用光訊號高速傳輸資料並大幅降低 AI 運算能耗。\"}},{\"term\":{\"en\":\"CIECA\",\"zh-TW\":\"國經協會\"},\"blurb\":{\"en\":\"The Chinese International Economic Cooperation Association, a key Taiwanese business organization facilitating bilateral trade councils worldwide.\",\"zh-TW\":\"社團法人中華民國國際經濟合作協會，負責推動台灣與各國雙邊經濟合作會議的民間經貿組織。\"}}],\"sources\":[{\"name\":\"中華民國外交部\",\"url\":\"https://www.mofa.gov.tw/News_Content.aspx?n=95\u0026sms=73\u0026s=123529\"},{\"name\":\"聯合早報\",\"url\":\"https://www.zaochenbao.com/news/taiwan/202611/2786297.html\"},{\"name
