's lawsuit against the Trump administration plays out, extending his September 24 order.\nWhat happened\nThe Guardian reports Kelly ruled Tuesday after the Trump administration blocked the three outlets' access last month. The order preserves the status quo — continued access — for the duration of the litigation.\nWhy it matters\nThe takeaway is procedural but pointed: courts are treating press access as a right that can't be revoked mid-lawsuit by executive fiat. The ruling doesn't decide the underlying case, but it denies the administration the leverage of exclusion while it proceeds — and signals how judges view the merits. For the three outlets, continued access preserves sourcing and beats that would otherwise go dark for months.\nSources agree / disagree\nThe Guardian's account of the ruling is the core of this cluster (single-outlet on the legal details). Trust label: Single source on the order's specifics. The Verge's Trump AI-photo item and The Hill's RFK Jr. peptide story are unrelated stories swept into the cluster.\nStill uncertain\nThe underlying lawsuit's outcome and any appeal of this order remain pending."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-02-judge-extends-white-hous\",\"category\":\"finance\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-finance-02-judge-extends-white-hous.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Judge extends White House access to banned media outlets CNN, MS Now and Politico\",\"zh-TW\":\"相關封面圖：法官允許白宮訪問被禁媒體 CNN、MS Now 和 Politico\"},\"publishedAt\":\"2026-10-15T23:50:02.000Z\",\"title\":{\"en\":\"Judge Extends White House Access for CNN, MS Now and Politico\",\"zh-TW\":\"聯邦法官凱利（Timothy Kelly）延長 CNN 等三家媒體白宮採訪權\"},\"summary\":{\"en\":\"District Judge Timothy Kelly ordered the White House to keep admitting CNN, MS Now and Politico journalists while the media coalition's lawsuit against the Trump administration proceeds, extending his September 24 order.\",\"zh-TW\":\"聯邦地區法官凱利（Timothy Kelly）裁定，白宮在媒體聯盟對川普政府的訴訟進行期間，必須繼續放行 CNN、MS Now 與 Politico 記者，延長他 9 月 24 日的命令。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"聯邦法官讓白宮大門繼續開著：地區法官凱利（Timothy Kelly）裁定，在媒體聯盟對川普政府的訴訟進行期間，白宮必須繼續放行 CNN、MS Now 與 Politico 三家記者，延長他 9 月 24 日的命令。\\n發生了什麼事\\n《衛報》報導，凱利週二做出裁決；此前川普政府上個月封殺了這三家媒體的採訪權。這道命令維持現狀——訴訟期間採訪權不變。\\n為什麼重要\\n重點在程序，但意思很明白：法院把採訪權當成行政命令不能在訴訟中途收回的權利。這項裁決不等於本案勝負，但在訴訟進行期間，剝奪了政府用「排除」當籌碼的空間。\\n來源異同\\n這個集群的核心是《衛報》對裁決的報導（法律細節為單一來源）。信任標籤：僅1源。The Verge 的川普 AI 照片、The Hill 的 RFK 胜肽報導是不相關事件，被掃進同一集群。\\n仍不確定\\n本案最終結果與這道命令是否會被上訴，都還待定。\"},\"sources\":[{\"name\":\"The Guardian Business\",\"url\":\"https://www.theguardian.com/us-news/2026/oct/14/white-house-media-ban-lifted-cnn-msnow-politico\"},{\"name\":\"The Verge\",\"url\":\"https://www.theverge.com/policy/1012445/donald-trump-ai-photo-white-house-rennovation-column\"},{\"name\":\"The Hill\",\"url\":\"https://thehill.com/newsletters/healthcare/6152770-rfk-jr-fda-peptides-white-house/\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":21,\"outletReputation\":19,\"crossCorroboration\":22,\"recencyClarity\":25},\"tags\":[\"finance\",\"live-ingest\",\"the-guardian-business\",\"the-verge\",\"the-hill\"],\"glossary\":[{\"term\":{\"en\":\"Timothy Kelly\",\"zh-TW\":\"凱利\"},\"blurb\":{\"en\":\"US district judge who extended the media access order.\",\"zh-TW\":\"延長媒體採訪權命令的美國聯邦地區法官。\"}},{\"term\":{\"en\":\"CNN\",\"zh-TW\":\"CNN\"},\"blurb\":{\"en\":\"US news network whose White House access was preserved.\",\"zh-TW\":\"白宮採訪權獲得保留的美國新聞網。\"}},{\"term\":{\"en\":\"Politico\",\"zh-TW\":\"Politico\"},\"blurb\":{\"en\":\"US political news outlet covered by the access order.\",\"zh-TW\":\"採訪權命令涵蓋的美國政治新聞媒體。\"}},{\"term\":{\"en\":\"The Guardian\",\"zh-TW\":\"衛報\"},\"blurb\":{\"en\":\"British newspaper reporting the court ruling.\",\"zh-TW\":\"報導法院裁決的英國報紙。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\
