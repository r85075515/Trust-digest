 combined NT$114.06 billion: foreign investors NT$70.19 billion, investment trusts NT$17.96 billion — ending a 24-session buying streak — and dealers NT$25.90 billion. Drivers included the unresolved Huang resignation storm, Treasury Secretary Bessent's harder line on Nvidia (an outside CEO and export-compliance answers), reported Vera Rubin production delays, and Friday's 3.43% drop in the Philadelphia Semiconductor Index.\n\nWhy it matters: This is the Nvidia saga's most direct asset-price hit on Taiwan yet — the market gave back about two-thirds of last week's near-4,000-point, stabilization-fund-backed rebound in a single day. Central bank governor Yang Chin-long called it a \"short-term turbulence\" from three overlapping pressures — AI financing doubts, US midterm uncertainty and Huang's resignation — saying foreign outflows were profit-taking and reallocation rather than panic, that the National Stabilization Fund's presence had limited the swing, and that the key to calm is whether Nvidia's next CEO can rebuild confidence. The FSC noted Taiwan's fall was Asia's heaviest that day but pointed to a 177.48% margin maintenance ratio and unchanged fundamentals, and said the five short-sale curbs in force since Nov 9 have no preset exit date.\n\nSources agree / disagree: CNA, the Commercial Times, TechNews and PTS report identical closing figures, TSMC losses and institutional flows. Tone differs: the FSC and the central bank stress fundamentals and a short-lived squall, while Mega Securities' Liu Cheng-yu calls the pullback a reasonable correction after a 17.7% rebound, with the 40,000 level, foreign flows and Huang's congressional testimony as the things to watch.\n\nStill uncertain: Whether foreign selling continues, how hard the stabilization fund will keep buying, what Nvidia's Nov 17 earnings and the CEO succession do to supply-chain confidence, and when the short-sale curbs come off.\n\nTrust label: Multi-source agreement — four outlets report identical market data, and the FSC and central bank statements are on the record."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"adult\":false,\"body\":{\"en\":\"$10\",\"zh-TW\":\"發生了什麼事：台股 11 月 16 日開低走低、收在全日最低，加權指數重挫 2,635.04 點、跌幅 6.03%、收 41,040.08 點，成交量 8,450.56 億元，創史上第二大收盤跌點。權值股全倒：台積電（TSMC）跌 135 元收 2,215 元（-5.74%）、聯發科（MediaTek）跌 325 元、台達電（Delta Electronics）跌停、鴻海（Foxconn）跌 9.34%，上市櫃跌停逾百檔，櫃買指數跌 6.80%。三大法人合計賣超 1,140.55 億元：外資 701.89 億、投信 179.6 億（終止連 24 日買超）、自營商 259.03 億。賣壓來源包括黃仁勳（Jensen Huang）辭職風暴未平、財政部長貝森特（Scott Bessent）對輝達轉趨強硬（要求外找執行長並交代出口合規）、Vera Rubin 量產遞延傳聞，以及上週五費城半導體指數重挫 3.43%。\\n\\n為什麼重要：這是黃仁勳事件對台灣最直接的一次資產價格衝擊——上週國安基金進場護盤才大漲近 4,000 點，今天一天回吐約三分之二。央行總裁楊金龍（Yang Chin-long）定調這是 AI 融資疑慮、美國期中選舉不確定性與黃仁勳請辭三重壓力交疊的「短期亂流」，指外資屬獲利了結與再配置、非恐慌出逃，若非國安基金進場波動會更大，並明言平息關鍵在輝達新任執行長能否重建市場信心。金管會晚間指出台股跌幅為當日亞股最重，但整戶擔保維持率 177.48%、基本面未變，11 月 9 日上路的限空令五大措施沒有預設退場時間。\\n\\n來源異同：中央社、工商時報、科技新報、公視對收盤跌點、台積電跌幅與三大法人賣超金額的報導一致；定性略有差異——金管會與央行強調基本面與短期亂流，兆豐投顧董事長留政鈺則指漲多回檔屬合理修正，後續看 4 萬點支撐、外資動向與黃仁勳的國會作證說詞。\\n\\n仍不確定：外資賣壓是否延續、國安基金護盤的節奏與額度、輝達 11 月 17 日財報與新執行長人選對供應鏈信心的影響，以及限空令何時退場，都還待觀察。\"},\"category\":\"taiwan\",\"disagreements\":null,\"glossary\":[{\"blurb\":{\"en\":\"Taiwan's benchmark stock index, weighted by market capitalization of all listed shares.\",\"zh-TW\":\"台灣加權股價指數，台股大盤的基準指標。\"},\"term\":{\"en\":\"TAIEX\",\"zh-TW\":\"加權指數（TAIEX）\"}},{\"blurb\":{\"en\":\"Taiwan's government fund authorized to intervene in the stock market during major non-economic shocks.\",\"zh-TW\":\"政府在重大非經濟因素衝擊股市時授權進場護盤的基金，本波已於上週進場。\"},\"term\":{\"en\":\"National Stabilization Fund\",\"zh-TW\":\"國安基金\"}},{\"blurb\":{\"en\":\"The FSC's package of five measures, in force since Nov 9, tightening short selling — including intraday securities-lending sale limits and higher margin ratios.\",\"zh-TW\":\"金管會 11 月 9 日上路的五大抑制空頭措施，包括調整盤中借券賣出委託量與融券保證金成數。\"},\"term\":{\"en\":\"Short-sale curbs\",\"zh-TW\":\"限空令\"}},{\"blurb\":{\"en\":\"Domestic institutional investors (securities investment trust companies); their 24-day buying streak ended on Nov 16.\",\"zh-TW\":\"證券投資信託公司，三大法人之一；本日由買轉賣、終止連 24 日買超。\"},\"term\":{\"en\":\"Investment trusts\",\"zh-TW\":\"投信\"}},{\"blurb\":{\"en\":\"The ratio of collateral value to margin debt across all margin accounts; the FSC cited 177.48% as of Nov 13 to argue leverage remains contained.\",\"zh-TW\":\"信用交易整戶的擔保品價值對融資債務比率，金管會以 11 月 13 日的 177.48% 說明槓桿風險尚可控。\"},\"term\":{\"en\":\"Margin maintenance ratio\",\"zh-TW\":\"整戶擔保維持率\"}}],\"id\":\"live-taiwan-01-taiex-plunges-2635-huang-storm\",\"imageAlt\":{\"en\":\"Taiwan stock exchange trading floor on a heavy sell-off day\",\"zh-TW\":\"台股重挫日的證交所盤面\"},\"imageUrl\":\"\",\"isHeadline\":true,\"isPopular\":true,\"publishedAt\":\"2026-11-16T21:58:25.000Z\",\"sources\":[{\"name\":\"Commercial Times\",\"url\":\"https://www.ctee.com.tw/news/20261116701814-430301\"},{\"name\":\"TechNews\",\"url\":\"https://finance.technews.tw/2026/11/16/taiwan-stock-market-plunges-2635-04-points-second-largest-drop-ever-tsmc-shares-fall-nt135/\"},{\"name\":\"PTS\",\"url\":\"https://news.pts.org.tw/article/835949\"}],\"summary\":{\"en\":\"Taiwan's TAIEX plunged 2,635.04 points (-6.03%) to close at 41,040.08 on Nov 16 — its second-worst closing drop ever — as the Jensen Huang resignation storm battered AI supply-chain stocks. TSMC fell NT$135, foreign investors sold NT$70.19 billion and investment trusts ended a 24-day buying streak. The FSC vowed to keep short-sale curbs in place, while central bank governor Yang Chin-long called the turmoil short-lived and said calm hinges on Nvidia's next CEO.\",\"zh-TW\":\"黃仁勳辭職風暴延燒，台股 11 月 16 日重挫 2,635.04 點（-6.03%）收 41,040.08 點，創史上第二大收盤跌點；台積電跌 135 元、外資賣超 701.89 億元、投信終止連 24 日買超。金管會指基本面未變、限空令不退場；央行總裁楊金龍定調「短期亂流」，稱平息關鍵在輝達新任執行長。\"},\"tags\":[],\"title\":{\"en\":\"Huang Storm Hammers Taiwan Stocks: TAIEX Plunges 2,635 Points in Second-Worst Close Ever, TSMC Falls NT$135\",\"zh-TW\":\"黃仁勳風暴重擊台股：重挫 2,635 點創史上第二大收盤跌點，台積電跌 135 元、投信終止連 24 日買超\"},\"trustBreakdown\":{\"crossCorroboration\":25,\"outletReputat
