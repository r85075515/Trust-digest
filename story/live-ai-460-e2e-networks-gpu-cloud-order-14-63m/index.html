 services from an unnamed international AI foundation model developer. The contract is valued at USD 14.63 million, approximately INR 136 crore, over a 36-month execution period, and the filing states it is not a related-party transaction.\n\nWhy it matters: A 36-month commitment for GPU cloud services provides multi-year contract visibility for E2E Networks from an international AI foundation model developer. Confirming the deal is not a related-party transaction clarifies governance terms in the exchange disclosure.\n\nSource differences: Both listed sources trace back to the same exchange filing by E2E Networks. Stockmarket360 uses the page title \"E2E Networks signs USD 14.63 million GPU cloud order: Rs 136 crore is a 36-month commitment\", while MarketOwl covers the item under the section heading \"E2E Networks secures $14.63 million international GPU cloud order\" on a page whose main title is a separate data-centre tax story.\n\nStill uncertain: The identity of the unnamed international AI foundation model developer and specific technical delivery milestones across the 36-month period are not disclosed in the provided facts.\n\nTrust label: Single source — both listed sources trace back to the same exchange filing by E2E Networks."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-ai-460-e2e-networks-gpu-cloud-order-14-63m\",\"category\":\"ai\",\"title\":{\"en\":\"E2E Networks Discloses USD 14.63 Million GPU Cloud Order Over 36 Months\",\"zh-TW\":\"E2E Networks 申報 1463 萬美元 GPU 雲端訂單、執行期 36 個月\"},\"summary\":{\"en\":\"Indian cloud provider E2E Networks disclosed on November 28, 2026 a 36-month GPU cloud and related services order worth USD 14.63 million, or about INR 136 crore, from an unnamed international AI foundation model developer. The key takeaway is a multi-year GPU cloud commitment confirmed as a non-related-party deal.\",\"zh-TW\":\"印度雲端運算商 E2E Networks 於 2026 年 11 月 28 日申報接獲 GPU 雲端與相關服務訂單，總值 1463 萬美元（約 13.6 億盧比（136 crore））、執行期 36 個月，客戶為未具名的國際 AI 基礎模型開發商。關鍵結論是該公司取得為期三年的 GPU 雲端承諾，且申報載明非關係人交易。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」印度雲端運算商 E2E Networks 於 2026 年 11 月 28 日向交易所申報，接獲 GPU 雲端運算及相關服務訂單，客戶為未具名的國際 AI 基礎模型開發商。訂單總值 1463 萬美元（約 13.6 億盧比（136 crore）），執行期 36 個月，公司申報載明此交易非關係人交易。\\n\\n「為什麼重要」長達 36 個月的 GPU 雲端服務訂單，為 E2E Networks 帶來跨年度的合約能見度，且客戶屬性為國際 AI 基礎模型開發商。申報明列非關係人交易，亦有助釐清交易治理關係。\\n\\n「來源異同」兩條來源皆同源於 E2E Networks 同一份交易所申報。Stockmarket360 網頁實際標題為「E2E Networks signs USD 14.63 million GPU cloud order: Rs 136 crore is a 36-month commitment」；MarketOwl 網頁中本事件的段落標題為「E2E Networks secures $14.63 million international GPU cloud order」（該頁主標題為另一則資料中心稅新聞）。\\n\\n「仍不確定」未具名的國際 AI 基礎模型開發商身分，以及 36 個月執行期內各階段交付細節，在現有指定事實中均未公開。\\n\\nTrust label: Single source — 兩條來源皆同源於 E2E Networks 同一份交易所申報。\"},\"glossary\":[{\"term\":{\"en\":\"GPU Cloud Computing\",\"zh-TW\":\"GPU 雲端運算\"},\"blurb\":{\"en\":\"On-demand access to graphics processing units over the cloud for compute-heavy workloads.\",\"zh-TW\":\"透過雲端按需使用圖形處理器以支援高算力工作負載的模式。\"}},{\"term\":{\"en\":\"Foundation Model\",\"zh-TW\":\"基礎模型\"},\"blurb\":{\"en\":\"A large-scale AI model trained broadly so it can adapt to many downstream tasks.\",\"zh-TW\":\"經大規模訓練、可調適支援多種下游任務的通用型人工智慧模型。\"}},{\"term\":{\"en\":\"Non-Related-Party Transaction\",\"zh-TW\":\"非關係人交易\"},\"blurb\":{\"en\":\"A deal between parties without a designated related-party relationship under governance rules.\",\"zh-TW\":\"交易雙方在治理規範下不具特定關係人身分往來的交易。\"}}],\"sources\":[{\"name\":\"Stockmarket360\",\"url\":\"https://stockmarket360.in/e2e-networks-signs-usd-14-63-million-gpu-cloud-order-rs-136-crore-is-a-36-month-commitment/\"},{\"name\":\"MarketOwl\",\"url\":\"https://marketowl.in/news/trump-s-data-centre-tax-threat-could-complicate-india-s-ai-ambitions\"}],\"imageUrl\":\"/covers/live/live-ai-460-e2e-networks-gpu-cloud-order-14-63m.webp\",\"imageAlt\":{\"en\":\"E2E Networks Discloses USD 14.63 Million GPU Cloud Order Over 36 Months\",\"zh-TW\":\"E2E Networks 申報 1463 萬美元 GPU 雲端訂單、執行期 36
