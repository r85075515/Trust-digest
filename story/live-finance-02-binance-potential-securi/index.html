er. Binance's founder said the exchange appears to have been hacked, according to the feed summary, which did not name the founder.\nWhat happened\nCNBC reported $2.54 billion frozen after Binance flagged the potential issue. Binance said it was investigating and funds are safe. The summary did not state what was hacked, how much was affected beyond the frozen figure, when the issue began, or what each company froze. No statement from Circle or Tether was included.\nWhy it matters\nA $2.54 billion freeze tests whether customer funds can be protected when a major exchange reports a security problem. Binance's assurance sits alongside the founder's statement that the exchange appears hacked. Until the investigation explains what happened, users cannot judge whether the freeze contained the problem.\nSources agree / disagree\nCNBC reported $2.54 billion frozen. Al Jazeera's headline put the figure at $3 billion, while its article address referred to $2.54 billion; both figures are listed here. Mongabay's bundled Zambia insect item is unrelated. Trust label: Bundled stories — two outlets cover the freeze and an unrelated story was bundled with them.\nStill uncertain\nThe nature of the issue, the exact amount frozen, any customer losses, and the founder's full statement were not stated."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-02-binance-potential-securi\",\"category\":\"finance\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-finance-02-binance-potential-securi.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Binance 'potential security issue' sees $2.54 billion frozen by the likes of Circle, Tether\",\"zh-TW\":\"相關封面圖：幣安「潛在安全問題」導致 25.4 億美元被 Circle、Tether 等公司凍結\"},\"publishedAt\":\"2026-10-30T00:29:24.000Z\",\"title\":{\"en\":\"Binance Reports Potential Security Issue as $2.54 Billion Is Frozen\",\"zh-TW\":\"幣安通報潛在安全問題，25.4 億美元遭凍結\"},\"summary\":{\"en\":\"Binance said it was actively investigating a potential security issue and that funds are completely safe, after CNBC reported $2.54 billion frozen by companies including Circle and Tether. Al Jazeera's headline put the figure at $3 billion. Watch for the investigation to explain what was hacked and whether customer funds were affected.\",\"zh-TW\":\"幣安（Binance）表示正積極調查潛在安全問題並稱資金完全安全，此前 CNBC 報導 Circle、Tether 等公司凍結了 25.4 億美元，Al Jazeera 的標題則寫成 30 億美元。後續要看調查如何說明遭到入侵的範圍與客戶資金是否受影響。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"幣安（Binance）是全球最大的加密貨幣交易所，該公司表示正積極調查一起潛在安全問題，並稱資金完全安全。CNBC 報導，包括 Circle 與 Tether 在內的公司凍結了 25.4 億美元。摘要另稱，幣安創辦人表示該交易所似乎遭到駭客攻擊，但沒有提供創辦人的姓名。\\n發生了什麼事\\nCNBC 報導，在幣安通報潛在安全問題後，Circle、Tether 等公司凍結了 25.4 億美元。幣安表示正積極調查此事，資金完全安全。摘要另有一則標題稱，幣安創辦人表示全球最大的加密貨幣交易所似乎遭到駭客攻擊。摘要遭到截斷，沒有說明遭到入侵的是什麼、除了凍結金額之外受影響的金額有多少、問題何時開始，也沒有說明 Circle 與 Tether 各自凍結了多少。提供的資料中沒有 Circle 或 Tether 的聲明。\\n為什麼重要\\n25.4 億美元遭凍結，直接考驗一家大型交易所通報安全問題時，客戶資金與穩定幣發行商是否受到保護。這件事的判斷很重要，因為幣安保證資金安全的主張，與創辦人稱交易所似乎遭駭的說法並存。在調查說明事情經過之前，使用者無法判斷凍結是控制住了問題，還是只限制了問題擴散。\\n來源異同\\nCNBC 報導凍結金額為 25.4 億美元。Al Jazeera 的標題把凍結金額寫成 30 億美元，其文章網址則指向 25.4 億美元，兩種數字在此並列，因為各媒體的標題數字並不一致。Mongabay 關於尚比亞食用昆蟲傳統的拼湊項目與幣安無關。信任標籤：多則拼湊——兩家媒體報導幣安凍結事件，另有一則不相關的報導被拼湊在一起。\\n仍不確定\\n潛在安全問題的性質沒有說明。凍結的確切金額、Circle 與 Tether 各自的金額，以及客戶資金是否受損，都沒有說明。創辦人發言的場合與完整措辭，在遭到截斷的摘要中也沒有說明。\"},\"sources\":[{\"name\":\"CNBC\",\"url\":\"https://www.cnbc.com/2026/10/29/circle-tether-freeze-funds-impacted-by-potential-binance-security-issue.html\"},{\"name\":\"Al Jazeera\",\"url\":\"https://www.aljazeera.com/economy/2026/10/30/binance-says-2-54bn-in-crypto-funds-frozen-amid-potential-security-issue?traffic_source=rss\"},{\"name\":\"Mongabay\",\"url\":\"https://news.mongabay.com/short-article/2026/10/zambias-edible-insect-tradition-offers-a-potential-boost-to-food-security/\"}],\"disagreements\":{\"en\":\"Figures differ across outlets (e.g. 2.54 vs 039 in headlines/snippets).\",\"zh-TW\":\"不同媒體的數字有所不同（例如，標題/摘要中的數字為 2.54 與 039）。\"},\"trustScore\":68,\"trustBreakdown\":{\"sourceDiversity\":19,\"outletReputation\":10,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"finance\",\"live-ingest\",\"cnbc\",\"al-jazeera\",\"mongabay\"],\"glossary\":[{\"blurb\":{\"en\":\"World's largest crypto exchange, which reported a potential security issue.\",\"zh-TW\":\"全球最大的加密貨幣交易所，通報了潛在安全問題。\"},\"term\":{\"en\":\"Binance\",\"zh-TW\":\"幣安（Binance）\"}},{\"blurb\":{\"en\":\"Company named as one of those that froze funds.\",\"zh-TW\":\"被點名凍結資金的公司之一。\"},\"term\":{\"en\":\"Circle\",\"zh-TW\":\"Circle\"}},{\"blurb\":{\"en\":\"Company named as one of those that froze funds.\",\"zh-TW\":\"被點名凍結資金的公司之一。\"},\"term\":{\"en\":\"Tether\",\"zh-TW\":\"Tether\"}},{\"blurb\":{\"en\":\"News outlet that reported $2.54 billion frozen.\",\"zh-TW\":\"報導 25.4 億美元遭凍結的新聞媒體。\"},\"term\":{\"en\":\"CNBC\",\"zh-TW\":\"CNBC\"}},{\"blurb\":{\"en\":\"News outlet whose headline put the frozen figure at $3 billion.\",\"zh-TW\":\"標題把凍結金額寫成 30 億美元的新聞媒體。\"},\"term\":{\"en\":\"Al Jazeera\",\"zh-TW\":\"Al Jazeera\"}},{\"blurb\":{\"en\":\"News outlet whose bundled item about Zambia was unrelated to Binance.\",\"zh-TW\":\"拼湊的尚比亞報導與幣安無關的新聞媒體。\"},\"term\":{\"en\":\"Mongabay\",\"zh-TW\":\"Mongabay\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\"
