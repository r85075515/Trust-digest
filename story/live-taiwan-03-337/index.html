med the service has stopped online bookings.\n\nWhy it matters\nA breach affecting up to 3.37 million records is large for a single railway booking system, and the Skyliner is a main route for travelers between Tokyo and Narita Airport. Passengers who booked seats may need to check whether their personal information was involved and watch for official guidance from the railway.\n\nSources agree / disagree\nCNA and the Liberty Times agree on the core facts: the November 11 access, the November 13 announcement, the figure of up to 3.37 million records and the suspension of reservations. One rendering difference appears in the Chinese text: CNA renders the operator as Keisei (京成電鐵) while the Liberty Times renders it as Jingcheng (京城電鐵); both refer to the same Keisei Electric Railway and Skyliner service.\n\nStill uncertain\nNeither feed description says what kinds of personal data were involved, whether the records were actually copied, or how long the system will stay closed. The company's statement, as summarized, does not give a cause or a timeline for restoring bookings.\n\nTrust label: Two-source agreement — two outlets agree on the core facts, though both rely on short feed summaries."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-03-337\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-taiwan-03-337.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 日本京城電鐵成田機場列車 訂票系統驚傳337萬筆個資外洩\",\"zh-TW\":\"相關封面圖：（譯文待補）日本京城電鐵成田機場列車 訂票系統驚傳337萬筆個資外洩\"},\"publishedAt\":\"2026-11-14T07:38:08.000Z\",\"title\":{\"en\":\"Keisei Skyliner Booking System Breach May Expose 3.37 Million Records\",\"zh-TW\":\"京成電鐵 Skyliner 訂票系統遭不當存取，最多 337 萬筆個資恐外洩\"},\"summary\":{\"en\":\"Keisei Electric Railway said on November 13 that the seat reservation system for its Skyliner express between central Tokyo and Narita Airport was improperly accessed on November 11, potentially exposing up to 3.37 million personal records. The company has suspended online reservations while it investigates.\",\"zh-TW\":\"京成電鐵 11 月 13 日宣布，往返東京市區與成田機場的特級列車京成 Skyliner 座位預約系統 11 月 11 日遭不當存取，最多恐有 337 萬筆個資外洩。公司已暫停開放預約並展開調查。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"京成電鐵暫停 Skyliner 特急列車的座位預約服務，原因是訂票系統遭不當存取，最多可能有 337 萬筆個資外洩。公司 11 月 13 日宣布此事，稱系統於 11 月 11 日遭不當存取，目前已停止網路訂票，等待後續處理。\\n\\n發生了什麼事\\n京成電鐵 11 月 13 日宣布，往返東京市區與成田機場的特級列車京成 Skyliner 座位預約系統，於 11 月 11 日遭到不當存取，最多恐有 337 萬筆個資外洩，鐵路公司已暫停開放預約。另一則報導也確認，目前已停止網路訂票服務。\\n\\n為什麼重要\\n單一鐵路訂票系統外洩規模達 337 萬筆，影響不小；Skyliner 又是往返東京與成田機場的主要路線。曾預約座位的旅客須留意個人資料是否受影響，並關注鐵路公司的官方說明。\\n\\n來源異同\\n中央社與自由時報在核心事實上一致：11 月 11 日遭存取、11 月 13 日宣布、最多 337 萬筆、暫停預約。中文寫法有一處差異：中央社寫「京成電鐵」，自由時報寫「京城電鐵」，兩者指的都是同一家京成電鐵與 Skyliner 服務。\\n\\n仍不確定\\n兩則來源摘要皆未說明涉及哪些種類的個資、資料是否真的被複製，也未說明系統將關閉多久。公司聲明摘要未交代原因，也未給出恢復訂票的時間表。\"},\"sources\":[{\"name\":\"中央社-國際\",\"url\":\"https://www.cna.com.tw/news/aopl/202611140112.aspx\"},{\"name\":\"自由時報\",\"url\":\"https://news.ltn.com.tw/news/world/breakingnews/5640656\"}],\"disagreements\":{\"en\":\"CNA renders the operator as Keisei (京成電鐵） while the Liberty Times renders it as Jingcheng (京城電鐵）; both reports agree the figure is up to 3.37 million records and that reservations are suspended.\",\"zh-TW\":\"中央社寫「京成電鐵」，自由時報寫「京城電鐵」，兩者指同一家公司；雙方在最多 337 萬筆個資、暫停預約等核心事實上一致。\"},\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":21,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"中央社-國際\",\"自由時報\"],\"glossary\":[{\"blurb\":{\"en\":\"A Japanese railway company serving the Tokyo–Narita Airport route.\",\"zh-TW\":\"經營東京至成田機場路線的日本鐵路公司。\"},\"term\":{\"en\":\"Keisei Electric Railway\",\"zh-TW\":\"京成電鐵\"}},{\"blurb\":{\"en\":\"Keisei's limited express train between central Tokyo and Narita Airport.\",\"zh-TW\":\"京成電鐵往返東京市區與成田機場的特級列車。\"},\"term\":{\"en\":\"Skyliner\",\"zh-TW\":\"京成 Skyliner\"}},{\"blurb\":{\"en\":\"An international airport serving Tokyo.\",\"zh-TW\":\"服務東京的國際機場。\"},\"term\":{\"en\":\"Narita Airport\",\"zh-TW\":\"成田機場\"}},{\"blurb\":{\"en\":\"A Taiwanese newspaper.\",\"zh-TW\":\"台灣的報紙。\"},\"term\":{\"en\":\"Liberty Times\",\"zh-TW\":\"自由時報\"}},{\"blurb\":{\"en\":\"Taiwan's Central News Agency.\",\"zh-TW\":\"台灣的中央通訊社。\"},\"term\":{\"en\":\"CNA\",\"zh-TW\":\"中央社\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-taiwan-03-337/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-taiwan-03-337/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"d:\"$8:metadata\"\n"])</script></body></html>
