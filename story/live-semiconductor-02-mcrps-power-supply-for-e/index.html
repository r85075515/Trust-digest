s are building their own gas-fired power plants because connecting to the grid can take up to a decade.\n\nWhat happened\nMCRPS units combine a compact mechanical envelope, redundancy support and a common output, making them a practical standard for enterprise server racks, according to EE Times. Separately, MIT Technology Review reports that one of the biggest roadblocks to starting a data centre is winning approval to connect to the electric grid, a wait that can last as long as a decade. Some developers are instead building their own off-grid, or behind-the-meter, gas power plants to fuel the AI boom. xAI's Memphis campus has famously used dozens of natural gas turbines.\n\nWhy it matters\nPower is now the binding constraint on the AI build-out, not just chips or servers. Standardised MCRPS units let operators pack more compute into each rack reliably, while developers who cannot wait for the grid are choosing to generate their own electricity, a shift that puts data-centre growth, energy supply and local air quality on the same ledger.\n\nSources agree / disagree\nThis cluster bundles two distinct stories rather than two reports of one event: EE Times covers the MCRPS hardware standard, and MIT Technology Review covers data centres building their own gas plants. The two accounts do not contradict each other; they describe different parts of the same power crunch. No numeric conflicts appear in the feed summaries.\n\nStill uncertain\nThe feed summaries give no MCRPS specifications, efficiency figures or adoption numbers, and no capacity, cost or emissions figures for the gas plants. They also do not say how many developers are going off-grid or how regulators are responding. Those details sit in the two full articles.\n\nTrust label: Bundled stories — two outlets cover two different stories in the same power theme; neither corroborates the other."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-02-mcrps-power-supply-for-e\",\"category\":\"semiconductor\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"https://www.eetimes.com/wp-content/uploads/fig2_85a8b6.png\",\"imageAlt\":{\"en\":\"Cover related to: MCRPS Power Supply for Enterprise Data Centers\",\"zh-TW\":\"相關封面圖：適用於企業資料中心的 MCRPS 電源\"},\"publishedAt\":\"2026-11-25T20:36:47.000Z\",\"title\":{\"en\":\"MCRPS Power Supplies Become Enterprise Standard as Data Centres Build Their Own Gas Plants\",\"zh-TW\":\"MCRPS 電源成企業機架標準，資料中心自建天然氣電廠因應併網久候\"},\"summary\":{\"en\":\"A modular common redundant power supply, or MCRPS, has become a practical standard for enterprise server racks, combining a compact frame, redundancy and a common output. Separately, data-centre developers facing grid-connection waits of up to a decade are building their own off-grid gas plants to power the AI boom, including dozens of turbines at xAI's Memphis campus.\",\"zh-TW\":\"模組化通用冗餘電源（MCRPS）結合緊湊機身、冗餘支援與通用輸出，已成為企業伺服器機架的實用標準。面臨併網等待長達十年的資料中心開發商正自建離網天然氣電廠，為人工智慧熱潮供電，xAI 孟菲斯（Memphis）園區就用了數十台渦輪機。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"資料中心為人工智慧供電卡在併網等待上，開發商改自建離網天然氣電廠；與此同時，模組化通用冗餘電源（MCRPS）已成企業伺服器機架的實用標準。\\n\\n發生了什麼事\\n模組化通用冗餘電源（MCRPS）結合緊湊機身、冗餘支援與通用輸出，已成為企業伺服器機架的實用標準，據 EE Times 報導。另一則報導指出，資料中心啟用最大的障礙之一是取得併網許可，等待期可能長達十年。部分開發商不願久候，改為自建離網或用戶側天然氣發電廠，為人工智慧熱潮供電。xAI 位於孟菲斯（Memphis）的園區就以使用數十台天然氣渦輪機聞名。\\n\\n為什麼重要\\n電力如今已成為人工智慧擴張的關鍵瓶頸，不只是晶片或伺服器。標準化的 MCRPS 讓業者在每個機架塞入更多算力並維持穩定，等不及併網的開發商則選擇自行發電，資料中心成長、能源供應與當地空氣品質就此被綁在同一本帳上。\\n\\n來源異同\\n這組報導拼裝了兩個不同題材，而非同一事件的兩篇報導：EE Times 談 MCRPS 硬體標準，《麻省理工科技評論》（MIT Technology Review）談資料中心自建燃氣電廠。兩者描述的是同一場電力吃緊的不同面向，彼此沒有衝突，摘要中也沒有數字矛盾。\\n\\n仍不確定\\n摘要未提供 MCRPS 的規格、效率數據或採用規模，也未給出燃氣電廠的容量、成本或排放數據；選擇離網的開發商有多少、監管機關如何回應，同樣未交代。細節須查閱兩篇完整報導。\\n\\n信任標籤：混裝報導——兩家媒體談的是同一電力主題下的兩個不同題材，彼此無法相互印證。\"},\"sources\":[{\"name\":\"EE Times\",\"url\":\"https://www.eetimes.com/mcrps-power-supply-for-enterprise-data-centers/\"},{\"name\":\"MIT Technology Review\",\"url\":\"https://www.technologyreview.com/2026/11/24/1149622/data-centers-natural-gas/\"}],\"disagreements\":null,\"trustScore\":57,\"trustBreakdown\":{\"sourceDiversity\":13,\"outletReputation\":10,\"crossCorroboration\":14,\"recencyClarity\":20},\"tags\":[\"semiconductor\",\"live-ingest\",\"ee-times\",\"mit-technology-review\"],\"glossary\":[{\"term\":{\"en\":\"MCRPS\",\"zh-TW\":\"模組化通用冗餘電源（MCRPS）\"},\"blurb\":{\"en\":\"A modular common redundant power supply, a standardised power unit for enterprise server racks.\",\"zh-TW\":\"模組化通用冗餘電源，企業伺服器機架的標準化供電單元。\"}},{\"term\":{\"en\":\"EE Times\",\"zh-TW\":\"EE Times\"},\"blurb\":{\"en\":\"A specialist electronics and semiconductor industry outlet.\",\"zh-TW\":\"專業電子與半導體產業媒體。\"}},{\"term\":{\"en\":\"MIT Technology Review\",\"zh-TW\":\"《麻省理工科技評論》（MIT Technology Review）\"},\"blurb\":{\"en\":\"The Massachusetts Institute of Technology's technology magazine.\",\"zh-TW\":\"麻省理工學院（Massachusetts Institute of Technology）旗下的科技雜誌。\"}},{\"term\":{\"en\":\"xAI\",\"zh-TW\":\"xAI\"},\"blurb\":{\"en\":\"An artificial intelligence company operating a data-centre campus in Memphis.\",\"zh-TW\":\"在孟菲斯（Memphis）設有資料中心園區的人工智慧公司。\"}},{\"term\":{\"en\":\"Behind-the-meter\",\"zh-TW\":\"用戶側發電\"},\"blurb\":{\"en\":\"Power generated on the customer's side of the grid connection, rather than bought from the grid.\",\"zh-TW\":\"在用戶端併網點內側自行發電，而非向電網購電。\"}},{\"term\":{\"en\":\"Server rack\",\"zh-TW\":\"伺服器機架\"},\"blurb\":{\"en\":\"A frame that holds multiple servers and their power supplies in a data centre.\",\"zh-TW\":\"資料中心內裝載多台伺服器與電源的機架。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"
