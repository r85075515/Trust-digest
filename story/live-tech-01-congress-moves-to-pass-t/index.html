 restrict what US hardware can reach China — and demanding Huang testify.\nWhat happened\nThe Verge and the Financial Times both report that Congress is looking to pass tighter AI chip export rules following the Nvidia scandal. Lawmakers from both parties have voiced support for various bills that would tighten the rules, and have demanded that Huang and other Nvidia leaders testify before Congress. Senate Minority Leader Chuck Schumer, quoted in the material, says Huang's alleged affair with a Chinese spy 'increases momentum' to crack down on US hardware reaching China. The snippets do not say when any bill would be voted on, or which measures lead the pack.\nWhy it matters\nThe scandal has handed export hawks a bipartisan vehicle: a bill that was once a policy debate is now a response to a named executive and a named adversary. If the rules tighten, Nvidia's China business — and the wider AI hardware trade — faces a new compliance line drawn by Congress, not just the executive branch.\nSources agree / disagree\nThe Verge and the Financial Times agree on the core: Congress is moving to tighten the rules after the scandal, with bipartisan support and testimony demands. Neither outlet independently verifies the underlying affair allegation in the snippets. Trust label: Two-source agreement — The Verge and the Financial Times agree Congress is moving to tighten export rules; the affair allegation behind the push remains unconfirmed.\nStill uncertain\nThe affair allegation itself is unproven in the material — no evidence, no named spy, no response from Huang or Nvidia in the snippets. The occasion of Schumer's remark is also not stated, and no bill text, vote date or list of measures is given. Until Congress publishes bill text or holds the testimony it demands, the push is a direction, not a law."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-tech-01-congress-moves-to-pass-t\",\"category\":\"tech\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-tech-01-congress-moves-to-pass-t.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Congress moves to pass tighter AI chip export rules following Nvidia scandal\",\"zh-TW\":\"相關封面圖：英偉達醜聞曝光後，國會將通過更嚴格的人工智慧晶片出口規則\"},\"publishedAt\":\"2026-11-15T19:15:43.000Z\",\"title\":{\"en\":\"Congress Moves to Tighten AI Chip Export Rules After Nvidia Spy Scandal\",\"zh-TW\":\"國會擬收緊人工智慧晶片出口管制，起因是輝達（NVIDIA）間諜醜聞\"},\"summary\":{\"en\":\"Congress is moving to pass tighter AI chip export rules after the scandal involving former Nvidia CEO Jensen Huang and a suspected Chinese spy, with both parties backing measures and demanding Huang testify. Senate Minority Leader Chuck Schumer says the alleged affair 'increases momentum' to stop US hardware reaching China. Watch whether bills move before the scandal's facts are established.\",\"zh-TW\":\"輝達（NVIDIA）前執行長黃仁勳（Jensen Huang）捲入疑似中國間諜醜聞後，國會正推動收緊人工智慧晶片出口管制，兩黨都支持相關法案，並要求黃仁勳到國會作證。參議院少數黨領袖舒默（Chuck Schumer）說，這起疑似婚外情「增強了」阻擋美國硬體流向中國的勢頭。法案會不會在醜聞事實查明前就推進，值得盯著看。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"國會正推動收緊人工智慧晶片出口管制，導火線是輝達（NVIDIA）前執行長黃仁勳（Jensen Huang）與一名疑似中國間諜捲入的醜聞。民主、共和兩黨都支持相關法案，要擋下流向中國的美國硬體——並要求黃仁勳到國會作證。\\n發生了什麼事\\nThe Verge 與《金融時報》都報導，國會正尋求在輝達醜聞之後通過更嚴格的人工智慧晶片出口規則。兩黨議員已表態支持多項收緊規則的法案，並要求黃仁勳與其他輝達高層到國會作證。參議院少數黨領袖舒默（Chuck Schumer）在來源材料中表示，黃仁勳疑似與中國間諜有染一事，「增強了」打擊美國硬體流向中國的勢頭。來源摘要沒有說明任何法案何時表決，也沒說哪項措施領先。\\n為什麼重要\\n這起醜聞給了出口管制鷹派一個兩黨都買單的載體：原本是政策辯論的法案，如今成了針對具名高層與具名對手的回應。規則一旦收緊，輝達的中國業務與整體人工智慧硬體貿易，將面對一條由國會、而不只是行政部門畫下的新合規線。\\n來源異同\\nThe Verge 與《金融時報》核心說法一致：醜聞之後，國會正推動收緊規則，兩黨支持，並要求作證。兩家媒體在來源摘要中都沒有獨立查證婚外情指控本身。\\n仍不確定\\n婚外情的指控在來源材料中未經證實——沒有證據、沒有具名的間諜，也沒有黃仁勳或輝達的回應。舒默這番話的場合也沒有說明，法案文本、表決日期與措施清單同樣付之闕如。在國會公布法案文本或舉行它要求的聽證之前，這波推動只是方向，不是法律。\"},\"sources\":[{\"name\":\"The Verge\",\"url\":\"https://www.theverge.com/ai-artificial-intelligence/1033984/congress-export-rules-ai-chips-china\"},{\"name\":\"Financial Times\",\"url\":\"https://www.ft.com/content/3062790a-553d-41b8-9c7d-bae17b9d2e29?syn-25a6b1a6=1\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":21,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"tech\",\"live-ingest\",\"the-verge\",\"financial-times\"],\"glossary\":[{\"term\":{\"en\":\"Jensen Huang\",\"zh-TW\":\"黃仁勳\"},\"blurb\":{\"en\":\"Former CEO of Nvidia, at the centre of the scandal behind the export push.\",\"zh-TW\":\"輝達前執行長，出口管制推動背後醜聞的中心人物。\"}},{\"term\":{\"en\":\"Nvidia\",\"zh-TW\":\"輝達\"},\"blurb\":{\"en\":\"US chipmaker whose CEO's scandal prompted Congress to act.\",\"zh-TW\":\"美國晶片大廠，其執行長的醜聞促使國會採取行動。\"}},{\"term\":{\"en\":\"Chuck Schumer\",\"zh-TW\":\"舒默\"},\"blurb\":{\"en\":\"Senate Minority Leader who says the scandal adds momentum to export controls.\",\"zh-TW\":\"參議院少數黨領袖，稱這起醜聞增強了出口管制的勢頭。\"}},{\"term\":{\"en\":\"US Congress\",\"zh-TW\":\"美國國會\"},\"blurb\":{\"en\":\"The US legislature moving to tighten AI chip export rules.\",\"zh-TW\":\"美國立法機構，正推動收緊人工智慧晶片出口規則。\"}},{\"term\":{\"en\":\"The Verge\",\"zh-TW\":\"The Verge\"},\"blurb\":{\"en\":\"US tech news outlet that reported Congress's move.\",\"zh-TW\":\"美國科技新聞媒體，報導了國會的動向。\"}},{\"term\":{\"en\":\"Financial Times\",\"zh-TW\":\"《金融時報》\"},\"blurb\":{\"en\":\"British financial newspaper that reported Congress's move.\",\"zh-TW\":\"英國財經報紙，報導了國會的動向。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-tech-01-congress-moves-to-pass-t/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"conte
