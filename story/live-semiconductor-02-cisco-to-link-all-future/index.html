hropic has started extending access to its bug-finding Mythos model, allowing Cisco and IBM to build it into their security products; Cisco announced the integration at an event in Melbourne, Australia, where it said the red-teaming tools in its AI Defense suite will probe AI models, agents, and applications for weaknesses.\nWhy it matters\nTying the whole product line to one cloud platform is Cisco's subscription-era bet: one management pane for everything it sells. The Mythos integration is the other half of the story — it puts an AI model that finds software bugs into enterprise security products. The takeaway is that Cisco is selling control: one platform to manage the network, and AI tools to test it.\nSources agree / disagree\nBoth items come from a single outlet, The Register, so there is no independent corroboration. Trust label: Single source — one outlet, two items, no cross-check in the snippets.\nStill uncertain\nThe snippets give no date for Cloud Control's global rollout, no pricing, and no migration plan for existing customers. Those details should be checked against The Register's reporting."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-02-cisco-to-link-all-future\",\"category\":\"semiconductor\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-semiconductor-02-cisco-to-link-all-future.jpg\",\"imageAlt\":{\"en\":\"Cisco ties all future products to Cloud Control\",\"zh-TW\":\"思科未來產品全數綁定 Cloud Control\"},\"publishedAt\":\"2026-11-10T03:32:40.000Z\",\"title\":{\"en\":\"Cisco Will Tie All Future Products to Its Cloud Control Platform\",\"zh-TW\":\"思科：未來所有產品都將綁定 Cloud Control 平台\"},\"summary\":{\"en\":\"[Unconfirmed · single source] Cisco says it will no longer create products that do not integrate with Cloud Control, its SaaS management platform giving network admins one tool for its devices and software. The platform was announced in June 2025 and is available only to U.S. customers; Cisco announced Anthropic's Mythos bug-finding model will go into its security products.\",\"zh-TW\":\"［未證實·單一來源］思科宣布，未來不再推出不整合 Cloud Control 的產品；Cloud Control 是其 SaaS 管理平台，讓網管用單一工具管理思科裝置與大部分軟體。該平台 2025 年 6 月發表，目前僅供美國客戶使用；思科另宣布 Anthropic 的 Mythos 找漏洞模型將進入其安全產品。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"思科將不再推出不整合 Cloud Control 的產品；Cloud Control 是其 SaaS 管理平台，讓網管用單一工具管理這家網路巨頭的所有裝置與大部分軟體。思科 2025 年 6 月發表 Cloud Control，至今僅向美國客戶提供。\\n發生了什麼事\\n思科宣布，未來所有產品都將綁定 Cloud Control 雲端管理平台。自 2025 年 6 月發表以來推廣緩慢，平台至今仍限美國客戶使用。另外，Anthropic 已開始擴大其找漏洞 Mythos 模型的授權，允許思科與 IBM 將其納入安全產品；思科在澳洲墨爾本的活動上宣布整合，並表示其 AI Defense 套件中的紅隊工具將探測 AI 模型、代理與其驅動的應用程式的弱點與不當行為。\\n為什麼重要\\n把全線產品綁定單一雲端平台，是思科在訂閱時代的賭注：一個管理介面管全部產品。Mythos 整合是故事的另一半——把會找軟體漏洞的 AI 模型放進企業安全產品。結論是，思科賣的是掌控：一個平台管理網路，AI 工具負責測試。\\n來源異同\\n兩則消息皆出自單一媒體 The Register，無法獨立查證。信任標籤：僅1源——單一媒體、兩則條目，摘要中無交叉佐證。\\n仍不確定\\n摘要未提供 Cloud Control 全球上線時間、定價與既有客戶遷移安排。這些細節請對照 The Register 的報導。\"},\"sources\":[{\"name\":\"The Register\",\"url\":\"https://www.theregister.com/networks/2026/11/10/cisco-to-link-all-future-products-to-its-saas-y-cloud-control-management-tool/5308660\"}],\"disagreements\":null,\"trustScore\":47,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":10,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"semiconductor\",\"live-ingest\",\"the-register\",\"the-register\"],\"glossary\":[{\"term\":{\"en\":\"Cisco\",\"zh-TW\":\"思科\"},\"blurb\":{\"en\":\"The networking giant tying its products to Cloud Control.\",\"zh-TW\":\"把產品綁定 Cloud Control 的網路設備巨頭。\"}},{\"term\":{\"en\":\"Cloud Control\",\"zh-TW\":\"Cloud Control\"},\"blurb\":{\"en\":\"Cisco's SaaS management platform for its devices and software.\",\"zh-TW\":\"思科的 SaaS 管理平台，管理其裝置與軟體。\"}},{\"term\":{\"en\":\"SaaS management platform\",\"zh-TW\":\"SaaS 管理平台\"},\"blurb\":{\"en\":\"A cloud-based tool for managing devices and software from one place.\",\"zh-TW\":\"從單一介面管理裝置與軟體的雲端工具。\"}},{\"term\":{\"en\":\"Mythos\",\"zh-TW\":\"Mythos\"},\"blurb\":{\"en\":\"
