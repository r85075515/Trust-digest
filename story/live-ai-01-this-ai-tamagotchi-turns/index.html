its.\nWhat happened\nWired reports that the OATs are small E Ink devices that attach a personality to an ordinary object: a plant that begs for water, a skateboard that wants to be ridden, a dumbbell that demands a workout. The idea borrows the Tamagotchi formula — a virtual pet that needs attention — and applies it to the things people already own, using the pet's demands as a nudge toward the habit the owner wants to build.\nWhy it matters\nHabit apps are easy to ignore; a gadget that visibly sulks when neglected is harder to swipe away. If the trick works, it suggests a different use for AI companions — not chatting with us, but nagging the objects around us into keeping us honest.\nSources agree / disagree\nOnly Wired has covered the OATs in this digest so far. Trust label: Single source — the account rests on one outlet's feed description, with no corroborating coverage yet.\nStill uncertain\nThe feed description says nothing about price, availability, how the AI generates the personalities, or whether owners actually kept up the habits. Verify details in the full Wired reporting before quoting specifics."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-ai-01-this-ai-tamagotchi-turns\",\"category\":\"ai\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-ai-01-this-ai-tamagotchi-turns.png\",\"imageAlt\":{\"en\":\"Cover related to: This AI Tamagotchi Turns Everyday Objects Into Needy Virtual Pets\",\"zh-TW\":\"相關封面圖：這個人工智慧電子寵物將日常物品變成了需要幫助的虛擬寵物\"},\"publishedAt\":\"2026-11-15T11:00:00.000Z\",\"title\":{\"en\":\"OATs Turn Houseplants and Skateboards Into Needy AI Pets\",\"zh-TW\":\"OATs 把盆栽、滑板變成黏人的 AI 電子寵物\"},\"summary\":{\"en\":\"A Carnegie Mellon student's tiny E Ink gadgets, called OATs, give houseplants, skateboards and dumbbells expressive personalities that nudge their owners toward better habits. The AI Tamagotchi-style idea turns everyday objects into needy virtual pets — charming, but the real test is whether the novelty outlasts the first week.\",\"zh-TW\":\"卡內基美隆大學（Carnegie Mellon University）一名學生的電子墨水小裝置 OATs，讓盆栽、滑板與啞鈴有了表情與個性，推著主人養成好習慣。這個 AI 電子雞式的點子把日常物品變成黏人的虛擬寵物——很有趣，但真正的考驗是新鮮感能否撐過第一週。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"卡內基美隆大學（Carnegie Mellon University）一名學生的電子墨水小裝置 OATs，讓盆栽、滑板與啞鈴有了表情與個性，變成黏人的虛擬寵物，推著主人養成好習慣。\\n發生了什麼事\\n《連線》（Wired）報導，OATs 是小型的電子墨水裝置，能賦予日常物品個性：盆栽會討水喝、滑板想被拿去騎、啞鈴催你運動。點子借用了電子雞（Tamagotchi）的模式——需要照顧的虛擬寵物——套用到人本來就擁有的東西上，用寵物的「需求」推動主人建立想養成的習慣。\\n為什麼重要\\n習慣養成 App 很容易被忽略，會擺臉色的裝置卻很難滑掉不理。這招若有效，代表 AI 伴侶有另一種用法：不是陪人聊天，而是讓身邊的物品盯著人、逼人說到做到。\\n來源異同\\n目前只有《連線》報導 OATs。信任標籤：僅1源——本卡內容只依據一家媒體的摘要，尚無其他報導佐證。\\n仍不確定\\n摘要沒有提到價格、上市時間、AI 如何生成個性，也沒有主人是否真的維持了習慣。引用細節前請查閱《連線》的完整報導。\"},\"sources\":[{\"name\":\"Wired AI\",\"url\":\"https://www.wired.com/story/this-ai-tamagotchi-oats-turns-everyday-objects-into-needy-virtual-pets/\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":18,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"ai\",\"live-ingest\",\"wired-ai\"],\"glossary\":[{\"blurb\":{\"en\":\"Tiny E Ink gadgets that give everyday objects expressive personalities.\",\"zh-TW\":\"小型電子墨水裝置，讓日常物品有了表情與個性。\"},\"term\":{\"en\":\"OATs\",\"zh-TW\":\"OATs\"}},{\"blurb\":{\"en\":\"US university where the student behind the OATs studies.\",\"zh-TW\":\"美國大學，OATs 背後的學生就讀於此。\"},\"term\":{\"en\":\"Carnegie Mellon University\",\"zh-TW\":\"卡內基美隆大學（Carnegie Mellon University）\"}},{\"blurb\":{\"en\":\"Low-power display technology used in the OATs gadgets.\",\"zh-TW\":\"低耗電顯示技術，OATs 裝置所採用。\"},\"term\":{\"en\":\"E Ink\",\"zh-TW\":\"電子墨水（E Ink）\"}},{\"blurb\":{\"en\":\"Virtual pet toy whose needy-pet formula the OATs borrow.\",\"zh-TW\":\"虛擬寵物玩具，OATs 借用其黏人寵物的模式。\"},\"term\":{\"en\":\"Tamagotchi\",\"zh-TW\":\"電子雞（Tamagotchi）\"}},{\"blurb\":{\"en\":\"Technology magazine that reported on the OATs.\",\"zh-TW\":\"科技雜誌，報導 OATs 的媒體。\"},\"term\":{\"en\":\"Wired\",\"zh-TW\":\"《連線》（Wired）\"}}]}}]\n"])</script
