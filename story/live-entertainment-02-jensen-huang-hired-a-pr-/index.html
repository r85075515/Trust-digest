es report described Alice Huang's business dealings with him.\nWhat happened\nPresident Donald Trump said on Monday that he spoke with Huang and asked him about the alleged affair with a Chinese spy, and the BBC reported that Trump says the FBI is investigating. Nvidia shares tumbled, wiping hundreds of billions of dollars off the company's value, and a law firm has filed a class-action lawsuit, with more firms investigating securities fraud after the drop, according to Tom's Hardware. Huang co-founded Nvidia as a young engineer in 1993 and led it into a multitrillion-dollar chipmaker and bellwether of the AI industry. The Guardian asks whether his shattered image could see him pushed out.\nWhy it matters\nThe verdict is about the board, not the gossip: Huang built Nvidia as a family business, and his co-founder's alleged affair with a spy now forces directors to choose between the man who made the company and the risk he carries. The PR hire a year ago shows the company saw this coming; the share drop shows investors are pricing the fallout now.\nSources agree / disagree\nMany outlets agree on the reported events — the PR hire, Trump's statement, the share drop, and the lawsuit filing — while the affair itself remains an allegation. The auto-flagged \"30 vs 99\" figure conflict matches numbers from different stories, not a disputed fact: \"30\" refers to Huang's more than 30 years as Nvidia's public face. Trust label: Multi-source agreement — many outlets agree on the reported events; the affair itself is unproven.\nStill uncertain\nNo evidence for the affair, no response from Huang or Alice Huang, and no confirmation of an FBI investigation appear in the feed snippets — only Trump's claim. Whether the board acts, and what the investigation finds, remain open; verify everything in the full articles before quoting."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-entertainment-02-jensen-huang-hired-a-pr-\",\"category\":\"ente
