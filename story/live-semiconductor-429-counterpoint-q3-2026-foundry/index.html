 2026. TSMC's market share rose from 73% to 75%, while Samsung Electronics moved from 6.9% to 6.4% in second place and SMIC ranked third at roughly 5%.\n\nWhy it matters: Strong AI chip demand has lifted industry revenue while concentrating share at TSMC, putting pressure on rivals such as Samsung Electronics to scale advanced-node execution and customer wins.\n\nSource differences: Money Today published \"AI chip boom widens gap between Samsung and TSMC, as Samsung bets on new strategy\" while Benzinga (via TradingView) ran \"What Is Going on With Taiwan Semiconductor Stock on Friday?\" Both reports draw their Q3 2026 market share and revenue growth figures from the same Counterpoint Research study.\n\nStill uncertain: Exact quarterly dollar totals across all smaller foundries and how quickly new node ramps will shift market shares in upcoming quarters remain subject to ongoing tracking.\n\nTrust label: Single source - Both Money Today and Benzinga (via TradingView) cite the same Counterpoint Research Q3 2026 pure-play foundry report."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-429-counterpoint-q3-2026-foundry\",\"category\":\"semiconductor\",\"title\":{\"en\":\"TSMC Share Rises to 75% in Q3 2026 Pure Foundry Market: Counterpoint\",\"zh-TW\":\"Counterpoint：2026年第三季全球純晶圓代工台積電市占升至75%\"},\"summary\":{\"en\":\"Counterpoint Research reported that global pure-play foundry revenue rose 36% year over year and 13% quarter over quarter in Q3 2026, with TSMC share rising from 73% to 75% and Samsung Electronics slipping from 6.9% to 6.4%. Key takeaway: AI chip demand continues to widen TSMC's lead.\",\"zh-TW\":\"Counterpoint Research 公布2026年第三季全球純晶圓代工營收年增36%、季增13%，台積電（TSMC）市占由73%升至75%，三星電子（Samsung Electronics）自6.9%降至6.4%，中芯國際（SMIC）約5%居第三。關鍵結論：AI 晶片需求持續推升代工市場並擴大龍頭領先幅度。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」Counterpoint Research 公布2026年第三季全球純晶圓代工營收較去年同期成長36%、較前一季成長13%。其中台積電（TSMC）市占率自73%升至75%，三星電子（Samsung Electronics）市占率自6.9%滑落至6.4%居次，中芯國際（SMIC）以約5%排名第三。\\n\\n「為什麼重要」在 AI 晶片需求帶動下，全球代工產值與市占集中度同步升高，促使三星電子等競爭者在先進製程良率、產能與客戶拓展上承受更大競爭壓力。\\n\\n「來源異同」Money Today 報導標題為「AI chip boom widens gap between Samsung and TSMC, as Samsung bets on new strategy」，Benzinga (via TradingView) 報導標題為「What Is Going on With Taiwan Semiconductor Stock on Friday?」；兩篇報導的2026年第三季市占率與營收增幅皆引自 Counterpoint Research 同一份研究報告。\\n\\n「仍不確定」各家二三線代工業者的精確營收金額拆解，以及後續季度先進製程量產進度對市占率的實質影響，仍需後續財報與研調追蹤。\\n\\nTrust label: Single source - Money Today 與 Benzinga (via TradingView) 均引述 Counterpoint Research 同一份2026年第三季純晶圓代工報告。\"},\"glossary\":[{\"term\":{\"en\":\"Pure-play foundry\",\"zh-TW\":\"純晶圓代工\"},\"blurb\":{\"en\":\"A semiconductor manufacturer that fabricates chips designed by other companies rather than selling its own branded chips.\",\"zh-TW\":\"專注為其他 IC 設計公司代工製造晶圓、不推出自有品牌晶片銷售的半導體代工廠。\"}},{\"term\":{\"en\":\"Market share\",\"zh-TW\":\"市占率\"},\"blurb\":{\"en\":\"A company's portion of total industry revenue or unit volume during a given period.\",\"zh-TW\":\"特定期間內單一廠商營收或出貨量占整體市場總量的百分比。\"}},{\"term\":{\"en\":\"Quarter over quarter\",\"zh-TW\":\"季增率\"},\"blurb\":{\"en\":\"The percentage change in a metric compared with the immediately preceding quarter.\",\"zh-TW\":\"某一指標相較於緊鄰前一季度的變動幅度。\"}}],\"sources\":[{\"name\":\"Money Today\",\"url\":\"https://www.mt.co.kr/en/industry/2026/11/27/2026112614411974849\"},{\"name\":\"Benzinga (via TradingView)\",\"url\":\"https://www.tradingview.com/news/benzinga:a954152a2094b:0-what-is-going-on-with-taiwan-semiconductor-stock-on-friday/\"}],\"imageUrl\":\"/covers/live/live-semiconductor-429-counterpoint-q3-2026-foundry.jpg\",\"imageAlt\":{\"en\":\"TSMC Share Rises to 75% in Q3 2026 Pure Foundry Market: Counterpoint\",\"zh-TW\":\"Counterpoint：2026年第三季全球純晶圓代工台積電市占升至75%\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":70,\"trustBreakdown\":{\"crossCorroboration\":17,\"outletReputation\":20,\"recencyClarity\":22,\"sourceDiversity\":11},\"publishedAt\":\"2026-11-28T09:55:36.000Z\
