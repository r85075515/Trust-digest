wned by Elon Musk, has rolled out parental controls for teenage users, according to TechCrunch. The controls let parents and guardians manage what their children see on X. The move comes 20 years after the service launched. TechCrunch reports the addition; the feed summary gives no launch date, no list of settings, and no statement from X itself.\n\nWhy it matters\nParents have had no built-in way to manage what their teenagers see on X until now. The controls put that management inside X itself, giving families a direct tool on the platform for the first time.\n\nSources agree and disagree\nOnly TechCrunch covers the story in this feed, so there is no second outlet to confirm the rollout or compare details against. No numeric or naming conflict appears in the short feed summary.\n\nStill uncertain\nThe feed summary does not say when the controls reach all users, which settings they include, or how a parent links an account to a teenager's. X has not been quoted in the feed summary, and no other outlet has picked up the story yet.\n\nTrust label: Single source — One outlet reports the rollout, and no other source in the feed confirms it."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-tech-01-x-finally-gets-parental-\",\"category\":\"tech\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-tech-01-x-finally-gets-parental-.jpg\",\"imageAlt\":{\"en\":\"Cover related to: X finally gets parental controls after 20 years\",\"zh-TW\":\"相關封面圖：X 20年後終於獲得家長監護\"},\"publishedAt\":\"2026-11-26T19:31:50.000Z\",\"title\":{\"en\":\"X Adds Parental Controls for Teenagers After 20 Years\",\"zh-TW\":\"X 20 年後終於為青少年推出家長監護功能\"},\"summary\":{\"en\":\"[Unconfirmed · Single source] X has added parental controls for teenagers, letting parents and guardians manage what their children see on the platform, two decades after the service launched. TechCrunch reports the long-awaited addition, but no other outlet in the feed has confirmed the rollout or its details yet.\",\"zh-TW\":\"［未證實·單一來源］社群平台 X 終於為青少年推出家長監護功能，家長與監護人可管理孩子在平台上看到的內容。據科技媒體 TechCrunch 報導，這是該平台上線 20 年來首見的相關功能，但目前尚無其他來源證實推出的細節。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"社群平台 X 終於為青少年推出家長監護功能，家長與監護人可管理孩子在平台上看到的內容，這是該平台上線 20 年來首見的相關功能。\\n\\n發生了什麼事\\n據科技媒體 TechCrunch 報導，伊隆·馬斯克（Elon Musk）旗下的社群平台 X 已為青少年用戶推出家長監護功能。家長與監護人可藉此管理孩子在平台上看到的內容。報導未說明功能上線的具體時間，也未列出設定項目與 X 官方的說法。\\n\\n為什麼重要\\n在此之前，家長在 X 平台內沒有內建工具可管理青少年看到的內容。這項功能把管理方式放回平台本身，家長第一次能在 X 內直接管理孩子看到的內容。\\n\\n來源異同\\n本次僅有 TechCrunch 一家媒體報導，來源內沒有第二家可供比對，也未見數字或名稱上的出入。\\n\\n仍不確定\\n功能何時全面開放、包含哪些設定、家長如何將自己的帳號與青少年的帳號連結，來源摘要皆未說明。X 官方亦未在摘要中發表說法，其他媒體也尚未跟進報導。\"},\"sources\":[{\"name\":\"TechCrunch\",\"url\":\"https://techcrunch.com/2026/11/26/x-finally-gets-parental-controls-after-20-years/\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":18,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"tech\",\"live-ingest\",\"techcrunch\"],\"glossary\":[{\"blurb\":{\"en\":\"Social network owned by Elon Musk.\",\"zh-TW\":\"伊隆·馬斯克（Elon Musk）旗下的社群平台。\"},\"term\":{\"en\":\"X\",\"zh-TW\":\"X\"}},{\"blurb\":{\"en\":\"Owner of the social network X.\",\"zh-TW\":\"社群平台 X 的擁有者。\"},\"term\":{\"en\":\"Elon Musk\",\"zh-TW\":\"伊隆·馬斯克\"}},{\"blurb\":{\"en\":\"Technology news outlet that reported the rollout.\",\"zh-TW\":\"報導此事的科技媒體。\"},\"term\":{\"en\":\"TechCrunch\",\"zh-TW\":\"TechCrunch\"}},{\"blurb\":{\"en\":\"Settings that let parents and guardians manage what teenagers see on a platform.\",\"zh-TW\":\"讓家長與監護人管理青少年在平台上看到的內容的設定。\"},\"term\":{\"en\":\"Parental controls\",\"zh-TW\":\"家長監護功能\"}},{\"blurb\":{\"en\":\"Adults who manage what their children see on X through the new controls.\",\"zh-TW\":\"透過新功能管理孩子在 X 上看到的內容的家長。\"},\"term\":{\"en\":\"Parents\",\"zh-TW\":\"家長\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=de
