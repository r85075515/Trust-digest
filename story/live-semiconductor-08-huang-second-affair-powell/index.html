 worked at Nvidia told the Times, on condition of anonymity, that Huang, 63, had an extramarital relationship with Powell, 48, who reports directly to him; both are married to other people. Two of the five said the pair were captured on video being affectionate at a San Jose hotel during an Nvidia conference in March - the Times states plainly that it has not seen the video. The relationship has reportedly been discussed inside the company. Nvidia's corporate code of conduct instructs employees to 'avoid situations where our actions create conflict,' including 'personal relationships,' and says the company 'promptly investigates reports of misconduct.' As of the first day of coverage, neither Nvidia, Huang nor Powell had publicly responded to this report, and it is not known whether the board's Wachtell-led investigation - commissioned for the Alice Huang matter - will extend to this one.\nWhy it matters\nThe first affair raised national-security questions that Nvidia could partly deflect: officials have not accused Huang of knowing Alice Huang was an alleged intelligence asset, and he remains, on that record, a target rather than a suspect. A relationship with a direct report is different in kind: it is the textbook internal-governance violation that boards actually remove CEOs over, it involves no foreign power to blame, and it suggests the acknowledged affair was not an isolated lapse. That is why the market reacted instantly - Nvidia had risen 2.9% in Wednesday's regular session, then fell more than 3% after hours when the Times published, erasing the day's gain. The takeaway: with a shareholder class action pending, a Senate resignation call already on the table and earnings due Nov 17, the question is no longer only what Huang did with a suspected spy, but whether the board can credibly say his conduct was a one-off.\nSources agree / disagree\nAll coverage traces to a single origin - the Times' reporting - with CNBC and Investor's Business Daily confirming the market reaction and the report's contents rather than the underlying facts. Outlets agree on the scaffolding: Powell's role and reporting line, the code-of-conduct language, and that the board probe into the first affair is under way. No outlet has independently verified the relationship or the March hotel video, and the Times itself flags that it has not viewed the footage. Trust label: Single-origin report - New York Times, five anonymous Nvidia sources; allegation unverified, no response yet from Nvidia, Huang or Powell.\nStill uncertain\nWhether the relationship occurred as described, whether the March video exists and what it shows, whether Powell remains in her role, and whether the board expands its investigation all remain open. Any response from Nvidia, Huang or Powell would materially update this card."])</script><script>self.__next_f.push([1,"11:Tb87,"])</script><script>self.__next_f.push([1,"［未證實·單一原始來源］《紐約時報》週三（11 月 11 日）報導，輝達執行長黃仁勳被指曾與直屬部屬、醫療保健副總裁金伯莉·鮑威爾（Kimberly Powell）有先前未曝光的婚外情。這與他已坦承的黃樂案是兩回事：本案無人指控間諜情節，問題落在輝達自己的行為準則——公司明文要求員工避免造成利益衝突的私人關係；而董事會對第一段外遇的獨立調查還在進行中。\n發生了什麼事\n5 名曾在輝達任職的人士匿名向《紐時》表示，63 歲的黃仁勳與 48 歲、直接向他彙報的鮑威爾有婚外情，兩人各自都已婚。其中兩人說，兩人今年 3 月在輝達一場會議期間，於聖荷西（San Jose）一家飯店被拍下親密舉止——《紐時》明言自己沒有看過這段影片。據報導，這段關係在公司內部早有議論。輝達的企業行為準則要求員工「避免讓自身行為造成利益衝突的情境」，包括「私人關係」，並稱公司會「迅速調查不當行為的通報」。截至首日各家報導刊出，輝達、黃仁勳與鮑威爾都尚未公開回應此事；董事會為黃樂案委託 Wachtell 律所進行的調查是否會擴及本案，也還不清楚。\n為什麼重要\n第一段外遇的核心是國安問題，輝達尚有部分卸責空間：官員並未指控黃仁勳知道黃樂是疑似情報人員，就該案紀錄而言他是「被鎖定的目標」而非嫌疑人。與直屬部屬的關係性質完全不同：這是董事會真的會據以開除執行長的教科書級內部治理違規，沒有外國勢力可以歸咎，也暗示已坦承的那一段並非孤例。市場反應立即：輝達週三常規交易時段上漲 2.9%，《紐時》報導刊出後盤後跌逾 3%，單日漲幅全數吐回。還有股東集體訴訟在打、參議院已有辭職呼聲、11 月 17 日財報在即——結論是：問題不再只是黃仁勳與疑似間諜做了什麼，而是董事會還能不能可信地說，他的行為只是一時失足。\n來源異同\n所有報導都源自同一個原始來源——《紐時》的調查；CNBC 與《投資人財經日報》證實的是市場反應與報導內容本身，不是關係的底層事實。各家對骨架說法一致：鮑威爾的職位與彙報線、行為準則的條文、以及第一段外遇的董事會調查正在進行。沒有任何一家獨立查證這段關係或 3 月的飯店影片，《紐時》自己也註明未看過影片。信任標籤：單一原始來源——《紐約時報》引述 5 名匿名輝達消息人士；指控未證實，輝達、黃仁勳與鮑威爾均尚未回應。\n仍不確定\n這段關係是否如報導所述、3 月的影片是否存在又拍到什麼、鮑威爾是否仍在原職、董事會是否擴大調查範圍，全都未明。輝達、黃仁勳或鮑威爾任何一方的回應，都會實質更新本卡。"])</script><script>self.__next  of health care, and that the pair were filmed at a San Jose hotel in March - footage the Times says it has not seen. Nvidia's code of conduct warns against personal relationships that create conflicts. Neither Nvidia nor Huang had responded; shares fell more than 3% after hours.\",\"zh-TW\":\"［未證實·單一原始來源］《紐約時報》11 日報導，5 名輝達員工指執行長黃仁勳曾與直屬部屬、醫療保健副總裁金伯莉·鮑威爾（Kimberly Powell）有婚外情，兩人今年 3 月在聖荷西飯店被拍下親密畫面——但紐時明言未看過影片。輝達行為準則明文要求避免造成利益衝突的私人關係；此事落在董事會正調查第一段外遇之際，輝達與黃仁勳尚未回應，股價盤後跌逾 3%。\"},\"tags\":[\"semiconductor\",\"live-ingest\",\"breaking\",\"nvidia\",\"jensen-huang\",\"governance\"],\"title\":{\"en\":\"NYT Reports a Second Huang Affair - With a Direct Report - as Nvidia Slides After Hours\",\"zh-TW\":\"黃仁勳爆第二段外遇：紐時指對象是直屬副總鮑威爾，輝達盤後跌逾 3%\"},\"trustBreakdown\":{\"crossCorroboration\":14,\"outletReputation\":20,\"recencyClarity\":20,\"sourceDiversity\":14},\"trustScore\":68}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-semiconductor-08-huang-second-affair-powell/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-semiconductor-08-huang-second-affair-powell/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"con
