derlying lawsuit proceeds.\nWhat happened\nOn Wednesday, U.S. District Judge Loren L. AliKhan granted a preliminary injunction in ABC's favour, blocking the FCC, led by Brendan Carr, from taking any action curbing ABC's ability to renew its broadcast licences. ABC had sued the agency in August over what the coverage describes as an unusual demand. Reports describe the order, granted Wednesday night, as prohibiting the FCC from taking any more actions on ABC's early licence review, and as blocking the Trump administration from moving to review all local broadcast licences held by ABC, whose stations air in six of the largest U.S. markets. NPR's headline frames the ruling as finding that the FCC violated ABC's free speech rights to please President Trump. Judge AliKhan is described in the coverage as a Biden-era appointee.\nWhy it matters\nBroadcast licences are the legal basis on which local stations operate, so a regulator's move against a network's renewals carries weight beyond one dispute. A preliminary injunction does not decide the whole case, but it signals that the court saw enough urgency and merit to stop the agency now rather than after the fact. The ruling therefore limits, at least temporarily, how far the FCC can press ABC while the litigation continues.\nSources agree / disagree\nThe Guardian, The Hill and NPR agree on the core facts: the judge, the preliminary injunction, and the bar on further FCC action over ABC's licences. One additional Hill item bundled in the same feed concerns a separate case, in which a judge sided against the Democratic National Committee over taxpayer-funded pro-Trump advertisements; that item is a different dispute and is not treated here as part of the ABC licensing case. No numeric or name conflict appears among the ABC items.\nStill uncertain\nThe feed text is truncated and does not give the injunction's full reasoning, its duration, or whether the FCC will appeal. The exact demand ABC challenged in its August lawsuit is described only as unusual in the snippets, so the underlying dispute cannot be fully reconstructed from the feed material alone.\nTrust label: Multi-source agreement — three outlets independently report the same injunction, the same judge and the same bar on further FCC action against ABC's licences."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-02-judge-blocks-brendan-car\",\"category\":\"international\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-international-02-judge-blocks-brendan-car.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Judge blocks Brendan Carr-led FCC from taking any further action against ABC’s licenses\",\"zh-TW\":\"相關封面圖：法官阻止布倫丹卡爾領導的聯邦通信委員會對 ABC 的許可證採取任何進一步行動\"},\"publishedAt\":\"2026-11-26T05:23:18.000Z\",\"title\":{\"en\":\"Judge Loren AliKhan blocks FCC from further action against ABC broadcast licences\",\"zh-TW\":\"法官阿里汗（Loren AliKhan）阻止聯邦通訊委員會對 ABC 廣播執照採取進一步行動\"},\"summary\":{\"en\":\"U.S. District Judge Loren AliKhan has granted ABC a preliminary injunction barring the Brendan Carr-led Federal Communications Commission from taking further action on the network's broadcast licences, after ABC sued the agency in August. The ruling also blocked the administration from moving to review all local ABC station licences, which air in six of the largest U.S. markets.\",\"zh-TW\":\"美國地區法官阿里汗（Loren AliKhan）批准 ABC 的初步禁令，禁止卡爾（Brendan Carr）領導的聯邦通訊委員會（FCC）對該電視網的廣播執照採取進一步行動；ABC 於 8 月起訴該機構。裁決也阻止政府推動審查 ABC 旗下在全美六大市場播出的所有地方電視台執照。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"一名聯邦法官介入聯邦通訊委員會與 ABC 之間，凍結監管機關對該電視網廣播執照的行動，讓底層訴訟先行處理。\\n發生了什麼事\\n週三，美國地區法官阿里汗（Loren L. AliKhan）批准對 ABC 有利的初步禁令，禁止卡爾（Brendan Carr）領導的聯邦通訊委員會（Federal Communications Commission，FCC）採取任何限制 ABC 更新廣播執照的行動。ABC 於 8 月就一項被報導形容為不尋常的要求起訴該機構。報導指出，這項週三晚間批准的命令禁止 FCC 對 ABC 的提前執照審查採取更多行動，也阻止川普政府推動審查 ABC 持有的所有地方廣播執照；這些電視台在全美六個最大市場播出。NPR 的標題將裁決定性為 FCC 為取悅川普總統而侵犯 ABC 的言論自由權。報導並提到阿里汗是拜登時期任命的法官。\\n為什麼重要\\n廣播執照是地方電視台營運的法律基礎，監管機關針對電視網續照的行動，分量不止於單一爭議。初步禁令並非全案判決，但顯示法院認為有足夠的急迫性與理由，必須現在就擋下機關行動，而非事後補救。在訴訟落幕前，FCC 能對 ABC 施壓的空間因此暫時受限。\\n來源異同\\n《衛報》、The Hill 與 NPR 對核心事實一致：法官本人、初步禁令，以及禁止 FCC 對 ABC 執照採取進一步行動。同一批摘要中另有一則 The Hill 報導屬於不同案件——法官在納稅人出資的親川普廣告案中判民主黨全國委員會敗訴——與 ABC 執照案無關，此處不併入本案敘述。ABC 相關報導之間沒有數字或人名衝突。\\n仍不確定\\n摘要文字有截斷，未提供禁令的完整理由、效期，以及 FCC 是否上訴。ABC 在 8 月訴訟中挑戰的確切要求，摘要僅形容為不尋常，底層爭議無法只靠摘要完整還原。\"},\"sources\":[{\"name\":\"The Guardian Business\",\"url\":\"https://www.theguardian.com/us-news/2026/nov/25/brendan-carr-fcc-abc-licenses\"},{\"name\":\"The Hill\",\"url\":\"https://thehill.com/regulation/court-battles/6244361-judge-denies-dnc-ad-challenge/\"},{\"name\":\"NPR News\",\"url\":\"https://www.npr.org/2026/11/26/nx-s1-6000576/fcc-disney-abc-first-amendment-trump-brendan-carr\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":20,\"outletReputation\":20,\"crossCorroboration\":22,\"recencyClarity\":25},\"tags\":[\"international\",\"live-ingest\",\"the-guardian-business\",\"the-hill\",\"the-hill\"],\"glossary\":[{\"term\":{\"en\":\"Loren AliKhan\",\"zh-TW\":\"阿里汗\"},\"blurb\":{\"en\":\"The U.S. district judge, a Biden-era appointee, who granted the preliminary injunction.\",\"zh-TW\":\"批准初步禁令的美國地區法官，拜登時期任命。\"}},{\"term\":{\"en\":\"Federal Communications Commission (FCC)\",\"zh-TW\":\"聯邦通訊委員會\"},\"blurb\":{\"en\":\"The U.S. regulator for broadcasting and communications, blocked from further action against ABC's licences.\",\"zh-TW\":\"美國廣播與通訊監管機關，被禁止對 ABC 執照採取進一步行動。\"}},{\"term\":{\"en\":\"Brendan Carr\",\"zh-TW\":\"卡爾\"},\"blurb\":{\"en\":\"The chairman leading the FCC in its dispute with ABC.\",\"zh-TW\":\"領導 FCC 與 ABC 爭訟的主席。\"}},{\"term\":{\"en\":\"ABC\",\"zh-TW\":\"ABC\"},\"blurb\":{\"en\":\"The U.S. television network that sued the FCC in August over its licence treatment.\",\"zh-TW\":\"8 月就執照待遇起訴 FCC 的美國電視網。\"}},{\"term\":{\"en\":\"preliminary injunction\",\"zh-TW\":\"初步禁令\"},\"blurb\":{\"en\":\"A court order that temporarily stops an action while a lawsuit proceeds.\",\"zh-TW\":\"訴訟進行期間暫時阻止某項行動的法院命令。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-international-02-judge-blocks-brendan-car/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-international-02-judge-blocks-brendan-car/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"d:\"$8:metadata\"\n"])</script></body></html>
