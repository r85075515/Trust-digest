d Kansas. The RNC said voters want to hear from Trump before Election Day, in a truncated quotation.\nWhat happened\nThe Hill reported tele-rallies in 19 states after the cancellations. Bloomberg News reported Trump cancelled rallies and switched to remote campaigning. Al Jazeera reported the Iowa and Kansas cancellations. Another description said broadcasts in nearly 20 states, so the count differs. The summary did not state dates, format, or a reason for the cancellations.\nWhy it matters\nThe switch decides how Trump spends the closing days of the midterm campaign. Replacing two rallies with tele-rallies across 19 states changes who can attend and how voters are reached in the final 72-hour sprint described by the RNC. A remote format tests whether telephone events can deliver the same boost as rallies.\nSources agree / disagree\nThe Hill, Bloomberg News, and Al Jazeera agree Trump cancelled the Iowa and Kansas events and moved to tele-rallies. The state count differs: 19 versus nearly 20. Trust label: Multi-source agreement — three outlets agree on the cancellations and switch, with a small state-count difference.\nStill uncertain\nThe reason for the cancellations, the tele-rally dates and format, and the full RNC quotation were not stated."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-us-02-trump-cancels-rallies-sw\",\"category\":\"us\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-us-02-trump-cancels-rallies-sw.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Trump Cancels Rallies, Switches to Remote Midterm Campaigning\",\"zh-TW\":\"相關封面圖：川普取消集會，轉向遠距中期競選活動\"},\"publishedAt\":\"2026-10-30T01:20:56.000Z\",\"title\":{\"en\":\"Donald Trump Cancels Iowa and Kansas Rallies for Tele-Rallies\",\"zh-TW\":\"川普取消愛荷華州與堪薩斯州集會，改採電話集會\"},\"summary\":{\"en\":\"President Donald Trump cancelled in-person midterm events in Iowa and Kansas and will instead appear in tele-rallies, the Republican National Committee announced Thursday. The Hill reported 19 states, while another description said nearly 20. Watch whether remote events deliver the same late-campaign boost as rallies.\",\"zh-TW\":\"共和黨全國委員會（RNC）週四宣布，總統川普（Donald Trump）取消愛荷華州與堪薩斯州的現場中期選舉活動，改採電話集會，The Hill 報導為 19 個州，另一則描述稱將近 20 個州。後續要看遠距活動能否帶來與現場集會相同的選前推動效果。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"共和黨全國委員會（RNC）週四表示，總統川普（Donald Trump）將在選舉日之前出席橫跨 19 個州的電話集會。這項宣布是在川普取消愛荷華州與堪薩斯州的兩場現場活動之後作出。根據摘要中遭到截斷的引言，RNC 表示全國選民都希望在選舉日之前聽到川普的聲音。\\n發生了什麼事\\nThe Hill 報導，川普在中期選舉活動取消後，將參加 19 個州的電話集會。Bloomberg News 報導，川普取消集會，轉向遠距中期競選。Al Jazeera 報導，川普取消了愛荷華州與堪薩斯州的中期選舉活動，改採電話集會。另一則摘要稱 RNC 宣布在將近 20 個州播出，因此州數在 The Hill 的報導中是 19 個州，在另一則描述中是將近 20 個州。RNC 在週四晚間宣布，川普將改為舉行大量電話集會，但摘要沒有說明每場活動的日期、形式，也沒有說明取消的原因。\\n為什麼重要\\n這次轉換直接決定了川普在中期選舉最後階段如何運用時間。以橫跨 19 個州的電話集會取代兩場現場集會，改變了誰能參與，也改變了競選團隊在 RNC 所稱的最後 72 小時衝刺中接觸選民的方式。這項決定很重要，因為現場集會一直是重要的競選工具，遠距形式能否在選舉日之前帶來同樣的推動效果，仍有待檢驗。\\n來源異同\\nThe Hill、Bloomberg News 與 Al Jazeera 都同意，川普取消了愛荷華州與堪薩斯州的活動，並改採電話集會。州數有差異：The Hill 報導為 19 個州，另一則摘要則描述為將近 20 個州。信任標籤：多源一致——三家媒體對取消活動與改採電話集會的報導一致，州數有小幅差異。\\n仍不確定\\n取消的原因沒有說明。電話集會的日期、時間與形式沒有說明。RNC 引言遭到截斷，提供的資料中沒有補全，也沒有收錄被取消活動主辦方的回應。\"},\"sources\":[{\"name\":\"The Hill\",\"url\":\"https://thehill.com/homenews/campaign/6183027-trump-scheduled-virtual-rally-blitz/\"},{\"name\":\"Bloomberg News\",\"url\":\"https://www.bloomberg.com/news/articles/2026-10-30/trump-cancels-rallies-switches-to-remote-midterm-campaigning\"},{\"name\":\"Al Jazeera\",\"url\":\"https://www.aljazeera.com/news/2026/10/30/trump-cancels-iowa-kansas-midterm-events-opting-for-tele-rallies?traffic_source=rss\"}],\"disagreements\":{\"en\":\"Figures differ across outlets (e.g. 19 vs 20 in headlines/snippets).\",\"zh-TW\":\"不同媒體的數字有所不同（例如，標題/摘要中的數字為 19 比 20）。\"},\"trustScore\":77,\"trustBreakdown\":{\"sourceDiversity\":20,\"outletReputation\":18,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"us\",\"live-ingest\",\"the-hill\",\"bloomberg-news\",\"al-jazeera\"],\"glossary\":[{\"blurb\":{\"en\":\
