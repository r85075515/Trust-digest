verturn a rent freeze affecting approximately one million rent-stabilized apartments. The court concluded that the petitioners failed to show the Rent Guidelines Board's order was unreasonable, arbitrary, or capricious, holding that the freeze had a rational basis.\n\nThe decision preserves a flagship campaign pledge by Democratic socialist Mayor Zohran Mamdani (佐蘭・曼達尼), directly shielding over two million New York City tenants from lease renewal increases amid high urban living costs. Conversely, small property owners warned the ruling strains building maintenance budgets.\n\nThe Guardian and NewsCord's multi-outlet synthesis confirm the court's rationale and political significance, while noting sharp disagreement between tenant advocates celebrating affordability protections and landlord representatives warning of financial distress.\n\nAttorneys for the plaintiff landlord coalition stated they are reviewing the decision and weighing an appeal to a higher New York court.\n\nTrust label: Multi-source agreement — Court ruling details, apartment scope, and reactions from city officials and landlord attorneys are corroborated across The Guardian and NewsCord."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-us-079-nyc-judge-upholds-mamdani-rent-freeze\",\"category\":\"us\",\"title\":{\"en\":\"New York Judge Upholds Mayor Zohran Mamdani's Rent Freeze on 1 Million Apartments\",\"zh-TW\":\"紐約法官裁定維持市長曼達尼凍漲租金令 惠及約百萬戶穩租公寓\"},\"summary\":{\"en\":\"A New York state judge dismissed a landlord coalition's lawsuit and upheld Mayor Zohran Mamdani's two-year rent freeze covering roughly one million rent-stabilized apartments. The ruling delivers a major legal victory for the mayor's housing affordability agenda.\",\"zh-TW\":\"紐約州法官駁回房東團體提起的訴訟，裁定維持紐約市長佐蘭・曼達尼（Zohran Mamdani）推動涵蓋約100萬戶租金穩定公寓的兩年凍漲租金令。這項判決為曼達尼主打的居住可負擔性政策帶來重大司法勝利。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n紐約州最高法院法官布倫丹・蘭特里（Brendan Lantry）做出有利於紐約市政府的裁決，駁回房東團體要求撤銷租金凍漲令的訴訟，維持對全市約100萬戶租金穩定公寓的凍漲措施。法院認定原告未能證明租金指導委員會的決議屬於不合理、武斷或恣意，裁定該政策具備合理基礎而有效。\\n\\n「為什麼重要」\\n此項判決保住了民主社會主義派市長佐蘭・曼達尼（Zohran Mamdani）的核心競選承諾，讓超過200萬名紐約租屋族在生活成本高漲之際免於續約漲租壓力；但小型房東團體則警告，長期凍漲將使老舊公寓面臨修繕與營運資金斷鏈危機。\\n\\n「來源異同」\\n《衛報》（The Guardian）與新聞聚合比對平台NewsCord對判決理由與涵蓋戶數的報導一致；同時完整呈現租屋倡議者與房東律師蘭迪・馬斯特羅（Randy Mastro）及小型物業主協會對政策後果的對立立場。\\n\\n「仍不確定」\\n原告房東聯盟的委任律師已表示正審慎研議判決書內容，是否向上級法院提出上訴及後續上訴審理結果仍有待觀察。\"},\"glossary\":[{\"term\":{\"en\":\"Rent-Stabilized Apartments\",\"zh-TW\":\"租金穩定公寓\"},\"blurb\":{\"en\":\"Residential units in New York City subject to municipal regulations limiting annual rent increases and guaranteeing lease renewal rights.\",\"zh-TW\":\"紐約市受法規管制、限制年度租金調漲幅度並保障租客續約權利的住宅單位。\"}},{\"term\":{\"en\":\"Rent Guidelines Board (RGB)\",\"zh-TW\":\"紐約市租金指導委員會\"},\"blurb\":{\"en\":\"A nine-member municipal board appointed by the mayor that sets annual rent adjustment rates for New York City's rent-stabilized housing.\",\"zh-TW\":\"由紐約市長任命的九人市政委員會，負責每年審議並制定租金穩定公寓的租金調整上限。\"}},{\"term\":{\"en\":\"Arbitrary and Capricious Standard\",\"zh-TW\":\"武斷與恣意審查標準\"},\"blurb\":{\"en\":\"A judicial review test used to determine whether an administrative agency acted without rational basis or disregarded relevant facts.\",\"zh-TW\":\"美國行政法上的司法審查標準，用以判斷行政機關的決定是否缺乏合理依據或漠視相關事實。\"}}],\"sources\":[{\"name\":\"The Guardian\",\"url\":\"https://www.theguardian.com/us-news/2026/nov/25/new-york-judge-upholds-mamdani-rent-freeze\"},{\"name\":\"NewsCord\",\"url\":\"https://newscord.org/article/judge-brendan-lantry-upholds-zohran-mamdanis-two-year-nyc-rent-freeze--Story_20261126_NewYorkcourtupholdsM4badb101\"}],\"imageUrl\":\"/covers/live/live-us-079-nyc-judge-upholds-mamdani-rent-freeze.jpg\",\"imageAlt\":{\"en\":\"New York City residential apartment buildings\",\"zh-TW\":\"紐約市住宅公寓建築群\"},\"isHeadline\":false,\"isPopular\":true,\"trustScore\":84,\"trustBreakdown\":{\"crossCorroboration\":21,\"outletReputation\":22,\"recencyClarity\":20,\"sourceDiversity\":21},\"publishedAt\":\"2026-11-27T15:07:28.000Z\",\"d
