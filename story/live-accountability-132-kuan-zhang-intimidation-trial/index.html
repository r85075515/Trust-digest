r and livestreamer Chen Chih-han (陳之漢), widely known as \"Kuan Chang.\" Prosecutors previously indicted Chen on charges of public intimidation and threatening personal safety—allegations not yet determined by a court—after he stated during an October 2025 livestream that he would \"cut off Lai Ching-te's dog head,\" referring to President Lai Ching-te (賴清德). Having declined to plead guilty in two prior hearings, Chen again entered a not-guilty plea at the closing session, arguing that he has consistently opposed unification by force and alleging political persecution and media distortion. The judicial panel scheduled the verdict announcement for the morning of February 2, 2027.\n\n為什麼重要\nThe case tests the legal boundary between protected political speech and criminal intimidation under Taiwan's Criminal Code when high-profile online commentators direct violent rhetoric toward elected leaders.\n\n來源異同\nReports from United Daily News (UDN) and TVBS News align on the indictment charges, Chen's courtroom defense statements, the conclusion of arguments on November 27, and the February 2, 2027 verdict date.\n\n仍不確定\nWhether the three-judge panel will find Chen's livestream remarks constituted an actionable threat or protected hyperbole, and what sentence or fine might follow if convicted, remain undecided until February 2, 2027.\n\nTrust label: Multi-source agreement — Courtroom proceedings, defense claims, and verdict date are consistently reported by UDN and TVBS."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-accountability-132-kuan-zhang-intimidation-trial\",\"category\":\"accountability\",\"title\":{\"en\":\"Taiwan Influencer Chen Chih-han Pleads Not Guilty at Closing Hearing; Verdict Set for Feb. 2\",\"zh-TW\":\"直播揚言斬首賴清德案辯論終結 「館長」陳之漢堅持無罪明年 2 月 2 日宣判\"},\"summary\":{\"en\":\"New Taipei District Court concluded arguments in the intimidation trial of Taiwanese internet personality Chen Chih-han over a 2025 livestream remark targeting President Lai Ching-te. Chen maintained his not-guilty plea, claiming political persecution and media distortion, with the court scheduling its verdict for February 2, 2027. 一句重點結論：網紅「館長」陳之漢涉恐嚇公眾等罪案辯論終結，本人仍堅持無罪答辯，合議庭訂於明年 2 月 2 日宣判。\",\"zh-TW\":\"網紅「館長」陳之漢去年 10 月直播時揚言「把賴清德的狗頭斬下來」，遭新北地檢署依恐嚇公眾及恐嚇危害安全罪嫌起訴。新北地方法院 27 日辯論終結，陳之漢仍堅持無罪答辯，聲稱一切是政治迫害與媒體陷害，合議庭諭知將於明年 2 月 2 日上午宣判。一句重點結論：網紅「館長」陳之漢涉恐嚇公眾等罪案辯論終結，本人仍堅持無罪答辯，合議庭訂於明年 2 月 2 日宣判。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n網紅「館長」陳之漢（Chen Chih-han）去年 10 月在網路直播時，揚言「把賴清德的狗頭斬下來」，遭新北地檢署依恐嚇公眾及恐嚇危害安全罪嫌起訴（尚未經法院認定）。由於陳之漢在前兩次開庭時均拒不認罪，新北地方法院於 11 月 27 日再度開庭審理並進行辯論終結程序。陳之漢在庭上依然堅持無罪答辯，辯稱自己一直反對武統，整起案件都是政治迫害與媒體顛倒是非陷害他。合議庭訊後諭知全案辯論終結，訂於明年 2 月 2 日上午宣判。\\n\\n「為什麼重要」\\n具高網路聲量的公眾人物在直播中針對國家元首發表暴力言論，究竟屬於言論自由範疇或已構成刑法上的恐嚇犯罪，本案最終判決將成為台灣司法界定網路政治言論界線的重要指標。\\n\\n「來源異同」\\n聯合新聞網與 TVBS 新聞網針對起訴罪名、陳之漢庭上辯詞、27 日辯論終結及明年 2 月 2 日宣判日期等核心事實報導一致，無衝突之處。\\n\\n「仍不確定」\\n合議庭最終是否採信被告關於政治言論與非真實加害意圖的辯詞、是否判決有罪及具體刑度，均須待明年 2 月 2 日一審宣判後方能確定。\"},\"glossary\":[{\"term\":{\"en\":\"Public intimidation\",\"zh-TW\":\"恐嚇公眾罪\"},\"blurb\":{\"en\":\"An offense under Article 151 of Taiwan's Criminal Code involving threats to harm life, body, or property in a manner that endangers public safety.\",\"zh-TW\":\"台灣刑法第 151 條規定，以加害生命、身體、財產之事恐嚇公眾，致生危害於公安者所構成之罪名。\"}},{\"term\":{\"en\":\"Conclusion of oral arguments\",\"zh-TW\":\"辯論終結\"},\"blurb\":{\"en\":\"The procedural stage in a Taiwan court trial where both prosecution and defense finish presenting evidence and arguments prior to judicial deliberation and verdict.\",\"zh-TW\":\"法院審理程序中，檢辯雙方完成證據調查與法律意見陳述，進入合議庭評議並擇期宣判前的階段。\"}},{\"term\":{\"en\":\"Judicial panel\",\"zh-TW\":\"合議庭\"},\"blurb\":{\"en\":\"A panel of three judges—presiding judge, commissioned judge, and associate judge—who jointly hear and decide major criminal cases in Taiwan's district courts.\",\"zh-TW\":\"台灣地方法院審理特定刑事案件時，由審判長、受命法官與陪席法官共三人組成共同審判的法庭組織。\"}}],\"sources\":[{\"name\":\"聯合新聞網 UDN\",\"url\":\"https://udn.com/news/story/7321/9906258\"},{\"name\":\"TVBS 新聞
