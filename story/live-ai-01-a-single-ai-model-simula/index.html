learns to simulate across substances, so the same system can cover granular flows like sand and molecular processes like protein folding. The report comes from MIT News.\nWhy it matters\nSimulation is a bottleneck across science: materials, drug design, and climate modelling all depend on it, and specialist solvers are expensive to build and narrow in scope. A general model that works across processes could compress years of solver-building into a single system — if it holds up against the specialists it aims to replace.\nSources agree / disagree\nThis is a single-outlet report: only MIT News carries the story in this cluster, so no independent corroboration is available in the feed. Trust label: Single source — one outlet's reporting, not yet corroborated.\nStill uncertain\nThe snippets give no accuracy figures and no benchmarks against specialist solvers, so it is unclear whether the general model matches the tools it replaces. The range of substances tested, and the model's limits, are unknown from the feed."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-ai-01-a-single-ai-model-simula\",\"category\":\"ai\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-ai-01-a-single-ai-model-simula.jpg\",\"imageAlt\":{\"en\":\"A single AI model simulating substances from sand to proteins\",\"zh-TW\":\"單一 AI 模型模擬從流沙到蛋白質的多種物質\"},\"publishedAt\":\"2026-11-09T05:00:00.000Z\",\"title\":{\"en\":\"One AI Model Simulates Sand, Water, and Folding Proteins\",\"zh-TW\":\"一個 AI 模型通吃多種物質模擬：從流沙到蛋白質折疊\"},\"summary\":{\"en\":\"[Unconfirmed · single source] Researchers at MIT, the University of British Columbia, and elsewhere have built a single AI model that simulates the behaviour of many substances, from sliding sand to folding proteins. It replaces a patchwork of hand-coded solvers, each built for one physical process.\",\"zh-TW\":\"［未證實·單一來源］麻省理工學院（MIT）、英屬哥倫比亞大學（UBC）等團隊打造出單一 AI 模型，可模擬多種物質的行為，從流沙到蛋白質折疊。過去每種物理過程都要專用求解器，如今一個模型通吃，省去逐案手寫方程式的麻煩。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"想模擬物理過程的科學家，過去總要為每項工作挑對工具：模擬水流的求解器、模擬蛋白質折疊的求解器，每一個都要圍繞該過程的方程式手工編寫。麻省理工學院（MIT）、英屬哥倫比亞大學（UBC）等團隊如今打造出單一 AI 模型，可模擬多種物質的行為，從流沙到蛋白質折疊都行。\\n發生了什麼事\\n團隊用一個模型取代了各式專用求解器的拼湊組合。模型不再為每種過程手工編寫求解器，而是學會跨物質模擬，同一個系統既能處理流沙這類顆粒流動，也能處理蛋白質折疊這類分子過程。這則報導來自 MIT News。\\n為什麼重要\\n模擬是橫跨科學領域的瓶頸：材料、藥物設計、氣候建模都仰賴它，而專用求解器建置昂貴、適用範圍又窄。若通用模型能跨過程運作，可望把多年求解器開發壓縮成單一系統——前提是它真能匹敵被取代的專用工具。\\n來源異同\\n這是單一媒體的報導：本集群只有 MIT News 刊載此事，來源摘要裡沒有其他媒體佐證。信任標籤：單一來源——僅一家媒體報導，尚未獲得佐證。\\n仍不確定\\n來源摘要未提供準確度數字，也沒有與專用求解器的對照基準，無法判斷通用模型是否真能匹敵被取代的工具。測試的物質範圍與模型極限，摘要亦未說明。\"},\"sources\":[{\"name\":\"MIT News AI\",\"url\":\"https://news.mit.edu/2026/single-ai-model-simulates-many-substances-behavior-1109\"}],\"disagreements\":null,\"trustScore\":60,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":23,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"ai\",\"live-ingest\",\"mit-news-ai\"],\"glossary\":[{\"term\":{\"en\":\"MIT\",\"zh-TW\":\"麻省理工學院\"},\"blurb\":{\"en\":\"University whose researchers led the work on the general model.\",\"zh-TW\":\"主導這項通用模型研究的學府。\"}},{\"term\":{\"en\":\"UBC\",\"zh-TW\":\"英屬哥倫比亞大學\"},\"blurb\":{\"en\":\"University whose researchers contributed to the model.\",\"zh-TW\":\"參與這項模型研究的學府。\"}},{\"term\":{\"en\":\"Protein folding\",\"zh-TW\":\"蛋白質折疊\"},\"blurb\":{\"en\":\"Process by which a protein takes its functional shape.\",\"zh-TW\":\"蛋白質形成具功能形狀的過程。\"}},{\"term\":{\"en\":\"Solver\",\"zh-TW\":\"求解器\"},\"blurb\":{\"en\":\"Specialised software that computes how a physical process behaves.\",\"zh-TW\":\"專門計算物理過程行為的軟體。\"}},{\"term\":{\"en\":\"Simulation\",\"zh-TW\":\"模擬\"},\"blurb\":{\"en\":\"Computational modelling of physical processes.\",\"zh-TW\":\"以計算方式建模物理過程。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{
