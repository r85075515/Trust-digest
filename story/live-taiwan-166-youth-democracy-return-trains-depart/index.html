ld a departure press conference at Taipei Main Station and began dispatching its 2026 Youth Democracy Return-Home Trains. Funded through a public crowdfunding campaign that raised more than NT$1.2 million (with CNA reporting over NT$1.24 million), the program enables roughly 1,000 university students and young voters—including first-time voters—to travel back to their household registration districts at reduced ticket prices.\n\nMobilizing youth turnout has become a decisive variable in Taiwan's local elections, where close races in major municipalities can turn on small margins. By lowering intercity transit costs for students studying away from home, civic groups aim to boost participation among younger demographics.\n\nBoth the Central News Agency (CNA) and Radio Taiwan International (RTI) confirmed the November 27 departure from Taipei Main Station and the roughly 1,000 students assisted. CNA reported the crowdfunding total at over NT$1.24 million, whereas RTI cited the rounded figure of NT$1.2 million.\n\nThe final boarding rate across all scheduled routes and the ultimate impact of youth turnout on Saturday's municipal and county results will remain unknown until polls close.\nTrust label: Multi-source agreement — Taiwan's national wire service and public broadcaster both confirm the November 27 launch, funding scale, and student ridership."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-166-youth-democracy-return-trains-depart\",\"category\":\"taiwan\",\"title\":{\"en\":\"Taiwan Youth Democracy Return-Home Trains Depart Taipei Station After Raising Over NT1.2M for 1,000 Students\",\"zh-TW\":\"台灣青年民主返鄉列車台北車站啟程，募資逾 120 萬元助千名學子九合一投票\"},\"summary\":{\"en\":\"On November 27, 2026, the Taiwan Youth Association for Democracy launched its return-home election trains from Taipei Main Station ahead of Saturday's nine-in-one local elections. Crowdfunded with over NT1.2 million, the initiative subsidizes discounted fares for roughly 1,000 students and first-time voters returning to their registered districts.\",\"zh-TW\":\"2026 年九合一地方選舉投票前夕，台灣青年民主協會發起的「青年民主返鄉列車」於 11 月 27 日下午在台北車站正式啟程。該計畫透過群眾募資順利募集逾新台幣 120 萬元，協助約 1,000 名青年學子與首投族以優惠票價返鄉行使公民權，可望為各縣市關鍵選區注入年輕投票動能。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n2026 年九合一地方公職人員選舉投票前夕，台灣青年民主協會發起的「2026 青年民主返鄉列車」於 11 月 27 日下午在台北車站舉辦發車前記者會並陸續啟程。該計畫透過群眾募資順利募集超過新台幣 120 萬元（中央社報導為逾 124 萬元），協助約 1,000 名在外求學的青年學子與首投族以更實惠的交通成本返回戶籍地投票。\\n\\n「為什麼重要」\\n在雙北等選情膠著的都會區，年輕族群與首投族的實際投票率往往成為左右勝負的關鍵變數。公民團體透過群募補貼跨縣市返鄉車資，有效降低學生族群參與地方選舉的經濟門檻，強化新世代對地方治理的直接參與。\\n\\n「來源異同」\\n中央社與中央廣播電臺均一致報導返鄉列車於 11 月 27 日下午自台北車站發車，並協助約 1,000 名學生返鄉投票；僅在募資總金額細節上，中央社標明「募逾 124 萬元」，央廣則以「募集新台幣 120 萬元」概數呈現。\\n\\n「仍不確定」\\n各班次返鄉專車的最終實際搭乘率，以及青年選票流向對 11 月 28 日各縣市長與議員選情的實質拉抬幅度，仍有待投開票結果揭曉。\\nTrust label: Multi-source agreement — 中央社與中央廣播電臺均已現場採訪並核實發車時間、募資規模與受惠人數。\"},\"glossary\":[{\"term\":{\"en\":\"Nine-in-One Elections\",\"zh-TW\":\"九合一地方選舉\"},\"blurb\":{\"en\":\"Taiwan's quadrennial nationwide local elections consolidating nine categories of municipal, county, and township offices onto a single voting day.\",\"zh-TW\":\"台灣每四年舉行一次的全國性地方公職人員選舉，合併選出直轄市長、縣市長、議員及鄉鎮市長等九類公職。\"}},{\"term\":{\"en\":\"Household Registration District\",\"zh-TW\":\"戶籍地投票制\"},\"blurb\":{\"en\":\"Taiwan's electoral rule requiring citizens to cast ballots in person at the polling station tied to their registered permanent address.\",\"zh-TW\":\"台灣現行選舉制度規定選民須親自返回戶籍所在地指定的投開票所領票投票，不設不在籍投票。\"}},{\"term\":{\"en\":\"First-Time Voters\",\"zh-TW\":\"首投族\"},\"blurb\":{\"en\":\"Citizens who have reached the legal voting age of 20 since the previous election cycle and are eligible to cast a ballot for the first time.\",\"zh-TW\":\"自上次同類選舉以來年滿 20 歲法定投票年齡、首度具備投票資格的年輕選民群體。\"}}],\"sources\":[{\"name\":\"中央社 CNA\",\"url\":\"https://www.cna.com.tw/news/ahel/202611270155.aspx\"},{\"name\":\"中央廣播電臺 RTI\",\"url\":\"https://www.rti.org.tw/news?uid=3\u0026pid=1054103\"}],\"imageUrl\":\"/covers/live/live-taiwan-166-youth-democracy-return-trains-depart.jpg\",\"imageAlt\":{\"en\":\"Passengers boarding return-home election trains at Taipei Main Station\",\"zh-TW\":\"在台北車站排隊搭乘青年民主返鄉列車的旅客\"},\"isHeadline\":false,\"isPopular\":true,\"trustScore\":88,\"trustBreakdown\":{\"crossCorroboration\":23,\"outletReputation\":23,\"recencyClarity\":23,\"sourceDiversity\":19},\"publishedAt\":\"2026-11-27T18:06:35.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":5,\"D2\":4,\"D3\":4,\"D4\":4,\"D5\":4,\"total\":21},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-taiwan-166-youth-democracy-return-trains-depart/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-taiwan-166-youth-democracy-return-trains-depart/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"d:\"$
