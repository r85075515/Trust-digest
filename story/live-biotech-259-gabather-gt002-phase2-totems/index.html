uating GT-002, an investigational drug candidate targeting cognitive impairment associated with schizophrenia. The clinical trial is being conducted at the Center for Neuropsychiatric Schizophrenia Research (CNSR) at Mental Health Centre Glostrup, Copenhagen University Hospital, in Denmark.\n\n「Why it matters」\nCognitive impairment is a core debilitating symptom of schizophrenia that impairs memory, attention, and daily functioning, yet currently approved antipsychotic medications primarily target hallucinations and delusions with limited cognitive benefit. Advancing a targeted receptor modulator into Phase II patient dosing tests whether selective neural modulation can address this unmet medical need.\n\n「Source differences」\nPR Newswire published \"First patient dosed in Gabather's Phase II TOTEMS study of GT-002\", carrying Gabather AB's official corporate announcement specifying the trial site at the Center for Neuropsychiatric Schizophrenia Research at Mental Health Centre Glostrup. Clinical Trial Vanguard published \"Gabather's GT-002 enters Phase II trial for cognitive impairment in\", summarizing the clinical milestone and confirming the initiation of patient dosing at Copenhagen University Hospital.\n\n「Still uncertain」\nTotal patient enrollment targets, interim safety readouts, and primary efficacy completion dates for the Phase II TOTEMS trial have not yet been reported.\n\nTrust label: Single source — Industry reporting relies directly on Gabather AB's official corporate press release announcing the first patient dosing."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-biotech-259-gabather-gt002-phase2-totems\",\"category\":\"biotech\",\"title\":{\"en\":\"Gabather Doses First Patient in Phase II TOTEMS Trial of GT-002 for Schizophrenia\",\"zh-TW\":\"瑞典生技公司 Gabather 啟動思覺失調症新藥 GT-002 二期臨床試驗並完成首例給藥\"},\"summary\":{\"en\":\"Swedish biotech company Gabather AB announced on November 26, 2026, that the first patient has been dosed in its Phase II TOTEMS study evaluating drug candidate GT-002 for cognitive impairment associated with schizophrenia. The trial is conducted at Copenhagen University Hospital in Denmark.\",\"zh-TW\":\"瑞典生技公司 Gabather AB 於2026年11月26日宣布，旗下候選藥物 GT-002 針對思覺失調症相關認知障礙的二期臨床試驗「TOTEMS」已完成首例患者給藥。該試驗於丹麥哥本哈根大學附設醫院精神健康中心執行，標誌著該小分子療法正式邁入患者療效驗證階段。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n瑞典生技製藥公司 Gabather AB 於2026年11月26日宣布，針對思覺失調症相關認知障礙（CIAS）開發的候選藥物 GT-002，已在二期臨床試驗「TOTEMS」中完成首例患者給藥。該臨床試驗在丹麥哥本哈根大學附設醫院格洛斯楚普精神健康中心的神經精神思覺失調症研究中心（CNSR）執行。\\n\\n「為什麼重要」\\n認知功能障礙是思覺失調症的核心症狀之一，嚴重影響患者的記憶力、專注力與日常生活能力，但現有抗精神病藥物主要緩解幻覺與妄想，對認知改善效果有限。讓新型受體調節劑進入二期患者給藥階段，有助驗證精準神經調節能否填補此一未滿足的醫療需求。\\n\\n「來源異同」\\n美通社（PR Newswire）刊登 Gabather AB 官方新聞稿「First patient dosed in Gabather's Phase II TOTEMS study of GT-002」，完整載明試驗機構為格洛斯楚普精神健康中心神經精神思覺失調症研究中心。生技產業媒體 Clinical Trial Vanguard 則以「Gabather's GT-002 enters Phase II trial for cognitive impairment in」為題轉述此一臨床里程碑，確認哥本哈根大學附設醫院已啟動首例給藥。\\n\\n「仍不確定」\\nTOTEMS 二期臨床試驗的預計總收案人數、期中安全性數據公布時程及主要療效指標完成日期，目前尚未對外披露。\\n\\nTrust label: Single source — 產業媒體報導均引述自 Gabather AB 發布的單一官方企業新聞稿。\"},\"glossary\":[{\"term\":{\"en\":\"Cognitive Impairment Associated with Schizophrenia (CIAS)\",\"zh-TW\":\"思覺失調症相關認知障礙\"},\"blurb\":{\"en\":\"Deficits in memory, attention, processing speed, and executive function commonly experienced by individuals with schizophrenia.\",\"zh-TW\":\"思覺失調症患者常見的記憶力、專注力、資訊處理速度與執行功能缺損。\"}},{\"term\":{\"en\":\"Phase II Clinical Trial\",\"zh-TW\":\"二期臨床試驗\"},\"blurb\":{\"en\":\"A stage of drug testing in patients with the target condition to evaluate preliminary efficacy, optimal dosing, and short-term safety.\",\"zh-TW\":\"在患有目標疾病的受試者身上測試藥物初步療效、最佳劑量與短期安全性的臨床研究階段。\"}},{\"term\":{\"en\":\"GABAA Receptor Modulator\",\"zh-TW\":\"GABAA 受體調節劑\"},\"blurb\":{\"en\":\"A compound that selectively adjusts the activity of gamma-aminobutyric acid type A receptors to regulate neural signaling in the brain.\",\"zh-TW\":\"一種選擇性調節大腦中 γ-胺基丁酸 A 型受體活性、進而調控神經訊號傳遞的化合物。\"}}],\"sources\":[{\"name\":\"PR Newswire\",\"url\":\"https://www.prnewswire.com/news-releases/first-patient-dosed-in-gabathers-phase-ii-totems-study-of-gt-002-302951320.html\"},{\"name\":\"Clinical Trial Vanguard\",\"url\":\"https://www.clinicaltrialvanguard.com/news/gabathers-gt-002-enters-phase-ii-trial-for-cognitive-impairment-in-schizophrenia/\"}],\"imageUrl\":\"/covers/live/live-biotech-259-gabather-gt002-phase2-totems.jpg\",\"imageAlt\":{\"en\":\"Gabather Doses First Patient in Phase II TOTEMS Trial of GT-002 for Schizophrenia\",\"zh-TW\":\"瑞典生技公司 Gabather 啟動思覺失調症新藥 GT-002 二期臨床試驗並完成首例給藥\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":74,\"trustBreakdown\":{\"crossCorroboration\":16,\"outletReputation\":21,\"recencyClarity\":23,\"sourceDiversity\":14},\"publishedAt\":\"2026-11-27T22:39:49.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":23,\"D2\":22,\"D3\":22,\"D4\":22,\"D5\":21,\"total\":22},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-biotech-259-gabather-gt002-phase2-totems/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-biotech-259-gabather-gt002-phase2-tot
