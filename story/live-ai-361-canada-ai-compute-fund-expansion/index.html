Compute Access Fund, raising total program funding from 300 million CAD to 1 billion CAD through March 31, 2030. The government also announced more than 52 million CAD in new funding commitments across 45 small and medium-sized enterprises (SMEs), bringing cumulative support to over 118 million CAD for 89 companies. Under updated tiered rules, projects using sovereign Canadian-owned providers qualify for up to 80% coverage of eligible costs, compared with up to 50% for other eligible providers, with the first new themed call targeting health and life sciences.\n\nWhy it matters\nCompute access has become a core bottleneck for domestic AI startups competing against well-capitalized foreign rivals. By tying higher reimbursement rates to Canadian incorporation, domestic ownership, and local data residency, Ottawa is using public subsidies to stimulate demand for homegrown cloud providers while advancing its broader pledge to bring 500 megawatts of sovereign AI compute online.\n\nSource differences\nThe official Innovation, Science and Economic Development Canada release titled \"Government of Canada boosts AI innovation from Canadian SMEs with $700 million expansion of the AI Compute Access Fund\" frames the announcement around the 45 newly funded recipients, job creation projections under the AI for All strategy, and the opening of the health and life sciences application call. Crypto Briefing's article \"Canada adds $700 million to its AI compute fund, with a nudge toward homegrown providers\" and The Next Web's report \"Canada adds C$700M to its AI compute fund, favouring home-grown clouds\" detail the 80% versus 50% tiered subsidy split, project funding caps between 100,000 CAD and 5 million CAD, and the December 17, 2026 preliminary interest deadline.\n\nStill uncertain\nWhether Canadian-owned cloud providers have sufficient GPU capacity and competitive pricing to absorb the subsidized SME demand before the program expires in March 2030 remains unclear. Trust label: Official confirmation — backed by the Innovation, Science and Economic Development Canada news release and corroborated by independent technology outlets."])</script><script>self.__next_f.push([1,"11:T849,"])</script><script>self.__next_f.push([1,"「發生了什麼事」\n加拿大人工智慧與數位創新部長所羅門（Evan Solomon）於 2026 年 11 月 26 日在多倫多宣布，為「AI 算力取用基金」（AI Compute Access Fund）追加 7 億加元資金，使這項執行至 2030 年 3 月 31 日的計畫總額由原本的 3 億加元增至 10 億加元。官方同步公布向 45 家中小企業核撥逾 5,200 萬加元新承諾資金，累計已補助 89 家企業超過 1.18 億加元。依新版分級規則，企業若選用加拿大本土持有並境內處理資料的主權算力供應商，最高可獲 80% 合格成本補助，其餘合格供應商則為最高 50%，首波主題徵件鎖定健康與生命科學領域。\n\n「為什麼重要」\n算力取得成本已成為中小型 AI 新創與跨國巨頭競爭的主要瓶頸。渥太華透過差別補助率，將企業註冊地、本土所有權與資料在地化納入誘因設計，既替本地雲端業者創造穩定需求，也配合 2026 年預算案建置 500 兆瓦主權 AI 算力的長期基礎設施目標。\n\n「來源異同」\n加拿大創新、科學及經濟發展部一手新聞稿「Government of Canada boosts AI innovation from Canadian SMEs with $700 million expansion of the AI Compute Access Fund」重點放在 45 家獲補助企業名單、AI for All 策略下的就業成長預估，以及健康與生命科學徵件啟動。科技媒體 Crypto Briefing「Canada adds $700 million to its AI compute fund, with a nudge toward homegrown providers」與 The Next Web「Canada adds C$700M to its AI compute fund, favouring home-grown clouds」則進一步拆解 80% 與 50% 的分級補助比例、單案 10 萬至 500 萬加元的補助區間，以及 2026 年 12 月 17 日初步意向截止時程。\n\n「仍不確定」\n加拿大本土雲端供應商在 2030 年 3 月補助結束前，是否具備足夠的晶片供給量與具競爭力的定價以承接中小企業需求，仍有待後續執行觀察。Trust label: Official confirmation — 以加拿大創新、科學及經濟發展部官方新聞稿為一手依據，並獲多家科技媒體細節佐證。"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-ai-361-canada-ai-compute-fund-expansion\",\"category\":\"ai\",\"title\":{\"en\":\"Canada Adds 700 Million CAD to AI Compute Fund, Favoring Domestic Cloud Providers\",\"zh-TW\":\"加拿大增資 7 億加元擴大 AI 算力基金，優先補助本土雲端供應商\"},\"summary\":{\"en\":\"Canada added 700 million CAD to its AI Compute Access Fund on November 26, 2026, bringing total funding to 1 billion CAD and offering up to 80% cost subsidies for SMEs using sovereign Canadian cloud infrastructure.\",\"zh-TW\":\"加拿大於 2026 年 11 月 26 日宣布為「AI 算力取用基金」增資 7 億加元，使基金總規模擴增至 10 億加元，並採分級補助制度，中小企業若採用加拿大本土主權雲端供應商，最高可獲 80% 合格成本補助，藉此強化主權算力生態並降低對外國雲端基礎設施的依賴。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"$11\"},\"glossary\":[{\"term\":{\"en\":\"Sovereign AI compute\",\"zh-TW\":\"主權 AI 算力\"},\"blurb\":{\"en\":\"AI data center and cloud processing infrastructure owned, operated, and physically located within a country's jurisdiction to ensure data residency and strategic autonomy.\",\"zh-TW\":\"由本國企業持有、營運且實體伺服器設於境內的 AI 資料中心與雲端運算基礎設施，用以確保資料主權與技術自主。\"}},{\"term\":{\"en\":\"Data residency\",\"zh-TW\":\"資料在地化\"},\"blurb\":{\"en\":\"The requirement that digital data be stored and processed within specific national borders under domestic laws.\",\"zh-TW\":\"要求數位資料必須儲存並處理於特定國家境內，以受本國法律管轄的規範。\"}},{\"term\":{\"en\":\"Tiered subsidy model\",\"zh-TW\":\"分級補助模式\"},\"blurb\":{\"en\":\"A government funding structure offering higher reimbursement rates when applicants meet preferred policy criteria, such as buying from domestic suppliers.\",\"zh-TW\":\"政府依申請者是否符合特定政策條件（例如採購本土供應商服務）而給予不同補助比例的財務支持機制。\"}}],\"sources\":[{\"name\":\"Government of Canada\",\"url\":\"https://www.canada.ca/en/innovation-science-economic-development/news/2026/11/government-of-canada-boosts-the-ai-compute-access-fund-with-700-million-expansion.html\"},{\"name\":\"Crypto Briefing\",\"url\":\"https://cryptobriefing.com/canada-700-million-ai-compute-fund/\"},{\"name\":\"The Next Web\",\"url\":\"https://thenextweb.com/news/canada-ai-compute-access-fund-700m-expansion\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"Canada Adds 700 Million CAD to AI Compute Fund, Favoring Domestic Cloud Providers\",\"zh-TW\":\"加拿大增資 7 億加元擴大 AI 算力基金，優先補助本土雲端供應商\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":91,\"trustBreakdown\":{\"crossCorroboration\":23,\"outletReputation\":24,\"recencyClarity\":23,\"sourceDiversity\":21},\"publishedAt\":\"2026-11-28T04:58:14.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":23,\"D2\":22,\"D3\":23,\"D4\":22,\"D5\":23,\"total\":23},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\
