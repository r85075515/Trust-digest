ed on Friday, November 27, that it has selected Chinese biotech startup InnoTar Therapeutics as the grand prize winner and first participating company under its open-innovation initiative run jointly with global life sciences R\u0026D platform ATLATL. Through the C-Lab Outside–linked program, InnoTar will receive dedicated research funding, laboratory infrastructure, and commercialization support to advance its next-generation protein degradation platform.\n\nOriginally built on biosimilars, Samsung Bioepis is expanding its early-stage pipeline into novel drug modalities, turning to cross-border open innovation to source differentiated oncology and immunology candidates.\n\nOfficial PR Newswire announcements from ATLATL and reports from The Korea Herald and Korea Biomedical Review agree on the November 27 announcement, InnoTar's selection as the inaugural partner, and the focus on targeted protein degradation technology.\n\nSpecific financial grant amounts, intellectual property licensing terms, and clinical trial entry timelines for InnoTar's lead compounds have not been disclosed.\n\nTrust label: Official statement — Verified via ATLATL press release and corroborated by South Korean business and biomedical media."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-biotech-098-samsung-bioepis-atlatl-innotar-protein-degradation\",\"category\":\"biotech\",\"title\":{\"en\":\"Samsung Bioepis Taps Chinese Biotech InnoTar Therapeutics for Next-Gen Protein Degradation R\u0026D\",\"zh-TW\":\"三星 Bioepis 攜手中國生技新創 InnoTar 開發次世代蛋白降解抗癌療法\"},\"summary\":{\"en\":\"Samsung Bioepis selected Shanghai-based InnoTar Therapeutics as the first startup under its joint innovation program with ATLATL, providing research and commercialization support for next-generation protein degradation therapies.\",\"zh-TW\":\"南韓生技大廠三星 Bioepis（Samsung Bioepis）於 11 月 27 日宣布，選定中國生技新創公司 InnoTar Therapeutics 作為其與研發創新平台 ATLATL 合作計畫的首家入選企業，雙方將共同推進次世代標靶蛋白降解（TPD）新藥的研發與商業化。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」南韓生技大廠三星 Bioepis（Samsung Bioepis）於 11 月 27 日宣布，與全球生命科學研發創新平台 ATLATL 共同舉辦的開放式創新計畫正式揭曉首屆大獎得主，由中國生技新創公司 InnoTar Therapeutics 獲選為首家合作夥伴。InnoTar 將獲得研發資金、實驗室設施與商業化輔導支援，加速開發次世代標靶蛋白降解技術。\\n\\n「為什麼重要」三星 Bioepis 過去以生物相似藥（Biosimilars）聞名全球，近年積極向原創新藥研發轉型。此次透過「C-Lab Outside」跨境育成機制納編中國新創的蛋白降解技術，顯示亞洲大型藥廠正加速透過外部創新模式搶攻抗癌與自體免疫新藥賽道。\\n\\n「來源異同」ATLATL 透過美通社（PR Newswire）發布的官方新聞稿，以及《韓國先驅報》（The Korea Herald）與《韓國生醫評論》（Korea Biomedical Review）在 11 月 27 日發布的報導在合作架構、首家入選企業身分及蛋白降解技術方向上完全一致。\\n\\n「仍不確定」三星 Bioepis 提供給 InnoTar Therapeutics 的具體資金規模、後續藥物授權（Licensing）權利金與優先收購條款，以及候選藥物預計進入臨床一期試驗的時程，均未在本次公告中揭露。\\n\\nTrust label: Official statement — Verified via ATLATL press release and corroborated by South Korean business and biomedical media.\"},\"glossary\":[{\"term\":{\"en\":\"Targeted Protein Degradation (TPD)\",\"zh-TW\":\"標靶蛋白降解（TPD）\"},\"blurb\":{\"en\":\"A drug modality that harnesses the cell's natural waste-disposal system (ubiquitin-proteasome pathway) to destroy disease-causing proteins rather than merely inhibiting them.\",\"zh-TW\":\"利用細胞自身的蛋白質清除系統（泛素-蛋白酶體途徑）直接分解致病蛋白的新興製藥技術，可攻克傳統小分子藥物難以結合的標靶。\"}},{\"term\":{\"en\":\"Biosimilar\",\"zh-TW\":\"生物相似藥\"},\"blurb\":{\"en\":\"A biologic medical product highly similar to an already approved reference biologic drug with no clinically meaningful differences in safety or efficacy.\",\"zh-TW\":\"在品質、安全性與療效上與已核准的原廠生物製劑高度相似的生物藥品，通常在原廠專利到期後上市。\"}},{\"term\":{\"en\":\"Open Innovation\",\"zh-TW\":\"開放式創新\"},\"blurb\":{\"en\":\"An R\u0026D strategy in which large corporations partner with external startups, academic labs, and incubators to co-develop new technologies.\",\"zh-TW\":\"大型企業透過育成計畫、外部合作或授權引進新創與學研機構的早期技術，以加速產品線擴張的研發模式。\"}}],\"sources\":[{\"name\":\"PR Newswire Asia\",\"url\":\"https://www.prnewswire.com/apac/news-releases/atlatl-names-innotar-therapeutics-grand-prize-winner-of-samsung-bioepis-innovation-prize-c-lab-outside-302951598.html\"},{\"name\":\"The Korea Herald\",\"url\":\"https://www.koreaherald.com/article/10951731\"},{\"name\":\"Korea Biomedical Review\",\"url\":\"https://www.koreabiomed.com/news/articleViewAmp.html?idxno=34012\"}],\"imageUrl\":\"/covers/live/live-biotech-098-samsung-bioepis-atlatl-innotar-protein-degradation.jpg\",\"imageAlt\":{\"en\":\"Samsung Bioepis and ATLATL innovation partnership with InnoTar Therapeutics\",\"zh-TW\":\"三星 Bioepis 與 ATLATL 選定 InnoTar Therapeutics 展開研發合作\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":85,\"trustBreakdown\":{\"crossCorroboration\":22,\"outletReputation\":21,\"recencyClarity\":22,\"sourceDiversity\":20},\"publishedAt\":\"2026-11-27T15:40:20.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":5,\"D2\":4,\"D3\":4,\"D4\":4,\"D5\":4,\"total\":21},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-biotech-098-samsung-bioepis-atlatl-innotar-protein-degradation/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-biotech-098-samsung-bioepis-atlatl-innotar-protein-degradation/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"conte
