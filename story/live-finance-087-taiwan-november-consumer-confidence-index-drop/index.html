rted on November 27, 2026, that Taiwan's Consumer Confidence Index (CCI) edged down 0.36 points from October to 65.91. Based on 3,259 valid responses from adults aged 20 and older, five of the six sub-indices either improved or held steady, leaving sentiment toward stock market investing over the next six months as the sole drag on the headline figure.\n\nThe divergence between strong macroeconomic indicators and cautious retail investor sentiment underscores how sharp equity swings influence household wealth perceptions. Economists cited in the survey briefing noted that structural shifts in artificial intelligence hardware expectations contributed to recent market turbulence.\n\nFocus Taiwan (CNA) and SETN both reported the 65.91 headline index, the 0.36-point monthly decline, and the drop in stock investment confidence, with CNA highlighting academic commentary on structural transitions in the AI sector.\n\nWhether equity market stabilization in December will lift retail investor sentiment back into positive territory remains uncertain amid ongoing global trade policy adjustments.\n\nTrust label: Multi-source agreement — Survey figures, sample size, and sub-index movements were verified across Focus Taiwan (CNA) and SETN."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-087-taiwan-november-consumer-confidence-index-drop\",\"category\":\"finance\",\"title\":{\"en\":\"Taiwan Consumer Confidence Edges Down in November on Stock Market Jitters\",\"zh-TW\":\"台股震盪拖累投資信心，台灣11月消費者信心指數微降至65.91點\"},\"summary\":{\"en\":\"Taiwan's Consumer Confidence Index dipped 0.36 points month-on-month to 65.91 in November 2026, dragged down solely by declining sentiment toward stock market investments. While four sub-indicators rose, equity volatility tempered household optimism despite robust macroeconomic growth forecasts.\",\"zh-TW\":\"中央大學台灣經濟發展研究中心公布2026年11月消費者信心指數（CCI）為65.91點，較10月微幅下滑0.36點，六項分項指標中僅「未來半年投資股票時機」明顯下挫並成為唯一拖累項目。調查顯示儘管總體經濟數據亮眼，近期台股劇烈震盪仍使民眾對股市投資轉趨保守。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」國立中央大學台灣經濟發展研究中心於2026年11月27日發布11月消費者信心指數（CCI）調查結果，總指數為65.91點，較10月微幅下降0.36點。本次調查共收集3,259份20歲以上民眾有效樣本，六項分項指標呈現4升、1平、1降，其中僅「未來半年投資股票時機」指標顯著下滑，成為拉低整體指數的主因。\\n\\n「為什麼重要」台灣近期出口與經濟成長表現強勁，但民間消費信心卻受股市大幅波動牽動而微幅降溫，顯示金融市場震盪直接影響家戶財富感受與投資意願。學者亦在記者會中指出，人工智慧（AI）產業面臨結構性轉變，使投資人對科技股評價更為審慎。\\n\\n「來源異同」中央社與三立新聞網均完整報導CCI總指數65.91點、月減0.36點及股市投資指標獨自下挫的調查結構；中央社進一步引述學者對AI產業結構轉變與股市上沖下洗的分析。\\n\\n「仍不確定」年底消費旺季與12月台股走勢能否帶動投資信心指標回溫，仍取決於國際科技股財報表現與美國關稅政策後續發展。\"},\"glossary\":[{\"term\":{\"en\":\"Consumer Confidence Index (CCI)\",\"zh-TW\":\"消費者信心指數\"},\"blurb\":{\"en\":\"A monthly economic indicator measuring household optimism regarding employment, prices, income, durable goods, and stock investments.\",\"zh-TW\":\"衡量民眾對未來半年就業、物價、家庭經濟、耐久性財貨購買及投資股票時機樂觀程度的月度經濟指標。\"}},{\"term\":{\"en\":\"Sub-index\",\"zh-TW\":\"分項指標\"},\"blurb\":{\"en\":\"An individual component category that feeds into the calculation of a composite economic index.\",\"zh-TW\":\"構成綜合經濟指數的各別調查項目，用於觀察特定領域的信心變化。\"}},{\"term\":{\"en\":\"Margin of error\",\"zh-TW\":\"抽樣誤差\"},\"blurb\":{\"en\":\"A statistical measure indicating the range within which true population values are expected to fall given a survey sample.\",\"zh-TW\":\"統計抽樣調查中用來表示樣本結果與母體真實數值之間可能偏差範圍的指標。\"}}],\"sources\":[{\"name\":\"Focus Taiwan (CNA)\",\"url\":\"https://focustaiwan.tw/business/202611270009\"},{\"name\":\"CNA\",\"url\":\"https://www.cna.com.tw/news/afe/202611270075.aspx\"},{\"name\":\"SETN\",\"url\":\"https://inews.setn.com/news/1946093\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"Stock market trading board displaying fluctuating share prices in Taipei\",\"zh-TW\":\"顯示股價波動走勢的台北股市交易看板\"},\"isHeadline\":false,\"isPopular\":true,\"trustScore\":89,\"trustBreakdown\":{\"crossCorroboration\":24,\"outletReputation\":23,\"recencyClarity\":22,\"sourceDiversity\":20},\"publishedAt\":\"2026-11-27T15:27:43.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":5,\"D2\":4,\"D3\":5,\"D4\":4,\"D5\":4,\"tot
