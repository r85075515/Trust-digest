 it successfully completed its 101st Electron rocket launch from Launch Complex 1 in Mahia, New Zealand, deploying the 14th synthetic aperture radar (SAR) satellite for Japanese Earth-observation operator Synspective's StriX constellation. The flight maintained Rocket Lab's 100 percent mission success rate across dedicated launches for Synspective.\n\nReaching 101 flights underscores the commercial maturity of dedicated small-satellite launch vehicles as global demand for all-weather radar imaging grows across disaster monitoring and infrastructure analytics. Chief Executive Officer Sir Peter Beck (彼得・貝克) stated that more than 55 spacecraft are currently in development and production at the company, with booked missions across Electron, HASTE, and Neutron exceeding $1 billion.\n\nRocket Lab's official investor release, SpaceWatch.Global, and Starlust all confirmed the 101st mission milestone and deployment of the StriX satellite, while KuCoin market coverage noted Rocket Lab shares rose 5.10 percent to $49.42 in premarket trading on November 27.\n\nRocket Lab has not yet disclosed the exact target launch window for the next dedicated StriX constellation mission or the maiden orbital flight date for its medium-lift Neutron rocket.\n\nTrust label: Multi-source agreement — Mission success, payload details, and backlog figures were verified through Rocket Lab's official release and independent aerospace outlets."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-082-rocket-lab-101st-electron-synspective-launch\",\"category\":\"international\",\"title\":{\"en\":\"Rocket Lab Completes 101st Electron Mission, Deploying Synspective Radar Satellite\",\"zh-TW\":\"Rocket Lab 完成第101次電子號火箭發射，成功部署日本 Synspective 雷達觀測衛星\"},\"summary\":{\"en\":\"Rocket Lab successfully launched its 101st Electron mission from Mahia, New Zealand, deploying the 14th synthetic aperture radar satellite for Japanese Earth-observation company Synspective. The milestone cements Electron's rapid commercial launch cadence while lifting Rocket Lab shares in premarket trading.\",\"zh-TW\":\"航太公司 Rocket Lab 於紐西蘭馬希亞半島發射場順利完成第101次「電子號」（Electron）火箭任務，成功將日本地球觀測企業 Synspective 旗下第14顆合成孔徑雷達衛星送入軌道。此次任務延續該公司對該客戶的百分之百發射成功率，帶動盤前股價走揚。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」航太發射服務商 Rocket Lab 於2026年11月26日至27日宣布，從紐西蘭馬希亞半島（Mahia）一號發射場成功執行第101次「電子號」（Electron）小型運載火箭任務，順利將日本地球觀測公司 Synspective 旗下 StriX 衛星星系的第14顆合成孔徑雷達（SAR）衛星送入預定軌道，並維持對該客戶專屬發射任務100%的成功率。\\n\\n「為什麼重要」突破百次商業發射里程碑顯示小型專屬運載火箭已具備高度穩定的常態化運作能力，滿足全球對全天候雷達影像在防災監測與基礎設施分析上的需求。執行長彼得・貝克（Sir Peter Beck）同時透露，公司目前有超過55具太空船正處於研發與製造階段，涵蓋 Electron、HASTE 與 Neutron 火箭的在手訂單總值超過10億美元。\\n\\n「來源異同」Rocket Lab 官方投資人新聞稿、航太媒體 SpaceWatch.Global 與 Starlust 均證實第101次任務成功及部署 Synspective 衛星細節；財經快訊平台 KuCoin 則進一步指出，受發射成功激勵，Rocket Lab 股價於11月27日盤前交易上漲5.10%至49.42美元。\\n\\n「仍不確定」Rocket Lab 尚未公布下一顆 Synspective 衛星的具體發射窗口，以及中型可重複使用火箭 Neutron 的確切首飛日期。\"},\"glossary\":[{\"term\":{\"en\":\"Synthetic aperture radar (SAR)\",\"zh-TW\":\"合成孔徑雷達\"},\"blurb\":{\"en\":\"An active microwave imaging technology capable of capturing high-resolution Earth surface imagery day and night regardless of cloud cover.\",\"zh-TW\":\"利用微波主動探測並透過訊號處理提升解析度的雷達成像技術，可全天候穿透雲層觀測地表。\"}},{\"term\":{\"en\":\"Dedicated launch\",\"zh-TW\":\"專屬發射任務\"},\"blurb\":{\"en\":\"A rocket mission contracted by a single customer to deploy its payload into a customized orbital inclination and altitude.\",\"zh-TW\":\"由單一客戶包下整枚火箭運力，將衛星精準送入客製化軌道傾角與高度的發射服務。\"}},{\"term\":{\"en\":\"Suborbital launch vehicle\",\"zh-TW\":\"亞軌道運載火箭\"},\"blurb\":{\"en\":\"A rocket designed to reach space altitudes for hypersonic or microgravity testing without completing a full orbit around Earth.\",\"zh-TW\":\"飛行高度進入太空邊緣進行高超音速或微重力測試、但未達環繞地球軌道速度的火箭載具。\"}}],\"sources\":[{\"name\":\"Rocket Lab Investor Relations\",\"url\":\"https://investors.rocketlabcorp.com/news-releases/news-release-details/mission-success-rocket-lab-launches-101st-electron-mission\"},{\"name\":\"SpaceWatch.Global
