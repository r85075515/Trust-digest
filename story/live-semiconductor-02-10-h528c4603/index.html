 NT$1 billion public tender is a scale of order that changes a supplier's standing, and the strategic label matters as much as the money: winning as a non-China supplier positions Dongyou for further government drone work as Taipei builds domestic capacity. The transport category also points to logistics and delivery uses, not just surveillance, widening the market for the company's aircraft.\nSources agree / disagree\nThis card rests on a single TechNews report, so there is no second outlet to check the award or the NT$1 billion figure against. Trust label: Single source — one outlet reported the tender win.\nStill uncertain\nThe snippet gives no breakdown of the NT$1 billion value, no delivery timetable, and no specifications for the transport drones. Verify details in the full reporting before quoting specifics."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-02-10-h528c4603\",\"category\":\"semiconductor\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-semiconductor-02-10-h528c4603.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 台銀無人機 10 億採購大單！東友得標「運輸無人機」殺進非紅供應鏈\",\"zh-TW\":\"相關封面圖：台銀無人機 10 億採購大單！東友得標「運輸無人機」殺進非紅供應鏈\"},\"publishedAt\":\"2026-11-05T07:42:41.000Z\",\"title\":{\"en\":\"Dongyou Technology Wins Bank of Taiwan's NT$1 Billion Transport Drone Tender\",\"zh-TW\":\"東友科技拿下台銀 10 億無人機採購案，搶進運輸無人機市場\"},\"summary\":{\"en\":\"[Unconfirmed — single source] Dongyou Technology won the transport drone lot in Bank of Taiwan's joint drone procurement contract, rated the most advantageous bid, TechNews reported. The NT$1 billion order puts the company into the non-China drone supply chain for public-sector buyers.\",\"zh-TW\":\"［未證實·單一來源］東友科技拿下台灣銀行（Bank of Taiwan）採購部「無人機組」共同供應契約中的「運輸用無人機組」品項，獲評最有利標。10 億元採購大單讓東友打進非紅供應鏈，後續出貨與訂單規模值得追蹤。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"東友科技拿下台灣銀行（Bank of Taiwan）採購部「無人機組」共同供應契約中的「運輸用無人機組」品項，獲評選為最有利標。科技新報（TechNews）11 月 5 日報導。\\n發生了什麼事\\n東友科技宣布取得台灣銀行採購部「無人機組」共同供應契約中「運輸用無人機組」品項決標，獲評選為最有利標得標廠商。標題指出這是 10 億元採購大單，是公部門無人機的大筆訂單。這次得標讓東友打進非紅供應鏈，也就是中國大陸以外的供應鏈，公部門買家近年來正轉向這類供應商。\\n為什麼重要\\n10 億元的公部門標案足以改變一家供應商的地位，戰略標籤與金額同樣重要：以非紅供應商身分得標，東友未來有機會爭取更多政府無人機標案。運輸用無人機也指向物流與運送用途，不只是監偵，擴大了公司產品的市場。\\n來源異同\\n本卡只有科技新報一篇報導，沒有第二家媒體可以核對得標消息或 10 億元數字。信任標籤：單一來源——只有一家媒體報導得標消息。\\n仍不確定\\n來源摘要沒有 10 億元的金額細分、交貨時程，也沒有運輸無人機的規格；引用細節前請查閱完整報導。\"},\"sources\":[{\"name\":\"TechNews 科技新報\",\"url\":\"https://finance.technews.tw/2026/11/05/drone-units-for-transport/\"}],\"disagreements\":null,\"trustScore\":47,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":10,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"semiconductor\",\"live-ingest\",\"technews-科技新報\"],\"glossary\":[{\"term\":{\"en\":\"Dongyou Technology\",\"zh-TW\":\"東友科技\"},\"blurb\":{\"en\":\"Taiwanese company that won the transport drone lot in Bank of Taiwan's procurement.\",\"zh-TW\":\"拿下台銀運輸無人機標案的台灣公司。\"}},{\"term\":{\"en\":\"Bank of Taiwan\",\"zh-TW\":\"台灣銀行\"},\"blurb\":{\"en\":\"Taiwan's state-owned bank, whose procurement department ran the drone tender.\",\"zh-TW\":\"主辦無人機採購的台灣公股銀行。\"}},{\"term\":{\"en\":\"TechNews\",\"zh-TW\":\"科技新報\"},\"blurb\":{\"en\":\"Taiwanese technology news outlet, the sole source for this card.\",\"zh-TW\":\"報導得標消息的台灣科技新聞媒體，本卡的唯一來源。\"}},{\"term\":{\"en\":\"Transport drone\",\"zh-TW\":\"運輸無人機\"},\"blurb\":{\"en\":\"Drone category for carrying goods, the lot Dongyou won.\",\"zh-TW\":\"東友得標的無人機品項，用於運送物品。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"re
