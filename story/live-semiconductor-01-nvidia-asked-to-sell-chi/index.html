ent of War classifies as \"Chinese military companies\" helping Beijing build its military.\n\nWhat happened\nThe disclosure came from Brian Mast, chair of the House Foreign Affairs Committee, who asked BIS to provide information about Nvidia's and AMD's sales. Lawmakers released confidential information showing the Commerce Department had approved sales of more than 800,000 AI chips to Chinese companies, some with military ties. The Register describes the scale as \"bucketloads of chips,\" while the New York Times headline names Nvidia and Megaspeed, a company tied to the Chinese military, though the snippets do not explain Megaspeed's role.\n\nWhy it matters\nThe judgment here is about enforcement, not technology: the same department that restricts advanced chips also approved more than 800,000 of them for sale to firms on a military-companies list. That contradiction is why a congressional chairman, rather than the department itself, is the source of the disclosure.\n\nSources agree / disagree\nThe Register and the New York Times agree on the core facts: BIS approved large-scale GPU sales to military-linked Chinese companies, and the disclosure came through the House Foreign Affairs Committee. The figures are consistent — \"hundreds of thousands\" in one account and \"more than 800,000\" in the other describe the same scale, and the two phrasings involve no substantive conflict.\n\nStill uncertain\nThe snippets do not say which Nvidia or AMD chip models were approved, when the approvals were granted, what Megaspeed bought or did, or whether any sales have been blocked since. The full list of recipient companies is not in the snippets.\n\nTrust label: Two-source agreement — The Register and the New York Times agree BIS approved large GPU sales to military-linked Chinese firms, with consistent figures."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-01-nvidia-asked-to-sell-chi\",\"category\":\"semiconductor\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-semiconductor-01-nvidia-asked-to-sell-chi.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Nvidia Asked to Sell Chips to Companies Tied to Chinese Military and Megaspeed\",\"zh-TW\":\"相關封面圖：Nvidia 被要求向與中國軍方和 Megaspeed 相關的公司出售晶片\"},\"publishedAt\":\"2026-11-20T04:04:56.000Z\",\"title\":{\"en\":\"Nvidia and AMD Cleared to Sell Hundreds of Thousands of AI Chips to Military-Linked Chinese Firms\",\"zh-TW\":\"輝達（Nvidia）與超微（AMD）獲准向中國軍方關聯企業出售數十萬枚晶片\"},\"summary\":{\"en\":\"The Bureau of Industry and Security allowed Nvidia and AMD to sell hundreds of thousands of GPUs to entities the Department of War classifies as Chinese military companies. Lawmakers released information showing approvals for more than 800,000 AI chips to Chinese firms, some with military ties. The disclosure came from Representative Brian Mast, chair of the House Foreign Affairs Committee.\",\"zh-TW\":\"美國商務部工業與安全局（Bureau of Industry and Security）允許輝達（Nvidia）與超微（AMD），向被戰爭部（Department of War）列為中國軍事公司的實體出售數十萬枚先進圖形處理器（GPU）。議員公開的機密資料顯示，商務部已批准向中國企業出售逾八十萬枚人工智慧晶片，部分企業與軍方有關聯。消息來自眾議院外交事務委員會主席布萊恩·馬斯特（Brian Mast）。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"美國商務部工業與安全局（Bureau of Industry and Security）允許輝達（Nvidia）與超微（AMD），向被戰爭部（Department of War）列為中國軍事公司的實體出售數十萬枚先進圖形處理器（GPU），這些實體協助北京建設軍隊。\\n\\n發生了什麼事\\n消息來自眾議院外交事務委員會主席布萊恩·馬斯特（Brian Mast），他要求工業與安全局（Bureau of Industry and Security）提供輝達（Nvidia）與超微（AMD）的銷售資料。議員公開的機密資料顯示，商務部已批准向中國企業出售逾八十萬枚人工智慧晶片，部分企業與軍方有關聯。The Register 形容數量龐大，《紐約時報》（New York Times）標題點名輝達（Nvidia）與 Megaspeed，稱其與中國軍方有關聯，但摘要沒有說明 Megaspeed 的角色。\\n\\n為什麼重要\\n關鍵判斷在於執法，而非技術：負責管制先進晶片的同一個部門，批准向軍事公司名單上的企業出售逾八十萬枚晶片。這項矛盾正是消息由國會委員會主席、而非商務部自己對外揭露的原因。\\n\\n來源異同\\nThe Register 與《紐約時報》（New York Times）對核心事實一致：工業與安全局（Bureau of Industry and Security）批准向軍方關聯中國企業大規模出售圖形處理器（GPU），消息經眾議院外交事務委員會曝光。數字說法一致，一處稱數十萬枚，另一處稱逾八十萬枚，描述的是同一規模，兩種表述並無實質衝突。\\n\\n仍不確定\\n摘要沒有說明獲准的輝達（Nvidia）與超微（AMD）晶片型號、批准時間、Megaspeed 購買或扮演的角色，也沒有說明其後是否有銷售被叫停。完整受惠企業名單不在摘要中。\\n\\n信任標籤：雙源一致——The Register 與《紐約時報》（New York Times）一致認定工業與安全局（Bureau of Industry and Security）批准大規模出售，數字彼此吻合。\"},\"sources\":[{\"name\":\"The Register\",\"url\":\"https://www.theregister.com/legal/2026/11/20/us-let-nvidia-and-amd-sell-bucketloads-of-chips-to-military-linked-chinese-companies/5311200\"},{\"name\":\"NYT Economy\",\"url\":\"https://www.nytimes.com/2026/11/19/business/economy/nvidia-chips-commerce-china-huang.html\"}],\"disagreements\":null,\"trustScore\":65,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":20,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"semiconductor\",\"live-ingest\",\"the-register\",\"nyt-economy\"],\"glossary\":[{\"blurb\":{\"en\":\"American chipmaker whose advanced GPUs were approved for sale.\",\"zh-TW\":\"美國晶片商，其先進圖形處理器（GPU）獲准出售。\"},\"term\":{\"en\":\"Nvidia\",\"zh-TW\":\"輝達\"}},{\"blurb\":{\"en\":\"American chipmaker whose advanced GPUs were also approved for sale.\",\"zh-TW\":\"美國晶片商，其先進圖形處理器（GPU）同樣獲准出售。\"},\"term\":{\"en\":\"AMD\",\"zh-TW\":\"超微\"}},{\"blurb\":{\"en\":\"U.S. Commerce Department agency that approved the chip sales.\",\"zh-TW\":\"美國商務部機構，批准此次晶片銷售。\"},\"term\":{\"en\":\"Bureau of Industry and Security\",\"zh-TW\":\"美國商務部工業與安全局\"}},{\"blurb\":{\"en\":\"Chair of the House Foreign Affairs Committee who sought the sales information.\",\"zh-TW\":\"眾議院外交事務委員會主席，要求提供銷售資料的人。\"},\"term\":{\"en\":\"Brian Mast\",\"zh-TW\":\"布萊恩·馬斯特\"}},{\"blurb\":{\"en\":\"Company named in the headline as tied to the Chinese military; its role is not detailed in the snippets.\",\"zh-TW\":\"標題點名與中國軍方有關聯的公司，摘要未詳述其角色。\"},\"term\":{\"en\":\"Megaspeed\",\"zh-TW\":\"Megaspeed\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\"
