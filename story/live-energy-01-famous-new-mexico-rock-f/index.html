 were hit.\nWhy it matters\nThe Alien Throne is a well-known landmark, so damage to its spires would be a visible loss for the landscape and for visitors to the region. The episode also shows how extreme weather linked to a super El Niño can reshape famous terrain in a single season, raising the stakes for how such sites are monitored.\nSources agree / disagree\nThis account rests on a single Guardian Environment report, so no other outlet has yet confirmed which formations were damaged or how extensive the damage is. Trust label: Single source — only The Guardian Environment has reported this story so far.\nStill uncertain\nIt is not yet confirmed that the Alien Throne spires themselves were damaged, only that officials are expected to look into it. The snippet does not say when the damage was found, how much of the formation broke apart, or when the investigation will report. Verify details in the full Guardian report before quoting them."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-energy-01-famous-new-mexico-rock-f\",\"category\":\"energy\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-energy-01-famous-new-mexico-rock-f.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Alien Throne Rock Formation in New Mexico Found in Pieces After El Niño Rains\",\"zh-TW\":\"相關封面圖：新墨西哥州外星王座（Alien Throne）岩層遭聖嬰暴雨摧毀成碎塊\"},\"publishedAt\":\"2026-11-06T19:23:03.000Z\",\"title\":{\"en\":\"Alien Throne Rock Formation in New Mexico Found in Pieces After El Niño Rains\",\"zh-TW\":\"新墨西哥州外星王座（Alien Throne）岩層遭聖嬰暴雨摧毀成碎塊\"},\"summary\":{\"en\":\"[Unconfirmed · Single source] Torrential rains linked to a super El Niño season shattered at least one famous rock formation in north-west New Mexico, The Guardian reports, and officials are expected to investigate whether the storms damaged the Alien Throne spires. Watch for the investigation's findings on how much of the landmark survived.\",\"zh-TW\":\"［未證實·單一來源］與超級聖嬰季節有關的暴雨摧毀了新墨西哥州西北部至少一處著名岩層，衛報（The Guardian）報導，官員預計將調查風暴是否損壞了外星王座（Alien Throne）的石柱。接下來看調查結果，確認這處地標還剩下多少。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"新墨西哥州西北部至少一處著名岩層，在與超級聖嬰季節有關的暴雨過後被發現碎成數塊，衛報（The Guardian）報導。\\n發生了什麼事\\n外星王座（Alien Throne）起伏蜿蜒、彷彿違抗重力的石柱，是美國西南部地貌最引人注目的地標之一。暴雨過後，該地區至少一處著名岩層被發現碎裂。官員預計將調查超級聖嬰風暴是否損壞了外星王座的石柱本身，但來源摘要沒有寫調查何時進行，也沒有列出到底哪些岩層受損。\\n為什麼重要\\n外星王座是知名地標，石柱受損對當地地貌與遊客來說都是看得見的損失。這件事也顯示，與超級聖嬰有關的極端天氣可以在一個季節內重塑著名地形，讓這類景點的監測更受關注。\\n來源異同\\n這則消息目前只有衛報環境版（The Guardian Environment）一篇報導，其他媒體尚未證實哪些岩層受損、損壞程度多大。信任標籤：單一來源——目前只有衛報環境版報導了這件事。\\n仍不確定\\n目前尚未證實外星王座石柱本身受損，只知道官員預計會調查。摘要沒有寫損壞是何時發現的、岩層碎裂到什麼程度、調查何時會有結果。引用細節前請查閱衛報完整報導。\"},\"sources\":[{\"name\":\"The Guardian Environment\",\"url\":\"https://www.theguardian.com/environment/2026/nov/06/new-mexico-alien-throne-collapse-el-nino-rain\"}],\"disagreements\":null,\"trustScore\":59,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"energy\",\"live-ingest\",\"the-guardian-environment\"],\"glossary\":[{\"term\":{\"en\":\"Alien Throne\",\"zh-TW\":\"外星王座\"},\"blurb\":{\"en\":\"A famous rock formation of undulating spires in north-west New Mexico.\",\"zh-TW\":\"位於新墨西哥州西北部、以起伏石柱聞名的著名岩層。\"}},{\"term\":{\"en\":\"El Niño\",\"zh-TW\":\"聖嬰現象\"},\"blurb\":{\"en\":\"A climate pattern that can bring torrential rain to the US south-west.\",\"zh-TW\":\"可為美國西南部帶來暴雨的氣候現象。\"}},{\"term\":{\"en\":\"New Mexico\",\"zh-TW\":\"新墨西哥州\"},\"blurb\":{\"en\":\"A US state in the south-west where the damaged formation stands.\",\"zh-TW\":\"受損岩層所在的美國西南部州份。\"}},{\"term\":{\"en\":\"The Guardian Environment\",\"zh-TW\":\"衛報環境版\"},\"blurb\":{\"en\":\"The Guardian's environment desk, the single source for this story.\",\"zh-TW\":\"衛報的環境版，是這則消息的唯一來源。\"}},{\"term\":{\"en\":\"US south-west\",\"zh-TW\":\"美國西南部\"},\"blurb\":{\"en\":\"The region of the United States hit by the super El Niño storms.\",\"zh-TW\":\"遭超級聖嬰風暴侵襲的美國地區。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\"
