ant quantum computers by 2028 as part of the Department of Energy's Quantum Genesis Mission. EE Times, The Next Platform and The Register all report the unveiling with the same core facts.\nWhy it matters\nError correction is the bottleneck for quantum computing: without it, quantum machines stay experimental. A hybrid quantum-plus-HPC testbed at a national laboratory gives researchers a practical place to find out which correction methods work at scale, and the 2028 target puts a date on the ambition.\nSources agree / disagree\nEE Times, The Next Platform and The Register agree on the unveiling, the IBM-AMD-Oak Ridge partnership and the 2028 goal. No outlet disputes the other's account. Trust label: Multi-source agreement — three outlets report the same platform unveiling with the same partners and goal.\nStill uncertain\nThe snippets do not give error-rate results, say which quantum processor is installed, or explain how the 2028 target will be measured. They also do not say what the platform will cost. Verify the technical details in the full reporting before quoting them."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-01-ibm-amd-and-oak-ridge-un\",\"category\":\"semiconductor\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"https://www.eetimes.com/wp-content/uploads/IBM-ORNL-AMD-co-design-platform-for-quantum-error-correction_Ribbon-Cutting.jpg\",\"imageAlt\":{\"en\":\"Cover related to: IBM, AMD and Oak Ridge Unveil Quantum Error Correction Platform\",\"zh-TW\":\"相關封面圖：IBM、超微（AMD）與橡樹嶺國家實驗室推出量子糾錯平台\"},\"publishedAt\":\"2026-11-06T22:58:31.000Z\",\"title\":{\"en\":\"IBM, AMD and Oak Ridge Unveil Quantum Error Correction Platform\",\"zh-TW\":\"IBM、超微（AMD）與橡樹嶺國家實驗室推出量子糾錯平台\"},\"summary\":{\"en\":\"IBM, AMD and Oak Ridge National Laboratory have unveiled a co-design platform for quantum error correction, combining IBM quantum processors with an AMD-based high-performance computing system. The alliance aims to deliver scientifically relevant quantum computers by 2028 under the Department of Energy's Quantum Genesis Mission. Watch whether the hybrid system cuts error rates in practice.\",\"zh-TW\":\"IBM、超微（AMD）與橡樹嶺國家實驗室（Oak Ridge National Laboratory）推出量子糾錯協同設計平台，把 IBM 量子處理器與 AMD 晶片的高效能運算系統結合起來。聯盟目標是在美國能源部「量子創世任務」下，於 2028 年前造出有科學實用價值的量子電腦。接下來看這套混合系統能否在實務上降低錯誤率。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"橡樹嶺國家實驗室（Oak Ridge National Laboratory）現在擁有一套量子糾錯研究系統，把 IBM 量子處理器與 AMD 晶片的高效能運算系統結合起來。由美國能源部資助的橡樹嶺量子科學中心（Quantum Science Center）發表了這套協同設計平台，讓量子技術與高效能運算結合。\\n發生了什麼事\\n這套平台把 IBM 量子硬體與 AMD 運算系統配對，用來測試修正量子位元錯誤的方法——錯誤正是實用量子電腦遲遲無法問世的關鍵。聯盟的目標是加速打造有科學實用價值的量子電腦，在美國能源部「量子創世任務」（Quantum Genesis Mission）下於 2028 年前達成。EE Times、The Next Platform 與 The Register 三家媒體對這次發表的核心事實報導一致。\\n為什麼重要\\n糾錯是量子運算的瓶頸：沒有它，量子電腦就只能停留在實驗階段。國家實驗室裡的量子加高效能運算混合測試平台，讓研究人員有實務場域驗證哪些糾錯方法能擴大規模，而 2028 年這個目標也為這份企圖心訂下了期限。\\n來源異同\\nEE Times、The Next Platform 與 The Register 對發表本身、IBM 與 AMD 及橡樹嶺的合作關係、2028 年目標的描述一致，沒有任何一家質疑另一家的說法。信任標籤：多源一致——三家媒體以相同的合作夥伴與目標報導同一套平台的發表。\\n仍不確定\\n來源摘要沒有錯誤率的實測結果，也沒有說明安裝的是哪一款量子處理器，或 2028 年目標將如何衡量。摘要也沒有提到平台的造價。引用技術細節前請查閱完整報導。\"},\"sources\":[{\"name\":\"EE Times\",\"url\":\"https://www.eetimes.com/ibm-amd-mix-quantum-and-ai-at-u-s-national-lab/\"},{\"name\":\"The Next Platform\",\"url\":\"https://www.nextplatform.com/compute/2026/11/06/ibm-amd-and-oak-ridge-unveil-quantum-error-correction-platform/5308284\"},{\"name\":\"The Register\",\"url\":\"https://www.theregister.com/hpc/2026/11/06/oak-ridge-labs-gets-hybrid-quantum-hpc-system-to-test-qubit-error-correction/5308187\"}],\"disagreements\":null,\"trustScore\":76,\"trustBreakdown\":{\"sourceDiversity\":19,\"outletReputation\":10,\"crossCorroboration\":22,\"recencyClarity\":25},\"tags\":[\"semiconductor\",\"live-ingest\",\"ee-times\",\"the-next-platform\",\"the-register\"],\"glossary\":[{\"term\":{\"en\":\"IBM\",\"zh-TW\":\"IBM\"},\"blurb\":{\"en\":\"US technology company supplying quantum processors for the platform.\",\"zh-TW\":\"為平台提供量子處理器的美國科技公司。\"}},{\"term\":{\"en\":\"AMD\",\"zh-TW\":\"超微\"},\"blurb\":{\"en\":\"US chipmaker supplying the high-performance computing system.\",\"zh-TW\":\"提供高效能運算系統的美國晶片廠商。\"}},{\"term\":{\"en\":\"Oak Ridge National Laboratory\",\"zh-TW\":\"橡樹嶺國家實驗室\"},\"blurb\":{\"en\":\"US national laboratory hosting the quantum error correction platform.\",\"zh-TW\":\"設置量子糾錯平台的美國國家實驗室。\"}},{\"term\":{\"en\":\"Quantum Science Center\",\"zh-TW\":\"量子科學中心\"},\"blurb\":{\"en\":\"The Oak Ridge centre, funded by the Department of Energy, that unveiled the platform.\",\"zh-TW\":\"美國能源部資助、發表平台的橡樹嶺研究中心。\"}},{\"term\":{\"en\":\"Quantum error correction\",\"zh-TW\":\"量子糾錯\"},\"blurb\":{\"en\":\"Methods to fix errors in qubits, the main bottleneck for useful quantum computers.\",\"zh-TW\":\"修正量子位元錯誤的方法，是實用量子電腦的主要瓶頸。\"}},{\"term\":{\"en\":\"Quantum Genesis Mission\",\"zh-TW\":\"量子創世任務\"},\"blurb\":{\"en\":\"The Department of Energy programme aiming for scientifically relevant quantum computers by 2028.\",\"zh-TW\":\"美國能源部推動、目標 2028 年造出科學級量子電腦的計畫。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-semiconductor-01-ibm-amd-and-oak-ridge-un/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"prope
