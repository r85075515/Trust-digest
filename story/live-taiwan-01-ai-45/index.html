onths after signing sales contracts with customers.\nWhat happened\nThe Financial Times reported on November 22 that compute demand is still strong around the world, according to a Central News Agency dispatch from London by reporter Chen Yun-yu. Suppliers of AI servers have enough leverage to ask customers for price rises of up to 45% even months after the sales contracts were signed.\nWhy it matters\nA 45% post-contract price rise is a blunt measure of who holds the leverage in the AI hardware market. If demand still outruns supply this far into the buildout, the bubble debate misses the near-term point: buyers are paying more, not less, and the cost of AI infrastructure keeps climbing. That feeds directly into the economics of every AI company renting or buying that capacity.\nSources agree-disagree\nThis cluster has a single outlet, Central News Agency's international desk, relaying the Financial Times report, so there is nothing to cross-check within it. Trust label: Single source. One reputable wire relaying another outlet's report, but uncorroborated within this cluster.\nStill uncertain\nThe summary names no suppliers, no customers and no contract dates, and the 45% figure is an upper bound rather than a typical rise. Which suppliers are raising prices, and on which products, needs the full Financial Times report."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-01-ai-45\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-taiwan-01-ai-45.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 算力需求仍強勁　AI伺服器供應商簽約後喊漲達45%\",\"zh-TW\":\"相關封面圖：算力需求仍強勁　AI伺服器供應商簽約後喊漲達45%\"},\"publishedAt\":\"2026-11-23T01:24:33.000Z\",\"title\":{\"en\":\"AI Server Suppliers Raise Prices Up to 45% as Compute Demand Stays Strong\",\"zh-TW\":\"算力需求仍強勁，AI 伺服器供應商簽約數月後喊漲最高 45%\"},\"summary\":{\"en\":\"Compute demand remains strong even as doubts grow about an AI investment bubble, the Financial Times reports via Central News Agency: AI server suppliers can demand price increases of up to 45%, months after signing sales contracts. Suppliers, not buyers, hold the leverage while demand outruns supply. Watch whether buyers push back.\",\"zh-TW\":\"［未證實·單一來源］中央社引述英國金融時報報導：儘管外界持續質疑 AI 投資過熱、恐泡沫化，國際間算力需求依然強勁，AI 伺服器供應商甚至有條件在與客戶簽約數月後要求漲價高達 45%。重點是：需求跑在供給前面，議價權在供應商手上。接下來看買方是否反彈。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"儘管外界持續質疑人工智慧（AI）投資過熱、恐泡沫化，國際間的算力需求依然強勁，英國金融時報（Financial Times）如此報導，中央社轉述。AI 伺服器供應商甚至有條件在與客戶簽訂銷售合約數個月後，要求漲價高達 45%。\\n發生了什麼事\\n中央社倫敦 22 日電（記者陳韻聿）引述金融時報報導，國際間算力需求依然強勁。AI 伺服器供應商握有足夠議價空間，即使在簽約數月後，也能要求客戶接受最高 45% 的漲價。\\n為什麼重要\\n簽約後還能漲價 45%，赤裸裸地說明 AI 硬體市場的議價權在誰手上。擴建走到這個地步，需求仍然跑在供給前面，泡沫辯論忽略了眼前的重點：買方付的是越來越貴、不是越來越便宜，AI 基礎設施的成本持續攀升。這直接牽動每一家租用或購買算力的 AI 公司的經濟帳。\\n來源異同\\n本批只有中央社國際組一家來源，轉述金融時報的報導，無法跨來源比對。信任標籤：僅1源。\\n仍不確定\\n摘要未點名供應商、客戶與合約日期，45% 是上限、不是普遍漲幅。哪些供應商在漲價、漲的是哪些產品，要看金融時報的完整報導。\"},\"sources\":[{\"name\":\"中央社-國際\",\"url\":\"https://www.cna.com.tw/news/aopl/202611230029.aspx\"}],\"disagreements\":null,\"trustScore\":59,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"中央社-國際\"],\"glossary\":[{\"term\":{\"en\":\"Financial Times\",\"zh-TW\":\"金融時報\"},\"blurb\":{\"en\":\"British newspaper behind the report on strong compute demand.\",\"zh-TW\":\"報導算力需求強勁的英國報紙。\"}},{\"term\":{\"en\":\"Central News Agency\",\"zh-TW\":\"中央社\"},\"blurb\":{\"en\":\"Taiwan's national news agency, which relayed the FT report.\",\"zh-TW\":\"轉述金融時報報導的台灣國家通訊社。\"}},{\"term\":{\"en\":\"AI server\",\"zh-TW\":\"AI 伺服器\"},\"blurb\":{\"en\":\"Hardware that provides the computing power for AI workloads.\",\"zh-TW\":\"提供 AI 運算能力的硬體設備。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"met
