 and the University of Alabama Saturday afternoon, a visit tied to her Fostering the Future education initiative. The White House announced earlier this week the first lady had awarded LSU $5 million to establish a permanent endowment fund... President Donald Trump said he is offering the role of White House press secretary to UFC chief Dana White, asking him to “please take the job.” Why it matters\nThis cluster was assembled from 8 feed item(s) across 6 outlet(s) (CNBC, PBS NewsHour, The Hill, Bloomberg News, TMZ, Hollywood Life) in the entertainment category. Axiom links out to each publisher; this digest only restates titles and short feed descriptions — not full articles. Sources agree / disagree\nMultiple outlets are covering closely related headlines: \"Trump offers UFC chief Dana White press secretary job\" (CNBC); \"Trump says he's asked UFC's Dana White to be his press secretary\" (PBS NewsHour); \"Live updates: Melania Trump attends LSU-Alabama game; UFC's Dana White offered press secretary role\" (The Hill); \"Trump Asks UFC’s Dana White to Be His Next Press Secretary\" (Bloomberg News); \"Dana White Expected To Meet With Trump to Discuss White House Press Secretary Job Offer\" (TMZ).\nFigures differ across outlets (e.g. 5 vs 4 in headlines/snippets). Still uncertain\nFeed descriptions can omit context, updates, or corrections. Click through to the linked outlets for the latest full reporting. Trust scores are heuristics, not fact-check guarantees. Linked sources (outlet names only): CNBC, PBS NewsHour, The Hill, Bloomberg News, TMZ, Hollywood Life"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-entertainment-01-dana-white-expected-to-m\",\"category\":\"entertainment\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-entertainment-01-dana-white-expected-to-m.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Dana White Expected To Meet With Trump to Discuss White House Press Se
