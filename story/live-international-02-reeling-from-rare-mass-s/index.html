geon having lunch near the shooting is credited by a colleague with undoubtedly saving an officer's life. CBS News reports at least six dead and 15 injured in the market-square attack; the New York Times reports at least six killed in the shooting, with three bodies of the suspect's family members found at their home. The assailant was shot by police minutes after opening fire, arrested, and later died in hospital, according to the BBC and Al Jazeera.\nWhy it matters\nMass shootings are rare in Poland, and the country is asking what set off a young suspect who turned first on his own family. The speed of the police response — minutes, not hours — is credited with limiting the toll, and the officers' actions are being held up as the reason the attack did not become worse.\nSources agree / disagree\nBBC World, the New York Times, Al Jazeera, and CBS News agree on the core: the attack, the suspect's age, his shooting by police, and his death in hospital. Casualty figures are presented per outlet: CBS counts at least six dead and 15 injured in the market attack, while the Times separates the six killed in the shooting from the three family bodies found at home. Trust label: Multi-source agreement — four outlets agree on the attack and the suspect's death; casualty figures are presented per outlet.\nStill uncertain\nThe motive is unknown, and the full casualty breakdown — who was killed where, and how the family deaths relate to the public shooting — is still emerging. The suspect's background beyond his age is not detailed in the snippets."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-02-reeling-from-rare-mass-s\",\"category\":\"international\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-international-02-reeling-from-rare-mass-s.jpg\",\"imageAlt\":{\"en\":\"Police respond to the mass shooting in central Krakow\",\"zh-TW\":\"克拉科夫市中心大規模槍擊案現場\"},\"publishedAt\":\"2026-11-09T07:26:09.000Z\",\"title\":{\"en\":\"Krakow Mass Shooting Leaves at Least Six Dead; Suspect Dies in Hospital\",\"zh-TW\":\"克拉科夫罕見大規模槍擊：至少6死15傷，24歲槍手送醫不治\"},\"summary\":{\"en\":\"A 24-year-old opened fire in central Krakow, killing at least six people and injuring 15, officials say; three bodies of his family members were found at their home. Police shot the assailant minutes later; he died in hospital. Two officers were hailed for stopping further killings, and a surgeon lunching nearby is credited with saving an officer's life.\",\"zh-TW\":\"克拉科夫市中心發生罕見大規模槍擊，24歲槍手開槍造成至少6死15傷；警方數分鐘後開槍制伏，槍手送醫不治，家中另發現3具家屬遺體。兩名員警因阻止更多傷亡獲讚揚，一名在附近用餐的外科醫師據稱救了員警一命。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"波蘭正為克拉科夫罕見的大規模槍擊案震驚：24歲槍手在市中心開槍，造成至少6死15傷。警方在槍手開火數分鐘後將其擊傷逮捕，槍手隨後送醫不治；家中另發現3具家屬遺體，官方正調查犯案動機。\\n發生了什麼事\\n據官方說法，槍手先殺害家人，再到克拉科夫市中心向人群開槍。兩名員警因阻止槍手殺害更多人而獲讚揚；一名在槍擊現場附近用餐的外科醫師，據同事說法，無疑救了員警一命。CBS 報導市場廣場槍擊至少6死15傷；紐約時報報導槍擊至少6人死亡，家中另有3具嫌疑人家屬遺體。槍手開槍數分鐘後遭警方擊傷逮捕，隨後送醫不治，BBC 與半島電視台均有報導。\\n為什麼重要\\n大規模槍擊在波蘭極為罕見，全國都在問：是什麼讓一名年輕嫌犯先對家人下手。警方數分鐘內就反應，被認為限制了傷亡規模；員警的處置也被視為避免攻擊擴大的關鍵。\\n來源異同\\nBBC、紐約時報、半島電視台與 CBS 四家對核心事實一致：攻擊經過、嫌犯年齡、遭警方開槍、送醫不治。傷亡數字按媒體分開呈現：CBS 計市場槍擊至少6死15傷，紐約時報則把槍擊6死與家中3具家屬遺體分開計算。信任標籤：多源一致——四家媒體對攻擊與嫌犯死亡的報導一致，傷亡數字按媒體呈現。\\n仍不確定\\n犯案動機未知，完整傷亡細節——誰在何處遇害、家人死亡與公開槍擊的關聯——仍在釐清中。嫌犯除年齡外的背景，摘要亦未詳述。\"},\"sources\":[{\"name\":\"BBC World\",\"url\":\"https://www.bbc.co.uk/news/articles/c6y434dw8319o?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"NYT World\",\"url\":\"https://www.nytimes.com/2026/11/08/world/europe/poland-shooting-suspect-family.html\"},{\"name\":\"Al Jazeera\",\"url\":\"https://www.aljazeera.com/news/2026/11/9/poland-mass-shooting-assailant-dies-in-hospital-police-say?traffic_source=rss\"},{\"name\":\"CBS News Crime\",\"url\":\"https://www.cbsnews.com/news/shooting-main-market-square-krakow-poland/\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":25,\"outletReputation\":19,\"crossCorroboration\":17,\"recencyClarity\":25},\"tags\":[\"international\",\"live-inges
