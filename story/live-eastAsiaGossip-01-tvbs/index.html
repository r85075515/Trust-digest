tters The story is not the absence but the effort behind it: a headliner who could not attend still staffed the stage himself, call by call. That is why the warm gesture, not the empty seat, became the headline. Sources agree / disagree ETtoday, Yahoo TW, and Google News TW (carrying the TVBS report) all tell the same story: Jen absent, labelmates performing, personal calls made. Trust label: Multi-source agreement — three outlets agree on the core facts. Still uncertain The snippets do not give the wording of GboySwag's on-stage call-out or the details of Jen's work commitment. Check the full reports for the exact quotes."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-eastAsiaGossip-01-tvbs\",\"category\":\"eastAsiaGossip\",\"adult\":false,\"isHeadline\":true,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-eastAsiaGossip-01-tvbs.jpg\",\"imageAlt\":{\"en\":\"The Tianzhong Marathon players' night concert that Richie Jen missed\",\"zh-TW\":\"任賢齊缺席的田中馬拉松選手之夜音樂節現場\"},\"publishedAt\":\"2026-11-08T15:49:56.000Z\",\"title\":{\"en\":\"Richie Jen Skips Tianzhong Marathon as GboySwag Reveals His Personal Calls to Fill the Stage\",\"zh-TW\":\"任賢齊（Richie Jen）缺席田中馬拉松，鼓鼓曝天王親自打電話拜託師弟妹代打\"},\"summary\":{\"en\":\"Singer Richie Jen missed the Tianzhong Marathon's players' night on November 7 because of work, but personally called his labelmates one by one to perform in his place. GboySwag Lu Szu-wei revealed the calls on stage, and some 10,000 fans attended the concert. The no-show became a story about loyalty rather than absence.\",\"zh-TW\":\"天王任賢齊（Richie Jen）因工作缺席 11 月 7 日田中馬拉松選手之夜，卻親自打電話逐一拜託同門師弟妹代為登台，鼓鼓（GboySwag）在台上公開這段暖心安排，音樂節吸引約萬人到場。這場缺席最後講的不是不到場，而是情義。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"天王任賢齊（Richie Jen，田中馬拉松「永久顧問」）今年因工作行程缺席田中馬拉松，改由親自打電話拜託的同門師弟妹代為登台。\\n發生了什麼事\\n「2026 台灣米倉田中馬拉松」選手之夜「520 心田中音樂節」11 月 7 日晚間登場，鼓鼓呂思緯（GboySwag Lu Szu-wei）、蕭秉治（Xiao Bingzhi）、蕭景鴻（Hsiao Ching-hung）、小魏魏嘉瑩（Wei Jiaying）及麋先生（Mixer）輪番開唱，吸引約萬人到場，好兄弟九孔（Jiu Kong）擔任主持人。鼓鼓在台上透露，任賢齊親自逐一打電話拜託每個人來幫忙，隨後還隔空向任賢齊喊話。\\n為什麼重要\\n這則新聞講的不是缺席，而是背後的用心：不能到場的天王，自己一通一通電話把舞台排滿。暖心安排成了標題，而不是空著的位子。\\n來源異同\\nETtoday、Yahoo 新聞與 Google 新聞（刊載 TVBS 報導）三家說法一致：任賢齊缺席、師弟妹代打、親自打電話拜託。信任標籤：N源一致——三家媒體對核心事實的報導一致。\\n仍不確定\\n摘要沒有寫鼓鼓隔空喊話的原話，也沒說明任賢齊的工作行程細節。確切引言請查閱完整報導。\"},\"sources\":[{\"name\":\"ETtoday 影劇\",\"url\":\"https://star.ettoday.net/news/3268623\"},{\"name\":\"Yahoo TW 娛樂\",\"url\":\"https://tw.news.yahoo.com/%E4%BB%BB%E8%B3%A2%E9%BD%8A%E7%BC%BA%E5%B8%AD%E7%94%B0%E4%B8%AD%E9%A6%AC%E6%8B%89%E6%9D%BE-%E8%99%9F%E5%8F%AC%E5%B8%AB%E5%BC%9F%E5%A6%B9%E4%BB%A3%E5%8B%9E-%E9%BC%93%E9%BC%93%E6%9B%9D%E5%85%89%E7%A7%81%E4%B8%8B%E6%9A%96%E5%BF%83%E5%B0%8D%E8%A9%B1-234956018.html\"},{\"name\":\"Google News TW 娛樂\",\"url\":\"https://news.google.com/rss/articles/CBMiYkFVX3lxTE1MRXlnbW1tckllVVZfNUlobUFyRjJyWHl6NzBwcXE1MzRsMkNhYmpucy04dzJ1ZWdBaHplZ2NJQTRERzFoNDk3QTU4eHU4ajhCdmVlY255Q05sQU1GY1lhT0hn?oc=5\"}],\"disagreements\":null,\"trustScore\":84,\"trustBreakdown\":{\"sourceDiversity\":20,\"outletReputation\":17,\"crossCorroboration\":22,\"recencyClarity\":25},\"tags\":[\"eastAsiaGossip\",\"live-ingest\",\"region:tw\",\"ettoday-影劇\",\"yahoo-tw-娛樂\",\"google-news-tw-娛樂\"],\"region\":\"tw\",\"glossary\":[{\"term\":{\"en\":\"Richie Jen\",\"zh-TW\":\"任賢齊\"},\"blurb\":{\"en\":\"Taiwanese singer and the Tianzhong Marathon's self-styled permanent consultant.\",\"zh-TW\":\"台灣歌手，自稱田中馬拉松「永久顧問」。\"}},{\"term\":{\"en\":\"GboySwag Lu Szu-wei\",\"zh-TW\":\"鼓鼓呂思緯\"},\"blurb\":{\"en\":\"Taiwanese singer who performed at the players' night and revealed Jen's calls.\",\"zh-TW\":\"在選手之夜登台、並公開任賢齊暖心安排的台灣歌手。\"}},{\"term\":{\"en\":\"Tianzhong Marathon\",\"zh-TW\":\"田中馬拉松\"},\"blurb\":{\"en\":\"Annual marathon in Tianzhong, Taiwan, whose players' night drew about 10,000 people.\",\"zh-TW\":\"台灣田中一年一度的馬拉松，選手之夜吸引約萬人到場。\"}},{\"term\":{\"en\":\"Mixer\",\"zh-TW\":\"麋先生\"},\"blurb\":{\"en\":\"Taiwanese band that performed at the players' night concert.\",\"zh-TW\":\"在選手之夜音樂節登台的台灣樂團。\"}},{\"term\":{\"en
