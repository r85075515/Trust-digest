uating elements of President Donald Trump's (唐納・川普) broad tariff agenda. Louisiana Republican Senator John Kennedy (約翰・甘迺迪) stated that tariffs on Canada \"don't make sense\" to him while maintaining support for levies on China. Indiana Republican Senator Todd Young (陶德・楊) noted that an \"overly broad\" tariff structure raises costs for factories, farms, small businesses, and families, urging Congress to be actively consulted during USMCA renewal talks.\n\nWhy it matters\nIncoming Senate Finance Committee Chairman Ron Wyden (榮・魏登), a Democrat from Oregon, has identified repealing tariffs on Canada as a top legislative priority once Democrats take control of Congress. Rare alignment between skeptical Republicans and incoming Democratic committee leaders could test the durability of executive tariff authority on North American trade.\n\nSource comparison\nThe Associated Press (AP) and WFTV reported on the interviews with Republican senators and Democratic legislative plans. Both accounts align on the specific statements from Senators Kennedy, Young, and Wyden, as well as the distinction lawmakers drew between tariffs on Canada versus China.\n\nWhat remains uncertain\nIt remains uncertain whether enough Republicans will break ranks to pass binding tariff repeal legislation in Congress or override a potential presidential veto.\n\nTrust label: Multi-source agreement — Corroborated by AP News and WFTV reporting on congressional reactions to US tariff policy."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-us-125-gop-lawmakers-rethink-trump-tariffs\",\"category\":\"us\",\"title\":{\"en\":\"Some Senate Republicans Rethink Broad Tariffs as Democrats Target Canada Levies\",\"zh-TW\":\"生活成本壓力引關注 部分美國共和黨參議員重新審視川普廣泛關稅政策\"},\"summary\":{\"en\":\"Following midterm election losses centered on living costs, several Republican senators voiced openness to reconsidering broad tariffs—especially on Canada—giving Democrats an opening to challenge President Donald Trump's trade levies. One-sentence takeaway: Voter frustration over consumer prices is creating rare bipartisan friction over broad US tariffs on close allies.\",\"zh-TW\":\"在聚焦生活成本的美國期中選舉後，部分共和黨籍聯邦參議員公開表態願重新審視過於廣泛的關稅措施，特別是針對加拿大的關稅，為民主黨在國會推動限縮川普關稅政策創造契機。一句重點結論：通膨與民生成本壓力促使部分共和黨議員鬆動立場，美國對盟友徵收廣泛關稅正面臨跨黨派檢討。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n在選民高度關注生活成本的美國選舉過後，多名共和黨籍聯邦參議員釋出願意重新檢討總統唐納・川普（Donald Trump）部分廣泛關稅政策的訊號。路易斯安那州共和黨參議員約翰・甘迺迪（John Kennedy）受訪時直言，對加拿大課徵關稅「對我來說毫無道理」，但仍支持對中國加徵關稅；印第安納州共和黨參議員陶德・楊（Todd Young）則指出，過於廣泛的關稅結構已對美國工廠、農場、小型企業與家庭預算造成負面衝擊，呼籲行政部門在檢討美墨加協定（USMCA）時應讓國會實質參與。\\n\\n「為什麼重要」\\n即將接任參議院財政委員會主席的俄勒岡州民主黨參議員榮・魏登（Ron Wyden）已將廢除對加拿大關稅列為民主黨重掌國會後的首要目標。部分共和黨議員立場鬆動，使民主黨在國會推動限縮行政部門對盟友課徵關稅的行動出現跨黨派合作空間。\\n\\n「來源異同」\\n美聯社（AP）與地方電視台 WFTV 均刊出相同報導內容，完整引述約翰・甘迺迪（John Kennedy）、陶德・楊（Todd Young）及榮・魏登（Ron Wyden）的說法，對於議員區分對中關稅與對加拿大關稅的立場描述一致。\\n\\n「仍不確定」\\n目前尚不確定國會中是否會有足夠數量的共和黨議員倒戈支持具約束力的撤銷關稅法案，以及相關立法能否跨過總統否決權門檻。\"},\"glossary\":[{\"term\":{\"en\":\"USMCA\",\"zh-TW\":\"美墨加協定（USMCA）\"},\"blurb\":{\"en\":\"The United States-Mexico-Canada Agreement, the regional free-trade pact governing North American commerce that replaced NAFTA.\",\"zh-TW\":\"取代北美自由貿易協定（NAFTA）的《美國－墨西哥－加拿大協定》，規範北美三國間的貿易與關稅規則。\"}},{\"term\":{\"en\":\"Senate Finance Committee\",\"zh-TW\":\"美國參議院財政委員會\"},\"blurb\":{\"en\":\"A powerful US Senate committee with primary jurisdiction over taxation, international trade agreements, tariffs, and revenue measures.\",\"zh-TW\":\"美國聯邦參議院掌管稅制、國際貿易協定、關稅政策與聯邦財政收入的核心常設委員會。\"}},{\"term\":{\"en\":\"Presidential Veto\",\"zh-TW\":\"總統否決權\"},\"blurb\":{\"en\":\"The constitutional power of the US president to reject a bill passed by Congress, which requires a two-thirds vote in both chambers to override.\",\"zh-TW\":\"美國總統拒絕簽署國會通過法案的憲法權力，國會須在參眾兩院均取得三分之二多數票才能推翻否決。\"}}],\"sources\":[{\"name\":\"AP News\",\"url\":\"https://apnews.com/article/trump-tariffs-republicans-congress-a438d0649e3b905804eafb63e9803bb3\"},{\"name\":\"WFTV\",\"url\":\"https://www.wftv.com/news/business/republicans-rethink/U72CVG4QHQ5JPP3EEF6PXXO5T4/\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"US Capitol building representing congressional debate over tariff policy\",\"zh-TW\":\"美國國會大廈象徵國會針對關稅政策的跨黨派辯論\"},\"isHeadline\":false,\"isPopular\":true,\"trustScore\":85,\"trustBreakdown\":{\"crossCorroboration\":21,\"outletReputation\":24,\"recencyClarity\":22,\"sourceDiversity\":18},\"publishedAt\":\"2026-11-27T16:26:49.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":5,\"D2\":4,\"D3\":4,\"D4\":4,\"D5\":4,\"total\":21},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-us-125-gop-lawmakers-rethink-trump-tariffs/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-us-125-gop-lawmakers-rethink-trump-tariffs/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}]],\"error\":null,\"digest
