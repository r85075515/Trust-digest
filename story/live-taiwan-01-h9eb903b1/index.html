art.\nWhat happened\nWang argues Taiwan still lacks complete discussion and safeguards on decision-making capacity, medical care conditions, and legal risks for staff, according to The Reporter. The report asks how to confirm that a patient who says I do not want to eat any more made an autonomous decision with full understanding and without pressure, and whether family can decide for a patient who can no longer express wishes. Doctors and legal scholars discussed identifying genuine wishes, from fasting choices to feeding disputes. The source did not name the book's author or title.\nWhy it matters\nThe judgment is direct: Wang's challenge strikes at the boundary between respecting a patient's choice and protecting staff from legal and professional risk. If capacity and care conditions are not assessed, a practice presented as autonomous choice could rest on an unverified wish.\nSources agree / disagree\nOnly The Reporter published the two related items in this cluster, so no second outlet corroborates Wang's arguments in the material provided. Trust label: Single source — one outlet reported the related items.\nStill uncertain\nThe material did not state which practices Wang objects to in detail, what legal provisions apply, what scholars concluded, or whether any official response was given. Verify the full reporting before quoting Wang's position."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-01-h9eb903b1\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-taiwan-01-h9eb903b1.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 翻譯美國「自主斷食」專書的醫師，為何對台灣現行「斷食善終」有疑慮？\",\"zh-TW\":\"相關封面圖：翻譯美國「自主斷食」專書的醫師，為何對台灣現行「斷食善終」有疑慮？\"},\"publishedAt\":\"2026-10-27T16:00:00.000Z\",\"title\":{\"en\":\"Wang Han-cheng Questions Taiwan's Current Voluntary Fasting Practices\",\"zh-TW\":\"汪漢澄質疑台灣現行「斷食善終」作法\"},\"summary\":{\"en\":\"[Unverified, single source] Neurologist Wang Han-cheng, translator of an American book on voluntary fasting, questions some Taiwanese fasting practices and says recognising a patient's wish does not mean staff can directly participate. Taiwan still lacks complete discussion and safeguards, he argues. Readers should watch how capacity, care conditions, and legal risks are addressed.\",\"zh-TW\":\"[未證實·單一來源]翻譯美國《自主斷食》專書的神經內科醫師汪漢澄質疑台灣現行部分「斷食善終」作法，認為承認病人提早結束生命的需求，不代表醫護能直接參與；他指出台灣仍缺乏完整的討論與保障，相關界線亟待釐清。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"翻譯美國「自主斷食」專書的神經內科醫師汪漢澄，質疑台灣現行部分「斷食善終」作法，認為承認病人希望提前結束生命的需求，不代表醫護就能直接參與。\\n發生了什麼事\\n根據報導者，汪漢澄認為台灣仍缺乏完整的討論與保障，涉及決策能力的專業評估、醫療照護的必要條件，以及醫護人員可能面臨的法律風險。報導追問：病人說「我不想再吃了」，如何確認這是充分理解後果、不受壓力影響的自主決定？病人已無法表達意願時，家屬能否代為決定？醫師與法學者從高齡長者的斷食選擇談到失能者的餵食爭議，探討自主意願如何辨識，以及尊重選擇的界線。來源沒有說明美國專書的作者或書名，只給出上述描述。\\n為什麼重要\\n判斷很直接：汪漢澄的質疑觸及尊重病人選擇與保護醫護免於法律及專業風險之間的界線。如果決策能力與照護條件未經評估，被說成自主選擇的作法，可能建立在未經核實的意願之上。報導指出完整的討論與保障仍然缺乏，這對病人、家屬與臨床人員都有直接影響。\\n來源異同\\n本集群的兩則相關內容均由報導者刊出，提供的材料中沒有第二家媒體佐證汪漢澄的主張或學者的討論。信任標籤：單一來源——僅一家媒體報導相關內容。\\n仍不確定\\n材料沒有詳細說明汪漢澄反對哪些現行作法、適用哪些法律條文、法學者得出什麼結論，也沒有說明是否有官方回應；沒有說明專書作者或書名，也沒有說明討論的個案如何處理。引用汪漢澄的立場或所述法律風險前，請查閱完整報導。\"},\"sources\":[{\"name\":\"報導者\",\"url\":\"https://www.twreporter.org/a/controversy-over-vsed-in-taiwan-translator\"}],\"disagreements\":null,\"trustScore\":53,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":21,\"crossCorroboration\":6,\"recencyClarity\":20},\"tags\":[\"taiwan\",\"live-ingest\",\"報導者\",\"報導者\"],\"glossary\":[{\"blurb\":{\"en\":\"Neurologist who translated an American book on voluntary fasting and questioned current Taiwanese practices.\",\"zh-TW\":\"翻譯美國自主斷食專書、質疑台灣現行作法的神經內科醫師。\"},\"term\":{\"en\":\"Wang Han-cheng\",\"zh-TW\":\"汪漢澄\"}},{\"blurb\":{\"en\":\"Taiwan outlet that published the reports on voluntary fasting discussed here.\",\"zh-TW\":\"刊出本文討論的自主斷食報導的台灣媒體。\"},\"term\":{\"en\":\"The Reporter\",\"zh-TW\":\"報導者\"}},{\"blurb\":{\"en\":\"Practice of voluntarily stopping eating discussed in the reports.\",\"zh-TW\":\"報導中討論的自願停止進食作法。\"},\"term\":{\"en\":\"Vol
