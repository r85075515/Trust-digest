ng the slide long enough for the market to catch its breath.\nWhat happened\nCNA's Seoul-datelined report and TechNews both describe the same broad selloff: the KOSPI and the KOSDAQ fell sharply enough, one after the other, to trigger first-stage circuit-breaker mechanisms. The KOSDAQ's makeup — technology, biotech and other small-to-mid-cap growth companies — means the damage spread beyond blue chips into the growth complex. Neither snippet gives a confirmed closing level or a stated cause for the plunge.\nWhy it matters\nDual circuit breakers on both the main board and the growth board signal indiscriminate selling, not a single-stock story — the kind of session that forces margin calls, rattles regional markets and puts Korea's export-heavy economy in the spotlight. For semiconductor watchers in particular, a KOSDAQ washout matters: the board is where many smaller chip and equipment names live.\nSources agree / disagree\nTechNews and CNA agree on the core facts: a sharp plunge, both indexes, first-phase circuit breakers triggered in succession. Figures differ across outlets (e.g. 8230 vs 15 in headlines/snippets) — the snippets appear to mix an index level with a date, so index numbers should not be quoted from the feed. Trust label: Conflicting figures/accounts — outlets agree on the plunge and the breakers but differ on snippet figures; verify levels against market data.\nStill uncertain\nThe snippets name no cause — no policy trigger, no single catalyst — and give no confirmed index levels or trading-halt durations. Verify the cause, the closes and the halt details against market data before quoting."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-01-kospi-kosdaq\",\"category\":\"semiconductor\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-semiconductor-01-kospi-kosdaq.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 韓股重挫　KOSPI、KOSDAQ雙雙觸發熔斷\",\"zh-TW\":\"相關封面圖：韓股重挫　KOSPI、KOSDAQ雙雙觸發熔斷\"},\"publishedAt\":\"2026-10-15T05:50:03.000Z\",\"title\":{\"en\":\"KOSPI and KOSDAQ Plunge, Triggering First-Phase Circuit Breakers in Korea\",\"zh-TW\":\"韓股重挫　KOSPI、KOSDAQ 接連觸發第一階段熔斷機制\"},\"summary\":{\"en\":\"South Korean stocks plunged, with the benchmark KOSPI and the tech-heavy KOSDAQ both triggering first-phase circuit breakers in succession, according to CNA and TechNews. The KOSDAQ, home to smaller tech and biotech growth companies, fell alongside the main board in a broad selloff. Snippet figures differ on index levels, so treat exact numbers as unverified.\",\"zh-TW\":\"韓國股市暴跌，綜合股價指數（KOSPI）與科技、生技中小型股為主的創業板指（KOSDAQ）接連觸發第一階段熔斷機制，據中央社（CNA）與科技新報（TechNews）報導。摘要中的指數數字說法不一，確切點位請以驗證後為準。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"首爾迎來慘烈的一天：韓國股市暴跌，綜合股價指數（KOSPI）與以科技、生技中小型成長企業為主的創業板指（KOSDAQ）接連觸發第一階段熔斷機制，讓市場得以喘息。\\n發生了什麼事\\n中央社（CNA）首爾電與科技新報（TechNews）描述的是同一波全面拋售：KOSPI 與 KOSDAQ 先後重挫到觸發第一階段熔斷機制。KOSDAQ 的成分以科技、生技等中小型成長企業為主，意味著傷害從藍籌股蔓延到成長股板塊。兩則摘要都沒給出確認的收盤點位，也沒說明暴跌原因。\\n為什麼重要\\n主板與創業板雙雙熔斷，代表的是無差別拋售，而非單一個股故事——這種盤勢會引發追繳保證金、震盪區域市場，並讓出口導向的韓國經濟成為焦點。對半導體觀察者尤其重要：KOSDAQ 正是許多中小型晶片與設備股的家。\\n來源異同\\n科技新報（TechNews）與中央社（CNA）對核心事實一致：大幅重挫、兩個指數、接連觸發第一階段熔斷。不同媒體的數字有所不同（8230 vs 15），摘要疑似把指數點位和日期混在一起，指數數字不宜直接引用。信任標籤：數字/說法衝突——兩家對暴跌與熔斷一致，但摘要數字有出入；點位請對照市場數據驗證。\\n仍不確定\\n摘要未指明原因——沒有政策觸發點、沒有單一催化劑——也沒給確認的指數點位或暫停交易時長。引用前請對照市場數據確認原因、收盤點位與熔斷細節。\"},\"sources\":[{\"name\":\"TechNews 科技新報\",\"url\":\"https://finance.technews.tw/2026/10/15/korean-stocks-plunge-kospi-kosdaq-trigger-circuit-breakers/\"},{\"name\":\"中央社-產經證券\",\"url\":\"https://www.cna.com.tw/news/afe/202610150090.aspx\"}],\"disagreements\":{\"en\":\"Figures differ across outlets (e.g. 8230 vs 15 in headlines/snippets).\",\"zh-TW\":\"不同媒體的數字有所不同（例如，標題/摘要中的數字為 8230 與 15）。\"},\"trustScore\":64,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":19,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"semiconductor\",\"live-ingest\",\"technews-科技新報\",\"中央社-產經證券\"],\"glossary\":[{\"blurb\":{\"en\":\"Korea Composite
