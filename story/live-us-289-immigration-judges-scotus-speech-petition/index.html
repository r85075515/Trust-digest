epresenting U.S. immigration judges—has petitioned the U.S. Supreme Court to review a Department of Justice policy barring immigration judges from speaking publicly about agency policies, programs, or subjects directly related to their official duties without prior approval. Originally enacted during the first Trump administration and previously dismissed on procedural grounds in an earlier 2023 challenge, the policy is now the subject of a renewed petition asking the justices to direct lower federal courts to hear the First Amendment claims on their merits.\n\nWhy it matters\nBecause U.S. immigration judges operate as Justice Department employees within the executive branch rather than independent Article III federal judges, the case tests how broadly federal agencies can restrict public commentary by administrative adjudicators—especially after the union's decertification eliminated collective bargaining channels.\n\nSource differences\nKJZZ detailed the union's Supreme Court filing and procedural background in \"Immigration judges ask SCOTUS to review U.S. policy that they say limits their public speech\" (https://www.kjzz.org/fronteras-desk/2026-11-27/immigration-judges-ask-scotus-to-review-u-s-policy-that-they-say-limits-their-public-speech). Government Executive provided additional filing context in \"‘Gagged’ immigration judges return to Supreme Court, asserting ‘First Amendment black hole’\" (https://www.govexec.com/workforce/2026/11/gagged-immigration-judges-return-supreme-court-asserting-first-amendment-black-hole/417319/), noting the November 17 petition date and the union's argument against administrative exhaustion barriers.\n\nStill uncertain\nWhether the U.S. Supreme Court will grant certiorari to hear the petition or remand the dispute to lower courts remains pending.\n\nTrust label: Multi-source agreement — Corroborated by KJZZ and Government Executive reporting on the National Association of Immigration Judges' Supreme Court petition."])</script><script>self.__next_f.push([1,"11:T82d,"])</script><script>self.__next_f.push([1,"「發生了什麼事」\n根據 2026 年 11 月 27 日報導，代表美國移民法官的全美移民法官協會（National Association of Immigration Judges，簡稱 NAIJ）已向美國聯邦最高法院提出上訴審查聲請，挑戰司法部一項禁止移民法官未經事前核准即公開談論機構政策、計畫或與職務直接相關議題的「封口令」。該規定最初於川普首任政府時期頒布，先前 2023 年的訴訟曾因程序問題遭駁回；工會此次再度聲請最高法院介入，要求指示下級聯邦法院針對憲法第一修正案言論自由主張進行實質審理。\n\n「為什麼重要」\n由於美國移民法官隸屬行政部門的司法部雇員，而非憲法第三條保障的獨立聯邦法官，本案將界定聯邦行政機關能在多大程度上限制行政裁決人員對外發聲；尤其在該工會遭取消集體談判資格後，司法救濟已成為法官群體挑戰內部言論限制的關鍵途徑。\n\n「來源異同」\nKJZZ 在「Immigration judges ask SCOTUS to review U.S. policy that they say limits their public speech」（https://www.kjzz.org/fronteras-desk/2026-11-27/immigration-judges-ask-scotus-to-review-u-s-policy-that-they-say-limits-their-public-speech）說明工會失去認證後轉向法院尋求救濟及 2023 年舊案遭程序駁回之脈絡；Government Executive 則在「‘Gagged’ immigration judges return to Supreme Court, asserting ‘First Amendment black hole’」（https://www.govexec.com/workforce/2026/11/gagged-immigration-judges-return-supreme-court-asserting-first-amendment-black-hole/417319/）補充工會於 11 月 17 日遞狀主張下級法院程序門檻造成「第一修正案黑洞」的論點，兩者事實完全一致。\n\n「仍不確定」\n美國聯邦最高法院是否受理此項調卷令聲請（certiorari），或將案件發回下級聯邦上訴法院重審，仍有待大法官會議裁定。\n\nTrust label: Multi-source agreement — 內容經 KJZZ 與 Government Executive 針對全美移民法官協會最高法院聲請案之報導相互印證。"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-us-289-immigration-judges-scotus-speech-petition\",\"category\":\"us\",\"title\":{\"en\":\"Immigration Judges Union Asks Supreme Court to Review Speech Restrictions\",\"zh-TW\":\"美國移民法官工會促請聯邦最高法院審查司法部公開發言限制令\"},\"summary\":{\"en\":\"Reporting on November 27, 2026, highlighted a Supreme Court petition by the National Association of Immigration Judges challenging a Justice Department policy that restricts immigration judges from speaking publicly about agency policies or official duties.\",\"zh-TW\":\"根據 2026 年 11 月 27 日報導，全美移民法官協會（NAIJ）已向美國聯邦最高法院遞交審查聲請，挑戰司法部禁止移民法官在未經核准下公開談論移民政策或職務相關議題的規定。該工會主張該政策侵害憲法第一修正案言論自由，請求最高法院指示下級法院進行實質審理。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"$11\"},\"glossary\":[{\"term\":{\"en\":\"National Association of Immigration Judges (NAIJ)\",\"zh-TW\":\"全美移民法官協會（NAIJ）\"},\"blurb\":{\"en\":\"A professional association and former collective bargaining union representing U.S. immigration court judges employed by the Department of Justice.\",\"zh-TW\":\"代表美國司法部轄下移民法庭法官的專業組織與工會，長期就法庭獨立性與法官言論權進行倡議與訴訟。\"}},{\"term\":{\"en\":\"First Amendment\",\"zh-TW\":\"美國憲法第一修正案\"},\"blurb\":{\"en\":\"The provision of the U.S. Constitution protecting freedom of speech, press, religion, assembly, and petition against government infringement.\",\"zh-TW\":\"美國憲法權利法案首條，保障言論自由、新聞自由、宗教自由與集會請願權不受政府非法限制。\"}},{\"term\":{\"en\":\"Writ of Certiorari\",\"zh-TW\":\"調卷令（Certiorari）\"},\"blurb\":{\"en\":\"A discretionary order by which the U.S. Supreme Court agrees to review a decision made by a lower appellate court.\",\"zh-TW\":\"美國聯邦最高法院行使裁量權、同意調閱並審查下級上訴法院裁判案件所簽發的受理命令。\"}}],\"sources\":[{\"name\":\"KJZZ\",\"url\":\"https://www.kjzz.org/fronteras-desk/2026-11-27/immigration-judges-ask-scotus-to-review-u-s-policy-that-they-say-limits-their-public-speech\"},{\"name\":\"Government Executive\",\"url\":\"https://www.govexec.com/workforce/2026/11/gagged-immigration-judges-return-supreme-court-asserting-first-amendment-black-hole/417319/\"}],\"imageUrl\":\"/covers/live/live-us-289-immigration-judges-scotus-speech-petition.jpg\",\"imageAlt\":{\"en\":\"Immigration Judges Union Asks Supreme Court to Review Speech Restrictions\",\"zh-TW\":\"美國移民法官工會促請聯邦最高法院審查司法部公開發言限制令\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":85,\"trustBreakdown\":{\"crossCorroboration\":21,\"outletReputation\":23,\"recencyClarity\":22,\"sourceDiversity\":19},\"publishedAt\":\"2026-11-28T00:37:18.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":22,\"D2\":21,\"D3\":21,\"D4\":21,\"D5\":21,\"total\":21},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=dev
