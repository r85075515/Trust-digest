ce under Article 22, Paragraph 1, Item 2 of Taiwan's Regulations Governing Loaning of Funds and Making of Endorsements/Guarantees by Public Companies, on behalf of Lotus Pharma Bulgaria EOOD. The filing is numbered 1, dated October 16 at 15:05, with spokesman Shen Ye, a vice president, as the declarant. The same day brought four more identically formatted Lotus notices covering Alvogen Pharma US Inc., Alvogen Inc. and Alvogen Group Inc. (with Alvogen Pharma US Inc. appearing twice) — a batch of simultaneous compliance filings across the group's subsidiaries.\nWhy it matters\nFor investors, the point of such notices is not the amounts but the compliance itself: every fund loan and endorsement guarantee by a public company must be disclosed by law, and a missing filing is a violation. Five identical notices in a single day suggests the group is systematically tidying up its subsidiaries' fund-flow disclosures — an unusually active compliance push.\nSources agree / disagree\nAll five notices were carried only by GeneOnline, with identical formatting and wording and no contradictions. Trust label: Single source — GeneOnline only, no cross-check; the Market Observation Post System filing is the authoritative text.\nStill uncertain\nThe notice discloses only the spokesman, timestamp and legal basis — the actual amounts, counterparties and terms of the loans or guarantees are absent from the summary; consult the Market Observation Post System filing before quoting specifics."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-biotech-01-1795-lotus-pharma-bulgar\",\"category\":\"biotech\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"publishedAt\":\"2026-10-16T07:15:25.000Z\",\"title\":{\"en\":\"Lotus Pharmaceutical (1795) Files Regulatory Notice for Bulgaria Subsidiary Lotus Pharma Bulgaria EOOD\",\"zh-TW\":\"美時（Lotus，1795）代子公司 Lotus Pharma Bulgaria EOOD 公告：資金貸與背書保證準則事項\"},\"summary\":{\"en\":\"Taiwan-listed Lotus Pharmaceu
