ed Yang at 24 after becoming pregnant, and once said she had thought of giving up the marriage more than once.\nWhat happened\nThe announcement ends an 11-year marriage that began when Fang was 24. Yang made his first public appearance after the reports, according to Yahoo News. Mirror Media recalled that actress Alyssa Chia once said Yang acted like a young master at home, and that Fang had said she thought of giving up the marriage more than once. A LINE TODAY roundup of the split mentions four major issues in the marriage and reports ambiguity with another man, who is not named in the snippets and whose identity must not be guessed.\nWhy it matters\nA celebrity divorce becomes public record the moment the couple announces it, and the earlier public comments now read as the run-up to that announcement. The judgment readers need is the separation itself: the split is confirmed, while the reported ambiguity with another man remains an unverified claim that should not be treated as the reason for the divorce.\nSources agree / disagree\nETtoday, China Times, Yahoo News, Mirror Media, and LINE TODAY all report the Fang-Yang divorce announcement, with consistent core facts. The same feed batch also carried a separate report that influencer Elvy had accused her husband of cheating and ended a six-year marriage, and a separate denial that singer Chaeyoung and Zion.T had split. The apparent numeric disagreement in the feed data is not a conflict: six years is the influencer couple's marriage, while eleven years is Fang and Yang's. Trust label: Bundled stories — the card mixes three separate relationship stories; only the Fang-Yang divorce is corroborated by several outlets.\nStill uncertain\nThe snippets do not detail the four issues, do not name the other man, and say nothing about custody or family arrangements. Those details must be verified in the full reporting; nothing beyond the headlines has been assumed here."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-eastAsiaGossip-01-24-4-line-today-hc84f19ba\",\"category\":\"eastAsiaGossip\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"publishedAt\":\"2026-10-23T02:20:00.000Z\",\"title\":{\"en\":\"Fang Chih-yu and Yang Ming-wei Announce Divorce After 11-Year Marriage\",\"zh-TW\":\"方志友（Fang Chih-yu）、楊銘威（Yang Ming-wei）宣布離婚，11 年婚姻告終\"},\"summary\":{\"en\":\"Taiwanese actors Fang Chih-yu and Yang Ming-wei, married for 11 years, announced their divorce and said they will always be family. Fang married Yang at 24 after becoming pregnant and later said she had thought of giving up the marriage more than once. The divorce itself is confirmed; a reported ambiguity with another man is not.\",\"zh-TW\":\"台灣演員方志友（Fang Chih-yu）與楊銘威（Yang Ming-wei）結婚 11 年後宣布離婚，兩人說永遠是家人。方志友 24 歲奉子成婚，曾坦言不只一次想放棄婚姻。接下來看：離婚已確認，但與「他」曖昧的說法未經證實，相關對象也未具名。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"台灣演員方志友（Fang Chih-yu）與楊銘威（Yang Ming-wei）結婚 11 年後宣布離婚，兩人說永遠是家人。方志友 24 歲奉子成婚，曾坦言不只一次想放棄婚姻。\\n發生了什麼事\\n這段從方志友 24 歲開始的 11 年婚姻宣告結束。根據 Yahoo 新聞，楊銘威在相關報導後首度公開現身。鏡週刊（Mirror Media）翻出舊聞：演員賈靜雯（Alyssa Chia）曾說楊銘威在家像大少爺，方志友也曾坦言不只一次想放棄婚姻。LINE TODAY 的整理提到夫妻間有 4 大心結，並報導與「他」曖昧的說法；相關對象在摘要中未具名，不應猜測其身分。\\n為什麼重要\\n明星離婚在夫妻宣布的那一刻就成為公開紀錄，先前的公開發言如今看來都是這項宣布的前奏。讀者需要的判斷是區分兩者：離婚本身已經確認，但與另一名男子曖昧的說法仍是未經證實的指控，不應被當成離婚的原因。\\n來源異同\\nETtoday 星光雲、中時新聞網、Yahoo 新聞、鏡週刊與 LINE TODAY 都報導了方志友與楊銘威離婚的消息，核心事實一致。同批摘要還有一則獨立報導，指網紅 Elvy 指控丈夫出軌、結束 6 年婚姻，以及另一則否認歌手彩瑛（Chaeyoung）與 Zion.T 分手的聲明。摘要資料裡看似的數字分歧並非衝突：6 年是網紅夫妻的婚姻，11 年則是方志友與楊銘威的婚姻。信任標籤：混裝——本卡合併了三則不同的感情新聞，只有方志友與楊銘威離婚一事獲得多家媒體佐證。\\n仍不確定\\n摘要沒有詳述 4 大心結的內容，沒有點名「他」的身分，也沒有提及監護權或家庭安排。引用細節前，請查閱完整報導；本文沒有超出標題範圍做任何假設。\"},\"sources\":[{\"name\":\"ettoday.net\",\"url\":\"https://news.google.com/rss/articles/CBMiTkFVX3lxTFAxNnd3cVJUNlM0RlJ4dC13SDVCb29xMTFnY0p6czhfd01ubmlRdFpHOEZ5UzhxX2ZJa3FTZ3BMSm5YNXd3OHdQNENyQzZ2d9IBTEFVX3lxTE5wbXpoY0hOSUhraE0xLUdQYkIyR3pkMXJWZU1qc0MtdVAtazZnVGgzeHNUbmtDZWZMY2FDZ0xVdFd4SXFWaFI4ZWJyUzA?oc=5\"},{\"name\":\"chinatimes.com\",\"url\":\"https://news.google.com/rss
