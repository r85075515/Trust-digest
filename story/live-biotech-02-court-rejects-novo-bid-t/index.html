ck the ads.\nWhat happened\nThe judge found Novo had not shown that Lilly's superiority claims caused meaningful harm to Novo's sales, and the court therefore rejected the request to block the campaign. The snippets do not name the judge or give the court's reasoning beyond the failure-of-proof finding. In a separate ET Pharma item, Lilly global chief executive Dave Ricks said during a recent visit that the acquisition of Centessa Pharmaceuticals for about $7.8 billion earlier this year has opened up opportunities in drugs to treat sleep-wake cycle disorders.\nWhy it matters\nThe ruling draws a line between aggressive advertising and provable commercial harm: superiority claims alone do not entitle a rival to an injunction. For Lilly, the separate Centessa remarks point in the same direction as the court win, toward a company using its obesity-drug momentum to push into neuroscience.\nSources agree / disagree\nBioPharma Dive and PharmaVOICE agree on the court ruling, with identical headlines and the same failure-of-proof finding. The Centessa item comes only from ET Pharma and is a separate story about Lilly's neuroscience plans, not evidence about the advertising case. Trust label: Bundled stories — the card combines the advertising ruling with a separate Lilly neuroscience story; only the ruling is corroborated by two outlets.\nStill uncertain\nThe snippets do not name the judge, the court, or the specific ads at issue, and they do not say whether Novo will appeal. The Centessa acquisition's timing and the sleep-wake portfolio are described only in outline; verify both in the full reporting."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-biotech-02-court-rejects-novo-bid-t\",\"category\":\"biotech\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-biotech-02-court-rejects-novo-bid-t.png\",\"imageAlt\":{\"en\":\"Cover related to: Court rejects Novo bid to block Lilly obesity drug ads\",\"zh-TW\":\"相關封面圖：法院駁回 Novo 阻止禮來（Lilly）肥胖藥物廣告的提議\"},\"publishedAt\":\"2026-10-29T06:20:57.000Z\",\"title\":{\"en\":\"Novo Loses Bid to Block Lilly Obesity Drug Ads, Federal Judge Rules\",\"zh-TW\":\"諾和諾德（Novo Nordisk）要求封殺禮來肥胖藥物廣告，遭聯邦法官駁回\"},\"summary\":{\"en\":\"Novo Nordisk failed to prove Lilly's advertising campaign, which claimed obesity drug superiority, meaningfully harmed its sales, a federal judge ruled. The court rejected Novo's bid to block the ads. Lilly's chief executive separately touted a $7.8 billion acquisition opening neuroscience opportunities.\",\"zh-TW\":\"聯邦法官裁定，諾和諾德未能證明禮來的廣告宣傳對其銷售造成重大損害，駁回封殺廣告的請求。禮來執行長另外談到，78 億美元收購案為神經科學領域開闢機會。接下來看：摘要未交代諾和諾德是否上訴。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"聯邦法官裁定，諾和諾德（Novo Nordisk）未能證明禮來（Eli Lilly）的廣告宣傳——主打肥胖藥物優越性的說法——對這家丹麥公司的銷售造成重大損害，因此駁回了諾和諾德要求封殺廣告的請求。\\n發生了什麼事\\n法官認定，諾和諾德未能證明禮來的優越性主張對其銷售造成重大損害，法院因此駁回了封殺廣告的要求。摘要沒有具名法官，也沒有交代超出「舉證不足」認定之外的法院理由。在另一則 ET Pharma 的報導中，禮來全球執行長戴夫·里克斯（Dave Ricks）在最近一次訪問中表示，今年稍早以約 78 億美元收購 Centessa Pharmaceuticals，為治療睡眠—覺醒週期障礙的藥物組合開闢了機會。\\n為什麼重要\\n這項裁決在激進廣告與可證明的商業損害之間畫了一條線：單憑優越性主張，並不足以讓競爭對手獲得禁制令。對禮來而言，Centessa 的說法與法院勝訴指向同一方向：這家公司正利用肥胖藥物的聲勢，推進神經科學領域。\\n來源異同\\nBioPharma Dive 與 PharmaVOICE 對法院裁決的報導一致，標題相同，舉證不足的認定也相同。Centessa 的消息只來自 ET Pharma，是關於禮來神經科學計畫的另一則報導，並非廣告案的證據。信任標籤：混裝——本卡合併了廣告裁決與另一則禮來神經科學報導，只有裁決獲得兩家媒體佐證。\\n仍不確定\\n摘要沒有具名法官、法院或涉案的具體廣告，也沒有說明諾和諾德是否會上訴。Centessa 收購的時間與睡眠—覺醒藥物組合也只有輪廓性的描述；引用相關內容前，請查閱完整報導。\"},\"sources\":[{\"name\":\"BioPharma Dive\",\"url\":\"https://www.biopharmadive.com/news/novo-lilly-lawsuit-ruling-false-advertising-wegovy-zepbound/872856/\"},{\"name\":\"PharmaVOICE\",\"url\":\"https://www.pharmavoice.com/news/novo-lilly-lawsuit-ruling-false-advertising-wegovy-zepbound/872975/\"},{\"name\":\"ET Pharma\",\"url\":\"https://pharma.economictimes.indiatimes.com/news/pharma-industry/after-obesity-eli-lilly-is-set-for-a-big-neurosciences-push/135292871\"}],\"disagreements\":null,\"trustScore\":68,\"trustBreakdown\":{\"sourceDiversity\":19,\"outletReputation\":10,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"biotech\",\"live-ingest\",\"biopharma-dive\",\"pharmavoice\",\"et-pharma\"],\"glossary\":[{\"blurb\":{\"en\":\"Danish drugmaker whose bid to block Lilly's ads was rejected.\",\"zh-TW\":\"要求封殺禮來廣告遭駁回的丹麥藥廠。\"},\"term\":{\"en\":\"Novo Nordisk\",\"zh-TW\":\"諾和諾德\"}},{\"blurb\":{\"en\":\"US drugmaker whose obesity drug advertising Novo sought to block.\",\"zh-TW\":\"諾和諾德要求封殺其肥胖藥物廣告的美國藥廠。\"},\"term\":{\"en\":\"Eli Lilly\",\"zh-TW\":\"禮來\"}},{\"blurb\":{\"en\":\"Lilly's global chief executive who discussed the Centessa acquisition.\",\"zh-TW\":\"談及 Centessa 收購案的禮來全球執行長。\"},\"term\":{\"en\":\"Dave Ricks\",\"zh-TW\":\"戴夫·里克斯\"}},{\"blurb\":{\"en\":\"Pharmaceutical company acquired by Lilly for about $7.8 billion.\",\"zh-TW\":\"禮來以約 78 億美元收購的製藥公司。\"},\"term\":{\"en\":\"Centessa Pharmaceuticals\",\"zh-TW\":\"Centessa Pharmaceuticals\"}},{\"blurb\":{\"en\":\"Biopharma news outlet that reported the court ruling.\",\"zh-TW\":\"報導法院裁決的生物製藥新聞媒體。\"},\"term\":{\"en\":\"BioPharma Dive\",\"zh-TW\":\"BioPharma Dive\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://r85075515.github.io/Trust-digest/\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"cont
