(CNA), reporting from Taipei on November 26, said Copenhagen Infrastructure Partners (CIP) announced today that it had started an onshore substation engineering, procurement and construction contract with TECO Electric and Machinery. CIP Asia-Pacific regional president Hsu Nai-wen (許乃文) said the total construction cost of Fengmiao II exceeds NT$160 billion, and the project aims to complete a NT$140 billion refinancing plan before the end of June next year. Hsu described the signing with TECO as a strong reassurance for the project. The headline target attached to the partnership is connection to the grid in 2030.\n\nWhy it matters\nThe figures show the scale of financing still to be secured relative to the project's total cost, with the refinancing target close to the overall construction budget. Locking in the onshore substation work is a concrete construction step, because offshore generation cannot deliver power onshore without that infrastructure. The stated 2030 grid-connection goal also gives investors, suppliers and the energy authorities a timetable against which later financing and construction milestones can be judged.\n\nSources agree / disagree\nThis digest rests on a single CNA report, so there is no second outlet in the feed to corroborate the cost, refinancing target or timetable. No conflicting figures or names appear within that report: the NT$160 billion total cost and the NT$140 billion refinancing target are presented as distinct numbers, not competing versions of the same figure.\n\nStill uncertain\nThe feed does not say which lenders would join the refinancing, what terms are expected, or what happens if the June deadline slips. It also gives no breakdown of the substation contract value, construction schedule, or the project's generating capacity. Those details would need the full CNA article or later filings.\n\nTrust label: Single source — Only CNA is represented in the feed, so the financing and timetable claims have not yet been cross-checked against another outlet."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-03-6-2030\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-taiwan-03-6-2030.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 渢妙二號目標明年6月底完成千億融資　攜手東元拚2030年併網\",\"zh-TW\":\"相關封面圖：（譯文待補）渢妙二號目標明年6月底完成千億融資　攜手東元拚2030年併網\"},\"publishedAt\":\"2026-11-26T09:11:34.000Z\",\"title\":{\"en\":\"Fengmiao II Offshore Wind Project Targets NT$140 Billion Refinancing by End of June Next Year, TECO Partnership Aims for 2030 Grid Connection\",\"zh-TW\":\"渢妙二號（Fengmiao II）目標明年6月底完成千億融資　攜手東元電機（TECO）拚2030年併網\"},\"summary\":{\"en\":\"Copenhagen Infrastructure Partners announced the start of an onshore substation turnkey contract with TECO for the Fengmiao II offshore wind project. Asia-Pacific president Hsu Nai-wen said total construction costs exceed NT$160 billion, with a NT$140 billion refinancing targeted before the end of June next year.\",\"zh-TW\":\"哥本哈根基礎建設基金（Copenhagen Infrastructure Partners，CIP）宣布與東元電機（TECO）啟動陸上變電站統包工程合約。亞太區域總裁許乃文（Hsu Nai-wen）表示，渢妙二號總建場成本逾新台幣1,600億元，目標明年6月底前完成1,400億元再融資計畫。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"發生了什麼事\\n中央社（CNA）11月26日台北報導，哥本哈根基礎建設基金（Copenhagen Infrastructure Partners，CIP）今天宣布與東元電機（TECO）啟動陸上變電站統包工程合約。亞太區域總裁許乃文（Hsu Nai-wen）表示，渢妙二號（Fengmiao II）總建場成本逾新台幣1,600億元，目標明年6月底前完成1,400億元再融資計畫，並形容本次簽約是很強的定心丸。標題所列目標，是攜手拚2030年併網。\\n\\n為什麼重要\\n再融資目標金額接近總建場成本，顯示本案仍有大規模資金須在期限內到位。陸上變電站是離岸風電送電上岸的必要設施，統包合約啟動代表工程推進到具體建設階段；2030年併網目標也讓後續融資與施工進度有了可檢驗的時間表。\\n\\n來源異同\\n目前僅有中央社單一來源，沒有第二家媒體可交叉核對成本、融資目標與時程。報導內的1,600億元是總建場成本、1,400億元是再融資目標，兩者是不同項目，並非同一數字的衝突版本。\\n\\n仍不確定\\n來源未說明再融資的參與銀行、條件與金額分配，也未提供變電站合約金額、施工時程或裝置容量。若6月底期限延後有何影響，同樣尚不清楚。\"},\"sources\":[{\"name\":\"中央社-產經證券\",\"url\":\"https://www.cna.com.tw/news/afe/202611260214.aspx\"}],\"disagreements\":null,\"trustScore\":59,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"中央社-產經證券\"],\"glossary\":[{\"term\":{\"en\":\"Fengmiao II\",\"zh-TW\":\"渢妙二號（Fengmiao II）\"},\"blurb\":{\"en\":\"Fengmiao II is the offshore wind project whose total construction cost is put at more than NT$160 billion in the report.\",\"zh-TW\":\"渢妙二號是本案的離岸風電計畫，報導指其總建場成本逾新台幣1,600億元。\"}},{\"term\":{\"en\":\"Copenhagen Infrastructure Partners (CIP)\",\"zh-TW\":\"哥本哈根基礎建設基金（Copenhagen Infrastructure Partners，CIP）\"},\"blurb\":{\"en\":\"Copenhagen Infrastructure Partners is the fund that announced the substation contract and the refinancing target.\",\"zh-TW\":\"哥本哈根基礎建設基金是宣布變電站合約與再融資目標的基金。\"}},{\"term\":{\"en\":\"TECO Electric and Machinery\",\"zh-TW\":\"東元電機（TECO）\"},\"blurb\":{\"en\":\"TECO is the Taiwanese company partnering with CIP on the onshore substation turnkey contract.\",\"zh-TW\":\"東元電機是與基金簽下陸上變電站統包工程合約的台灣企業。\"}},{\"term\":{\"en\":\"Hsu Nai-wen\",\"zh-TW\":\"許乃文（Hsu Nai-wen）\"},\"blurb\":{\"en\":\"Hsu Nai-wen is CIP's Asia-Pacific regional president quoted on the project's costs and refinancing.\",\"zh-TW\":\"許乃文是基金亞太區域總裁，在報導中說明成本與融資計畫。\"}},{\"term\":{\"en\":\"Onshore substation\",\"zh-TW\":\"陸上變電站（Onshore substation）\"},\"blurb\":{\"en\":\"An onshore substation is the land-based facility that receives power generated offshore for delivery to the grid.\",\"zh-TW\":\"陸上變電站是接收離岸電力並送入電網的陸上設施。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-taiwan-03-6-2030/\"}],[\"$\",\"meta
