o that killed five people and injured 35 others, according to local news reports published November 26, 2026. A family member, Ana Aguilar, identified the two Arizona victims as 57-year-old Rosalia Joiner of Casa Grande and 72-year-old Margarita Rios of Maricopa.\n\nCross-border family travel between Arizona and Mexico is common throughout the year, particularly around holiday periods. Fatal commercial bus rollovers highlight persistent highway safety hazards and complex jurisdictional hurdles families face when seeking consular assistance or legal accountability abroad.\n\nFOX 10 Phoenix and NewsBreak (syndicating FOX 10 Phoenix reporting) both reported the toll of five dead and 35 injured alongside the identification of the two Pinal County sisters. Sher Law Group also summarized the FOX 10 Phoenix report on November 27 regarding the fatal crash.\n\nMexican authorities have not yet released the official mechanical or driver-error findings behind the rollover, nor have the identities of the other three deceased passengers been publicly confirmed.\nTrust label: Single source — Current reporting relies primarily on local broadcast coverage by FOX 10 Phoenix and family statements."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-arizona-169-pinal-county-sisters-killed-mexico-bus-rollover\",\"category\":\"arizona\",\"title\":{\"en\":\"Two Pinal County Sisters Killed in Mexico Bus Rollover That Left 5 Dead and 35 Injured\",\"zh-TW\":\"亞利桑那州皮納爾郡一對姊妹於墨西哥巴士翻覆事故中罹難，全案共釀 5 死 35 傷\"},\"summary\":{\"en\":\"Two sisters from Pinal County, Arizona—57-year-old Rosalia Joiner of Casa Grande and 72-year-old Margarita Rios of Maricopa—were killed in a bus rollover crash in Mexico that left five people dead and 35 injured, according to family identification reported by FOX 10 Phoenix on November 26. The tragedy underscores cross-border highway safety risks for Arizona residents traveling in Mexico.\",\"zh-TW\":\"據 FOX 10 電視台 11 月 26 日報導，來自亞利桑那州皮納爾郡（Pinal County）卡薩格蘭德的 57 歲羅莎莉亞・喬伊納（Rosalia Joiner）與馬里科帕的 72 歲姊姊瑪格麗塔・里奧斯（Margarita Rios），在墨西哥巴士翻覆車禍中雙雙罹難，事故共造成 5 人死亡、35 人受傷，引發亞利桑那州居民赴墨陸路交通安全的關注。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n根據鳳凰城當地媒體 2026 年 11 月 26 日報導，一輛載客巴士在墨西哥發生嚴重翻覆事故，共造成 5 人死亡、35 人受傷，其中兩名罹難者為來自亞利桑那州皮納爾郡（Pinal County）的親姊妹。家屬安娜・阿吉拉爾（Ana Aguilar）證實，兩名亞利桑那州罹難者分別為居住在卡薩格蘭德（Casa Grande）的 57 歲羅莎莉亞・喬伊納（Rosalia Joiner），以及居住在馬里科帕（Maricopa）的 72 歲瑪格麗塔・里奧斯（Margarita Rios）。\\n\\n「為什麼重要」\\n亞利桑那州與墨西哥之間跨境探親與旅遊往來頻繁，尤其在感恩節等假期前後更為密集。這起重大長途巴士翻覆悲劇再度凸顯跨境公路行車安全隱患，也讓罹難者家屬面臨跨國領事協助、醫療轉送與境外法律追責的複雜挑戰。\\n\\n「來源異同」\\nFOX 10 Phoenix 與轉載其報導的 NewsBreak 均一致載明事故造成 5 死 35 傷及兩位皮納爾郡姊妹的身分；當地法律機構 Sher Law Group 於 11 月 27 日亦引述該報導分析跨境事故的法律管轄問題。\\n\\n「仍不確定」\\n墨西哥交通與檢警部門尚未公布導致巴士翻覆的具體肇事原因（如超速、路況或機械故障），其餘三名罹難者的身分與國籍亦尚未公開。\\nTrust label: Single source — 目前報導主要源自鳳凰城地方電視台 FOX 10 Phoenix 採訪家屬的獨家消息及其轉載鏈。\"},\"glossary\":[{\"term\":{\"en\":\"Pinal County\",\"zh-TW\":\"皮納爾郡\"},\"blurb\":{\"en\":\"A rapidly growing county in central Arizona located between the Phoenix and Tucson metropolitan areas, encompassing Casa Grande and Maricopa.\",\"zh-TW\":\"位於亞利桑那州中部、介於鳳凰城與土桑兩大都會區之間的郡，轄下包含卡薩格蘭德與馬里科帕等城市。\"}},{\"term\":{\"en\":\"Cross-Border Consular Assistance\",\"zh-TW\":\"跨境領事協助\"},\"blurb\":{\"en\":\"Support provided by diplomatic missions to citizens injured or killed abroad, including emergency documentation and repatriation coordination.\",\"zh-TW\":\"駐外使領館為在海外遭遇重大事故或身亡的本國公民家屬提供的緊急文件辦理、醫療聯繫與遺體運返協助。\"}},{\"term\":{\"en\":\"Bus Rollover\",\"zh-TW\":\"巴士翻覆事故\"},\"blurb\":{\"en\":\"A severe vehicle crash in which a high-center-of-gravity passenger coach tips onto its side or roof, often resulting in high casualty counts.\",\"zh-TW\":\"高重心大型載客巴士因失控、閃避或路況因素導致車身側翻或覆頂的重大交通事故，通常傷亡較為嚴重。\"}}],\"sources\":[{\"name\":\"FOX 10 Phoenix\",\"url\":\"https://www.fox10phoenix.com/news/two-arizona-sisters-killed-horrific-mexico-bus-rollover-left-five-dead-35-injured\"},{\"name\":\"NewsBreak (FOX 10 Phoenix)\",\"url\":\"https://www.newsbreak.com/fox-10-phoenix-287
