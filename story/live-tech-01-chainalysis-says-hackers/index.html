s\nLive tokens and password hashes for all users is about as bad as a breach gets: tokens can be used directly, and hashes can be attacked offline. The customer list makes it worse, because Chainalysis serves high-profile clients, including government agencies, whose exposure carries wider consequences.\nSources agree / disagree\nThis account rests on a single Ars Technica report, so no other outlet has yet confirmed the scope of the breach or added detail. Trust label: Single source — only Ars Technica has reported this story so far.\nStill uncertain\nThe snippet does not say how the attackers got in, when the breach was discovered, or what Chainalysis is telling customers to do — whether to rotate credentials, revoke tokens, or take other steps. The full customer list is also not visible in the feed text. Verify details in the full Ars Technica report before quoting them."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-tech-01-chainalysis-says-hackers\",\"category\":\"tech\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-tech-01-chainalysis-says-hackers.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Chainalysis Says Hackers Stole Credentials and Tokens for All Customers\",\"zh-TW\":\"相關封面圖：Chainalysis 遭駭，駭客竊取全數客戶憑證與權杖\"},\"publishedAt\":\"2026-11-06T20:56:41.000Z\",\"title\":{\"en\":\"Chainalysis Says Hackers Stole Credentials and Tokens for All Customers\",\"zh-TW\":\"Chainalysis 遭駭，駭客竊取全數客戶憑證與權杖\"},\"summary\":{\"en\":\"[Unconfirmed · Single source] Hackers obtained names, usernames, password hashes and live tokens for all Chainalysis users after a breach of the blockchain analysis firm's network security, Ars Technica reports. The haul could be a major coup for the attackers — customers should watch for the firm's official guidance on rotating credentials.\",\"zh-TW\":\"［未證實·單一來源］區塊鏈分析公司 Chainalysis 網路安全遭入侵後，駭客取得全數用戶的姓名、使用者名稱、密碼雜湊值與即時權杖，Ars Technica 報導。這批戰利品可能成為攻擊者的一大斬獲，客戶應留意該公司關於更換憑證的官方指引。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"區塊鏈分析公司 Chainalysis 表示，網路安全遭入侵後，駭客已取得全數用戶的敏感個人資訊，包括姓名、使用者名稱、密碼雜湊值與即時權杖，Ars Technica 報導。\\n發生了什麼事\\n根據 Ars Technica 轉述 Chainalysis 自身的說法，這次入侵外洩了每一位 Chainalysis 用戶的憑證與即時權杖。這批戰利品可能成為攻擊者的一大斬獲。Chainalysis 與公開來源都揭露了一長串知名客戶，包括政府機構，但來源摘要在名單列完前就中斷了。\\n為什麼重要\\n全數用戶的即時權杖與密碼雜湊值外洩，幾乎是最嚴重的入侵等級：權杖可以直接使用，雜湊值可以離線破解。客戶名單讓事態更嚴重，因為 Chainalysis 服務的知名客戶包括政府機構，一旦曝光影響更廣。\\n來源異同\\n這則消息目前只有 Ars Technica 一篇報導，其他媒體尚未證實入侵規模或補充細節。信任標籤：單一來源——目前只有 Ars Technica 報導了這件事。\\n仍不確定\\n摘要沒有寫攻擊者如何入侵、何時發現入侵，也沒有寫 Chainalysis 要求客戶怎麼做——是否更換憑證、撤銷權杖或採取其他措施。完整客戶名單在摘要中也看不到。引用細節前請查閱 Ars Technica 完整報導。\"},\"sources\":[{\"name\":\"Ars Technica\",\"url\":\"https://arstechnica.com/security/2026/11/chainalysis-says-hackers-stole-credentials-and-tokens-for-all-of-its-customers/\"}],\"disagreements\":null,\"trustScore\":56,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":19,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"tech\",\"live-ingest\",\"ars-technica\"],\"glossary\":[{\"term\":{\"en\":\"Chainalysis\",\"zh-TW\":\"Chainalysis\"},\"blurb\":{\"en\":\"Blockchain analysis firm whose users' credentials and tokens were stolen.\",\"zh-TW\":\"用戶憑證與權杖遭竊的區塊鏈分析公司。\"}},{\"term\":{\"en\":\"Blockchain analysis\",\"zh-TW\":\"區塊鏈分析\"},\"blurb\":{\"en\":\"The business of tracing cryptocurrency transactions, Chainalysis's field.\",\"zh-TW\":\"追蹤加密貨幣交易的業務，是 Chainalysis 的本行。\"}},{\"term\":{\"en\":\"Password hashes\",\"zh-TW\":\"密碼雜湊值\"},\"blurb\":{\"en\":\"Scrambled forms of passwords that attackers can try to crack offline.\",\"zh-TW\":\"密碼的雜湊形式，攻擊者可嘗試離線破解。\"}},{\"term\":{\"en\":\"Live tokens\",\"zh-TW\":\"即時權杖\"},\"blurb\":{\"en\":\"Active access tokens stolen in the breach, usable without a password.\",\"zh-TW\":\"入侵中遭竊的有效存取權杖，無須密碼即可使用。\"}},{\"term\":{\"en\":\"Ars Technica\",\"zh-TW\":\"Ars Technica\"},\"blurb\":{\"en\":\"US technology news outlet that reported the Chainalysis breach.\",\"zh-TW\":\"報導 Chainalysis 入侵事件的美國科技新聞媒體。\"}}]}}]\n"])</script><scrip
