 by cobbling together a coalition.\nWhy it matters\nThe judgment is about the rebuke, not the procedure: the president chose the opposition candidate over the sitting prime minister, which is a public verdict on Netanyahu's hold on power. Whether Eisenkot can actually assemble a coalition now decides if Israel gets a new government or slides back into deadlock.\nSources agree / disagree\nBBC, NPR, The New York Times, PBS NewsHour, The Hill, Axios, and the Financial Times — seven outlets across eight items — all report the same core facts, with consistent quotes and no conflicting details. Trust label: Multi-source agreement — seven established outlets agree on the mandate and the election outcome.\nStill uncertain\nThe snippets give no seat counts, no coalition arithmetic, and no timeline for forming a government. Whether Eisenkot can win over enough parties is unknown; verify specifics in the full reporting before quoting them."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-03-eisenkot-netanyahu-rival\",\"category\":\"international\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-international-03-eisenkot-netanyahu-rival.jpg\",\"imageAlt\":{\"en\":\"Opposition leader Gadi Eisenkot tapped to form Israel's government after an inconclusive election.\",\"zh-TW\":\"大選無結果後，反對派領袖艾森科特獲授權籌組以色列政府。\"},\"publishedAt\":\"2026-11-07T23:03:29.000Z\",\"title\":{\"en\":\"Gadi Eisenkot Tapped to Form Israel's Government in Blow to Netanyahu\",\"zh-TW\":\"艾森科特（Gadi Eisenkot）獲授權組閣，內塔尼亞胡受挫\"},\"summary\":{\"en\":\"Israeli President Herzog has tapped opposition leader Gadi Eisenkot to try to form a government, after neither Benjamin Netanyahu's bloc nor Eisenkot's won a majority in last week's election, seven outlets report. Eisenkot, a former military chief, must now cobble together a coalition to succeed Netanyahu.\",\"zh-TW\":\"上週大選後，內塔尼亞胡（Benjamin Netanyahu）陣營與艾森科特（Gadi Eisenkot）陣營皆未取得多數，總統赫爾佐格（Herzog）授權反對派領袖艾森科特籌組政府，七家媒體報導。這位前軍事首長如今必須拼湊聯盟，才能接替內塔尼亞胡出任總理。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"上週大選後，內塔尼亞胡（Benjamin Netanyahu）陣營與艾森科特（Gadi Eisenkot）陣營皆未取得多數，總統赫爾佐格（Herzog）授權反對派領袖艾森科特籌組政府，對內塔尼亞胡的掌權地位造成打擊。\\n發生了什麼事\\n赫爾佐格總統把組閣授權交給艾森科特，以色列主要政黨也建議由艾森科特籌組新政府。艾森科特是內塔尼亞胡總理的主要對手，但兩人在上週大選都沒有贏得足以取得多數的支持。這位前軍事首長希望拼湊聯盟，接替內塔尼亞胡出任總理。\\n為什麼重要\\n重點在譴責，不在程序：總統選擇了反對派候選人，而不是現任總理，等於公開評斷了內塔尼亞胡的掌權地位。艾森科特能不能真的湊出聯盟，將決定以色列是迎來新政府，還是滑回僵局。\\n來源異同\\n英國廣播公司、美國國家公共電台（NPR）、《紐約時報》、美國公共電視新聞時刻（PBS NewsHour）、《國會山報》（The Hill）、Axios、《金融時報》——七家媒體、八則報導——核心事實一致，引言一致，沒有矛盾細節。信任標籤：多源一致——七家主流媒體對授權與選舉結果的報導一致。\\n仍不確定\\n來源摘要沒有席次數字、聯盟算術，也沒有組閣時間表。艾森科特能不能爭取到足夠政黨支持仍是未知數；引用細節前請查閱完整報導。\"},\"sources\":[{\"name\":\"BBC World\",\"url\":\"https://www.bbc.co.uk/news/articles/cmy8367lj5xlo?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"NPR World\",\"url\":\"https://www.npr.org/2026/11/07/nx-s1-6032606/israeli-president-invites-netanyahus-opposition-leader-to-broker-new-government\"},{\"name\":\"NYT World\",\"url\":\"https://www.nytimes.com/2026/11/07/world/middleeast/israel-eisenkot-government.html\"},{\"name\":\"PBS NewsHour\",\"url\":\"https://www.pbs.org/newshour/world/israels-president-taps-opposition-candidate-eisenkot-to-form-a-government-in-setback-for-netanyahu\"},{\"name\":\"The Hill\",\"url\":\"https://thehill.com/policy/international/6206234-herzog-appoints-eisenkot-form-government/\"},{\"name\":\"Axios\",\"url\":\"https://www.axios.com/2026/11/07/israel-eisenkot-netanyahu-government-herzog\"},{\"name\":\"Financial Times\",\"url\":\"https://www.ft.com/content/bf737648-b974-4f87-ba0b-958f2aff1163?syn-25a6b1a6=1\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":25,\"outletReputation\":20,\"crossCorroboration\":17,\"recencyClarity\":25},\"tags\":[\"international\",\"live-ingest\",\"bbc-world\",\"npr-world\",\"npr-world\"],\"glossary\":[{\"term\":{\"en\":\"Gadi Eisenkot\",\"zh-TW\":\"艾森科特\"},\"blurb\":{\"en\":\"Israeli opposition leader tapped to form a government.
