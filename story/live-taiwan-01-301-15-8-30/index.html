efs.\n\nWhat happened\nCentral News Agency (CNA) reported that the U.S. published the Section 301 report on structural overcapacity, with a recommended 15% non-stacking rate for Taiwan, the lowest tier. The Executive Yuan scheduled the briefing for 8:30 a.m. on November 26, led by Cheng with finance chiefs explaining the findings and the response. Cheng told CNA that the U.S. is also running a Section 232 investigation alongside the Section 301 probe. Non-semiconductor Section 232 tariff relief is already in effect, covering auto parts, wood and wood products, and drones at 15% non-stacking. The semiconductor rate has not been released, but Taiwan has secured zero tariffs within quota, and 15% non-stacking or the lower applicable rate beyond quota.\n\nWhy it matters\nTaipei landed the lightest proposed rate, and that matters more than the headline number. The 15% non-stacking terms on autos, wood and drones are already locked in, and the quota deal on chips — zero inside, capped outside — protects Taiwan's most important export before its rate is even set. The open question is not whether Taiwan was hit hardest; it was not. It is what the final semiconductor rate looks like once Washington sets it.\n\nSources agree / disagree\nOnly one outlet, CNA, reports this story, across two items that agree with each other: one on the Section 232 relief already in effect, one on the Section 301 report and the morning briefing. No second outlet corroborates the 15% figure in this digest. The ingest flag of '232 vs 8' is not a conflict: 232 is the investigation section number, and 8 is the 8:30 a.m. briefing time.\n\nStill uncertain\nThe full Section 301 report text is not in the summaries, and the quota size for semiconductors is unstated. The semiconductor tariff rate is still pending, and the briefing itself had not yet happened when the feed items were published, so Cheng's full remarks are not yet on record.\n\nTrust label: Single source. One wire service reports an official briefing and a published U.S. report, with no second outlet corroborating the figures in this digest."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-01-301-15-8-30\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-taiwan-01-301-15-8-30.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 美301調查報告建議對台課稅15%　鄭麗君8時30分說明\",\"zh-TW\":\"相關封面圖：美301調查報告建議對台課稅15%　鄭麗君8時30分說明\"},\"publishedAt\":\"2026-11-26T03:07:46.000Z\",\"title\":{\"en\":\"U.S. Section 301 Report Recommends 15% Tariff on Taiwan; Cheng Li-chun to Brief at 8:30 a.m.\",\"zh-TW\":\"美 301 調查報告建議對台課稅 15%，鄭麗君（Cheng Li-chun）上午 8 時 30 分說明\"},\"summary\":{\"en\":\"The United States has released its structural overcapacity Section 301 report, recommending a 15% non-stacking tariff on Taiwan, the lowest tier. Vice Premier Cheng Li-chun will brief reporters at 8:30 a.m. Non-semiconductor Section 232 relief is already in effect, while the chip rate is still pending. The takeaway: Taipei got the lightest proposed rate, but the semiconductor number still hangs.\",\"zh-TW\":\"美國公布「結構性產能過剩 301 調查報告」，建議對台課徵 15% 不疊加關稅，級別最低。行政院副院長鄭麗君（Cheng Li-chun）上午 8 時 30 分將率財經首長說明。非半導體 232 關稅優惠已經上路，半導體稅率尚未出爐。結論：台灣拿到最輕的建議稅率，但半導體稅率仍是未定數。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"美國公布「結構性產能過剩 301 調查報告」，建議對台課徵 15% 不疊加關稅，級別最低。行政院副院長鄭麗君（Cheng Li-chun）將於上午 8 時 30 分率財經首長說明。\\n\\n發生了什麼事\\n中央社（CNA）報導，美國公布結構性產能過剩 301 調查報告，對台灣的建議稅率為 15% 不疊加，級別最低。行政院安排在 11 月 26 日上午 8 時 30 分舉行說明記者會，由鄭麗君率財經首長說明調查內容與因應。鄭麗君向中央社表示，美國除了進行 301 條款調查，也正在進行 232 條款調查。非半導體的 232 關稅優惠已經上路，涵蓋汽車零組件、木材及其製品、無人機，稅率 15% 不疊加。半導體稅率尚未出爐，但台灣已經確保配額內零關稅，配額外 15% 不疊加或從其低。\\n\\n為什麼重要\\n台灣拿到的是最輕的建議稅率，這比稅率數字本身更重要。汽車、木材與無人機 15% 不疊加的優惠已經確定，晶片的配額安排——配額內零關稅、配額外設上限——更在稅率出爐前就護住了台灣最重要的出口。真正的問題不是台灣是否被打得最重；答案是否定的。真正的問題是，華府最終定出的半導體稅率會是多少。\\n\\n來源異同\\n只有中央社一家媒體報導這件事，透過兩則彼此一致的報導：一則談已經上路的 232 關稅優惠，一則談 301 調查報告與上午的說明會。這篇摘要裡沒有第二家媒體佐證 15% 的數字。系統標示的「232 比 8」不是衝突：232 是調查條款編號，8 是上午 8 時 30 分說明會的時間。\\n\\n仍不確定\\n摘要沒有 301 調查報告全文，半導體配額的規模也沒有交代。半導體稅率仍待公布，而說明會在報導刊出時尚未舉行，鄭麗君的完整說法還沒有紀錄。\\n\\n信任標籤：僅單一來源——只有一家通訊社報導這場官方說明會與美國已公布的報告，數字缺乏第二家媒體佐證。\"},\"sources\":[{\"name\":\"中央社-政治\",\"url\":\"https://www.cna.com.tw/news/aipl/202611260054.aspx\"}],\"disagreements\":null,\"trustScore\":59,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"中央社-政治\",\"中央社-政治\"],\"glossary\":[{\"term\":{\"en\":\"Section 301\",\"zh-TW\":\"301 條款\"},\"blurb\":{\"en\":\"The U.S. trade law used to investigate foreign practices and impose tariffs.\",\"zh-TW\":\"美國用來調查外國貿易做法並課徵關稅的貿易法條款。\"}},{\"term\":{\"en\":\"Section 232\",\"zh-TW\":\"232 條款\"},\"blurb\":{\"en\":\"The U.S. trade law covering tariffs imposed on national security grounds.\",\"zh-TW\":\"美國以國家安全為由課徵關稅的貿易法條款。\"}},{\"term\":{\"en\":\"Cheng Li-chun\",\"zh-TW\":\"鄭麗君\"},\"blurb\":{\"en\":\"Vice Premier of Taiwan's Executive Yuan, leading the briefing on the U.S. report.\",\"zh-TW\":\"率隊說明美國調查報告的行政院副院長。\"}},{\"term\":{\"en\":\"Executive Yuan\",\"zh-TW\":\"行政院\"},\"blurb\":{\"en\":\"Taiwan's cabinet and top executive body.\",\"zh-TW\":\"台灣的內閣與最高行政機關。\"}},{\"term\":{\"en\":\"Non-stacking tariff\",\"zh-TW\":\"不疊加關稅\"},\"blurb\":{\"en\":\"A tariff rate applied on its own, not added on top of other duties.\",\"zh-TW\":\"單獨適用、不與其他關稅疊加的稅率。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-taiwan-01-301-15-8-30/\"}],[\
