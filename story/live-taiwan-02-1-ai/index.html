gy use, jobs, and competition with China. A coordinated batch of bills would move the debate from scattered proposals to a governing agenda — and the data center piece means the fight will land in local communities weighing power and water use, not just in committee rooms.\nSources agree / disagree\nOnly CNA carries this item in the feed, so the plan is unconfirmed by a second outlet, though it is sourced to multiple people in Washington rather than a single voice. Nothing in the material contradicts the report. Trust label: Single source — only CNA reports the plan, citing lawmakers, aides, and advocates.\nStill uncertain\nThe feed does not name any bill, sponsor, or specific rule, so it is unclear whether the package leans toward restriction, incentives, or disclosure. It also does not say how much of the plan survives contact with drafting, committee politics, or the other party. Watch for bill text and sponsor lists when the new session opens."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-02-1-ai\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-taiwan-02-1-ai.jpg\",\"imageAlt\":{\"en\":\"Cover related to: US Democrats Plan a Wave of AI and Data Center Bills for January\",\"zh-TW\":\"相關封面圖：美民主黨明年 1 月掌國會，擬推大批 AI 與資料中心法案\"},\"publishedAt\":\"2026-11-07T06:29:53.000Z\",\"title\":{\"en\":\"US Democrats Plan a Wave of AI and Data Center Bills for January\",\"zh-TW\":\"美民主黨明年 1 月掌國會，擬推大批 AI 與資料中心法案\"},\"summary\":{\"en\":\"[Unconfirmed · Single source] Democrats plan a wave of new bills on artificial intelligence systems and data center development when they take control of the US Congress next January, CNA reports, citing lawmakers, aides, and advocates. The package would put AI rules at the top of the next session — watch which proposals survive the drafting process.\",\"zh-TW\":\"［未證實·單一來源］民主黨計劃明年 1 月掌控美國國會時，針對人工智慧（AI）系統與資料中心開發推出大批新法案。中央社（CNA）引述國會議員、助理與倡議人士的說法，這批法案將把 AI 規範推上新會期的優先議程，接下來看法案起草後哪些提案留得下來。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"民主黨計劃明年 1 月掌控美國國會時，針對人工智慧（AI）系統與資料中心開發推出大批新法案。\\n發生了什麼事\\n中央社（CNA）6 日自華盛頓發出的綜合外電報導，引述美國國會議員、國會助理與倡議人士的說法：民主黨人計劃在明年 1 月掌控國會時，針對 AI 系統與資料中心開發推出大批新法案。來源沒有寫法案名稱、提案人，也沒有說具體有幾項法案，只寫了推動的規模與兩大目標：AI 系統與背後的資料中心。\\n為什麼重要\\nAI 規範與資料中心擴建是華盛頓最具爭議的政策戰線，牽動能源使用、就業與對中競爭。一批協調推出的法案，會把辯論從零散提案變成執政議程——而資料中心這一塊意味著爭議將落到地方社區，涉及電力與用水，而不只是在委員會裡討論。\\n來源異同\\n來源只有中央社一家，這項計畫沒有第二家媒體佐證，不過消息來源是華盛頓多位人士，而非單一聲音。材料中沒有與報導牴觸的說法。信任標籤：單一來源——僅中央社報導這項計畫，引述議員、助理與倡議人士。\\n仍不確定\\n來源沒有寫任何法案名稱、提案人或具體規範，看不出這批法案偏向管制、獎勵還是資訊揭露。它也沒有說計畫在起草、委員會攻防與另一政黨的角力後能留下多少。新會期開議後，請留意法案文本與提案人名單。\"},\"sources\":[{\"name\":\"中央社-國際\",\"url\":\"https://www.cna.com.tw/news/aopl/202611070086.aspx\"}],\"disagreements\":null,\"trustScore\":59,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"中央社-國際\"],\"glossary\":[{\"blurb\":{\"en\":\"The US legislature Democrats plan to control from January.\",\"zh-TW\":\"民主黨計劃自明年 1 月掌控的美國立法機構。\"},\"term\":{\"en\":\"US Congress\",\"zh-TW\":\"美國國會\"}},{\"blurb\":{\"en\":\"US political party planning the batch of AI and data center bills.\",\"zh-TW\":\"計劃推出這批 AI 與資料中心法案的美國政黨。\"},\"term\":{\"en\":\"Democratic Party\",\"zh-TW\":\"民主黨\"}},{\"blurb\":{\"en\":\"AI systems targeted by the planned bills.\",\"zh-TW\":\"計劃中法案針對的 AI 系統。\"},\"term\":{\"en\":\"Artificial intelligence\",\"zh-TW\":\"人工智慧\"}},{\"blurb\":{\"en\":\"Facilities that run AI systems; their development is the bills' second target.\",\"zh-TW\":\"運行 AI 系統的設施；法案的第二個目標。\"},\"term\":{\"en\":\"Data center\",\"zh-TW\":\"資料中心\"}},{\"blurb\":{\"en\":\"Taiwan's Central News Agency, which reported the plan.\",\"zh-TW\":\"報導這項計畫的中央通訊社。\"},\"term\":{\"en\":\"CNA\",\"zh-TW\":\"中央社\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-sca
