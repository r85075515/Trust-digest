2026, setting the five-day event for July 7–11, 2027. Top-billed headliners include New York indie rock band The Strokes, Australian psychedelic project Tame Impala, Faith No More, British trio The xx, and K-pop group ENHYPEN. General admission and VIP passes are scheduled to go on sale starting December 2, 2026.\n\nThe announcement underscores European summer festivals' continued strategy of blending legacy alternative rock headliners with global K-pop acts and contemporary British pop performers such as RAYE. Additional confirmed acts across the bill include IDLES, Primus, Kneecap, The Mars Volta, Placebo, Jungle, Hot Chip, Spoon, Slowdive, The Avalanches, James Blake, and Foals.\n\nMusic publications Consequence and NME align on the July 7–11, 2027 festival dates in Madrid, the December 2 ticket on-sale date, and the core headliner roster. NME additionally highlighted Zurich's debut as the festival's first title sponsor and noted specific day assignments such as ENHYPEN's July 9 headline slot.\n\nFull day-by-day stage schedules, single-day ticket pricing tiers, and late-addition artist announcements remain to be published by festival organizers.\n\nTrust label: Multi-source agreement — Festival dates, headlining artists, and ticket release timing are corroborated across Consequence and NME."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-entertainment-110-mad-cool-festival-2027-lineup-madrid\",\"category\":\"entertainment\",\"title\":{\"en\":\"Mad Cool Festival Unveils 2027 Madrid Lineup Headlined by The Strokes and Tame Impala\",\"zh-TW\":\"西班牙 Mad Cool 音樂節公布 2027 年陣容 由 The Strokes 與 Tame Impala 領銜\"},\"summary\":{\"en\":\"Spain's Mad Cool Festival announced its 2027 lineup on November 27, 2026, confirming headliners The Strokes, Tame Impala, Faith No More, The xx, and ENHYPEN for the July 7–11 event in Madrid. General admission and VIP tickets go on sale December 2 via the festival's official website. The multi-genre bill also features RAYE, IDLES, Primus, The Mars Volta, Placebo, and Slowdive.\",\"zh-TW\":\"西班牙 Mad Cool 音樂節近日公布 2027 年陣容，確定 7 月 7 日至 11 日在馬德里舉行，由 The Strokes、Tame Impala、Faith No More、The xx 與 ENHYPEN 領銜主秀，門票 12 月 2 日開賣。這份跨曲風名單展現歐洲大型音樂祭結合經典搖滾與 K-pop 吸引全球樂迷的策略。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」西班牙馬德里知名大型音樂祭 Mad Cool Festival 於 2026 年 11 月 27 日正式公布 2027 年演出陣容，確定將於 2027 年 7 月 7 日至 11 日連續五天登場。本屆領銜主秀陣容涵蓋美國獨立搖滾天團 The Strokes、澳洲迷幻音樂計畫 Tame Impala、另類金屬樂團 Faith No More、英國三人組 The xx 以及韓國人氣男團 ENHYPEN，一般入場券與 VIP 套票將於 12 月 2 日開放預購。\\n\\n「為什麼重要」歐洲夏季大型音樂節近年積極打破曲風界線，將經典另類搖滾頭牌與具備全球號召力的 K-pop 團體及當代流行歌手（如英國創作女聲 RAYE）並列主舞台，藉此吸引跨世代與跨國界樂迷前往馬德里朝聖。同批公布的參演名單還包括 IDLES、Primus、The Mars Volta、Placebo、Jungle、Hot Chip、Slowdive 與 James Blake 等數十組音樂人。\\n\\n「來源異同」歐美音樂媒體 Consequence 與 NME 對 2027 年 7 月 7 日至 11 日舉辦日期、12 月 2 日售票時程及主要領銜藝人名單報導一致。NME 另補充蘇黎世保險（Zurich）首度擔任該音樂節冠名贊助商，並點出 ENHYPEN 將於 7 月 9 日登台擔綱主秀。\\n\\n「仍不確定」各日完整舞台演出時刻表、單日票與多日聯票具體定價分級，以及後續是否還有追加壓軸藝人，仍有待主辦單位進一步公布。\"},\"glossary\":[{\"term\":{\"en\":\"Headliner\",\"zh-TW\":\"領銜主秀\"},\"blurb\":{\"en\":\"The top-billed musical artist or band performing in the prime closing slot at a music festival or concert tour.\",\"zh-TW\":\"音樂節或巡迴演唱會中名列海報最頂端、通常於主舞台黃金壓軸時段演出的核心藝人或樂團。\"}},{\"term\":{\"en\":\"Title Sponsor\",\"zh-TW\":\"冠名贊助商\"},\"blurb\":{\"en\":\"The primary commercial sponsor whose brand name is incorporated directly into the official title of a festival, tournament, or venue.\",\"zh-TW\":\"出資規模最高、獲授權將品牌名稱直接納入活動或場館官方正式名稱的主要商業贊助企業。\"}},{\"term\":{\"en\":\"Multi-Genre Bill\",\"zh-TW\":\"跨曲風演出陣容\"},\"blurb\":{\"en\":\"A festival lineup intentionally combining diverse musical styles—such as indie rock, K-pop, electronic, and alternative metal—to broaden audience appeal.\",\"zh-TW\":\"音樂祭刻意將獨立搖滾、K-pop、電子音樂與另類金屬等多元曲風藝人納入同一檔期，以吸引跨族群樂迷的節目編排策略。\"}},{\"term\":{\"en\":\"VIP Pass\",\"zh-TW\":\"VIP 貴賓套票\"},\"blurb\":{\"en\":\"A premium festival ticket tier offering expedited entry, dedicated viewing areas near main stages, and exclusive hospitality lounges.\",\"zh-TW\":\"提供快速通關入場、主舞台專屬觀賞區及獨立休憩餐飲空間的高階音樂節票種。\"}}],\"sources\":[{\"name\":\"Consequence\",\"url\":\"https://consequence.net/2026/11/mad-cool-festival-2027-lineup-the-strokes-tame-impala-faith-no-more/\"},{\"name\":\"NME\",\"url\":\"https://www.nme.com/news/music/mad-cool-2027-line-up-announced-the-strokes-the-xx-tame-impala-faith-no-more-enhyphen-more-3977083\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"Outdoor music festival main stage illuminated during a summer night concert in Madrid\",\"zh-TW\":\"西班牙馬德里戶外音樂節夜間主舞台燈光演出場景\"},\"isHeadline\":false,\"isPopular\":true,\"trustScore\":84,\"trustBreakdown\":{\"crossCorroboration\":21,\"outletReputation\":21,\"recencyClarity\":22,\"sourceDiversity\":20},\"publishedAt\":\"2026-11-27T15:56:21.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":4,\"D2\":4,\"D3\":4,\"D4\":4,\"D5\":4,\"total\":20},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-entertainment-110-mad-cool-festival-2027-lineup-madrid/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-entertainment-110-mad-cool-festival-2027-lineup-madrid/\"}],[\"$\",\"meta\",
