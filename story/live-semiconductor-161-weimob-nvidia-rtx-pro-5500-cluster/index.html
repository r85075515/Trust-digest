ting, entered into two purchase agreements on November 26, 2026, to acquire approximately 5,000 Nvidia RTX PRO 5500 Blackwell graphics processing units for roughly RMB 430.5 million. According to company statements and industry reports, the hardware will be sourced through suppliers including Ingram Micro and Shanghai Fuxin to build an in-house GPU cluster dedicated to multimodal computing, image, and video generation workloads.\n\nThe transaction highlights how Chinese enterprise software firms are adapting to U.S. semiconductor export restrictions by turning to workstation-class Blackwell GPUs that remain outside current high-end data center bans. Building dedicated internal clusters allows software providers to reduce reliance on third-party cloud rental capacity and control inference costs.\n\nDIGITIMES, The Economic Times, and MLQ.ai all reported the 5,000-unit order and the company's plan to deploy the GPUs for multimodal AI workloads. Shattered.io further specified the RMB 430.5 million contract value and named Ingram Micro and Shanghai Fuxin as the counterparties.\n\nExact delivery schedules, full technical specifications of the China-bound RTX PRO 5500 variant, and whether future U.S. regulatory updates could affect shipment completion remain unconfirmed.\nTrust label: Multi-source agreement — Multiple independent technology and financial outlets corroborate the November 26 procurement filing and scale of the GPU order."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-161-weimob-nvidia-rtx-pro-5500-cluster\",\"category\":\"semiconductor\",\"title\":{\"en\":\"China's Weimob Buys 5,000 Nvidia RTX PRO 5500 GPUs for RMB 430.5M to Build AI Cluster\",\"zh-TW\":\"中國微盟斥資 4.305 億人民幣採購 5,000 張輝達 RTX PRO 5500 GPU 自建 AI 算力叢集\"},\"summary\":{\"en\":\"Hong Kong-listed enterprise cloud software firm Weimob announced on November 26 that its subsidiary signed two agreements to purchase about 5,000 Nvidia RTX PRO 5500 Blackwell GPUs for RMB 430.5 million. The cluster will support multimodal computing infrastructure as Chinese tech companies rush to secure compliant hardware amid tightening U.S. export controls.\",\"zh-TW\":\"港股上市企業微盟（Weimob）宣布，旗下子公司於 11 月 26 日簽署兩份採購協議，斥資約 4.305 億人民幣購入約 5,000 張輝達（Nvidia）RTX PRO 5500 Blackwell 架構顯示卡，用於建置多模態運算基礎設施。此舉顯示在美國晶片出口管制收緊背景下，中國軟體企業正加速透過合規商用卡擴充本土 AI 算力。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n港股上市雲端軟體商微盟（Weimob）揭露，旗下子公司上海微盟智能計算於 2026 年 11 月 26 日簽署兩份採購協議，以約 4.305 億人民幣購入約 5,000 張輝達（Nvidia）RTX PRO 5500 Blackwell 架構 GPU。這批硬體將向英邁（Ingram Micro）與上海富欣（Shanghai Fuxin）等供應商採購，用於建置支援多模態運算、圖像及影片生成任務的自有算力叢集。\\n\\n「為什麼重要」\\n在美國持續收緊高階資料中心 AI 晶片對中出口管制的背景下，中國軟體企業正轉向尚未受限的專業工作站級 Blackwell 顯示卡以補齊算力缺口。自建專屬算力叢集不僅能降低對外部雲端租賃的依賴，也有助於在商用 AI 應用普及階段穩定推論成本。\\n\\n「來源異同」\\nDIGITIMES、《印度經濟時報》（The Economic Times）與 MLQ.ai 均一致報導微盟採購 5,000 張 RTX PRO 5500 以建置多模態 AI 叢集的計畫；科技媒體 Shattered.io 則進一步披露合約總金額約 4.305 億人民幣，以及交易對象為英邁與上海富欣。\\n\\n「仍不確定」\\n這批顯示卡的具體分批交貨時程、針對中國市場的詳細硬體規格差異，以及美國後續出口管制規則是否會波及尚未交付的訂單，目前仍未獲官方證實。\\nTrust label: Multi-source agreement — 多家獨立科技與財經媒體均已核實微盟於 11 月 26 日揭露的採購規模與用途。\"},\"glossary\":[{\"term\":{\"en\":\"Blackwell Architecture\",\"zh-TW\":\"Blackwell 架構\"},\"blurb\":{\"en\":\"Nvidia's GPU microarchitecture succeeding Hopper, spanning both data-center accelerators and RTX PRO workstation cards.\",\"zh-TW\":\"輝達繼 Hopper 之後推出的 GPU 微架構，涵蓋資料中心加速器與 RTX PRO 專業工作站顯示卡。\"}},{\"term\":{\"en\":\"Multimodal Computing\",\"zh-TW\":\"多模態運算\"},\"blurb\":{\"en\":\"AI processing that integrates and generates multiple data formats simultaneously, including text, images, audio, and video.\",\"zh-TW\":\"同時處理與生成文字、圖像、音訊與影片等多種資料型態的人工智慧運算技術。\"}},{\"term\":{\"en\":\"GPU Cluster\",\"zh-TW\":\"GPU 算力叢集\"},\"blurb\":{\"en\":\"A networked group of servers equipped with multiple graphics processors working together to train or run large AI models.\",\"zh-TW\":\"透過高速網路串連多台配備繪圖處理器的伺服器，協同執行大型 AI 模型訓練或推論的運算系統。\"}}],\"sources\":[{\"name\":\"DIGITIMES\",\"url\":\"https://www.digitimes.com/
