}],{\"children\":[[\"id\",\"live-tech-01-google-s-gemini-4-hydrog\",\"d\"],[\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$L2\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L3\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[\"__PAGE__\",[\"$\",\"$1\",\"c\",{\"children\":[\"$L4\",null,[\"$\",\"$L5\",null,{\"children\":[\"$L6\",[\"$\",\"$L7\",null,{\"promise\":\"$@8\"}]]}]]}],{},null,false]},null,false]},null,false]},null,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[[\"$\",\"$L9\",null,{\"children\":\"$La\"}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]],[\"$\",\"$Lb\",null,{\"children\":[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$c\",null,{\"fallback\":null,\"children\":\"$Ld\"}]}]}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$e\",[]],\"s\":false,\"S\":true}\n"])</script><script>self.__next_f.push([1,"f:I[8587,[\"619\",\"static/chunks/619-ba102abea3e3d0e4.js\",\"523\",\"static/chunks/523-54b2c4896553d2e9.js\",\"954\",\"static/chunks/app/story/%5Bid%5D/page-b37b1e31acb17fd9.js\"],\"default\"]\n10:T921,"])</script><script>self.__next_f.push([1,"Google is putting Gemini 4 Hydrogen at the center of Search. The model, launched four weeks ago, now powers AI Mode, where it is meant to give more helpful answers to complex questions, surface relevant links, and deliver richer visual responses. The rollout starts today across Search, the Gemini app, all tiers of Google AI Studio, the Gemini API, and Gemini for Business.\n\nWhat happened\nGoogle says Hydrogen can break down questions with multiple parts, hard-to-understand typos, or highly specific requests, and address each part in its response. The model replaces the Flash series, and benchmarks suggest it also makes the pricier Argon obsolete. The Decoder reports that Hydrogen outscores Argon just four weeks after launch. On the independent Artificial Analysis Intelligence Index, Hydrogen nearly matches Claude Sonnet 5.5 for less money, but costs about 2.5 times more per task than GPT-6.1 Sol and still falls short on agentic coding. Google's own blog says the company is bringing Gemini 4 Hydrogen to Google Search globally for more helpful, visual, and intuitive responses.\n\nWhy it matters\nThe upgrade lands in Search, so the model's quality and cost directly shape the answers Google gives to everyday questions. If Hydrogen delivers Argon-level quality at a lower price, Google can run that experience more cheaply while keeping pace with rivals. The benchmark gap on agentic coding shows where the model still lags, and the per-task cost gap with GPT-6.1 Sol sets a clear price-performance trade-off for developers choosing between models.\n\nSources agree / disagree\nTechCrunch, The Verge, Google AI Blog, and The Decoder all describe the same rollout: Hydrogen powering AI Mode in Search with better handling of complex questions. No outlet contradicts another on the launch timing or the benchmark claims.\nTrust label: Multi-source agreement — four outlets, including Google's own blog and three independent publishers, describe the same rollout and benchmark results.\n\nStill uncertain\nThe feed material gives benchmark claims without full test details, so the Artificial Analysis figures should be checked against the original index. Pricing per task and the exact scope of the global rollout may change as Google updates its documentation. The sources do not say how quickly the new model will reach every region."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-tech-01-google-s-gemini-4-hydrog\",\"category\":\"tech\",\"adult\":false,\"isHeadline\":true,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-tech-01-google-s-gemini-4-hydrog.png\",\"imageAlt\":{\"en\":\"Cover related to: Google's Gemini 4 Hydrogen outscores the bigger Argon just four weeks after its launch\",\"zh-TW\":\"相關封面圖：Google的 Gemini 4 Hydrogen 在推出僅四週後就超越了更大的 Argon\"},\"publishedAt\":\"2026-11-12T21:55:32.000Z\",\"title\":{\"en\":\"Gemini 4 Hydrogen Outscores Larger Argon Four Weeks After Launch\",\"zh-TW\":\"Gemini 4 Hydrogen 推出四週就超越更大型的 Argon\"},\"summary\":{\"en\":\"Google's Gemini 4 Hydrogen, launched four weeks ago, now powers AI Mode in Search and outperforms the larger Argon on benchmarks, according to The Decoder. The model handles complex, multi-part questions and typos, and rolls out today across Search, the Gemini app, and Google AI Studio. It nearly matches Claude Sonnet 5.5 at lower cost but trails on agentic coding.\",\"zh-TW\":\"Google 的 Gemini 4 Hydrogen 推出僅四週就在基準測試中超越更大型的 Argon，並即日起支援搜尋 AI 模式。The Decoder 指出，它在獨立評測中幾乎追上 Claude Sonnet 5.5，成本更低，但每項任務成本約為 GPT-6.1 Sol 的 2.5 倍，代理式寫程式仍落後。Google 稱新模型更擅長拆解複雜問題與辨識錯字。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"Google 把 Gemini 4 Hydrogen 推上搜尋舞台中央。這款四週前推出的模型即日起支援 AI 模式，協助回答複雜問題、呈現相關連結與更豐富的視覺回應，同步登陸搜尋、Gemini 應用程式、Google AI Studio 各級方案、Gemini API 與 Gemini for Business。\\n\\n發生了什麼事\\nGoogle 表示，Hydrogen 能拆解包含多個部分的問題、難以理解的錯字或高度具體的請求，並在回覆中逐一處理。新模型取代 Flash 系列，基準測試顯示它也讓價格更高的 Argon 顯得過時。The Decoder 報導，Hydrogen 在推出僅四週後就超越 Argon。在獨立評測 Artificial Analysis Intelligence Index 上，Hydrogen 幾乎追上 Claude Sonnet 5.5 且成本更低，但每項任務成本約為 GPT-6.1 Sol 的 2.5 倍，代理式寫程式仍落後。Google 官方部落格表示，公司正把 Gemini 4 Hydrogen 推向全球 Google 搜尋，提供更有幫助、更直覺的視覺回應。\\n\\n為什麼重要\\n這次升級落在搜尋，模型的品質與成本直接決定 Google 每天回答日常問題的水準。若 Hydrogen 能以更低成本達到 Argon 等級的品質，Google 就能以更便宜的方式運作這項體驗，同時跟上競爭對手。代理式寫程式的落差顯示模型仍有短板，每項任務成本與 GPT-6.1 Sol 的對比，也為開發者選模型時劃出清楚的性價比取捨。\\n\\n來源異同\\nTechCrunch、The Verge、Google AI Blog 與 The Decoder 描述的是同一件事：Hydrogen 支援搜尋 AI 模式，更擅長處理複雜問題。四家來源在推出時間與基準測試說法上沒有互相矛盾。\\n信任標籤：多源一致——四家媒體（含 Google 官方部落格與三家獨立媒體）對推出內容與基準測試結果的描述一致。\\n\\n仍不確定\\n來源素材只給出基準測試的結論，未附完整測試細節，Artificial Analysis 的數字應以原始評測為準。每項任務的定價與全球推出的確切範圍，可能隨 Google 更新文件而變動。來源也未說明新模型多快能覆蓋所有地區。\"},\"sources\":[{\"name\":\"TechCrunch\",\"url\":\"https://techcrunch.com/2026/11/12/googles-latest-search-upgrade-promises-better-answers-to-your-most-complicated-questions/\"},{\"name\":\"The Verge\",\"url\":\"https://www.theverge.com/ai-artificial-intelligence/1032505/google-search-ai-mode-gemini-4-hydrogen\"},{\"name\":\"Google AI Blog\",\"url\":\"https://blog.google/products-and-platforms/products/search/gemini-4-hydrogen-search-upgrade/\"},{\"name\":\"The Decoder\",\"url\":\"https://the-decoder.com/googles-gemini-4-hydrogen-outscores-the-bigger-argon-just-four-weeks-after-its-launch/\"}],\"disagreements\":null,\"trustScore\":91,\"trustBreakdown\":{\"sourceDiversity\":25,\"outletReputation\":16,\"crossCorroboration\":25,\"recencyClarity\":25},\"tags\":[\"tech\",\"live-ingest\",\"techcrunch\",\"the-verge\",\"google-ai-blog\"],\"glossary\":[{\"blurb\":{\"en\":\"Google's new AI model powering Search AI Mode.\",\"zh-TW\":\"Google 新一代 AI 模型，支援搜尋 AI 模式。\"},\"term\":{\"en\":\"Gemini 4 Hydrogen\",\"zh-TW\":\"Gemini 4 Hydrogen\"}},{\"blurb\":{\"en\":\"Google's larger, pricier AI model that Hydrogen reportedly outscores.\",\"zh-TW\":\"Google 更大、價格更高的 AI 模型，據報已被 Hydrogen 超越。\"},\"term\":{\"en\":\"Argon\",\"zh-TW\":\"Argon\"}},{\"blurb\":{\"en\":\"Google Search feature that gives AI-generated answers to complex questions.\",\"zh-TW\":\"Google 搜尋的 AI 問答功能，針對複雜問題提供 AI 生成回覆。\"},\"term\":{\"en\":\"AI Mode\",\"zh-TW\":\"AI 模式\"}},{\"blurb\":{\"en\":\"Anthropic's AI model used as a benchmark comparison.\",\"zh-TW\":\"Anthropic 的 AI 模型，在評測中作為對照。\"},\"term\":{\"en\":\"Claude Sonnet 5.5\",\"zh-TW\":\"Claude Sonnet 5.5\"}},{\"blurb\":{\"en\":\"OpenAI's model cited for the per-task cost comparison.\",\"zh-TW\":\"OpenAI 的模型，在每項任務成本對比中被引用。\"},\"term\":{\"en\":\"GPT-6.1 Sol\",\"zh-TW\":\"GPT-6.1 Sol\"}},{\"blurb\":{\"en\":\"Independent benchmark ranking AI models.\",\"zh-TW\":\"獨立 AI 模型評測榜單。\"},\"term\":{\"en\":\"Artificial Analysis Intelligence Index\",\"zh-TW\":\"Artificial Analysis Intelligence Index\"}},{\"blurb\":{\"en\":\"Google's previous model series that Hydrogen replaces.\",\"zh-TW\":\"Google 先前的模型系列，由 Hydrogen 取代。\"},\"term\":{\"en\":\"Flash\",\"zh-TW\":\"Flash\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-tech-01-google-s-gemini-4-hydrog/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story/live-tech-01-google-s-gemini-4-hydrog/\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"d:\"$8:metadata\"\n"])</script></body></html>
