s, as mercenaries of lies and suggesting they should be burned at the stake. Milei called the journalists bought-off and corrupt.\nWhat happened\nMilei singled out Alconada Mon and four other reporters, calling them mercenaries of lies. The suggestion that they should be burned at the stake was reported by ICIJ, the organization Alconada Mon belongs to. Journalists associations in Argentina leapt to their colleagues' defense, calling the remarks a death threat, though the feed text breaks off before the full statement is given. The snippets do not name the four other reporters, do not say where Milei spoke, and do not describe what prompted the remarks.\nWhy it matters\nWhen a president calls named journalists corrupt mercenaries and invokes burning at the stake, the target is not only the five reporters but the reporting itself. The journalists associations' death-threat characterization shows how the remarks landed with the profession: as intimidation, not as ordinary criticism of coverage. That distinction is the accountability question at the heart of this card.\nSources agree / disagree\nThis card rests on a single ICIJ item, and ICIJ is reporting an attack on its own member, so the account is self-interested in a way readers should know. No second outlet in the feed confirms Milei's remarks, the associations' response, or the context, and the feed text truncates the associations' statement. Trust label: Single source — one ICIJ item reporting an attack on its own member, uncorroborated in the feed.\nStill uncertain\nThe missing information is the context itself: what prompted Milei's remarks, the identities of the four other reporters, the venue and full wording, and the complete statement from the journalists associations. Those gaps must be filled from the full reporting and from independent coverage before the remarks are quoted as a settled record."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-accountability-01-bought-off-corrupt-argen\",\"category\":\"accountability\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"https://media.icij.org/uploads/2025/09/Untitled-design-11.png\",\"imageAlt\":{\"en\":\"Cover related to: ‘Bought-off, corrupt’: Argentine president attacks ICIJ member Hugo Alconada Mon\",\"zh-TW\":\"相關封面圖：（譯文待補）‘Bought-off, corrupt’: Argentine president attacks ICIJ member Hugo Alconada Mon\"},\"publishedAt\":\"2026-10-27T21:45:21.000Z\",\"title\":{\"en\":\"Javier Milei Calls Journalists Bought-Off and Corrupt in Attack on ICIJ Reporter\",\"zh-TW\":\"米雷伊（Javier Milei）稱記者「被收買、腐敗」，點名攻擊 ICIJ 成員\"},\"summary\":{\"en\":\"[Unverified, single source] Argentine President Javier Milei escalated his rhetoric against journalists on Friday, singling out veteran reporter Hugo Alconada Mon and four others as mercenaries of lies who should be burned at the stake. Journalists associations called the remarks a death threat. The trigger and full context are missing.\",\"zh-TW\":\"［未證實·單一來源］阿根廷總統米雷伊（Javier Milei）週五升高對記者的攻勢，點名資深記者阿爾科納達·蒙（Hugo Alconada Mon）等五人為「謊言的傭兵」，暗示應綁上火刑柱。記者協會稱此為「死亡威脅」。接下來看：引發言論的緣由與完整背景，摘要均未交代。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"阿根廷總統米雷伊（Javier Milei）週五升高對記者的言論攻勢，點名資深調查記者、國際調查記者同盟（ICIJ）成員阿爾科納達·蒙（Hugo Alconada Mon）與另外四名記者，稱他們是「謊言的傭兵」，並暗示應該把他們「綁上火刑柱」；米雷伊還稱這些記者「被收買、腐敗」。\\n發生了什麼事\\n米雷伊點名阿爾科納達·蒙與另外四名記者，稱他們為「謊言的傭兵」。「綁上火刑柱」的說法由阿爾科納達·蒙所屬的 ICIJ 報導。阿根廷的記者協會立刻為同行辯護，稱這些言論是「死亡威脅」，但摘要文字在完整聲明之前就截斷了。摘要沒有點名另外四名記者，沒有說明米雷伊發言的場合，也沒有描述引發這些言論的緣由。\\n為什麼重要\\n當一位總統稱具名的記者為腐敗的傭兵，並搬出火刑柱的說法，針對的不只是這五名記者，而是報導本身。記者協會以「死亡威脅」來定性這些言論，顯示這番話在新聞界聽來是恐嚇，而非對報導的一般批評；這種區分，正是本卡核心的問責問題。\\n來源異同\\n本卡只有 ICIJ 一則報導，而 ICIJ 報導的是針對自家成員的攻擊，讀者應該知道這層利害關係。摘要中沒有第二家媒體佐證米雷伊的言論、記者協會的回應或相關背景，而且摘要文字截斷了協會的聲明。信任標籤：僅1源——只有 ICIJ 一則報導，內容是針對其自家成員的攻擊，在摘要中沒有其他來源佐證。\\n仍不確定\\n缺失的資訊正是背景本身：是什麼引發米雷伊的言論、另外四名記者的身分、發言場合與完整措辭，以及記者協會聲明的全文。在把這些言論引用為定論之前，必須從完整報導與獨立報導中補齊這些缺口。\"},\"sources\":[{\"name\":\"ICIJ\",\"url\":\"https://www.icij.org/news/2026/10/bought-off-corrupt-argentine-president-attacks-icij-member-hugo-alconada-mon/\"}],\"disagreements\":null,\"trustScore\":42,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":10,\"crossCorroboration\":6,\"recencyClarity\":20},\"tags\":[\"accountability\",\"live-ingest\",\"icij\"],\"glossary\":[{\"blurb\":{\"en\":\"President of Argentina who attacked the journalists.\",\"zh-TW\":\"攻擊記者的阿根廷總統。\"},\"term\":{\"en\":\"Javier Milei\",\"zh-TW\":\"米雷伊\"}},{\"blurb\":{\"en\":\"Veteran investigative reporter and ICIJ member singled out by Milei.\",\"zh-TW\":\"遭米雷伊點名的資深調查記者與 ICIJ 成員。\"},\"term\":{\"en\":\"Hugo Alconada Mon\",\"zh-TW\":\"阿爾科納達·蒙\"}},{\"blurb\":{\"en\":\"International Consortium of Investigative Journalists, whose member was attacked.\",\"zh-TW\":\"成員遭攻擊的國際調查記者組織。\"},\"term\":{\"en\":\"ICIJ\",\"zh-TW\":\"國際調查記者同盟\"}},{\"blurb\":{\"en\":\"The country where the president attacked the journalists.\",\"zh-TW\":\"總統攻擊記者所在的國家。\"},\"term\":{\"en\":\"Argentina\",\"zh-TW\":\"阿根廷\"}},{\"blurb\":{\"en\":\"The journalist bodies that defended their colleagues and called the remarks a death threat.\",\"zh-TW\":\"為同行辯護、稱相關言論為死亡威脅的記者團體。\"},\"term\":{\"en\":\"journalists associations\",\"zh-TW\":\"記者協會\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"ht
