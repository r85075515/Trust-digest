 midterm elections. United States District Judge Trina Thompson acted on a lawsuit brought earlier Friday by unions representing California election workers.\nWhat happened\nThompson’s order, reported by The Hill, bars threats of criminal prosecution against election officials over noncitizen voting claims. Axios reports it also blocked threats against workers for counting ballots of registered voters the administration claims are ineligible. Axios adds that the order prohibits federal pressure to sideline ballots based solely on allegations of ineligibility. The Hill describes Thompson as appointed by former President Joe Biden. The material gives no order duration, full scope, or Justice Department response, and one Axios sentence breaks off mid-point.\nWhy it matters\nThe ruling is an emergency brake on federal pressure at the most sensitive moment in the election cycle: ballots must be counted on the law, not set aside because an allegation has been made. Acting four days before the midterms, the court protected counting while the eligibility dispute stays unresolved, putting the burden on the administration to prove ineligibility rather than threaten counters.\nSources agree / disagree\nThe Hill and Axios agree on the core facts: a federal judge blocked threats of criminal prosecution against election officials and workers over noncitizen voting claims, days before the midterms. No numeric or factual conflict appears between the two accounts in the material supplied. Trust label: Two-source agreement — two outlets agree on the order, its timing, and its bar on threats tied to ineligibility allegations.\nStill uncertain\nThe order’s duration, any Justice Department appeal or response, whether the alleged threats occurred, and the eligibility dispute’s outcome are unknown. A temporary restraining order is an emergency measure, not a final merits ruling."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-us-01-judge-blocks-doj-from-th\",\"category\":\"us\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-us-01-judge-blocks-doj-from-th.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Judge blocks DOJ from threatening election officials over noncitizen voting claims\",\"zh-TW\":\"相關封面圖：法官阻止司法部就非公民投票主張威脅選舉官員\"},\"publishedAt\":\"2026-10-31T03:01:46.000Z\",\"title\":{\"en\":\"Judge Trina Thompson Blocks DOJ Threats Against Election Workers Before Midterms\",\"zh-TW\":\"湯普森（Trina Thompson）法官裁定司法部不得以刑事起訴威脅選舉人員\"},\"summary\":{\"en\":\"A California federal judge Friday ordered the Trump administration to stop threatening election officials with criminal prosecution over noncitizen voting claims. Judge Trina Thompson’s temporary restraining order, sought by unions for California election workers, came four days before the midterms.\",\"zh-TW\":\"加州聯邦法官週五命令川普政府停止以刑事起訴威脅選舉官員，理由是非公民投票主張。湯普森法官的臨時限制令由加州選舉人員工會聲請，在期中選舉前四天發布。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"加州聯邦法官週五命令川普（Donald Trump）政府停止以刑事起訴威脅選舉官員，以打擊非公民投票，並在期中選舉前四天發布臨時限制令。美國聯邦地區法官湯普森（Trina Thompson）是根據代表加州選舉人員的工會當天稍早提出的訴訟做出裁定。\\n發生了什麼事\\n國會山報報導，湯普森法官的臨時限制令禁止政府以刑事起訴威脅選舉官員，理由是打擊非公民投票。Axios 報導，同一道緊急命令阻止政府威脅選舉人員，因為他們清點了政府聲稱不具資格的登記選民投下的選票；命令禁止聯邦僅憑不具資格的指控施壓、擱置選票。國會山報稱湯普森是由前總統拜登（Joe Biden）任命的法官。素材沒有給出命令的期限、完整範圍或司法部的回應，Axios 素材中一句談到司法部的句子也在中途截斷。\\n為什麼重要\\n這項裁定是在選舉週期最敏感的時刻，對聯邦施壓踩下緊急煞車：選票必須依法清點，不能只因為有人提出指控就被擱置。法院在期中選舉前四天出手，在選民資格的根本爭議尚未解決時保護了計票程序，也把舉證責任推回政府身上，必須證明不具資格，而不是威脅負責計票的人員。\\n來源異同\\n國會山報與 Axios 都同意核心事實：聯邦法官阻止以刑事起訴威脅選舉官員與選舉人員，理由是非公民投票主張，時間在期中選舉前幾天。素材中兩家報導沒有數字或事實衝突。信任標籤：兩源一致——兩家媒體對命令內容、時間點，以及禁止以不具資格指控相威脅的報導一致。\\n仍不確定\\n臨時限制令的期限、司法部是否會上訴或回應、訴訟指控的威脅是否確實發生，以及選民資格的根本爭議將如何裁決，素材都沒有交代。臨時限制令是緊急措施，不是對案情實質的最終裁決；期限、範圍與上訴情形，請查閱完整報導。\"},\"sources\":[{\"name\":\"The Hill\",\"url\":\"https://thehill.com/regulation/court-battles/6185891-judge-stops-trump-election-threats/\"},{\"name\":\"Axios\",\"url\":\"https://www.axios.com/2026/10/31/doj-threats-election-workers-midterms\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":13,\"outletReputation\":10,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"us\",\"live-ingest\",\"the-hill\",\"axios\"],\"glossary\":[{\"blurb\":{\"en\":\"United States District Judge who issued the temporary restraining order.\",\"zh-TW\":\"美國聯邦地區法官，發布臨時限制令。\"},\"term\":{\"en\":\"Trina Thompson\",\"zh-TW\":\"湯普森\"}},{\"blurb\":{\"en\":\"Federal department barred by the order from threatening election officials and workers.\",\"zh-TW\":\"聯邦部門，命令禁止其威脅選舉官員與選舉人員。\"},\"term\":{\"en\":\"Department of Justice (DOJ)\",\"zh-TW\":\"司法部\"}},{\"blurb\":{\"en\":\"Workers whose unions brought the lawsuit leading to the restraining order.\",\"zh-TW\":\"選舉人員，其工會提起訴訟，促成限制令。\"},\"term\":{\"en\":\"California election workers\",\"zh-TW\":\"加州選舉人員\"}},{\"blurb\":{\"en\":\"US political news outlet that reported the emergency order and its timing.\",\"zh-TW\":\"美國政治新聞媒體，報導緊急命令與時間點。\"},\"term\":{\"en\":\"Axios\",\"zh-TW\":\"Axios\"}},{\"blurb\":{\"en\":\"US political news outlet that reported Judge Thompson’s restraining order.\",\"zh-TW\":\"美國政治新聞媒體，報導湯普森法官的限制令。\"},\"term\":{\"en\":\"The Hill\",\"zh-TW\":\"國會山報\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://
