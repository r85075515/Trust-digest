bars.\n\nWhat happened\nIn an announcement on Thursday, the FCC said the rule will help combat an \"influx of contraband cellphones\" used to carry out crimes from prison. PBS NewsHour reports the commission acted to let state prisons across the United States jam the signals of phones smuggled to inmates, as the federal government cracks down on devices authorities call the number one security threat in the nation's correctional facilities. Jammers are generally banned under Section 333 of the Communications Act of 1934, though they are used at some federal facilities. The Verge's report breaks off before giving the FCC chair's full remarks.\n\nWhy it matters\nThe judgment is that the ban on jammers has become unenforceable inside prisons: when smuggled phones are the top security threat, the regulator is choosing to let states block the signals rather than keep chasing the devices. The unanimous vote signals that, for once, the commission is not divided on the trade-off.\n\nSources agree / disagree\nThe Verge and PBS NewsHour agree on the core facts: a unanimous FCC vote, a rule covering state and local prisons, and the justification of fighting contraband phones. The two numbers flagged in the feed — Section 333 and the \"number one\" threat ranking — are unrelated figures, not a conflict between the outlets.\n\nStill uncertain\nThe snippets do not say when the rule takes effect, what technical limits apply to jamming, how prisons must avoid blocking nearby legal signals, or what the FCC chair said in full. The scope of state versus local authority under the rule is not spelled out.\n\nTrust label: Two-source agreement — The Verge and PBS NewsHour agree on the unanimous vote, the prisons covered, and the contraband-phone justification."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-tech-01-fcc-greenlights-rule-all\",\"category\":\"tech\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-tech-01-fcc-greenlights-rule-all.jpg\",\"imageAlt\":{\"en\":\"Cover related to: FCC greenlights rule allowing prisons to jam cellphone signals\",\"zh-TW\":\"相關封面圖：FCC 批准允許監獄幹擾手機訊號\"},\"publishedAt\":\"2026-11-20T00:02:08.000Z\",\"title\":{\"en\":\"FCC Votes Unanimously to Let Prisons Jam Contraband Cellphone Signals\",\"zh-TW\":\"美國聯邦傳播委員會（Federal Communications Commission）一致通過，允許監獄干擾手機訊號\"},\"summary\":{\"en\":\"The Federal Communications Commission voted unanimously to allow prisons to jam cellphone signals, aiming to combat an influx of contraband cellphones used to carry out crimes from prison. Jammers are generally banned under Section 333 of the Communications Act of 1934, though some federal facilities already use them. Authorities call contraband phones the top security threat in correctional facilities.\",\"zh-TW\":\"美國聯邦傳播委員會（Federal Communications Commission）一致投票通過，允許州與地方監獄干擾手機訊號，以打擊用於在監獄內犯罪的違禁手機湧入。干擾器依一九三四年《通訊法》（Communications Act）第三百三十三條一般禁止使用，但部分聯邦設施已在使用。當局稱違禁手機是矯正機關的第一大安全威脅。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"美國聯邦傳播委員會（Federal Communications Commission）一致投票通過，允許州與地方監獄干擾手機訊號，對付用於在獄中犯罪的違禁手機。\\n\\n發生了什麼事\\n聯邦傳播委員會（Federal Communications Commission）週四宣布，這項規定有助於打擊用於在監獄內犯罪的違禁手機湧入。公共電視新聞時段（PBS NewsHour）報導，委員會採取行動，允許全美各州監獄干擾偷帶給受刑人的手機訊號，聯邦政府正加強取締當局稱為矯正機關第一大安全威脅的裝置。干擾器依一九三四年《通訊法》（Communications Act）第三百三十三條一般禁止使用，但部分聯邦設施已在使用。The Verge 的報導在提到聯邦傳播委員會（Federal Communications Commission）主席談話時中斷。\\n\\n為什麼重要\\n關鍵判斷在於，干擾器禁令在監獄內已難以執行：走私手機成為第一大安全威脅，主管機關選擇讓各州直接阻斷訊號，而非繼續逐一追查裝置。一致通過顯示委員會在這項取捨上沒有分歧。\\n\\n來源異同\\nThe Verge 與公共電視新聞時段（PBS NewsHour）對核心事實一致：聯邦傳播委員會（Federal Communications Commission）一致通過、規定涵蓋州與地方監獄、理由是打擊違禁手機。兩處數字並無衝突，分別是第三百三十三條與第一大威脅排名。\\n\\n仍不確定\\n摘要沒有說明規定何時生效、干擾技術有何限制、監獄如何避免阻斷周邊合法訊號，也沒有聯邦傳播委員會（Federal Communications Commission）主席談話的全文。州與地方權限在規定中的分工也未說明。\\n\\n信任標籤：雙源一致——The Verge 與公共電視新聞時段（PBS NewsHour）對一致通過、涵蓋範圍與打擊違禁手機的理由報導一致。\"},\"sources\":[{\"name\":\"The Verge\",\"url\":\"https://www.theverge.com/policy/1037987/fcc-prison-cellphone-signal-jamming\"},{\"name\":\"PBS NewsHour\",\"url\":\"https://www.pbs.org/newshour/nation/fcc-votes-to-allow-state-prisons-to-jam-signals-from-contraband-cellphones\"}],\"disagreements\":null,\"trustScore\":60,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":15,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"tech\",\"live-ingest\",\"the-verge\",\"pbs-newshour\"],\"glossary\":[{\"blurb\":{\"en\":\"U.S. regulator that voted unanimously to allow prison signal jamming.\",\"zh-TW\":\"美國主管機關，一致投票通過允許監獄干擾手機訊號。\"},\"term\":{\"en\":\"Federal Communications Commission\",\"zh-TW\":\"美國聯邦傳播委員會\"}},{\"blurb\":{\"en\":\"U.S. law whose Section 333 generally bans signal jammers.\",\"zh-TW\":\"美國法律，第三百三十三條一般禁止使用訊號干擾器。\"},\"term\":{\"en\":\"Communications Act of 1934\",\"zh-TW\":\"一九三四年《通訊法》\"}},{\"blurb\":{\"en\":\"Phone smuggled to inmates and used to carry out crimes from prison.\",\"zh-TW\":\"偷帶給受刑人的手機，用於在監獄內犯罪。\"},\"term\":{\"en\":\"contraband cellphone\",\"zh-TW\":\"違禁手機\"}},{\"blurb\":{\"en\":\"American public television news program that reported the FCC vote.\",\"zh-TW\":\"美國公共電視新聞節目，報導聯邦傳播委員會（Federal Communications Commission）投票的來源。\"},\"term\":{\"en\":\"PBS NewsHour\",\"zh-TW\":\"公共電視新聞時段\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-tech-01-fcc-greenlights-rule-all/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:d
