 after the big ground stop, while Engadget and Axios report the airline has fixed the issue behind what Axios calls a “widespread system outage.” A photo in the coverage shows United passenger planes at gates at Newark Liberty International Airport on November 15. The airline said flights in progress were unaffected and there was no sign of a cyberattack.\nWhy it matters\nFor passengers, the resolution matters more than the cause: departures are moving again. For the industry, the timing is the story — a major carrier's own systems failed days after the national air-traffic system did, which is why this week feels like a stress test for U.S. aviation rather than a single incident. The takeaway: the planes are moving again; the industry's bad week is the bigger story.\nSources agree / disagree\nCNBC, MarketWatch, The Verge, Engadget and Axios agree on the core facts — the outage, the delayed departures, the resolution, no impact on flights in progress, and no cyberattack indication. The raw feed's “15 vs 90” figures note is ingest noise: 15 is the November 15 photo date, and no 90 maps to any figure in the material.\nStill uncertain\nHow many flights were delayed, how long the outage lasted, what system failed, and what caused it were not in the feed material. Verify them in the full reporting before quoting counts or causes.\nTrust label: Multi-source agreement — five outlets agree on the outage, the resolution and the no-cyberattack statement."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-02-united-airlines-resolves\",\"category\":\"finance\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-finance-02-united-airlines-resolves.jpg\",\"imageAlt\":{\"en\":\"Cover related to: United Airlines resolves system outage that delayed flights Monday\",\"zh-TW\":\"相關封面圖：美國聯合航空解決了週一航班延誤的系統故障問題\"},\"publishedAt\":\"2026-11-17T00:00:49.000Z\",\"title\":{\"en\":\"United Airlines Fixes System Outage That Delayed Flights Days After FAA Ground Stop\",\"zh-TW\":\"聯合航空修復系統故障，週一航班延誤落幕\"},\"summary\":{\"en\":\"United Airlines has resolved a widespread system outage that delayed departing flights on Monday, saying there was no impact on flights already in progress and no indication of a cyberattack. The outage came less than a week after an air-traffic-control failure halted takeoffs nationwide. Takeaway: the planes are moving again; the industry's bad week is the bigger story.\",\"zh-TW\":\"聯合航空已解決週一導致出發航班延誤的大規模系統故障，表示對正在飛行的航班沒有影響，也沒有跡象顯示是網路攻擊。故障發生在航管通訊與雷達問題導致全美停飛不到一週後。結論：飛機又動起來了；整個產業的糟糕一週才是更大的故事。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"聯合航空表示，已解決週一導致航班延誤的系統故障，對正在飛行的航班沒有影響，也沒有跡象顯示是網路攻擊。這次修復結束了該公司動盪的一天——而故障發生在航管通訊與雷達問題導致全美停飛不到一週後。\\n發生了什麼事\\nCNBC 與 MarketWatch 報導，聯合航空週一出發航班因系統故障受擾，航空公司在美東時間下午 6 點 13 分表示問題已確認。The Verge 將其定調為大地面停飛幾天後的出發航班中斷；Engadget 與 Axios 報導航空公司已修復導致 Axios 所稱「大規模系統故障」的問題。報導中的照片顯示 11 月 15 日聯合航空客機停在紐華克自由國際機場登機口。航空公司表示，正在飛行的航班未受影響，也沒有網路攻擊的跡象。\\n為什麼重要\\n對旅客來說，修復比原因更重要：出發航班又動起來了。對產業來說，時機才是故事——一家主要航空公司的自家系統，在全國航管系統出問題幾天後也跟著故障，這讓本週感覺像是美國航空業的壓力測試，而非單一事件。結論是：飛機又動起來了；整個產業的糟糕一週才是更大的故事。\\n來源異同\\nCNBC、MarketWatch、The Verge、Engadget 與 Axios 在核心事實上一致——故障、出發航班延誤、已修復、飛行中航班未受影響、無網路攻擊跡象。來源摘要的「15 比 90」數字註記是 ingest 雜訊：15 是 11 月 15 日的照片日期，90 對應不上材料中的任何數字。\\n仍不確定\\n延誤的航班數量、故障持續多久、哪個系統出問題、原因為何，摘要都沒有，引用數量或原因前請查完整報導。\"},\"sources\":[{\"name\":\"CNBC\",\"url\":\"https://www.cnbc.com/2026/11/16/united-airlines-outage-faa.html\"},{\"name\":\"MarketWatch\",\"url\":\"https://www.marketwatch.com/story/united-airlines-suffers-system-outage-amid-lingering-faa-ground-stop-delays-5e33f94c?mod=mw_rss_topstories\"},{\"name\":\"The Verge\",\"url\":\"https://www.theverge.com/transportation/1035025/united-airlines-outage-down-departures\"},{\"name\":\"Engadget\",\"url\":\"https://www.engadget.com/2318613/united-airlines-is-experiencing-a-widespread-system-outage/\"},{\"name\":\"Axios\",\"url\":\"https://www.axios.com/2026/11/16/united-airlines-outage-faa\"}],\"disagreements\":null,\"
