 with projections of a $110 million opening weekend, including about $51 million on Friday alone. If the forecasts hold, it would be Lionsgate's first $100 million opening in 11 years.\n\nWhat happened\nJust Jared reported the projections, citing Forbes, for the prequel's opening weekend: about $51 million on Friday and $110 million across the weekend. The film is set 24 years before the original The Hunger Games. BBC Entertainment covered a different angle, with the new cast saying that joining the franchise is 'nerve-racking.'\n\nWhy it matters\nA $100 million-plus opening would end an 11-year drought for Lionsgate and prove the franchise still draws crowds more than a decade after the original films. Studios watch opening weekends as a verdict on a franchise's future, so the actuals, due in days, matter more than the projections.\n\nSources agree / disagree\nBoth outlets cover the same release, but the box-office figures come from one chain: Just Jared citing Forbes. The BBC piece does not report figures and instead covers the cast. Note that the raw feed flagged '100 vs 24' as a disagreement — that is not a conflict: 100 refers to $100 million, 24 to the 24-year prequel gap. Trust label: Two-source agreement — both outlets cover the release; the projections come from Just Jared citing Forbes.\n\nStill uncertain\nProjections are not results: the $110 million weekend and $51 million Friday figures are estimates that could move once actual ticket sales are counted. Verify the final totals against the studios' reported actuals."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-entertainment-02-the-hunger-games-sunrise\",\"category\":\"entertainment\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-entertainment-02-the-hunger-games-sunrise.jpg\",\"imageAlt\":{\"en\":\"Cover related to: ‘The Hunger Games: Sunrise on the Reaping’ Could Give Lionsgate Its First $100 Million Opening in 11 Years\",\"zh-TW\":\"相關封面圖：《飢餓遊戲：收割日出》有望為獅門影業帶來 11 年來首個 1 億美元的首映票房\"},\"publishedAt\":\"2026-11-21T07:32:35.000Z\",\"title\":{\"en\":\"The Hunger Games: Sunrise on the Reaping Eyes a $110 Million Opening for Lionsgate\",\"zh-TW\":\"《飢餓遊戲：收割日出》（The Hunger Games: Sunrise on the Reaping）首週末上看 1.1 億美元\"},\"summary\":{\"en\":\"The Hunger Games prequel Sunrise on the Reaping, the latest entry in the global blockbuster franchise, opened Friday, November 20, with projections of a $110 million opening weekend — including about $51 million on Friday — which would be Lionsgate's first $100 million opening in 11 years. Watch whether actuals match the bullish forecasts.\",\"zh-TW\":\"全球知名電影系列《飢餓遊戲》前傳《收割日出》20 日週五上映，預估首週末票房 1.1 億美元、週五單日約 5100 萬美元，有望成為獅門影業（Lionsgate）11 年來首部破億開片作品。重點：預測很樂觀，接下來看實際票房能否兌現。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"全球知名系列《飢餓遊戲》重返戲院，數字看起來很亮眼：前傳《收割日出》故事設定在原版電影 24 年前，20 日週五上映，預估首週末票房 1.1 億美元，週五單日約 5100 萬美元；若預測成真，將是獅門影業 11 年來首部破億開片作品。\\n發生了什麼事\\nJust Jared 引述《富比士》（Forbes）報導，前傳首週末預估 1.1 億美元，週五單日約 5100 萬美元。BBC 娛樂線則報導另一角度：新加入的演員群表示，加入這個系列讓人「緊張得要命」。\\n為什麼重要\\n結論很直接：破億開片將終結獅門影業 11 年的等待，證明這個系列十多年後仍有號召力。片商把首週末當成系列未來的判決，接下來看實際票房，比看預測重要。\\n來源異同\\n兩家媒體報導同一部片上映，但票房數字只有一條線：Just Jared 引述《富比士》，BBC 未報導數字、只談演員。原始摘要曾把「100 與 24」標為數字分歧，那不是衝突：100 指 1 億美元，24 指故事設定在 24 年前。信任標籤：兩源一致——兩家媒體都報導本片上映，票房預測來自 Just Jared 引述《富比士》。\\n仍不確定\\n預測不是結果：1.1 億美元週末與 5100 萬美元週五數字都是預估，實際售票統計出爐後可能變動；引用最終票房前請對照片商公布的實際數字。\"},\"sources\":[{\"name\":\"Just Jared\",\"url\":\"https://www.justjared.com/2026/11/21/the-hunger-games-sunrise-on-the-reaping-could-give-lionsgate-its-first-100-million-opening-in-11-years/\"},{\"name\":\"BBC Entertainment\",\"url\":\"https://www.bbc.co.uk/news/articles/c8752w5vz2zqo?at_medium=RSS\u0026at_campaign=rss\"}],\"disagreements\":null,\"trustScore\":45,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":12,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"entertainment\",\"live-ingest\",\"just-jared\",\"bbc-entertainment\"],\"glossary\":[{\"term\":{\"en\":
