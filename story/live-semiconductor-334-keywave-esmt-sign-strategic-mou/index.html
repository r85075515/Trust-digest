 announced a strategic Memorandum of Understanding (MOU) to evaluate integrating KEYWAVE's low-power radar sensing chips with ESMT's Sub-GHz wireless communication solutions. Both companies stated that combining sensing and wireless connectivity will be a key driver for next-generation smart Internet of Things (AIoT) deployments.\n\nWhy it matters\nPairing low-power radar sensing with Sub-GHz radio links addresses long-range, low-power edge detection requirements in smart buildings, industrial monitoring, and ambient sensing. For ESMT—traditionally known for specialty memory ICs—the partnership expands its wireless and edge-sensing ecosystem with European radar silicon expertise.\n\nSource differences\nDIGITIMES Asia published \"UK-Based KEYWAVE Technology and Taiwan's ESMT Sign Strategic MOU\", quoting KEYWAVE CEO Jenny Cheng on establishing the partnership and detailing the joint evaluation of radar sensing and Sub-GHz wireless integration. DIGITIMES Chinese published \"KEYWAVE攜手台灣晶豪科技簽署策略MOU 整合雷達與Sub-GHz搶攻\", framing the tie-up around AIoT market expansion and highlighting KEYWAVE's low-power radar chips alongside ESMT's Sub-GHz portfolio.\n\nStill uncertain\nSpecific commercial timelines, joint reference design targets, financial terms, and whether the non-binding MOU will convert into definitive supply or licensing agreements.\n\nTrust label: Single source — Both DIGITIMES Asia and DIGITIMES Chinese report from the joint KEYWAVE-ESMT strategic MOU announcement."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-334-keywave-esmt-sign-strategic-mou\",\"category\":\"semiconductor\",\"title\":{\"en\":\"UK's KEYWAVE Technology and Taiwan's ESMT Sign Strategic MOU on Radar and Sub-GHz IoT\",\"zh-TW\":\"英國 KEYWAVE 與台灣晶豪科簽署策略 MOU 整合低功耗雷達與 Sub-GHz 搶攻智慧物聯網\"},\"summary\":{\"en\":\"UK-based semiconductor firm KEYWAVE Technology and Taiwan IC designer ESMT announced a strategic memorandum of understanding to evaluate integrating low-power radar sensing with Sub-GHz wireless communications for smart IoT applications.\",\"zh-TW\":\"英國創新半導體公司 KEYWAVE Technology 與台灣專業 IC 設計廠晶豪科技（ESMT）宣布簽署策略合作備忘錄（MOU），將結合 KEYWAVE 的先進低功耗雷達感測晶片技術與晶豪科的 Sub-GHz 無線通訊解決方案，共同評估下一代智慧物聯網（AIoT）感測與長距離無線傳輸整合應用。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n英國半導體企業 KEYWAVE Technology Limited 與台灣專業 IC 設計公司晶豪科技（Elite Semiconductor Microelectronics Technology Inc.，簡稱 ESMT）宣布簽署策略合作備忘錄（MOU），計畫共同評估將 KEYWAVE 的低功耗雷達感測晶片技術，與晶豪科技的 Sub-GHz 無線通訊解決方案及相關半導體技術進行整合，開拓智慧物聯網應用市場。\\n\\n「為什麼重要」\\n將低功耗雷達感測與具備長距離、低功耗優勢的 Sub-GHz 無線通訊結合，可滿足智慧建築、工業監測與環境感知等邊緣運算場景的精準偵測需求。對以利基型記憶體 IC 聞名的晶豪科技而言，此合作有助於藉由歐洲雷達晶片技術強化其無線通訊與感測產品線布局。\\n\\n「來源異同」\\n電子時報英文版（DIGITIMES Asia）以「UK-Based KEYWAVE Technology and Taiwan's ESMT Sign Strategic MOU」為題，引述 KEYWAVE 執行長程珍妮（Jenny Cheng）對建立策略夥伴關係的說法，說明雙方將評估雷達感測與 Sub-GHz 無線通訊技術整合。電子時報中文版（DIGITIMES）則以「KEYWAVE攜手台灣晶豪科技簽署策略MOU 整合雷達與Sub-GHz搶攻」報導，側重雙方搶攻新一代智慧物聯網（AIoT）商機的技術互補定位；兩篇報導均源自雙方共同發布之合作訊息。\\n\\n「仍不確定」\\n雙方聯合參考設計的具體推出時程、商業授權或供貨條件，以及該策略備忘錄後續轉化為正式商業合約的進度，目前均未揭露。\\n\\nTrust label: Single source — DIGITIMES 中英文報導均源自 KEYWAVE 與晶豪科技共同發布之策略合作備忘錄新聞訊息。\"},\"glossary\":[{\"term\":{\"en\":\"Sub-GHz Wireless Communication\",\"zh-TW\":\"Sub-GHz 無線通訊\"},\"blurb\":{\"en\":\"Radio frequency communication operating below 1 gigahertz, prized in IoT networks for longer transmission range, better wall penetration, and lower power consumption than 2.4 GHz links.\",\"zh-TW\":\"運作頻段低於 1 GHz 的無線電通訊技術，相較 2.4 GHz 頻段具備傳輸距離更長、穿牆能力更佳與功耗更低等優勢，廣泛應用於物聯網。\"}},{\"term\":{\"en\":\"Elite Semiconductor Microelectronics Technology (ESMT)\",\"zh-TW\":\"晶豪科技（ESMT）\"},\"blurb\":{\"en\":\"A Taiwan-based fabless integrated circuit design company specializing in specialty DRAM, flash memory, analog, and wireless communication ICs.\",\"zh-TW\":\"總部位於台灣的無晶圓廠專業 IC 設計公司，主力產品涵蓋利基型動態隨機存取記憶體（DRAM）、快閃記憶體、類比及無線通訊晶片。\"}},{\"term\":{\"en\":\"Memorandum of Understanding (MOU)\",\"zh-TW\":\"策略合作備忘錄（MOU）\"},\"blurb\":{\"en\":\"A formal preliminary agreement outlining shared technical evaluation goals and bilateral cooperation intent prior to binding commercial contracts.\",\"zh-TW\":\"雙方在簽訂具法律拘束力之正式商業合約前，針對共同技術評估目標與合作方向所達成的書面意向協議。\"}}],\"sources\":[{\"name\":\"DIGITIMES Asia\",\"url\":\"https://www.digitimes.com/news/a20261126PR205/esmt-taiwan-iot.html?chid=9\"},{\"name\":\"DIGITIMES\",\"url\":\"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=0000775516_CMA432X628CATF5S41UFP\"}],\"imageUrl\":\"/covers/live/live-semiconductor-334-keywave-esmt-sign-strategic-mou.jpg\",\"imageAlt\":{\"en\":\"UK's KEYWAVE Technology and Taiwan's ESMT Sign Strategic MOU on Radar and Sub-GHz IoT\",\"zh-TW\":\"英國 KEYWAVE 與台灣晶豪科簽署策略 MOU 整合低功耗雷達與 Sub-GHz 搶攻智慧物聯網\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":75,\"trustBreakdown\":{\"crossCorroboration\":16,\"outletReputation\":22,\"recencyClarity\":24,\"sourceDiversity\":13},\"publishedAt\":\"2026-11-28T03:17:36.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":21,\"D2\":20,\"D3\":20,\"D4\":18,\"D5\":20,\"total\":20},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-semiconductor-334-keywave-esmt-sign-strategic-mou/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",
