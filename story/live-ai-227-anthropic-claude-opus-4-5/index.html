. The model is available through Anthropic's API and major cloud platforms, with reporting also highlighting integrations with Chrome and Excel.\n\n「Why it matters」\nHigher reasoning accuracy paired with lower token usage reduces per-task compute costs for multi-step software engineering and enterprise automation. Embedding model capabilities directly into browser and spreadsheet workflows lowers friction for everyday knowledge work.\n\n「Source differences」\nThe official announcement page is titled \"Introducing Claude Opus 4.5 - Anthropic\", focusing on model positioning, benchmark feedback, and availability across API and cloud platforms. A separate media report titled \"Anthropic releases Opus 4.5 with new Chrome and Excel integrations\" highlights the model's place in the 4.5 lineup and its integrations with Chrome and Excel.\n\n「Still uncertain」\nLong-term production reliability across diverse enterprise codebases and strict cost savings under varied prompting patterns depend on independent real-world benchmarks.\n\nTrust label: Medium-High confidence based on primary company announcement and independent tech reporting."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-ai-227-anthropic-claude-opus-4-5\",\"category\":\"ai\",\"title\":{\"en\":\"Anthropic Launches Claude Opus 4.5 for Coding and Agents\",\"zh-TW\":\"Anthropic 推出 Claude Opus 4.5 強化程式開發與代理能力\"},\"summary\":{\"en\":\"Anthropic introduced Claude Opus 4.5 with stronger software engineering, agentic workflows, and tool-use efficiency across API and cloud platforms. TechCrunch reported alongside the launch that the release adds Chrome and Excel integrations. The update shifts frontier model deployment toward lower token consumption and integrated workplace tooling.\",\"zh-TW\":\"Anthropic 推出旗艦模型 Claude Opus 4.5，提升程式開發、代理工作流與工具呼叫效率，並同步登上 API 與主要雲端平台。TechCrunch 報導指出該版本亦新增 Chrome 與 Excel 整合功能。整體來看，此發布推動前沿模型朝降低 Token 用量與融入日常辦公工具發展。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":
