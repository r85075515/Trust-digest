 convicted, and grief — for the complainants, for the time the case took, and for a comedy world forced to reckon with one of its own. The reports do not quote a longer statement, and no sentencing detail is in the snippets.\nWhy it matters\nThe judgment here is about tone: Ryan refuses both celebration and silence, and that middle position is the story. A verdict in a sexual assault case is not a punchline, and a comedian saying so publicly carries weight precisely because comedy has been where Brand's public persona lived. For readers, the takeaway is that the industry response is beginning — and the words chosen now will set the register for everything that follows, including sentencing.\nSources agree / disagree\nFour outlets — Just Jared, BBC Entertainment, Sky News, and The Guardian — carry the same core facts: the guilty verdict, the counts, and Ryan's quoted phrase. Trust label: Multi-source agreement — several outlets agree on the verdict and the quote, with no conflicting details.\nStill uncertain\nThe snippets give no sentencing date, no detail of the trial evidence, and no fuller version of Ryan's remarks. The Getty Images credit in the Just Jared item is a photo caption, not reporting. Check the full BBC or Guardian reports for the trial record and any sentencing timetable."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-entertainment-02-katherine-ryan-reacts-to\",\"category\":\"entertainment\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-entertainment-02-katherine-ryan-reacts-to.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Katherine Ryan Reacts to Russell Brand Verdict: ‘Relief Alongside Grief’\",\"zh-TW\":\"相關封面圖：凱瑟琳·瑞安 (Katherine Ryan) 對拉塞爾·布蘭德 (Russell Brand) 判決的反應：“悲傷與寬慰”\"},\"publishedAt\":\"2026-11-07T01:07:48.000Z\",\"title\":{\"en\":\"Katherine Ryan on Russell Brand Verdict: 'Relief Alongside Grief'\",\"zh-TW\":\"凱薩琳·萊恩談羅素·布蘭德有罪判決：「如釋重負，也心痛」\"},\"summary\":{\"en\":\"Comedian Katherine Ryan (凱薩琳·萊恩) has spoken out after actor Russell Brand (羅素·布蘭德) was found guilty on November 5 of three counts of sexual assault and one count of rape, calling her reaction 'relief alongside grief.' The takeaway: Ryan's words frame the verdict as vindication without celebration — watch how the sentencing and the wider industry response unfold.\",\"zh-TW\":\"喜劇演員凱薩琳·萊恩在演員羅素·布蘭德 11 月 5 日被判三項性侵與一項強姦罪名成立後發聲，形容自己的感受是「如釋重負，也心痛」。結論是：萊恩的說法把判決定位為遲來的公道而非值得慶祝的事，接下來看量刑與整個業界的後續反應。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"喜劇演員凱薩琳·萊恩在演員羅素·布蘭德 11 月 5 日被判三項性侵與一項強姦罪名成立後發聲，形容自己的感受是「如釋重負，也心痛」。她的發言經 Just Jared 刊出，英國各大媒體跟進，是判決後第一位公開回應的知名喜劇演員。\\n發生了什麼事\\n11 月 5 日星期四，布蘭德被判三項性侵罪與一項強姦罪成立。同為喜劇演員的萊恩公開談起判決，選了一句同時承載兩種感受的話：陪審團定罪讓人如釋重負，但同時心痛——為提告者、為案件拖延的時間，也為喜劇圈必須面對自己人涉案的現實。報導沒有引述更長的發言，摘要裡也沒有量刑細節。\\n為什麼重要\\n這件事的關鍵在語氣：萊恩既不慶祝，也不沉默，這種中間立場本身就是新聞。性侵案的判決不是笑話，而一位喜劇演員公開這樣說之所以有分量，正是因為喜劇正是布蘭德公眾形象的棲身之處。對讀者來說，結論是業界的回應才剛開始——現在選擇的字句，將決定後續一切的基調，包括量刑。\\n來源異同\\n四家媒體——Just Jared、BBC 娛樂版、Sky News、衛報——報導的核心事實一致：有罪判決、罪名數量與萊恩的引言。信任標籤：多源一致——多家媒體對判決與引言說法一致，沒有互相矛盾的細節。\\n仍不確定\\n摘要沒有量刑日期、審判證據細節，也沒有萊恩發言的完整版本。Just Jared 報導裡的 Getty Images 註記是照片來源，不是報導內容。想看審判紀錄與量刑時間表，請查 BBC 或衛報的完整報導。\"},\"sources\":[{\"name\":\"Just Jared\",\"url\":\"https://www.justjared.com/2026/11/06/katherine-ryan-reacts-to-russell-brand-verdict-relief-alongside-grief/\"},{\"name\":\"BBC Entertainment\",\"url\":\"https://www.bbc.co.uk/news/articles/cxyvrr686lzqo?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"Sky News UK\",\"url\":\"https://news.sky.com/story/katherine-ryan-feels-grief-and-relief-over-brand-guilty-verdict-13608891\"},{\"name\":\"The Guardian UK News\",\"url\":\"https://www.theguardian.com/culture/2026/nov/06/russell-brand-barrister-ian-winter-reports-himself-bar-watchdog-confronting-sunday-times-journalist\"}],\"disagreements\":null,\"trustScore\":94,\"trustBreakdown\":{\"sourceDiversity\":25,\"outletReputation\":19,\"crossCorroboration\":25,\"recencyClarity\":25},\"tags\":[\"entertainment\",\"live-ingest\",\"ju
