rt controls covering minerals critical to semiconductors and defence manufacturing.\n\nWhat happened\nDuring the APEC summit in Shenzhen, Xi Jinping and Donald Trump held their third meeting of the year. China's commerce ministry then announced that Announcement No. 46 of 2024 — which withholds permission for exports of gallium, germanium, antimony and superhard dual-use items to the US — will remain suspended.\n\nWhy it matters\nGallium, germanium and antimony feed chipmaking, optics and military supply chains, so keeping the ban paused removes a near-term choke point in US-China trade tensions and signals that the leaders' meeting produced at least a temporary de-escalation.\n\nSources agree and disagree\nThe story rests on a single CNA item from Shanghai. No second outlet in this batch confirms the extension or its terms.\n\nStill uncertain\nThe announcement gives no end date for the suspension, and the reporting does not say what conditions, if any, China attached, or whether Washington offered anything in return. The scope of the superhard materials covered is also unspecified.\n\nTrust label: Single source — one CNA item; the duration and terms of the pause are unconfirmed."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-03-h99004de4\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-taiwan-03-h99004de4.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 川習三會後　北京延長暫緩對美出口鎵鍺銻禁令\",\"zh-TW\":\"相關封面圖：（譯文待補）川習三會後　北京延長暫緩對美出口鎵鍺銻禁令\"},\"publishedAt\":\"2026-11-24T10:57:45.000Z\",\"title\":{\"en\":\"After Third Xi-Trump Meeting, Beijing Extends Pause on Gallium, Germanium and Antimony Export Ban to US\",\"zh-TW\":\"川習三會後，北京延長暫緩對美出口鎵、鍺、銻禁令\"},\"summary\":{\"en\":\"[Unverified, single source] After the third Xi-Trump meeting of the year during the APEC Shenzhen summit, China's commerce ministry said it will keep suspending a 2024 order barring exports of gallium, germanium, antimony and superhard materials to the United States. Watch how long the suspension lasts and whether Washington responds.\",\"zh-TW\":\"［未證實·單一來源］在亞太經合組織（APEC）深圳峰會期間川習年度第三次會晤後，中國商務部宣布，2024 年第 46 號公告中不予許可鎵、鍺、銻與超硬材料等兩用物項對美出口的內容繼續暫停實施。後續看暫緩期多長、美方是否回應。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"中國商務部宣布，2024 年第 46 號公告中不予許可鎵、鍺、銻與超硬材料對美國出口的內容繼續暫停實施。此舉接在川習年度第三次會晤之後，會晤在亞太經合組織（APEC）深圳峰會期間舉行，暫緩令涵蓋半導體與國防製造關鍵礦物。\\n\\n發生了什麼事\\n在 APEC 深圳峰會期間，習近平（Xi Jinping）與川普（Donald Trump）舉行年度第三次會晤。中國商務部隨後宣布，2024 年第 46 號公告涉及不予許可鎵、鍺、銻與超硬材料等兩用物項對美出口的內容繼續暫停實施。\\n\\n為什麼重要\\n鎵、鍺、銻是晶片製造、光學與軍工供應鏈的原料，禁令繼續暫緩等於移除了美中貿易緊張的一處近期瓶頸，也顯示兩國領導人會晤至少帶來短暫降溫。\\n\\n來源異同\\n本則消息僅有一則中央社（CNA）上海發出的報導。本批次沒有第二家媒體證實延長暫緩或其條件。\\n\\n仍不確定\\n公告未給出暫緩的截止日期，報導也未說明中方是否附加條件、美方是否有所回應。超硬材料的涵蓋範圍同樣未具體說明。\\n\\n信任標籤：單一來源——僅一則中央社報導，暫緩期限與條件未經證實。\"},\"sources\":[{\"name\":\"中央社-兩岸\",\"url\":\"https://www.cna.com.tw/news/acn/202611240273.aspx\"}],\"disagreements\":null,\"trustScore\":59,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"中央社-兩岸\"],\"glossary\":[{\"term\":{\"en\":\"Xi Jinping\",\"zh-TW\":\"習近平（Xi Jinping）\"},\"blurb\":{\"en\":\"General secretary of the Communist Party of China and China's president.\",\"zh-TW\":\"中共中央總書記、中國國家主席。\"}},{\"term\":{\"en\":\"Donald Trump\",\"zh-TW\":\"川普（Donald Trump）\"},\"blurb\":{\"en\":\"President of the United States.\",\"zh-TW\":\"美國總統。\"}},{\"term\":{\"en\":\"APEC\",\"zh-TW\":\"亞太經合組織（APEC）\"},\"blurb\":{\"en\":\"Asia-Pacific Economic Cooperation, a regional economic forum.\",\"zh-TW\":\"亞太地區的經濟合作論壇。\"}},{\"term\":{\"en\":\"Gallium\",\"zh-TW\":\"鎵\"},\"blurb\":{\"en\":\"A metal critical to semiconductors and optoelectronics.\",\"zh-TW\":\"半導體與光電產業的關鍵金屬。\"}},{\"term\":{\"en\":\"Germanium\",\"zh-TW\":\"鍺\"},\"blurb\":{\"en\":\"A metalloid used in fibre optics, infrared optics and solar cells.\",\"zh-TW\":\"用於光纖、紅外光學與太陽能電池的類金屬。\"}},{\"term\":{\"en\":\"Antimony\",\"zh-TW\":\"銻\"},\"blurb\":{\"e
