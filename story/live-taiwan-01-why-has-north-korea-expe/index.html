ia headlines its report as North Korea expelling the Swiss diplomat in a sanctions row. Al Jazeera, asking why North Korea expelled the diplomat from Pyongyang, says that at the centre of the diplomatic dispute lies the Songdowon International Children's Camp. Swiss officials said relations would be kept through North Korea's embassy in Bern, and through Switzerland's own embassy in Beijing. That arrangement means diplomatic contact continues through third locations even though the diplomat has been removed from Pyongyang. The feed text does not name the diplomat, give a date for the expulsion, or quote any North Korean statement.\nWhy it matters\nAn expulsion is one of the sharper tools in diplomacy, and Switzerland's role makes this one notable in the feed's framing: Bern is adjusting its channels rather than breaking relations, routing contact through its Beijing embassy and North Korea's Bern embassy instead. The dispute also touches two sensitive subjects at once, sanctions and a children's camp named as the centre of the row, which is an unusual combination that the available text does not explain.\nSources agree / disagree\nBBC News-Asia and Al Jazeera agree that a Swiss diplomat was expelled from Pyongyang. They emphasise different possible contexts — sanctions in the BBC headline, the Songdowon International Children's Camp in the Al Jazeera text — and the feed material does not say whether those are two parts of one dispute or competing explanations, so they are presented here side by side rather than merged.\nStill uncertain\nAlmost everything beyond the expulsion itself is missing from the feed: the diplomat's identity and role, North Korea's stated reason, any Swiss response beyond the channel arrangement, and how the camp and sanctions issues connect. Readers should treat the explanations as partial until fuller reporting appears.\nTrust label: Two-source agreement — two outlets agree the expulsion happened, but the reasons in the feed are fragmentary and not yet reconciled."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-01-why-has-north-korea-expe\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-taiwan-01-why-has-north-korea-expe.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Why has North Korea expelled a Swiss diplomat from Pyongyang?\",\"zh-TW\":\"相關封面圖：北韓為何將瑞士外交官驅逐出平壤？\"},\"publishedAt\":\"2026-11-26T08:54:49.000Z\",\"title\":{\"en\":\"North Korea expels Swiss diplomat from Pyongyang in sanctions row\",\"zh-TW\":\"北韓在制裁爭議中將瑞士外交官驅逐出平壤（Pyongyang）\"},\"summary\":{\"en\":\"North Korea has expelled a Swiss diplomat from Pyongyang, in a dispute the BBC links to sanctions and Al Jazeera says centres on the Songdowon International Children's Camp. Swiss officials said relations would be maintained through North Korea's embassy in Bern and Switzerland's own embassy in Beijing.\",\"zh-TW\":\"北韓將一名瑞士外交官驅逐出平壤（Pyongyang）；BBC 將爭議與制裁連結，半島電視台（Al Jazeera）則指出爭端核心是松道園國際兒童營（Songdowon International Children's Camp）。瑞士官員表示，將透過北韓駐伯爾尼（Bern）大使館與瑞士駐北京大使館維持關係。摘要未提供該外交官或驅逐令本身的更多細節。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"北韓將一名瑞士外交官驅逐出平壤；兩家來源都同意驅逐本身，但對原因只提供片段資訊。\\n發生了什麼事\\nBBC 亞洲新聞（BBC News-Asia）以制裁爭議為標題報導北韓驅逐這名瑞士外交官。半島電視台（Al Jazeera）在追問驅逐原因時指出，外交爭端的核心是松道園國際兒童營（Songdowon International Children's Camp）。瑞士官員表示，將透過北韓駐伯爾尼（Bern）大使館，以及瑞士駐北京大使館來維持關係。換言之，即使外交官被逐出平壤，雙方仍透過第三地維持外交接觸。摘要未點名該外交官、未給驅逐日期，也未引述北韓的任何聲明。\\n為什麼重要\\n驅逐外交官是外交上較尖銳的手段之一，而瑞士的處理方式值得注意：伯爾尼方面調整的是接觸管道而非斷絕關係，改由駐北京大使館與北韓駐伯爾尼大使館往來。這場爭端同時碰觸制裁與一座被指為核心的兒童營，兩者如何相關，現有摘要並未說明。\\n來源異同\\nBBC 亞洲新聞與半島電視台都同意一名瑞士外交官被逐出平壤，但強調的脈絡不同：BBC 標題指向制裁，半島電視台內文指向松道園國際兒童營。摘要沒有交代這是同一爭端的兩個面向，還是不同的解釋，因此此處並列呈現、不逕行合併。\\n仍不確定\\n除了驅逐本身，摘要幾乎缺少所有關鍵細節：外交官的身分與職務、北韓給出的理由、瑞士除管道安排外的回應，以及兒童營與制裁爭議的關聯。在更完整的報導出現前，現有解釋都應視為片段。\"},\"sources\":[{\"name\":\"BBC News-Asia\",\"url\":\"https://www.bbc.co.uk/news/articles/cq0l34e4kkr5o?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"Al Jazeera\",\"url\":\"https://www.aljazeera.com/news/2026/11/26/why-has-north-korea-expelled-a-swiss-diplomat-from-pyongyang?traffic_source=rss\"}],\"disagreements\":null,\"trustScore\":62,\"trustBreakdown\":{\"sourceDiversity\":13,\"outletReputation\":10,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"bbc-news-asia\",\"al-jazeera\"],\"glossary\":[{\"term\":{\"en\":\"Pyongyang\",\"zh-TW\":\"平壤\"},\"blurb\":{\"en\":\"The capital of North Korea, from which the Swiss diplomat was expelled.\",\"zh-TW\":\"北韓首都，瑞士外交官被驅逐離開的城市。\"}},{\"term\":{\"en\":\"Songdowon International Children's Camp\",\"zh-TW\":\"松道園國際兒童營\"},\"blurb\":{\"en\":\"The children's camp Al Jazeera places at the centre of the diplomatic dispute.\",\"zh-TW\":\"半島電視台指為外交爭端核心的兒童營。\"}},{\"term\":{\"en\":\"Bern\",\"zh-TW\":\"伯爾尼\"},\"blurb\":{\"en\":\"The Swiss capital, home to North Korea's embassy through which relations will be kept.\",\"zh-TW\":\"瑞士首都，北韓大使館所在地，將透過該館維持關係。\"}},{\"term\":{\"en\":\"BBC News\",\"zh-TW\":\"BBC 新聞\"},\"blurb\":{\"en\":\"The British broadcaster whose Asia service linked the expulsion to a sanctions row.\",\"zh-TW\":\"其亞洲服務將驅逐與制裁爭議連結的英國廣播媒體。\"}},{\"term\":{\"en\":\"Al Jazeera\",\"zh-TW\":\"半島電視台\"},\"blurb\":{\"en\":\"The broadcaster that identified the children's camp as the centre of the dispute.\",\"zh-TW\":\"指出兒童營為爭端核心的廣播媒體。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-taiwan-01-why-has-north-korea-expe/\"}],[\"$\",\"meta\",\
