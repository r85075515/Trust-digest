 with a pole and, in one headline, as a strange self-collision, without giving the candidate’s name.\nWhat happened\nHeadlines from Yahoo News Taiwan, SET News, and TVBS News agree the four-term candidate died and the commission urgently halted the election. One headline says the Taibao village chief died hitting a utility pole; another calls it a strange self-collision and says the vote will be held separately. No name, age, crash time, or official account is given; cause rests only on headline wording.\nWhy it matters\nThe takeaway is institutional, not personal gossip: the death of a candidate seeking a fifth term removes a familiar name from the ballot and forces the election machinery to stop and restart. Taibao voters lose the expected contest, and the commission must set a new vote without its central candidate. The restraint in the reporting matters too, because an unnamed death should not become a settled story about cause before officials confirm it.\nSources agree / disagree\nThe three outlets agree on the core event, a candidate’s death and a halted election, but their headline wordings differ: one stresses hitting a utility pole, while another stresses a strange self-collision. That wording difference is not resolved in the material supplied, so the cause is presented as reported wording, not established fact. Trust label: Accounts differ — outlets agree the candidate died and the election stopped, but differ in how they word the crash, and the candidate is unnamed.\nStill uncertain\nName, crash time and circumstances, self-collision, official confirmation, and the rescheduled date are unknown. Verify identity, cause, and date in full reporting and any commission announcement."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-eastAsiaGossip-01-4\",\"category\":\"eastAsiaGossip\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"publishedAt\":\"2026-10-31T03:06:25.000Z\",\"title\":{\"en\":\"Chiayi Taibao Four-Term Village Chief Candidate Dies in Pole Crash, Election Halted\",\"zh-TW\":\"嘉義太保四連霸里長候選人撞電桿身亡，選委會宣布暫停選舉\"},\"summary\":{\"en\":\"A four-term village chief candidate in Taibao, Chiayi, unnamed in three Taiwanese reports, died after crashing into a utility pole, and the election commission halted the election. With no name or crash details confirmed, this remains a reported death and postponed vote, not an established cause.\",\"zh-TW\":\"嘉義太保一名四連霸里長候選人，姓名未見於三家台媒報導，撞電桿身亡，選委會宣布暫停選舉、另行舉辦。姓名與撞車細節未獲證實，這仍是一起被報導的死亡與延後投票，不是已確立的死因。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"嘉義太保一名四連霸里長候選人，姓名未見於三家台媒報導，撞上電桿身亡，選委會宣布暫停選舉，另行舉辦。報導稱死因是撞上電桿，其中一個標題稱是離奇自撞，但沒有給出候選人姓名。\\n發生了什麼事\\n雅虎新聞、SETN 三立新聞網與 TVBS 新聞網刊載的標題都說，這名南部四連霸政壇戰將、里長候選人出事身亡，選委會緊急宣布暫停選舉。一個標題說嘉義太保四連霸里長撞電桿身亡，選委會表示將停止選舉；另一個標題稱四連霸候選人離奇自撞身亡，選委會緊急宣布停選、另行舉辦。素材沒有給出姓名、年齡、事發時間，也沒有官方對事發經過的說明，死因只停留在標題的寫法。\\n為什麼重要\\n重點在制度，不在八卦：尋求五連霸的候選人身亡，選票上少了一個熟悉的名字，選務機器必須停下來重新啟動。太保的選民失去原本預期的選舉，選委會必須在沒有這名候選人的情況下安排新的投票。報導的克制也很重要，姓名未明的死亡，在官方證實之前不應變成定論的死因故事。\\n來源異同\\n三家媒體都同意核心事件：候選人身亡、選舉暫停，但標題寫法不同，一家強調撞上電桿，另一家強調離奇自撞。素材沒有解決這個寫法差異，本卡只呈現報導的寫法，不把死因當成已確立的事實。信任標籤：敘述有分歧——各家媒體都同意候選人身亡、選舉暫停，但對撞車經過的寫法不同，候選人也未具名。\\n仍不確定\\n候選人姓名、撞車的確切時間與經過、是否為自撞、新聞報導之外的官方證實，以及重新舉行投票的日期，素材都沒有交代；姓名、死因與新的投票日期，請查閱完整報導與選委會公告。\"},\"sources\":[{\"name\":\"tw.news.yahoo.com\",\"url\":\"https://news.google.com/rss/articles/CBMihgNBVV95cUxQbHo5MkNQTjBlYTZTVzJtdndwWXpRYmlYTGFMcVUydFhRYkJFUUh6X0U1LU9fbHA3blh5TFdkNDVCdlRJMHFYWDQyVzNYLWl5N0kyMnozUHNMeGNxdkpKZG4ySW1pdnRIbW54NmNOUFVwZjY0MEJQOTRIVHhKMTVlT0U3OUd6SmpwLU40WFY5UHlmb0tWRlRxVVhlbDRuSEt0R2NTNEpjNzNFLTkwTFZ4OURRaGNua3FkeXJkSjVvd3JFRFR2b3N3N2paUkc2cUs1clhGWEdfd3RkVWU2LVowSTNTNWhiaDdfemNuMzQyRW5YaDFpYmowZW1UaG1uTWVVRmo0LXBjQmhPUnplSFZEYi1ZMFZBMU1jV2w0c1VyOFE4ajNiaDgtLURCNWFZV05XdENxZTNUdnhRbkhIWG5GMXR0VGFsRzZLVl9RV0g0NkpQYVQ4c0VWZWUwRTF0ZS1ndnl5VXJYV2s1MmgxakNsSUw5XzNjZmdsY3pSNjgwR2xVMzY0TEE?oc=5\"},{\"name\":\"setn.com\",\"url\":\"https://news.google.com/rss/articles/CBMiSEFVX3lxTE1vQ1pYS2c3VWFKM29ya3pDOEV6RDNUTFVyeU5QVVFaSks3S3l0cVVFVWpoYWIzS
