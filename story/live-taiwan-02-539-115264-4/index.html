esult the source states.\n\nWhy it matters\nFor ticket holders, the reported numbers and the payout result are the complete actionable content of this item: the five winning numbers determine the top prize, and the four winning bets set how that prize was divided, at NT$6 million each. The 3-star and 4-star numbers in the same report serve the holders of those tickets in the same way. Because lottery results are time-sensitive and are used to check tickets, readers should confirm the figures against the publisher's full item before relying on them.\n\nSources agree / disagree\nBoth feed items come from CNA's finance and securities service and agree on the draw number and the five winning numbers. The cluster flags that figures differ across the snippets, citing 600 versus 3: the 600 figure corresponds to the NT$6 million first prize stated in the payout item, while the 3 appears in the separate 3-star result in the companion item, so the flagged difference spans two different draws rather than two versions of one prize.\nTrust label: Accounts differ — The cluster flags differing figures, 600 versus 3, across its snippets, even though both items share one outlet.\n\nStill uncertain\nThe feed items give no lower-tier prize counts, no sales figures and no information about where the winning bets were placed. Feed summaries can omit context or later corrections, so anyone checking a ticket should verify all numbers, including the 3-star number 452 and the 4-star number 2311, in the publisher's complete report."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-02-539-115264-4\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-taiwan-02-539-115264-4.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 今彩539第115264期　頭獎4注中獎\",\"zh-TW\":\"相關封面圖：今彩539第115264期　頭獎4注中獎\"},\"publishedAt\":\"2026-10-31T14:04:23.000Z\",\"title\":{\"en\":\"Jincai 539 draw 115264 produces four first-prize winning bets\",\"zh-TW\":\"今彩539第115264期開獎，頭獎四注中獎各得六百萬元\"},\"summary\":{\"en\":\"Taiwan's Jincai 539 lottery draw number 115264 produced winning numbers 17, 02, 05, 28 and 37, CNA reported from Taipei on the 31st. The payout result was four first-prize winning bets, each receiving NT$6 million, alongside the 3-star and 4-star draw results.\",\"zh-TW\":\"中央社（CNA）台北三十一日報導，今彩539第115264期開獎，中獎號碼為十七、零二、零五、二十八、三十七。派彩結果為頭獎四注中獎，每注各得新台幣六百萬元，同日也公布三星彩與四星彩的開獎號碼。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"中央社（CNA）台北三十一日報導，今彩539第115264期已開獎，頭獎由四注中獎。同批內容也公布了同時開獎的三星彩與四星彩結果。\\n\\n發生了什麼事\\n今彩539第115264期的中獎號碼為十七、零二、零五、二十八、三十七。派彩結果為頭獎四注中獎，每注各得新台幣六百萬元。另一則內容公布的搭配結果為三星彩中獎號碼四五二，以及四星彩中獎號碼二三一一。摘要沒有提供其他獎項的注數或中獎地點，因此本篇不添加來源未述的拆分資訊。\\n\\n為什麼重要\\n對持票者而言，報導的號碼與派彩結果就是本則內容的完整實用資訊：五個中獎號碼決定頭獎，四注中獎則決定頭獎如何分配，每注六百萬元。同日公布的三星彩與四星彩號碼，對持有該兩種彩券的人有相同作用。彩券結果具時效性且用於對獎，讀者依賴前應先以原媒體的完整內容核對數字。\\n\\n來源異同\\n兩則內容都出自中央社產經證券線，對期別與五個中獎號碼的說法一致。本組內容標記摘要間的數字有差異，舉例為六百對三：六百對應派彩內容所述的六百萬元頭獎，三則是三星彩名稱中的數字，因此被標記的差異橫跨兩種不同的彩券，而不是同一獎項的兩個版本。\\n\\n仍不確定\\n現有內容沒有提供其他獎項的注數、銷售數字，也沒有中獎彩券售出地點的資訊。摘要可能省略脈絡或後續更正，對獎者應以原媒體的完整報導核對全部號碼，包括三星彩的四五二與四星彩的二三一一。\"},\"sources\":[{\"name\":\"中央社-產經證券\",\"url\":\"https://www.cna.com.tw/news/ahel/202610310202.aspx\"}],\"disagreements\":{\"en\":\"Figures differ across outlets (e.g. 600 vs 3 in headlines/snippets).\",\"zh-TW\":\"不同媒體的數字有所不同（例如，標題/摘要中的數字為 600 對 3）。\"},\"trustScore\":59,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":22,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"中央社-產經證券\",\"中央社-產經證券\"],\"glossary\":[{\"term\":{\"en\":\"Jincai 539\",\"zh-TW\":\"今彩539\"},\"blurb\":{\"en\":\"Jincai 539 is the lottery whose draw number 115264 is reported in this item.\",\"zh-TW\":\"今彩539是本則報導第115264期開獎的彩券。\"}},{\"term\":{\"en\":\"3-star lottery\",\"zh-TW\":\"三星彩\"},\"blurb\":{\"en\":\"The 3-star lottery is the companion draw whose winning number was reported as 452.\",\"zh-TW\":\"三星彩是同日公布結果的彩券，其中獎號碼為四五二。\"}},{\"term\":{\"en\":\"4-star lottery\",\"zh-TW\"
