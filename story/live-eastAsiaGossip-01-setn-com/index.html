g benefits for marriage and childbirth. Su Huihuang firmly opposed forced urban renewal and floated legalizing polygamy, one husband and two wives, as a way to raise the birth rate. In the closing stage, Su Qiaohui mocked Li for calling himself an expert while getting bus routes wrong and for the Taipei Dome leaks that she said embarrassed Taiwan abroad. Li hit back, saying Su Qiaohui still avoids controversies such as the Kuang Shih Intelligence (曠世智能) case.\n\nWhy it matters\nNew Taipei is Taiwan's largest city, and urban renewal decides how its aging neighborhoods are rebuilt. The three candidates offer sharply different answers: faster renewal through looser rules and higher density, a new bureau to manage the process, or a halt to forced renewal altogether. The housing and manpower proposals also show how the race ties renewal to everyday concerns such as care for seniors, support for young families, and staffing in the civil service.\n\nSources agree / disagree\nCNA, PTS, and SETN all report the same forum and the same three candidates, with matching accounts of the policy exchanges. CNA focuses on the closing-stage attacks, PTS on the policy debate, and SETN on the manpower and housing proposals.\nTrust label: Multi-source agreement — three outlets describe the same event and the same candidate positions without contradiction.\n\nStill uncertain\nThe feed material gives only brief summaries, not full transcripts, so the exact wording of each candidate's remarks should be checked against the official recording. The sources do not say how the public or polls reacted to the forum, and the Kuang Shih Intelligence controversy is mentioned only as an accusation, without detail."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-eastAsiaGossip-01-setn-com\",\"category\":\"eastAsiaGossip\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-eastAsiaGossip-01-setn-com.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 解決公務員人力荒　李四川主張鬆綁法令、蘇巧慧提婚育宅福利 - 三立新聞網SETN.com\",\"zh-TW\":\"相關封面圖：解決公務員人力荒　李四川主張鬆綁法令、蘇巧慧提婚育宅福利 - 三立新聞網SETN.com\"},\"publishedAt\":\"2026-11-13T06:14:00.000Z\",\"title\":{\"en\":\"New Taipei Mayoral Candidates Clash Over Urban Renewal at Policy Forum\",\"zh-TW\":\"新北市長政見會：李四川、蘇巧慧、蘇輝湟交鋒都更與交通\"},\"summary\":{\"en\":\"New Taipei mayoral candidates Li Sichuan, Su Qiaohui, and Su Huihuang clashed over urban renewal and transport at the city's official policy forum on November 13. Li proposed a disaster-prevention renewal committee, Su Qiaohui a new Urban Renewal Bureau, and Su Huihuang opposed forced renewal outright. The closing statements turned personal, with each side trading accusations over past controversies.\",\"zh-TW\":\"新北市長候選人李四川、蘇巧慧、蘇輝湟在 11 月 13 日公辦政見發表會上交鋒都更與交通政策，結論階段砲火猛烈。李四川主張成立委員會推動防災型都更並增加容積，蘇巧慧提出設立都更局、增加敬老卡點數，蘇輝湟堅決反對強制都更，並拋出一夫兩妻合法化構想。政見交鋒之餘，雙方也在結論階段互相翻舊帳。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"新北市長選戰 11 月 13 日在公辦政見發表會上火力全開，三名候選人針對都更、交通建設與住宅政策展開交鋒。國民黨李四川、民進黨蘇巧慧與無黨籍蘇輝湟各自端出不同的都更方案，結論階段更互相攻擊對方紀錄。\\n\\n發生了什麼事\\n李四川主張成立委員會推動「防災型都更」並增加容積，同時鬆綁法令解決公務員人力荒。蘇巧慧提出增加敬老卡點數、設立「都更局」，並提出婚育宅福利。蘇輝湟堅決反對強制都更，另拋出一夫兩妻合法化構想，希望藉此提高生育率。結論階段，蘇巧慧酸李四川自稱專家卻連公車路線都搞錯，大巨蛋漏水「丟臉到國外」；李四川則反批蘇巧慧至今仍迴避曠世智能等爭議。\\n\\n為什麼重要\\n新北是全台人口最多的城市，都更決定老舊社區如何重建。三名候選人給出截然不同的答案：鬆綁法令、提高容積以加速都更；成立專責局處管理流程；或是全面停止強制都更。人力與住宅政見也顯示，這場選戰把都更與敬老照顧、青年成家、公務人力等日常議題綁在一起。\\n\\n來源異同\\n中央社（CNA）、公視（PTS）與三立新聞網（SETN）報導的是同一場政見會、三名候選人，政策交鋒的描述一致。中央社聚焦結論階段的攻防，公視著重政策辯論，三立則關注人力荒與住宅福利。\\n信任標籤：多源一致——三家媒體對同一事件與候選人立場的描述一致，沒有互相矛盾。\\n\\n仍不確定\\n現有素材只有簡短摘要，並非完整逐字稿，候選人發言的確切用詞應以官方錄影為準。來源未說明民眾或民調對政見會的反應，曠世智能爭議也僅以指控形式被提及，未附細節。\"},\"sources\":[{\"name\":\"中央社-政治\",\"url\":\"https://www.cna.com.tw/news/aipl/202611130140.aspx\"},{\"name\":\"公視新聞網\",\"url\":\"https://news.pts.org.tw/article/835583\"},{\"name\":\"setn.com\",\"url\":\"https://news.google.com/rss/articles/CBMiSEFVX3lxTE80amlGM3VDVmktNjlYbGpjWlNJQVZVSG1CMENMQmVoR0JwekV2UloxemUyV1BTdnVHMlhUOFdqaVVBdFlmY2x6N9IBTEFVX3lxTE42WjVON0xNRHoyM1o5SjJjd3ExbGZhQ01wQ18xQ2FodjJFSVl
