on. Pike, 50, received two doses of the deadly drug pentobarbital on September 30 and was still breathing; the state called an ambulance. Her lawyers say she is \"grateful\" to the first responders and medical team who cared for her.\nWhat happened\nBBC World reports Pike was discharged 10 days after the failed execution; Axios and NPR confirm she left the hospital and returned to Tennessee prison. The execution had been halted, then cleared by the Supreme Court, then botched on September 30 — an outcome the feeds describe as unprecedented. Hollywood Life's headline asks whether Pike could be released, but no outlet reports any release order.\nWhy it matters\nThe judgment is legal, not sentimental: a botched execution of this magnitude hands Pike's lawyers their strongest possible argument — about the method, the protocol, and what the state does next. Tennessee now faces the question no corrections department wants: how do you schedule a second attempt after the first one failed on camera-ready record?\nSources agree / disagree\nBBC World, Axios, Hollywood Life, and NPR News agree on the core facts — two doses, September 30, survival, hospital discharge, return to prison. The auto-flagged \"10 vs 50\" figure conflict compares different quantities (10 days hospitalized vs. age 50), not a factual dispute. Trust label: Multi-source agreement — four outlets agree; the figure flag is a clustering artifact.\nStill uncertain\nNo outlet reports what legal steps, if any, follow the failed execution. Verify any claims about release or retrial in full reporting before quoting them."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-entertainment-01-will-christa-pike-be-rel\",\"category\":\"entertainment\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-entertainment-01-will-christa-pike-be-rel.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Will Christa Pike Be Released From Prison? Updates After Execution Was Halted\",\"zh-TW\":\"相關封面圖：克里斯塔·派克會出獄嗎？執行停止後的更新\"},\"publishedAt\":\"2026-10-10T22:15:04.000Z\",\"title\":{\"en\":\"Christa Pike Discharged From Hospital 10 Days After Failed Execution\",\"zh-TW\":\"派克（Christa Pike）注射死刑失敗10天後出院，已返回監獄\"},\"summary\":{\"en\":\"Tennessee inmate Christa Pike, 50, was discharged from hospital and returned to prison Saturday, more than a week after surviving two doses of pentobarbital on September 30. Her attorneys say she is grateful to the medical team that treated her.\",\"zh-TW\":\"田納西州受刑人派克（Christa Pike，50歲）週六出院返回監獄。她在9月30日挨了兩劑戊巴比妥（pentobarbital）仍有呼吸，送醫超過一週。律師表示，她感謝照顧她的醫療團隊。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"田納西州受刑人派克（Christa Pike）回到監獄了：律師週六表示，她在州政府注射死刑失敗後住院超過一週，已經出院。50歲的派克在9月30日挨了兩劑致命藥物戊巴比妥（pentobarbital）仍有呼吸，州政府叫了救護車。律師說，她「感謝」急救人員與醫療團隊的照顧。\\n發生了什麼事\\nBBC 報導，派克在處決失敗10天後出院；Axios 與 NPR 證實她已離開醫院、返回田納西監獄。這場處決先被叫停、經最高法院放行，卻在9月30日執行失敗——各來源都形容這是史無前例。Hollywood Life 的標題問她會不會獲釋，但沒有任何一家報導有釋放命令。\\n為什麼重要\\n重點在法律，不在人情：搞砸到這種程度的處決，等於把最強的論點親手送給派克的律師——針對執行方式、程序，以及州政府下一步該怎麼辦。田納西現在得面對沒有任何矯正機關想面對的問題：第一次已經留下完整紀錄，第二次要怎麼排？\\n來源異同\\nBBC、Axios、Hollywood Life、NPR 四家確認的核心事實一致——兩劑藥物、9月30日、存活、出院、返回監獄。系統標記的「10 對 50」數字差異，比的是不同量綱（住院10天 vs. 50歲），不是事實衝突。信任標籤：N源一致——四家媒體一致；數字標記只是抓取系統的誤判。\\n仍不確定\\n沒有任何一家報導處決失敗後的法律程序。關於釋放或重審的說法，引用前請查閱完整報導。\"},\"sources\":[{\"name\":\"BBC World\",\"url\":\"https://www.bbc.co.uk/news/articles/cmlyle97pqd7o?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"Axios\",\"url\":\"https://www.axios.com/local/nashville/2026/10/10/christa-pike-hospital-failed-lethal-injection-tennessee\"},{\"name\":\"Hollywood Life\",\"url\":\"https://hollywoodlife.com/2026/10/10/will-christa-pike-be-released-from-prison/\"},{\"name\":\"NPR News\",\"url\":\"https://www.npr.org/2026/10/10/nx-s1-5997504/christa-pike-hospital-prison-after-botched-execution\"}],\"disagreements\":{\"en\":\"Figures differ across outlets (e.g. 10 vs 50 in headlines/snippets).\",\"zh-TW\":\"不同媒體的數字有所不同（例如，標題/摘要中的數字為 10 與 50）。\"},\"trustScore\":55,\"trustBreakdown\":{\"sou
