 News' biotech edition ran the headline 'STAT+: RevMed's pancreatic cancer drug nears European approval.' The feed snippets around it are mostly newsletter boilerplate — subscription pitches, a Mark Cuban email anecdote, a tribute to a late colleague — plus items on Roivant and Priovant's Phase 3 results, OMass Therapeutics, and GSK's hepatitis B drug approval. BioPharma Dive's item in the same batch covers GSK and Ionis winning US approval for a first-of-its-kind chronic hepatitis B drug. None of the snippets name RevMed's drug, cite trial data, or describe the European review step involved.\nWhy it matters\nThe verdict is caution: pancreatic cancer drugs nearing approval are genuinely newsworthy, but a paywalled headline with no supporting detail is a signal to wait, not a fact to trade on. For readers, the value here is knowing the story exists and where to look next.\nSources agree / disagree\nThere is effectively one source — the STAT+ headline — and BioPharma Dive's story is unrelated. Trust label: Single source——the RevMed news rests on a paywalled STAT+ headline with nothing to compare against; BioPharma Dive covers a different story.\nStill uncertain\nEverything substantive: the drug's name, its trial results, which European review pathway it is in, and when a decision is expected. Treat the approval claim as unconfirmed until the full STAT+ piece or primary documents are available."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-biotech-01-stat-revmed-s-pancreatic\",\"category\":\"biotech\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-biotech-01-stat-revmed-s-pancreatic.jpg\",\"imageAlt\":{\"en\":\"Cover related to: STAT+: RevMed’s pancreatic cancer drug nears European approval\",\"zh-TW\":\"相關封面圖：STAT+：RevMed 的胰臟癌藥物即將獲得歐洲批准\"},\"publishedAt\":\"2026-10-21T16:03:00.000Z\",\"title\":{\"en\":\"STAT+: RevMed's Pancreatic Cancer Drug Nears European Approval\",\"zh-TW\":\"STAT+：RevMed 胰臟癌藥物接近獲得歐洲批准\"},\"summary\":{\"en\":\"A STAT+ headline says RevMed's pancreatic cancer drug is nearing European approval, but the feed snippets carry no substance beyond the title — no drug name, trial data, or review timeline. BioPharma Dive's item covers a different story, GSK's hepatitis B drug. Takeaway: the headline alone is not actionable; wait for the full piece.\",\"zh-TW\":\"STAT+ 的標題指出，RevMed 的胰臟癌藥物接近獲得歐洲批准，但來源摘要除了標題幾乎沒有實質內容——沒有藥名、試驗數據、審查時程。同批 BioPharma Dive 的那則是另一則新聞：GSK 的 B 肝藥物獲批。結論：光看標題無法判斷，須等完整報導。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"標題很聳動，摘要幾乎什麼都沒給：STAT+ 的一則標題說，RevMed 的胰臟癌藥物接近獲得歐洲批准——而來源摘要基本上就只有這句話。\\n發生了什麼事\\nSTAT News 生技版刊出標題「STAT+：RevMed 的胰臟癌藥物即將獲得歐洲批准」。周圍的來源摘要多半是電子報的固定版面——訂閱推銷、馬克·庫班（Mark Cuban）的郵件軼事、悼念同事——外加 Roivant 與 Priovant 的三期試驗結果、OMass Therapeutics、GSK 的 B 肝藥物獲批等條目。同批 BioPharma Dive 的那則是另一則新聞：GSK 與 Ionis 的慢性 B 肝新藥獲得美國批准。沒有任何摘要提到 RevMed 藥物的名稱、試驗數據，或它走的是歐洲哪一條審查程序。\\n為什麼重要\\n結論是謹慎：胰臟癌藥物接近獲批確實是大事，但一個沒有細節支撐的付費牆標題，是「等消息」的訊號，不是「可行動」的事實。對讀者來說，這則的價值在於知道有這條新聞、知道下一步去哪裡查。\\n來源異同\\n實質來源只有一個：STAT+ 的標題；BioPharma Dive 報的是另一則新聞。信任標籤：僅1源——RevMed 消息只有 STAT+ 的付費牆標題，無從比對；BioPharma Dive 報的是另一則新聞。\\n仍不確定\\n所有實質內容都不確定：藥名、試驗結果、走的是歐洲哪條審查程序、預計何時有決定。在看到完整 STAT+ 報導或原始文件之前，批准說法應視為未經證實。\"},\"sources\":[{\"name\":\"STAT News 生技版\",\"url\":\"https://www.statnews.com/2026/10/21/biotech-news-gsk-picks-up-hep-b-drug-approval/?utm_campaign=rss\"},{\"name\":\"BioPharma Dive\",\"url\":\"https://www.biopharmadive.com/news/gsk-ionis-fda-approve-hibsago-chronic-hepatitis-b-bepirovirsen/833541/\"}],\"disagreements\":null,\"trustScore\":54,\"trustBreakdown\":{\"sourceDiversity\":13,\"outletReputation\":10,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"biotech\",\"live-ingest\",\"stat-news-生技版\",\"stat-news-生技版\",\"stat-news-生技版\"],\"glossary\":[{\"term\":{\"en\":\"RevMed\",\"zh-TW\":\"RevMed\"},\"blurb\":{\"en\":\"Biotech company whose pancreatic cancer drug is reportedly nearing European approval.\",\"zh-TW\":\"生技公司，其胰臟癌藥物據 STAT+ 接近歐洲批准。\"}},{\"term\":{\"en\":\"STAT News\",\"zh-TW\":\"STAT News\"},\"blurb\":{\"en\":\"US biotech and health news outlet behind the STAT+ headline.\",\"zh-TW\":\"美國生技醫療新聞媒體，STAT+ 標題的出處。\"}},{\"term\":{\"en\":\"BioPharma Dive\",\"zh-TW\":\"BioPharma Dive\"},\"blurb\":{\"en\":\"Biopharma news outlet covering GSK's hepatitis B approval in the same batch.\",\"zh-TW\":\"同批報導 GSK B 肝藥物獲批的生技製藥媒體。\"}},{\"term\":{\"en\":\"GSK\",\"zh-TW\":\"GSK\"},\"blurb\":{\"en\":\"British drugmaker behind the hepatitis B drug story in the same batch.\",\"zh-TW\":\"英國製藥公司，同批 B 肝藥物新聞的主角。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://r85075515.github.io/Trust-digest/\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"Axiom\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"zh_TW\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:locale:alternate\",\"content\":\"en_US\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"9\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"10\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"11\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-
