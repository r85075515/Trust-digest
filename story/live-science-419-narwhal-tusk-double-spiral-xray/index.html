nstitute used synchrotron X-ray imaging to examine the internal structure of narwhal tusks in a study published in Nature Communications. The imaging revealed two intertwined microscopic spirals twisting in opposite directions inside the tusk, helping explain its structural durability and spiral form.\n\nWhy it matters\nNarwhal tusks grow continuously over many years while withstanding heavy mechanical loads in Arctic waters. Opposing microscopic spiral architecture resists fracture propagation while preserving growth layers that record historical environmental conditions, offering insights for structural materials and marine science.\n\nSource differences\nScienceDaily published its report under \"The narwhal's legendary \"unicorn horn\" holds a remarkable engineering secret,\" emphasizing the engineering design of the tusk and its historical archive value. SSBCrack News published its coverage under \"Narwhal Tusks Reveal Two Intertwined Spirals That Make Them Strong and Flexible,\" highlighting how the two intertwined spirals make the tusk both strong and flexible.\n\nStill uncertain\nScientists continue to study how the tusk's biological functions and growth dynamics operate across full life stages in wild narwhal populations.\n\nTrust label: Single source — Both ScienceDaily and SSBCrack News report on the same Nature Communications study and Paul Scherrer Institute research findings."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-science-419-narwhal-tusk-double-spiral-xray\",\"category\":\"science\",\"title\":{\"en\":\"Synchrotron X-Rays Reveal Counter-Twisting Double Spirals Inside Narwhal Tusks\",\"zh-TW\":\"同步輻射X光揭開獨角鯨長牙內含反向交織雙螺旋微觀結構\"},\"summary\":{\"en\":\"Researchers led by Paul Scherrer Institute scientist Marianne Liebi used synchrotron X-ray imaging in a study published in Nature Communications to show counter-twisting microscopic spirals inside narwhal tusks, explaining how the tooth combines strength and flexibility over decades of growth.\",\"zh-TW\":\"瑞士保羅謝勒研究所研究員瑪麗安·利比（Marianne Liebi）領導的團隊在《自然通訊》發表同步輻射X光成像研究，揭示獨角鯨長牙內部存在反向交織的微觀螺旋；核心結論在於該結構兼顧強度與韌性，並保存多年成長紀錄。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」根據 ScienceDaily 與 SSBCrack News 於11月27日刊出的報導，瑞士保羅謝勒研究所研究員瑪麗安·利比（Marianne Liebi）領導的團隊，運用同步輻射X光成像分析獨角鯨長牙內部微觀結構，成果發表於《自然通訊》。研究顯示長牙內部存在兩組朝相反方向盤旋交織的微觀螺旋，有助解釋其螺旋外觀與抗損韌性。\\n\\n「為什麼重要」獨角鯨長牙在長期生長過程中須承受嚴苛的機械應力，反向交織的微觀螺旋結構有助分散應力、抑制裂縫擴展，同時留存反映過往環境變遷的生長紋理，對材料力學與極地生態研究具參考價值。\\n\\n「來源異同」ScienceDaily 報導標題為「The narwhal's legendary \\\"unicorn horn\\\" holds a remarkable engineering secret」，側重長牙蘊含的工程結構巧思與紀錄價值；SSBCrack News 報導標題為「Narwhal Tusks Reveal Two Intertwined Spirals That Make Them Strong and Flexible」，聚焦雙螺旋結構如何兼顧強度與柔軟度。\\n\\n「仍不確定」野生獨角鯨在不同生命階段的長牙生長調控與完整功能機制，仍待後續研究進一步釐清。\\n\\nTrust label: Single source — ScienceDaily 與 SSBCrack News 均報導同一篇《自然通訊》論文與保羅謝勒研究所研究成果，維持單一來源標示。\"},\"glossary\":[{\"term\":{\"en\":\"Synchrotron X-ray imaging\",\"zh-TW\":\"同步輻射X光成像\"},\"blurb\":{\"en\":\"High-intensity X-ray imaging produced by a synchrotron light source to resolve fine internal structures.\",\"zh-TW\":\"利用同步輻射光源產生高亮度X光，解析材料細微內部結構的成像技術。\"}},{\"term\":{\"en\":\"Double spiral microstructure\",\"zh-TW\":\"雙螺旋微觀結構\"},\"blurb\":{\"en\":\"Two intertwined helical arrangements at a microscopic scale that shape mechanical stress distribution.\",\"zh-TW\":\"微觀尺度下兩組相互交織的螺旋排列，影響材料受力與應力分布。\"}},{\"term\":{\"en\":\"Biomineralized tissue\",\"zh-TW\":\"生物礦化組織\"},\"blurb\":{\"en\":\"Biological tissue hardened by mineral deposition, such as teeth, bone, or shell structures.\",\"zh-TW\":\"由生物體沉積礦物質而硬化的組織，如牙齒、骨骼或外殼結構。\"}},{\"term\":{\"en\":\"Growth layers\",\"zh-TW\":\"生長層\"},\"blurb\":{\"en\":\"Incremental rings or bands deposited over time that preserve records of growth and surrounding conditions.\",\"zh-TW\":\"隨時間逐層沉積的紋理帶，可保存生長歷程與環境條件紀錄。\"}}],\"sources\":[{\"name\":\"ScienceDaily\",\"url\":\"https://www.sciencedaily.com/releases/2026/11/261126063316.htm\"},{\"name\":\"SSBCrack News\",\"url\":\"https://news.
