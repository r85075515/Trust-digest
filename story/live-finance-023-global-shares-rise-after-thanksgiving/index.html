{\"en\":\"Global Shares Mostly Rise Ahead of Wall Street's Post-Thanksgiving Reopening\",\"zh-TW\":\"感恩節後美股復市前夕，歐亞股市普遍走揚、布蘭特原油漲破 97 美元\"},\"summary\":{\"en\":\"Global equities mostly advanced on Friday ahead of Wall Street's reopening after the Thanksgiving holiday, with France's CAC 40 up 0.3% and Brent crude climbing 1.09% to $97.62. Markets are stabilizing after an earlier tech sell-off.\",\"zh-TW\":\"週五美股感恩節休市後即將復市前夕，歐亞主要股市多數走揚，法國 CAC 40 指數早盤上漲 0.3%，布蘭特原油期貨上漲 1.09% 至每桶 97.62 美元。全球市場在經歷先前科技股拋售後，短線呈現止穩反彈格局。\"},\"body\":{\"en\":\"Global shares traded mostly higher on Friday ahead of Wall Street's reopening following the U.S. Thanksgiving holiday.\\n\\nIn Europe, France's CAC 40 index gained 0.3% in early trading, while Asian stock markets also advanced following an earlier tech rout. In energy markets, Brent crude, the international oil benchmark, rose 1.09% to $97.62 per barrel.\\n\\nTrading volumes remained watched closely as investors awaited U.S. market reopening and weighed energy price movements alongside recent volatility in technology stocks.\\n\\nTrust label: Multi-source agreement — AP News, Al Jazeera, and BNN Bloomberg report consistent gains across global equities and Brent crude.\",\"zh-TW\":\"「發生了什麼事」\\n在美國華爾街因感恩節休市後即將重新開盤之際，週五全球股市普遍走高。亞洲股市在經歷先前的科技股賣壓後回升，歐洲方面法國 CAC 40 指數早盤上漲 0.3%。國際油價同步走強，布蘭特原油上漲 1.09%，來到每桶 97.62 美元。\\n\\n「為什麼重要」\\n感恩節後的短交易日往往成為年末資金布局的觀察指標，歐亞股市回溫加上布蘭特原油逼近每桶 98 美元，反映市場正同時消化科技股波動與能源通膨壓力。\\n\\n「來源異同」\\n美聯社、半島電視台與 BNN Bloomberg 均報導全球股市於週五普遍走揚，其中美聯社與 BNN Bloomberg 詳列法國 CAC 40 早盤漲幅與布蘭特原油報價，半島電視台則著重亞洲市場自科技股跌勢中反彈的背景。\\n\\n「仍不確定」\\n美股復市後的實際交投動能，以及高油價是否會重新壓抑科技股與消費類股表現，仍有待紐約盤正式交易後驗證。\"},\"glossary\":[{\"term\":{\"en\":\"Brent Crude\",\"zh-TW\":\"布蘭特原油\"},\"blurb\":{\"en\":\"The primary international benchmark for global crude oil pricing.\",\"zh-TW\":\"全球最主要的國際原油定價基準。\"}},{\"term\":{\"en\":\"CAC 40\",\"zh-TW\":\"法國 CAC 40 指數\"},\"blurb\":{\"en\":\"The benchmark French stock market index tracking 40 of the largest companies listed on Euronext Paris.\",\"zh-TW\":\"追蹤巴黎泛歐交易所市值前 40 大企業的法國基準股價指數。\"}},{\"term\":{\"en\":\"Tech Rout\",\"zh-TW\":\"科技股拋售潮\"},\"blurb\":{\"en\":\"A sharp, broad-based decline in technology company share prices over a short period.\",\"zh-TW\":\"科技類股在短時間內出現大幅且廣泛的下跌行情。\"}}],\"sources\":[{\"name\":\"AP News\",\"url\":\"https://apnews.com/article/stock-markets-tariffs-ai-profits-energy-c7ef10c1dbc5fa09668bd4fe0729c613\"},{\"name\":\"Al Jazeera\",\"url\":\"https://www.aljazeera.com/economy/2026/11/27/asian-stock-markets-rise-after-earlier-tech-rout\"},{\"name\":\"BNN Bloomberg\",\"url\":\"https://www.bnnbloomberg.ca/markets/2026/11/27/global-shares-mostly-rise-ahead-of-wall-streets-reopening-after-thanksgiving/\"}],\"imageUrl\":\"/covers/live/live-finance-023-global-shares-rise-after-thanksgiving.jpg\",\"imageAlt\":{\"en\":\"Stock market display board showing Asian equity indices\",\"zh-TW\":\"顯示亞洲股市指數的電子看板\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":88,\"trustBreakdown\":{\"crossCorroboration\":23,\"outletReputation\":23,\"recencyClarity\":22,\"sourceDiversity\":20},\"publishedAt\":\"2026-11-27T13:51:37.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":4,\"D2\":4,\"D3\":4,\"D4\":4,\"D5\":4,\"total\":20},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-finance-023-global-shares-rise-after-thanksgiving/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"
