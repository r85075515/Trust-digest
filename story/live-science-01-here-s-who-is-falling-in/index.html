at adoption of the president's preferred term signals alignment with the White House.\n\nWhy it matters\nLanguage from the White House travels into budgets, regulations and public communications, so a forced rebrand is a visible measure of compliance. Agencies and companies that adopt the term signal cooperation, while those that keep saying artificial intelligence signal distance.\n\nSources agree / disagree\nThis card rests on a single MIT Technology Review report, so there is no second outlet in the material to confirm or challenge the account. No conflicting figures or names appear in the available text.\n\nStill uncertain\nThe material does not list which agencies or companies have adopted the new term, what the competing terms were, or how the order is enforced. Those are the facts that would show whether the loyalty test is working.\n\nTrust label: Single source"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-science-01-here-s-who-is-falling-in\",\"category\":\"science\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-science-01-here-s-who-is-falling-in.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Here’s who is falling in line for Trump’s “Super Intelligence” loyalty test\",\"zh-TW\":\"相關封面圖：這是誰正在排隊參加川普的「超級智力」忠誠度測試\"},\"publishedAt\":\"2026-11-03T04:18:47.000Z\",\"title\":{\"en\":\"Trump orders federal agencies to rebrand artificial intelligence as Super Intelligence\",\"zh-TW\":\"川普（Trump）下令聯邦機關把人工智慧改稱超級智慧\"},\"summary\":{\"en\":\"[Unconfirmed · Single source] At the end of September, President Trump signed an executive order directing federal agencies to rebrand artificial intelligence as 'Super Intelligence'. The renaming tests how far agencies and companies will follow the White House's language, and the next signal is which institutions adopt it.\",\"zh-TW\":\"［未證實·單一來源］川普（Trump）總統 9 月底簽署行政命令，要求聯邦機關把人工智慧改稱為「超級智慧」（Super Intelligence）。這道改名令考驗各機關與企業跟進白宮用語的程度，接下來看哪些機構率先採用。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"9 月底，川普（Trump）總統簽署一項行政命令，只有一項指令：聯邦政府機關必須把原本稱為人工智慧的東西改稱為「超級智慧」（Super Intelligence）。這道命令把用詞選擇變成忠誠度測試，《麻省理工科技評論》（MIT Technology Review）正在追蹤誰跟進。\\n\\n發生了什麼事\\n《麻省理工科技評論》（MIT Technology Review）在週報《演算法》（The Algorithm）報導，這項命令要求政府機關改用「超級智慧」（Super Intelligence）一詞。「超級智慧」擊敗其他候選名稱，但現有材料在列出候選名稱前就截斷了。報導的前提是，採用總統偏好的用詞代表與白宮立場一致。\\n\\n為什麼重要\\n白宮用語會進入預算、法規與公開溝通，強制改名因此成為衡量配合程度的明顯指標。跟進的機關與企業等於釋出合作訊號，繼續使用人工智慧一詞的則顯得保持距離。\\n\\n來源異同\\n本卡只有《麻省理工科技評論》（MIT Technology Review）一則報導，材料中沒有第二家媒體可以佐證或質疑，現有文字也沒有數字或人名衝突。\\n\\n仍不確定\\n資料沒有列出哪些機關或企業已經改用新詞、競爭的名稱有哪些，也沒有說明命令如何執行。這些才是判斷忠誠度測試是否奏效的關鍵事實。\"},\"sources\":[{\"name\":\"MIT Technology Review\",\"url\":\"https://www.technologyreview.com/2026/11/02/1147932/heres-who-is-falling-in-line-for-trumps-super-intelligence-loyalty-test/\"}],\"disagreements\":null,\"trustScore\":47,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":10,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"science\",\"live-ingest\",\"mit-technology-review\"],\"glossary\":[{\"blurb\":{\"en\":\"The US president who signed the rebranding executive order.\",\"zh-TW\":\"簽署改名行政命令的美國總統。\"},\"term\":{\"en\":\"Donald Trump\",\"zh-TW\":\"川普\"}},{\"blurb\":{\"en\":\"A weekly MIT Technology Review newsletter on AI.\",\"zh-TW\":\"《麻省理工科技評論》（MIT Technology Review）關於人工智慧的週報。\"},\"term\":{\"en\":\"The Algorithm\",\"zh-TW\":\"演算法\"}},{\"blurb\":{\"en\":\"A technology publication reporting the executive order.\",\"zh-TW\":\"報導這項行政命令的科技刊物。\"},\"term\":{\"en\":\"MIT Technology Review\",\"zh-TW\":\"麻省理工科技評論\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news diges
