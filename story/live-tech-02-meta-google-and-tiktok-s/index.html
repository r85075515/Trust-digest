e TechCrunch's headline names the California attorney general as the defendant. The feed summaries do not give the courts where the suits were filed, the specific provisions being challenged, or the state's response.\nWhy it matters\nThe case pits two powerful claims against each other: the state's interest in shielding children under 16 from social media, and the platforms' argument that restricting access violates free speech. How courts resolve it will shape not only California's law but the wave of state-level age-assurance rules across the United States. With the law taking effect in just over a year, the lawsuits also set up a race between the courtroom and the calendar: an injunction could freeze the law before it ever applies, while a loss for the companies would force major redesigns of how platforms verify age.\nSources agree / disagree\nTechCrunch and The Hill agree on the core facts: three companies, separate lawsuits, a California law restricting under-16 social media access, and a First Amendment challenge. The figures that look different are different quantities, not conflicts: 16 is the age threshold and January 1, 2027 is the effective date. Trust label: Two-source agreement — two outlets agree on the core facts.\nStill uncertain\nThe summaries are cut off, so the law's exact requirements, the platforms' specific arguments, and the attorney general's response are not in the sources. Which court will hear the cases, and whether the companies will seek to block the law before it takes effect, are also not stated. Verify details in the full reporting before quoting specifics."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-tech-02-meta-google-and-tiktok-s\",\"category\":\"tech\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-tech-02-meta-google-and-tiktok-s.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Meta, Google, and TikTok sue California AG over teen social media law\",\"zh-TW\":\"相關封面圖：Meta、谷歌和 TikTok 就青少年社交媒體法起訴加州 AG\"},\"publishedAt\":\"2026-11-06T00:51:06.000Z\",\"title\":{\"en\":\"Meta, Google and TikTok Sue California Over Teen Social Media Law\",\"zh-TW\":\"Meta、Google 與 TikTok 就青少年社群媒體法起訴加州\"},\"summary\":{\"en\":\"Meta, Google and TikTok have filed separate lawsuits against California over the Digital Age Assurance Act, a bipartisan law taking effect January 1, 2027 that would restrict social media access for children under 16. The companies argue it violates their First Amendment rights.\",\"zh-TW\":\"Meta、Google 與 TikTok 分別對加州提起訴訟，挑戰《數位年齡保障法案》，這部兩黨共同通過的法律預定 2027 年 1 月 1 日生效，將限制 16 歲以下兒童使用社群媒體。三家公司主張該法侵犯其言論自由。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"Meta、Google 與 TikTok 分別對加州提起訴訟，挑戰一項收緊兒童社群媒體使用的新法，主張該法侵犯企業的言論自由，TechCrunch 與《國會山報》（The Hill）如此報導。\\n發生了什麼事\\n涉案法案是加州兩黨共同通過的《數位年齡保障法案》（Digital Age Assurance Act），預定 2027 年 1 月 1 日生效。法案若生效，將限制 16 歲以下兒童使用社群媒體。三家公司分別提告，從言論自由的角度挑戰這項法律。《國會山報》的標題把爭議定位為對兒童網路安全限制的挑戰，TechCrunch 的標題則點名加州檢察長是被告。來源摘要沒有寫明訴訟向哪個法院提出、挑戰的具體條文，也沒有加州方面的回應。\\n為什麼重要\\n這起訴訟讓兩種強有力的主張正面交鋒：州政府保護 16 歲以下兒童遠離社群媒體的利益，以及平台主張限制使用侵犯言論自由。法院如何裁決，不只決定加州這部法律的命運，也會影響全美各州陸續推動的年齡驗證規範。法案生效日只剩一年多，訴訟也形成法庭與日曆的賽跑：禁制令可能讓法律在生效前就被凍結，平台若敗訴，則必須大幅改造年齡驗證方式。\\n來源異同\\nTechCrunch 與《國會山報》對核心事實的報導一致：三家公司、分別提告、加州法律限制 16 歲以下使用社群媒體、以言論自由為由挑戰。看似不同的數字說的是不同的事，不是衝突：16 是年齡門檻，2027 年 1 月 1 日是生效日期。信任標籤：雙源一致——兩家媒體對核心事實的報導一致。\\n仍不確定\\n來源摘要中途截斷，法案的具體要求、平台的具體主張、檢察長的回應都不在來源之中。案件由哪個法院審理、企業是否會在生效前聲請禁制令，也沒有寫明；引用細節前請查閱完整報導。\"},\"sources\":[{\"name\":\"TechCrunch\",\"url\":\"https://techcrunch.com/2026/11/05/meta-google-and-tiktok-sue-california-ag-over-teen-social-media-law/\"},{\"name\":\"The Hill\",\"url\":\"https://thehill.com/policy/technology/6202882-meta-tiktok-google-social-media-california/\"}],\"disagreements\":null,\"trustScore\":61,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":16,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"tech\",\"live-ingest\",\"techcrunch\",\"the-hill\"],\"glossary\":[{\"blurb\":{\"en\":\"Parent company of Facebook and Instagram, one of the three companies suing California.\",\"zh-TW\":\"臉書與 Instagram 的母公司，三家提告企業之一。\"},\"term\":{\"en\":\"Meta\",\"zh-TW\":\"Meta\"}},{\"blurb\":{\"en\":\"Technology company and one of the three companies suing California.\",\"zh-TW\":\"三家提告企業之一的科技公司。\"},\"term\":{\"en\":\"Google\",\"zh-TW\":\"Google\"}},{\"blurb\":{\"en\":\"Short-video platform and one of the three companies suing California.\",\"zh-TW\":\"三家提告企業之一的短影音平台。\"},\"term\":{\"en\":\"TikTok\",\"zh-TW\":\"TikTok\"}},{\"blurb\":{\"en\":\"California's bipartisan law restricting social media access for children under 16.\",\"zh-TW\":\"加州兩黨共同通過、限制 16 歲以下兒童使用社群媒體的法律。\"},\"term\":{\"en\":\"Digital Age Assurance Act\",\"zh-TW\":\"《數位年齡保障法案》\"}},{\"blurb\":{\"en\":\"California's chief law officer, named as the defendant in the TechCrunch headline.\",\"zh-TW\":\"加州首席法律官員，TechCrunch 標題點名的被告。\"},\"term\":{\"en\":\"California Attorney General\",\"zh-TW\":\"加州檢察長\"}},{\"blurb\":{\"en\":\"The U.S. constitutional protection of free speech, cited by the companies in their suits.\",\"zh-TW\":\"美國憲法對言論自由的保障，三家公司訴訟中援引的依據。\"},\"term\":{\"en\":\"First Amendment\",\"zh-TW\":\"美國憲法第一修正案\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-tech-02-meta-google-and-tiktok-s/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Biling
