ad flooding, power outages, and travel disruptions across multiple states, forcing New York's iconic Macy's Thanksgiving Day Parade to be postponed for the first time in its history.\n\nThanksgiving is one of the busiest travel holidays in the United States. Simultaneous severe weather on both coasts disrupts holiday transit networks, strains local emergency services, and underscores the growing vulnerability of major public events and coastal infrastructure.\n\nBoth The Guardian and ABC10 (citing the Associated Press) report on the heavy rain, flooding, and widespread holiday disruptions across multiple states, with The Guardian detailing the historic postponement of the Macy's parade.\n\nThe full extent of flood damage, the timeline for restoring power and normal transit in affected areas, and rescheduled details for the postponed parade remain to be finalized by local authorities and organizers.\n\nTrust label: Verified by major news outlets and wire reporting on ongoing severe weather events."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-us-007-thanksgiving-storms-macys-parade\",\"category\":\"us\",\"title\":{\"en\":\"Severe Thanksgiving Storms and Flooding Hit Both U.S. Coasts, Postponing Macy's Parade\",\"zh-TW\":\"強烈風暴與極端潮汐重創美國感恩節 紐約梅西大遊行史上首度延期\"},\"summary\":{\"en\":\"Heavy rain, strong winds, and extreme tides struck both U.S. coasts on Thanksgiving, triggering multi-state flooding, power outages, and the first-ever postponement of New York's Macy's Parade.\",\"zh-TW\":\"強降雨、強風與極端大潮在感恩節席捲美國東西岸，引發多州淹水、停電與交通中斷，紐約梅西感恩節大遊行也被迫史上首度延期，凸顯極端氣候對重大節慶與基礎設施的衝擊。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n強降雨、強風與極端大潮在感恩節當天席捲美國東西岸，造成多州出現嚴重淹水、停電與交通中斷。受惡劣天氣影響，紐約著名的梅西感恩節大遊行也被迫宣布史上首度延期。\\n\\n「為什麼重要」\\n感恩節是美國全年最繁忙的返鄉與旅遊尖峰期之一。東西岸同時遭遇強烈風暴不僅打亂大批民眾的假期行程、考驗地方基礎設施與救災量能，連歷史悠久的指標性慶典也罕見被迫延期。\\n\\n「來源異同」\\nThe Guardian 與 ABC10（引述 Associated Press）均報導了感恩節期間的強降雨、淹水與交通中斷災情，其中 The Guardian 進一步聚焦於梅西大遊行史上首度延期的細節。\\n\\n「仍不確定」\\n各地淹水與停電的完整災損統計、受影響地區交通全面恢復正常的時間，以及梅西大遊行延期後的具體補辦安排，仍有待當地政府與主辦單位進一步公布。\"},\"glossary\":[{\"term\":{\"en\":\"Macy's Thanksgiving Day Parade\",\"zh-TW\":\"梅西感恩節大遊行\"},\"blurb\":{\"en\":\"An annual holiday parade held in New York City presented by the U.S.-based department store chain Macy's, famous for its giant character balloons.\",\"zh-TW\":\"由美國梅西百貨在紐約市舉辦的年度感恩節盛事，以巨型氣球與花車聞名，為美國指標性節慶活動。\"}},{\"term\":{\"en\":\"Extreme Tides\",\"zh-TW\":\"極端大潮\"},\"blurb\":{\"en\":\"Exceptionally high ocean tides that significantly increase the risk of coastal flooding when combined with storm surges and heavy rain.\",\"zh-TW\":\"異常偏高的海水潮位，當與風暴潮或強降雨同時發生時，極易引發嚴重的沿海淹水災情。\"}},{\"term\":{\"en\":\"Travel Disruptions\",\"zh-TW\":\"交通中斷\"},\"blurb\":{\"en\":\"Widespread flight cancellations, road closures, and transit delays caused by hazardous weather conditions.\",\"zh-TW\":\"因惡劣天氣引發的大規模航班取消、道路封閉與大眾運輸延誤。\"}}],\"sources\":[{\"name\":\"The Guardian\",\"url\":\"https://www.theguardian.com/us-news/2026/nov/26/storm-thanksgiving-parade-cancellations-severe-weather\"},{\"name\":\"ABC10（Associated Press）\",\"url\":\"https://www.abc10.com/article/news/nation-world/rain-flooding-thanksgiving/507-67e2c505-b7c9-4a9e-b3e7-3d5b789f74ee\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"Heavy rain and flooded streets during severe Thanksgiving storms in the United States\",\"zh-TW\":\"美國感恩節強烈風暴帶來的豪雨與街道淹水景象\"},\"isHeadline\":true,\"isPopular\":true,\"trustScore\":89,\"trustBreakdown\":{\"crossCorroboration\":23,\"outletReputation\":23,\"recencyClarity\":23,\"sourceDiversity\":20},\"publishedAt\":\"2026-11-27T13:26:55.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":5,\"D2\":5,\"D3\":5,\"D4\":5,\"D5\":5,\"total\":25},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\
