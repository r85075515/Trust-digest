covers the first edition of the English festival since 2025, running June 23–27, with the full music programme on Friday, Saturday and Sunday. The undercard includes Lily Allen, Kacey Musgraves, Robyn and Sombr, alongside the three headliners. Cher will take the Sunday \"legends\" slot, the unofficial fourth headline set, Rolling Stone and the BBC report.\nWhy it matters\nGlastonbury's headline bill is the year's most-watched festival announcement, and three headline acts plus a legends-slot Cher give the 2027 return unusual star power after a year away. The lineup drives ticket demand and sets the summer's touring agenda. Takeaway: the 2027 bill is a statement of intent, and the next test is whether tickets and the full undercard live up to it.\nSources agree / disagree\nBillboard, Rolling Stone, the BBC and Sky News agree on the three headliners and the 2027 date. Rolling Stone and the BBC also name Cher for the Sunday legends slot, a detail the shorter Billboard and Sky reports do not carry in their feed descriptions.\nStill uncertain\nThe feed descriptions do not give ticket sale dates, prices, or the full undercard beyond the names listed. Day splits for the three headliners are also not stated in the material provided.\nTrust label: Multi-source agreement — Four outlets report the same three headliners for Glastonbury 2027."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-entertainment-01-harry-styles-sam-fender-\",\"category\":\"entertainment\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-entertainment-01-harry-styles-sam-fender-.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Harry Styles, Sam Fender \u0026 Billie Eilish to Headline Glastonbury Festival 2027: See Lineup\",\"zh-TW\":\"相關封面圖：（譯文待補）Harry Styles, Sam Fender \u0026 Billie Eilish to Headline Glastonbury Festival 2027: See Lineup\"},\"publishedAt\":\"2026-11-18T08:45:24.000Z\",\"title\":{\"en\":\"Harry Styles, Sam Fender and Billie Eilish to Headline Glastonbury Festival 2027\",\"zh-TW\":\"哈利·史泰爾斯（Harry Styles）、山姆·芬德（Sam Fender）與比莉·艾利許（Billie Eilish）領銜 2027 年格拉斯頓伯里音樂節（Glastonbury Festival）\"},\"summary\":{\"en\":\"Pop stars Harry Styles, Sam Fender and Billie Eilish will headline Glastonbury Festival 2027, announced on Wednesday (Nov. 18). The June 23–27 festival is the first edition since 2025, with Cher taking the Sunday legends slot. The lineup sets up a major return for the festival; watch for ticket details and the full undercard.\",\"zh-TW\":\"流行歌手哈利·史泰爾斯（Harry Styles）、山姆·芬德（Sam Fender）與比莉·艾利許（Billie Eilish）將領銜 2027 年格拉斯頓伯里音樂節（Glastonbury Festival），主辦方於週三（11 月 18 日）公布陣容。這屆音樂節於 6 月 23 至 27 日舉行，是 2025 年以來首屆，雪兒（Cher）將登上週日傳奇時段。陣容宣告音樂節強勢回歸；接下來看售票細節與完整演出名單。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"哈利·史泰爾斯（Harry Styles）、山姆·芬德（Sam Fender）與比莉·艾利許（Billie Eilish）將領銜 2027 年格拉斯頓伯里音樂節（Glastonbury Festival），主辦方於 11 月 18 日週三公布陣容。\\n發生了什麼事\\n本屆是 2025 年以來首屆音樂節，於 6 月 23 至 27 日舉行，完整音樂節目安排在週五、週六與週日。除了三位領銜歌手，演出名單還包括莉莉·艾倫（Lily Allen）、凱西·瑪絲葛芙（Kacey Musgraves）、蘿蘋（Robyn）與 Sombr。滾石雜誌與 BBC 報導，雪兒（Cher）將登上週日「傳奇」時段，是非官方的第四組壓軸。\\n為什麼重要\\n格拉斯頓伯里壓軸陣容是年度最受矚目的音樂節公布，睽違一年回歸，又有三組壓軸加上傳奇時段的雪兒，星光格外耀眼。陣容帶動搶票熱度，也定下夏季巡演的基調。結論：2027 年陣容是強勢回歸的宣示，下一步看售票與完整名單是否延續這股氣勢。\\n來源異同\\nBillboard、滾石雜誌、BBC 與天空新聞對三位領銜歌手與 2027 年日期說法一致。滾石雜誌與 BBC 還點名雪兒出演週日傳奇時段，Billboard 與天空新聞較短的摘要未提及此細節。\\n仍不確定\\n摘要未提供售票日期、票價，也未列出已公布名字之外的完整演出名單。三位領銜歌手各負責哪一天，現有資料也未說明。\"},\"sources\":[{\"name\":\"Billboard\",\"url\":\"https://www.billboard.com/music/music-news/glastonbury-2027-headliners-lineup-1236384106/\"},{\"name\":\"Rolling Stone Music\",\"url\":\"https://www.rollingstone.com/music/music-news/harry-styles-billie-eilish-cher-glastonbury-lineup-2027-1235660230/\"},{\"name\":\"BBC Entertainment\",\"url\":\"https://www.bbc.co.uk/news/articles/crwy4w381nlpo?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"Sky News UK\",\"url\":\"https://news.sky.com/story/harry-styles-sam-fender-and-billie-eilish-to-headline-glastonbury-13613219\"}],\"disagreements\":null,\"trustScore\":90,\"trustBreakdown\":{\"sourceDiversity\":25,\"outletReputation\":18,\"crossCorroboration\":22,\"recencyClarity\":25},\"tags\":[\"entertainment\",\"live-ingest\",\"billboard\",\"rolling-stone-music\",\"bbc-entertainment\"],\"glossary\":[{\"term\":{\"en\":\"Harry Styles\",\"zh-TW\":\"哈利·史泰爾斯（Harry Styles）\"},\"blurb\":{\"en\":\"English pop star headlining Glastonbury 2027.\",\"zh-TW\":\"領銜 2027 年格拉斯頓伯里音樂節的英國流行歌手。\"}},{\"term\":{\"en\":\"Sam Fender\",\"zh-TW\":\"山姆·芬德（Sam Fender）\"},\"blurb\":{\"en\":\"English singer-songwriter headlining Glastonbury 2027.\",\"zh-TW\":\"領銜 2027 年格拉斯頓伯里音樂節的英國創作歌手。\"}},{\"term\":{\"en\":\"Billie Eilish\",\"zh-TW\":\"比莉·艾利許（Billie Eilish）\"},\"blurb\":{\"en\":\"American singer-songwriter headlining Glastonbury 2027.\",\"zh-TW\":\"領銜 2027 年格拉斯頓伯里音樂節的美國創作歌手。\"}},{\"term\":{\"en\":\"Cher\",\"zh-TW\":\"雪兒（Cher）\"},\"blurb\":{\"en\":\"American singer taking the Sunday legends slot at Glastonbury 2027.\",\"zh-TW\":\"將登上 2027 年格拉斯頓伯里音樂節週日傳奇時段的美國歌手。\"}},{\"term\":{\"en\":\"Glastonbury Festival\",\"zh-TW\":\"格拉斯頓伯里音樂節（Glastonbury Festival）\"},\"blurb\":{\"en\":\"English music festival returning in 2027 after a year away.\",\"zh-TW\":\"睽違一年於 2027 年回歸的英國音樂節。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-entertainment-01-harry-styles-sam-fender-/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"prop
