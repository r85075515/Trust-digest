 in Lingya District, in a five-storey subdivided rental house, forced 13 people out; 11 went to hospital with smoke inhalation and other complaints, none in life-threatening condition.\nWhy it matters\nThe judgment is about the housing behind the headlines: tin-roof row houses and subdivided rentals burn fast and trap people inside. Two fires in one city on one day, with two teenagers dead in one and eleven hospitalised in the other, point to the same risk — cheap, dense housing with too few ways out.\nSources agree / disagree\nPTS and Liberty Times agree on the core facts — the Niaosong fire, the two deaths, the brothers' ages and the spread to nearby buildings — with no conflicting details. Trust label: Multi-source agreement — two outlets agree on the core facts.\nStill uncertain\nNeither snippet gives the cause of either fire, how the brothers were trapped, or the condition of the subdivided house. Verify the fire investigation's findings in the full reporting."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-taiwan-03-2\",\"category\":\"taiwan\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-taiwan-03-2.jpg\",\"imageAlt\":{\"en\":\"Cover: the Niaosong tin-roof house fire in Kaohsiung that killed two teenage brothers.\",\"zh-TW\":\"封面：高雄鳥松鐵皮屋火警，兩名少年兄弟不幸身亡。\"},\"publishedAt\":\"2026-11-08T07:23:56.000Z\",\"title\":{\"en\":\"Kaohsiung Fire Kills Two Brothers, 17 and 19, in Niaosong Tin-Roof House\",\"zh-TW\":\"高雄鳥松鐵皮屋火警：17 歲與 19 歲兄弟逃生不及身亡\"},\"summary\":{\"en\":\"A fire swept a tin-roof house in Kaohsiung's Niaosong District on the morning of November 8, killing two brothers aged 17 and 19 who could not escape, PTS and Liberty Times report. The blaze spread to a nearby factory and adjoining houses. A separate overnight fire in Lingya District sent 11 people to hospital; none is in life-threatening condition.\",\"zh-TW\":\"高雄市鳥松區 8 日上午發生鐵皮屋民宅火警，17 歲與 19 歲兩兄弟逃生不及身亡，公視（PTS）與自由時報（Liberty Times）報導。火勢延燒到附近廠房與連棟鐵皮屋。苓雅區凌晨另有一棟分租套房透天厝起火，13 人疏散、11 人送醫，均無生命危險。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"高雄市鳥松區 8 日上午發生鐵皮屋民宅火警，17 歲與 19 歲兩兄弟逃生不及身亡。火勢從鐵皮屋延燒到附近廠房與連棟鐵皮屋，消防人員撲滅火勢後才發現兩人。\\n發生了什麼事\\n公視（PTS）報導，火警發生在上午 8 時左右，延燒至附近廠房。自由時報（Liberty Times）補充地點與家屬細節：忠誠路一家鐵皮工廠起火，延燒至中正路連棟鐵皮屋，罹難的是王姓屋主 19 歲與 17 歲的兩個兒子。噩耗傳到學校，弟弟就讀高中的校長難過地說，學校昨天才剛辦完校慶。苓雅區凌晨另有一棟 5 樓分租套房透天厝起火，警消疏散 13 人，11 人因嗆傷等身體不適送醫，均無生命危險。\\n為什麼重要\\n判斷在於新聞背後的居住型態：鐵皮連棟屋與分租套房燒得快、也容易困住人。同一座城市同一天兩場火，一場奪走兩名少年性命、一場 11 人送醫，指向同一個風險——便宜又擁擠的住所，逃生出口太少。\\n來源異同\\n公視與自由時報在核心事實上一致——鳥松火警、兩兄弟身亡、年齡、火勢延燒——沒有互相矛盾的細節。信任標籤：多源一致——兩家媒體對核心事實的報導一致。\\n仍不確定\\n兩則來源摘要都沒有說明起火原因、兩兄弟如何受困，也沒有分租套房的屋況細節。引用調查結果前請查閱完整報導。\"},\"sources\":[{\"name\":\"公視新聞網\",\"url\":\"https://news.pts.org.tw/article/834800\"},{\"name\":\"自由時報\",\"url\":\"https://news.ltn.com.tw/news/society/breakingnews/5633615\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":14,\"outletReputation\":21,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"taiwan\",\"live-ingest\",\"公視新聞網\",\"自由時報\"],\"glossary\":[{\"blurb\":{\"en\":\"Taiwan's public broadcaster, one of two outlets reporting the fire.\",\"zh-TW\":\"台灣公共電視，報導這場火警的兩家媒體之一。\"},\"term\":{\"en\":\"PTS\",\"zh-TW\":\"公視\"}},{\"blurb\":{\"en\":\"Taiwanese newspaper, one of two outlets reporting the fire.\",\"zh-TW\":\"台灣報紙，報導這場火警的兩家媒體之一。\"},\"term\":{\"en\":\"Liberty Times\",\"zh-TW\":\"自由時報\"}},{\"blurb\":{\"en\":\"District in Kaohsiung where the fatal tin-roof house fire broke out.\",\"zh-TW\":\"致命鐵皮屋火警發生的高雄市行政區。\"},\"term\":{\"en\":\"Niaosong District\",\"zh-TW\":\"鳥松區\"}},{\"blurb\":{\"en\":\"Southern Taiwanese city where both fires broke out on November 8.\",\"zh-TW\":\"11 月 8 日兩場火警發生的台灣南部城市。\"},\"term\":{\"en\":\"Kaohsiung\",\"zh-TW\":\"高雄\"}},{\"blurb\":{\"en\":\"District in Kaohsiung where the separate overnight rental-house fire broke out.\",\"zh-TW\":\"另一場凌晨分租套房火警發生的高雄市行政區。\"},\"term\":{\"en\":\"Lingya District\",\"zh-TW\":\"苓雅區\"}}]}}]\n"])</script><script>self.__next_f.push([
