 Megaspeed 銷售先進晶片設限。\\n發生了什麼事\\n《紐約時報》報導，貝森特上週與盧特尼克對質，質問政府為何未對向 Megaspeed 銷售先進晶片祭出限制。Megaspeed 是輝達風波的核心公司，晶片銷往該公司的管制問題，如今成了兩位部長之間的爭執點。\\n為什麼重要\\n財政部長公開槓上商務部長，顯示川普政府內部對先進晶片出口管制的立場並不一致。管制與否牽動輝達風波的後續發展，也牽動美國對先進晶片流向的整體政策。\\n來源異同\\n目前僅《紐約時報》一家報導此事，尚無其他媒體佐證。信任標籤：單一來源——僅《紐約時報》報導，尚未獲得其他媒體佐證。\\n仍不確定\\n來源摘要只呈現標題與簡短描述，並非全文。對質的具體場合、兩人各自的完整說法，以及政府是否將對 Megaspeed 祭出管制，目前都無從得知；引用細節前請查閱《紐約時報》的完整報導。\"},\"sources\":[{\"name\":\"NYT Economy\",\"url\":\"https://www.nytimes.com/2026/11/11/business/economy/nvidia-affair-spy-bessent-lutnick.html\"}],\"disagreements\":null,\"trustScore\":60,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":23,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"us\",\"live-ingest\",\"nyt-economy\"],\"glossary\":[{\"blurb\":{\"en\":\"US Treasury Secretary who confronted Lutnick over chip-sale curbs.\",\"zh-TW\":\"美國財政部長，就晶片銷制限令質問盧特尼克。\"},\"term\":{\"en\":\"Scott Bessent\",\"zh-TW\":\"史考特·貝森特\"}},{\"blurb\":{\"en\":\"US Commerce Secretary confronted by Bessent over the Megaspeed chip question.\",\"zh-TW\":\"美國商務部長，遭貝森特質問 Megaspeed 晶片管制問題。\"},\"term\":{\"en\":\"Howard Lutnick\",\"zh-TW\":\"霍華德·盧特尼克\"}},{\"blurb\":{\"en\":\"Firm at the heart of the Nvidia affair, at the center of the chip-sale dispute.\",\"zh-TW\":\"輝達風波的核心公司，晶片銷制限令爭執的焦點。\"},\"term\":{\"en\":\"Megaspeed\",\"zh-TW\":\"Megaspeed\"}},{\"blurb\":{\"en\":\"US chipmaker at the center of the affair involving Megaspeed.\",\"zh-TW\":\"美國晶片大廠，Megaspeed 風波相關的企業。\"},\"term\":{\"en\":\"Nvidia\",\"zh-TW\":\"輝達\"}},{\"blurb\":{\"en\":\"US newspaper and the sole outlet reporting the confrontation so far.\",\"zh-TW\":\"美國報紙，目前唯一報導兩位部長爭執的媒體。\"},\"term\":{\"en\":\"The New York Times\",\"zh-TW\":\"《紐約時報》\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{
