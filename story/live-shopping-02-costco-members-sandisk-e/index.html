ording to a Slickdeals Frontpage post, Costco Wholesale is offering the SanDisk Extreme Go Portable SSD to members through its website, with free shipping on all three capacities: 500GB for $129, 1TB for $179 and 2TB for $349. The headline rounds those prices to $130, $180 and $350. Slickdeals users gave the deal a Thumb Score of +49, a strong vote of approval from the community. The offer is limited to Costco members, and the material does not say when it ends.\nWhy it matters\nThe pricing rewards buying bigger: the 2TB model works out to roughly $175 per terabyte, against about $179 for the 1TB model and $258 for the 500GB model, so the largest drive is the best value per gigabyte. For a portable drive, that value proposition matters — these are the drives people use to carry photo libraries, video projects and backups between machines — and a +49 community score suggests experienced deal-hunters consider the prices genuinely competitive rather than a routine sale.\nSources agree / disagree\nThis card rests on a single source: the Slickdeals post relaying the Costco listing. No other outlet or retailer page in the material confirms the prices, so the account cannot be cross-checked here. Trust label: Single source — the prices come from one Slickdeals post and have no independent corroboration in the material provided.\nStill uncertain\nThe material gives no specifications for the drives — no read or write speeds, no durability or water-resistance ratings — and no sale end date or stock information. It is also unclear whether the same prices apply in Costco warehouses or only online, and whether any purchase limit applies."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-shopping-02-costco-members-sandisk-e\",\"category\":\"shopping\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-shopping-02-costco-members-sandisk-e.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Costco Members: SanDisk Extreme Go Portable SSD: 2TB $350, 1TB $180, 500GB $130 + Free S\u0026H\",\"zh-TW\":\"相關封面圖：（譯文待補）Costco Members: SanDisk Extreme Go Portable SSD: 2TB $350, 1TB $180, 500GB $130 + Free S\u0026H\"},\"publishedAt\":\"2026-11-24T05:46:43.000Z\",\"title\":{\"en\":\"Costco Members Can Get SanDisk Extreme Go SSDs From $129 With Free Shipping\",\"zh-TW\":\"好市多（Costco）會員：SanDisk Extreme Go 行動固態硬碟 129 美元起免運費\"},\"summary\":{\"en\":\"[Unverified, single source] Costco members can buy SanDisk Extreme Go portable solid-state drives with free shipping through Costco's website at $129 for 500GB, $179 for 1TB and $349 for 2TB, a member-only offer Slickdeals users rated +49, indicating strong community approval.\",\"zh-TW\":\"［未證實·單一來源］好市多（Costco）會員可在官網以129美元買500GB、179美元買1TB、349美元買2TB的SanDisk Extreme Go 行動固態硬碟，免運費；Slickdeals網友評分＋49，反應熱烈。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"好市多（Costco）會員可在官網購買SanDisk Extreme Go行動固態硬碟，500GB售價129美元、1TB售價179美元、2TB售價349美元，且免運費。\\n發生了什麼事\\nSlickdeals首頁貼文指出，好市多（Costco）正透過官網向會員販售SanDisk Extreme Go行動固態硬碟，三種容量均免運費：500GB售價129美元、1TB售價179美元、2TB售價349美元；標題則將價格概寫為130、180與350美元。網友評分（Thumb Score）達＋49，顯示社群高度認可。這項優惠僅限好市多會員，素材未說明優惠何時截止。\\n為什麼重要\\n價格愈大容量愈划算：2TB換算每TB約175美元，1TB約179美元，500GB則約258美元，因此容量最大的款式單位價格最低。行動固態硬碟是許多人用來攜帶照片、影片專案與備份資料的工具，＋49的網友評分也顯示，經驗豐富的撿便宜使用者認為這是真正有競爭力的價格，而非例行特價。\\n來源異同\\n本卡僅有Slickdeals一則貼文，轉述好市多官網售價；素材中沒有其他媒體或商家頁面佐證，也無法交叉核對。信任標籤：僅1源——本卡僅依據Slickdeals一則貼文，素材中無其他來源佐證。\\n仍不確定\\n素材未提供硬碟規格——沒有讀寫速度、耐用度或防水防塵等級——也沒有優惠截止日期或庫存資訊。相同價格是否適用於好市多實體賣場、或僅限線上，是否有購買數量限制，素材也未說明。\"},\"sources\":[{\"name\":\"Slickdeals Frontpage\",\"url\":\"https://slickdeals.net/f/20378133-costco-members-sandisk-extreme-go-portable-ssd-500gb-129-1tb-179-or-2tb-349-free-shipping?utm_source=rss\u0026utm_content=fp\u0026utm_medium=RSS2\"}],\"disagreements\":null,\"trustScore\":47,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":10,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"shopping\",\"live-ingest\",\"slickdeals-frontpage\"],\"glossary\":[{\"blurb\"
