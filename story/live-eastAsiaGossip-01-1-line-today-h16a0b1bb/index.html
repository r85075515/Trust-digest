ing announced a new direction, ending her cooperation with Yixuan Entertainment in Taiwan after recently parting with her South Korean agency. One headline stresses the short timing, saying she bid farewell to both the Taiwan and South Korea companies within one month. Her manager was reported to have explained the next-step plans, though the short feed snippets do not reproduce the full details of those plans.\n\nWhy it matters\nThe development matters because it changes Lee Ya-ying's base for work in Taiwan. One report frames the question directly, saying that with her departure from Yixuan Entertainment, whether she goes all in on Taiwan has become an unknown. Another says her leaving the Taiwan agency adds uncertainty to whether she stays in Taiwan. In other words, the story is not only about a contract ending, but about what her next move means for her activities in Taiwan.\n\nSources agree / disagree\nSeveral outlets carry closely related headlines and agree on the core facts: Lee Ya-ying ended her cooperation with Yixuan Entertainment, she had recently left her South Korean agency, and her manager addressed next steps. Headline wording differs slightly, with some emphasizing the surprise announcement and others emphasizing uncertainty about staying in Taiwan, but the snippets show no clear numeric or name conflicts.\nTrust label: Multi-source agreement — Multiple outlets report the same contract ending, the same agency name, and the same uncertainty about her next steps.\n\nStill uncertain\nThe feed snippets are brief and do not give the full content of the manager's stated plans, the reasons for ending either contract, or a confirmed schedule for what Lee Ya-ying will do next. Whether she remains based in Taiwan is explicitly described as uncertain in the reporting, and fuller details would need to be checked on the publisher pages."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-eastAsiaGossip-01-1-line-today-h16a0b1bb\",\"category\":\"eastAsiaGossip\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"publishedAt\":\"2026-11-01T07:01:05.000Z\",\"title\":{\"en\":\"Lee Ya-ying ends Taiwan agency deal after leaving Korean agency\",\"zh-TW\":\"李雅英（Lee Ya-ying）結束台灣經紀約，短短一個月告別台韓兩家公司\"},\"summary\":{\"en\":\"South Korean performer Lee Ya-ying has announced the end of her cooperation with Taiwan agency Yixuan Entertainment, shortly after also parting with her former agency in South Korea. Reports say she left both companies within about one month, her manager outlined next-step plans, and whether she stays fully committed to Taiwan is now uncertain.\",\"zh-TW\":\"韓籍藝人李雅英（Lee Ya-ying）宣布結束與台灣經紀公司一選娛樂（Yixuan Entertainment）的合作，此前她才剛告別南韓（South Korea）前東家。報導指出她在短短約一個月內先後離開台韓兩家公司，經紀人說明下一步規劃，而她是否持續深耕台灣已添變數。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"李雅英（Lee Ya-ying）突然宣布結束在台灣的經紀合約。多則標題指出，這位韓籍藝人結束與一選娛樂（Yixuan Entertainment）的合作，而她此前才剛告別南韓（South Korea）前東家，在短短約一個月內先後離開台韓兩家公司。\\n\\n發生了什麼事\\n多則標題報導同一進展：李雅英（Lee Ya-ying）宣布新動向，結束與一選娛樂（Yixuan Entertainment）的合作，且不久前才與南韓東家分道揚鑣。其中一則標題強調時間之短，指她在一個月內告別台韓兩家公司。報導也提到經紀人已說明下一步規劃，但簡短摘要未刊出規劃的完整內容。\\n\\n為什麼重要\\n這項進展關係到李雅英（Lee Ya-ying）在台灣的工作據點。一則報導直接點出問題，指她離開一選娛樂（Yixuan Entertainment）後，是否全力投入台灣已成未知數；另一則也說她離開台灣經紀公司，為留台添變數。換言之，這不只是合約結束，也牽動她後續在台灣活動的走向。\\n\\n來源異同\\n多家媒體的標題相近且核心事實一致：李雅英（Lee Ya-ying）結束與一選娛樂（Yixuan Entertainment）的合作、近期離開南韓經紀公司、經紀人說明下一步。標題措辭略有差異，有的強調突然宣布，有的強調留台不確定性，但摘要中未見明顯數字或名稱衝突。\\n\\n仍不確定\\n來源摘要簡短，未提供經紀人規劃的完整內容、結束兩份合約的原因，也未給出李雅英（Lee Ya-ying）下一步的確定時程。她是否續留台灣，報導本身即形容為未定，更多細節仍須查閱各媒體頁面。\"},\"sources\":[{\"name\":\"Google News TW Entertainment\",\"url\":\"https://news.google.com/rss/articles/CBMi9gJBVV95cUxQZGgzVlNJNk5od0pVa0JlSkd0MW84cE9QQWpGTHdQWFBhMHF4NG55NEl4OGsyNmZ5dzdPZHl2WEJhdFFzVjN6azE1YjNEM0dIcVpCc095aXFEMDJsbVI1N0F1WmJJQjRsUDAwMDM5UW9vMzdEN3R0YmlHdHhqeEhVVTJObjRwS0xVSlV6NEFRRFNxVGpGVVlvQnRGY3pPcEJGUWdVZ21kNFkxV1EwZ0psb0FZM19jOEdJcExOMXdTTVRrNXduMWxTWEtpTXlYaGE5U2JjeHg0QmZUQUpXeE9kLWt3R3Z0TGxER01PdGJPWWduUTdPVWVHSW1vcUN6M25XOTJpQVZlaEZKLTc0T1hoNz
