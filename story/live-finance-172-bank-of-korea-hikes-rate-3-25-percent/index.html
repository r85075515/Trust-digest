vember 26, 2026, in a 5-to-2 split vote, marking its third rate increase of the year. Alongside the rate hike, the central bank sharply raised South Korea's 2026 real GDP growth forecast from 3.3% to 3.9% and its 2027 forecast from 2.9% to 4.1%.\n\nSurging global artificial intelligence investment has driven booming South Korean semiconductor exports, pushing third-quarter GDP growth to 3.4% year-on-year while keeping consumer inflation above the central bank's 2% target. Governor Shin Hyun-song (신현송) emphasized that semiconductor prices weigh more heavily on policy decisions than recent stock market volatility, even as private consumption contracted and household debt burdens widened.\n\nCoverage across the Bank of Korea's official statement, Associated Press, and The Chosun Daily consistently reports the 25-basis-point hike to 3.25%, the 3.9% growth forecast for 2026, and the 2.7% consumer inflation outlook for 2026. The Chosun Daily adds details from the board's six-month rate dot plot clustering at 3.5%, while Associated Press highlights the two dissenting board members who favored holding rates at 3.00%.\n\nWhether the Monetary Policy Board will deliver another 25-basis-point increase to 3.50% at its next policy meeting or pause to evaluate household debt and private consumption weakness remains dependent on incoming inflation and exchange-rate data.\n\nTrust label: Multi-source agreement — Verified across the Bank of Korea's official Monetary Policy Decision release, Associated Press, and The Chosun Daily."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-172-bank-of-korea-hikes-rate-3-25-percent\",\"category\":\"finance\",\"title\":{\"en\":\"Bank of Korea Raises Base Rate to 3.25% and Lifts 2026 Growth Forecast to 3.9%\",\"zh-TW\":\"韓國央行升息1碼至3.25% 同步上修2026年經濟成長預測至3.9%\"},\"summary\":{\"en\":\"The Bank of Korea raised its benchmark interest rate by 25 basis points to 3.25% on November 26 in a 5-to-2 split vote, while sharply upgrading its 2026 GDP growth forecast from 3.3% to 3.9% on surging semiconductor exports. Takeaway: Red-hot AI chip demand is propelling South Korean export growth while forcing monetary policymakers to tighten further against above-target inflation.\",\"zh-TW\":\"韓國央行於11月26日以5票贊成、2票反對的表決結果，宣布調升基準利率1碼（25個基點）至3.25%，並受惠於半導體出口強勁，將2026年經濟成長率預測從3.3%大幅上調至3.9%。一句結論：人工智慧晶片需求帶動韓國出口高速擴張，迫使央行持續緊縮貨幣政策以壓抑高於目標的通膨壓力。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」韓國央行（Bank of Korea）金融貨幣委員會於 2026 年 11 月 26 日以 5 票贊成、2 票反對的決議，宣布將基準利率由 3.00% 調升 25 個基點至 3.25%，為今年第三次升息；央行並同步將 2026 年實質國內生產毛額（GDP）成長率預測由 3.3% 大幅上修至 3.9%，2027 年預測亦由 2.9% 上調至 4.1%。\\n\\n「為什麼重要」全球人工智慧投資熱潮帶動韓國半導體出口強勁擴張，推升第三季 GDP 年增率達 3.4%，但也使消費者物價通膨持續高於央行 2% 目標。韓國央行總裁申鉉松（Shin Hyun-song）在記者會上直言，決定利率走向時半導體價格比股市波動更為關鍵，但也坦言民間消費出現疫情以來首度萎縮，經濟復甦呈現冷熱不均。\\n\\n「來源異同」韓國央行官方貨幣政策聲明、美聯社（Associated Press）與《朝鮮日報》英文版均一致報導基準利率調升 1 碼至 3.25%、2026 年經濟成長率上修至 3.9% 及 2026 年通膨預測維持 2.7%；《朝鮮日報》進一步披露 7 名委員未來 6 個月利率點陣圖多數落於 3.5%，美聯社則詳述有 2 名委員主張維持利率在 3.00% 不變並呼籲搭配財政措施減輕家戶負擔。\\n\\n「仍不確定」金融貨幣委員會下次會議是否會如點陣圖預期進一步升息至 3.50%，抑或因民間消費轉弱與家庭債務壓力而暫停緊縮步伐，仍視後續通膨與韓元匯率走勢而定。\\n\\nTrust label: Multi-source agreement — 韓國央行官方聲明、美聯社及《朝鮮日報》英文版報導核心數據一致。\"},\"glossary\":[{\"term\":{\"en\":\"Bank of Korea Base Rate\",\"zh-TW\":\"韓國央行基準利率\"},\"blurb\":{\"en\":\"The policy interest rate set by the Bank of Korea's Monetary Policy Board to guide short-term market rates and inflation.\",\"zh-TW\":\"由韓國央行金融貨幣委員會決定的政策指標利率，用以引導市場短期利率與控制物價膨脹。\"}},{\"term\":{\"en\":\"Basis Point (bps)\",\"zh-TW\":\"基點（bps）\"},\"blurb\":{\"en\":\"A unit equal to one hundredth of one percentage point (0.01%), with 25 basis points equaling 0.25 percentage points.\",\"zh-TW\":\"金融利率常用計量單位，1 個基點等於 0.01 個百分點，25 個基點即為 0.25 個百分點（俗稱 1 碼）。\"}},{\"term\":{\"en\":\"Monetary Policy Board\",\"zh-TW\":\"金融貨幣委員會\"},\"blurb\":{\"en\":\"The seven-member decision-making body of the Bank of Korea responsible for setting interest rates and monetary policy.\",\"zh-TW\":\"韓國央行最高貨幣政策決策機構，由包括總裁在內的 7 名委員組成，負責審議基準利率與金融穩定政策。\"}}],\"sources\":[{\"name\":\"Bank of Korea\",\"url\":\"https://www.bok.or.kr/eng/bbs/E0000634/view.do?nttId=11067086\u0026menuNo=400423\"},{\"name\":\"Associated Press\",\"url\":\"https://apnews.com/article/south-korea-bank-interest-rate-exports-inflation-b9cef57c80c2ceb5e273b71b9a32c9d9\"},{\"name\":\"The Chosun Daily\",\"url\":\"https://www.chosun.com/english/market-money-en/2026/11/26/M5WITDEDKRBRBKEUMPEC5NWAHI/\"}],\"imageUrl\":\"\",\"imageAlt\":{\"en\":\"Bank of Korea Governor Shin Hyun-song chairs the Monetary Policy Board meeting raising the base rate to 3.25 percent\",\"zh-TW\":\"韓國央行總裁申鉉松主持金融貨幣委員會會議宣布升息至3.25%\"},\"isHeadline\":true,\"isPopular\":true,\"trustScore\":91,\"trustBreakdown\":{\"crossCorroboration\":23,\"outletReputation\":23,\"recencyClarity\":23,\"sourceDiversity\":22},\"publishedAt\":\"2026-11-27T18:24:11.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":23,\"D2\":23,\"D3\":23,\"D4\":23,\"D5\":22,\"total\":23},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-finance-172-bank-of-korea-hikes-rate-3-25-percent/\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:url\",\"content\":\"https://axiom.plaigroundlab.com/story
