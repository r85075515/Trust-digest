le size, or study name.\nWhy it matters\nThe judgment is about scale, not a prescription: a cheap daily habit tied to a large dementia-risk difference across four decades of data would matter enormously if it holds up. But this is an association, not proof that coffee prevents dementia, and without numbers the finding cannot be weighed against other health guidance.\nSources agree / disagree\nOnly ScienceDaily has covered this so far in the cluster, so there is nothing to cross-check against. Trust label: Single source — one outlet's account of the study, with no corroborating coverage in this cluster.\nStill uncertain\nThe summary gives no risk-reduction figure, no sample size, no study name, and no explanation of why decaf differs. Verify the numbers and the study itself in the full report before quoting them."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-biotech-01-drinking-2-3-cups-of-cof\",\"category\":\"biotech\",\"adult\":false,\"isHeadline\":false,\"isPopular\":false,\"imageUrl\":\"/covers/live/live-biotech-01-drinking-2-3-cups-of-cof.webp\",\"imageAlt\":{\"en\":\"Two to three cups of caffeinated coffee a day linked to lower dementia risk in a 43-year study.\",\"zh-TW\":\"長達 43 年的研究發現，每天 2–3 杯含咖啡因咖啡與失智風險降低有關。\"},\"publishedAt\":\"2026-11-07T10:16:19.000Z\",\"title\":{\"en\":\"2–3 Cups of Coffee a Day Linked to Dramatically Lower Dementia Risk\",\"zh-TW\":\"每天 2–3 杯咖啡與失智風險大幅降低有關\"},\"summary\":{\"en\":\"[Unconfirmed · single source] Drinking two to three cups of caffeinated coffee a day was linked to a dramatically lower dementia risk and better cognitive function in a study spanning up to 43 years, ScienceDaily reports. The benefit held regardless of genetic risk; decaf showed no such link.\",\"zh-TW\":\"［未證實·單一來源］一項長達 43 年的研究發現，每天喝 2–3 杯含咖啡因咖啡，與失智風險大幅降低、認知功能較好有關，科學日報（ScienceDaily）報導。無論基因風險高低都有好處；無咖啡因咖啡則無此關聯。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"一項長達 43 年的研究發現，每天喝 2–3 杯含咖啡因咖啡，與失智風險大幅降低、認知功能較好有關，科學日報（ScienceDaily）報導。無論基因風險高低都有好處；無咖啡因咖啡則無此關聯。\\n發生了什麼事\\n研究把每天 2–3 杯含咖啡因咖啡，與大幅降低的失智風險、較好的認知功能連在一起，數據橫跨 43 年。這種關聯不論基因風險高低都成立，無咖啡因咖啡則沒有同樣的關聯。來源摘要沒有給出風險降低的幅度、樣本數或研究名稱。\\n為什麼重要\\n重點在規模，不在處方：如果一個便宜的日常習慣，在 40 多年的數據裡與失智風險的大幅差異有關，一旦站得住腳，影響會非常大。但這只是關聯，不是咖啡預防失智的證明；沒有數字，就無法拿它跟其他健康建議放在一起衡量。\\n來源異同\\n本集群目前只有科學日報一家報導，無從交叉比對。信任標籤：單一來源——僅一家媒體報導這項研究，本集群內無其他佐證。\\n仍不確定\\n來源摘要沒有風險降低數字、樣本數、研究名稱，也沒有解釋無咖啡因咖啡為何不同。引用數字與研究本身前請查閱完整報導。\"},\"sources\":[{\"name\":\"ScienceDaily 健康醫學\",\"url\":\"https://www.sciencedaily.com/releases/2026/11/261105224550.htm\"}],\"disagreements\":null,\"trustScore\":54,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":17,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"biotech\",\"live-ingest\",\"sciencedaily-健康醫學\"],\"glossary\":[{\"term\":{\"en\":\"ScienceDaily\",\"zh-TW\":\"科學日報\"},\"blurb\":{\"en\":\"Science news site that reported the coffee study.\",\"zh-TW\":\"報導這項咖啡研究的科學新聞網站。\"}},{\"term\":{\"en\":\"Dementia\",\"zh-TW\":\"失智症\"},\"blurb\":{\"en\":\"Condition involving declining memory and thinking, the study's focus.\",\"zh-TW\":\"記憶與思考能力衰退的疾病，是這項研究的焦點。\"}},{\"term\":{\"en\":\"Caffeinated coffee\",\"zh-TW\":\"含咖啡因咖啡\"},\"blurb\":{\"en\":\"Coffee containing caffeine, linked to lower dementia risk in the study.\",\"zh-TW\":\"含有咖啡因的咖啡，研究中與較低失智風險有關。\"}},{\"term\":{\"en\":\"Decaffeinated coffee\",\"zh-TW\":\"無咖啡因咖啡\"},\"blurb\":{\"en\":\"Coffee with caffeine removed, which showed no such link.\",\"zh-TW\":\"去除咖啡因的咖啡，未顯示同樣的關聯。\"}},{\"term\":{\"en\":\"Genetic risk\",\"zh-TW\":\"基因風險\"},\"blurb\":{\"en\":\"Inherited likelihood of dementia, which did not change the benefit.\",\"zh-TW\":\"與生俱來的失智可能性，不影響研究中的好處。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\
