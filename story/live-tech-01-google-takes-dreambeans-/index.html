oogle）最新的人工智慧（AI）實驗，這次擴張讓實驗走出以英語為主的受眾，走向用印度語言說故事、分享故事的使用者。\\n\\n為什麼重要\\n語言覆蓋範圍決定了這款人工智慧（AI）說故事產品只是英語使用者的新奇玩意，還是印度多語大眾的工具：13種語言是廣度宣示，價值要看這些語言的故事讀起來像不像自己的故事，而不是翻譯腔。\\n\\n來源異同\\n本卡只有 TechCrunch 一篇報導，沒有第二家媒體佐證語言數量或印度擴張。\\n\\n仍不確定\\n摘要未列出13種語言名稱、印度上線日期，也沒有說明故事如何生成或分享。判斷實驗實際觸及範圍，需要這些細節。\"},\"sources\":[{\"name\":\"TechCrunch\",\"url\":\"https://techcrunch.com/2026/11/02/google-takes-dreambeans-to-india-in-bid-to-bring-ai-generated-personal-stories-to-the-masses/\"}],\"disagreements\":null,\"trustScore\":55,\"trustBreakdown\":{\"sourceDiversity\":6,\"outletReputation\":18,\"crossCorroboration\":6,\"recencyClarity\":25},\"tags\":[\"tech\",\"live-ingest\",\"techcrunch\"],\"glossary\":[{\"blurb\":{\"en\":\"The U.S. technology company behind the Dreambeans experiment.\",\"zh-TW\":\"美國科技公司，Dreambeans 實驗的開發方。\"},\"term\":{\"en\":\"Google\",\"zh-TW\":\"谷歌\"}},{\"blurb\":{\"en\":\"Google's latest AI experiment for AI-generated personal stories.\",\"zh-TW\":\"谷歌最新人工智慧實驗，產出人工智慧生成的個人故事。\"},\"term\":{\"en\":\"Dreambeans\",\"zh-TW\":\"Dreambeans\"}},{\"blurb\":{\"en\":\"A U.S. technology news outlet and the sole source for this card.\",\"zh-TW\":\"美國科技新聞媒體，本卡唯一來源。\"},\"term\":{\"en\":\"TechCrunch\",\"zh-TW\":\"TechCrunch\"}},{\"blurb\":{\"en\":\"An experimental Google product, the category Dreambeans belongs to.\",\"zh-TW\":\"谷歌的實驗性產品類別，Dreambeans 屬於此類。\"},\"term\":{\"en\":\"AI Experiment\",\"zh-TW\":\"人工智慧實驗\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigrou
