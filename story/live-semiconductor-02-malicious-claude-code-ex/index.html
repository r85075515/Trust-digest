d package was a VS Code extension, malicious version 2.1.313, available in the marketplace of Cursor, a maker of AI-assisted developer tools. It tried to steal user data and set up remote access. Cursor took the entire marketplace offline and reinstated it after confirming no further risk, according to The Decoder. Anthropic denied allegations that the malicious version was linked to any compromise of its own systems, while Ars Technica reported Anthropic had yet to warn customers of the incident.\nWhy it matters\nThe judgment is about trust in the toolchain: a backdoor in an official extension turns the tool developers rely on into the attack vector. Five thousand machines is not a niche incident; it is a supply-chain warning for every marketplace that distributes code assistants. Anthropic's denial limits the blast radius to the marketplace listing, but the absence of a customer warning in Ars Technica's account leaves affected developers to discover the risk from reporting, not from the vendor.\nSources agree / disagree\nArs Technica, The Register, and The Decoder agree on the core facts: a tampered Claude Code extension, up to 5,000 users affected, and attempts at remote access and data theft. The flagged 12-versus-11-hour difference is small: Ars Technica says nearly 12 hours, The Decoder says about 11 hours, a timing or rounding difference in how long the tampered extension was live. Trust label: Multi-source agreement — three outlets agree on the core compromise, with a small difference in the reported duration.\nStill uncertain\nThe snippets do not state how the extension was tampered with, how many machines were actually compromised versus threatened, what data was taken, or whether affected developers received remediation guidance. Cursor's confirmation of \"no further risk\" is reported without detail. Verify the full reporting and any vendor notices before treating the incident as contained."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-semiconductor-02-malicious-claude-code-ex\",\"category\":\"semiconductor\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-semiconductor-02-malicious-claude-code-ex.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Malicious Claude Code extension in Cursor's marketplace attempted remote access and data theft\",\"zh-TW\":\"相關封面圖：（譯文待補）Malicious Claude Code extension in Cursor's marketplace attempted remote access and data theft\"},\"publishedAt\":\"2026-10-30T21:09:54.000Z\",\"title\":{\"en\":\"Claude Code Extension Backdoored in Cursor Marketplace, Threatening 5,000 Developers\",\"zh-TW\":\"Claude Code 擴充套件在 Cursor 市集遭植入後門，近 5000 名開發者受威脅\"},\"summary\":{\"en\":\"An official Claude Code extension was backdoored in Cursor's marketplace and threatened as many as 5,000 developers' machines, attempting remote access and data theft, multiple outlets reported Friday. Cursor took its marketplace offline and restored it after confirming no further risk. Anthropic denied any compromise of its own systems.\",\"zh-TW\":\"Anthropic 旗下 Claude 模型的官方 Claude Code 擴充套件在 Cursor 市集遭植入後門，威脅多達 5000 名開發者，企圖遠端存取與竊取資料，多家媒體週五報導。Cursor 已將市集下線，確認無進一步風險後恢復上線。Anthropic 否認自身系統遭到入侵。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"Anthropic 旗下 Claude 模型的官方擴充套件遭植入後門，在 Cursor 市集威脅多達 5000 名開發者的電腦，多家媒體週五報導。\\n發生了什麼事\\n遭入侵的套件是 VS Code 擴充套件，惡意版本為 2.1.313，上架於人工智慧輔助開發工具製造商 Cursor 的市集。它企圖竊取使用者資料並建立遠端存取。The Decoder 報導，Cursor 已將整個市集下線，確認沒有進一步風險後才恢復上線。Anthropic 否認惡意版本與自身系統遭入侵有關，Ars Technica 則報導 Anthropic 尚未向客戶示警。\\n為什麼重要\\n判斷關乎開發工具鏈的信任：官方擴充套件中的後門，把開發者依賴的工具變成攻擊管道。5000 台電腦不是小眾事件，而是對每個分發程式碼助理的市集發出的供應鏈警訊。Anthropic 的否認把影響範圍限縮在市集上架項目，但 Ars Technica 報導中缺乏客戶示警，意味受影響的開發者是從報導、而不是從廠商得知風險。\\n來源異同\\nArs Technica、The Register、The Decoder 三家對核心事實的報導一致：Claude Code 擴充套件遭竄改、多達 5000 名使用者受影響、企圖遠端存取與竊取資料。被標示的 12 小時與 11 小時差異很小：Ars Technica 稱近 12 小時，The Decoder 稱約 11 小時，是竄改套件上線時間的時點或四捨五入差異。信任標籤：N源一致——三家媒體對核心入侵事件的報導一致，僅上線時間有小幅差異。\\n仍不確定\\n摘要沒有說明擴充套件如何遭竄改、實際受入侵與僅受威脅的電腦各有多少、哪些資料遭竊取，也沒有說明受影響開發者是否收到補救指引。Cursor「沒有進一步風險」的確認沒有細節。把事件視為已受控之前，請查閱完整報導與任何廠商通知。\"},\"sources\":[{\"name\":\"Ars Technica\",\"url\":\"https://arstechnica.com/security/2026/10/anthropic-vs-code-extension-on-cursor-backdoored-for-nearly-12-hours/\"},{\"name\":\"The Register\",\"url\":\"https://www.theregister.com/cyber-crime/2026/10/30/anthropic-that-claude-code-extension-compromise-couldnt-be-us/5306682\"},{\"name\":\"The Decoder\",\"url\":\"https://the-decoder.com/malicious-claude-code-extension-in-cursors-marketplace-attempted-remote-access-and-data-theft/\"}],\"disagreements\":{\"en\":\"Figures differ across outlets (e.g. 12 vs 11 in headlines/snippets).\",\"zh-TW\":\"（譯文待補）Figures differ across outlets (e.g. 12 vs 11 in headlines/snippets).\"},\"trustScore\":45,\"trustBreakdown\":{\"sourceDiversity\":20,\"outletReputation\":16,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"semiconductor\",\"live-ingest\",\"ars-technica\",\"the-register\",\"the-decoder\"],\"glossary\":[{\"blurb\":{\"en\":\"Company behind the Claude model whose official extension was backdoored.\",\"zh-TW\":\"官方擴充套件遭植入後門的 Claude 模型所屬公司。\"},\"term\":{\"en\":\"Anthropic\",\"zh-TW\":\"Anthropic\"}},{\"blurb\":{\"en\":\"Official extension for Anthropic's Claude model that was tampered with.\",\"zh-TW\":\"遭竄改的 Anthropic 旗下 Claude 模型官方擴充套件。\"},\"term\":{\"en\":\"Claude Code\",\"zh-TW\":\"Claude Code\"}},{\"blurb\":{\"en\":\"Maker of AI-assisted developer tools whose marketplace hosted the extension.\",\"zh-TW\":\"市集上架遭竄改擴充套件的人工智慧輔助開發工具製造商。\"},\"term\":{\"en\":\"Cursor\",\"zh-TW\":\"Cursor\"}},{\"blurb\":{\"en\":\"Technology news outlet that reported the backdoor and the absence of a customer warning.\",\"zh-TW\":\"報導後門事件與尚未向客戶示警的科技新聞媒體。\"},\"term\":{\"en\":\"Ars Technica\",\"zh-TW\":\"Ars Technica\"}},{\"blurb\":{\"en\":\"Technology news outlet that reported Anthropic's denial.\",\"zh-TW\":\"報導 Anthropic 否認說法的科技新聞媒體。\"},\"term\":{\"en\":\"The Register\",\"zh-TW\":\"The Register\"}},{\"blurb\":{\"en\":\"Technology news outlet that reported the data-theft and remote-access attempts.\",\"zh-TW\":\"報導竊取資料與遠端存取企圖的科技新聞媒體。\"},\"term\":{\"en\":\"The Decoder\",\"zh-TW\":\"The Decoder\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://r85075515.github.io/Trust-digest/\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"Axiom\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"zh_TW\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:locale:alternate\",\"content\":\"en_US\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"9\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"10\",{\"name\":\"twitter:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"11\",{\"name\":\"twitter:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"d:\"$8:metadata\"\n"])</script></body></html>
