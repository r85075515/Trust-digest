an indicative procurement target of 5 GW of renewable energy capacity. The tender covers utility-scale wind and solar generation projects across the NEM states—Queensland, Victoria, South Australia, and Tasmania—while excluding New South Wales, where developers are directed toward separate state tenders under the NSW Electricity Infrastructure Roadmap. CIS Tender 12 also introduces mandatory participation in the Developer Rating Scheme alongside First Nations engagement and benefit-sharing requirements.\n\nWhy it matters\nThe CIS is the Australian federal government's primary revenue-underwriting mechanism to accelerate clean power additions ahead of scheduled coal-fired power station retirements. Opening a 5 GW tranche provides long-term revenue certainty for utility-scale solar and wind developers while raising execution and community-benefit standards across eastern and southern Australian grids.\n\nSource differences\nAEMO Services' official tender portal is titled \"CIS Tender 12 – NEM Generation - AEMO Services\", detailing the 5 GW indicative target and tender guidelines. PV Tech covered the launch under \"Australia opens 5GW renewable energy tender under CIS\", emphasizing the exclusion of New South Wales and the debut of the Developer Rating Scheme and First Nations criteria. PV Magazine Australia published \"CIS Tender 12 seeks 5 GW of solar or wind generation across the NEM, excludes NSW\", highlighting eligible technologies and geographic scope.\n\nStill uncertain\nThe 5 GW figure is an indicative target rather than a guaranteed contracted volume; final awarded capacity, strike-price underwriting terms, and project commissioning schedules depend on bid competitiveness and AEMO Services' multi-stage assessment.\n\nTrust label: Official confirmation — Verified directly through AEMO Services' official tender page and corroborated by PV Tech and PV Magazine Australia."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-energy-432-australia-cis-tender-12-5gw\",\"category\":\"energy\",\"title\":{\"en\":\"Australia Opens 5 GW Capacity Investment Scheme Tender 12 for NEM Renewables\",\"zh-TW\":\"澳洲啟動容量投資計畫第 12 輪招標 徵求 5 GW 國家電力市場再生能源專案\"},\"summary\":{\"en\":\"Australia's AEMO Services opened bid submissions for Capacity Investment Scheme (CIS) Tender 12, targeting an indicative 5 GW of renewable electricity generation across the National Electricity Market excluding New South Wales, while introducing a new Developer Rating Scheme and First Nations participation rules.\",\"zh-TW\":\"澳洲能源市場營運機構服務公司（AEMO Services）正式開放「容量投資計畫」（CIS）第 12 輪投標，目標在排除新南威爾斯州的國家電力市場（NEM）徵求 5 GW 再生能源發電容量，並首度納入開發商評級機制與原住民族參與規範。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n澳洲能源市場營運機構服務公司（AEMO Services）於 2026 年 11 月 26 日至 27 日正式開放「容量投資計畫（CIS）第 12 輪——國家電力市場（NEM）發電招標」（CIS Tender 12）投標申請，設定 5 GW 再生能源發電容量的指示性採購目標。本輪招標涵蓋昆士蘭州、維多利亞州、南澳州與塔斯馬尼亞州的公用事業規模太陽能與風電專案，但排除新南威爾斯州（該州開發商將改為參與新州《電力基礎設施路線圖》下的獨立招標）。第 12 輪招標同時首度要求投標方納入「開發商評級機制」（Developer Rating Scheme）評估，並強化澳洲原住民族（First Nations）參與及利益共享條件。\\n\\n「為什麼重要」\\n容量投資計畫是澳洲聯邦政府因應燃煤電廠陸續除役、填補電力缺口的核心營收保底機制。此次釋出 5 GW 招標額度，不僅為大型風光開發商提供長期營收下限保障，也透過新的評級與原住民族參與門檻，提升電網轉型專案的履約品質與地方共融標準。\\n\\n「來源異同」\\n主管機關 AEMO Services 官方招標頁面標題為「CIS Tender 12 – NEM Generation - AEMO Services」，載明 5 GW 指示性目標與投標指引；能源媒體 PV Tech 以「Australia opens 5GW renewable energy tender under CIS」為題報導，重點解析排除新南威爾斯州的原因及新增評級與原住民族規範；PV Magazine Australia 則刊出「CIS Tender 12 seeks 5 GW of solar or wind generation across the NEM, excludes NSW」，聚焦適用發電技術與州別範圍。\\n\\n「仍不確定」\\n5 GW 屬於指示性採購目標而非最終保證簽約容量；實際得標專案清單、差價合約承保價格區間及各案併網時程，仍須視投標競爭狀況與多階段審查結果而定。\\n\\nTrust label: Official confirmation — 已透過 AEMO Services 官方招標公告頁面確認，並獲 PV Tech 與 PV Magazine Australia 報導交叉印證。\"},\"glossary\":[{\"term\":{\"en\":\"Capacity Investment Scheme (CIS)\",\"zh-TW\":\"澳洲容量投資計畫\"},\"blurb\":{\"en\":\"An Australian federal underwriting program that sets an agreed revenue floor and ceiling to de-risk renewable generation and storage investments.\",\"zh-TW\":\"澳洲聯邦政府推出的電力投資承保機制，透過設定營收下限與上限分攤機制，降低再生能源與儲能專案的融資風險。\"}},{\"term\":{\"en\":\"National Electricity Market (NEM)\",\"zh-TW\":\"澳洲國家電力市場\"},\"blurb\":{\"en\":\"The interconnected wholesale electricity grid spanning Queensland, New South Wales, Victoria, South Australia, Tasmania, and the ACT.\",\"zh-TW\":\"連接澳洲東部與南部六個州及領地的批發電力電網系統，涵蓋昆士蘭、新南威爾斯、維多利亞、南澳、塔斯馬尼亞與首都領地。\"}},{\"term\":{\"en\":\"AEMO Services\",\"zh-TW\":\"澳洲能源市場營運機構服務公司\"},\"blurb\":{\"en\":\"A subsidiary of the Australian Energy Market Operator responsible for running government renewable energy and storage tenders.\",\"zh-TW\":\"澳洲能源市場營運機構（AEMO）旗下專責執行政府再生能源與儲能招標採購的機構。\"}}],\"sources\":[{\"name\":\"AEMO Services\",\"url\":\"https://asl.org.au/tenders/cis-tender-12-nem-generation\"},{\"name\":\"PV Tech\",\"url\":\"https://www.pv-tech.org/australia-opens-5gw-renewable-energy-tender-under-capacity-investment-scheme/\"},{\"name\":\"PV Magazine Australia\",\"url\":\"https://www.pv-magazine-australia.com/2026/11/27/cis-tender-12-seeks-5-gw-of-solar-or-wind-generation-across-the-nem-excludes-nsw/\"}],\"imageUrl\":\"/covers/live/live-energy-432-australia-cis-tender-12-5gw.jpg\",\"imageAlt\":{\"en\":\"Australia Opens 5 GW Capacity Investment Scheme Tender 12 for NEM Renewables\",\"zh-TW\":\"澳洲啟動容量投資計畫第 12 輪招標 徵求 5 GW 國家電力市場再生能源專案\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":87,\"trustBreakdown\":{\"crossCorroboration\":23,\"outletReputation\":22,\"recencyClarity\":22,\"sourceDiversity\":20},\"publishedAt\":\"2026-11-28T10:22:56.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":23,\"D2\":22,\"D3\":22,\"D4\":22,\"D5\":21,\"total\":22},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\
