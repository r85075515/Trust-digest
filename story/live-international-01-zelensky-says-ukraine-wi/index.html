a moratorium he had observed at Washington's request.\nWhat happened\nZelensky expressed open frustration with the United States in the interview, saying he had paused the strikes to comply with an American demand. The NYT reports Moscow is \"not winning on the battlefield\" but seizing an opening to inflict suffering on Ukrainian cities this winter, while the FT notes a White House eager to lower fuel costs ahead of the U.S. midterms is weighing easing restrictions on Russian and Iranian \"shadow fleet\" tankers. Russia has accused Ukraine of already attacking an oil refinery since Zelensky's remarks.\nWhy it matters\nThe verdict is blunt: Kyiv is openly choosing battlefield leverage over Washington's preferences, and saying so on the record. If refinery strikes resume at scale, the immediate question is whether fuel prices — and the White House's midterm calculus — move against the administration that asked for the pause.\nSources agree / disagree\nBBC, NYT, FT, PBS NewsHour and NPR all report the same core claim — strikes to resume — with consistent quotes from the FT interview. Trust label: Multi-source agreement on the resumption; the \"defying Trump\" framing comes from NYT's headline characterization. No numeric conflicts in the snippets.\nStill uncertain\nNo timetable or target list has been disclosed, and the White House has not publicly responded to Zelensky's remarks. Verify operational details on the publisher pages; feed snippets omit context and updates."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-international-01-zelensky-says-ukraine-wi\",\"category\":\"international\",\"adult\":false,\"isHeadline\":true,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-international-01-zelensky-says-ukraine-wi.jpg\",\"imageAlt\":{\"en\":\"Cover related to: Zelensky Says Ukraine Will Resume Russian Refinery Strikes, Defying Trump\",\"zh-TW\":\"相關封面圖：澤倫斯基稱烏克蘭將恢復俄羅斯煉油廠罷工，無視川普\"},\"publishedAt\":\"2026-10-16T02:48:41.000Z\",\"title\":{\"en\":\"Zelensky Says Ukraine Will Resume Russian Refinery Strikes, Defying U.S. Pressure\",\"zh-TW\":\"澤倫斯基（Volodymyr Zelensky）：烏克蘭將恢復打擊俄羅斯煉油廠，不再理會美國要求\"},\"summary\":{\"en\":\"In a Financial Times interview, Volodymyr Zelensky said Ukraine will resume strikes on Russian refineries after fresh Russian attacks, ending a pause he had kept at Washington's request. Moscow accused Kyiv of already hitting an oil refinery.\",\"zh-TW\":\"澤倫斯基（Volodymyr Zelensky）接受《金融時報》（Financial Times）專訪時表示，在俄羅斯發動新一輪攻擊後，烏克蘭將恢復打擊俄羅斯煉油廠，結束應美國要求維持的暫停。莫斯科則指控基輔已襲擊一座煉油廠。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"澤倫斯基（Volodymyr Zelensky）告訴《金融時報》：烏克蘭不再暫停打擊俄羅斯能源設施。在俄羅斯對烏克蘭城市發動新一輪攻擊後，基輔將恢復打擊煉油廠，結束應美國要求維持的暫停。\\n發生了什麼事\\n澤倫斯基在專訪中公開表達對美國的不滿，稱暫停打擊是為了配合美方要求。《紐約時報》報導，莫斯科在戰場上並未獲勝，而是趁冬季來臨之際加大對烏克蘭城市的轟炸；《金融時報》則指出，急於在期中選舉前壓低油價的白宮，正考慮放寬對俄羅斯與伊朗「影子艦隊」油輪的限制。俄羅斯已指控烏克蘭在澤倫斯基發言後襲擊了一座煉油廠。\\n為什麼重要\\n結論很直接：基輔公開把戰場籌碼放在華府的意願之上，而且是白紙黑字講出來的。如果煉油廠打擊大規模恢復，下一個問題就是油價會不會走高——以及當初要求暫停的白宮，期中選舉算盤會不會被打亂。\\n來源異同\\nBBC、《紐約時報》、《金融時報》、PBS NewsHour、NPR 五家報導的核心主張一致——打擊將恢復，引言皆出自同一場《金融時報》專訪。信任標籤：N源一致；「無視川普」的定性出自《紐約時報》標題。摘要中無數字衝突。\\n仍不確定\\n恢復打擊的具體時間表與目標清單尚未公布，白宮也未公開回應澤倫斯基的發言。作戰細節請查閱各媒體完整報導；來源摘要可能省略背景與後續更新。\"},\"sources\":[{\"name\":\"BBC World\",\"url\":\"https://www.bbc.co.uk/news/articles/cqwyrnwd9dw1o?at_medium=RSS\u0026at_campaign=rss\"},{\"name\":\"NYT World\",\"url\":\"https://www.nytimes.com/2026/10/15/world/europe/russia-ukraine-winter-energy.html\"},{\"name\":\"Financial Times Markets\",\"url\":\"https://www.ft.com/content/6dfa9879-589a-4af3-9374-b546a945a219?syn-25a6b1a6=1\"},{\"name\":\"PBS NewsHour\",\"url\":\"https://www.pbs.org/newshour/show/ukraine-resumes-strikes-on-energy-targets-saying-russia-never-stopped-its-attacks\"},{\"name\":\"NPR News\",\"url\":\"https://www.npr.org/2026/10/15/g-s1-148194/russia-ukraine-war\"}],\"disagreements\":null,\"trustScore\":96,\"trustBreakdown\":{\"sourceDiversity\":25,\"outletReputation\":21,\"crossCorroboration\":25,\"recencyClarity\":25},\"tags\":[\"international\",\"live-ingest\",\"bbc-world\",\"nyt-world\",\"nyt-world\"],\"glossary\":[{\"term\":{\"en\":\"Volodymyr Zelensky\",\"zh-TW\":\"澤倫斯基\"},\"blurb\":{\"en\":\"President of Ukraine, interviewed by the Financial Times about resuming refinery strikes.\",\"zh-TW\":\"烏克蘭總統，接受《金融時報》專訪談恢復打擊煉油廠。\"}},{\"term\":{\"en\":\"Financial Times\",\"zh-TW\":\"金融時報\"},\"blurb\":{\"en\":\"British business newspaper that conducted the Zelensky interview.\",\"zh-TW\":\"專訪澤倫斯基的英國財經報紙。\"}},{\"term\":{\"en\":\"BBC World\",\"zh-TW\":\"BBC 國際\"},\"blurb\":{\"en\":\"British public broadcaster covering Russia's accusation of a refinery attack.\",\"zh-TW\":\"報導俄羅斯指控煉油廠遇襲的英國公共廣播公司。\"}},{\"term\":{\"en\":\"NYT World\",\"zh-TW\":\"紐約時報國際\"},\"blurb\":{\"en\":\"US newspaper reporting on Russia's winter bombing campaign and the strike resumption.\",\"zh-TW\":\"報導俄羅斯冬季轟炸與打擊恢復的美國報紙。\"}},{\"term\":{\"en\":\"PBS NewsHour\",\"zh-TW\":\"PBS 新聞一小時\"},\"blurb\":{\"en\":\"US public television news program covering Ukraine's resumed energy strikes.\",\"zh-TW\":\"報導烏克蘭恢復能源打擊的美國公共電視新聞節目。\"}}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://r85075515.github.io/Trust-digest/\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"Axiom\"}]
