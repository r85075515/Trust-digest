oin (BTC) directly inside its VTB My Investments mobile application. The rollout followed one day after the Bank of Russia approved the mandatory knowledge test required for prospective cryptocurrency buyers.\n\n「Why it matters」\n VTB is among the first major registered Russian financial operators—having received central bank operator status in early October—to bring direct spot Bitcoin access into a mainstream retail brokerage app, setting the pace ahead of December 1 crypto trading launches planned by Sberbank, SPB Exchange, and the Moscow Exchange.\n\n「Source differences」\n Bitcoin Magazine published \"Russia's VTB Opens Bitcoin Trading After Crypto Test Rules\", highlighting the timing one day after the Bank of Russia set its crypto knowledge test and noting SPB Exchange's December 1 start date. TokenPost published \"Russia's VTB Opens Bitcoin Trading for Qualified Investors\", specifying that trading operates through the VTB My Investments app. Startup Fortune published \"VTB opens bitcoin trading to qualified investors as Sberbank eyes December 1\", emphasizing VTB's position as Russia's second-largest bank and outlining rival timelines for Sberbank, SPB Exchange, and Moscow Exchange.\n\n「Still uncertain」\n Trading volumes, fee structures, and whether VTB will expand its in-app offering to Ether or stablecoins such as USDT alongside December 1 exchange launches have not yet been detailed.\n\nTrust label: Multi-source agreement — Independent reports from Bitcoin Magazine, TokenPost, and Startup Fortune align on VTB's November 27 launch inside VTB My Investments for qualified investors following the Bank of Russia's knowledge test approval."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-finance-280-vtb-opens-bitcoin-trading-app\",\"category\":\"finance\",\"title\":{\"en\":\"Russia's VTB Opens Bitcoin Trading for Qualified Investors in Brokerage App\",\"zh-TW\":\"俄羅斯第二大銀行VTB開放合格投資人於券商App交易比特幣\"},\"summary\":{\"en\":\"Russia's second-largest lender VTB launched direct Bitcoin buying and selling for qualified investors through its VTB My Investments app on November 27, 2026, one day after the Bank of Russia finalized mandatory crypto knowledge test rules ahead of broader December 1 exchange rollouts.\",\"zh-TW\":\"俄羅斯第二大銀行外貿銀行（VTB）於2026年11月27日正式在旗下券商應用程式「VTB My Investments」開放合格投資人買賣比特幣，就在俄羅斯央行前一日核准加密貨幣投資知識測驗標準後迅速上線，搶先同業於12月1日啟動交易前搶占合規市場。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"「發生了什麼事」\\n俄羅斯國有第二大銀行外貿銀行（VTB）於2026年11月27日週五正式啟用新服務，允許具備「合格投資人」資格的券商客戶直接透過旗下行動應用程式「VTB My Investments」買賣比特幣（BTC）。此舉就在俄羅斯央行（Bank of Russia）前一日正式核准加密貨幣買家必須通過的投資知識測驗標準後迅速上線。\\n\\n「為什麼重要」\\nVTB於今年10月初取得俄羅斯央行核發的加密貨幣市場營運商資格，此次率先將現貨比特幣買賣整合進主流券商App，搶在俄羅斯聯邦儲蓄銀行（Sberbank）、聖彼得堡交易所（SPB Exchange）與莫斯科交易所（Moscow Exchange）預定12月1日啟動交易前搶得先機。\\n\\n「來源異同」\\n加密貨幣媒體 Bitcoin Magazine 報導標題為「Russia's VTB Opens Bitcoin Trading After Crypto Test Rules」，點出上線時間緊接在俄羅斯央行制定加密知識測驗隔天，並提及聖彼得堡交易所將於12月1日跟進；TokenPost 標題為「Russia's VTB Opens Bitcoin Trading for Qualified Investors」，明確指出交易管道為「VTB My Investments」應用程式；財經網站 Startup Fortune 標題為「VTB opens bitcoin trading to qualified investors as Sberbank eyes December 1」，除點出VTB身為俄國第二大銀行的地位外，亦對照Sberbank、SPB交易所與莫斯科交易所的12月1日時程。\\n\\n「仍不確定」\\nVTB此次服務上線初期的實際交易量、手續費率，以及是否將於12月1日同步擴增以太幣（ETH）或泰達幣（USDT）等幣種尚未公布。\\n\\nTrust label: Multi-source agreement — Bitcoin Magazine、TokenPost 與 Startup Fortune 均獨立報導VTB於11月27日在「VTB My Investments」App向合格投資人開放比特幣交易，與俄羅斯央行前一日核准知識測驗的時間軸完全吻合。\"},\"glossary\":[{\"term\":{\"en\":\"VTB Bank\",\"zh-TW\":\"俄羅斯外貿銀行（VTB）\"},\"blurb\":{\"en\":\"Russia's second-largest state-controlled commercial and investment banking group, registered with the Bank of Russia as a licensed cryptocurrency operator.\",\"zh-TW\":\"俄羅斯資產規模第二大的國有商業與投資銀行集團，已向俄羅斯央行登記取得合法加密貨幣市場營運商資格。\"}},{\"term\":{\"en\":\"Qualified Investor\",\"zh-TW\":\"合格投資人\"},\"blurb\":{\"en\":\"A regulated investor classification under Russian financial law reserved for clients meeting specific wealth, asset, or professional trading experience thresholds.\",\"zh-TW\":\"俄羅斯金融法規界定的專業或高資產投資人身分，須符合特定資產淨值、交易經驗或專業資格門檻。\"}},{\"term\":{\"en\":\"Bank of Russia\",\"zh-TW\":\"俄羅斯中央銀行\"},\"blurb\":{\"en\":\"The central bank and primary financial market regulator of the Russian Federation responsible for licensing crypto operators and setting investor testing rules.\",\"zh-TW\":\"俄羅斯聯邦中央銀行暨最高金融監管機構，負責核發加密貨幣營運執照與制定投資人知識測驗規範。\"}}],\"sources\":[{\"name\":\"Bitcoin Magazine\",\"url\":\"https://bitcoinmagazine.com/news/russia-vtb-bitcoin-trading-crypto-test\"},{\"name\":\"TokenPost\",\"url\":\"https://www.tokenpost.com/news/regulation/63807\"},{\"name\":\"Startup Fortune\",\"url\":\"https://startupfortune.com/vtb-opens-bitcoin-trading-to-qualified-investors-as-sberbank-eyes-december-1/\"}],\"imageUrl\":\"/covers/live/live-finance-280-vtb-opens-bitcoin-trading-app.jpg\",\"imageAlt\":{\"en\":\"Russia's VTB Opens Bitcoin Trading for Qualified Investors in Brokerage App\",\"zh-TW\":\"俄羅斯第二大銀行VTB開放合格投資人於券商App交易比特幣\"},\"isHeadline\":false,\"isPopular\":false,\"trustScore\":85,\"trustBreakdown\":{\"crossCorroboration\":23,\"outletReputation\":21,\"recencyClarity\":23,\"sourceDiversity\":18},\"publishedAt\":\"2026-11-27T23:55:21.000Z\",\"disagreements\":null,\"selfCheck\":{\"D1\":23,\"D2\":22,\"D3\":23,\"D4\":22,\"D5\":22,\"total\":22},\"notes\":\"重複不確定\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n6:null\n"])</script><script>self.__next_f.push([1,"8:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Axiom — Multi-source verified news\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (zh-TW / EN) news digest with sources, disagreements, and explainable trust scores.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://axiom.plaigroundlab.com/story/live-finance-280-vtb-opens-bitcoin-trading-app/\"}],[\"$\",\"meta\",\"3\",{\"property\"
