DAY report that Chen Zeyao and Li Mu's portrayal of a doomed couple in 'Black Tide' has drawn praise for its emotional force. Hsu Wei-ning booked a screening of the film and, moved to tears, praised the pair and said she is proud to be an actor. A separate report notes Chen is in contention for the Golden Horse Best Actor award for his role as an ex-convict. The feed items are headline-only: no review quotes, box-office figures, or screening dates are given.\nWhy it matters\nA peer booking a screening is one of the strongest endorsements in Taiwanese cinema — it puts a star's own reputation behind a film. For Chen, the Golden Horse buzz turns praise into awards-season stakes, and a Best Actor nomination would cap the film's reception.\nSources agree / disagree\nThree outlets — Mirror Media, Yahoo Taiwan, and LINE TODAY — carry the same story with no conflicting details. No numeric or name conflicts appear. Trust label: Multi-source agreement — three outlets report the same praise and screening, with no contradictions.\nStill uncertain\nThe feed items are headlines without a summary, so what critics actually praised, when the screening took place, and whether Chen is nominated or merely tipped for Best Actor are still unclear. Read the full Mirror Media report before quoting details."])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"story\":{\"id\":\"live-eastAsiaGossip-01-cp-line-today\",\"category\":\"eastAsiaGossip\",\"adult\":false,\"isHeadline\":false,\"isPopular\":true,\"imageUrl\":\"/covers/live/live-eastAsiaGossip-01-cp-line-today.jpg\",\"imageAlt\":{\"en\":\"Cover related to: 陳澤耀、李沐末路CP虐心演出獲好評 許瑋甯包場力挺：以身為演員為榮 | 鏡週刊 - LINE TODAY\",\"zh-TW\":\"相關封面圖：陳澤耀、李沐末路CP虐心演出獲好評 許瑋甯包場力挺：以身為演員為榮 | 鏡週刊 - LINE TODAY\"},\"publishedAt\":\"2026-11-17T18:14:00.000Z\",\"title\":{\"en\":\"Chen Zeyao and Li Mu's Doomed-Couple Turn in 'Black Tide' Wins Praise; Hsu Wei-ning Books a Screening\",\"zh-TW\":\"陳澤耀、李沐《黑潮》末路情侶獲好評，許瑋甯包場力挺\"},\"summary\":{\"en\":\"Chen Zeyao and Li Mu's heartbreaking turn as a doomed couple in 'Black Tide' is winning praise, and actress Hsu Wei-ning booked a screening to support the film, tearfully saying she is proud to be an actor. Chen is also in the running for Golden Horse Best Actor for his role as an ex-convict.\",\"zh-TW\":\"陳澤耀、李沐在《黑潮》中虐心詮釋末路情侶，演出獲好評；許瑋甯包場力挺，含淚說以身為演員為榮。陳澤耀也憑更生人角色角逐金馬影帝。\"},\"body\":{\"en\":\"$10\",\"zh-TW\":\"陳澤耀、李沐在《黑潮》中虐心詮釋末路情侶，演出獲好評——許瑋甯更直接包場力挺。\\n發生了什麼事\\n鏡週刊、Yahoo 台灣、LINE TODAY 報導，陳澤耀、李沐在《黑潮》中刻畫末路情侶的演出以虐心獲好評。許瑋甯包場看片，含淚力推兩人演技，說以身為演員為榮。另有報導指出，陳澤耀憑更生人角色角逐金馬影帝。來源快訊只有標題，沒有影評引言、票房數字或包場日期。\\n為什麼重要\\n同行包場是台灣影壇最有力的背書之一——等於拿自己的名聲替電影站台。對陳澤耀來說，金馬影帝的呼聲把好評變成獎季籌碼，入圍就會為本片的口碑封頂。\\n來源異同\\n鏡週刊、Yahoo 台灣、LINE TODAY 三家報導同一件事，沒有互相矛盾的細節。沒有數字或名稱衝突。信任標籤：多源一致——三家媒體報導相同的好評與包場，沒有矛盾。\\n仍不確定\\n來源快訊只有標題沒有摘要，影評具體誇了什麼、包場是哪一天、陳澤耀是已入圍還是被看好角逐影帝，都還不清楚。引用細節前請先讀鏡週刊全文。\"},\"sources\":[{\"name\":\"Yahoo TW 娛樂\",\"url\":\"https://tw.news.yahoo.com/%E8%A8%B1%E7%91%8B%E7%94%AF%E5%8C%85%E5%A0%B4%E7%9C%8B-%E9%BB%91%E6%BD%AE-%E6%B7%9A%E6%8E%A8-%E4%BB%A5%E8%BA%AB%E7%82%BA%E6%BC%94%E5%93%A1%E7%82%BA%E6%A6%AE-%E9%99%B3%E6%BE%A4%E8%80%80-021400784.html\"},{\"name\":\"Google News TW 娛樂\",\"url\":\"https://news.google.com/rss/articles/CBMiZkFVX3lxTE93RmRyaXNUV3JTaTV5T19EdFZpUXBvSExDTC01MmN4QWZ5ZnFiWWc0S3dfVVctLWhUZmxMcHpaVHNWSTA3UXZTRGVZdW56aEhlQnhjRklwQl9FRGdFZUI1Q29oU0dwUdIBa0FVX3lxTE5OUUZwQzRWdlpoZ21QVXc3VXQyek10MHh5bkl5SVgyTXd2Rml1bW01RExOVjhXMkswQ0NiMXJVWE1lMG9Mc0pJNUNTdncyMG5xR1hsQ1ZsMTlGZ1dJZFc0ajlWREVDT0VINE53?oc=5\"},{\"name\":\"today.line.me\",\"url\":\"https://news.google.com/rss/articles/CBMiVkFVX3lxTE14SzZEYnJuZ3F5STNhenEyLTZMLWZIQ2VzQ3RHNUFVdHRTZWdjOFhQbnpLV3dtVjM1VUQzd2NWcE9VMWdFRTBtYWtnOVJhRUd3N0RVNDh3?oc=5\"}],\"disagreements\":null,\"trustScore\":76,\"trustBreakdown\":{\"sourceDiversity\":21,\"outletReputation\":16,\"crossCorroboration\":14,\"recencyClarity\":25},\"tags\":[\"eastAsiaGossip\",\"live-ingest\",\"region:tw\",\"yahoo-tw-娛樂\",\"google-news-tw-娛樂\",\"gnews-line-today-tw-娛樂\"],\"region\":\"tw\",\"gl
